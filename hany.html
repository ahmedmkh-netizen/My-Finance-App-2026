<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مسحوبات محل هاني</title>
<meta name="theme-color" content="#F59E0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مسحوبات هاني">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #FFF7ED 0%, #FEF3C7 100%);
    min-height: 100dvh;
    color: #78350F;
    padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 4px 20px rgba(120, 53, 15, 0.08);
    margin-bottom: 12px;
  }
  .header {
    background: linear-gradient(135deg, #F59E0B, #D97706);
    color: white;
    padding: 20px;
    border-radius: 20px;
    margin-bottom: 12px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
  }
  .header h1 { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
  .header p { font-size: 12px; opacity: 0.9; font-weight: 600; }
  .section-title {
    font-size: 13px;
    font-weight: 900;
    color: #92400E;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .items-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .item-btn {
    background: #FFF7ED;
    border: 2px solid #FED7AA;
    border-radius: 14px;
    padding: 14px 6px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 900;
    color: #78350F;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 60px;
  }
  .item-btn:active { transform: scale(0.95); }
  .item-btn.selected {
    background: linear-gradient(135deg, #F59E0B, #D97706);
    color: white;
    border-color: #D97706;
    box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
    transform: scale(1.02);
  }
  .amount-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .amount-input {
    flex: 1;
    font-size: 32px;
    font-weight: 900;
    text-align: center;
    padding: 16px;
    border: 3px solid #FDE68A;
    border-radius: 16px;
    font-family: 'Cairo', sans-serif;
    color: #B45309;
    background: #FFFBEB;
    outline: none;
    transition: border-color 0.2s;
  }
  .amount-input:focus { border-color: #F59E0B; }
  .amount-input::placeholder { color: #FCD34D; }
  .currency {
    display: flex;
    align-items: center;
    padding: 0 16px;
    background: #FEF3C7;
    border-radius: 16px;
    font-weight: 900;
    color: #92400E;
    font-size: 14px;
  }
  .note-input {
    width: 100%;
    padding: 14px;
    border: 2px solid #FDE68A;
    border-radius: 14px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    background: #FFFBEB;
    outline: none;
    margin-top: 10px;
  }
  .note-input:focus { border-color: #F59E0B; }
  .save-btn {
    width: 100%;
    padding: 20px;
    background: linear-gradient(135deg, #10B981, #059669);
    color: white;
    border: none;
    border-radius: 18px;
    font-family: 'Cairo', sans-serif;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    margin-top: 12px;
    box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
    transition: all 0.15s;
  }
  .save-btn:active { transform: scale(0.97); }
  .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .today-log {
    max-height: 280px;
    overflow-y: auto;
  }
  .log-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #FEF3C7;
    font-size: 14px;
  }
  .log-item:last-child { border-bottom: none; }
  .log-item .desc { font-weight: 700; color: #78350F; flex: 1; }
  .log-item .amount { font-weight: 900; color: #DC2626; margin: 0 8px; }
  .log-item .del-btn {
    background: #FEF2F2;
    border: none;
    color: #DC2626;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    font-family: inherit;
  }
  .log-item .del-btn:active { background: #FEE2E2; transform: scale(0.9); }
  .today-total {
    background: #FFF7ED;
    padding: 12px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    font-weight: 900;
    color: #92400E;
    margin-top: 10px;
    border: 2px dashed #FDE68A;
  }
  .empty-state {
    text-align: center;
    padding: 24px;
    color: #A16207;
    font-weight: 700;
    font-size: 13px;
  }
  /* PIN Screen */
  .pin-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #78350F, #451A03);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 24px;
  }
  .pin-logo {
    width: 88px;
    height: 88px;
    background: rgba(245, 158, 11, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    margin-bottom: 20px;
    border: 2px solid rgba(245, 158, 11, 0.3);
  }
  .pin-screen h2 { color: white; font-size: 22px; font-weight: 900; margin-bottom: 6px; }
  .pin-screen p { color: #FCD34D; font-size: 13px; margin-bottom: 28px; }
  .pin-dots { display: flex; gap: 14px; margin-bottom: 32px; }
  .pin-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
    transition: all 0.2s;
  }
  .pin-dot.filled { background: #F59E0B; border-color: #F59E0B; transform: scale(1.15); }
  .pin-pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    max-width: 300px;
    width: 100%;
  }
  .pin-btn {
    aspect-ratio: 1;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    color: white;
    font-size: 26px;
    font-weight: 900;
    font-family: 'Cairo', sans-serif;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.1s;
  }
  .pin-btn:active { background: rgba(255,255,255,0.25); transform: scale(0.92); }
  .pin-error { color: #FCA5A5; font-size: 12px; margin-top: 16px; font-weight: 700; }
  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #10B981;
    color: white;
    padding: 12px 24px;
    border-radius: 14px;
    font-weight: 900;
    font-size: 14px;
    z-index: 10000;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    animation: slideDown 0.3s ease-out;
    max-width: 90vw;
  }
  .toast.error { background: #DC2626; }
  @keyframes slideDown {
    from { opacity: 0; transform: translate(-50%, -20px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .shake { animation: shake 0.4s ease-in-out; }
</style>
</head>
<body>

<!-- شاشة القفل -->
<div class="pin-screen" id="pinScreen">
  <div class="pin-logo">🔒</div>
  <h2>مسحوبات محل هاني</h2>
  <p>أدخل الرمز للدخول</p>
  <div class="pin-dots">
    <div class="pin-dot" data-i="0"></div>
    <div class="pin-dot" data-i="1"></div>
    <div class="pin-dot" data-i="2"></div>
    <div class="pin-dot" data-i="3"></div>
  </div>
  <div class="pin-pad" id="pinPad">
    <button class="pin-btn" data-d="1">1</button>
    <button class="pin-btn" data-d="2">2</button>
    <button class="pin-btn" data-d="3">3</button>
    <button class="pin-btn" data-d="4">4</button>
    <button class="pin-btn" data-d="5">5</button>
    <button class="pin-btn" data-d="6">6</button>
    <button class="pin-btn" data-d="7">7</button>
    <button class="pin-btn" data-d="8">8</button>
    <button class="pin-btn" data-d="9">9</button>
    <div></div>
    <button class="pin-btn" data-d="0">0</button>
    <button class="pin-btn" data-d="del">⌫</button>
  </div>
  <div class="pin-error" id="pinError"></div>
</div>

<!-- الشاشة الرئيسية -->
<div id="mainScreen" style="display:none">
  <div class="header">
    <h1>🛒 مسحوبات محل هاني</h1>
    <p id="todayDate">—</p>
  </div>

  <div class="card">
    <div class="section-title">📌 اختر البند</div>
    <div class="items-grid" id="itemsGrid"></div>
  </div>

  <div class="card">
    <div class="section-title">💵 المبلغ</div>
    <div class="amount-row">
      <input type="text" inputmode="decimal" class="amount-input" id="amountInput" placeholder="0">
      <div class="currency">ج.م</div>
    </div>
    <input type="text" class="note-input" id="noteInput" placeholder="📝 ملاحظة (اختياري)">
    <button class="save-btn" id="saveBtn">💾 حفظ العملية</button>
  </div>

  <div class="card">
    <div class="section-title">📋 سجل اليوم</div>
    <div class="today-log" id="todayLog">
      <div class="empty-state">لا توجد مسحوبات اليوم</div>
    </div>
    <div class="today-total" id="todayTotal" style="display:none">
      <span>المجموع</span>
      <span id="totalAmount">0 ج.م</span>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   🔧 الإعدادات — عدّل هذه القيم فقط
   ═══════════════════════════════════════════════════════ */
const HANY_PIN = '1234';                 // ← رمز دخول ابنك (غيّره)
const FIREBASE_PROJECT = 'finance-app-2026-3e318';

const ITEMS = ['سجاير','بيبسي','شيبسي','عصير','لبن','أنس','عبده','زبادي','رايب','بسكويت','مولتو','اندومي','فرق سجائر'];

const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

/* ═══════════════════════════════════════════════════════ */

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCEq-Trf1oFsvPF5tlMvqU83ea_J2DLZjs",
  authDomain: "finance-app-2026-3e318.firebaseapp.com",
  projectId: FIREBASE_PROJECT,
  storageBucket: "finance-app-2026-3e318.firebasestorage.app",
  messagingSenderId: "855414629770",
  appId: "1:855414629770:web:8bb07198b8245b63781473"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection('finance_2026').doc('user_ahmed_data');

// State
let selectedItem = '';
let currentPin = '';
let unsubscribe = null;

// Helpers
const getLocalISODate = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const fmt = (n) => Number(n || 0).toLocaleString('en-US');

function showToast(msg, isError = false) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

/* ═══════════════ PIN ═══════════════ */
const pinScreen = document.getElementById('pinScreen');
const pinError = document.getElementById('pinError');

document.getElementById('pinPad').addEventListener('click', (e) => {
  const btn = e.target.closest('.pin-btn');
  if (!btn) return;
  const d = btn.dataset.d;
  if (d === 'del') {
    currentPin = currentPin.slice(0, -1);
  } else if (currentPin.length < 4) {
    currentPin += d;
  }
  renderPinDots();
  if (currentPin.length === 4) setTimeout(checkPin, 180);
});

function renderPinDots() {
  document.querySelectorAll('.pin-dot').forEach((dot, i) => {
    dot.classList.toggle('filled', i < currentPin.length);
  });
}

function checkPin() {
  if (currentPin === HANY_PIN) {
    sessionStorage.setItem('hany_pin_ok', '1');
    pinScreen.style.display = 'none';
    init();
  } else {
    pinScreen.classList.add('shake');
    pinError.textContent = 'رمز خاطئ، حاول مرة أخرى';
    setTimeout(() => {
      currentPin = '';
      renderPinDots();
      pinScreen.classList.remove('shake');
      pinError.textContent = '';
    }, 700);
  }
}

// تخطي PIN لو مسجّل في نفس الجلسة
if (sessionStorage.getItem('hany_pin_ok') === '1') {
  pinScreen.style.display = 'none';
  init();
}

/* ═══════════════ التطبيق ═══════════════ */
function init() {
  document.getElementById('mainScreen').style.display = 'block';
  document.getElementById('todayDate').textContent =
    new Date().toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  renderItems();
  bindEvents();
  subscribeToData();
}

function renderItems() {
  const grid = document.getElementById('itemsGrid');
  grid.innerHTML = ITEMS.map(item =>
    `<button class="item-btn ${item === selectedItem ? 'selected' : ''}" data-item="${item}">${item}</button>`
  ).join('');
}

function bindEvents() {
  document.getElementById('itemsGrid').addEventListener('click', (e) => {
    const btn = e.target.closest('.item-btn');
    if (!btn) return;
    selectedItem = btn.dataset.item;
    renderItems();
    document.getElementById('amountInput').focus();
  });

  document.getElementById('saveBtn').addEventListener('click', saveTransaction);

  document.getElementById('amountInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveTransaction();
  });

  // تنظيف الإدخال من أي حروف
  document.getElementById('amountInput').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/[^\d.]/g, '');
  });
}

/* ═══════════════ الحفظ في Firestore ═══════════════ */
async function saveTransaction() {
  const amountInput = document.getElementById('amountInput');
  const noteInput = document.getElementById('noteInput');
  const saveBtn = document.getElementById('saveBtn');

  if (!selectedItem) return showToast('⚠️ اختر البند أولاً', true);
  const amount = parseFloat(amountInput.value);
  if (!amount || amount <= 0) return showToast('⚠️ أدخل مبلغاً صحيحاً', true);

  const note = noteInput.value.trim();
  const now = new Date();
  const iso = getLocalISODate(now);

  const tx = {
    id: 'hany-' + Date.now() + '-' + Math.random().toString(36).slice(2,9),
    type: 'expense',
    kind: 'operational',
    category: 'مسحوبات محل هاني',
    amount: amount,
    description: note ? `${selectedItem} — ${note}` : selectedItem,
    method: 'cash',
    date: iso,
    month: MONTHS_AR[now.getMonth()],
    year: now.getFullYear(),
    monthIndex: now.getMonth(),
    subType: 'withdrawal',
    status: 'pending',
    source: 'hany-app',
    createdBy: 'hany',
    createdAt: Date.now()
  };

  saveBtn.disabled = true;
  saveBtn.textContent = '⏳ جاري الحفظ...';

  try {
    // ✅ arrayUnion آمن — لا يمسح باقي البيانات
    await docRef.set({
      transactions: firebase.firestore.FieldValue.arrayUnion(tx)
    }, { merge: true });

    // تفريغ الحقول
    amountInput.value = '';
    noteInput.value = '';
    selectedItem = '';
    renderItems();

    showToast('✅ تم الحفظ');
    if (navigator.vibrate) navigator.vibrate(50);
  } catch (err) {
    console.error(err);
    showToast('❌ فشل الحفظ: ' + err.message, true);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '💾 حفظ العملية';
  }
}

/* ═══════════════ قراءة سجل اليوم ═══════════════ */
function subscribeToData() {
  unsubscribe = docRef.onSnapshot((doc) => {
    if (!doc.exists) return renderTodayLog([]);
    const data = doc.data() || {};
    const today = getLocalISODate();
    const todayTx = (data.transactions || [])
      .filter(t => t.date === today && t.category === 'مسحوبات محل هاني')
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderTodayLog(todayTx);
  }, (err) => {
    console.error('Snapshot error:', err);
  });
}

function renderTodayLog(txList) {
  const log = document.getElementById('todayLog');
  const totalEl = document.getElementById('todayTotal');
  const totalAmt = document.getElementById('totalAmount');

  if (txList.length === 0) {
    log.innerHTML = '<div class="empty-state">لا توجد مسحوبات اليوم</div>';
    totalEl.style.display = 'none';
    return;
  }

  log.innerHTML = txList.map(t => `
    <div class="log-item">
      <span class="desc">${escapeHtml(t.description || t.category)}</span>
      <span class="amount">${fmt(t.amount)} ج.م</span>
      <button class="del-btn" data-id="${t.id}" title="حذف">×</button>
    </div>
  `).join('');

  const total = txList.reduce((s, t) => s + Number(t.amount || 0), 0);
  totalAmt.textContent = fmt(total) + ' ج.م';
  totalEl.style.display = 'flex';

  // حذف
  log.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteTransaction(btn.dataset.id));
  });
}

async function deleteTransaction(id) {
  const item = document.querySelector(`.del-btn[data-id="${id}"]`)?.closest('.log-item');
  if (!confirm('تأكيد حذف هذه العملية؟')) return;

  try {
    const snap = await docRef.get();
    const data = snap.data() || {};
    const tx = (data.transactions || []).find(t => t.id === id);
    if (!tx) return showToast('لم يتم العثور عليها', true);

    await docRef.set({
      transactions: firebase.firestore.FieldValue.arrayRemove(tx)
    }, { merge: true });

    showToast('🗑️ تم الحذف');
  } catch (err) {
    showToast('فشل الحذف: ' + err.message, true);
  }
}

function escapeHtml(s) {
  if (typeof s !== 'string') return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
