const migrateShoppingData = (parsed) => {
  if (!parsed) return null;
  return {
    engineVersion: CURRENT_ENGINE_VERSION,
    purchases: Array.isArray(parsed.purchases) ? parsed.purchases : [],
    shoppingList: Array.isArray(parsed.shoppingList) ? parsed.shoppingList : [],
    budgets: parsed.budgets && typeof parsed.budgets === 'object' ? parsed.budgets : {},
    favoriteItems: Array.isArray(parsed.favoriteItems) ? parsed.favoriteItems : [],
    autoSyncToWallet: parsed.autoSyncToWallet !== false
  };
};

/* ─────────────── Aggregations ─────────────── */
const computeMonthStats = (purchases, year, month) => {
  const monthPurchases = purchases.filter(p => p.year === year && p.month === month);
  const total = monthPurchases.reduce((s, p) => s + safeNumber(p.totalPrice), 0);
  const count = monthPurchases.length;
  const average = count > 0 ? total / count : 0;
  
  const byCategory = {};
  monthPurchases.forEach(p => {
    const cat = p.category || 'أخرى';
    if (!byCategory[cat]) byCategory[cat] = { total: 0, count: 0, items: [] };
    byCategory[cat].total += safeNumber(p.totalPrice);
    byCategory[cat].count++;
    byCategory[cat].items.push(p);
  });
  
  const byMember = {};
  monthPurchases.forEach(p => {
    const member = p.memberId || 'self';
    if (!byMember[member]) byMember[member] = { total: 0, count: 0 };
    byMember[member].total += safeNumber(p.totalPrice);
    byMember[member].count++;
  });
  
  const topItems = {};
  monthPurchases.forEach(p => {
    const name = (p.itemName || '').trim();
    if (!name) return;
    if (!topItems[name]) topItems[name] = { name, count: 0, total: 0 };
    topItems[name].count += safeNumber(p.quantity) || 1;
    topItems[name].total += safeNumber(p.totalPrice);
  });
  
  const topItemsArray = Object.values(topItems)
    .sort((a, b) => b.total - a.total)
    .slice(0, 10);
  
  return { total, count, average, byCategory, byMember, topItems: topItemsArray, purchases: monthPurchases };
};

/* ─────────────── Shopping Recurring Materialization ─────────────── */
const materializeShoppingRecurring = async () => {
  try {
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
    const snap = await docRef.get();
    if (!snap.exists) return;
    const d = snap.data() || {};
    const rules = d.shoppingRecurring || [];
    if (!rules.length) return;
    const today = getLocalISODate();
    const due = rules.filter(r => r.active && r.nextDue && r.nextDue <= today);
    if (!due.length) return;
    
    const newTxs = [];
    const updates = [];
    due.forEach(r => {
      const t = r.template;
      const tObj = new Date(r.nextDue + 'T12:00:00');
      newTxs.push({
        id: 'rec-tx-' + r.id + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
        type: 'expense', 
        kind: 'operational',
        category: t.category, 
        subCategory: t.subCategory,
        amount: t.amount, 
        description: t.description || 'مشترى متكرر',
        source: 'shopping-app', 
        sourceLabel: 'المشتريات',
        method: t.method || 'cash',
        date: r.nextDue, 
        month: ALL_MONTHS[tObj.getMonth()], 
        year: tObj.getFullYear(), 
        monthIndex: tObj.getMonth(),
        subType: 'withdrawal', 
        status: 'pending',
        recurringId: r.id, 
        createdAt: Date.now(), 
        receipts: []
      });
      
      const prefDay = r.preferredDay || 10;
      const addMonthsWithDay = (isoStr, m, day) => {
        const dt = new Date(isoStr + 'T12:00:00');
        dt.setMonth(dt.getMonth() + m);
        dt.setDate(parseInt(day));
        return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      };
      const next = addMonthsWithDay(r.nextDue, r.frequency === 'bimonthly' ? 2 : 1, prefDay);
      updates.push({ old: r, new: { ...r, nextDue: next, lastRun: today } });
    });
    
    if (newTxs.length > 0) {
      await docRef.set({ transactions: firebase.firestore.FieldValue.arrayUnion(...newTxs) }, { merge: true });
    }
    for (const u of updates) {
      await docRef.update({ shoppingRecurring: firebase.firestore.FieldValue.arrayRemove(u.old) });
      await docRef.set({ shoppingRecurring: firebase.firestore.FieldValue.arrayUnion(u.new) }, { merge: true });
    }
    console.log('✅ Shopping: materialized', newTxs.length, 'recurring items');
  } catch (e) {
    console.warn('Shopping recurring materialization failed:', e);
  }
};

/* ─────────────── Reducer ─────────────── */
function shoppingReducer(state, action) {
  switch (action.type) {
    case 'SET_DATA': return { ...state, data: { ...state.data, ...action.payload } };
    case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
    case 'SET_SELECTED_YEAR': return { ...state, selectedYear: action.payload };
    case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
    case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
    case 'SET_CATEGORY_FILTER': return { ...state, categoryFilter: action.payload };
    case 'SET_MEMBER_FILTER': return { ...state, memberFilter: action.payload };
    case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
    case 'SET_FORM_DATA': return { ...state, formData: action.payload };
    case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
    case 'SET_FORM_ERRORS': return { ...state, formErrors: action.payload };
    case 'SET_EDITING_PURCHASE': return { ...state, editingPurchase: action.payload };
    case 'SET_LIST_MODAL_OPEN': return { ...state, isListModalOpen: action.payload };
    case 'SET_BUDGET_MODAL_OPEN': return { ...state, isBudgetModalOpen: action.payload };
    case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload, budgetAmount: state.data.budgets?.[action.payload] || '' };
    case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
    case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
    case 'TOGGLE_FAVORITES': return { ...state, showFavorites: !state.showFavorites };
    case 'ADD_NOTIFICATION': 
      return { ...state, notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }] };
    case 'REMOVE_NOTIFICATION': 
      return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
    case 'SHOW_CONFIRM': 
      return { ...state, confirmDialog: { isOpen: true, ...action.payload } };
    case 'HIDE_CONFIRM': 
      return { ...state, confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false } };
    default: return state;
  }
}

/* ─────────────── Toast ─────────────── */
const Toast = ({ notification, onClose }) => {
  useEffect(() => { 
    const t = setTimeout(onClose, notification.duration || 5000); 
    return () => clearTimeout(t); 
  }, [notification, onClose]);
  
  const icons = { success: CheckCircle2, error: AlertTriangle, warning: AlertTriangle, info: Bell };
  const Icon = icons[notification.type] || Bell;
  
  return (
    <div className={`toast toast-${notification.type || 'info'}`} role="alert" aria-live="polite">
      <Icon size={18} className="flex-shrink-0 mt-0.5" />
      <div className="flex-1 min-w-0">
        {notification.title && <p className="font-bold text-sm mb-0.5">{notification.title}</p>}
        {notification.message && <p className="text-xs opacity-95">{notification.message}</p>}
      </div>
      <button onClick={onClose} aria-label="إغلاق" className="flex-shrink-0 p-1 hover:bg-white/20 rounded-full">
        <X size={14} />
      </button>
    </div>
  );
};

/* ─────────────── Confirm Dialog ─────────────── */
const ConfirmDialog = ({ confirmDialog, dispatch }) => {
  if (!confirmDialog.isOpen) return null;
  const isDanger = confirmDialog.danger;

  const handleCancel = () => {
    const cb = confirmDialog.onCancel;
    dispatch({ type: 'HIDE_CONFIRM' });
    if (cb) setTimeout(() => { 
      try { cb(); } catch (e) { console.error('Cancel error:', e); } 
    }, 0);
  };
  
  const handleConfirm = () => {
    const cb = confirmDialog.onConfirm;
    dispatch({ type: 'HIDE_CONFIRM' });
    if (cb) setTimeout(() => { 
      try { cb(); } catch (e) { console.error('Confirm error:', e); } 
    }, 0);
  };

  return (
    <div className="modal-backdrop z-[5000]">
      <div className="generic-modal max-w-sm">
        <div className="generic-modal-body text-center">
          <div className={`w-14 h-14 mx-auto mb-4 rounded-full flex items-center justify-center ${isDanger ? 'bg-red-50 dark:bg-red-950/40 text-red-500' : 'bg-blue-50 dark:bg-blue-950/40 text-blue-500'}`}>
            {isDanger ? <AlertTriangle size={24} /> : <Bell size={24} />}

          <p className="text-sm font-medium leading-relaxed whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>
            {confirmDialog.message}
          </p>
        </div>
        <div className="generic-modal-footer">
          <button type="button" autoFocus onClick={handleCancel} className="btn btn-secondary flex-1 text-sm">إلغاء</button>
          <button 
            type="button" 
            onClick={handleConfirm} 
            className="btn flex-1 text-sm" 
            style={{ background: isDanger ? 'var(--danger)' : 'var(--brand)', color: 'white' }}

  );

const groupPurchasesByDate = (list) => {
  const groups = {};
  list.forEach(p => { 
    const d = p.date || 'unknown'; 
    if (!groups[d]) groups[d] = []; 
    groups[d].push(p); 
  });
  
  const today = getLocalISODate();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const yestISO = getLocalISODate(yest);
  
  return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
    let label;
    if (date === today) label = '📅 النهاردة';
    else if (date === yestISO) label = '📅 امبارح';
    else {
      const dObj = parseISODate(date);
      if (dObj) { 
        const ds = dObj.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' }); 
        label = '📅 ' + ds;
      }
      else label = '📅 ' + date;
    }
    const total = groups[date].reduce((s, p) => s + safeNumber(p.totalPrice), 0);
    return { date, label, items: groups[date], total };
  });
};

/* ─────────────── Budget View ─────────────── */
const BudgetView = memo(({ purchases, budgets, selectedYear, selectedMonth, onSaveBudget }) => {
  const monthStats = useMemo(() => 
    computeMonthStats(purchases, selectedYear, selectedMonth), 
    [purchases, selectedYear, selectedMonth]
  );
  
  const [editingCategory, setEditingCategory] = useState(null);
  const [budgetAmount, setBudgetAmount] = useState('');
  
  const totalBudget = Object.values(budgets).reduce((s, v) => s + safeNumber(v), 0);
  const totalSpent = monthStats.total;
  const totalPct = totalBudget > 0 ? (totalSpent / totalBudget) * 100 : 0;
  
  const openEdit = (cat) => {
    setEditingCategory(cat);
    setBudgetAmount(budgets[cat] ? String(budgets[cat]) : '');
  };
  
  const handleSave = () => {
    if (!editingCategory) return;
    onSaveBudget(editingCategory, parseNumberInput(budgetAmount));
    setEditingCategory(null);
    setBudgetAmount('');
  };
  
  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      
      {/* Total Budget */}
      <div className="card" style={{ background: 'linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%)', color: 'white' }}>
        <p className="text-[11px] font-bold opacity-90 mb-1">الميزانية الشهرية</p>
        <h2 className="text-3xl font-black tracking-tight">
          {fmt(totalSpent)} 
          <span className="text-base opacity-80 mr-1">/ {fmt(totalBudget)}</span>
        </h2>
        <div className="w-full bg-white/20 rounded-full h-2 overflow-hidden mt-3">
          <div 
            className={`h-full rounded-full transition-all ${totalPct > 100 ? 'bg-red-500' : totalPct > 80 ? 'bg-amber-400' : 'bg-white'}`}
            style={{ width: `${Math.min(100, totalPct)}%` }}
          ></div>
        </div>
        <p className="text-[11px] font-bold mt-2 opacity-90">
          {totalPct > 100 
            ? `⚠️ تجاوزت الميزانية بـ ${fmt(totalSpent - totalBudget)} ${CURRENCY}` 
            : `متبقي ${fmt(totalBudget - totalSpent)} ${CURRENCY}`}

      </div>
      
      {/* Categories Budgets */}
      <div className="space-y-2">
        <h3 className="font-black text-sm">ميزانية كل فئة</h3>
        {Object.entries(SHOPPING_CATEGORIES).map(([cat, catInfo]) => {
          const spent = monthStats.byCategory[cat]?.total || 0;
          const budget = safeNumber(budgets[cat]);
          const pct = budget > 0 ? (spent / budget) * 100 : 0;
          
          return (
            <div key={cat} className="card py-3">
              <div className="flex justify-between items-center mb-2">
                <div className="flex items-center gap-2">
                  <span className="text-lg">{catInfo.icon}</span>

                      {fmt(spent)} {budget > 0 && `/ ${fmt(budget)}`} {CURRENCY}

                <button 
                  onClick={() => openEdit(cat)}

                >
                  <Edit size={12} />

              </div>
              {budget > 0 && (
                <React.Fragment>
                  <div className="w-full rounded-full h-1.5 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                    <div 
                      className={`h-full rounded-full ${pct > 100 ? 'bg-red-500' : pct > 80 ? 'bg-amber-500' : 'bg-emerald-500'}`}
                      style={{ width: `${Math.min(100, pct)}%`, background: pct <= 80 ? catInfo.color : undefined }}

                  <p className={`text-[10px] font-bold mt-1 ${pct > 100 ? 'text-red-500' : 'text-emerald-600'}`}>

const SettingsView = memo(({ data, dispatch, addNotification, purchases, shoppingList, onExport, onImport, onClearAll }) => {
  const [autoSync, setAutoSync] = useState(data?.autoSyncToWallet !== false);
  const [driveBusy, setDriveBusy] = useState(false);
  const [driveStatus, setDriveStatus] = useState('');
  
  const stats = useMemo(() => ({
    totalPurchases: purchases.length,
    totalListItems: shoppingList.length,
    totalValue: purchases.reduce((s, p) => s + safeNumber(p.totalPrice), 0),
    favoritesCount: (data?.favoriteItems || []).length
  }), [purchases, shoppingList, data]);
  
  const handleSaveAutoSync = () => {
    dispatch({ type: 'SET_DATA', payload: { autoSyncToWallet: autoSync } });
    addNotification({ 
      type: 'success', 
      title: autoSync ? 'المزامنة مفعّلة' : 'المزامنة متوقفة',
      message: autoSync ? 'المشتريات هتظهر في المحفظة تلقائياً' : 'المشتريات هتفضل في التطبيق فقط'
    });
  };
  
  const driveBackup = async () => {
    setDriveBusy(true);
    setDriveStatus('جاري الرفع...');
    try {
      // ✅ نستخدم نفس Google Drive بتاع المحفظة
      const CLIENT_ID = '190006477168-odmpreq26b618rdn1dsg4k1aag3k056g.apps.googleusercontent.com';
      const SCOPE = 'https://www.googleapis.com/auth/drive';
      
      await new Promise((resolve, reject) => {
        if (window.google?.accounts?.oauth2) return resolve();
        const start = Date.now();
        const timer = setInterval(() => {
          if (window.google?.accounts?.oauth2) { clearInterval(timer); resolve(); }
          else if (Date.now() - start > 10000) { clearInterval(timer); reject(new Error('GIS مش محمّل')); }
        }, 150);
      });
      
      const tokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        callback: () => {}
      });
      
      const token = await new Promise((resolve, reject) => {
        tokenClient.callback = (resp) => {
          if (resp.error) return reject(new Error(resp.error));
          resolve(resp.access_token);
        };
        tokenClient.requestAccessToken({ prompt: 'consent' });
      });
      
      const folderId = '1rAupM2llGpThcodBrmL4DZIhDSJ-dGXW';
      const fileName = `shopping_backup_${getLocalISODate()}_${Date.now()}.json`;
      const metadata = { name: fileName, parents: [folderId], mimeType: 'application/json' };
      const payload = { data, exportedAt: new Date().toISOString(), type: 'shopping-app' };
      
      const boundary = '----ShoppingBackup' + Date.now();
      const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n--${boundary}--`;
      
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
        method: 'POST',
        headers: { 
          Authorization: `Bearer ${token}`,
          'Content-Type': `multipart/related; boundary=${boundary}`
        },
        body
      });
      
      if (!res.ok) throw new Error('فشل الرفع');
      const result = await res.json();
      setDriveStatus(`✅ تم الرفع: ${result.name}`);
      addNotification({ type: 'success', title: 'تم رفع النسخة', message: 'في مجلد Finance Backups' });
    } catch (e) {
      setDriveStatus('❌ فشل: ' + e.message);
      addNotification({ type: 'error', title: 'فشل الرفع', message: e.message });
    } finally {
      setDriveBusy(false);

  return (

        <div className="stat-card">

        <div className="stat-card">

            onChange={e => { setAutoSync(e.target.checked); handleSaveAutoSync(); }}
            className="w-4 h-4 accent-emerald-600"
          />
        </label>
      </div>
      
      {/* Backup */}
      <div className="card">
        <div className="flex items-center gap-2 mb-3">
          <Database size={16} className="text-blue-500" />
          <h3 className="font-black text-sm">النسخ الاحتياطي</h3>
        </div>
        <div className="flex flex-wrap gap-2">
          <button onClick={onExport} className="btn btn-secondary text-xs flex-1 min-w-[120px]">
            <Download size={12} /> تصدير JSON
          </button>
          <label className="btn btn-secondary text-xs flex-1 min-w-[120px] cursor-pointer">
            <Upload size={12} /> استيراد
            <input type="file" accept=".json" onChange={onImport} className="hidden" />
          </label>
          <button 
            onClick={driveBackup} 
            disabled={driveBusy} 
            className="btn btn-primary text-xs flex-1 min-w-[120px]"
          >
            {driveBusy ? <RefreshCcw size={12} className="animate-spin" /> : <Cloud size={12} />}
            نسخة Drive
          </button>
        </div>
        {driveStatus && (
          <p className="text-[10px] font-semibold mt-2" style={{ color: 'var(--text-muted)' }}>
            {driveStatus}
          </p>
        )}
      </div>
      
      {/* Danger Zone */}
      <div className="card" style={{ borderColor: 'var(--warning)' }}>
        <div className="flex items-center gap-2 mb-3">
          <AlertTriangle size={16} className="text-amber-500" />
          <h3 className="font-black text-sm">منطقة الخطر</h3>
        </div>
        <button 
          onClick={onClearAll} 
          className="btn btn-secondary text-xs w-full text-red-600 py-2"
        >
          <Trash2 size={12} /> مسح كل المشتريات
        </button>
        <p className="text-[10px] mt-2" style={{ color: 'var(--text-muted)' }}>
          ⚠️ ده مش هيمسح المعاملات من المحفظة — بس من التطبيق ده
        </p>
      </div>
      
      {/* Info */}
      <div className="card" style={{ background: 'var(--bg-muted)' }}>
        <div className="flex items-start gap-2">
          <Info size={14} className="text-blue-500 flex-shrink-0 mt-0.5" />
          <div>
            <p className="text-[11px] leading-relaxed" style={{ color: 'var(--text-secondary)' }}>
              <strong>V1 — Shopping App</strong>
              <br />
              متصل بالمحفظة عبر Firebase. كل مشترى يُضاف كـ transaction في شهره تلقائياً (لو المزامنة مفعّلة).
            </p>
          </div>
        </div>
      </div>
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════
   APP COMPONENT — الرئيسي
   ═══════════════════════════════════════════════════════════════ */
function App() {
  const now = new Date();
  const [state, dispatch] = React.useReducer(shoppingReducer, {
    data: getInitialData(),
    activeTab: 'home',
    selectedYear: now.getFullYear(),
    selectedMonth: ALL_MONTHS[now.getMonth()],
    searchTerm: '',
    categoryFilter: 'all',
    memberFilter: 'all',
    isFormOpen: false,
    formMode: 'add',
    formData: {},
    formErrors: {},
    editingPurchase: null,
    isListModalOpen: false,
    isBudgetModalOpen: false,
    editingBudgetCategory: null,
    budgetAmount: '',
    isDarkMode: localStorage.getItem('shopping_theme') === 'dark',
    notifications: [],
    confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false }
  });
  
  const { 
    data, activeTab, selectedYear, selectedMonth, searchTerm,
    categoryFilter, memberFilter, isFormOpen, formMode, editingPurchase,
    isDarkMode, notifications, confirmDialog
  } = state;
  
  const { purchases = [], shoppingList = [], budgets = {}, favoriteItems = [] } = data || {};
  
  // ✅ Refs للأحدث data
  const currentPurchasesRef = useRef([]);
  const dataRef = useRef(null);
  
  useEffect(() => {
    currentPurchasesRef.current = data?.purchases || [];
    dataRef.current = data;
  }, [data?.purchases, data]);
  
  const addNotification = useCallback((n) => 
    dispatch({ type: 'ADD_NOTIFICATION', payload: n }), []);
  
  const removeNotification = useCallback((id) => 
    dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }), []);
  
  /* ─────────────── Firebase Sync ─────────────── */
  const hasReceivedInitialSnapshot = useRef(false);
  const lastRemoteRef = useRef(null);
  
  useEffect(() => {
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
    
    const unsub = docRef.onSnapshot((doc) => {
      hasReceivedInitialSnapshot.current = true;
      if (doc.exists) {
        const remote = doc.data() || {};
        // ✅ بس بنقرأ — بنستخدم doc بس عشان نرفع
        // ملاحظة: المشتريات بتترفع كـ transactions
        const incoming = JSON.stringify({ shop: data });
        if (lastRemoteRef.current === incoming) return;
        lastRemoteRef.current = incoming;
      }
    });
    
    return () => unsub();
  }, []);
  
  /* ─────────────── Auto-save to localStorage ─────────────── */
  useEffect(() => {
    clearTimeout(window._shopSaveTimeout);
    window._shopSaveTimeout = setTimeout(() => {
      try { 
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); 
      } catch (e) {}
    }, 500);
    return () => clearTimeout(window._shopSaveTimeout);
  }, [data]);
  
  /* ─────────────── Materialize Recurring (hourly) ─────────────── */
  useEffect(() => {
    materializeShoppingRecurring();
    const interval = setInterval(materializeShoppingRecurring, 60 * 60 * 1000);
    return () => clearInterval(interval);
  }, []);
  
  /* ─────────────── Theme ─────────────── */
  useEffect(() => {
    document.documentElement.classList.toggle('dark', isDarkMode);
    localStorage.setItem('shopping_theme', isDarkMode ? 'dark' : 'light');
  }, [isDarkMode]);
  
  /* ─────────────── Add Purchase ─────────────── */
  const handleAddPurchase = useCallback(async (formData) => {
    try {
      const d = parseISODate(formData.date) || new Date();
      const txYear = d.getFullYear();
      const txMonth = ALL_MONTHS[d.getMonth()];
      
      const newPurchase = {
        id: getSafeId(),
        itemName: formData.itemName,
        quantity: formData.quantity,
        unit: formData.unit,
        unitPrice: formData.unitPrice,
        totalPrice: formData.totalPrice,
        category: formData.category,
        memberId: formData.memberId || 'self',
        date: formData.date,
        month: txMonth,
        year: txYear,
        monthIndex: d.getMonth(),
        notes: formData.notes || '',
        createdAt: new Date().toISOString(),
        source: 'shopping-app'
      };
      
      // ✅ حفظ محلي
      const newPurchases = [newPurchase, ...purchases];
      dispatch({ type: 'SET_DATA', payload: { purchases: newPurchases } });
      
      // ✅ مزامنة مع المحفظة (لو مفعلة)
      if (data.autoSyncToWallet !== false) {
        try {
          const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
          const walletTx = {
            id: 'shop-' + newPurchase.id,
            type: 'expense',
            kind: 'operational',
            category: formData.category,
            subCategory: 'مشتريات',
            amount: formData.totalPrice,
            quantity: formData.quantity,
            unitPrice: formData.unitPrice,
            description: formData.itemName,
            source: 'shopping-app',
            sourceLabel: 'المشتريات',
            createdBy: formData.memberId,
            method: 'cash',
            date: formData.date,
            month: txMonth,
            year: txYear,
            monthIndex: d.getMonth(),
            subType: 'withdrawal',
            status: 'pending',
            createdAt: Date.now(),
            receipts: []
          };
          
          await docRef.set({ 
            transactions: firebase.firestore.FieldValue.arrayUnion(walletTx) 
          }, { merge: true });
          
          addNotification({ 
            type: 'success', 
            title: 'تم الحفظ والمزامنة', 
            message: `${formData.itemName} — ${fmt(formData.totalPrice)} ${CURRENCY}`,
            duration: 4000
          });
        } catch (e) {
          console.error('Wallet sync failed:', e);
          addNotification({ 
            type: 'warning', 
            title: 'تم الحفظ محلياً', 
            message: 'فشل المزامنة مع المحفظة — هيتزامن لاحقاً'
          });
        }
      } else {
        addNotification({ 
          type: 'success', 
          title: 'تم الحفظ',
          message: `${formData.itemName} — ${fmt(formData.totalPrice)} ${CURRENCY}`
        });
      }
      
      dispatch({ type: 'SET_FORM_OPEN', payload: false });
      dispatch({ type: 'SET_EDITING_PURCHASE', payload: null });
      
      // ✅ إضافة للمفضلة تلقائياً لو اتكرر 3 مرات
      const itemCount = newPurchases.filter(p => normalizeText(p.itemName) === normalizeText(formData.itemName)).length;
      if (itemCount >= 3 && !favoriteItems.includes(formData.itemName)) {
        const newFavs = [...favoriteItems, formData.itemName];
        dispatch({ type: 'SET_DATA', payload: { favoriteItems: newFavs } });
      }
      
    } catch (err) {
      console.error('Add purchase error:', err);
      addNotification({ type: 'error', title: 'فشل الحفظ', message: err.message });
    }
  }, [purchases, data, favoriteItems, addNotification]);
  
  /* ─────────────── Update Purchase ─────────────── */
  const handleUpdatePurchase = useCallback(async (formData) => {
    try {
      const d = parseISODate(formData.date) || new Date();
      const txYear = d.getFullYear();
      const txMonth = ALL_MONTHS[d.getMonth()];
      
      const updatedPurchase = {
        ...editingPurchase,
        itemName: formData.itemName,
        quantity: formData.quantity,
        unit: formData.unit,
        unitPrice: formData.unitPrice,
        totalPrice: formData.totalPrice,
        category: formData.category,
        memberId: formData.memberId,
        date: formData.date,
        month: txMonth,
        year: txYear,
        monthIndex: d.getMonth(),
        notes: formData.notes,
        updatedAt: new Date().toISOString()
      };
      
      const newPurchases = purchases.map(p => p.id === editingPurchase.id ? updatedPurchase : p);
      dispatch({ type: 'SET_DATA', payload: { purchases: newPurchases } });
      
      addNotification({ type: 'success', title: 'تم التحديث' });
      dispatch({ type: 'SET_FORM_OPEN', payload: false });
      dispatch({ type: 'SET_EDITING_PURCHASE', payload: null });
    } catch (err) {
      console.error('Update error:', err);
      addNotification({ type: 'error', title: 'فشل التحديث', message: err.message });
    }
  }, [purchases, editingPurchase, addNotification]);
  
  /* ─────────────── Delete Purchase ─────────────── */
  const handleDeletePurchase = useCallback((id) => {
    const purchase = purchases.find(p => p.id === id);
    if (!purchase) return;
    
    dispatch({
      type: 'SHOW_CONFIRM',
      danger: true,
      title: 'حذف المشترى',
      message: `هيتم حذف "${purchase.itemName}" من التطبيق فقط.\n(لو المزامنة مفعلة، هيفضل في المحفظة)`,
      onConfirm: () => {
        const newPurchases = purchases.filter(p => p.id !== id);
        dispatch({ type: 'SET_DATA', payload: { purchases: newPurchases } });
        addNotification({ type: 'success', title: 'تم الحذف' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  }, [purchases, addNotification]);
  
  /* ─────────────── Toggle Favorite ─────────────── */
  const handleToggleFavorite = useCallback((purchase) => {
    const itemName = purchase.itemName;
    const isFav = favoriteItems.includes(itemName);
    const newFavs = isFav 
      ? favoriteItems.filter(f => f !== itemName)
      : [...favoriteItems, itemName];
    
    dispatch({ type: 'SET_DATA', payload: { favoriteItems: newFavs } });
    addNotification({ 
      type: 'success', 
      title: isFav ? 'تم إزالته من المفضلة' : 'تمت الإضافة للمفضلة'
    });
  }, [favoriteItems, addNotification]);
  
  /* ─────────────── Shopping List Actions ─────────────── */
  const handleAddListItem = useCallback((item) => {
    const newItem = {
      id: getSafeId(),
      text: item.text,
      priority: item.priority || 'normal',
      completed: false,
      createdAt: new Date().toISOString()
    };
    dispatch({ type: 'SET_DATA', payload: { shoppingList: [newItem, ...shoppingList] } });
    addNotification({ type: 'success', title: 'تمت الإضافة للقائمة' });
  }, [shoppingList, addNotification]);
  
  const handleToggleListItem = useCallback((id) => {
    const newList = shoppingList.map(i => 
      i.id === id ? { ...i, completed: !i.completed, completedAt: !i.completed ? new Date().toISOString() : null } : i
    );
    dispatch({ type: 'SET_DATA', payload: { shoppingList: newList } });
  }, [shoppingList]);
  
  const handleDeleteListItem = useCallback((id) => {
    dispatch({ type: 'SET_DATA', payload: { shoppingList: shoppingList.filter(i => i.id !== id) } });
  }, [shoppingList]);
  
  const handleClearCompleted = useCallback(() => {
    const pending = shoppingList.filter(i => !i.completed);
    dispatch({ type: 'SET_DATA', payload: { shoppingList: pending } });
    addNotification({ type: 'success', title: 'تم مسح المكتمل' });
  }, [shoppingList, addNotification]);
  
  /* ─────────────── Budget Actions ─────────────── */
  const handleSaveBudget = useCallback((category, amount) => {
    const newBudgets = { ...budgets, [category]: amount };
    if (amount === 0) delete newBudgets[category];
    dispatch({ type: 'SET_DATA', payload: { budgets: newBudgets } });
    addNotification({ 
      type: 'success', 
      title: amount === 0 ? 'تمت إزالة الميزانية' : 'تم حفظ الميزانية',
      message: amount > 0 ? `${category}: ${fmt(amount)} ${CURRENCY}` : ''
    });
  }, [budgets, addNotification]);
  
  /* ─────────────── Export / Import ─────────────── */
  const handleExport = useCallback(() => {
    const blob = new Blob([JSON.stringify({ data, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `shopping_backup_${getLocalISODate()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    addNotification({ type: 'success', title: 'تم التصدير' });
  }, [data, addNotification]);
  
  const handleImport = useCallback((e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        if (parsed.data) {
          const migrated = migrateShoppingData(parsed.data);
          dispatch({ type: 'SET_DATA', payload: migrated });
          addNotification({ type: 'success', title: 'تم الاستيراد' });
        }
      } catch {
        addNotification({ type: 'error', title: 'ملف غير صالح' });
      }
    };
    reader.readAsText(file);
  }, [addNotification]);
  
  /* ─────────────── Clear All ─────────────── */
  const handleClearAll = useCallback(() => {
    dispatch({
      type: 'SHOW_CONFIRM',
      danger: true,
      title: 'مسح كل المشتريات',
      message: 'هيتم مسح كل المشتريات من التطبيق فقط.\nالمحفظة مش هتتأثر.',
      onConfirm: () => {
        dispatch({ type: 'SET_DATA', payload: { purchases: [], favoriteItems: [] } });
        addNotification({ type: 'success', title: 'تم المسح' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  }, [addNotification]);
  
  /* ─────────────── Render Active View ─────────────── */
  const renderActiveView = () => {
    switch (activeTab) {
      case 'home':
        return (
          <HomeView
            purchases={purchases}
            selectedYear={selectedYear}
            selectedMonth={selectedMonth}
            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })}
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })}
            favorites={favoriteItems}
            onToggleFavorite={handleToggleFavorite}
            onDelete={handleDeletePurchase}
            onEdit={(p) => {
              dispatch({ type: 'SET_EDITING_PURCHASE', payload: p });
              dispatch({ type: 'SET_FORM_OPEN', payload: true });
            }}
          />
        );
      case 'reports':
        return <ReportsView purchases={purchases} selectedYear={selectedYear} selectedMonth={selectedMonth} />;
      case 'list':
        return (
          <ShoppingListView
            shoppingList={shoppingList}
            onAdd={handleAddListItem}
            onToggle={handleToggleListItem}
            onDelete={handleDeleteListItem}
            onClear={handleClearCompleted}
          />
        );
      case 'budget':
        return (
          <BudgetView
            purchases={purchases}
            budgets={budgets}
            selectedYear={selectedYear}
            selectedMonth={selectedMonth}
            onSaveBudget={handleSaveBudget}
          />
        );
      case 'settings':
        return (
          <SettingsView
            data={data}
            dispatch={dispatch}
            addNotification={addNotification}
            purchases={purchases}
            shoppingList={shoppingList}
            onExport={handleExport}
            onImport={handleImport}
            onClearAll={handleClearAll}
          />
        );
      default:
        return null;
    }
  };
  
  return (
    <div className="flex flex-col h-screen overflow-hidden font-sans">
      
      {/* Header */}
      <div className="pt-3 pb-2 px-3 no-print" style={{ background: 'var(--bg-card)', borderBottom: '1px solid var(--border-subtle)' }}>
        <div className="flex justify-between items-center">
          <div className="flex items-center gap-2">
            <div className="p-2 rounded-lg text-white shadow-sm" style={{ background: 'var(--brand)' }}>
              <ShoppingCart size={18} />
            </div>
            <div>
              <h1 className="text-base font-black">مشترياتي</h1>
              <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                {purchases.length} مشترى • {shoppingList.filter(i => !i.completed).length} في القائمة
              </p>
            </div>
          </div>
          <div className="flex gap-1.5">
            <a 
              href="index.html" 
              title="المحفظة" 
              className="btn text-[11px] py-1.5 px-2.5" 
              style={{ background: 'var(--bg-muted)', color: 'var(--text-primary)', border: '1px solid var(--border-default)' }}
            >
              💰 المحفظة
            </a>
            <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <button 
                type="button" 
                aria-label="فاتح" 
                onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: false })} 
                className={`p-1.5 rounded-md transition-all ${!isDarkMode ? 'shadow-sm' : ''}`} 
                style={!isDarkMode ? { background: 'var(--bg-card)', color: 'var(--brand)' } : { color: 'var(--text-muted)' }}
              >
                <Sun size={12} />
              </button>
              <button 
                type="button" 
                aria-label="ليلي" 
                onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: true })} 
                className={`p-1.5 rounded-md transition-all ${isDarkMode ? 'shadow-sm' : ''}`} 
                style={isDarkMode ? { background: 'var(--bg-card)', color: 'var(--brand)' } : { color: 'var(--text-muted)' }}
              >
                <Moon size={12} />
              </button>
            </div>
          </div>
        </div>
      </div>
      
      {/* Main Content */}
      <main className="flex-1 overflow-y-auto p-3">
        <div className="max-w-2xl mx-auto">
          
          {/* Quick Add Bar - Home only */}
          {activeTab === 'home' && (
            <div className="mb-4">
              <QuickAddBar 
                onAdd={handleAddPurchase} 
                members={MEMBER_COLORS}
              />
            </div>
          )}
          
          {renderActiveView()}
        </div>
      </main>
      
      {/* Bottom Navigation */}
      <div className="bottom-nav-container">
        <div className="scrollable-nav scroll-hide">
          {[
            { id: 'home', label: 'الرئيسية', icon: Home },
            { id: 'list', label: 'القائمة', icon: ListChecks, badge: shoppingList.filter(i => !i.completed).length },
            { id: 'budget', label: 'الميزانية', icon: Target },
            { id: 'reports', label: 'التقارير', icon: BarChart3 },
            { id: 'settings', label: 'الإعدادات', icon: SettingsIcon }
          ].map(item => {
            const Icon = item.icon;
            const isActive = activeTab === item.id;
            return (
              <button
                key={item.id}
                type="button"
                onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })}
                className={`nav-btn relative ${isActive ? 'active' : ''}`}
              >
                <Icon size={19} />
                <span>{item.label}</span>
                {item.badge > 0 && (
                  <span className="absolute top-1 right-1 bg-red-500 text-white text-[9px] rounded-full w-4 h-4 flex items-center justify-center font-black">
                    {item.badge > 9 ? '9+' : item.badge}
                  </span>
                )}
              </button>
            );
          })}
        </div>
      </div>
      
      {/* FAB - Add New Purchase */}
      {activeTab === 'home' && (
        <button
          type="button"
          aria-label="إضافة مشترى"
          onClick={() => {
            dispatch({ type: 'SET_EDITING_PURCHASE', payload: null });
            dispatch({ type: 'SET_FORM_OPEN', payload: true });
          }}
          className="fab no-print"
        >
          <Plus size={22} />
        </button>
      )}
      
      {/* Add/Edit Purchase Modal */}
      {isFormOpen && (
        <AddPurchaseModal
          isOpen={true}
          onClose={() => {
            dispatch({ type: 'SET_FORM_OPEN', payload: false });
            dispatch({ type: 'SET_EDITING_PURCHASE', payload: null });
          }}
          onSave={editingPurchase ? handleUpdatePurchase : handleAddPurchase}
          editingPurchase={editingPurchase}
          favoriteItems={favoriteItems}
        />
      )}
      
      {/* Notifications */}
      <ToastContainer notifications={notifications} removeNotification={removeNotification} />
      
      {/* Confirm Dialog */}
      <ConfirmDialog confirmDialog={confirmDialog} dispatch={dispatch} />
      
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════ */
const rootElement = document.getElementById('root');
if (rootElement) {
  createRoot(rootElement).render(<App />);
  const hideLoading = () => {
    const l = document.getElementById('loading');
    if (!l) return;
    l.style.transition = 'opacity 0.35s ease';
    l.style.opacity = '0';
    setTimeout(() => { l.style.display = 'none'; }, 350);
  };
  if (document.readyState === 'complete') { 
    setTimeout(hideLoading, 500); 
  } else { 
    window.addEventListener('load', () => setTimeout(hideLoading, 500)); 
  }
}
</script>
</body>
</html>
