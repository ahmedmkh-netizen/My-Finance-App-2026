};

const safeNumber = (v, f = 0) => { const n = Number(v); return isNaN(n) || !isFinite(n) ? f : n; };
const fmt = (n) => safeNumber(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const toEnglishDigits = (s) => { 
  if (s === null || s === undefined) return ''; 
  const map = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9' }; 
  return String(s).replace(/[٠-٩۰-۹]/g, d => map[d]); 
};

  const cleaned = toEnglishDigits(v).replace(/[^\d.\-]/g, '');

  if (!iso) return null;
  if (iso instanceof Date) return isNaN(iso) ? null : iso;
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(iso));
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const d = new Date(iso);
  return isNaN(d) ? null : d;
};

const computeMonthStats = (purchases, year, month) => {
  const monthPurchases = purchases.filter(p => p.year === year && p.month === month);
  const total = monthPurchases.reduce((s, p) => s + safeNumber(p.totalPrice), 0);
  const count = monthPurchases.length;
  const average = count > 0 ? total / count : 0;
  
  const byCategory = {};
  monthPurchases.forEach(p => {
    const cat = p.category || 'أخرى';
    if (!byCategory[cat]) byCategory[cat] = { total: 0, count: 0 };
    byCategory[cat].total += safeNumber(p.totalPrice);
    byCategory[cat].count++;
  });
  
  const byStore = {};
  monthPurchases.forEach(p => {
    const store = p.store || 'other';
    if (!byStore[store]) byStore[store] = { total: 0, count: 0 };
    byStore[store].total += safeNumber(p.totalPrice);
    byStore[store].count++;
  });
  
  const topItems = {};
  monthPurchases.forEach(p => {
    const name = (p.itemName || '').trim();
    if (!name) return;
    if (!topItems[name]) topItems[name] = { name, count: 0, total: 0 };
    topItems[name].count++;
    topItems[name].total += safeNumber(p.totalPrice);
  });
  
  return { 
    total, count, average, byCategory, byStore,
    topItems: Object.values(topItems).sort((a, b) => b.total - a.total).slice(0, 10),
    purchases: monthPurchases 
  };
};

const groupPurchasesByDate = (list) => {
  const groups = {};
  list.forEach(p => { 
    const d = p.date || 'unknown'; 
    if (!groups[d]) groups[d] = []; 
    groups[d].push(p); 
  });
  
  const today = getLocalISODate();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const yestISO = getLocalISODate(yest);
  
  return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
    let label;
    if (date === today) label = '📅 النهاردة';
    else if (date === yestISO) label = '📅 امبارح';
    else {
      const dObj = parseISODate(date);
      if (dObj) { 
        label = '📅 ' + dObj.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' }); 
      } else label = '📅 ' + date;
    }
    const total = groups[date].reduce((s, p) => s + safeNumber(p.totalPrice), 0);
    return { date, label, items: groups[date], total };
  });
};

/* ═══════════════════════════════════════════════════════════════
   REDUCER
   ═══════════════════════════════════════════════════════════════ */
function appReducer(state, action) {
  switch (action.type) {
    case 'SET_DATA': return { ...state, data: { ...state.data, ...action.payload } };
    case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
    case 'SET_SELECTED_YEAR': return { ...state, selectedYear: action.payload };
    case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
    case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
    case 'SET_EDITING_PURCHASE': return { ...state, editingPurchase: action.payload };
    case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
    case 'ADD_NOTIFICATION': 
      return { ...state, notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }] };
    case 'REMOVE_NOTIFICATION': 
      return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
    case 'SHOW_CONFIRM': 
      return { ...state, confirmDialog: { isOpen: true, ...action.payload } };
    case 'HIDE_CONFIRM': 
      return { ...state, confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false } };
    default: return state;
  }
}

const Toast = ({ notification, onClose }) => {
  useEffect(() => { 
    const t = setTimeout(onClose, notification.duration || 4000); 
    return () => clearTimeout(t); 
  }, [notification, onClose]);
  
  const icons = { success: CheckCircle2, error: AlertTriangle, warning: AlertTriangle, info: Bell };
  const Icon = icons[notification.type] || Bell;
  
  return (
    <div className={`toast toast-${notification.type || 'info'}`}>
      <Icon size={18} className="flex-shrink-0 mt-0.5" />
      <div className="flex-1 min-w-0">
        {notification.title && <p className="font-bold text-sm mb-0.5">{notification.title}</p>}
        {notification.message && <p className="text-xs opacity-95">{notification.message}</p>}
      </div>
      <button onClick={onClose} className="flex-shrink-0 p-1 hover:bg-white/20 rounded-full">
        <X size={14} />
      </button>
    </div>
  );
};

const ToastContainer = ({ notifications, removeNotification }) => {
  if (!notifications || notifications.length === 0) return null;
  return (
    <div className="toast-container">
      {notifications.slice(-3).map(n => (
        <Toast key={n.id} notification={n} onClose={() => removeNotification(n.id)} />
      ))}
    </div>
  );
};

const SyncIndicator = ({ status }) => {

const Modal = memo(({ isOpen, onClose, title, icon, size = 'md', children }) => {
  if (!isOpen) return null;
  const sizeClass = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-lg' }[size] || 'max-w-md';
  return (
    <div className="modal-backdrop" onClick={(e) => { if (e.target === e.currentTarget && onClose) onClose(); }}>
      <div className={`generic-modal ${sizeClass}`}>
        {title && (
          <div className="generic-modal-header">
            <h3 className="text-base font-black flex items-center gap-2">
              {icon && <span>{icon}</span>}
              {title}
            </h3>
            {onClose && (
              <button onClick={onClose} className="btn btn-ghost p-1.5">
                <X size={16} />
              </button>
            )}
          </div>
        )}
        <div className="generic-modal-body">{children}</div>
      </div>
    </div>
  );
});

const ConfirmDialog = ({ confirmDialog, dispatch }) => {
  if (!confirmDialog.isOpen) return null;
  const isDanger = confirmDialog.danger;

  const handleCancel = () => {
    const cb = confirmDialog.onCancel;
    dispatch({ type: 'HIDE_CONFIRM' });
    if (cb) setTimeout(() => { try { cb(); } catch (e) {} }, 0);
  };
  
  const handleConfirm = () => {
    const cb = confirmDialog.onConfirm;
    dispatch({ type: 'HIDE_CONFIRM' });
    if (cb) setTimeout(() => { try { cb(); } catch (e) {} }, 0);
  };

  return (
    <div className="modal-backdrop" style={{ zIndex: 5000 }}>
      <div className="generic-modal max-w-sm">
        <div className="generic-modal-body text-center">
          <div className={`w-14 h-14 mx-auto mb-4 rounded-full flex items-center justify-center ${isDanger ? 'bg-red-50 dark:bg-red-950/40 text-red-500' : 'bg-blue-50 dark:bg-blue-950/40 text-blue-500'}`}>
            {isDanger ? <AlertTriangle size={24} /> : <Bell size={24} />}
          </div>
          <h3 className="text-base font-black mb-2">{confirmDialog.title}</h3>
          <p className="text-sm font-medium leading-relaxed whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>
            {confirmDialog.message}
          </p>
        </div>
        <div className="generic-modal-footer">
          <button type="button" autoFocus onClick={handleCancel} className="btn btn-secondary flex-1 text-sm">إلغاء</button>
          <button 
            type="button" 
            onClick={handleConfirm} 
            className="btn flex-1 text-sm" 
            style={{ background: isDanger ? 'var(--danger)' : 'var(--brand)', color: 'white' }}
          >تأكيد</button>
        </div>
      </div>
    </div>
  );
};

const ReportsView = memo(({ purchases, selectedYear, selectedMonth }) => {
  const monthStats = useMemo(() => 
    computeMonthStats(purchases, selectedYear, selectedMonth), 
    [purchases, selectedYear, selectedMonth]
  );
  
  const yearStats = useMemo(() => {
    const monthData = ALL_MONTHS.map(m => {
      const stats = computeMonthStats(purchases, selectedYear, m);
      return { month: m, total: stats.total, count: stats.count };
    });
    const yearTotal = monthData.reduce((s, d) => s + d.total, 0);
    const maxTotal = Math.max(...monthData.map(d => d.total), 1);
    return { monthData, yearTotal, maxTotal };
  }, [purchases, selectedYear]);
  
  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      
      <div className="card">
        <h2 className="text-lg font-black flex items-center gap-2 mb-1">

          {Object.entries(monthStats.byStore).map(([storeId, data]) => {

              <div key={storeId}>

                  <span className="text-[12px] font-bold flex items-center gap-2">

const SettingsView = memo(({ data, dispatch, addNotification, purchases, shoppingList, onExport, onImport, onClearAll, syncStatus }) => {
  const [autoSync, setAutoSync] = useState(data?.autoSyncToWallet !== false);
  const [driveBusy, setDriveBusy] = useState(false);
  const [driveStatus, setDriveStatus] = useState('');
  
  const stats = useMemo(() => ({
    totalPurchases: purchases.length,
    totalListItems: shoppingList.length,
    totalValue: purchases.reduce((s, p) => s + safeNumber(p.totalPrice), 0),
    favoritesCount: (data?.favoriteItems || []).length
  }), [purchases, shoppingList, data]);
  
  const handleSaveAutoSync = () => {
    dispatch({ type: 'SET_DATA', payload: { autoSyncToWallet: autoSync } });
    addNotification({ 
      type: 'success', 
      title: autoSync ? 'المزامنة مفعّلة' : 'المزامنة متوقفة'
    });
  };
  
  const driveBackup = async () => {
    setDriveBusy(true);
    setDriveStatus('جاري الرفع...');
    try {
      const CLIENT_ID = '190006477168-odmpreq26b618rdn1dsg4k1aag3k056g.apps.googleusercontent.com';
      const SCOPE = 'https://www.googleapis.com/auth/drive';
      
      await new Promise((resolve, reject) => {
        if (window.google?.accounts?.oauth2) return resolve();
        const start = Date.now();
        const timer = setInterval(() => {
          if (window.google?.accounts?.oauth2) { clearInterval(timer); resolve(); }
          else if (Date.now() - start > 10000) { clearInterval(timer); reject(new Error('GIS مش محمّل')); }
        }, 150);
      });
      
      const tokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        callback: () => {}
      });
      
      const token = await new Promise((resolve, reject) => {
        tokenClient.callback = (resp) => {
          if (resp.error) return reject(new Error(resp.error));
          resolve(resp.access_token);
        };
        tokenClient.requestAccessToken({ prompt: 'consent' });
      });
      
      const folderId = '1rAupM2llGpThcodBrmL4DZIhDSJ-dGXW';
      const fileName = `shopping_backup_${getLocalISODate()}_${Date.now()}.json`;
      const metadata = { name: fileName, parents: [folderId], mimeType: 'application/json' };
      const payload = { data, exportedAt: new Date().toISOString(), type: 'shopping-app' };
      
      const boundary = '----ShoppingBackup' + Date.now();
      const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n--${boundary}--`;
      
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
        method: 'POST',
        headers: { 
          Authorization: `Bearer ${token}`,
          'Content-Type': `multipart/related; boundary=${boundary}`
        },
        body
      });
      
      if (!res.ok) throw new Error('فشل الرفع');
      const result = await res.json();
      setDriveStatus(`✅ تم الرفع: ${result.name}`);
      addNotification({ type: 'success', title: 'تم رفع النسخة' });
    } catch (e) {
      setDriveStatus('❌ فشل: ' + e.message);
      addNotification({ type: 'error', title: 'فشل الرفع', message: e.message });
    } finally {
      setDriveBusy(false);
    }
  };
  
  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <h2 className="text-lg font-black flex items-center gap-2">
          <SettingsIcon className="text-slate-500" size={18} /> الإعدادات
        </h2>
      </div>
      
      <div className="grid grid-cols-2 gap-2">
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>إجمالي المشتريات</p>
          <p className="text-base font-black text-emerald-600">{stats.totalPurchases}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>قائمة التسوق</p>
          <p className="text-base font-black text-blue-600">{stats.totalListItems}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الإجمالي ({CURRENCY})</p>
          <p className="text-base font-black text-purple-600">{fmt(stats.totalValue)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>⭐ المفضلة</p>
          <p className="text-base font-black text-amber-600">{stats.favoritesCount}</p>
        </div>
      </div>
      
      <div className="card" style={{ borderColor: 'var(--brand)' }}>
        <div className="flex items-center gap-2 mb-3">
          <Cloud size={16} className="text-emerald-500" />
          <h3 className="font-black text-sm">المزامنة السحابية</h3>
        </div>
        <div className="p-3 rounded-lg mb-3" style={{ background: 'var(--brand-soft)' }}>
          <p className="text-[11px] leading-relaxed" style={{ color: 'var(--text-secondary)' }}>
            <strong>☁️ Firebase هو المصدر الأساسي</strong>
            <br />
            كل تغيير بيترفع تلقائياً. لو فتحت من أي جهاز، هتلاقي نفس البيانات.
          </p>
          <div className="mt-2 flex items-center gap-2">
            <span className={`badge ${syncStatus === 'ready' ? 'badge-success' : syncStatus === 'offline' ? 'badge-danger' : 'badge-warning'} text-[10px]`}>
              {syncStatus === 'ready' ? '✅ متزامن' : syncStatus === 'offline' ? '⚠️ محلي' : '⏳ مزامنة...'}
            </span>
          </div>
        </div>
        <label className="flex items-center justify-between p-2.5 rounded-lg cursor-pointer" style={{ background: 'var(--bg-muted)' }}>
          <div className="flex items-center gap-2">
            <div>
              <p className="text-xs font-bold">مزامنة مع المحفظة</p>
              <p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>
                كل مشترى يُضاف كـ transaction
              </p>
            </div>
          </div>
          <input

        </div>
        {driveStatus && (
          <p className="text-[10px] font-semibold mt-2" style={{ color: 'var(--text-muted)' }}>

/* ═══════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════ */
const AddPurchaseModal = memo(({ isOpen, onClose, onSave, editingPurchase, favoriteItems }) => {
  const [form, setForm] = useState({
    itemName: '', quantity: '1', unit: 'قطعة', unitPrice: '',
    category: 'بقالة', store: 'othaim', date: getLocalISODate(), notes: ''
  });
  const [errors, setErrors] = useState({});
  
  useEffect(() => {
    if (editingPurchase) {
      setForm({
        itemName: editingPurchase.itemName || '',
        quantity: String(editingPurchase.quantity || 1),
        unit: editingPurchase.unit || 'قطعة',
        unitPrice: String(editingPurchase.unitPrice || ''),
        category: editingPurchase.category || 'بقالة',
        store: editingPurchase.store || 'othaim',
        date: editingPurchase.date || getLocalISODate(),
        notes: editingPurchase.notes || ''
      });
    } else {
      setForm({
        itemName: '', quantity: '1', unit: 'قطعة', unitPrice: '',
        category: 'بقالة', store: 'othaim', date: getLocalISODate(), notes: ''
      });
    }
    setErrors({});
  }, [editingPurchase, isOpen]);
  
  const total = parseNumberInput(form.unitPrice) * (parseNumberInput(form.quantity) || 1);
  const catInfo = SHOPPING_CATEGORIES[form.category] || SHOPPING_CATEGORIES['أخرى'];
  const quickChips = catInfo?.items?.slice(0, 15) || [];
  
  const handleSubmit = (e) => {
    e.preventDefault();
    const newErrors = {};
    if (!form.itemName.trim()) newErrors.itemName = 'اسم الصنف مطلوب';
    if (!form.unitPrice || parseNumberInput(form.unitPrice) <= 0) newErrors.unitPrice = 'السعر مطلوب';
    
    if (Object.keys(newErrors).length > 0) {
      setErrors(newErrors);
      return;
    }
    
    onSave({
      ...form,
      quantity: parseNumberInput(form.quantity) || 1,
      unitPrice: parseNumberInput(form.unitPrice),
      totalPrice: total
    });
  };
  
  if (!isOpen) return null;
  
  return (
    <Modal 
      isOpen={true} 
      onClose={onClose} 
      title={editingPurchase ? 'تعديل مشترى' : 'إضافة مشترى'} 
      icon="🛒"
      size="lg"
    >
      <form onSubmit={handleSubmit} className="space-y-3">
        <div>
          <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>اسم الصنف *</label>
          <input 
            type="text"
            className={`input-field font-bold ${errors.itemName ? 'error' : ''}`}
            value={form.itemName}
            onChange={e => setForm({ ...form, itemName: e.target.value })}
            autoFocus
          />
          {errors.itemName && <p className="text-[10px] text-red-500 mt-1">{errors.itemName}</p>}
        </div>
        
        {favoriteItems.length > 0 && !editingPurchase && (
          <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
            <p className="text-[10px] font-bold mb-1.5" style={{ color: 'var(--text-secondary)' }}>⭐ المفضلة</p>
            <div className="flex flex-wrap gap-1 max-h-20 overflow-y-auto scroll-hide">
              {favoriteItems.slice(0, 15).map(fav => (
                <button key={fav} type="button" onClick={() => setForm({ ...form, itemName: fav })} className="quick-chip text-[10px] py-1 px-2">
                  {fav}
                </button>
              ))}
            </div>
          </div>
        )}
        
        <div>
          <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المتجر *</label>
          <div className="grid grid-cols-3 gap-2">
            {Object.entries(STORES).map(([id, s]) => (
              <button
                key={id}
                type="button"
                onClick={() => setForm({ ...form, store: id })}
                className={`p-2.5 rounded-lg text-xs font-bold transition-all border-2 ${form.store === id ? 'border-current' : 'border-transparent'}`}
                style={form.store === id 
                  ? { background: `${s.color}20`, borderColor: s.color, color: s.color } 
                  : { background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}
              >
                <div className="flex flex-col items-center gap-1">
                  <span className="text-2xl">{s.emoji}</span>
                  <span>{s.name}</span>
                </div>
              </button>
            ))}
          </div>
        </div>
        
        <div>
          <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الفئة</label>
          <select 
            className="input-field text-sm font-bold"
            value={form.category}

          >

        {quickChips.length > 0 && (

              {quickChips.map(chip => (
                <button key={chip} type="button" onClick={() => setForm({ ...form, itemName: chip })} className="quick-chip text-[10px] py-1 px-2">
                  {chip}
                </button>
              ))}
            </div>
          </div>
        )}
        
        <div className="grid grid-cols-2 gap-2.5">
          <div>
            <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الكمية *</label>
            <input 
              type="text"
              inputMode="decimal"
              className="input-field text-center font-black text-blue-600"
              value={form.quantity}
              onChange={e => setForm({ ...form, quantity: e.target.value })}
            />
          </div>
          <div>
            <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الوحدة</label>
            <select 
              className="input-field text-sm font-bold"
              value={form.unit}
              onChange={e => setForm({ ...form, unit: e.target.value })}
            >
              {UNIT_OPTIONS.map(u => <option key={u} value={u}>{u}</option>)}
            </select>
          </div>
        </div>
        
        <div>
          <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>سعر الوحدة * ({CURRENCY})</label>
          <input 
            type="text"
            inputMode="decimal"
            className={`input-field text-center font-black text-emerald-600 text-xl py-3 ${errors.unitPrice ? 'error' : ''}`}
            value={form.unitPrice}
            onChange={e => setForm({ ...form, unitPrice: e.target.value })}
          />
          {errors.unitPrice && <p className="text-[10px] text-red-500 mt-1">{errors.unitPrice}</p>}
        </div>
        
        {total > 0 && (
          <div className="p-3 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 flex justify-between items-center">
            <span className="text-xs font-bold text-emerald-700 dark:text-emerald-400">الإجمالي</span>
            <span className="text-2xl font-black text-emerald-600">{fmt(total)} {CURRENCY}</span>
          </div>
        )}
        
        <div>
          <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>التاريخ</label>
          <input 
            type="date"
            className="input-field text-sm font-bold"
            value={form.date}
            onChange={e => setForm({ ...form, date: e.target.value })}
          />
        </div>
        
        <div>
          <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>ملاحظات</label>
          <textarea 
            className="input-field text-xs"
            rows={2}
            value={form.notes}
            onChange={e => setForm({ ...form, notes: e.target.value })}
          />
        </div>
        
        <div className="flex gap-2 pt-2">
          <button type="button" onClick={onClose} className="btn btn-secondary flex-1 text-sm">
            إلغاء
          </button>
          <button type="submit" className="btn btn-primary flex-1 text-sm">
            <Save size={14} /> {editingPurchase ? 'تحديث' : 'إضافة'}
          </button>
        </div>
      </form>
    </Modal>
  );
});

/* ═══════════════════════════════════════════════════════════════
   APP COMPONENT
   ═══════════════════════════════════════════════════════════════ */
function App() {
  const now = new Date();
  const [state, dispatch] = useReducer(appReducer, {
    data: getInitialData(),
    activeTab: 'home',
    selectedYear: now.getFullYear(),
    selectedMonth: ALL_MONTHS[now.getMonth()],
    isFormOpen: false,
    editingPurchase: null,
    isDarkMode: localStorage.getItem('shopping_theme') === 'dark',
    notifications: [],
    confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false }
  });
  
  const { 
    data, activeTab, selectedYear, selectedMonth, 
    isFormOpen, editingPurchase, isDarkMode, notifications, confirmDialog
  } = state;
  
  const { purchases = [], shoppingList = [], favoriteItems = [] } = data || {};
  
  // ✅ متغيرات المزامنة
  const [syncStatus, setSyncStatus] = useState('pending');
  const [isSyncing, setIsSyncing] = useState(true);
  const hasReceivedInitialSnapshot = useRef(false);
  const lastRemoteRef = useRef(null);
  const isSavingRef = useRef(false);
  const saveTimeoutRef = useRef(null);
  
  const addNotification = useCallback((n) => 
    dispatch({ type: 'ADD_NOTIFICATION', payload: n }), []);
  
  const removeNotification = useCallback((id) => 
    dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }), []);
  
  /* ═══════════════════════════════════════════════════════════════
     ✅ 1) استقبل البيانات من Firebase (Source of Truth)
     ═══════════════════════════════════════════════════════════════ */
  useEffect(() => {
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
    
    // timeout: لو Firebase اتأخر → localStorage
    const timeoutId = setTimeout(() => {
      if (!hasReceivedInitialSnapshot.current) {
        console.warn('⚠️ Firebase اتأخر — استخدام localStorage');
        const local = getLocalData();
        if (local) dispatch({ type: 'SET_DATA', payload: local });
        hasReceivedInitialSnapshot.current = true;
        setSyncStatus('offline');
        setIsSyncing(false);
      }
    }, 8000);
    
    const unsub = docRef.onSnapshot((doc) => {
      if (timeoutId) clearTimeout(timeoutId);
      
      if (doc.exists) {
        const remote = doc.data() || {};
        
        // ✅ استخرج المشتريات من Firebase
        let remotePurchases = [];
        
        // الطريقة 1: من shoppingPurchases
        if (Array.isArray(remote.shoppingPurchases)) {
          remotePurchases = remote.shoppingPurchases;
        }
        // الطريقة 2: من transactions (فلترة source === 'shopping-app')
        else if (Array.isArray(remote.transactions)) {
          remotePurchases = remote.transactions
            .filter(t => t.source === 'shopping-app' || (t.id && String(t.id).startsWith('shop-')))
            .map(t => ({
              id: String(t.id || '').replace('shop-', ''),
              itemName: (t.description || 'مشترى').replace(/\s*\([^)]*\)\s*$/, ''),
              quantity: safeNumber(t.quantity, 1),
              unit: t.unit || 'قطعة',
              unitPrice: safeNumber(t.unitPrice, t.amount),
              totalPrice: safeNumber(t.amount),
              category: t.category || 'بقالة',
              store: t.subCategory === 'العثيم' ? 'othaim' 
                   : t.subCategory === 'كازيون' ? 'kazyon' 
                   : 'other',
              date: t.date,
              month: t.month,
              year: t.year,
              monthIndex: t.monthIndex,
              notes: '',
              createdAt: t.createdAt
            }));
        }
        
        // ✅ ادمج مع باقي بيانات Shopping
        const mergedData = {
          purchases: remotePurchases,
          shoppingList: Array.isArray(remote.shoppingList) ? remote.shoppingList : [],
          budgets: remote.shoppingBudgets && typeof remote.shoppingBudgets === 'object' ? remote.shoppingBudgets : {},
          favoriteItems: Array.isArray(remote.shoppingFavorites) ? remote.shoppingFavorites : [],
          autoSyncToWallet: remote.autoSyncToWallet !== false
        };
        
        const incoming = JSON.stringify(mergedData);
        if (lastRemoteRef.current === incoming && hasReceivedInitialSnapshot.current) return;
        lastRemoteRef.current = incoming;
        
        hasReceivedInitialSnapshot.current = true;
        setSyncStatus('ready');
        setIsSyncing(false);
        dispatch({ type: 'SET_DATA', payload: mergedData });
        
        // ✅ حدّث localStorage كـ cache
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(mergedData)); } catch (e) {}
        
        console.log('☁️ تم استقبال المشتريات من Firebase:', remotePurchases.length);
      } else {
        // أول مرة — Firebase فاضي
        hasReceivedInitialSnapshot.current = true;
        setSyncStatus('ready');
        setIsSyncing(false);
        const local = getLocalData();
        if (local) dispatch({ type: 'SET_DATA', payload: local });
      }
    }, (error) => {
      console.error('❌ Firebase error:', error);
      if (!hasReceivedInitialSnapshot.current) {
        hasReceivedInitialSnapshot.current = true;
        setSyncStatus('offline');
        setIsSyncing(false);
        const local = getLocalData();
        if (local) dispatch({ type: 'SET_DATA', payload: local });
      }
    });
    
    return () => { 
      unsub(); 
      if (timeoutId) clearTimeout(timeoutId);
    };
  }, []);
  
  /* ═══════════════════════════════════════════════════════════════
     ✅ 2) احفظ التغييرات (localStorage فوراً + Firebase debounced)
     ═══════════════════════════════════════════════════════════════ */
  useEffect(() => {
    if (!hasReceivedInitialSnapshot.current) return;
    
    // localStorage فوراً
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    
    // Firebase — debounce 3 ثواني
    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(async () => {
      if (isSavingRef.current) return;
      isSavingRef.current = true;
      setSyncStatus('pending');
      
      try {
        const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
        
        // اقرأ السيرفر
        const doc = await docRef.get();
        const remote = doc.exists ? (doc.data() || {}) : {};
        
        // ✅ حوّل المشتريات لـ transactions
        const shoppingTransactions = (data.purchases || []).map(p => {
          const storeInfo = STORES[p.store] || STORES.other;
          return {
            id: 'shop-' + p.id,
            type: 'expense',
            kind: 'operational',
            category: 'كازيون / العثيم',
            subCategory: storeInfo.name,
            amount: safeNumber(p.totalPrice),
            quantity: safeNumber(p.quantity),
            unitPrice: safeNumber(p.unitPrice),
            description: `${p.itemName} (${storeInfo.name})`,
            source: 'shopping-app',
            sourceLabel: 'العثيم وكازيون',
            method: 'cash',
            date: p.date,
            month: p.month,
            year: p.year,
            monthIndex: p.monthIndex,
            subType: 'withdrawal',
            status: 'pending',
            createdAt: p.createdAt ? new Date(p.createdAt).getTime() : Date.now(),
            receipts: []
          };
        });
        
        // ✅ دمج ذكي للـ transactions
        const mergeTransactions = (remoteTx, localShopTx) => {
          const map = new Map();
          remoteTx.forEach(t => { if (t?.id) map.set(t.id, t); });
          localShopTx.forEach(t => { if (t?.id) map.set(t.id, t); });
          
          const localShopIds = new Set(localShopTx.map(t => t.id));
          const remoteShopTx = remoteTx.filter(t => 
            t.source === 'shopping-app' || String(t.id || '').startsWith('shop-')
          );
          remoteShopTx.forEach(t => {
            if (!localShopIds.has(t.id)) map.delete(t.id);
          });
          
          return Array.from(map.values());
        };
        
        const finalTransactions = mergeTransactions(remote.transactions || [], shoppingTransactions);
        
        // ✅ احفظ
        await docRef.set({
          transactions: finalTransactions,
          shoppingPurchases: data.purchases || [],
          shoppingList: data.shoppingList || [],
          shoppingBudgets: data.budgets || {},
          shoppingFavorites: data.favoriteItems || [],
          autoSyncToWallet: data.autoSyncToWallet !== false,
          lastShoppingUpdate: Date.now()
        }, { merge: true });
        
        lastRemoteRef.current = JSON.stringify(data);
        setSyncStatus('ready');
        console.log('☁️ تم رفع المشتريات على Firebase:', (data.purchases || []).length);
      } catch (err) {
        console.error('Firebase save error:', err);
        setSyncStatus('offline');
      } finally {
        isSavingRef.current = false;
      }
    }, 3000);
    
    return () => clearTimeout(saveTimeoutRef.current);
  }, [data]);
  
  /* ═══════════════════════════════════════════════════════════════
     ✅ 3) Theme
     ═══════════════════════════════════════════════════════════════ */
  useEffect(() => {
    document.documentElement.classList.toggle('dark', isDarkMode);
    localStorage.setItem('shopping_theme', isDarkMode ? 'dark' : 'light');
  }, [isDarkMode]);
  
  /* ═══════════════════════════════════════════════════════════════
     ✅ 4) Add Purchase
     ═══════════════════════════════════════════════════════════════ */
  const handleAddPurchase = useCallback(async (formData) => {
    try {
      const d = parseISODate(formData.date) || new Date();
      const txYear = d.getFullYear();
      const txMonth = ALL_MONTHS[d.getMonth()];
      
      const newPurchase = {
        id: getSafeId(),
        itemName: formData.itemName,
        quantity: formData.quantity,
        unit: formData.unit,
        unitPrice: formData.unitPrice,
        totalPrice: formData.totalPrice,
        category: formData.category,
        store: formData.store || 'othaim',
        date: formData.date,
        month: txMonth,
        year: txYear,
        monthIndex: d.getMonth(),
        notes: formData.notes || '',
        createdAt: new Date().toISOString()
      };
      
      const newPurchases = [newPurchase, ...purchases];
      dispatch({ type: 'SET_DATA', payload: { purchases: newPurchases } });
      
      addNotification({ 
        type: 'success', 
        title: 'تم الحفظ',
        message: `${formData.itemName} — ${fmt(formData.totalPrice)} ${CURRENCY}`
      });
      
      dispatch({ type: 'SET_FORM_OPEN', payload: false });
      dispatch({ type: 'SET_EDITING_PURCHASE', payload: null });
      
      // Auto-favorite
      const itemCount = newPurchases.filter(p => 
        normalizeText(p.itemName) === normalizeText(formData.itemName)
      ).length;
      if (itemCount >= 3 && !favoriteItems.includes(formData.itemName)) {
        dispatch({ type: 'SET_DATA', payload: { favoriteItems: [...favoriteItems, formData.itemName] } });
      }
    } catch (err) {
      console.error('Add error:', err);
      addNotification({ type: 'error', title: 'فشل الحفظ', message: err.message });
    }
  }, [purchases, favoriteItems, addNotification]);
  
  /* ═══════════════════════════════════════════════════════════════
     ✅ 5) Update Purchase
     ═══════════════════════════════════════════════════════════════ */
  const handleUpdatePurchase = useCallback(async (formData) => {
    try {
      const d = parseISODate(formData.date) || new Date();
      const txYear = d.getFullYear();
      const txMonth = ALL_MONTHS[d.getMonth()];
      
      const updatedPurchase = {
        ...editingPurchase,
        itemName: formData.itemName,
        quantity: formData.quantity,
        unit: formData.unit,
        unitPrice: formData.unitPrice,
        totalPrice: formData.totalPrice,
        category: formData.category,
        store: formData.store,
        date: formData.date,
        month: txMonth,
        year: txYear,
        monthIndex: d.getMonth(),
        notes: formData.notes,
        updatedAt: new Date().toISOString()
      };
      
      const newPurchases = purchases.map(p => p.id === editingPurchase.id ? updatedPurchase : p);
      dispatch({ type: 'SET_DATA', payload: { purchases: newPurchases } });
      
      addNotification({ type: 'success', title: 'تم التحديث' });
      dispatch({ type: 'SET_FORM_OPEN', payload: false });
      dispatch({ type: 'SET_EDITING_PURCHASE', payload: null });
    } catch (err) {
      addNotification({ type: 'error', title: 'فشل التحديث', message: err.message });
    }
  }, [purchases, editingPurchase, addNotification]);
  
  /* ═══════════════════════════════════════════════════════════════
     ✅ 6) Delete Purchase
     ═══════════════════════════════════════════════════════════════ */
  const handleDeletePurchase = useCallback((id) => {
    const purchase = purchases.find(p => p.id === id);
    if (!purchase) return;
    
    dispatch({
      type: 'SHOW_CONFIRM',
      danger: true,
      title: 'حذف المشترى',
      message: `هيتم حذف "${purchase.itemName}" من التطبيق والمزامنة.`,
      onConfirm: () => {
        dispatch({ type: 'SET_DATA', payload: { purchases: purchases.filter(p => p.id !== id) } });
        addNotification({ type: 'success', title: 'تم الحذف' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  }, [purchases, addNotification]);
  
  /* ═══════════════════════════════════════════════════════════════
     ✅ 7) Toggle Favorite
     ═══════════════════════════════════════════════════════════════ */
  const handleToggleFavorite = useCallback((purchase) => {
    const itemName = purchase.itemName;
    const isFav = favoriteItems.includes(itemName);
    const newFavs = isFav 
      ? favoriteItems.filter(f => f !== itemName)
      : [...favoriteItems, itemName];
    
    dispatch({ type: 'SET_DATA', payload: { favoriteItems: newFavs } });
    addNotification({ 
      type: 'success', 
      title: isFav ? 'تم إزالته من المفضلة' : 'تمت الإضافة للمفضلة'
    });
  }, [favoriteItems, addNotification]);
  
  /* ═══════════════════════════════════════════════════════════════
     ✅ 8) Shopping List
     ═══════════════════════════════════════════════════════════════ */
  const handleAddListItem = useCallback((item) => {
    const newItem = {
      id: getSafeId(),
      text: item.text,
      completed: false,
      createdAt: new Date().toISOString()
    };
    dispatch({ type: 'SET_DATA', payload: { shoppingList: [newItem, ...shoppingList] } });
  }, [shoppingList]);
  
  const handleToggleListItem = useCallback((id) => {
    const newList = shoppingList.map(i => 
      i.id === id ? { ...i, completed: !i.completed, completedAt: !i.completed ? new Date().toISOString() : null } : i
    );
    dispatch({ type: 'SET_DATA', payload: { shoppingList: newList } });
  }, [shoppingList]);
  
  const handleDeleteListItem = useCallback((id) => {
    dispatch({ type: 'SET_DATA', payload: { shoppingList: shoppingList.filter(i => i.id !== id) } });
  }, [shoppingList]);
  
  const handleClearCompleted = useCallback(() => {
    dispatch({ type: 'SET_DATA', payload: { shoppingList: shoppingList.filter(i => !i.completed) } });
    addNotification({ type: 'success', title: 'تم مسح المكتمل' });
  }, [shoppingList, addNotification]);
  
  /* ═══════════════════════════════════════════════════════════════
     ✅ 9) Export / Import
     ═══════════════════════════════════════════════════════════════ */
  const handleExport = useCallback(() => {
    const blob = new Blob([JSON.stringify({ data, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `otan_kazyon_backup_${getLocalISODate()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    addNotification({ type: 'success', title: 'تم التصدير' });
  }, [data, addNotification]);
  
  const handleImport = useCallback((e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        if (parsed.data) {
          const migrated = migrateData(parsed.data);
          dispatch({ type: 'SET_DATA', payload: migrated });
          addNotification({ type: 'success', title: 'تم الاستيراد' });
        }
      } catch {
        addNotification({ type: 'error', title: 'ملف غير صالح' });
      }
    };
    reader.readAsText(file);
  }, [addNotification]);
  
  const handleClearAll = useCallback(() => {
    dispatch({
      type: 'SHOW_CONFIRM',
      danger: true,
      title: 'مسح كل المشتريات',
      message: 'هيتم مسح كل المشتريات من التطبيق والمزامنة.',
      onConfirm: () => {
        dispatch({ type: 'SET_DATA', payload: { purchases: [], favoriteItems: [] } });
        addNotification({ type: 'success', title: 'تم المسح' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  }, [addNotification]);
  
  /* ═══════════════════════════════════════════════════════════════
     ✅ 10) Render Active View
     ═══════════════════════════════════════════════════════════════ */
  const renderActiveView = () => {
    switch (activeTab) {
      case 'home':
        return (
          <HomeView
            purchases={purchases}
            selectedYear={selectedYear}
            selectedMonth={selectedMonth}
            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })}
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })}
            favorites={favoriteItems}
            onToggleFavorite={handleToggleFavorite}
            onDelete={handleDeletePurchase}
            onEdit={(p) => {
              dispatch({ type: 'SET_EDITING_PURCHASE', payload: p });
              dispatch({ type: 'SET_FORM_OPEN', payload: true });
            }}
          />
        );
      case 'reports':
        return <ReportsView purchases={purchases} selectedYear={selectedYear} selectedMonth={selectedMonth} />;
      case 'list':
        return (
          <ShoppingListView
            shoppingList={shoppingList}
            onAdd={handleAddListItem}
            onToggle={handleToggleListItem}
            onDelete={handleDeleteListItem}
            onClear={handleClearCompleted}
          />
        );
      case 'settings':
        return (
          <SettingsView
            data={data}
            dispatch={dispatch}
            addNotification={addNotification}
            purchases={purchases}
            shoppingList={shoppingList}
            onExport={handleExport}
            onImport={handleImport}
            onClearAll={handleClearAll}
            syncStatus={syncStatus}
          />
        );
      default:
        return null;
    }
  };
  
  /* ═══════════════════════════════════════════════════════════════
     ✅ 11) Loading Screen
     ═══════════════════════════════════════════════════════════════ */
  if (isSyncing && purchases.length === 0) {
    return (
      <div className="flex h-screen flex-col items-center justify-center" style={{ background: 'var(--bg-app)' }}>
        <div style={{ width: '48px', height: '48px', border: '3px solid var(--border-default)', borderRadius: '50%', borderTopColor: 'var(--brand)', animation: 'spin 0.8s linear infinite' }}></div>
        <p className="mt-4 font-bold text-sm" style={{ color: 'var(--text-secondary)' }}>جاري تحميل المشتريات...</p>
        <p className="text-xs mt-1" style={{ color: 'var(--text-muted)' }}>من السحابة ☁️</p>
      </div>
    );
  }
  
  /* ═══════════════════════════════════════════════════════════════
     ✅ 12) Render
     ═══════════════════════════════════════════════════════════════ */
  return (
    <div className="flex flex-col h-screen overflow-hidden font-sans">
      
      {/* Sync Indicator */}
      <SyncIndicator status={syncStatus} />
      
      {/* Header */}
      <div className="pt-3 pb-2 px-3" style={{ background: 'var(--bg-card)', borderBottom: '1px solid var(--border-subtle)' }}>
        <div className="flex justify-between items-center">
          <div className="flex items-center gap-2">
            <div className="p-2 rounded-lg text-white shadow-sm" style={{ background: 'var(--brand)' }}>
              <ShoppingCart size={18} />
            </div>
            <div>
              <h1 className="text-base font-black">مشترياتي</h1>
              <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                {purchases.length} مشترى • {shoppingList.filter(i => !i.completed).length} في القائمة
              </p>
            </div>
          </div>
          <div className="flex gap-1.5">
            <a 
              href="index.html" 
              title="المحفظة" 
              className="btn text-[11px] py-1.5 px-2.5" 
              style={{ background: 'var(--bg-muted)', color: 'var(--text-primary)', border: '1px solid var(--border-default)' }}
            >
              💰
            </a>
            <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <button 
                type="button" 
                onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: false })} 
                className={`p-1.5 rounded-md transition-all ${!isDarkMode ? 'shadow-sm' : ''}`} 
                style={!isDarkMode ? { background: 'var(--bg-card)', color: 'var(--brand)' } : { color: 'var(--text-muted)' }}
              >
                <Sun size={12} />
              </button>
              <button 
                type="button" 
                onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: true })} 
                className={`p-1.5 rounded-md transition-all ${isDarkMode ? 'shadow-sm' : ''}`} 
                style={isDarkMode ? { background: 'var(--bg-card)', color: 'var(--brand)' } : { color: 'var(--text-muted)' }}
              >
                <Moon size={12} />
              </button>
            </div>
          </div>
        </div>
      </div>
      
      {/* Main Content */}
      <main className="flex-1 overflow-y-auto p-3">
        <div className="max-w-2xl mx-auto">
          
          {activeTab === 'home' && (
            <div className="mb-4">
              <QuickAddBar onAdd={handleAddPurchase} />
            </div>
          )}
          
          {renderActiveView()}
        </div>
      </main>
      
      {/* Bottom Navigation */}
      <div className="bottom-nav-container">
        <div className="scrollable-nav scroll-hide">
          {[
            { id: 'home', label: 'الرئيسية', icon: Home },
            { id: 'list', label: 'القائمة', icon: ListChecks, badge: shoppingList.filter(i => !i.completed).length },
            { id: 'reports', label: 'التقارير', icon: BarChart3 },
            { id: 'settings', label: 'الإعدادات', icon: SettingsIcon }
          ].map(item => {
            const Icon = item.icon;
            const isActive = activeTab === item.id;
            return (
              <button
                key={item.id}
                type="button"
                onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })}
                className={`nav-btn relative ${isActive ? 'active' : ''}`}
              >
                <Icon size={19} />
                <span>{item.label}</span>
                {item.badge > 0 && (
                  <span className="absolute top-1 right-1 bg-red-500 text-white text-[9px] rounded-full w-4 h-4 flex items-center justify-center font-black">
                    {item.badge > 9 ? '9+' : item.badge}
                  </span>
                )}
              </button>
            );
          })}
        </div>
      </div>
      
      {/* FAB */}
      {activeTab === 'home' && (
        <button
          type="button"
          onClick={() => {
            dispatch({ type: 'SET_EDITING_PURCHASE', payload: null });
            dispatch({ type: 'SET_FORM_OPEN', payload: true });
          }}
          className="fab"
        >
          <Plus size={22} />
        </button>
      )}
      
      {/* Modals */}
      {isFormOpen && (
        <AddPurchaseModal
          isOpen={true}
          onClose={() => {
            dispatch({ type: 'SET_FORM_OPEN', payload: false });
            dispatch({ type: 'SET_EDITING_PURCHASE', payload: null });
          }}
          onSave={editingPurchase ? handleUpdatePurchase : handleAddPurchase}
          editingPurchase={editingPurchase}
          favoriteItems={favoriteItems}
        />
      )}
      
      <ToastContainer notifications={notifications} removeNotification={removeNotification} />
      <ConfirmDialog confirmDialog={confirmDialog} dispatch={dispatch} />
      
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════ */
const rootElement = document.getElementById('root');
if (rootElement) {
  createRoot(rootElement).render(<App />);
  setTimeout(() => {
    const l = document.getElementById('loading');
    if (l) { l.style.transition = 'opacity 0.35s ease'; l.style.opacity = '0'; setTimeout(() => { l.style.display = 'none'; }, 350); }
  }, 500);
}
</script>
</body>
</html>
