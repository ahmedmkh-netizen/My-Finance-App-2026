/* ═══════════════════════════════════════════════════════
   🎨 DESIGN SYSTEM v3.1 — Friendly Professional
   ═══════════════════════════════════════════════════════ */
:root {
  /* Base */
  --bg-app: #FEF6EC;
  --bg-app-end: #FCE9D0;
  --bg-card: #FFFFFF;
  --bg-muted: #FAF3E8;
  --bg-elevated: #FFFFFF;

  /* Borders */
  --border-subtle: rgba(217, 119, 6, 0.08);
  --border-default: rgba(217, 119, 6, 0.14);
  --border-strong: rgba(217, 119, 6, 0.24);

  /* Text */
  --text-primary: #5B2E0F;
  --text-secondary: #7C3A0E;
  --text-muted: #A16207;
  --text-inverse: #FFFFFF;

  /* Brand */
  --brand: #F97316;
  --brand-dark: #EA580C;
  --brand-light: #FB923C;
  --brand-soft: rgba(249, 115, 22, 0.12);
  --brand-glow: rgba(249, 115, 22, 0.35);

  /* Semantic */
  --success: #10B981;
  --success-soft: rgba(16, 185, 129, 0.12);
  --danger: #EF4444;
  --danger-soft: rgba(239, 68, 68, 0.10);
  --info: #3B82F6;
  --info-soft: rgba(59, 130, 246, 0.10);

  /* Shadows — softer, tinted */
  --shadow-sm: 0 1px 3px rgba(120, 53, 15, 0.06), 0 1px 2px rgba(120, 53, 15, 0.04);
  --shadow-md: 0 8px 24px -6px rgba(120, 53, 15, 0.10), 0 4px 8px -2px rgba(120, 53, 15, 0.06);
  --shadow-lg: 0 20px 40px -12px rgba(120, 53, 15, 0.16), 0 8px 16px -6px rgba(120, 53, 15, 0.08);
  --shadow-xl: 0 32px 64px -16px rgba(120, 53, 15, 0.20);

  /* Radii — more generous */
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-xl: 28px;
  --radius-full: 999px;

  /* Motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  --font: 'Cairo', system-ui, -apple-system, sans-serif;
}

/* Themes per user — softer palette */
body.theme-ans {
  --bg-app: #EFF6FF; --bg-app-end: #DBEAFE;
  --text-primary: #1E3A8A; --text-secondary: #1E40AF; --text-muted: #3B82F6;
  --brand: #3B82F6; --brand-dark: #2563EB; --brand-light: #60A5FA;
  --brand-soft: rgba(59, 130, 246, 0.12);
  --brand-glow: rgba(59, 130, 246, 0.35);
  --border-subtle: rgba(30, 64, 175, 0.06);
  --border-default: rgba(30, 64, 175, 0.12);
}
body.theme-abdelrahman {
  --bg-app: #ECFDF5; --bg-app-end: #D1FAE5;
  --text-primary: #064E3B; --text-secondary: #065F46; --text-muted: #10B981;
  --brand: #10B981; --brand-dark: #059669; --brand-light: #34D399;
  --brand-soft: rgba(16, 185, 129, 0.12);
  --brand-glow: rgba(16, 185, 129, 0.35);
  --border-subtle: rgba(6, 78, 59, 0.06);
  --border-default: rgba(6, 78, 59, 0.12);
}
body.theme-salma {
  --bg-app: #F5F3FF; --bg-app-end: #EDE9FE;
  --text-primary: #4C1D95; --text-secondary: #5B21B6; --text-muted: #8B5CF6;
  --brand: #8B5CF6; --brand-dark: #7C3AED; --brand-light: #A78BFA;
  --brand-soft: rgba(139, 92, 246, 0.12);
  --brand-glow: rgba(139, 92, 246, 0.35);
  --border-subtle: rgba(76, 29, 149, 0.06);
  --border-default: rgba(76, 29, 149, 0.12);
}
body.theme-om_abdo {
  --bg-app: #FFF1F2; --bg-app-end: #FCE7F3;
  --text-primary: #831843; --text-secondary: #9F1239; --text-muted: #EC4899;
  --brand: #EC4899; --brand-dark: #DB2777; --brand-light: #F472B6;
  --brand-soft: rgba(236, 72, 153, 0.12);
  --brand-glow: rgba(236, 72, 153, 0.35);
  --border-subtle: rgba(131, 24, 67, 0.06);
  --border-default: rgba(131, 24, 67, 0.12);
}

body.dark {
  --bg-app: #1A1B2E;
  --bg-app-end: #141527;
  --bg-card: #242538;
  --bg-muted: #2E2F45;
  --bg-elevated: #2E2F45;
  --border-subtle: rgba(255, 255, 255, 0.05);
  --border-default: rgba(255, 255, 255, 0.10);
  --border-strong: rgba(255, 255, 255, 0.18);
  --text-primary: #F5F3FF;
  --text-secondary: #C7C5DC;
  --text-muted: #8B8AA0;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 8px 24px -6px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
  --shadow-xl: 0 32px 64px -16px rgba(0, 0, 0, 0.7);
}

/* ═══════════════ RESET ═══════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  font-weight: 600;
  color: var(--text-primary);
  background: linear-gradient(160deg, var(--bg-app) 0%, var(--bg-app-end) 100%);
  min-height: 100dvh;
  padding: 0 0 calc(100px + env(safe-area-inset-bottom)) 0;
  transition: background 0.4s var(--ease-out), color 0.3s;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 999px; }
::-webkit-scrollbar-track { background: transparent; }
button { font-family: var(--font); }
input, textarea { font-family: var(--font); }

/* ═══════════════ OFFLINE ═══════════════ */
.offline-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2000;
  background: linear-gradient(90deg, #DC2626, #B91C1C);
  color: white; text-align: center;
  font-size: 12px; font-weight: 800; padding: 8px;
  display: none; letter-spacing: 0.03em;
  border-radius: 0 0 12px 12px;
}
.offline-banner.show { display: block; animation: slideDown 0.3s var(--ease-out); }
@keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

/* ═══════════════ HEADER ═══════════════ */
.app-header {
  position: sticky; top: 0; z-index: 100;
  padding: 20px 20px 22px;
  border-radius: 0 0 var(--radius-xl) var(--radius-xl);
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
  color: white;
  box-shadow: 0 12px 32px -8px var(--brand-glow);
  margin-bottom: 16px;
  transition: background 0.3s;
  position: relative;
  overflow: hidden;
}
.app-header::before {
  content: '';
  position: absolute;
  top: -50%; right: -20%;
  width: 240px; height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
  pointer-events: none;
}
.app
