  .toast {

    background: #10B981; color: white; padding: 12px 24px; border-radius: 14px;
    font-weight: 900; font-size: 14px; z-index: 10000;

  .toast.error { background: #DC2626; }
  @keyframes slideDown {
    from { opacity: 0; transform: translate(-50%, -20px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }

  .shake { animation: shake 0.4s ease-in-out; }

<script>

const CATEGORIES = {

};

const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

/* ═══════════════════════════════════════════════════════ */

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCEq-Trf1oFsvPF5tlMvqU83ea_J2DLZjs",
  authDomain: "finance-app-2026-3e318.firebaseapp.com",
  projectId: FIREBASE_PROJECT,
  storageBucket: "finance-app-2026-3e318.firebasestorage.app",
  messagingSenderId: "855414629770",
  appId: "1:855414629770:web:8bb07198b8245b63781473"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection('finance_2026').doc('user_ahmed_data');

// State
let currentUser = null;
let selectedItem = '';
let selectedCategory = 'smokes';
let currentPin = '';
let unsubscribe = null;
let cachedTx = [];

// Helpers
const getLocalISODate = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const fmt = (n) => Number(n || 0).toLocaleString('en-US');

function showToast(msg, isError = false) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function escapeHtml(s) {
  if (typeof s !== 'string') return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══════════════ PIN ═══════════════ */
const pinScreen = document.getElementById('pinScreen');
const pinError = document.getElementById('pinError');

document.getElementById('pinPad').addEventListener('click', (e) => {
  const btn = e.target.closest('.pin-btn');
  if (!btn) return;
  const d = btn.dataset.d;
  if (d === 'del') {
    currentPin = currentPin.slice(0, -1);
  } else if (currentPin.length < 4) {
    currentPin += d;
  }
  renderPinDots();
  if (currentPin.length === 4) setTimeout(checkPin, 180);
});

function renderPinDots() {
  document.querySelectorAll('.pin-dot').forEach((dot, i) => {
    dot.classList.toggle('filled', i < currentPin.length);
  });
}

function checkPin() {
  const user = USERS[currentPin];
  if (user) {
    sessionStorage.setItem('family_pin', currentPin);
    currentUser = user;
    pinScreen.style.display = 'none';
    init();
  } else {
    pinScreen.classList.add('shake');
    pinError.textContent = 'رمز غير معروف، حاول مرة أخرى';
    setTimeout(() => {
      currentPin = '';
      renderPinDots();
      pinScreen.classList.remove('shake');
      pinError.textContent = '';
    }, 700);
  }
}

// تخطي PIN لو مسجّل في نفس الجلسة
(function restoreSession() {
  const saved = sessionStorage.getItem('family_pin');
  if (saved && USERS[saved]) {
    currentUser = USERS[saved];
    pinScreen.style.display = 'none';
    init();
  }
})();

/* ═══════════════ التطبيق ═══════════════ */
function init() {
  if (!currentUser) return;

  // تطبيق الثيم
  document.body.classList.add('theme-' + currentUser.id);

  // الهيدر
  document.getElementById('mainScreen').style.display = 'block';
  document.getElementById('greeting').textContent =
    `${currentUser.emoji} أهلاً ${currentUser.name}`;
  document.getElementById('todayDate').textContent =
    new Date().toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('family_pin');
    location.reload();
  });

  renderCategories();
  renderItems();
  bindEvents();
  subscribeToData();
}

function renderCategories() {
  const row = document.getElementById('categoriesRow');
  row.innerHTML = Object.entries(CATEGORIES).map(([key, cat]) =>
    `<button class="cat-btn ${key === selectedCategory ? 'active' : ''}" data-cat="${key}">${cat.icon} ${cat.label}</button>`
  ).join('');
}

function renderItems() {
  const cat = CATEGORIES[selectedCategory];
  document.getElementById('itemsSectionTitle').textContent = `${cat.icon} ${cat.label} (${cat.items.length})`;
  const grid = document.getElementById('itemsGrid');
  grid.innerHTML = cat.items.map(item =>
    `<button class="item-btn ${item === selectedItem ? 'selected' : ''}" data-item="${item}">${item}</button>`
  ).join('');
}

function bindEvents() {
  // التنقل بين الفئات
  document.getElementById('categoriesRow').addEventListener('click', (e) => {
    const btn = e.target.closest('.cat-btn');
    if (!btn) return;
    selectedCategory = btn.dataset.cat;
    renderCategories();
    renderItems();
    document.getElementById('amountInput').focus();
  });

  // اختيار بند
  document.getElementById('itemsGrid').addEventListener('click', (e) => {
    const btn = e.target.closest('.item-btn');
    if (!btn) return;
    selectedItem = btn.dataset.item;
    renderItems();
    document.getElementById('amountInput').focus();
  });

  document.getElementById('saveBtn').addEventListener('click', saveTransaction);

  document.getElementById('amountInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveTransaction();
  });

  document.getElementById('amountInput').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/[^\d.]/g, '');
  });
}

/* ═══════════════ الحفظ في Firestore ═══════════════ */
async function saveTransaction() {
  const amountInput = document.getElementById('amountInput');
  const noteInput = document.getElementById('noteInput');
  const saveBtn = document.getElementById('saveBtn');

  if (!selectedItem) return showToast('⚠️ اختر البند أولاً', true);
  const amount = parseFloat(amountInput.value);
  if (!amount || amount <= 0) return showToast('⚠️ أدخل مبلغاً صحيحاً', true);

  const note = noteInput.value.trim();
  const now = new Date();
  const iso = getLocalISODate(now);
  const categoryLabel = CATEGORIES[selectedCategory].label;

  const tx = {
    id: 'fam-' + Date.now() + '-' + Math.random().toString(36).slice(2,9),
    type: 'expense',
    kind: 'operational',
    category: CATEGORY_NAME,
    subCategory: categoryLabel,
    amount: amount,
    description: note ? `${selectedItem} — ${note}` : selectedItem,
    method: 'cash',
    date: iso,
    month: MONTHS_AR[now.getMonth()],
    year: now.getFullYear(),
    monthIndex: now.getMonth(),
    subType: 'withdrawal',
    status: 'pending',
    source: 'family-app',
    createdBy: currentUser.id,
    createdByName: currentUser.name,
    createdAt: Date.now()
  };

  saveBtn.disabled = true;
  saveBtn.textContent = '⏳ جاري الحفظ...';

  try {
    await docRef.set({
      transactions: firebase.firestore.FieldValue.arrayUnion(tx)
    }, { merge: true });

    amountInput.value = '';
    noteInput.value = '';
    selectedItem = '';
    renderItems();

    showToast(`✅ تم الحفظ باسم ${currentUser.name}`);
    if (navigator.vibrate) navigator.vibrate(50);
  } catch (err) {
    console.error(err);
    showToast('❌ فشل الحفظ: ' + err.message, true);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '💾 حفظ العملية';
  }
}

/* ═══════════════ قراءة سجل اليوم ═══════════════ */
function subscribeToData() {
  unsubscribe = docRef.onSnapshot((doc) => {
    if (!doc.exists) return renderTodayLog([]);
    const data = doc.data() || {};
    const today = getLocalISODate();
    cachedTx = (data.transactions || [])
      .filter(t => t.date === today && t.category === CATEGORY_NAME)
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderTodayLog(cachedTx);
  }, (err) => console.error('Snapshot error:', err));
}

function renderTodayLog(txList) {
  const log = document.getElementById('todayLog');
  const totalEl = document.getElementById('todayTotal');
  const totalAmt = document.getElementById('totalAmount');
  const pendingCountEl = document.getElementById('pendingCount');

  if (txList.length === 0) {
    log.innerHTML = '<div class="empty-state">لا توجد مسحوبات اليوم</div>';
    totalEl.style.display = 'none';
    pendingCountEl.textContent = '0';
    return;
  }

  log.innerHTML = txList.map(t => {
    const isMine = t.createdBy === currentUser.id;
    const whoName = t.createdByName || (USERS[t.createdBy] ? USERS[t.createdBy].name : '؟');
    const whoClass = 'who-' + (t.createdBy || 'unknown');
    return `
      <div class="log-item ${isMine ? 'mine' : ''}">
        <span class="desc">
          <span class="who ${whoClass}">${escapeHtml(whoName)}</span>
          ${escapeHtml(t.description || t.category)}
        </span>
        <span class="amount">${fmt(t.amount)} ج.م</span>
        ${isMine ? `<button class="del-btn" data-id="${t.id}" title="حذف">×</button>` : ''}
      </div>
    `;
  }).join('');

  const total = txList.reduce((s, t) => s + Number(t.amount || 0), 0);
  const myTotal = txList.filter(t => t.createdBy === currentUser.id).reduce((s, t) => s + Number(t.amount || 0), 0);
  const pendingCount = txList.filter(t => t.status !== 'paid').length;
  totalAmt.textContent = fmt(total) + ' ج.م';
  totalEl.style.display = 'flex';
  pendingCountEl.textContent = `${pendingCount} معلق • أنا: ${fmt(myTotal)} ج.م`;

  log.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteTransaction(btn.dataset.id));
  });
}

async function deleteTransaction(id) {
  if (!confirm('تأكيد حذف هذه العملية؟')) return;
  try {
    const tx = cachedTx.find(t => t.id === id);
    if (!tx) return showToast('لم يتم العثور عليها', true);
    if (tx.createdBy !== currentUser.id) {
      return showToast('لا يمكنك حذف عملية شخص آخر', true);
    }

    await docRef.set({
      transactions: firebase.firestore.FieldValue.arrayRemove(tx)
    }, { merge: true });

    showToast('🗑️ تم الحذف');
  } catch (err) {
    showToast('فشل الحذف: ' + err.message, true);
  }
}
</script>
