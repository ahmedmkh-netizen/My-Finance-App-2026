/* ═══════════════════════════════════════════════════════════════════
   6) PIN LOCK SCREEN
   ═══════════════════════════════════════════════════════════════════ */
const PinLockScreen = memo(({ onSuccess, onLogout }) => {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);
  const [success, setSuccess] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const [lastPressed, setLastPressed] = useState(null);
  const pressTimerRef = useRef(null);
  const clearTimerRef = useRef(null);
  const navTimerRef = useRef(null);

  useEffect(() => () => {
    if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
    if (navTimerRef.current) clearTimeout(navTimerRef.current);
  }, []);

  const handleDigit = (d) => {
    if (pin.length >= 4 || success) return;
    const next = pin + d;
    setPin(next);
    setLastPressed(d);
    if (navigator.vibrate) navigator.vibrate(8);
    if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    pressTimerRef.current = setTimeout(() => setLastPressed(null), 150);

    if (next.length === 4) {
      if (navTimerRef.current) clearTimeout(navTimerRef.current);
      navTimerRef.current = setTimeout(async () => {
        const ok = await verifyPin(next);
        if (ok) {
          setSuccess(true);
          if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
          try { await savePinSession(next); } catch (e) {}
          navTimerRef.current = setTimeout(() => onSuccess(next), 450);
        } else {
          setError(true);
          if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
          setAttempts((a) => a + 1);
          if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
          clearTimerRef.current = setTimeout(() => {
            setPin("");
            setError(false);
          }, 650);
        }
      }, 150);
    }
  };

  const handleDelete = () => { if (!success) setPin((p) => p.slice(0, -1)); };

  return (
    <div style={{
      minHeight: "100dvh",
      display: "flex", alignItems: "center", justifyContent: "center",
      padding: 24,
      background: "linear-gradient(135deg, #050A14 0%, #0A1628 40%, #1E2B4A 100%)",
    }}>
      <div style={{ width: "100%", maxWidth: 360, textAlign: "center" }}>
        <div style={{ marginBottom: 28 }}>
          <div style={{
            width: 80, height: 80, borderRadius: 24,
            display: "flex", alignItems: "center", justifyContent: "center",
            margin: "0 auto 20px",
            background: success
              ? "rgba(16,185,129,1)"
              : error
                ? "rgba(239,68,68,0.15)"
                : "rgba(99,91,255,0.15)",
            border: error
              ? "2px solid rgba(239,68,68,0.4)"
              : success ? "none" : "2px solid rgba(99,91,255,0.3)",
            transition: "all 0.5s ease",
            boxShadow: success ? "0 20px 40px -8px rgba(16,185,129,0.5)" : "none",
          }}>
            {success ? <CheckCircle2 size={34} color="white" /> :
             error ? <AlertTriangle size={30} color="#F87171" /> :
             <Lock size={30} color="#8B84FF" />}
          </div>
          <h1 style={{
            fontSize: 22, fontWeight: 900, color: "white",
            marginBottom: 4, margin: 0,
          }}>
            {success ? "مرحباً ✓" : error ? "رمز غير صحيح" : "أهلاً بعودتك"}
          </h1>
          <p style={{ fontSize: 12, color: "#64748B", marginTop: 6, margin: 0 }}>
            {success ? "جارٍ الفتح..." : error ? `المحاولة ${attempts}` : "أدخل رمز الدخول"}
          </p>
        </div>

        <div style={{
          display: "flex", justifyContent: "center", gap: 12,
          marginBottom: 28, height: 14,
        }}>
          {[0, 1, 2, 3].map((i) => (
            <div key={i} style={{
              width: 12, height: 12, borderRadius: "50%",
              background: success ? "#10B981" :
                error ? "#EF4444" :
                pin.length > i ? "#8B84FF" : "transparent",
              border: pin.length > i || error || success ? "none" : "2px solid #475569",
              transition: "all 0.3s ease",
              transform: pin.length > i && !error ? "scale(1.25)" : "scale(1)",
            }} />
          ))}
        </div>

        <div style={{
          display: "grid", gridTemplateColumns: "repeat(3, 1fr)",
          gap: 12, marginBottom: 24,
        }}>
          {["1", "2", "3", "4", "5", "6", "7", "8", "9"].map((d) => (
            <button
              key={d}
              type="button"
              onClick={() => handleDigit(d)}
              style={{
                aspectRatio: "1",
                borderRadius: 18,
                fontSize: 22,
                fontWeight: 900,
                transition: "all 0.1s ease",
                background: lastPressed === d
                  ? "#635BFF"
                  : "rgba(255,255,255,0.05)",
                border: lastPressed === d
                  ? "1px solid #635BFF"
                  : "1px solid rgba(255,255,255,0.08)",
                color: "white",
                cursor: "pointer",
                fontFamily: "inherit",
                userSelect: "none",
                transform: lastPressed === d ? "scale(0.95)" : "scale(1)",
              }}
            >
              {d}
            </button>
          ))}
          <div />
          <button
            type="button"
            onClick={() => handleDigit("0")}
            style={{
              aspectRatio: "1",
              borderRadius: 18,
              fontSize: 22,
              fontWeight: 900,
              background: lastPressed === "0" ? "#635BFF" : "rgba(255,255,255,0.05)",
              border: lastPressed === "0" ? "1px solid #635BFF" : "1px solid rgba(255,255,255,0.08)",
              color: "white",
              cursor: "pointer",
              fontFamily: "inherit",
              transition: "all 0.1s ease",
            }}
          >
            0
          </button>
          <button
            type="button"
            onClick={handleDelete}
            style={{
              aspectRatio: "1",
              borderRadius: 18,
              display: "flex", alignItems: "center", justifyContent: "center",
              background: "rgba(255,255,255,0.05)",
              border: "1px solid rgba(255,255,255,0.08)",
              color: "#64748B",
              cursor: "pointer",
              fontFamily: "inherit",
            }}
          >
            <Delete size={20} />
          </button>
        </div>

        <button
          type="button"
          onClick={onLogout}
          style={{
            width: "100%", padding: 12,
            fontSize: 12, fontWeight: 800,
            color: "#64748B", background: "none", border: "none",
            display: "flex", alignItems: "center", justifyContent: "center",
            gap: 8, cursor: "pointer", fontFamily: "inherit",
          }}
        >
          <LogOut size={14} /> تسجيل الخروج
        </button>

        <button
          type="button"
          onClick={() => {
            if (window.confirm("هل تريد إعادة تعيين الرمز؟ ستحتاج إعادة تسجيل الدخول.")) {
              localStorage.removeItem(PIN_HASH_KEY);
              sessionStorage.removeItem(PIN_SESSION_KEY);
              onLogout();
            }
          }}
          style={{
            width: "100%", padding: 8,
            fontSize: 10, fontWeight: 700,
            color: "#64748B", background: "none", border: "none",
            cursor: "pointer", fontFamily: "inherit",
          }}
        >
          نسيت الرمز؟ إعادة تعيين
        </button>
      </div>
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════════
   7) DATA REDUCER
   ═══════════════════════════════════════════════════════════════════ */
function dataReducer(state, action) {
  switch (action.type) {
    case "SET_DATA": {
      const incoming = { ...action.payload };
      if (Array.isArray(incoming.transactions)) {
        incoming.transactions = incoming.transactions.map((t) =>
          t ? { ...t, category: normalizeCategory(t.category) } : t,
        );
      }
      if (!Array.isArray(incoming.deletedTxIds))
        incoming.deletedTxIds = [...(state.data.deletedTxIds || [])];
      if (!Array.isArray(incoming.deletedDefaultIds))
        incoming.deletedDefaultIds = [...(state.data.deletedDefaultIds || [])];
      if (!Array.isArray(incoming.reconciliations))
        incoming.reconciliations = [...(state.data.reconciliations || [])];
      if (!Array.isArray(incoming.auditLog))
        incoming.auditLog = [...(state.data.auditLog || [])];
      if (!Array.isArray(incoming.deleteRequests))
        incoming.deleteRequests = [...(state.data.deleteRequests || [])];
      if (!Array.isArray(incoming.cardInstallments))
        incoming.cardInstallments = [...(state.data.cardInstallments || [])];
      if (!Array.isArray(incoming.transactions)) incoming.transactions = [];
      incoming.transactions = sortTransactions(incoming.transactions);
      incoming.hanyPayableCache = computeHanyPayable(incoming);
      return { ...state, data: incoming };
    }

    case "SET_ACTIVE_TAB": return { ...state, activeTab: action.payload };
    case "SET_SELECTED_YEAR":
      return {
        ...state, selectedYear: action.payload,
        selectedMonth: getMonthsForYear(action.payload).includes(state.selectedMonth)
          ? state.selectedMonth : getMonthsForYear(action.payload)[0],
      };
    case "SET_SELECTED_MONTH": return { ...state, selectedMonth: action.payload };
    case "SET_TRANS_VIEW_MODE": return { ...state, transViewMode: action.payload };
    case "SET_CAT_VIEW_TYPE": return { ...state, catViewType: action.payload };
    case "SET_FORM_OPEN": return { ...state, isFormOpen: action.payload, formErrors: {} };
    case "SET_FORM_DATA": return { ...state, formData: action.payload };
    case "SET_FORM_MODE": return { ...state, formMode: action.payload };
    case "SET_FORM_ERRORS": return { ...state, formErrors: action.payload };
    case "SET_ACTIVE_CATEGORY_DETAIL": return { ...state, activeCategoryDetail: action.payload };
    case "TOGGLE_DARK_MODE": return { ...state, isDarkMode: action.payload };
    case "SET_BUDGETS": return { ...state, budgets: action.payload };
    case "SET_EDITING_CARD": return { ...state, editingCard: action.payload };
    case "SET_EDITING_LOAN": return { ...state, editingLoan: action.payload };
    case "SET_SEARCH_TERM": return { ...state, searchTerm: action.payload };
    case "SET_EDITING_BUDGET_CATEGORY": return { ...state, editingBudgetCategory: action.payload };
    case "SET_BUDGET_AMOUNT": return { ...state, budgetAmount: action.payload };
    case "SET_RECURRING_MODAL_OPEN": return { ...state, isRecurringModalOpen: action.payload };
    case "SET_RECURRING_FORM_DATA": return { ...state, recurringFormData: action.payload };
    case "SET_PIN_CHANGE_OPEN": return { ...state, isPinChangeOpen: action.payload };
    case "SET_SMS_MODAL_OPEN": return { ...state, isSmsModalOpen: action.payload };
    case "SET_SIDEBAR_OPEN": return { ...state, isSidebarOpen: action.payload };
    case "SET_VIEWING_CARD_STATEMENT": return { ...state, viewingCardStatement: action.payload };
    case "SET_RECONCILIATION_MODAL": return { ...state, reconciliationModal: action.payload };
    case "SET_CARD_PAYMENT_MODAL": return { ...state, cardPaymentModal: action.payload };
    case "SET_IS_PROCESSING": return { ...state, isProcessing: action.payload };
    case "SET_STATUS_FILTER": return { ...state, statusFilter: action.payload };
    case "SET_PRINT_MODAL": return { ...state, printModal: action.payload };
    case "SET_PENDING_CLOSE_MODAL": return { ...state, pendingCloseModal: action.payload };
    case "SET_QUICK_TRANSFER_MODAL_OPEN": return { ...state, isQuickTransferModalOpen: action.payload };

    case "TOGGLE_LEDGER":
      return {
        ...state,
        expandedLedgers: {
          ...state.expandedLedgers,
          [action.payload]: !state.expandedLedgers[action.payload],
        },
      };
    case "TOGGLE_CARDS_SECTION":
      return { ...state, expandedCardsSection: !state.expandedCardsSection };

    case "ADD_NOTIFICATION": {
      const newNotif = {
        id: `n-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
        ...action.payload,
      };
      return {
        ...state,
        notifications: [...state.notifications, newNotif].slice(-5),
      };
    }
    case "REMOVE_NOTIFICATION":
      return {
        ...state,
        notifications: state.notifications.filter((n) => n.id !== action.payload),
      };

    case "UPDATE_TRANSACTIONS": {
      const oldTxs = state.data.transactions || [];
      const newTxs = sortTransactions(action.payload || []);
      try { _balanceCache.clear(); } catch (e) {}

      const oldMap = new Map(oldTxs.map((t) => [t.id, t]));
      const newMap = new Map(newTxs.map((t) => [t.id, t]));
      const auditEntries = [];

      newTxs.forEach((t) => {
        const old = oldMap.get(t.id);
        if (!old) {
          auditEntries.push(
            buildAuditEntry(AUDIT.CREATE, "transaction", t.id, {
              after: { amount: t.amount, category: t.category, method: t.method, status: t.status },
              note: `إنشاء: ${t.description || t.category} — ${fmt(t.amount)} ج.م`,
            }),
          );
        } else if (JSON.stringify(old) !== JSON.stringify(t)) {
          const changes = [];
          if (old.status !== t.status) changes.push(`الحالة: ${old.status} → ${t.status}`);
          if (safeNumber(old.amount) !== safeNumber(t.amount)) changes.push(`المبلغ: ${fmt(old.amount)} → ${fmt(t.amount)}`);
          if (old.category !== t.category) changes.push(`الفئة: ${old.category} → ${t.category}`);
          if (changes.length > 0) {
            auditEntries.push(
              buildAuditEntry(AUDIT.UPDATE, "transaction", t.id, {
                before: { status: old.status, amount: old.amount, category: old.category },
                after: { status: t.status, amount: t.amount, category: t.category },
                note: `تعديل: ${changes.join(" • ")}`,
              }),
            );
          }
        }
      });

      oldTxs.forEach((t) => {
        if (!newMap.has(t.id)) {
          auditEntries.push(
            buildAuditEntry(AUDIT.DELETE, "transaction", t.id, {
              before: { amount: t.amount, category: t.category, method: t.method },
              note: `حذف: ${t.description || t.category} — ${fmt(t.amount)} ج.م`,
            }),
          );
        }
      });

      const auditLog = [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000);
      const hanyPayableCache = computeHanyPayable({ ...state.data, transactions: newTxs });
      return {
        ...state,
        data: { ...state.data, transactions: newTxs, auditLog, hanyPayableCache },
      };
    }

    case "UPDATE_LOANS":
      return { ...state, data: { ...state.data, loans: action.payload } };
    case "UPDATE_CARDS":
      return { ...state, data: { ...state.data, cards: action.payload } };
    case "UPDATE_RECURRING_ITEMS":
      return { ...state, data: { ...state.data, recurringItems: action.payload } };
    case "UPDATE_CASHBACK_TRACKERS":
      return { ...state, data: { ...state.data, cashbackTrackers: action.payload } };
    case "UPDATE_CARD_INSTALLMENTS":
      return { ...state, data: { ...state.data, cardInstallments: action.payload } };
    case "UPDATE_MONTHLY_PLANS":
      return { ...state, data: { ...state.data, monthlyPlans: action.payload } };

    case "UPDATE_ACCOUNTS": {
      const oldA = state.data.accountsData || {};
      const newA = action.payload || {};
      let earliestAffected = null;

      ACCOUNT_KEYS.forEach((k) => {
        const oldInit = safeNumber(oldA[k]?.initialBalance);
        const newInit = safeNumber(newA[k]?.initialBalance);
        const oldDate = oldA[k]?.initialDate;
        const newDate = newA[k]?.initialDate;
        if (oldInit !== newInit || oldDate !== newDate) {
          const ref = newDate || oldDate;
          if (ref) {
            const d = parseISODate(ref);
            if (d) {
              const y = d.getFullYear();
              const mIdx = d.getMonth();
              const mName = ALL_MONTHS[mIdx];
              if (!earliestAffected) earliestAffected = { year: y, month: mName };
              else {
                const curIdx = getMonthIndex(earliestAffected.month);
                if (y < earliestAffected.year || (y === earliestAffected.year && mIdx < curIdx))
                  earliestAffected = { year: y, month: mName };
              }
            }
          }
        }
      });

      let newSnapshots = state.data.monthlySnapshots || {};
      if (earliestAffected) {
        const { snapshots } = invalidateSnapshotsFrom(newSnapshots, earliestAffected.year, earliestAffected.month);
        newSnapshots = snapshots;
      }

      const auditEntries = [];
      ACCOUNT_KEYS.forEach((k) => {
        const oldInit = safeNumber(oldA[k]?.initialBalance);
        const newInit = safeNumber(newA[k]?.initialBalance);
        if (oldInit !== newInit) {
          auditEntries.push(
            buildAuditEntry(AUDIT.UPDATE, "account", k, {
              before: { initialBalance: oldInit },
              after: { initialBalance: newInit },
              note: `${ACCOUNT_SHORT_NAMES[k]}: ${fmt(oldInit)} → ${fmt(newInit)}`,
            }),
          );
        }
      });

      return {
        ...state,
        data: {
          ...state.data,
          accountsData: newA,
          monthlySnapshots: newSnapshots,
          auditLog: [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000),
        },
      };
    }

    case "ADD_TO_HISTORY": {
      const limited = [...state.history].slice(-19);
      return { ...state, history: [...limited, action.payload], future: [] };
    }
    case "UNDO": {
      if (state.history.length === 0) return state;
      const prev = state.history[state.history.length - 1];
      return {
        ...state,
        data: prev.data || prev,
        budgets: prev.budgets !== undefined ? prev.budgets : state.budgets,
        history: state.history.slice(0, -1),
        future: [{ data: state.data, budgets: state.budgets }, ...state.future],
      };
    }
    case "REDO": {
      if (state.future.length === 0) return state;
      const next = state.future[0];
      return {
        ...state,
        data: next.data, budgets: next.budgets,
        future: state.future.slice(1),
        history: [...state.history, { data: state.data, budgets: state.budgets }],
      };
    }

    case "SHOW_CONFIRM":
      return {
        ...state,
        confirmDialog: {
          isOpen: true, title: action.title, message: action.message,
          onConfirm: action.onConfirm, onCancel: action.onCancel,
          danger: action.danger || false,
        },
      };
    case "HIDE_CONFIRM":
      return {
        ...state,
        confirmDialog: { isOpen: false, title: "", message: "", onConfirm: null, onCancel: null, danger: false },
      };

    case "CARD_PAYMENT": {
      const { cardId, amount, sourceMethod, date, note, withFee, feeAmount, status: paymentStatus = "paid" } = action.payload;
      const d = parseISODate(date);
      if (!d) return state;
      const txYear = d.getFullYear();
      const txMonth = ALL_MONTHS[d.getMonth()];
      if (isMonthClosed(state.data, txYear, txMonth)) return state;

      const card = (state.data.cards || []).find((c) => c.id === cardId);
      if (!card) return state;
      if (CREDIT_CARD_METHOD_IDS.includes(sourceMethod)) return state;

      const balances = computeBalancesAsOf(state.data);
      const sourceBalance = safeNumber(balances[sourceMethod]);
      const totalDebit = safeNumber(amount) + (withFee ? safeNumber(feeAmount) : 0);
      if (sourceBalance < totalDebit - 0.005) return state;

      const paymentId = getSafeId();
      const paymentTx = {
        id: paymentId, type: "expense", kind: KIND.FINANCIAL,
        category: "الالتزامات البنكية والتمويلية",
        amount: roundMoney(safeNumber(amount)),
        description: note || `سداد بطاقة ${card.bank} - ${card.name}`,
        method: sourceMethod, date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
        subType: "withdrawal", status: paymentStatus,
        source: "card-payment-plan", linkedCardId: card.id, cardLast4: card.last4,
        createdAt: new Date().toISOString(),
      };
      const newTxs = [paymentTx];

      if (withFee && safeNumber(feeAmount) > 0) {
        newTxs.push({
          id: getSafeId(), type: "expense", kind: KIND.FINANCIAL,
          category: "رسوم بنكية شهرية",
          amount: roundMoney(safeNumber(feeAmount)),
          description: `رسوم سداد بطاقة ${card.bank} - ${card.name}`,
          method: sourceMethod, date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
          subType: "withdrawal", status: paymentStatus,
          source: "card-payment-plan", linkedCardId: card.id, linkedPaymentId: paymentId,
          createdAt: new Date().toISOString(),
        });
      }

      const allTxs = sortTransactions([...newTxs, ...(state.data.transactions || [])]);
      const auditEntries = [
        buildAuditEntry(AUDIT.UPDATE, "card", card.id, {
          before: { debt: computeCardDebt(state.data, card) },
          after: { debt: computeCardDebt({ ...state.data, transactions: allTxs }, card) },
          note: `سداد بطاقة: ${fmt(amount)} ج.م من ${ACCOUNT_SHORT_NAMES[sourceMethod]}`,
        }),
      ];

      return {
        ...state,
        data: {
          ...state.data,
          transactions: allTxs,
          auditLog: [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000),
          hanyPayableCache: computeHanyPayable({ ...state.data, transactions: allTxs }),
        },
      };
    }

    case "HANY_SETTLE": {
      const { amount, sourceMethod, date, note, linkedHanyMonth } = action.payload;
      const d = parseISODate(date);
      if (!d) return state;
      const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
      if (isMonthClosed(state.data, txYear, txMonth)) return state;
      if (!HANY_SETTLE_ALLOWED_METHODS.includes(sourceMethod)) return state;

      const balances = computeBalancesAsOf(state.data);
      if (safeNumber(balances[sourceMethod]) < safeNumber(amount) - 0.005) return state;

      const currentPayable = computeHanyPayable(state.data);
      if (safeNumber(amount) > currentPayable + 0.005) return state;

      const settleTx = {
        id: getSafeId(), type: "expense", kind: KIND.FINANCIAL,
        category: HANY_SETTLE_CATEGORY,
        amount: roundMoney(safeNumber(amount)),
        description: note || `سداد دفتر هاني${linkedHanyMonth ? ` - ${linkedHanyMonth}` : ""}`,
        method: sourceMethod, date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
        subType: "withdrawal", status: "paid",
        source: "hany-settle", hanyEffect: "settle", affectsCash: true,
        linkedHanyMonth: linkedHanyMonth || null,
        createdAt: new Date().toISOString(),
      };

      const allTxs = sortTransactions([settleTx, ...(state.data.transactions || [])]);
      const auditEntries = [
        buildAuditEntry(AUDIT.HANY_SETTLE, "hany", settleTx.id, {
          before: { payable: currentPayable },
          after: { payable: computeHanyPayable({ ...state.data, transactions: allTxs }) },
          note: `سداد هاني: ${fmt(amount)} ج.م من ${ACCOUNT_SHORT_NAMES[sourceMethod]}`,
        }),
      ];

      return {
        ...state,
        data: {
          ...state.data,
          transactions: allTxs,
          auditLog: [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000),
          hanyPayableCache: computeHanyPayable({ ...state.data, transactions: allTxs }),
        },
      };
    }

    case "EXTERNAL_TRANSFER": {
      const { fromMethod, amount, recipientName, date, note, withFee, feeAmount } = action.payload;
      const d = parseISODate(date);
      if (!d) return state;
      const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
      if (isMonthClosed(state.data, txYear, txMonth)) return state;

      const balances = computeBalancesAsOf(state.data);
      const sourceBalance = safeNumber(balances[fromMethod]);
      const totalDebit = safeNumber(amount) + (withFee ? safeNumber(feeAmount) : 0);
      if (sourceBalance < totalDebit - 0.005) return state;

      const transferId = getSafeId();
      const newTxs = [
        {
          id: getSafeId(), type: "expense", kind: KIND.FINANCIAL,
          category: "تحويلات", amount: roundMoney(safeNumber(amount)),
          description: note || `تحويل إلى ${recipientName}`,
          method: fromMethod, date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
          subType: "withdrawal", status: "paid",
          source: "external-transfer", linkedTransferId: transferId,
          transferDirection: "out", recipientName,
          createdAt: new Date().toISOString(),
        },
      ];

      if (withFee && safeNumber(feeAmount) > 0) {
        newTxs.push({
          id: getSafeId(), type: "expense", kind: KIND.FINANCIAL,
          category: "رسوم تحويلات", amount: roundMoney(safeNumber(feeAmount)),
          description: `رسوم تحويل إلى ${recipientName}`,
          method: fromMethod, date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
          subType: "withdrawal", status: "paid",
          source: "external-transfer", linkedTransferId: transferId,
          transferDirection: "fee", recipientName,
          createdAt: new Date().toISOString(),
        });
      }

      const allTxs = sortTransactions([...newTxs, ...(state.data.transactions || [])]);
      const auditEntries = [
        buildAuditEntry(AUDIT.TRANSFER, "external", transferId, {
          after: { amount, recipient: recipientName, source: fromMethod },
          note: `تحويل للغير: ${fmt(amount)} ج.م إلى ${recipientName}`,
        }),
      ];

      return {
        ...state,
        data: {
          ...state.data,
          transactions: allTxs,
          auditLog: [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000),
          hanyPayableCache: computeHanyPayable({ ...state.data, transactions: allTxs }),
        },
      };
    }

    case "CLOSE_MONTH": {
      const { year, month } = action.payload;
      const monthKey = makeMonthKey(year, month);
      const monthIdx = getMonthIndex(month);
      const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
      const snap = computeBalancesAsOf(state.data, monthEnd);
      const cardDebts = {};
      (state.data.cards || []).forEach((c) => {
        cardDebts[c.id] = computeCardDebt(state.data, c, monthEnd);
      });
      const hanyPayable = computeHanyPayable(state.data, monthEnd);

      const marker = createHanyCarryoverMarker(state.data, year, month, hanyPayable);
      const newTxs = marker
        ? sortTransactions([...(state.data.transactions || []), marker])
        : state.data.transactions || [];

      const fullSnap = {
        ...snap, __v: CURRENT_ENGINE_VERSION,
        __cardDebts: cardDebts, __hanyPayable: hanyPayable,
        __closedAt: new Date().toISOString(),
      };

      const cleanedSnapshots = { ...(state.data.monthlySnapshots || {}) };
      Object.keys(cleanedSnapshots).forEach((k) => {
        const parsed = parseMonthKey(k);
        if (!parsed) return;
        if (
          parsed.year > year ||
          (parsed.year === year && getMonthIndex(parsed.month) > monthIdx)
        )
          delete cleanedSnapshots[k];
      });

      const auditEntries = [
        buildAuditEntry(AUDIT.CLOSE_MONTH, "month", monthKey, {
          note: `إقفال شهر ${month} ${year}`,
        }),
      ];
      if (marker) {
        auditEntries.unshift(
          buildAuditEntry(AUDIT.CARRYOVER, "hany", marker.id, {
            after: { amount: marker.amount },
            note: `ترحيل رصيد هاني: ${fmt(marker.amount)} ج.م`,
          }),
        );
      }

      return {
        ...state,
        data: {
          ...state.data,
          transactions: newTxs,
          closedMonths: Array.from(new Set([...(state.data.closedMonths || []), monthKey])),
          monthlySnapshots: { ...cleanedSnapshots, [monthKey]: fullSnap },
          hanyPayableCache: computeHanyPayable({ ...state.data, transactions: newTxs }),
          auditLog: [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000),
        },
      };
    }

    case "OPEN_MONTH": {
      const monthKey = action.payload;
      const parsedKey = parseMonthKey(monthKey);
      if (!parsedKey) {
        return {
          ...state,
          data: {
            ...state.data,
            closedMonths: (state.data.closedMonths || []).filter((m) => m !== monthKey),
          },
        };
      }

      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots, parsedKey.year, parsedKey.month);
      const cleanedTxs = cleanupHanyMarkersFrom(state.data.transactions || [], parsedKey.year, parsedKey.month);

      return {
        ...state,
        data: {
          ...state.data,
          transactions: cleanedTxs,
          closedMonths: (state.data.closedMonths || []).filter((m) => m !== monthKey),
          monthlySnapshots: snapshots,
          hanyPayableCache: computeHanyPayable({ ...state.data, transactions: cleanedTxs }),
          auditLog: [
            buildAuditEntry(AUDIT.OPEN_MONTH, "month", monthKey, {
              note: `فتح شهر ${parsedKey.month} ${parsedKey.year}`,
            }),
            ...(state.data.auditLog || []),
          ].slice(0, 1000),
        },
      };
    }

    case "RECONCILE_ACCOUNT": {
      const { accountKey, actualBalance, diff, note, month, year, computedBalance } = action.payload;
      const now = new Date();
      const txMonth = month || ALL_MONTHS[now.getMonth()];
      const txYear = year || now.getFullYear();
      const txMonthIdx = getMonthIndex(txMonth);

      if (isMonthClosed(state.data, txYear, txMonth)) return state;
      if (Math.abs(diff) < 0.01) return state;

      const reconciliationId = getSafeId();
      const settlementTx = {
        id: getSafeId(),
        type: diff > 0 ? "income" : "expense",
        kind: KIND.ADJUSTMENT,
        category: "تسوية رصيد",
        amount: roundMoney(Math.abs(diff)),
        description: note || `تسوية مطابقة ${ACCOUNT_SHORT_NAMES[accountKey] || accountKey}`,
        method: accountKey,
        date: getLocalISODate(now), month: txMonth, year: txYear, monthIndex: txMonthIdx,
        subType: diff > 0 ? "deposit" : "withdrawal",
        status: "paid", source: "reconciliation",
        linkedReconciliationId: reconciliationId,
        createdAt: now.toISOString(),
      };

      const newTxs = sortTransactions([settlementTx, ...(state.data.transactions || [])]);
      const reconciliation = {
        id: reconciliationId, accountKey, date: getLocalISODate(now),
        computedBalance, actualBalance, diff,
        note: note || "", txId: settlementTx.id,
        createdAt: now.toISOString(),
      };
      const newReconciliations = [reconciliation, ...(state.data.reconciliations || [])].slice(-200);
      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots || {}, txYear, txMonth);

      return {
        ...state,
        data: {
          ...state.data,
          transactions: newTxs,
          reconciliations: newReconciliations,
          monthlySnapshots: snapshots,
          hanyPayableCache: computeHanyPayable({ ...state.data, transactions: newTxs }),
          auditLog: [
            buildAuditEntry(AUDIT.RECONCILE, "account", accountKey, {
              before: { balance: computedBalance },
              after: { balance: actualBalance },
              note: `مطابقة ${ACCOUNT_SHORT_NAMES[accountKey]}: ${fmt(diff)} ج.م`,
            }),
            ...(state.data.auditLog || []),
          ].slice(0, 1000),
        },
      };
    }

    case "TOGGLE_WALLET_VISIBILITY":
      return {
        ...state,
        walletVisibility: {
          ...state.walletVisibility,
          [action.payload]: !state.walletVisibility[action.payload],
        },
      };

    default:
      return state;
  }
}

/* ═══════════════════════════════════════════════════════════════════
   8) MAIN APP COMPONENT
   ═══════════════════════════════════════════════════════════════════ */
function App() {
  const defMY = useMemo(() => getDefaultMonthYear(), []);

  const [state, dispatch] = useReducer(dataReducer, {
    data: getInitialData(),
    activeTab: "dashboard",
    selectedYear: defMY.year,
    selectedMonth: defMY.month,
    transViewMode: "all",
    catViewType: "expense",
    isFormOpen: false,
    formMode: "add",
    formData: {
      type: "expense", subType: "withdrawal", status: "pending",
      quantity: "", unitPrice: "",
    },
    isDarkMode: localStorage.getItem(THEME_KEY) === "dark",
    budgets: safeParseJson(localStorage.getItem(BUDGETS_KEY), {}),
    editingCard: null,
    editingLoan: null,
    searchTerm: "",
    editingBudgetCategory: null,
    budgetAmount: "",
    isRecurringModalOpen: false,
    recurringFormData: {
      title: "", amount: "", day: 1, category: "أخرى", type: "expense",
      startMonth: "", endMonth: "", active: true, method: "cash",
    },
    notifications: [],
    history: [],
    future: [],
    expandedLedgers: {
      cash: false, fawry: false, etisalat: false,
      cib_savings: false, aaib_savings: false,
    },
    expandedCardsSection: false,
    statusFilter: "all",
    confirmDialog: { isOpen: false },
    isQuickTransferModalOpen: false,
    viewingCardStatement: null,
    isPinChangeOpen: false,
    isSmsModalOpen: false,
    pendingCloseModal: { isOpen: false, pending: [], total: 0, month: "", year: 0 },
    walletVisibility: {
      cash: true, fawry: true, etisalat: true,
      cib_savings: true, aaib_savings: true,
    },
    isProcessing: false,
    formErrors: {},
    activeCategoryDetail: null,
    reconciliationModal: null,
    isSidebarOpen: false,
    cardPaymentModal: null,
    printModal: null,
  });

  const [showQuickAddSheet, setShowQuickAddSheet] = useState(false);
  const [showMoreSheet, setShowMoreSheet] = useState(false);
  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [authLoading, setAuthLoading] = useState(true);
  const [pinVerified, setPinVerified] = useState(false);
  const [cloudSyncStatus, setCloudSyncStatus] = useState("pending");
  const [isSaving, setIsSaving] = useState(false);

  const addNotification = useCallback(
    (notification) => dispatch({ type: "ADD_NOTIFICATION", payload: notification }),
    [],
  );
  const removeNotification = useCallback(
    (id) => dispatch({ type: "REMOVE_NOTIFICATION", payload: id }),
    [],
  );

  const saveHistory = useCallback(() => {
    const currentData = state.data;
    const currentBudgets = state.budgets;
    dispatch({
      type: "ADD_TO_HISTORY",
      payload: { data: safeClone(currentData), budgets: safeClone(currentBudgets) },
    });
  }, [state.data, state.budgets]);

  const saveTimeoutRef = useRef(null);
  const isSavingRef = useRef(false);
  const hasReceivedInitialSnapshot = useRef(false);
  const initialSnapshotTimeoutRef = useRef(null);
  const currentTxRef = useRef([]);
  const lastMaterializeRef = useRef("");
  const isOnline = useOnlineStatus();
  const prevOnlineRef = useRef(isOnline);

  const {
    data, activeTab, selectedYear, selectedMonth, transViewMode, catViewType,
    isFormOpen, formMode, formData, isDarkMode, budgets, editingCard, editingLoan,
    searchTerm, editingBudgetCategory, budgetAmount, isRecurringModalOpen,
    recurringFormData, notifications, expandedLedgers, statusFilter,
    viewingCardStatement, isPinChangeOpen, isSmsModalOpen,
    walletVisibility, isProcessing, activeCategoryDetail, reconciliationModal,
    isSidebarOpen, cardPaymentModal,
  } = state;

  const {
    transactions = [], loans = [], cards = [], recurringItems = [],
    accountsData = DEFAULT_ACCOUNTS, monthlyPlans = {},
  } = data || {};

  useEffect(() => {
    currentTxRef.current = data?.transactions || [];
  }, [data?.transactions]);

  const docRef = useMemo(
    () => db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc),
    [],
  );

  /* Auth state */
  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((user) => {
      setAuthLoading(false);
      setIsAuthenticated(!!(user && user.email === ALLOWED_EMAIL));
    });
    return () => unsub();
  }, []);

  /* Firestore sync */
  useEffect(() => {
    if (!isAuthenticated) return;
    const innerDocRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);

    initialSnapshotTimeoutRef.current = setTimeout(() => {
      if (!hasReceivedInitialSnapshot.current) {
        hasReceivedInitialSnapshot.current = true;
        setCloudSyncStatus("offline");
      }
    }, 8000);

    const unsub = innerDocRef.onSnapshot(
      (doc) => {
        const isFirst = !hasReceivedInitialSnapshot.current;
        if (isFirst) {
          hasReceivedInitialSnapshot.current = true;
          if (initialSnapshotTimeoutRef.current) {
            clearTimeout(initialSnapshotTimeoutRef.current);
            initialSnapshotTimeoutRef.current = null;
          }
          setCloudSyncStatus("ready");
        }

        if (doc.exists) {
          const raw = doc.data();
          let migrated = migrateData(raw);

          const permanentDeleted = new Set([
            ...(migrated.deletedTxIds || []),
            ...currentTxRef.current.filter((t) => t?._deleted).map((t) => t.id),
          ]);
          migrated.transactions = (migrated.transactions || []).filter(
            (t) => !t?.id || !permanentDeleted.has(t.id),
          );

          const remoteIds = new Set(migrated.transactions.map((t) => t.id));
          const localOnly = currentTxRef.current.filter(
            (t) => t?.id && !remoteIds.has(t.id) && !permanentDeleted.has(t.id),
          );

          const now = Date.now();
          const localOnlyToUpload = localOnly.filter((t) => {
            if (!t.createdAt) return false;
            const age = now - new Date(t.createdAt).getTime();
            return age >= 0 && age < 300000;
          });

          if (localOnlyToUpload.length > 0) {
            migrated.transactions = sortTransactions([
              ...migrated.transactions, ...localOnlyToUpload,
            ]);
          }

          if (raw.budgets && typeof raw.budgets === "object") {
            dispatch({ type: "SET_BUDGETS", payload: raw.budgets });
          }

          dispatch({ type: "SET_DATA", payload: migrated });
        }
      },
      (error) => {
        console.error("❌ Firestore error:", error);
        if (!hasReceivedInitialSnapshot.current) {
          hasReceivedInitialSnapshot.current = true;
          setCloudSyncStatus("offline");
        }
      },
    );

    return () => {
      unsub();
      if (initialSnapshotTimeoutRef.current) clearTimeout(initialSnapshotTimeoutRef.current);
    };
  }, [isAuthenticated]);

  /* Cloud save effect */
  useEffect(() => {
    if (!isAuthenticated || !data?.transactions) return;
    if (!hasReceivedInitialSnapshot.current) return;
    if (cloudSyncStatus === "offline") {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      return;
    }
    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(() => {
      if (isSavingRef.current) return;
      isSavingRef.current = true;
      setIsSaving(true);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      docRef.set({ ...data, budgets }, { merge: true })
        .then(() => {
          try { localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now())); } catch (e) {}
        })
        .catch((err) => console.error("Cloud save failed:", err))
        .finally(() => {
          setTimeout(() => {
            isSavingRef.current = false;
            setIsSaving(false);
          }, 800);
        });
    }, 2000);
    return () => clearTimeout(saveTimeoutRef.current);
  }, [data, budgets, isAuthenticated, cloudSyncStatus, docRef]);

  /* Recurring materialization */
  useEffect(() => {
    if (!isAuthenticated || !data?.recurringItems?.length) return;
    const today = getLocalISODate();
    const activeCount = data.recurringItems.filter((r) => r.active !== false).length;
    const sig = `${today}_${data.recurringItems.length}_${activeCount}`;
    if (lastMaterializeRef.current === sig) return;
    lastMaterializeRef.current = sig;

    const updated = applyMaterialization(data, today);
    if (updated) {
      const added = updated.transactions.length - (data.transactions?.length || 0);
      dispatch({ type: "SET_DATA", payload: updated });
      if (added > 0) {
        addNotification({
          type: "info", title: "تم توليد التزامات شهرية",
          message: `${added} بند متكرر بانتظار الاعتماد`,
          duration: 6000,
        });
      }
    }
  }, [isAuthenticated, data?.recurringItems?.length, data?.transactions?.length, addNotification, data]);

  /* Online status */
  useEffect(() => {
    if (prevOnlineRef.current !== isOnline) {
      if (isOnline) {
        addNotification({ type: "success", title: "تم استعادة الاتصال", duration: 4000 });
        if (cloudSyncStatus === "offline") setCloudSyncStatus("pending");
      } else {
        addNotification({ type: "warning", title: "انقطع الاتصال", duration: 6000 });
      }
      prevOnlineRef.current = isOnline;
    }
  }, [isOnline, addNotification, cloudSyncStatus]);

  /* Theme effect */
  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDarkMode);
    localStorage.setItem(THEME_KEY, isDarkMode ? "dark" : "light");
  }, [isDarkMode]);

  useEffect(() => {
    try { localStorage.setItem(BUDGETS_KEY, JSON.stringify(budgets)); } catch (e) {}
  }, [budgets]);

  /* Derived data */
  const liveBalances = useMemo(() => computeBalancesAsOf(data), [data]);
  const liquidityDual = useMemo(() => computeDualLiquidity(liveBalances), [liveBalances]);
  const netWorthData = useMemo(() => computeNetWorth(data), [data]);

  const updatedLoans = useMemo(() => {
    const map = transactions.reduce((acc, t) => {
      if (t.linkedLoanId && t.status === "paid")
        acc[t.linkedLoanId] = (acc[t.linkedLoanId] || 0) + safeNumber(t.amount);
      return acc;
    }, {});
    const receivablesPaidMap = transactions.reduce((acc, t) => {
      if (t.sourceReceivableId && t.status === "paid")
        acc[t.sourceReceivableId] = (acc[t.sourceReceivableId] || 0) + safeNumber(t.amount);
      return acc;
    }, {});

    const regular = loans.filter((l) => !l.autoMonthly && !l.isReceivable).map((l) => ({
      ...l,
      isReceivable: l.type === "receivable" || !!l.isReceivable,
      totalPaid: safeNumber(l.prePaidAmount) + (map[l.id] || 0),
      remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (map[l.id] || 0))),
    }));
    const receivables = loans.filter((l) => l.isReceivable).map((l) => ({
      ...l, isReceivable: true, paused: !!l.paused,
      totalPaid: safeNumber(l.prePaidAmount) + (receivablesPaidMap[l.id] || 0),
      remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (receivablesPaidMap[l.id] || 0))),
    }));
    return [...receivables, ...regular];
  }, [loans, transactions]);

  const getAgendaItems = useCallback((targetYear, targetMonth) => {
    try {
      const items = [];
      const y = targetYear || new Date().getFullYear();
      const mIdx = targetMonth ? getMonthIndex(targetMonth) : new Date().getMonth();
      const mName = targetMonth || ALL_MONTHS[mIdx];
      const pad = (n) => String(n).padStart(2, "0");

      cards.forEach((c) => {
        const liveDebt = Math.max(0, computeCardDebt(data, c));
        if (liveDebt <= 0.01) return;
        const d = parseInt(c.dueDate) || 5;
        const maxDay = new Date(y, mIdx + 1, 0).getDate();
        const safeDay = Math.min(d, maxDay);
        items.push({
          id: `ag-card-${c.id}-${y}-${mIdx}`,
          title: `سداد ${c.bank} - ${c.name}`,
          date: `${y}-${pad(mIdx + 1)}-${pad(safeDay)}`,
          amount: liveDebt, type: "warning", icon: CreditCard, desc: "استحقاق دوري",
        });
      });

      updatedLoans.forEach((l) => {
        if (safeNumber(l.monthlyInstallment) > 0 && l.remaining > 0 && !l.autoGenerated && !l.isReceivable) {
          const d = parseInt(l.dueDay) || 1;
          const maxDay = new Date(y, mIdx + 1, 0).getDate();
          const safeDay = Math.min(d, maxDay);
          items.push({
            id: `ag-loan-${l.id}-${y}-${mIdx}`,
            title: `قسط ${l.name}`,
            date: `${y}-${pad(mIdx + 1)}-${pad(safeDay)}`,
            amount: safeNumber(l.monthlyInstallment),
            type: "danger", icon: Banknote, desc: l.description || "قسط شهري",
          });
        }
        if (l.isReceivable && !l.paused && l.remaining > 0 && safeNumber(l.monthlyInstallment) > 0) {
          const d = parseInt(l.dueDay) || 1;
          const maxDay = new Date(y, mIdx + 1, 0).getDate();
          const safeDay = Math.min(d, maxDay);
          items.push({
            id: `ag-recv-${l.id}-${y}-${mIdx}`,
            title: `تحصيل ${l.name}`,
            date: `${y}-${pad(mIdx + 1)}-${pad(safeDay)}`,
            amount: safeNumber(l.monthlyInstallment),
            type: "success", icon: TrendingUp, desc: "💰 مستحق لك",
          });
        }
      });

      recurringItems.forEach((r) => {
        if (r.active === false) return;
        if (r.linkedLoanSystemId) return;
        const d = parseInt(r.day) || 1;
        const targetInputMonth = `${y}-${pad(mIdx + 1)}`;
        if (r.startMonth && targetInputMonth < r.startMonth) return;
        if (r.endMonth && targetInputMonth > r.endMonth) return;
        const maxDay = new Date(y, mIdx + 1, 0).getDate();
        const safeDay = Math.min(d, maxDay);
        const isIncome = r.type === "income";
        const isFee = BANK_FEE_CATEGORIES.has(r.category);
        const isMonthlyBen = r.category && r.category.startsWith("مصروف شهري - ");
        const desc = isIncome ? "💰 دخل متكرر" : isMonthlyBen ? "👨‍👩‍👧 مصروف شهري" : isFee ? "🏦 رسم بنكي" : "التزام شهري";
        const icon = isIncome ? TrendingUp : isMonthlyBen ? Users : isFee ? Receipt : Repeat;
        items.push({
          id: `ag-rec-${r.id}-${y}-${mIdx}`,
          date: `${y}-${pad(mIdx + 1)}-${pad(safeDay)}`,
          title: r.title, amount: safeNumber(r.amount),
          type: isIncome ? "success" : "warning", icon, desc,
        });
      });

      return items.sort((a, b) => (parseISODate(a.date) || 0) - (parseISODate(b.date) || 0));
    } catch (err) {
      console.error("getAgendaItems error:", err);
      return [];
    }
  }, [cards, updatedLoans, recurringItems, data]);

  /* ──────── Handlers ──────── */

  const handleApproveOne = useCallback((tx, date, txYear, txMonth, monthIdx) => {
    saveHistory();
    const next = transactions.map((t) =>
      t.id === tx.id ? { ...t, status: "paid", date, year: txYear, month: txMonth, monthIndex: monthIdx } : t,
    );
    dispatch({ type: "UPDATE_TRANSACTIONS", payload: next });
    addNotification({
      type: "success", title: "✅ تم الاعتماد",
      message: `${tx.description || tx.category}\n${fmt(tx.amount)} ج.م • ${date}`,
      duration: 5000,
    });
  }, [transactions, saveHistory, addNotification]);

  const handleApproveBulk = useCallback((items, date, txYear, txMonth, monthIdx) => {
    saveHistory();
    const ids = new Set(items.map((t) => t.id));
    const total = items.reduce((s, t) => s + safeNumber(t.amount), 0);
    const next = transactions.map((t) =>
      ids.has(t.id) ? { ...t, status: "paid", date, year: txYear, month: txMonth, monthIndex: monthIdx } : t,
    );
    dispatch({ type: "UPDATE_TRANSACTIONS", payload: next });
    addNotification({
      type: "success", title: `✅ تم اعتماد ${ids.size} معلقة`,
      message: `إجمالي: ${fmt(total)} ج.م`,
      duration: 6000,
    });
  }, [transactions, saveHistory, addNotification]);

  const handleDelete = useCallback((id) => {
    const target = currentTxRef.current.find((t) => t.id === id);
    if (!target) return;
    const expandedIds = expandTransferLinks([id], currentTxRef.current);

    dispatch({
      type: "SHOW_CONFIRM",
      danger: true,
      title: expandedIds.length > 1 ? `حذف التحويل (${expandedIds.length} قيود)` : "تأكيد الحذف",
      message: "سيتم نقلها للأرشيف مع إمكانية الاسترجاع",
      onConfirm: () => {
        const idsSet = new Set(expandedIds);
        saveHistory();
        const newTxs = currentTxRef.current.filter((t) => !idsSet.has(t.id));
        const newArchive = [
          ...(data.deletedTxArchive || []),
          ...expandedIds.map((lid) => {
            const t = currentTxRef.current.find((x) => x.id === lid);
            return t ? {
              ...t, deletedAt: new Date().toISOString(),
              deletedBy: "self", originalStatus: t.status || "pending",
            } : null;
          }).filter(Boolean),
        ].slice(-500);
        const newDeletedIds = Array.from(new Set([...(data.deletedTxIds || []), ...expandedIds])).slice(-500);

        dispatch({
          type: "SET_DATA",
          payload: { ...data, transactions: newTxs, deletedTxArchive: newArchive, deletedTxIds: newDeletedIds },
        });
        addNotification({ type: "success", title: `تم حذف ${expandedIds.length} قيد` });
        dispatch({ type: "HIDE_CONFIRM" });
      },
      onCancel: () => dispatch({ type: "HIDE_CONFIRM" }),
    });
  }, [data, saveHistory, addNotification]);

  const handleBulkDelete = useCallback((ids) => {
    if (!ids?.length) return;
    const finalIds = expandTransferLinks(ids, currentTxRef.current);
    const idsSet = new Set(finalIds);
    saveHistory();
    const newTxs = currentTxRef.current.filter((t) => !idsSet.has(t.id));
    const newArchive = [
      ...(data.deletedTxArchive || []),
      ...finalIds.map((lid) => {
        const t = currentTxRef.current.find((x) => x.id === lid);
        return t ? {
          ...t, deletedAt: new Date().toISOString(),
          deletedBy: "self", originalStatus: t.status || "pending",
        } : null;
      }).filter(Boolean),
    ].slice(-500);
    const newDeletedIds = Array.from(new Set([...(data.deletedTxIds || []), ...finalIds])).slice(-500);

    dispatch({
      type: "SET_DATA",
      payload: { ...data, transactions: newTxs, deletedTxArchive: newArchive, deletedTxIds: newDeletedIds },
    });
    addNotification({ type: "success", title: `تم حذف ${finalIds.length} قيد` });
  }, [data, saveHistory, addNotification]);

  const handleEditOne = useCallback((tx) => {
    if (isMonthClosed(data, tx.year || 2026, tx.month)) {
      addNotification({ type: "error", title: "محظور" });
      return;
    }
    dispatch({ type: "SET_FORM_MODE", payload: "edit" });
    dispatch({ type: "SET_FORM_DATA", payload: tx });
    dispatch({ type: "SET_FORM_OPEN", payload: true });
  }, [data, addNotification]);

  const handleOpenCategoryDetail = useCallback((cat) => {
    dispatch({ type: "SET_ACTIVE_CATEGORY_DETAIL", payload: cat });
  }, []);

  const handleOpenQuickAdd = useCallback((preset) => {
    dispatch({ type: "SET_FORM_MODE", payload: "add" });
    if (preset === "expense" || preset === "income") {
      dispatch({
        type: "SET_FORM_DATA",

          status: "pending", date: getLocalISODate(),

        },
      });
      dispatch({ type: "SET_FORM_OPEN", payload: true });
      setShowQuickAddSheet(false);
    } else if (preset === "card_payment") {
      dispatch({ type: "SET_CARD_PAYMENT_MODAL", payload: { cardId: null } });

    } else if (preset === "transfer") {

      setShowQuickAddSheet(false);

      dispatch({

          type: "expense", subType: "withdrawal", status: "paid",
          category: HANY_TAB_CATEGORY, method: HANY_TAB_METHOD,
          affectsCash: false, hanyEffect: "purchase",
          amount: "", date: getLocalISODate(), description: "",
        },
      });
      dispatch({ type: "SET_FORM_OPEN", payload: true });
      setShowQuickAddSheet(false);

  }, []);

  const handleReconcile = useCallback((payload) => {
    saveHistory();
    dispatch({ type: "RECONCILE_ACCOUNT", payload: { ...payload, year: selectedYear, month: selectedMonth } });
    addNotification({
      type: "success", title: "تمت المطابقة",
      message: `تسوية ${fmt(payload.diff)} ج.م`,
      duration: 6000,
    });
  }, [saveHistory, addNotification, selectedYear, selectedMonth]);

  const handleOpenRecurringModal = useCallback(() => {
    dispatch({ type: "SET_RECURRING_FORM_DATA", payload: {
      title: "", amount: "", day: 1, category: "أخرى", type: "expense",
      startMonth: "", endMonth: "", active: true, method: "cash",
    } });
    dispatch({ type: "SET_RECURRING_MODAL_OPEN", payload: true });
  }, []);

  const handleDeleteRecurring = useCallback((id) => {
    dispatch({
      type: "SHOW_CONFIRM",
      danger: true,
      title: "حذف الالتزام",
      message: "سيتم حذف البند والقيود المعلقة المرتبطة",
      onConfirm: () => {
        saveHistory();
        const newRecurring = recurringItems.filter((i) => i.id !== id);
        const newTx = (data.transactions || []).filter(
          (t) => !(t.sourceRecurringId === id && t.status !== "paid"),
        );
        const newMaterialized = { ...(data.materializedRecurring || {}) };
        Object.keys(newMaterialized).forEach((k) => {
          if (k.startsWith(id + "_")) delete newMaterialized[k];
        });
        dispatch({
          type: "SET_DATA",
          payload: { ...data, recurringItems: newRecurring, transactions: newTx, materializedRecurring: newMaterialized },
        });
        addNotification({ type: "success", title: "تم الحذف" });
        dispatch({ type: "HIDE_CONFIRM" });
      },
      onCancel: () => dispatch({ type: "HIDE_CONFIRM" }),
    });
  }, [recurringItems, data, saveHistory, addNotification]);

  const handleResetPersonalData = useCallback((options = {}) => {
    const { keepHanyTransactions = true, keepRecurringItems = true, keepCards = true } = options;

    dispatch({
      type: "SHOW_CONFIRM",
      danger: true,
      title: "⚠️ تصفير البيانات الشخصية",
      message: "سيتم مسح كل المعاملات مع الحفاظ على البطاقات وهاني والبنود المتكررة.",
      onConfirm: () => {
        saveHistory();
        const hanyTxs = keepHanyTransactions
          ? (data.transactions || []).filter((t) =>
              isHanyShopCategory(t.category) || isHanySettleCategory(t.category) ||
              t.hanyEffect === "settle" || t.hanyEffect === "purchase")
          : [];

        const takyeefLoan = (data.loans || []).find((l) => l.systemId === SYSTEM_LOAN_IDS.TAKYEEF || isTakyeefLoan(l));
        const zeroedAccounts = {};
        ACCOUNT_KEYS.forEach((k) => {
          zeroedAccounts[k] = {
            ...(data.accountsData?.[k] || DEFAULT_ACCOUNTS[k]),
            initialBalance: 0, balance: 0, initialDate: null, lastUpdated: null,
          };
        });

        const resetCards = keepCards
          ? (data.cards || []).map((c) => ({
              ...c, openingDebt: 0, availableBalance: safeNumber(c.limit),
              openingDebtDate: getLocalISODate(), openingDate: getLocalISODate(),
            }))
          : [];
        const keptRecurring = keepRecurringItems ? data.recurringItems || [] : [];
        const keptIds = new Set(hanyTxs.map((t) => t.id).filter(Boolean));
        const removedIds = (data.transactions || []).filter((t) => t.id && !keptIds.has(t.id)).map((t) => t.id);

        const fresh = {
          ...data,
          engineVersion: CURRENT_ENGINE_VERSION,
          transactions: hanyTxs,
          loans: [...(takyeefLoan ? [takyeefLoan] : [])],
          cards: resetCards,
          recurringItems: keptRecurring,
          accountsData: zeroedAccounts,
          custodyEntries: [],
          cashbackTrackers: [],
          monthlyPlans: {},
          closedMonths: [],
          monthlySnapshots: {},
          materializedRecurring: {},
          reconciliations: [],
          settledHanyMonths: [],
          cardInstallments: [],
          deletedTxIds: removedIds,
          deletedTxArchive: [],
          deleteRequests: [],
          auditLog: [
            buildAuditEntry(AUDIT.RESET, "app", "full", {
              note: `تصفير شامل — ${hanyTxs.length} معاملة هاني + ${resetCards.length} بطاقة`,
            }),
            ...(data.auditLog || []),
          ].slice(0, 1000),
          hanyPayableCache: computeHanyPayable({ ...data, transactions: hanyTxs }),
          __resetAt: new Date().toISOString(),
        };
        dispatch({ type: "SET_DATA", payload: fresh });
        addNotification({
          type: "success",
          title: "✅ تم تصفير البيانات",
          message: "البطاقات وهاني محفوظة.",
          duration: 7000,
        });
        dispatch({ type: "HIDE_CONFIRM" });
      },
      onCancel: () => dispatch({ type: "HIDE_CONFIRM" }),
    });
  }, [data, saveHistory, addNotification]);

  /* Loading screens */
  if (authLoading) return <LoadingScreen message="جاري التحميل..." />;
  if (isAuthenticated && cloudSyncStatus === "pending")
    return <LoadingScreen message="جاري مزامنة البيانات..." />;
  if (!isAuthenticated)
    return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
  if (!pinVerified)
    return (
      <PinLockScreen
        onSuccess={async (pin) => {
          try { await savePinSession(pin); } catch (e) {}
          setPinVerified(true);
        }}
        onLogout={() => {
          firebase.auth().signOut();
          setIsAuthenticated(false);
          sessionStorage.removeItem(PIN_SESSION_KEY);
          setPinVerified(false);
        }}
      />
    );

  /* Render Active View */
  const renderActiveView = () => {
    switch (activeTab) {
      case "dashboard":
        return (
          <DashboardPage
            data={data}
            liveBalances={liveBalances}
            liquidityDual={liquidityDual}
            netWorthData={netWorthData}
            dispatch={dispatch}
            selectedYear={selectedYear}
            selectedMonth={selectedMonth}
            transactions={transactions}
            cards={cards}
            updatedLoans={updatedLoans}
            onSelectYear={(y) => dispatch({ type: "SET_SELECTED_YEAR", payload: y })}
            onSelectMonth={(m) => dispatch({ type: "SET_SELECTED_MONTH", payload: m })}
            onNavigate={(id) => dispatch({ type: "SET_ACTIVE_TAB", payload: id })}
            onOpenQuickAdd={handleOpenQuickAdd}
          />
        );
      case "transactions":
        return (
          <TransactionsPage
            transactions={transactions}
            selectedMonth={selectedMonth}
            selectedYear={selectedYear}
            data={data}
            dispatch={dispatch}
            addNotification={addNotification}
            onSelectYear={(y) => dispatch({ type: "SET_SELECTED_YEAR", payload: y })}
            onSelectMonth={(m) => dispatch({ type: "SET_SELECTED_MONTH", payload: m })}
            onApproveOne={handleApproveOne}
            onApproveBulk={handleApproveBulk}
            onEditOne={handleEditOne}
            onDeleteOne={(tx) => handleDelete(tx.id)}
            onBulkDelete={handleBulkDelete}
          />
        );
      case "hany":
        return (
          <HanyPage
            data={data}
            dispatch={dispatch}
            addNotification={addNotification}
            selectedYear={selectedYear}
            selectedMonth={selectedMonth}
            onOpenQuickPurchase={(item) => handleOpenQuickAdd("hany")}
            onOpenSettle={() => {
              dispatch({ type: "SET_HANY_SETTLE_MODAL", payload: true });
            }}
          />
        );
      case "cards":
        return (
          <CardsPage
            data={data}
            dispatch={dispatch}
            addNotification={addNotification}
            liveBalances={liveBalances}
            onOpenCardStatement={(card) => dispatch({ type: "SET_VIEWING_CARD_STATEMENT", payload: card })}
            onOpenCardPayment={(cardId) => dispatch({ type: "SET_CARD_PAYMENT_MODAL", payload: { cardId } })}
            onOpenReconcile={(accountKey) => dispatch({
              type: "SET_RECONCILIATION_MODAL",
              payload: { accountKey, computedBalance: liveBalances[accountKey] || 0 },
            })}
          />
        );
      case "categories":
        return (
          <CategoriesPage
            transactions={transactions}
            selectedMonth={selectedMonth}
            selectedYear={selectedYear}
            budgets={budgets}
            dispatch={dispatch}
            onSelectYear={(y) => dispatch({ type: "SET_SELECTED_YEAR", payload: y })}
            onSelectMonth={(m) => dispatch({ type: "SET_SELECTED_MONTH", payload: m })}
            onOpenCategoryDetail={handleOpenCategoryDetail}
          />
        );
      case "loans":
        return (
          <LoansPage
            data={data}
            updatedLoans={updatedLoans}
            dispatch={dispatch}
            addNotification={addNotification}
            onOpenRecurringModal={handleOpenRecurringModal}
            onDeleteRecurring={handleDeleteRecurring}
          />
        );
      case "reports":
        return (
          <ReportsPage
            data={data}
            liveBalances={liveBalances}
            updatedLoans={updatedLoans}
            selectedMonth={selectedMonth}
            selectedYear={selectedYear}
            addNotification={addNotification}
          />
        );
      case "financial-forecast":
        return (
          <ForecastPage
            data={data}
            transactions={transactions}
            cards={cards}
            updatedLoans={updatedLoans}
            recurringItems={recurringItems}
            liveBalances={liveBalances}
            monthlyPlans={monthlyPlans}
            selectedYear={selectedYear}
            selectedMonth={selectedMonth}
            liquidityDual={liquidityDual}
          />
        );
      case "calendar":
        return (
          <CalendarPage
            data={data}
            getAgendaItems={getAgendaItems}
            updatedLoans={updatedLoans}
            cards={cards}
          />
        );
      case "settings":
        return (
          <SettingsPage
            data={data}
            dispatch={dispatch}
            addNotification={addNotification}
            saveHistory={saveHistory}
            onOpenPinChange={() => dispatch({ type: "SET_PIN_CHANGE_OPEN", payload: true })}
            onResetPersonalData={handleResetPersonalData}
          />
        );
      case "duplicates":
      case "data-health":
      case "deleted":
        return (
          <div className="card" style={{ marginTop: 12 }}>
            <EmptyState
              icon={ShieldCheck}
              title="قريباً"
              message="هذه الصفحة قيد التطوير في إصدار قادم"
              size="lg"
            />
          </div>
        );
      default:
        return null;
    }
  };

  return (
    <ToastProvider>
      <ConfirmProvider>
        <PromptProvider>
          <div style={{ minHeight: "100dvh" }}>
            {!isOnline && (
              <div style={{
                position: "fixed", top: 0, left: 0, right: 0,
                zIndex: 3000, padding: "8px 12px",
                background: "#D97706", color: "white",
                textAlign: "center", fontSize: 11, fontWeight: 900,
                display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
              }}>
                <Wifi size={12} />
                وضع عدم الاتصال — التغييرات محفوظة محلياً
              </div>
            )}

            <Sidebar
              isOpen={isSidebarOpen}
              onClose={() => dispatch({ type: "SET_SIDEBAR_OPEN", payload: false })}
              activeTab={activeTab}
              onNavigate={(id) => dispatch({ type: "SET_ACTIVE_TAB", payload: id })}
              isDarkMode={isDarkMode}
              onToggleTheme={() => dispatch({ type: "TOGGLE_DARK_MODE", payload: !isDarkMode })}
              isOnline={isOnline}
              syncStatus={cloudSyncStatus}
              isSaving={isSaving}
              hanyPayable={netWorthData.hanyPayable}
              data={data}
              onLogout={() => {
                firebase.auth().signOut();
                setIsAuthenticated(false);
                sessionStorage.removeItem(PIN_SESSION_KEY);
                setPinVerified(false);
              }}
              onLock={() => {
                sessionStorage.removeItem(PIN_SESSION_KEY);
                setPinVerified(false);
              }}
              onOpenSms={() => dispatch({ type: "SET_SMS_MODAL_OPEN", payload: true })}
            />

            {isProcessing && (
              <div className="processing-overlay">
                <div className="spinner" style={{ marginBottom: 16 }} />
                <h3 style={{ fontSize: 15, fontWeight: 900, marginBottom: 8 }}>
                  جاري تطبيق العملية
                </h3>
              </div>
            )}

            {isPinChangeOpen && (
              <PinChangeModal
                onClose={() => dispatch({ type: "SET_PIN_CHANGE_OPEN", payload: false })}
                addNotification={addNotification}
              />
            )}

            {isSmsModalOpen && (
              <SmsParserModal
                data={data}
                dispatch={dispatch}
                addNotification={addNotification}
                saveHistory={saveHistory}
                onClose={() => dispatch({ type: "SET_SMS_MODAL_OPEN", payload: false })}
              />
            )}

            {activeCategoryDetail && (
              <CategoryDetailModal
                category={activeCategoryDetail}
                transactions={transactions}
                selectedMonth={selectedMonth}
                selectedYear={selectedYear}
                onClose={() => dispatch({ type: "SET_ACTIVE_CATEGORY_DETAIL", payload: null })}
                addNotification={addNotification}
              />
            )}

            {viewingCardStatement && (
              <CardStatementModal
                card={viewingCardStatement}
                data={data}
                transactions={transactions}
                onClose={() => dispatch({ type: "SET_VIEWING_CARD_STATEMENT", payload: null })}
                addNotification={addNotification}
                dispatch={dispatch}
              />
            )}

            {cardPaymentModal && (
              <CardPaymentModal
                cardId={cardPaymentModal.cardId}
                data={data}
                dispatch={dispatch}
                saveHistory={saveHistory}
                addNotification={addNotification}
                onClose={() => dispatch({ type: "SET_CARD_PAYMENT_MODAL", payload: null })}
              />
            )}

            {reconciliationModal && (
              <ReconciliationModal
                accountKey={reconciliationModal.accountKey}
                computedBalance={reconciliationModal.computedBalance}
                onClose={() => dispatch({ type: "SET_RECONCILIATION_MODAL", payload: null })}
                onReconcile={handleReconcile}
                addNotification={addNotification}
              />
            )}

            {state.isQuickTransferModalOpen && (
              <ExternalTransferModal
                data={data}
                dispatch={dispatch}
                saveHistory={saveHistory}
                addNotification={addNotification}
                onClose={() => dispatch({ type: "SET_QUICK_TRANSFER_MODAL_OPEN", payload: false })}
              />
            )}

            {state.hanySettleModal && (
              <HanySettleModal
                data={data}
                dispatch={dispatch}
                saveHistory={saveHistory}
                addNotification={addNotification}
                onClose={() => dispatch({ type: "SET_HANY_SETTLE_MODAL", payload: false })}
              />
            )}

            {isFormOpen && (
              <TransactionForm
                isOpen={true}
                formMode={formMode}
                formData={formData}
                dispatch={dispatch}
                saveHistory={saveHistory}
                addNotification={addNotification}
                transactions={transactions}
                data={data}
                cards={cards}
                liveBalances={liveBalances}
                onClose={() => dispatch({ type: "SET_FORM_OPEN", payload: false })}
              />
            )}

            {isRecurringModalOpen && (
              <RecurringModal
                formData={recurringFormData}
                dispatch={dispatch}
                onClose={() => dispatch({ type: "SET_RECURRING_MODAL_OPEN", payload: false })}
                saveHistory={saveHistory}
                addNotification={addNotification}
                recurringItems={recurringItems}
              />
            )}

            {state.confirmDialog.isOpen && (
              <ConfirmDialog
                dialog={state.confirmDialog}
                setDialog={(updater) => {
                  const newState = typeof updater === "function" ? updater(state.confirmDialog) : updater;
                  if (!newState.isOpen) dispatch({ type: "HIDE_CONFIRM" });
                }}
              />
            )}

            {state.editingCard && (
              <Modal isOpen={true} onClose={() => dispatch({ type: "SET_EDITING_CARD", payload: null })} title="تعديل البطاقة" icon="💳">
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  <InfoRow label="البنك" value={state.editingCard.bank} />
                  <InfoRow label="الاسم" value={state.editingCard.name} />
                  <InfoRow label="الحد" value={fmt(state.editingCard.limit)} />
                </div>
              </Modal>
            )}

            <BottomNav
              activeTab={activeTab}
              onNavigate={(id) => dispatch({ type: "SET_ACTIVE_TAB", payload: id })}
              onQuickAdd={() => setShowQuickAddSheet(true)}
              onMore={() => setShowMoreSheet(true)}
            />

            <QuickAddSheet
              isOpen={showQuickAddSheet}
              onClose={() => setShowQuickAddSheet(false)}
              onSelect={handleOpenQuickAdd}
              onOpenSms={() => dispatch({ type: "SET_SMS_MODAL_OPEN", payload: true })}
            />

            <MoreSheet
              isOpen={showMoreSheet}
              onClose={() => setShowMoreSheet(false)}
              onNavigate={(id) => dispatch({ type: "SET_ACTIVE_TAB", payload: id })}
            />

            <main style={{ padding: "12px 12px 100px", maxWidth: 1100, margin: "0 auto" }}>
              <ProfessionalHeader
                isDarkMode={isDarkMode}
                onToggleTheme={() => dispatch({ type: "TOGGLE_DARK_MODE", payload: !isDarkMode })}
                onOpenSidebar={() => dispatch({ type: "SET_SIDEBAR_OPEN", payload: true })}
                isOnline={isOnline}
                syncStatus={cloudSyncStatus}
                isSaving={isSaving}
                hanyPayable={netWorthData.hanyPayable}
                onOpenSms={() => dispatch({ type: "SET_SMS_MODAL_OPEN", payload: true })}
                onOpenPrintCenter={() => dispatch({ type: "SET_ACTIVE_TAB", payload: "reports" })}
                onOpenQuickAdd={() => setShowQuickAddSheet(true)}
              />
              <div className="animate-fadeIn">
                {renderActiveView()}
              </div>
            </main>
          </div>
        </PromptProvider>
      </ConfirmProvider>
    </ToastProvider>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   9) ERROR BOUNDARY
   ═══════════════════════════════════════════════════════════════════ */
class ErrorBoundary extends React.Component {
  constructor(p) {
    super(p);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(e, i) {
    console.error("App Error:", e, i);
  }
  safeReset = () => {
    const keep = {};
    try {
      [PIN_HASH_KEY, THEME_KEY, BUDGETS_KEY].forEach((k) => {
        const v = localStorage.getItem(k);
        if (v) keep[k] = v;
      });
      localStorage.clear();
      Object.entries(keep).forEach(([k, v]) => localStorage.setItem(k, v));
    } catch (e) {}
    window.location.reload();
  };
  render() {
    if (this.state.hasError)
      return (
        <div style={{
          minHeight: "100dvh", display: "flex", flexDirection: "column",
          alignItems: "center", justifyContent: "center",
          padding: 24, textAlign: "center", background: "var(--bg-app)",
          fontFamily: "Cairo, sans-serif", direction: "rtl",
        }}>
          <div style={{
            width: 80, height: 80, borderRadius: 24,
            display: "flex", alignItems: "center", justifyContent: "center",
            background: "var(--negative-soft)", marginBottom: 24,
          }}>
            <AlertTriangle size={36} style={{ color: "var(--negative)" }} />
          </div>
          <h1 style={{ fontSize: 22, fontWeight: 900, marginBottom: 12 }}>
            حدث خطأ تقني
          </h1>
          <p style={{
            fontSize: 13, marginBottom: 24, maxWidth: 400,
            color: "var(--text-secondary)", wordBreak: "break-word",
          }}>
            {String(this.state.error?.message || "خطأ غير معروف")}
          </p>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", justifyContent: "center" }}>
            <button onClick={() => window.location.reload()} className="btn btn-primary">
              <RefreshCcw size={16} /> إعادة المحاولة
            </button>
            <button onClick={this.safeReset} className="btn btn-secondary">
              <RotateCcw size={16} /> إعادة تعيين آمنة
            </button>
          </div>
        </div>
      );
    return this.props.children;
  }
}

/* ═══════════════════════════════════════════════════════════════════
   10) ROOT RENDER
   ═══════════════════════════════════════════════════════════════════ */
const rootElement = document.getElementById("root");
if (rootElement) {
  createRoot(rootElement).render(
    <ErrorBoundary>
      <App />
    </ErrorBoundary>,
  );

  const hideLoading = () => {
    const l = document.getElementById("loading");
    if (!l) return;
    l.style.transition = "opacity 0.4s ease";
    l.style.opacity = "0";
    setTimeout(() => { l.style.display = "none"; }, 400);
  };

  if (document.readyState === "complete") {
    setTimeout(hideLoading, 500);
  } else {
    window.addEventListener("load", () => setTimeout(hideLoading, 500));
  }
}
