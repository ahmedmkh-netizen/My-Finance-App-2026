<div className="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
<span className="text-xs text-slate-400 font-bold bg-white dark:bg-slate-800 px-3 py-1 rounded-full">{items.length} موعد</span>
</div>
<div className="relative pr-8 space-y-3">
<div className="absolute right-3 top-0 bottom-0 w-0.5 timeline-line"></div>
{items.map((item) => {
const daysLeft = calculateDaysLeft(item.date);
const isUrgent = daysLeft !== null && daysLeft <= 3 && daysLeft >= 0;
const isOverdue = daysLeft !== null && daysLeft < 0;
const Icon = item.icon;
return (
<div key={item.id} className="relative">
<div className={`absolute -right-[22px] top-6 w-5 h-5 rounded-full border-4 border-white dark:border-slate-900 shadow-lg ${isOverdue ? 'bg-red-500 animate-pulse' : isUrgent ? 'bg-amber-500 animate-pulse' : item.type === 'danger' ? 'bg-red-400' : 'bg-blue-500'}`}></div>
<div className={`glass p-5 rounded-2xl flex justify-between items-center shadow-sm hover:shadow-md transition-all flex-wrap gap-3 ${isOverdue ? 'border-r-4 border-r-red-500 bg-red-50/20' : isUrgent ? 'border-r-4 border-r-amber-500 bg-amber-50/20' : 'border-r-4 border-r-slate-300 dark:border-r-slate-700'}`}>
<div className="flex items-center gap-4 flex-1 min-w-0">
<div className={`p-3 rounded-2xl ${isOverdue ? 'gradient-bg-danger text-white' : isUrgent ? 'gradient-bg-warning text-white' : item.type === 'danger' ? 'bg-red-100 text-red-600 dark:bg-red-900/30' : 'gradient-bg-primary text-white'}`}><Icon size={22} /></div>
<div className="flex-1 min-w-0">
<p className="font-bold truncate">{item.title}</p>
<div className="flex items-center gap-2 mt-1 flex-wrap">
<span className="text-[10px] font-bold bg-slate-100 dark:bg-slate-700 text-slate-500 px-2 py-0.5 rounded-lg">📅 {item.date}</span>
{daysLeft !== null && (
<span className={`text-[10px] font-black px-2 py-0.5 rounded-lg ${isOverdue ? 'bg-red-100 text-red-600' : daysLeft === 0 ? 'bg-red-100 text-red-600 animate-pulse' : isUrgent ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'}`}>
{isOverdue ? `متأخر ${Math.abs(daysLeft)} يوم` : daysLeft === 0 ? 'يستحق اليوم!' : `باقي ${daysLeft} يوم`}
</span>
)}
</div>
{item.desc && <p className="text-[10px] text-slate-400 mt-1 truncate">{item.desc}</p>}
</div>
</div>
<div className="flex items-center gap-3">
<p className="font-black text-lg">{safeNumber(item.amount).toLocaleString()}<span className="text-xs font-normal text-slate-400 mr-1">ج.م</span></p>
<button onClick={() => {
dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', amount: item.amount, description: item.title, category: 'الالتزامات البنكية والتمويلية', date: getLocalISODate(), month: selectedMonth, method: 'instapay', subType: 'withdrawal', status: 'paid' } });
dispatch({ type: 'SET_FORM_OPEN', payload: true });
}} className="p-3 bg-blue-50 dark:bg-blue-900/20 text-blue-600 rounded-xl hover:bg-blue-100 no-print"><CheckCircle2 size={18} /></button>
</div>
</div>
</div>
);
})}
</div>
</div>
))}
</div>
);
};

// ===== View Router =====
const renderActiveView = () => {
switch (activeTab) {
case 'dashboard': return renderDashboard();
case 'transactions': return renderTransactionsViewFull();
case 'categories': return renderCategoriesView();
case 'loans': return renderLoansView();
case 'cards': return renderWalletsAndCardsView();
case 'calendar': return renderCalendarView();
case 'planner': return renderStrategicPlanner();
case 'duplicates': return <DuplicateDetectionSystem transactions={transactions} dispatch={dispatch} addNotification={addNotification} closedMonths={data.closedMonths} />;
default: return renderDashboard();
}
};

// ===== Sidebar =====
const EnhancedSidebar = () => (
<aside className="w-80 glass border-l-0 dark:border-r border-white/20 hidden lg:flex flex-col p-6 z-40 relative no-print">
<div className="flex items-center gap-4 mb-8 p-4 rounded-2xl gradient-border">
<div className="gradient-bg-primary p-3 rounded-2xl text-white shadow-lg"><Wallet size={28} /></div>
<div><h2 className="font-black text-xl text-slate-900 dark:text-white">المحفظة الذكية</h2><p className="text-xs text-slate-500 font-bold">V55 Pro</p></div>
</div>
<nav className="space-y-2 flex-1 scroll-hide overflow-y-auto">
{[
{ id: 'dashboard', label: 'لوحة التحكم', icon: LayoutDashboard, color: 'text-blue-500' },
{ id: 'transactions', label: 'سجل المعاملات', icon: ArrowUpRight, color: 'text-emerald-500' },
{ id: 'categories', label: 'الفئات والميزانية', icon: Layers, color: 'text-purple-500' },
{ id: 'loans', label: 'القروض والديون', icon: Banknote, color: 'text-red-500' },
{ id: 'cards', label: 'البطاقات والمحافظ', icon: CreditCard, color: 'text-amber-500' },
{ id: 'planner', label: 'المخطط الاستراتيجي', icon: Target, color: 'text-indigo-500' },
{ id: 'calendar', label: 'الأجندة والمواعيد', icon: CalendarDays, color: 'text-pink-500' },
{ id: 'duplicates', label: 'كشف المكررات', icon: Filter, color: 'text-cyan-500' }
].map(item => (
<button key={item.id} type="button" onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })}
className={`w-full flex items-center gap-4 px-4 py-3 rounded-xl transition-all duration-300 font-medium ${activeTab === item.id ? 'gradient-bg-primary text-white shadow-lg' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50'}`}>
<item.icon size={20} className={activeTab === item.id ? 'text-white' : item.color} />
<span className="text-sm">{item.label}</span>
{activeTab === item.id && <div className="ml-auto w-2 h-2 bg-white rounded-full animate-pulse" />}
</button>
))}
</nav>
<div className="mt-8 p-4 rounded-2xl bg-slate-50/50 dark:bg-slate-800/30">
<h4 className="text-sm font-bold text-slate-500 mb-3">اختصارات لوحة المفاتيح</h4>
<div className="space-y-2 text-xs text-slate-500">
<div className="flex justify-between"><span>حفظ</span><span className="kbd">Ctrl+S</span></div>
<div className="flex justify-between"><span>إغلاق</span><span className="kbd">Esc</span></div>
<div className="flex justify-between"><span>البحث</span><span className="kbd">Ctrl+K</span></div>
</div>
</div>
</aside>
);

// ===== Header =====
const ProfessionalHeader = () => (
<header className="flex flex-col md:flex-row justify-between items-center gap-6 mb-8">
<div className="flex-1">
<div className="flex items-center gap-4 mb-2">
<div className="gradient-bg-primary p-3 rounded-2xl text-white shadow-lg"><Wallet size={28} /></div>
<div>
<h1 className="text-3xl font-black text-slate-900 dark:text-white tracking-tight">محفظتي المالية</h1>
<p className="text-sm text-slate-500 font-medium mt-1">إدارة مالية ذكية • {selectedYear} • V55</p>
</div>
</div>
</div>
<div className="flex flex-wrap gap-3">
<button type="button" onClick={() => dispatch({ type: 'SET_AI_MODAL_OPEN', payload: true })} className="gradient-bg-primary text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all flex items-center gap-2">
<Sparkles size={20} /> المساعد
</button>
<div className="flex bg-white dark:bg-slate-800 p-1 rounded-xl shadow-md">
<button type="button" onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: false })} className={`p-3 rounded-lg transition-all ${!isDarkMode ? 'bg-blue-50 text-blue-600 shadow-sm' : 'text-slate-400'}`}><Sun size={20} /></button>
<button type="button" onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: true })} className={`p-3 rounded-lg transition-all ${isDarkMode ? 'bg-slate-700 text-blue-400 shadow-sm' : 'text-slate-400'}`}><Moon size={20} /></button>
</div>
</div>
</header>
);

// ===== Auth Loading / Login =====
if (authLoading) {
return (<div className="flex h-screen items-center justify-center bg-slate-900"><div className="text-center"><div className="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div><p className="text-white text-lg font-bold">جاري التحقق...</p></div></div>);
}
if (!isAuthenticated) return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;

// ===== MAIN RENDER =====
return (
<div className="flex h-screen overflow-hidden text-slate-800 dark:text-slate-100 font-sans">
<ProfessionalTicker />
<ToastContainer notifications={notifications} removeNotification={removeNotification} />
<ConfirmDialog confirmDialog={confirmDialog} dispatch={dispatch} />

{isProcessing && (
<div className="processing-overlay">
<div className="processing-spinner mb-4"></div>
<h3 className="text-xl font-bold mb-2">جاري تطبيق العملية</h3>
<p className="text-sm opacity-80 mb-6">قد تستغرق بضع ثوانٍ</p>
<button onClick={() => { dispatch({ type: 'SET_IS_PROCESSING', payload: false }); addNotification({ type: 'info', title: 'تم الإلغاء' }); }} className="px-6 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold">إلغاء <span className="kbd mr-2">Esc</span></button>
</div>
)}

{viewingCardStatement && (() => {
const history = calculateCardHistory(viewingCardStatement);
const monthData = history.find(h => h.month === selectedMonth);
const cardMethod = viewingCardStatement.name === 'SWYPE' ? 'cib_swype' : (viewingCardStatement.bank === 'CIB' ? 'cib_card' : 'aaib_card');
return (
<div className="modal-backdrop z-[3500] no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
<div className="p-8 border-b bg-slate-50/50 dark:bg-slate-800/30">
<div className="flex justify-between items-start flex-wrap gap-3">
<div className="flex items-center gap-3">
<BankLogo type={`${viewingCardStatement.bank.toLowerCase()}_card`} size={40} />
<div><h3 className="text-2xl font-black">{viewingCardStatement.bank} - {viewingCardStatement.name}</h3><p className="text-sm text-slate-500 font-bold mt-1">{selectedMonth}</p></div>
</div>
<div className="flex gap-2">
<button type="button" onClick={() => {
const trans = transactions.filter(t => t.method === cardMethod && t.month === selectedMonth).sort((a,b)=>new Date(b.date)-new Date(a.date));
printReport(`كشف ${viewingCardStatement.bank} - ${selectedMonth}`, trans);
}} className="bg-blue-50 text-blue-600 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2"><Printer size={18} /> طباعة</button>
<button type="button" onClick={() => dispatch({ type: 'SET_VIEWING_CARD_STATEMENT', payload: null })} className="p-2 hover:bg-red-50 hover:text-red-500 text-slate-400 rounded-xl"><X size={24} /></button>
</div>
</div>
<div className="grid grid-cols-2 gap-4 mt-6">
<div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border-r-4 border-amber-500"><p className="text-[10px] font-bold text-slate-400 uppercase">بداية المدة</p><p className="text-lg font-black">{Math.round(monthData?.openingDebt || 0).toLocaleString()} ج.م</p></div>
<div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border-r-4 border-blue-500"><p className="text-[10px] font-bold text-slate-400 uppercase">نهاية المدة</p><p className="text-lg font-black text-blue-600">{Math.round(monthData?.closingDebt || 0).toLocaleString()} ج.م</p></div>
</div>
</div>
<div className="flex-1 overflow-y-auto p-8 scroll-hide">
<table className="w-full text-right">
<thead className="bg-slate-50 dark:bg-slate-800 sticky top-0">
<tr><th className="p-4 border-b text-xs">التاريخ</th><th className="p-4 border-b text-xs">الوصف</th><th className="p-4 border-b text-xs">الفئة</th><th className="p-4 border-b text-xs text-left">المبلغ</th></tr>
</thead>
<tbody className="divide-y text-sm font-bold">
{transactions.filter(t => t.method === cardMethod && t.month === selectedMonth).sort((a,b)=>new Date(b.date)-new Date(a.date)).map(t => (
<tr key={t.id} className="hover:bg-blue-50/50">
<td className="p-4 text-slate-500">{t.date}</td>
<td className="p-4">{t.description || '-'}</td>
<td className="p-4"><span className="bg-white dark:bg-slate-800 px-2 py-1 rounded text-xs border">{t.category}</span></td>
<td className="p-4 text-left font-black">{safeNumber(t.amount).toLocaleString()} ج.م</td>
</tr>
))}
{transactions.filter(t => t.method === cardMethod && t.month === selectedMonth).length === 0 && (
<tr><td colSpan="4" className="p-12 text-center text-slate-400">لا توجد عمليات</td></tr>
)}
</tbody>
</table>
</div>
</div>
</div>
);
})()}

<div className="bottom-nav-container no-print">
<div className="scrollable-nav scroll-hide">
{[
{ id: 'dashboard', label: 'الرئيسية', icon: LayoutDashboard },
{ id: 'transactions', label: 'المعاملات', icon: ArrowUpRight },
{ id: 'cards', label: 'المحافظ', icon: CreditCard },
{ id: 'loans', label: 'القروض', icon: Banknote },
{ id: 'planner', label: 'المخطط', icon: Target },
{ id: 'calendar', label: 'الأجندة', icon: CalendarDays },
{ id: 'duplicates', label: 'المكررات', icon: Filter },
{ id: 'categories', label: 'الفئات', icon: Layers }
].map(item => (
<button key={item.id} type="button" onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} className={`nav-btn ${activeTab === item.id ? 'active' : ''}`}>
<item.icon size={24} /><span>{item.label}</span>
</button>
))}
<div className="v-line"></div>
<button type="button" onClick={handleExportCSV} className="nav-btn text-emerald-600 hover:bg-emerald-50"><FileSpreadsheet size={24} /><span>CSV</span></button>
<button type="button" onClick={handleExport} className="nav-btn text-blue-600 hover:bg-blue-50"><Download size={24} /><span>حفظ</span></button>
<label className="nav-btn cursor-pointer text-purple-600 hover:bg-purple-50"><input type="file" accept=".json" onChange={handleImport} className="hidden" /><Upload size={24} /><span>جلب</span></label>
<button type="button" onClick={resetData} className="nav-btn text-red-500 hover:bg-red-50"><RefreshCcw size={24} /><span>مسح</span></button>
<div className="v-line"></div>
<button type="button" onClick={() => mainContentRef.current?.scrollTo({ top: 0, behavior: 'smooth' })} className="nav-btn"><ArrowUp size={24} /><span>أعلى</span></button>
<button type="button" onClick={() => dispatch({ type: 'SET_IS_LOCKED', payload: true })} className="nav-btn text-amber-500 hover:bg-amber-50"><Lock size={24} /><span>قفل</span></button>
<button type="button" onClick={() => { firebase.auth().signOut(); setIsAuthenticated(false); }} className="nav-btn text-red-600 hover:bg-red-50"><LogOut size={24} /><span>خروج</span></button>
</div>
</div>

{!isLocked && (
<button type="button" onClick={() => {
dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', category: '', amount: '', date: getLocalISODate(), month: selectedMonth, method: 'cash', subType: 'withdrawal', status: 'paid' } });
dispatch({ type: 'SET_FORM_OPEN', payload: true });
}} className="fab no-print"><Plus size={32} /></button>
)}

<EnhancedSidebar />

<main ref={mainContentRef} className="flex-1 overflow-y-auto p-4 lg:p-8 pt-12">
{isLocked ? (
<div className="lock-screen min-h-screen flex flex-col items-center justify-center backdrop-blur-3xl no-print">
<Lock size={80} className="mb-8 text-blue-500 animate-bounce-slight" />
<h2 className="text-4xl font-black mb-8">التطبيق مقفل</h2>
<button type="button" onClick={() => dispatch({ type: 'SET_IS_LOCKED', payload: false })} className="gradient-bg-primary text-white px-16 py-5 rounded-full font-bold shadow-2xl flex items-center gap-3 hover:scale-105">
<Unlock size={24} /> فتح التطبيق
</button>
</div>
) : (
<div className="max-w-7xl mx-auto space-y-8 animate-fadeIn pb-24">
<ProfessionalHeader />
{renderActiveView()}
</div>
)}
</main>

{/* Transaction Form Modal */}
{isFormOpen && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden max-h-[95vh] flex flex-col">
<div className="p-6 border-b flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/30">
<h3 className="text-2xl font-black flex items-center gap-3">
<div className="gradient-bg-primary p-2 rounded-xl text-white shadow-lg"><Plus size={20} /></div>
{formMode === 'add' ? 'إضافة عملية' : 'تعديل عملية'}
</h3>
<button type="button" onClick={() => dispatch({ type: 'SET_FORM_OPEN', payload: false })} className="text-slate-400 hover:text-red-500 p-2 hover:bg-red-50 rounded-xl"><X size={24} /></button>
</div>
<form onSubmit={handleSaveTransaction} className="p-6 space-y-5 overflow-y-auto scroll-hide" id="transaction-form">
<div className="grid grid-cols-2 gap-4">
<div>
<label className="block text-sm font-bold mb-2 text-slate-400">النوع</label>
<select className="input-field font-bold" value={formData.type} onChange={(e) => {
const t = e.target.value;
dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, type: t, subType: t === 'income' ? 'deposit' : 'withdrawal', category: '' } });
}}>
<option value="expense">مصروف 💸</option>
<option value="income">دخل 💰</option>
</select>
</div>
<div>
<label className="block text-sm font-bold mb-2 text-slate-400">الفئة</label>
<select className={`input-field font-bold ${formErrors.category ? 'error' : ''}`} value={formData.category} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, category: e.target.value } })} required>
<option value="">اختر التصنيف...</option>
{Object.entries(CATEGORY_GROUPS[formData.type]).map(([groupName, items]) => (
<optgroup key={groupName} label={groupName}>{items.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>
))}
</select>
</div>
</div>

{/* حالة العملية */}
<div className="bg-gradient-to-r from-amber-50 to-emerald-50 dark:from-amber-900/20 dark:to-emerald-900/20 p-4 rounded-2xl border-2 border-dashed border-amber-300 dark:border-amber-700">
<div className="flex items-center gap-2 mb-3">
<Clock size={16} className="text-amber-600" />
<label className="text-xs font-black uppercase">حالة العملية</label>
</div>
<div className="grid grid-cols-2 gap-3">
<label className={`flex items-center justify-center gap-2 p-4 rounded-xl cursor-pointer border-2 transition-all font-bold text-sm ${formData.status !== 'paid' ? 'bg-white border-amber-500 shadow-md text-amber-700 dark:bg-slate-800' : 'border-transparent bg-white/50 text-slate-400'}`}>
<input type="radio" name="status" value="pending" className="hidden" checked={formData.status !== 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'pending' } })} />
<Clock size={20} />
<div className="text-right"><div>⏳ معلق / متوقع</div><div className="text-[9px] opacity-70">لا يؤثر على الرصيد</div></div>
</label>
<label className={`flex items-center justify-center gap-2 p-4 rounded-xl cursor-pointer border-2 transition-all font-bold text-sm ${formData.status === 'paid' ? 'bg-white border-emerald-500 shadow-md text-emerald-700 dark:bg-slate-800' : 'border-transparent bg-white/50 text-slate-400'}`}>
<input type="radio" name="status" value="paid" className="hidden" checked={formData.status === 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'paid' } })} />
<CheckCircle2 size={20} />
<div className="text-right"><div>✅ معتمد</div><div className="text-[9px] opacity-70">يدخل الرصيد</div></div>
</label>
</div>
</div>

{(['fawry', 'etisalat', 'cib_savings', 'aaib_savings'].includes(formData.method)) && (
<div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl border border-dashed">
<label className="block text-xs font-bold mb-3 text-slate-500">نوع العملية</label>
<div className="flex gap-4">
<label className={`flex-1 flex items-center justify-center gap-2 p-3 rounded-xl cursor-pointer border-2 transition-all ${formData.subType === 'deposit' ? 'border-emerald-500 bg-emerald-50' : 'border-transparent bg-white dark:bg-slate-800'}`}>
<input type="radio" name="subType" value="deposit" className="hidden" checked={formData.subType === 'deposit'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, subType: 'deposit' } })} />
<span className="text-sm font-bold">إيداع (+)</span>
</label>
<label className={`flex-1 flex items-center justify-center gap-2 p-3 rounded-xl cursor-pointer border-2 transition-all ${formData.subType === 'withdrawal' ? 'border-red-500 bg-red-50' : 'border-transparent bg-white dark:bg-slate-800'}`}>
<input type="radio" name="subType" value="withdrawal" className="hidden" checked={formData.subType === 'withdrawal'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, subType: 'withdrawal' } })} />
<span className="text-sm font-bold">سحب (-)</span>
</label>
</div>
</div>
)}

<div className="grid grid-cols-3 gap-3">
<div>
<label className="block text-sm font-bold mb-2 text-slate-400">المبلغ</label>
<input type="number" required step="0.01" min="0.01" className={`input-field text-xl font-black text-blue-600 ${formErrors.amount ? 'error' : ''}`} value={formData.amount} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, amount: e.target.value } })} />
{formErrors.amount && <p className="text-xs text-red-500 font-bold mt-2">{formErrors.amount}</p>}
</div>
<div>
<label className="block text-sm font-bold mb-2 text-slate-400">التاريخ</label>
<input type="date" required className={`input-field text-sm font-bold ${formErrors.date ? 'error' : ''}`} value={formData.date} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, date: e.target.value } })} />
</div>
<div>
<label className="block text-sm font-bold mb-2 text-slate-400">الدفع</label>
<select className="input-field text-sm font-bold" value={formData.method} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, method: e.target.value } })}>
{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
</select>
</div>
</div>

{formData.type === 'expense' && (
<details className="border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden bg-white dark:bg-slate-800">
<summary className="p-4 cursor-pointer text-xs font-bold text-slate-500 flex items-center justify-between">
<span className="flex items-center gap-2"><Hash size={16} className="text-blue-500" /> ربط بقرض أو التزام</span>
<ChevronDown size={16} />
</summary>
<div className="p-4 border-t">
<select className="input-field text-sm font-bold w-full" value={formData.linkedLoanId || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, linkedLoanId: e.target.value ? Number(e.target.value) : '' } })}>
<option value="">-- اختر --</option>
{updatedLoans.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
</select>
</div>
</details>
)}

{formData.type === 'expense' && formData.category === 'الالتزامات البنكية والتمويلية' && (
<div>
<label className="block text-sm font-bold mb-2 text-slate-400 flex items-center gap-2"><CreditCard size={14} /> سداد بطاقة</label>
<select className="input-field text-sm font-bold bg-blue-50/50 border-blue-200" value={formData.linkedCardId || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, linkedCardId: e.target.value ? Number(e.target.value) : '' } })}>
<option value="">-- اختر البطاقة --</option>
{cards.map(c => <option key={c.id} value={c.id}>{c.name} - {c.bank}</option>)}
</select>
</div>
)}

<div>
<label className="block text-sm font-bold mb-2 text-slate-400">الوصف</label>
<input type="text" className="input-field font-bold" value={formData.description} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: e.target.value } })} placeholder="تفاصيل..." />
</div>

<button type="submit" className={`w-full text-white py-4 rounded-2xl font-black text-lg shadow-xl hover:scale-[1.02] active:scale-95 transition-all ${formData.status === 'paid' ? 'gradient-bg-success' : 'gradient-bg-warning'}`} disabled={isProcessing}>
{isProcessing ? 'جاري الحفظ...' : <><Save size={20} className="inline ml-2" /> {formData.status === 'paid' ? 'حفظ واعتماد ✅' : 'حفظ كمعلق ⏳'} <span className="kbd mr-2">Ctrl+S</span></>}
</button>
</form>
</div>
</div>
)}

{/* AI Modal */}
{isAiModalOpen && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
<div className="p-6 border-b flex justify-between items-center gradient-border">
<h3 className="text-2xl font-black flex items-center gap-3"><div className="gradient-bg-primary p-2 rounded-xl text-white"><Bot size={20} /></div>المساعد الذكي</h3>
<button type="button" onClick={() => dispatch({ type: 'SET_AI_MODAL_OPEN', payload: false })} className="p-2 hover:bg-red-50 rounded-xl"><X size={24} /></button>
</div>
<div className="p-6">
<button type="button" onClick={handleAnalyzeFinances} disabled={isAiLoading} className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold shadow-lg flex items-center justify-center gap-3 mb-6">
{isAiLoading ? 'جاري التحليل...' : <><Sparkles size={20} /> تحليل الوضع المالي</>}
</button>
{aiResponse && (<div className="bg-slate-50 dark:bg-slate-800 p-6 rounded-2xl whitespace-pre-line">{aiResponse}</div>)}
</div>
</div>
</div>
)}

{/* Edit Card Modal */}
{editingCard && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
<div className="p-6 border-b flex justify-between items-center"><h3 className="text-xl font-black">تعديل البطاقة</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_CARD', payload: null })}><X size={24} /></button></div>
<form onSubmit={handleUpdateCard} className="p-6 space-y-4 overflow-y-auto">
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500">اسم البطاقة</label><input type="text" required className="input-field" value={editingCard.name} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, name: e.target.value } })} /></div>
<div><label className="text-xs font-bold text-slate-500">البنك</label><input type="text" required className="input-field" value={editingCard.bank} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, bank: e.target.value } })} /></div>
</div>
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500">الحد الائتماني</label><input type="number" required min="0" className="input-field text-blue-600 font-bold" value={editingCard.limit} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, limit: safeNumber(e.target.value) } })} /></div>
<div><label className="text-xs font-bold text-slate-500">رصيد أول المدة</label><input type="number" min="0" className="input-field text-red-500 font-bold" value={editingCard.openingBalance} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, openingBalance: safeNumber(e.target.value) } })} /></div>
</div>
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500">حامل البطاقة</label><input type="text" className="input-field uppercase text-sm" value={editingCard.holderName} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, holderName: e.target.value } })} /></div>
<div><label className="text-xs font-bold text-slate-500">تاريخ الانتهاء</label><input type="text" placeholder="MM/YY" className="input-field text-center" value={editingCard.expiry} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, expiry: e.target.value } })} /></div>
</div>
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500">آخر 4 أرقام</label><input type="text" maxLength="4" className="input-field text-center tracking-widest" value={editingCard.last4} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, last4: e.target.value } })} /></div>
<div><label className="text-xs font-bold text-slate-500">يوم الاستحقاق</label><input type="text" className="input-field text-center" value={editingCard.dueDate} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, dueDate: e.target.value } })} /></div>
</div>
<div>
<label className="text-xs font-bold text-slate-500">اللون</label>
<select className="input-field" value={editingCard.theme} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, theme: e.target.value } })}>
<option value="silver">فضي</option><option value="gold">ذهبي</option><option value="platinum">بلاتيني</option><option value="black">أسود</option><option value="blue">أزرق</option>
</select>
</div>
<button type="submit" className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold shadow-lg">حفظ</button>
</form>
</div>
</div>
)}

{/* Edit Loan Modal */}
{editingLoan && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl">
<div className="p-6 border-b flex justify-between items-center"><h3 className="text-xl font-black">تعديل الالتزام</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: null })}><X size={24} /></button></div>
<form onSubmit={handleUpdateLoan} className="p-6 space-y-4">
<div><label className="text-xs font-bold text-slate-500">الاسم</label><input type="text" className="input-field" value={editingLoan.name} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, name: e.target.value } })} /></div>
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500">المبلغ الكلي</label><input type="number" min="0" className="input-field" value={editingLoan.totalAmount} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, totalAmount: e.target.value } })} /></div>
<div><label className="text-xs font-bold text-slate-500">القسط الشهري</label><input type="number" min="0" className="input-field" value={editingLoan.monthlyInstallment} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, monthlyInstallment: e.target.value } })} /></div>
</div>
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500">المدفوع مقدم</label><input type="number" min="0" className="input-field text-emerald-600 font-bold" value={editingLoan.prePaidAmount || 0} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, prePaidAmount: e.target.value } })} /></div>
<div><label className="text-xs font-bold text-slate-500">يوم الاستحقاق</label><input type="number" min="1" max="31" className="input-field text-center" value={editingLoan.dueDay} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, dueDay: e.target.value } })} /></div>
</div>
<div><label className="text-xs font-bold text-slate-500">ملاحظات</label><input type="text" className="input-field text-sm" value={editingLoan.description || ''} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, description: e.target.value } })} /></div>
<button type="submit" className="w-full gradient-bg-primary text-white py-3 rounded-xl font-bold">حفظ</button>
</form>
</div>
</div>
)}

{/* Budget Modal */}
{editingBudgetCategory && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl shadow-2xl p-8">
<h3 className="text-2xl font-black mb-6">ميزانية: {editingBudgetCategory}</h3>
<input type="number" className="input-field text-xl font-black text-blue-600 mb-4" value={budgetAmount} onChange={e => dispatch({ type: 'SET_BUDGET_AMOUNT', payload: e.target.value })} placeholder="0" />
<div className="flex gap-4">
<button type="button" onClick={handleSaveBudget} className="flex-1 gradient-bg-primary text-white py-3 rounded-2xl font-bold">حفظ</button>
<button type="button" onClick={() => dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null })} className="flex-1 bg-slate-100 py-3 rounded-2xl font-bold">إلغاء</button>
</div>
</div>
</div>
)}

{/* Fawry Modal */}
{editingFawry && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-yellow-400/50">
<div className="p-6 border-b flex justify-between items-center bg-yellow-50 dark:bg-yellow-900/10"><h3 className="text-xl font-black">ضبط رصيد فوري</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_FAWRY', payload: null })}><X size={24} /></button></div>
<form onSubmit={(e) => { e.preventDefault(); localStorage.setItem('fawryData', JSON.stringify(editingFawry)); dispatch({ type: 'UPDATE_FAWRY_DATA', payload: editingFawry }); dispatch({ type: 'SET_EDITING_FAWRY', payload: null }); addNotification({ type: 'success', title: 'تم الحفظ' }); }} className="p-6 space-y-6">
<div className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-5 border">
<div className="flex items-center gap-2 mb-4 text-sm font-bold text-fawryBlue"><Calculator size={18} /> معادلة الرصيد</div>
<div className="space-y-2 text-sm font-mono">
<div className="flex justify-between"><span>رصيد البداية</span><span className="font-bold">{safeNumber(editingFawry.openingBalance).toLocaleString()}</span></div>
<div className="flex justify-between text-emerald-600"><span>+ إجمالي الشحن</span><span className="font-bold">+{fawryStats.deposits.toLocaleString()}</span></div>
<div className="flex justify-between text-red-500"><span>- المدفوعات</span><span className="font-bold">-{fawryStats.withdrawals.toLocaleString()}</span></div>
<div className="h-px bg-slate-300 my-2"></div>
<div className="flex justify-between text-lg font-black text-fawryBlue"><span>= الرصيد المتوقع</span><span>{(safeNumber(editingFawry.openingBalance) + fawryStats.deposits - fawryStats.withdrawals).toLocaleString()} ج.م</span></div>
</div>
</div>
<div><label className="block text-xs font-bold text-slate-500 mb-2">تعديل رصيد البداية</label><input type="number" step="0.01" min="0" className="input-field text-xl font-black text-fawryBlue" value={editingFawry.openingBalance} onChange={e => dispatch({ type: 'SET_EDITING_FAWRY', payload: { ...editingFawry, openingBalance: safeNumber(e.target.value) } })} /></div>
<button type="submit" className="w-full gradient-bg-primary text-white py-3 rounded-xl font-bold">حفظ</button>
</form>
</div>
</div>
)}

{/* Etisalat Modal */}
{editingEtisalat && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-green-500/50">
<div className="p-6 border-b flex justify-between items-center bg-green-50 dark:bg-green-900/10"><h3 className="text-xl font-black">ضبط اتصالات كاش</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_ETISALAT', payload: null })}><X size={24} /></button></div>
<form onSubmit={(e) => { e.preventDefault(); localStorage.setItem('etisalatData', JSON.stringify(editingEtisalat)); dispatch({ type: 'UPDATE_ETISALAT_DATA', payload: editingEtisalat }); dispatch({ type: 'SET_EDITING_ETISALAT', payload: null }); addNotification({ type: 'success', title: 'تم الحفظ' }); }} className="p-6 space-y-6">
<div className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-5 border">
<div className="flex items-center gap-2 mb-4 text-sm font-bold text-etisalatGreen"><Calculator size={18} /> معادلة الرصيد</div>
<div className="space-y-2 text-sm font-mono">
<div className="flex justify-between"><span>رصيد البداية</span><span className="font-bold">{safeNumber(editingEtisalat.openingBalance).toLocaleString()}</span></div>
<div className="flex justify-between text-emerald-600"><span>+ الإيداع</span><span className="font-bold">+{etisalatStats.deposits.toLocaleString()}</span></div>
<div className="flex justify-between text-red-500"><span>- السحب</span><span className="font-bold">-{etisalatStats.withdrawals.toLocaleString()}</span></div>
<div className="h-px bg-slate-300 my-2"></div>
<div className="flex justify-between text-lg font-black text-etisalatGreen"><span>= الرصيد المتوقع</span><span>{(safeNumber(editingEtisalat.openingBalance) + etisalatStats.deposits - etisalatStats.withdrawals).toLocaleString()} ج.م</span></div>
</div>
</div>
<div><label className="block text-xs font-bold text-slate-500 mb-2">تعديل رصيد البداية</label><input type="number" step="0.01" min="0" className="input-field text-xl font-black text-etisalatGreen" value={editingEtisalat.openingBalance} onChange={e => dispatch({ type: 'SET_EDITING_ETISALAT', payload: { ...editingEtisalat, openingBalance: safeNumber(e.target.value) } })} /></div>
<button type="submit" className="w-full gradient-bg-success text-white py-3 rounded-xl font-bold">حفظ</button>
</form>
</div>
</div>
)}

{/* Quick Transfer Modal */}
{isQuickTransferModalOpen && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-blue-500/50">
<div className="p-6 border-b flex justify-between items-center gradient-border"><h3 className="text-xl font-black flex items-center gap-2"><ArrowRightLeft size={20} className="text-blue-600" /> تحويل سريع</h3><button type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false })}><X size={24} /></button></div>
<form onSubmit={handleQuickTransfer} className="p-6 space-y-6">
<div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl">
<div className="flex justify-between items-center text-sm font-bold text-blue-700 mb-2"><span>من</span><span>إلى</span></div>
<div className="flex justify-between items-center gap-4">
<select className="input-field text-sm" value={quickTransferData.from} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: e.target.value } })}>
{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
</select>
<div className="text-blue-300"><ArrowRight size={20} /></div>
<select className="input-field text-sm" value={quickTransferData.to} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { to: e.target.value } })}>
{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
</select>
</div>
</div>
<div><label className="block text-sm font-bold mb-2 text-slate-500">المبلغ</label><input type="number" required step="0.01" min="0.01" className="input-field text-xl font-black text-blue-600" value={quickTransferData.amount} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: e.target.value } })} placeholder="0.00" /></div>
<button type="submit" className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold shadow-lg">تنفيذ التحويل</button>
</form>
</div>
</div>
)}

{/* Recurring Modal */}
{isRecurringModalOpen && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-blue-500/50">
<div className="p-6 border-b flex justify-between items-center gradient-border"><h3 className="text-xl font-black flex items-center gap-2"><Repeat size={20} className="text-blue-600" /> إضافة التزام متكرر</h3><button type="button" onClick={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false })}><X size={24} /></button></div>
<form onSubmit={handleSaveRecurring} className="p-6 space-y-4">
<div><label className="text-xs font-bold text-slate-500 block mb-2">العنوان</label><input type="text" required className="input-field" value={recurringFormData.title} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, title: e.target.value } })} placeholder="مثال: إيجار المحل" /></div>
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500 block mb-2">المبلغ</label><input type="number" required min="0" className="input-field font-bold text-blue-600" value={recurringFormData.amount} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, amount: e.target.value } })} /></div>
<div><label className="text-xs font-bold text-slate-500 block mb-2">اليوم من الشهر</label><input type="number" required min="1" max="31" className="input-field text-center" value={recurringFormData.day} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, day: e.target.value } })} /></div>
</div>
<div>
<label className="text-xs font-bold text-slate-500 block mb-2">النوع</label>
<select className="input-field" value={recurringFormData.type} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, type: e.target.value } })}>
<option value="expense">💸 مصروف</option>
<option value="income">💰 دخل</option>
</select>
</div>
<div>
<label className="text-xs font-bold text-slate-500 block mb-2">الفئة</label>
<select className="input-field" value={recurringFormData.category} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, category: e.target.value } })}>
<option value="أخرى">أخرى</option>
{CATEGORIES.expense.map(c => <option key={c} value={c}>{c}</option>)}
</select>
</div>
<button type="submit" className="w-full gradient-bg-primary text-white py-3 rounded-xl font-bold">إضافة</button>
</form>
</div>
</div>
)}
</div>
);
}

// ===== Root =====
const rootElement = document.getElementById('root');
if (rootElement) {
setTimeout(() => { const l = document.getElementById('loading'); if (l) l.style.display = 'none'; }, 1500);
createRoot(rootElement).render(<ErrorBoundary><App /></ErrorBoundary>);
}
</script>
</body>
</html>
