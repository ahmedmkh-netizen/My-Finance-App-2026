    walletVisibility: { cash: true, fawry: true, etisalat: true, cib_savings: true, aaib_savings: true },
    isProcessing: false,
    formErrors: {},
    activeCategoryDetail: null,
    reconciliationModal: null,
    isSidebarOpen: false,
    forceSaveState: 'idle',
    cardPaymentModal: null,
    hanySettleModal: null,
    printModal: null
  });

  const [showAllHanyItems, setShowAllHanyItems] = useState(false);
  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [authLoading, setAuthLoading] = useState(true);
  const [pinVerified, setPinVerified] = useState(false);
  const [cloudSyncStatus, setCloudSyncStatus] = useState('pending');
  const [isSaving, setIsSaving] = useState(false);

  const saveTimeoutRef = useRef(null);
  const processingTimeoutRef = useRef(null);
  const saveLockRef = useRef(false);
  const lastRemoteRef = useRef(null);
  const lastMaterializeRef = useRef('');
  const isSavingRef = useRef(false);
  const hasReceivedInitialSnapshot = useRef(false);
  const initialSnapshotTimeoutRef = useRef(null);
  const currentTxRef = useRef([]);
  const dataRef = useRef(null);
  const budgetsRef = useRef({});
  const saveQueueRef = useRef(Promise.resolve());
  const cloudSaveRetriesRef = useRef(0);

  const {
    data, activeTab, selectedYear, selectedMonth, transViewMode, catViewType,
    isFormOpen, formMode, formData, isDarkMode, expandedGroup, budgets,
    editingCard, editingLoan, searchTerm, editingBudgetCategory, budgetAmount,
    isRecurringModalOpen, recurringFormData, notifications, history,
    expandedLedgers, expandedCardsSection, statusFilter, confirmDialog,
    isQuickTransferModalOpen, quickTransferData, viewingCardStatement,
    isPinChangeOpen, isSmsModalOpen, pendingCloseModal,
    walletVisibility, isProcessing, formErrors, activeCategoryDetail,
    reconciliationModal, isSidebarOpen, forceSaveState, cardPaymentModal
  } = state;

  const {
    transactions = [], loans = [], cards = [], recurringItems = [],
    accountsData = DEFAULT_ACCOUNTS, monthlyPlans = {}
  } = data || {};

  const isOnline = useOnlineStatus();
  const prevOnlineRef = useRef(isOnline);

  useEffect(() => {
    currentTxRef.current = data?.transactions || [];
    dataRef.current = data;
    budgetsRef.current = budgets;
  }, [data?.transactions, data, budgets]);

  const addNotification = useCallback((notification) => dispatch({ type: 'ADD_NOTIFICATION', payload: notification }), []);
  const removeNotification = useCallback((id) => dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }), []);
  const saveHistory = useCallback(() => dispatch({
    type: 'ADD_TO_HISTORY',
    payload: { data: JSON.parse(JSON.stringify(data)), budgets: JSON.parse(JSON.stringify(budgets)) }
  }), [data, budgets]);

  const queueCloudSave = useCallback((newData, options = {}) => {
    if (!isAuthenticated || !hasReceivedInitialSnapshot.current) return;
    const { silent = false, force = false } = options;
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);

    saveQueueRef.current = saveQueueRef.current.then(async () => {
      try {
        if (!silent) setIsSaving(true);
        const payloadStr = JSON.stringify(newData);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(newData)); } catch (e) {}

        if (force) {
          await docRef.set({ ...newData, budgets: newData.budgets || budgetsRef.current }, { merge: false });
          lastRemoteRef.current = payloadStr;
          try { localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now())); } catch (e) {}
          return;
        }

        const doc = await docRef.get();
        let finalData = { ...newData };

        if (doc.exists) {
          const remote = doc.data() || {};
          const remoteTx = Array.isArray(remote.transactions) ? remote.transactions : [];
          const localTx = Array.isArray(newData.transactions) ? newData.transactions : [];
          const permanentDeleted = new Set([...(newData.deletedTxIds || []), ...(remote.deletedTxIds || [])]);
          const mergedMap = new Map();
          remoteTx.forEach(t => { if (t?.id && !permanentDeleted.has(t.id)) mergedMap.set(t.id, t); });
          localTx.forEach(t => { if (t?.id && !permanentDeleted.has(t.id)) mergedMap.set(t.id, t); });

          finalData.transactions = sortTransactions(
            Array.from(mergedMap.values()).filter(t => !t?.id || !(finalData.deletedTxIds || []).includes(t.id))
          );
          finalData.deletedTxIds = Array.from(permanentDeleted).slice(-500);

          if (remote.budgets && typeof remote.budgets === 'object') {
            finalData.budgets = { ...remote.budgets, ...budgetsRef.current };
          }
        }

        await docRef.set({ ...finalData, budgets: finalData.budgets || budgetsRef.current }, { merge: true });
        lastRemoteRef.current = payloadStr;
        try { localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now())); } catch (e) {}
        cloudSaveRetriesRef.current = 0;
      } catch (err) {
        console.error('Queue save failed:', err);
        throw err;
      } finally {
        if (!silent) setTimeout(() => setIsSaving(false), 800);
      }
    }).catch(async (err) => {
      console.error('❌ Queue save failed:', err);
      const retries = cloudSaveRetriesRef.current + 1;
      cloudSaveRetriesRef.current = retries;
      if (retries <= 3) {
        await new Promise(r => setTimeout(r, 3000));
        setIsSaving(false);
        return;
      }
      cloudSaveRetriesRef.current = 0;
      saveQueueRef.current = Promise.resolve();
      setIsSaving(false);
    });

    return saveQueueRef.current;
  }, [isAuthenticated]);

  const docRef = useMemo(() => db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc), []);
  const { forceSave: handleForceSave } = useForceSave({ isAuthenticated, data, budgets, addNotification, dbRef: docRef });

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((user) => {
      setAuthLoading(false);
      setIsAuthenticated(!!(user && user.email === ALLOWED_EMAIL));
    });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!isAuthenticated) return;
    const innerDocRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);

    initialSnapshotTimeoutRef.current = setTimeout(() => {
      if (!hasReceivedInitialSnapshot.current) {
        console.warn('⚠️ Firestore اتأخر — استخدام localStorage');
        hasReceivedInitialSnapshot.current = true;
        setCloudSyncStatus('offline');
      }
    }, 8000);

    const unsub = innerDocRef.onSnapshot((doc) => {
      const isFirst = !hasReceivedInitialSnapshot.current;
      if (isFirst) {
        hasReceivedInitialSnapshot.current = true;
        if (initialSnapshotTimeoutRef.current) {
          clearTimeout(initialSnapshotTimeoutRef.current);
          initialSnapshotTimeoutRef.current = null;
        }
        setCloudSyncStatus('ready');
      }

      if (doc.exists) {
        const raw = doc.data();
        let migrated = migrateData(raw);

        const permanentDeleted = new Set([...(migrated.deletedTxIds || []), ...(currentTxRef.current.filter(t => t?._deleted).map(t => t.id))]);
        migrated.transactions = (migrated.transactions || []).filter(t => !t?.id || !permanentDeleted.has(t.id));

        const remoteIds = new Set(migrated.transactions.map(t => t.id));
        const localOnly = currentTxRef.current.filter(t => t?.id && !remoteIds.has(t.id) && !permanentDeleted.has(t.id));

        const now = Date.now();
        const localOnlyToUpload = localOnly.filter(t => {
          if (!t.createdAt) return false;
          const age = now - new Date(t.createdAt).getTime();
          return age >= 0 && age < 300000;
        });

        if (localOnlyToUpload.length > 0) {
          console.log(`📤 ${localOnlyToUpload.length} قيد محلي جديد — جاري رفعه للسحابة`);
          migrated.transactions = sortTransactions([...migrated.transactions, ...localOnlyToUpload]);
          setTimeout(() => queueCloudSave(migrated, { silent: true }), 800);
        }

        const incoming = JSON.stringify(migrated);
        if (lastRemoteRef.current === incoming && !isFirst) return;
        lastRemoteRef.current = incoming;

        if (raw.budgets && typeof raw.budgets === 'object') {
          dispatch({ type: 'SET_BUDGETS', payload: raw.budgets });
        }

        dispatch({ type: 'SET_DATA', payload: migrated });
        if (isFirst) console.log('☁️ تم استقبال البيانات من Firestore (أول تحميل)');
      } else if (isFirst) {
        console.log('📤 Firestore فاضي — أول استخدام');
      }
    }, (error) => {
      console.error('❌ Firestore error:', error);
      if (!hasReceivedInitialSnapshot.current) {
        hasReceivedInitialSnapshot.current = true;
        setCloudSyncStatus('offline');
      }
    });

    return () => {
      unsub();
      if (initialSnapshotTimeoutRef.current) clearTimeout(initialSnapshotTimeoutRef.current);
    };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isAuthenticated]);

  useEffect(() => {
    if (!isAuthenticated || !data?.transactions) return;
    if (!hasReceivedInitialSnapshot.current) return;

    if (cloudSyncStatus === 'offline') {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      return;
    }

    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(() => {
      if (isSavingRef.current) return;
      const payloadStr = JSON.stringify(data);
      if (lastRemoteRef.current && payloadStr === lastRemoteRef.current) return;
      isSavingRef.current = true;
      const safetyTimer = setTimeout(() => { isSavingRef.current = false; }, 8000);
      queueCloudSave(data, { silent: false }).finally(() => {
        clearTimeout(safetyTimer);
        isSavingRef.current = false;
      });
    }, 2000);
    return () => clearTimeout(saveTimeoutRef.current);
  }, [data, isAuthenticated, cloudSyncStatus, queueCloudSave]);

  useEffect(() => {
    if (!isAuthenticated || !data?.recurringItems?.length) return;
    const today = getLocalISODate();
    const activeCount = data.recurringItems.filter(r => r.active !== false).length;
    const loansSig = (data.loans || []).filter(l => l.systemId === SYSTEM_LOAN_IDS.TAKYEEF).map(l => `${l.id}:${l.prePaidAmount}:${l.totalAmount}`).join('|');
    const sig = `${today}_${data.recurringItems.length}_${activeCount}_${loansSig}`;
    if (lastMaterializeRef.current === sig) return;
    lastMaterializeRef.current = sig;

    const updated = applyMaterialization(data, today);
    if (updated) {
      const added = updated.transactions.length - (data.transactions?.length || 0);
      dispatch({ type: 'SET_DATA', payload: updated });
      setTimeout(() => queueCloudSave(updated, { silent: true }), 200);
      if (added > 0) {
        addNotification({ type: 'info', title: 'تم توليد التزامات شهرية', message: `${added} بند متكرر بانتظار الاعتماد`, duration: 6000 });
      }
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isAuthenticated, data?.recurringItems?.length, data?.transactions?.length, data?.loans]);

  useEffect(() => {
    if (!isAuthenticated || cloudSyncStatus !== 'offline') return;
    let cancelled = false;
    const retryTimer = setInterval(async () => {
      if (cancelled) return;
      try {
        await db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc).get({ source: 'server' });
        if (cancelled) return;
        hasReceivedInitialSnapshot.current = true;
        setCloudSyncStatus('ready');
        addNotification({ type: 'success', title: '✅ تم استعادة الاتصال بالسحابة', duration: 4000 });
      } catch (e) {}
    }, 30000);
    return () => { cancelled = true; clearInterval(retryTimer); };
  }, [isAuthenticated, cloudSyncStatus, addNotification]);

  useEffect(() => {
    if (prevOnlineRef.current !== isOnline) {
      if (isOnline) {
        addNotification({ type: 'success', title: 'تم استعادة الاتصال', message: 'جاري المزامنة...', duration: 4000 });
        if (cloudSyncStatus === 'offline') setCloudSyncStatus('pending');
      } else {
        addNotification({ type: 'warning', title: 'انقطع الاتصال', message: 'التغييرات محفوظة محلياً', duration: 6000 });
      }
      prevOnlineRef.current = isOnline;
    }
  }, [isOnline, addNotification, cloudSyncStatus]);

  const cancelProcessing = useCallback(() => {
    if (processingTimeoutRef.current) { clearTimeout(processingTimeoutRef.current); processingTimeoutRef.current = null; }
    saveLockRef.current = false;
    dispatch({ type: 'SET_IS_PROCESSING', payload: false });
    addNotification({ type: 'info', title: 'تم الإلغاء' });
  }, [addNotification]);

  /* Derived data */
  const liveBalances = useMemo(() => computeBalancesAsOf(data), [data]);
  const liquidityDual = useMemo(() => computeDualLiquidity(liveBalances), [liveBalances]);
  const netWorthData = useMemo(() => computeNetWorth(data), [data]);
  const hanySummary = useMemo(() => computeHanySummaryForMonth(data, selectedYear, selectedMonth), [data, selectedYear, selectedMonth]);

  const financeSnapshot = useMemo(() => {
    const opening = getOpeningBalance(data, 'cash', selectedYear, selectedMonth);
    const actualCashInHand = liveBalances.cash || 0;
    const today = endOfToday();
    const curMonth = transactions.filter(t =>
      t.month === selectedMonth && (t.year || new Date(t.date).getFullYear()) === selectedYear && !isCarryoverMarker(t)
    );
    const actualIncome = curMonth.filter(t => t.type === 'income' && t.status === 'paid' && t.method === 'cash' && (parseISODate(t.date) || new Date()) <= today).reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncome = curMonth.filter(t => t.type === 'income' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidCash = curMonth.filter(t => t.type === 'expense' && t.status === 'paid' && t.method === 'cash' && (parseISODate(t.date) || new Date()) <= today).reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingCash = curMonth.filter(t => t.type === 'expense' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncomeAll = curMonth.filter(t => t.type === 'income' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingExpensesAll = curMonth.filter(t => t.type === 'expense' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidExpensesAll = curMonth.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    return {
      opening, actualIncome, pendingIncome, paidCash, pendingCash, actualCashInHand,
      pendingIncomeAll, pendingExpensesAll, paidExpensesAll,
      projectedClosingBalance: actualCashInHand + pendingIncomeAll - pendingExpensesAll
    };
  }, [data, transactions, selectedYear, selectedMonth, liveBalances]);

  const chartData = useMemo(() => {
    const byMonth = new Map();
    transactions.forEach(t => {
      if (t.status !== 'paid' || isCarryoverMarker(t)) return;
      const y = t.year || 2026;
      if (y !== selectedYear) return;
      if (!byMonth.has(t.month)) byMonth.set(t.month, { income: 0, expense: 0 });
      const b = byMonth.get(t.month);
      if (t.type === 'income') b.income += safeNumber(t.amount);
      else if (t.type === 'expense') b.expense += safeNumber(t.amount);
    });
    return getMonthsForYear(selectedYear).map(m => ({
      name: m.slice(0, 3),
      'دخل': byMonth.get(m)?.income || 0,
      'مصروف': byMonth.get(m)?.expense || 0
    }));
  }, [transactions, selectedYear]);

  const loansHash = useMemo(() => {
    const txSig = transactions.filter(t => t.linkedLoanId || t.sourceReceivableId || isHanyShopCategory(t.category)).map(t => `${t.id}:${t.status}:${t.amount}:${t.category}`).join('|');
    const loansSig = loans.map(l => `${l.id}:${l.totalAmount}:${l.prePaidAmount}:${l.autoMonthly ? 1 : 0}`).join('|');
    const deletedSig = (data?.deletedTxIds || []).slice(-100).join(',');
    return `${txSig}#${loansSig}#${deletedSig}`;
  }, [transactions, loans, data?.deletedTxIds]);

  const updatedLoans = useMemo(() => {
    const map = transactions.reduce((acc, t) => {
      if (t.linkedLoanId && t.status === 'paid') acc[t.linkedLoanId] = (acc[t.linkedLoanId] || 0) + safeNumber(t.amount);
      return acc;
    }, {});
    const receivablesPaidMap = transactions.reduce((acc, t) => {
      if (t.sourceReceivableId && t.status === 'paid') acc[t.sourceReceivableId] = (acc[t.sourceReceivableId] || 0) + safeNumber(t.amount);
      return acc;
    }, {});

    const regular = loans.filter(l => !l.autoMonthly && !l.isReceivable).map(l => ({
      ...l, isReceivable: l.type === 'receivable' || !!l.isReceivable,
      totalPaid: safeNumber(l.prePaidAmount) + (map[l.id] || 0),
      remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (map[l.id] || 0)))
    }));

    const receivables = loans.filter(l => l.isReceivable).map(l => ({
      ...l, isReceivable: true, paused: !!l.paused,
      totalPaid: safeNumber(l.prePaidAmount) + (receivablesPaidMap[l.id] || 0),

    const targetYM = year * 12 + getMonthIndex(month);
    if (loan.endYear && loan.endMonth) {
      const endYM = safeNumber(loan.endYear) * 12 + getMonthIndex(loan.endMonth);
      return targetYM <= endYM;
    }
    if (loan.startYear && loan.startMonth) {
      const startYM = safeNumber(loan.startYear) * 12 + getMonthIndex(loan.startMonth);

            transferMode: 'monthly', from: 'cib_savings', to: 'fawry', amount: '', transferType: 'monthly',
            date: getLocalISODate(), beneficiaryId: null, forceCash: false,
            internalFrom: 'cib_savings', internalTo: 'fawry', internalFees: '', internalDescription: '',
            externalFrom: 'cib_savings', externalRecipient: '', externalAccount: '',
            externalFees: '', externalWithFee: false, externalNote: ''
          } });
          addNotification({ type: 'success', title: '✅ تم التحويل', message: `${fmt(amount)} ج.م إلى ${recipient}${fees > 0 ? ` + رسوم ${fmt(fees)}` : ''}`, duration: 6000 });
        } catch (err) { console.error('External transfer error:', err); addNotification({ type: 'error', title: 'فشل التحويل', message: err.message }); }
        saveLockRef.current = false;
        dispatch({ type: 'SET_IS_PROCESSING', payload: false });
        processingTimeoutRef.current = null;
      }, 600);
      return;
    }

    /* Internal */
    if (transferMode === 'internal') {
      const amountCheck = validateAmount(quickTransferData.amount, { min: 0.01, max: 10000000, label: 'المبلغ' });
      if (!amountCheck.valid) { saveLockRef.current = false; addNotification({ type: 'error', title: 'خطأ', message: amountCheck.error }); return; }
      const amount = roundMoney(amountCheck.value);
      const fees = roundMoney(parseNumberInput(quickTransferData.internalFees || 0));
      const from = quickTransferData.internalFrom || 'cib_savings';
      const to = quickTransferData.internalTo || 'fawry';
      const dateStr = quickTransferData.date || getLocalISODate();
      const d = parseISODate(dateStr);
      if (!d) { saveLockRef.current = false; addNotification({ type: 'error', title: 'تاريخ غير صحيح' }); return; }
      const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
      if (isMonthClosed(data, txYear, txMonth)) { saveLockRef.current = false; addNotification({ type: 'error', title: 'محظور' }); return; }
      if (from === to) { saveLockRef.current = false; addNotification({ type: 'error', title: 'اختر حسابين مختلفين' }); return; }
      if (fees < 0) { saveLockRef.current = false; addNotification({ type: 'error', title: 'الرسوم لا تكون سالبة' }); return; }

      dispatch({ type: 'SET_IS_PROCESSING', payload: true });
      processingTimeoutRef.current = setTimeout(() => {
        try {
          saveHistory();
          const transferId = getSafeId();
          const date = getLocalISODate(d);
          const fromLabel = getPaymentMethodShort(from);
          const toLabel = getPaymentMethodShort(to);
          const description = (quickTransferData.internalDescription || '').trim() || `تحويل من ${fromLabel} إلى ${toLabel}`;
          const now = new Date().toISOString();
          const txs = [
            { id: getSafeId(), type: 'expense', kind: KIND.FINANCIAL, category: 'تحويلات', amount, description: `${description} (خروج)`, method: from, date, month: txMonth, year: txYear, monthIndex: d.getMonth(), subType: 'withdrawal', status: 'paid', linkedTransferId: transferId, transferDirection: 'out', createdAt: now },
            { id: getSafeId(), type: 'income', kind: KIND.FINANCIAL, category: 'تحويلات واردة', amount, description: `${description} (دخول)`, method: to, date, month: txMonth, year: txYear, monthIndex: d.getMonth(), subType: 'deposit', status: 'paid', linkedTransferId: transferId, transferDirection: 'in', createdAt: now }
          ];
          if (fees > 0) {
            txs.push({ id: getSafeId(), type: 'expense', kind: KIND.FINANCIAL, category: 'رسوم تحويلات', amount: fees, description: `رسوم تحويل — ${description}`, method: from, date, month: txMonth, year: txYear, monthIndex: d.getMonth(), subType: 'withdrawal', status: 'paid', linkedTransferId: transferId, transferDirection: 'fee', createdAt: now });
          }
          dispatch({ type: 'UPDATE_TRANSACTIONS', payload: sortTransactions([...txs, ...transactions]) });
          dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
          dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: {
            transferMode: 'monthly', from: 'cib_savings', to: 'fawry', amount: '', transferType: 'monthly',
            date: getLocalISODate(), beneficiaryId: null, forceCash: false,
            internalFrom: 'cib_savings', internalTo: 'fawry', internalFees: '', internalDescription: '',
            externalFrom: 'cib_savings', externalRecipient: '', externalAccount: '',
            externalFees: '', externalWithFee: false, externalNote: ''
          } });
          addNotification({ type: 'success', title: 'تم التحويل', message: `${fmt(amount)} ج.م من ${fromLabel} إلى ${toLabel}${fees > 0 ? ` + رسوم ${fmt(fees)}` : ''}`, duration: 6000 });
        } catch (err) { console.error('Internal transfer error:', err); addNotification({ type: 'error', title: 'فشل التحويل', message: err.message }); }
        saveLockRef.current = false;
        dispatch({ type: 'SET_IS_PROCESSING', payload: false });
        processingTimeoutRef.current = null;
      }, 600);
      return;
    }

    /* Monthly */
    const transferType = quickTransferData.transferType || 'monthly';
    const amountCheck = validateAmount(quickTransferData.amount, { min: 0.01, max: 10000000, label: 'المبلغ' });
    if (!amountCheck.valid) { saveLockRef.current = false; addNotification({ type: 'error', title: 'خطأ', message: amountCheck.error }); return; }
    const amount = roundMoney(amountCheck.value);
    const dateStr = quickTransferData.date || getLocalISODate();
    const d = parseISODate(dateStr);
    if (!d) { saveLockRef.current = false; addNotification({ type: 'error', title: 'تحقق', message: 'تاريخ غير صحيح' }); return; }
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { saveLockRef.current = false; addNotification({ type: 'error', title: 'محظور' }); return; }
    if (transferType === 'monthly' && !quickTransferData.beneficiaryId) { saveLockRef.current = false; addNotification({ type: 'error', title: 'اختر المستفيد' }); return; }

    dispatch({ type: 'SET_IS_PROCESSING', payload: true });
    processingTimeoutRef.current = setTimeout(() => {
      saveHistory();
      const date = getLocalISODate(d);
      const txs = [];
      if (transferType === 'monthly') {
        const ben = BENEFICIARIES.find(b => b.id === quickTransferData.beneficiaryId);
        const isFromBank = quickTransferData.from === 'cib_savings' || quickTransferData.from === 'aaib_savings';
        const useTelda = isFromBank && ben.hasTelda && !quickTransferData.forceCash;
        txs.push({
          id: 'monthly-' + getSafeId(), type: 'expense', kind: KIND.OPERATIONAL,
          category: `مصروف شهري - ${ben.label}`, amount,
          description: useTelda ? `مصروف شهري - ${ben.label} (عبر Telda)` : `مصروف شهري - ${ben.label}`,
          method: quickTransferData.from,
          transferChannel: useTelda ? ben.method : undefined,
          date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
          subType: 'withdrawal', status: 'paid', beneficiaryId: ben.id,
          createdAt: new Date().toISOString()
        });
      }
      dispatch({ type: 'UPDATE_TRANSACTIONS', payload: sortTransactions([...txs, ...transactions]) });
      dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
      dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: {
        transferMode: 'monthly', from: 'cib_savings', to: 'fawry', amount: '', transferType: 'monthly',
        date: getLocalISODate(), beneficiaryId: null, forceCash: false,
        internalFrom: 'cib_savings', internalTo: 'fawry', internalFees: '', internalDescription: '',
        externalFrom: 'cib_savings', externalRecipient: '', externalAccount: '',
        externalFees: '', externalWithFee: false, externalNote: ''
      } });
      addNotification({ type: 'success', title: 'تم التسجيل' });
      saveLockRef.current = false;
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
      processingTimeoutRef.current = null;
    }, 600);
  }, [quickTransferData, data, transactions, saveHistory, addNotification, isProcessing]);

  const handleUpdateLoan = useCallback((e) => {
    e.preventDefault();
    saveHistory();
    dispatch({
      type: 'UPDATE_LOANS',
      payload: (data.loans || []).map(l => l.id === editingLoan.id ? {
        ...editingLoan,
        totalAmount: safeNumber(editingLoan.totalAmount),
        prePaidAmount: safeNumber(editingLoan.prePaidAmount),
        monthlyInstallment: safeNumber(editingLoan.monthlyInstallment),
        dueDay: safeNumber(editingLoan.dueDay, 1),
        paused: !!editingLoan.paused,
        totalInstallments: safeNumber(editingLoan.totalInstallments),
        paidInstallments: safeNumber(editingLoan.paidInstallments)
      } : l)
    });
    dispatch({ type: 'SET_EDITING_LOAN', payload: null });
    addNotification({ type: 'success', title: 'تم التحديث' });
  }, [data.loans, editingLoan, saveHistory, addNotification]);

  const handleUpdateCard = useCallback((e) => {
    e.preventDefault();
    saveHistory();
    dispatch({
      type: 'UPDATE_CARDS',
      payload: cards.map(c => c.id === editingCard.id ? {
        ...editingCard,
        limit: safeNumber(editingCard.limit),
        availableBalance: Math.max(0, safeNumber(editingCard.limit) - safeNumber(editingCard.openingDebt)),
        openingDebt: safeNumber(editingCard.openingDebt),
        statementDay: Math.min(28, Math.max(1, safeNumber(editingCard.statementDay, 5))),
        openingDebtDate: editingCard.openingDebtDate || getLocalISODate(),
        cashbackRate: safeNumber(editingCard.cashbackRate, 0),
        openingDate: editingCard.openingDate || getLocalISODate(),
        subCardLast4: Array.isArray(editingCard.subCardLast4) ? editingCard.subCardLast4 : [],
        providerKey: editingCard.providerKey || 'cib'
      } : c)
    });
    dispatch({ type: 'SET_EDITING_CARD', payload: null });
    addNotification({ type: 'success', title: 'تم التحديث' });
  }, [cards, editingCard, saveHistory, addNotification]);

  const handleSaveBudget = useCallback(() => {
    saveHistory();
    const nb = { ...budgets, [editingBudgetCategory]: parseNumberInput(budgetAmount) };
    dispatch({ type: 'SET_BUDGETS', payload: nb });
    dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null });
    dispatch({ type: 'SET_BUDGET_AMOUNT', payload: '' });
    addNotification({ type: 'success', title: 'تم الحفظ' });
  }, [budgets, editingBudgetCategory, budgetAmount, saveHistory, addNotification]);

  const handleSaveRecurring = useCallback((e) => {
    e.preventDefault();
    const titleCheck = validateText(recurringFormData.title, { min: 2, max: 100, label: 'العنوان' });
    if (!titleCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: titleCheck.error }); return; }
    const amountCheck = validateAmount(recurringFormData.amount, { min: 0.01, max: 10000000, label: 'المبلغ' });
    if (!amountCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: amountCheck.error }); return; }
    saveHistory();

    const payload = {
      title: titleCheck.value, amount: roundMoney(amountCheck.value),
      day: safeNumber(recurringFormData.day, 1), category: normalizeCategory(recurringFormData.category),
      type: recurringFormData.type, startMonth: recurringFormData.startMonth || null,
      endMonth: recurringFormData.endMonth || null, active: recurringFormData.active !== false,
      kind: recurringFormData.kind || null,
      linkedLoanSystemId: recurringFormData.linkedLoanSystemId || null,
      linkedCardId: recurringFormData.linkedCardId || null,
      method: recurringFormData.method || 'cash',
      transferChannel: recurringFormData.transferChannel || null
    };

    if (recurringFormData.id) {
      dispatch({ type: 'UPDATE_RECURRING_ITEMS', payload: recurringItems.map(r => r.id === recurringFormData.id ? { ...r, ...payload } : r) });
      addNotification({ type: 'success', title: 'تم تحديث البند' });
    } else {
      dispatch({ type: 'UPDATE_RECURRING_ITEMS', payload: [...recurringItems, { ...payload, id: 'r-' + getSafeId() }] });
      addNotification({ type: 'success', title: 'تمت الإضافة' });
    }

    dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false });
    dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { title: '', amount: '', day: 1, category: 'أخرى', type: 'expense', startMonth: '', endMonth: '', active: true, method: 'cash', kind: null, linkedLoanSystemId: null, linkedCardId: null, transferChannel: null } });
  }, [recurringFormData, recurringItems, saveHistory, addNotification]);

  const deleteRecurring = useCallback((id) => {
    const pendingFromThis = (data.transactions || []).filter(t => t.sourceRecurringId === id && t.status !== 'paid');
    const blocked = pendingFromThis.find(t => isMonthClosed(data, t.year || 2026, t.month));
    if (blocked) { addNotification({ type: 'error', title: 'الشهر مغلق', duration: 6000 }); return; }

    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'حذف الالتزام', message: 'سيتم حذف البند والقيود المعلقة المرتبطة',
      onConfirm: () => {
        saveHistory();
        const newRecurring = recurringItems.filter(i => i.id !== id);
        const newTx = (data.transactions || []).filter(t => !(t.sourceRecurringId === id && t.status !== 'paid'));
        const newMaterialized = { ...(data.materializedRecurring || {}) };
        Object.keys(newMaterialized).forEach(k => { if (k.startsWith(id + '_')) delete newMaterialized[k]; });
        dispatch({ type: 'SET_DATA', payload: { ...data, recurringItems: newRecurring, transactions: newTx, materializedRecurring: newMaterialized } });
        addNotification({ type: 'success', title: 'تم الحذف نهائياً' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  }, [recurringItems, data, saveHistory, addNotification]);

  const forcePullFromCloud = useCallback(async () => {
    if (!isAuthenticated) { addNotification({ type: 'error', title: 'غير مصرح' }); return; }
    if (!isOnline) { addNotification({ type: 'error', title: 'لا يوجد اتصال' }); return; }

    dispatch({ type: 'SET_IS_PROCESSING', payload: true });
    addNotification({ type: 'info', title: 'جاري المزامنة...', duration: 2000 });

    try {
      const innerDocRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
      const doc = await innerDocRef.get({ source: 'server' });

      if (!doc.exists) { addNotification({ type: 'warning', title: 'مفيش بيانات على السحابة' }); return; }

      const remote = doc.data();
      const migratedRemote = migrateData(remote);

      const localTxIds = new Set((data.transactions || []).map(t => t.id));
      const remoteTxIds = new Set((migratedRemote.transactions || []).map(t => t.id));

      const onlyLocal = (data.transactions || []).filter(t => !remoteTxIds.has(t.id));
      const onlyRemote = (migratedRemote.transactions || []).filter(t => !localTxIds.has(t.id));

      if (onlyLocal.length > 0) {
        const merged = { ...migratedRemote, transactions: sortTransactions([...(migratedRemote.transactions || []), ...onlyLocal]) };
        await innerDocRef.set(merged, { merge: false });
        dispatch({ type: 'SET_DATA', payload: merged });
        addNotification({ type: 'success', title: `✅ تمت المزامنة (رفعت ${onlyLocal.length} وحمّلت ${onlyRemote.length})` });
      } else {
        dispatch({ type: 'SET_DATA', payload: migratedRemote });
        if (remote.budgets) dispatch({ type: 'SET_BUDGETS', payload: remote.budgets });
        addNotification({ type: 'success', title: `✅ تم التحديث (${onlyRemote.length} معاملة جديدة)` });
      }

      lastRemoteRef.current = JSON.stringify(migratedRemote);
      localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now()));
    } catch (err) {
      console.error('Force pull failed:', err);
      addNotification({ type: 'error', title: 'فشلت المزامنة', message: err.message });
    } finally {
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
    }
  }, [isAuthenticated, isOnline, data, addNotification]);

  const handleExport = useCallback(() => {
    const blob = new Blob([JSON.stringify({ data, budgets, exportedAt: new Date().toISOString(), version: 'V88.1.1' })], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `finance_backup_v8811_${getLocalISODate()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    addNotification({ type: 'success', title: 'تم التصدير' });
  }, [data, budgets, addNotification]);

  const handleImport = useCallback((e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        if (parsed.data) {
          saveHistory();
          dispatch({ type: 'SET_DATA', payload: migrateData(parsed.data) });
          if (parsed.budgets) dispatch({ type: 'SET_BUDGETS', payload: parsed.budgets });
          addNotification({ type: 'success', title: 'تم الاستيراد' });
        }
      } catch { addNotification({ type: 'error', title: 'ملف غير صالح' }); }
    };
    reader.readAsText(file);
  }, [saveHistory, addNotification]);

  const handlePendingCloseAction = useCallback((action) => {
    const { pending, month, year } = pendingCloseModal;
    if (!pending || pending.length === 0) return;

    if (action === 'carry') {
      const idx = getMonthIndex(month);
      const nextMonth = idx === 11 ? ALL_MONTHS[0] : ALL_MONTHS[idx + 1];
      const nextYear = idx === 11 ? year + 1 : year;
      const nextKey = makeMonthKey(nextYear, nextMonth);
      if ((data.closedMonths || []).includes(nextKey)) {
        addNotification({ type: 'error', title: 'لا يمكن الترحيل', message: `شهر ${nextMonth} ${nextYear} مغلق.`, duration: 7000 });
        return;
      }
    }

    saveHistory();
    const pendingIds = pending.map(t => t.id);
    dispatch({ type: 'CLOSE_MONTH_AFTER_RESOLVE', payload: { year, month, resolveAction: action, pendingIds } });
    const actionText = action === 'approve' ? 'تم الاعتماد والإقفال' : 'تم الترحيل والإقفال';
    addNotification({ type: 'success', title: actionText, message: `شهر ${month} ${year}` });
  }, [pendingCloseModal, data, saveHistory, addNotification]);

  /* Side effects */
  useEffect(() => { try { localStorage.setItem('budgets', JSON.stringify(budgets)); } catch (e) {} }, [budgets]);
  useEffect(() => {
    document.documentElement.classList.toggle('dark', isDarkMode);
    localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
  }, [isDarkMode]);
  useEffect(() => {
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDarkMode ? '#050A14' : '#F4F7FB');
  }, [isDarkMode]);
  useEffect(() => () => {
    if (processingTimeoutRef.current) clearTimeout(processingTimeoutRef.current);
    saveLockRef.current = false;
  }, []);

  useEffect(() => {
    if (!isAuthenticated || !isOnline || !hasReceivedInitialSnapshot.current) return;
    const checkInterval = setInterval(() => {
      const last = Number(localStorage.getItem(AUTO_BACKUP_LS_KEY) || 0);
      const dayMs = 24 * 60 * 60 * 1000;
      if (Date.now() - last > dayMs && _driveAccessToken) {
        uploadBackupToDrive({ data, budgets, exportedAt: new Date().toISOString(), version: 'V88.1.1' })
          .then(() => { localStorage.setItem(AUTO_BACKUP_LS_KEY, String(Date.now())); })
          .catch(() => {});
      }
    }, 60 * 60 * 1000);
    return () => clearInterval(checkInterval);
  }, [isAuthenticated, isOnline, data, budgets]);

  if (authLoading) return (
    <div className="flex h-screen items-center justify-center" style={{ background: '#050A14' }}>
      <div className="w-12 h-12 border-[3px] border-[#635BFF] border-t-transparent rounded-full animate-spin"></div>
    </div>
  );

  if (isAuthenticated && cloudSyncStatus === 'pending') {
    return (
      <div className="flex h-screen flex-col items-center justify-center" style={{ background: '#050A14' }}>
        <div className="w-12 h-12 border-[3px] border-[#635BFF] border-t-transparent rounded-full animate-spin mb-4"></div>
        <p className="text-white font-bold text-sm mb-1">جاري مزامنة البيانات...</p>
        <p className="text-xs" style={{ color: '#64748B' }}>بنستقبل آخر نسخة من السحابة</p>
      </div>
    );
  }

  if (!isAuthenticated) return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;

  if (!pinVerified) return (
    <PinLockScreen
      onSuccess={async (pin) => { try { await savePinSession(pin); } catch (e) {} setPinVerified(true); }}
      onLogout={() => {
        firebase.auth().signOut();
        setIsAuthenticated(false);
        sessionStorage.removeItem(PIN_SESSION_KEY);
        setPinVerified(false);
      }}
    />
  );

  const renderActiveView = () => {
    switch (activeTab) {
      case 'dashboard':
        return (
          <DashboardView

            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })}
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })}
            monthCashback={monthCashback} bankFeesMonth={bankFeesMonth}
            hanySummary={hanySummary}
          />

      case 'transactions':

            statusFilter={statusFilter} searchTerm={searchTerm} expandedGroup={expandedGroup}
            data={data} monthInsights={monthInsights} dispatch={dispatch}
            handleDelete={handleDelete} addNotification={addNotification}
            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })}
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })}

      case 'categories':
        return (
          <CategoriesView

            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })}
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })}
          />
        );
      case 'reports':
        return (
          <ReportsHubView
            data={data} liveBalances={liveBalances} updatedLoans={updatedLoans}
            selectedMonth={selectedMonth} selectedYear={selectedYear}
            dispatch={dispatch} addNotification={addNotification}
          />
        );
      case 'loans':
        return (
          <LoansView
            updatedLoans={updatedLoans} cards={cards} recurringItems={recurringItems}
            transactions={transactions} dispatch={dispatch} deleteRecurring={deleteRecurring}
            saveHistory={saveHistory} getLocalISODate={getLocalISODate}
            addNotification={addNotification} data={data}
            selectedMonth={selectedMonth} selectedYear={selectedYear}
          />
        );
      case 'cards':
        return (
          <WalletsAndCardsView
            cards={cards} buildLedger={buildLedger} expandedLedgers={expandedLedgers}

            selectedYear={selectedYear} dispatch={dispatch} handleDelete={handleDelete}
            handleAddWalletDeposit={handleAddWalletDeposit}
            handleAddWalletWithdrawal={handleAddWalletWithdrawal}
            walletVisibility={walletVisibility} liveBalances={liveBalances}
            saveHistory={saveHistory} addNotification={addNotification} data={data}
            onReconcile={(accountKey) => {
              dispatch({ type: 'SET_RECONCILIATION_MODAL', payload: { accountKey, computedBalance: liveBalances[accountKey] || 0 } });
            }}
          />
        );
      case 'financial-forecast':
        return (
          <FinancialForecastView
            data={data} transactions={transactions} cards={cards}

          />

      case 'calendar':
        return (

          />
        );
      case 'duplicates':
        return (
          <DuplicateDetectionSystem
            transactions={transactions} data={data} dispatch={dispatch}
            addNotification={addNotification} saveHistory={saveHistory}
            onBulkDelete={handleBulkDeleteInApp}
          />
        );
      case 'data-health':
        return (
          <DataHealthView
            data={data} transactions={transactions} cards={cards}
            updatedLoans={updatedLoans} liveBalances={liveBalances} dispatch={dispatch}
          />
        );
      case 'deleted':
        return (
          <DeletedArchiveView
            data={data} dispatch={dispatch} saveHistory={saveHistory}
            addNotification={addNotification} transactions={transactions}
          />
        );
      case 'settings':
        return (
          <SettingsView
            data={data} accountsData={accountsData} cards={cards} budgets={budgets}
            dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification}
            onResetPersonalData={handleResetPersonalData}
          />
        );
      default: return null;
    }
  };

  const isHanyShopCat = isHanyShopCategory(formData.category);
  const appendQuickItem = (item) => {
    const current = formData.description || '';
    const sep = current && !current.endsWith(' ') && !current.endsWith(',') ? ' + ' : '';
    dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: current + sep + item } });
  };

  const NAV_ITEMS = [
    { id: 'dashboard', label: 'الرئيسية', icon: Home },
    { id: 'transactions', label: 'المعاملات', icon: Receipt },
    { id: 'cards', label: 'البطاقات', icon: CreditCard },
    { id: 'reports', label: 'تقارير', icon: PrinterIcon },
    { id: 'more', label: 'المزيد', icon: MoreHorizontal }
  ];

  const MORE_GROUPS = SIDEBAR_GROUPS;

  return (
    <PromiseModalProvider>
      <div className="min-h-screen font-sans">
        <OfflineBanner online={isOnline} />
        <ToastContainer notifications={notifications} removeNotification={removeNotification} />
        <ConfirmDialog confirmDialog={confirmDialog} dispatch={dispatch} />

        <Sidebar
          isOpen={isSidebarOpen}
          onClose={() => dispatch({ type: 'SET_SIDEBAR_OPEN', payload: false })}
          activeTab={activeTab}
          onNavigate={(id) => dispatch({ type: 'SET_ACTIVE_TAB', payload: id })}
          isDarkMode={isDarkMode}
          onToggleTheme={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: !isDarkMode })}
          isOnline={isOnline} syncStatus={cloudSyncStatus} isSaving={isSaving}
          hanyPayable={netWorthData.hanyPayable} data={data}
          onOpenSms={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: true })}
          onForceSync={forcePullFromCloud}
          forceSaveState={forceSaveState}
          onForceSave={handleForceSave}
          onLogout={() => {
            firebase.auth().signOut();
            setIsAuthenticated(false);
            sessionStorage.removeItem(PIN_SESSION_KEY);
            setPinVerified(false);
          }}
          onLock={() => { sessionStorage.removeItem(PIN_SESSION_KEY); setPinVerified(false); }}
        />

        {pendingCloseModal.isOpen && (
          <PendingCloseModal
            data={pendingCloseModal}
            onClose={() => dispatch({ type: 'SET_PENDING_CLOSE_MODAL', payload: { isOpen: false, pending: [], total: 0, month: '', year: 0 } })}
            onAction={handlePendingCloseAction}
          />
        )}

        {isProcessing && (
          <div className="processing-overlay">
            <div className="processing-spinner mb-4"></div>
            <h3 className="text-base font-bold mb-2">جاري تطبيق العملية</h3>
            <button onClick={cancelProcessing} className="btn btn-danger mt-3 text-xs">إلغاء</button>
          </div>
        )}

        {isPinChangeOpen && (<PinChangeModal onClose={() => dispatch({ type: 'SET_PIN_CHANGE_OPEN', payload: false })} addNotification={addNotification} />)}

        {isSmsModalOpen && (
          <SmsParserModal
            isOpen={true}
            onClose={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: false })}
            dispatch={dispatch} addNotification={addNotification}
            saveHistory={saveHistory} data={data}
          />
        )}

        {activeCategoryDetail && (
          <CategoryDetailModal
            category={activeCategoryDetail} transactions={transactions}
            selectedMonth={selectedMonth} selectedYear={selectedYear}
            dispatch={dispatch} addNotification={addNotification}
          />
        )}

        {viewingCardStatement && (
          <CardStatementModal
            card={viewingCardStatement} data={data} transactions={transactions}
            onClose={() => dispatch({ type: 'SET_VIEWING_CARD_STATEMENT', payload: null })}
            addNotification={addNotification} dispatch={dispatch}
          />
        )}

        {cardPaymentModal && (
          <CardPaymentModal
            cardId={cardPaymentModal.cardId} data={data} dispatch={dispatch}
            saveHistory={saveHistory} addNotification={addNotification}
            onClose={() => dispatch({ type: 'SET_CARD_PAYMENT_MODAL', payload: null })}
          />
        )}

        {reconciliationModal && (
          <ReconciliationModal
            accountKey={reconciliationModal.accountKey}
            computedBalance={reconciliationModal.computedBalance}
            onClose={() => dispatch({ type: 'SET_RECONCILIATION_MODAL', payload: null })}
            onReconcile={handleReconcile}
            addNotification={addNotification}
          />
        )}

        <div className="bottom-nav-container no-print">
          <div className="nav-grid">
            {NAV_ITEMS.map(item => {
              const Icon = item.icon;
              const isActive = activeTab === item.id ||
                (item.id === 'more' && ['categories', 'loans', 'financial-forecast', 'duplicates', 'data-health', 'deleted', 'settings', 'more'].includes(activeTab));
              return (
                <button key={item.id} type="button" onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} className={`nav-btn ${isActive ? 'active' : ''}`}>
                  <Icon size={20} /><span>{item.label}</span>
                </button>
              );
            })}
          </div>
        </div>

        {activeTab === 'more' && (
          <div className="fixed inset-0 z-[2000] no-print animate-fadeIn lg:hidden" style={{ background: 'var(--bg-app)' }}>
            <div className="h-full overflow-y-auto pb-24">
              <div className="sticky top-0 z-10 px-4 py-4 flex justify-between items-center backdrop-blur-lg" style={{ background: 'color-mix(in srgb, var(--bg-app) 92%, transparent)', borderBottom: '1px solid var(--border-subtle)' }}>
                <h2 className="text-lg font-black">المزيد</h2>
                <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'dashboard' })} className="btn btn-ghost p-2"><X size={18} /></button>
              </div>
              <div className="p-4 max-w-2xl mx-auto space-y-4">
                <div className="card flex items-center gap-3">
                  <div className="w-14 h-14 rounded-2xl flex items-center justify-center text-white shadow-md" style={{ background: 'linear-gradient(135deg, #635BFF 0%, #4A42E5 100%)' }}>
                    <UserIcon size={24} />
                  </div>
                  <div className="flex-1">
                    <h3 className="font-black text-sm">Ahmed M. Khalil</h3>
                    <p className="text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>ahmedmkh@gmail.com</p>
                  </div>
                  <ForceSaveButton onForceSave={handleForceSave} state={forceSaveState} isSaving={isSaving} compact={true} />
                </div>
                <div><StatusBar isOnline={isOnline} syncStatus={cloudSyncStatus} isSaving={isSaving} hanyPayable={netWorthData.hanyPayable} /></div>
                {MORE_GROUPS.map(group => (
                  <div key={group.group}>
                    <p className="sidebar-group-title">{group.group}</p>
                    <div className="grid grid-cols-2 gap-2">
                      {group.items.map(item => {
                        const Icon = item.icon;
                        return (
                          <button key={item.id} onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} className="card card-hover p-4 flex items-center gap-3 text-right active:scale-[0.98]">
                            <div className="p-2 rounded-xl" style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}><Icon size={16} /></div>
                            <span className="font-black text-xs">{item.label}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
                <div>
                  <p className="sidebar-group-title">البيانات</p>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={handleExport} className="card card-hover p-4 flex items-center gap-3 active:scale-[0.98]">
                      <div className="p-2 rounded-xl bg-blue-50 dark:bg-blue-950/30 text-blue-600"><Download size={16} /></div>
                      <span className="font-black text-xs">حفظ نسخة</span>
                    </button>
                    <label className="card card-hover p-4 flex items-center gap-3 cursor-pointer active:scale-[0.98]">
                      <div className="p-2 rounded-xl bg-purple-50 dark:bg-purple-950/30 text-purple-600"><Upload size={16} /></div>
                      <span className="font-black text-xs">استيراد</span>
                      <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                    </label>
                  </div>
                </div>
                <div>
                  <p className="sidebar-group-title">الأمان</p>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => { sessionStorage.removeItem(PIN_SESSION_KEY); setPinVerified(false); }} className="card card-hover p-4 flex items-center gap-3 active:scale-[0.98]">
                      <div className="p-2 rounded-xl bg-amber-50 dark:bg-amber-950/30 text-amber-600"><Lock size={16} /></div>
                      <span className="font-black text-xs">قفل التطبيق</span>
                    </button>
                    <button onClick={() => { firebase.auth().signOut(); setIsAuthenticated(false); sessionStorage.removeItem(PIN_SESSION_KEY); setPinVerified(false); }} className="card card-hover p-4 flex items-center gap-3 active:scale-[0.98]">
                      <div className="p-2 rounded-xl bg-red-50 dark:bg-red-950/30 text-red-600"><LogOut size={16} /></div>
                      <span className="font-black text-xs">تسجيل الخروج</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

        <main className="p-3 lg:p-5 w-full">
          <div className="max-w-5xl mx-auto space-y-4 animate-fadeIn pb-24">
            {activeTab !== 'more' && (
              <ProfessionalHeader
                isDarkMode={isDarkMode} dispatch={dispatch}
                onOpenSms={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: true })}
                isOnline={isOnline} syncStatus={cloudSyncStatus} isSaving={isSaving}
                hanyPayable={netWorthData.hanyPayable}
                onOpenSidebar={() => dispatch({ type: 'SET_SIDEBAR_OPEN', payload: true })}
                onForceSync={forcePullFromCloud}
                forceSaveState={forceSaveState} onForceSave={handleForceSave}
                onOpenPrintCenter={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'reports' })}
              />
            )}
            {activeTab !== 'more' && renderActiveView()}
          </div>
        </main>

        {activeTab !== 'reports' && activeTab !== 'more' && (
          <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'reports' })} className="print-fab no-print" title="فتح مركز التقارير والطباعة">
            <PrinterIcon size={24} />
          </button>
        )}

        {/* ✅ V88.1.1 FIXED — Form Modal مع form-scrollable + Footer sticky */}
        {isFormOpen && (
          <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) dispatch({ type: 'SET_FORM_OPEN', payload: false }); }}>
            <div className="w-full max-w-lg rounded-2xl shadow-2xl flex flex-col animate-slideInBottom"
              style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)', maxHeight: '92dvh', height: 'auto' }}>
              <div className="p-4 flex justify-between items-center flex-shrink-0" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-base font-black">{formMode === 'add' ? 'إضافة عملية' : 'تعديل عملية'}</h3>
                <button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_FORM_OPEN', payload: false })} className="btn btn-ghost p-2"><X size={18} /></button>
              </div>

              <form data-form="main" onSubmit={handleSaveTransaction} className="form-scrollable flex-1" style={{ minHeight: 0 }}>
                <div className="p-3 space-y-3">
                  {!isOnline && (
                    <div className="p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900 flex items-center gap-2">
                      <Wifi size={14} className="text-amber-600" />
                      <span className="text-[11px] font-bold text-amber-700 dark:text-amber-400">أنت غير متصل — سيتم الحفظ محلياً</span>
                    </div>
                  )}

                  <div className="form-section form-section-compact">
                    <div className="form-section-title"><span>🎯</span> التصنيف</div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>النوع</label>
                        <select className="input-field font-bold text-sm py-2.5" value={formData.type}
                          onChange={(e) => {
                            const t = e.target.value;
                            dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, type: t, subType: t === 'income' ? 'deposit' : 'withdrawal', category: '' } });
                          }}>
                          <option value="expense">مصروف 💸</option>
                          <option value="income">دخل 💰</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>الفئة *</label>
                        <select className={`input-field font-bold text-sm py-2.5 ${formErrors.category ? 'error' : ''}`} value={formData.category}
                          onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, category: e.target.value } })} required>
                          <option value="">اختر...</option>
                          {Object.entries(CATEGORY_GROUPS[formData.type]).map(([g, items]) => (
                            <optgroup key={g} label={g}>{items.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>
                          ))}
                        </select>
                      </div>
                    </div>
                  </div>

                  <div className="form-section form-section-compact">
                    <div className="form-section-title"><span>📊</span> الحالة</div>
                    <div className="grid grid-cols-2 gap-2">
                      <label className={`flex items-center justify-center gap-2 p-2.5 rounded-xl cursor-pointer border-2 font-bold text-xs transition-all ${formData.status !== 'paid' ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-500 text-amber-700 dark:text-amber-400' : 'border-transparent'}`}>
                        <input type="radio" name="status" value="pending" className="hidden" checked={formData.status !== 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'pending' } })} />
                        <Clock size={14} /> معلق
                      </label>
                      <label className={`flex items-center justify-center gap-2 p-2.5 rounded-xl cursor-pointer border-2 font-bold text-xs transition-all ${formData.status === 'paid' ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-500 text-emerald-700 dark:text-emerald-400' : 'border-transparent'}`}>
                        <input type="radio" name="status" value="paid" className="hidden" checked={formData.status === 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'paid' } })} />
                        <CheckCircle2 size={14} /> معتمد
                      </label>
                    </div>
                  </div>

                  <div className="form-section form-section-compact">
                    <div className="form-section-title"><span>💰</span> المبلغ والدفع</div>
                    <div className="grid grid-cols-2 gap-2.5 mb-3">
                      <div>
                        <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>الكمية</label>
                        <input type="number" inputMode="numeric" min="1" className="input-field input-num text-base text-center py-2.5"
                          value={formData.quantity || ''}
                          onChange={e => {
                            const qty = e.target.value;
                            const price = formData.unitPrice;
                            const newAmount = (qty && price) ? String(Number(qty) * Number(price)) : formData.amount;
                            dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, quantity: qty, amount: newAmount } });
                          }} placeholder="العدد" />
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>سعر الوحدة</label>
                        <input type="text" inputMode="decimal" className="input-field input-num text-base text-center py-2.5"
                          value={formData.unitPrice || ''}
                          onChange={e => {
                            const price = e.target.value;
                            const qty = formData.quantity;
                            const newAmount = (qty && price) ? String(Number(qty) * Number(price)) : formData.amount;
                            dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, unitPrice: price, amount: newAmount } });
                          }} placeholder="السعر" />
                      </div>
                    </div>
                    <div className="grid grid-cols-3 gap-2.5">
                      <div>
                        <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ *</label>
                        <input type="text" inputMode="decimal" required className={`input-field input-num text-base text-center py-2.5 ${formErrors.amount ? 'error' : ''}`}
                          style={{ color: 'var(--accent)' }} value={formData.amount}
                          onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, amount: e.target.value, quantity: '', unitPrice: '' } })} placeholder="0.00" />
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>التاريخ</label>
                        <SafeDateInput required className={`input-field text-[11px] font-bold py-2.5 ${formErrors.date ? 'error' : ''}`}
                          value={formData.date} onChange={v => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, date: v } })} />
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>الدفع</label>
                        <select className="input-field text-[11px] font-bold py-2.5" value={formData.method}
                          onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, method: e.target.value } })}>
                          {PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                        </select>
                      </div>
                    </div>
                  </div>

                  <div className="form-section form-section-compact">
                    <div className="form-section-title"><span>📝</span> الوصف</div>
                    <input type="text" className={`input-field font-bold text-sm py-2.5 ${formErrors.description ? 'error' : ''}`}
                      value={formData.description || ''}
                      onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: e.target.value } })} placeholder="تفاصيل..." />
                  </div>

                  {isHanyShopCat && (
                    <div className="p-3 rounded-xl animate-fadeIn" style={{ background: 'var(--warning-soft)', border: '1px dashed var(--warning)' }}>
                      <div className="flex items-center justify-between mb-2 flex-wrap gap-1">
                        <p className="text-[10px] font-black text-amber-700 dark:text-amber-400">⚡ أصناف سريعة — محل هاني</p>
                        <div className="flex items-center gap-2">
                          <button type="button" onClick={() => setShowAllHanyItems(true)} className="text-[9px] font-black px-2 py-1 rounded-full" style={{ background: 'var(--warning)', color: 'white' }}>عرض الكل ({HANY_QUICK_ITEMS.length})</button>
                          <button type="button" onClick={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: '' } })} className="text-[9px] font-bold text-red-500 hover:underline">مسح</button>
                        </div>
                      </div>
                      {/* ✅ V88.1.1 FIX — quick-items-grid للتمرير */}
                      <div className="quick-items-grid flex flex-wrap gap-1">
                        {HANY_QUICK_ITEMS.slice(0, 12).map(item => (
                          <button key={item} type="button" onClick={() => appendQuickItem(item)} className="quick-chip" style={{ fontSize: '10px', padding: '4px 8px' }}>{item}</button>
                        ))}
                      </div>
                      <p className="text-[9px] mt-2 font-bold" style={{ color: 'var(--warning)' }}>🛒 سيتم حفظها على دفتر هاني (بدون تأثير نقدي — يُسدد لاحقاً)</p>
                    </div>
                  )}
                </div>
              </form>

              {/* ✅ V88.1.1 FIX — Footer sticky */}
              <div className="p-2 flex gap-2 flex-shrink-0 sticky bottom-0 z-10"
                style={{ borderTop: '1px solid var(--border-subtle)', background: 'var(--bg-card)', paddingBottom: 'calc(10px + env(safe-area-inset-bottom, 0px))' }}>
                <button type="button" onClick={() => dispatch({ type: 'SET_FORM_OPEN', payload: false })} className="btn btn-secondary text-sm py-3 px-4">إلغاء</button>
                <button type="button" onClick={handleSaveTransaction} disabled={isProcessing} className="btn btn-primary flex-1 py-3 text-sm font-black">
                  {isProcessing ? (
                    <React.Fragment>
                      <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin" />
                      جاري الحفظ...
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <Save size={16} />
                      {formData.status === 'paid' ? 'حفظ واعتماد' : 'حفظ كمعلق'}
                    </React.Fragment>
                  )}
                </button>
              </div>
            </div>
          </div>
        )}

        {showAllHanyItems && (
          <div className="modal-backdrop no-print" style={{ zIndex: 5000 }} onClick={(e) => { if (e.target === e.currentTarget) setShowAllHanyItems(false); }}>
            <div className="w-full max-w-md rounded-2xl shadow-2xl flex flex-col animate-scaleIn" style={{ background: 'var(--bg-card)', maxHeight: '80dvh' }}>
              <div className="p-4 flex justify-between items-center flex-shrink-0" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-sm font-black">كل أصناف محل هاني ({HANY_QUICK_ITEMS.length})</h3>
                <button type="button" onClick={() => setShowAllHanyItems(false)} className="btn btn-ghost p-2"><X size={18} /></button>
              </div>
              <div className="p-4 overflow-y-auto scroll-hide flex-1" style={{ minHeight: 0 }}>
                <div className="flex flex-wrap gap-1.5">
                  {HANY_QUICK_ITEMS.map(item => (
                    <button key={item} type="button" onClick={() => { appendQuickItem(item); setShowAllHanyItems(false); }} className="quick-chip">{item}</button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}

        {isQuickTransferModalOpen && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-sm font-black flex items-center gap-2"><ArrowLeftRight size={16} className="text-[color:var(--accent)]" /> التحويلات</h3>
                <button type="button" onClick={() => {
                  dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
                  dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: {
                    transferMode: 'monthly', from: 'cib_savings', to: 'fawry', amount: '', transferType: 'monthly',
                    date: getLocalISODate(), beneficiaryId: null, forceCash: false,
                    internalFrom: 'cib_savings', internalTo: 'fawry', internalFees: '', internalDescription: '',
                    externalFrom: 'cib_savings', externalRecipient: '', externalAccount: '',
                    externalFees: '', externalWithFee: false, externalNote: ''
                  } });
                }} className="btn btn-ghost p-2"><X size={18} /></button>
              </div>

              <div className="p-2" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <div className="transfer-type-tabs">

                <div className="grid grid-cols-2 gap-3">
                  <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>من شهر</label><input type="month" className="input-field text-xs font-bold py-2" value={recurringFormData.startMonth || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, startMonth: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>إلى شهر</label><input type="month" className="input-field text-xs font-bold py-2" value={recurringFormData.endMonth || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, endMonth: e.target.value } })} /></div>
                </div>
                <label className="flex items-center gap-2.5 p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 cursor-pointer">
                  <input type="checkbox" checked={recurringFormData.active !== false} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, active: e.target.checked } })} className="w-4 h-4 accent-emerald-600" />
                  <span className="text-xs font-bold text-emerald-700 dark:text-emerald-400">نشط (سيُولّد تلقائياً كل شهر)</span>
                </label>
                <button type="submit" className="btn btn-primary w-full py-3 text-sm">
                  <Save size={16} /> {recurringFormData.id ? 'تحديث البند' : 'إضافة البند'}
                </button>
              </form>
            </div>
          </div>
        )}
      </div>
    </PromiseModalProvider>
  );
}

/* ═══════════════ ROOT RENDER ═══════════════ */
const rootElement = document.getElementById('root');
if (rootElement) {
  createRoot(rootElement).render(
    <ErrorBoundary>
      <App />
    </ErrorBoundary>
  );
  const hideLoading = () => {
    const l = document.getElementById('loading');
    if (!l) return;
    l.style.transition = 'opacity 0.4s ease';
    l.style.opacity = '0';
    setTimeout(() => { l.style.display = 'none'; }, 400);
  };
  if (document.readyState === 'complete') {
    setTimeout(hideLoading, 500);
  } else {
    window.addEventListener('load', () => setTimeout(hideLoading, 500));
  }
}
</script>
</body>
</html>
