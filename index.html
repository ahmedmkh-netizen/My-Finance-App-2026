                    <tr style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                      <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>التاريخ</th>
                      <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الوصف</th>
                      <th className="p-2.5 text-[10px] font-bold text-left" style={{ color: 'var(--text-muted)' }}>المبلغ</th>

                      <tr key={t.id} className="hover:bg-[color:var(--bg-muted)]">

                        <td className="p-2.5 font-bold text-xs">{t.description} <FamilyBadge tx={t} /></td>
                        <td className={`p-2.5 text-left font-black text-xs ${t.subType === 'deposit' ? 'text-emerald-600' : 'text-red-500'}`}>

/* ─────────────── Dashboard View ─────────────── */
const DashboardView = memo(({ 
  data, financeSnapshot, liveBalances, totalLiquidity, walletVisibility, 
  onToggleVisibility, dispatch, selectedYear, selectedMonth, transactions, 
  cards, updatedLoans, chartData, isDarkMode, addNotification, 
  onSelectYear, onSelectMonth 
}) => {
  const totalCardDebt = useMemo(() => cards.reduce((s, c) => s + computeCardDebt(data, c), 0), [cards, data]);
  const totalLoanDebt = useMemo(() => updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const grandTotalDebt = totalCardDebt + totalLoanDebt;
  const netPosition = totalLiquidity - grandTotalDebt;
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);
  
  const bankFeesMonth = useMemo(() => transactions.filter(t => 
    t.status === 'paid' && t.type === 'expense' && BANK_FEE_CATEGORIES.has(t.category) 
    && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).reduce((s, t) => s + safeNumber(t.amount), 0), [transactions, selectedMonth, selectedYear]);
  
  const monthCashback = useMemo(() => {
    const trackers = (data?.cashbackTrackers || []).filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
    const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
    const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
    return { expected, received, pending: expected - received };
  }, [data?.cashbackTrackers, selectedMonth, selectedYear]);
  
  const pieData = useMemo(() => {
    const acc = {};
    transactions.filter(t => 
      t.type === 'expense' && t.month === selectedMonth && (t.year || 2026) === selectedYear 
      && t.status === 'paid' && safeNumber(t.amount) > 0
    ).forEach(t => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); });
    const sorted = Object.entries(acc).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
    if (sorted.length <= 5) return sorted;
    const top = sorted.slice(0, 4);
    const restVal = sorted.slice(4).reduce((s, i) => s + i.value, 0);
    return [...top, { name: 'أخرى', value: restVal }];
  }, [transactions, selectedMonth, selectedYear]);
  
  const net = financeSnapshot;
  const monthPendingCount = transactions.filter(t => 
    t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status !== 'paid'
  ).length;

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex items-center justify-between gap-4 flex-wrap">
          <div>
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>صافي المركز</p>
            <h2 className={`text-3xl font-black tracking-tight ${netPosition >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
              {netPosition >= 0 ? '+' : ''}{fmt(netPosition)}
              <span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <p className={`text-[11px] font-bold mt-1.5 ${netPosition >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
              {netPosition >= 0 ? '✅ وضع آمن' : '⚠️ مراجعة'}
            </p>
          </div>
          <div className="flex gap-2">
            <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center min-w-[80px]">
              <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">سيولة</p>
              <p className="text-sm font-black text-emerald-600">{fmt(totalLiquidity)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-center min-w-[80px]">
              <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مديونية</p>
              <p className="text-sm font-black text-red-600">{fmt(grandTotalDebt)}</p>
            </div>
          </div>
        </div>
      </div>
      
      {monthPendingCount > 0 && (
        <div className="card" style={{ background: 'var(--warning-soft)', borderColor: 'var(--warning)' }}>
          <div className="flex items-center gap-2">
            <Clock size={16} className="text-amber-600 flex-shrink-0" />
            <div className="flex-1">
              <p className="text-xs font-bold text-amber-700 dark:text-amber-400">⚠️ {monthPendingCount} عملية معلقة في {selectedMonth}</p>
              <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>لا تؤثر على الرصيد الحي — اعتمدها أو رحّلها</p>
            </div>
            <button 
              onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'transactions' })} 
              className="btn btn-secondary text-[10px] py-1.5 px-2.5"
            >عرض</button>
          </div>
        </div>
      )}
      
      <div className="grid grid-cols-3 gap-2">
        <button 
          onClick={() => { 
            dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); 
            dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', amount: '', date: getLocalISODate(), method: 'cash', subType: 'withdrawal', category: '', status: 'pending', receipts: [] } }); 
            dispatch({ type: 'SET_FORM_OPEN', payload: true }); 
          }} 
          className="card py-3 flex flex-col items-center gap-1 active:scale-95"
        >
          <div className="p-1.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-red-600 dark:text-red-400"><TrendingDown size={16} /></div>
          <span className="text-[11px] font-bold">مصروف</span>
        </button>
        <button 
          onClick={() => { 
            dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); 
            dispatch({ type: 'SET_FORM_DATA', payload: { type: 'income', amount: '', date: getLocalISODate(), method: 'cash', subType: 'deposit', category: '', status: 'pending', receipts: [] } }); 
            dispatch({ type: 'SET_FORM_OPEN', payload: true }); 
          }} 
          className="card py-3 flex flex-col items-center gap-1 active:scale-95"
        >
          <div className="p-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400"><TrendingUp size={16} /></div>
          <span className="text-[11px] font-bold">دخل</span>
        </button>
        <button 
          onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: true })} 
          className="card py-3 flex flex-col items-center gap-1 active:scale-95"
        >
          <div className="p-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400"><Layers size={16} /></div>
          <span className="text-[11px] font-bold">تحويل / شهري</span>
        </button>
      </div>
      
      <div className="grid grid-cols-3 gap-2">
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'loans' })} className="card py-2.5 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1">
            <Briefcase size={11} className="text-blue-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>عهدة</span>
          </div>
          <p className={`text-sm font-black ${custodySummary.balance > 0 ? 'text-blue-600' : custodySummary.balance < 0 ? 'text-red-600' : 'text-emerald-600'}`}>
            {fmt(custodySummary.balance)}
          </p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'cards' })} className="card py-2.5 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1">
            <Gift size={11} className="text-emerald-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>كاش باك</span>
          </div>
          <p className="text-sm font-black text-emerald-600">{fmt(monthCashback.received)}</p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'transactions' })} className="card py-2.5 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1">
            <Receipt size={11} className="text-red-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>رسوم بنكية</span>
          </div>
          <p className="text-sm font-black text-red-600">{fmt(bankFeesMonth)}</p>
        </button>
      </div>
      
      <QuickBalanceOverview balances={liveBalances} walletVisibility={walletVisibility} onToggleVisibility={onToggleVisibility} />
      
      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />
      
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <EnhancedStatCard title="الكاش في اليد" amount={net.actualCashInHand} icon={Wallet} subtitle="حتى نهاية اليوم" isPrivate={!walletVisibility.cash} color="emerald" />
        <EnhancedStatCard title="دخل محصل" amount={net.actualIncome} icon={TrendingUp} subtitle={net.pendingIncome > 0 ? `+${fmt(net.pendingIncome)} معلق` : ''} color="emerald" />
        <EnhancedStatCard title="مصاريف معلقة" amount={-net.pendingCash} icon={Clock} subtitle={`مدفوع: ${fmt(net.paidCash)}`} color="red" />
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'forecast' })} className="stat-card text-right active:scale-95">
          <div className="flex justify-between items-start mb-2">
            <div>
              <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>توقع القادم</p>
              <h3 className={`text-lg font-black ${net.projectedClosingBalance >= 0 ? 'text-blue-600' : 'text-red-600'}`}>
                {fmt(net.projectedClosingBalance)}
              </h3>
            </div>
            <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400"><LineChart size={16} /></div>
          </div>
        </button>
      </div>
      
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
        <div className="card">
          <h3 className="font-bold text-xs mb-3 flex items-center gap-2">
            <BarChart3 className="text-blue-500" size={14} /> التدفق النقدي — {selectedYear}
          </h3>
          <div className="h-48">
            {chartData.every(d => d.دخل === 0 && d.مصروف === 0) ? (
              <div className="h-full flex items-center justify-center font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد بيانات</div>
            ) : (
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={chartData}>
                  <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.08} />
                  <XAxis dataKey="name" fontSize={9} stroke="#94A3B8" />
                  <YAxis fontSize={9} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
                  <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '10px', border: 'none', backgroundColor: isDarkMode ? '#262014' : 'white', fontFamily: 'Cairo', fontSize: '12px' }} />
                  <Bar dataKey="دخل" fill="#059669" radius={[4, 4, 0, 0]} barSize={10} />
                  <Bar dataKey="مصروف" fill="#DC2626" radius={[4, 4, 0, 0]} barSize={10} />
                </BarChart>
              </ResponsiveContainer>
            )}
          </div>
        </div>
        <div className="card">
          <h3 className="font-bold text-xs mb-3 flex items-center gap-2">
            <PieChartIcon className="text-purple-500" size={14} /> توزيع مصروفات {selectedMonth}
          </h3>
          <div className="h-48">
            {pieData.length === 0 ? (
              <div className="h-full flex items-center justify-center font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد مصروفات</div>
            ) : (
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={pieData} cx="50%" cy="50%" innerRadius={50} outerRadius={80} paddingAngle={3} dataKey="value" cornerRadius={4}>
                    {pieData.map((e, i) => <Cell key={i} fill={CATEGORY_COLORS[e.name] || '#94A3B8'} stroke="none" />)}
                  </Pie>
                  <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '10px', border: 'none', backgroundColor: isDarkMode ? '#262014' : 'white', fontFamily: 'Cairo', fontSize: '12px' }} />
                  <Legend layout="vertical" verticalAlign="middle" align="right" iconType="circle" wrapperStyle={{ fontSize: '10px', fontWeight: 'bold' }} />
                </PieChart>
              </ResponsiveContainer>
            )}
          </div>
        </div>
      </div>
    </div>
  );
});

/* ─────────────── Category Detail Modal ─────────────── */
const CategoryDetailModal = memo(({ category, transactions, selectedMonth, selectedYear, dispatch, addNotification }) => {
  const [filterType, setFilterType] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');
  const [exporting, setExporting] = useState(false);
  const containerRef = useRef(null);
  
  const categoryTx = useMemo(() => transactions.filter(t => 
    t.category === category && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)), [transactions, category, selectedMonth, selectedYear]);
  
  const filteredTx = useMemo(() => {
    let arr = categoryTx;
    if (filterType === 'paid') arr = arr.filter(t => t.status === 'paid');
    if (filterType === 'pending') arr = arr.filter(t => t.status !== 'paid');
    if (searchTerm.trim()) { 
      const term = normalizeText(searchTerm); 
      arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.method).includes(term)); 
    }
    return arr;
  }, [categoryTx, filterType, searchTerm]);
  
  const stats = useMemo(() => {
    const paid = categoryTx.filter(t => t.status === 'paid');
    const pending = categoryTx.filter(t => t.status !== 'paid');
    const totalPaid = paid.reduce((s, t) => s + safeNumber(t.amount), 0);
    const totalPending = pending.reduce((s, t) => s + safeNumber(t.amount), 0);
    const count = categoryTx.length;
    const average = count > 0 ? (totalPaid + totalPending) / count : 0;
    const methods = {};
    categoryTx.forEach(t => { methods[t.method] = (methods[t.method] || 0) + safeNumber(t.amount); });
    return { totalPaid, totalPending, total: totalPaid + totalPending, count, paidCount: paid.length, pendingCount: pending.length, average, methods };
  }, [categoryTx]);
  
  const dailyGroups = useMemo(() => groupTransactionsByDate(filteredTx), [filteredTx]);

  const handlePrint = () => {
    if (!containerRef.current) return;
    const printWindow = window.open('', '_blank', 'width=900,height=700');
    if (!printWindow) { 
      addNotification({ type: 'error', title: 'المتصفح منع الطباعة', message: 'اسمح بالنوافذ المنبثقة' }); 
      return; 
    }
    const html = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>${category} — ${selectedMonth} ${selectedYear}</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><style>* { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: 'Cairo', sans-serif; padding: 24px; color: #1f2937; background: white; } .header { text-align: center; padding-bottom: 16px; border-bottom: 3px solid #2563EB; margin-bottom: 20px; } .header h1 { font-size: 22px; font-weight: 900; color: #1E40AF; margin-bottom: 4px; } .header p { font-size: 13px; color: #6b7280; font-weight: 600; } .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; } .stat-box { background: #f3f4f6; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #e5e7eb; } .stat-box .label { font-size: 11px; font-weight: 700; color: #6b7280; margin-bottom: 4px; } .stat-box .value { font-size: 16px; font-weight: 900; color: #1f2937; } .stat-box.green .value { color: #059669; } .stat-box.amber .value { color: #d97706; } table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; } th { background: #2563EB; color: white; padding: 10px 8px; text-align: right; font-weight: 700; } td { padding: 8px; border-bottom: 1px solid #e5e7eb; } tr:nth-child(even) td { background: #f9fafb; } td.amount-income { color: #059669; font-weight: 900; } td.amount-expense { color: #dc2626; font-weight: 900; } td.status-paid { color: #059669; font-weight: 700; font-size: 10px; } td.status-pending { color: #d97706; font-weight: 700; font-size: 10px; } .footer { margin-top: 30px; padding-top: 12px; border-top: 2px dashed #d1d5db; text-align: center; font-size: 10px; color: #9ca3af; } .day-header-row td { background: #dbeafe !important; font-weight: 900; color: #1E40AF; font-size: 11px; padding: 6px 8px; }</style></head><body><div class="header"><h1>📊 ${escapeHtml(category)}</h1><p>${selectedMonth} ${selectedYear} • تم التوليد: ${new Date().toLocaleString('ar-EG')}</p></div><div class="stats"><div class="stat-box green"><div class="label">الإجمالي (معتمد)</div><div class="value">${fmt(stats.totalPaid)} ج.م</div></div><div class="stat-box amber"><div class="label">معلق</div><div class="value">${fmt(stats.totalPending)} ج.م</div></div><div class="stat-box"><div class="label">عدد المعاملات</div><div class="value">${stats.count}</div></div><div class="stat-box"><div class="label">المتوسط</div><div class="value">${fmt(stats.average)} ج.م</div></div></div><table><thead><tr><th>التاريخ</th><th>الوصف</th><th>طريقة الدفع</th><th>الحالة</th><th style="text-align: left;">المبلغ</th></tr></thead><tbody>${dailyGroups.map(group => `<tr class="day-header-row"><td colspan="5">${escapeHtml(group.label)} — ${fmt(group.total)} ج.م (${group.items.length})</td></tr>${group.items.map(t => `<tr><td>${escapeHtml(t.date)}</td><td>${escapeHtml(t.description || t.category || '')}</td><td>${escapeHtml(PAYMENT_METHODS.find(p => p.id === t.method)?.label || t.method || '—')}</td><td class="${t.status === 'paid' ? 'status-paid' : 'status-pending'}">${t.status === 'paid' ? '✅ معتمد' : '⏳ معلق'}</td><td class="amount-${t.type === 'income' ? 'income' : 'expense'}" style="text-align: left;">${t.type === 'income' ? '+' : '−'}${fmt(t.amount)}</td></tr>`).join('')}`).join('')}</tbody></table><div class="footer">💼 المحفظة الذكية — تقرير تفصيلي لفئة ${escapeHtml(category)} • إجمالي: ${fmt(stats.total)} ج.م</div><script>window.onload = () => { setTimeout(() => { window.print(); }, 300); };<\/script></body></html>`;
    printWindow.document.write(html);
    printWindow.document.close();
  };

  const handleExportPdf = async () => {
    if (!containerRef.current || exporting) return;
    if (categoryTx.length === 0) { 
      addNotification({ type: 'warning', title: 'لا توجد معاملات للتصدير' }); 
      return; 
    }
    setExporting(true);
    try {
      const element = containerRef.current.cloneNode(true);
      element.querySelectorAll('[data-pdf-hide="true"]').forEach(el => el.remove());
      element.querySelectorAll('.scroll-hide, .pdf-expand').forEach(el => { 
        el.style.maxHeight = 'none'; 
        el.style.overflow = 'visible'; 
      });
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'background:white;padding:20px;font-family:Cairo,sans-serif;direction:rtl;';
      wrapper.innerHTML = `<div style="text-align:center;padding-bottom:12px;border-bottom:3px solid #2563EB;margin-bottom:16px;"><h1 style="font-size:20px;font-weight:900;color:#1E40AF;margin:0 0 4px;">📊 ${escapeHtml(category)}</h1><p style="font-size:12px;color:#6b7280;font-weight:600;margin:0;">${selectedMonth} ${selectedYear} • ${new Date().toLocaleDateString('ar-EG')}</p></div>`;
      wrapper.appendChild(element);
      const opt = { 
        margin: [10, 8, 10, 8], 
        filename: `فئة_${category.replace(/[\/\\:*?"<>|]/g, '_')}_${selectedMonth}_${selectedYear}.pdf`, 
        image: { type: 'jpeg', quality: 0.95 }, 
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false }, 
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, 
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } 
      };
      await window.html2pdf().set(opt).from(wrapper).save();
      addNotification({ type: 'success', title: 'تم تصدير PDF', message: `${filteredTx.length} معاملة` });
    } catch (e) { 
      console.error('PDF Error:', e); 
      addNotification({ type: 'error', title: 'فشل التصدير', message: e.message }); 
    }
    finally { setExporting(false); }
  };

  const close = () => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: null });

  return (
    <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) close(); }}>
      <div className="generic-modal max-w-3xl">
        <div className="generic-modal-header">
          <div className="flex items-center gap-2 min-w-0">
            <div className="p-2 rounded-lg flex-shrink-0" style={{ background: `${CATEGORY_COLORS[category] || '#2563EB'}20`, color: CATEGORY_COLORS[category] || '#2563EB' }}>
              <Layers size={18} />
            </div>
            <div className="min-w-0">
              <h3 className="text-base font-black truncate">{category}</h3>
              <p className="text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} • {stats.count} معاملة</p>
            </div>
          </div>
          <button onClick={close} className="btn btn-ghost p-1.5"><X size={16} /></button>
        </div>
        <div className="generic-modal-body" ref={containerRef}>
          <div className="grid grid-cols-4 gap-2 mb-4">
            <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
              <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">معتمد</p>
              <p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(stats.totalPaid)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-center">
              <p className="text-[10px] font-bold text-amber-700 dark:text-amber-400">معلق</p>
              <p className="text-sm font-black text-amber-600 mt-0.5">{fmt(stats.totalPending)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
              <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">العدد</p>
              <p className="text-sm font-black text-blue-600 mt-0.5">{stats.count}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-center">
              <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">المتوسط</p>
              <p className="text-sm font-black text-purple-600 mt-0.5">{fmt(stats.average)}</p>
            </div>
          </div>
          
          <div className="flex gap-1.5 flex-wrap mb-3" data-pdf-hide="true">
            <div className="relative flex-1 min-w-[140px]">
              <Search className="absolute right-2.5 top-1/2 -translate-y-1/2" size={12} style={{ color: 'var(--text-muted)' }} />
              <input type="text" placeholder="ابحث..." className="input-field pr-8 text-[11px] py-2" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
            </div>
            <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <button 
                type="button" 
                onClick={() => setFilterType('all')} 
                className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'all' ? 'shadow-sm' : ''}`} 
                style={filterType === 'all' ? { background: 'var(--bg-card)', color: 'var(--brand)' } : { color: 'var(--text-muted)' }}
              >الكل ({categoryTx.length})</button>
              <button 
                type="button" 
                onClick={() => setFilterType('paid')} 
                className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'paid' ? 'shadow-sm' : ''}`} 
                style={filterType === 'paid' ? { background: 'var(--bg-card)', color: 'var(--success)' } : { color: 'var(--text-muted)' }}
              >معتمد ({stats.paidCount})</button>
              <button 
                type="button" 
                onClick={() => setFilterType('pending')} 
                className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'pending' ? 'shadow-sm' : ''}`} 
                style={filterType === 'pending' ? { background: 'var(--bg-card)', color: 'var(--warning)' } : { color: 'var(--text-muted)' }}
              >معلق ({stats.pendingCount})</button>
            </div>
            <button type="button" onClick={handlePrint} disabled={filteredTx.length === 0} className="btn btn-secondary text-[10px] py-2 px-2.5">
              <Printer size={11} /><span className="hidden sm:inline">طباعة</span>
            </button>
            <button type="button" onClick={handleExportPdf} disabled={exporting || filteredTx.length === 0} className="btn btn-primary text-[10px] py-2 px-2.5">
              {exporting ? <RefreshCcw size={11} className="animate-spin" /> : <Download size={11} />}
              <span className="hidden sm:inline">PDF</span>
            </button>
          </div>
          
          {Object.keys(stats.methods).length > 0 && (
            <div className="p-2.5 rounded-lg mb-3" style={{ background: 'var(--bg-muted)' }}>
              <p className="text-[10px] font-bold mb-1.5" style={{ color: 'var(--text-secondary)' }}>💳 التوزيع:</p>
              <div className="flex flex-wrap gap-1.5">
                {Object.entries(stats.methods).sort((a, b) => b[1] - a[1]).map(([method, total]) => (
                  <span key={method} className="badge badge-neutral text-[9px]">
                    {PAYMENT_METHODS.find(p => p.id === method)?.label || method}: <strong className="mr-1">{fmt(total)}</strong>
                  </span>
                ))}
              </div>
            </div>
          )}
          
          {filteredTx.length === 0 ? (
            <div className="text-center py-8">
              <Layers size={32} className="mx-auto mb-2" style={{ color: 'var(--text-muted)' }} />
              <p className="font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد نتائج</p>
            </div>
          ) : (
            <div className="space-y-2 max-h-[50vh] overflow-y-auto scroll-hide pdf-expand">
              {dailyGroups.map(group => (
                <div key={group.date}>
                  <DayGroupHeader label={group.label} total={group.total} count={group.items.length} />
                  <div className="space-y-1.5">
                    {group.items.map(t => (
                      <div key={t.id} className="flex justify-between items-center gap-2 p-2.5 rounded-lg" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                        <div className="min-w-0 flex-1">
                          <p className="font-bold text-xs truncate">
                            {t.description || t.category} <FamilyBadge tx={t} /> <SmsBadge tx={t} /> <TeldaBadge tx={t} /> <TransferBadge tx={t} /> <RecurringBadge tx={t} /> <CarryoverBadge tx={t} />
                          </p>
                          <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
                            {PAYMENT_METHODS.find(p => p.id === t.method)?.label || t.method || '—'}
                            {t.status === 'paid' ? <span className="text-emerald-600 mr-2">✅ معتمد</span> : <span className="text-amber-600 mr-2">⏳ معلق</span>}
                          </p>
                        </div>
                        <span className={`font-black text-xs flex-shrink-0 ${t.type === 'income' ? 'text-emerald-600' : 'text-red-600'}`}>
                          {t.type === 'income' ? '+' : '−'}{fmt(t.amount)}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
          
          {filteredTx.length > 0 && (
            <div className="mt-3 p-3 rounded-lg bg-gradient-to-br from-blue-600 to-blue-800 text-white flex justify-between items-center">
              <span className="font-black text-sm">الإجمالي (المعروض)</span>
              <span className="text-xl font-black">{fmt(filteredTx.reduce((s, t) => s + safeNumber(t.amount), 0))} ج.م</span>
            </div>
          )}
        </div>
        <div className="generic-modal-footer" data-pdf-hide="true">
          <button onClick={close} className="btn btn-secondary flex-1 text-sm">إغلاق</button>
        </div>
      </div>
    </div>
  );
});

/* ─────────────── Categories View ─────────────── */
const CategoriesView = memo(({ 
  transactions, selectedMonth, selectedYear, catViewType, budgets, 
  dispatch, handleDelete, onSelectYear, onSelectMonth 
}) => {
  const catTotals = useMemo(() => transactions.filter(t => 
    t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).reduce((acc, t) => { 
    acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); 
    return acc; 
  }, {}), [transactions, catViewType, selectedMonth, selectedYear]);
  
  const catCounts = useMemo(() => transactions.filter(t => 
    t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).reduce((acc, t) => { 
    acc[t.category] = (acc[t.category] || 0) + 1; 
    return acc; 
  }, {}), [transactions, catViewType, selectedMonth, selectedYear]);

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card flex justify-between items-center gap-2 flex-wrap">
        <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
          <button 
            type="button" 
            onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'expense' })} 
            className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'expense' ? 'shadow-sm text-red-600 dark:text-red-400' : ''}`} 
            style={catViewType === 'expense' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}
          >مصروفات</button>
          <button 
            type="button" 
            onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'income' })} 
            className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'income' ? 'shadow-sm text-emerald-600 dark:text-emerald-400' : ''}`} 
            style={catViewType === 'income' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}
          >إيرادات</button>
        </div>
        <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>💡 اضغط على الفئة لعرض التفاصيل</p>
      </div>
      
      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />
      
      <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
        {CATEGORIES[catViewType].map(cat => {
          const spent = catTotals[cat] || 0;
          const budget = budgets[cat] || 0;
          const overBudget = budget > 0 && spent > budget;
          const count = catCounts[cat] || 0;
          if (spent === 0 && budget === 0) return null;
          return (
            <div 
              key={cat} 
              className="card p-3 cursor-pointer active:scale-[0.98]" 
              onClick={() => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: cat })}
            >
              <div className="flex justify-between mb-2">
                <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: CATEGORY_COLORS[cat] }}>
                  <Layers size={14} />
                </div>
                <button 
                  type="button" 
                  aria-label="ميزانية" 
                  onClick={(e) => { 
                    e.stopPropagation(); 
                    dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: cat }); 
                    dispatch({ type: 'SET_BUDGET_AMOUNT', payload: budgets[cat] || '' }); 
                  }} 
                  className="btn btn-ghost p-1"
                ><SettingsIcon size={12} /></button>
              </div>
              <h3 className="font-bold text-[11px] mb-1 truncate">{cat}</h3>
              <p className="text-base font-black tracking-tight">
                {fmt(spent)}
                <span className="text-[9px] font-semibold mr-1" style={{ color: 'var(--text-muted)' }}>ج.م</span>
              </p>
              {count > 0 && <p className="text-[9px] font-bold mt-0.5" style={{ color: 'var(--text-muted)' }}>📋 {count} معاملة</p>}
              {catViewType === 'expense' && budget > 0 && (
                <div className="mt-2 pt-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
                  <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                    <div 
                      style={{ width: `${Math.min(100, (spent / budget) * 100)}%` }} 
                      className={`h-full ${overBudget ? 'bg-red-500' : 'bg-emerald-500'}`}
                    ></div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
});

/* ─────────────── Transactions View ─────────────── */
const TransactionsView = memo(({ 
  groupedTransactions, transactions, selectedMonth, selectedYear, transViewMode, 
  statusFilter, searchTerm, expandedGroup, data, monthInsights, dispatch, 
  handleDelete, addNotification, onSelectYear, onSelectMonth, saveHistory, onBulkDelete 
}) => {
  const [sourceFilter, setSourceFilter] = useState('all');
  const [showFilters, setShowFilters] = useState(false);
  const [showBankFeesOnly, setShowBankFeesOnly] = useState(false);
  const [showSmsOnly, setShowSmsOnly] = useState(false);
  const [showBeneficiariesOnly, setShowBeneficiariesOnly] = useState(false);
  const [selectMode, setSelectMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState(new Set());

  const pendingDeleteIds = useMemo(() => {
    const set = new Set();
    (data?.deleteRequests || []).forEach(r => {
      if (r && r.status === 'pending' && r.txId) set.add(r.txId);
    });
    return set;
  }, [data?.deleteRequests]);

  const filterBySource = useCallback((list) => { 
    if (sourceFilter === 'all') return list; 
    if (sourceFilter === 'self') return list.filter(t => !isFamilyTx(t)); 
    return list.filter(t => t.createdBy === sourceFilter); 
  }, [sourceFilter]);
  
  const filterByBankFees = useCallback((list) => showBankFeesOnly ? list.filter(t => isBankFee(t)) : list, [showBankFeesOnly]);
  const filterBySms = useCallback((list) => showSmsOnly ? list.filter(t => t.source === 'sms') : list, [showSmsOnly]);
  const filterByBeneficiaries = useCallback((list) => showBeneficiariesOnly ? list.filter(t => isBeneficiaryCategorySafe(t.category)) : list, [showBeneficiariesOnly]);
  const filterByType = useCallback((list) => transViewMode === 'all' ? list : list.filter(t => t.type === transViewMode), [transViewMode]);
  
  const pendingGroups = useMemo(() => groupedTransactions.map(g => ({ 
    ...g, 
    items: filterByBeneficiaries(filterBySms(filterByBankFees(filterBySource(g.items.filter(t => t.status !== 'paid'))))) 
  })).filter(g => g.items.length > 0), [groupedTransactions, filterBySource, filterByBankFees, filterBySms, filterByBeneficiaries]);
  
  const paidArchive = useMemo(() => filterByBeneficiaries(filterBySms(filterByBankFees(filterBySource(filterByType(transactions.filter(t => 
    t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status === 'paid'
  )))))).sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)), [transactions, selectedMonth, selectedYear, filterByType, filterBySource, filterByBankFees, filterBySms, filterByBeneficiaries]);
  
  const totalPending = pendingGroups.reduce((s, g) => s + g.items.length, 0);
  const isClosed = isMonthClosed(data, selectedYear, selectedMonth);

  const toggleSelect = useCallback((id) => {
    setSelectedIds(prev => { 
      const next = new Set(prev); 
      if (next.has(id)) next.delete(id); 
      else next.add(id); 
      return next; 
    });
  }, []);

  const toggleSelectAll = useCallback(() => {
    const allIds = [...pendingGroups.flatMap(g => g.items.map(i => i.id)), ...paidArchive.map(t => t.id)];
    setSelectedIds(prev => prev.size === allIds.length ? new Set() : new Set(allIds));
  }, [pendingGroups, paidArchive]);

  const exitSelectMode = useCallback(() => { 
    setSelectMode(false); 
    setSelectedIds(new Set()); 
  }, []);

  const handleBulkDelete = useCallback(() => {
    const ids = [...selectedIds];
    if (ids.length === 0) { 
      addNotification({ type: 'info', title: 'لم تحدد أي معاملة' }); 
      return; 
    }
    const blocked = [];
    const allowed = [];
    ids.forEach(id => {
      const t = transactions.find(x => x.id === id);
      if (!t) return;
      if (isMonthClosed(data, t.year || 2026, t.month)) blocked.push(t);
      else allowed.push(t);
    });
    if (allowed.length === 0) { 
      addNotification({ type: 'error', title: 'محظور', message: 'كل المعاملات المحددة في شهور مغلقة' }); 
      return; 
    }
    const message = blocked.length > 0 
      ? `سيتم حذف ${allowed.length} معاملة.\n⚠️ سيتم تجاهل ${blocked.length} معاملة في شهور مغلقة.` 
      : `سيتم نقل ${allowed.length} معاملة للأرشيف.`;
    dispatch({ 
      type: 'SHOW_CONFIRM', 
      danger: true, 
      title: `حذف ${allowed.length} معاملة`, 
      message, 
      onConfirm: () => { 
        if (onBulkDelete) onBulkDelete(allowed.map(t => t.id)); 
        exitSelectMode(); 
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  }, [selectedIds, transactions, data, addNotification, dispatch, exitSelectMode, onBulkDelete]);

  const approveOne = (t) => { 
    if (isMonthClosed(data, t.year || 2026, t.month)) { 
      addNotification({ type: 'error', title: 'محظور' }); 
      return; 
    } 
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(tr => tr.id === t.id ? { ...tr, status: 'paid' } : tr) }); 
    addNotification({ type: 'success', title: 'تم الاعتماد' }); 
  };
  
  const approveAll = () => { 
    if (isClosed) { 
      addNotification({ type: 'error', title: 'محظور' }); 
      return; 
    } 
    dispatch({ 
      type: 'SHOW_CONFIRM', 
      danger: false, 
      title: 'اعتماد الكل', 
      message: `سيتم اعتماد ${totalPending} عملية`, 
      onConfirm: () => { 
        saveHistory(); 
        const ids = new Set(pendingGroups.flatMap(g => g.items.map(i => i.id))); 
        dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t) }); 
        addNotification({ type: 'success', title: 'تم الاعتماد' }); 
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    }); 
  };
  
  const reopenOne = (t) => { 
    if (isMonthClosed(data, t.year || 2026, t.month)) { 
      addNotification({ type: 'error', title: 'محظور' }); 
      return; 
    } 
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(tr => tr.id === t.id ? { ...tr, status: 'pending' } : tr) }); 
    addNotification({ type: 'warning', title: 'إعادة تعليق' }); 
  };
  
  const monthTx = useMemo(() => transactions.filter(t => 
    t.month === selectedMonth && (t.year || 2026) === selectedYear
  ), [transactions, selectedMonth, selectedYear]);
  
  const activeFiltersCount = (sourceFilter !== 'all' ? 1 : 0) + (statusFilter !== 'all' ? 1 : 0) + 
    (showBankFeesOnly ? 1 : 0) + (showSmsOnly ? 1 : 0) + (showBeneficiariesOnly ? 1 : 0);
  
  const dailyGroups = useMemo(() => groupTransactionsByDate(paidArchive), [paidArchive]);

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-center flex-wrap gap-2 mb-3">
          <div>
            <h2 className="text-lg font-black">
              {transViewMode === 'expense' ? 'المصروفات' : transViewMode === 'income' ? 'الإيرادات' : 'كل المعاملات'}
            </h2>
            <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} • {monthTx.length} معاملة</p>
          </div>
          <div className="flex gap-1.5 flex-wrap">
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'all' })} className={`btn ${transViewMode === 'all' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>الكل</button>
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'expense' })} className={`btn ${transViewMode === 'expense' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>مصروفات</button>
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'income' })} className={`btn ${transViewMode === 'income' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>إيرادات</button>
          </div>
        </div>

        {selectMode ? (
          <div className="p-3 rounded-lg mb-3 flex flex-wrap items-center gap-2" style={{ background: 'var(--brand-soft)', border: '1px solid var(--brand)' }}>
            <div className="flex-1 min-w-[180px]">
              <p className="text-xs font-black text-blue-700 dark:text-blue-300">🔘 وضع التحديد المتعدد</p>
              <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>تم تحديد <strong>{selectedIds.size}</strong> معاملة</p>
            </div>
            <button onClick={toggleSelectAll} className="btn btn-secondary text-[11px] py-1.5 px-2.5">
              {selectedIds.size === (pendingGroups.flatMap(g => g.items).length + paidArchive.length) ? 'إلغاء الكل' : 'تحديد الكل'}
            </button>
            <button onClick={handleBulkDelete} disabled={selectedIds.size === 0} className={`btn ${selectedIds.size === 0 ? 'btn-secondary' : 'btn-primary'} text-[11px] py-1.5 px-2.5`}>
              <Trash2 size={12} /> حذف المحدد ({selectedIds.size})
            </button>
            <button onClick={exitSelectMode} className="btn btn-ghost text-[11px] py-1.5 px-2.5">خروج</button>
          </div>
        ) : (
          <div className="flex gap-1.5 mb-3">
            <button onClick={() => setSelectMode(true)} className="btn btn-secondary text-[11px] py-1.5 px-2.5">
              <CheckCircle2 size={12} /> تحديد متعدد
            </button>
          </div>
        )}

        <div className="grid grid-cols-3 gap-2">
          <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30">
            <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">محصل</p>
            <p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(monthInsights.inc)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30">
            <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مدفوع</p>
            <p className="text-sm font-black text-red-600 mt-0.5">{fmt(monthInsights.exp)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الصافي</p>
            <p className={`text-sm font-black mt-0.5 ${monthInsights.net >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(monthInsights.net)}</p>
          </div>
        </div>
        
        <div className="flex gap-1.5 mt-3 flex-wrap">
          <button onClick={() => setShowBankFeesOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showBankFeesOnly ? 'btn-primary' : 'btn-secondary'}`}>
            <Receipt size={12} /> رسوم بنكية
          </button>
          <button onClick={() => setShowSmsOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showSmsOnly ? 'btn-primary' : 'btn-secondary'}`}>
            <MessageSquare size={12} /> SMS
          </button>
          <button onClick={() => setShowBeneficiariesOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showBeneficiariesOnly ? 'btn-primary' : 'btn-secondary'}`}>👨‍👩‍👧 مصاريف شهرية</button>
          {isClosed ? (
            <React.Fragment>
              <div className="badge badge-success px-2 py-1 text-[10px]"><ShieldCheck size={10} /> مغلق</div>
              <button 
                onClick={() => dispatch({ 
                  type: 'SHOW_CONFIRM', 
                  danger: false, 
                  title: 'إعادة فتح', 
                  message: 'سيتم إلغاء القفل.', 
                  onConfirm: () => { 
                    saveHistory(); 
                    dispatch({ type: 'OPEN_MONTH', payload: makeMonthKey(selectedYear, selectedMonth) }); 
                    addNotification({ type: 'success', title: 'تم إعادة الفتح' }); 
                  }, 
                  onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
                })} 
                className="btn btn-secondary text-[11px] px-2.5 py-1.5"
              ><Unlock size={12} /> فتح</button>
            </React.Fragment>
          ) : (
            <button 
              onClick={() => {
                const pending = monthTx.filter(t => t.status !== 'paid');
                if (pending.length > 0) { 
                  dispatch({ 
                    type: 'SET_PENDING_CLOSE_MODAL', 
                    payload: { 
                      isOpen: true, 
                      pending, 
                      total: pending.reduce((s, t) => s + safeNumber(t.amount), 0), 
                      month: selectedMonth, 
                      year: selectedYear 
                    } 
                  }); 
                }
                else { 
                  dispatch({ 
                    type: 'SHOW_CONFIRM', 
                    danger: false, 
                    title: 'إقفال الشهر', 
                    message: 'سيتم تثبيت الأرصدة.', 
                    onConfirm: () => { 
                      saveHistory(); 
                      dispatch({ type: 'CLOSE_MONTH', payload: { year: selectedYear, month: selectedMonth } }); 
                      addNotification({ type: 'success', title: 'تم الإقفال' }); 
                    }, 
                    onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
                  }); 
                }
              }} 
              className="btn btn-secondary text-[11px] px-2.5 py-1.5"
            ><Lock size={12} /> إقفال</button>
          )}
        </div>
      </div>
      
      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />
      
      <div className="card py-3">
        <div className="flex gap-2">
          <div className="relative flex-1">
            <Search className="absolute right-3 top-1/2 -translate-y-1/2" size={14} style={{ color: 'var(--text-muted)' }} />
            <input 
              type="text" 
              placeholder="ابحث..." 
              className="input-field pr-9 text-sm py-2.5" 
              value={searchTerm} 
              onChange={(e) => dispatch({ type: 'SET_SEARCH_TERM', payload: e.target.value })} 
            />
          </div>
          <button onClick={() => setShowFilters(!showFilters)} className={`btn ${showFilters ? 'btn-primary' : 'btn-secondary'} px-3 py-2.5 relative`}>
            <Filter size={14} />
            {activeFiltersCount > 0 && (
              <span className="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 text-white text-[9px] rounded-full flex items-center justify-center font-black">
                {activeFiltersCount}
              </span>
            )}
          </button>
        </div>
        {showFilters && (
          <div className="mt-3 pt-3 space-y-3 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            <div className="flex gap-2 flex-wrap">
              {[['all', 'الكل'], ['self', '👤 أنا'], ['ans', 'أنس'], ['abdelrahman', 'عبد الرحمن'], ['salma', 'سلمى'], ['om_abdo', 'أم عبده']].map(([id, label]) => (
                <button 
                  key={id} 
                  type="button" 
                  onClick={() => setSourceFilter(id)} 
                  className={`badge px-2.5 py-1 cursor-pointer text-[10px] ${sourceFilter === id ? 'badge-brand' : 'badge-neutral'}`}
                >{label}</button>
              ))}
            </div>
            <div className="flex gap-2 flex-wrap">
              {[['all', 'الكل'], ['pending', '⏳ معلق'], ['paid', '✅ مدفوع']].map(([id, label]) => (
                <button 
                  key={id} 
                  type="button" 
                  onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: id })} 
                  className={`badge px-2.5 py-1 cursor-pointer text-[10px] ${statusFilter === id ? 'badge-brand' : 'badge-neutral'}`}
                >{label}</button>
              ))}
            </div>
          </div>
        )}
      </div>
      
      <section>
        <div className="flex justify-between items-center mb-2 flex-wrap gap-2">
          <h3 className="font-black flex items-center gap-2 text-sm">
            <Clock className="text-amber-500" size={14} /> الالتزامات
            {totalPending > 0 && <span className="badge badge-warning text-[10px]">{totalPending}</span>}
          </h3>
          {totalPending > 0 && (
            <button onClick={approveAll} className="btn btn-primary text-[11px] px-2.5 py-1.5">
              <CheckCircle2 size={12} /> اعتماد الكل
            </button>
          )}
        </div>
        {pendingGroups.length === 0 ? (
          <div className="card text-center p-6">
            <CheckCircle2 size={24} className="text-emerald-500 mx-auto mb-2" />
            <p className="font-semibold text-xs" style={{ color: 'var(--text-secondary)' }}>لا توجد التزامات</p>
          </div>
        ) : (
          <div className="space-y-2">
            {pendingGroups.map(g => {
              const isExpanded = expandedGroup === g.category;
              return (
                <div key={g.category} className="card p-0 overflow-hidden">
                  <div 
                    className="flex justify-between items-center p-3 cursor-pointer" 
                    onClick={() => dispatch({ type: 'SET_EXPANDED_GROUP', payload: isExpanded ? null : g.category })}
                  >
                    <div className="flex items-center gap-2 min-w-0 flex-1">
                      <span className="p-1.5 rounded-lg flex-shrink-0" style={{ backgroundColor: `${CATEGORY_COLORS[g.category]}20`, color: CATEGORY_COLORS[g.category] }}>
                        <Layers size={14} />
                      </span>
                      <div className="min-w-0">
                        <h4 className="font-bold text-xs truncate">{g.category}</h4>
                        <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{g.items.length} عملية</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <span className="font-black text-sm">{fmt(g.items.reduce((s, i) => s + safeNumber(i.amount), 0))}</span>
                      <ChevronDown size={14} className={`transition-transform ${isExpanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
                    </div>
                  </div>
                  {isExpanded && (
                    <div className="divide-y" style={{ borderTop: '1px solid var(--border-subtle)', borderColor: 'var(--border-subtle)' }}>
                      {g.items.map(t => (
                        <div key={t.id} className={`p-3 flex justify-between items-center gap-2 ${selectedIds.has(t.id) ? 'bg-blue-50 dark:bg-blue-950/20' : ''}`}>
                          {selectMode && (
                            <input type="checkbox" checked={selectedIds.has(t.id)} onChange={() => toggleSelect(t.id)} className="w-4 h-4 accent-blue-600 flex-shrink-0" />
                          )}
                          <button aria-label="اعتماد" onClick={() => approveOne(t)} className="flex flex-col items-center px-1.5 py-1 rounded-lg hover:bg-[color:var(--bg-muted)] active:scale-90 flex-shrink-0">
                            <Clock className="text-amber-500" size={16} />
                          </button>
                          <div className="flex-1 min-w-0">
                            <p className="font-bold text-xs truncate">
                              {t.description || 'بدون وصف'}{' '}
                              {pendingDeleteIds.has(t.id) && <span className="badge badge-warning text-[9px] mr-1">🗑️ طلب مسح</span>}{' '}
                              <FamilyBadge tx={t} /> <SmsBadge tx={t} /> <TeldaBadge tx={t} /> <TransferBadge tx={t} /> <RecurringBadge tx={t} /> <CarryoverBadge tx={t} /> <ReceiptIndicator tx={t} dispatch={dispatch} />
                            </p>
                            <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>{t.date} • {PAYMENT_METHODS.find(p => p.id === t.method)?.label}</p>
                          </div>
                          <div className="flex items-center gap-1 flex-shrink-0">
                            <span className="font-black text-xs">{fmt(t.amount)}</span>
                            {!selectMode && (
                              <React.Fragment>
                                <button 
                                  type="button" 
                                  aria-label="تعديل" 
                                  onClick={() => { 
                                    dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); 
                                    dispatch({ type: 'SET_FORM_DATA', payload: t }); 
                                    dispatch({ type: 'SET_FORM_OPEN', payload: true }); 
                                  }} 
                                  className="btn btn-ghost p-1"
                                ><Edit size={12} /></button>
                                <button type="button" aria-label="حذف" onClick={() => handleDelete(t.id)} className="btn btn-ghost p-1 text-red-500">
                                  <Trash2 size={12} />
                                </button>
                              </React.Fragment>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </section>
      
      {dailyGroups.length > 0 && (
        <details className="group" open>
          <summary className="cursor-pointer list-none">
            <div className="card py-3 flex items-center justify-between">
              <h3 className="font-bold text-xs flex items-center gap-2 text-emerald-600">
                <CheckCircle2 size={14} /> سجل المدفوعات ({paidArchive.length})
              </h3>
              <ChevronDown className="transition-transform group-open:rotate-180" size={14} style={{ color: 'var(--text-muted)' }} />
            </div>
          </summary>
          <div className="mt-2">
            {dailyGroups.map(group => (
              <div key={group.date}>
                <DayGroupHeader label={group.label} total={group.total} count={group.items.length} />
                <div className="space-y-2">
                  {group.items.map(t => (
                    <div key={t.id} className={`card py-2.5 flex justify-between items-center gap-2 ${selectedIds.has(t.id) ? 'ring-2 ring-blue-500' : ''}`}>
                      {selectMode && (
                        <input type="checkbox" checked={selectedIds.has(t.id)} onChange={() => toggleSelect(t.id)} className="w-4 h-4 accent-blue-600 flex-shrink-0" />
                      )}
                      <div className="min-w-0 flex-1">
                        <p className="font-bold text-xs truncate">
                          {t.type === 'income' ? '💰' : '💸'} {t.description || t.category}{' '}
                          {pendingDeleteIds.has(t.id) && <span className="badge badge-warning text-[9px] mr-1">🗑️ طلب مسح</span>}{' '}
                          <FamilyBadge tx={t} /> <SmsBadge tx={t} /> <TeldaBadge tx={t} /> <TransferBadge tx={t} /> <RecurringBadge tx={t} /> <CarryoverBadge tx={t} /> <ReceiptIndicator tx={t} dispatch={dispatch} />
                        </p>
                        <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                          {PAYMENT_METHODS.find(p => p.id === t.method)?.label || ''} • {new Date(t.createdAt || Date.now()).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}
                        </p>
                      </div>
                      <div className="flex items-center gap-1 flex-shrink-0">
                        <span className="font-black text-xs">{fmt(t.amount)}</span>
                        {!selectMode && (
                          <button aria-label="إعادة تعليق" onClick={() => reopenOne(t)} className="btn btn-ghost p-1 text-amber-500">
                            <Undo2 size={12} />
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </details>
      )}
    </div>
  );
});
  /* ═══════════════════════════════════════════════════════════════
   PART 5 — Loans + Custody + Cashback + Hany + Cards + Wallets
   + Duplicates + Deleted Archive
   ═══════════════════════════════════════════════════════════════ */

/* ─────────────── Custody View ─────────────── */
const CustodyView = memo(({ data, dispatch, saveHistory, addNotification }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [filterType, setFilterType] = useState('all');
  const [newEntry, setNewEntry] = useState({ 
    type: CUSTODY_TYPE.RECEIVE, 
    amount: '', 
    date: getLocalISODate(), 
    description: '', 
    method: 'cib_savings', 
    relatedCategory: 'عهدة شركة إيماك' 
  });
  
  const custodyEntries = data?.custodyEntries || [];
  const summary = useMemo(() => computeCustodyBalance(custodyEntries), [custodyEntries]);
  
  const filtered = useMemo(() => { 
    const sorted = [...custodyEntries].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)); 
    if (filterType === 'all') return sorted; 
    return sorted.filter(e => e.type === filterType); 
  }, [custodyEntries, filterType]);

  const addEntry = () => {
    const check = validateAmount(newEntry.amount, { min: 0.01, max: 10000000, label: 'المبلغ' });
    if (!check.valid) { 
      addNotification({ type: 'error', title: 'خطأ', message: check.error }); 
      return; 
    }
    const descCheck = validateText(newEntry.description, { min: 2, max: 200, label: 'الوصف' });
    if (!descCheck.valid) { 
      addNotification({ type: 'error', title: 'خطأ', message: descCheck.error }); 
      return; 
    }
    const dateCheck = validateDate(newEntry.date);
    if (!dateCheck.valid) { 
      addNotification({ type: 'error', title: 'خطأ', message: dateCheck.error }); 
      return; 
    }
    const d = dateCheck.value;
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { 
      addNotification({ type: 'error', title: 'شهر مغلق', message: `شهر ${txMonth} ${txYear} مغلق`, duration: 6000 }); 
      return; 
    }
    saveHistory();
    const amount = check.value;
    const entry = { 
      ...newEntry, 
      description: descCheck.value, 
      id: getSafeId(), 
      amount, 
      status: newEntry.type === CUSTODY_TYPE.SETTLE ? 'settled' : 'open' 
    };
    const newEntries = [entry, ...custodyEntries];
    const newTxs = [];
    const baseTx = { date: newEntry.date, month: txMonth, year: txYear, monthIndex: d.getMonth(), status: 'paid' };
    
    if (newEntry.type === CUSTODY_TYPE.RECEIVE)
      newTxs.push({ 
        ...baseTx, id: getSafeId(), type: 'income', kind: KIND.OPERATIONAL, 
        category: newEntry.relatedCategory || 'عهدة شركة إيماك', 
        amount, description: `استلام عهدة: ${newEntry.description}`, 
        method: newEntry.method, subType: 'deposit', linkedCustodyId: entry.id 
      });
    else if (newEntry.type === CUSTODY_TYPE.TRANSFER)
      newTxs.push({ 
        ...baseTx, id: getSafeId(), type: 'income', kind: KIND.FINANCIAL, 
        category: 'تحويلات واردة', amount, 
        description: `تحويل عهدة لحسابي: ${newEntry.description}`, 
        method: newEntry.method, subType: 'deposit', linkedCustodyId: entry.id 
      });
    else if (newEntry.type === CUSTODY_TYPE.SPEND_CASH)
      newTxs.push({ 
        ...baseTx, id: getSafeId(), type: 'expense', kind: KIND.OPERATIONAL, 
        category: newEntry.relatedCategory || 'مصروفات عهدة', amount, 
        description: `صرف عهدة كاش: ${newEntry.description}`, 
        method: newEntry.method, subType: 'withdrawal', linkedCustodyId: entry.id 
      });
    else if (newEntry.type === CUSTODY_TYPE.SPEND_CARD)
      newTxs.push({ 
        ...baseTx, id: getSafeId(), type: 'expense', kind: KIND.OPERATIONAL, 
        category: newEntry.relatedCategory || 'فواتير عهدة', amount, 
        description: `صرف عهدة من بطاقة: ${newEntry.description}`, 
        method: newEntry.method, subType: 'withdrawal', linkedCustodyId: entry.id 
      });
    else if (newEntry.type === CUSTODY_TYPE.SETTLE)
      newTxs.push({ 
        ...baseTx, id: getSafeId(), type: 'expense', kind: KIND.FINANCIAL, 
        category: 'تحويلات', amount, 
        description: `تسوية نهائية للعهدة: ${newEntry.description}`, 
        method: newEntry.method, subType: 'withdrawal', linkedCustodyId: entry.id 
      });
    
    const newData = { 
      ...data, 
      custodyEntries: newEntries, 
      transactions: [...newTxs, ...(data.transactions || [])].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) 
    };
    dispatch({ type: 'SET_DATA', payload: newData });
    setShowAdd(false);
    setNewEntry({ 
      type: CUSTODY_TYPE.RECEIVE, amount: '', date: getLocalISODate(), 
      description: '', method: 'cib_savings', relatedCategory: 'عهدة شركة إيماك' 
    });
    addNotification({ type: 'success', title: 'تم التسجيل', message: `${CUSTODY_TYPE_LABELS[newEntry.type]} — ${fmt(amount)} ج.م` });
  };

  const deleteEntry = (id) => {
    const linkedTxs = (data.transactions || []).filter(t => t.linkedCustodyId === id);
    const blocked = linkedTxs.find(t => isMonthClosed(data, t.year || 2026, t.month));
    if (blocked) {
      addNotification({ type: 'error', title: 'الشهر مغلق', message: `لا يمكن حذف حركة مرتبطة بمعاملات في شهر ${blocked.month} ${blocked.year}`, duration: 6000 });
      return;
    }
    dispatch({ 
      type: 'SHOW_CONFIRM', 
      danger: true, 
      title: 'حذف حركة العهدة', 
      message: 'سيتم حذف الحركة والقيود المرتبطة بها', 
      onConfirm: () => {
        saveHistory();
        const newEntries = custodyEntries.filter(e => e.id !== id);
        const newTxs = (data.transactions || []).filter(t => t.linkedCustodyId !== id);
        dispatch({ type: 'SET_DATA', payload: { ...data, custodyEntries: newEntries, transactions: newTxs } });
        addNotification({ type: 'success', title: 'تم الحذف' });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  };

  const usagePct = summary.received > 0 ? (summary.totalSpent / summary.received) * 100 : 0;

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div className="flex-1 min-w-[180px]">
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>رصيد العهدة الحالي</p>
            <h2 className={`text-3xl font-black tracking-tight ${summary.balance >= 0 ? 'text-blue-600' : 'text-red-600'}`}>
              {fmt(summary.balance)}
              <span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <p className="text-[11px] font-semibold mt-2" style={{ color: 'var(--text-muted)' }}>
              {summary.balance > 0 ? '⚠️ مبلغ متبقي معك' : summary.balance < 0 ? '⚠️ صرفت أكثر من العهدة' : '✅ مسددة بالكامل'}
            </p>
          </div>
          <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs">
            <Plus size={14} /> حركة جديدة
          </button>
        </div>
        <div className="grid grid-cols-4 gap-2 mt-4">
          <div className="p-2.5 rounded-xl bg-blue-50 dark:bg-blue-950/30 text-center">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">مستلم</p>
            <p className="text-sm font-black text-blue-600 mt-0.5">{fmt(summary.received)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-cyan-50 dark:bg-cyan-950/30 text-center">
            <p className="text-[10px] font-bold text-cyan-700 dark:text-cyan-400">محوّل</p>
            <p className="text-sm font-black text-cyan-600 mt-0.5">{fmt(summary.transferred)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-orange-50 dark:bg-orange-950/30 text-center">
            <p className="text-[10px] font-bold text-orange-700 dark:text-orange-400">كاش</p>
            <p className="text-sm font-black text-orange-600 mt-0.5">{fmt(summary.spentCash)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-purple-50 dark:bg-purple-950/30 text-center">
            <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">بطاقة</p>
            <p className="text-sm font-black text-purple-600 mt-0.5">{fmt(summary.spentCard)}</p>
          </div>
        </div>
        <div className="mt-3">
          <div className="flex justify-between text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>
            <span>نسبة الاستهلاك</span>
            <span>{Math.round(usagePct)}%</span>
          </div>
          <div className="w-full rounded-full h-1.5 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
            <div 
              className={`h-full ${usagePct > 90 ? 'bg-red-500' : usagePct > 60 ? 'bg-amber-500' : 'bg-blue-500'}`} 
              style={{ width: `${Math.min(100, usagePct)}%` }}
            ></div>
          </div>
        </div>
      </div>

      <div className="card p-2">
        <div className="flex gap-2 overflow-x-auto scroll-hide">
          {[
            { id: 'all', label: 'الكل' }, 
            { id: CUSTODY_TYPE.RECEIVE, label: 'استلام' }, 
            { id: CUSTODY_TYPE.TRANSFER, label: 'تحويل' }, 
            { id: CUSTODY_TYPE.SPEND_CASH, label: 'صرف كاش' }, 
            { id: CUSTODY_TYPE.SPEND_CARD, label: 'صرف بطاقة' }
          ].map(f => (
            <button 
              key={f.id} 
              onClick={() => setFilterType(f.id)} 
              className={`badge px-3 py-1.5 cursor-pointer whitespace-nowrap ${filterType === f.id ? 'badge-brand' : 'badge-neutral'}`}
            >{f.label}</button>
          ))}
        </div>
      </div>

      {filtered.length === 0 ? (
        <div className="card text-center p-12">
          <Briefcase size={40} className="mx-auto mb-3 text-blue-500" />
          <h3 className="text-base font-black mb-2">لا توجد حركات بعد</h3>
          <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs">
            <Plus size={14} /> إضافة أول حركة
          </button>
        </div>
      ) : (
        <div className="space-y-2">
          {filtered.map(entry => {
            const Icon = CUSTODY_TYPE_ICONS[entry.type] || Briefcase;
            const color = CUSTODY_TYPE_COLORS[entry.type] || '#6B7280';
