                                        <thead className="bg-slate-50/80 dark:bg-slate-800/50 backdrop-blur-sm"><tr><th className="p-6 font-bold text-slate-400 text-xs uppercase tracking-widest">إجراء</th><th className="p-6 font-bold text-slate-400 text-xs uppercase tracking-widest">البند / الفئة</th><th className="p-6 font-bold text-slate-400 text-center uppercase tracking-widest text-xs">العدد</th><th className="p-6 font-bold text-slate-400 text-left uppercase tracking-widest text-xs">المبلغ</th><th className="p-6 text-center font-bold text-slate-400 uppercase tracking-widest text-xs">تعديل</th></tr></thead>
                                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-bold">
                                            {pendingGroups.map(g => {
                                                const isActiveGroupExpanded = expandedGroup === g.category;
                                                
                                                return (
                                                <React.Fragment key={g.category}>
                                                    <tr className="hover:bg-slate-50 dark:hover:bg-slate-800/30 cursor-pointer transition-colors" onClick={() => dispatch({ type: 'SET_EXPANDED_GROUP', payload: isActiveGroupExpanded ? null : g.category })}>
                                                        <td className="p-6 text-center"><div className={`p-2 rounded-full transition-transform ${isActiveGroupExpanded ? 'bg-blue-50 text-blue-500 rotate-180' : 'bg-slate-50 text-slate-400'}`}><ChevronDown size={16} /></div></td>
                                                        <td className="p-6 font-bold flex items-center gap-4 text-slate-700 dark:text-slate-200"><span className="p-3 rounded-2xl shadow-sm" style={{ backgroundColor: `${CATEGORY_COLORS[g.category]}20`, color: CATEGORY_COLORS[g.category] }}><Layers size={20} /></span>{g.category}</td>
                                                        <td className="p-6 text-center text-slate-400">{g.items.length}</td>
                                                        <td className={`p-6 font-black text-left text-lg tracking-tight ${transViewMode === 'income' ? 'text-emerald-500' : 'text-slate-700 dark:text-white'}`}>{isPrivate ? '****' : g.items.reduce((s,i)=>s+Number(i.amount),0).toLocaleString()}</td>
                                                        <td className="p-6 text-center"></td>
                                                    </tr>
                                                    {isActiveGroupExpanded && g.items.map(t => (
                                                        <tr key={t.id} className="bg-slate-50/50 dark:bg-slate-900/30 text-xs animate-fadeIn border-r-4 border-r-blue-500">
                                                            <td className="py-4 text-center">
                                                                <button type="button" onClick={(e) => { 
                                                                    e.stopPropagation(); 
                                                                    const nextStatus = t.status === 'paid' ? 'pending' : 'paid';
                                                                    const newTrans = transactions.map(tr => tr.id === t.id ? { ...tr, status: nextStatus } : tr);
                                                                    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTrans });
                                                                    addNotification({ type: 'success', title: nextStatus === 'paid' ? 'تم تأكيد استلام الدخل ✅' : 'تمت الإعادة للمعلق' });
                                                                }} 
                                                                className="transition-transform active:scale-95 hover:scale-110 no-print"
                                                                title={t.status === 'paid' ? "تعيين كمعلق" : "تعيين كمدفوع"}
                                                                >
                                                                    {t.status === 'paid' ? <CheckCircle2 className="text-emerald-500 w-6 h-6" /> : <Clock className="text-amber-500 w-6 h-6" />}
                                                                </button>
                                                            </td>
                                                            <td className="pr-20 py-4 text-slate-500 font-bold leading-relaxed"><div className="font-bold text-slate-800 dark:text-slate-200 text-base mb-1">{t.description || 'بدون وصف'}</div><div className="flex gap-3 items-center opacity-80"><span className="bg-white dark:bg-slate-800 px-3 py-1 border border-slate-200 dark:border-slate-700 rounded-lg shadow-sm">{t.date}</span><span className="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg font-bold">{PAYMENT_METHODS.find(p=>p.id===t.method)?.label}</span></div></td>
                                                            <td className="py-4 text-center text-slate-400 font-bold">{t.quantity > 1 ? `${t.quantity} × ${t.unitPrice}` : '-'}</td>
                                                            <td className="py-4 font-black text-left text-base dark:text-slate-200">{isPrivate ? '****' : Number(t.amount).toLocaleString()}</td>
                                                            <td className="py-4 text-center"><div className="flex gap-2 justify-center no-print"><button type="button" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="p-2 text-blue-500 hover:bg-blue-50 rounded-lg transition-colors" title="تعديل"><Edit size={16} /></button><button type="button" onClick={() => handleDelete(t.id)} className="p-2 text-red-400 hover:bg-red-50 rounded-lg transition-colors" title="حذف"><Trash2 size={16} /></button></div></td>
                                                        </tr>
                                                    ))}
                                                </React.Fragment>
                                                );
                                            })}
                                            {pendingGroups.length === 0 && (
                                                <tr><td colSpan="5" className="p-8 text-center text-slate-400 font-bold">لا توجد التزامات نشطة في هذا القسم ✅</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div className="block md:hidden space-y-4 p-2 pb-32">
                                {pendingGroups.map(g => (
                                    <div key={g.category} className="space-y-2 animate-fadeIn">
                                        <h4 className="text-[10px] font-black text-slate-400 uppercase pr-2 flex items-center gap-2"><Layers size={12} style={{ color: CATEGORY_COLORS[g.category] }} /> {g.category}</h4>
                                        {g.items.map(t => (
                                            <div key={t.id} className="glass p-4 rounded-2xl flex justify-between items-center active:scale-95 transition-all border border-slate-100 dark:border-slate-800">
                                                <div className="flex items-center gap-3 flex-1">
                                                    <div className={`p-2 rounded-xl ${t.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>
                                                        {t.type === 'income' ? <TrendingUp size={18}/> : <TrendingDown size={18}/>}
                                                    </div>
                                                    <div className="flex-1">
                                                        <p className="font-bold text-sm text-slate-800 dark:text-white leading-tight truncate">{t.description || 'بدون وصف'}</p>
                                                        <p className="text-[9px] text-slate-400 font-bold mt-0.5">{t.date} • {PAYMENT_METHODS.find(p=>p.id===t.method)?.label}</p>
                                                    </div>
                                                </div>
                                                <div className="text-left">
                                                    <p className={`font-black text-base ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-800 dark:text-white'}`}>
                                                        {isPrivate ? '****' : Number(t.amount).toLocaleString()}
                                                    </p>
                                                    <button onClick={() => handleDelete(t.id)} className="text-rose-400 mt-1 hover:text-rose-600 transition-colors no-print" title="حذف"><Trash2 size={12}/></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ))}
                                {pendingGroups.length === 0 && (
                                    <div className="text-center p-8 text-slate-400 font-bold">لا توجد التزامات نشطة ✅</div>
                                )}
                            </div>
                        </section>

                        {paidArchive.length > 0 && (
                            <details className="group animate-fadeInUp" open={false}>
                                <summary className="cursor-pointer list-none mb-6">
                                    <div className="glass p-4 rounded-2xl flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                        <h3 className="text-emerald-600 font-black flex items-center gap-3">
                                            <div className="bg-emerald-100 p-2 rounded-lg"><CheckCircle2 size={20}/></div> 
                                            سجل المدفوعات المكتملة ({paidArchive.length})
                                        </h3>
                                        <ChevronDown className="text-slate-400 group-open:rotate-180 transition-transform duration-300" size={24}/>
                                    </div>
                                </summary>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {paidArchive.map(t => (
                                        <div key={t.id} className={`glass p-4 rounded-2xl flex justify-between items-center border-r-4 group transition-all ${t.type === 'income' ? 'border-emerald-500' : 'border-red-500'} bg-white/50 dark:bg-slate-900/40 hover:shadow-md`}>
                                            <div className="min-w-0 flex-1 pl-4">
                                                <p className="font-bold text-sm text-slate-800 dark:text-white truncate">
                                                    {t.type === 'income' ? '💰 ' : '💸 '}{t.description || t.category}
                                                </p>
                                                <div className="flex items-center gap-2 mt-1">
                                                    <span className="text-[10px] text-slate-400 font-bold">{t.date}</span>
                                                    <span className={`text-[9px] px-2 py-0.5 rounded-full font-black ${t.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600'}`}>
                                                        {t.type === 'income' ? 'دخل محقق' : 'مصروف مدفوع'}
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <p className={`font-black text-sm whitespace-nowrap ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-700 dark:text-white'}`}>
                                                    {isPrivate ? '****' : Number(t.amount).toLocaleString()} ج.م
                                                </p>
                                                
                                                {/* مفاتيح التحكم في الأرشيف */}
                                                <div className="flex gap-1 no-print opacity-0 group-hover:opacity-100 transition-opacity">
                                                    {/* مفتاح الإعادة للوضع المعلق */}
                                                    <button 
                                                        onClick={() => {
                                                            const newTrans = transactions.map(tr => tr.id === t.id ? { ...tr, status: 'pending' } : tr);
                                                            dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTrans });
                                                            addNotification({ 
                                                                type: 'warning', 
                                                                title: 'إعادة للوضع المعلق', 
                                                                message: t.type === 'income' ? 'تم سحب المبلغ من الكاش وإعادته للدخل المنتظر' : 'تم إعادة المصروف لقائمة الالتزامات' 
                                                            });
                                                        }} 
                                                        className="p-2 text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-900/20 rounded-xl transition-all active:scale-90"
                                                        title="إعادة للوضع المعلق"
                                                    >
                                                        <Undo2 size={18}/>
                                                    </button>
                                                    
                                                    {/* زر التعديل */}
                                                    <button onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="p-2 text-blue-500 hover:bg-blue-50 rounded-xl transition-all" title="تعديل"><Edit size={16}/></button>
                                                    
                                                    {/* زر الحذف */}
                                                    <button onClick={() => handleDelete(t.id)} className="p-2 text-rose-400 hover:bg-rose-50 rounded-xl transition-all" title="حذف"><Trash2 size={16}/></button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </details>
                        )}
                    </div>
                );
            };

            const plannerProjection = useMemo(() => {
                const currentMonthIdx = new Date().getMonth();
                const monthsRemaining = MONTHS.slice(currentMonthIdx);
                
                let runningLiquidity = financeSnapshot.actualCashInHand; 
                let simulatedLoans = JSON.parse(JSON.stringify(updatedLoans));
                
                let simulatedCards = cards.map(card => {
                    const history = calculateCardHistory(card);
                    const currentMonthDebt = history.find(h => h.month === selectedMonth)?.closingDebt || 0;
                    return { ...card, currentDebt: currentMonthDebt };
                });

                return monthsRemaining.map((month) => {
                    let monthlyLoanPayments = 0;
                    simulatedLoans = simulatedLoans.map(l => {
                        const payment = Math.min(l.remaining, l.monthlyInstallment);
                        monthlyLoanPayments += payment;
                        return { ...l, remaining: l.remaining - payment };
                    });

                    let monthlyCardPayments = simulatedCards.reduce((sum, c) => sum + c.currentDebt, 0);
                    simulatedCards = simulatedCards.map(c => ({ ...c, currentDebt: 0 }));

                    const totalOutflow = monthlyLoanPayments + monthlyCardPayments;
                    
                    const monthlyNetIncome = financeSnapshot.actualIncome - financeSnapshot.cashExpenses;
                    const openingLiquidity = runningLiquidity;
                    runningLiquidity = (openingLiquidity + monthlyNetIncome) - totalOutflow;

                    const remainingTotalDebt = simulatedLoans.reduce((sum, l) => sum + l.remaining, 0);

                    const isDanger = runningLiquidity < 0;

                    return { month, openingLiquidity, totalOutflow, runningLiquidity, remainingTotalDebt, isDanger };
                });
            }, [financeSnapshot, updatedLoans, cards, selectedMonth]);

            const renderStrategicPlanner = () => {
                return (
                    <div className="space-y-8 animate-fadeIn pb-24">
                        <div className="glass p-8 rounded-[2.5rem] bg-gradient-to-r from-slate-900 to-blue-900 text-white shadow-glow border border-blue-500/20 no-print">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h2 className="text-3xl font-black flex items-center gap-3">
                                        <Target className="text-emerald-400" size={32} /> المخطط الاستراتيجي {CURRENT_YEAR}
                                    </h2>
                                    <p className="text-slate-300 mt-2 font-bold">محاكاة ذكية للتدفق النقدي وإهلاك المديونيات الشاملة</p>
                                </div>
                                <div className="hidden md:block text-left bg-white/10 p-4 rounded-2xl backdrop-blur-sm">
                                    <div className="text-xs uppercase tracking-widest text-slate-300 font-bold mb-1">الوضعية الحالية</div>
                                    <div className="text-2xl font-black text-emerald-400">{isPrivate ? '****' : financeSnapshot.actualCashInHand.toLocaleString()} <span className="text-sm">ج.م</span></div>
                                </div>
                            </div>
                        </div>

                        <div className="glass rounded-[2rem] overflow-hidden border border-slate-200 dark:border-slate-700 shadow-pro-card">
                            <div className="overflow-x-auto">
                                <table className="w-full text-right text-sm border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 dark:bg-slate-800/50 text-slate-500 font-bold">
                                            <th className="p-6 border-b dark:border-slate-700">الشهر</th>
                                            <th className="p-6 border-b dark:border-slate-700">السيولة الافتتاحية</th>
                                            <th className="p-6 border-b dark:border-slate-700 text-rose-500">التزامات (ديون + كروت)</th>
                                            <th className="p-6 border-b dark:border-slate-700 text-emerald-600 bg-emerald-50/20">صافي السيولة المتبقية</th>
                                            <th className="p-6 border-b dark:border-slate-700">المديونية الكلية المتبقية</th>
                                            <th className="p-6 border-b dark:border-slate-700 text-center">مستوى الأمان</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y dark:divide-slate-800">
                                        {plannerProjection.map((row, idx) => (
                                            <tr key={row.month} className={`transition-colors ${idx === 0 ? 'bg-blue-50/20' : 'hover:bg-slate-50 dark:hover:bg-slate-800/30'}`}>
                                                <td className="p-6 font-black text-slate-800 dark:text-white">{row.month}</td>
                                                <td className="p-6 font-mono text-slate-500">{Math.round(row.openingLiquidity).toLocaleString()}</td>
                                                <td className="p-6 font-mono text-rose-500 font-bold">-{Math.round(row.totalOutflow).toLocaleString()}</td>
                                                <td className={`p-6 font-mono text-lg font-black ${row.isDanger ? 'text-red-600 bg-red-50/50' : 'text-emerald-600 bg-emerald-50/20'}`}>
                                                    {Math.round(row.runningLiquidity).toLocaleString()}
                                                </td>
                                                <td className="p-6 font-mono text-slate-600">{Math.round(row.remainingTotalDebt).toLocaleString()}</td>
                                                <td className="p-6 text-center">
                                                    {row.isDanger ? (
                                                        <span className="px-3 py-1 bg-red-100 text-red-600 rounded-lg text-[10px] font-black animate-pulse flex items-center justify-center gap-1">
                                                            <AlertTriangle size={12} /> عجز مالي
                                                        </span>
                                                    ) : row.runningLiquidity < 10000 ? (
                                                        <span className="px-3 py-1 bg-amber-100 text-amber-600 rounded-lg text-[10px] font-black flex items-center justify-center gap-1">
                                                            <ShieldAlert size={12} /> انتباه
                                                        </span>
                                                    ) : (
                                                        <span className="px-3 py-1 bg-emerald-100 text-emerald-600 rounded-lg text-[10px] font-black flex items-center justify-center gap-1">
                                                            <ShieldCheck size={12} /> مستقر
                                                        </span>
                                                    )}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 no-print">
                            <div className="glass p-8 rounded-[2.5rem] border-r-4 border-r-blue-500">
                                <h4 className="font-black text-xl mb-4 flex items-center gap-2 text-slate-800 dark:text-white">
                                    <Sparkles className="text-blue-500" /> تحليل الفائض المالي
                                </h4>
                                <p className="text-sm text-slate-500 leading-relaxed font-medium">
                                    بناءً على المحاكاة، الشهر الذي ستمتلك فيه أكبر قدر من السيولة هو شهر <span className="text-blue-600 font-black">ديسمبر</span>. 
                                    ننصح بتوجيه الفائض في هذا الشهر لسداد جزء من أصل <span className="font-bold text-slate-800 dark:text-slate-200">قرض AAIB</span> لتقليل الفائدة المتراكمة.
                                </p>
                            </div>
                            <div className="glass p-8 rounded-[2.5rem] border-r-4 border-r-amber-500">
                                <h4 className="font-black text-xl mb-4 flex items-center gap-2 text-slate-800 dark:text-white">
                                    <BellRing className="text-amber-500" /> ملاحظات الأمان
                                </h4>
                                <p className="text-sm text-slate-500 leading-relaxed font-medium">
                                    تجنب أي مشتريات تقسيط جديدة تنتهي بعد شهر <span className="text-amber-600 font-black">أبريل</span> حتى تضمن بقاء صافي السيولة المتبقية فوق مستوى الأمان (5,000 ج.م).
                                </p>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderActiveView = () => {
                switch (activeTab) {
                    case 'dashboard': return renderDashboard();
                    case 'transactions': return renderTransactionsViewFull();
                    case 'categories': return renderCategoriesView();
                    case 'loans': return renderLoansView();
                    case 'cards': return renderWalletsAndCardsView();
                    case 'calendar': return renderCalendarView();
                    case 'planner': return renderStrategicPlanner(); 
                    case 'duplicates': return <DuplicateDetectionSystem transactions={transactions} dispatch={dispatch} addNotification={addNotification} MONTHS={MONTHS} />; 
                    default: return renderDashboard();
                }
            };

            if (!isAuthenticated) return <LoginScreen onLogin={() => { 
                setIsAuthenticated(true); 
                dispatch({ type: 'SET_BACKUP_REMINDER_OPEN', payload: true }); 
            }} />;

            return (
                <div className="flex h-screen overflow-hidden text-slate-800 dark:text-slate-100 font-sans bg-hero-pattern">
                    
                    <ProfessionalTicker />

                    <NotificationCenter notifications={notifications} removeNotification={removeNotification} />
                    
                    {isProcessing && (<div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[9999] animate-fadeIn no-print"><div className="text-center"><div className="loading-spinner mx-auto mb-6"></div><p className="text-white text-xl font-black animate-pulse">جاري المعالجة...</p></div></div>)}
                    
                    <ConfirmDialog />

                    <div className="bottom-nav-container no-print">
                        <div className="scrollable-nav scroll-hide">
                            {[
                                { id: 'dashboard', label: 'الرئيسية', icon: LayoutDashboard }, 
                                { id: 'transactions', label: 'المعاملات', icon: ArrowUpRight }, 
                                { id: 'cards', label: 'المحافظ', icon: CreditCard }, 
                                { id: 'loans', label: 'القروض', icon: Banknote }, 
                                { id: 'planner', label: 'المخطط', icon: CalendarDays }, 
                                { id: 'calendar', label: 'الأجندة', icon: CalendarDays }, 
                                { id: 'duplicates', label: 'المكررات', icon: Filter }, 
                                { id: 'categories', label: 'الفئات', icon: Layers }
                            ].map(item => (
                                <button key={item.id} type="button" onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} className={`nav-btn ${activeTab === item.id ? 'active' : ''}`} aria-label={item.label}>
                                    <item.icon size={24} />
                                    <span>{item.label}</span>
                                    {activeTab === item.id && (<div className="absolute -top-1 w-1.5 h-1.5 bg-blue-500 rounded-full animate-pulse" />)}
                                </button>
                            ))}
                            <div className="v-line"></div>
                            <button type="button" onClick={handleExportCSV} className="nav-btn text-emerald-600 hover:bg-emerald-50" aria-label="تصدير CSV"><FileSpreadsheet size={24} /><span>CSV</span></button>
                            <button type="button" onClick={handleExport} className="nav-btn text-blue-600 hover:bg-blue-50" aria-label="نسخة احتياطية"><Download size={24} /><span>حفظ</span></button>
                            <label className="nav-btn cursor-pointer text-purple-600 hover:bg-purple-50"><input type="file" accept=".json" onChange={handleImport} className="hidden" /><Upload size={24} /><span>جلب</span></label>
                            <button type="button" onClick={resetData} className="nav-btn text-red-500 hover:bg-red-50" aria-label="إعادة تعيين"><RefreshCcw size={24} /><span>إعادة</span></button>
                            <div className="v-line"></div>
                            <button type="button" onClick={() => mainContentRef.current?.scrollTo({top:0, behavior:'smooth'})} className="nav-btn" aria-label="التمرير إلى الأعلى"><ArrowUp size={24} /><span>أعلى</span></button>
                            <button type="button" onClick={() => dispatch({ type: 'SET_IS_LOCKED', payload: true })} className="nav-btn text-amber-500 hover:bg-amber-50" aria-label="قفل التطبيق"><Lock size={24} /><span>قفل</span></button>
                            <button type="button" onClick={() => setIsAuthenticated(false)} className="nav-btn text-red-600 hover:bg-red-50" aria-label="تسجيل الخروج"><LogOut size={24} /><span>خروج</span></button>
                        </div>
                    </div>

                    {!isLocked && (<button type="button" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', category: '', amount: '', quantity:1, unitPrice: '', date: getLocalISODate(), month: selectedMonth, method: 'cash', subType: 'withdrawal' } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="fab no-print" title="إضافة عملية جديدة" aria-label="إضافة عملية جديدة"><Plus size={32} /></button>)}

                    {/* Sidebar */}
                    <aside className="w-80 glass border-l-0 dark:border-r border-white/20 hidden md:flex flex-col p-8 z-40 relative bg-white/50 dark:bg-slate-900/50 backdrop-blur-xl no-print">
                        <div className="flex items-center gap-4 mb-12 px-2 group cursor-pointer hover-lift p-4 rounded-2xl bg-gradient-to-r from-transparent to-transparent hover:from-blue-50/50 hover:to-transparent dark:hover:from-blue-900/20" onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'dashboard' })}><div className="bg-gradient-to-br from-blue-600 to-blue-500 p-3.5 rounded-2xl text-white shadow-lg shadow-blue-500/30 group-hover:scale-110 transition-transform duration-300"><Wallet size={28} /></div><div><h1 className="font-black text-2xl tracking-tight dark:text-white">محفظتي</h1><p className="text-xs font-bold text-slate-400 tracking-widest uppercase">الإصدار الاحترافي</p></div></div>
                        <nav className="space-y-3 flex-1 scroll-hide overflow-y-auto">
                            {[
                                { id: 'dashboard', label: 'لوحة التحكم', icon: LayoutDashboard }, 
                                { id: 'transactions', label: 'سجل المعاملات', icon: ArrowUpRight }, 
                                { id: 'categories', label: 'الفئات والميزانية', icon: Layers }, 
                                { id: 'loans', label: 'القروض والديون', icon: Banknote }, 
                                { id: 'cards', label: 'البطاقات والمحافظ', icon: CreditCard }, 
                                { id: 'planner', label: 'المخطط الاستراتيجي', icon: Target }, 
                                { id: 'calendar', label: 'الأجندة ومواعيد السداد', icon: CalendarDays }, 
                                { id: 'duplicates', label: 'كشف المكررات', icon: Filter }
                            ].map(item => (
                                <button key={item.id} type="button" onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all duration-300 font-bold ${activeTab === item.id ? 'bg-gradient-to-r from-blue-600 to-blue-500 text-white shadow-lg shadow-blue-500/30 scale-[1.02] border border-blue-400' : 'text-slate-500 dark:text-slate-400 hover:bg-white/50 dark:hover:bg-slate-800/50 hover:text-blue-600'}`}><item.icon size={22} className={activeTab === item.id ? 'animate-pulse' : ''} /><span className="text-sm tracking-wide">{item.label}</span></button>
                            ))}
                        </nav>
                    </aside>

                    <main ref={mainContentRef} className="flex-1 overflow-y-auto p-6 md:p-12 relative scroll-smooth pt-16"> 
                        {isLocked ? (
                            <div className="lock-screen backdrop-blur-3xl animate-fadeIn no-print"><Lock size={80} className="mb-8 text-blue-500 animate-bounce-slight" /><h2 className="text-4xl font-black mb-8 tracking-tight">التطبيق مقفل</h2><button type="button" onClick={() => dispatch({ type: 'SET_IS_LOCKED', payload: false })} className="bg-white text-slate-900 px-16 py-5 rounded-full font-bold shadow-2xl flex items-center gap-3 transition-all hover:scale-105 active:scale-95 uppercase tracking-widest"><Unlock size={24} /> فتح التطبيق</button></div>
                        ) : (
                            <div className="max-w-7xl mx-auto space-y-12 animate-fadeIn pb-24">
                                <header className="flex flex-col md:flex-row justify-between items-end bg-transparent pb-4 gap-6 no-print">
                                    <div><h2 className="text-4xl font-black text-slate-800 dark:text-white tracking-tight mb-2">أهلاً بك، أحمد 👋</h2><p className="text-slate-500 font-bold text-base">إليك ملخص محفظتك المالية لعام <span className="text-blue-600 font-black">{CURRENT_YEAR}</span></p></div>
                                    <div className="flex gap-4 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                                        <button type="button" onClick={() => dispatch({ type: 'SET_AI_MODAL_OPEN', payload: true })} className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-4 rounded-2xl shadow-lg shadow-purple-500/30 transition-all hover:scale-110 active:scale-95 hover:rotate-6 flex-shrink-0" aria-label="المساعد الذكي"><Sparkles size={24} /></button>
                                        <button type="button" onClick={() => dispatch({ type: 'SET_HIDE_PAST', payload: !hidePast })} className={`p-4 rounded-2xl shadow-lg transition-all font-bold flex items-center gap-2 flex-shrink-0 ${hidePast ? 'bg-orange-100 text-orange-600' : 'bg-white dark:bg-slate-800 text-slate-400 hover:text-slate-600'}`} title="وضع التركيز" aria-label={hidePast ? 'إظهار الماضي' : 'إخفاء الماضي'}>{hidePast ? <EyeOff size={24} /> : <Eye size={24} />}</button>
                                        <button type="button" onClick={() => setIsPrivate(!isPrivate)} className={`p-4 rounded-2xl shadow-lg transition-all font-bold flex items-center gap-2 flex-shrink-0 ${isPrivate ? 'bg-indigo-600 text-white' : 'bg-white dark:bg-slate-800 text-slate-400 hover:text-slate-600'}`} title="وضع الخصوصية" aria-label={isPrivate ? 'إلغاء الخصوصية' : 'تفعيل الخصوصية'}>{isPrivate ? <Eye size={24} /> : <EyeOff size={24} />}</button>
                                        <div className="flex bg-white dark:bg-slate-800 p-1.5 rounded-2xl shadow-lg border border-slate-100 dark:border-slate-700 flex-shrink-0"><button type="button" onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: false })} className={`p-3 rounded-xl transition-all ${!isDarkMode ? 'bg-yellow-100 text-yellow-600 shadow-sm' : 'text-slate-400'}`} aria-label="الوضع الفاتح"><Sun size={20} /></button><button type="button" onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: true })} className={`p-3 rounded-xl transition-all ${isDarkMode ? 'bg-slate-700 text-blue-400 shadow-sm' : 'text-slate-400'}`} aria-label="الوضع الداكن"><Moon size={20} /></button></div>
                                        <div className="h-8 w-px bg-slate-300 mx-1 flex-shrink-0"></div><button type="button" onClick={() => dispatch({ type: 'UNDO' })} disabled={history.length === 0} className={`p-4 rounded-2xl shadow-lg transition-all font-bold flex items-center gap-2 flex-shrink-0 ${history.length > 0 ? 'bg-white dark:bg-slate-800 text-blue-600' : 'bg-slate-50 text-slate-300'}`}><Undo2 size={20} /></button><button type="button" onClick={() => dispatch({ type: 'REDO' })} disabled={future.length === 0} className={`p-4 rounded-2xl shadow-lg transition-all font-bold flex items-center gap-2 flex-shrink-0 ${future.length > 0 ? 'bg-white dark:bg-slate-800 text-blue-600' : 'bg-slate-50 text-slate-300'}`}><Redo2 size={20} /></button>
                                    </div>
                                </header>
                                {renderActiveView()}
                            </div>
                        )}
                    </main>

                    {isFormOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-[2500] p-4 transition-all no-print">
                            <div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden animate-fadeIn border border-white/20">
                                <div className="p-8 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/30">
                                    <h3 className="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3"><div className="bg-blue-500 p-2 rounded-xl text-white shadow-lg shadow-blue-500/30"><Plus size={20} /></div>{formMode === 'add' ? 'إضافة عملية' : 'تعديل عملية'}</h3>
                                    <button type="button" onClick={() => dispatch({ type: 'SET_FORM_OPEN', payload: false })} className="text-slate-400 hover:text-red-500 p-2 hover:bg-red-50 rounded-xl transition-colors" aria-label="إغلاق"><X size={24} /></button>
                                </div>
                                <form onSubmit={handleSaveTransaction} className="p-8 space-y-6" id="transaction-form">
                                    <div className="grid grid-cols-2 gap-6">
                                        <div><label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2">النوع</label><select className="input-field font-bold" value={formData.type} onChange={(e) => { const newType = e.target.value; const newSubType = newType === 'income' ? 'deposit' : 'withdrawal'; dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, type: newType, subType: newSubType } }); }}><option value="expense">مصروف 💸</option><option value="income">دخل 💰</option></select></div>
                                        <div><label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2">الفئة</label><select className="input-field font-bold" value={formData.category} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, category: e.target.value } }) } required><option value="">اختر التصنيف...</option>{Object.entries(CATEGORY_GROUPS[formData.type]).map(([groupName, items]) => (<optgroup key={groupName} label={groupName}>{items.map(c => (<option key={c} value={c}>{c}</option>))}</optgroup>))}</select></div>
                                    </div>
                                    
                                    {(['fawry', 'etisalat', 'cib_savings', 'aaib_savings'].includes(formData.method)) && (
                                        <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl border border-dashed border-slate-300 mb-4">
                                            <label className="block text-xs font-bold mb-3 text-slate-500">نوع العملية</label>
                                            <div className="flex gap-4">
                                                <label className={`flex-1 flex items-center justify-center gap-2 p-3 rounded-xl cursor-pointer border-2 transition-all ${formData.subType === 'deposit' ? 'border-emerald-500 bg-emerald-50' : 'border-transparent bg-white'}`}>
                                                    <input type="radio" name="subType" value="deposit" className="hidden"
                                                           checked={formData.subType === 'deposit'} 
                                                           onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, subType: 'deposit' } })} />
                                                    <span className="text-sm font-bold">إيداع (+)</span>
                                                </label>
                                                <label className={`flex-1 flex items-center justify-center gap-2 p-3 rounded-xl cursor-pointer border-2 transition-all ${formData.subType === 'withdrawal' ? 'border-red-500 bg-red-50' : 'border-transparent bg-white'}`}>
                                                    <input type="radio" name="subType" value="withdrawal" className="hidden"
                                                           checked={formData.subType === 'withdrawal'} 
                                                           onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, subType: 'withdrawal' } })} />
                                                    <span className="text-sm font-bold">سحب (-)</span>
                                                </label>
                                            </div>
                                        </div>
                                    )}

                                    <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl border border-dashed border-slate-200 dark:border-slate-700 flex items-center gap-4"><div className="flex-1"><label className="text-[10px] text-slate-400 block mb-1 font-bold">العدد</label><input type="number" className="w-full bg-transparent border-b-2 border-slate-200 focus:border-blue-500 text-center font-bold text-lg outline-none transition-colors" value={formData.quantity} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, quantity: e.target.value, amount: (e.target.value * (formData.unitPrice || 0)) } })} /></div><span className="text-slate-300 text-lg">×</span><div className="flex-1"><label className="text-[10px] text-slate-400 block mb-1 font-bold">السعر</label><input type="number" className="w-full bg-transparent border-b-2 border-slate-200 focus:border-blue-500 text-center font-bold text-lg outline-none transition-colors" value={formData.unitPrice} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, unitPrice: e.target.value, amount: (e.target.value * (formData.quantity ||0)) } })} /></div></div>
                                    <div className="grid grid-cols-3 gap-4"><div className="col-span-1"><label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2">المبلغ</label><input type="number" required step="0.01" className="input-field text-xl font-black text-blue-600" value={formData.amount} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, amount: e.target.value, unitPrice: e.target.value / (formData.quantity ||1) } })} /></div><div className="col-span-1"><label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2">التاريخ</label><input type="date" required className="input-field text-sm font-bold" value={formData.date} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, date: e.target.value } })} /></div><div className="col-span-1"><label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2">الدفع</label><select className="input-field text-sm font-bold" value={formData.method} 
                                        onChange={e => {
                                            const newMethod = e.target.value;
                                            let newSubType = formData.subType;
                                            
                                            if (['fawry', 'etisalat', 'cib_savings', 'aaib_savings'].includes(newMethod)) {
                                                newSubType = formData.type === 'income' ? 'deposit' : 'withdrawal';
                                            }
                                            
                                            dispatch({ 
                                                type: 'SET_FORM_DATA', 
                                                payload: { ...formData, method: newMethod, subType: newSubType } 
                                            });
                                        }}
                                    >
                                        {PAYMENT_METHODS.map(m => (<option key={m.id} value={m.id}>{m.label}</option>))}
                                    </select></div></div>
                                    
                                    {formData.type === 'expense' && (
                                        <details className="group border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden bg-white dark:bg-slate-800">
                                            <summary className="p-4 cursor-pointer text-xs font-bold text-slate-500 flex items-center justify-between select-none hover:bg-slate-50 transition-colors">
                                                <span className="flex items-center gap-2"><Hash size={16} className="text-blue-500" /> ربط بقرض (اختياري)</span>
                                                <ChevronDown size={16} className="group-open:rotate-180 transition-transform" />
                                            </summary>
                                            <div className="p-4 border-t border-slate-100 dark:border-slate-700">
                                                <select className="input-field text-sm font-bold w-full" value={formData.linkedLoanId || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, linkedLoanId: e.target.value ? Number(e.target.value) : '' } }) }><option value="">-- اختر القرض --</option>{updatedLoans.map(l => (<option key={l.id} value={l.id}>{l.name}</option>))}</select>
                                            </div>
                                        </details>
                                    )}

                                    {formData.type === 'expense' && formData.category === 'الالتزامات البنكية والتمويلية' && (
                                        <div>
                                            <label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2 flex items-center gap-2 tracking-wider"><CreditCard size={14} /> سداد بطاقة ائتمان</label>
                                            <select className="input-field text-sm font-bold bg-blue-50/50 border-blue-200" value={formData.linkedCardId || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, linkedCardId: e.target.value ? Number(e.target.value) : '' } }) }><option value="">-- اختر البطاقة --</option>{cards.map(c => (<option key={c.id} value={c.id}>{c.name} - {c.bank}</option>))}</select>
                                        </div>
                                    )}

                                    <div><label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2 block tracking-wider">الوصف</label><input type="text" id="form-desc" className="input-field font-bold" value={formData.description} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: e.target.value } })} placeholder="تفاصيل إضافية..." /></div>
                                    {formMode === 'add' && (<details className="group border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden bg-white dark:bg-slate-800"><summary className="p-4 cursor-pointer text-xs font-bold text-slate-500 flex items-center justify-between select-none hover:bg-slate-50 transition-colors"><span className="flex items-center gap-2"><Repeat size={16} className="text-blue-500" /> تكرار العملية في المستقبل</span><ChevronDown size={16} className="group-open:rotate-180 transition-transform" /></summary><div className="p-4 border-t border-slate-100 dark:border-slate-700 flex flex-wrap gap-2">{MONTHS.map((m, idx) => { if (idx <= MONTHS.indexOf(selectedMonth)) return null; return (<label key={m} className="inline-flex items-center gap-2 bg-slate-50 dark:bg-slate-700 px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-600 cursor-pointer select-none text-xs font-bold hover:border-blue-300 transition-colors"><input type="checkbox" className="rounded text-blue-600 focus:rope-0 w-4 h-4" onChange={(e) => { if (e.target.checked) { dispatch({ type: 'SET_REPEAT_MONTHS', payload: [...repeatMonths, m] }); } else { dispatch({ type: 'SET_REPEAT_MONTHS', payload: repeatMonths.filter(rm => rm !== m) }); } }} />{m}</label>); })}</div></details>)}
                                    <button type="submit" className="w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white py-4 rounded-2xl font-black text-lg shadow-xl shadow-blue-500/30 hover:shadow-blue-500/50 hover:scale-[1.02] active:scale-95 transition-all mt-4" disabled={isProcessing}>{isProcessing ? (<span className="flex items-center justify-center gap-2"><div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> جاري الحفظ...</span>) : 'حفظ العملية'}</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {isAiModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-[3500] p-4 animate-fadeIn no-print">
                            <div className="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-[2.5rem] shadow-2xl overflow-hidden animate-fadeIn border border-purple-500/20 flex flex-col max-h-[90vh]">
                                <div className="p-8 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-gradient-to-r from-purple-50 to-indigo-50 dark:bg-purple-900/20">
                                    <h3 className="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3"><div className="bg-purple-500 p-2 rounded-xl text-white shadow-lg shadow-purple-500/30"><Bot size={20} /></div>المساعد المالي الذكي</h3>
                                    <button type="button" onClick={() => dispatch({ type: 'SET_AI_MODAL_OPEN', payload: false })} className="text-slate-400 hover:text-red-500 p-2 hover:bg-red-50 rounded-xl transition-colors"><X size={24} /></button>
                                </div>
                                <div className="p-8 flex-1 overflow-y-auto scroll-hide">
                                    <div className="flex gap-4 mb-6 border-b border-slate-100 dark:border-slate-800 pb-4"><button type="button" onClick={handleAnalyzeFinances} disabled={isAiLoading} className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-purple-500/30 flex items-center justify-center gap-3 hover:scale-[1.02] active:scale-95 transition-all">{isAiLoading ? 'جاري التحليل...' : 'تحليل الوضع المالي الحالي'}</button>{aiResponse && (<div className="bg-slate-50 dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 animate-fadeIn"><p className="text-slate-700 dark:text-slate-200 leading-relaxed font-medium">{aiResponse}</p></div>)}</div>
                                </div>
                            </div>
                        </div>
                    )}

                    {editingBudgetCategory && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-[3500] p-4 animate-fadeIn no-print">
                            <div className="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[2.5rem] shadow-2xl p-8 animate-fadeIn border border-blue-500/20">
                                <h3 className="text-2xl font-black mb-6 text-slate-800 dark:text-white">تعديل ميزانية: <span className="text-blue-600">{editingBudgetCategory}</span></h3>
                                <div className="space-y-6">
                                    <div><label className="block text-sm font-bold mb-3 text-slate-500 uppercase">المبلغ المخصص</label><input type="number" className="input-field text-xl font-black text-blue-600" value={budgetAmount} onChange={e => dispatch({ type: 'SET_BUDGET_AMOUNT', payload: e.target.value })} /></div>
                                    <div className="flex gap-4"><button type="button" onClick={handleSaveBudget} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-2xl font-bold shadow-lg shadow-blue-500/30">حفظ</button><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null })} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-500 py-3 rounded-2xl font-bold">إلغاء</button></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {editingCard && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-[3500] p-4 animate-fadeIn no-print">
                            <div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden animate-fadeIn border border-slate-200 dark:border-slate-700 max-h-[90vh] flex flex-col">
                                <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50">
                                    <h3 className="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2"><Edit size={20} className="text-blue-500"/> تعديل بيانات البطاقة</h3>
                                    <button type="button" onClick={() => dispatch({ type: 'SET_EDITING_CARD', payload: null })} className="text-slate-400 hover:text-red-500 p-2 hover:bg-red-50 rounded-xl transition-colors"><X size={24} /></button>
                                </div>
                                <form onSubmit={handleUpdateCard} className="p-6 space-y-4 overflow-y-auto scroll-hide">
                                    <div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-500 mb-1 block">اسم البطاقة</label><input type="text" required className="input-field" value={editingCard.name} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, name:e.target.value}})} /></div><div><label className="text-xs font-bold text-slate-500 mb-1 block">البنك</label><input type="text" required className="input-field" value={editingCard.bank} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, bank:e.target.value}})} /></div></div>
                                    <div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-500 mb-1 block">الحد الائتماني (Limit)</label><input type="number" required className="input-field text-blue-600 font-bold" value={editingCard.limit} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, limit:Number(e.target.value)}})} /></div><div><label className="text-xs font-bold text-slate-500 mb-1 block">رصيد أول المدة (مديونية)</label><input type="number" className="input-field text-red-500 font-bold" value={editingCard.openingBalance} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, openingBalance:Number(e.target.value)}})} /></div></div>
                                    <div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-500 mb-1 block">اسم حامل البطاقة</label><input type="text" className="input-field uppercase text-sm" value={editingCard.holderName} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, holderName:e.target.value}})} /></div><div><label className="text-xs font-bold text-slate-500 mb-1 block">تاريخ الانتهاء</label><input type="text" placeholder="MM/YY" className="input-field text-center" value={editingCard.expiry} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, expiry:e.target.value}})} /></div></div>
                                    <div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-500 mb-1 block">آخر 4 أرقام</label><input type="text" maxLength="4" className="input-field text-center tracking-widest" value={editingCard.last4} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, last4:e.target.value}})} /></div><div><label className="text-xs font-bold text-slate-500 mb-1 block">يوم الاستحقاق</label><input type="text" className="input-field text-center" value={editingCard.dueDate} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, dueDate:e.target.value}})} /></div></div>
                                    <div><label className="text-xs font-bold text-slate-500 mb-1 block">لون البطاقة (Theme)</label><select className="input-field" value={editingCard.theme} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, theme:e.target.value}})}><option value="silver">فضي (Silver)</option><option value="gold">ذهبي (Gold)</option><option value="platinum">بلاتيني (Platinum)</option><option value="black">أسود (Black)</option><option value="blue">أزرق (Blue)</option></select></div>
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-500/30 transition-all mt-2 active:scale-95">حفظ التعديلات</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {editingLoan && (
                         <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-[3500] p-4 animate-fadeIn no-print">
                            <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden animate-fadeIn">
                                <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center"><h3 className="text-xl font-black">تعديل الالتزام</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: null })}><X size={24} /></button></div>
                                <form onSubmit={handleUpdateLoan} className="p-6 space-y-4"><div><label className="text-xs font-bold text-slate-500">الاسم</label><input type="text" className="input-field" value={editingLoan.name} onChange={e=>dispatch({type:'SET_EDITING_LOAN', payload:{...editingLoan, name:e.target.value}})} /></div><div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-500">المبلغ الكلي</label><input type="number" className="input-field" value={editingLoan.totalAmount} onChange={e=>dispatch({type:'SET_EDITING_LOAN', payload:{...editingLoan, totalAmount:e.target.value}})} /></div><div><label className="text-xs font-bold text-slate-500">القسط الشهري</label><input type="number" className="input-field" value={editingLoan.monthlyInstallment} onChange={e=>dispatch({type:'SET_EDITING_LOAN', payload:{...editingLoan, monthlyInstallment:e.target.value}})} /></div></div><button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mt-4">حفظ التعديلات</button></form>
                            </div>
                        </div>
                    )}

                    {editingFawry && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-[3500] p-4 animate-fadeIn no-print">
                            <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden animate-fadeIn border border-yellow-400/50">
                                <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-yellow-50 dark:bg-yellow-900/10">
                                    <h3 className="text-xl font-black text-slate-800 dark:text-white">ضبط رصيد فوري</h3>
                                    <button type="button" onClick={() => dispatch({ type: 'SET_EDITING_FAWRY', payload: null })} className="p-2 hover:bg-red-50 hover:text-red-500 rounded-xl transition-colors"><X size={24} /></button>
                                </div>
                                <form onSubmit={(e) => { e.preventDefault(); localStorage.setItem('fawryData', JSON.stringify(editingFawry)); dispatch({ type: 'UPDATE_FAWRY_DATA', payload: editingFawry }); dispatch({ type: 'SET_EDITING_FAWRY', payload: null }); addNotification({ type: 'success', title: 'تم الحفظ', message: 'تم تحديث رصيد فوري الافتتاحي' }); }} className="p-6 space-y-6">
                                    <div className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700">
                                        <div className="flex items-center gap-2 mb-4 text-sm font-bold text-fawryBlue"><Calculator size={18} /> معادلة الرصيد التلقائية</div>
                                        <div className="space-y-2 text-sm font-mono">
                                            <div className="flex justify-between items-center"><span className="text-slate-500">رصيد البداية (الافتتاحي)</span><span className="font-bold text-slate-800 dark:text-white">{Number(editingFawry.openingBalance).toLocaleString()}</span></div>
                                            <div className="flex justify-between items-center text-emerald-600"><span>+ إجمالي الشحن (من المعاملات)</span><span className="font-bold">+{fawryStats.deposits.toLocaleString()}</span></div>
                                            <div className="flex justify-between items-center text-red-500"><span>- إجمالي المدفوعات (من المعاملات)</span><span className="font-bold">-{fawryStats.withdrawals.toLocaleString()}</span></div>
                                            <div className="h-px bg-slate-300 dark:bg-slate-600 my-2"></div>
                                            <div className="flex justify-between items-center text-lg font-black text-fawryBlue"><span>= الرصيد الحالي المتوقع</span><span>{((Number(editingFawry.openingBalance) || 0) + fawryStats.deposits - fawryStats.withdrawals).toLocaleString()} ج.م</span></div>
                                        </div>
                                    </div>
                                    <div><label className="block text-xs font-bold text-slate-500 mb-2">تعديل رصيد البداية</label><input type="number" step="0.01" className="input-field text-xl font-black text-fawryBlue" value={editingFawry.openingBalance} onChange={e => dispatch({ type: 'SET_EDITING_FAWRY', payload: { ...editingFawry, openingBalance: Number(e.target.value) } })} placeholder="أدخل الرصيد الموجود قبل 2026..." /><p className="text-[10px] text-slate-400 mt-2 leading-relaxed">💡 تلميح: لا تقم بكتابة الرصيد الحالي هنا. فقط اكتب الرصيد الذي بدأت به السنة (أو رصيد الترحيل)، وسيقوم التطبيق بحساب الباقي.</p></div>
                                    <button type="submit" className="w-full bg-fawryBlue text-white py-3 rounded-xl font-bold shadow-lg hover:bg-blue-800 transition-all">حفظ التعديلات</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {editingEtisalat && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-[3500] p-4 animate-fadeIn no-print">
                            <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden animate-fadeIn border border-green-500/50">
                                <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-green-50 dark:bg-green-900/10">
                                    <h3 className="text-xl font-black text-slate-800 dark:text-white">ضبط اتصالات كاش</h3>
                                    <button type="button" onClick={() => dispatch({ type: 'SET_EDITING_ETISALAT', payload: null })} className="p-2 hover:bg-red-50 hover:text-red-500 rounded-xl transition-colors"><X size={24} /></button>
                                </div>
                                <form onSubmit={(e) => { e.preventDefault(); localStorage.setItem('etisalatData', JSON.stringify(editingEtisalat)); dispatch({ type: 'UPDATE_ETISALAT_DATA', payload: editingEtisalat }); dispatch({ type: 'SET_EDITING_ETISALAT', payload: null }); addNotification({ type: 'success', title: 'تم الحفظ', message: 'تم تحديث رصيد المحفظة الافتتاحي' }); }} className="p-6 space-y-6">
                                    <div className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700">
                                        <div className="flex items-center gap-2 mb-4 text-sm font-bold text-etisalatGreen"><Calculator size={18} /> معادلة الرصيد التلقائية</div>
                                        <div className="space-y-2 text-sm font-mono">
                                            <div className="flex justify-between items-center"><span className="text-slate-500">رصيد البداية (الافتتاحي)</span><span className="font-bold text-slate-800 dark:text-white">{Number(editingEtisalat.openingBalance).toLocaleString()}</span></div>
                                            <div className="flex justify-between items-center text-emerald-600"><span>+ إجمالي الإيداع/التحويلات</span><span className="font-bold">+{etisalatStats.deposits.toLocaleString()}</span></div>
                                            <div className="flex justify-between items-center text-red-500"><span>- إجمالي السحب/الشراء</span><span className="font-bold">-{etisalatStats.withdrawals.toLocaleString()}</span></div>
                                            <div className="h-px bg-slate-300 dark:bg-slate-600 my-2"></div>
                                            <div className="flex justify-between items-center text-lg font-black text-etisalatGreen"><span>= الرصيد الحالي المتوقع</span><span>{((Number(editingEtisalat.openingBalance) || 0) + etisalatStats.deposits - etisalatStats.withdrawals).toLocaleString()} ج.م</span></div>
                                        </div>
                                    </div>
                                    <div><label className="block text-xs font-bold text-slate-500 mb-2">تعديل رصيد البداية</label><input type="number" step="0.01" className="input-field text-xl font-black text-etisalatGreen" value={editingEtisalat.openingBalance} onChange={e => dispatch({ type: 'SET_EDITING_ETISALAT', payload: { ...editingEtisalat, openingBalance: Number(e.target.value) } })} placeholder="أدخل الرصيد الافتتاحي..." /></div>
                                    <button type="submit" className="w-full bg-etisalatGreen text-white py-3 rounded-xl font-bold shadow-lg hover:bg-green-700 transition-all">حفظ التعديلات</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {isQuickTransferModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-[3500] p-4 animate-fadeIn no-print">
                            <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden animate-fadeIn border border-blue-500/50">
                                <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-blue-50 dark:bg-blue-900/10">
                                    <h3 className="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2"><ArrowRightLeft size={20} className="text-blue-600"/> تحويل سريع</h3>
                                    <button type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false })} className="p-2 hover:bg-red-50 hover:text-red-500 rounded-xl transition-colors"><X size={24} /></button>
                                </div>
                                <form onSubmit={handleQuickTransfer} className="p-6 space-y-6">
                                    <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl">
                                        <div className="flex justify-between items-center text-sm font-bold text-blue-700 dark:text-blue-300 mb-2">
                                            <span>من</span>
                                            <span>إلى</span>
                                        </div>
                                        <div className="flex justify-between items-center gap-4">
                                            <select className="input-field text-sm" value={quickTransferData.from} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: e.target.value } })}>
                                                {PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                                            </select>
                                            <div className="text-blue-300"><ArrowRightLeft size={20} /></div>
                                            <select className="input-field text-sm" value={quickTransferData.to} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { to: e.target.value } })}>
                                                {PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div><label className="block text-sm font-bold mb-3 text-slate-500 uppercase">المبلغ</label><input type="number" required step="0.01" className="input-field text-xl font-black text-blue-600" value={quickTransferData.amount} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: e.target.value } })} placeholder="0.00" /></div>
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-500/30 transition-all active:scale-95">تنفيذ التحويل</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        if(rootElement) {
            createRoot(rootElement).render(
                <ErrorBoundary>
                    <App />
                </ErrorBoundary>
            );
        }
    </script>
</body>
</html>
