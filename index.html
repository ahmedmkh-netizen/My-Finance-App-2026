class ErrorBoundary extends React.Component {
constructor(props) { super(props); this.state = { hasError: false, error: null }; }

componentDidCatch(error, info) { console.error('App Error:', error, info); }

if (this.state.hasError) {
return (

// ============ Duplicate Detection =============
const DuplicateDetectionSystem = ({ transactions, dispatch, addNotification, closedMonths }) => {
const [threshold, setThreshold] = useState(2);
const [selectedMonth, setSelectedMonth] = useState('كل الشهور');
const [expandedGroups, setExpandedGroups] = useState({});

const duplicates = useMemo(() => {
const map = {};
const filtered = selectedMonth === 'كل الشهور' ? transactions : transactions.filter(t => t.month === selectedMonth);
filtered.forEach(t => {
const key = `${safeNumber(t.amount)}_${t.method}_${t.category}`;
if (!map[key]) map[key] = [];
map[key].push(t);
});
return Object.entries(map).filter(([_, items]) => items.length >= threshold).map(([key, items]) => ({
key, amount: items[0].amount, count: items.length, items, category: items[0].category,
risk: items.length >= 5 ? 'high' : items.length >= 3 ? 'medium' : 'low'
}));
}, [transactions, threshold, selectedMonth]);

const handleDeleteAll = () => {
let idsToDelete = [];
let protectedCount = 0;
duplicates.forEach(d => {
d.items.slice(1).forEach(item => {
if (closedMonths?.includes(item.month)) protectedCount++;
else idsToDelete.push(item.id);
});
});
if (idsToDelete.length === 0 && protectedCount > 0) {
addNotification({ type: 'error', title: 'محظور', message: 'جميع المكررات في أشهر مغلقة.' });
return;
}
dispatch({
type: 'SHOW_CONFIRM',
title: protectedCount > 0 ? 'تأكيد الحذف (جزئي)' : 'تأكيد الحذف الجماعي',
message: `سيتم حذف ${idsToDelete.length} عملية مكررة.${protectedCount > 0 ? ` تم تجاهل ${protectedCount} في أشهر مغلقة.` : ''}`,
onConfirm: () => {
dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.filter(t => !idsToDelete.includes(t.id)) });
addNotification({ type: 'success', title: 'تم التنظيف', message: `تم حذف ${idsToDelete.length} عملية` });
},
onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
});
};

return (
<div className="space-y-8 animate-fadeIn pb-20">
<div className="glass p-8 rounded-2xl flex justify-between items-center gradient-border mb-6 flex-wrap gap-4">
<div>
<h2 className="text-2xl font-black flex items-center gap-3"><Filter className="text-blue-500" /> كاشف التكرار الذكي</h2>
<p className="text-slate-500 mt-1 text-sm font-bold">تحليل لاكتشاف المبالغ المسجلة مرتين</p>
</div>
<button onClick={handleDeleteAll} disabled={duplicates.length === 0}
className={`px-6 py-3 rounded-xl font-bold flex items-center gap-2 ${duplicates.length === 0 ? 'bg-slate-100 text-slate-400' : 'gradient-bg-danger text-white shadow-lg hover:scale-105'}`}>
<Trash2 size={18} /> تنظيف السجل
</button>
</div>
<div className="glass p-6 rounded-2xl grid grid-cols-1 md:grid-cols-2 gap-8">
<div>
<label className="block text-xs font-black mb-3 opacity-50 uppercase tracking-widest">نطاق البحث</label>
<select className="input-field" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}>
<option value="كل الشهور">جميع الشهور</option>
{[...getMonthsForYear(2026), ...getMonthsForYear(2027)].map(m => <option key={m} value={m}>{m}</option>)}
</select>
</div>
<div>
<label className="block text-xs font-black mb-3 opacity-50 uppercase tracking-widest">الحساسية (أكثر من {threshold})</label>
<input type="range" min="2" max="10" className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer" value={threshold} onChange={e => setThreshold(Number(e.target.value))} />
</div>
</div>
<div className="space-y-4">
{duplicates.length === 0 ? (
<div className="glass p-20 text-center rounded-2xl">
<CheckCircle2 size={60} className="text-emerald-500 mx-auto mb-4" />
<h3 className="text-xl font-black">ممتاز! لا توجد تكرارات</h3>
</div>
) : duplicates.map(dup => (
<div key={dup.key} className="glass rounded-2xl overflow-hidden border">
<div className={`p-5 flex justify-between items-center cursor-pointer ${dup.risk === 'high' ? 'bg-red-50/50' : 'bg-amber-50/50'}`} onClick={() => setExpandedGroups(p => ({ ...p, [dup.key]: !p[dup.key] }))}>
<div className="flex items-center gap-4">
<div className={`p-3 rounded-2xl ${dup.risk === 'high' ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-600'}`}><Repeat size={24} /></div>
<div>
<h4 className="font-black text-lg">{safeNumber(dup.amount).toLocaleString()} ج.م</h4>
<span className="text-xs font-bold opacity-60">{dup.category} - تكرر {dup.count} مرات</span>
</div>
</div>
<ChevronDown className={`transition-transform ${expandedGroups[dup.key] ? 'rotate-180' : ''}`} />
</div>
{expandedGroups[dup.key] && (
<div className="p-4 bg-white/50 dark:bg-black/20 divide-y">
{dup.items.map((item, idx) => (
<div key={item.id} className="py-4 flex justify-between items-center px-4">
<div className="text-sm font-bold">
📅 {item.date} | 📝 {item.description || 'بدون وصف'}
{closedMonths?.includes(item.month) && <span className="text-red-500 text-xs mr-2">(مغلق)</span>}
</div>
{idx !== 0 && !closedMonths?.includes(item.month) && (
<button onClick={() => dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.filter(t => t.id !== item.id) })} className="text-red-500 hover:bg-red-50 p-2 rounded-xl"><Trash2 size={16} /></button>
)}
</div>
))}
</div>
)}
</div>
))}
</div>
</div>
);
};

// ============ Reducer =============
function dataReducer(state, action) {
switch (action.type) {
case 'SET_DATA': return { ...state, data: action.payload };
case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
case 'SET_SELECTED_YEAR': return { ...state, selectedYear: action.payload, selectedMonth: getMonthsForYear(action.payload)[0] };
case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
case 'SET_FORM_DATA': return { ...state, formData: action.payload };
case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
case 'SET_FORM_ERRORS': return { ...state, formErrors: action.payload };
case 'SET_ACTIVE_CATEGORY_DETAIL': return { ...state, activeCategoryDetail: action.payload };
case 'SET_REPEAT_MONTHS': return { ...state, repeatMonths: action.payload };
case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
case 'SET_BUDGETS': return { ...state, budgets: action.payload };
case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
case 'SET_EDITING_FAWRY': return { ...state, editingFawry: action.payload };
case 'SET_EDITING_ETISALAT': return { ...state, editingEtisalat: action.payload };
case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
case 'SET_FILTER_TYPE': return { ...state, filterType: action.payload };
case 'SET_HIDE_PAST': return { ...state, hidePast: action.payload };
case 'SET_AI_MODAL_OPEN': return { ...state, isAiModalOpen: action.payload };
case 'SET_AI_QUERY': return { ...state, aiQuery: action.payload };
case 'SET_AI_RESPONSE': return { ...state, aiResponse: action.payload };
case 'SET_AI_LOADING': return { ...state, isAiLoading: action.payload };
case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
case 'ADD_NOTIFICATION': return { ...state, notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }] };
case 'REMOVE_NOTIFICATION': return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
case 'UPDATE_OPENING_BALANCE': return { ...state, data: { ...state.data, openingBalance2026: action.payload } };
case 'UPDATE_FAWRY_DATA': return { ...state, fawryData: action.payload };
case 'UPDATE_ETISALAT_DATA': return { ...state, etisalatData: action.payload };
case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
case 'ADD_TO_HISTORY': {
const limited = [...state.history].slice(-19);
return { ...state, history: [...limited, action.payload], future: [] };
}
case 'UNDO': {
if (state.history.length === 0) return state;
const prev = state.history[state.history.length - 1];
return { ...state, data: prev, history: state.history.slice(0, -1), future: [state.data, ...state.future] };
}
case 'REDO': {
if (state.future.length === 0) return state;
const next = state.future[0];
return { ...state, data: next, history: [...state.history, state.data], future: state.future.slice(1) };
}
case 'TOGGLE_LEDGER': return { ...state, expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] } };
case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };
case 'SET_STATUS_FILTER': return { ...state, statusFilter: action.payload };
case 'UPDATE_LOAN_DUE_DATE': return { ...state, data: { ...state.data, loans: state.data.loans.map(l => l.id === action.payload.loanId ? { ...l, nextPaymentDate: action.payload.newDate } : l) } };
case 'SHOW_CONFIRM': return { ...state, confirmDialog: { isOpen: true, title: action.title, message: action.message, onConfirm: action.onConfirm, onCancel: action.onCancel } };
case 'HIDE_CONFIRM': return { ...state, confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null } };
case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
case 'SET_QUICK_TRANSFER_DATA': return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
case 'SET_BACKUP_REMINDER_OPEN': return { ...state, isBackupReminderOpen: action.payload };
case 'SET_VIEWING_CARD_STATEMENT': return { ...state, viewingCardStatement: action.payload };
case 'CLOSE_MONTH': return { ...state, data: { ...state.data, closedMonths: [...(state.data.closedMonths || []), action.payload.month], monthlySnapshots: { ...(state.data.monthlySnapshots || {}), [action.payload.month]: action.payload.balance } } };
case 'TOGGLE_WALLET_VISIBILITY': return { ...state, walletVisibility: { ...state.walletVisibility, [action.payload]: !state.walletVisibility[action.payload] } };
case 'SET_IS_PROCESSING': return { ...state, isProcessing: action.payload };
default: return state;
}
}

<button onClick={() => { confirmDialog.onConfirm?.(); dispatch({ type: 'HIDE_CONFIRM' }); }} className="flex-1 gradient-bg-danger text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95">نعم، تابع</button>
</div>
</div>
</div>
);
};

// ============ App =============
function App() {
  const [state, dispatch] = useReducer(dataReducer, initialState);
const [isAuthenticated, setIsAuthenticated] = useState(false);
const [authLoading, setAuthLoading] = useState(true);
const mainContentRef = useRef(null);
const saveTimeoutRef = useRef(null);

const { data, activeTab, selectedYear, selectedMonth, transViewMode, catViewType, isFormOpen, formMode, formData,
activeCategoryDetail, repeatMonths, isLocked, isDarkMode, expandedGroup, budgets,
editingCard, editingLoan, searchTerm, editingBudgetCategory, budgetAmount,
editingFawry, editingEtisalat, isRecurringModalOpen, recurringFormData, filterType,
notifications, isAiModalOpen, aiQuery, aiResponse, isAiLoading, fawryData, etisalatData,
history, future, expandedLedgers, expandedCardsSection, statusFilter, confirmDialog,
isQuickTransferModalOpen, quickTransferData, viewingCardStatement, walletVisibility,
isProcessing, formErrors } = state;

const { transactions = [], loans = [], cards = [], recurringItems = [], openingBalance2026 } = data || {};

// ===== Auth =====
useEffect(() => {
const unsubscribe = firebase.auth().onAuthStateChanged((user) => {
setAuthLoading(false);
setIsAuthenticated(!!(user && user.email === "ahmedmkh@gmail.com"));
});
return () => unsubscribe();
}, []);

// ===== Firestore Sync + Migration =====
useEffect(() => {
if (!isAuthenticated) return;
const docRef = db.collection("finance_2026").doc("user_ahmed_data");
const unsubscribe = docRef.onSnapshot((doc) => {
if (doc.exists) {
const cloudData = doc.data();
const migrated = migrateData(cloudData);
dispatch({ type: 'SET_DATA', payload: migrated });
if (migrated.cards !== cloudData.cards || migrated.loans !== cloudData.loans || migrated.recurringItems !== cloudData.recurringItems) {
docRef.set(migrated, { merge: true });
console.log("✅ Migration applied to cloud");
}
console.log("☁️ Cloud data synced");
}
});
return () => unsubscribe();
}, [isAuthenticated]);

// ===== Auto-Save =====
useEffect(() => {
if (isAuthenticated && data && data.transactions) {
clearTimeout(saveTimeoutRef.current);
saveTimeoutRef.current = setTimeout(() => {
try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
db.collection("finance_2026").doc("user_ahmed_data").set(data, { merge: true }).catch(err => console.error(err));
}, 1500);
}
return () => clearTimeout(saveTimeoutRef.current);
}, [data, isAuthenticated]);

// ===== Keyboard Shortcuts =====
useEffect(() => {
const handleKeyDown = (e) => {
if ((e.ctrlKey || e.metaKey) && e.key === 's') {
e.preventDefault();
if (isFormOpen) document.getElementById('transaction-form')?.requestSubmit();
}
if (e.key === 'Escape') {
if (isFormOpen) dispatch({ type: 'SET_FORM_OPEN', payload: false });
if (isAiModalOpen) dispatch({ type: 'SET_AI_MODAL_OPEN', payload: false });
if (editingCard) dispatch({ type: 'SET_EDITING_CARD', payload: null });
if (editingLoan) dispatch({ type: 'SET_EDITING_LOAN', payload: null });
if (isQuickTransferModalOpen) dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
if (activeCategoryDetail) dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: null });
if (viewingCardStatement) dispatch({ type: 'SET_VIEWING_CARD_STATEMENT', payload: null });
if (isRecurringModalOpen) dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false });
}
if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
e.preventDefault();
document.querySelector('input[placeholder*="ابحث"]')?.focus();
}
};
window.addEventListener('keydown', handleKeyDown);
return () => window.removeEventListener('keydown', handleKeyDown);
}, [isFormOpen, isAiModalOpen, editingCard, editingLoan, isQuickTransferModalOpen, activeCategoryDetail, viewingCardStatement, isRecurringModalOpen]);

// ===== Notifications =====
const removeNotification = useCallback((id) => dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }), []);
const addNotification = useCallback((notification) => dispatch({ type: 'ADD_NOTIFICATION', payload: notification }), []);
const saveHistory = useCallback(() => dispatch({ type: 'ADD_TO_HISTORY', payload: JSON.parse(JSON.stringify(data)) }), [data]);

// ===== Finance Snapshot =====
const financeSnapshot = useMemo(() => {
let actualCarryover = safeNumber(data.openingBalance2026);
const selectedMonthIdx = getMonthIndex(selectedMonth);
const prevMonthName = selectedMonthIdx > 0 ? ALL_MONTHS[selectedMonthIdx - 1] : null;

if (prevMonthName && data.closedMonths?.includes(prevMonthName)) {
actualCarryover = safeNumber(data.monthlySnapshots?.[prevMonthName]);
} else {
transactions.filter(t => getMonthIndex(t.month) < selectedMonthIdx).forEach(t => {
const amt = safeNumber(t.amount);
if (t.status === 'paid') {
if (t.type === 'income') actualCarryover += amt;
else if (t.type === 'expense' && t.method === 'cash') actualCarryover -= amt;
}
});
}
const currentMonthTrans = transactions.filter(t => t.month === selectedMonth);
const currentActualIncome = currentMonthTrans.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
const currentPendingIncome = currentMonthTrans.filter(t => t.type === 'income' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
const currentPaidCash = currentMonthTrans.filter(t => t.type === 'expense' && t.status === 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
const currentPendingCash = currentMonthTrans.filter(t => t.type === 'expense' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
const actualCashInHand = actualCarryover + currentActualIncome - currentPaidCash;
const projectedClosingBalance = actualCashInHand + currentPendingIncome - currentPendingCash;
return { actualCarryover, income: currentActualIncome, actualIncome: currentActualIncome, pendingIncome: currentPendingIncome, actualCashInHand, projectedClosingBalance, pendingAmount: currentPendingCash, cashExpenses: currentPaidCash };
}, [transactions, selectedMonth, data.closedMonths, data.monthlySnapshots, data.openingBalance2026]);

// ===== Chart Data =====
const chartData = useMemo(() => getMonthsForYear(selectedYear).map(m => ({
name: m,
دخل: transactions.filter(t => t.month === m && t.type === 'income').reduce((a, c) => a + safeNumber(c.amount), 0),
مصروف: transactions.filter(t => t.month === m && t.type === 'expense').reduce((a, c) => a + safeNumber(c.amount), 0)
})), [transactions, selectedYear]);

// ===== Updated Loans =====
const updatedLoans = useMemo(() => {
const map = transactions.reduce((acc, t) => {
if (t.linkedLoanId && (t.status === 'paid' || t.status === 'partial')) acc[t.linkedLoanId] = (acc[t.linkedLoanId] || 0) + safeNumber(t.amount);
return acc;
}, {});
return loans.map(l => ({
...l,
totalPaid: safeNumber(l.prePaidAmount) + (map[l.id] || 0),
remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (map[l.id] || 0)))
}));
}, [transactions, loans]);

// ===== Month Insights =====
const monthInsights = useMemo(() => {
const monthTrans = transactions.filter(t => t.month === selectedMonth);
const inc = monthTrans.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
const exp = monthTrans.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
const pendInc = monthTrans.filter(t => t.type === 'income' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
const pendExp = monthTrans.filter(t => t.type === 'expense' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
return { inc, exp, pendInc, pendExp, net: inc - exp };
}, [transactions, selectedMonth]);

// ===== Grouped Transactions =====
const groupedTransactions = useMemo(() => {
const groups = {};
const term = normalizeText(searchTerm);
transactions.filter(t => {
const isMonth = t.month === selectedMonth;
const isType = t.type === transViewMode;
const isSearch = !searchTerm || normalizeText(t.description).includes(term) || normalizeText(t.category).includes(term) || normalizeText(String(t.amount)).includes(term);
let isStatusMatch = true;
if (statusFilter === 'paid') isStatusMatch = t.status === 'paid';
else if (statusFilter === 'pending') isStatusMatch = t.status !== 'paid';
if (!isMonth || !isType || !isSearch || !isStatusMatch) return false;
if (filterType === 'all') return true;
if (filterType === 'high' && safeNumber(t.amount) >= 1000) return true;
if (t.method === filterType) return true;
return false;
}).forEach(t => {
if (!groups[t.category]) groups[t.category] = { category: t.category, total: 0, count: 0, items: [] };
groups[t.category].total += safeNumber(t.amount);
groups[t.category].count++;
groups[t.category].items.push(t);
});
return Object.values(groups).sort((a, b) => b.total - a.total);
}, [transactions, selectedMonth, transViewMode, searchTerm, filterType, statusFilter]);

// ===== Wallet Balances =====
const fawryStats = useMemo(() => {
const deposits = transactions.filter(t => t.method === 'fawry' && t.subType === 'deposit').reduce((s, t) => s + safeNumber(t.amount), 0);
const withdrawals = transactions.filter(t => t.method === 'fawry' && t.subType === 'withdrawal').reduce((s, t) => s + safeNumber(t.amount), 0);
return { deposits, withdrawals };
}, [transactions]);
const currentFawryBalance = safeNumber(fawryData.openingBalance) + fawryStats.deposits - fawryStats.withdrawals;

const etisalatStats = useMemo(() => {
const deposits = transactions.filter(t => t.method === 'etisalat' && t.subType === 'deposit').reduce((s, t) => s + safeNumber(t.amount), 0);
const withdrawals = transactions.filter(t => t.method === 'etisalat' && t.subType === 'withdrawal').reduce((s, t) => s + safeNumber(t.amount), 0);
return { deposits, withdrawals };
}, [transactions]);
const currentEtisalatBalance = safeNumber(etisalatData.openingBalance) + etisalatStats.deposits - etisalatStats.withdrawals;

// ===== Savings Ledger =====
const getSavingsLedger = useCallback((methodId) => {
const accTransactions = transactions.filter(t => t.method === methodId && t.status === 'paid').sort((a, b) => new Date(a.date) - new Date(b.date));
let runningBalance = methodId === 'cib_savings' ? 185968.65 : methodId === 'aaib_savings' ? 5098.01 : 0;
return accTransactions.map(t => {
const amount = safeNumber(t.amount);
const isDeposit = t.subType === 'deposit' || (t.type === 'income' && !t.subType);
runningBalance += isDeposit ? amount : -amount;
return { ...t, runningBalance };
}).reverse();
}, [transactions]);

const fawryLedger = useMemo(() => {
const accTransactions = transactions.filter(t => t.method === 'fawry' && t.status === 'paid').sort((a, b) => new Date(a.date) - new Date(b.date));
let runningBalance = safeNumber(fawryData.openingBalance);
return accTransactions.map(t => {
const amount = safeNumber(t.amount);
if (t.subType === 'deposit') runningBalance += amount;
else runningBalance -= amount;
return { ...t, runningBalance };
}).reverse();
}, [transactions, fawryData]);

const etisalatLedger = useMemo(() => {
const accTransactions = transactions.filter(t => t.method === 'etisalat' && t.status === 'paid').sort((a, b) => new Date(a.date) - new Date(b.date));
let runningBalance = safeNumber(etisalatData.openingBalance);
return accTransactions.map(t => {
const amount = safeNumber(t.amount);
if (t.subType === 'deposit') runningBalance += amount;
else runningBalance -= amount;
return { ...t, runningBalance };
}).reverse();
}, [transactions, etisalatData]);

// ===== Card History =====
const calculateCardHistory = useCallback((card) => {
let runningDebt = safeNumber(card.openingBalance);
return ALL_MONTHS.map(m => {
const expenses = transactions.filter(t =>
t.month === m && t.type === 'expense' &&
((t.method === 'cib_card' && card.bank === 'CIB' && card.name !== 'SWYPE') ||
 (t.method === 'cib_swype' && card.name === 'SWYPE') ||
 (t.method === 'aaib_card' && card.bank === 'AAIB'))
).reduce((a, b) => a + safeNumber(b.amount), 0);
const payments = transactions.filter(t => t.month === m && t.category === 'الالتزامات البنكية والتمويلية' && (t.linkedCardId === card.id || t.description?.includes(card.bank)) && !t.linkedLoanId).reduce((a, b) => a + safeNumber(b.amount), 0);
const openingDebt = runningDebt;
runningDebt = runningDebt + expenses - payments;
return { month: m, openingDebt, expenses, payments, closingDebt: runningDebt, available: safeNumber(card.limit) - runningDebt };
}).filter(h => getMonthsForYear(2026).includes(h.month) || getMonthsForYear(2027).includes(h.month));
}, [transactions]);

// ===== Agenda Items =====
const getAgendaItems = useCallback(() => {
try {
const today = new Date();
const currentDay = today.getDate();
const currentMonth = today.getMonth();
const currentYear = today.getFullYear();
const items = [];

if (Array.isArray(cards)) {
cards.forEach(card => {
const dueDay = parseInt(card.dueDate) || 5;
let targetMonth = currentMonth, targetYear = currentYear;
if (dueDay < currentDay) { targetMonth++; if (targetMonth > 11) { targetMonth = 0; targetYear++; } }
const date = new Date(targetYear, targetMonth, dueDay);
items.push({ id: `agenda-card-${card.id}`, title: `سداد بطاقة ${card.bank} - ${card.name}`, date: date.toISOString().split('T')[0], amount: safeNumber(card.openingBalance), type: 'warning', icon: CreditCard, desc: 'استحقاق دوري' });
});
}
if (Array.isArray(loans)) {
loans.forEach(loan => {
if (safeNumber(loan.monthlyInstallment) > 0) {
const dueDay = parseInt(loan.dueDay) || 1;
let targetMonth = currentMonth, targetYear = currentYear;
if (dueDay < currentDay) { targetMonth++; if (targetMonth > 11) { targetMonth = 0; targetYear++; } }
const date = new Date(targetYear, targetMonth, dueDay);
items.push({ id: `agenda-loan-${loan.id}`, title: `قسط ${loan.name}`, date: date.toISOString().split('T')[0], amount: safeNumber(loan.monthlyInstallment), type: 'danger', icon: Banknote, desc: loan.description });
}
});
}
if (Array.isArray(recurringItems)) {
recurringItems.forEach(item => {
const day = parseInt(item.day) || 1;
let targetMonth = currentMonth, targetYear = currentYear;
if (day < currentDay) { targetMonth++; if (targetMonth > 11) { targetMonth = 0; targetYear++; } }
const date = new Date(targetYear, targetMonth, day);
items.push({ id: `agenda-rec-${item.id}`, title: item.title, date: date.toISOString().split('T')[0], amount: safeNumber(item.amount), type: 'warning', icon: Repeat, desc: 'التزام شهري متكرر' });
});
}
return items.sort((a, b) => new Date(a.date) - new Date(b.date));
} catch (err) { console.error(err); return []; }
}, [cards, loans, recurringItems]);

// ===== Wallet Handlers =====
const handleAddWalletDeposit = useCallback((walletKey) => {
const w = walletKey === 'fawry' ? 'فوري' : 'اتصالات';
dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
dispatch({ type: 'SET_FORM_DATA', payload: { type: 'income', category: 'شحن محفظة', amount: '', description: `إيداع ${w}`, method: walletKey, date: getLocalISODate(), month: selectedMonth, subType: 'deposit', status: 'paid' } });
dispatch({ type: 'SET_FORM_OPEN', payload: true });
}, [selectedMonth]);

const handleAddWalletWithdrawal = useCallback((walletKey) => {
const w = walletKey === 'fawry' ? 'فوري' : 'اتصالات';
dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', category: 'شحن محفظة', amount: '', description: `سحب من ${w}`, method: walletKey, date: getLocalISODate(), month: selectedMonth, subType: 'withdrawal', status: 'paid' } });
dispatch({ type: 'SET_FORM_OPEN', payload: true });
}, [selectedMonth]);

const exportWalletCSV = useCallback((walletKey) => {
const ledger = walletKey === 'fawry' ? fawryLedger : etisalatLedger;
const w = walletKey === 'fawry' ? 'فوري' : 'اتصالات';
const header = "التاريخ,النوع,الوصف,المبلغ,الرصيد\n";
const rows = ledger.map(t => `${t.date},${t.subType === 'deposit' ? 'إيداع' : 'سحب'},"${escapeHtml(t.description || '')}",${t.amount},${t.runningBalance}`).join("\n");
const blob = new Blob(["\uFEFF" + header + rows], { type: 'text/csv;charset=utf-8;' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url; a.download = `${w}_${new Date().toISOString().split('T')[0]}.csv`; a.click();
URL.revokeObjectURL(url);
addNotification({ type: 'success', title: 'تم التصدير' });
}, [fawryLedger, etisalatLedger, addNotification]);

// ===== Save Transaction =====
const handleSaveTransaction = useCallback((e) => {
e.preventDefault();
if (isProcessing) return;

const errors = {};
if (!formData.amount || Number(formData.amount) <= 0) errors.amount = 'مبلغ غير صحيح';
if (!formData.category) errors.category = 'اختر الفئة';
if (!formData.date) errors.date = 'اختر التاريخ';
if (Object.keys(errors).length > 0) {
dispatch({ type: 'SET_FORM_ERRORS', payload: errors });
addNotification({ type: 'error', title: 'خطأ', message: Object.values(errors)[0] });
return;
}

dispatch({ type: 'SET_IS_PROCESSING', payload: true });
if (data.closedMonths?.includes(formData.month)) {
addNotification({ type: 'error', title: 'تنبيه', message: `شهر ${formData.month} مغلق` });
dispatch({ type: 'SET_IS_PROCESSING', payload: false });
return;
}

setTimeout(() => {
try {
saveHistory();
let finalSubType = formData.subType;
if (['شحن رصيد فوري', 'شحن رصيد', 'إيداع', 'شحن محفظة'].includes(formData.category) && ['fawry', 'etisalat', 'cib_savings', 'aaib_savings'].includes(formData.method)) finalSubType = 'deposit';
else finalSubType = formData.subType || (formData.type === 'income' ? 'deposit' : 'withdrawal');

const status = formData.status || 'paid';
const selectedDay = formData.date.split('-')[2] || '01';
const targetMonthIdx = String(getMonthIndex(selectedMonth) + 1).padStart(2, '0');
const adjustedDate = `${selectedYear}-${targetMonthIdx}-${selectedDay}`;

const newTx = { ...formData, id: getSafeId(), amount: safeNumber(formData.amount), month: selectedMonth, monthIndex: getMonthIndex(selectedMonth), date: adjustedDate, subType: finalSubType, status };

let newTransactions = formMode === 'add' ? [...transactions, newTx] : transactions.map(t => t.id === formData.id ? { ...newTx, id: formData.id } : t);
newTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));

dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTransactions });
dispatch({ type: 'SET_FORM_OPEN', payload: false });
dispatch({ type: 'SET_REPEAT_MONTHS', payload: [] });
addNotification({ type: 'success', title: status === 'paid' ? '✅ تمت الإضافة والاعتماد' : '⏳ تم الحفظ كمعلق', message: `${formData.amount} ج.م` });
dispatch({ type: 'SET_IS_PROCESSING', payload: false });
} catch (error) {
addNotification({ type: 'error', title: 'خطأ' });
dispatch({ type: 'SET_IS_PROCESSING', payload: false });
}
}, 300);
}, [formData, formMode, selectedMonth, selectedYear, transactions, saveHistory, addNotification, isProcessing, data.closedMonths]);

// ===== Delete =====
const handleDelete = useCallback((id) => {
const target = transactions.find(t => t.id === id);
if (data.closedMonths?.includes(target?.month)) {
addNotification({ type: 'error', title: 'خطأ', message: 'لا يمكن الحذف من شهر مغلق' });
return;
}
dispatch({
type: 'SHOW_CONFIRM',
title: 'تأكيد الحذف',
message: 'هل أنت متأكد من حذف هذه العملية نهائياً؟',
onConfirm: () => {
const newTransactions = transactions.filter(t => t.id !== id);
dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTransactions });
db.collection("finance_2026").doc("user_ahmed_data").update({ transactions: newTransactions }).then(() => addNotification({ type: 'success', title: 'تم الحذف' }));
},
onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
});
}, [transactions, dispatch, addNotification, data.closedMonths]);

// ===== Quick Transfer =====
const handleQuickTransfer = useCallback((e) => {
e.preventDefault();
if (data.closedMonths?.includes(selectedMonth)) {
addNotification({ type: 'error', title: 'تنبيه', message: 'هذا الشهر مغلق' });
return;
}
dispatch({ type: 'SET_IS_PROCESSING', payload: true });
setTimeout(() => {
saveHistory();
const amount = safeNumber(quickTransferData.amount);
if (amount <= 0 || quickTransferData.from === quickTransferData.to) {
addNotification({ type: 'error', title: 'خطأ', message: 'تحقق من البيانات' });
dispatch({ type: 'SET_IS_PROCESSING', payload: false });
return;
}
const fromLabel = PAYMENT_METHODS.find(p => p.id === quickTransferData.from)?.label || quickTransferData.from;
const toLabel = PAYMENT_METHODS.find(p => p.id === quickTransferData.to)?.label || quickTransferData.to;
const fromTx = { id: 'qt-w-' + getSafeId(), type: 'expense', category: 'تحويلات', amount, description: `تحويل إلى ${toLabel}`, method: quickTransferData.from, date: getLocalISODate(), month: selectedMonth, monthIndex: getMonthIndex(selectedMonth), subType: 'withdrawal', status: 'paid' };
const toTx = { id: 'qt-d-' + getSafeId(), type: 'income', category: 'تحويلات واردة', amount, description: `تحويل من ${fromLabel}`, method: quickTransferData.to, date: getLocalISODate(), month: selectedMonth, monthIndex: getMonthIndex(selectedMonth), subType: 'deposit', status: 'paid' };
const newTransactions = [...transactions, fromTx, toTx].sort((a, b) => new Date(b.date) - new Date(a.date));
dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTransactions });
dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: 'cash', to: 'fawry', amount: 0 } });
addNotification({ type: 'success', title: 'تم التحويل', message: `${amount.toLocaleString()} ج.م` });
dispatch({ type: 'SET_IS_PROCESSING', payload: false });
}, 600);
}, [quickTransferData, selectedMonth, transactions, saveHistory, dispatch, addNotification, data.closedMonths]);

// ===== Manual Reconciliation =====
const handleManualReconciliation = useCallback((walletKey, actualAmount) => {
const calc = (key) => {
if (key === 'cash') return financeSnapshot.actualCashInHand;
if (key === 'fawry') return currentFawryBalance;
if (key === 'etisalat') return currentEtisalatBalance;
if (key === 'cib_savings') return getSavingsLedger('cib_savings')[0]?.runningBalance || 185968.65;
if (key === 'aaib_savings') return getSavingsLedger('aaib_savings')[0]?.runningBalance || 5098.01;
return 0;
};
const currentBalance = calc(walletKey);
const difference = safeNumber(actualAmount) - currentBalance;
if (!actualAmount || difference === 0) {
addNotification({ type: 'info', title: 'مطابقة', message: 'الرصيد مطابق' });
return;
}
if (data.closedMonths?.includes(selectedMonth)) {
addNotification({ type: 'error', title: 'تنبيه', message: 'الشهر مغلق' });
return;
}
dispatch({
type: 'SHOW_CONFIRM',
title: 'تأكيد التسوية',
message: `سيتم ${difference > 0 ? 'إيداع' : 'خصم'} ${Math.abs(difference).toLocaleString()} ج.م`,
onConfirm: () => {
saveHistory();

{!isPaid && loan.monthlyInstallment > 0 && (

{recurringItems.length > 0 && (

{paidArchive.length > 0 && (
<details className="group">

<div className="min-w-0 flex-1 pl-4">

// ===== Strategic Planner =====
const renderStrategicPlanner = () => {
const currentMonthIdx = ALL_MONTHS.indexOf(selectedMonth);
const monthsRemaining = ALL_MONTHS.slice(currentMonthIdx);
let runningLiquidity = financeSnapshot.actualCashInHand;
let simLoans = JSON.parse(JSON.stringify(updatedLoans));
let simCards = cards.map(c => {
const h = calculateCardHistory(c);
return { ...c, currentDebt: h.find(x => x.month === selectedMonth)?.closingDebt || 0 };
});
const projection = monthsRemaining.map(month => {
let loanPays = 0;
simLoans = simLoans.map(l => {
const p = Math.min(l.remaining, safeNumber(l.monthlyInstallment));
loanPays += p;
return { ...l, remaining: l.remaining - p };
});
const cardPays = simCards.reduce((s, c) => s + c.currentDebt, 0);
simCards = simCards.map(c => ({ ...c, currentDebt: 0 }));
const outflow = loanPays + cardPays;
const netIncome = financeSnapshot.actualIncome - financeSnapshot.cashExpenses;
const opening = runningLiquidity;
runningLiquidity = opening + netIncome - outflow;
const remainDebt = simLoans.reduce((s, l) => s + l.remaining, 0);
return { month, opening, outflow, running: runningLiquidity, remainDebt, danger: runningLiquidity < 0 };
});

return (
<div className="space-y-8 animate-fadeIn pb-24">
<div className="glass p-8 rounded-2xl gradient-border">
<h2 className="text-3xl font-black flex items-center gap-3"><Target className="text-emerald-400" size={32} /> المخطط الاستراتيجي {selectedYear}</h2>
<p className="text-slate-400 mt-2 font-bold">محاكاة ذكية للتدفق النقدي وإهلاك المديونيات</p>
</div>
<div className="glass rounded-2xl overflow-hidden">
<div className="overflow-x-auto">

<tr className="text-slate-500 font-bold">
<th className="p-4">الشهر</th>
<th className="p-4">السيولة الافتتاحية</th>
<th className="p-4 text-rose-500">التزامات</th>
<th className="p-4 text-emerald-600">صافي السيولة</th>
<th className="p-4">المديونية المتبقية</th>
<th className="p-4 text-center">الأمان</th>
</tr>
</thead>
<tbody className="divide-y dark:divide-slate-800">
{projection.map(row => (
<tr key={row.month} className="hover:bg-slate-50 dark:hover:bg-slate-800/30">
<td className="p-4 font-black">{row.month}</td>
<td className="p-4 font-mono text-slate-500">{Math.round(row.opening).toLocaleString()}</td>
<td className="p-4 font-mono text-rose-500 font-bold">-{Math.round(row.outflow).toLocaleString()}</td>
<td className={`p-4 font-mono font-black ${row.danger ? 'text-red-600 bg-red-50/50' : 'text-emerald-600 bg-emerald-50/20'}`}>{Math.round(row.running).toLocaleString()}</td>
<td className="p-4 font-mono text-slate-600">{Math.round(row.remainDebt).toLocaleString()}</td>
<td className="p-4 text-center">
{row.danger ? <span className="px-3 py-1 bg-red-100 text-red-600 rounded-lg text-[10px] font-black">عجز</span> :
row.running < 10000 ? <span className="px-3 py-1 bg-amber-100 text-amber-600 rounded-lg text-[10px] font-black">انتباه</span> :
<span className="px-3 py-1 bg-emerald-100 text-emerald-600 rounded-lg text-[10px] font-black">مستقر</span>}
</td>
</tr>
))}
</tbody>
</table>
</div>
</div>
</div>
);
};

// ===== Calendar View =====
const renderCalendarView = () => {
const agendaItems = getAgendaItems();
const [filterCat, setFilterCat] = useState('all');
const filtered = filterCat === 'all' ? agendaItems : agendaItems.filter(i => {
if (filterCat === 'loans') return i.title.includes('قسط') || i.title.includes('عقاري');
if (filterCat === 'cards') return i.title.includes('بطاقة');
if (filterCat === 'personal') return i.title.includes('محمود') || i.title.includes('سلفة') || i.title.includes('جامعة') || i.title.includes('مدرسة') || i.title.includes('تقويم');
if (filterCat === 'recurring') return i.desc === 'التزام شهري متكرر';
return true;
});
const grouped = filtered.reduce((acc, item) => {
const monthName = new Date(item.date).toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });
if (!acc[monthName]) acc[monthName] = [];
acc[monthName].push(item);
return acc;
}, {});
const totalAmount = filtered.reduce((s, i) => s + safeNumber(i.amount), 0);
const urgentCount = filtered.filter(i => { const d = calculateDaysLeft(i.date); return d !== null && d <= 7 && d >= 0; }).length;
const filters = [
{ id: 'all', label: 'الكل', icon: Layers },
{ id: 'loans', label: 'قروض', icon: Banknote },
{ id: 'cards', label: 'بطاقات', icon: CreditCard },
{ id: 'personal', label: 'شخصي', icon: Users },
{ id: 'recurring', label: 'شهري', icon: Repeat }
];

<div className="p-4 bg-blue-50 dark:bg-blue-900/20 text-blue-600 rounded-2xl"><Calendar size={28} /></div>
</div>
<div className="glass p-6 rounded-2xl border-r-4 border-r-red-500 flex items-center justify-between">
<div><p className="text-[10px] font-bold text-slate-400 uppercase">مستحقة قريباً</p><p className="text-3xl font-black text-red-600 mt-1">{urgentCount}</p></div>
<div className="p-4 bg-red-50 dark:bg-red-900/20 text-red-600 rounded-2xl"><AlertTriangle size={28} /></div>
</div>
<div className="glass p-6 rounded-2xl border-r-4 border-r-emerald-500 flex items-center justify-between">
<div><p className="text-[10px] font-bold text-slate-400 uppercase">إجمالي المبالغ</p><p className="text-2xl font-black text-emerald-600 mt-1">{totalAmount.toLocaleString()}</p></div>
<div className="p-4 bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 rounded-2xl"><Coins size={28} /></div>
</div>
</div>

<div className="glass p-4 rounded-2xl no-print">
<div className="flex gap-2 overflow-x-auto scroll-hide">
{filters.map(f => {
const Icon = f.icon;
const isActive = filterCat === f.id;
return (
<button key={f.id} onClick={() => setFilterCat(f.id)} className={`flex-shrink-0 px-5 py-3 rounded-xl text-sm font-bold flex items-center gap-2 ${isActive ? 'gradient-bg-primary text-white shadow-md scale-105' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}`}>
<Icon size={16} /> {f.label}
</button>
);
})}
</div>
</div>

{Object.keys(grouped).length === 0 ? (
<div className="glass p-20 text-center rounded-2xl">
<Calendar size={60} className="text-slate-300 mx-auto mb-4" />
<p className="text-slate-400 font-bold">لا توجد مواعيد</p>
