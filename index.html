/* ═══════════════ PIN LOCK SCREEN ═══════════════ */
const PinLockScreen = ({ onSuccess, onLogout }) => {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const [success, setSuccess] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const [lastPressed, setLastPressed] = useState(null);
  const pressTimerRef = useRef(null);
  const clearTimerRef = useRef(null);
  const navTimerRef = useRef(null);

  useEffect(() => {
    return () => {
      if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
      if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
      if (navTimerRef.current) clearTimeout(navTimerRef.current);
    };
  }, []);

  const handleDigit = (d) => {
    if (pin.length >= 4 || success) return;
    const next = pin + d;
    setPin(next); 
    setLastPressed(d);
    
    if (navigator.vibrate) navigator.vibrate(8);
    
    if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    pressTimerRef.current = setTimeout(() => setLastPressed(null), 150);
    
    if (next.length === 4) {
      if (navTimerRef.current) clearTimeout(navTimerRef.current);
      navTimerRef.current = setTimeout(async () => {
        const ok = await verifyPin(next);
        if (ok) { 
          setSuccess(true); 
          if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
          if (navTimerRef.current) clearTimeout(navTimerRef.current); 
          navTimerRef.current = setTimeout(() => onSuccess(), 450); 
        }
        else {
          setError(true); 
          if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
          setAttempts(a => a + 1);
          if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
          clearTimerRef.current = setTimeout(() => { setPin(''); setError(false); }, 650);
        }
      }, 150);
    }
  };
  
  const handleDelete = () => { if (!success) setPin(p => p.slice(0, -1)); };
  
  return (
    <div className="min-h-screen flex items-center justify-center p-6 relative overflow-hidden" style={{ background: 'linear-gradient(135deg, #050A14 0%, #0A1628 40%, #1E2B4A 100%)' }}>
      <div className={`relative w-full max-w-sm ${error ? 'animate-shake' : ''}`}>
        <div className="flex flex-col items-center mb-8">
          <div className={`w-20 h-20 rounded-3xl flex items-center justify-center mb-5 transition-all duration-500 ${success ? 'bg-emerald-500 scale-110 shadow-2xl shadow-emerald-500/40' : error ? 'bg-red-500/20 border-2 border-red-500/30' : 'bg-[rgba(99,91,255,0.15)] border-2 border-[rgba(99,91,255,0.3)]'}`}>
            {success ? <CheckCircle2 size={32} className="text-white" /> : error ? <AlertTriangle size={30} className="text-red-400" /> : <Lock size={30} className="text-[#8B84FF]" />}
          </div>
          <h1 className="text-2xl font-black text-white mb-1.5">
            {success ? 'مرحباً ✓' : error ? 'رمز غير صحيح' : 'أهلاً بعودتك'}
          </h1>
          <p className="text-xs font-medium" style={{ color: '#64748B' }}>
            {success ? 'جارٍ الفتح...' : error ? `المحاولة ${attempts}` : 'أدخل رمز الدخول'}
          </p>
        </div>
        <div className="flex justify-center gap-3 mb-8 h-4">
          {[0, 1, 2, 3].map(i => (
            <div 
              key={i} 
              className={`w-3 h-3 rounded-full transition-all duration-300 ${success ? 'bg-emerald-400 scale-125' : error ? 'bg-red-500 scale-110' : pin.length > i ? 'bg-[#8B84FF] scale-125' : 'bg-transparent border-2 border-slate-600'}`}
            ></div>
          ))}
        </div>
        <div className="grid grid-cols-3 gap-3 mb-6">
          {['1','2','3','4','5','6','7','8','9'].map(d => (
            <button 
              key={d} 
              type="button" 
              onClick={() => handleDigit(d)} 
              className={`aspect-square rounded-2xl font-black text-xl transition-all duration-100 active:scale-90 select-none ${lastPressed === d ? 'bg-[#635BFF] text-white scale-95' : 'bg-white/[0.05] border border-white/[0.08] text-white hover:bg-white/[0.1]'}`}
            >{d}</button>
          ))}
          <div className="aspect-square"></div>
          <button 
            type="button" 
            onClick={() => handleDigit('0')} 
            className={`aspect-square rounded-2xl font-black text-xl transition-all duration-100 active:scale-90 select-none ${lastPressed === '0' ? 'bg-[#635BFF] text-white scale-95' : 'bg-white/[0.05] border border-white/[0.08] text-white hover:bg-white/[0.1]'}`}
          >0</button>
          <button 
            type="button" 
            onClick={handleDelete} 
            className="aspect-square rounded-2xl flex items-center justify-center transition-all active:scale-90" 
            style={{ color: '#64748B' }}
          ><Delete size={20} /></button>
        </div>
        <button 
          type="button" 
          onClick={onLogout} 
          className="w-full py-3 text-xs font-bold flex items-center justify-center gap-2 transition-colors" 
          style={{ color: '#64748B' }}
        ><LogOut size={14} /> تسجيل الخروج</button>
        <button
          type="button"
          onClick={() => {
            if (window.confirm('هل تريد إعادة تعيين الرمز؟ ستحتاج إعادة تسجيل الدخول.')) {

              sessionStorage.removeItem('pin_verified');
              onLogout();

          }}
          className="w-full py-2 text-[10px] font-bold"
          style={{ color: '#64748B' }}
        >

        </button>
      </div>
    </div>
  );
};

/* ═══════════════ PIN CHANGE MODAL ═══════════════ */
const PinChangeModal = ({ onClose, addNotification }) => {
  const [current, setCurrent] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [busy, setBusy] = useState(false);
  
  const submit = async () => {
    if (!/^\d{4}$/.test(next)) { 
      addNotification({ type: 'error', title: 'الرمز الجديد لازم 4 أرقام' }); 
      return; 
    }
    if (next !== confirm) { 
      addNotification({ type: 'error', title: 'الرمز الجديد مش متطابق' }); 
      return; 
    }
    setBusy(true);
    try {
      const ok = await verifyPin(current);
      if (!ok) { 
        addNotification({ type: 'error', title: 'الرمز الحالي غير صحيح' }); 
        setBusy(false); 
        return; 
      }
      await savePinHash(next);
      addNotification({ type: 'success', title: 'تم تغيير الرمز بنجاح' });
      setBusy(false);
      onClose();
    } catch (e) {
      addNotification({ type: 'error', title: 'فشل', message: e.message });
      setBusy(false);
    }
  };
  
  return (
    <Modal isOpen={true} onClose={onClose} title="تغيير رمز الدخول" icon="🔐">
      <div className="space-y-3">
        <div>
          <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الرمز الحالي</label>
          <input type="password" inputMode="numeric" maxLength={4} className="input-field input-num text-center text-lg tracking-widest" value={current} onChange={e => setCurrent(e.target.value.replace(/\D/g, ''))} />
        </div>
        <div>
          <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الرمز الجديد</label>
          <input type="password" inputMode="numeric" maxLength={4} className="input-field input-num text-center text-lg tracking-widest" value={next} onChange={e => setNext(e.target.value.replace(/\D/g, ''))} />
        </div>
        <div>
          <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>تأكيد الرمز الجديد</label>
          <input type="password" inputMode="numeric" maxLength={4} className="input-field input-num text-center text-lg tracking-widest" value={confirm} onChange={e => setConfirm(e.target.value.replace(/\D/g, ''))} />
        </div>
        <button onClick={submit} disabled={busy} className="btn btn-primary w-full py-2.5 text-sm">
          {busy ? 'جاري الحفظ...' : 'حفظ'}
        </button>
      </div>
    </Modal>
  );
};

/* ═══════════════ SMS PARSER MODAL ═══════════════ */
const SmsParserModal = memo(({ isOpen, onClose, dispatch, addNotification, saveHistory, data }) => {
  const [rawText, setRawText] = useState('');
  const [parsed, setParsed] = useState(null);
  const [category, setCategory] = useState('');
  const [method, setMethod] = useState('cash');
  const [manualAmount, setManualAmount] = useState('');

  useEffect(() => { 
    if (!isOpen) { 
      setRawText(''); 
      setParsed(null); 
      setCategory(''); 
      setMethod('cash'); 
      setManualAmount(''); 
    } 
  }, [isOpen]);

  const handlePaste = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.readText) {
        const txt = await navigator.clipboard.readText();
        if (txt && txt.trim()) { 
          setRawText(txt); 
          addNotification({ type: 'success', title: 'تم اللصق', duration: 2000 }); 
          return; 
        }
      }
      addNotification({ type: 'info', title: 'الصق الرسالة يدوياً في الصندوق' });
    } catch (e) { 
      addNotification({ type: 'info', title: 'الصق الرسالة يدوياً في الصندوق' }); 
    }
  };

  const handleAnalyze = () => {
    if (!rawText.trim()) { 
      addNotification({ type: 'error', title: 'الصق رسالة البنك أولاً' }); 
      return; 
    }
    const res = parseBankSms(rawText);
    setParsed(res);
    if (res.method) setMethod(res.method);
    if (res.amount > 0) setManualAmount(String(res.amount));
    if (res.ok) {
      const cardInfo = res.cardLabel ? ` • ${res.cardLabel}` : '';
      addNotification({ 
        type: 'success', 
        title: `تم التحليل: ${fmt(res.amount)} ج.م`, 
        message: `${res.type === 'income' ? 'دخل' : 'مصروف'} • ${res.bank || 'بنك'}${cardInfo}`, 
        duration: 5000 
      });
    } else { 
      addNotification({ type: 'warning', title: 'تحليل جزئي', message: res.notes.join(' • ') }); 
    }
  };

  const handleSave = () => {
    const amt = parseNumberInput(manualAmount);
    if (!amt || amt <= 0) { 
      addNotification({ type: 'error', title: 'أدخل مبلغ صالح' }); 
      return; 
    }
    if (!category) { 
      addNotification({ type: 'error', title: 'اختر الفئة' }); 
      return; 
    }
    const d = parseISODate(parsed.date) || new Date();
    const year = d.getFullYear();
    const month = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, year, month)) { 
      addNotification({ type: 'error', title: `شهر ${month} ${year} مغلق`, message: 'افتح الشهر أو غيّر التاريخ' }); 
      return; 
    }
    saveHistory();
    const newTx = {
      id: getSafeId(), 
      type: parsed.type, 
      subType: parsed.subType, 
      kind: KIND.OPERATIONAL,
      category, 
      amount: roundMoney(amt), 
      description: parsed.description || 'SMS import',
      method, 
      date: parsed.date, 
      month, 
      year, 
      monthIndex: d.getMonth(),
      status: 'pending', 
      source: 'sms', 
      smsRawText: parsed.rawText, 
      smsBank: parsed.bank,
      linkedCardId: parsed.linkedCardId || undefined,
      cardLast4: parsed.last4 || undefined,
      accountKind: parsed.accountKind || undefined,
      createdAt: new Date().toISOString()
    };
    dispatch({ 
      type: 'UPDATE_TRANSACTIONS', 
      payload: [newTx, ...(data.transactions || [])].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) 
    });
    addNotification({ type: 'success', title: 'تم الحفظ كمعلق', message: 'راجعها واعتمدها من صفحة المعاملات', duration: 5000 });
    onClose();
  };

  if (!isOpen) return null;

  return (
    <Modal isOpen={true} onClose={onClose} title="تحليل رسالة بنك" icon="📱" size="lg">
      <div className="space-y-3">
        <div>
          <div className="flex justify-between items-center mb-1.5">
            <label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الصق رسالة البنك هنا</label>
            <button type="button" onClick={handlePaste} className="text-[11px] font-black text-[color:var(--accent)] flex items-center gap-1">📋 لصق تلقائي</button>
          </div>
          <textarea 
            className="input-field text-xs leading-relaxed font-semibold" 
            rows={6}
            placeholder="مثال: CIB: Purchase of EGP 1500.00 on card ending 9380 at CARREFOUR on 17/09/2026"
            value={rawText} 
            onChange={e => setRawText(e.target.value)} 
            dir="auto" 
          />
          <p className="text-[10px] mt-1.5 leading-relaxed" style={{ color: 'var(--text-muted)' }}>
            💡 يدعم: 1016 (Titanium) • 9380/9352/2014 (فرعية) • 3391 (Signature) • 2017 (SWYPE) • 1809 (CIB Saving) • 2106 (AAIB Saving)
            <br />🛡️ يرفض رسائل OTP تلقائياً
          </p>
        </div>
        <button type="button" onClick={handleAnalyze} disabled={!rawText.trim()} className="btn btn-primary w-full py-2.5 text-sm">
          <Sparkles size={14} /> حلّل الرسالة
        </button>
        {parsed && (
          <div className="space-y-3 pt-3 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            <div className={`p-3 rounded-lg ${parsed.ok ? 'bg-emerald-50 dark:bg-emerald-950/30' : 'bg-amber-50 dark:bg-amber-950/30'}`}>
              <div className="flex items-center gap-2 mb-2">
                {parsed.ok ? <CheckCircle2 size={16} className="text-emerald-600" /> : <AlertTriangle size={16} className="text-amber-600" />}
                <span className={`font-black text-sm ${parsed.ok ? 'text-emerald-700 dark:text-emerald-400' : 'text-amber-700 dark:text-amber-400'}`}>
                  {parsed.ok ? 'تم استخراج البيانات' : 'استخراج جزئي'}
                </span>
              </div>
              <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 text-xs">
                <div><span style={{ color: 'var(--text-muted)' }}>المبلغ:</span> <strong className="money tabular">{parsed.amount ? fmt(parsed.amount) + ' ج.م' : '—'}</strong></div>
                <div><span style={{ color: 'var(--text-muted)' }}>النوع:</span> <strong>{parsed.type === 'income' ? 'دخل 💰' : 'مصروف 💸'}</strong></div>
                <div><span style={{ color: 'var(--text-muted)' }}>البنك:</span> <strong>{parsed.bank || '—'}</strong></div>
                <div><span style={{ color: 'var(--text-muted)' }}>البطاقة/الحساب:</span> <strong>{parsed.cardLabel || (parsed.last4 ? '••••' + parsed.last4 : '—')}</strong></div>
                <div><span style={{ color: 'var(--text-muted)' }}>التاريخ:</span> <strong>{parsed.date}</strong></div>
                {parsed.balance && <div><span style={{ color: 'var(--text-muted)' }}>الرصيد:</span> <strong className="money tabular">{fmt(parsed.balance)}</strong></div>}
              </div>
              {parsed.notes.length > 0 && (
                <div className="mt-2 pt-2 space-y-0.5" style={{ borderTop: '1px dashed var(--border-default)' }}>
                  {parsed.notes.map((n, i) => (<p key={i} className="text-[10px] leading-relaxed" style={{ color: 'var(--text-secondary)' }}>• {n}</p>))}
                </div>
              )}
            </div>
            <div>
              <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>المبلغ (راجعه) *</label>
              <input type="text" inputMode="decimal" className="input-field input-num text-base text-center py-2.5" style={{ color: 'var(--accent)' }} value={manualAmount} onChange={e => setManualAmount(e.target.value)} placeholder="0.00" />
            </div>
            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الفئة *</label>
                <select className="input-field text-xs py-2" value={category} onChange={e => setCategory(e.target.value)}>
                  <option value="">اختر...</option>
                  {Object.entries(CATEGORY_GROUPS[parsed.type]).map(([g, items]) => (
                    <optgroup key={g} label={g}>{items.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>
                  ))}
                </select>
              </div>
              <div>
                <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>طريقة الدفع</label>
                <select className="input-field text-xs py-2" value={method} onChange={e => setMethod(e.target.value)}>
                  {PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                </select>
              </div>
            </div>
            <button type="button" onClick={handleSave} disabled={!manualAmount || !category} className="btn btn-primary w-full py-2.5 text-sm">
              <Save size={14} /> حفظ كمعلق
            </button>
          </div>
        )}
      </div>
    </Modal>
  );
});

/* ═══════════════ PENDING CLOSE MODAL ═══════════════ */
const PendingCloseModal = memo(({ data, onClose, onAction }) => {
  const [expanded, setExpanded] = useState(true);
  const pending = data.pending || [];
  const totalIncome = pending.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
  const totalExpense = pending.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
  
  return (
    <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="generic-modal max-w-lg">
        <div className="generic-modal-header">
          <h3 className="text-base font-black flex items-center gap-2">
            <AlertTriangle size={18} className="text-amber-500" /> عمليات معلقة قبل الإقفال
          </h3>
          <button onClick={onClose} className="btn btn-ghost p-1.5"><X size={16} /></button>
        </div>
        <div className="generic-modal-body">
          <div className="p-3 rounded-lg bg-amber-50 dark:bg-amber-950/30 mb-4">
            <p className="text-xs font-bold text-amber-700 dark:text-amber-400 mb-2">
              ⚠️ يوجد <strong>{pending.length}</strong> عملية معلقة في شهر {data.month} {data.year}

            <div className="flex gap-3 text-[11px] font-bold flex-wrap">

              {totalExpense > 0 && <span className="text-red-700 dark:text-red-400 money tabular">مصروف متوقع: −{fmt(totalExpense)}</span>}
            </div>
            <p className="text-[11px] mt-2 leading-relaxed" style={{ color: 'var(--text-secondary)' }}>
              العمليات المعلقة <strong>لا تؤثر على الرصيد الحي</strong>. اختر كيف تريد معالجتها قبل الإقفال.

          </div>
          <button type="button" onClick={() => setExpanded(!expanded)} className="w-full flex justify-between items-center p-2 rounded-lg mb-2 text-xs font-bold" style={{ background: 'var(--bg-muted)' }}>
            <span>📋 تفاصيل العمليات</span>
            <ChevronDown size={14} className={expanded ? 'rotate-180 transition-transform' : 'transition-transform'} />
          </button>
          {expanded && (
            <div className="max-h-56 overflow-y-auto space-y-1.5 mb-3">

                <div key={t.id} className="flex justify-between items-center p-2 rounded-lg text-xs" style={{ background: 'var(--bg-muted)' }}>
                  <div className="flex items-center gap-2 min-w-0 flex-1">
                    <span className={`p-1 rounded text-[10px] font-black ${t.type === 'income' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-400' : 'bg-red-100 text-red-700 dark:bg-red-950/50 dark:text-red-400'}`}>
                      {t.type === 'income' ? 'دخل' : 'مصروف'}
                    </span>
                    <div className="min-w-0">
                      <p className="font-bold truncate">{t.description || t.category}</p>
                      <p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>{t.date} • {t.category}</p>
                    </div>
                  </div>
                  <span className={`font-black flex-shrink-0 money tabular ${t.type === 'income' ? 'text-emerald-600' : 'text-red-600'}`}>
                    {t.type === 'income' ? '+' : '−'}{fmt(t.amount)}
                  </span>
                </div>

          )}
        </div>
        <div className="generic-modal-footer flex-col gap-2">
          <button onClick={() => onAction('approve')} className="w-full py-3 rounded-lg bg-emerald-500 text-white font-bold text-sm flex items-center justify-center gap-2 hover:bg-emerald-600 active:scale-[0.98]">
            <CheckCircle2 size={16} /> اعتماد الكل ثم إقفال ({pending.length})
          </button>
          <button onClick={() => onAction('carry')} className="w-full py-3 rounded-lg bg-blue-500 text-white font-bold text-sm flex items-center justify-center gap-2 hover:bg-blue-600 active:scale-[0.98]">
            <Calendar size={16} /> ترحيل للشهر التالي ثم إقفال
          </button>
          <button onClick={() => onAction('delete')} className="w-full py-3 rounded-lg bg-red-500 text-white font-bold text-sm flex items-center justify-center gap-2 hover:bg-red-600 active:scale-[0.98]">

/* ═══════════════ DASHBOARD VIEW ═══════════════ */
const DashboardView = memo(({ 
  data, financeSnapshot, liveBalances, totalLiquidity, walletVisibility, 
  onToggleVisibility, dispatch, selectedYear, selectedMonth, transactions, 
  cards, updatedLoans, chartData, isDarkMode, addNotification, 
  onSelectYear, onSelectMonth, custodySummary, monthCashback, bankFeesMonth 
}) => {
  const totalCardDebt = useMemo(() => 
    cards.reduce((s, c) => s + Math.max(0, computeCardDebt(data, c)), 0), [cards, data]);
  const totalLoanDebt = useMemo(() => 
    updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const grandTotalDebt = totalCardDebt + totalLoanDebt;
  const netPosition = totalLiquidity - grandTotalDebt;
  
  const monthPendingCount = transactions.filter(t => 
    t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status !== 'paid'
  ).length;

  const pieData = useMemo(() => {
    const acc = {};
    transactions.filter(t => 
      t.type === 'expense' && t.month === selectedMonth && (t.year || 2026) === selectedYear 
      && t.status === 'paid' && safeNumber(t.amount) > 0
    ).forEach(t => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); });
    const sorted = Object.entries(acc).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
    if (sorted.length <= 5) return sorted;
    const top = sorted.slice(0, 4);
    const restVal = sorted.slice(4).reduce((s, i) => s + i.value, 0);
    return [...top, { name: 'أخرى', value: restVal }];
  }, [transactions, selectedMonth, selectedYear]);

  const net = financeSnapshot;
  const isDataEmpty = !transactions.length && !cards.some(c => safeNumber(c.limit) > 0);

  const openAddForm = (type) => {
    dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
    dispatch({ 
      type: 'SET_FORM_DATA', 
      payload: { 
        type, 
        amount: '', 
        date: getLocalISODate(), 
        method: type === 'income' ? 'cib_savings' : 'cash', 
        subType: type === 'income' ? 'deposit' : 'withdrawal', 
        category: '', 
        status: 'pending' 
      } 
    });
    dispatch({ type: 'SET_FORM_OPEN', payload: true });
  };

  return (
    <div className="space-y-4 animate-fadeIn">
      <WelcomeHero 
        netPosition={netPosition}
        totalLiquidity={totalLiquidity}
        totalDebt={grandTotalDebt}
        onTransfer={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: true })}
        onAddIncome={() => openAddForm('income')}
        onAddExpense={() => openAddForm('expense')}
      />

      {isDataEmpty && (
        <div className="card" style={{ background: 'var(--accent-soft)', borderColor: 'var(--accent)' }}>
          <div className="flex items-start gap-3">
            <div className="p-2 rounded-xl" style={{ background: 'var(--accent)', color: 'white' }}>
              <Sparkles size={18} />
            </div>
            <div className="flex-1">
              <h3 className="font-black text-sm mb-1" style={{ color: 'var(--accent)' }}>أهلاً بك في V84</h3>
              <p className="text-[11px] leading-relaxed" style={{ color: 'var(--text-secondary)' }}>
                ابدأ بإدخال أرصدة حساباتك من <strong>الإعدادات → الحسابات</strong> ثم أضف أول معاملة
              </p>
            </div>
          </div>
        </div>
      )}

      {monthPendingCount > 0 && (
        <button 
          onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'transactions' })}
          className="card w-full text-right active:scale-[0.99] transition-transform"
          style={{ background: 'var(--warning-soft)', borderColor: 'var(--warning)' }}
        >
          <div className="flex items-center gap-3">
            <div className="p-2 rounded-xl bg-amber-100 dark:bg-amber-950/40 text-amber-600">
              <Clock size={16} />
            </div>
            <div className="flex-1">
              <p className="text-xs font-black text-amber-700 dark:text-amber-400">
                {monthPendingCount} عملية معلقة
              </p>
              <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>
                في {selectedMonth} — اضغط للمراجعة
              </p>
            </div>
            <ChevronLeft size={16} style={{ color: 'var(--text-muted)' }} />
          </div>
        </button>
      )}

      <div className="flex gap-2">
        <button onClick={() => openAddForm('expense')} className="quick-action">
          <div className="quick-action-icon" style={{ background: 'linear-gradient(135deg, #DC2626 0%, #B91C1C 100%)' }}>
            <ArrowUp size={18} />
          </div>
          <span className="text-[10px] font-black">مصروف</span>
        </button>
        <button onClick={() => openAddForm('income')} className="quick-action">
          <div className="quick-action-icon" style={{ background: 'linear-gradient(135deg, #00A86B 0%, #059669 100%)' }}>
            <ArrowDown size={18} />
          </div>
          <span className="text-[10px] font-black">دخل</span>
        </button>
        <button onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: true })} className="quick-action">
          <div className="quick-action-icon" style={{ background: 'linear-gradient(135deg, #635BFF 0%, #4A42E5 100%)' }}>
            <ArrowLeftRight size={18} />
          </div>
          <span className="text-[10px] font-black">تحويل</span>
        </button>
        <button onClick={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: true })} className="quick-action">
          <div className="quick-action-icon" style={{ background: 'linear-gradient(135deg, #F59E0B 0%, #D97706 100%)' }}>
            <MessageSquare size={18} />
          </div>
          <span className="text-[10px] font-black">SMS</span>
        </button>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <EnhancedStatCard 
          title="الكاش في الجيب" 
          amount={net.actualCashInHand} 
          icon={Wallet} 
          subtitle="حسب آخر تحديث" 
          isPrivate={!walletVisibility.cash} 
          color="emerald" 
        />
        <EnhancedStatCard 
          title="دخل محصل" 
          amount={net.actualIncome} 
          icon={TrendingUp} 
          subtitle={net.pendingIncome > 0 ? `+${fmt(net.pendingIncome)} معلق` : ''} 
          color="emerald" 
        />
        <EnhancedStatCard 
          title="مصاريف معلقة" 
          amount={-net.pendingExpensesAll} 
          icon={Clock} 
          subtitle={`مدفوع: ${fmt(net.paidExpensesAll)}`} 
          color="red" 
        />
        <button 
          onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'financial-forecast' })} 
          className="stat-card text-right active:scale-95"
        >
          <div className="flex justify-between items-start mb-2">
            <div>
              <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>توقع القادم</p>
              <h3 className={`text-lg font-black money tabular ${net.projectedClosingBalance >= 0 ? 'text-blue-600' : 'text-red-600'}`}>
                {fmt(net.projectedClosingBalance)}
              </h3>
              <p className="text-[10px] mt-1" style={{ color: 'var(--text-muted)' }}>شامل المعلقات</p>
            </div>
            <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400">
              <LineChart size={16} />
            </div>
          </div>
        </button>
      </div>

      <div className="grid grid-cols-3 gap-2">
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'loans' })} className="card card-hover py-3 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1.5">
            <Briefcase size={12} className="text-blue-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>عهدة</span>
          </div>
          <p className={`text-sm font-black money tabular ${custodySummary?.balance > 0 ? 'text-blue-600' : custodySummary?.balance < 0 ? 'text-red-600' : 'text-emerald-600'}`}>
            {fmt(custodySummary?.balance || 0)}
          </p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'cards' })} className="card card-hover py-3 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1.5">
            <Gift size={12} className="text-emerald-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>كاش باك</span>
          </div>
          <p className="text-sm font-black text-emerald-600 money tabular">
            {fmt(monthCashback?.received || 0)}
          </p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'transactions' })} className="card card-hover py-3 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1.5">
            <Receipt size={12} className="text-red-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>رسوم</span>
          </div>
          <p className="text-sm font-black text-red-600 money tabular">
            {fmt(bankFeesMonth || 0)}
          </p>
        </button>
      </div>

      <QuickBalanceOverview 
        balances={liveBalances} 
        walletVisibility={walletVisibility} 
        onToggleVisibility={onToggleVisibility} 
      />
      
      <MonthSelector 
        selectedYear={selectedYear} 
        selectedMonth={selectedMonth} 
        onSelectYear={onSelectYear} 
        onSelectMonth={onSelectMonth} 
      />

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
        <div className="card">
          <h3 className="font-black text-sm mb-3 flex items-center gap-2">
            <BarChart3 className="text-[color:var(--accent)]" size={16} /> التدفق النقدي — {selectedYear}
          </h3>
          <div className="h-48">
            {chartData.every(d => d['دخل'] === 0 && d['مصروف'] === 0) ? (
              <div className="h-full flex flex-col items-center justify-center">
                <BarChart3 size={32} style={{ color: 'var(--text-muted)' }} />
                <p className="font-semibold text-xs mt-2" style={{ color: 'var(--text-muted)' }}>لا توجد بيانات بعد</p>
              </div>
            ) : (
              <ResponsiveContainer width="100%" height="100%">
                <AreaChart data={chartData}>
                  <defs>
                    <linearGradient id="incGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="#00A86B" stopOpacity={0.3} />
                      <stop offset="100%" stopColor="#00A86B" stopOpacity={0} />
                    </linearGradient>
                    <linearGradient id="expGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="#DC2626" stopOpacity={0.3} />
                      <stop offset="100%" stopColor="#DC2626" stopOpacity={0} />
                    </linearGradient>
                  </defs>
                  <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.06} />
                  <XAxis dataKey="name" fontSize={9} stroke="#94A3B8" />
                  <YAxis fontSize={9} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
                  <Tooltip 
                    formatter={(v) => `${fmt(v)} ج.م`} 
                    contentStyle={{ borderRadius: '12px', border: '1px solid var(--border-subtle)', backgroundColor: isDarkMode ? '#0D1524' : 'white', fontFamily: 'Cairo', fontSize: '12px' }} 
                  />
                  <Area type="monotone" dataKey="دخل" stroke="#00A86B" strokeWidth={2} fill="url(#incGrad)" />
                  <Area type="monotone" dataKey="مصروف" stroke="#DC2626" strokeWidth={2} fill="url(#expGrad)" />
                </AreaChart>
              </ResponsiveContainer>
            )}
          </div>
        </div>
        
        <div className="card">
          <h3 className="font-black text-sm mb-3 flex items-center gap-2">
            <PieChartIcon className="text-purple-500" size={16} /> توزيع مصروفات {selectedMonth}
          </h3>
          <div className="h-48">
            {pieData.length === 0 ? (
              <div className="h-full flex flex-col items-center justify-center">
                <PieChartIcon size={32} style={{ color: 'var(--text-muted)' }} />
                <p className="font-semibold text-xs mt-2" style={{ color: 'var(--text-muted)' }}>لا توجد مصروفات</p>
              </div>
            ) : (
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={pieData} cx="50%" cy="50%" innerRadius={50} outerRadius={80} paddingAngle={3} dataKey="value" cornerRadius={6}>
                    {pieData.map((e, i) => <Cell key={i} fill={CATEGORY_COLORS[e.name] || '#94A3B8'} stroke="none" />)}
                  </Pie>
                  <Tooltip 
                    formatter={(v) => `${fmt(v)} ج.م`} 
                    contentStyle={{ borderRadius: '12px', border: '1px solid var(--border-subtle)', backgroundColor: isDarkMode ? '#0D1524' : 'white', fontFamily: 'Cairo', fontSize: '12px' }} 
                  />
                  <Legend layout="vertical" verticalAlign="middle" align="right" iconType="circle" wrapperStyle={{ fontSize: '10px', fontWeight: 'bold' }} />
                </PieChart>
              </ResponsiveContainer>
            )}
          </div>
        </div>
      </div>
    </div>
  );
});
/* ═══════════════════════════════════════════════════════════════
   PART 4/6 — CategoryDetail + Transactions + Custody + Cashback + Loans
   V84 — Banking-Grade Edition
   ═══════════════════════════════════════════════════════════════ */

/* ═══════════════ CATEGORY DETAIL MODAL ═══════════════ */
const CategoryDetailModal = memo(({ category, transactions, selectedMonth, selectedYear, dispatch, addNotification }) => {
  const [filterType, setFilterType] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');
  const [exporting, setExporting] = useState(false);
  const containerRef = useRef(null);
  
  const categoryTx = useMemo(() => transactions.filter(t => 
    t.category === category && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)), [transactions, category, selectedMonth, selectedYear]);
  
  const filteredTx = useMemo(() => {
    let arr = categoryTx;
    if (filterType === 'paid') arr = arr.filter(t => t.status === 'paid');
    if (filterType === 'pending') arr = arr.filter(t => t.status !== 'paid');
    if (searchTerm.trim()) { 
      const term = normalizeText(searchTerm); 
      arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.method).includes(term)); 
    }
    return arr;
  }, [categoryTx, filterType, searchTerm]);
  
  const stats = useMemo(() => {
    const paid = categoryTx.filter(t => t.status === 'paid');
    const pending = categoryTx.filter(t => t.status !== 'paid');
    const totalPaid = paid.reduce((s, t) => s + safeNumber(t.amount), 0);
    const totalPending = pending.reduce((s, t) => s + safeNumber(t.amount), 0);
    const count = categoryTx.length;
    const average = count > 0 ? (totalPaid + totalPending) / count : 0;
    const methods = {};
    categoryTx.forEach(t => { methods[t.method] = (methods[t.method] || 0) + safeNumber(t.amount); });
    return { totalPaid, totalPending, total: totalPaid + totalPending, count, paidCount: paid.length, pendingCount: pending.length, average, methods };
  }, [categoryTx]);
  
  const dailyGroups = useMemo(() => groupTransactionsByDate(filteredTx), [filteredTx]);

  const handlePrint = () => {
    if (!containerRef.current) return;
    const printWindow = window.open('', '_blank', 'width=900,height=700');
    if (!printWindow) { 
      addNotification({ type: 'error', title: 'المتصفح منع الطباعة', message: 'اسمح بالنوافذ المنبثقة' }); 
      return; 
    }
    const html = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>${category} — ${selectedMonth} ${selectedYear}</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><style>* { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: 'Cairo', sans-serif; padding: 24px; color: #0A1628; background: white; } .header { text-align: center; padding-bottom: 16px; border-bottom: 3px solid #635BFF; margin-bottom: 20px; } .header h1 { font-size: 22px; font-weight: 900; color: #4A42E5; margin-bottom: 4px; } .header p { font-size: 13px; color: #475569; font-weight: 600; } .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; } .stat-box { background: #F1F5F9; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #E2E8F0; } .stat-box .label { font-size: 11px; font-weight: 700; color: #64748B; margin-bottom: 4px; } .stat-box .value { font-size: 16px; font-weight: 900; color: #0A1628; font-variant-numeric: tabular-nums; } .stat-box.green .value { color: #00A86B; } .stat-box.amber .value { color: #F59E0B; } table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; } th { background: #635BFF; color: white; padding: 10px 8px; text-align: right; font-weight: 700; } td { padding: 8px; border-bottom: 1px solid #E2E8F0; font-variant-numeric: tabular-nums; } tr:nth-child(even) td { background: #F8FAFC; } td.amount-income { color: #00A86B; font-weight: 900; } td.amount-expense { color: #DC2626; font-weight: 900; } td.status-paid { color: #00A86B; font-weight: 700; font-size: 10px; } td.status-pending { color: #F59E0B; font-weight: 700; font-size: 10px; } .footer { margin-top: 30px; padding-top: 12px; border-top: 2px dashed #CBD5E1; text-align: center; font-size: 10px; color: #94A3B8; } .day-header-row td { background: #EEEDFF !important; font-weight: 900; color: #4A42E5; font-size: 11px; padding: 6px 8px; }</style></head><body><div class="header"><h1>📊 ${escapeHtml(category)}</h1><p>${selectedMonth} ${selectedYear} • تم التوليد: ${new Date().toLocaleString('ar-EG')}</p></div><div class="stats"><div class="stat-box green"><div class="label">الإجمالي (معتمد)</div><div class="value">${fmt(stats.totalPaid)} ج.م</div></div><div class="stat-box amber"><div class="label">معلق</div><div class="value">${fmt(stats.totalPending)} ج.م</div></div><div class="stat-box"><div class="label">عدد المعاملات</div><div class="value">${stats.count}</div></div><div class="stat-box"><div class="label">المتوسط</div><div class="value">${fmt(stats.average)} ج.م</div></div></div><table><thead><tr><th>التاريخ</th><th>الوصف</th><th>طريقة الدفع</th><th>الحالة</th><th style="text-align: left;">المبلغ</th></tr></thead><tbody>${dailyGroups.map(group => `<tr class="day-header-row"><td colspan="5">${escapeHtml(group.label)} — ${fmt(group.total)} ج.م (${group.items.length})</td></tr>${group.items.map(t => `<tr><td>${escapeHtml(t.date)}</td><td>${escapeHtml(t.description || t.category || '')}</td><td>${escapeHtml(PAYMENT_METHODS.find(p => p.id === t.method)?.label || t.method || '—')}</td><td class="${t.status === 'paid' ? 'status-paid' : 'status-pending'}">${t.status === 'paid' ? '✅ معتمد' : '⏳ معلق'}</td><td class="amount-${t.type === 'income' ? 'income' : 'expense'}" style="text-align: left;">${t.type === 'income' ? '+' : '−'}${fmt(t.amount)}</td></tr>`).join('')}`).join('')}</tbody></table><div class="footer">💼 المحفظة الذكية — تقرير تفصيلي لفئة ${escapeHtml(category)} • إجمالي: ${fmt(stats.total)} ج.م</div><script>window.onload = () => { setTimeout(() => { window.print(); }, 300); };<\/script></body></html>`;
    printWindow.document.write(html);
    printWindow.document.close();
  };

  const handleExportPdf = async () => {
    if (!containerRef.current || exporting) return;
    if (categoryTx.length === 0) { 
      addNotification({ type: 'warning', title: 'لا توجد معاملات للتصدير' }); 
      return; 
    }
    if (!window.html2pdf) {
      addNotification({ type: 'error', title: 'تعذّر تحميل مكتبة PDF', message: 'اتصل بالإنترنت وأعد المحاولة' });
      return;
    }
    setExporting(true);
    try {
      const element = containerRef.current.cloneNode(true);
      element.querySelectorAll('[data-pdf-hide="true"]').forEach(el => el.remove());
      element.querySelectorAll('.scroll-hide, .pdf-expand').forEach(el => { 
        el.style.maxHeight = 'none'; 
        el.style.overflow = 'visible'; 
      });
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'background:white;padding:20px;font-family:Cairo,sans-serif;direction:rtl;';
      wrapper.innerHTML = `<div style="text-align:center;padding-bottom:12px;border-bottom:3px solid #635BFF;margin-bottom:16px;"><h1 style="font-size:20px;font-weight:900;color:#4A42E5;margin:0 0 4px;">📊 ${escapeHtml(category)}</h1><p style="font-size:12px;color:#475569;font-weight:600;margin:0;">${selectedMonth} ${selectedYear} • ${new Date().toLocaleDateString('ar-EG')}</p></div>`;
      wrapper.appendChild(element);
      const opt = { 
        margin: [10, 8, 10, 8], 
        filename: `فئة_${category.replace(/[\/\\:*?"<>|]/g, '_')}_${selectedMonth}_${selectedYear}.pdf`, 
        image: { type: 'jpeg', quality: 0.95 }, 
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false }, 
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, 
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } 
      };
      await window.html2pdf().set(opt).from(wrapper).save();
      addNotification({ type: 'success', title: 'تم تصدير PDF', message: `${filteredTx.length} معاملة` });
    } catch (e) { 
      console.error('PDF Error:', e); 
      addNotification({ type: 'error', title: 'فشل التصدير', message: e.message }); 
    }
    finally { setExporting(false); }
  };

  const close = () => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: null });

  return (
    <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) close(); }}>
      <div className="generic-modal max-w-3xl">
        <div className="generic-modal-header">
          <div className="flex items-center gap-2 min-w-0">
            <div className="p-2 rounded-lg flex-shrink-0" style={{ background: `${CATEGORY_COLORS[category] || '#635BFF'}20`, color: CATEGORY_COLORS[category] || '#635BFF' }}>
              <Layers size={18} />
            </div>
            <div className="min-w-0">
              <h3 className="text-base font-black truncate">{category}</h3>
              <p className="text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} • {stats.count} معاملة</p>
            </div>
          </div>
          <button onClick={close} className="btn btn-ghost p-1.5"><X size={16} /></button>
        </div>
        <div className="generic-modal-body" ref={containerRef}>
          <div className="grid grid-cols-4 gap-2 mb-4">
            <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
              <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">معتمد</p>
              <p className="text-sm font-black text-emerald-600 mt-0.5 money tabular">{fmt(stats.totalPaid)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-center">
              <p className="text-[10px] font-bold text-amber-700 dark:text-amber-400">معلق</p>
              <p className="text-sm font-black text-amber-600 mt-0.5 money tabular">{fmt(stats.totalPending)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
              <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">العدد</p>
              <p className="text-sm font-black text-blue-600 mt-0.5 money tabular">{stats.count}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-center">
              <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">المتوسط</p>
              <p className="text-sm font-black text-purple-600 mt-0.5 money tabular">{fmt(stats.average)}</p>
            </div>
          </div>
          
          <div className="flex gap-1.5 flex-wrap mb-3" data-pdf-hide="true">
            <div className="relative flex-1 min-w-[140px]">
              <Search className="absolute right-2.5 top-1/2 -translate-y-1/2" size={12} style={{ color: 'var(--text-muted)' }} />
              <input type="text" placeholder="ابحث..." className="input-field pr-8 text-[11px] py-2" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
            </div>
            <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <button type="button" onClick={() => setFilterType('all')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'all' ? 'shadow-sm' : ''}`} style={filterType === 'all' ? { background: 'var(--bg-card)', color: 'var(--accent)' } : { color: 'var(--text-muted)' }}>الكل ({categoryTx.length})</button>
              <button type="button" onClick={() => setFilterType('paid')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'paid' ? 'shadow-sm' : ''}`} style={filterType === 'paid' ? { background: 'var(--bg-card)', color: 'var(--success)' } : { color: 'var(--text-muted)' }}>معتمد ({stats.paidCount})</button>
              <button type="button" onClick={() => setFilterType('pending')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'pending' ? 'shadow-sm' : ''}`} style={filterType === 'pending' ? { background: 'var(--bg-card)', color: 'var(--warning)' } : { color: 'var(--text-muted)' }}>معلق ({stats.pendingCount})</button>
            </div>
            <button type="button" onClick={handlePrint} disabled={filteredTx.length === 0} className="btn btn-secondary text-[10px] py-2 px-2.5">
              <Printer size={11} /><span className="hidden sm:inline">طباعة</span>
            </button>
            <button type="button" onClick={handleExportPdf} disabled={exporting || filteredTx.length === 0} className="btn btn-primary text-[10px] py-2 px-2.5">
              {exporting ? <RefreshCcw size={11} className="animate-spin" /> : <Download size={11} />}
              <span className="hidden sm:inline">PDF</span>
            </button>
          </div>
          
          {Object.keys(stats.methods).length > 0 && (
            <div className="p-2.5 rounded-lg mb-3" style={{ background: 'var(--bg-muted)' }}>
              <p className="text-[10px] font-bold mb-1.5" style={{ color: 'var(--text-secondary)' }}>💳 التوزيع:</p>
              <div className="flex flex-wrap gap-1.5">
                {Object.entries(stats.methods).sort((a, b) => b[1] - a[1]).map(([method, total]) => (
                  <span key={method} className="badge badge-neutral text-[9px]">
                    {PAYMENT_METHODS.find(p => p.id === method)?.label || method}: <strong className="mr-1 money tabular">{fmt(total)}</strong>
                  </span>
                ))}
              </div>
            </div>
          )}
          
          {filteredTx.length === 0 ? (
            <div className="text-center py-8">
              <Layers size={32} className="mx-auto mb-2" style={{ color: 'var(--text-muted)' }} />
              <p className="font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد نتائج</p>
            </div>
          ) : (
            <div className="space-y-2 max-h-[50vh] overflow-y-auto scroll-hide pdf-expand">
              {dailyGroups.map(group => (
                <div key={group.date}>
                  <DayGroupHeader label={group.label} total={group.total} count={group.items.length} />
                  <div className="space-y-1.5">
                    {group.items.map(t => (
                      <div key={t.id} className="flex justify-between items-center gap-2 p-2.5 rounded-lg" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                        <div className="min-w-0 flex-1">
                          <p className="font-bold text-xs truncate flex items-center gap-1 flex-wrap">
                            {t.description || t.category} <FamilyBadge tx={t} /> <SmsBadge tx={t} /> <TeldaBadge tx={t} /> <TransferBadge tx={t} /> <RecurringBadge tx={t} /> <CarryoverBadge tx={t} />
                          </p>
                          <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
                            {PAYMENT_METHODS.find(p => p.id === t.method)?.label || t.method || '—'}
                            {t.status === 'paid' ? <span className="text-emerald-600 mr-2">✅ معتمد</span> : <span className="text-amber-600 mr-2">⏳ معلق</span>}
                          </p>
                        </div>
                        <span className={`font-black text-xs flex-shrink-0 money tabular ${t.type === 'income' ? 'text-emerald-600' : 'text-red-600'}`}>
                          {t.type === 'income' ? '+' : '−'}{fmt(t.amount)}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
          
          {filteredTx.length > 0 && (
            <div className="mt-3 p-3 rounded-lg bg-gradient-to-br from-[#4A42E5] to-[#635BFF] text-white flex justify-between items-center">
              <span className="font-black text-sm">الإجمالي (المعروض)</span>
              <span className="text-xl font-black money tabular">{fmt(filteredTx.reduce((s, t) => s + safeNumber(t.amount), 0))} ج.م</span>
            </div>
          )}
        </div>
        <div className="generic-modal-footer" data-pdf-hide="true">
          <button onClick={close} className="btn btn-secondary flex-1 text-sm">إغلاق</button>
        </div>
      </div>
    </div>
  );
});

/* ═══════════════ CATEGORIES VIEW ═══════════════ */
const CategoriesView = memo(({ 
  transactions, selectedMonth, selectedYear, catViewType, budgets, 
  dispatch, handleDelete, onSelectYear, onSelectMonth 
}) => {
  const catTotals = useMemo(() => transactions.filter(t => 
    t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).reduce((acc, t) => { 
    acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); 
    return acc; 
  }, {}), [transactions, catViewType, selectedMonth, selectedYear]);
  
  const catCounts = useMemo(() => transactions.filter(t => 
    t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).reduce((acc, t) => { 
    acc[t.category] = (acc[t.category] || 0) + 1; 
    return acc; 
  }, {}), [transactions, catViewType, selectedMonth, selectedYear]);

  const hasAnyData = Object.keys(catTotals).length > 0;

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card flex justify-between items-center gap-2 flex-wrap">
        <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
          <button 
            type="button" 
            onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'expense' })} 
            className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'expense' ? 'shadow-sm text-red-600 dark:text-red-400' : ''}`} 
            style={catViewType === 'expense' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}
          >مصروفات</button>
          <button 
            type="button" 
            onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'income' })} 
            className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'income' ? 'shadow-sm text-emerald-600 dark:text-emerald-400' : ''}`} 
            style={catViewType === 'income' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}
          >إيرادات</button>
        </div>
        <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>💡 اضغط على الفئة لعرض التفاصيل</p>
      </div>
      
      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />
      
      {!hasAnyData ? (
        <div className="card text-center p-12">
          <Layers size={40} className="mx-auto mb-3 text-[color:var(--accent)]" />
          <h3 className="text-base font-black mb-2">لا توجد {catViewType === 'expense' ? 'مصروفات' : 'إيرادات'} في {selectedMonth}</h3>
          <p className="text-xs" style={{ color: 'var(--text-muted)' }}>ابدأ بإضافة معاملات من صفحة المعاملات</p>
        </div>
      ) : (
        <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
          {CATEGORIES[catViewType].map(cat => {
            const spent = catTotals[cat] || 0;
            const budget = budgets[cat] || 0;
            const overBudget = budget > 0 && spent > budget;
            const count = catCounts[cat] || 0;
            if (spent === 0 && budget === 0) return null;
            return (
              <div 
                key={cat} 
                className="card card-hover p-3 cursor-pointer active:scale-[0.98]" 
                onClick={() => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: cat })}
              >
                <div className="flex justify-between mb-2">
                  <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: CATEGORY_COLORS[cat] }}>
                    <Layers size={14} />
                  </div>
                  <button 
                    type="button" 
                    aria-label="ميزانية" 
                    onClick={(e) => { 
                      e.stopPropagation(); 
                      dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: cat }); 
                      dispatch({ type: 'SET_BUDGET_AMOUNT', payload: budgets[cat] || '' }); 
                    }} 
                    className="btn btn-ghost p-1"
                  ><SettingsIcon size={12} /></button>
                </div>
                <h3 className="font-bold text-[11px] mb-1 truncate">{cat}</h3>
                <p className="text-base font-black tracking-tight money tabular">
                  {fmt(spent)}
                  <span className="text-[9px] font-semibold mr-1" style={{ color: 'var(--text-muted)' }}>ج.م</span>
                </p>
                {count > 0 && <p className="text-[9px] font-bold mt-0.5" style={{ color: 'var(--text-muted)' }}>📋 {count} معاملة</p>}
                {catViewType === 'expense' && budget > 0 && (
                  <div className="mt-2 pt-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
                    <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                      <div 
                        style={{ width: `${Math.min(100, (spent / budget) * 100)}%` }} 
                        className={`h-full ${overBudget ? 'bg-red-500' : 'bg-emerald-500'}`}
                      ></div>
                    </div>
                    <p className="text-[9px] font-bold mt-1" style={{ color: 'var(--text-muted)' }}>
                      من {fmt(budget)}
                    </p>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
});

/* ═══════════════ TRANSACTIONS VIEW ═══════════════ */
const TransactionsView = memo(({ 
  groupedTransactions, transactions, selectedMonth, selectedYear, transViewMode, 
  statusFilter, searchTerm, expandedGroup, data, monthInsights, dispatch, 
  handleDelete, addNotification, onSelectYear, onSelectMonth, saveHistory, onBulkDelete 
}) => {
  const [sourceFilter, setSourceFilter] = useState('all');
  const [showFilters, setShowFilters] = useState(false);
  const [showBankFeesOnly, setShowBankFeesOnly] = useState(false);
  const [showSmsOnly, setShowSmsOnly] = useState(false);
  const [showBeneficiariesOnly, setShowBeneficiariesOnly] = useState(false);
  const [selectMode, setSelectMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState(new Set());

  const pendingDeleteIds = useMemo(() => {
    const set = new Set();
    (data?.deleteRequests || []).forEach(r => {
      if (r && r.status === 'pending' && r.txId) set.add(r.txId);
    });
    return set;
  }, [data?.deleteRequests]);

  const filterBySource = useCallback((list) => { 
    if (sourceFilter === 'all') return list; 
    if (sourceFilter === 'self') return list.filter(t => !isFamilyTx(t)); 
    return list.filter(t => t.createdBy === sourceFilter); 
  }, [sourceFilter]);
  
  const filterByBankFees = useCallback((list) => showBankFeesOnly ? list.filter(t => isBankFee(t)) : list, [showBankFeesOnly]);
  const filterBySms = useCallback((list) => showSmsOnly ? list.filter(t => t.source === 'sms') : list, [showSmsOnly]);
  const filterByBeneficiaries = useCallback((list) => showBeneficiariesOnly ? list.filter(t => isBeneficiaryCategorySafe(t.category)) : list, [showBeneficiariesOnly]);
  const filterByType = useCallback((list) => transViewMode === 'all' ? list : list.filter(t => t.type === transViewMode), [transViewMode]);
  
  const pendingGroups = useMemo(() => groupedTransactions.map(g => ({ 
    ...g, 
    items: filterByBeneficiaries(filterBySms(filterByBankFees(filterBySource(g.items.filter(t => t.status !== 'paid'))))) 
  })).filter(g => g.items.length > 0), [groupedTransactions, filterBySource, filterByBankFees, filterBySms, filterByBeneficiaries]);
  
  const paidArchive = useMemo(() => filterByBeneficiaries(filterBySms(filterByBankFees(filterBySource(filterByType(transactions.filter(t => 
    t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status === 'paid'
  )))))).sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)), [transactions, selectedMonth, selectedYear, filterByType, filterBySource, filterByBankFees, filterBySms, filterByBeneficiaries]);
  
  const totalPending = pendingGroups.reduce((s, g) => s + g.items.length, 0);
  const isClosed = isMonthClosed(data, selectedYear, selectedMonth);

  const toggleSelect = useCallback((id) => {
    setSelectedIds(prev => { 
      const next = new Set(prev); 
      if (next.has(id)) next.delete(id); 
      else next.add(id); 
      return next; 
    });
  }, []);

  const toggleSelectAll = useCallback(() => {
    const allIds = [...pendingGroups.flatMap(g => g.items.map(i => i.id)), ...paidArchive.map(t => t.id)];
    setSelectedIds(prev => prev.size === allIds.length ? new Set() : new Set(allIds));
  }, [pendingGroups, paidArchive]);

  const exitSelectMode = useCallback(() => { 
    setSelectMode(false); 
    setSelectedIds(new Set()); 
  }, []);

  const handleBulkDelete = useCallback(() => {
    const ids = [...selectedIds];
    if (ids.length === 0) { 
      addNotification({ type: 'info', title: 'لم تحدد أي معاملة' }); 
      return; 
    }
    const blocked = [];
    const allowed = [];
    ids.forEach(id => {
      const t = transactions.find(x => x.id === id);
      if (!t) return;
      if (isMonthClosed(data, t.year || 2026, t.month)) blocked.push(t);
      else allowed.push(t);
    });
    if (allowed.length === 0) { 
      addNotification({ type: 'error', title: 'محظور', message: 'كل المعاملات المحددة في شهور مغلقة' }); 
      return; 
    }
    const message = blocked.length > 0 
      ? `سيتم حذف ${allowed.length} معاملة.\n⚠️ سيتم تجاهل ${blocked.length} معاملة في شهور مغلقة.` 
      : `سيتم نقل ${allowed.length} معاملة للأرشيف.`;
    dispatch({ 
      type: 'SHOW_CONFIRM', 
      danger: true, 
      title: `حذف ${allowed.length} معاملة`, 
      message, 
      onConfirm: () => { 
        if (onBulkDelete) onBulkDelete(allowed.map(t => t.id)); 
        exitSelectMode(); 
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  }, [selectedIds, transactions, data, addNotification, dispatch, exitSelectMode, onBulkDelete]);

  const approveOne = (t) => { 
    if (isMonthClosed(data, t.year || 2026, t.month)) { 
      addNotification({ type: 'error', title: 'محظور' }); 
      return; 
    } 
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(tr => tr.id === t.id ? { ...tr, status: 'paid' } : tr) }); 
    addNotification({ type: 'success', title: 'تم الاعتماد' }); 
  };
  
  const approveAll = () => { 
    if (isClosed) { 
      addNotification({ type: 'error', title: 'محظور' }); 
      return; 
    } 
    dispatch({ 
      type: 'SHOW_CONFIRM', 
      danger: false, 
      title: 'اعتماد الكل', 
      message: `سيتم اعتماد ${totalPending} عملية`, 
      onConfirm: () => { 
        saveHistory(); 
        const ids = new Set(pendingGroups.flatMap(g => g.items.map(i => i.id))); 
        dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t) }); 
        addNotification({ type: 'success', title: 'تم الاعتماد' }); 
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    }); 
  };
  
  const reopenOne = (t) => { 
    if (isMonthClosed(data, t.year || 2026, t.month)) { 
      addNotification({ type: 'error', title: 'محظور' }); 
      return; 
    } 
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(tr => tr.id === t.id ? { ...tr, status: 'pending' } : tr) }); 
    addNotification({ type: 'warning', title: 'إعادة تعليق' }); 
  };
  
  const monthTx = useMemo(() => transactions.filter(t => 
    t.month === selectedMonth && (t.year || 2026) === selectedYear
  ), [transactions, selectedMonth, selectedYear]);
  
  const activeFiltersCount = (sourceFilter !== 'all' ? 1 : 0) + (statusFilter !== 'all' ? 1 : 0) + 
    (showBankFeesOnly ? 1 : 0) + (showSmsOnly ? 1 : 0) + (showBeneficiariesOnly ? 1 : 0);
  
  const dailyGroups = useMemo(() => groupTransactionsByDate(paidArchive), [paidArchive]);

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-center flex-wrap gap-2 mb-3">
          <div>
            <h2 className="text-lg font-black">
              {transViewMode === 'expense' ? 'المصروفات' : transViewMode === 'income' ? 'الإيرادات' : 'كل المعاملات'}
            </h2>
            <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} • {monthTx.length} معاملة</p>
          </div>
          <div className="flex gap-1.5 flex-wrap">
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'all' })} className={`btn ${transViewMode === 'all' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>الكل</button>
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'expense' })} className={`btn ${transViewMode === 'expense' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>مصروفات</button>
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'income' })} className={`btn ${transViewMode === 'income' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>إيرادات</button>
          </div>
        </div>

        {selectMode ? (
          <div className="p-3 rounded-lg mb-3 flex flex-wrap items-center gap-2" style={{ background: 'var(--accent-soft)', border: '1px solid var(--accent)' }}>
            <div className="flex-1 min-w-[180px]">
              <p className="text-xs font-black" style={{ color: 'var(--accent)' }}>🔘 وضع التحديد المتعدد</p>
              <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>تم تحديد <strong className="money tabular">{selectedIds.size}</strong> معاملة</p>
            </div>
            <button onClick={toggleSelectAll} className="btn btn-secondary text-[11px] py-1.5 px-2.5">
              {selectedIds.size === (pendingGroups.flatMap(g => g.items).length + paidArchive.length) ? 'إلغاء الكل' : 'تحديد الكل'}
            </button>
            <button onClick={handleBulkDelete} disabled={selectedIds.size === 0} className={`btn ${selectedIds.size === 0 ? 'btn-secondary' : 'btn-primary'} text-[11px] py-1.5 px-2.5`}>
              <Trash2 size={12} /> حذف ({selectedIds.size})
            </button>
            <button onClick={exitSelectMode} className="btn btn-ghost text-[11px] py-1.5 px-2.5">خروج</button>
          </div>
        ) : (
          <div className="flex gap-1.5 mb-3">
            <button onClick={() => setSelectMode(true)} className="btn btn-secondary text-[11px] py-1.5 px-2.5">
              <CheckCircle2 size={12} /> تحديد متعدد
            </button>
          </div>
        )}

        <div className="grid grid-cols-3 gap-2">
          <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30">
            <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">محصل</p>
            <p className="text-sm font-black text-emerald-600 mt-0.5 money tabular">{fmt(monthInsights.inc)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30">
            <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مدفوع</p>
            <p className="text-sm font-black text-red-600 mt-0.5 money tabular">{fmt(monthInsights.exp)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الصافي</p>
            <p className={`text-sm font-black mt-0.5 money tabular ${monthInsights.net >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(monthInsights.net)}</p>
          </div>
        </div>
        
        <div className="flex gap-1.5 mt-3 flex-wrap">
          <button onClick={() => setShowBankFeesOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showBankFeesOnly ? 'btn-primary' : 'btn-secondary'}`}>
            <Receipt size={12} /> رسوم بنكية
          </button>
          <button onClick={() => setShowSmsOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showSmsOnly ? 'btn-primary' : 'btn-secondary'}`}>
            <MessageSquare size={12} /> SMS
          </button>
          <button onClick={() => setShowBeneficiariesOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showBeneficiariesOnly ? 'btn-primary' : 'btn-secondary'}`}>👨‍👩‍👧 مصاريف شهرية</button>
          {isClosed ? (
            <React.Fragment>
              <div className="badge badge-success px-2 py-1 text-[10px]"><ShieldCheck size={10} /> مغلق</div>
              <button 
                onClick={() => dispatch({ 
                  type: 'SHOW_CONFIRM', 
                  danger: false, 
                  title: 'إعادة فتح', 
                  message: 'سيتم إلغاء القفل.', 
                  onConfirm: () => { 
                    saveHistory(); 
                    dispatch({ type: 'OPEN_MONTH', payload: makeMonthKey(selectedYear, selectedMonth) }); 
                    addNotification({ type: 'success', title: 'تم إعادة الفتح' }); 
                  }, 
                  onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
                })} 
                className="btn btn-secondary text-[11px] px-2.5 py-1.5"
              ><Unlock size={12} /> فتح</button>
            </React.Fragment>
          ) : (
            <button 
              onClick={() => {
                const pending = monthTx.filter(t => t.status !== 'paid');
                if (pending.length > 0) { 
                  dispatch({ 
                    type: 'SET_PENDING_CLOSE_MODAL', 
                    payload: { 
                      isOpen: true, 
                      pending, 
                      total: pending.reduce((s, t) => s + safeNumber(t.amount), 0), 
                      month: selectedMonth, 
                      year: selectedYear 
                    } 
                  }); 
                }
                else { 
                  dispatch({ 
                    type: 'SHOW_CONFIRM', 
                    danger: false, 
                    title: 'إقفال الشهر', 
                    message: 'سيتم تثبيت الأرصدة.', 
                    onConfirm: () => { 
                      saveHistory(); 
                      dispatch({ type: 'CLOSE_MONTH', payload: { year: selectedYear, month: selectedMonth } }); 
                      addNotification({ type: 'success', title: 'تم الإقفال' }); 
                    }, 
                    onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
                  }); 
                }
              }} 
              className="btn btn-secondary text-[11px] px-2.5 py-1.5"
            ><Lock size={12} /> إقفال</button>
          )}
        </div>
      </div>
      
      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />
      
      <div className="card py-3">
        <div className="flex gap-2">
          <div className="relative flex-1">
            <Search className="absolute right-3 top-1/2 -translate-y-1/2" size={14} style={{ color: 'var(--text-muted)' }} />
            <input 
              type="text" 
              placeholder="ابحث..." 
              className="input-field pr-9 text-sm py-2.5" 
              value={searchTerm} 
              onChange={(e) => dispatch({ type: 'SET_SEARCH_TERM', payload: e.target.value })} 
            />
          </div>
          <button onClick={() => setShowFilters(!showFilters)} className={`btn ${showFilters ? 'btn-primary' : 'btn-secondary'} px-3 py-2.5 relative`}>
            <Filter size={14} />
            {activeFiltersCount > 0 && (
              <span className="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 text-white text-[9px] rounded-full flex items-center justify-center font-black">
                {activeFiltersCount}
              </span>
            )}
          </button>
        </div>
        {showFilters && (
          <div className="mt-3 pt-3 space-y-3 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            <div className="flex gap-2 flex-wrap">
              {[['all', 'الكل'], ['self', '👤 أنا'], ['ans', 'أنس'], ['abdelrahman', 'عبد الرحمن'], ['salma', 'سلمى'], ['om_abdo', 'أم عبده']].map(([id, label]) => (
                <button 
                  key={id} 
                  type="button" 
                  onClick={() => setSourceFilter(id)} 
                  className={`badge px-2.5 py-1 cursor-pointer text-[10px] ${sourceFilter === id ? 'badge-accent' : 'badge-neutral'}`}
                >{label}</button>
              ))}
            </div>
            <div className="flex gap-2 flex-wrap">
              {[['all', 'الكل'], ['pending', '⏳ معلق'], ['paid', '✅ مدفوع']].map(([id, label]) => (
                <button 
                  key={id} 
                  type="button" 
                  onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: id })} 
                  className={`badge px-2.5 py-1 cursor-pointer text-[10px] ${statusFilter === id ? 'badge-accent' : 'badge-neutral'}`}
                >{label}</button>
              ))}
            </div>
          </div>
        )}
      </div>
      
      <section>
        <div className="flex justify-between items-center mb-2 flex-wrap gap-2">
          <h3 className="font-black flex items-center gap-2 text-sm">
            <Clock className="text-amber-500" size={14} /> الالتزامات
            {totalPending > 0 && <span className="badge badge-warning text-[10px]">{totalPending}</span>}
          </h3>
          {totalPending > 0 && (
            <button onClick={approveAll} className="btn btn-primary text-[11px] px-2.5 py-1.5">
              <CheckCircle2 size={12} /> اعتماد الكل
            </button>
          )}
        </div>
        {pendingGroups.length === 0 ? (
          <div className="card text-center p-6">
            <CheckCircle2 size={24} className="text-emerald-500 mx-auto mb-2" />
            <p className="font-semibold text-xs" style={{ color: 'var(--text-secondary)' }}>لا توجد التزامات معلقة</p>
          </div>
        ) : (
          <div className="space-y-2">
            {pendingGroups.map(g => {
              const isExpanded = expandedGroup === g.category;
              return (
                <div key={g.category} className="card p-0 overflow-hidden">
                  <div 
                    className="flex justify-between items-center p-3 cursor-pointer" 
                    onClick={() => dispatch({ type: 'SET_EXPANDED_GROUP', payload: isExpanded ? null : g.category })}
                  >
                    <div className="flex items-center gap-2 min-w-0 flex-1">
                      <span className="p-1.5 rounded-lg flex-shrink-0" style={{ backgroundColor: `${CATEGORY_COLORS[g.category]}20`, color: CATEGORY_COLORS[g.category] }}>
                        <Layers size={14} />
                      </span>
                      <div className="min-w-0">
                        <h4 className="font-bold text-xs truncate">{g.category}</h4>
                        <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{g.items.length} عملية</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <span className="font-black text-sm money tabular">{fmt(g.items.reduce((s, i) => s + safeNumber(i.amount), 0))}</span>
                      <ChevronDown size={14} className={`transition-transform ${isExpanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
                    </div>
                  </div>
                  {isExpanded && (
                    <div className="divide-y" style={{ borderTop: '1px solid var(--border-subtle)', borderColor: 'var(--border-subtle)' }}>
                      {g.items.map(t => (
                        <div key={t.id} className={`p-3 flex justify-between items-center gap-2 ${selectedIds.has(t.id) ? 'bg-blue-50 dark:bg-blue-950/20' : ''}`}>
                          {selectMode && (
                            <input type="checkbox" checked={selectedIds.has(t.id)} onChange={() => toggleSelect(t.id)} className="w-4 h-4 accent-[color:var(--accent)] flex-shrink-0" />
                          )}
                          <button aria-label="اعتماد" onClick={() => approveOne(t)} className="flex flex-col items-center px-1.5 py-1 rounded-lg hover:bg-[color:var(--bg-muted)] active:scale-90 flex-shrink-0">
                            <Clock className="text-amber-500" size={16} />
                          </button>
                          <div className="flex-1 min-w-0">
                            <p className="font-bold text-xs truncate">
                              {t.description || 'بدون وصف'}{' '}
                              {pendingDeleteIds.has(t.id) && <span className="badge badge-warning text-[9px] mr-1">🗑️ طلب مسح</span>}{' '}
                              <FamilyBadge tx={t} /> <SmsBadge tx={t} /> <TeldaBadge tx={t} /> <TransferBadge tx={t} /> <RecurringBadge tx={t} /> <CarryoverBadge tx={t} />
                            </p>
                            <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>{t.date} • {PAYMENT_METHODS.find(p => p.id === t.method)?.label}</p>
                          </div>
                          <div className="flex items-center gap-1 flex-shrink-0">
                            <span className="font-black text-xs money tabular">{fmt(t.amount)}</span>
                            {!selectMode && (
                              <React.Fragment>
                                <button 
                                  type="button" 
                                  aria-label="تعديل" 
                                  onClick={() => { 
                                    dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); 
                                    dispatch({ type: 'SET_FORM_DATA', payload: t }); 
                                    dispatch({ type: 'SET_FORM_OPEN', payload: true }); 
                                  }} 
                                  className="btn btn-ghost p-1"
                                ><Edit size={12} /></button>
                                <button type="button" aria-label="حذف" onClick={() => handleDelete(t.id)} className="btn btn-ghost p-1 text-red-500">
                                  <Trash2 size={12} />
                                </button>
                              </React.Fragment>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </section>
      
      {dailyGroups.length > 0 && (
        <details className="group" open>
          <summary className="cursor-pointer list-none">
            <div className="card py-3 flex items-center justify-between">
