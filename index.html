      {showAddCard && (
        <Modal isOpen={true} onClose={() => setShowAddCard(false)} title="كارت ائتماني جديد" icon="💳">
          <div className="space-y-3">
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الاسم *</label>
                <input className="input-field text-sm" value={newCard.name} onChange={e => setNewCard({ ...newCard, name: e.target.value })} />
              </div>
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>البنك *</label>
                <input className="input-field text-sm" value={newCard.bank} onChange={e => setNewCard({ ...newCard, bank: e.target.value })} />
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الحد *</label>
                <input type="text" inputMode="decimal" className="input-field input-num text-sm" value={newCard.limit} onChange={e => setNewCard({ ...newCard, limit: e.target.value })} />
              </div>
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>آخر 4</label>
                <input maxLength="4" className="input-field mono text-center text-sm" value={newCard.last4} onChange={e => setNewCard({ ...newCard, last4: e.target.value })} />
              </div>
            </div>
            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>نسبة الكاش باك %</label>
              <input type="text" inputMode="decimal" className="input-field input-num text-center font-black text-amber-600 text-sm" value={newCard.cashbackRate} onChange={e => setNewCard({ ...newCard, cashbackRate: e.target.value })} />
            </div>
            <button onClick={addCard} className="btn btn-primary w-full py-2.5 text-sm">إضافة</button>
          </div>
        </Modal>
      )}
    </div>
  );
});

/* ═══════════════ DUPLICATE DETECTION ═══════════════ */
const DuplicateDetectionSystem = ({ transactions, data, dispatch, addNotification, saveHistory, onBulkDelete }) => {
  const [threshold, setThreshold] = useState(2);
  const [selectedMonth, setSelectedMonth] = useState('all');
  const [expandedGroups, setExpandedGroups] = useState({});

  const duplicates = useMemo(() => {
    const map = {};
    const filtered = selectedMonth === 'all' ? transactions : transactions.filter(t => {
      const parsed = parseMonthKey(selectedMonth);
      if (!parsed) return t.month === selectedMonth;
      return t.month === parsed.month && (t.year || 2026) === parsed.year;
    });
    
    filtered.forEach(t => {
      const key = `${safeNumber(t.amount)}_${t.method}_${t.category}_${(t.date||'').slice(0,10)}`;
      if (!map[key]) map[key] = [];
      map[key].push(t);
    });
    
    return Object.entries(map).filter(([_, items]) => items.length >= threshold).map(([key, items]) => ({
      key, amount: items[0].amount, count: items.length, items, category: items[0].category,
      risk: items.length >= 5 ? 'high' : items.length >= 3 ? 'medium' : 'low'
    }));
  }, [transactions, threshold, selectedMonth]);

  const doDelete = (ids) => {
    if (!onBulkDelete) { addNotification({ type: 'error', title: 'خطأ: handler الحذف مفقود' }); return; }
    if (!Array.isArray(ids) || ids.length === 0) return;
    dispatch({
      type: 'SHOW_CONFIRM', danger: true, title: 'تأكيد الحذف',
      message: `سيتم نقل ${ids.length} عملية للأرشيف مع إمكانية الاسترجاع من صفحة المحذوفات.`,
      onConfirm: () => onBulkDelete(ids),
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const handleDeleteAll = () => {
    let idsToDelete = [];
    duplicates.forEach(d => {
      d.items.slice(1).forEach(item => {
        if (!isMonthClosed(data, item.year || 2026, item.month)) idsToDelete.push(item.id);
      });
    });
    if (idsToDelete.length === 0) { addNotification({ type: 'info', title: 'لا يوجد' }); return; }
    doDelete(idsToDelete);
  };

  const deleteSingle = (item) => {
    if (isMonthClosed(data, item.year || 2026, item.month)) {
      addNotification({ type: 'error', title: 'محظور', message: 'الشهر مغلق' });
      return;
    }
    doDelete([item.id]);
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-20">
      <div className="card">
        <div className="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <h2 className="text-lg font-black flex items-center gap-2">
              <Filter className="text-[color:var(--accent)]" size={18} /> كاشف التكرار
            </h2>
            <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>
              {threshold}+ تكرار بنفس المبلغ والطريقة والتاريخ
            </p>
          </div>
          <button onClick={handleDeleteAll} disabled={duplicates.length === 0} className={`btn ${duplicates.length === 0 ? 'btn-secondary' : 'btn-primary'} text-xs`}>
            <Trash2 size={14} /> تنظيف
          </button>
        </div>
      </div>
      
      <div className="card grid grid-cols-2 gap-4">
        <div>
          <label className="block text-[11px] font-bold mb-2" style={{ color: 'var(--text-muted)' }}>نطاق البحث</label>
          <select className="input-field text-sm" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}>
            <option value="all">جميع الشهور</option>
            {YEARS_LIST.flatMap(y => getMonthsForYear(y).map(m => 
              <option key={makeMonthKey(y,m)} value={makeMonthKey(y,m)}>{m} {y}</option>
            ))}
          </select>
        </div>
        <div>
          <label className="block text-[11px] font-bold mb-2" style={{ color: 'var(--text-muted)' }}>الحساسية ({threshold})</label>
          <input type="range" min="2" max="10" className="w-full mt-3 accent-[color:var(--accent)]" value={threshold} onChange={e => setThreshold(Number(e.target.value))} />
        </div>
      </div>
      
      {duplicates.length === 0 ? (
        <div className="card text-center p-12">
          <CheckCircle2 size={40} className="text-emerald-500 mx-auto mb-3" />
          <h3 className="text-base font-black">ممتاز! لا توجد تكرارات</h3>
        </div>
      ) : duplicates.map(dup => (
        <div key={dup.key} className="card">
          <div 
            className="flex justify-between items-center cursor-pointer -m-[18px] p-[18px]" 
            onClick={() => setExpandedGroups(p => ({ ...p, [dup.key]: !p[dup.key] }))}
          >
            <div className="flex items-center gap-3">
              <div className={`p-2 rounded-lg ${dup.risk === 'high' ? 'bg-red-50 text-red-500 dark:bg-red-950/30' : 'bg-amber-50 text-amber-500 dark:bg-amber-950/30'}`}>
                <Repeat size={16} />
              </div>
              <div>
                <h4 className="font-black text-sm money tabular">{fmt(dup.amount)} ج.م</h4>
                <span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                  {dup.category} - {dup.count} مرات
                </span>
              </div>
            </div>
            <ChevronDown className={`transition-transform ${expandedGroups[dup.key] ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} size={16} />
          </div>
          {expandedGroups[dup.key] && (
            <div className="mt-3 pt-3 space-y-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
              {dup.items.map((item, idx) => (
                <div key={item.id} className="flex justify-between items-center p-2.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className="text-xs font-medium flex items-center gap-2 flex-wrap">
                    {item.date} • {item.description || 'بدون وصف'}
                  </div>
                  {idx !== 0 && (
                    <button onClick={() => deleteSingle(item)} aria-label="حذف" className="text-red-500 p-1.5 rounded-lg">
                      <Trash2 size={12} />
                    </button>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
};

/* ═══════════════ DELETED ARCHIVE VIEW ═══════════════ */
const DeletedArchiveView = memo(({ data, dispatch, saveHistory, addNotification, transactions }) => {
  const archive = data?.deletedTxArchive || [];
  const pendingRequests = useMemo(() => {
    return (data?.deleteRequests || []).filter(r => r && r.status === 'pending' && r.txSnapshot);
  }, [data?.deleteRequests]);
  const [tab, setTab] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');
  const [monthFilter, setMonthFilter] = useState('all');

  const filtered = useMemo(() => {
    let arr = archive;
    if (tab === 'mine') arr = arr.filter(t => !isFamilyTx(t) && t.deletedBy !== 'family');
    if (tab === 'family') arr = arr.filter(t => isFamilyTx(t) || t.deletedBy === 'family');
    if (monthFilter !== 'all') {
      const parsed = parseMonthKey(monthFilter);
      if (parsed) arr = arr.filter(t => t.month === parsed.month && (t.year || 2026) === parsed.year);
    }
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.category).includes(term));
    }
    return arr.slice().sort((a, b) => {
      const da = parseISODate(a.deletedAt) || parseISODate(a.date) || new Date(0);
      const db = parseISODate(b.deletedAt) || parseISODate(b.date) || new Date(0);
      return db - da;
    });
  }, [archive, tab, searchTerm, monthFilter]);

  const stats = useMemo(() => {
    const familyCount = archive.filter(t => isFamilyTx(t) || t.deletedBy === 'family').length;
    const mineCount = archive.length - familyCount;
    const total = archive.reduce((s, t) => s + safeNumber(t.amount), 0);
    const legacyCount = archive.filter(a => a._legacy).length;
    return { familyCount, mineCount, total, count: archive.length, legacyCount };
  }, [archive]);

  const approveDeleteRequest = (req) => {
    const tx = req.txSnapshot;
    if (!tx) return;
    saveHistory();
    
    const newArchive = [...(data.deletedTxArchive || []), {
      ...tx, deletedAt: new Date().toISOString(), deletedBy: req.requestedBy || 'family',
      originalStatus: tx.status || 'pending', reason: 'موافقة على طلب مسح'
    }].slice(-500);
    
    const newTx = (data.transactions || []).filter(t => t.id !== tx.id);
    const newDeletedIds = Array.from(new Set([...(data.deletedTxIds || []), tx.id])).slice(-500);
    const updatedRequests = (data.deleteRequests || []).map(r => 
      r.id === req.id ? { ...r, status: 'approved', approvedAt: Date.now() } : r
    );
    
    const newMaterialized = { ...(data.materializedRecurring || {}) };
    if (tx.sourceRecurringId && tx.year && tx.month) {
      newMaterialized[`${tx.sourceRecurringId}_${makeMonthKey(tx.year, tx.month)}`] = 'deleted';
    }
    
    dispatch({ 
      type: 'SET_DATA', 
      payload: { 
        ...data, transactions: newTx, deletedTxArchive: newArchive, deletedTxIds: newDeletedIds,
        deleteRequests: updatedRequests, materializedRecurring: newMaterialized
      } 
    });
    addNotification({ type: 'success', title: 'تمت الموافقة والحذف' });
  };

  const rejectDeleteRequest = (req) => {
    const updatedRequests = (data.deleteRequests || []).map(r => 
      r.id === req.id ? { ...r, status: 'rejected', rejectedAt: Date.now() } : r
    );
    dispatch({ type: 'SET_DATA', payload: { ...data, deleteRequests: updatedRequests } });
    addNotification({ type: 'info', title: 'تم الرفض' });
  };

  const restoreOne = (tombstone) => {
    if (tombstone._legacy) { 
      addNotification({ type: 'error', title: 'لا يمكن استرجاع هذه (بيانات ناقصة)' }); 
      return; 
    }
    const d = parseISODate(tombstone.date);
    const y = tombstone.year || (d ? d.getFullYear() : null);
    const m = tombstone.month || (d ? ALL_MONTHS[d.getMonth()] : null);
    if (!y || !m) { addNotification({ type: 'error', title: 'بيانات غير كاملة' }); return; }
    if (isMonthClosed(data, y, m)) {
      addNotification({ type: 'error', title: 'الشهر مغلق', message: `افتح شهر ${m} ${y} أولاً`, duration: 6000 });
      return;
    }
    dispatch({ 
      type: 'SHOW_CONFIRM', danger: false, title: 'استرجاع المعاملة', 
      message: `استرجاع "${tombstone.description || tombstone.category}" بمبلغ ${fmt(tombstone.amount)}`, 
      onConfirm: () => {
        saveHistory();
        const { deletedAt, deletedBy, originalStatus, reason, _legacy, ...original } = tombstone;
        const restoredTx = { ...original, status: originalStatus || 'pending' };
        const newTx = [...transactions, restoredTx].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
        const newArchive = (data.deletedTxArchive || []).filter(a => a.id !== tombstone.id);
        const newDeletedIds = (data.deletedTxIds || []).filter(id => id !== tombstone.id);
        const newMaterialized = { ...(data.materializedRecurring || {}) };
        if (restoredTx.sourceRecurringId && restoredTx.year && restoredTx.month) {
          delete newMaterialized[`${restoredTx.sourceRecurringId}_${makeMonthKey(restoredTx.year, restoredTx.month)}`];
        }
        dispatch({ 
          type: 'SET_DATA', 
          payload: { 
            ...data, transactions: newTx, deletedTxArchive: newArchive, 
            deletedTxIds: newDeletedIds, materializedRecurring: newMaterialized 
          } 
        });
        addNotification({ type: 'success', title: 'تم الاسترجاع بنجاح' });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  };

  const permanentlyDelete = (id) => {
    dispatch({ 
      type: 'SHOW_CONFIRM', danger: true, title: 'حذف نهائي', 
      message: 'سيُحذف نهائياً ولن يمكن استرجاعه', 
      onConfirm: () => {
        saveHistory();
        const newArchive = (data.deletedTxArchive || []).filter(a => a.id !== id);
        const newTx = (data.transactions || []).filter(t => t.id !== id);
        const newDeletedIds = Array.from(new Set([...(data.deletedTxIds || []), id])).slice(-500);
        dispatch({ 
          type: 'SET_DATA', 
          payload: { ...data, transactions: newTx, deletedTxArchive: newArchive, deletedTxIds: newDeletedIds } 
        });
        addNotification({ type: 'success', title: 'تم الحذف نهائياً' });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  };

  const clearArchive = () => {
    dispatch({ 
      type: 'SHOW_CONFIRM', danger: true, title: 'تفريغ الأرشيف', 
      message: `سيتم حذف ${archive.length} سجل نهائياً`, 
      onConfirm: () => {
        saveHistory();
        dispatch({ type: 'SET_DATA', payload: { ...data, deletedTxArchive: [], deletedTxIds: [] } });
        addNotification({ type: 'success', title: 'تم التفريغ' });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  };

  return (
    <>
      {pendingRequests.length > 0 && (
        <div className="card" style={{ borderColor: 'var(--warning)' }}>
          <div className="flex items-center gap-3 mb-3">
            <div className="p-2 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-amber-600 dark:text-amber-400">
              <Clock size={16} />
            </div>
            <div>
              <h3 className="font-black text-sm">📥 طلبات مسح من تطبيق العيلة</h3>
              <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>
                {pendingRequests.length} طلب بانتظار مراجعتك
              </p>
            </div>
          </div>
          <div className="space-y-2">
            {pendingRequests.map(req => {
              const tx = req.txSnapshot;
              return (
                <div key={req.id} className="p-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className="flex justify-between items-start gap-2 mb-2 flex-wrap">
                    <div className="min-w-0 flex-1">
                      <p className="font-bold text-xs truncate">💸 {tx.description || tx.category || 'بدون وصف'}</p>
                      <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>
                        <span className="money tabular">{tx.amount}</span> ج.م • {tx.date}
                      </p>
                      <p className="text-[10px] mt-1 text-amber-700 dark:text-amber-400">
                        👤 من: <strong>{req.requestedByName || 'فاميلي'}</strong>
                        {req.reason && ` • 📝 ${req.reason}`}
                      </p>
                    </div>
                    <span className="font-black text-sm text-red-600 flex-shrink-0 money tabular">{fmt(tx.amount)}</span>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => approveDeleteRequest(req)} className="btn btn-primary text-[11px] flex-1 py-1.5">
                      <CheckCircle2 size={12} /> موافقة وحذف
                    </button>
                    <button onClick={() => rejectDeleteRequest(req)} className="btn btn-secondary text-[11px] flex-1 py-1.5 text-red-600">
                      <X size={12} /> رفض
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="space-y-4 animate-fadeIn pb-24">
        <div className="card">
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div className="flex items-center gap-3">
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-red-600 dark:text-red-400">
                <Trash2 size={16} />
              </div>
              <div>
                <h2 className="text-base font-black">سجل المحذوفات</h2>
                <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>أرشيف كامل مع إمكانية الاسترجاع</p>
              </div>
            </div>
            {archive.length > 0 && (
              <button onClick={clearArchive} className="btn btn-secondary text-xs">
                <Trash2 size={12} /> تفريغ
              </button>
            )}
          </div>
        </div>

        <div className="grid grid-cols-4 gap-2">
          <div className="stat-card">
            <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الإجمالي</p>
            <p className="text-base font-black text-slate-600 dark:text-slate-300 money tabular">{stats.count}</p>
          </div>
          <div className="stat-card">
            <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>👤 محذوفاتي</p>
            <p className="text-base font-black text-blue-600 money tabular">{stats.mineCount}</p>
          </div>
          <div className="stat-card">
            <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>🛒 Family</p>
            <p className="text-base font-black text-purple-600 money tabular">{stats.familyCount}</p>
          </div>
          <div className="stat-card">
            <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الإجمالي (ج.م)</p>
            <p className="text-base font-black text-red-600 money tabular">{fmt(stats.total)}</p>
          </div>
        </div>

        {stats.legacyCount > 0 && (
          <div className="card p-3" style={{ background: 'var(--warning-soft)', borderColor: 'var(--warning)' }}>
            <p className="text-[11px] font-bold text-amber-700 dark:text-amber-400">
              ⚠️ {stats.legacyCount} سجل قديم بدون بيانات كاملة — للعرض فقط
            </p>
          </div>
        )}

        <div className="sub-tab-switcher">
          <button onClick={() => setTab('all')} className={`sub-tab-btn ${tab === 'all' ? 'active' : ''}`}>الكل ({archive.length})</button>
          <button onClick={() => setTab('mine')} className={`sub-tab-btn ${tab === 'mine' ? 'active' : ''}`}>👤 محذوفاتي ({stats.mineCount})</button>
          <button onClick={() => setTab('family')} className={`sub-tab-btn ${tab === 'family' ? 'active' : ''}`}>🛒 Family ({stats.familyCount})</button>
        </div>

        <div className="card py-3">
          <div className="flex gap-2 flex-wrap">
            <div className="relative flex-1 min-w-[140px]">
              <Search className="absolute right-3 top-1/2 -translate-y-1/2" size={14} style={{ color: 'var(--text-muted)' }} />
              <input type="text" placeholder="ابحث..." className="input-field pr-9 text-sm py-2.5" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
            </div>
            <select className="input-field text-xs py-2.5 flex-1 min-w-[130px]" value={monthFilter} onChange={(e) => setMonthFilter(e.target.value)}>
              <option value="all">جميع الشهور</option>
              {YEARS_LIST.flatMap(y => getMonthsForYear(y).map(m => 
                <option key={makeMonthKey(y,m)} value={makeMonthKey(y,m)}>{m} {y}</option>
              ))}
            </select>
          </div>
        </div>

        {filtered.length === 0 ? (
          <div className="card text-center p-12">
            <CheckCircle2 size={40} className="text-emerald-500 mx-auto mb-3" />
            <h3 className="text-base font-black mb-2">{archive.length === 0 ? 'الأرشيف فارغ' : 'لا نتائج مطابقة'}</h3>
            <p className="text-xs" style={{ color: 'var(--text-muted)' }}>المعاملات المحذوفة تظهر هنا</p>
          </div>
        ) : (
          <div className="space-y-2">
            {filtered.map(tombstone => {
              const isFamily = isFamilyTx(tombstone) || tombstone.deletedBy === 'family';
              const isLegacy = tombstone._legacy;
              const delDate = parseISODate(tombstone.deletedAt);
              return (
                <div key={tombstone.id} className="card py-3">
                  <div className="flex justify-between items-start gap-2 mb-2">
                    <div className="min-w-0 flex-1">
                      <p className="font-bold text-xs truncate flex items-center gap-2 flex-wrap">
                        {tombstone.type === 'income' ? '💰' : '💸'} {tombstone.description || tombstone.category || 'بدون وصف'}
                        {isFamily && <FamilyBadge tx={tombstone} />}
                        {isLegacy && <span className="badge badge-warning text-[9px]">بيانات قديمة</span>}
                      </p>
                      <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
                        {tombstone.category || '—'} • {tombstone.date || '—'}
                      </p>
                      <p className="text-[10px] font-semibold mt-0.5 text-red-500">
                        🗑️ حُذفت {delDate ? delDate.toLocaleDateString('ar-EG') : 'في تاريخ غير معروف'}
                        {tombstone.deletedBy && ` بواسطة ${tombstone.deletedBy === 'self' ? 'أنت' : tombstone.deletedBy}`}
                        {tombstone.reason && ` • السبب: ${tombstone.reason}`}
                      </p>
                    </div>
                    <span className={`font-black text-sm flex-shrink-0 money tabular ${tombstone.type === 'income' ? 'text-emerald-600' : 'text-red-600'}`}>
                      {tombstone.type === 'income' ? '+' : '−'}{fmt(tombstone.amount)}
                    </span>
                  </div>
                  {!isLegacy && (
                    <div className="flex justify-end gap-1.5 mt-2">
                      <button onClick={() => restoreOne(tombstone)} className="btn btn-secondary text-[10px] py-1 px-2">
                        <Undo2 size={10} /> استرجاع
                      </button>
                      <button onClick={() => permanentlyDelete(tombstone.id)} className="btn btn-ghost text-[10px] py-1 px-2 text-red-500">
                        <Trash2 size={10} /> حذف نهائي
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </>
  );
});

/* ═══════════════ SETTINGS VIEW ═══════════════ */
const SettingsView = memo(({ data, accountsData, cards, budgets, dispatch, saveHistory, addNotification }) => {
  const [localAccounts, setLocalAccounts] = useState(() => JSON.parse(JSON.stringify(accountsData)));
  const [localCards, setLocalCards] = useState(() => cards.map(c => ({ ...c })));
  const [activeSection, setActiveSection] = useState('accounts');
  const [hasChanges, setHasChanges] = useState(false);
  const [driveBusy, setDriveBusy] = useState(false);
  const [driveStatus, setDriveStatus] = useState('');
  const [folderIdInput, setFolderIdInput] = useState(() => localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID);
  const isDirtyRef = useRef(false);

  useEffect(() => {
    if (isDirtyRef.current) return;
    setLocalAccounts(JSON.parse(JSON.stringify(accountsData)));
    setHasChanges(false);
  }, [accountsData]);

  useEffect(() => {
    if (isDirtyRef.current) return;
    setLocalCards(cards.map(c => ({ ...c })));
    setHasChanges(false);
  }, [cards]);

  const handleAccountChange = (key, field, value) => {
    setLocalAccounts(prev => ({ ...prev, [key]: { ...prev[key], [field]: value } }));
    setHasChanges(true);
    isDirtyRef.current = true;
  };
  
  const handleCardChange = (id, field, value) => {
    setLocalCards(prev => prev.map(c => { 
      if (c.id !== id) return c; 
      const u = { ...c, [field]: value }; 
      if (field === 'limit') u.availableBalance = Math.max(0, safeNumber(value) - safeNumber(u.openingDebt)); 
      return u; 
    }));
    setHasChanges(true);
    isDirtyRef.current = true;
  };

  const handleSave = () => {
    saveHistory();
    const cleaned = {};
    const today = getLocalISODate();
    ACCOUNT_KEYS.forEach(k => {
      const oldBal = safeNumber(accountsData[k]?.balance);
      const newBal = parseNumberInput(localAccounts[k]?.balance);
      cleaned[k] = { 
        ...localAccounts[k], balance: newBal, 
        lastUpdated: (oldBal !== newBal) ? today : (localAccounts[k]?.lastUpdated || null) 
      };
    });
    dispatch({ type: 'UPDATE_ACCOUNTS', payload: cleaned });
    dispatch({ 
      type: 'UPDATE_CARDS', 
      payload: localCards.map(c => ({ 
        ...c, limit: safeNumber(c.limit), openingDebt: safeNumber(c.openingDebt), 
        cashbackRate: safeNumber(c.cashbackRate, 0), 
        subCardLast4: Array.isArray(c.subCardLast4) ? c.subCardLast4 : [] 
      })) 
    });
    addNotification({ type: 'success', title: 'تم الحفظ' });
    setHasChanges(false);
    isDirtyRef.current = false;
  };

  const handleDriveConnect = async () => {
    setDriveBusy(true); setDriveStatus('جاري الاتصال...');
    try { await ensureDriveToken(); setDriveStatus('متصل'); addNotification({ type: 'success', title: 'Drive متصل' }); }
    catch (e) { setDriveStatus('فشل: ' + e.message); }
    finally { setDriveBusy(false); }
  };

  const handleDriveBackupNow = async () => {
    setDriveBusy(true); setDriveStatus('جاري الرفع...');
    try {
      const payload = { data, budgets, exportedAt: new Date().toISOString(), version: 'V84' };
      const result = await uploadBackupToDrive(payload);
      localStorage.setItem(AUTO_BACKUP_LS_KEY, String(Date.now()));
      const folderId = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;
      setDriveStatus(`✅ تم الرفع: ${result.name}`);
      addNotification({ type: 'success', title: 'تم رفع النسخة', message: 'في مجلد Finance Backups', duration: 6000 });
      if (folderId) { 
        setTimeout(() => { 
          dispatch({ 
            type: 'SHOW_CONFIRM', danger: false, title: '✅ تم الرفع بنجاح', 
            message: 'هل تريد فتح المجلد في Google Drive للتأكد؟',
            onConfirm: () => { window.open(`https://drive.google.com/drive/folders/${folderId}`, '_blank'); dispatch({ type: 'HIDE_CONFIRM' }); },
            onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
          });
        }, 600); 
      }
    } catch (e) { setDriveStatus('❌ فشل: ' + e.message); addNotification({ type: 'error', title: 'فشل الرفع', message: e.message }); }
    finally { setDriveBusy(false); }
  };

  const handleDriveRestore = async () => {
    setDriveBusy(true); setDriveStatus('جاري الجلب...');
    try {
      const files = await listDriveBackups();
      if (files.length === 0) { setDriveStatus('لا توجد نسخ'); setDriveBusy(false); return; }
      const labels = files.slice(0, 10).map((f, i) => `${i + 1}) ${f.name}`).join('\n');
      const choice = await showInputModal({ title: 'اختر رقم النسخة', icon: '☁️', message: labels, inputValue: '1', numeric: true, confirmText: 'استعادة' });
      if (!choice) { setDriveBusy(false); setDriveStatus(''); return; }
      const idx = Math.max(1, Math.min(files.length, parseInt(choice, 10) || 1)) - 1;
      const file = files[idx];
      const payload = await downloadBackupFromDrive(file.id);
      if (!payload?.data) throw new Error('الملف لا يحتوي بيانات');
      dispatch({ 
        type: 'SHOW_CONFIRM', danger: true, title: 'استعادة نسخة', message: 'سيتم استبدال بياناتك', 
        onConfirm: () => {
          saveHistory();
          dispatch({ type: 'SET_DATA', payload: migrateData(payload.data) });
          if (payload.budgets) dispatch({ type: 'SET_BUDGETS', payload: payload.budgets });
          addNotification({ type: 'success', title: 'تمت الاستعادة' });
        }, 
        onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
      });
    } catch (e) { setDriveStatus('فشل: ' + e.message); }
    finally { setDriveBusy(false); }
  };

  const handleFreshStart = () => {
    dispatch({ 
      type: 'SHOW_CONFIRM', danger: true, title: '⚠️ بداية جديدة — تصفير شامل', 
      message: 'سيتم مسح:\n• كل المعاملات\n• كل القروض\n• البنود المتكررة\n• العهد\n• خطط الشهرية\n\nلن تُمس:\n• أسماء الحسابات\n• أرقام البطاقات\n• الإعدادات', 
      onConfirm: () => {
        saveHistory();
        const zeroed = {};
        ACCOUNT_KEYS.forEach(k => { zeroed[k] = { ...(accountsData[k] || {}), balance: 0, lastUpdated: null }; });
        dispatch({ 
          type: 'SET_DATA', 
          payload: { 
            ...data, transactions: [], loans: [], closedMonths: [], monthlySnapshots: {}, 
            accountsData: zeroed, 
            cards: (data.cards || []).map(c => ({ ...c, openingDebt: 0, availableBalance: safeNumber(c.limit), openingDate: null })), 
            recurringItems: [],
            materializedRecurring: {}, custodyEntries: [], cashbackTrackers: [], 
            monthlyPlans: {},
            settledHanyMonths: [], deletedTxIds: [], deletedTxArchive: [],
            deletedDefaultIds: [], deleteRequests: []
          } 
        });
        addNotification({ type: 'success', title: 'تم التصفير الشامل', duration: 5000 });
        dispatch({ type: 'HIDE_CONFIRM' });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  };

  const handleResetCardsToZero = () => {
    dispatch({ 
      type: 'SHOW_CONFIRM', danger: true, title: 'تصفير بطاقات', 
      message: 'سيتم تصفير مديونيات البطاقات مع الاحتفاظ بالأسماء والحدود', 
      onConfirm: () => {
        saveHistory();
        dispatch({ 
          type: 'UPDATE_CARDS', 
          payload: cards.map(c => ({ ...c, openingDebt: 0, availableBalance: safeNumber(c.limit), openingDate: getLocalISODate() })) 
        });
        addNotification({ type: 'success', title: 'تم التصفير' });
        dispatch({ type: 'HIDE_CONFIRM' });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card flex justify-between items-center flex-wrap gap-3">
        <div className="flex items-center gap-2">
          <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>
            <Sliders size={16} />
          </div>
          <h2 className="text-base font-black">الإعدادات</h2>
        </div>
        {hasChanges && (
          <button onClick={handleSave} className="btn btn-primary text-xs">
            <Save size={14} /> حفظ
          </button>
        )}
      </div>

      <div className="card p-1 flex gap-1.5">
        {[
          { id: 'accounts', label: 'الحسابات', icon: Wallet }, 
          { id: 'cards', label: 'الكروت', icon: CreditCard }
        ].map(s => {
          const Icon = s.icon;
          return (
            <button key={s.id} onClick={() => setActiveSection(s.id)} className={`flex-1 py-2.5 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 transition-all ${activeSection === s.id ? 'text-white shadow-sm' : ''}`} style={activeSection === s.id ? { background: 'var(--accent)' } : { color: 'var(--text-muted)' }}>
              <Icon size={14} /> {s.label}
            </button>
          );
        })}
      </div>

      {activeSection === 'accounts' && (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          {ACCOUNT_KEYS.map(key => {
            const acc = localAccounts[key] || {};
            const Icon = ACCOUNT_ICONS[key] || Wallet;
            const last4 = DEFAULT_ACCOUNTS[key]?.last4;
            const isWallet = isWalletAccount(key);
            const isCash = isCashAccount(key);
            return (
              <div key={key} className="card">
                <div className="flex justify-between items-center mb-3">
                  <div className="flex items-center gap-2">
                    <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>
                      <Icon size={14} />
                    </div>
                    <h4 className="font-black text-xs">{acc.label || key}</h4>
                    {isCash && <span className="badge badge-success text-[8px]">كاش</span>}
                    {isWallet && <span className="badge badge-accent text-[8px]">محفظة</span>}
                  </div>
                </div>
                <div className="space-y-2.5">
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الرصيد الأساسي</label>
                    <input type="text" inputMode="decimal" value={acc.balance ?? ''} onChange={e => handleAccountChange(key, 'balance', e.target.value)} className="input-field input-num text-base text-center py-2" style={{ color: 'var(--accent)' }} />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>تاريخ التثبيت</label>
                    <input type="date" value={acc.lastUpdated || ''} onChange={e => handleAccountChange(key, 'lastUpdated', e.target.value)} className="input-field text-center font-bold text-xs py-2" />
                  </div>
                  {last4 && (
                    <div className="p-2 rounded-lg text-center" style={{ background: 'var(--bg-muted)' }}>
                      <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>رقم البطاقة</p>
                      <p className="font-mono font-bold text-xs mt-0.5">•••• {last4}</p>
                    </div>
                  )}
                  <div className="p-2 rounded-lg text-center" style={{ background: 'var(--bg-muted)' }}>
                    <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>الرصيد الحي</p>
                    <p className="font-black text-emerald-600 text-xs money tabular">{fmt(computeBalance({ ...data, accountsData: localAccounts }, key))}</p>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {activeSection === 'cards' && (
        <div className="space-y-3">
          {localCards.map(card => {
            const liveDebt = computeCardDebt(data, card);
            const debtPct = safeNumber(card.limit) > 0 ? (Math.max(0, liveDebt) / safeNumber(card.limit)) * 100 : 0;
            const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
            return (
              <div key={card.id} className="card">
                <div className="flex items-center gap-2 mb-3 flex-wrap">
                  <div className="p-1.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-purple-600 dark:text-purple-400">
                    <CreditCard size={14} />
                  </div>
                  <h3 className="font-black text-sm">{card.bank} - {card.name}</h3>
                  <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>
                    •••• {card.last4}
                  </span>
                  {subCards.map(s => (
                    <span key={s} className="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full" style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}>
                      •••• {s}
                    </span>
                  ))}
                </div>
                <div className="grid grid-cols-3 gap-2 mb-3">
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الحد</label>
                    <input type="text" inputMode="decimal" value={card.limit} onChange={e => handleCardChange(card.id, 'limit', e.target.value)} className="input-field input-num font-black text-blue-600 text-center text-xs py-2" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>مديونية أساسية</label>
                    <input type="text" inputMode="decimal" value={card.openingDebt} onChange={e => handleCardChange(card.id, 'openingDebt', e.target.value)} className="input-field input-num font-black text-red-600 text-center text-xs py-2" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>كاش باك %</label>
                    <input type="text" inputMode="decimal" value={card.cashbackRate || 0} onChange={e => handleCardChange(card.id, 'cashbackRate', e.target.value)} className="input-field input-num font-black text-amber-600 text-center text-xs py-2" />
                  </div>
                </div>
                <div className="p-2 rounded-lg text-center mt-2" style={{ background: 'var(--bg-muted)' }}>
                  <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                    المديونية الحية {liveDebt < 0 && <span className="text-emerald-600">(دائن)</span>}
                  </p>
                  <p className={`font-black text-sm money tabular ${liveDebt < 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                    {fmt(Math.abs(liveDebt))} ج.م
                  </p>
                  <p className="text-[10px] font-semibold mt-1" style={{ color: 'var(--text-muted)' }}>
                    المتاح: <span className="money tabular">{fmt(Math.max(0, safeNumber(card.limit) - Math.max(0, liveDebt)))}</span> ج.م
                  </p>
                  {card.openingDate && (
                    <p className="text-[9px] font-semibold mt-1" style={{ color: 'var(--text-muted)' }}>
                      📅 من: {card.openingDate}
                    </p>
                  )}
                </div>
                <div className="w-full rounded-full h-1 overflow-hidden mt-2" style={{ background: 'var(--bg-muted)' }}>
                  <div className={`h-full ${debtPct > 70 ? 'bg-red-500' : debtPct > 40 ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(100, debtPct)}%` }}></div>
                </div>
              </div>
            );
          })}
          <button onClick={handleResetCardsToZero} className="btn btn-secondary text-xs w-full text-amber-600 py-2">
            <RotateCcw size={12} /> تصفير مديونيات البطاقات
          </button>
        </div>
      )}

      <div className="card">
        <div className="flex items-center gap-2 mb-3">
          <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400">
            <Lock size={14} />
          </div>
          <h3 className="font-black text-sm">رمز الدخول (PIN)</h3>
        </div>
        <p className="text-[11px] mb-3" style={{ color: 'var(--text-muted)' }}>
          الرمز الافتراضي: <strong>1033</strong> — V84 يستخدم PBKDF2
        </p>
        <button onClick={() => dispatch({ type: 'SET_PIN_CHANGE_OPEN', payload: true })} className="btn btn-secondary text-xs w-full">
          <Lock size={12} /> تغيير الرمز
        </button>
      </div>

      <details className="card p-0 overflow-hidden">
        <summary className="p-4 cursor-pointer list-none flex items-center justify-between">
          <div className="flex items-center gap-2">
            <Cloud size={14} className="text-blue-500" />
            <span className="font-bold text-xs">Google Drive</span>
          </div>
          <ChevronDown size={14} style={{ color: 'var(--text-muted)' }} />
        </summary>
        <div className="px-4 pb-4 space-y-3" style={{ borderTop: '1px solid var(--border-subtle)', paddingTop: '12px' }}>
          <div>
            <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>Google Drive Folder ID</label>
            <div className="flex gap-1.5">
              <input type="text" className="input-field text-[11px] py-2 flex-1" placeholder="1rAupM2llGpThcodBrmL4DZIhDSJ-dGXW" value={folderIdInput} onChange={(e) => setFolderIdInput(e.target.value)} onBlur={(e) => { const v = e.target.value.trim(); if (v && v !== localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY)) { localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, v); addNotification({ type: 'success', title: 'تم حفظ Folder ID' }); } }} />
              <button type="button" onClick={() => { const id = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID; window.open(`https://drive.google.com/drive/folders/${id}`, '_blank'); }} className="btn btn-secondary text-[11px] py-2 px-2.5">
                <Cloud size={12} /> فتح
              </button>
            </div>
          </div>
          <div className="flex flex-wrap gap-1.5">
            <button type="button" onClick={handleDriveConnect} disabled={driveBusy} className="btn btn-secondary text-[11px] py-1.5 px-2.5">
              <Cloud size={12} /> اتصال
            </button>
            <button type="button" onClick={handleDriveBackupNow} disabled={driveBusy} className="btn btn-primary text-[11px] py-1.5 px-2.5">
              <Upload size={12} /> نسخة الآن
            </button>
            <button type="button" onClick={handleDriveRestore} disabled={driveBusy} className="btn btn-secondary text-[11px] py-1.5 px-2.5">
              <Download size={12} /> استعادة
            </button>
          </div>
          {driveStatus && <p className="text-[10px] font-semibold whitespace-pre-line" style={{ color: 'var(--text-muted)' }}>{driveStatus}</p>}
          {(() => {
            const ts = Number(localStorage.getItem('v84_last_sync_ts') || 0);
            if (!ts) return null;
            const d = new Date(ts);
            return (
              <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                🕐 آخر مزامنة Firestore: {d.toLocaleString('ar-EG')}
              </p>
            );
          })()}
        </div>
      </details>

      <div className="card" style={{ borderColor: 'var(--warning)' }}>
        <div className="flex items-center gap-2 mb-3">
          <ShieldAlert size={16} className="text-amber-500" />
          <h3 className="font-black text-sm">إجراءات احتياطية</h3>
        </div>
        <p className="text-[11px] mb-3 leading-relaxed" style={{ color: 'var(--text-muted)' }}>
          ⚠️ هذه العملية تحذف كل البيانات المحاسبية. أسماء الحسابات والبطاقات والإعدادات تبقى.
        </p>
        <button onClick={handleFreshStart} className="btn btn-secondary text-xs w-full text-red-600 py-2">
          <Trash2 size={12} /> بداية جديدة — تصفير شامل
        </button>

/* ═══════════════ MONTHLY PLANNING VIEW ═══════════════ */
const MonthlyPlanningView = memo(({ data, monthlyPlans, dispatch, saveHistory, addNotification }) => {
  const currentYear = new Date().getFullYear();
  const [year, setYear] = useState(() => YEARS_LIST.includes(currentYear) ? currentYear : YEARS_LIST[0]);
  const months = getMonthsForYear(year);
  const plan = monthlyPlans || {};

  const updatePlan = useCallback((monthKey, field, value) => {
    dispatch({
      type: 'UPDATE_MONTHLY_PLANS',
      payload: { ...plan, [monthKey]: { ...(plan[monthKey] || {}), [field]: parseNumberInput(value) } }
    });
  }, [plan, dispatch]);

  const deriveFromHistory = useCallback((monthKey) => {
    const parsed = parseMonthKey(monthKey);
    if (!parsed) return;
    const derived = deriveMonthlyPlanFromHistory(data, parsed.year, parsed.month, 3);
    if (!derived) {
      addNotification({ type: 'info', title: 'لا توجد بيانات كافية للاشتقاق' });
      return;
    }
    const { _meta, ...values } = derived;
    dispatch({
      type: 'UPDATE_MONTHLY_PLANS',
      payload: { ...plan, [monthKey]: { ...(plan[monthKey] || {}), ...values, _meta } }
    });
    addNotification({ type: 'success', title: 'تم الاشتقاق من التاريخ', message: _meta?.refMonths || '' });

    { id: 'expectedZakat', label: 'زكاة' },
    { id: 'expectedCash', label: 'كاش حر' },
    { id: 'expectedCashExpenses', label: 'مصروف كاش' },

            + safeNumber(p.expectedEmakWE) + safeNumber(p.expectedZakat) + safeNumber(p.expectedCash);
          const totalOut = safeNumber(p.expectedCashExpenses) + safeNumber(p.plannedPayments);
          const net = totalIn - totalOut;

const PlannerView = memo(({ updatedLoans, cards, selectedMonth, selectedYear, monthlyPlans, totalLiquidityNow, data, transactions, recurringItems }) => {
  const planKey = makeMonthKey(selectedYear, selectedMonth);
  const plan = monthlyPlans?.[planKey] || {};

  const totals = useMemo(() => {
    const monthTxs = transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
    const actualIncome = monthTxs.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const actualExpense = monthTxs.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncome = monthTxs.filter(t => t.type === 'income' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingExpense = monthTxs.filter(t => t.type === 'expense' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);

    const plannedIncome = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent) + safeNumber(plan.expectedCashback)
      + safeNumber(plan.expectedEmakWE) + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedCash);
    const plannedExpense = safeNumber(plan.expectedCashExpenses) + safeNumber(plan.plannedPayments);

    const cardDebt = cards.reduce((s, c) => s + Math.max(0, computeCardDebt(data, c)), 0);
    const loanDebt = updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0);

    const projected = totalLiquidityNow + pendingIncome + (plannedIncome - actualIncome)
      - pendingExpense - (plannedExpense - actualExpense);

    return { actualIncome, actualExpense, pendingIncome, pendingExpense, plannedIncome, plannedExpense, cardDebt, loanDebt, projected };
  }, [transactions, selectedMonth, selectedYear, plan, cards, updatedLoans, data, totalLiquidityNow]);

      const plan = monthlyPlans?.[monthKey] || {};

      const plannedIncome = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent)
        + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE)
        + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedCash);
      const plannedExpense = safeNumber(plan.expectedCashExpenses) + safeNumber(plan.plannedPayments);

      const monthTxs = transactions.filter(t => t.month === monthName && (t.year || 2026) === year);
      const actualIncome = monthTxs.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
      const actualExpense = monthTxs.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);

/* ═══════════════ FINANCIAL FORECAST VIEW ═══════════════ */
const FinancialForecastView = memo(({ 
  data, transactions, cards, updatedLoans, recurringItems, 
  liveBalances, monthlyPlans, selectedYear, selectedMonth 
}) => {
  const [cardPaymentOverride, setCardPaymentOverride] = useState('');
  const [cardSpendingOverride, setCardSpendingOverride] = useState('');
  const [showSettings, setShowSettings] = useState(false);
  
  const currentLiquidity = useMemo(() => 
    ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(liveBalances?.[k]), 0), [liveBalances]);
  
  const currentCardDebt = useMemo(() => 
    cards.reduce((s, c) => s + Math.max(0, computeCardDebt(data, c)), 0), [cards, data]);
  
  const currentLoanDebt = useMemo(() => 
    updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  
  const isCardPayment = (t) => {
    if (t.type !== 'expense') return false;
    if (CREDIT_CARD_METHOD_IDS.includes(t.method)) return false;
    if (t.linkedCardId) return false;
    const cat = t.category || '';
    const desc = t.description || '';
    return (cat === 'الالتزامات البنكية والتمويلية' || cat === 'بنوك / فيزا / تمويل عقاري' 
      || cat === 'مصاريف وسلف شخصية' || desc.includes('سداد') || desc.includes('بطاقة'));
  };
  
  const isCardSpending = (t) => t.type === 'expense' && (CREDIT_CARD_METHOD_IDS.includes(t.method) || t.linkedCardId);
  
  const autoAverages = useMemo(() => {
    const curIdx = getMonthIndex(selectedMonth);
    let y = selectedYear, m = curIdx;
    const refMonths = [];
    for (let i = 0; i < 3; i++) {
      m--;
      if (m < 0) { m = 11; y--; }
      refMonths.push({ year: y, month: ALL_MONTHS[m] });
    }
    let payTotal = 0, payCount = 0, spTotal = 0, spCount = 0;
    refMonths.forEach(({ year, month }) => {
      const monthTxs = transactions.filter(t => t.month === month && (t.year || 2026) === year && t.status === 'paid');
      const paySum = monthTxs.filter(isCardPayment).reduce((s, t) => s + safeNumber(t.amount), 0);
      const spSum = monthTxs.filter(isCardSpending).reduce((s, t) => s + safeNumber(t.amount), 0);
      if (paySum > 0) { payTotal += paySum; payCount++; }
      if (spSum > 0) { spTotal += spSum; spCount++; }
    });
    return {
      payment: payCount > 0 ? Math.round(payTotal / payCount) : 0,
      spending: spCount > 0 ? Math.round(spTotal / spCount) : 0
    };
  }, [transactions, selectedMonth, selectedYear]);
  
  const baseCardPayment = cardPaymentOverride !== '' ? parseNumberInput(cardPaymentOverride) : autoAverages.payment;
  const baseCardSpending = cardSpendingOverride !== '' ? parseNumberInput(cardSpendingOverride) : autoAverages.spending;
  
  const forecast = useMemo(() => {
    const startIdx = getMonthIndex(selectedMonth);
    const months = [];
    let liq = currentLiquidity;
    let cardDebt = currentCardDebt;
    let loanDebt = currentLoanDebt;
    
    for (let i = 0; i < 6; i++) {
      let mIdx = startIdx + i;
      let year = selectedYear;
      while (mIdx > 11) { mIdx -= 12; year++; }
      const mName = ALL_MONTHS[mIdx];
      const mKey = makeMonthKey(year, mName);
      
      const monthTxs = transactions.filter(t => t.month === mName && (t.year || 2026) === year);
      
      let income, cardPayment, cardSpending, cashExpenses;
      let pendingIncome = 0, pendingExpense = 0, pendingCount = 0;
      
      if (i === 0) {
        income = monthTxs.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
        pendingIncome = monthTxs.filter(t => t.type === 'income' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
        pendingExpense = monthTxs.filter(t => t.type === 'expense' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
        pendingCount = monthTxs.filter(t => t.status !== 'paid').length;
        cardSpending = monthTxs.filter(isCardSpending).reduce((s, t) => s + safeNumber(t.amount), 0);
        cardPayment = monthTxs.filter(isCardPayment).reduce((s, t) => s + safeNumber(t.amount), 0);
        if (cardPayment === 0) cardPayment = baseCardPayment;
        cashExpenses = monthTxs.filter(t => t.type === 'expense' && !isCardSpending(t) && !isCardPayment(t)).reduce((s, t) => s + safeNumber(t.amount), 0);
      } else {
        const plan = monthlyPlans?.[mKey] || {};
        const planIncome = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent)
          + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE)
          + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedCash);
        const planExpense = safeNumber(plan.expectedCashExpenses) + safeNumber(plan.plannedPayments);
        
        const recIncome = recurringItems.filter(r => r.active !== false && r.type === 'income' && !r.linkedLoanSystemId).reduce((s, r) => s + safeNumber(r.amount), 0);
        const recExpense = recurringItems.filter(r => r.active !== false && r.type === 'expense' && !r.linkedLoanSystemId).reduce((s, r) => s + safeNumber(r.amount), 0);
        
        income = planIncome || recIncome;
        cashExpenses = planExpense || recExpense;
        cardPayment = baseCardPayment;
        cardSpending = baseCardSpending;
      }
      
      const loanInstallments = updatedLoans.filter(l => !l.isReceivable && !l.autoGenerated && safeNumber(l.monthlyInstallment) > 0).reduce((s, l) => s + safeNumber(l.monthlyInstallment), 0);
      
      const newCardDebt = Math.max(0, cardDebt - cardPayment + cardSpending);
      const newLoanDebt = Math.max(0, loanDebt - loanInstallments);
      const newLiquidity = liq + income - cashExpenses - cardPayment - loanInstallments;
      
      const totalDebt = newCardDebt + newLoanDebt;
      const netPosition = newLiquidity - totalDebt;
      
      months.push({
        month: mName, year,
        startLiquidity: liq, startCardDebt: cardDebt, startLoanDebt: loanDebt,
        income, cashExpenses, cardSpending, cardPayment, loanInstallments,
        pendingIncome, pendingExpense, pendingCount,
        endLiquidity: newLiquidity, endCardDebt: newCardDebt, endLoanDebt: newLoanDebt,
        totalDebt, netPosition
      });
      
      liq = newLiquidity;
      cardDebt = newCardDebt;
      loanDebt = newLoanDebt;
    }
    return months;
  }, [transactions, selectedMonth, selectedYear, monthlyPlans, currentLiquidity, 
      currentCardDebt, currentLoanDebt, baseCardPayment, baseCardSpending, recurringItems, updatedLoans]);
  
  const chartData = forecast.map(f => ({
    name: f.month.slice(0, 3),
    'السيولة': Math.round(f.endLiquidity),
    'المديونية': Math.round(f.totalDebt),
    'صافي المركز': Math.round(f.netPosition)
  }));
  
  const alerts = useMemo(() => {
    const list = [];
    let warnedNeg = false;
    forecast.forEach(f => {
      if (f.endLiquidity < 0 && !warnedNeg) {
        list.push({ type: 'danger', title: `⚠️ سيولة سلبية في ${f.month} ${f.year}`, message: `السيولة هتبقى ${fmt(f.endLiquidity)} ج.م — محتاج إجراء` });
        warnedNeg = true;
      }
    });
    const last = forecast[forecast.length - 1];
    if (last && last.netPosition < 0) {
      list.push({ type: 'warning', title: `📉 صافي المركز سالب بعد 6 شهور`, message: `في ${last.month} ${last.year}: صافي = ${fmt(last.netPosition)} ج.م` });
    }
    return list;
  }, [forecast]);
  
  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div>
            <h2 className="text-base font-black flex items-center gap-2">
              <TrendingUp size={16} className="text-[color:var(--accent)]" /> التنبؤ المالي الشامل — 6 شهور
            </h2>
            <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>تنبؤ دقيق من البيانات الفعلية والمعلقة والمخططة</p>
          </div>
          <button onClick={() => setShowSettings(!showSettings)} className={`btn text-xs ${showSettings ? 'btn-primary' : 'btn-secondary'}`}>
            <Sliders size={12} /> إعدادات
          </button>
        </div>
        
        {showSettings && (
          <div className="mt-3 pt-3 space-y-3 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>مبلغ سداد البطاقة الشهري</label>
                <input type="text" inputMode="decimal" className="input-field input-num text-sm text-center font-bold" value={cardPaymentOverride} onChange={e => setCardPaymentOverride(e.target.value)} placeholder={`تلقائي: ${fmt(autoAverages.payment)}`} />
                <p className="text-[9px] mt-1" style={{ color: 'var(--text-muted)' }}>فاضي = تلقائي من آخر 3 شهور</p>
              </div>
              <div>
                <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>متوسط مشتريات البطاقة</label>
                <input type="text" inputMode="decimal" className="input-field input-num text-sm text-center font-bold" value={cardSpendingOverride} onChange={e => setCardSpendingOverride(e.target.value)} placeholder={`تلقائي: ${fmt(autoAverages.spending)}`} />
                <p className="text-[9px] mt-1" style={{ color: 'var(--text-muted)' }}>فاضي = تلقائي من آخر 3 شهور</p>
              </div>
            </div>
          </div>
        )}
      </div>
      
      {alerts.length > 0 && alerts.map((a, i) => (
        <div key={i} className="card" style={{ background: a.type === 'danger' ? 'var(--danger-soft)' : 'var(--warning-soft)', borderColor: a.type === 'danger' ? 'var(--danger)' : 'var(--warning)' }}>
          <p className={`text-xs font-black ${a.type === 'danger' ? 'text-red-700 dark:text-red-400' : 'text-amber-700 dark:text-amber-400'}`}>{a.title}</p>
          <p className="text-[11px] mt-1" style={{ color: 'var(--text-secondary)' }}>{a.message}</p>
        </div>
      ))}
      
      <div className="grid grid-cols-3 gap-2">
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>السيولة الآن</p>
          <p className="text-base font-black text-emerald-600 money tabular">{fmt(currentLiquidity)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>المديونية الآن</p>
          <p className="text-base font-black text-red-600 money tabular">{fmt(currentCardDebt + currentLoanDebt)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>صافي المركز</p>
          <p className={`text-base font-black money tabular ${currentLiquidity - currentCardDebt - currentLoanDebt >= 0 ? 'text-blue-600' : 'text-red-600'}`}>
            {fmt(currentLiquidity - currentCardDebt - currentLoanDebt)}
          </p>
        </div>
      </div>
      
      <div className="card">
        <h3 className="font-bold text-xs mb-3" style={{ color: 'var(--text-secondary)' }}>📈 تطور السيولة والمديونية — 6 شهور</h3>
        <div className="h-72">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={chartData}>
              <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.06} />
              <XAxis dataKey="name" fontSize={10} stroke="#94A3B8" />
              <YAxis fontSize={10} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
              <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '12px', border: '1px solid var(--border-subtle)', fontFamily: 'Cairo', fontSize: '12px' }} />
              <Legend wrapperStyle={{ fontSize: '11px', fontWeight: 'bold' }} />
              <Bar dataKey="السيولة" fill="#00A86B" radius={[4, 4, 0, 0]} barSize={18} />
              <Bar dataKey="المديونية" fill="#DC2626" radius={[4, 4, 0, 0]} barSize={18} />
              <Bar dataKey="صافي المركز" fill="#635BFF" radius={[4, 4, 0, 0]} barSize={18} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
      
      <div className="space-y-3">
        <h3 className="font-black text-sm">📋 التفاصيل الشهرية</h3>
        {forecast.map((f, i) => (
          <div key={i} className="card">
            <div className="flex justify-between items-center mb-3 flex-wrap gap-2">
              <h4 className="font-black text-sm">{f.month} {f.year}</h4>
              <div className="flex gap-1.5 flex-wrap">

                {f.pendingCount > 0 && <span className="badge badge-warning text-[9px]">⏳ {f.pendingCount} معلق</span>}
              </div>

            <div className="grid grid-cols-2 gap-2 mb-3">

                <p className="text-sm font-black text-amber-600 money tabular">{fmt(f.cardSpending)}</p>
              </div>

                <p className="text-sm font-black text-blue-600 money tabular">{fmt(f.cardPayment)}</p>

/* ═══════════════ MONTH COMPARISON VIEW ═══════════════ */
const MonthComparisonView = memo(({ transactions, selectedYear, selectedMonth }) => {
  const [compareMonthIdx, setCompareMonthIdx] = useState(() => Math.max(0, getMonthIndex(selectedMonth) - 1));

  const curMonthIdx = getMonthIndex(selectedMonth);
  const compareMonth = ALL_MONTHS[compareMonthIdx];

  const stats = useMemo(() => {
    const calc = (m, y) => {
      const txs = transactions.filter(t => t.month === m && (t.year || 2026) === y && t.status === 'paid');
      const income = txs.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
      const expense = txs.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
      const byCategory = {};
      txs.filter(t => t.type === 'expense').forEach(t => {
        byCategory[t.category] = (byCategory[t.category] || 0) + safeNumber(t.amount);
      });
      return { income, expense, net: income - expense, count: txs.length, byCategory };
    };
    return { current: calc(selectedMonth, selectedYear), previous: calc(compareMonth, selectedYear) };
  }, [transactions, selectedMonth, selectedYear, compareMonth]);

  const allCategories = useMemo(() => {
    const set = new Set([...Object.keys(stats.current.byCategory), ...Object.keys(stats.previous.byCategory)]);
    return Array.from(set).sort();
  }, [stats]);

  const pctChange = (cur, prev) => {
    if (prev === 0) return cur > 0 ? 100 : 0;
    return ((cur - prev) / prev) * 100;
  };

  const chartData = [
    { name: 'دخل', [selectedMonth]: stats.current.income, [compareMonth]: stats.previous.income },
    { name: 'مصروف', [selectedMonth]: stats.current.expense, [compareMonth]: stats.previous.expense },
    { name: 'صافي', [selectedMonth]: stats.current.net, [compareMonth]: stats.previous.net }
  ];

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <h2 className="text-base font-black flex items-center gap-2 mb-3">
          <Activity size={16} className="text-[color:var(--accent)]" /> مقارنة الشهور
        </h2>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الشهر الحالي</label>
            <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
              <p className="font-black text-sm text-blue-700 dark:text-blue-400">{selectedMonth} {selectedYear}</p>
            </div>
          </div>
          <div>
            <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>قارن مع</label>
            <select className="input-field text-sm py-2.5" value={compareMonthIdx} onChange={e => setCompareMonthIdx(Number(e.target.value))}>
              {ALL_MONTHS.map((m, i) => (
                <option key={m} value={i} disabled={i === curMonthIdx}>{m} {selectedYear}</option>
              ))}
            </select>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-3 gap-3">
        {[
          { label: 'الدخل', cur: stats.current.income, prev: stats.previous.income, color: 'emerald' },
          { label: 'المصروف', cur: stats.current.expense, prev: stats.previous.expense, color: 'red' },
          { label: 'الصافي', cur: stats.current.net, prev: stats.previous.net, color: 'blue' }
        ].map(s => {
          const change = pctChange(s.cur, s.prev);
          const better = s.label === 'المصروف' ? change < 0 : change > 0;
          const colorCls = s.color === 'emerald' ? 'text-emerald-600' : s.color === 'red' ? 'text-red-600' : 'text-blue-600';
          return (
            <div key={s.label} className="stat-card">
              <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>{s.label}</p>
              <p className={`text-base font-black money tabular ${colorCls}`}>{fmt(s.cur)}</p>
              <p className="text-[10px] mt-1" style={{ color: 'var(--text-muted)' }}>السابق: <span className="money tabular">{fmt(s.prev)}</span></p>
              {change !== 0 && (
                <p className={`text-[10px] font-black mt-1 ${better ? 'text-emerald-600' : 'text-red-600'}`}>
                  {change > 0 ? '↑' : '↓'} {Math.abs(Math.round(change))}%
                </p>
              )}
            </div>
          );
        })}
      </div>

      <div className="card">
        <h3 className="font-bold text-xs mb-3" style={{ color: 'var(--text-secondary)' }}>مقارنة بصرية</h3>
        <div className="h-56">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={chartData}>
              <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.06} />
              <XAxis dataKey="name" fontSize={10} stroke="#94A3B8" />
              <YAxis fontSize={10} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
              <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '12px', border: '1px solid var(--border-subtle)', fontFamily: 'Cairo', fontSize: '12px' }} />
              <Legend wrapperStyle={{ fontSize: '11px', fontWeight: 'bold' }} />
              <Bar dataKey={selectedMonth} fill="#635BFF" radius={[4, 4, 0, 0]} barSize={30} />
              <Bar dataKey={compareMonth} fill="#94A3B8" radius={[4, 4, 0, 0]} barSize={30} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {allCategories.length > 0 && (
        <div className="card">
          <h3 className="font-black text-sm mb-3">📂 المقارنة حسب الفئة</h3>
          <div className="space-y-2">
            {allCategories.map(cat => {
              const cur = stats.current.byCategory[cat] || 0;
              const prev = stats.previous.byCategory[cat] || 0;
              const change = pctChange(cur, prev);
              if (cur === 0 && prev === 0) return null;
              return (
                <div key={cat} className="p-2.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className="flex justify-between items-center mb-1">
                    <span className="font-bold text-xs truncate">{cat}</span>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <span className="text-xs font-black text-blue-600 money tabular">{fmt(cur)}</span>
                      {change !== 0 && (
                        <span className={`text-[10px] font-black ${change > 0 ? 'text-red-600' : 'text-emerald-600'}`}>
                          {change > 0 ? '↑' : '↓'} {Math.abs(Math.round(change))}%
                        </span>
                      )}
                    </div>
                  </div>
                  <div className="flex justify-between text-[10px]" style={{ color: 'var(--text-muted)' }}>
                    <span>السابق: <span className="money tabular">{fmt(prev)}</span></span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
});

/* ═══════════════ CALENDAR VIEW ═══════════════ */
const CalendarView = memo(({ data, getAgendaItems, dispatch, saveHistory, addNotification }) => {
  const today = new Date();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [selectedDayDetails, setSelectedDayDetails] = useState(null);

  const agendaItems = useMemo(() => getAgendaItems(), [getAgendaItems]);

  const itemsByDay = useMemo(() => {
    const map = {};
    agendaItems.forEach(item => {
      const d = parseISODate(item.date);
      if (!d) return;
      if (d.getFullYear() !== viewYear || d.getMonth() !== viewMonth) return;
      const day = d.getDate();
      if (!map[day]) map[day] = [];
      map[day].push(item);
    });
    return map;
  }, [agendaItems, viewYear, viewMonth]);

  const monthName = ALL_MONTHS[viewMonth];
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  const navigate = (delta) => {
    let m = viewMonth + delta;
    let y = viewYear;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    setViewMonth(m);
    setViewYear(y);
  };

  const dayNames = ['أحد', 'إثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];
  const emptyCells = Array.from({ length: firstDay }, (_, i) => i);
  const dayCells = Array.from({ length: daysInMonth }, (_, i) => i + 1);

  const isToday = (day) =>
    today.getFullYear() === viewYear && today.getMonth() === viewMonth && today.getDate() === day;

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex items-center justify-between mb-3">
          <button type="button" onClick={() => navigate(-1)} className="btn btn-ghost p-2">
            <ArrowRight size={16} />
          </button>
          <h2 className="text-base font-black flex items-center gap-2">
            <CalendarDays size={16} className="text-[color:var(--accent)]" /> {monthName} {viewYear}
          </h2>
          <button type="button" onClick={() => navigate(1)} className="btn btn-ghost p-2">
            <ArrowRight size={16} className="rotate-180" />
          </button>
        </div>

        <div className="grid grid-cols-7 gap-1 mb-2">
          {dayNames.map(d => (
            <div key={d} className="text-center text-[10px] font-black py-1" style={{ color: 'var(--text-muted)' }}>{d}</div>
          ))}
        </div>

        <div className="grid grid-cols-7 gap-1">
          {emptyCells.map(i => <div key={`e-${i}`} />)}
          {dayCells.map(day => {
            const items = itemsByDay[day] || [];
            const hasItems = items.length > 0;
            const totalAmount = items.reduce((s, it) => s + safeNumber(it.amount), 0);

            return (
              <button
                key={day}
                type="button"

const waitForGIS = (timeoutMs = 10000) => new Promise((resolve, reject) => {
  if (window.google?.accounts?.oauth2) return resolve();
  const start = Date.now();
  const timer = setInterval(() => {
    if (window.google?.accounts?.oauth2) { clearInterval(timer); resolve(); }
    else if (Date.now() - start > timeoutMs) { clearInterval(timer); reject(new Error('GIS غير محمّل')); }
  }, 150);
});

const initDriveTokenClient = async () => {
  if (_driveTokenClient) return _driveTokenClient;
  await waitForGIS();
  _driveTokenClient = window.google.accounts.oauth2.initTokenClient({ 
    client_id: DRIVE_CLIENT_ID, 
    scope: DRIVE_SCOPE, 
    callback: () => {} 
  });
  return _driveTokenClient;
};

const requestDriveToken = async () => {
  const client = await initDriveTokenClient();
  return new Promise((resolve, reject) => {
    client.callback = (resp) => {
      if (resp.error) return reject(new Error(resp.error));
      _driveAccessToken = resp.access_token;
      _driveTokenExpiry = Date.now() + (safeNumber(resp.expires_in, 3600) * 1000) - 60000;
      resolve(_driveAccessToken);
    };
    client.requestAccessToken({ prompt: _driveAccessToken ? '' : 'consent' });
  });
};

const ensureDriveToken = async () => {
  if (_driveAccessToken && Date.now() < _driveTokenExpiry) return _driveAccessToken;
  return requestDriveToken();
};

const getOrCreateBackupFolder = async () => {
  const token = await ensureDriveToken();
  const customFolderId = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;
  if (customFolderId) {
    try {

      if (checkRes.ok) {

    headers: { Authorization: `Bearer ${token}` }

/* ═══════════════════════════════════════════════════════════════
   materializeShoppingRecurring — Family App Integration
   ═══════════════════════════════════════════════════════════════ */
const materializeShoppingRecurring = async () => {
  try {
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
    const snap = await docRef.get();
    if (!snap.exists) return;
    const d = snap.data() || {};
    const rules = d.shoppingRecurring || [];
    if (!rules.length) return;
    const today = new Date().toISOString().slice(0, 10);
    const MONTHS = ALL_MONTHS;
    const due = rules.filter(r => r.active && r.nextDue && r.nextDue <= today);
    if (!due.length) return;
    
    const newTxs = [];
    const updates = [];
    due.forEach(r => {
      const t = r.template;
      const tObj = new Date(r.nextDue + 'T12:00:00');
      newTxs.push({
        id: 'rec-tx-' + r.id + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
        type: 'expense', kind: 'operational',
        category: t.category, subCategory: t.subCategory,
        amount: t.amount, quantity: t.quantity, unitPrice: t.unitPrice,
        description: t.description,
        source: 'shopping-app', sourceLabel: t.sourceLabel,
        method: t.method, linkedCardId: t.linkedCardId || undefined,
        date: r.nextDue, month: MONTHS[tObj.getMonth()], year: tObj.getFullYear(), monthIndex: tObj.getMonth(),
        subType: 'withdrawal', status: 'pending',
        recurringId: r.id, createdAt: Date.now(),
      });
      
      const prefDay = r.preferredDay || 10;
      const addMonthsWithDay = (isoStr, m, day) => {
        const dt = new Date(isoStr + 'T12:00:00');
        dt.setMonth(dt.getMonth() + m);
        dt.setDate(parseInt(day));
        return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      };
      const next = addMonthsWithDay(r.nextDue, r.frequency === 'bimonthly' ? 2 : 1, prefDay);
      updates.push({ old: r, new: { ...r, nextDue: next, lastRun: today } });
    });
    
    if (newTxs.length > 0) {
      await docRef.set({ transactions: firebase.firestore.FieldValue.arrayUnion(...newTxs) }, { merge: true });
    }
    for (const u of updates) {
      await docRef.update({ shoppingRecurring: firebase.firestore.FieldValue.arrayRemove(u.old) });
      await docRef.set({ shoppingRecurring: firebase.firestore.FieldValue.arrayUnion(u.new) }, { merge: true });
    }
    console.log('✅ Materialized', newTxs.length, 'recurring shopping items');
  } catch (e) {
    console.warn('Shopping recurring:', e);
  }
};
