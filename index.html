// ═══════════════════════════════════════════════════════
// MonthlyPlanningView (with derive)
// ═══════════════════════════════════════════════════════
const MonthlyPlanningView = memo(({ data, monthlyPlans, dispatch, saveHistory, addNotification }) => {
  const planningMonths = useMemo(() => {
    const now = new Date();
    const result = [];
    let y = now.getFullYear(), mi = now.getMonth();
    for (let i = 0; i < 6; i++) {
      result.push({ month: ALL_MONTHS[mi], year: y });
      mi++;
      if (mi > 11) { mi = 0; y++; }
    }
    return result;
  }, []);

  const pk = (m) => makeMonthKey(m.year, m.month);
  const [localPlans, setLocalPlans] = useState(() => JSON.parse(JSON.stringify(monthlyPlans || {})));
  const [hasChanges, setHasChanges] = useState(false);
  const [derivedFlags, setDerivedFlags] = useState({});

  useEffect(() => {
    setLocalPlans(JSON.parse(JSON.stringify(monthlyPlans || {})));
    setHasChanges(false);
    setDerivedFlags({});
  }, [monthlyPlans]);

  const handlePlanChange = (m, field, value) => {
    setLocalPlans(prev => ({ ...prev, [pk(m)]: { ...(prev[pk(m)] || {}), [field]: value } }));
    setDerivedFlags(prev => ({ ...prev, [`${pk(m)}-${field}`]: false }));
    setHasChanges(true);
  };

  const deriveOneMonth = (m) => {
    const derived = deriveMonthlyPlanFromHistory(data, m.year, m.month, 3);
    if (!derived) { addNotification({ type: 'warning', title: 'لا توجد بيانات كافية' }); return; }
    setLocalPlans(prev => ({ ...prev, [pk(m)]: { ...(prev[pk(m)] || {}), ...derived } }));
    const newFlags = {};
    ['expectedSalary','expectedRent','expectedCashback','expectedEmakWE','expectedZakat','expectedCashExpenses','plannedPayments'].forEach(f => { newFlags[`${pk(m)}-${f}`] = true; });
    setDerivedFlags(prev => ({ ...prev, ...newFlags }));
    setHasChanges(true);
    addNotification({ type: 'success', title: `تم استمداد ${m.month}`, message: `من: ${derived._meta.refMonths}` });
  };

  const deriveAllMonths = () => {
    const newPlans = { ...localPlans };
    const newFlags = { ...derivedFlags };
    let successCount = 0;
    planningMonths.forEach(m => {
      const derived = deriveMonthlyPlanFromHistory(data, m.year, m.month, 3);
      if (derived) {
        newPlans[pk(m)] = { ...(newPlans[pk(m)] || {}), ...derived };
        ['expectedSalary','expectedRent','expectedCashback','expectedEmakWE','expectedZakat','expectedCashExpenses','plannedPayments'].forEach(f => { newFlags[`${pk(m)}-${f}`] = true; });
        successCount++;
      }
    });
    setLocalPlans(newPlans);
    setDerivedFlags(newFlags);
    setHasChanges(true);
    addNotification({ type: 'success', title: `تم استمداد ${successCount} شهر` });
  };

  const handleSave = () => {
    saveHistory();
    const cleaned = {};
    Object.entries(localPlans).forEach(([k, p]) => {
      if (!parseMonthKey(k)) return;
      cleaned[k] = {
        expectedSalary: safeNumber(p.expectedSalary), expectedRent: safeNumber(p.expectedRent),
        expectedCashback: safeNumber(p.expectedCashback), expectedEmakWE: safeNumber(p.expectedEmakWE),
        expectedZakat: safeNumber(p.expectedZakat), expectedCash: safeNumber(p.expectedCash),
        expectedCashExpenses: safeNumber(p.expectedCashExpenses), plannedPayments: safeNumber(p.plannedPayments),
        notes: p.notes || ''
      };
    });
    dispatch({ type: 'UPDATE_MONTHLY_PLANS', payload: cleaned });
    addNotification({ type: 'success', title: 'تم الحفظ' });
    setHasChanges(false);
  };

  const computed = useMemo(() => {
    const r = {};
    planningMonths.forEach(m => {
      const p = localPlans[pk(m)] || {};
      const inc = safeNumber(p.expectedSalary) + safeNumber(p.expectedRent) + safeNumber(p.expectedCashback) + safeNumber(p.expectedEmakWE) + safeNumber(p.expectedZakat) + safeNumber(p.expectedCash);
      const out = safeNumber(p.expectedCashExpenses) + safeNumber(p.plannedPayments);
      r[pk(m)] = { inc, out, net: inc - out };
    });
    return r;
  }, [localPlans, planningMonths]);

  const totalInc = planningMonths.reduce((s, m) => s + (computed[pk(m)]?.inc || 0), 0);
  const totalOut = planningMonths.reduce((s, m) => s + (computed[pk(m)]?.out || 0), 0);
  const totalNet = totalInc - totalOut;

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card flex justify-between items-center flex-wrap gap-3">
        <div className="flex items-center gap-3">
          <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400"><Table size={16} /></div>
          <div>
            <h2 className="text-base font-black">التخطيط الشهري</h2>
            <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{planningMonths.length} شهور قادمة</p>
          </div>
        </div>
        <div className="flex gap-1.5">
          <button onClick={deriveAllMonths} className="btn btn-secondary text-xs"><Sparkles size={12} /> استمد الكل</button>
          {hasChanges && <button onClick={handleSave} className="btn btn-primary text-xs"><Save size={14} /> حفظ</button>}
        </div>
      </div>

      <div className="grid grid-cols-3 gap-2">
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>دخل متوقع</p><p className="text-sm font-black text-blue-600 mt-1">{fmt(totalInc)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>مصروف متوقع</p><p className="text-sm font-black text-red-600 mt-1">{fmt(totalOut)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>صافي</p><p className={`text-sm font-black mt-1 ${totalNet >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(totalNet)}</p></div>
      </div>

      <div className="card p-0 overflow-hidden">
        <div className="p-4 flex items-center justify-between" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
          <h3 className="font-black text-sm">الجدول</h3>
          <div className="flex items-center gap-2 text-[10px]" style={{ color: 'var(--text-muted)' }}>
            <span className="flex items-center gap-1"><Sparkles size={10} className="text-blue-500" /> = مستمد</span>
          </div>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm border-collapse min-w-[700px]">
            <thead>
              <tr>
                <th className="planning-cell-header sticky right-0 z-10 min-w-[140px] text-[11px]" style={{ background: 'var(--bg-muted)' }}>البند</th>
                {planningMonths.map(m => (
                  <th key={pk(m)} className="planning-cell-header min-w-[100px] text-[10px]">
                    <div className="flex flex-col items-center gap-1">
                      <div>{m.month}</div>
                      <div className="text-[9px]" style={{ color: 'var(--text-muted)' }}>{m.year}</div>
                      <button type="button" onClick={() => deriveOneMonth(m)} className="text-[8px] font-bold text-blue-600 flex items-center gap-0.5">
                        <Sparkles size={8} /> استمد
                      </button>
                    </div>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[
                { key: 'expectedSalary', label: 'راتب' },
                { key: 'expectedRent', label: 'إيجار' },
                { key: 'expectedCashback', label: 'كاش باك' },
                { key: 'expectedEmakWE', label: 'عهدة' },
                { key: 'expectedZakat', label: 'زكاة' },
                { key: 'expectedCash', label: 'نقدي' }
              ].map(row => (
                <tr key={row.key}>
                  <td className="planning-cell sticky right-0 z-10 text-right font-bold text-[11px]" style={{ background: 'var(--bg-card)' }}>{row.label}</td>
                  {planningMonths.map(m => {
                    const isDerived = derivedFlags[`${pk(m)}-${row.key}`];
                    const val = localPlans[pk(m)] && localPlans[pk(m)][row.key] !== undefined ? localPlans[pk(m)][row.key] : '';
                    return (
                      <td key={row.key + pk(m)} className="planning-cell relative">
                        {isDerived && <span className="absolute top-0.5 right-0.5"><Sparkles size={8} className="text-blue-500" /></span>}
                        <input type="text" inputMode="decimal" className="planning-input text-[11px]" value={val} onChange={e => handlePlanChange(m, row.key, e.target.value)} />
                      </td>
                    );
                  })}
                </tr>
              ))}
              <tr className="bg-emerald-50 dark:bg-emerald-950/30">
                <td className="planning-cell sticky right-0 z-10 font-black text-emerald-700 dark:text-emerald-400 text-[11px]" style={{ background: 'var(--bg-card)' }}>إجمالي دخل</td>
                {planningMonths.map(m => <td key={'i' + pk(m)} className="planning-cell font-black text-emerald-700 dark:text-emerald-400 text-[11px]">{fmt(computed[pk(m)]?.inc)}</td>)}
              </tr>
              <tr>
                <td className="planning-cell sticky right-0 z-10 font-bold text-[11px]" style={{ background: 'var(--bg-card)' }}>مصروف نقدي</td>
                {planningMonths.map(m => {
                  const isDerived = derivedFlags[`${pk(m)}-expectedCashExpenses`];
                  const val = localPlans[pk(m)] && localPlans[pk(m)].expectedCashExpenses !== undefined ? localPlans[pk(m)].expectedCashExpenses : '';
                  return (
                    <td key={'ce' + pk(m)} className="planning-cell relative">
                      {isDerived && <span className="absolute top-0.5 right-0.5"><Sparkles size={8} className="text-blue-500" /></span>}
                      <input type="text" inputMode="decimal" className="planning-input text-[11px]" value={val} onChange={e => handlePlanChange(m, 'expectedCashExpenses', e.target.value)} />
                    </td>
                  );
                })}
              </tr>
              <tr>
                <td className="planning-cell sticky right-0 z-10 font-bold text-[11px]" style={{ background: 'var(--bg-card)' }}>مدفوعات</td>
                {planningMonths.map(m => {
                  const isDerived = derivedFlags[`${pk(m)}-plannedPayments`];
                  const val = localPlans[pk(m)] && localPlans[pk(m)].plannedPayments !== undefined ? localPlans[pk(m)].plannedPayments : '';
                  return (
                    <td key={'pp' + pk(m)} className="planning-cell relative">
                      {isDerived && <span className="absolute top-0.5 right-0.5"><Sparkles size={8} className="text-blue-500" /></span>}
                      <input type="text" inputMode="decimal" className="planning-input text-[11px]" value={val} onChange={e => handlePlanChange(m, 'plannedPayments', e.target.value)} />
                    </td>
                  );
                })}
              </tr>
              <tr className="bg-red-50 dark:bg-red-950/30">
                <td className="planning-cell sticky right-0 z-10 font-black text-red-700 dark:text-red-400 text-[11px]" style={{ background: 'var(--bg-card)' }}>إجمالي مصروف</td>
                {planningMonths.map(m => <td key={'o' + pk(m)} className="planning-cell font-black text-red-700 dark:text-red-400 text-[11px]">{fmt(computed[pk(m)]?.out)}</td>)}
              </tr>
              <tr className="bg-blue-50 dark:bg-blue-950/30">
                <td className="planning-cell sticky right-0 z-10 font-black text-[11px]" style={{ background: 'var(--bg-card)' }}>الصافي</td>
                {planningMonths.map(m => { const n = computed[pk(m)]?.net || 0; return <td key={'n' + pk(m)} className={`planning-cell font-black text-[11px] ${n >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{n >= 0 ? '+' : ''}{fmt(n)}</td>; })}
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
});

const PlannerView = memo(({ totalLiquidityNow, monthlyPlans }) => {
  const projection = useMemo(() => {
    const seq = [];
    const now = new Date();
    let y = now.getFullYear(), mi = now.getMonth();
    for (let i = 0; i < 6; i++) {
      seq.push({ year: y, month: ALL_MONTHS[mi] });
      mi++;
      if (mi > 11) { mi = 0; y++; }
    }
    let cumulative = totalLiquidityNow;
    const result = [];
    seq.forEach(({ year, month }) => {
      const plan = monthlyPlans?.[makeMonthKey(year, month)] || {};
      const inc = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent) + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE) + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedCash);
      const out = safeNumber(plan.expectedCashExpenses) + safeNumber(plan.plannedPayments);
      const opening = cumulative;
      const net = inc - out;
      cumulative = opening + net;
      result.push({ year, month, opening, inc, out, net, running: cumulative, danger: cumulative < 0, warn: cumulative < 5000 && cumulative >= 0 });
    });
    return result;
  }, [totalLiquidityNow, monthlyPlans]);

  const maxAbsRunning = useMemo(() => Math.max(1, ...projection.map(p => Math.abs(p.running))), [projection]);
  const minPoint = useMemo(() => projection.reduce((min, p) => p.running < min.running ? p : min, projection[0] || { running: 0, month: '-' }), [projection]);
  const dangerMonths = projection.filter(p => p.danger).length;
  const totalInc = projection.reduce((s, p) => s + p.inc, 0);
  const totalOut = projection.reduce((s, p) => s + p.out, 0);

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <div>
            <h2 className="text-base font-black flex items-center gap-2"><Target className="text-emerald-500" size={18} /> المخطط الاستراتيجي</h2>
            <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>محاكاة {projection.length} شهور قادمة</p>
          </div>
          {dangerMonths > 0 && (
            <div className="badge badge-danger px-2.5 py-1.5 text-[10px] flex items-center gap-1">
              <AlertTriangle size={10} /> {dangerMonths} شهر عجز
            </div>
          )}
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>السيولة الحالية</p>
          <p className="text-base font-black text-blue-600">{fmt(totalLiquidityNow)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>إجمالي دخل</p>
          <p className="text-base font-black text-emerald-600">{fmt(totalInc)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>إجمالي مصروف</p>
          <p className="text-base font-black text-red-600">{fmt(totalOut)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>أدنى سيولة</p>
          <p className={`text-base font-black ${minPoint.running < 0 ? 'text-red-600' : 'text-amber-600'}`}>{fmt(minPoint.running)}</p>
          <p className="text-[9px] mt-0.5" style={{ color: 'var(--text-muted)' }}>في {minPoint.month}</p>
        </div>
      </div>

      <div className="card">
        <h3 className="font-black text-sm mb-4 flex items-center gap-2"><Activity className="text-blue-500" size={14} /> تدفق السيولة</h3>
        <div className="space-y-2.5">
          {projection.map((p, idx) => {
            const pct = Math.round((Math.abs(p.running) / maxAbsRunning) * 100);
            const isNeg = p.running < 0;
            return (
              <div key={idx}>
                <div className="flex justify-between items-center mb-1">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-black">{p.month}</span>
                    <span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{String(p.year).slice(2)}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className={`text-xs font-black ${isNeg ? 'text-red-600' : p.warn ? 'text-amber-600' : 'text-emerald-600'}`}>{fmt(p.running)} ج.م</span>
                    {isNeg && <span className="badge badge-danger text-[9px] px-1.5 py-0">عجز</span>}
                    {p.warn && !isNeg && <span className="badge badge-warning text-[9px] px-1.5 py-0">انتباه</span>}
                  </div>
                </div>
                <div className="w-full rounded-full h-2 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                  <div className={`h-full rounded-full ${isNeg ? 'bg-red-500' : p.warn ? 'bg-amber-500' : 'bg-gradient-to-r from-emerald-400 to-emerald-600'}`} style={{ width: `${Math.max(2, pct)}%` }}></div>
                </div>
                <div className="flex justify-between text-[9px] mt-0.5" style={{ color: 'var(--text-muted)' }}>
                  <span>+{fmt(p.inc)} / -{fmt(p.out)}</span>
                  <span>صافي: {p.net >= 0 ? '+' : ''}{fmt(p.net)}</span>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="card p-0 overflow-hidden">
        <div className="p-4" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
          <h3 className="font-black text-sm">التفاصيل الشهرية</h3>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-right text-xs">
            <thead style={{ background: 'var(--bg-muted)' }}>
              <tr>
                <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الشهر</th>
                <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>افتتاحي</th>
                <th className="p-2.5 text-[10px] font-bold text-emerald-600">دخل</th>
                <th className="p-2.5 text-[10px] font-bold text-red-600">مصروف</th>
                <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الصافي</th>
                <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الختامي</th>
                <th className="p-2.5 text-[10px] font-bold text-center" style={{ color: 'var(--text-muted)' }}>الحالة</th>
              </tr>
            </thead>
            <tbody>
              {projection.map(row => (
                <tr key={`${row.month}-${row.year}`} style={{ borderTop: '1px solid var(--border-subtle)' }}>
                  <td className="p-2.5 font-black text-[11px]">{row.month} {String(row.year).slice(2)}</td>
                  <td className="p-2.5 text-[10px]" style={{ color: 'var(--text-muted)' }}>{fmt(row.opening)}</td>
                  <td className="p-2.5 text-[10px] text-emerald-600">+{fmt(row.inc)}</td>
                  <td className="p-2.5 text-[10px] text-red-600">-{fmt(row.out)}</td>
                  <td className={`p-2.5 text-[10px] font-black ${row.net >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{row.net >= 0 ? '+' : ''}{fmt(row.net)}</td>
                  <td className={`p-2.5 text-[11px] font-black ${row.danger ? 'text-red-600' : 'text-emerald-600'}`}>{fmt(row.running)}</td>
                  <td className="p-2.5 text-center">
                    {row.danger ? <span className="badge badge-danger text-[10px]">عجز</span> : row.warn ? <span className="badge badge-warning text-[10px]">انتباه</span> : <span className="badge badge-success text-[10px]">مستقر</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
});

// LiquidityForecastView
// ═══════════════════════════════════════════════════════
const ForecastRow = ({ label, value, color, prefix }) => (
  <div className="flex justify-between items-center">
    <span className="text-xs font-semibold" style={{ color: 'var(--text-secondary)' }}>{label}</span>
    <span className={`text-sm font-black ${color}`}>{prefix || ''}{fmt(value)}</span>
  </div>
);

const LiquidityForecastView = memo(({ transactions, updatedLoans, recurringItems, liveBalances, selectedYear, selectedMonth, monthlyPlans }) => {
  const historical = useMemo(() => {
    const months = [];
    let y = selectedYear;
    let mi = getMonthIndex(selectedMonth);
    for (let i = 1; i <= 3; i++) {
      mi--;
      if (mi < 0) { mi = 11; y--; }
      months.push({ year: y, month: ALL_MONTHS[mi] });
    }
    const catData = {};
    let incomeTotal = 0, incomeMonths = 0;
    months.forEach(({ year, month }) => {
      let monthIncome = 0;
      transactions.filter(t => t.status === 'paid' && t.month === month && (t.year || 2026) === year).forEach(t => {
        const amt = safeNumber(t.amount);
        if (t.type === 'income') { monthIncome += amt; }
        else if (t.type === 'expense') {
          const c = t.category || 'أخرى';
          if (!catData[c]) catData[c] = { total: 0 };
          catData[c].total += amt;
        }
      });
      if (monthIncome > 0) { incomeTotal += monthIncome; incomeMonths++; }
    });
    const avgPerCat = {};
    let grandTotal = 0;
    Object.entries(catData).forEach(([cat, d]) => {
      avgPerCat[cat] = d.total / months.length;
      grandTotal += avgPerCat[cat];
    });
    const monthsWithData = months.filter(m => transactions.some(t => t.type === 'expense' && t.status === 'paid' && t.month === m.month && (t.year || 2026) === m.year)).length;
    return { avgPerCat, grandTotal, monthsWithData, avgIncome: incomeMonths > 0 ? incomeTotal / incomeMonths : 0 };
  }, [transactions, selectedYear, selectedMonth]);

  const currentSnapshot = useMemo(() => {
    const now = new Date();
    const y = now.getFullYear();
    const m = ALL_MONTHS[now.getMonth()];
    const monthTx = transactions.filter(t => t.month === m && (t.year || y) === y);
    const paid = monthTx.filter(t => t.status === 'paid');
    const pending = monthTx.filter(t => t.status !== 'paid');
    const paidIncome = paid.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidExpense = paid.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncome = pending.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingExpense = pending.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
    const liveTotal = ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(liveBalances[k]), 0);
    const totalTx = paid.length + pending.length;
    const completedPct = totalTx > 0 ? Math.round((paid.length / totalTx) * 100) : 0;
    return { y, m, liveTotal, paidIncome, paidExpense, pendingIncome, pendingExpense, pendingCount: pending.length, expectedEnd: liveTotal + pendingIncome - pendingExpense, completedPct };
  }, [transactions, liveBalances]);

  const projection = useMemo(() => {
    const result = [];
    let balance = currentSnapshot.expectedEnd;
    const activeLoans = updatedLoans.filter(l => !l.isReceivable && !l.autoGenerated && safeNumber(l.monthlyInstallment) > 0 && l.remaining > 0);
    const loansTotal = activeLoans.reduce((s, l) => s + safeNumber(l.monthlyInstallment), 0);
    const recurringExpenses = recurringItems.filter(r => r.type === 'expense' && isRecurringActiveInMonth(r, selectedYear, getMonthIndex(selectedMonth)));
    const recurringTotal = recurringExpenses.reduce((s, r) => s + safeNumber(r.amount), 0);
    const committedTotal = loansTotal + recurringTotal;
    let y = selectedYear;
    let mi = getMonthIndex(selectedMonth);
    for (let i = 1; i <= 3; i++) {
      mi++;
      if (mi > 11) { mi = 0; y++; }
      const month = ALL_MONTHS[mi];
      const monthKey = makeMonthKey(y, month);
      const plan = (monthlyPlans && monthlyPlans[monthKey]) || {};
      const planIncome = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent) + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE) + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedCash);
      const planCashExpenses = safeNumber(plan.expectedCashExpenses);
      const planPayments = safeNumber(plan.plannedPayments);
      const hasPlan = planIncome > 0 || planCashExpenses > 0 || planPayments > 0;
      const monthTx = transactions.filter(t => t.month === month && (t.year || y) === y);
      const pendingManualIncome = monthTx.filter(t => t.type === 'income' && t.status !== 'paid' && !t.autoGenerated && !t.sourceReceivableId).reduce((s, t) => s + safeNumber(t.amount), 0);
      const pendingManualExpense = monthTx.filter(t => t.type === 'expense' && t.status !== 'paid' && !t.sourceRecurringId).reduce((s, t) => s + safeNumber(t.amount), 0);
      const income = (hasPlan ? planIncome : historical.avgIncome) + pendingManualIncome;
      const expenses = hasPlan ? (planCashExpenses + planPayments + pendingManualExpense) : (historical.grandTotal + committedTotal + pendingManualExpense);
      const closing = balance + income - expenses;
      result.push({ year: y, month, monthKey, opening: balance, income, expenses, closing, planIncome, planCashExpenses, planPayments, pendingIncome: pendingManualIncome, pendingExpense: pendingManualExpense, committed: hasPlan ? planPayments : committedTotal, source: hasPlan ? 'plan' : 'history', hasPlan, savings: income - expenses, safety: closing < 0 ? 'danger' : closing < 5000 ? 'warn' : 'safe' });
      balance = closing;
    }
    return result;
  }, [selectedYear, selectedMonth, currentSnapshot, monthlyPlans, transactions, updatedLoans, recurringItems, historical]);

  const confidence = useMemo(() => {
    const planCount = projection.filter(p => p.hasPlan).length;
    const historyCount = historical.monthsWithData;
    if (planCount >= 2 && historyCount >= 2) return { level: 'مرتفعة', pct: 90, cls: 'badge-success' };
    if (planCount >= 1 && historyCount >= 1) return { level: 'متوسطة', pct: 75, cls: 'badge-warning' };
    if (planCount >= 1 || historyCount >= 1 || currentSnapshot.pendingCount > 0) return { level: 'منخفضة', pct: 60, cls: 'badge-warning' };
    return { level: 'غير كافية', pct: 30, cls: 'badge-danger' };
  }, [projection, historical, currentSnapshot]);

  const hasDanger = projection.some(p => p.safety === 'danger');

            <p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(currentSnapshot.paidIncome)}</p>

          <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30">
            <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مصروف</p>
            <p className="text-sm font-black text-red-600 mt-0.5">{fmt(currentSnapshot.paidExpense)}</p>
          </div>
          <div className="p-2.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
            <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>متوقع نهاية الشهر</p>

        <div className="w-full rounded-full h-1.5 overflow-hidden mb-2" style={{ background: 'var(--bg-muted)' }}>
          <div className="h-full bg-gradient-to-r from-blue-400 to-emerald-500 rounded-full" style={{ width: `${currentSnapshot.completedPct}%` }}></div>
        </div>
        <p className="text-[9px] text-center" style={{ color: 'var(--text-muted)' }}>{currentSnapshot.completedPct}% من معاملات الشهر مُنجزة</p>

      <div className="grid grid-cols-3 gap-2">
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>متوسط دخل</p><p className="text-sm font-black text-emerald-600 mt-1">{fmt(historical.avgIncome)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>متوسط مصروف</p><p className="text-sm font-black text-amber-600 mt-1">{fmt(historical.grandTotal)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>مصداقية السجل</p><p className="text-sm font-black text-blue-600 mt-1">{historical.monthsWithData}/3</p></div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
        {projection.map((p, idx) => (
          <div key={idx} className="card">
            <div className="flex justify-between items-center mb-3">
              <div className="min-w-0">
                <h3 className="text-base font-black">{p.month} {p.year}</h3>
                <span className={`badge ${p.source === 'plan' ? 'badge-brand' : 'badge-neutral'} mt-1 text-[9px]`}>{p.source === 'plan' ? '📋 من التخطيط' : '📊 من السجل'}</span>
              </div>
              <span className={`badge text-[10px] flex-shrink-0 ${p.safety === 'safe' ? 'badge-success' : p.safety === 'warn' ? 'badge-warning' : 'badge-danger'}`}>

              </span>
            </div>
            <div className="space-y-1.5 text-xs">
              <ForecastRow label="افتتاحي" value={p.opening} color="text-slate-600" />
              {p.planIncome > 0 && <ForecastRow label="📋 دخل مخطط" value={p.planIncome} color="text-emerald-600" prefix="+" />}
              {p.pendingIncome > 0 && <ForecastRow label="⏳ دخل معلق" value={p.pendingIncome} color="text-emerald-500" prefix="+" />}
              {p.planIncome === 0 && p.pendingIncome === 0 && historical.avgIncome > 0 && <ForecastRow label="📊 دخل متوقع" value={historical.avgIncome} color="text-emerald-600" prefix="+" />}
              {p.planCashExpenses > 0 && <ForecastRow label="📋 مصروف مخطط" value={p.planCashExpenses} color="text-red-500" prefix="-" />}
              {p.planPayments > 0 && <ForecastRow label="🔒 مدفوعات" value={p.planPayments} color="text-red-500" prefix="-" />}
              {p.pendingExpense > 0 && <ForecastRow label="⏳ مصروف معلق" value={p.pendingExpense} color="text-red-400" prefix="-" />}
              {p.source === 'history' && (
                <React.Fragment>
                  <ForecastRow label="📊 مصروف متغير" value={historical.grandTotal} color="text-orange-500" prefix="-" />
                  {p.committed > 0 && <ForecastRow label="🔒 التزامات" value={p.committed} color="text-red-500" prefix="-" />}
                </React.Fragment>
              )}
              <div className="pt-2 mt-2" style={{ borderTop: '1px dashed var(--border-default)' }}>
                <div className="flex justify-between items-center">
                  <span className="font-black text-xs">المتوقع</span>
                  <span className={`text-lg font-black ${p.closing >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(p.closing)}</span>
                </div>
                <div className="flex justify-between items-center mt-1">
                  <span className="text-[10px]" style={{ color: 'var(--text-muted)' }}>التوفير</span>
                  <span className={`text-[11px] font-black ${p.savings >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{p.savings >= 0 ? '+' : ''}{fmt(p.savings)}</span>

      {hasDanger && (
        <div className="card" style={{ borderColor: 'var(--danger)' }}>
          <div className="flex items-start gap-2">

              <h4 className="font-black text-xs text-red-600 mb-1">⚠️ تنبيه مبكر</h4>
              <p className="text-[11px] leading-relaxed" style={{ color: 'var(--text-secondary)' }}>عجز متوقع في: <strong>{dangerMonthsArr.join(' • ')}</strong></p>

          </div>
        </div>
      )}

});

// ═══════════════════════════════════════════════════════
// MonthComparisonView
// ═══════════════════════════════════════════════════════
const MonthComparisonView = memo(({ transactions, selectedYear, selectedMonth }) => {
  const idx = getMonthIndex(selectedMonth);
  const prevMonth = idx > 0 ? ALL_MONTHS[idx - 1] : 'ديسمبر';
  const prevYear = idx > 0 ? selectedYear : selectedYear - 1;
  const curTx = transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
  const prevTx = transactions.filter(t => t.month === prevMonth && (t.year || 2026) === prevYear);
  const calc = (txs, type) => txs.filter(t => t.type === type && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
  const curInc = calc(curTx, 'income'), curExp = calc(curTx, 'expense');
  const prevInc = calc(prevTx, 'income'), prevExp = calc(prevTx, 'expense');
  const pct = (cur, prev) => prev === 0 ? (cur > 0 ? 100 : 0) : Math.round(((cur - prev) / prev) * 100);
  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <h2 className="text-lg font-black flex items-center gap-2"><Activity className="text-indigo-500" size={18} /> مقارنة الشهور</h2>
        <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} مقارنة بـ {prevMonth} {prevYear}</p>
      </div>
      <div className="grid grid-cols-3 gap-3">
        <div className="card py-3">
          <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الدخل</p>
          <p className="text-lg font-black text-emerald-600">{fmt(curInc)}</p>
          <span className={`badge mt-1.5 ${curInc >= prevInc ? 'badge-success' : 'badge-danger'} text-[10px]`}>{curInc >= prevInc ? '↑' : '↓'} {Math.abs(pct(curInc, prevInc))}%</span>
        </div>
        <div className="card py-3">
          <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>المصروفات</p>
          <p className="text-lg font-black text-red-600">{fmt(curExp)}</p>
          <span className={`badge mt-1.5 ${curExp <= prevExp ? 'badge-success' : 'badge-danger'} text-[10px]`}>{curExp <= prevExp ? '↓' : '↑'} {Math.abs(pct(curExp, prevExp))}%</span>
        </div>
        <div className="card py-3">
          <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الصافي</p>
          <p className={`text-lg font-black ${curInc - curExp >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(curInc - curExp)}</p>
        </div>
      </div>
    </div>
  );
});

// ═══════════════════════════════════════════════════════
// CalendarView
// ═══════════════════════════════════════════════════════
const CalendarView = memo(({ data, getAgendaItems, transactions, dispatch, saveHistory, addNotification }) => {
  const [filterCat, setFilterCat] = useState('all');
  const items = getAgendaItems();
  const filtered = filterCat === 'all' ? items : items.filter(i => {
    if (filterCat === 'loans') return i.title.includes('قسط') || i.title.includes('عقاري') || i.title.includes('محل هاني');
    if (filterCat === 'cards') return i.title.includes('سداد');
    if (filterCat === 'recurring') return i.desc === 'التزام شهري متكرر' || i.desc === '💰 دخل شهري متكرر';
    if (filterCat === 'fees') return i.desc && i.desc.includes('رسم بنكي');
    return true;
  });
  const grouped = filtered.reduce((acc, item) => {
    const mn = new Date(item.date).toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });
    if (!acc[mn]) acc[mn] = [];
    acc[mn].push(item);
    return acc;
  }, {});
  const quickPay = (item) => {
    const d = new Date(item.date);
    if (isNaN(d)) return;
    const y = d.getFullYear(), m = ALL_MONTHS[d.getMonth()];
    if (data && isMonthClosed(data, y, m)) { addNotification({ type: 'error', title: 'محظور' }); return; }
    saveHistory();
    const isIncome = item.desc && item.desc.includes('دخل');
    const tx = { id: getSafeId(), type: isIncome ? 'income' : 'expense', kind: KIND.FINANCIAL, category: isIncome ? 'تكييف محمود' : 'الالتزامات البنكية والتمويلية', amount: safeNumber(item.amount), description: item.title, method: 'instapay', date: item.date, month: m, year: y, monthIndex: d.getMonth(), subType: isIncome ? 'deposit' : 'withdrawal', status: 'paid' };
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [tx, ...transactions].sort((a, b) => new Date(b.date) - new Date(a.date)) });
    addNotification({ type: 'success', title: 'تم التسجيل' });
  };
  return (
    <div className="space-y-4 animate-fadeIn pb-20">
      <div className="card py-2.5">
        <div className="flex gap-1.5 overflow-x-auto scroll-hide">
          {[{ id: 'all', label: 'الكل' }, { id: 'loans', label: 'قروض' }, { id: 'cards', label: 'بطاقات' }, { id: 'recurring', label: 'متكرر' }, { id: 'fees', label: 'رسوم' }].map(f => (
            <button key={f.id} onClick={() => setFilterCat(f.id)} className={`badge px-2.5 py-1.5 cursor-pointer whitespace-nowrap text-[10px] ${filterCat === f.id ? 'badge-brand' : 'badge-neutral'}`}>{f.label}</button>
          ))}
        </div>
      </div>
      {Object.keys(grouped).length === 0 ? (
        <div className="card text-center p-12"><Calendar size={32} className="mx-auto mb-2" style={{ color: 'var(--text-muted)' }} /><p className="font-semibold text-xs" style={{ color: 'var(--text-secondary)' }}>لا توجد مواعيد</p></div>
      ) : Object.entries(grouped).map(([month, list]) => (
        <div key={month} className="space-y-2">
          <div className="flex items-center gap-2">
            <div className="badge badge-brand px-2.5 py-1 text-[10px]">{month}</div>
            <div className="flex-1 h-px" style={{ background: 'var(--border-default)' }}></div>
            <span className="badge badge-neutral text-[10px]">{list.length}</span>
          </div>
          {list.map(item => {
            const d = calculateDaysLeft(item.date);
            const isUrg = d !== null && d <= 3 && d >= 0;
            const isOver = d !== null && d < 0;
            const Icon = item.icon;
            const isIncome = item.desc && item.desc.includes('دخل');
            return (
              <div key={item.id} className="card py-3">
                <div className="flex justify-between items-center gap-2">
                  <div className="flex items-center gap-2 flex-1 min-w-0">
                    <div className={`p-1.5 rounded-lg flex-shrink-0 ${isIncome ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-500'}`}><Icon size={14} /></div>
                    <div className="min-w-0">
                      <p className="font-bold text-xs truncate">{item.title}</p>
                      <div className="flex items-center gap-1.5 mt-0.5 flex-wrap">
                        <span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{item.date}</span>
                        {d !== null && <span className={`badge text-[9px] ${isOver ? 'badge-danger' : isUrg ? 'badge-warning' : 'badge-success'}`}>{isOver ? `متأخر ${Math.abs(d)}` : d === 0 ? 'اليوم!' : `${d} ي`}</span>}
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-1 flex-shrink-0">
                    <p className={`font-black text-xs ${isIncome ? 'text-emerald-600' : ''}`}>{fmt(item.amount)}</p>
                    <button onClick={() => quickPay(item)} title="تسجيل" className="btn btn-ghost p-1 text-emerald-500"><CheckCircle2 size={12} /></button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
});

// DashboardView

const DashboardView = memo(({ data, financeSnapshot, liveBalances, totalLiquidity, walletVisibility, onToggleVisibility, dispatch, selectedYear, selectedMonth, transactions, cards, updatedLoans, chartData, isDarkMode, addNotification, onSelectYear, onSelectMonth }) => {
  const totalCardDebt = useMemo(() => cards.reduce((s, c) => s + computeCardDebt(data, c), 0), [cards, data]);
  const totalLoanDebt = useMemo(() => updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const netPosition = totalLiquidity - (totalCardDebt + totalLoanDebt);
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);

  const pieData = useMemo(() => {
    const acc = {};
    transactions.filter(t => t.type === 'expense' && t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status === 'paid').forEach(t => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); });
    const sorted = Object.entries(acc).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
    if (sorted.length <= 5) return sorted;
    return [...sorted.slice(0, 4), { name: 'أخرى', value: sorted.slice(4).reduce((s, i) => s + i.value, 0) }];
  }, [transactions, selectedMonth, selectedYear]);

  const net = financeSnapshot;

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex items-center justify-between gap-4 flex-wrap">
          <div>
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>صافي المركز</p>
            <h2 className={`text-3xl font-black tracking-tight ${netPosition >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
              {netPosition >= 0 ? '+' : ''}{fmt(netPosition)}<span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
          </div>
          <div className="flex gap-2">
            <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center min-w-[80px]">
              <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">سيولة</p>
              <p className="text-sm font-black text-emerald-600">{fmt(totalLiquidity)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-center min-w-[80px]">
              <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مديونية</p>
              <p className="text-sm font-black text-red-600">{fmt(totalCardDebt + totalLoanDebt)}</p>
            </div>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-3 gap-2">
        <button onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', amount: '', date: getLocalISODate(), method: 'cash', subType: 'withdrawal', category: '', status: 'pending', receipts: [] } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="card py-3 flex flex-col items-center gap-1">
          <div className="p-1.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-red-600"><TrendingDown size={16} /></div>
          <span className="text-[11px] font-bold">مصروف</span>
        </button>
        <button onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'income', amount: '', date: getLocalISODate(), method: 'cash', subType: 'deposit', category: '', status: 'pending', receipts: [] } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="card py-3 flex flex-col items-center gap-1">
          <div className="p-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600"><TrendingUp size={16} /></div>
          <span className="text-[11px] font-bold">دخل</span>
        </button>
        <button onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: true })} className="card py-3 flex flex-col items-center gap-1">
          <div className="p-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600"><Layers size={16} /></div>
          <span className="text-[11px] font-bold">مصروف شهري</span>
        </button>
      </div>

      <div className="grid grid-cols-3 gap-2">
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'loans' })} className="card py-2.5 text-center">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>عهدة</p>
          <p className={`text-sm font-black ${custodySummary.balance > 0 ? 'text-blue-600' : custodySummary.balance < 0 ? 'text-red-600' : 'text-emerald-600'}`}>{fmt(custodySummary.balance)}</p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'cards' })} className="card py-2.5 text-center">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>كاش باك</p>
          <p className="text-sm font-black text-emerald-600">{fmt((data?.cashbackTrackers || []).filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear).reduce((s, t) => s + safeNumber(t.receivedAmount), 0))}</p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'transactions' })} className="card py-2.5 text-center">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>رسوم بنكية</p>

          <div className="h-48">
            {chartData.every(d => d.دخل === 0 && d.مصروف === 0) ? (
              <div className="h-full flex items-center justify-center font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد بيانات</div>

                <BarChart data={chartData}>
                  <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.08} />
                  <XAxis dataKey="name" fontSize={9} stroke="#94A3B8" />
                  <YAxis fontSize={9} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />

                  <Bar dataKey="دخل" fill="#059669" radius={[4, 4, 0, 0]} barSize={10} />

              <div className="h-full flex items-center justify-center font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد مصروفات</div>
            ) : (
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>

const CategoriesView = memo(({ transactions, selectedMonth, selectedYear, catViewType, budgets, dispatch, onSelectYear, onSelectMonth }) => {
  const catTotals = useMemo(() => transactions.filter(t => t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear).reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); return acc; }, {}), [transactions, catViewType, selectedMonth, selectedYear]);
  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card flex justify-between items-center gap-2 flex-wrap">
        <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
          <button type="button" onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'expense' })} className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'expense' ? 'shadow-sm text-red-600' : ''}`} style={catViewType === 'expense' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}>مصروفات</button>
          <button type="button" onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'income' })} className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'income' ? 'shadow-sm text-emerald-600' : ''}`} style={catViewType === 'income' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}>إيرادات</button>
        </div>
      </div>
      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />
      <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
        {CATEGORIES[catViewType].map(cat => {
          const spent = catTotals[cat] || 0;
          const budget = budgets[cat] || 0;
          if (spent === 0 && budget === 0) return null;
          return (
            <div key={cat} className="card p-3">
              <div className="flex justify-between mb-2">
                <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: CATEGORY_COLORS[cat] }}><Layers size={14} /></div>

              <h3 className="font-bold text-[11px] mb-1 truncate">{cat}</h3>

          );
        })}
      </div>
    </div>
  );
});

// ═══════════════════════════════════════════════════════
// SettingsView
// ═══════════════════════════════════════════════════════
const SettingsView = memo(({ data, accountsData, cards, budgets, dispatch, saveHistory, addNotification }) => {
  const [localAccounts, setLocalAccounts] = useState(() => JSON.parse(JSON.stringify(accountsData)));
  const [activeSection, setActiveSection] = useState('accounts');
  const [hasChanges, setHasChanges] = useState(false);
  const [driveBusy, setDriveBusy] = useState(false);
  const [driveStatus, setDriveStatus] = useState('');
  const [folderIdInput, setFolderIdInput] = useState(() => localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID);

  useEffect(() => { setLocalAccounts(JSON.parse(JSON.stringify(accountsData))); setHasChanges(false); }, [accountsData]);

  const handleAccountChange = (key, field, value) => {
    setLocalAccounts(prev => ({ ...prev, [key]: { ...prev[key], [field]: value } }));
    setHasChanges(true);
  };

  const handleSave = () => {
    saveHistory();
    const cleaned = {};
    const today = getLocalISODate();
    ACCOUNT_KEYS.forEach(k => {
      const oldBal = safeNumber(accountsData[k]?.balance);
      const newBal = parseNumberInput(localAccounts[k]?.balance);
      cleaned[k] = { ...localAccounts[k], balance: newBal, lastUpdated: (oldBal !== newBal) ? today : (localAccounts[k]?.lastUpdated || today) };
    });
    dispatch({ type: 'UPDATE_ACCOUNTS', payload: cleaned });
    addNotification({ type: 'success', title: 'تم الحفظ' });
    setHasChanges(false);
  };

  const handleDriveConnect = async () => {
    setDriveBusy(true); setDriveStatus('جاري الاتصال...');
    try { await ensureDriveToken(); setDriveStatus('متصل'); addNotification({ type: 'success', title: 'Drive متصل' }); }
    catch (e) { setDriveStatus('فشل: ' + e.message); }
    finally { setDriveBusy(false); }
  };

  const handleDriveBackupNow = async () => {
    setDriveBusy(true); setDriveStatus('جاري الرفع...');
    try {
      const payload = { data, budgets, exportedAt: new Date().toISOString(), version: 'V76' };
      const result = await uploadBackupToDrive(payload);
      const folderId = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;
      setDriveStatus(`✅ تم الرفع: ${result.name}`);
      addNotification({ type: 'success', title: 'تم رفع النسخة', duration: 6000 });
      if (folderId) {
        setTimeout(() => {
          if (window.confirm('تم الرفع! تفتح المجلد في Drive؟')) {
            window.open(`https://drive.google.com/drive/folders/${folderId}`, '_blank');
          }
        }, 600);
      }
    } catch (e) {
      setDriveStatus('❌ فشل: ' + e.message);
      addNotification({ type: 'error', title: 'فشل الرفع', message: e.message });
    } finally { setDriveBusy(false); }
  };

  const handleDriveRestore = async () => {
    setDriveBusy(true); setDriveStatus('جاري الجلب...');
    try {
      const files = await listDriveBackups();
      if (files.length === 0) { setDriveStatus('لا توجد نسخ'); setDriveBusy(false); return; }
      const labels = files.slice(0, 10).map((f, i) => `${i + 1}) ${f.name}`).join('\n');
      const choice = await showInputModal({ title: 'اختر رقم النسخة', icon: '☁️', message: labels, inputValue: '1', numeric: true, confirmText: 'استعادة' });
      if (!choice) { setDriveBusy(false); setDriveStatus(''); return; }
      const idx = Math.max(1, Math.min(files.length, parseInt(choice, 10) || 1)) - 1;
      const file = files[idx];
      const payload = await downloadBackupFromDrive(file.id);
      if (!payload || !payload.data) throw new Error('الملف لا يحتوي بيانات');
      dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'استعادة نسخة', message: 'سيتم استبدال بياناتك', onConfirm: () => {
        saveHistory();
        dispatch({ type: 'SET_DATA', payload: migrateData(payload.data) });
        if (payload.budgets) dispatch({ type: 'SET_BUDGETS', payload: payload.budgets });
        addNotification({ type: 'success', title: 'تمت الاستعادة' });
      }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
    } catch (e) { setDriveStatus('فشل: ' + e.message); }
    finally { setDriveBusy(false); }
  };

  const handleFreshStart = () => {
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'بداية جديدة', message: 'سيتم مسح كل المعاملات', onConfirm: () => {
      saveHistory();
      const zeroed = {};
      ACCOUNT_KEYS.forEach(k => { zeroed[k] = { ...(accountsData[k] || {}), balance: 0, lastUpdated: getLocalISODate() }; });
      dispatch({ type: 'SET_DATA', payload: { ...data, transactions: [], closedMonths: [], monthlySnapshots: {}, accountsData: zeroed, cards: (data.cards || []).map(c => ({ ...c, openingDebt: 0, availableBalance: safeNumber(c.limit) })), materializedRecurring: {}, custodyEntries: [], cashbackTrackers: [] } });
      addNotification({ type: 'success', title: 'تم التصفير' });
      dispatch({ type: 'HIDE_CONFIRM' });
    }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card flex justify-between items-center flex-wrap gap-3">
        <div className="flex items-center gap-2">
          <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}><Sliders size={16} /></div>
          <h2 className="text-base font-black">الإعدادات</h2>
        </div>
        {hasChanges && <button onClick={handleSave} className="btn btn-primary text-xs"><Save size={14} /> حفظ</button>}
      </div>

      <div className="card p-1 flex gap-1.5">
        <button onClick={() => setActiveSection('accounts')} className={`flex-1 py-2.5 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 ${activeSection === 'accounts' ? 'text-white shadow-sm' : ''}`} style={activeSection === 'accounts' ? { background: 'var(--brand)' } : { color: 'var(--text-muted)' }}><Wallet size={14} /> الحسابات</button>
      </div>

      {activeSection === 'accounts' && (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          {ACCOUNT_KEYS.map(key => {
            const acc = localAccounts[key] || {};
            const Icon = ACCOUNT_ICONS[key] || Wallet;
            return (
              <div key={key} className="card">
                <div className="flex justify-between items-center mb-3">
                  <div className="flex items-center gap-2">
                    <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}><Icon size={14} /></div>
                    <h4 className="font-black text-xs">{acc.label || key}</h4>
                  </div>
                </div>
                <div className="space-y-2.5">
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الرصيد الأساسي</label>
                    <input type="text" inputMode="decimal" value={acc.balance !== undefined ? acc.balance : ''} onChange={e => handleAccountChange(key, 'balance', e.target.value)} className="input-field text-base font-black text-blue-600 text-center py-2" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>تاريخ التثبيت</label>
                    <input type="date" value={acc.lastUpdated || ''} onChange={e => handleAccountChange(key, 'lastUpdated', e.target.value)} className="input-field text-center font-bold text-xs py-2" />
                  </div>
                  <div className="p-2 rounded-lg text-center" style={{ background: 'var(--bg-muted)' }}>
                    <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>الرصيد الحي</p>
                    <p className="font-black text-emerald-600 text-xs">{fmt(computeBalance({ ...data, accountsData: localAccounts }, key))}</p>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div className="card">
        <div className="flex items-center gap-2 mb-3">
          <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600"><Lock size={14} /></div>
          <h3 className="font-black text-sm">رمز الدخول (PIN)</h3>
        </div>
        <p className="text-[11px] mb-3" style={{ color: 'var(--text-muted)' }}>الرمز الافتراضي: <strong>1033</strong></p>
        <button onClick={() => dispatch({ type: 'SET_PIN_CHANGE_OPEN', payload: true })} className="btn btn-secondary text-xs w-full"><Lock size={12} /> تغيير الرمز</button>
      </div>

      <details className="card p-0 overflow-hidden" open>
        <summary className="p-4 cursor-pointer list-none flex items-center justify-between">
          <div className="flex items-center gap-2"><Cloud size={14} className="text-blue-500" /><span className="font-bold text-xs">Google Drive</span></div>
          <ChevronDown size={14} style={{ color: 'var(--text-muted)' }} />
        </summary>
        <div className="px-4 pb-4 space-y-3" style={{ borderTop: '1px solid var(--border-subtle)', paddingTop: '12px' }}>
          <div>
            <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>Folder ID</label>
            <div className="flex gap-1.5">
              <input
                type="text"
                className="input-field text-[11px] py-2 flex-1"
                value={folderIdInput}
                onChange={(e) => setFolderIdInput(e.target.value)}
                onBlur={(e) => {
                  const v = e.target.value.trim();
                  if (v) {
                    localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, v);
                    addNotification({ type: 'success', title: 'تم حفظ Folder ID' });
                  }
                }}
              />
              <button
                type="button"
                onClick={() => {
                  const id = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;
                  window.open(`https://drive.google.com/drive/folders/${id}`, '_blank');
                }}
                className="btn btn-secondary text-[11px] py-2 px-2.5"
              >
                <Cloud size={12} /> فتح
              </button>
            </div>
          </div>
          <div className="flex flex-wrap gap-1.5">
            <button type="button" onClick={handleDriveConnect} disabled={driveBusy} className="btn btn-secondary text-[11px] py-1.5 px-2.5"><Cloud size={12} /> اتصال</button>
            <button type="button" onClick={handleDriveBackupNow} disabled={driveBusy} className="btn btn-primary text-[11px] py-1.5 px-2.5"><Upload size={12} /> نسخة الآن</button>
            <button type="button" onClick={handleDriveRestore} disabled={driveBusy} className="btn btn-secondary text-[11px] py-1.5 px-2.5"><Download size={12} /> استعادة</button>
          </div>
          {driveStatus && <p className="text-[10px] font-semibold whitespace-pre-line" style={{ color: 'var(--text-muted)' }}>{driveStatus}</p>}
        </div>
      </details>

      <div className="card" style={{ borderColor: 'var(--warning)' }}>
        <div className="flex items-center gap-2 mb-3">
          <ShieldAlert size={16} className="text-amber-500" />
          <h3 className="font-black text-sm">إجراءات احتياطية</h3>
        </div>
        <button onClick={handleFreshStart} className="btn btn-secondary text-xs w-full text-red-600 py-2"><Trash2 size={12} /> بداية جديدة</button>
      </div>
    </div>
  );
});

// PinChangeModal
// ═══════════════════════════════════════════════════════
const PinChangeModal = ({ onClose, addNotification }) => {
  const [current, setCurrent] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (!/^\d{4}$/.test(next)) { addNotification({ type: 'error', title: 'الرمز 4 أرقام' }); return; }
    if (next !== confirm) { addNotification({ type: 'error', title: 'غير متطابق' }); return; }
    setBusy(true);
    const ok = await verifyPin(current);
    if (!ok) { addNotification({ type: 'error', title: 'الرمز الحالي خطأ' }); setBusy(false); return; }
    await savePinHash(next);
    addNotification({ type: 'success', title: 'تم التغيير' });
    setBusy(false);
    onClose();
  };
  return (
    <Modal isOpen={true} onClose={onClose} title="تغيير رمز الدخول" icon="🔐">
      <div className="space-y-3">
        <div><label className="text-[11px] font-bold block mb-1">الرمز الحالي</label><input type="password" inputMode="numeric" maxLength={4} className="input-field text-center text-lg font-black tracking-widest" value={current} onChange={e => setCurrent(e.target.value.replace(/\D/g, ''))} /></div>
        <div><label className="text-[11px] font-bold block mb-1">الجديد</label><input type="password" inputMode="numeric" maxLength={4} className="input-field text-center text-lg font-black tracking-widest" value={next} onChange={e => setNext(e.target.value.replace(/\D/g, ''))} /></div>
        <div><label className="text-[11px] font-bold block mb-1">التأكيد</label><input type="password" inputMode="numeric" maxLength={4} className="input-field text-center text-lg font-black tracking-widest" value={confirm} onChange={e => setConfirm(e.target.value.replace(/\D/g, ''))} /></div>
        <button onClick={submit} disabled={busy} className="btn btn-primary w-full py-2.5 text-sm">{busy ? '...' : 'حفظ'}</button>
      </div>
    </Modal>
  );
};

    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider)
      .then((result) => {
        if (result.user.email === "ahmedmkh@gmail.com") onLogin();
        else { setError('دخول غير مصرح'); firebase.auth().signOut(); }

      <div className="w-full max-w-sm">

        {error && (<div className="mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-xs font-bold flex items-center gap-2"><AlertTriangle size={14} /> {error}</div>)}
        <button onClick={handleGoogleLogin} disabled={isLoading} className="w-full bg-white text-slate-900 py-4 px-6 rounded-2xl font-black text-sm flex items-center justify-center gap-3 shadow-xl disabled:opacity-50">
          {isLoading ? 'جاري الدخول...' : 'تسجيل الدخول'}
        </button>
      </div>
    </div>
  );
};

const PinLockScreen = ({ onSuccess, onLogout }) => {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const [success, setSuccess] = useState(false);
  const handleDigit = (d) => {
    if (pin.length >= 4 || success) return;
    const next = pin + d;
    setPin(next);
    if (next.length === 4) {
      setTimeout(async () => {
        const ok = await verifyPin(next);
        if (ok) { setSuccess(true); setTimeout(() => onSuccess(), 500); }
        else { setError(true); setTimeout(() => { setPin(''); setError(false); }, 650); }
      }, 150);
    }
  };
  const handleDelete = () => { if (!success) setPin(p => p.slice(0, -1)); };
  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{ background: 'radial-gradient(ellipse at top, #2A2418 0%, #1A1508 55%, #0F0B04 100%)' }}>
      <div className={`relative w-full max-w-sm ${error ? 'animate-shake' : ''}`}>
        <div className="flex flex-col items-center mb-8">
          <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mb-4 ${success ? 'bg-emerald-500' : error ? 'bg-red-500/20' : 'bg-blue-500/10'}`}>
            {success ? <CheckCircle2 size={28} className="text-white" /> : error ? <AlertTriangle size={26} className="text-red-400" /> : <Lock size={26} className="text-blue-400" />}
          </div>
          <h1 className="text-xl font-black text-white mb-1">{success ? 'مرحباً ✓' : error ? 'رمز خطأ' : 'أدخل الرمز'}</h1>
        </div>
        <div className="flex justify-center gap-3 mb-8 h-4">
          {[0,1,2,3].map(i => (<div key={i} className={`w-3 h-3 rounded-full ${success ? 'bg-emerald-400' : error ? 'bg-red-500' : pin.length > i ? 'bg-blue-400' : 'bg-transparent border-2 border-slate-600'}`}></div>))}
        </div>
        <div className="grid grid-cols-3 gap-3 mb-6">
          {['1','2','3','4','5','6','7','8','9'].map(d => (<button key={d} type="button" onClick={() => handleDigit(d)} className="aspect-square rounded-2xl font-black text-xl bg-white/[0.04] border border-white/[0.08] text-white">{d}</button>))}
          <div className="aspect-square"></div>
          <button type="button" onClick={() => handleDigit('0')} className="aspect-square rounded-2xl font-black text-xl bg-white/[0.04] border border-white/[0.08] text-white">0</button>
          <button type="button" onClick={handleDelete} className="aspect-square rounded-2xl flex items-center justify-center" style={{ color: '#8A8270' }}><Delete size={20} /></button>
        </div>
        <button type="button" onClick={onLogout} className="w-full py-3 text-xs font-bold flex items-center justify-center gap-2" style={{ color: '#8A8270' }}><LogOut size={14} /> خروج</button>
      </div>
    </div>
  );
};
