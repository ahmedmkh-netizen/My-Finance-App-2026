/* ─────────── Money — عرض المبالغ ─────────── */
const Money = memo(({
  value, currency = "ج.م", size = "md", color = null,
  showSign = false, animated = false, short = false,
  adaptive = false, className = "",
}) => {
  const displayValue = safeNumber(value);
  const isNegative = displayValue < 0;

  let displayText;
  if (short) displayText = fmtShort(Math.abs(displayValue));
  else if (adaptive) displayText = formatAdaptive(Math.abs(displayValue));
  else displayText = fmt(Math.abs(displayValue));

  const sizeClass = {
    xs: { fontSize: 11, fontWeight: 800 },
    sm: { fontSize: 13, fontWeight: 800 },
    md: { fontSize: 15, fontWeight: 900 },
    lg: { fontSize: 20, fontWeight: 900 },
    xl: { fontSize: 28, fontWeight: 900 },
    "2xl": { fontSize: 34, fontWeight: 900 },
  }[size] || { fontSize: 15, fontWeight: 900 };

  const finalColor = color || (isNegative ? "var(--negative)" : "var(--text-primary)");
  const prefix = showSign && !isNegative ? "+" : isNegative ? "−" : "";

  const content = (
    <>
      {prefix}
      {displayText}
      {currency && (
        <span style={{ fontSize: "0.65em", opacity: 0.6, marginRight: 4, fontWeight: 700 }}>
          {currency}
        </span>
      )}
    </>
  );

  if (animated) {
    return (
      <AnimatedMoney value={Math.abs(displayValue)} sizeClass={sizeClass} color={finalColor} prefix={prefix} currency={currency} />
    );
  }

  return (
    <span
      className={`money tabular ${className}`}
      style={{ ...sizeClass, color: finalColor, letterSpacing: "-0.02em" }}
    >
      {content}
    </span>
  );
});

/* ─────────── AnimatedMoney ─────────── */
const AnimatedMoney = memo(({ value, sizeClass, color, prefix, currency }) => {
  const [display, setDisplay] = useState(0);
  const rafRef = useRef(null);
  const startRef = useRef(null);
  const startValRef = useRef(0);

  useEffect(() => {
    const target = safeNumber(value);
    const startVal = display;
    startValRef.current = startVal;
    const diff = target - startVal;
    if (Math.abs(diff) < 0.005) { setDisplay(target); return; }

    startRef.current = performance.now();
    const animate = (now) => {
      const elapsed = now - startRef.current;
      const progress = Math.min(elapsed / 800, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setDisplay(startValRef.current + diff * eased);
      if (progress < 1) rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [value]);

  return (
    <span className="money tabular" style={{ ...sizeClass, color, letterSpacing: "-0.02em" }}>
      {prefix}
      {display.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
      {currency && (
        <span style={{ fontSize: "0.65em", opacity: 0.6, marginRight: 4, fontWeight: 700 }}>
          {currency}
        </span>
      )}
    </span>
  );
});

const MethodLogo = memo(({ methodId, size = "sm" }) => {

  const method = getPaymentMethodMeta(methodId);

  const boxSize = { xs: 24, sm: 32, md: 40, lg: 48 }[size] || 32;
  const padding = size === "xs" ? 2 : 4;

  if (!method) return null;

  let logoUrl = null;
  if (methodId === "fawry") logoUrl = `${LOGO_BASE_URL}Fawry-Logo.jpg.webp`;
  else if (methodId === "etisalat") logoUrl = `${LOGO_BASE_URL}Etslat.jpg`;
  else if (methodId === "cib_savings") logoUrl = `${LOGO_BASE_URL}cib-logo.png`;
  else if (methodId === "aaib_savings") logoUrl = `${LOGO_BASE_URL}AAIB-logo.jpg`;
  else if (methodId === "cib_card") logoUrl = `${LOGO_BASE_URL}cib-logo.png`;
  else if (methodId === "cib_swype") logoUrl = `${LOGO_BASE_URL}cib-logo.png`;
  else if (methodId === "aaib_card") logoUrl = `${LOGO_BASE_URL}AAIB-logo.jpg`;
  else if (methodId === "adib_card") logoUrl = `${LOGO_BASE_URL}ADIB-logo.png`;

  return (

/* ═══════════════════════════════════════════════════════════════════
   3) SMART TRANSACTION BADGE — Badge ذكي واحد
   بدل ما نعرض 9 badges، نعرض أهم واحد فقط
   ═══════════════════════════════════════════════════════════════════ */

const TransactionBadge = memo(({ tx, pendingDeleteIds, isMonthClosedFlag }) => {
  if (!tx) return null;

  /* ترتيب الأولوية */
  /* 1. Pending Delete Request — الأعلى */
  if (pendingDeleteIds && pendingDeleteIds.has(tx.id)) {
    return <Badge variant="warning" icon={Trash2} size="xs">طلب مسح</Badge>;
  }

  /* 2. Hany Marker (carryover) */
  if (isCarryoverMarker(tx)) {
    return <Badge variant="warning" size="xs">📌 ترحيل</Badge>;
  }

  /* 3. Hany Purchase */
  if (isHanyPurchaseTx(tx)) {
    return <Badge variant="warning" size="xs">🛒 هاني</Badge>;
  }

  /* 4. Hany Settle */
  if (isHanySettleTx(tx)) {
    return <Badge variant="positive" size="xs">💵 سداد هاني</Badge>;
  }

  /* 5. Card Payment */
  if (tx.linkedCardId && isCardPaymentTx(tx, tx.linkedCardId)) {
    return <Badge variant="positive" size="xs">💳 سداد بطاقة</Badge>;
  }

  /* 6. Family */
  if (isFamilyTx(tx)) {
    const member = getFamilyMember(tx);
    if (member) return <Badge variant="brand" size="xs">{member.name}</Badge>;
  }

  /* 7. SMS */
  if (tx.source === "sms") {
    const last4 = tx.cardLast4 || (tx.linkedCardId
      ? DEFAULT_CARDS.find((c) => c.id === tx.linkedCardId)?.last4
      : null);
    return <Badge variant="brand" size="xs">SMS{last4 ? ` ••••${last4}` : ""}</Badge>;
  }

  /* 8. Recurring */
  if (tx.sourceRecurringId) {
    return <Badge variant="warning" size="xs">تلقائي</Badge>;
  }

  /* 9. Carryover */
  if (tx.source === "carryover") {
    return <Badge variant="warning" size="xs">مرحّل{tx.carryCount ? ` ×${tx.carryCount}` : ""}</Badge>;
  }

  /* 10. Transfer */
  if (tx.linkedTransferId || tx.source === "external-transfer") {
    if (tx.transferDirection === "in")
      return <Badge variant="positive" size="xs">↓ وارد</Badge>;
    if (tx.transferDirection === "out")
      return <Badge variant="brand" size="xs">↑ صادر</Badge>;
    if (tx.transferDirection === "fee")
      return <Badge variant="warning" size="xs">رسوم</Badge>;
    return <Badge variant="brand" size="xs">تحويل</Badge>;
  }

  /* 11. Installment */
  if (tx.installmentPlanId) {
    return <Badge variant="brand" size="xs">📅 تقسيط</Badge>;
  }

  /* 12. Reconciliation */
  if (tx.source === "reconciliation") {
    return <Badge variant="warning" size="xs">⚖️ تسوية</Badge>;
  }

  /* 13. Telda */
  if (EXTERNAL_TRANSFER_METHOD_IDS.includes(tx.method) || tx.transferChannel) {
    return <Badge variant="brand" size="xs">Telda</Badge>;
  }

  return null;
});

/* ═══════════════════════════════════════════════════════════════════
   4) SAFE DATE INPUT — لحل مشكلة iOS
   ═══════════════════════════════════════════════════════════════════ */
const SafeDateInput = memo(({ value, onChange, className, style, ...props }) => {
  const inputRef = useRef(null);

  const handleChange = (e) => {
    const val = e.target.value;
    if (!val && value) {
      setTimeout(() => {
        if (inputRef.current) inputRef.current.value = value;
      }, 0);
      return;
    }
    onChange(val);
  };

  return (
    <input
      ref={inputRef}
      type="date"
      value={value || ""}
      onChange={handleChange}
      onBlur={(e) => { if (!e.target.value && value) onChange(value); }}
      className={className}
      style={{ direction: "ltr", textAlign: "right", ...style }}
      {...props}
    />
  );
});

/* ═══════════════════════════════════════════════════════════════════
   9) STATUS BAR — حالة الاتصال
   ═══════════════════════════════════════════════════════════════════ */
const StatusBar = memo(({ isOnline, syncStatus, isSaving, hanyPayable = 0 }) => {
  const netDot = isOnline ? "online" : "offline";
  const netLabel = isOnline ? "نت" : "بدون نت";

  let syncDot = "online", syncLabel = "متزامن", syncTitle = "البيانات متزامنة";
  if (!isOnline || syncStatus === "offline") {
    syncDot = "offline"; syncLabel = "محلي"; syncTitle = "التغييرات محفوظة محلياً";
  } else if (syncStatus === "error") {
    syncDot = "error"; syncLabel = "خطأ"; syncTitle = "فشل المزامنة";
  } else if (isSaving || syncStatus === "syncing" || syncStatus === "pending") {
    syncDot = "syncing"; syncLabel = "حفظ..."; syncTitle = "جاري الحفظ";
  }

  return (
    <div className="status-bar no-print">
      <div className={`status-dot ${netDot}`} title={netLabel} />
      <span>{netLabel}</span>
      <span style={{ color: "var(--border-strong)" }}>•</span>
      <div className={`status-dot ${syncDot}`} title={syncTitle} />
      <span>{syncLabel}</span>
      {hanyPayable > 0 && (
        <>
          <span style={{ color: "var(--border-strong)" }}>•</span>
          <span style={{
            color: "var(--warning)", fontSize: 10, fontWeight: 900,
            fontVariantNumeric: "tabular-nums",
          }}>
            هاني: {fmtShort(hanyPayable)}
          </span>
        </>
      )}
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════════
   2) BOTTOM NAV — 5 عناصر فقط
   ═══════════════════════════════════════════════════════════════════ */
const BottomNav = memo(({
  activeTab, onNavigate, onQuickAdd, onMore,
}) => {
  const isMore = [
    "categories", "loans", "financial-forecast", "reports",
    "duplicates", "data-health", "deleted", "settings", "calendar", "cards",
  ].includes(activeTab);

  const items = [
    { id: "dashboard", label: "الرئيسية", icon: Home },
    { id: "transactions", label: "المعاملات", icon: Receipt },
    { id: "_center", label: "", icon: Plus, isCenter: true },
    { id: "hany", label: "هاني", icon: StoreIcon },
    { id: "_more", label: "المزيد", icon: MoreHorizontal },
  ];

  return (
    <div className="bottom-nav no-print">
      <div className="nav-grid">
        {items.map((item) => {
          const Icon = item.icon;

          if (item.isCenter) {
            return (
              <button
                key={item.id}
                type="button"
                onClick={onQuickAdd}
                className="nav-center"
                aria-label="إضافة سريعة"
              >
                <Plus size={24} />
              </button>
            );
          }

          if (item.id === "_more") {
            return (
              <button
                key={item.id}
                type="button"
                onClick={onMore}
                className={`nav-btn ${isMore ? "active" : ""}`}
              >
                <Icon size={20} />
                <span>{item.label}</span>
              </button>
            );
          }

          const isActive = activeTab === item.id;
          return (
            <button
              key={item.id}
              type="button"
              onClick={() => onNavigate(item.id)}
              className={`nav-btn ${isActive ? "active" : ""}`}
            >
              <Icon size={20} />
              <span>{item.label}</span>
            </button>
          );
        })}

});

/* ═══════════════════════════════════════════════════════════════════
   4) TRANSACTION ROW — صف معاملة
   ═══════════════════════════════════════════════════════════════════ */
const TransactionRow = memo(({
  tx, onApprove, onEdit, onDelete, onReopen,
  isMonthClosedFlag, pendingDeleteIds,
}) => {
  const isPending = tx.status !== "paid";
  const isIncome = tx.type === "income";
  const time = formatTxTime(tx.createdAt);
  const categoryIcon = getCategoryIcon(tx.category);
  const categoryColor = getCategoryColor(tx.category);

  return (
    <div className="tx-mini">
      {/* Category icon */}
      <div style={{
        width: 36, height: 36, borderRadius: 11,
        display: "flex", alignItems: "center", justifyContent: "center",
        background: `${categoryColor}20`,
        fontSize: 16, flexShrink: 0,
      }}>
        {categoryIcon}
      </div>

      {/* Info */}
      <div className="tx-mini__info">
        <div className="tx-mini__desc">
          {tx.description || tx.category}
        </div>
        <div className="tx-mini__sub">
          <TransactionBadge tx={tx} pendingDeleteIds={pendingDeleteIds} />
          {time && <span>{time}</span>}
          <span>· {getPaymentMethodShort(tx.method)}</span>
          {isPending && (
            <span style={{ color: "var(--warning)", fontWeight: 800 }}>· معلق</span>
          )}
        </div>
      </div>

      {/* Amount */}
      <div className={`tx-mini__amount ${isIncome ? "text-positive" : "text-negative"}`}>
        {isIncome ? "+" : "−"}{fmt(tx.amount)}
      </div>

      {/* Actions */}
      <div style={{ display: "flex", gap: 3, flexShrink: 0 }}>
        {isPending && !isMonthClosedFlag && (
          <button
            type="button"
            onClick={(e) => { e.stopPropagation(); onApprove(tx); }}
            title="اعتماد"
            style={{
              width: 26, height: 26, borderRadius: 8,
              display: "flex", alignItems: "center", justifyContent: "center",
              background: "var(--positive-soft)", color: "var(--positive)",
              border: "none", cursor: "pointer",
              transition: "transform 0.15s ease",
            }}
            onMouseDown={(e) => { e.currentTarget.style.transform = "scale(0.9)"; }}
            onMouseUp={(e) => { e.currentTarget.style.transform = "scale(1)"; }}
          >
            <CheckCircle2 size={12} />
          </button>
        )}
        {!isMonthClosedFlag && (
          <>
            <button
              type="button"
              onClick={(e) => { e.stopPropagation(); onEdit(tx); }}
              title="تعديل"
              style={{
                width: 26, height: 26, borderRadius: 8,
                display: "flex", alignItems: "center", justifyContent: "center",
                background: "var(--bg-muted)", color: "var(--text-secondary)",
                border: "none", cursor: "pointer",
              }}
            >
              <Edit size={12} />
            </button>
            <button
              type="button"
              onClick={(e) => { e.stopPropagation(); onDelete(tx); }}
              title="حذف"
              style={{
                width: 26, height: 26, borderRadius: 8,
                display: "flex", alignItems: "center", justifyContent: "center",
                background: "var(--negative-soft)", color: "var(--negative)",
                border: "none", cursor: "pointer",
              }}
            >
              <Trash2 size={12} />
            </button>
          </>
        )}
      </div>
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════════
   5) CATEGORY CARD — بطاقة فئة قابلة للطي
   ═══════════════════════════════════════════════════════════════════ */
const CategoryCard = memo(function CategoryCard({
  category, items, isOpen, onToggle,
  isMonthClosedFlag,
  onApproveOne, onReopenOne, onEditOne, onDeleteOne,
  onApproveAll, onDeleteAll,
  pendingDeleteIds,
}) {
  const total = useMemo(
    () => items.reduce((s, t) => s + safeNumber(t.amount), 0),
    [items],
  );
  const pendingCount = useMemo(
    () => items.filter((t) => t.status !== "paid").length,
    [items],
  );
  const color = getCategoryColor(category);
  const icon = getCategoryIcon(category);
  const isIncome = items[0]?.type === "income";

  return (
    <div className="cat-card">
      <div
        className="cat-card__header"
        onClick={onToggle}
        role="button"
        tabIndex={0}
        onKeyDown={(e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            onToggle();
          }
        }}
      >
        <span className="cat-card__stripe" style={{ background: color }} />
        <div className="cat-card__icon" style={{ background: `${color}20` }}>
          {icon}
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="cat-card__title">
            <span style={{
              overflow: "hidden", textOverflow: "ellipsis",
              whiteSpace: "nowrap", maxWidth: "100%",
            }}>
              {category}
            </span>
            {pendingCount > 0 && (
              <Badge variant="warning" size="xs">
                <Clock size={8} /> {pendingCount}
              </Badge>
            )}
          </div>
          <div className="cat-card__meta">
            <span>📊 {items.length} {items.length === 1 ? "عملية" : "عمليات"}</span>
            {isMonthClosedFlag && <span style={{ color: "var(--warning)" }}>🔒 مغلق</span>}
          </div>
        </div>
        <div style={{ textAlign: "left", flexShrink: 0 }}>
          <div className="cat-card__total" style={{
            color: isIncome ? "var(--positive)" : "var(--text-primary)",
          }}>
            {isIncome ? "+" : "−"}{fmt(total)}
            <span style={{
              fontSize: 10, color: "var(--text-muted)",
              marginRight: 3, fontWeight: 700,
            }}>
              ج.م
            </span>
          </div>
        </div>
        <div className={`cat-card__toggle ${isOpen ? "open" : ""}`}>
          <ChevronDown size={14} />
        </div>
      </div>

      {isOpen && (
        <div className="cat-card__body">
          {items.map((t) => (
            <TransactionRow
              key={t.id}
              tx={t}
              onApprove={onApproveOne}
              onReopen={onReopenOne}
              onEdit={onEditOne}
              onDelete={onDeleteOne}
              isMonthClosedFlag={isMonthClosedFlag}
              pendingDeleteIds={pendingDeleteIds}
            />
          ))}

          <div style={{
            display: "flex", gap: 6, flexWrap: "wrap",
            paddingTop: 8, marginTop: 4,
            borderTop: "1px dashed var(--border)",
          }}>
            {pendingCount > 0 && !isMonthClosedFlag && (
              <button
                type="button"
                onClick={(e) => {
                  e.stopPropagation();
                  onApproveAll(items.filter((t) => t.status !== "paid"));
                }}
                className="btn btn-primary"
                style={{ flex: 1, minWidth: 130, fontSize: 11, padding: "8px 12px" }}
              >
                <CheckCircle2 size={12} /> اعتماد الكل ({pendingCount})
              </button>
            )}
            {!isMonthClosedFlag && (
              <button
                type="button"
                onClick={(e) => {
                  e.stopPropagation();
                  onDeleteAll(items);
                }}
                className="btn btn-secondary"
                style={{
                  flex: 1, minWidth: 100, fontSize: 11, padding: "8px 12px",
                  color: "var(--negative)",
                }}
              >
                <Trash2 size={12} /> حذف الكل
              </button>
            )}
            {isMonthClosedFlag && (
              <Badge variant="positive" size="sm">
                <Lock size={10} /> الشهر مغلق
              </Badge>
            )}
          </div>
        </div>
      )}
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════════
   6) DASHBOARD PAGE
   ═══════════════════════════════════════════════════════════════════ */
const DashboardPage = memo(({
  data, liveBalances, liquidityDual, netWorthData,
  dispatch, selectedYear, selectedMonth,
  transactions, cards, updatedLoans,
  onSelectYear, onSelectMonth,
  onNavigate, onOpenQuickAdd,
}) => {
  const [quote] = useState(
    () => DAILY_DHIKR[Math.floor(Math.random() * DAILY_DHIKR.length)],
  );

  const totalCardDebt = useMemo(
    () => cards.reduce((s, c) => s + Math.max(0, computeCardDebt(data, c)), 0),
    [cards, data],
  );
  const totalLoanDebt = useMemo(
    () => updatedLoans.filter((l) => !l.isReceivable).reduce((s, l) => s + l.remaining, 0),
    [updatedLoans],
  );

  const hanyPayable = netWorthData.hanyPayable;
  const netPosition = netWorthData.netWorth;
  const isPositive = netPosition >= 0;

  const monthPendingCount = transactions.filter(
    (t) =>
      t.month === selectedMonth && (t.year || 2026) === selectedYear &&
      t.status !== "paid" && !isCarryoverMarker(t),
  ).length;

  const monthPendingTotal = useMemo(() => {
    return transactions
      .filter(
        (t) =>
          t.month === selectedMonth && (t.year || 2026) === selectedYear &&
          t.status !== "paid" && !isCarryoverMarker(t),
      )
      .reduce((s, t) => s + safeNumber(t.amount), 0);
  }, [transactions, selectedMonth, selectedYear]);

  const last30ChartData = useMemo(() => {
    const days = [];
    const today = new Date();
    for (let i = 29; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const iso = getLocalISODate(d);
      let inc = 0, exp = 0;
      transactions.forEach((t) => {
        if (t.status !== "paid" || t.date !== iso || isCarryoverMarker(t)) return;
        if (t.type === "income") inc += safeNumber(t.amount);
        else if (t.type === "expense") exp += safeNumber(t.amount);
      });
      days.push({ name: String(d.getDate()), دخل: inc, مصروف: exp });
    }
    return days;
  }, [transactions]);

  const monthCard = useMemo(() => {
    const monthTxs = transactions.filter(
      (t) =>
        t.month === selectedMonth && (t.year || 2026) === selectedYear &&
        !isCarryoverMarker(t),
    );
    const paid = monthTxs.filter((t) => t.status === "paid");
    const inc = paid.filter((t) => t.type === "income").reduce((s, t) => s + safeNumber(t.amount), 0);
    const exp = paid.filter((t) => t.type === "expense").reduce((s, t) => s + safeNumber(t.amount), 0);
    return { inc, exp, net: inc - exp };
  }, [transactions, selectedMonth, selectedYear]);

  return (
    <div className="animate-fadeIn" style={{ paddingBottom: 24 }}>
      {/* ═══ HERO — صافي المركز ═══ */}
      <div className="hero animate-slideUp">
        <div style={{
          display: "flex", alignItems: "flex-start", justifyContent: "space-between",
          marginBottom: 20, gap: 12, flexWrap: "wrap",
        }}>
          <div style={{ flex: 1, minWidth: 180 }}>
            <p style={{ fontSize: 12, fontWeight: 800, opacity: 0.75, margin: 0 }}>
              مساء الخير، أحمد 👋
            </p>
            <p style={{
              fontSize: 11, fontWeight: 600, opacity: 0.6,
              marginTop: 4, marginBottom: 0,
            }}>
              {quote}
            </p>
          </div>
          <button
            onClick={() => onNavigate("settings")}
            style={{
              display: "flex", alignItems: "center", gap: 6,
              padding: "6px 10px", borderRadius: 12,
              background: "rgba(255,255,255,0.12)",
              border: "1px solid rgba(255,255,255,0.18)",
              color: "white", fontSize: 11, fontWeight: 900,
              cursor: "pointer", fontFamily: "inherit", flexShrink: 0,
            }}
          >
            <CalendarDays size={11} />
            {selectedMonth} {selectedYear}
            <ChevronDown size={11} style={{ opacity: 0.7 }} />
          </button>
        </div>

        <div style={{ marginBottom: 8 }}>
          <p style={{
            fontSize: 10, fontWeight: 800, textTransform: "uppercase",
            letterSpacing: 1, opacity: 0.6, marginBottom: 6,
          }}>
            صافي المركز (Net Worth)
          </p>
          <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
            <span className="money-xl money" style={{
              color: isPositive ? "white" : "#FCA5A5",
            }}>
              {!isPositive && "−"}
              <AnimatedMoney
                value={Math.abs(netPosition)}
                sizeClass={{ fontSize: 32, fontWeight: 900 }}
                color={isPositive ? "white" : "#FCA5A5"}
                prefix=""
                currency=""
              />
            </span>
            <span style={{ fontSize: 14, fontWeight: 800, opacity: 0.6 }}>ج.م</span>
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <span style={{
              display: "inline-flex", alignItems: "center", gap: 4,
              padding: "4px 10px", borderRadius: 999, fontSize: 10, fontWeight: 900,
              background: isPositive ? "rgba(16,185,129,0.2)" : "rgba(248,113,113,0.2)",
              color: isPositive ? "#6EE7B7" : "#FCA5A5",
            }}>
              {isPositive ? (
                <><TrendingUp size={10} /> وضع آمن</>
              ) : (
                <><TrendingDown size={10} /> يحتاج مراجعة</>
              )}
            </span>
          </div>
        </div>
      </div>

      {/* ═══ 3 كروت أساسية ═══ */}
      <div style={{
        display: "grid", gridTemplateColumns: "repeat(3, 1fr)",
        gap: 8, marginTop: 12,
      }}>
        <StatCell
          icon={Wallet}
          label="سيولة"
          value={formatAdaptive(liquidityDual.comprehensive)}
          color="var(--positive)"
          onClick={() => onNavigate("cards")}
        />
        <StatCell
          icon={CreditCard}
          label="مديونية"
          value={formatAdaptive(totalCardDebt + totalLoanDebt)}
          color="var(--negative)"
          onClick={() => onNavigate("cards")}
        />
        <StatCell
          icon={StoreIcon}
          label="هاني"
          value={formatAdaptive(hanyPayable)}
          color="var(--warning)"
          onClick={() => onNavigate("hany")}
        />
      </div>

      {/* ═══ تنبيه المعلقات ═══ */}
      {monthPendingCount > 0 && (
        <div className="card" style={{
          marginTop: 12, background: "var(--warning-soft)",
          borderColor: "var(--warning)",
          padding: 14,
        }}>
          <div style={{
            display: "flex", alignItems: "center", gap: 10,
            marginBottom: 10,
          }}>
            <div style={{
              width: 36, height: 36, borderRadius: 12,
              display: "flex", alignItems: "center", justifyContent: "center",
              background: "rgba(217,119,6,0.15)", color: "var(--warning)",
              flexShrink: 0,
            }}>
              <Clock size={16} />
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <p style={{
                fontSize: 12, fontWeight: 900,
                color: "var(--warning)", margin: 0,
              }}>
                {monthPendingCount} معلقات بانتظارك
              </p>
              <p style={{
                fontSize: 10, marginTop: 2, marginBottom: 0,
                color: "var(--text-muted)",
              }}>
                إجمالي{" "}
                <span className="money" style={{
                  fontWeight: 900, color: "var(--warning)",
                }}>
                  {fmt(monthPendingTotal)}
                </span>{" "}
                ج.م
              </p>
            </div>
          </div>
          <button
            onClick={() => onNavigate("transactions")}
            className="btn btn-secondary"
            style={{ width: "100%", fontSize: 11, padding: "8px 12px" }}
          >
            عرض التفاصيل
            <ChevronLeft size={14} />
          </button>
        </div>
      )}

      {/* ═══ Chart آخر 30 يوم ═══ */}
      <div className="card" style={{ marginTop: 12 }}>
        <div style={{
          display: "flex", alignItems: "center",
          justifyContent: "space-between", marginBottom: 12,
        }}>
          <h3 style={{ fontSize: 12, fontWeight: 900, display: "flex", alignItems: "center", gap: 6, margin: 0 }}>
            <LineChart size={14} style={{ color: "var(--brand)" }} />
            آخر 30 يوم
          </h3>
          <div style={{ display: "flex", gap: 10 }}>
            <span style={{
              fontSize: 10, fontWeight: 800,
              display: "flex", alignItems: "center", gap: 4,
              color: "var(--positive)",
            }}>
              <span style={{
                width: 6, height: 6, borderRadius: "50%",
                background: "var(--positive)", display: "inline-block",
              }} />
              دخل
            </span>
            <span style={{
              fontSize: 10, fontWeight: 800,
              display: "flex", alignItems: "center", gap: 4,
              color: "var(--negative)",
            }}>
              <span style={{
                width: 6, height: 6, borderRadius: "50%",
                background: "var(--negative)", display: "inline-block",
              }} />
              مصروف
            </span>
          </div>
        </div>
        <div style={{ height: 130 }}>
          <ResponsiveContainer width="100%" height="100%">
            <AreaChart data={last30ChartData}>
              <defs>
                <linearGradient id="gradInc" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#059669" stopOpacity={0.35} />
                  <stop offset="100%" stopColor="#059669" stopOpacity={0} />
                </linearGradient>
                <linearGradient id="gradExp" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#DC2626" stopOpacity={0.35} />
                  <stop offset="100%" stopColor="#DC2626" stopOpacity={0} />
                </linearGradient>
              </defs>
              <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#94A3B8" opacity={0.08} />
              <XAxis dataKey="name" fontSize={8} stroke="#94A3B8" interval={6} />
              <YAxis fontSize={8} stroke="#94A3B8" width={30}
                tickFormatter={(v) => v >= 1000 ? `${(v / 1000).toFixed(0)}k` : v}
              />
              <Tooltip
                formatter={(v) => `${fmt(v)} ج.م`}
                contentStyle={{
                  borderRadius: 12, border: "1px solid var(--border)",
                  background: "var(--bg-card)",
                  fontFamily: "Cairo", fontSize: 12, direction: "rtl",
                }}
              />
              <Area type="monotone" dataKey="دخل" stroke="#059669" strokeWidth={2} fill="url(#gradInc)" />
              <Area type="monotone" dataKey="مصروف" stroke="#DC2626" strokeWidth={2} fill="url(#gradExp)" />
            </AreaChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* ═══ إحصائيات الشهر ═══ */}
      <div className="day-stats" style={{ marginTop: 12 }}>
        <div className="day-stats__cell">
          <div className="day-stats__label">💰 دخل</div>
          <div className="day-stats__value text-positive">{formatAdaptive(monthCard.inc)}</div>
        </div>
        <div className="day-stats__cell">
          <div className="day-stats__label">💸 مصروف</div>
          <div className="day-stats__value text-negative">{formatAdaptive(monthCard.exp)}</div>
        </div>
        <div className="day-stats__cell">
          <div className="day-stats__label">📊 صافي</div>
          <div className="day-stats__value" style={{
            color: monthCard.net >= 0 ? "var(--brand)" : "var(--warning)",
          }}>
            {monthCard.net >= 0 ? "+" : ""}{formatAdaptive(monthCard.net)}
          </div>
        </div>
      </div>

      {/* ═══ Quick Actions ═══ */}
      <div className="card" style={{ marginTop: 12 }}>
        <h3 style={{ fontSize: 12, fontWeight: 900, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
          <Sparkles size={14} style={{ color: "var(--brand)" }} />
          إجراءات سريعة
        </h3>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8 }}>
          <QuickAction icon={ArrowUp} label="مصروف" color="var(--negative)" onClick={() => onOpenQuickAdd("expense")} />
          <QuickAction icon={ArrowDown} label="دخل" color="var(--positive)" onClick={() => onOpenQuickAdd("income")} />
          <QuickAction icon={StoreIcon} label="هاني" color="var(--warning)" onClick={() => onNavigate("hany")} />
          <QuickAction icon={ArrowLeftRight} label="تحويل" color="var(--brand)" onClick={() => onOpenQuickAdd("transfer")} />
        </div>
      </div>

      {/* ═══ Hany Summary Card ═══ */}
      {hanyPayable > 0 && (
        <button
          onClick={() => onNavigate("hany")}
          className="card card-hover"
          style={{
            width: "100%", marginTop: 12, textAlign: "right",
            background: "linear-gradient(135deg, rgba(234,88,12,0.08), rgba(217,119,6,0.04))",
            borderColor: "rgba(234,88,12,0.3)",
            cursor: "pointer", fontFamily: "inherit",
          }}
        >
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{
              width: 44, height: 44, borderRadius: 14,
              display: "flex", alignItems: "center", justifyContent: "center",
              background: "linear-gradient(135deg, #EA580C 0%, #C2410C 100%)",
              color: "white", flexShrink: 0,
            }}>
              <StoreIcon size={20} />
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <p style={{ fontSize: 13, fontWeight: 900, margin: 0 }}>
                🛒 دفتر محل هاني
              </p>
              <p style={{
                fontSize: 10, marginTop: 2, marginBottom: 0,
                color: "var(--text-muted)",
              }}>
                المستحق الحالي:{" "}
                <span style={{ fontWeight: 900, color: "var(--warning)" }}>
                  {fmt(hanyPayable)}
                </span>{" "}
                ج.م
              </p>
            </div>
            <ChevronLeft size={16} style={{ color: "var(--text-muted)" }} />
          </div>
        </button>
      )}
    </div>
  );
});

/* Quick Action Button */
const QuickAction = memo(({ icon: Icon, label, color, onClick }) => (
  <button
    onClick={onClick}
    style={{
      display: "flex", flexDirection: "column", alignItems: "center", gap: 6,
      padding: "12px 4px", borderRadius: 14,
      background: "var(--bg-muted)", border: "1px solid var(--border)",
      cursor: "pointer", fontFamily: "inherit",
      transition: "all 0.2s ease",
    }}
    onMouseEnter={(e) => {
      e.currentTarget.style.borderColor = "var(--brand)";
      e.currentTarget.style.transform = "translateY(-2px)";
    }}
    onMouseLeave={(e) => {
      e.currentTarget.style.borderColor = "var(--border)";
      e.currentTarget.style.transform = "none";
    }}
  >
    <div style={{
      width: 36, height: 36, borderRadius: 12,
      display: "flex", alignItems: "center", justifyContent: "center",
      background: `${color}20`, color,
    }}>
      <Icon size={16} />
    </div>
    <span style={{ fontSize: 11, fontWeight: 900, color: "var(--text-primary)" }}>
      {label}
    </span>
  </button>
));

/* ═══════════════════════════════════════════════════════════════════
   7) TRANSACTIONS PAGE
   ═══════════════════════════════════════════════════════════════════ */
const TransactionsPage = memo(function TransactionsPage({
  transactions, selectedMonth, selectedYear,
  data, dispatch, addNotification,
  onSelectYear, onSelectMonth,
  onApproveOne, onEditOne, onDeleteOne,
  onApproveBulk, onBulkDelete,
}) {
  const [activeTab, setActiveTab] = useState("pending");
  const [searchTerm, setSearchTerm] = useState("");
  const [openCards, setOpenCards] = useState(() => new Set());
  const [openDays, setOpenDays] = useState(() => new Set());
  const [showFilterSheet, setShowFilterSheet] = useState(false);
  const [showActionsSheet, setShowActionsSheet] = useState(false);
  const [statusFilter, setStatusFilter] = useState("all");
  const [sourceFilter, setSourceFilter] = useState("all");

  const pendingDeleteIds = useMemo(() => {
    const set = new Set();
    (data?.deleteRequests || []).forEach((r) => {
      if (r && r.status === "pending" && r.txId) set.add(r.txId);
    });
    return set;
  }, [data?.deleteRequests]);

  const isClosed = isMonthClosed(data, selectedYear, selectedMonth);

  const allValidMonths = useMemo(() => {
    const list = [];
    YEARS_LIST.forEach((y) =>
      getMonthsForYear(y).forEach((m) => list.push({ year: y, month: m })),
    );
    return list;
  }, []);
  const currentMonthIdx = useMemo(
    () => allValidMonths.findIndex((v) => v.year === selectedYear && v.month === selectedMonth),
    [allValidMonths, selectedYear, selectedMonth],
  );

  const monthTx = useMemo(
    () => transactions.filter(
      (t) =>
        t.month === selectedMonth &&
        (t.year || 2026) === selectedYear &&
        !isCarryoverMarker(t),
    ),
    [transactions, selectedMonth, selectedYear],
  );

  const filteredTx = useMemo(() => {
    let arr = monthTx;
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(
        (t) =>
          normalizeText(t.description).includes(term) ||
          normalizeText(t.category).includes(term),
      );
    }
    if (sourceFilter === "self") arr = arr.filter((t) => !isFamilyTx(t));
    else if (sourceFilter !== "all") arr = arr.filter((t) => t.createdBy === sourceFilter);
    return arr;
  }, [monthTx, searchTerm, sourceFilter]);

  const pendingList = useMemo(
    () => filteredTx.filter((t) => t.status !== "paid").sort(compareTransactions),
    [filteredTx],
  );
  const paidList = useMemo(
    () => filteredTx.filter((t) => t.status === "paid").sort(compareTransactions),
    [filteredTx],
  );
  const displayedList = activeTab === "pending" ? pendingList : paidList;

  const dayGroups = useMemo(() => {
    const map = new Map();
    displayedList.forEach((t) => {
      const day = t.date || "unknown";
      if (!map.has(day)) map.set(day, { date: day, items: [], total: 0 });
      const g = map.get(day);
      g.items.push(t);
      g.total += safeNumber(t.amount);
    });
    return Array.from(map.values())
      .sort((a, b) => b.date.localeCompare(a.date))
      .map((g) => {
        const catMap = new Map();
        g.items.forEach((t) => {
          if (!catMap.has(t.category)) {
            catMap.set(t.category, { category: t.category, items: [], total: 0 });
          }
          const c = catMap.get(t.category);
          c.items.push(t);
          c.total += safeNumber(t.amount);
        });
        const categories = Array.from(catMap.values()).sort((a, b) => b.total - a.total);
        return { ...g, categories };
      });
  }, [displayedList]);

  const getDayLabel = useCallback((date) => {
    const today = getLocalISODate();
    const yest = new Date();
    yest.setDate(yest.getDate() - 1);
    const yestISO = getLocalISODate(yest);
    if (date === today) return "📅 النهاردة";
    if (date === yestISO) return "📅 امبارح";
    const d = parseISODate(date);
    if (!d) return "📅 " + date;
    const ds = d.toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long" });
    const ys = d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : "";
    return "📅 " + ds + ys;
  }, []);

  const toggleCard = useCallback((key) => {
    setOpenCards((prev) => {
      const n = new Set(prev);
      if (n.has(key)) n.delete(key);
      else n.add(key);
      return n;
    });
  }, []);

  const toggleDay = useCallback((date, categoryKeys) => {
    setOpenDays((prev) => {
      const n = new Set(prev);
      const key = `day-${date}`;
      if (n.has(key)) {
        n.delete(key);
        setOpenCards((c) => {
          const x = new Set(c);
          categoryKeys.forEach((k) => x.delete(k));
          return x;
        });
      } else {
        n.add(key);
        setOpenCards((c) => {
          const x = new Set(c);
          categoryKeys.forEach((k) => x.add(k));
          return x;
        });
      }
      return n;
    });
  }, []);

  const toggleAll = useCallback(() => {
    const allKeys = [];
    dayGroups.forEach((g) =>
      g.categories.forEach((c) => allKeys.push(`${g.date}::${c.category}`)),
    );
    if (openCards.size === allKeys.length && allKeys.length > 0) {
      setOpenCards(new Set());
      setOpenDays(new Set());
    } else {
      setOpenCards(new Set(allKeys));
      setOpenDays(new Set(dayGroups.map((g) => `day-${g.date}`)));
    }
  }, [dayGroups, openCards.size]);

  const navigateMonth = useCallback((delta) => {
    const i = currentMonthIdx + delta;
    if (i < 0 || i >= allValidMonths.length) return;
    const target = allValidMonths[i];
    onSelectYear(target.year);
    onSelectMonth(target.month);
  }, [currentMonthIdx, allValidMonths, onSelectYear, onSelectMonth]);

  const handleApproveWithDate = useCallback(async (tx) => {
    const date = await window.__promptFn__({
      title: "تأكيد تاريخ الاعتماد",
      icon: "📅",
      message: `${tx.description || tx.category}\n${fmt(tx.amount)} ج.م`,
      inputValue: tx.date || getLocalISODate(),
      numeric: false,
      confirmText: "اعتماد",
    });
    if (!date) return;
    const d = parseISODate(date);
    if (!d) return;
    const txYear = d.getFullYear();
    const txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) {
      addNotification({ type: "error", title: "شهر مغلق", message: `${txMonth} ${txYear}` });
      return;
    }
    onApproveOne(tx, date, txYear, txMonth, d.getMonth());
  }, [data, addNotification, onApproveOne]);

  const handleApproveAllWithDate = useCallback(async (items) => {
    const date = await window.__promptFn__({
      title: `اعتماد ${items.length} معلقات`,
      icon: "📅",
      message: `سيتم اعتماد ${items.length} معاملة. اختر التاريخ:`,
      inputValue: getLocalISODate(),
      numeric: false,
      confirmText: "اعتماد الكل",
    });
    if (!date) return;
    const d = parseISODate(date);
    if (!d) return;
    const txYear = d.getFullYear();
    const txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) {
      addNotification({ type: "error", title: "شهر مغلق" });
      return;
    }
    onApproveBulk(items, date, txYear, txMonth, d.getMonth());
  }, [data, addNotification, onApproveBulk]);

  const monthStats = useMemo(() => {
    const paid = monthTx.filter((t) => t.status === "paid");
    const inc = paid.filter((t) => t.type === "income").reduce((s, t) => s + safeNumber(t.amount), 0);
    const exp = paid.filter((t) => t.type === "expense").reduce((s, t) => s + safeNumber(t.amount), 0);
    return { inc, exp, net: inc - exp };
  }, [monthTx]);

  return (
    <div className="animate-fadeIn" style={{ paddingBottom: 24 }}>
      {/* Stats Bar */}
      <div className="day-stats">
        <div className="day-stats__cell">
          <div className="day-stats__label">💰 دخل</div>
          <div className="day-stats__value text-positive">{formatAdaptive(monthStats.inc)}</div>
        </div>
        <div className="day-stats__cell">
          <div className="day-stats__label">💸 مصروف</div>
          <div className="day-stats__value text-negative">{formatAdaptive(monthStats.exp)}</div>
        </div>
        <div className="day-stats__cell">
          <div className="day-stats__label">📊 صافي</div>
          <div className="day-stats__value" style={{
            color: monthStats.net >= 0 ? "var(--brand)" : "var(--warning)",
          }}>
            {monthStats.net >= 0 ? "+" : ""}{formatAdaptive(monthStats.net)}
          </div>
        </div>
      </div>

      {/* Month Navigation + Search */}
      <div className="card" style={{ padding: 12, marginTop: 12 }}>
        <div style={{
          display: "flex", alignItems: "center", gap: 8, marginBottom: 12,
        }}>
          <button
            type="button"
            onClick={() => navigateMonth(-1)}
            disabled={currentMonthIdx <= 0}
            className="btn btn-ghost btn-icon-sm"
            style={{ opacity: currentMonthIdx <= 0 ? 0.3 : 1 }}
          >
            <ChevronRight size={18} />
          </button>
          <div style={{ flex: 1, textAlign: "center" }}>
            <h2 style={{ fontSize: 15, fontWeight: 900, margin: 0 }}>
              {selectedMonth} {selectedYear}
            </h2>
            <p style={{
              fontSize: 10, marginTop: 2, marginBottom: 0,
              color: "var(--text-muted)",
            }}>
              {monthTx.length} معاملة {isClosed && "· 🔒 مغلق"}
            </p>
          </div>
          <button
            type="button"
            onClick={() => navigateMonth(1)}
            disabled={currentMonthIdx >= allValidMonths.length - 1}
            className="btn btn-ghost btn-icon-sm"
            style={{ opacity: currentMonthIdx >= allValidMonths.length - 1 ? 0.3 : 1 }}
          >
            <ChevronLeft size={18} />
          </button>
          <button
            type="button"
            onClick={() => setShowActionsSheet(true)}
            className="btn btn-ghost btn-icon-sm"
          >
            <MoreVertical size={16} />
          </button>
        </div>

        <SegmentedControl
          value={activeTab}
          onChange={setActiveTab}
          options={[
            { value: "pending", label: `المعلقات (${pendingList.length})`, icon: Clock },
            { value: "paid", label: `المدفوعات (${paidList.length})`, icon: CheckCircle2 },
          ]}
        />

        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          <div style={{ position: "relative", flex: 1 }}>
            <Search
              size={14}
              style={{
                position: "absolute", right: 12, top: "50%",
                transform: "translateY(-50%)",
                color: "var(--text-muted)", pointerEvents: "none",
              }}
            />
            <input
              type="text"
              placeholder="ابحث..."
              className="input-field"
              style={{ paddingRight: 36, fontSize: 13, padding: "10px 36px 10px 12px" }}
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
            />
          </div>
          <button
            onClick={() => setShowFilterSheet(true)}
            className="btn btn-secondary btn-icon"
            title="فلاتر"
          >
            <Filter size={14} />
          </button>
          <button
            onClick={toggleAll}
            className="btn btn-secondary btn-icon"
            title="فتح/طي الكل"
          >
            <Layers size={14} />
          </button>
        </div>
      </div>

      {/* Transactions List */}
      {displayedList.length === 0 ? (
        <div className="card" style={{ marginTop: 12 }}>
          <EmptyState
            icon={activeTab === "pending" ? CheckCircle2 : Receipt}
            title={activeTab === "pending" ? "لا توجد معلقات 🎉" : "لا توجد مدفوعات"}
            message={activeTab === "pending" ? "كل شيء معتمد" : "لم تُسجَّل معاملات بعد"}
          />
        </div>
      ) : (
        <div style={{ marginTop: 12 }}>
          {dayGroups.map((group) => {
            const dayKey = `day-${group.date}`;
            const isDayOpen = openDays.has(dayKey);
            const allCatKeys = group.categories.map((c) => `${group.date}::${c.category}`);
            return (
              <div key={group.date}>
                <div
                  className="day-header"
                  onClick={() => toggleDay(group.date, allCatKeys)}
                  role="button"
                  tabIndex={0}
                >
                  <div className="day-header-badge">
                    {getDayLabel(group.date)}
                    <span style={{ fontSize: 10, opacity: 0.7, fontWeight: 700 }}>
                      ({group.items.length})
                    </span>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <div className="day-header-total money">
                      {fmt(group.total)} ج.م
                    </div>
                    <ChevronDown
                      size={14}
                      style={{
                        color: "var(--brand)",
                        transform: isDayOpen ? "rotate(180deg)" : "none",
                        transition: "transform 0.25s ease",
                      }}
                    />
                  </div>
                </div>

                {group.categories.map((cat) => {
                  const catKey = `${group.date}::${cat.category}`;
                  const isOpen = openCards.has(catKey);
                  return (
                    <CategoryCard
                      key={catKey}
                      category={cat.category}
                      items={cat.items}
                      isOpen={isOpen}
                      onToggle={() => toggleCard(catKey)}
                      isMonthClosedFlag={isClosed}
                      onApproveOne={handleApproveWithDate}
                      onEditOne={onEditOne}
                      onDeleteOne={onDeleteOne}
                      onApproveAll={handleApproveAllWithDate}
                      onDeleteAll={(items) => onBulkDelete(items.map((t) => t.id))}
                      pendingDeleteIds={pendingDeleteIds}
                    />
                  );
                })}
              </div>
            );
          })}
        </div>
      )}

      {/* Filter Sheet */}
      <BottomSheet
        isOpen={showFilterSheet}
        onClose={() => setShowFilterSheet(false)}
        title="🔍 فلاتر"
      >
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <div>
            <p style={{
              fontSize: 10, fontWeight: 800, marginBottom: 8,
              color: "var(--text-muted)",
            }}>
              مصدر المعاملة
            </p>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {[
                ["all", "الكل"],
                ["self", "👤 أنا"],
                ["ans", "أنس"],
                ["abdelrahman", "عبد الرحمن"],
                ["salma", "سلمى"],
                ["om_abdo", "أم عبده"],
              ].map(([id, label]) => (
                <button
                  key={id}
                  type="button"
                  onClick={() => setSourceFilter(id)}
                  className={`badge badge-${sourceFilter === id ? "brand" : "neutral"}`}
                  style={{ cursor: "pointer", padding: "6px 12px", fontSize: 11 }}
                >
                  {label}
                </button>
              ))}
            </div>
          </div>
          <button
            onClick={() => setShowFilterSheet(false)}
            className="btn btn-primary"
            style={{ width: "100%", fontSize: 13, padding: 12 }}
          >
            تطبيق
          </button>
        </div>
      </BottomSheet>

      {/* Actions Sheet */}
      <BottomSheet
        isOpen={showActionsSheet}
        onClose={() => setShowActionsSheet(false)}
        title="إجراءات"
      >
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          <SheetItem
            icon={PrinterIcon}
            label="طباعة الشهر"
            color="linear-gradient(135deg, #0A1628 0%, #635BFF 100%)"
            onClick={() => {
              addNotification({ type: "info", title: "جاري التحضير..." });
              setShowActionsSheet(false);
            }}
          />
          {!isClosed ? (
            <SheetItem
              icon={Lock}
              label="إقفال الشهر"
              color="linear-gradient(135deg, #059669 0%, #047857 100%)"
              onClick={() => setShowActionsSheet(false)}
            />
          ) : (
            <SheetItem
              icon={Unlock}
              label="فتح الشهر"
              color="linear-gradient(135deg, #D97706 0%, #B45309 100%)"
              onClick={() => setShowActionsSheet(false)}
            />
          )}
          <SheetItem
            icon={Layers}
            label="الفئات والميزانية"

}) {

  const hanyPayable = useMemo(() => computeHanyPayable(data), [data]);

  const purchases = useMemo(

          !isCarryoverMarker(t),
      )
      .sort(compareTransactions),
    [data.transactions],

  const settlements = useMemo(
    () => (data.transactions || [])
      .filter((t) => isHanySettleTx(t) && t.status === "paid")

  );

  const recentPurchases = showAll ? purchases : purchases.slice(0, 8);

  return (
    <div className="animate-fadeIn" style={{ paddingBottom: 24 }}>
      {/* Hero */}
      <div className="card" style={{
        background: "linear-gradient(135deg, rgba(234,88,12,0.10), rgba(217,119,6,0.04))",
        borderColor: "rgba(234,88,12,0.3)",

        <div style={{
          display: "flex", alignItems: "center", gap: 12,

        }}>

            display: "flex", alignItems: "center", justifyContent: "center",
            background: "linear-gradient(135deg, #EA580C 0%, #C2410C 100%)",
            color: "white", flexShrink: 0, boxShadow: "0 8px 20px -6px rgba(234,88,12,0.5)",
          }}>
            <StoreIcon size={22} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <h1 style={{ fontSize: 16, fontWeight: 900, margin: 0 }}>🛒 دفتر محل هاني</h1>

              fontSize: 11, marginTop: 2, marginBottom: 0,

          padding: 16, borderRadius: 16,

          </p>
          <p className="money" style={{
            fontSize: 30, fontWeight: 900, margin: 0,
            color: hanyPayable > 0 ? "var(--warning)" : "var(--positive)",

              {settlements.length} دفعة

          <div style={{

            <p style={{ fontSize: 10, fontWeight: 800, color: "var(--text-muted)", margin: 0 }}>

            style={{

              background: hanyPayable > 0 ? "white" : "var(--bg-muted)",

        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6 }}>

          <MiniStat label="مشتريات" value={`+${fmtShort(monthSummary.purchases)}`} color="var(--negative)" />
          <MiniStat label="سداد" value={`−${fmtShort(monthSummary.settlements)}`} color="var(--positive)" />
          <MiniStat label="إقفال" value={fmtShort(monthSummary.closing)} color="var(--warning)" />
        </div>
      </div>

      {/* Quick Items */}
      <div className="card" style={{ marginTop: 12 }}>
        <div style={{
          display: "flex", alignItems: "center", justifyContent: "space-between",
          marginBottom: 12,
        }}>
          <h3 style={{ fontSize: 13, fontWeight: 900, display: "flex", alignItems: "center", gap: 6, margin: 0 }}>
            <Zap size={14} style={{ color: "var(--warning)" }} /> أصناف سريعة

          <button
            onClick={onOpenQuickPurchase}
            className="btn btn-primary"

              onClick={() => onOpenQuickPurchase(item)}
              className="chip"

      {/* Recent Purchases */}
      <div className="card" style={{ marginTop: 12 }}>

          marginBottom: 12,

            <button
              onClick={() => setShowAll(!showAll)}
              className="btn btn-ghost"
              style={{ fontSize: 10, padding: "6px 10px" }}
            >
              {showAll ? "عرض أقل" : "عرض الكل"}
            </button>
          )}

        {purchases.length === 0 ? (
          <EmptyState
            icon={StoreIcon}
            title="لا توجد مشتريات بعد"

            size="sm"
          />
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {recentPurchases.map((item) => (
              <div
                key={item.id}
                style={{
                  display: "flex", justifyContent: "space-between",
                  alignItems: "center", gap: 8,
                  padding: 10, borderRadius: 12,
                  background: "var(--bg-muted)",
                }}
              >
                <div style={{ minWidth: 0, flex: 1 }}>
                  <p style={{
                    fontWeight: 800, fontSize: 12, margin: 0,
                    overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",

        <div className="card" style={{ marginTop: 12 }}>

            fontSize: 13, fontWeight: 900, marginBottom: 12,
            display: "flex", alignItems: "center", gap: 8,
            color: "var(--positive)",
          }}>
            <Banknote size={14} /> سجل السداد ({settlements.length})
          </h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 280, overflowY: "auto" }}>
            {settlements.slice(0, 20).map((s) => (
              <div
                key={s.id}
                style={{
                  display: "flex", justifyContent: "space-between",
                  alignItems: "center", gap: 8,
                  padding: 10, borderRadius: 12,
                  background: "rgba(5,150,105,0.05)",

              >
                <div style={{ minWidth: 0, flex: 1 }}>

      {label}

));
/* ═══════════════════════════════════════════════════════════════════
   V89.0 — PART 6
   Cards + Categories + Loans + Reports + Forecast + Settings + Modals
   ═══════════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════════
   1) CARDS PAGE
   ═══════════════════════════════════════════════════════════════════ */
const CardsPage = memo(function CardsPage({
  data, dispatch, addNotification, liveBalances,
  onOpenCardStatement, onOpenCardPayment, onOpenReconcile,
}) {
  const [activeTab, setActiveTab] = useState("wallets");
  const [viewMode, setViewMode] = useState("grouped");

  const cards = data.cards || [];
  const totalCardDebt = useMemo(
    () => cards.reduce((s, c) => s + Math.max(0, computeCardDebt(data, c)), 0),
    [cards, data],
  );

  /* Group by provider */
  const groupedData = useMemo(() => {
    const groups = {};
    Object.keys(PROVIDERS).forEach((pk) => { groups[pk] = []; });

    ACCOUNT_KEYS.forEach((k) => {
      const acc = data.accountsData?.[k] || DEFAULT_ACCOUNTS[k];
      const pk = acc?.providerKey || "cash";
      if (groups[pk]) {
        groups[pk].push({
          type: "account", key: k,
          label: acc?.label || ACCOUNT_SHORT_NAMES[k],
          balance: safeNumber(liveBalances[k]),
          providerKey: pk,
        });
      }
    });

    cards.forEach((card) => {
      const pk = card.providerKey || "cib";
      if (groups[pk]) groups[pk].push({ ...card, type: "card" });
    });

    return Object.keys(PROVIDERS)
      .sort((a, b) => PROVIDERS[a].order - PROVIDERS[b].order)
      .map((pk) => ({ providerKey: pk, items: groups[pk] }))
      .filter((g) => g.items.length > 0);
  }, [data.accountsData, cards, liveBalances]);

  return (
    <div className="animate-fadeIn" style={{ paddingBottom: 24 }}>
      {/* Header card */}
      <div className="card">
        <div style={{
          display: "flex", alignItems: "center", justifyContent: "space-between",
          gap: 12, flexWrap: "wrap",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{
              width: 40, height: 40, borderRadius: 14,
              display: "flex", alignItems: "center", justifyContent: "center",
              background: "var(--brand-soft)", color: "var(--brand)",
            }}>
              <CreditCard size={18} />
            </div>
            <div>
              <h2 style={{ fontSize: 15, fontWeight: 900, margin: 0 }}>البطاقات والمحافظ</h2>
              <p style={{
                fontSize: 11, marginTop: 2, marginBottom: 0,
                color: "var(--text-muted)",
              }}>
                {cards.length} بطاقة + {ACCOUNT_KEYS.length} حساب/محفظة
              </p>
            </div>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <button
              onClick={() => setViewMode("grouped")}
              className={`btn ${viewMode === "grouped" ? "btn-primary" : "btn-secondary"}`}
              style={{ fontSize: 10, padding: "6px 12px" }}
            >
              <Layers size={11} /> مجموعات
            </button>
            <button
              onClick={() => setViewMode("ledger")}
              className={`btn ${viewMode === "ledger" ? "btn-primary" : "btn-secondary"}`}
              style={{ fontSize: 10, padding: "6px 12px" }}
            >
              <Table size={11} /> كشوف
            </button>
          </div>
        </div>
      </div>

      <div style={{ marginTop: 12 }}>
        <SegmentedControl
          value={activeTab}
          onChange={setActiveTab}
          options={[
            { value: "wallets", label: "البطاقات والمحافظ", icon: CreditCard },
            { value: "cashback", label: "الكاش باك", icon: Gift },
          ]}
        />
      </div>

      {activeTab === "wallets" ? (
        <>
          {/* Quick pay card */}
          {cards.length > 0 && (
            <button
              onClick={() => onOpenCardPayment(null)}
              className="card card-hover"
              style={{
                width: "100%", marginTop: 12, textAlign: "right",
                background: "linear-gradient(135deg, rgba(99,91,255,0.1), rgba(74,66,229,0.06))",
                borderColor: "rgba(99,91,255,0.3)",
                cursor: "pointer", fontFamily: "inherit",
              }}
            >
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{
                  width: 44, height: 44, borderRadius: 14,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  background: "linear-gradient(135deg, #635BFF 0%, #4A42E5 100%)",
                  color: "white", flexShrink: 0,
                }}>
                  <Banknote size={20} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <p style={{ fontSize: 13, fontWeight: 900, margin: 0 }}>
                    💳 سداد بطاقة سريع
                  </p>
                  <p style={{
                    fontSize: 10, marginTop: 2, marginBottom: 0,
                    color: "var(--text-muted)",
                  }}>
                    المديونية:{" "}
                    <span style={{ fontWeight: 900, color: "var(--negative)" }}>
                      {formatAdaptive(totalCardDebt)}
                    </span>{" "}
                    ج.م
                  </p>
                </div>
                <ChevronLeft size={16} style={{ color: "var(--text-muted)" }} />
              </div>
            </button>
          )}

          {viewMode === "grouped" ? (
            <div style={{ marginTop: 12 }}>
              {groupedData.map(({ providerKey, items }) => (
                <ProviderGroupCard
                  key={providerKey}
                  providerKey={providerKey}
                  items={items}
                  data={data}
                  liveBalances={liveBalances}
                  onItemClick={(item) => {
                    if (item.type === "card") onOpenCardStatement(item);
                    else if (item.type === "account" && WALLET_CONFIGS[item.key]) {
                      dispatch({ type: "TOGGLE_LEDGER", payload: item.key });
                    }
                  }}
                />
              ))}
            </div>
          ) : (
            <div style={{ marginTop: 12 }}>
              <LedgerView
                data={data}
                liveBalances={liveBalances}
                dispatch={dispatch}
                onReconcile={onOpenReconcile}
              />
            </div>
          )}

          {/* All Cards Grid */}
          {cards.length > 0 && (
            <div style={{ marginTop: 20 }}>
              <SectionTitle icon={CreditCard}>
                كل البطاقات ({cards.length})
              </SectionTitle>
              <div style={{
                display: "grid",
                gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))",
                gap: 16,
              }}>
                {cards.map((card) => {
                  const debt = computeCardDebt(data, card);
                  return (
                    <div key={card.id}>
                      <BankCard card={card} onClick={() => onOpenCardStatement(card)} />
                      <div style={{
                        display: "grid", gridTemplateColumns: "repeat(4, 1fr)",
                        gap: 6, marginTop: 10,
                      }}>
                        <MiniStat
                          label="متاح"
                          value={fmtShort(Math.max(0, safeNumber(card.limit) - Math.max(0, debt)))}
                          color="var(--positive)"
                        />
                        <MiniStat
                          label={debt < 0 ? "دائن" : "مديونية"}
                          value={fmtShort(Math.abs(debt))}
                          color={debt < 0 ? "var(--positive)" : "var(--negative)"}
                        />
                        <MiniStat label="حد" value={fmtShort(card.limit)} color="var(--brand)" />
                        <MiniStat label="كاش باك" value={`${card.cashbackRate || 0}%`} color="var(--warning)" />
                      </div>
                      {debt > 0 && (
                        <button
                          onClick={() => onOpenCardPayment(card.id)}
                          className="btn btn-primary"
                          style={{
                            width: "100%", marginTop: 8, fontSize: 11, padding: "10px 12px",
                          }}
                        >
                          <Banknote size={12} /> سداد
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </>
      ) : (
        <CashbackView
          data={data}
          dispatch={dispatch}
          addNotification={addNotification}
          selectedYear={data.__selectedYear || 2026}
          selectedMonth={data.__selectedMonth || "أكتوبر"}
        />
      )}
    </div>
  );
});

/* Provider Group Card */
const ProviderGroupCard = memo(({
  providerKey, items, data, liveBalances, onItemClick, defaultExpanded = true,
}) => {
  const [isExpanded, setIsExpanded] = useState(defaultExpanded);
  const provider = PROVIDERS[providerKey];
  if (!provider || items.length === 0) return null;

  const totalBalance = items.reduce((sum, item) => {
    if (item.type === "card") return sum + Math.max(0, computeCardDebt(data, item));
    return sum + safeNumber(liveBalances[item.key]);
  }, 0);

  return (
    <div className="provider-group">
      <div
        className="provider-header"
        onClick={() => setIsExpanded(!isExpanded)}
      >
        <span className="provider-stripe" style={{ background: provider.color }} />
        <div style={{ display: "flex", alignItems: "center", gap: 12, flex: 1, minWidth: 0 }}>
          <ProviderLogo providerKey={providerKey} size="lg" />
          <div style={{ minWidth: 0 }}>
            <h3 style={{ fontSize: 14, fontWeight: 900, margin: 0 }}>{provider.name}</h3>
            <p style={{
              fontSize: 10, fontWeight: 700, marginTop: 3, marginBottom: 0,
              color: "var(--text-muted)",
            }}>
              {items.length} {items.length === 1 ? "عنصر" : "عناصر"}
            </p>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
          <div style={{ textAlign: "left" }}>
            <p style={{
              fontSize: 9, fontWeight: 800, margin: 0,
              color: "var(--text-muted)",
            }}>
              الإجمالي
            </p>
            <p className="money" style={{
              fontSize: 14, fontWeight: 900, margin: "2px 0 0",
              color: provider.color,
            }}>
              {formatAdaptive(totalBalance)}
            </p>
          </div>
          <ChevronDown
            size={16}
            style={{
              color: "var(--text-muted)",
              transform: isExpanded ? "rotate(180deg)" : "none",
              transition: "transform 0.2s ease",
            }}
          />
        </div>
      </div>
      {isExpanded && (
        <div className="provider-body">
          {items.map((item) => (
            <ProviderItemRow
              key={item.key || item.id}
              item={item}
              data={data}
              liveBalances={liveBalances}
              onClick={() => onItemClick(item)}
            />
          ))}
        </div>
      )}
    </div>
  );
});

/* Provider Item Row */
const ProviderItemRow = memo(({ item, data, liveBalances, onClick }) => {
  const isCard = item.type === "card";
  const isAccount = item.type === "account";

  let balance = 0;
  let label = "";
  let sublabel = "";
  let isNegative = false;

  if (isCard) {
    balance = computeCardDebt(data, item);
    const limit = safeNumber(item.limit);
    const available = Math.max(0, limit - Math.max(0, balance));
    label = item.displayName || `💳 ${item.bank} ${item.name} • ${item.last4}`;
    sublabel = `متاح: ${formatAdaptive(available)} • حد: ${formatAdaptive(limit)}`;
    isNegative = balance > 0;
  } else if (isAccount) {
    balance = safeNumber(liveBalances[item.key]);
    label = item.label || ACCOUNT_SHORT_NAMES[item.key] || item.key;
    sublabel = item.last4 ? `•••• ${item.last4}` : "";
    isNegative = balance < 0;
  }

  const provider = PROVIDERS[item.providerKey || "cash"];

  return (
    <button type="button" className="provider-item" onClick={onClick}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, flex: 1, minWidth: 0 }}>
        {isCard ? (
          <div className="provider-logo-box" style={{ background: "#0A1628", border: "none" }}>
            <CreditCard size={20} style={{ color: "white" }} />
          </div>
        ) : (
          <ProviderLogo providerKey={item.providerKey || "cash"} size="lg" />
        )}
        <div style={{ minWidth: 0, flex: 1 }}>
          <p style={{
            fontSize: 13, fontWeight: 800, margin: 0,
            overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
          }}>
            {label}
          </p>
          {sublabel && (
            <p style={{
              fontSize: 10, fontWeight: 700, marginTop: 3, marginBottom: 0,
              color: "var(--text-muted)",
              overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
            }}>
              {sublabel}
            </p>
          )}
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
        <span className="money" style={{
          fontWeight: 900, fontSize: 14,
          color: isNegative ? "var(--negative)" : "var(--positive)",
        }}>
          {formatAdaptive(Math.abs(balance))}
        </span>
        <ChevronLeft size={14} style={{ color: "var(--text-muted)" }} />
      </div>
    </button>
  );
});

/* Ledger Card — كشف حساب مفرد */
const LedgerCard = memo(({ accountKey, data, liveBalance, onReconcile }) => {
  const [expanded, setExpanded] = useState(false);
  const config = WALLET_CONFIGS[accountKey];
  if (!config) return null;

  const ledger = useMemo(
    () => buildLedgerWithBalance(data.transactions, data.accountsData, accountKey),
    [data.transactions, data.accountsData, accountKey],
  );

  const stats = useMemo(() => {
    const deposits = ledger.filter((t) => t.subType === "deposit").reduce((s, t) => s + safeNumber(t.amount), 0);
    const withdrawals = ledger.filter((t) => t.subType === "withdrawal").reduce((s, t) => s + safeNumber(t.amount), 0);
    return { deposits, withdrawals };
  }, [ledger]);

  const provider = PROVIDERS[config.group === "bank" ? accountKey.split("_")[0] : config.group] || PROVIDERS.cash;

  return (
    <div className="card" style={{ marginBottom: 8 }}>
      <div
        style={{
          display: "flex", alignItems: "center", justifyContent: "space-between",
          gap: 12, cursor: "pointer",
        }}
        onClick={() => setExpanded(!expanded)}

        <div style={{ display: "flex", alignItems: "center", gap: 12, flex: 1, minWidth: 0 }}>
          {config.logoUrl ? (
            <div className="provider-logo-box" style={{ width: 44, height: 44, padding: 4 }}>
              <img
                src={config.logoUrl}
                alt={config.title}
                style={{ width: "100%", height: "100%", objectFit: "contain" }}
                onError={(e) => { e.currentTarget.style.display = "none"; }}
              />
            </div>
          ) : (
            <div style={{
              width: 44, height: 44, borderRadius: 14,
              display: "flex", alignItems: "center", justifyContent: "center",
              background: "var(--bg-muted)", color: "var(--text-secondary)",
            }}>
              <Wallet size={20} />
            </div>
          )}
          <div style={{ minWidth: 0 }}>
            <h3 style={{ fontSize: 13, fontWeight: 900, margin: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {config.title}
            </h3>
            <p style={{
              fontSize: 10, color: "var(--text-muted)",
              marginTop: 2, marginBottom: 0, fontWeight: 700,
            }}>
              {config.subtitle}
            </p>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
          <span className="money" style={{
            fontSize: 15, fontWeight: 900, color: "var(--brand)",
          }}>
            {formatAdaptive(liveBalance)}
          </span>
          <ChevronDown
            size={14}
            style={{
              color: "var(--text-muted)",
              transform: expanded ? "rotate(180deg)" : "none",
              transition: "transform 0.2s ease",
            }}
          />
        </div>
      </div>

      {expanded && (
        <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid var(--border)" }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, marginBottom: 12 }}>
            <MiniStat label="إيداع" value={fmtShort(stats.deposits)} color="var(--positive)" />
            <MiniStat label="سحب" value={fmtShort(stats.withdrawals)} color="var(--negative)" />
            <MiniStat label="الرصيد" value={fmtShort(liveBalance)} color="var(--brand)" />
          </div>

          <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
            <button
              onClick={() => onReconcile(accountKey)}
              className="btn btn-secondary"
              style={{ flex: 1, fontSize: 10, padding: "8px 10px" }}

              <Scale size={11} /> مطابقة
            </button>
          </div>

          {ledger.length === 0 ? (
            <p style={{
              fontSize: 11, color: "var(--text-muted)", textAlign: "center",
              padding: 16, margin: 0,
            }}>

            <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 300, overflowY: "auto" }}>

                  padding: 8, borderRadius: 10, background: "var(--bg-muted)",
                }}>
                  <div style={{ minWidth: 0, flex: 1 }}>
                    <p style={{
                      fontSize: 11, fontWeight: 700, margin: 0,

/* Cashback View */
const CashbackView = memo(({ data, dispatch, addNotification }) => {
  const trackers = data?.cashbackTrackers || [];
  const summary = useMemo(() => {
    const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
    const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
    return { expected, received, pending: expected - received };
  }, [trackers]);

  return (
    <div className="card" style={{ marginTop: 12 }}>
      <h3 style={{ fontSize: 14, fontWeight: 900, marginBottom: 12, display: "flex", alignItems: "center", gap: 8 }}>
