      const opt = { margin: [10, 8, 10, 8], filename: `كشف_${card.bank}_${card.name}_${card.last4}.pdf`, image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } };
      await window.html2pdf().set(opt).from(wrapper).save();
      addNotification({ type: 'success', title: 'تم تصدير PDF', message: `${filteredTx.length} معاملة` });
    } catch (e) { console.error('PDF Error:', e); addNotification({ type: 'error', title: 'فشل التصدير', message: e.message }); }
    finally { setExporting(false); }
  };

  if (!card) return null;

  const liveDebt = computeCardDebt(data, card);
  const liveAvailable = Math.max(0, safeNumber(card.limit) - liveDebt);
  const usagePct = safeNumber(card.limit) > 0 ? (Math.max(0, liveDebt) / safeNumber(card.limit)) * 100 : 0;
  const isCredit = liveDebt < 0;

  return (
    <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="generic-modal max-w-3xl">
        <div className="generic-modal-header">
          <div className="flex items-center gap-2 min-w-0">
            <div className="p-2 rounded-lg flex-shrink-0 bg-indigo-50 dark:bg-indigo-950/30 text-indigo-600 dark:text-indigo-400"><CreditCard size={18} /></div>
            <div className="min-w-0">
              <h3 className="text-base font-black truncate">{card.bank} - {card.name}</h3>
              <p className="text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>•••• {card.last4} • {stats.count} معاملة</p>
            </div>
          </div>
          <button onClick={onClose} className="btn btn-ghost p-1.5"><X size={16} /></button>
        </div>
        <div className="generic-modal-body" ref={containerRef}>
          <div className="p-3 rounded-xl mb-3" style={{ background: 'var(--bg-muted)' }}>
            <div className="grid grid-cols-3 gap-2">
              <div className="text-center">
                <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>{isCredit ? 'رصيد دائن' : 'المديونية الحية'}</p>
                <p className={`text-base font-black mt-0.5 money tabular ${isCredit ? 'text-emerald-600' : 'text-red-600'}`}>
                  {isCredit ? `+${fmt(Math.abs(liveDebt))}` : fmt(liveDebt)}
                </p>
              </div>
              <div className="text-center">
                <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>المتاح</p>
                <p className="text-base font-black text-emerald-600 mt-0.5 money tabular">{fmt(liveAvailable)}</p>
              </div>
              <div className="text-center">
                <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الحد الكلي</p>
                <p className="text-base font-black text-blue-600 mt-0.5 money tabular">{fmt(card.limit)}</p>
              </div>
            </div>
            <div className="w-full rounded-full h-1.5 overflow-hidden mt-2" style={{ background: 'var(--bg-card)' }}>
              <div className={`h-full ${usagePct > 70 ? 'bg-red-500' : usagePct > 40 ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(100, usagePct)}%` }}></div>
            </div>
            {(card.openingDebtDate || card.openingDate) && (
              <p className="text-[9px] mt-2 text-center" style={{ color: 'var(--text-muted)' }}>📅 من {card.openingDebtDate || card.openingDate}</p>
            )}
          </div>
          <div className="grid grid-cols-3 gap-2 mb-3">
            <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
              <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مشتريات</p>
              <p className="text-sm font-black text-red-600 mt-0.5 money tabular">{fmt(stats.expenses)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
              <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">سدادات</p>
              <p className="text-sm font-black text-emerald-600 mt-0.5 money tabular">{fmt(stats.incomes)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
              <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الصافي</p>
              <p className={`text-sm font-black mt-0.5 money tabular ${stats.total >= 0 ? 'text-blue-600' : 'text-emerald-600'}`}>{fmt(Math.abs(stats.total))}</p>
            </div>
          </div>
          <div className="flex gap-1.5 flex-wrap mb-3" data-pdf-hide="true">
            <div className="relative flex-1 min-w-[140px]">
              <Search className="absolute right-2.5 top-1/2 -translate-y-1/2" size={12} style={{ color: 'var(--text-muted)' }} />
              <input type="text" placeholder="ابحث..." className="input-field pr-8 text-[11px] py-2" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
            </div>
            <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <button type="button" onClick={() => setFilterType('all')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'all' ? 'shadow-sm' : ''}`} style={filterType === 'all' ? { background: 'var(--bg-card)', color: 'var(--accent)' } : { color: 'var(--text-muted)' }}>الكل ({cardTx.length})</button>
              <button type="button" onClick={() => setFilterType('expense')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'expense' ? 'shadow-sm' : ''}`} style={filterType === 'expense' ? { background: 'var(--bg-card)', color: 'var(--danger)' } : { color: 'var(--text-muted)' }}>مشتريات</button>
              <button type="button" onClick={() => setFilterType('income')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'income' ? 'shadow-sm' : ''}`} style={filterType === 'income' ? { background: 'var(--bg-card)', color: 'var(--success)' } : { color: 'var(--text-muted)' }}>سدادات</button>
            </div>
            <select className="input-field text-[10px] py-2 px-1.5 w-auto min-w-[90px]" value={sortBy} onChange={e => setSortBy(e.target.value)}>
              <option value="date">📅 التاريخ</option>
              <option value="amount">💰 المبلغ</option>
            </select>
            <button type="button" onClick={handlePrint} disabled={filteredTx.length === 0} className="btn btn-secondary text-[10px] py-2 px-2.5">
              <Printer size={11} /><span className="hidden sm:inline">طباعة</span>
            </button>
            <button type="button" onClick={handleExportPdf} disabled={exporting || filteredTx.length === 0} className="btn btn-primary text-[10px] py-2 px-2.5">
              {exporting ? <RefreshCcw size={11} className="animate-spin" /> : <Download size={11} />}
              <span className="hidden sm:inline">PDF</span>
            </button>
          </div>
          {stats.monthly.length > 0 && (
            <details className="mb-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <summary className="p-2.5 cursor-pointer text-[10px] font-black" style={{ color: 'var(--text-secondary)' }}>📊 الملخص الشهري ({stats.monthly.length} شهر)</summary>
              <div className="px-2.5 pb-2.5 space-y-1">
                {stats.monthly.slice(0, 6).map((m, i) => (
                  <div key={i} className="flex justify-between items-center text-[10px] p-1.5 rounded" style={{ background: 'var(--bg-card)' }}>
                    <span className="font-bold">{m.month} {m.year} <span style={{ color: 'var(--text-muted)' }}>({m.count})</span></span>
                    <div className="flex gap-2">
                      <span className="text-red-600 font-bold money tabular">-{fmt(m.expenses)}</span>
                      {m.incomes > 0 && <span className="text-emerald-600 font-bold money tabular">+{fmt(m.incomes)}</span>}
                    </div>
                  </div>
                ))}
              </div>
            </details>
          )}
          {filteredTx.length === 0 ? (
            <div className="text-center py-8">
              <CreditCard size={32} className="mx-auto mb-2" style={{ color: 'var(--text-muted)' }} />
              <p className="font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>{cardTx.length === 0 ? 'لا توجد معاملات مسجلة على هذه البطاقة بعد' : 'لا توجد نتائج مطابقة'}</p>
            </div>
          ) : (
            <div className="space-y-2 max-h-[45vh] overflow-y-auto scroll-hide pdf-expand">
              {dailyGroups.map(group => (
                <div key={group.date}>
                  <DayGroupHeader label={group.label} total={group.total} count={group.items.length} />
                  <div className="space-y-1.5">
                    {group.items.map(t => (
                      <div key={t.id} className="flex justify-between items-center gap-2 p-2.5 rounded-lg" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                        <div className="min-w-0 flex-1">
                          <p className="font-bold text-xs truncate flex items-center gap-1 flex-wrap">
                            {getTxDisplay(t)} <TxTimeChip createdAt={t.createdAt} />
                            <SmsBadge tx={t} /> <TeldaBadge tx={t} /> <RecurringBadge tx={t} /> <ReconciliationBadge tx={t} />
                          </p>
                          <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
                            {t.category}
                            {t.cardLast4 && <span className="font-mono"> • ••••{t.cardLast4}</span>}
                            {t.linkedLoanId && <span className="text-amber-600"> • مرتبط بقرض</span>}
                          </p>
                        </div>
                        <span className={`font-black text-xs flex-shrink-0 money tabular ${t.type === 'income' ? 'text-emerald-600' : 'text-red-600'}`}>
                          {t.type === 'income' ? '+' : '−'}{fmt(t.amount)}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
          {filteredTx.length > 0 && (
            <div className="mt-3 p-3 rounded-lg bg-gradient-to-br from-[#4A42E5] to-[#635BFF] text-white flex justify-between items-center">
              <span className="font-black text-sm">الإجمالي (المعروض)</span>
              <span className="text-xl font-black money tabular">
                {fmt(filteredTx.reduce((s, t) => s + (t.type === 'income' ? -safeNumber(t.amount) : safeNumber(t.amount)), 0))} ج.م
              </span>
            </div>
          )}
        </div>
        <div className="generic-modal-footer" data-pdf-hide="true">
          <button onClick={onClose} className="btn btn-secondary flex-1 text-sm">إغلاق</button>
        </div>
      </div>
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════
   MonthlyPlanningView — 3 tabs (Plan, Compare, Derive)
   ═══════════════════════════════════════════════════════════════ */
const MonthlyPlanningView = memo(({ data, monthlyPlans, dispatch, saveHistory, addNotification, transactions, updatedLoans, cards, liveBalances }) => {
  const currentYear = new Date().getFullYear();
  const [year, setYear] = useState(() => YEARS_LIST.includes(currentYear) ? currentYear : YEARS_LIST[0]);
  const [activeTab, setActiveTab] = useState('plan');
  const [deriveMonths, setDeriveMonths] = useState(3);
  const months = getMonthsForYear(year);
  const plan = monthlyPlans || {};

  const updatePlan = useCallback((monthKey, field, value) => {
    dispatch({ type: 'UPDATE_MONTHLY_PLANS', payload: { ...plan, [monthKey]: { ...(plan[monthKey] || {}), [field]: parseNumberInput(value) } } });
  }, [plan, dispatch]);

  const copyFromPreviousMonth = useCallback((monthKey) => {
    const parsed = parseMonthKey(monthKey);
    if (!parsed) return;
    const prev = addMonthsToYM(parsed.year, parsed.month, -1);
    const prevKey = makeMonthKey(prev.year, prev.month);
    const prevPlan = plan[prevKey];
    if (!prevPlan || Object.keys(prevPlan).length === 0) { addNotification({ type: 'info', title: `لا توجد خطة لشهر ${prev.month}` }); return; }
    const { _meta: _, ...values } = prevPlan;
    dispatch({ type: 'UPDATE_MONTHLY_PLANS', payload: { ...plan, [monthKey]: { ...values, _meta: { copiedFrom: prevKey } } } });
    addNotification({ type: 'success', title: `تم النسخ من ${prev.month} ${prev.year}` });
  }, [plan, dispatch, addNotification]);

  const deriveFromHistory = useCallback((monthKey, monthsBack = 3) => {
    const parsed = parseMonthKey(monthKey);
    if (!parsed) return;
    const derived = deriveMonthlyPlanFromHistory(data, parsed.year, parsed.month, monthsBack);
    if (!derived) { addNotification({ type: 'info', title: 'لا توجد بيانات كافية للاشتقاق' }); return; }
    const { _meta, ...values } = derived;
    dispatch({ type: 'UPDATE_MONTHLY_PLANS', payload: { ...plan, [monthKey]: { ...(plan[monthKey] || {}), ...values, _meta } } });
    addNotification({ type: 'success', title: `تم الاشتقاق من ${monthsBack} شهور`, message: _meta?.refMonths || '' });
  }, [data, plan, dispatch, addNotification]);

  const FIELDS = [
    { id: 'expectedSalary', label: 'راتب', icon: '💰' },
    { id: 'expectedRent', label: 'إيجار', icon: '🏪' },
    { id: 'expectedCashback', label: 'كاش باك', icon: '🎁' },
    { id: 'expectedEmakWE', label: 'عهدة إيماك', icon: '📱' },
    { id: 'expectedZakat', label: 'زكاة', icon: '🕌' },
    { id: 'expectedCash', label: 'كاش حر', icon: '💵' },
    { id: 'expectedCashExpenses', label: 'مصروف كاش', icon: '💸' },
    { id: 'plannedPayments', label: 'أقساط', icon: '🏦' }
  ];

  const comparisonData = useMemo(() => {
    return months.map(m => {
      const monthKey = makeMonthKey(year, m);
      const p = plan[monthKey] || {};
      const flows = computeMonthlyFlows(transactions, year, m);

      const plannedIn = safeNumber(p.expectedSalary) + safeNumber(p.expectedRent) + safeNumber(p.expectedCashback) + safeNumber(p.expectedEmakWE) + safeNumber(p.expectedZakat) + safeNumber(p.expectedCash);
      const plannedOut = safeNumber(p.expectedCashExpenses) + safeNumber(p.plannedPayments);

      const actualIn = flows.paidIncome;
      const actualOut = flows.paidExpense;
      const pendingIn = flows.pendingIncome;
      const pendingOut = flows.pendingExpense;

      const plannedNet = plannedIn - plannedOut;
      const actualNet = actualIn - actualOut;
      const variance = plannedIn > 0 ? ((actualIn - plannedIn) / plannedIn) * 100 : 0;

      return { month: m, monthKey, plan: p, hasPlan: Object.keys(p).length > 0, plannedIn, plannedOut, plannedNet, actualIn, actualOut, actualNet, pendingIn, pendingOut, variance, isClosed: isMonthClosed(data, year, m) };
    });
  }, [months, plan, transactions, year, data]);

  const yearStats = useMemo(() => {
    const plannedIn = comparisonData.reduce((s, d) => s + d.plannedIn, 0);
    const plannedOut = comparisonData.reduce((s, d) => s + d.plannedOut, 0);
    const actualIn = comparisonData.reduce((s, d) => s + d.actualIn, 0);
    const actualOut = comparisonData.reduce((s, d) => s + d.actualOut, 0);
    const monthsWithPlan = comparisonData.filter(d => d.hasPlan).length;
    return { plannedIn, plannedOut, actualIn, actualOut, plannedNet: plannedIn - plannedOut, actualNet: actualIn - actualOut, monthsWithPlan, totalMonths: months.length };
  }, [comparisonData, months]);

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
          <h2 className="text-base font-black flex items-center gap-2"><Table size={16} className="text-[color:var(--accent)]" /> التخطيط والمخطط</h2>
          <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
            {YEARS_LIST.map(y => (
              <button key={y} type="button" onClick={() => setYear(y)}
                className={`px-3 py-1.5 rounded-md text-[11px] font-black transition-all ${year === y ? 'shadow-sm' : ''}`}
                style={year === y ? { background: 'var(--bg-card)', color: 'var(--accent)' } : { color: 'var(--text-muted)' }}>{y}</button>
            ))}
          </div>
        </div>
        <div className="sub-tab-switcher">
          <button type="button" onClick={() => setActiveTab('plan')} className={`sub-tab-btn ${activeTab === 'plan' ? 'active' : ''}`}><Table size={14} /> التخطيط</button>
          <button type="button" onClick={() => setActiveTab('compare')} className={`sub-tab-btn ${activeTab === 'compare' ? 'active' : ''}`}><Activity size={14} /> المقارنة</button>
          <button type="button" onClick={() => setActiveTab('derive')} className={`sub-tab-btn ${activeTab === 'derive' ? 'active' : ''}`}><Sparkles size={14} /> الاشتقاق الذكي</button>
        </div>
      </div>

      <div className="card">
        <h3 className="font-black text-sm mb-3">📊 نظرة عامة على {year}</h3>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
          <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
            <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">الدخل المخطط</p>
            <p className="text-sm font-black text-emerald-600 mt-0.5 money tabular">{fmtShort(yearStats.plannedIn)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
            <p className="text-[10px] font-bold text-red-700 dark:text-red-400">المصروف المخطط</p>
            <p className="text-sm font-black text-red-600 mt-0.5 money tabular">{fmtShort(yearStats.plannedOut)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الدخل الفعلي</p>
            <p className="text-sm font-black text-blue-600 mt-0.5 money tabular">{fmtShort(yearStats.actualIn)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-center">
            <p className="text-[10px] font-bold text-amber-700 dark:text-amber-400">المصروف الفعلي</p>
            <p className="text-sm font-black text-amber-600 mt-0.5 money tabular">{fmtShort(yearStats.actualOut)}</p>
          </div>
        </div>
        <div className="mt-3 flex justify-between items-center text-xs">
          <span style={{ color: 'var(--text-muted)' }}>الصافي المخطط</span>
          <span className={`font-black money tabular ${yearStats.plannedNet >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(yearStats.plannedNet)}</span>
        </div>
        <div className="mt-1 flex justify-between items-center text-xs">
          <span style={{ color: 'var(--text-muted)' }}>الصافي الفعلي</span>
          <span className={`font-black money tabular ${yearStats.actualNet >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(yearStats.actualNet)}</span>
        </div>
        <p className="text-[10px] mt-3 pt-3 text-center font-bold" style={{ color: 'var(--text-muted)', borderTop: '1px dashed var(--border-default)' }}>
          📝 {yearStats.monthsWithPlan} من {yearStats.totalMonths} شهر مُخطَّط
        </p>
      </div>

      {activeTab === 'plan' && (
        <div className="space-y-3">
          <p className="text-[11px] leading-relaxed px-2" style={{ color: 'var(--text-muted)' }}>
            💡 عدّل القيم يدوياً، أو استخدم <strong>النسخ من الشهر السابق</strong>، أو <strong>الاشتقاق الذكي</strong>
          </p>
          {months.map(m => {
            const monthKey = makeMonthKey(year, m);
            const p = plan[monthKey] || {};
            const totalIn = safeNumber(p.expectedSalary) + safeNumber(p.expectedRent) + safeNumber(p.expectedCashback) + safeNumber(p.expectedEmakWE) + safeNumber(p.expectedZakat) + safeNumber(p.expectedCash);
            const totalOut = safeNumber(p.expectedCashExpenses) + safeNumber(p.plannedPayments);
            const net = totalIn - totalOut;
            const isClosed = isMonthClosed(data, year, m);
            const hasData = Object.keys(p).length > 0;
            return (
              <div key={monthKey} className="card">
                <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                  <div className="flex items-center gap-2">
                    <h3 className="font-black text-sm">{m} {year}</h3>
                    {isClosed && <span className="badge badge-success text-[10px]"><ShieldCheck size={10} /> مغلق</span>}
                    {!hasData && <span className="badge badge-neutral text-[10px]">لم يُخطط</span>}
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button type="button" onClick={() => copyFromPreviousMonth(monthKey)} className="btn btn-secondary text-[10px] py-1 px-2" title="نسخ من الشهر السابق"><Copy size={10} /> نسخ</button>
                    <span className={`badge money tabular ${net >= 0 ? 'badge-success' : 'badge-danger'}`}>{net >= 0 ? '+' : ''}{fmt(net)}</span>
                  </div>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                  {FIELDS.map(f => (
                    <div key={f.id}>
                      <label className="text-[9px] font-bold block mb-0.5 flex items-center gap-1" style={{ color: 'var(--text-muted)' }}><span>{f.icon}</span>{f.label}</label>
                      <input type="text" inputMode="decimal" className={`planning-input text-xs ${p[f.id] ? 'user-edited' : ''}`} value={p[f.id] ?? ''} onChange={(e) => updatePlan(monthKey, f.id, e.target.value)} placeholder="0" />
                    </div>
                  ))}
                </div>
                {p._meta?.refMonths && <p className="text-[9px] mt-2" style={{ color: 'var(--text-muted)' }}>📊 {p._meta.refMonths}</p>}
                {p._meta?.copiedFrom && <p className="text-[9px] mt-2" style={{ color: 'var(--text-muted)' }}>📋 منسوخ من {p._meta.copiedFrom}</p>}
              </div>
            );
          })}
        </div>
      )}

      {activeTab === 'compare' && (
        <div className="space-y-3">
          <div className="card">
            <h3 className="font-black text-sm mb-3">📊 المخطط vs الفعلي</h3>
            <div className="space-y-2 max-h-[60vh] overflow-y-auto scroll-hide">
              {comparisonData.map(d => {
                const inPct = d.plannedIn > 0 ? Math.min(100, (d.actualIn / d.plannedIn) * 100) : 0;
                const outPct = d.plannedOut > 0 ? Math.min(100, (d.actualOut / d.plannedOut) * 100) : 0;
                return (
                  <div key={d.monthKey} className="p-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                    <div className="flex justify-between items-center mb-2">
                      <span className="font-black text-xs flex items-center gap-1.5">
                        {d.month} {year}
                        {d.isClosed && <span className="badge badge-success text-[9px]"><ShieldCheck size={8} /> مغلق</span>}
                        {!d.hasPlan && <span className="badge badge-neutral text-[9px]">بلا خطة</span>}
                      </span>
                      {d.hasPlan && <span className={`text-[10px] font-black ${d.variance >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{d.variance >= 0 ? '+' : ''}{Math.round(d.variance)}% دقة</span>}
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <div className="flex justify-between text-[10px] mb-1">
                          <span className="font-bold" style={{ color: 'var(--text-secondary)' }}>💚 دخل</span>
                          <span className="font-black money tabular">
                            <span className="text-emerald-600">{fmtShort(d.actualIn)}</span>
                            {d.plannedIn > 0 && <span style={{ color: 'var(--text-muted)' }}> / {fmtShort(d.plannedIn)}</span>}
                          </span>
                        </div>
                        <div className="w-full rounded-full h-1.5 overflow-hidden" style={{ background: 'var(--bg-card)' }}>
                          <div className="h-full bg-emerald-500 transition-all" style={{ width: `${inPct}%` }}></div>
                        </div>
                        {d.pendingIn > 0 && <p className="text-[9px] mt-1 text-amber-600 font-bold money tabular">⏳ معلق: +{fmtShort(d.pendingIn)}</p>}
                      </div>
                      <div>
                        <div className="flex justify-between text-[10px] mb-1">
                          <span className="font-bold" style={{ color: 'var(--text-secondary)' }}>❤️ مصروف</span>
                          <span className="font-black money tabular">
                            <span className="text-red-600">{fmtShort(d.actualOut)}</span>
                            {d.plannedOut > 0 && <span style={{ color: 'var(--text-muted)' }}> / {fmtShort(d.plannedOut)}</span>}
                          </span>
                        </div>
                        <div className="w-full rounded-full h-1.5 overflow-hidden" style={{ background: 'var(--bg-card)' }}>
                          <div className="h-full bg-red-500 transition-all" style={{ width: `${outPct}%` }}></div>
                        </div>
                        {d.pendingOut > 0 && <p className="text-[9px] mt-1 text-amber-600 font-bold money tabular">⏳ معلق: −{fmtShort(d.pendingOut)}</p>}
                      </div>
                    </div>
                    <div className="mt-2 pt-2 flex justify-between text-[10px]" style={{ borderTop: '1px dashed var(--border-default)' }}>
                      <span style={{ color: 'var(--text-muted)' }}>صافي مخطط: <strong className={`money tabular ${d.plannedNet >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmtShort(d.plannedNet)}</strong></span>
                      <span style={{ color: 'var(--text-muted)' }}>صافي فعلي: <strong className={`money tabular ${d.actualNet >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmtShort(d.actualNet)}</strong></span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {activeTab === 'derive' && (
        <div className="space-y-3">
          <div className="card">
            <h3 className="font-black text-sm mb-3 flex items-center gap-2"><Sparkles size={16} className="text-[color:var(--accent)]" /> الاشتقاق الذكي من التاريخ</h3>
            <p className="text-[11px] leading-relaxed mb-4" style={{ color: 'var(--text-secondary)' }}>يحسب متوسط كل بند من الشهور الماضية. اختر فترة الاشتقاق:</p>
            <div className="flex gap-2 mb-4">
              {[3, 6, 12].map(n => (
                <button key={n} type="button" onClick={() => setDeriveMonths(n)}
                  className={`flex-1 py-2.5 rounded-lg text-xs font-black transition-all ${deriveMonths === n ? 'bg-[color:var(--accent)] text-white shadow-md' : ''}`}
                  style={deriveMonths !== n ? { background: 'var(--bg-muted)', color: 'var(--text-secondary)' } : {}}>{n} شهور</button>
              ))}
            </div>
          </div>
          <div className="space-y-2">
            {months.map(m => {
              const monthKey = makeMonthKey(year, m);
              const p = plan[monthKey] || {};
              const hasData = Object.keys(p).length > 0;
              return (
                <div key={monthKey} className="card py-3 flex justify-between items-center gap-3">
                  <div className="flex items-center gap-2 min-w-0 flex-1">
                    <div className="p-2 rounded-lg flex-shrink-0" style={{ background: 'var(--bg-muted)', color: hasData ? 'var(--success)' : 'var(--text-muted)' }}>
                      {hasData ? <CheckCircle2 size={14} /> : <Circle size={14} />}
                    </div>
                    <div className="min-w-0">
                      <p className="font-black text-xs">{m} {year}</p>
                      <p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>{hasData ? 'مُخطط' : 'لم يُخطط بعد'}</p>
                    </div>
                  </div>
                  <button type="button" onClick={() => deriveFromHistory(monthKey, deriveMonths)} className="btn btn-primary text-[11px] py-1.5 px-3 flex-shrink-0"><Sparkles size={11} /> اشتق</button>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
});

const LiquidityForecastView = memo(({
  transactions, updatedLoans, recurringItems, liveBalances,
  selectedYear, selectedMonth, monthlyPlans, liquidityDual
}) => {
  const currentLiquidity = liquidityDual.comprehensive;

  const forecast = useMemo(() => {
    const months = [];
    let runningBalance = currentLiquidity;
    for (let i = 0; i < 6; i++) {
      const { year, month } = addMonthsToYM(selectedYear, selectedMonth, i);
      if (getMonthIndex(month) < 0) continue;
      const monthKey = makeMonthKey(year, month);
      const p = monthlyPlans?.[monthKey] || {};
      const flows = computeMonthlyFlows(transactions, year, month);

      let income, expense;
      if (i === 0) {
        income = flows.paidIncome + flows.pendingIncome;
        expense = flows.paidExpense + flows.pendingExpense;
      } else {
        const plannedIncome = safeNumber(p.expectedSalary) + safeNumber(p.expectedRent) + safeNumber(p.expectedCashback) + safeNumber(p.expectedEmakWE) + safeNumber(p.expectedZakat) + safeNumber(p.expectedCash);
        const plannedExpense = safeNumber(p.expectedCashExpenses) + safeNumber(p.plannedPayments);
        const recIncome = recurringItems.filter(r => r.active !== false && r.type === 'income' && !r.linkedLoanSystemId).reduce((s, r) => s + safeNumber(r.amount), 0);
        const recExpense = recurringItems.filter(r => r.active !== false && r.type === 'expense' && !r.linkedLoanSystemId).reduce((s, r) => s + safeNumber(r.amount), 0);
        income = plannedIncome > 0 ? plannedIncome : recIncome;
        expense = plannedExpense > 0 ? plannedExpense : recExpense;
      }
      runningBalance += income - expense;
      months.push({ month, year, income, expense, balance: runningBalance, isCurrent: i === 0 });
    }
    return months;
  }, [transactions, selectedYear, selectedMonth, monthlyPlans, currentLiquidity, recurringItems]);

  const chartData = forecast.map(f => ({ name: f.month.slice(0, 3), 'الرصيد': f.balance, 'دخل': f.income, 'مصروف': f.expense }));
  const minBalance = forecast.length > 0 ? Math.min(...forecast.map(f => f.balance)) : 0;
  const lastBalance = forecast[forecast.length - 1]?.balance || 0;

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <h2 className="text-base font-black flex items-center gap-2 mb-3"><LineChart size={16} className="text-[color:var(--accent)]" /> توقع السيولة — 6 شهور</h2>
        <p className="text-[11px] mb-3" style={{ color: 'var(--text-muted)' }}>يعتمد على: الفعلي + المعلقات (للشهر الحالي) والخطط + البنود المتكررة (للشهور القادمة)</p>
        <div className="grid grid-cols-3 gap-2">
          <div className="p-2.5 rounded-xl bg-blue-50 dark:bg-blue-950/30 text-center">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الآن</p>
            <p className="text-sm font-black text-blue-600 mt-1 money tabular">{fmtShort(currentLiquidity)}</p>
          </div>
          <div className={`p-2.5 rounded-xl text-center ${lastBalance >= 0 ? 'bg-emerald-50 dark:bg-emerald-950/30' : 'bg-red-50 dark:bg-red-950/30'}`}>
            <p className={`text-[10px] font-bold ${lastBalance >= 0 ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-700 dark:text-red-400'}`}>بعد 6 شهور</p>
            <p className={`text-sm font-black mt-1 money tabular ${lastBalance >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmtShort(lastBalance)}</p>
          </div>
          <div className={`p-2.5 rounded-xl text-center ${minBalance >= 0 ? 'bg-emerald-50 dark:bg-emerald-950/30' : 'bg-amber-50 dark:bg-amber-950/30'}`}>
            <p className={`text-[10px] font-bold ${minBalance >= 0 ? 'text-emerald-700 dark:text-emerald-400' : 'text-amber-700 dark:text-amber-400'}`}>أدنى نقطة</p>
            <p className={`text-sm font-black mt-1 money tabular ${minBalance >= 0 ? 'text-emerald-600' : 'text-amber-600'}`}>{fmtShort(minBalance)}</p>
          </div>
        </div>
      </div>
      <div className="card">
        <h3 className="font-bold text-xs mb-3" style={{ color: 'var(--text-secondary)' }}>منحنى الرصيد المتوقع</h3>
        <div className="h-56">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={chartData}>
              <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.06} />
              <XAxis dataKey="name" fontSize={10} stroke="#94A3B8" />
              <YAxis fontSize={10} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
              <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '12px', border: '1px solid var(--border-subtle)', fontFamily: 'Cairo', fontSize: '12px' }} />
              <Legend wrapperStyle={{ fontSize: '11px', fontWeight: 'bold' }} />
              <Bar dataKey="دخل" fill="#00A86B" radius={[4, 4, 0, 0]} barSize={12} />
              <Bar dataKey="مصروف" fill="#DC2626" radius={[4, 4, 0, 0]} barSize={12} />
              <Bar dataKey="الرصيد" fill="#635BFF" radius={[4, 4, 0, 0]} barSize={12} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
      <div className="card">
        <h3 className="font-black text-sm mb-3">📋 التفاصيل الشهرية</h3>
        <div className="space-y-2">
          {forecast.map((f, i) => (
            <div key={i} className="p-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <div className="flex justify-between items-center mb-1.5">
                <span className="font-bold text-xs flex items-center gap-1.5">
                  {f.month} {f.year}
                  {f.isCurrent && <span className="badge badge-accent text-[9px]">الحالي</span>}
                </span>
                <span className={`font-black text-sm money tabular ${f.balance >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(f.balance)}</span>
              </div>
              <div className="flex justify-between text-[10px]" style={{ color: 'var(--text-muted)' }}>
                <span>دخل: <strong className="text-emerald-600 money tabular">+{fmt(f.income)}</strong></span>
                <span>مصروف: <strong className="text-red-600 money tabular">−{fmt(f.expense)}</strong></span>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════
   ⭐⭐⭐ V86.1 CRITICAL FIX: FinancialForecastView
   ⭐⭐⭐ إصلاح ازدواج أقساط القروض + استخدام pending breakdowns
   ═══════════════════════════════════════════════════════════════ */
const FinancialForecastView = memo(({
  data, transactions, cards, updatedLoans, recurringItems,
  liveBalances, monthlyPlans, selectedYear, selectedMonth, liquidityDual
}) => {
  const [cardPaymentOverride, setCardPaymentOverride] = useState('');
  const [cardSpendingOverride, setCardSpendingOverride] = useState('');
  const [showSettings, setShowSettings] = useState(false);
  const [includePending, setIncludePending] = useState(true);

  const currentLiquidity = liquidityDual.comprehensive;

  const currentCardDebt = useMemo(() =>
    cards.reduce((s, c) => s + Math.max(0, computeCardDebt(data, c)), 0),
    [cards, data]
  );

  const currentLoanDebt = useMemo(() =>
    updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0),
    [updatedLoans]
  );

  const autoAverages = useMemo(() => {
    const pay = computeMonthlyAverage(
      transactions, selectedYear, selectedMonth, 3,
      (t) => {
        if (t.type !== 'expense') return false;
        if (CREDIT_CARD_METHOD_IDS.includes(t.method)) return false;
        if (t.linkedCardId) return false;
        const cat = t.category || '';
        const desc = t.description || '';
        return (cat === 'الالتزامات البنكية والتمويلية' || cat === 'بنوك / فيزا / تمويل عقاري'
          || cat === 'مصاريف وسلف شخصية' || desc.includes('سداد') || desc.includes('بطاقة'));
      }
    );
    const sp = computeMonthlyAverage(
      transactions, selectedYear, selectedMonth, 3,
      (t) => t.type === 'expense' && (CREDIT_CARD_METHOD_IDS.includes(t.method) || !!t.linkedCardId)
    );
    return { payment: Math.round(pay), spending: Math.round(sp) };
  }, [transactions, selectedYear, selectedMonth]);

  const baseCardPayment = cardPaymentOverride !== '' ? parseNumberInput(cardPaymentOverride) : autoAverages.payment;
  const baseCardSpending = cardSpendingOverride !== '' ? parseNumberInput(cardSpendingOverride) : autoAverages.spending;

  /**
   * ⭐⭐⭐ V86.1 FIX: منطق التوقع النقي بدون ازدواج
   *
   * القاعدة الذهبية:
   *   liquidity_delta = income - cash_expenses - card_payment - loan_installments
   *   حيث:
   *     cash_expenses = كل المصروفات النقدية التي تخرج من السيولة الآن
   *                     (لا تشمل مشتريات البطاقة ولا سداد البطاقة ولا أقساط القروض)
   *     card_payment  = سداد البطاقة (ينقص السيولة، ينقص مديونية البطاقة)
   *     loan_installments = أقساط القروض (تنقص السيولة، تنقص مديونية القروض)
   */
  const forecast = useMemo(() => {
    const months = [];
    let liq = currentLiquidity;
    let cardDebt = currentCardDebt;
    let loanDebt = currentLoanDebt;

    // ⭐ البنود المتكررة النشطة (بدون فلترة القروض)
    const activeRecurring = (recurringItems || []).filter(r => r.active !== false);
    const recIncomeTotal = activeRecurring.filter(r => r.type === 'income')
      .reduce((s, r) => s + safeNumber(r.amount), 0);
    const recCashExpenseTotal = activeRecurring.filter(r => 
      r.type === 'expense' && !CREDIT_CARD_METHOD_IDS.includes(r.method) && !r.linkedLoanSystemId
    ).reduce((s, r) => s + safeNumber(r.amount), 0);
    const recCardSpendTotal = activeRecurring.filter(r => 
      r.type === 'expense' && CREDIT_CARD_METHOD_IDS.includes(r.method)
    ).reduce((s, r) => s + safeNumber(r.amount), 0);

    // ⭐ أقساط القروض النشطة (من البيانات مباشرة)
    const activeLoanInstallments = (updatedLoans || [])
      .filter(l => !l.isReceivable && safeNumber(l.monthlyInstallment) > 0 && l.remaining > 0)
      .reduce((s, l) => s + safeNumber(l.monthlyInstallment), 0);

    for (let i = 0; i < 6; i++) {
      const { year, month } = addMonthsToYM(selectedYear, selectedMonth, i);
      if (getMonthIndex(month) < 0) continue;
      const monthKey = makeMonthKey(year, month);
      const p = monthlyPlans?.[monthKey] || {};
      const flows = computeMonthlyFlows(transactions, year, month);

      // ═══════════════════════════════════════════════════════
      // ⭐ 1. تصنيف المعاملات (فعلي + معلق)
      // ═══════════════════════════════════════════════════════
      const paidInc = flows.paidIncome;
      const paidCardSpend = flows.paidCardSpend;
      const paidCardPay = flows.paidCardPay;
      const paidLoan = flows.paidLoanInstallments;
      const cashExpPaid = flows.paidCashExpense;

      const pendInc = flows.pendingIncome;
      const pendCardSpend = flows.pendingCardSpend;
      const pendCardPay = flows.pendingCardPay;
      const pendLoan = flows.pendingLoanInstallments;
      const cashExpPend = flows.pendingCashExpense;

      // ═══════════════════════════════════════════════════════
      // ⭐ 2. حساب الإجماليات لكل شهر
      // ═══════════════════════════════════════════════════════
      let income, cashExpenses, cardSpending, cardPayment, loanInstallments;

      if (i === 0) {
        // ⭐ الشهر الحالي: كل المعلقات + الفعلي
        income = paidInc + pendInc;
        cashExpenses = cashExpPaid + cashExpPend;
        cardSpending = paidCardSpend + pendCardSpend;
        cardPayment = paidCardPay + pendCardPay;
        loanInstallments = paidLoan + pendLoan;

        // ⭐ متوسط ذكي لو مفيش سداد بطاقة مسجّل
        if (cardPayment < 0.01 && cardDebt > 0) {
          cardPayment = baseCardPayment || Math.round(cardDebt * 0.05);
        }
        // ⭐ متوسط ذكي لو مفيش مشتريات بطاقة مسجّلة
        if (cardSpending < 0.01 && cardDebt > 0) {
          cardSpending = baseCardSpending || Math.round(cardDebt * 0.04);
        }
        // ⭐ أقساط القروض النشطة لو مفيش مسجّل
        if (loanInstallments < 0.01 && activeLoanInstallments > 0) {
          loanInstallments = activeLoanInstallments;
        }
      } else {
        // ⭐ الشهور المستقبلية: معلقات + متكرر + خطة
        const pendCardSpendM = pendCardSpend;
        const pendCardPayM = pendCardPay;
        const pendLoanM = pendLoan;

        // الدخل: معلق + متكرر (أو خطة)
        const plannedInc = safeNumber(p.expectedSalary) + safeNumber(p.expectedRent) 
          + safeNumber(p.expectedCashback) + safeNumber(p.expectedEmakWE) 
          + safeNumber(p.expectedZakat) + safeNumber(p.expectedCash);
        income = pendInc + (plannedInc > 0 ? plannedInc : recIncomeTotal);

        // المصروفات النقدية: معلق + متكرر
        const plannedCashExp = safeNumber(p.expectedCashExpenses);
        cashExpenses = cashExpPend + (plannedCashExp > 0 ? plannedCashExp : recCashExpenseTotal);

        // مشتريات البطاقة: معلق + متكرر
        cardSpending = pendCardSpendM + recCardSpendTotal;

        // سداد البطاقة: معلق + متوسط ذكي
        cardPayment = pendCardPayM || baseCardPayment || Math.round(cardDebt * 0.05);

        // أقساط القروض: معلق + قروض نشطة
        loanInstallments = pendLoanM || activeLoanInstallments;
      }

      // ═══════════════════════════════════════════════════════
      // ⭐ 3. تحديث الأرصدة
      // ═══════════════════════════════════════════════════════
      const newCardDebt = Math.max(0, cardDebt - cardPayment + cardSpending);
      const newLoanDebt = Math.max(0, loanDebt - loanInstallments);
      const newLiquidity = liq + income - cashExpenses - cardPayment - loanInstallments;
      const totalDebt = newCardDebt + newLoanDebt;
      const netPosition = newLiquidity - totalDebt;

      const pendingCount = flows.monthTxs.filter(t => t.status !== 'paid').length;

      months.push({
        month, year, isCurrent: i === 0,
        startLiquidity: liq, startCardDebt: cardDebt, startLoanDebt: loanDebt,
        income, cashExpenses, cardSpending, cardPayment, loanInstallments,
        pendingIncome: pendInc, pendingCashExpense: cashExpPend, pendingCardSpend: pendCardSpend,
        pendingCardPay: pendCardPay, pendingLoanInst: pendLoan,
        pendingCount,
        endLiquidity: newLiquidity, endCardDebt: newCardDebt, endLoanDebt: newLoanDebt,
        totalDebt, netPosition
      });

      liq = newLiquidity;
      cardDebt = newCardDebt;
      loanDebt = newLoanDebt;
    }
    return months;
  }, [transactions, selectedMonth, selectedYear, monthlyPlans, currentLiquidity, currentCardDebt, currentLoanDebt, baseCardPayment, baseCardSpending, recurringItems, updatedLoans, includePending]);
  const chartData = forecast.map(f => ({
    name: f.month.slice(0, 3),
    'السيولة': Math.round(f.endLiquidity),
    'المديونية': Math.round(f.totalDebt),
    'صافي المركز': Math.round(f.netPosition)
  }));

  const alerts = useMemo(() => {
    const list = [];
    let warnedNeg = false;
    forecast.forEach(f => {
      if (f.endLiquidity < 0 && !warnedNeg) {
        list.push({ type: 'danger', title: `⚠️ سيولة سلبية في ${f.month} ${f.year}`, message: `السيولة هتبقى ${fmt(f.endLiquidity)} ج.م — محتاج إجراء` });
        warnedNeg = true;
      }
    });
    const last = forecast[forecast.length - 1];
    if (last && last.netPosition < 0) {
      list.push({ type: 'warning', title: `📉 صافي المركز سالب بعد 6 شهور`, message: `في ${last.month} ${last.year}: صافي = ${fmt(last.netPosition)} ج.م` });
    }
    return list;
  }, [forecast]);

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div>
            <h2 className="text-base font-black flex items-center gap-2"><TrendingUp size={16} className="text-[color:var(--accent)]" /> التنبؤ المالي الشامل — 6 شهور</h2>
            <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>تنبؤ دقيق من البيانات الفعلية والمعلقة والمخططة</p>
          </div>
          <button onClick={() => setShowSettings(!showSettings)} className={`btn text-xs ${showSettings ? 'btn-primary' : 'btn-secondary'}`}><Sliders size={12} /> إعدادات</button>
        </div>

        {showSettings && (
          <div className="mt-3 pt-3 space-y-3 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            <label className="flex items-center gap-3 p-2.5 rounded-lg cursor-pointer" style={{ background: 'var(--bg-muted)' }}>
              <input type="checkbox" checked={includePending} onChange={e => setIncludePending(e.target.checked)} className="w-4 h-4 accent-[color:var(--accent)]" />
              <div className="flex-1">
                <p className="text-xs font-black">اعتبر المعلقات كمدفوعات</p>
                <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>لو معطّل، التوقع يستثني المعلقات ويستخدم الخطة فقط</p>
              </div>
            </label>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>مبلغ سداد البطاقة الشهري</label>
                <input type="text" inputMode="decimal" className="input-field input-num text-sm text-center font-bold" value={cardPaymentOverride} onChange={e => setCardPaymentOverride(e.target.value)} placeholder={`تلقائي: ${fmt(autoAverages.payment)}`} />
                <p className="text-[9px] mt-1" style={{ color: 'var(--text-muted)' }}>فاضي = تلقائي من آخر 3 شهور</p>
              </div>
              <div>
                <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>متوسط مشتريات البطاقة</label>
                <input type="text" inputMode="decimal" className="input-field input-num text-sm text-center font-bold" value={cardSpendingOverride} onChange={e => setCardSpendingOverride(e.target.value)} placeholder={`تلقائي: ${fmt(autoAverages.spending)}`} />
                <p className="text-[9px] mt-1" style={{ color: 'var(--text-muted)' }}>فاضي = تلقائي من آخر 3 شهور</p>
              </div>
            </div>
          </div>
        )}
      </div>

      {alerts.length > 0 && alerts.map((a, i) => (
        <div key={i} className="card" style={{ background: a.type === 'danger' ? 'var(--danger-soft)' : 'var(--warning-soft)', borderColor: a.type === 'danger' ? 'var(--danger)' : 'var(--warning)' }}>
          <p className={`text-xs font-black ${a.type === 'danger' ? 'text-red-700 dark:text-red-400' : 'text-amber-700 dark:text-amber-400'}`}>{a.title}</p>
          <p className="text-[11px] mt-1" style={{ color: 'var(--text-secondary)' }}>{a.message}</p>
        </div>
      ))}

      <div className="grid grid-cols-3 gap-2">
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>السيولة الآن</p>
          <p className="text-base font-black text-emerald-600 money tabular">{fmtShort(currentLiquidity)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>المديونية الآن</p>
          <p className="text-base font-black text-red-600 money tabular">{fmtShort(currentCardDebt + currentLoanDebt)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>صافي المركز</p>
          <p className={`text-base font-black money tabular ${currentLiquidity - currentCardDebt - currentLoanDebt >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmtShort(currentLiquidity - currentCardDebt - currentLoanDebt)}</p>
        </div>
      </div>

      <div className="card">
        <h3 className="font-bold text-xs mb-3" style={{ color: 'var(--text-secondary)' }}>📈 تطور السيولة والمديونية — 6 شهور</h3>
        <div className="h-72">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={chartData}>
              <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.06} />
              <XAxis dataKey="name" fontSize={10} stroke="#94A3B8" />
              <YAxis fontSize={10} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
              <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '12px', border: '1px solid var(--border-subtle)', fontFamily: 'Cairo', fontSize: '12px' }} />
              <Legend wrapperStyle={{ fontSize: '11px', fontWeight: 'bold' }} />
              <Bar dataKey="السيولة" fill="#00A86B" radius={[4, 4, 0, 0]} barSize={18} />
              <Bar dataKey="المديونية" fill="#DC2626" radius={[4, 4, 0, 0]} barSize={18} />
              <Bar dataKey="صافي المركز" fill="#635BFF" radius={[4, 4, 0, 0]} barSize={18} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="space-y-3">
        <h3 className="font-black text-sm">📋 التفاصيل الشهرية</h3>
        {forecast.map((f, i) => (
          <div key={i} className="card">
            <div className="flex justify-between items-center mb-3 flex-wrap gap-2">
              <h4 className="font-black text-sm flex items-center gap-1.5">
                {f.month} {f.year}
                {f.isCurrent && <span className="badge badge-accent text-[9px]">الحالي</span>}
              </h4>
              <div className="flex gap-1.5 flex-wrap">
                {f.pendingCount > 0 && <span className="badge badge-warning text-[9px]">⏳ {f.pendingCount} معلق</span>}
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2 mb-3">
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                <p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>💰 الدخل</p>
                <p className="text-sm font-black text-emerald-600 money tabular">{fmt(f.income)}</p>
              </div>
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                <p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>💸 مصروفات نقدية</p>
                <p className="text-sm font-black text-red-600 money tabular">{fmt(f.cashExpenses)}</p>
              </div>
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                <p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>💳 مشتريات البطاقة</p>
                <p className="text-sm font-black text-amber-600 money tabular">{fmt(f.cardSpending)}</p>
              </div>
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                <p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>💵 سداد البطاقة</p>
                <p className="text-sm font-black text-blue-600 money tabular">{fmt(f.cardPayment)}</p>
              </div>
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                <p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>🏦 أقساط القروض</p>
                <p className="text-sm font-black text-orange-600 money tabular">{fmt(f.loanInstallments)}</p>
              </div>
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                <p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>📊 معادلة البطاقة</p>
                <p className="text-[10px] font-bold money tabular" style={{ color: 'var(--text-secondary)', direction: 'rtl' }}>
                  {fmtShort(f.startCardDebt)} ← {fmtShort(f.cardPayment)} ← {fmtShort(f.cardSpending)}
                </p>
              </div>
            </div>
            <div className="pt-3 space-y-1.5" style={{ borderTop: '1px dashed var(--border-default)' }}>
              <div className="flex justify-between items-center">
                <span className="text-[11px] font-bold" style={{ color: 'var(--text-secondary)' }}>سيولة نهاية الشهر</span>
                <span className={`font-black text-sm money tabular ${f.endLiquidity >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(f.endLiquidity)}</span>
              </div>
              <div className="flex justify-between items-center">
                <span className="text-[11px] font-bold" style={{ color: 'var(--text-secondary)' }}>مديونية البطاقات</span>
                <span className="font-black text-sm text-red-600 money tabular">{fmt(f.endCardDebt)}</span>
              </div>
              <div className="flex justify-between items-center">
                <span className="text-[11px] font-bold" style={{ color: 'var(--text-secondary)' }}>مديونية القروض</span>
                <span className="font-black text-sm text-red-600 money tabular">{fmt(f.endLoanDebt)}</span>
              </div>
              <div className="flex justify-between items-center pt-1.5" style={{ borderTop: '1px solid var(--border-subtle)' }}>
                <span className="text-[11px] font-black" style={{ color: 'var(--text-primary)' }}>صافي المركز</span>
                <span className={`font-black text-base money tabular ${f.netPosition >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(f.netPosition)}</span>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
});

const MonthComparisonView = memo(({ transactions, selectedYear, selectedMonth }) => {
  const [compareMonthIdx, setCompareMonthIdx] = useState(() => Math.max(0, getMonthIndex(selectedMonth) - 1));
  const curMonthIdx = getMonthIndex(selectedMonth);
  const compareMonth = ALL_MONTHS[compareMonthIdx];

  const stats = useMemo(() => {
    const calc = (m, y) => {
      const txs = transactions.filter(t => t.month === m && (t.year || 2026) === y && t.status === 'paid');
      const income = txs.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
      const expense = txs.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
      const byCategory = {};
      txs.filter(t => t.type === 'expense').forEach(t => { byCategory[t.category] = (byCategory[t.category] || 0) + safeNumber(t.amount); });
      return { income, expense, net: income - expense, count: txs.length, byCategory };
    };
    return { current: calc(selectedMonth, selectedYear), previous: calc(compareMonth, selectedYear) };
  }, [transactions, selectedMonth, selectedYear, compareMonth]);

  const allCategories = useMemo(() => {
    const set = new Set([...Object.keys(stats.current.byCategory), ...Object.keys(stats.previous.byCategory)]);
    return Array.from(set).sort();
  }, [stats]);

  const pctChange = (cur, prev) => {
    if (prev === 0) return cur > 0 ? 100 : 0;
    return ((cur - prev) / prev) * 100;
  };

  const chartData = [
    { name: 'دخل', [selectedMonth]: stats.current.income, [compareMonth]: stats.previous.income },
    { name: 'مصروف', [selectedMonth]: stats.current.expense, [compareMonth]: stats.previous.expense },
    { name: 'صافي', [selectedMonth]: stats.current.net, [compareMonth]: stats.previous.net }
  ];

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">

const CalendarView = memo(({ data, getAgendaItems, dispatch, saveHistory, addNotification }) => {

  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [selectedDayDetails, setSelectedDayDetails] = useState(null);

  const agendaItems = useMemo(() => getAgendaItems(viewYear, ALL_MONTHS[viewMonth]), [getAgendaItems, viewYear, viewMonth]);

  const itemsByDay = useMemo(() => {
    const map = {};

      const d = parseISODate(item.date);
      if (!d) return;
      if (d.getFullYear() !== viewYear || d.getMonth() !== viewMonth) return;
      const day = d.getDate();
      if (!map[day]) map[day] = [];
      map[day].push(item);
    });
    return map;

                <span className={`text-[11px] font-black ${isToday(day) ? 'text-[color:var(--accent)]' : ''}`}>{day}</span>

                  <React.Fragment>

      <div className="card">

                return (

});
const DuplicateDetectionSystem = ({ transactions, data, dispatch, addNotification, saveHistory, onBulkDelete }) => {
  const [threshold, setThreshold] = useState(2);
  const [selectedMonth, setSelectedMonth] = useState('all');
  const [expandedGroups, setExpandedGroups] = useState({});

  const duplicates = useMemo(() => {
    const map = {};
    const filtered = selectedMonth === 'all' ? transactions : transactions.filter(t => {
      const parsed = parseMonthKey(selectedMonth);
      if (!parsed) return t.month === selectedMonth;
      return t.month === parsed.month && (t.year || 2026) === parsed.year;
    });
    filtered.forEach(t => {
      const key = `${safeNumber(t.amount)}_${t.method}_${t.category}_${(t.date || '').slice(0, 10)}`;
      if (!map[key]) map[key] = [];
      map[key].push(t);
    });
    return Object.entries(map)
      .filter(([_, items]) => items.length >= threshold)
      .map(([key, items]) => {
        const sortedItems = [...items].sort(compareTransactions);
        return {
          key,
          amount: items[0].amount,
          count: items.length,
          items: sortedItems,
          category: items[0].category,
          risk: items.length >= 5 ? 'high' : items.length >= 3 ? 'medium' : 'low'
        };
      });
  }, [transactions, threshold, selectedMonth]);

  const doDelete = (ids) => {
    if (!onBulkDelete) {
      addNotification({ type: 'error', title: 'خطأ: handler الحذف مفقود' });
      return;
    }
    if (!Array.isArray(ids) || ids.length === 0) return;
    dispatch({
      type: 'SHOW_CONFIRM',
      danger: true,
      title: 'تأكيد الحذف',
      message: `سيتم نقل ${ids.length} عملية للأرشيف مع إمكانية الاسترجاع من صفحة المحذوفات.`,
      onConfirm: () => onBulkDelete(ids),
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const handleDeleteAll = () => {
    let idsToDelete = [];
    duplicates.forEach(d => {
      d.items.slice(1).forEach(item => {
        if (!isMonthClosed(data, item.year || 2026, item.month)) idsToDelete.push(item.id);
      });
    });
    if (idsToDelete.length === 0) {
      addNotification({ type: 'info', title: 'لا يوجد' });
      return;
    }
    doDelete(idsToDelete);
  };

  const deleteSingle = (item) => {
    if (isMonthClosed(data, item.year || 2026, item.month)) {
      addNotification({ type: 'error', title: 'محظور', message: 'الشهر مغلق' });
      return;
    }
    doDelete([item.id]);
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-20">
      <div className="card">
        <div className="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <h2 className="text-lg font-black flex items-center gap-2">
              <Filter className="text-[color:var(--accent)]" size={18} /> كاشف التكرار
            </h2>
            <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>
              {threshold}+ تكرار بنفس المبلغ والطريقة والتاريخ
            </p>
          </div>
          <button
            onClick={handleDeleteAll}
            disabled={duplicates.length === 0}
            className={`btn ${duplicates.length === 0 ? 'btn-secondary' : 'btn-primary'} text-xs`}
          >
            <Trash2 size={14} /> تنظيف
          </button>
        </div>
      </div>

      <div className="card grid grid-cols-2 gap-4">
        <div>
          <label className="block text-[11px] font-bold mb-2" style={{ color: 'var(--text-muted)' }}>نطاق البحث</label>
          <select className="input-field text-sm" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}>
            <option value="all">جميع الشهور</option>
            {YEARS_LIST.flatMap(y => getMonthsForYear(y).map(m => (
              <option key={makeMonthKey(y, m)} value={makeMonthKey(y, m)}>{m} {y}</option>
            )))}
          </select>
        </div>
        <div>
          <label className="block text-[11px] font-bold mb-2" style={{ color: 'var(--text-muted)' }}>
            الحساسية ({threshold})
          </label>
          <input
            type="range" min="2" max="10"
            className="w-full mt-3 accent-[color:var(--accent)]"
            value={threshold}
            onChange={e => setThreshold(Number(e.target.value))}
          />
        </div>
      </div>

      {duplicates.length === 0 ? (
        <div className="card text-center p-12">
          <CheckCircle2 size={40} className="text-emerald-500 mx-auto mb-3" />
          <h3 className="text-base font-black">ممتاز! لا توجد تكرارات</h3>
        </div>
      ) : (
        duplicates.map(dup => (
          <div key={dup.key} className="card">
            <div
              className="flex justify-between items-center cursor-pointer -m-[18px] p-[18px]"
              onClick={() => setExpandedGroups(p => ({ ...p, [dup.key]: !p[dup.key] }))}
            >
              <div className="flex items-center gap-3">
                <div className={`p-2 rounded-lg ${dup.risk === 'high' ? 'bg-red-50 text-red-500 dark:bg-red-950/30' : 'bg-amber-50 text-amber-500 dark:bg-amber-950/30'}`}>
                  <Repeat size={16} />
                </div>
                <div>
                  <h4 className="font-black text-sm money tabular">{fmt(dup.amount)} ج.م</h4>
                  <span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                    {dup.category} - {dup.count} مرات
                  </span>
                </div>
              </div>
              <ChevronDown
                className={`transition-transform ${expandedGroups[dup.key] ? 'rotate-180' : ''}`}
                style={{ color: 'var(--text-muted)' }}
                size={16}
              />
            </div>
            {expandedGroups[dup.key] && (
              <div className="mt-3 pt-3 space-y-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
                {dup.items.map((item, idx) => (
                  <div
                    key={item.id}
                    className="flex justify-between items-center p-2.5 rounded-lg"
                    style={{ background: 'var(--bg-muted)' }}
                  >
                    <div className="text-xs font-medium flex items-center gap-2 flex-wrap">
                      {item.date}
                      {item.createdAt && <TxTimeChip createdAt={item.createdAt} />}
                      • {item.description || 'بدون وصف'}
                      {idx === 0 && <span className="badge badge-success text-[9px]">الأحدث — محفوظ</span>}
                    </div>
                    {idx !== 0 && (
                      <button
                        onClick={() => deleteSingle(item)}
                        aria-label="حذف"
                        className="text-red-500 p-1.5 rounded-lg"
                      >
                        <Trash2 size={12} />
                      </button>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        ))
      )}
    </div>
  );
};

const DeletedArchiveView = memo(({ data, dispatch, saveHistory, addNotification, transactions }) => {
  const archive = data?.deletedTxArchive || [];
  const pendingRequests = useMemo(() => (data?.deleteRequests || []).filter(r => r && r.status === 'pending' && r.txSnapshot), [data?.deleteRequests]);
  const [tab, setTab] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');
  const [monthFilter, setMonthFilter] = useState('all');

  const filtered = useMemo(() => {
    let arr = archive;
    if (tab === 'mine') arr = arr.filter(t => !isFamilyTx(t) && t.deletedBy !== 'family');
    if (tab === 'family') arr = arr.filter(t => isFamilyTx(t) || t.deletedBy === 'family');
    if (monthFilter !== 'all') {
      const parsed = parseMonthKey(monthFilter);
      if (parsed) arr = arr.filter(t => t.month === parsed.month && (t.year || 2026) === parsed.year);
    }
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.category).includes(term));
    }
    return arr.slice().sort((a, b) => {
      const da = parseISODate(a.deletedAt) || parseISODate(a.date) || new Date(0);
      const db = parseISODate(b.deletedAt) || parseISODate(b.date) || new Date(0);
      return db - da;
    });
  }, [archive, tab, searchTerm, monthFilter]);

  const stats = useMemo(() => {
    const familyCount = archive.filter(t => isFamilyTx(t) || t.deletedBy === 'family').length;
    const mineCount = archive.length - familyCount;
    const total = archive.reduce((s, t) => s + safeNumber(t.amount), 0);
    const legacyCount = archive.filter(a => a._legacy).length;
    return { familyCount, mineCount, total, count: archive.length, legacyCount };
  }, [archive]);

  const approveDeleteRequest = (req) => {
    const tx = req.txSnapshot;
    if (!tx) return;
    saveHistory();
    const newArchive = [...(data.deletedTxArchive || []), { ...tx, deletedAt: new Date().toISOString(), deletedBy: req.requestedBy || 'family', originalStatus: tx.status || 'pending', reason: 'موافقة على طلب مسح' }].slice(-500);
    const newTx = (data.transactions || []).filter(t => t.id !== tx.id);
    const newDeletedIds = Array.from(new Set([...(data.deletedTxIds || []), tx.id])).slice(-500);
    const updatedRequests = (data.deleteRequests || []).map(r => r.id === req.id ? { ...r, status: 'approved', approvedAt: Date.now() } : r);
    const newMaterialized = { ...(data.materializedRecurring || {}) };
    if (tx.sourceRecurringId && tx.year && tx.month) newMaterialized[`${tx.sourceRecurringId}_${makeMonthKey(tx.year, tx.month)}`] = 'deleted';
    dispatch({
      type: 'SET_DATA',
      payload: { ...data, transactions: newTx, deletedTxArchive: newArchive, deletedTxIds: newDeletedIds, deleteRequests: updatedRequests, materializedRecurring: newMaterialized }
    });
    addNotification({ type: 'success', title: 'تمت الموافقة والحذف' });
  };

  const rejectDeleteRequest = (req) => {
    const updatedRequests = (data.deleteRequests || []).map(r => r.id === req.id ? { ...r, status: 'rejected', rejectedAt: Date.now() } : r);
    dispatch({ type: 'SET_DATA', payload: { ...data, deleteRequests: updatedRequests } });
    addNotification({ type: 'info', title: 'تم الرفض' });
  };

  const restoreOne = (tombstone) => {
    if (tombstone._legacy) { addNotification({ type: 'error', title: 'لا يمكن استرجاع هذه (بيانات ناقصة)' }); return; }
    const d = parseISODate(tombstone.date);
    const y = tombstone.year || (d ? d.getFullYear() : null);
    const m = tombstone.month || (d ? ALL_MONTHS[d.getMonth()] : null);
    if (!y || !m) { addNotification({ type: 'error', title: 'بيانات غير كاملة' }); return; }
    if (isMonthClosed(data, y, m)) { addNotification({ type: 'error', title: 'الشهر مغلق', message: `افتح شهر ${m} ${y} أولاً`, duration: 6000 }); return; }
    dispatch({
      type: 'SHOW_CONFIRM', danger: false,
      title: 'استرجاع المعاملة',
      message: `استرجاع "${tombstone.description || tombstone.category}" بمبلغ ${fmt(tombstone.amount)}`,
      onConfirm: () => {
        saveHistory();
        const { deletedAt, deletedBy, originalStatus, reason, _legacy, ...original } = tombstone;
        const restoredTx = { ...original, status: originalStatus || 'pending' };
        const newTx = sortTransactions([...transactions, restoredTx]);
        const newArchive = (data.deletedTxArchive || []).filter(a => a.id !== tombstone.id);
        const newDeletedIds = (data.deletedTxIds || []).filter(id => id !== tombstone.id);
        const newMaterialized = { ...(data.materializedRecurring || {}) };
        if (restoredTx.sourceRecurringId && restoredTx.year && restoredTx.month) {
          delete newMaterialized[`${restoredTx.sourceRecurringId}_${makeMonthKey(restoredTx.year, restoredTx.month)}`];
        }
        dispatch({
          type: 'SET_DATA',
          payload: { ...data, transactions: newTx, deletedTxArchive: newArchive, deletedTxIds: newDeletedIds, materializedRecurring: newMaterialized }
        });
        addNotification({ type: 'success', title: 'تم الاسترجاع بنجاح' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const permanentlyDelete = (id) => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'حذف نهائي', message: 'سيُحذف نهائياً ولن يمكن استرجاعه',
      onConfirm: () => {
        saveHistory();
        const newArchive = (data.deletedTxArchive || []).filter(a => a.id !== id);
        const newTx = (data.transactions || []).filter(t => t.id !== id);
        const newDeletedIds = Array.from(new Set([...(data.deletedTxIds || []), id])).slice(-500);
        dispatch({ type: 'SET_DATA', payload: { ...data, transactions: newTx, deletedTxArchive: newArchive, deletedTxIds: newDeletedIds } });
        addNotification({ type: 'success', title: 'تم الحذف نهائياً' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const clearArchive = () => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'تفريغ الأرشيف', message: `سيتم حذف ${archive.length} سجل نهائياً`,
      onConfirm: () => {
        saveHistory();
        dispatch({ type: 'SET_DATA', payload: { ...data, deletedTxArchive: [], deletedTxIds: [] } });
        addNotification({ type: 'success', title: 'تم التفريغ' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const clearLegacyOnly = () => {
    const legacyCount = archive.filter(t => t._legacy).length;
    if (legacyCount === 0) { addNotification({ type: 'info', title: 'مفيش سجلات قديمة' }); return; }
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: `تنظيف ${legacyCount} سجل قديم`,
      message: 'هيتم حذف السجلات القديمة بدون بيانات.\n\n✅ السجلات الحقيقية هتفضل محفوظة.',
      onConfirm: () => {
        saveHistory();
        const cleaned = archive.filter(t => !t._legacy);
        dispatch({ type: 'SET_DATA', payload: { ...data, deletedTxArchive: cleaned } });
        addNotification({ type: 'success', title: `تم مسح ${legacyCount} سجل قديم` });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  return (
    <React.Fragment>
      {pendingRequests.length > 0 && (
        <div className="card" style={{ borderColor: 'var(--warning)' }}>
          <div className="flex items-center gap-3 mb-3">
            <div className="p-2 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-amber-600 dark:text-amber-400"><Clock size={16} /></div>
            <div>
              <h3 className="font-black text-sm">📥 طلبات مسح من تطبيق العيلة</h3>
              <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{pendingRequests.length} طلب بانتظار مراجعتك</p>
            </div>
          </div>
          <div className="space-y-2">
            {pendingRequests.map(req => {
              const tx = req.txSnapshot;
              return (
                <div key={req.id} className="p-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className="flex justify-between items-start gap-2 mb-2 flex-wrap">
                    <div className="min-w-0 flex-1">
                      <p className="font-bold text-xs truncate">💸 {tx.description || tx.category || 'بدون وصف'}</p>
                      <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}><span className="money tabular">{tx.amount}</span> ج.م • {tx.date}</p>
                      <p className="text-[10px] mt-1 text-amber-700 dark:text-amber-400">
                        👤 من: <strong>{req.requestedByName || 'فاميلي'}</strong>
                        {req.reason && ` • 📝 ${req.reason}`}
                      </p>
                    </div>
                    <span className="font-black text-sm text-red-600 flex-shrink-0 money tabular">{fmt(tx.amount)}</span>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => approveDeleteRequest(req)} className="btn btn-primary text-[11px] flex-1 py-1.5"><CheckCircle2 size={12} /> موافقة وحذف</button>
                    <button onClick={() => rejectDeleteRequest(req)} className="btn btn-secondary text-[11px] flex-1 py-1.5 text-red-600"><X size={12} /> رفض</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="space-y-4 animate-fadeIn pb-24">
        <div className="card">
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div className="flex items-center gap-3">
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-red-600 dark:text-red-400"><Trash2 size={16} /></div>
              <div>
                <h2 className="text-base font-black">سجل المحذوفات</h2>
                <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>أرشيف كامل مع إمكانية الاسترجاع</p>
              </div>
            </div>
            {archive.length > 0 && (
              <div className="flex gap-1.5 flex-wrap">
                {archive.some(t => t._legacy) && (
                  <button onClick={clearLegacyOnly} className="btn btn-secondary text-xs" style={{ color: 'var(--warning)' }}>
                    <RotateCcw size={12} /> نظّف القديمة ({archive.filter(t => t._legacy).length})
                  </button>
                )}
                <button onClick={clearArchive} className="btn btn-secondary text-xs text-red-600"><Trash2 size={12} /> تفريغ الكل</button>
              </div>
            )}
          </div>
        </div>

        <div className="grid grid-cols-4 gap-2">
          <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الإجمالي</p><p className="text-base font-black text-slate-600 dark:text-slate-300 money tabular">{stats.count}</p></div>
          <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>👤 محذوفاتي</p><p className="text-base font-black text-blue-600 money tabular">{stats.mineCount}</p></div>
          <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>🛒 Family</p><p className="text-base font-black text-purple-600 money tabular">{stats.familyCount}</p></div>
          <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الإجمالي (ج.م)</p><p className="text-base font-black text-red-600 money tabular">{fmt(stats.total)}</p></div>

        {stats.legacyCount > 0 && (
          <div className="card p-3" style={{ background: 'var(--warning-soft)', borderColor: 'var(--warning)' }}>
            <p className="text-[11px] font-bold text-amber-700 dark:text-amber-400">⚠️ {stats.legacyCount} سجل قديم بدون بيانات كاملة — للعرض فقط</p>

          <button onClick={() => setTab('family')} className={`sub-tab-btn ${tab === 'family' ? 'active' : ''}`}>🛒 Family ({stats.familyCount})</button>

                      <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>{tombstone.category || '—'} • {tombstone.date || '—'}</p>
                      <p className="text-[10px] font-semibold mt-0.5 text-red-500">

                        {tombstone.deletedBy && ` بواسطة ${tombstone.deletedBy === 'self' ? 'أنت' : tombstone.deletedBy}`}

                      <button onClick={() => permanentlyDelete(tombstone.id)} className="btn btn-ghost text-[10px] py-1 px-2 text-red-500"><Trash2 size={10} /> حذف نهائي</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </React.Fragment>
  );
});

const AuditLogView = memo(({ data, dispatch }) => {

  const [searchTerm, setSearchTerm] = useState('');

  const log = useMemo(() => data?.auditLog || [], [data?.auditLog]);

  const filtered = useMemo(() => {
    let arr = log;
    if (filterAction !== 'all') arr = arr.filter(e => e.action === filterAction);
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(e => normalizeText(e.entity).includes(term) || normalizeText(e.note).includes(term) || String(e.entityId).includes(searchTerm));
    }
    return arr;
  }, [log, filterAction, searchTerm]);

  const stats = useMemo(() => {
    const byAction = {};

  }, [log]);

  const clearLog = () => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'تفريغ سجل التدقيق',
      message: `سيتم مسح ${log.length} سجل تدقيق`,
      onConfirm: () => { dispatch({ type: 'SET_DATA', payload: { ...data, auditLog: [] } }); },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div className="flex items-center gap-3">

            <div>
              <h2 className="text-base font-black">سجل التدقيق المحاسبي</h2>
              <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{log.length} عملية مسجلة • كل تعديل محفوظ</p>

        </div>
