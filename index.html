                </div>
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
};

const MonthComparisonView = memo(({ transactions, selectedYear, selectedMonth }) => {
  const idx = getMonthIndex(selectedMonth);
  const prevMonth = idx > 0 ? ALL_MONTHS[idx - 1] : 'ديسمبر';
  const prevYear = idx > 0 ? selectedYear : selectedYear - 1;
  const curTx = transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
  const prevTx = transactions.filter(t => t.month === prevMonth && (t.year || 2026) === prevYear);
  const calc = (txs, type) => txs.filter(t => t.type === type && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
  const curInc = calc(curTx, 'income'), curExp = calc(curTx, 'expense');
  const prevInc = calc(prevTx, 'income'), prevExp = calc(prevTx, 'expense');
  const pct = (cur, prev) => prev === 0 ? (cur > 0 ? 100 : 0) : Math.round(((cur - prev) / prev) * 100);
  const catData = {};
  curTx.filter(t => t.status === 'paid').forEach(t => { if (!catData[t.category]) catData[t.category] = { cur: 0, prev: 0, type: t.type }; catData[t.category].cur += safeNumber(t.amount); });
  prevTx.filter(t => t.status === 'paid').forEach(t => { if (!catData[t.category]) catData[t.category] = { cur: 0, prev: 0, type: t.type }; catData[t.category].prev += safeNumber(t.amount); });
  const catRows = Object.entries(catData).map(([cat, d]) => ({ cat, cur: d.cur, prev: d.prev, change: pct(d.cur, d.prev), type: d.type })).sort((a, b) => Math.abs(b.cur - b.prev) - Math.abs(a.cur - a.prev));
  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <h2 className="text-lg font-black flex items-center gap-2"><Activity className="text-indigo-500" size={18} /> مقارنة الشهور</h2>
        <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} مقارنة بـ {prevMonth} {prevYear}</p>
      </div>
      <div className="grid grid-cols-3 gap-3">
        <div className="card py-3"><p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الدخل</p><p className="text-lg font-black text-emerald-600">{fmt(curInc)}</p><span className={`badge mt-1.5 ${curInc >= prevInc ? 'badge-success' : 'badge-danger'} text-[10px]`}>{curInc >= prevInc ? '↑' : '↓'} {Math.abs(pct(curInc, prevInc))}%</span></div>
        <div className="card py-3"><p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>المصروفات</p><p className="text-lg font-black text-red-600">{fmt(curExp)}</p><span className={`badge mt-1.5 ${curExp <= prevExp ? 'badge-success' : 'badge-danger'} text-[10px]`}>{curExp <= prevExp ? '↓' : '↑'} {Math.abs(pct(curExp, prevExp))}%</span></div>
        <div className="card py-3"><p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الصافي</p><p className={`text-lg font-black ${curInc - curExp >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(curInc - curExp)}</p></div>
      </div>
      <div className="card overflow-hidden p-0">
        <div className="p-4"><h3 className="font-black text-sm mb-3">تفاصيل الفئات</h3></div>
        <div className="overflow-x-auto">
          <table className="w-full text-right text-sm">
            <thead style={{ background: 'var(--bg-muted)' }}><tr>
              <th className="p-2.5 font-bold text-[11px]" style={{ color: 'var(--text-muted)' }}>الفئة</th>
              <th className="p-2.5 font-bold text-[11px] text-left" style={{ color: 'var(--text-muted)' }}>الحالي</th>
              <th className="p-2.5 font-bold text-[11px] text-center" style={{ color: 'var(--text-muted)' }}>التغيير</th>
            </tr></thead>
            <tbody>
              {catRows.length === 0 ? (<tr><td colSpan="3" className="p-6 text-center font-medium text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد بيانات</td></tr>) : catRows.slice(0, 15).map((row, i) => (
                <tr key={i} style={{ borderTop: '1px solid var(--border-subtle)' }}>
                  <td className="p-2.5 font-bold text-xs">{row.cat}</td>
                  <td className="p-2.5 text-left font-black text-xs">{fmt(row.cur)}</td>
                  <td className="p-2.5 text-center"><span className={`badge ${row.change > 0 ? 'badge-danger' : row.change < 0 ? 'badge-success' : 'badge-neutral'} text-[10px]`}>{row.change > 0 ? '↑' : row.change < 0 ? '↓' : '—'} {Math.abs(row.change)}%</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
});
  /* ═══════════════════════════════════════════════════════════════
   PART 6 — Planning + Forecast + Calendar + Settings
            + dataReducer + App + Render Root
   ═══════════════════════════════════════════════════════════════ */

// ── MonthlyPlanningView — بدون تغييرات جوهرية (فقط parseISODate داخلياً في derive) ──
const MonthlyPlanningView = memo(({ data, monthlyPlans, cards, loans, dispatch, saveHistory, addNotification }) => {
  const planningMonths = useMemo(() => {
    const now = new Date();
    const result = [];
    let y = now.getFullYear(), mi = now.getMonth();
    for (let i = 0; i < 6; i++) { result.push({ month: ALL_MONTHS[mi], year: y }); mi++; if (mi > 11) { mi = 0; y++; } }
    return result;
  }, []);
  const pk = useCallback((m) => makeMonthKey(m.year, m.month), []);
  const [localPlans, setLocalPlans] = useState(() => JSON.parse(JSON.stringify(monthlyPlans || {})));
  const [hasChanges, setHasChanges] = useState(false);
  const [derivedFlags, setDerivedFlags] = useState({});
  const [showSources, setShowSources] = useState(false);

  useEffect(() => {
    const base = JSON.parse(JSON.stringify(monthlyPlans || {}));
    let derivedCount = 0;
    const newFlags = {};
    planningMonths.forEach(m => {
      const key = pk(m);
      if (base[key]?._userEdited) return;
      const derived = deriveMonthlyPlanFromHistory(data, m.year, m.month, 3);
      if (derived) {
        base[key] = { ...(base[key] || {}), ...derived };
        ['expectedSalary','expectedRent','expectedCashback','expectedEmakWE','expectedZakat','expectedCash','expectedCashExpenses','plannedPayments'].forEach(f => { newFlags[`${key}-${f}`] = true; });
        derivedCount++;
      }
    });
    setLocalPlans(base);
    setDerivedFlags(newFlags);
    if (derivedCount > 0) setHasChanges(true);
  }, [data.transactions?.length, data.loans?.length, monthlyPlans]);

  const handlePlanChange = (m, field, value) => {
    setLocalPlans(prev => ({ ...prev, [pk(m)]: { ...(prev[pk(m)] || {}), [field]: value, _userEdited: true } }));
    setDerivedFlags(prev => ({ ...prev, [`${pk(m)}-${field}`]: false }));
    setHasChanges(true);
  };

  const resetOneMonth = (m) => {
    setLocalPlans(prev => { const next = { ...prev }; if (next[pk(m)]) { const copy = { ...next[pk(m)] }; delete copy._userEdited; next[pk(m)] = copy; } return next; });
    setHasChanges(true);
    addNotification({ type: 'info', title: `تم إعادة تعيين ${m.month}`, message: 'سيُعاد الاستمداد تلقائياً' });
  };

  const clearOneMonth = (m) => { setLocalPlans(prev => { const next = { ...prev }; next[pk(m)] = { _userEdited: false }; return next; }); setHasChanges(true); };

  const deriveOneMonth = (m) => {
    const derived = deriveMonthlyPlanFromHistory(data, m.year, m.month, 3);
    if (!derived) { addNotification({ type: 'warning', title: 'لا توجد بيانات كافية' }); return; }
    setLocalPlans(prev => ({ ...prev, [pk(m)]: { ...(prev[pk(m)] || {}), ...derived, _userEdited: false } }));
    const newFlags = {};
    ['expectedSalary','expectedRent','expectedCashback','expectedEmakWE','expectedZakat','expectedCash','expectedCashExpenses','plannedPayments'].forEach(f => { newFlags[`${pk(m)}-${f}`] = true; });
    setDerivedFlags(prev => ({ ...prev, ...newFlags }));
    setHasChanges(true);
    addNotification({ type: 'success', title: `تم استمداد ${m.month} ${m.year}`, message: `من: ${derived._meta.refMonths}`, duration: 5000 });
  };

  const deriveAllMonths = () => {
    const newPlans = { ...localPlans };
    const newFlags = { ...derivedFlags };
    let successCount = 0;
    planningMonths.forEach(m => {
      const derived = deriveMonthlyPlanFromHistory(data, m.year, m.month, 3);
      if (derived) {
        newPlans[pk(m)] = { ...(newPlans[pk(m)] || {}), ...derived, _userEdited: false };
        ['expectedSalary','expectedRent','expectedCashback','expectedEmakWE','expectedZakat','expectedCash','expectedCashExpenses','plannedPayments'].forEach(f => { newFlags[`${pk(m)}-${f}`] = true; });
        successCount++;
      }
    });
    setLocalPlans(newPlans); setDerivedFlags(newFlags); setHasChanges(true);
    addNotification({ type: 'success', title: `تم استمداد ${successCount} شهر` });
  };

  const handleSave = () => {
    saveHistory();
    const cleaned = {};
    Object.entries(localPlans).forEach(([k, p]) => {
      if (!parseMonthKey(k)) return;
      cleaned[k] = { expectedSalary: safeNumber(p.expectedSalary), expectedRent: safeNumber(p.expectedRent), expectedCashback: safeNumber(p.expectedCashback), expectedEmakWE: safeNumber(p.expectedEmakWE), expectedZakat: safeNumber(p.expectedZakat), expectedCash: safeNumber(p.expectedCash), expectedCashExpenses: safeNumber(p.expectedCashExpenses), plannedPayments: safeNumber(p.plannedPayments), notes: p.notes || '', _userEdited: p._userEdited || false };
    });
    dispatch({ type: 'UPDATE_MONTHLY_PLANS', payload: cleaned });
    addNotification({ type: 'success', title: 'تم الحفظ' });
    setHasChanges(false);
  };

  const computed = useMemo(() => {
    const r = {};
    planningMonths.forEach(m => {
      const p = localPlans[pk(m)] || {};
      const inc = safeNumber(p.expectedSalary) + safeNumber(p.expectedRent) + safeNumber(p.expectedCashback) + safeNumber(p.expectedEmakWE) + safeNumber(p.expectedZakat) + safeNumber(p.expectedCash);
      const out = safeNumber(p.expectedCashExpenses) + safeNumber(p.plannedPayments);
      r[pk(m)] = { inc, out, net: inc - out };
    });
    return r;
  }, [localPlans, planningMonths, pk]);

  const totalInc = planningMonths.reduce((s, m) => s + (computed[pk(m)]?.inc || 0), 0);
  const totalOut = planningMonths.reduce((s, m) => s + (computed[pk(m)]?.out || 0), 0);
  const totalNet = totalInc - totalOut;

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card flex justify-between items-center flex-wrap gap-3">
        <div className="flex items-center gap-3">
          <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400"><Table size={16} /></div>
          <div><h2 className="text-base font-black">التخطيط الشهري</h2><p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{planningMonths.length} شهور • استمداد تلقائي من السجل</p></div>
        </div>
        <div className="flex gap-1.5 flex-wrap">
          <button onClick={() => setShowSources(!showSources)} className={`btn text-xs ${showSources ? 'btn-primary' : 'btn-secondary'}`}><Eye size={12} /> المصادر</button>
          <button onClick={deriveAllMonths} className="btn btn-secondary text-xs"><Sparkles size={12} /> استمد الكل</button>
          {hasChanges && <button onClick={handleSave} className="btn btn-primary text-xs"><Save size={14} /> حفظ</button>}
        </div>
      </div>

      {showSources && (
        <div className="card py-3 animate-fadeIn" style={{ background: 'var(--bg-muted)' }}>
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-secondary)' }}>💡 كيف تُحسب القيم:</p>
          <ul className="text-[10px] space-y-0.5" style={{ color: 'var(--text-muted)' }}>
            <li>• <strong>راتب/إيجار/كاش باك/عهدة/زكاة</strong>: متوسط 3 شهور سابقة (paid + pending)</li>
            <li>• <strong>نقدي</strong>: متوسط دخل خارج الفئات المعروفة (دخل حر)</li>
            <li>• <strong>مصروف نقدي</strong>: متوسط مصروفات Cash لآخر 3 شهور</li>
            <li>• <strong>مدفوعات</strong>: مجموع أقساط القروض النشطة</li>
            <li>• <strong>ملاحظة</strong>: لا يُحتسب أي شهر قبل أغسطس 2026</li>
          </ul>
        </div>
      )}

      <div className="grid grid-cols-3 gap-2">
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>دخل متوقع</p><p className="text-sm font-black text-blue-600 mt-1">{fmt(totalInc)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>مصروف متوقع</p><p className="text-sm font-black text-red-600 mt-1">{fmt(totalOut)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>صافي</p><p className={`text-sm font-black mt-1 ${totalNet >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(totalNet)}</p></div>
      </div>

      <div className="card p-0 overflow-hidden">
        <div className="p-4 flex items-center justify-between" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
          <h3 className="font-black text-sm">الجدول</h3>
          <div className="flex items-center gap-2 text-[10px]" style={{ color: 'var(--text-muted)' }}>
            <span className="flex items-center gap-1"><Sparkles size={10} className="text-blue-500" /> = مستمد</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-sm bg-orange-200"></span> = معدّل يدوياً</span>
          </div>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm border-collapse min-w-[700px]">
            <thead>
              <tr>
                <th className="planning-cell-header sticky right-0 z-10 min-w-[140px] text-[11px]" style={{ background: 'var(--bg-muted)' }}>البند</th>
                {planningMonths.map(m => (
                  <th key={pk(m)} className="planning-cell-header min-w-[110px] text-[10px]">
                    <div className="flex flex-col items-center gap-1">
                      <div>{m.month}</div><div className="text-[9px]" style={{ color: 'var(--text-muted)' }}>{m.year}</div>
                      <div className="flex gap-0.5">
                        <button type="button" onClick={() => deriveOneMonth(m)} title="استمد" className="text-[8px] font-bold text-blue-600 flex items-center gap-0.5 hover:underline"><Sparkles size={8} /></button>
                        <button type="button" onClick={() => resetOneMonth(m)} title="إعادة تعيين" className="text-[8px] font-bold text-amber-600 flex items-center gap-0.5 hover:underline"><RotateCcw size={8} /></button>
                        <button type="button" onClick={() => clearOneMonth(m)} title="تفريغ" className="text-[8px] font-bold text-red-600 flex items-center gap-0.5 hover:underline"><Trash2 size={8} /></button>
                      </div>
                    </div>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[{ key: 'expectedSalary', label: 'راتب' },{ key: 'expectedRent', label: 'إيجار' },{ key: 'expectedCashback', label: 'كاش باك' },{ key: 'expectedEmakWE', label: 'عهدة' },{ key: 'expectedZakat', label: 'زكاة' },{ key: 'expectedCash', label: 'نقدي (دخل حر)' }].map(row => (
                <tr key={row.key}>
                  <td className="planning-cell sticky right-0 z-10 text-right font-bold text-[11px]" style={{ background: 'var(--bg-card)' }}>{row.label}</td>
                  {planningMonths.map(m => {
                    const isDerived = derivedFlags[`${pk(m)}-${row.key}`];
                    const isUserEdited = localPlans[pk(m)]?._userEdited;
                    return (
                      <td key={row.key + pk(m)} className="planning-cell relative">
                        {isDerived && <span className="absolute top-0.5 right-0.5"><Sparkles size={8} className="text-blue-500" /></span>}
                        <input type="text" inputMode="decimal" className={`planning-input text-[11px] ${isUserEdited ? 'user-edited' : ''}`} value={localPlans[pk(m)]?.[row.key] ?? ''} onChange={e => handlePlanChange(m, row.key, e.target.value)} />
                      </td>
                    );
                  })}
                </tr>
              ))}
              <tr className="bg-emerald-50 dark:bg-emerald-950/30">
                <td className="planning-cell sticky right-0 z-10 font-black text-emerald-700 dark:text-emerald-400 text-[11px]" style={{ background: 'var(--bg-card)' }}>إجمالي دخل</td>
                {planningMonths.map(m => <td key={'i' + pk(m)} className="planning-cell font-black text-emerald-700 dark:text-emerald-400 text-[11px]">{fmt(computed[pk(m)]?.inc)}</td>)}
              </tr>
              <tr>
                <td className="planning-cell sticky right-0 z-10 font-bold text-[11px]" style={{ background: 'var(--bg-card)' }}>مصروف نقدي</td>
                {planningMonths.map(m => {
                  const isDerived = derivedFlags[`${pk(m)}-expectedCashExpenses`];
                  const isUserEdited = localPlans[pk(m)]?._userEdited;
                  return (
                    <td key={'ce' + pk(m)} className="planning-cell relative">
                      {isDerived && <span className="absolute top-0.5 right-0.5"><Sparkles size={8} className="text-blue-500" /></span>}
                      <input type="text" inputMode="decimal" className={`planning-input text-[11px] ${isUserEdited ? 'user-edited' : ''}`} value={localPlans[pk(m)]?.expectedCashExpenses ?? ''} onChange={e => handlePlanChange(m, 'expectedCashExpenses', e.target.value)} />
                    </td>
                  );
                })}
              </tr>
              <tr>
                <td className="planning-cell sticky right-0 z-10 font-bold text-[11px]" style={{ background: 'var(--bg-card)' }}>مدفوعات</td>
                {planningMonths.map(m => {
                  const isDerived = derivedFlags[`${pk(m)}-plannedPayments`];
                  const isUserEdited = localPlans[pk(m)]?._userEdited;
                  return (
                    <td key={'pp' + pk(m)} className="planning-cell relative">
                      {isDerived && <span className="absolute top-0.5 right-0.5"><Sparkles size={8} className="text-blue-500" /></span>}
                      <input type="text" inputMode="decimal" className={`planning-input text-[11px] ${isUserEdited ? 'user-edited' : ''}`} value={localPlans[pk(m)]?.plannedPayments ?? ''} onChange={e => handlePlanChange(m, 'plannedPayments', e.target.value)} />
                    </td>
                  );
                })}
              </tr>
              <tr className="bg-red-50 dark:bg-red-950/30">
                <td className="planning-cell sticky right-0 z-10 font-black text-red-700 dark:text-red-400 text-[11px]" style={{ background: 'var(--bg-card)' }}>إجمالي مصروف</td>
                {planningMonths.map(m => <td key={'o' + pk(m)} className="planning-cell font-black text-red-700 dark:text-red-400 text-[11px]">{fmt(computed[pk(m)]?.out)}</td>)}
              </tr>
              <tr className="bg-blue-50 dark:bg-blue-950/30">
                <td className="planning-cell sticky right-0 z-10 font-black text-[11px]" style={{ background: 'var(--bg-card)' }}>الصافي</td>
                {planningMonths.map(m => { const n = computed[pk(m)]?.net || 0; return <td key={'n' + pk(m)} className={`planning-cell font-black text-[11px] ${n >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{n >= 0 ? '+' : ''}{fmt(n)}</td>; })}
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
});

// ── PlannerView ──
const PlannerView = memo(({ updatedLoans, cards, selectedMonth, selectedYear, monthlyPlans, totalLiquidityNow, data, transactions = [], recurringItems = [] }) => {
  const projection = useMemo(() => {
    const seq = [];
    const now = new Date();
    let y = now.getFullYear(), mi = now.getMonth();
    for (let i = 0; i < 6; i++) { seq.push({ year: y, month: ALL_MONTHS[mi] }); mi++; if (mi > 11) { mi = 0; y++; } }
    let cumulative = totalLiquidityNow;
    const result = [];
    seq.forEach(({ year, month }) => {
      const plan = monthlyPlans?.[makeMonthKey(year, month)] || {};
      const planIncome = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent) + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE) + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedCash);
      const planExpenses = safeNumber(plan.expectedCashExpenses) + safeNumber(plan.plannedPayments);
      const monthTx = transactions.filter(t => t.month === month && (t.year || year) === year);
      const pendingManualIncome = monthTx.filter(t => t.type === 'income' && t.status !== 'paid' && !t.sourceRecurringId && !t.sourceReceivableId).reduce((s, t) => s + safeNumber(t.amount), 0);
      const pendingManualExpense = monthTx.filter(t => t.type === 'expense' && t.status !== 'paid' && !t.sourceRecurringId).reduce((s, t) => s + safeNumber(t.amount), 0);
      const monthPendingCount = monthTx.filter(t => t.status !== 'paid').length;
      const isFutureMonth = year > now.getFullYear() || (year === now.getFullYear() && getMonthIndex(month) > now.getMonth());
      let recurringPendingIncome = 0, recurringPendingExpense = 0;
      if (isFutureMonth) {
        const targetInputMonth = `${year}-${String(getMonthIndex(month) + 1).padStart(2, '0')}`;
        recurringItems.forEach(r => {
          if (r.active === false) return;
          if (r.startMonth && targetInputMonth < r.startMonth) return;
          if (r.endMonth && targetInputMonth > r.endMonth) return;
          if (r.type === 'income') recurringPendingIncome += safeNumber(r.amount);
          else recurringPendingExpense += safeNumber(r.amount);
        });
      }
      const inc = planIncome + pendingManualIncome + recurringPendingIncome;
      const out = planExpenses + pendingManualExpense + recurringPendingExpense;
      const opening = cumulative;
      const net = inc - out;
      cumulative = opening + net;
      result.push({ year, month, opening, inc, out, net, running: cumulative, danger: cumulative < 0, warn: cumulative < 5000 && cumulative >= 0, planIncome, planExpenses, pendingManualIncome, pendingManualExpense, recurringPendingIncome, recurringPendingExpense, monthPendingCount, hasPending: (pendingManualIncome + pendingManualExpense + recurringPendingIncome + recurringPendingExpense) > 0 });
    });
    return result;
  }, [totalLiquidityNow, monthlyPlans, transactions, recurringItems]);

  const maxAbsRunning = useMemo(() => Math.max(1, ...projection.map(p => Math.abs(p.running))), [projection]);
  const minPoint = useMemo(() => projection.reduce((min, p) => p.running < min.running ? p : min, projection[0] || { running: 0, month: '-' }), [projection]);
  const dangerMonths = projection.filter(p => p.danger).length;
  const totalInc = projection.reduce((s, p) => s + p.inc, 0);
  const totalOut = projection.reduce((s, p) => s + p.out, 0);
  const totalPendingIncome = projection.reduce((s, p) => s + p.pendingManualIncome + p.recurringPendingIncome, 0);
  const totalPendingExpense = projection.reduce((s, p) => s + p.pendingManualExpense + p.recurringPendingExpense, 0);

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <div><h2 className="text-base font-black flex items-center gap-2"><Target className="text-emerald-500" size={18} /> المخطط الاستراتيجي</h2><p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>محاكاة {projection.length} شهور — يشمل المعلقات والمتكررة</p></div>
          {dangerMonths > 0 && (<div className="badge badge-danger px-2.5 py-1.5 text-[10px] flex items-center gap-1"><AlertTriangle size={10} /> {dangerMonths} شهر عجز</div>)}
        </div>
      </div>
      {(totalPendingIncome > 0 || totalPendingExpense > 0) && (
        <div className="card p-3" style={{ background: 'var(--warning-soft)', borderColor: 'var(--warning)' }}>
          <div className="flex items-start gap-2">
            <Clock size={14} className="text-amber-600 flex-shrink-0 mt-0.5" />
            <div className="flex-1">
              <p className="text-xs font-bold text-amber-700 dark:text-amber-400">⏳ عمليات معلقة ومتكررة متوقعة ضمن المخطط</p>
              <div className="flex gap-3 text-[11px] mt-1.5 flex-wrap">
                {totalPendingIncome > 0 && <span className="text-emerald-700 dark:text-emerald-400 font-bold">+ {fmt(totalPendingIncome)} دخل متوقع</span>}
                {totalPendingExpense > 0 && <span className="text-red-700 dark:text-red-400 font-bold">− {fmt(totalPendingExpense)} مصروف متوقع</span>}
              </div>
            </div>
          </div>
        </div>
      )}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>السيولة الحالية</p><p className="text-base font-black text-blue-600">{fmt(totalLiquidityNow)}</p></div>
        <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>إجمالي دخل متوقع</p><p className="text-base font-black text-emerald-600">{fmt(totalInc)}</p></div>
        <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>إجمالي مصروف متوقع</p><p className="text-base font-black text-red-600">{fmt(totalOut)}</p></div>
        <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>أدنى سيولة</p><p className={`text-base font-black ${minPoint.running < 0 ? 'text-red-600' : 'text-amber-600'}`}>{fmt(minPoint.running)}</p><p className="text-[9px] mt-0.5" style={{ color: 'var(--text-muted)' }}>في {minPoint.month}</p></div>
      </div>
      <div className="card">
        <h3 className="font-black text-sm mb-4 flex items-center gap-2"><Activity className="text-blue-500" size={14} /> تدفق السيولة</h3>
        <div className="space-y-2.5">
          {projection.map((p, idx) => {
            const pct = Math.round((Math.abs(p.running) / maxAbsRunning) * 100);
            const isNeg = p.running < 0;
            return (
              <div key={idx}>
                <div className="flex justify-between items-center mb-1">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-black">{p.month}</span>
                    <span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{String(p.year).slice(2)}</span>
                    {p.hasPending && <span className="badge badge-warning text-[8px] px-1.5 py-0">⏳ معلق</span>}
                  </div>
                  <div className="flex items-center gap-2">
                    <span className={`text-xs font-black ${isNeg ? 'text-red-600' : p.warn ? 'text-amber-600' : 'text-emerald-600'}`}>{fmt(p.running)} ج.م</span>
                    {isNeg && <span className="badge badge-danger text-[9px] px-1.5 py-0">عجز</span>}
                    {p.warn && !isNeg && <span className="badge badge-warning text-[9px] px-1.5 py-0">انتباه</span>}
                  </div>
                </div>
                <div className="w-full rounded-full h-2 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                  <div className={`h-full rounded-full transition-all ${isNeg ? 'bg-red-500' : p.warn ? 'bg-amber-500' : 'bg-gradient-to-r from-emerald-400 to-emerald-600'}`} style={{ width: `${Math.max(2, pct)}%` }}></div>
                </div>
                <div className="flex justify-between text-[9px] mt-0.5 flex-wrap gap-1" style={{ color: 'var(--text-muted)' }}>
                  <span>+{fmt(p.inc)} / -{fmt(p.out)}</span><span>صافي: {p.net >= 0 ? '+' : ''}{fmt(p.net)}</span>
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div className="card p-0 overflow-hidden">
        <div className="p-4" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="font-black text-sm">التفاصيل الشهرية</h3></div>
        <div className="overflow-x-auto">
          <table className="w-full text-right text-xs">
            <thead style={{ background: 'var(--bg-muted)' }}>
              <tr>
                <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الشهر</th>
                <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>افتتاحي</th>
                <th className="p-2.5 text-[10px] font-bold text-emerald-600">دخل</th>
                <th className="p-2.5 text-[10px] font-bold text-red-600">مصروف</th>
                <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الصافي</th>
                <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الختامي</th>
                <th className="p-2.5 text-[10px] font-bold text-center" style={{ color: 'var(--text-muted)' }}>الحالة</th>
              </tr>
            </thead>
            <tbody>
              {projection.map(row => (
                <tr key={`${row.month}-${row.year}`} style={{ borderTop: '1px solid var(--border-subtle)' }}>
                  <td className="p-2.5 font-black text-[11px]">{row.month} {String(row.year).slice(2)}{row.hasPending && <span className="badge badge-warning text-[8px] mr-1">⏳</span>}</td>
                  <td className="p-2.5 text-[10px]" style={{ color: 'var(--text-muted)' }}>{fmt(row.opening)}</td>
                  <td className="p-2.5 text-[10px] text-emerald-600">+{fmt(row.inc)}</td>
                  <td className="p-2.5 text-[10px] text-red-600">-{fmt(row.out)}</td>
                  <td className={`p-2.5 text-[10px] font-black ${row.net >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{row.net >= 0 ? '+' : ''}{fmt(row.net)}</td>
                  <td className={`p-2.5 text-[11px] font-black ${row.danger ? 'text-red-600' : 'text-emerald-600'}`}>{fmt(row.running)}</td>
                  <td className="p-2.5 text-center">{row.danger ? <span className="badge badge-danger text-[10px]">عجز</span> : row.warn ? <span className="badge badge-warning text-[10px]">انتباه</span> : <span className="badge badge-success text-[10px]">مستقر</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      {dangerMonths > 0 && (
        <div className="card" style={{ borderColor: 'var(--danger)' }}>
          <div className="flex items-start gap-2">
            <AlertTriangle size={16} className="text-red-500 flex-shrink-0 mt-0.5" />
            <div><h4 className="font-black text-xs text-red-600 mb-1">⚠️ تنبيه: عجز متوقع</h4><p className="text-[11px] leading-relaxed" style={{ color: 'var(--text-secondary)' }}>فيه <strong>{dangerMonths} شهر</strong> متوقع فيهم عجز. أدنى نقطة: <strong>{fmt(minPoint.running)} ج.م</strong> في شهر <strong>{minPoint.month}</strong>.</p></div>
          </div>
        </div>
      )}
    </div>
  );
});

// ── LiquidityForecastView ──
const ForecastRow = ({ label, value, color, prefix }) => (
  <div className="flex justify-between items-center">
    <span className="text-xs font-semibold" style={{ color: 'var(--text-secondary)' }}>{label}</span>
    <span className={`text-sm font-black ${color}`}>{prefix || ''}{fmt(value)}</span>
  </div>
);

const LiquidityForecastView = memo(({ transactions, updatedLoans, recurringItems, liveBalances, selectedYear, selectedMonth, monthlyPlans }) => {
  const historical = useMemo(() => {
    const months = [];
    let y = selectedYear;
    let mi = getMonthIndex(selectedMonth);
    for (let i = 1; i <= 3; i++) {
      mi--; if (mi < 0) { mi = 11; y--; }
      if (y < PROJECT_START_YEAR || (y === PROJECT_START_YEAR && mi < getMonthIndex(PROJECT_START_MONTH))) break;
      months.push({ year: y, month: ALL_MONTHS[mi] });
    }
    const catData = {};
    let incomeTotal = 0, incomeMonths = 0;
    months.forEach(({ year, month }) => {
      let monthIncome = 0;
      transactions.filter(t => t.status === 'paid' && t.month === month && (t.year || 2026) === year).forEach(t => {
        const amt = safeNumber(t.amount);
        if (t.type === 'income') monthIncome += amt;
        else if (t.type === 'expense') { const c = t.category || 'أخرى'; if (!catData[c]) catData[c] = { total: 0, samples: 0 }; catData[c].total += amt; catData[c].samples++; }
      });
      if (monthIncome > 0) { incomeTotal += monthIncome; incomeMonths++; }
    });
    const avgPerCat = {};
    let grandTotal = 0;
    Object.entries(catData).forEach(([cat, d]) => { avgPerCat[cat] = months.length > 0 ? d.total / months.length : 0; grandTotal += avgPerCat[cat]; });
    const monthsWithData = months.filter(m => transactions.some(t => t.type === 'expense' && t.status === 'paid' && t.month === m.month && (t.year || 2026) === m.year)).length;
    return { months, avgPerCat, grandTotal, monthsWithData, avgIncome: incomeMonths > 0 ? incomeTotal / incomeMonths : 0 };
  }, [transactions, selectedYear, selectedMonth]);

  const currentSnapshot = useMemo(() => {
    const now = new Date();
    const y = now.getFullYear();
    const m = ALL_MONTHS[now.getMonth()];
    const monthTx = transactions.filter(t => t.month === m && (t.year || y) === y);
    const paid = monthTx.filter(t => t.status === 'paid');
    const pending = monthTx.filter(t => t.status !== 'paid');
    const paidIncome = paid.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidExpense = paid.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncome = pending.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingExpense = pending.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
    const liveTotal = ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(liveBalances[k]), 0);
    const totalTx = paid.length + pending.length;
    const completedPct = totalTx > 0 ? Math.round((paid.length / totalTx) * 100) : 0;
    return { y, m, liveTotal, paidIncome, paidExpense, pendingIncome, pendingExpense, pendingCount: pending.length, expectedEnd: liveTotal + pendingIncome - pendingExpense, completedPct };
  }, [transactions, liveBalances]);

  const projection = useMemo(() => {
    const result = [];
    let balance = currentSnapshot.expectedEnd;
    const activeLoans = updatedLoans.filter(l => !l.isReceivable && !l.autoGenerated && safeNumber(l.monthlyInstallment) > 0 && l.remaining > 0);
    const loansTotal = activeLoans.reduce((s, l) => s + safeNumber(l.monthlyInstallment), 0);
    const recurringExpenses = recurringItems.filter(r => r.type === 'expense' && r.active !== false);
    const recurringTotal = recurringExpenses.reduce((s, r) => s + safeNumber(r.amount), 0);
    const committedTotal = loansTotal + recurringTotal;
    let y = selectedYear, mi = getMonthIndex(selectedMonth);
    for (let i = 1; i <= 3; i++) {
      mi++; if (mi > 11) { mi = 0; y++; }
      const month = ALL_MONTHS[mi];
      const monthKey = makeMonthKey(y, month);
      const plan = (monthlyPlans && monthlyPlans[monthKey]) || {};
      const planIncome = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent) + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE) + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedCash);
      const planCashExpenses = safeNumber(plan.expectedCashExpenses);
      const planPayments = safeNumber(plan.plannedPayments);
      const hasPlan = planIncome > 0 || planCashExpenses > 0 || planPayments > 0;
      const monthTx = transactions.filter(t => t.month === month && (t.year || y) === y);
      const pendingManualIncome = monthTx.filter(t => t.type === 'income' && t.status !== 'paid' && !t.autoGenerated && !t.sourceReceivableId).reduce((s, t) => s + safeNumber(t.amount), 0);
      const pendingManualExpense = monthTx.filter(t => t.type === 'expense' && t.status !== 'paid' && !t.sourceRecurringId).reduce((s, t) => s + safeNumber(t.amount), 0);
      const income = (hasPlan ? planIncome : historical.avgIncome) + pendingManualIncome;
      const expenses = hasPlan ? (planCashExpenses + planPayments + pendingManualExpense) : (historical.grandTotal + committedTotal + pendingManualExpense);
      const closing = balance + income - expenses;
      result.push({ year: y, month, monthKey, opening: balance, income, expenses, closing, planIncome, planCashExpenses, planPayments, pendingIncome: pendingManualIncome, pendingExpense: pendingManualExpense, committed: hasPlan ? planPayments : committedTotal, source: hasPlan ? 'plan' : 'history', hasPlan, savings: income - expenses, safety: closing < 0 ? 'danger' : closing < 5000 ? 'warn' : 'safe' });
      balance = closing;
    }
    return result;
  }, [selectedYear, selectedMonth, currentSnapshot, monthlyPlans, transactions, updatedLoans, recurringItems, historical]);

  const confidence = useMemo(() => {
    const planCount = projection.filter(p => p.hasPlan).length;
    const historyCount = historical.monthsWithData;
    if (planCount >= 2 && historyCount >= 2) return { level: 'مرتفعة', pct: 90, cls: 'badge-success' };
    if (planCount >= 1 && historyCount >= 1) return { level: 'متوسطة', pct: 75, cls: 'badge-warning' };
    if (planCount >= 1 || historyCount >= 1 || currentSnapshot.pendingCount > 0) return { level: 'منخفضة', pct: 60, cls: 'badge-warning' };
    return { level: 'غير كافية', pct: 30, cls: 'badge-danger' };
  }, [projection, historical, currentSnapshot]);

  const hasDanger = projection.some(p => p.safety === 'danger');
  const dangerMonthsArr = projection.filter(p => p.safety === 'danger').map(p => p.month);

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card flex justify-between items-center flex-wrap gap-3">
        <div><h2 className="text-base font-black flex items-center gap-2"><LineChart className="text-teal-500" size={18} /> توقع السيولة</h2><p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>رؤية تنبؤية — تستمد من التخطيط + المعلقات + السجل</p></div>
        <div className={`badge ${confidence.cls} px-2.5 py-1.5 text-[10px]`}>دقة {confidence.pct}% • {confidence.level}</div>
      </div>
      <div className="card">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-black text-sm flex items-center gap-2"><Clock className="text-amber-500" size={14} /> الشهر الحالي — {currentSnapshot.m} {currentSnapshot.y}</h3>
          {currentSnapshot.pendingCount > 0 && (<span className="badge badge-warning text-[10px]">⏳ {currentSnapshot.pendingCount} معلق</span>)}
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
          <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30"><p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الرصيد الحالي</p><p className="text-sm font-black text-blue-600 mt-0.5">{fmt(currentSnapshot.liveTotal)}</p></div>
          <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30"><p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">دخل مُحصَّل</p><p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(currentSnapshot.paidIncome)}</p></div>
          <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30"><p className="text-[10px] font-bold text-red-700 dark:text-red-400">مصروف مدفوع</p><p className="text-sm font-black text-red-600 mt-0.5">{fmt(currentSnapshot.paidExpense)}</p></div>
          <div className="p-2.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>متوقع نهاية الشهر</p><p className={`text-sm font-black mt-0.5 ${currentSnapshot.expectedEnd >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(currentSnapshot.expectedEnd)}</p></div>
        </div>
        <div className="w-full rounded-full h-1.5 overflow-hidden mb-3" style={{ background: 'var(--bg-muted)' }}><div className="h-full bg-gradient-to-r from-blue-400 to-emerald-500 rounded-full transition-all" style={{ width: `${currentSnapshot.completedPct}%` }}></div></div>
        <p className="text-[9px] text-center mb-3" style={{ color: 'var(--text-muted)' }}>{currentSnapshot.completedPct}% من معاملات الشهر مُنجزة</p>
        {(currentSnapshot.pendingIncome > 0 || currentSnapshot.pendingExpense > 0) && (
          <div className="p-3 rounded-lg bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900">
            <div className="flex items-start gap-2 mb-2"><AlertTriangle size={12} className="text-amber-600 flex-shrink-0 mt-0.5" /><p className="text-[10px] font-bold text-amber-700 dark:text-amber-400">قيود معلقة لم تُعتمد (محتسبة في التوقع):</p></div>
            <div className="flex gap-3 text-[11px] flex-wrap">
              {currentSnapshot.pendingIncome > 0 && <span className="text-emerald-700 dark:text-emerald-400 font-bold">+ {fmt(currentSnapshot.pendingIncome)} دخل متوقع</span>}
              {currentSnapshot.pendingExpense > 0 && <span className="text-red-700 dark:text-red-400 font-bold">− {fmt(currentSnapshot.pendingExpense)} مصروف متوقع</span>}
            </div>
          </div>
        )}
      </div>
      <div className="grid grid-cols-3 gap-2">
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>متوسط دخل (3 شهور)</p><p className="text-sm font-black text-emerald-600 mt-1">{fmt(historical.avgIncome)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>متوسط مصروف</p><p className="text-sm font-black text-amber-600 mt-1">{fmt(historical.grandTotal)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>مصداقية السجل</p><p className="text-sm font-black text-blue-600 mt-1">{historical.monthsWithData}/3 شهور</p></div>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
        {projection.map((p, idx) => (
          <div key={idx} className="card">
            <div className="flex justify-between items-center mb-3">
              <div className="min-w-0">
                <h3 className="text-base font-black">{p.month} {p.year}</h3>
                <span className={`badge ${p.source === 'plan' ? 'badge-brand' : 'badge-neutral'} mt-1 text-[9px]`}>{p.source === 'plan' ? '📋 من التخطيط' : '📊 من السجل'}</span>
              </div>
              <span className={`badge text-[10px] flex-shrink-0 ${p.safety === 'safe' ? 'badge-success' : p.safety === 'warn' ? 'badge-warning' : 'badge-danger'}`}>{p.safety === 'safe' ? 'آمن' : p.safety === 'warn' ? 'انتباه' : 'خطر'}</span>
            </div>
            <div className="space-y-1.5 text-xs">
              <ForecastRow label="افتتاحي" value={p.opening} color="text-slate-600" />
              {p.planIncome > 0 && <ForecastRow label="📋 دخل مخطط" value={p.planIncome} color="text-emerald-600" prefix="+" />}
              {p.pendingIncome > 0 && <ForecastRow label="⏳ دخل معلق" value={p.pendingIncome} color="text-emerald-500" prefix="+" />}
              {p.planIncome === 0 && p.pendingIncome === 0 && historical.avgIncome > 0 && (<ForecastRow label="📊 دخل متوقع" value={historical.avgIncome} color="text-emerald-600" prefix="+" />)}
              {p.planCashExpenses > 0 && <ForecastRow label="📋 مصروف مخطط" value={p.planCashExpenses} color="text-red-500" prefix="-" />}
              {p.planPayments > 0 && <ForecastRow label="🔒 مدفوعات ثابتة" value={p.planPayments} color="text-red-500" prefix="-" />}
              {p.pendingExpense > 0 && <ForecastRow label="⏳ مصروف معلق" value={p.pendingExpense} color="text-red-400" prefix="-" />}
              {p.source === 'history' && (
                <React.Fragment>
                  <ForecastRow label="📊 مصروف متغير" value={historical.grandTotal} color="text-orange-500" prefix="-" />
                  {p.committed > 0 && <ForecastRow label="🔒 التزامات ثابتة" value={p.committed} color="text-red-500" prefix="-" />}
                </React.Fragment>
              )}
              <div className="pt-2 mt-2" style={{ borderTop: '1px dashed var(--border-default)' }}>
                <div className="flex justify-between items-center"><span className="font-black text-xs">المتوقع</span><span className={`text-lg font-black ${p.closing >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(p.closing)}</span></div>
                <div className="flex justify-between items-center mt-1"><span className="text-[10px]" style={{ color: 'var(--text-muted)' }}>التوفير الشهري</span><span className={`text-[11px] font-black ${p.savings >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{p.savings >= 0 ? '+' : ''}{fmt(p.savings)}</span></div>
              </div>
            </div>
          </div>
        ))}
      </div>
      {hasDanger && (
        <div className="card" style={{ borderColor: 'var(--danger)' }}>
          <div className="flex items-start gap-2">
            <AlertTriangle size={16} className="text-red-500 flex-shrink-0 mt-0.5" />
            <div className="min-w-0"><h4 className="font-black text-xs text-red-600 mb-1">⚠️ تنبيه مبكر</h4><p className="text-[11px] leading-relaxed" style={{ color: 'var(--text-secondary)' }}>فيه عجز متوقع في: <strong>{dangerMonthsArr.join(' • ')}</strong>.</p></div>
          </div>
        </div>
      )}
      <div className="card" style={{ background: 'var(--bg-muted)' }}>
        <p className="text-[10px] leading-relaxed" style={{ color: 'var(--text-muted)' }}>💡 <strong>كيف يُحسب التوقع:</strong> يبدأ من رصيدك الحالي بعد إضافة/خصم المعلقات، ثم يضيف لكل شهر قادم: دخل التخطيط + دخل معلق، ويخصم مصروف التخطيط + مدفوعات + مصروف معلق. لو الشهر ملهوش تخطيط، يستخدم متوسط آخر 3 شهور تلقائياً.</p>
      </div>
    </div>
  );
});

// ── CalendarView ──
const CalendarView = memo(({ data, getAgendaItems, transactions, dispatch, saveHistory, addNotification }) => {
  const [filterCat, setFilterCat] = useState('all');
  const items = getAgendaItems();
  const filtered = filterCat === 'all' ? items : items.filter(i => {
    if (filterCat === 'loans') return i.title.includes('قسط') || i.title.includes('عقاري') || i.title.includes('محل هاني');
    if (filterCat === 'cards') return i.title.includes('بطاقة') || i.title.includes('سداد');
    if (filterCat === 'personal') return i.title.includes('محمود') || i.title.includes('سلفة') || i.title.includes('جامعة') || i.title.includes('مدرسة') || i.title.includes('تقويم');
    if (filterCat === 'monthly') return i.desc === '👨‍👩‍👧 مصروف شهري';
    if (filterCat === 'recurring') return i.desc === 'التزام شهري متكرر' || i.desc === '💰 دخل شهري متكرر';
    if (filterCat === 'fees') return i.desc && i.desc.includes('رسم بنكي');
    return true;
  });
  const grouped = filtered.reduce((acc, item) => {
    const d = parseISODate(item.date);
    const mn = d ? d.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' }) : item.date;
    if (!acc[mn]) acc[mn] = [];
    acc[mn].push(item);
    return acc;
  }, {});
  const urgentCount = filtered.filter(i => { const d = calculateDaysLeft(i.date); return d !== null && d <= 7 && d >= 0; }).length;
  const quickPay = (item) => {
    const d = parseISODate(item.date); if (!d) return;
    const y = d.getFullYear(), m = ALL_MONTHS[d.getMonth()];
    if (data && isMonthClosed(data, y, m)) { addNotification({ type: 'error', title: 'محظور' }); return; }
    saveHistory();
    const isIncome = item.desc && item.desc.includes('دخل');
    const isFee = item.desc && item.desc.includes('رسم بنكي');
    const isMonthly = item.desc === '👨‍👩‍👧 مصروف شهري';
    const tx = { id: getSafeId(), type: isIncome ? 'income' : 'expense', kind: KIND.FINANCIAL, category: isMonthly ? item.title : isIncome ? 'تكييف محمود' : isFee ? 'رسوم بنكية شهرية' : 'الالتزامات البنكية والتمويلية', amount: safeNumber(item.amount), description: item.title, method: 'instapay', date: item.date, month: m, year: y, monthIndex: d.getMonth(), subType: isIncome ? 'deposit' : 'withdrawal', status: 'paid' };
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [tx, ...transactions].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) });
    addNotification({ type: 'success', title: 'تم التسجيل' });
  };
  return (
    <div className="space-y-4 animate-fadeIn pb-20">
      <div className="grid grid-cols-3 gap-2">
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>المواعيد</p><p className="text-lg font-black text-blue-600 mt-1">{filtered.length}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>قريباً</p><p className="text-lg font-black text-red-600 mt-1">{urgentCount}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الإجمالي</p><p className="text-lg font-black text-emerald-600 mt-1">{fmt(filtered.reduce((s, i) => s + safeNumber(i.amount), 0))}</p></div>
      </div>
      <div className="card py-2.5">
        <div className="flex gap-1.5 overflow-x-auto scroll-hide">
          {[{ id: 'all', label: 'الكل' }, { id: 'monthly', label: 'شهري' }, { id: 'loans', label: 'قروض' }, { id: 'cards', label: 'بطاقات' }, { id: 'personal', label: 'شخصي' }, { id: 'recurring', label: 'متكرر' }, { id: 'fees', label: 'رسوم' }].map(f => (
            <button key={f.id} onClick={() => setFilterCat(f.id)} className={`badge px-2.5 py-1.5 cursor-pointer whitespace-nowrap text-[10px] ${filterCat === f.id ? 'badge-brand' : 'badge-neutral'}`}>{f.label}</button>
          ))}
        </div>
      </div>
      {Object.keys(grouped).length === 0 ? (
        <div className="card text-center p-12"><Calendar size={32} className="mx-auto mb-2" style={{ color: 'var(--text-muted)' }} /><p className="font-semibold text-xs" style={{ color: 'var(--text-secondary)' }}>لا توجد مواعيد</p></div>
      ) : Object.entries(grouped).map(([month, list]) => (
        <div key={month} className="space-y-2">
          <div className="flex items-center gap-2">
            <div className="badge badge-brand px-2.5 py-1 text-[10px]">{month}</div>
            <div className="flex-1 h-px" style={{ background: 'var(--border-default)' }}></div>
            <span className="badge badge-neutral text-[10px]">{list.length}</span>
          </div>
          {list.map(item => {
            const d = calculateDaysLeft(item.date);
            const isUrg = d !== null && d <= 3 && d >= 0;
            const isOver = d !== null && d < 0;
            const Icon = item.icon;
            const isIncome = item.desc && item.desc.includes('دخل');
            return (
              <div key={item.id} className="card py-3">
                <div className="flex justify-between items-center gap-2">
                  <div className="flex items-center gap-2 flex-1 min-w-0">
                    <div className={`p-1.5 rounded-lg flex-shrink-0 ${isIncome ? 'bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600' : 'bg-red-50 dark:bg-red-950/30 text-red-500'}`}><Icon size={14} /></div>
                    <div className="min-w-0">
                      <p className="font-bold text-xs truncate">{item.title}</p>
                      <div className="flex items-center gap-1.5 mt-0.5 flex-wrap">
                        <span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{item.date}</span>
                        {d !== null && <span className={`badge text-[9px] ${isOver ? 'badge-danger' : isUrg ? 'badge-warning' : 'badge-success'}`}>{isOver ? `متأخر ${Math.abs(d)}` : d === 0 ? 'اليوم!' : `${d} ي`}</span>}
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-1 flex-shrink-0">
                    <p className={`font-black text-xs ${isIncome ? 'text-emerald-600' : ''}`}>{fmt(item.amount)}</p>
                    <button onClick={() => quickPay(item)} title="تسجيل فوري" className="btn btn-ghost p-1 text-emerald-500"><CheckCircle2 size={12} /></button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
});

// ── SettingsView — كما هو (بدون تغييرات جوهرية) ──
const SettingsView = memo(({ data, accountsData, cards, budgets, dispatch, saveHistory, addNotification }) => {
  const [localAccounts, setLocalAccounts] = useState(() => JSON.parse(JSON.stringify(accountsData)));
  const [localCards, setLocalCards] = useState(() => cards.map(c => ({ ...c })));
  const [activeSection, setActiveSection] = useState('accounts');
  const [hasChanges, setHasChanges] = useState(false);
  const [driveBusy, setDriveBusy] = useState(false);
  const [driveStatus, setDriveStatus] = useState('');
  const [folderIdInput, setFolderIdInput] = useState(() => localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID);

  useEffect(() => { setLocalAccounts(JSON.parse(JSON.stringify(accountsData))); setHasChanges(false); }, [accountsData]);
  useEffect(() => { setLocalCards(cards.map(c => ({ ...c }))); setHasChanges(false); }, [cards]);

  const handleAccountChange = (key, field, value) => { setLocalAccounts(prev => ({ ...prev, [key]: { ...prev[key], [field]: value } })); setHasChanges(true); };
  const handleCardChange = (id, field, value) => {
    setLocalCards(prev => prev.map(c => { if (c.id !== id) return c; const u = { ...c, [field]: value }; if (field === 'limit') u.availableBalance = Math.max(0, safeNumber(value) - safeNumber(u.openingDebt)); return u; }));
    setHasChanges(true);
  };

  const handleSave = () => {
    saveHistory();
    const cleaned = {};
    const today = getLocalISODate();
    ACCOUNT_KEYS.forEach(k => {
      const oldBal = safeNumber(accountsData[k]?.balance);
      const newBal = parseNumberInput(localAccounts[k]?.balance);
      cleaned[k] = { ...localAccounts[k], balance: newBal, lastUpdated: (oldBal !== newBal) ? today : (localAccounts[k]?.lastUpdated || today) };
    });
    dispatch({ type: 'UPDATE_ACCOUNTS', payload: cleaned });
    dispatch({ type: 'UPDATE_CARDS', payload: localCards.map(c => ({ ...c, limit: safeNumber(c.limit), openingDebt: safeNumber(c.openingDebt), cashbackRate: safeNumber(c.cashbackRate, 1), subCardLast4: Array.isArray(c.subCardLast4) ? c.subCardLast4 : [] })) });
    addNotification({ type: 'success', title: 'تم الحفظ' });
    setHasChanges(false);
  };

  const handleDriveConnect = async () => {
    setDriveBusy(true); setDriveStatus('جاري الاتصال...');
    try { await ensureDriveToken(); setDriveStatus('متصل'); addNotification({ type: 'success', title: 'Drive متصل' }); }
    catch (e) { setDriveStatus('فشل: ' + e.message); }
    finally { setDriveBusy(false); }
  };

  const handleDriveBackupNow = async () => {
    setDriveBusy(true); setDriveStatus('جاري الرفع...');
    try {
      const payload = { data, budgets, exportedAt: new Date().toISOString(), version: 'V80' };
      const result = await uploadBackupToDrive(payload);
      localStorage.setItem(AUTO_BACKUP_LS_KEY, String(Date.now()));
      const folderId = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;
      setDriveStatus(`✅ تم الرفع: ${result.name}`);
      addNotification({ type: 'success', title: 'تم رفع النسخة', message: 'في مجلد Finance Backups', duration: 6000 });
      if (folderId) { setTimeout(() => { if (window.confirm('تم الرفع! تفتح المجلد في Drive للتأكد؟')) window.open(`https://drive.google.com/drive/folders/${folderId}`, '_blank'); }, 600); }
    } catch (e) { setDriveStatus('❌ فشل: ' + e.message); addNotification({ type: 'error', title: 'فشل الرفع', message: e.message }); }
    finally { setDriveBusy(false); }
  };

  const handleDriveRestore = async () => {
    setDriveBusy(true); setDriveStatus('جاري الجلب...');
    try {
      const files = await listDriveBackups();
      if (files.length === 0) { setDriveStatus('لا توجد نسخ'); setDriveBusy(false); return; }
      const labels = files.slice(0, 10).map((f, i) => `${i + 1}) ${f.name}`).join('\n');
      const choice = await showInputModal({ title: 'اختر رقم النسخة', icon: '☁️', message: labels, inputValue: '1', numeric: true, confirmText: 'استعادة' });
      if (!choice) { setDriveBusy(false); setDriveStatus(''); return; }
      const idx = Math.max(1, Math.min(files.length, parseInt(choice, 10) || 1)) - 1;
      const file = files[idx];
      const payload = await downloadBackupFromDrive(file.id);
      if (!payload?.data) throw new Error('الملف لا يحتوي بيانات');
      dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'استعادة نسخة', message: 'سيتم استبدال بياناتك', onConfirm: () => {
        saveHistory();
        dispatch({ type: 'SET_DATA', payload: migrateData(payload.data) });
        if (payload.budgets) dispatch({ type: 'SET_BUDGETS', payload: payload.budgets });
        addNotification({ type: 'success', title: 'تمت الاستعادة' });
      }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
    } catch (e) { setDriveStatus('فشل: ' + e.message); }
    finally { setDriveBusy(false); }
  };

  const handleFreshStart = () => {
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'بداية جديدة', message: 'سيتم مسح كل المعاملات', onConfirm: () => {
      saveHistory();
      const zeroed = {};
      ACCOUNT_KEYS.forEach(k => { zeroed[k] = { ...(accountsData[k] || {}), balance: 0, lastUpdated: getLocalISODate() }; });
      dispatch({ type: 'SET_DATA', payload: { ...data, transactions: [], closedMonths: [], monthlySnapshots: {}, accountsData: zeroed, cards: (data.cards || []).map(c => ({ ...c, openingDebt: 0, availableBalance: safeNumber(c.limit) })), materializedRecurring: {}, notifiedItems: {}, custodyEntries: [], cashbackTrackers: [] } });
      addNotification({ type: 'success', title: 'تم التصفير' });
      dispatch({ type: 'HIDE_CONFIRM' });
    }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card flex justify-between items-center flex-wrap gap-3">
        <div className="flex items-center gap-2">
          <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><Sliders size={16} /></div>
          <h2 className="text-base font-black">الإعدادات</h2>
        </div>
        {hasChanges && <button onClick={handleSave} className="btn btn-primary text-xs"><Save size={14} /> حفظ</button>}
      </div>

      <div className="card p-1 flex gap-1.5">
        {[{ id: 'accounts', label: 'الحسابات', icon: Wallet }, { id: 'cards', label: 'البطاقات', icon: CreditCard }].map(s => {
          const Icon = s.icon;
          return <button key={s.id} onClick={() => setActiveSection(s.id)} className={`flex-1 py-2.5 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 transition-all ${activeSection === s.id ? 'text-white shadow-sm' : ''}`} style={activeSection === s.id ? { background: 'var(--brand)' } : { color: 'var(--text-muted)' }}><Icon size={14} /> {s.label}</button>;
        })}
      </div>

      {activeSection === 'accounts' && (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          {ACCOUNT_KEYS.map(key => {
            const acc = localAccounts[key] || {};
            const Icon = ACCOUNT_ICONS[key] || Wallet;
            const last4 = DEFAULT_ACCOUNTS[key]?.last4;
            return (
              <div key={key} className="card">
                <div className="flex justify-between items-center mb-3">
                  <div className="flex items-center gap-2">
                    <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><Icon size={14} /></div>
                    <h4 className="font-black text-xs">{acc.label || key}</h4>
                  </div>
                </div>
                <div className="space-y-2.5">
                  <div><label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الرصيد الأساسي</label><input type="text" inputMode="decimal" value={acc.balance ?? ''} onChange={e => handleAccountChange(key, 'balance', e.target.value)} className="input-field text-base font-black text-blue-600 text-center py-2" /></div>
                  <div><label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>تاريخ التثبيت</label><input type="date" value={acc.lastUpdated || ''} onChange={e => handleAccountChange(key, 'lastUpdated', e.target.value)} className="input-field text-center font-bold text-xs py-2" /></div>
                  {last4 && (<div className="p-2 rounded-lg text-center" style={{ background: 'var(--bg-muted)' }}><p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>رقم البطاقة</p><p className="font-mono font-bold text-xs mt-0.5">•••• {last4}</p></div>)}
                  <div className="p-2 rounded-lg text-center" style={{ background: 'var(--bg-muted)' }}><p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>الرصيد الحي</p><p className="font-black text-emerald-600 text-xs">{fmt(computeBalance({ ...data, accountsData: localAccounts }, key))}</p></div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {activeSection === 'cards' && (
        <div className="space-y-3">
          {localCards.map(card => {
            const liveDebt = computeCardDebt(data, card);
            const debtPct = safeNumber(card.limit) > 0 ? (liveDebt / safeNumber(card.limit)) * 100 : 0;
            const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
            return (
              <div key={card.id} className="card">
                <div className="flex items-center gap-2 mb-3 flex-wrap">
                  <div className="p-1.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-purple-600 dark:text-purple-400"><CreditCard size={14} /></div>
                  <h3 className="font-black text-sm">{card.bank} - {card.name}</h3>
                  <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>•••• {card.last4}</span>
                  {subCards.map(s => <span key={s} className="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full" style={{ background: 'var(--brand-soft)', color: 'var(--brand)' }}>•••• {s}</span>)}
                </div>
                <div className="grid grid-cols-3 gap-2 mb-3">
                  <div><label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الحد</label><input type="text" inputMode="decimal" value={card.limit} onChange={e => handleCardChange(card.id, 'limit', e.target.value)} className="input-field font-black text-blue-600 text-center text-xs py-2" /></div>
                  <div><label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>مديونية أساسية</label><input type="text" inputMode="decimal" value={card.openingDebt} onChange={e => handleCardChange(card.id, 'openingDebt', e.target.value)} className="input-field font-black text-red-600 text-center text-xs py-2" /></div>
                  <div><label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>كاش باك %</label><input type="text" inputMode="decimal" value={card.cashbackRate || 1} onChange={e => handleCardChange(card.id, 'cashbackRate', e.target.value)} className="input-field font-black text-amber-600 text-center text-xs py-2" /></div>
                </div>
                <div className="p-2 rounded-lg text-center mt-2" style={{ background: 'var(--bg-muted)' }}>
                  <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>المديونية الحية</p>
                  <p className="font-black text-red-600 text-sm">{fmt(liveDebt)} ج.م</p>
                  <p className="text-[10px] font-semibold mt-1" style={{ color: 'var(--text-muted)' }}>المتاح: {fmt(Math.max(0, safeNumber(card.limit) - liveDebt))} ج.م</p>
                </div>
                <div className="w-full rounded-full h-1 overflow-hidden mt-2" style={{ background: 'var(--bg-muted)' }}>
                  <div className={`h-full ${debtPct > 70 ? 'bg-red-500' : debtPct > 40 ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(100, debtPct)}%` }}></div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div className="card">
        <div className="flex items-center gap-2 mb-3">
          <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400"><Lock size={14} /></div>
          <h3 className="font-black text-sm">رمز الدخول (PIN)</h3>
        </div>
        <p className="text-[11px] mb-3" style={{ color: 'var(--text-muted)' }}>الرمز الافتراضي: <strong>1033</strong></p>
        <button onClick={() => dispatch({ type: 'SET_PIN_CHANGE_OPEN', payload: true })} className="btn btn-secondary text-xs w-full"><Lock size={12} /> تغيير الرمز</button>
      </div>

      <details className="card p-0 overflow-hidden" open>
        <summary className="p-4 cursor-pointer list-none flex items-center justify-between">
          <div className="flex items-center gap-2"><Cloud size={14} className="text-blue-500" /><span className="font-bold text-xs">Google Drive</span></div>
          <ChevronDown size={14} style={{ color: 'var(--text-muted)' }} />
        </summary>
        <div className="px-4 pb-4 space-y-3" style={{ borderTop: '1px solid var(--border-subtle)', paddingTop: '12px' }}>
          <div>

// dataReducer — مع إصلاحات
// ═══════════════════════════════════════════════════════════════
function dataReducer(state, action) {
  switch (action.type) {
    case 'SET_DATA': return { ...state, data: action.payload };
    case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
    case 'SET_SELECTED_YEAR': return { ...state, selectedYear: action.payload, selectedMonth: getMonthsForYear(action.payload).includes(state.selectedMonth) ? state.selectedMonth : getMonthsForYear(action.payload)[0] };
    case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
    case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
    case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
    case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
    case 'SET_FORM_DATA': return { ...state, formData: action.payload };
    case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
    case 'SET_FORM_ERRORS': return { ...state, formErrors: action.payload };
    case 'SET_ACTIVE_CATEGORY_DETAIL': return { ...state, activeCategoryDetail: action.payload };
    case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
    case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
    case 'SET_BUDGETS': return { ...state, budgets: action.payload };
    case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
    case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
    case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
    case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
    case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
    case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
    case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
    case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
    case 'SET_VIEWING_RECEIPT': return { ...state, viewingReceipt: action.payload };
    case 'SET_PIN_CHANGE_OPEN': return { ...state, isPinChangeOpen: action.payload };
    case 'SET_SMS_MODAL_OPEN': return { ...state, isSmsModalOpen: action.payload };
    case 'SET_PENDING_CLOSE_MODAL': return { ...state, pendingCloseModal: action.payload };
    case 'ADD_NOTIFICATION': return { ...state, notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }] };
    case 'REMOVE_NOTIFICATION': return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
    case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
    case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
    case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
    case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
    case 'UPDATE_CASHBACK_TRACKERS': return { ...state, data: { ...state.data, cashbackTrackers: action.payload } };
    case 'UPDATE_ACCOUNTS': {
      const oldA = state.data.accountsData || {};
      const newA = action.payload || {};
      let earliestAffected = null;
      ACCOUNT_KEYS.forEach(k => {
        const oldBal = safeNumber(oldA[k]?.balance);
        const newBal = safeNumber(newA[k]?.balance);
        const oldDate = oldA[k]?.lastUpdated;
        const newDate = newA[k]?.lastUpdated;
        if (oldBal !== newBal || oldDate !== newDate) {
          const ref = newDate || oldDate;
          if (ref) {
            const d = parseISODate(ref);
            if (d) {
              const y = d.getFullYear();
              const mIdx = d.getMonth();
              const mName = ALL_MONTHS[mIdx];
              if (!earliestAffected) earliestAffected = { year: y, month: mName };
              else {
                const curIdx = getMonthIndex(earliestAffected.month);
                if (y < earliestAffected.year || (y === earliestAffected.year && mIdx < curIdx)) earliestAffected = { year: y, month: mName };
              }
            }
          }
        }
      });
      let newSnapshots = state.data.monthlySnapshots || {};
      if (earliestAffected) { const { snapshots } = invalidateSnapshotsFrom(newSnapshots, earliestAffected.year, earliestAffected.month); newSnapshots = snapshots; }
      return { ...state, data: { ...state.data, accountsData: newA, monthlySnapshots: newSnapshots } };
    }
    case 'UPDATE_MONTHLY_PLANS': return { ...state, data: { ...state.data, monthlyPlans: action.payload } };
    case 'ADD_TO_HISTORY': { const limited = [...state.history].slice(-19); return { ...state, history: [...limited, action.payload], future: [] }; }
    case 'UNDO': {
      if (state.history.length === 0) return state;
      const prev = state.history[state.history.length - 1];
      return { ...state, data: prev.data || prev, budgets: prev.budgets !== undefined ? prev.budgets : state.budgets, history: state.history.slice(0, -1), future: [{ data: state.data, budgets: state.budgets }, ...state.future] };
    }
    case 'TOGGLE_LEDGER': return { ...state, expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] } };
    case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };
    case 'SET_STATUS_FILTER': return { ...state, statusFilter: action.payload };
    case 'SHOW_CONFIRM': return { ...state, confirmDialog: { isOpen: true, title: action.title, message: action.message, onConfirm: action.onConfirm, onCancel: action.onCancel, danger: action.danger || false } };
    case 'HIDE_CONFIRM': return { ...state, confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false } };
    case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
    case 'SET_QUICK_TRANSFER_DATA': return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
    case 'SET_VIEWING_CARD_STATEMENT': return { ...state, viewingCardStatement: action.payload };

    case 'CLOSE_MONTH': {
      const { year, month } = action.payload;
      const monthKey = makeMonthKey(year, month);
      const monthEnd = new Date(year, getMonthIndex(month) + 1, 0, 23, 59, 59);
      const snap = {};
      ACCOUNT_KEYS.forEach(k => { snap[k] = computeBalance(state.data, k, monthEnd); });
      return { ...state, data: { ...state.data, closedMonths: [...(state.data.closedMonths || []), monthKey], monthlySnapshots: { ...(state.data.monthlySnapshots || {}), [monthKey]: snap } } };
    }

    case 'CLOSE_MONTH_AFTER_RESOLVE': {
      const { year, month, resolveAction, pendingIds } = action.payload;
      const monthKey = makeMonthKey(year, month);
      let newTxs = state.data.transactions || [];
      if (resolveAction === 'approve') { const ids = new Set(pendingIds); newTxs = newTxs.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t); }
      else if (resolveAction === 'delete') { const ids = new Set(pendingIds); newTxs = newTxs.filter(t => !ids.has(t.id)); }
      else if (resolveAction === 'carry') {
        const idx = getMonthIndex(month);
        const nextMonth = idx === 11 ? ALL_MONTHS[0] : ALL_MONTHS[idx + 1];
        const nextYear = idx === 11 ? year + 1 : year;
        const nextMonthIdx = getMonthIndex(nextMonth);
        const maxDay = new Date(nextYear, nextMonthIdx + 1, 0).getDate();
        const ids = new Set(pendingIds);
        newTxs = newTxs.map(t => {
          if (!ids.has(t.id)) return t;
          const oldD = parseISODate(t.date);
          const oldDay = oldD ? oldD.getDate() : 1;
          const newDay = Math.min(Math.max(1, oldDay), maxDay);
          const newDate = `${nextYear}-${String(nextMonthIdx + 1).padStart(2, '0')}-${String(newDay).padStart(2, '0')}`;
          return { ...t, date: newDate, month: nextMonth, year: nextYear, monthIndex: nextMonthIdx, source: 'carryover', carriedFromSource: t.source, carryoverFrom: `${month} ${year}`, status: 'pending' };
        });
      }
      const newData = { ...state.data, transactions: newTxs };
      const monthEnd = new Date(year, getMonthIndex(month) + 1, 0, 23, 59, 59);
      const snap = {};
      ACCOUNT_KEYS.forEach(k => { snap[k] = computeBalance(newData, k, monthEnd); });
      return { ...state, data: { ...newData, closedMonths: [...(newData.closedMonths || []), monthKey], monthlySnapshots: { ...(newData.monthlySnapshots || {}), [monthKey]: snap } }, pendingCloseModal: { isOpen: false, pending: [], total: 0, month: '', year: 0 } };
    }

    case 'OPEN_MONTH': {
      const monthKey = action.payload;
      const parsedKey = parseMonthKey(monthKey);
      if (!parsedKey) return { ...state, data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey) } };
      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots, parsedKey.year, parsedKey.month);
      return { ...state, data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey), monthlySnapshots: snapshots } };
    }

    case 'TOGGLE_WALLET_VISIBILITY': return { ...state, walletVisibility: { ...state.walletVisibility, [action.payload]: !state.walletVisibility[action.payload] } };
    case 'SET_IS_PROCESSING': return { ...state, isProcessing: action.payload };
    default: return state;
  }
}

    viewingCardStatement: null,
