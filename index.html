      due.forEach(r => {
        const t = r.template;
        const tObj = new Date(r.nextDue + 'T12:00:00');
        const txId = `rec-tx-${r.id}-${r.nextDue}`;
        const ruleIdx = updatedRules.findIndex(x => x.id === r.id);
        if (ruleIdx < 0) return;

        if (!existingIds.has(txId)) {
          newTxs.push({
            id: txId, type: 'expense', kind: 'operational',
            category: t.category, subCategory: t.subCategory,
            amount: t.amount, quantity: t.quantity, unitPrice: t.unitPrice,
            description: t.description,
            source: 'shopping-app', sourceLabel: t.sourceLabel,
            method: t.method, linkedCardId: t.linkedCardId || undefined,
            date: r.nextDue, month: ALL_MONTHS[tObj.getMonth()],
            year: tObj.getFullYear(), monthIndex: tObj.getMonth(),
            subType: 'withdrawal', status: 'pending', recurringId: r.id,
            createdAt: new Date().toISOString()
          });
        }

        const freq = r.frequency === 'bimonthly' ? 2 : 1;
        const nextDue = addMonthsWithDaySafe(r.nextDue, freq, r.preferredDay || 10);
        updatedRules[ruleIdx] = { ...updatedRules[ruleIdx], nextDue, lastRun: today };
      });

      const updates = {};
      if (newTxs.length > 0) updates.transactions = [...existingTx, ...newTxs];
      if (due.length > 0) updates.shoppingRecurring = updatedRules;
      if (Object.keys(updates).length > 0) fireTx.update(docRef, updates);
      console.log(`✅ Materialized ${newTxs.length} recurring shopping items`);
    });
  } catch (e) { console.warn('Shopping recurring:', e); }
};

/* ═══════════════ FORCE SAVE HELPER ═══════════════ */
const buildCloudPayload = (data, budgets) => {
  return { ...data, budgets: budgets || {}, __lastClientSync: new Date().toISOString(), __client: 'web-v86' };
};

/* ═══════════════════════════════════════════════════════════════
   ⭐⭐ dataReducer — V86.1
   ⭐ RECONCILE_ACCOUNT: ينشئ قيد تسوية source='reconciliation'
   ⭐ computeBalancesAsOf يقرأ هذا القيد الآن (بعد الفيكس في Part 1)
   ═══════════════════════════════════════════════════════════════ */
function dataReducer(state, action) {
  switch (action.type) {

    case 'SET_DATA': {
      const incoming = { ...action.payload };
      if (Array.isArray(incoming.transactions)) {
        incoming.transactions = incoming.transactions.map(t => 
          t ? { ...t, category: normalizeHanyCategory(t.category) } : t
        );
      }
      if (!Array.isArray(incoming.deletedTxIds)) incoming.deletedTxIds = [...(state.data.deletedTxIds || [])];
      if (!Array.isArray(incoming.deletedDefaultIds)) incoming.deletedDefaultIds = [...(state.data.deletedDefaultIds || [])];
      if (!Array.isArray(incoming.reconciliations)) incoming.reconciliations = [...(state.data.reconciliations || [])];
      if (!Array.isArray(incoming.auditLog)) incoming.auditLog = [...(state.data.auditLog || [])];
      if (!Array.isArray(incoming.transactions)) incoming.transactions = [];
      incoming.transactions = sortTransactions(incoming.transactions);
      return { ...state, data: incoming };
    }

    case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
    case 'SET_SELECTED_YEAR': return {
      ...state, selectedYear: action.payload,
      selectedMonth: getMonthsForYear(action.payload).includes(state.selectedMonth)
        ? state.selectedMonth : getMonthsForYear(action.payload)[0]
    };
    case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
    case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
    case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
    case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
    case 'SET_FORM_DATA': return { ...state, formData: action.payload };
    case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
    case 'SET_FORM_ERRORS': return { ...state, formErrors: action.payload };
    case 'SET_ACTIVE_CATEGORY_DETAIL': return { ...state, activeCategoryDetail: action.payload };
    case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
    case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
    case 'SET_BUDGETS': return { ...state, budgets: action.payload };
    case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
    case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
    case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
    case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
    case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
    case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
    case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
    case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
    case 'SET_PIN_CHANGE_OPEN': return { ...state, isPinChangeOpen: action.payload };
    case 'SET_SMS_MODAL_OPEN': return { ...state, isSmsModalOpen: action.payload };
    case 'SET_PENDING_CLOSE_MODAL': return { ...state, pendingCloseModal: action.payload };
    case 'SET_SIDEBAR_OPEN': return { ...state, isSidebarOpen: action.payload };
    case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
    case 'SET_QUICK_TRANSFER_DATA': return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
    case 'SET_VIEWING_CARD_STATEMENT': return { ...state, viewingCardStatement: action.payload };
    case 'SET_RECONCILIATION_MODAL': return { ...state, reconciliationModal: action.payload };
    case 'SET_IS_PROCESSING': return { ...state, isProcessing: action.payload };
    case 'SET_STATUS_FILTER': return { ...state, statusFilter: action.payload };
    case 'SET_FORCE_SAVE_STATE': return { ...state, forceSaveState: action.payload };

    case 'TOGGLE_LEDGER': return {
      ...state, expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] }
    };
    case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };

    case 'ADD_NOTIFICATION': return {
      ...state, notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }]
    };
    case 'REMOVE_NOTIFICATION': return {
      ...state, notifications: state.notifications.filter(n => n.id !== action.payload)
    };

    case 'UPDATE_TRANSACTIONS': {
      const oldTxs = state.data.transactions || [];
      const newTxs = sortTransactions(action.payload || []);
      const oldMap = new Map(oldTxs.map(t => [t.id, t]));
      const newMap = new Map(newTxs.map(t => [t.id, t]));
      const auditEntries = [];

      newTxs.forEach(t => {
        const old = oldMap.get(t.id);
        if (!old) {
          auditEntries.push(buildAuditEntry(AUDIT.CREATE, 'transaction', t.id, {
            after: { amount: t.amount, category: t.category, method: t.method, status: t.status },
            note: `إنشاء: ${t.description || t.category} — ${fmt(t.amount)} ج.م`
          }));
        } else if (JSON.stringify(old) !== JSON.stringify(t)) {
          const changes = [];
          if (old.status !== t.status) changes.push(`الحالة: ${old.status} → ${t.status}`);
          if (safeNumber(old.amount) !== safeNumber(t.amount)) changes.push(`المبلغ: ${fmt(old.amount)} → ${fmt(t.amount)}`);
          if (old.category !== t.category) changes.push(`الفئة: ${old.category} → ${t.category}`);
          if (changes.length > 0) {
            auditEntries.push(buildAuditEntry(AUDIT.UPDATE, 'transaction', t.id, {
              before: { status: old.status, amount: old.amount, category: old.category },
              after: { status: t.status, amount: t.amount, category: t.category },
              note: `تعديل: ${changes.join(' • ')}`
            }));
          }
        }
      });

      oldTxs.forEach(t => {
        if (!newMap.has(t.id)) {
          auditEntries.push(buildAuditEntry(AUDIT.DELETE, 'transaction', t.id, {
            before: { amount: t.amount, category: t.category, method: t.method },
            note: `حذف: ${t.description || t.category} — ${fmt(t.amount)} ج.م`
          }));
        }
      });

      const auditLog = [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000);
      return { ...state, data: { ...state.data, transactions: newTxs, auditLog } };
    }

    case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
    case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
    case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
    case 'UPDATE_CASHBACK_TRACKERS': return { ...state, data: { ...state.data, cashbackTrackers: action.payload } };
    case 'UPDATE_MONTHLY_PLANS': return { ...state, data: { ...state.data, monthlyPlans: action.payload } };

    case 'UPDATE_ACCOUNTS': {
      const oldA = state.data.accountsData || {};
      const newA = action.payload || {};
      let earliestAffected = null;

      ACCOUNT_KEYS.forEach(k => {
        const oldInit = safeNumber(oldA[k]?.initialBalance);
        const newInit = safeNumber(newA[k]?.initialBalance);
        const oldDate = oldA[k]?.initialDate;
        const newDate = newA[k]?.initialDate;
        if (oldInit !== newInit || oldDate !== newDate) {
          const ref = newDate || oldDate;
          if (ref) {
            const d = parseISODate(ref);
            if (d) {
              const y = d.getFullYear();
              const mIdx = d.getMonth();
              const mName = ALL_MONTHS[mIdx];
              if (!earliestAffected) earliestAffected = { year: y, month: mName };
              else {
                const curIdx = getMonthIndex(earliestAffected.month);
                if (y < earliestAffected.year || (y === earliestAffected.year && mIdx < curIdx))
                  earliestAffected = { year: y, month: mName };
              }
            }
          }
        }
      });

      let newSnapshots = state.data.monthlySnapshots || {};
      if (earliestAffected) {
        const { snapshots } = invalidateSnapshotsFrom(newSnapshots, earliestAffected.year, earliestAffected.month);
        newSnapshots = snapshots;
      }

      const auditEntries = [];
      ACCOUNT_KEYS.forEach(k => {
        const oldInit = safeNumber(oldA[k]?.initialBalance);
        const newInit = safeNumber(newA[k]?.initialBalance);
        if (oldInit !== newInit) {
          auditEntries.push(buildAuditEntry(AUDIT.UPDATE, 'account', k, {
            before: { initialBalance: oldInit }, after: { initialBalance: newInit },
            note: `${ACCOUNT_SHORT_NAMES[k]}: رصيد افتتاحي ${fmt(oldInit)} → ${fmt(newInit)}`
          }));
        }
      });

      return {
        ...state,
        data: {
          ...state.data, accountsData: newA, monthlySnapshots: newSnapshots,
          auditLog: [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000)
        }
      };
    }

    case 'ADD_TO_HISTORY': {
      const limited = [...state.history].slice(-19);
      return { ...state, history: [...limited, action.payload], future: [] };
    }

    case 'UNDO': {
      if (state.history.length === 0) return state;
      const prev = state.history[state.history.length - 1];
      return {
        ...state, data: prev.data || prev,
        budgets: prev.budgets !== undefined ? prev.budgets : state.budgets,
        history: state.history.slice(0, -1),
        future: [{ data: state.data, budgets: state.budgets }, ...state.future]
      };
    }

    case 'REDO': {
      if (state.future.length === 0) return state;
      const next = state.future[0];
      return {
        ...state, data: next.data, budgets: next.budgets,
        future: state.future.slice(1),
        history: [...state.history, { data: state.data, budgets: state.budgets }]
      };
    }

    case 'SHOW_CONFIRM': return {
      ...state,
      confirmDialog: {
        isOpen: true, title: action.title, message: action.message,
        onConfirm: action.onConfirm, onCancel: action.onCancel, danger: action.danger || false
      }
    };
    case 'HIDE_CONFIRM': return {
      ...state,
      confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false }
    };

    case 'CLOSE_MONTH': {
      const { year, month } = action.payload;
      const monthKey = makeMonthKey(year, month);
      const monthIdx = getMonthIndex(month);
      const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
      const snap = computeBalancesAsOf(state.data, monthEnd);
      const cardDebts = {};
      (state.data.cards || []).forEach(c => { cardDebts[c.id] = computeCardDebt(state.data, c, monthEnd); });
      const fullSnap = { ...snap, __v: CURRENT_ENGINE_VERSION, __cardDebts: cardDebts, __closedAt: new Date().toISOString() };

      const cleanedSnapshots = { ...(state.data.monthlySnapshots || {}) };
      Object.keys(cleanedSnapshots).forEach(k => {
        const parsed = parseMonthKey(k);
        if (!parsed) return;
        if (parsed.year > year || (parsed.year === year && getMonthIndex(parsed.month) > monthIdx))
          delete cleanedSnapshots[k];
      });

      return {
        ...state,
        data: {
          ...state.data,
          closedMonths: Array.from(new Set([...(state.data.closedMonths || []), monthKey])),
          monthlySnapshots: { ...cleanedSnapshots, [monthKey]: fullSnap },
          auditLog: [
            buildAuditEntry(AUDIT.CLOSE_MONTH, 'month', monthKey, { note: `إقفال شهر ${month} ${year}` }),
            ...(state.data.auditLog || [])
          ].slice(0, 1000)
        }
      };
    }

    case 'CLOSE_MONTH_AFTER_RESOLVE': {
      const { year, month, resolveAction, pendingIds } = action.payload;
      const monthKey = makeMonthKey(year, month);
      let newTxs = state.data.transactions || [];
      let notes = [];

      if (resolveAction === 'approve') {
        const ids = new Set(pendingIds);
        newTxs = newTxs.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t);
        notes.push(`اعتماد ${pendingIds.length} قيد معلق`);
      }
      else if (resolveAction === 'delete') {
        const ids = new Set(pendingIds);
        newTxs = newTxs.filter(t => !ids.has(t.id));
        notes.push(`حذف ${pendingIds.length} قيد معلق`);
      }
      else if (resolveAction === 'carry') {
        const idx = getMonthIndex(month);
        const nextMonth = idx === 11 ? ALL_MONTHS[0] : ALL_MONTHS[idx + 1];
        const nextYear = idx === 11 ? year + 1 : year;
        const nextMonthIdx = getMonthIndex(nextMonth);
        const maxDay = new Date(nextYear, nextMonthIdx + 1, 0).getDate();
        const ids = new Set(pendingIds);
        const nextMonthKey = makeMonthKey(nextYear, nextMonth);
        const nextClosed = (state.data.closedMonths || []).includes(nextMonthKey);
        if (nextClosed) { notes.push(`⚠️ فشل الترحيل: شهر ${nextMonth} ${nextYear} مغلق`); }
        else {
          let autoApproved = 0;
          newTxs = newTxs.map(t => {
            if (!ids.has(t.id)) return t;
            const carryCount = (t.carryCount || 0) + 1;
            if (carryCount > 3) { autoApproved++; return { ...t, status: 'paid', carryCount, __forceApproved: true }; }
            const oldD = parseISODate(t.date);
            const oldDay = oldD ? oldD.getDate() : 1;
            const newDay = Math.min(Math.max(1, oldDay), maxDay);
            const newDate = `${nextYear}-${String(nextMonthIdx + 1).padStart(2, '0')}-${String(newDay).padStart(2, '0')}`;
            return {
              ...t, date: newDate, month: nextMonth, year: nextYear, monthIndex: nextMonthIdx,
              source: 'carryover', carriedFromSource: t.source,
              carryoverFrom: `${month} ${year}`, carryCount, status: 'pending'
            };
          });
          notes.push(`ترحيل ${pendingIds.length - autoApproved} قيد لشهر ${nextMonth}`);
          if (autoApproved > 0) notes.push(`اعتماد تلقائي لـ ${autoApproved} قيد (تجاوز 3 مرات)`);
        }
      }

      newTxs = sortTransactions(newTxs);
      const newData = { ...state.data, transactions: newTxs };
      const monthEnd = new Date(year, getMonthIndex(month) + 1, 0, 23, 59, 59);
      const snap = computeBalancesAsOf(newData, monthEnd);
      const cardDebts = {};
      (newData.cards || []).forEach(c => { cardDebts[c.id] = computeCardDebt(newData, c, monthEnd); });
      const fullSnap = { ...snap, __v: CURRENT_ENGINE_VERSION, __cardDebts: cardDebts, __closedAt: new Date().toISOString() };

      return {
        ...state,
        data: {
          ...newData,
          closedMonths: Array.from(new Set([...(newData.closedMonths || []), monthKey])),
          monthlySnapshots: { ...(newData.monthlySnapshots || {}), [monthKey]: fullSnap },
          auditLog: [
            buildAuditEntry(AUDIT.CLOSE_MONTH, 'month', monthKey, { note: notes.join(' • ') }),
            ...(newData.auditLog || [])
          ].slice(0, 1000)
        },
        pendingCloseModal: { isOpen: false, pending: [], total: 0, month: '', year: 0 }
      };
    }

    case 'OPEN_MONTH': {
      const monthKey = action.payload;
      const parsedKey = parseMonthKey(monthKey);
      if (!parsedKey) return { ...state, data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey) } };
      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots, parsedKey.year, parsedKey.month);
      return {
        ...state,
        data: {
          ...state.data,
          closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey),
          monthlySnapshots: snapshots,
          auditLog: [
            buildAuditEntry(AUDIT.OPEN_MONTH, 'month', monthKey, { note: `فتح شهر ${parsedKey.month} ${parsedKey.year}` }),
            ...(state.data.auditLog || [])
          ].slice(0, 1000)
        }
      };
    }

    /* ⭐⭐⭐ V86.1 CRITICAL FIX: RECONCILE_ACCOUNT
       - يُنشئ قيد source='reconciliation' بمبلغ يساوي الفرق
       - computeBalancesAsOf في Part 1 تم تعديله ليقرأ هذه القيود
       - لا يعدّل accountsData.balance مباشرة (keep immutable anchor)
       - يُبطل snapshots الشهور المتأثرة
    */
    case 'RECONCILE_ACCOUNT': {
      const { accountKey, actualBalance, diff, note, month, year, computedBalance } = action.payload;
      const now = new Date();
      const txMonth = month || ALL_MONTHS[now.getMonth()];
      const txYear = year || now.getFullYear();
      const txMonthIdx = getMonthIndex(txMonth);

      if (isMonthClosed(state.data, txYear, txMonth)) {
        console.warn('🚫 RECONCILE محظور: الشهر مغلق', txMonth, txYear);
        return state;
      }

      if (Math.abs(diff) < 0.01) {
        // No difference — just log audit, no tx
        return {
          ...state,
          data: {
            ...state.data,
            auditLog: [
              buildAuditEntry(AUDIT.RECONCILE, 'account', accountKey, {
                before: { balance: computedBalance }, after: { balance: actualBalance },
                note: `مطابقة ${ACCOUNT_SHORT_NAMES[accountKey]}: مطابق تماماً`
              }),
              ...(state.data.auditLog || [])
            ].slice(0, 1000)
          }
        };
      }

      const reconciliationId = getSafeId();
      const settlementTx = {
        id: getSafeId(),
        type: diff > 0 ? 'income' : 'expense',
        kind: KIND.ADJUSTMENT,
        category: 'تسوية رصيد',
        amount: roundMoney(Math.abs(diff)),
        description: note || `تسوية مطابقة ${ACCOUNT_SHORT_NAMES[accountKey] || accountKey}`,
        method: accountKey,
        date: getLocalISODate(now),
        month: txMonth, year: txYear, monthIndex: txMonthIdx,
        subType: diff > 0 ? 'deposit' : 'withdrawal',
        status: 'paid',
        source: 'reconciliation',                     // ← critical for balance to apply
        linkedReconciliationId: reconciliationId,
        createdAt: now.toISOString()
      };

      const newTxs = sortTransactions([settlementTx, ...(state.data.transactions || [])]);

      const reconciliation = {
        id: reconciliationId, accountKey, date: getLocalISODate(now),
        computedBalance, actualBalance, diff,
        note: note || '', txId: settlementTx.id, createdAt: now.toISOString()
      };
      const newReconciliations = [reconciliation, ...(state.data.reconciliations || [])].slice(-200);
      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots || {}, txYear, txMonth);

      return {
        ...state,
        data: {
          ...state.data,
          transactions: newTxs,
          reconciliations: newReconciliations,
          monthlySnapshots: snapshots,
          auditLog: [
            buildAuditEntry(AUDIT.RECONCILE, 'account', accountKey, {
              before: { balance: computedBalance }, after: { balance: actualBalance },
              note: `مطابقة ${ACCOUNT_SHORT_NAMES[accountKey]}: الفرق ${fmt(diff)} ج.م`
            }),
            ...(state.data.auditLog || [])
          ].slice(0, 1000)
        }
      };
    }

    case 'TOGGLE_WALLET_VISIBILITY': return {
      ...state,
      walletVisibility: { ...state.walletVisibility, [action.payload]: !state.walletVisibility[action.payload] }
    };

    case 'CLEAR_AUDIT_LOG': return { ...state, data: { ...state.data, auditLog: [] } };

    default: return state;
  }
}

/* ═══════════════════════════════════════════════════════════════
   Force Save Hook
   ═══════════════════════════════════════════════════════════════ */
const FORCE_SAVE_STATES = { IDLE: 'idle', SAVING: 'saving', SUCCESS: 'success', ERROR: 'error' };

const useForceSave = ({ isAuthenticated, data, budgets, addNotification, dbRef, migrateData }) => {
  const [state, setState] = useState(FORCE_SAVE_STATES.IDLE);
  const [lastSaveAt, setLastSaveAt] = useState(null);
  const [lastError, setLastError] = useState(null);
  const busyRef = useRef(false);

  const forceSave = useCallback(async ({ silent = false } = {}) => {
    if (!isAuthenticated) {
      if (!silent) addNotification({ type: 'error', title: 'غير مصرح', message: 'يجب تسجيل الدخول' });
      setState(FORCE_SAVE_STATES.ERROR); setLastError('not_authenticated'); return false;
    }
    if (!data) {
      if (!silent) addNotification({ type: 'error', title: 'لا توجد بيانات' });
      setState(FORCE_SAVE_STATES.ERROR); return false;
    }
    if (busyRef.current) {
      if (!silent) addNotification({ type: 'info', title: 'العملية جارية بالفعل' });
      return false;
    }

    busyRef.current = true;
    setState(FORCE_SAVE_STATES.SAVING);
    setLastError(null);
    if (!silent) addNotification({ type: 'info', title: 'جاري الرفع للسحابة...', duration: 2000 });

    try {
      const docRef = dbRef;
      const payload = buildCloudPayload(data, budgets);
      await docRef.set(payload, { merge: false });
      try { localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now())); } catch (e) {}
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}

      setState(FORCE_SAVE_STATES.SUCCESS);
      setLastSaveAt(Date.now());
      if (!silent) {
        addNotification({
          type: 'success', title: '✅ تم الرفع للسحابة',
          message: `آخر مزامنة: ${new Date().toLocaleTimeString('ar-EG')}`, duration: 4000
        });
      }
      setTimeout(() => setState(FORCE_SAVE_STATES.IDLE), 3000);
      busyRef.current = false;
      return true;

    } catch (err) {
      console.error('Force save failed:', err);
      setState(FORCE_SAVE_STATES.ERROR);
      setLastError(err.message || 'خطأ غير معروف');

      let attempt = 0;
      const maxAttempts = 3;
      let lastErr = err;

      while (attempt < maxAttempts) {
        attempt++;
        await new Promise(r => setTimeout(r, 2000 * attempt));
        try {
          const docRef = dbRef;
          const payload = buildCloudPayload(data, budgets);
          await docRef.set(payload, { merge: false });
          try { localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now())); } catch (e) {}

          setState(FORCE_SAVE_STATES.SUCCESS);
          setLastSaveAt(Date.now());
          if (!silent) addNotification({ type: 'success', title: `✅ تم الرفع (محاولة ${attempt + 1})`, duration: 4000 });
          setTimeout(() => setState(FORCE_SAVE_STATES.IDLE), 3000);
          busyRef.current = false;
          return true;
        } catch (e) { lastErr = e; }
      }

      if (!silent) {
        addNotification({
          type: 'error', title: '❌ فشل الرفع بعد 3 محاولات',
          message: lastErr.message || 'تحقق من الاتصال', duration: 8000
        });
      }
      setTimeout(() => setState(FORCE_SAVE_STATES.IDLE), 5000);
      busyRef.current = false;
      return false;
    }
  }, [isAuthenticated, data, budgets, addNotification, dbRef]);

  return { forceSave, state, lastSaveAt, lastError };
};

/* ═══════════════ DATA INTEGRITY ═══════════════ */
const checkDataIntegrity = (data, transactions, cards, updatedLoans, liveBalances) => {
  const issues = [];
  const now = Date.now();
  const dayMs = 24 * 60 * 60 * 1000;

  const oldPending = transactions.filter(t => {
    if (t.status === 'paid') return false;
    const d = parseISODate(t.date);
    return d && (now - d.getTime()) > 30 * dayMs;
  });
  if (oldPending.length > 0) {
    issues.push({ severity: 'warning', title: `${oldPending.length} معاملة معلقة قديمة (+30 يوم)`, description: 'يفضل اعتمادها أو حذفها', action: 'transactions' });
  }

  const multiCarried = transactions.filter(t => (t.carryCount || 0) >= 2);
  if (multiCarried.length > 0) {
    issues.push({ severity: 'warning', title: `${multiCarried.length} قيد مرحّل أكثر من مرتين`, description: 'يجب معالجتها قبل أن تتكرر للأبد' });
  }

  const orphans = findOrphanTransfers(transactions);
  if (orphans.length > 0) {
    issues.push({ severity: 'danger', title: `${orphans.length} تحويل يتيم`, description: 'قيد واحد فقط موجود من تحويل مزدوج' });
  }

  const staleAccounts = ACCOUNT_KEYS.filter(k => {
    const lastUpd = data.accountsData?.[k]?.initialDate || data.accountsData?.[k]?.lastUpdated;
    if (!lastUpd) return true;
    const d = parseISODate(lastUpd);
    return d && (now - d.getTime()) > 30 * dayMs;
  });
  if (staleAccounts.length > 0) {
    issues.push({ severity: 'info', title: `${staleAccounts.length} حساب لم يُحدّث من 30+ يوم`, description: staleAccounts.map(k => ACCOUNT_SHORT_NAMES[k]).join('، ') });
  }

  const overusedCards = cards.filter(c => {
    const debt = computeCardDebt(data, c);
    const limit = safeNumber(c.limit);
    return limit > 0 && debt / limit > 0.8;
  });
  if (overusedCards.length > 0) {
    issues.push({ severity: 'warning', title: `${overusedCards.length} بطاقة استُخدمت أكثر من 80%`, description: overusedCards.map(c => `${c.bank} ${c.name}`).join('، ') });
  }

  const soonDue = updatedLoans.filter(l => {
    if (l.isReceivable || l.remaining <= 0) return false;
    const dueDay = safeNumber(l.dueDay, 1);
    const today = new Date();
    const next = new Date(today.getFullYear(), today.getMonth(), dueDay);
    if (next < today) next.setMonth(next.getMonth() + 1);
    return (next.getTime() - today.getTime()) < 7 * dayMs;
  });
  if (soonDue.length > 0) {
    issues.push({ severity: 'info', title: `${soonDue.length} قرض يستحق خلال 7 أيام`, description: soonDue.map(l => l.name).join('، ') });
  }

  const negativeAccounts = ACCOUNT_KEYS.filter(k => safeNumber(liveBalances[k]) < 0);
  if (negativeAccounts.length > 0) {
    issues.push({ severity: 'danger', title: `${negativeAccounts.length} حساب برصيد سالب`, description: negativeAccounts.map(k => ACCOUNT_SHORT_NAMES[k]).join('، ') });
  }

  const staleCarryover = transactions.filter(t => {
    if (t.source !== 'carryover' || t.status === 'paid') return false;
    const d = parseISODate(t.date);
    return d && (now - d.getTime()) > 60 * dayMs;
  });
  if (staleCarryover.length > 0) {
    issues.push({ severity: 'warning', title: `${staleCarryover.length} قيد مرحّل معلق لأكثر من 60 يوم`, description: 'يجب اتخاذ قرار بشأنه' });
  }

  const orphanReconciliations = (data.reconciliations || []).filter(rec => {
    if (!rec.txId) return false;
    return !transactions.some(t => t.id === rec.txId);
  });
  if (orphanReconciliations.length > 0) {
    issues.push({ severity: 'warning', title: `${orphanReconciliations.length} تسوية بدون قيد`, description: 'قد تكون تمّت إزالتها يدوياً' });
  }

  const penalties = { danger: 25, warning: 10, info: 3 };
  const totalPenalty = issues.reduce((s, i) => s + (penalties[i.severity] || 0), 0);
  const score = Math.max(0, 100 - totalPenalty);

  return { issues, score };
};

const applyMaterialization = (data, asOfDateStr) => {
  const updated = materializeRecurringItems(data, asOfDateStr);
  if (!updated) return null;
  const permanentDeleted = new Set(data.deletedTxIds || []);
  const filteredTx = updated.transactions.filter(t => !permanentDeleted.has(t.id));
  if (filteredTx.length !== updated.transactions.length) return { ...updated, transactions: filteredTx };
  return updated;
};

const verifySnapshot = (data, year, month) => {
  const monthKey = makeMonthKey(year, month);
  const stored = data.monthlySnapshots?.[monthKey];
  if (!stored) return { valid: false, reason: 'no_snapshot' };
  const computed = computeMonthSnapshot(data, year, month);
  if (!computed) return { valid: false, reason: 'compute_failed' };

  const diffs = [];
  ACCOUNT_KEYS.forEach(k => {
    const s = safeNumber(stored[k]);
    const c = safeNumber(computed[k]);
    if (Math.abs(s - c) > 0.005) diffs.push({ account: k, stored: s, computed: c, diff: c - s });
  });

  return { valid: diffs.length === 0, diffs, stored, computed, engineVersionMatch: stored.__v === CURRENT_ENGINE_VERSION };
};

const _modalResolvers = new Map();
let _modalIdCounter = 0;

const showInputModal = (opts) => new Promise((resolve) => {
  const id = ++_modalIdCounter;
  _modalResolvers.set(id, resolve);
  window.dispatchEvent(new CustomEvent('show-input-modal', { detail: { ...opts, _id: id } }));
});
const showConfirmModal = (opts) => new Promise((resolve) => {
  const id = ++_modalIdCounter;
  _modalResolvers.set(id, resolve);
  window.dispatchEvent(new CustomEvent('show-confirm-modal', { detail: { ...opts, _id: id } }));
});
const resolveModal = (id, value) => {
  const resolve = _modalResolvers.get(id);
  if (resolve) { _modalResolvers.delete(id); resolve(value); }
};
const clearAllModals = () => { _modalResolvers.forEach((resolve) => resolve(null)); _modalResolvers.clear(); };

const PromiseModalProvider = ({ children }) => {
  const [stack, setStack] = useState([]);
  const [inputValues, setInputValues] = useState({});

  useEffect(() => {
    const handleInput = (e) => setStack(s => [...s, { kind: 'input', ...e.detail }]);
    const handleConfirm = (e) => setStack(s => [...s, { kind: 'confirm', ...e.detail }]);
    window.addEventListener('show-input-modal', handleInput);
    window.addEventListener('show-confirm-modal', handleConfirm);
    return () => {
      window.removeEventListener('show-input-modal', handleInput);
      window.removeEventListener('show-confirm-modal', handleConfirm);
    };
  }, []);

  const current = stack[stack.length - 1];
  const dismiss = useCallback((value) => {
    if (!current) return;
    const id = current._id;
    setStack(s => s.slice(0, -1));
    resolveModal(id, value);
    setInputValues(prev => { if (!(id in prev)) return prev; const next = { ...prev }; delete next[id]; return next; });
  }, [current]);

  const inputValue = current?._id !== undefined ? (inputValues[current._id] ?? current.inputValue ?? '') : '';
  const setInputValue = useCallback((v) => {
    if (current?._id === undefined) return;
    setInputValues(prev => ({ ...prev, [current._id]: v }));
  }, [current?._id]);

  return (
    <React.Fragment>
      {children}
      {current?.kind === 'input' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-md animate-scaleIn">
            <div className="generic-modal-header">
              <h3 className="text-base font-black flex items-center gap-2">
                <span>{current.icon || '💬'}</span>{current.title}
              </h3>
              <button onClick={() => dismiss(null)} className="btn btn-ghost p-1.5"><X size={16} /></button>
            </div>
            <div className="generic-modal-body">
              {current.message && <p className="text-sm mb-3 whitespace-pre-line leading-relaxed" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>}
              <input
                autoFocus type="text"
                inputMode={current.numeric ? 'decimal' : 'text'}
                className="input-field input-num text-2xl text-center py-4"
                style={{ color: 'var(--accent)' }}
                value={inputValue}
                onChange={e => setInputValue(current.numeric ? e.target.value.replace(/[^\d.\-]/g, '') : e.target.value)}
                onKeyDown={e => {
                  if (e.key === 'Enter') {
                    const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim();
                    dismiss(v);
                  }
                }}
                placeholder={current.placeholder || ''}
              />
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => dismiss(null)} className="btn btn-secondary flex-1">إلغاء</button>
              <button onClick={() => { const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim(); dismiss(v); }} className="btn btn-primary flex-1">
                {current.confirmText || 'تأكيد'}
              </button>
            </div>
          </div>
        </div>
      )}
      {current?.kind === 'confirm' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-sm animate-scaleIn">
            <div className="generic-modal-body text-center">
              <div className={`w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center text-3xl ${current.danger ? 'bg-red-50 dark:bg-red-950/40' : 'bg-blue-50 dark:bg-blue-950/40'}`}>
                {current.icon || (current.danger ? '⚠️' : '❓')}
              </div>
              <h3 className="text-base font-black mb-2">{current.title}</h3>
              <p className="text-sm leading-relaxed mb-2 whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => dismiss(false)} className="btn btn-secondary flex-1">إلغاء</button>
              <button onClick={() => dismiss(true)} className="btn flex-1" style={{ background: current.danger ? 'var(--danger)' : 'var(--accent)', color: 'white' }}>
                {current.confirmText || 'تأكيد'}
              </button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
};

const AnimatedNumber = memo(({ value, duration = 600, decimals = 2, prefix = '', suffix = '', className = '' }) => {
  const [display, setDisplay] = useState(0);
  const rafRef = useRef(null);
  const startRef = useRef(null);
  const startValRef = useRef(0);

  useEffect(() => {
    const target = safeNumber(value);
    const startVal = display;
    startValRef.current = startVal;
    const diff = target - startVal;
    if (Math.abs(diff) < 0.005) { setDisplay(target); return; }
    startRef.current = performance.now();
    const animate = (now) => {
      const elapsed = now - startRef.current;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setDisplay(startValRef.current + diff * eased);
      if (progress < 1) rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [value, duration]);

  return (
    <span className={`money ${className}`}>
      {prefix}{display.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}{suffix}
    </span>
  );
});

      <Icon size={18} className="flex-shrink-0 mt-0.5" />
      <div className="flex-1 min-w-0">

const groupTransactionsByDate = (list) => {
  const groups = {};
  (list || []).forEach(t => {
    const d = t.date || 'unknown';
    if (!groups[d]) groups[d] = [];
    groups[d].push(t);
  });
  const today = getLocalISODate();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const yestISO = getLocalISODate(yest);

  return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
    const sortedItems = [...groups[date]].sort(compareTransactions);
    let label;
    if (date === today) label = '📅 النهاردة';
    else if (date === yestISO) label = '📅 امبارح';
    else {
      const dObj = parseISODate(date);
      if (dObj) {
        const ds = dObj.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' });
        const ys = dObj.getFullYear() !== new Date().getFullYear() ? ' ' + dObj.getFullYear() : '';
        label = '📅 ' + ds + ys;
      } else label = '📅 ' + date;
    }
    const total = sortedItems.reduce((s, t) => s + safeNumber(t.amount), 0);
    return { date, label, items: sortedItems, total };
  });
};

const PinLockScreen = ({ onSuccess, onLogout }) => {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const [success, setSuccess] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const [lastPressed, setLastPressed] = useState(null);
  const pressTimerRef = useRef(null);
  const clearTimerRef = useRef(null);
  const navTimerRef = useRef(null);

  useEffect(() => () => {
    if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
    if (navTimerRef.current) clearTimeout(navTimerRef.current);
  }, []);

  const handleDigit = (d) => {
    if (pin.length >= 4 || success) return;
    const next = pin + d;
    setPin(next);
    setLastPressed(d);
    if (navigator.vibrate) navigator.vibrate(8);
    if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    pressTimerRef.current = setTimeout(() => setLastPressed(null), 150);
    if (next.length === 4) {
      if (navTimerRef.current) clearTimeout(navTimerRef.current);
      navTimerRef.current = setTimeout(async () => {
        const ok = await verifyPin(next);
        if (ok) {
          setSuccess(true);
          if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
          try { await savePinSession(next); } catch (e) {}
          if (navTimerRef.current) clearTimeout(navTimerRef.current);
          navTimerRef.current = setTimeout(() => onSuccess(next), 450);
        } else {
          setError(true);
          if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
          setAttempts(a => a + 1);
          if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
          clearTimerRef.current = setTimeout(() => { setPin(''); setError(false); }, 650);
        }
      }, 150);
    }
  };
  const handleDelete = () => { if (!success) setPin(p => p.slice(0, -1)); };

  return (
    <div className="min-h-screen flex items-center justify-center p-6 relative overflow-hidden" style={{ background: 'linear-gradient(135deg, #050A14 0%, #0A1628 40%, #1E2B4A 100%)' }}>
      <div className={`relative w-full max-w-sm ${error ? 'animate-shake' : ''}`}>
        <div className="flex flex-col items-center mb-8">
          <div className={`w-20 h-20 rounded-3xl flex items-center justify-center mb-5 transition-all duration-500 ${success ? 'bg-emerald-500 scale-110 shadow-2xl shadow-emerald-500/40' : error ? 'bg-red-500/20 border-2 border-red-500/30' : 'bg-[rgba(99,91,255,0.15)] border-2 border-[rgba(99,91,255,0.3)]'}`}>
            {success ? <CheckCircle2 size={32} className="text-white" /> : error ? <AlertTriangle size={30} className="text-red-400" /> : <Lock size={30} className="text-[#8B84FF]" />}
          </div>
          <h1 className="text-2xl font-black text-white mb-1.5">{success ? 'مرحباً ✓' : error ? 'رمز غير صحيح' : 'أهلاً بعودتك'}</h1>
          <p className="text-xs font-medium" style={{ color: '#64748B' }}>{success ? 'جارٍ الفتح...' : error ? `المحاولة ${attempts}` : 'أدخل رمز الدخول'}</p>
        </div>
        <div className="flex justify-center gap-3 mb-8 h-4">
          {[0, 1, 2, 3].map(i => (
            <div key={i} className={`w-3 h-3 rounded-full transition-all duration-300 ${success ? 'bg-emerald-400 scale-125' : error ? 'bg-red-500 scale-110' : pin.length > i ? 'bg-[#8B84FF] scale-125' : 'bg-transparent border-2 border-slate-600'}`}></div>
          ))}
        </div>
        <div className="grid grid-cols-3 gap-3 mb-6">
          {['1','2','3','4','5','6','7','8','9'].map(d => (
            <button key={d} type="button" onClick={() => handleDigit(d)}
              className={`aspect-square rounded-2xl font-black text-xl transition-all duration-100 active:scale-90 select-none ${lastPressed === d ? 'bg-[#635BFF] text-white scale-95' : 'bg-white/[0.05] border border-white/[0.08] text-white hover:bg-white/[0.1]'}`}>
              {d}
            </button>
          ))}
          <div className="aspect-square"></div>
          <button type="button" onClick={() => handleDigit('0')}
            className={`aspect-square rounded-2xl font-black text-xl transition-all duration-100 active:scale-90 select-none ${lastPressed === '0' ? 'bg-[#635BFF] text-white scale-95' : 'bg-white/[0.05] border border-white/[0.08] text-white hover:bg-white/[0.1]'}`}>
            0
          </button>
          <button type="button" onClick={handleDelete} className="aspect-square rounded-2xl flex items-center justify-center transition-all active:scale-90" style={{ color: '#64748B' }}>
            <Delete size={20} />
          </button>
        </div>
        <button type="button" onClick={onLogout} className="w-full py-3 text-xs font-bold flex items-center justify-center gap-2 transition-colors" style={{ color: '#64748B' }}>
          <LogOut size={14} /> تسجيل الخروج
        </button>
        <button type="button" onClick={() => {
          if (window.confirm('هل تريد إعادة تعيين الرمز؟ ستحتاج إعادة تسجيل الدخول.')) {
            localStorage.removeItem(PIN_HASH_KEY);
            sessionStorage.removeItem(PIN_SESSION_KEY);
            onLogout();
          }
        }} className="w-full py-2 text-[10px] font-bold" style={{ color: '#64748B' }}>
          نسيت الرمز؟ إعادة تعيين
        </button>
      </div>
    </div>
  );
};

const PinChangeModal = ({ onClose, addNotification }) => {
  const [current, setCurrent] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (!/^\d{4}$/.test(next)) { addNotification({ type: 'error', title: 'الرمز الجديد لازم 4 أرقام' }); return; }
    if (next !== confirm) { addNotification({ type: 'error', title: 'الرمز الجديد مش متطابق' }); return; }
    setBusy(true);
    try {
      const ok = await verifyPin(current);
      if (!ok) { addNotification({ type: 'error', title: 'الرمز الحالي غير صحيح' }); setBusy(false); return; }
      await savePinHash(next);
      try { await savePinSession(next); } catch (e) {}
      addNotification({ type: 'success', title: 'تم تغيير الرمز بنجاح' });
      setBusy(false);
      onClose();
    } catch (e) { addNotification({ type: 'error', title: 'فشل', message: e.message }); setBusy(false); }
  };
  return (
    <Modal isOpen={true} onClose={onClose} title="تغيير رمز الدخول" icon="🔐">
      <div className="space-y-3">
        <div>
          <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الرمز الحالي</label>
          <input type="password" inputMode="numeric" maxLength={4} className="input-field input-num text-center text-lg tracking-widest" value={current} onChange={e => setCurrent(e.target.value.replace(/\D/g, ''))} />
        </div>
        <div>
          <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الرمز الجديد</label>
          <input type="password" inputMode="numeric" maxLength={4} className="input-field input-num text-center text-lg tracking-widest" value={next} onChange={e => setNext(e.target.value.replace(/\D/g, ''))} />
        </div>
        <div>
          <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>تأكيد الرمز الجديد</label>
          <input type="password" inputMode="numeric" maxLength={4} className="input-field input-num text-center text-lg tracking-widest" value={confirm} onChange={e => setConfirm(e.target.value.replace(/\D/g, ''))} />
        </div>
        <button onClick={submit} disabled={busy} className="btn btn-primary w-full py-2.5 text-sm">{busy ? 'جاري الحفظ...' : 'حفظ'}</button>
      </div>
    </Modal>
  );
};

const SmsParserModal = memo(({ isOpen, onClose, dispatch, addNotification, saveHistory, data }) => {
  const [rawText, setRawText] = useState('');
  const [parsed, setParsed] = useState(null);
  const [category, setCategory] = useState('');
  const [method, setMethod] = useState('cash');
  const [manualAmount, setManualAmount] = useState('');

  useEffect(() => {
    if (!isOpen) { setRawText(''); setParsed(null); setCategory(''); setMethod('cash'); setManualAmount(''); }
  }, [isOpen]);

  const handlePaste = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.readText) {
        const txt = await navigator.clipboard.readText();
        if (txt && txt.trim()) { setRawText(txt); addNotification({ type: 'success', title: 'تم اللصق', duration: 2000 }); return; }
      }
      addNotification({ type: 'info', title: 'الصق الرسالة يدوياً في الصندوق' });
    } catch (e) { addNotification({ type: 'info', title: 'الصق الرسالة يدوياً في الصندوق' }); }
  };

  const handleAnalyze = () => {
    if (!rawText.trim()) { addNotification({ type: 'error', title: 'الصق رسالة البنك أولاً' }); return; }
    const res = parseBankSms(rawText);
    setParsed(res);
    if (res.method) setMethod(res.method);
    if (res.amount > 0) setManualAmount(String(res.amount));
    if (res.ok) {
      const cardInfo = res.cardLabel ? ` • ${res.cardLabel}` : '';
      addNotification({ type: 'success', title: `تم التحليل: ${fmt(res.amount)} ج.م`, message: `${res.type === 'income' ? 'دخل' : 'مصروف'} • ${res.bank || 'بنك'}${cardInfo}`, duration: 5000 });
    } else {
      addNotification({ type: 'warning', title: 'تحليل جزئي', message: res.notes.join(' • ') });
    }
  };

  const handleSave = () => {
    const amt = parseNumberInput(manualAmount);
    if (!amt || amt <= 0) { addNotification({ type: 'error', title: 'أدخل مبلغ صالح' }); return; }
    if (!category) { addNotification({ type: 'error', title: 'اختر الفئة' }); return; }
    const d = parseISODate(parsed.date) || new Date();
    const year = d.getFullYear();
    const month = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, year, month)) { addNotification({ type: 'error', title: `شهر ${month} ${year} مغلق`, message: 'افتح الشهر أو غيّر التاريخ' }); return; }
    saveHistory();
    const newTx = {
      id: getSafeId(), type: parsed.type, subType: parsed.subType, kind: KIND.OPERATIONAL,
      category, amount: roundMoney(amt),
      description: parsed.description || 'SMS import',
      method, date: parsed.date, month, year, monthIndex: d.getMonth(),
      status: 'pending', source: 'sms', smsRawText: parsed.rawText, smsBank: parsed.bank,
      linkedCardId: parsed.linkedCardId || undefined,
      cardLast4: parsed.last4 || undefined,
      accountKind: parsed.accountKind || undefined,
      createdAt: new Date().toISOString()
    };
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: sortTransactions([newTx, ...(data.transactions || [])]) });
    addNotification({ type: 'success', title: 'تم الحفظ كمعلق', message: 'راجعها واعتمدها من صفحة المعاملات', duration: 5000 });
    onClose();
  };

  if (!isOpen) return null;

  return (
    <Modal isOpen={true} onClose={onClose} title="تحليل رسالة بنك" icon="📱" size="lg">
      <div className="space-y-3">
        <div>
          <div className="flex justify-between items-center mb-1.5">
            <label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الصق رسالة البنك هنا</label>
            <button type="button" onClick={handlePaste} className="text-[11px] font-black text-[color:var(--accent)] flex items-center gap-1">📋 لصق تلقائي</button>
          </div>
          <textarea className="input-field text-xs leading-relaxed font-semibold" rows={6}
            placeholder="مثال: CIB: Purchase of EGP 1500.00 on card ending 9380 at CARREFOUR on 17/09/2026"
            value={rawText} onChange={e => setRawText(e.target.value)} dir="auto" />
          <p className="text-[10px] mt-1.5 leading-relaxed" style={{ color: 'var(--text-muted)' }}>
            💡 يدعم: 1016 (Titanium) • 9380/9352/2014 (فرعية) • 3391 (Signature) • 2017 (SWYPE) • 1809 (CIB Saving) • 2106 (AAIB Saving)
            <br />🛡️ يرفض رسائل OTP تلقائياً
          </p>
        </div>
        <button type="button" onClick={handleAnalyze} disabled={!rawText.trim()} className="btn btn-primary w-full py-2.5 text-sm">
          <Sparkles size={14} /> حلّل الرسالة
        </button>

const CategoryDetailModal = memo(({ category, transactions, selectedMonth, selectedYear, dispatch, addNotification }) => {
  const [filterType, setFilterType] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');
  const [exporting, setExporting] = useState(false);
  const containerRef = useRef(null);

  const categoryTx = useMemo(() => transactions.filter(t =>
    t.category === category && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).sort(compareTransactions), [transactions, category, selectedMonth, selectedYear]);

  const filteredTx = useMemo(() => {
    let arr = categoryTx;
    if (filterType === 'paid') arr = arr.filter(t => t.status === 'paid');
    if (filterType === 'pending') arr = arr.filter(t => t.status !== 'paid');
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.method).includes(term));
    }
    return arr;
  }, [categoryTx, filterType, searchTerm]);

  const stats = useMemo(() => {
    const paid = categoryTx.filter(t => t.status === 'paid');
    const pending = categoryTx.filter(t => t.status !== 'paid');
    const totalPaid = paid.reduce((s, t) => s + safeNumber(t.amount), 0);
    const totalPending = pending.reduce((s, t) => s + safeNumber(t.amount), 0);
    const count = categoryTx.length;
    const average = count > 0 ? (totalPaid + totalPending) / count : 0;
    const methods = {};
    categoryTx.forEach(t => { methods[t.method] = (methods[t.method] || 0) + safeNumber(t.amount); });
    return { totalPaid, totalPending, total: totalPaid + totalPending, count, paidCount: paid.length, pendingCount: pending.length, average, methods };
  }, [categoryTx]);

  const dailyGroups = useMemo(() => groupTransactionsByDate(filteredTx), [filteredTx]);

  const handlePrint = () => {
    const printWindow = window.open('', '_blank', 'width=900,height=700');
    if (!printWindow) { addNotification({ type: 'error', title: 'المتصفح منع الطباعة' }); return; }
    const html = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>${category} — ${selectedMonth} ${selectedYear}</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><style>* { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: 'Cairo', sans-serif; padding: 24px; color: #0A1628; background: white; } .header { text-align: center; padding-bottom: 16px; border-bottom: 3px solid #635BFF; margin-bottom: 20px; } .header h1 { font-size: 22px; font-weight: 900; color: #4A42E5; margin-bottom: 4px; } .header p { font-size: 13px; color: #475569; font-weight: 600; } .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; } .stat-box { background: #F1F5F9; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #E2E8F0; } .stat-box .label { font-size: 11px; font-weight: 700; color: #64748B; margin-bottom: 4px; } .stat-box .value { font-size: 16px; font-weight: 900; color: #0A1628; font-variant-numeric: tabular-nums; } .stat-box.green .value { color: #00A86B; } .stat-box.amber .value { color: #F59E0B; } table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; } th { background: #635BFF; color: white; padding: 10px 8px; text-align: right; font-weight: 700; } td { padding: 8px; border-bottom: 1px solid #E2E8F0; font-variant-numeric: tabular-nums; } tr:nth-child(even) td { background: #F8FAFC; } .footer { margin-top: 30px; padding-top: 12px; border-top: 2px dashed #CBD5E1; text-align: center; font-size: 10px; color: #94A3B8; } .day-header-row td { background: #EEEDFF !important; font-weight: 900; color: #4A42E5; font-size: 11px; padding: 6px 8px; }</style></head><body><div class="header"><h1>📊 ${escapeHtml(category)}</h1><p>${selectedMonth} ${selectedYear} • تم التوليد: ${new Date().toLocaleString('ar-EG')}</p></div><div class="stats"><div class="stat-box green"><div class="label">الإجمالي (معتمد)</div><div class="value">${fmt(stats.totalPaid)} ج.م</div></div><div class="stat-box amber"><div class="label">معلق</div><div class="value">${fmt(stats.totalPending)} ج.م</div></div><div class="stat-box"><div class="label">عدد المعاملات</div><div class="value">${stats.count}</div></div><div class="stat-box"><div class="label">المتوسط</div><div class="value">${fmt(stats.average)} ج.م</div></div></div><table><thead><tr><th>التاريخ</th><th>الوصف</th><th style="text-align: left;">المبلغ</th></tr></thead><tbody>${dailyGroups.map(group => `<tr class="day-header-row"><td colspan="3">${escapeHtml(group.label)} — ${fmt(group.total)} ج.م (${group.items.length})</td></tr>${group.items.map(t => `<tr><td>${escapeHtml(t.date)}</td><td>${escapeHtml(getTxDisplayText(t))}</td><td class="amount-${t.type === 'income' ? 'income' : 'expense'}" style="text-align: left;">${t.type === 'income' ? '+' : '−'}${fmt(t.amount)}</td></tr>`).join('')}`).join('')}</tbody></table><div class="footer">💼 المحفظة الذكية — تقرير تفصيلي لفئة ${escapeHtml(category)} • إجمالي: ${fmt(stats.total)} ج.م</div><script>window.onload = () => { setTimeout(() => { window.print(); }, 300); };<\/script></body></html>`;
    printWindow.document.write(html);
    printWindow.document.close();
  };

  const handleExportPdf = async () => {
    if (!containerRef.current || exporting) return;
    if (categoryTx.length === 0) { addNotification({ type: 'warning', title: 'لا توجد معاملات للتصدير' }); return; }
    if (!window.html2pdf) { addNotification({ type: 'error', title: 'تعذّر تحميل مكتبة PDF' }); return; }
    setExporting(true);
    try {
      const element = containerRef.current.cloneNode(true);
      element.querySelectorAll('[data-pdf-hide="true"]').forEach(el => el.remove());
      element.querySelectorAll('.scroll-hide, .pdf-expand').forEach(el => { el.style.maxHeight = 'none'; el.style.overflow = 'visible'; });
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'background:white;padding:20px;font-family:Cairo,sans-serif;direction:rtl;';
      wrapper.innerHTML = `<div style="text-align:center;padding-bottom:12px;border-bottom:3px solid #635BFF;margin-bottom:16px;"><h1 style="font-size:20px;font-weight:900;color:#4A42E5;margin:0 0 4px;">📊 ${escapeHtml(category)}</h1><p style="font-size:12px;color:#475569;font-weight:600;margin:0;">${selectedMonth} ${selectedYear} • ${new Date().toLocaleDateString('ar-EG')}</p></div>`;
      wrapper.appendChild(element);
      const opt = { margin: [10, 8, 10, 8], filename: `فئة_${category.replace(/[\/\\:*?"<>|]/g, '_')}_${selectedMonth}_${selectedYear}.pdf`, image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } };
      await window.html2pdf().set(opt).from(wrapper).save();
      addNotification({ type: 'success', title: 'تم تصدير PDF', message: `${filteredTx.length} معاملة` });
    } catch (e) { console.error('PDF Error:', e); addNotification({ type: 'error', title: 'فشل التصدير', message: e.message }); }
    finally { setExporting(false); }

  const close = () => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: null });

  return (
    <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) close(); }}>

            <div className="p-2 rounded-lg flex-shrink-0" style={{ background: `${CATEGORY_COLORS[category] || '#635BFF'}20`, color: CATEGORY_COLORS[category] || '#635BFF' }}>

            </div>
            <div className="min-w-0">
              <h3 className="text-base font-black truncate">{category}</h3>
              <p className="text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} • {stats.count} معاملة</p>

          </div>
