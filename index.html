const inferKind = (tx) => {
  if (tx.kind) return tx.kind;
  if (tx.category === 'أخرى' && (tx.description || '').includes('تسوية')) return KIND.ADJUSTMENT;
  if (FINANCIAL_CATEGORIES.has(tx.category)) return KIND.FINANCIAL;
  return KIND.OPERATIONAL;
};

const isMonthClosed = (data, year, month) => {
  const key = makeMonthKey(year, month);
  return Array.isArray(data?.closedMonths) && data.closedMonths.includes(key);
};

const invalidateSnapshotsFrom = (snapshots, year, month) => {
  const startIdx = getMonthIndex(month);
  if (startIdx < 0) return { snapshots: snapshots || {}, invalidated: 0 };
  const newSnaps = { ...(snapshots || {}) };
  let invalidated = 0;
  Object.keys(newSnaps).forEach(key => {
    const parsedKey = parseMonthKey(key);
    if (!parsedKey) { delete newSnaps[key]; invalidated++; return; }
    if (parsedKey.year > year || (parsedKey.year === year && getMonthIndex(parsedKey.month) >= startIdx)) { delete newSnaps[key]; invalidated++; }
  });
  return { snapshots: newSnaps, invalidated };
};

const getAccountCutoff = (accountsData, key) => {
  const iso = accountsData?.[key]?.lastUpdated;
  if (!iso) return new Date(0);
  const d = new Date(iso);
  return isNaN(d) ? new Date(0) : d;
};

const computeBalance = (data, key, asOfDate) => {
  const accountsData = data?.accountsData || DEFAULT_ACCOUNTS;
  const base = safeNumber(accountsData[key]?.balance);
  const cutoffDay = dayStart(getAccountCutoff(accountsData, key));
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();
  const backward = upper < cutoffDay;
  let bal = base;
  (data?.transactions || []).forEach(t => {
    if (t.status !== 'paid' || t.method !== key) return;
    const d = new Date(t.date);
    if (isNaN(d)) return;
    const amt = safeNumber(t.amount);
    const signed = (t.subType === 'deposit') ? amt : -amt;
    if (backward) { if (d > upper && d < cutoffDay) bal -= signed; }
    else { if (d >= cutoffDay && d <= upper) bal += signed; }
  });
  return bal;
};

const getClosingBalance = (data, key, year, month) => {
  const monthKey = makeMonthKey(year, month);
  const snap = data?.monthlySnapshots?.[monthKey]?.[key];
  if (snap !== undefined && snap !== null) return safeNumber(snap);
  const monthIdx = getMonthIndex(month);
  if (monthIdx < 0) return computeBalance(data, key);
  const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
  return computeBalance(data, key, monthEnd);
};

const getOpeningBalance = (data, key, year, month) => {
  const idx = getMonthIndex(month);
  if (idx <= 0) return getClosingBalance(data, key, year - 1, 'ديسمبر');
  return getClosingBalance(data, key, year, ALL_MONTHS[idx - 1]);
};

const deriveDefaultCutoff = (txs) => {
  const dates = (txs || []).filter(t => t.status === 'paid' && t.date).map(t => t.date).sort();
  if (dates.length === 0) return '2026-08-31';
  const d = new Date(dates[0]);
  d.setDate(d.getDate() - 1);
  return getLocalISODate(d);
};

const migrateCards = (cards) => {
  if (!Array.isArray(cards)) return DEFAULT_CARDS;
  return cards.map(c => {
    if (c.openingDebt !== undefined && c.availableBalance !== undefined) return c;
    const limit = safeNumber(c.limit);
    const oldOpening = safeNumber(c.openingBalance);
    return { ...c, openingDebt: Math.max(0, limit - oldOpening), availableBalance: oldOpening };
  });
};

const migrateSnapshotsAndClosed = (snapshots, closedMonths) => {
  let snaps = snapshots && typeof snapshots === 'object' ? { ...snapshots } : {};
  let closed = Array.isArray(closedMonths) ? [...closedMonths] : [];
  if (Object.keys(snaps).length > 0 && !Object.keys(snaps).every(k => /^\d{4}-/.test(k))) {
    const migrated = {};
    Object.entries(snaps).forEach(([month, val]) => {
      if (/^\d{4}-/.test(month)) migrated[month] = val;
      else migrated[makeMonthKey(2026, month)] = (typeof val === 'object' && val !== null) ? val : { cash: safeNumber(val) };
    });
    snaps = migrated;
  }
  if (closed.length > 0 && !closed.every(k => /^\d{4}-/.test(k))) {
    closed = closed.map(m => /^\d{4}-/.test(m) ? m : makeMonthKey(2026, m));
  }
  return { snapshots: snaps, closedMonths: closed };
};

const migrateTransaction = (t) => {
  if (!t) return t;
  const kind = inferKind(t);
  let year = t.year, month = t.month, monthIndex = t.monthIndex;
  if (t.date && (!month || !year)) {
    const d = new Date(t.date);
    if (!isNaN(d)) { if (!year) year = d.getFullYear(); if (!month) month = ALL_MONTHS[d.getMonth()]; }
  }
  if (!year) year = 2026;
  if (monthIndex === undefined || monthIndex === null || monthIndex < 0) monthIndex = getMonthIndex(month);
  if (monthIndex < 0 && month) {
    const norm = ALL_MONTHS.find(m => normalizeText(m) === normalizeText(month));
    if (norm) { month = norm; monthIndex = getMonthIndex(norm); }
  }
  return { ...t, kind, year, month, monthIndex };
};

    }
  });

  const withReceivable = (loans || []).map(l => {
    if (l && l.name && l.name.includes('تكييف محمود') && !l.isReceivable) return { ...l, isReceivable: true, type: 'receivable', interest: 'مستحق لنا شهرياً' };
    return l;
  });

  const normalizedLoans = withReceivable.map(l => {
    if (l && l.name && l.name.includes('مسحوبات محل هاني') && !l.autoMonthly) {
      return { id: l.id || 15, name: 'مسحوبات محل هاني', autoMonthly: true, dueNextMonth: true, mergeIntoNextCycle: ['2026-أغسطس'], category: 'مسحوبات محل هاني', totalAmount: 0, prePaidAmount: 0, monthlyInstallment: 0, dueDay: 5, interest: 'مستحق شهري', description: 'مسحوبات يومية — تُحسب تلقائياً من قيود الشهر', type: 'debt' };
    }
    if (l && l.autoMonthly && !l.mergeIntoNextCycle) return { ...l, mergeIntoNextCycle: ['2026-أغسطس'] };
    return l;
  });

  let recurringItems = recurring;
  if (!parsed.recurringInitialized && recurring.length === 0) recurringItems = DEFAULT_RECURRING;
  recurringItems = (recurringItems || []).map(r => {
    if (r && r.title && r.title.includes('تكييف محمود') && r.type !== 'income') return { ...r, type: 'income', title: r.title.replace(/\s*\(دخل\)\s*$/, '') + ' (دخل)' };
    return r;
  });

  const { openingBalance2026: _drop, ...rest } = parsed;

  return {
    ...rest,
    engineVersion: CURRENT_ENGINE_VERSION,
    recurringInitialized: true,
    cards: (!hasSig || !hasSWYPE || cards.length < 3) ? DEFAULT_CARDS : migrateCards(cards),
    loans: (!hasTakyeef || !hasHany) ? DEFAULT_LOANS : normalizedLoans,
    recurringItems,
    closedMonths,
    monthlySnapshots: snapshots,
    transactions,
    accountsData,
    monthlyPlans: parsed.monthlyPlans && typeof parsed.monthlyPlans === 'object' ? { ...DEFAULT_MONTHLY_PLANS, ...parsed.monthlyPlans } : DEFAULT_MONTHLY_PLANS,
    materializedRecurring: parsed.materializedRecurring && typeof parsed.materializedRecurring === 'object' ? parsed.materializedRecurring : {},
    notifiedItems: parsed.notifiedItems && typeof parsed.notifiedItems === 'object' ? parsed.notifiedItems : {}
  };
};

const DuplicateDetectionSystem = ({ transactions, data, dispatch, addNotification, saveHistory }) => {
  const [threshold, setThreshold] = useState(2);
  const [selectedMonth, setSelectedMonth] = useState('all');
  const [expandedGroups, setExpandedGroups] = useState({});
  const duplicates = useMemo(() => {
    const map = {};
    const filtered = selectedMonth === 'all' ? transactions : transactions.filter(t => t.month === selectedMonth);
    filtered.forEach(t => {
      const key = `${safeNumber(t.amount)}_${t.method}_${t.category}_${(t.date||'').slice(0,10)}`;
      if (!map[key]) map[key] = [];
      map[key].push(t);
    });
    return Object.entries(map).filter(([_, items]) => items.length >= threshold).map(([key, items]) => ({ key, amount: items[0].amount, count: items.length, items, category: items[0].category, risk: items.length >= 5 ? 'high' : items.length >= 3 ? 'medium' : 'low' }));
  }, [transactions, threshold, selectedMonth]);
  const doDelete = (ids, protectedCount) => {
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'تأكيد الحذف', message: `سيتم حذف ${ids.length} عملية مكررة.${protectedCount > 0 ? ` تم تجاهل ${protectedCount} في أشهر مغلقة.` : ''}`, onConfirm: () => { saveHistory(); dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.filter(t => !ids.includes(t.id)) }); addNotification({ type: 'success', title: 'تم التنظيف' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  };
  const handleDeleteAll = () => {
    let idsToDelete = [], protectedCount = 0;
    duplicates.forEach(d => { d.items.slice(1).forEach(item => { if (isMonthClosed(data, item.year || 2026, item.month)) protectedCount++; else idsToDelete.push(item.id); }); });
    if (idsToDelete.length === 0) { addNotification({ type: protectedCount > 0 ? 'error' : 'info', title: protectedCount > 0 ? 'محظور' : 'لا يوجد' }); return; }
    doDelete(idsToDelete, protectedCount);
  };
  const deleteSingle = (item) => {
    if (isMonthClosed(data, item.year || 2026, item.month)) { addNotification({ type: 'error', title: 'محظور', message: 'الشهر مغلق' }); return; }
    doDelete([item.id], 0);
  };
  return (
    <div className="space-y-8 animate-fadeIn pb-20">
      <div className="glass p-8 rounded-2xl flex justify-between items-center mb-6 flex-wrap gap-4">
        <div><h2 className="text-2xl font-black flex items-center gap-3"><Filter className="text-blue-500" /> كاشف التكرار الذكي</h2><p className="text-slate-500 mt-1 text-sm font-bold">مفتاح: المبلغ + الطريقة + الفئة + التاريخ ({threshold} أو أكثر)</p></div>
        <button onClick={handleDeleteAll} disabled={duplicates.length === 0} className={`px-6 py-3 rounded-xl font-bold flex items-center gap-2 ${duplicates.length === 0 ? 'bg-slate-100 text-slate-500' : 'gradient-bg-danger text-white shadow-lg'}`}><Trash2 size={18} /> تنظيف السجل</button>
      </div>
      <div className="glass p-6 rounded-2xl grid grid-cols-1 md:grid-cols-2 gap-8">
        <div><label className="block text-xs font-black mb-3 opacity-50 uppercase">نطاق البحث</label>
          <select className="input-field" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}>
            <option value="all">جميع الشهور</option>
            {YEARS_LIST.flatMap(y => getMonthsForYear(y).map(m => <option key={makeMonthKey(y,m)} value={m}>{m} {y}</option>))}
          </select></div>

const MonthComparisonView = memo(({ transactions, selectedYear, selectedMonth }) => {
  const idx = getMonthIndex(selectedMonth);
  const prevMonth = idx > 0 ? ALL_MONTHS[idx - 1] : 'ديسمبر';
  const prevYear = idx > 0 ? selectedYear : selectedYear - 1;
  const curTx = transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
  const prevTx = transactions.filter(t => t.month === prevMonth && (t.year || 2026) === prevYear);
  const calc = (txs, type) => txs.filter(t => t.type === type && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
  const curInc = calc(curTx, 'income'), curExp = calc(curTx, 'expense');
  const prevInc = calc(prevTx, 'income'), prevExp = calc(prevTx, 'expense');
  const pct = (cur, prev) => prev === 0 ? (cur > 0 ? 100 : 0) : Math.round(((cur - prev) / prev) * 100);
  const catData = {};
  curTx.filter(t => t.status === 'paid').forEach(t => { if (!catData[t.category]) catData[t.category] = { cur: 0, prev: 0, type: t.type }; catData[t.category].cur += safeNumber(t.amount); });
  prevTx.filter(t => t.status === 'paid').forEach(t => { if (!catData[t.category]) catData[t.category] = { cur: 0, prev: 0, type: t.type }; catData[t.category].prev += safeNumber(t.amount); });
  const catRows = Object.entries(catData).map(([cat, d]) => ({ cat, cur: d.cur, prev: d.prev, change: pct(d.cur, d.prev), type: d.type })).sort((a, b) => Math.abs(b.cur - b.prev) - Math.abs(a.cur - a.prev));
  return (
    <div className="space-y-6 animate-fadeIn pb-24">
      <div className="glass p-8 rounded-2xl">
        <h2 className="text-3xl font-black flex items-center gap-3"><Activity className="text-indigo-500" size={32} /> مقارنة الشهور</h2>
        <p className="text-slate-500 mt-2 font-bold">{selectedMonth} {selectedYear} مقارنة بـ {prevMonth} {prevYear}</p>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div className={`glass p-6 rounded-2xl border-r-4 ${curInc >= prevInc ? 'border-r-emerald-500' : 'border-r-red-500'}`}>
          <p className="text-[11px] font-bold text-slate-500 uppercase">الدخل</p>
          <p className="text-2xl font-black text-emerald-600 mt-2">{fmt(curInc)} ج.م</p>
          <p className="text-xs text-slate-500 mt-1">السابق: {fmt(prevInc)} ج.م</p>
          <span className={`inline-block mt-2 px-3 py-1 rounded-full text-xs font-black ${curInc >= prevInc ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
            {curInc >= prevInc ? '↑' : '↓'} {Math.abs(pct(curInc, prevInc))}%
          </span>
        </div>
        <div className={`glass p-6 rounded-2xl border-r-4 ${curExp <= prevExp ? 'border-r-emerald-500' : 'border-r-red-500'}`}>
          <p className="text-[11px] font-bold text-slate-500 uppercase">المصروفات</p>
          <p className="text-2xl font-black text-red-600 mt-2">{fmt(curExp)} ج.م</p>
          <p className="text-xs text-slate-500 mt-1">السابق: {fmt(prevExp)} ج.م</p>
          <span className={`inline-block mt-2 px-3 py-1 rounded-full text-xs font-black ${curExp <= prevExp ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
            {curExp <= prevExp ? '↓' : '↑'} {Math.abs(pct(curExp, prevExp))}%
          </span>
        </div>
        <div className="glass p-6 rounded-2xl border-r-4 border-r-blue-500">
          <p className="text-[11px] font-bold text-slate-500 uppercase">الصافي</p>
          <p className={`text-2xl font-black mt-2 ${curInc - curExp >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(curInc - curExp)} ج.م</p>
          <p className="text-xs text-slate-500 mt-1">السابق: {fmt(prevInc - prevExp)} ج.م</p>
        </div>
      </div>
      <div className="glass rounded-2xl overflow-hidden">
        <div className="p-5 border-b bg-slate-50/50 dark:bg-slate-800/30"><h3 className="font-black text-lg">تفاصيل المقارنة بالفئات</h3></div>
        <div className="overflow-x-auto">
          <table className="w-full text-right text-sm">
            <thead className="bg-slate-100 dark:bg-slate-800">
              <tr><th className="p-4 font-bold">الفئة</th><th className="p-4 text-center">النوع</th><th className="p-4 text-left">الحالي</th><th className="p-4 text-left">السابق</th><th className="p-4 text-left">الفرق</th><th className="p-4 text-center">التغيير</th></tr>
            </thead>
            <tbody className="divide-y dark:divide-slate-800">
              {catRows.length === 0 ? (<tr><td colSpan="6" className="p-8 text-center text-slate-500 font-bold">لا توجد بيانات</td></tr>) : catRows.map((row, i) => (
                <tr key={i} className="hover:bg-slate-50 dark:hover:bg-slate-900/30">
                  <td className="p-4 font-bold"><div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full" style={{ background: CATEGORY_COLORS[row.cat] || '#9ca3af' }}></span>{row.cat}</div></td>
                  <td className="p-4 text-center"><span className={`text-[11px] px-2 py-0.5 rounded-full font-black ${row.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>{row.type === 'income' ? '💰 دخل' : '💸 مصروف'}</span></td>
                  <td className="p-4 text-left font-black">{fmt(row.cur)}</td>
                  <td className="p-4 text-left text-slate-500">{fmt(row.prev)}</td>
                  <td className={`p-4 text-left font-black ${row.cur - row.prev > 0 ? 'text-red-600' : 'text-emerald-600'}`}>{row.cur - row.prev > 0 ? '+' : ''}{fmt(row.cur - row.prev)}</td>
                  <td className="p-4 text-center"><span className={`text-[11px] px-2 py-0.5 rounded-full font-black ${row.change > 0 ? 'bg-red-100 text-red-700' : row.change < 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-700'}`}>{row.change > 0 ? '↑' : row.change < 0 ? '↓' : '—'} {Math.abs(row.change)}%</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
});

const DebtMetricsCards = memo(({ cards, updatedLoans, totalLiquidity, monthlySnapshots, selectedYear, selectedMonth }) => {
  const totalCardDebt = cards.reduce((s, c) => s + safeNumber(c.openingDebt), 0);
  const totalLoanDebt = updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0);
  const grandDebt = totalCardDebt + totalLoanDebt;
  const netGap = totalLiquidity - grandDebt;
  const payoffRate = useMemo(() => {
    const idx = getMonthIndex(selectedMonth);
    const prevKey = idx > 0 ? makeMonthKey(selectedYear, ALL_MONTHS[idx - 1]) : makeMonthKey(selectedYear - 1, 'ديسمبر');
    const snap = monthlySnapshots?.[prevKey];
    if (!snap || snap._totalDebt === undefined) return null;
    return safeNumber(snap._totalDebt) - grandDebt;
  }, [monthlySnapshots, selectedYear, selectedMonth, grandDebt]);
  const totalLimit = cards.reduce((s, c) => s + safeNumber(c.limit), 0);
  return (
    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div className="stat-card border-r-4 border-r-emerald-500"><div className="flex justify-between items-start mb-4">
        <div><p className="text-sm font-bold text-slate-500 mb-1">معدل إطفاء الدين</p>
        <h3 className={`text-2xl font-black ${payoffRate !== null && payoffRate > 0 ? 'text-emerald-600' : payoffRate !== null && payoffRate < 0 ? 'text-red-600' : 'text-slate-500'}`}>{payoffRate !== null ? `${payoffRate > 0 ? '-' : '+'}${fmt(Math.abs(payoffRate))}` : '—'}<span className="text-sm font-medium text-slate-500 mr-1">ج.م</span></h3>
        <p className="text-xs text-slate-500 mt-1">{payoffRate === null ? 'يُحتسب بعد إقفال الشهر السابق' : 'مقارنة بآخر إقفال'}</p></div>
        <div className="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600"><TrendingDown size={24} /></div></div></div>
      <div className={`stat-card border-r-4 ${netGap >= 0 ? 'border-r-emerald-500' : 'border-r-red-500'}`}><div className="flex justify-between items-start mb-4">
        <div><p className="text-sm font-bold text-slate-500 mb-1">فارق الديون والسيولة</p>
        <h3 className={`text-2xl font-black ${netGap >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{netGap >= 0 ? '+' : ''}{fmt(netGap)}<span className="text-sm font-medium text-slate-500 mr-1">ج.م</span></h3>
        <p className={`text-xs mt-1 font-bold ${netGap >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{netGap >= 0 ? '✅ سيولة > ديون' : '⚠️ ديون > سيولة'}</p></div>
        <div className={`p-3 rounded-xl ${netGap >= 0 ? 'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600' : 'bg-red-50 dark:bg-red-900/20 text-red-600'}`}><Activity size={24} /></div></div></div>
      <div className="stat-card border-r-4 border-r-amber-500"><div className="flex justify-between items-start mb-4">
        <div><p className="text-sm font-bold text-slate-500 mb-1">معدل استخدام البطاقات</p>
        <h3 className="text-2xl font-black text-amber-600">{totalLimit > 0 ? Math.round((totalCardDebt / totalLimit) * 100) : 0}%</h3>
        <p className="text-xs text-slate-500 mt-1">{fmt(totalCardDebt)} من {fmt(totalLimit)}</p></div>
        <div className="p-3 rounded-xl bg-amber-50 dark:bg-amber-900/20 text-amber-600"><Percent size={24} /></div></div></div>
    </div>
  );
});

const DashboardView = memo(({ data, financeSnapshot, liveBalances, totalLiquidity, walletVisibility, onToggleVisibility, dispatch, selectedYear, selectedMonth, transactions, cards, updatedLoans, chartData, isDarkMode, handleManualReconciliation, addNotification, onSelectYear, onSelectMonth }) => {
  const totalCardDebt = cards.reduce((s, c) => s + safeNumber(c.openingDebt), 0);
  const totalLoanDebt = updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0);
  const totalReceivables = updatedLoans.filter(l => l.isReceivable).reduce((s, l) => s + l.remaining, 0);
  const grandTotalDebt = totalCardDebt + totalLoanDebt;
  const netPosition = totalLiquidity - grandTotalDebt;
  const pieData = useMemo(() => {
    const acc = {};
    transactions.filter(t => t.type === 'expense' && t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status === 'paid' && safeNumber(t.amount) > 0).forEach(t => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); });
    const sorted = Object.entries(acc).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
    if (sorted.length <= 5) return sorted;
    const top = sorted.slice(0, 4);
    const restVal = sorted.slice(4).reduce((s, i) => s + i.value, 0);
    return [...top, { name: 'أخرى مجمعة', value: restVal }];
  }, [transactions, selectedMonth, selectedYear]);
  const net = financeSnapshot;
  const hanyToday = useMemo(() => {
    const today = getLocalISODate();
    return transactions.filter(t => t.date === today && t.category === 'مسحوبات محل هاني' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);

        </div>
      )}
      <div className={`glass p-6 rounded-2xl border-r-4 ${netPosition >= 0 ? 'border-r-emerald-500' : 'border-r-red-500'}`}>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div><p className="text-xs font-bold text-slate-500 uppercase">إجمالي السيولة (حي)</p><p className="text-2xl font-black text-emerald-600 mt-2">+{fmt(totalLiquidity)}</p><p className="text-[11px] text-slate-500 mt-1">رصيد + قيود معتمدة حتى نهاية اليوم</p></div>
          <div><p className="text-xs font-bold text-slate-500 uppercase">إجمالي المديونية</p><p className="text-2xl font-black text-red-600 mt-2">-{fmt(grandTotalDebt)}</p><p className="text-[11px] text-slate-500 mt-1">قروض: {fmt(totalLoanDebt)} | بطاقات: {fmt(totalCardDebt)}</p>
            {totalReceivables > 0 && (<p className="text-[11px] text-emerald-600 mt-1 font-bold">➕ مستحقات لك: {fmt(totalReceivables)} ج.م</p>)}
          </div>
          <div><p className="text-xs font-bold text-slate-500 uppercase">صافي المركز</p><p className={`text-2xl font-black mt-2 ${netPosition >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{netPosition >= 0 ? '+' : ''}{fmt(netPosition)}</p><p className={`text-[11px] font-bold mt-1 ${netPosition >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{netPosition >= 0 ? '✅ وضع آمن' : '⚠️ ديون > سيولة'}</p></div>
        </div>
      </div>

  return (
    <div className="space-y-8 animate-fadeIn">

          {isClosed ? (<>
            <div className="bg-emerald-100 text-emerald-700 px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 border border-emerald-200"><ShieldCheck size={14} /> مغلق</div>
            <button onClick={() => dispatch({ type: 'SHOW_CONFIRM', danger: false, title: `🔓 إعادة فتح ${selectedMonth}`, message: 'سيتم إلغاء القفل وحذف snapshot الشهر وكل الشهور التالية.', onConfirm: () => { saveHistory(); dispatch({ type: 'OPEN_MONTH', payload: makeMonthKey(selectedYear, selectedMonth) }); addNotification({ type: 'success', title: '🔓 تم إعادة الفتح' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) })} className="bg-amber-100 text-amber-700 hover:bg-amber-200 px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 border border-amber-300 active:scale-95 no-print"><Unlock size={14} /> إعادة فتح</button>
          </>) : (
            <button onClick={() => dispatch({ type: 'SHOW_CONFIRM', danger: false, title: `🔒 إقفال ${selectedMonth}`, message: 'سيتم تثبيت أرصدة كل الحسابات + إجمالي المديونية كنقطة ترحيل.', onConfirm: () => { saveHistory(); dispatch({ type: 'CLOSE_MONTH', payload: { year: selectedYear, month: selectedMonth } }); addNotification({ type: 'success', title: '✅ تم الإقفال' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) })} className="gradient-bg-warning text-white px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 no-print active:scale-95"><Lock size={14} /> اعتماد وإقفال</button>)}

        <div className="glass p-5 rounded-2xl border-b-4 border-blue-500"><p className="text-[11px] font-bold text-slate-500 uppercase mb-1">الصافي</p><p className={`text-xl font-black ${monthInsights.net >= 0 ? 'text-blue-600' : 'text-rose-500'}`}>{fmt(monthInsights.net)}</p></div>
        <div className="glass p-5 rounded-2xl border-b-4 border-purple-500 flex items-center justify-center cursor-pointer hover:bg-purple-50" onClick={onPrintMonthlyReport}><div className="text-center"><FileText size={20} className="mx-auto text-purple-600 mb-1" /><p className="text-[11px] font-black text-purple-600">تقرير PDF</p></div></div></div>

        {[['all', 'الكل', Layers],['self', '👤 أنا', Users],['ans', '🛒 أنس', StoreIcon],['abdelrahman', '🛒 عبد الرحمن', StoreIcon],['salma', '🛒 سلمى', StoreIcon],['om_abdo', '🛒 أم عبده', StoreIcon]].map(([id, label, Icon]) => (

          <button key={id} type="button" onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: id })} className={`px-3 py-1.5 rounded-xl text-[11px] font-bold border flex items-center gap-1 ${statusFilter === id ? (id === 'all' ? 'bg-slate-800 text-white' : id === 'pending' ? 'gradient-bg-warning text-white' : 'gradient-bg-success text-white') : 'bg-white dark:bg-slate-800'}`}><Icon size={12} /> {label}</button>))}</div>
      <div className="glass p-4 rounded-2xl no-print"><div className="relative"><Search className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500" size={20} />
        <input type="text" placeholder="🔍 ابحث (Ctrl+K)" aria-label="بحث" className="w-full p-4 pr-12 bg-transparent border-0 focus:outline-none text-lg" value={searchTerm} onChange={(e) => dispatch({ type: 'SET_SEARCH_TERM', payload: e.target.value })} /></div></div>
      <section>
        <div className="flex justify-between items-center mb-6 flex-wrap gap-3">
          <h3 className="text-orange-500 font-black flex items-center gap-3 border-r-4 border-orange-500 pr-2 text-xl"><Clock size={24} /> الالتزامات الحالية {totalPending > 0 && <span className="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-xs font-black">{totalPending} معلق</span>}</h3>
          {totalPending > 0 && <button onClick={approveAll} className="gradient-bg-success text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg flex items-center gap-2 no-print active:scale-95"><CheckCircle2 size={16} /> اعتماد الكل</button>}</div>
        <div className="hidden md:block glass rounded-2xl overflow-hidden mb-12">
          <table className="w-full text-right text-sm"><thead className="bg-slate-50/80 dark:bg-slate-800/50"><tr><th className="p-6 text-slate-500 text-xs uppercase">حالة</th><th className="p-6 text-slate-500 text-xs uppercase">البند</th><th className="p-6 text-slate-500 text-xs uppercase text-center">العدد</th><th className="p-6 text-slate-500 text-xs uppercase text-left">المبلغ</th><th className="p-6"></th></tr></thead>
            <tbody className="divide-y dark:divide-slate-800 font-bold">
              {pendingGroups.map(g => { const isExpanded = expandedGroup === g.category; return (
                <React.Fragment key={g.category}>
                  <tr className="hover:bg-slate-50 cursor-pointer" onClick={() => dispatch({ type: 'SET_EXPANDED_GROUP', payload: isExpanded ? null : g.category })}>
                    <td className="p-6 text-center"><div className={`p-2 rounded-full inline-block transition-transform ${isExpanded ? 'bg-blue-50 text-blue-500 rotate-180' : 'bg-slate-50'}`}><ChevronDown size={16} /></div></td>
                    <td className="p-6 font-bold flex items-center gap-4"><span className="p-3 rounded-2xl" style={{ backgroundColor: `${CATEGORY_COLORS[g.category]}20`, color: CATEGORY_COLORS[g.category] }}><Layers size={20} /></span>{g.category}</td>
                    <td className="p-6 text-center text-slate-500">{g.items.length}</td>
                    <td className="p-6 font-black text-left text-lg">{fmt(g.items.reduce((s, i) => s + safeNumber(i.amount), 0))}</td><td></td></tr>
                  {isExpanded && g.items.map(t => { const m = getFamilyMember(t); return (
                    <tr key={t.id} className={`text-xs border-r-4 ${m ? `${m.rowBg} ${m.rowBorder}` : t.source === 'carryover' ? 'bg-orange-50/40 dark:bg-orange-900/10 border-r-orange-400' : 'bg-slate-50/50 dark:bg-slate-900/30 border-r-amber-500'}`}>
                      <td className="py-4 text-center"><button type="button" aria-label="اعتماد" onClick={(e) => { e.stopPropagation(); approveOne(t); }} className="flex flex-col items-center px-2 py-1 rounded-lg hover:bg-slate-100 no-print active:scale-90"><Clock className="text-amber-500 w-6 h-6 animate-pulse" /><span className="text-[11px] font-black text-amber-600">اعتماد</span></button></td>
                      <td className="pr-20 py-4 font-bold"><div className="text-slate-800 dark:text-slate-200 text-base mb-1">{t.description || 'بدون وصف'} <KindBadge tx={t} /> <RecurringBadge tx={t} /> <FamilyBadge tx={t} /> <SubCategoryBadge tx={t} /></div><div className="flex gap-3 items-center flex-wrap"><span className="bg-white dark:bg-slate-800 px-3 py-1 border rounded-lg">{t.date}</span><span className="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg">{PAYMENT_METHODS.find(p => p.id === t.method)?.label}</span></div></td>
                      <td className="py-4 text-center text-slate-500">-</td>
                      <td className="py-4 font-black text-left text-base">{fmt(t.amount)}</td>
                      <td className="py-4 text-center"><div className="flex gap-2 justify-center no-print">
                        <button type="button" aria-label="تعديل" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="p-2 text-blue-500 hover:bg-blue-50 rounded-lg"><Edit size={16} /></button>
                        <button type="button" aria-label="حذف" onClick={() => handleDelete(t.id)} className="p-2 text-red-500 hover:bg-red-50 rounded-lg"><Trash2 size={16} /></button></div></td></tr>); })}
                </React.Fragment>); })}
              {pendingGroups.length === 0 && (<tr><td colSpan="5" className="p-8 text-center text-slate-500 font-bold">لا توجد التزامات ✅</td></tr>)}
            </tbody></table></div>
        <div className="md:hidden space-y-4 p-2 pb-32">
          {pendingGroups.map(g => (<div key={g.category} className="space-y-2">
            <h4 className="text-[11px] font-black text-slate-500 uppercase pr-2 flex items-center gap-2"><Layers size={12} style={{ color: CATEGORY_COLORS[g.category] }} /> {g.category}</h4>
            {g.items.map(t => (<div key={t.id} className="glass p-4 rounded-2xl flex justify-between items-center border">
              <div className="flex items-center gap-3 flex-1 min-w-0">
                <button aria-label="اعتماد" onClick={() => approveOne(t)} className="p-2 rounded-xl bg-amber-50 text-amber-600"><Clock size={18} /></button>
                <div className="flex-1 min-w-0"><p className="font-bold text-sm truncate">{t.description || 'بدون وصف'} <RecurringBadge tx={t} /> <FamilyBadge tx={t} /> <SubCategoryBadge tx={t} /></p><p className="text-[11px] text-slate-500">{t.date}</p></div></div>
              <div className="text-left flex items-center gap-2"><p className="font-black text-base">{fmt(t.amount)}</p>
                <button aria-label="تعديل" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="text-blue-500"><Edit size={16} /></button>
                <button aria-label="حذف" onClick={() => handleDelete(t.id)} className="text-rose-500"><Trash2 size={14} /></button></div></div>))}</div>))}</div>
      </section>
      {paidArchive.length > 0 && (<details className="group"><summary className="cursor-pointer list-none mb-6">
        <div className="glass p-4 rounded-2xl flex items-center justify-between"><h3 className="text-emerald-600 font-black flex items-center gap-3"><div className="bg-emerald-100 p-2 rounded-lg"><CheckCircle2 size={20} /></div>سجل المدفوعات ({paidArchive.length})</h3><ChevronDown className="text-slate-500 group-open:rotate-180 transition-transform" size={24} /></div></summary>
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {paidArchive.map(t => { const m = getFamilyMember(t); return (
            <div key={t.id} className={`glass p-4 rounded-2xl flex justify-between items-center border-r-4 ${m ? `${m.rowBorder} ${m.rowBg}` : t.source === 'carryover' ? 'border-orange-400 bg-orange-50/40' : t.type === 'income' ? 'border-emerald-500' : 'border-red-500'}`}>
              <div className="min-w-0 flex-1 pl-4"><p className="font-bold text-sm truncate">{t.type === 'income' ? '💰' : '💸'} {t.description || t.category} <RecurringBadge tx={t} /> <FamilyBadge tx={t} /> <SubCategoryBadge tx={t} /></p><p className="text-[11px] text-slate-500">{t.date}</p></div>
              <div className="flex items-center gap-2"><p className="font-black text-sm">{fmt(t.amount)}</p><button aria-label="إعادة تعليق" onClick={() => reopenOne(t)} className="p-2 text-amber-500 hover:bg-amber-50 rounded-xl no-print"><Undo2 size={18} /></button></div></div>); })}
        </div></details>)}
    </div>
  );
});

const LoansView = memo(({ updatedLoans, cards, recurringItems, transactions, dispatch, deleteRecurring, saveHistory, getLocalISODate, addNotification }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [newLoan, setNewLoan] = useState({ name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false });

  const settleHany = (loan) => {
    const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const total = safeNumber(loan.totalAmount);
    const paidAlready = safeNumber(loan.totalPaid);
    const remaining = Math.max(0, total - paidAlready);

    if (remaining <= 0.005) {
      addNotification({ type: 'info', title: 'مسدد بالكامل', message: 'لا يوجد مبلغ متبقي' });
      return;
    }

    const monthLabel = `${loan.month} ${loan.year}`;
    const alreadyCarried = transactions.some(t => t.source === 'carryover' && t.carryoverFrom === monthLabel);
    if (alreadyCarried) {
      addNotification({ type: 'info', title: '✅ تمت التسوية مسبقاً', message: `الباقي مرحّل إلى الشهر التالي`, duration: 6000 });
      return;
    }

    const input = prompt(
      `📊 تسوية مسحوبات محل هاني — ${loan.month} ${loan.year}\n\n` +
      `الإجمالي: ${fmt(total)} ج.م\n` +
      `مدفوع مسبقاً: ${fmt(paidAlready)} ج.م\n` +
      `المتبقي: ${fmt(remaining)} ج.م\n\n` +
      `💵 المبلغ المدفوع الآن (نقدي / تحويل):`,
      String(remaining)
    );
    if (input === null) return;

    const paidNow = parseNumberInput(input);
    if (paidNow <= 0) { addNotification({ type: 'error', title: 'خطأ', message: 'مبلغ غير صحيح' }); return; }
    if (paidNow > remaining + 0.005) { addNotification({ type: 'error', title: 'خطأ', message: `الحد الأقصى ${fmt(remaining)} ج.م` }); return; }

    const newRemaining = remaining - paidNow;
    const willCarry = newRemaining > 0.005;
    let nextMIdx = 0, nextY = loan.year, nextMonthName = '';

    if (willCarry) {
      const monthIdx = months.indexOf(loan.month);
      nextMIdx = monthIdx + 1; nextY = loan.year;
      if (nextMIdx > 11) { nextMIdx = 0; nextY++; }
      nextMonthName = months[nextMIdx];
    }

    saveHistory();
    const now = new Date();
    const today = getLocalISODate(now);
    const newTxs = [];

    newTxs.push({
      id: 'hany-pay-' + Date.now(),
      type: 'expense',
      kind: 'financial',
      category: 'الالتزامات البنكية والتمويلية',
      amount: paidNow,
      description: `سداد مسحوبات هاني — ${loan.month} ${loan.year}`,
      method: 'cash',
      date: today,
      month: months[now.getMonth()],
      year: now.getFullYear(),
      monthIndex: now.getMonth(),
      subType: 'withdrawal',
      status: 'paid',
      linkedLoanId: loan.id
    });

    if (willCarry) {
      const nextMonthDate = `${nextY}-${String(nextMIdx + 1).padStart(2, '0')}-01`;
      newTxs.push({
        id: 'hany-carry-' + Date.now(),
        type: 'expense',
        kind: 'operational',
        category: 'مسحوبات محل هاني',
        subCategory: 'رصيد مرحل',
        amount: newRemaining,
        description: `رصيد مرحل من ${loan.month} ${loan.year}`,
        method: 'cash',
        date: nextMonthDate,
        month: nextMonthName,
        year: nextY,
        monthIndex: nextMIdx,
        subType: 'withdrawal',
        status: 'pending',
        source: 'carryover',
        carryoverFrom: monthLabel
      });
    }

    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [...newTxs, ...transactions].sort((a, b) => new Date(b.date) - new Date(a.date)) });

    addNotification({
      type: 'success',
      title: '✅ تمت التسوية',
      message: willCarry
        ? `دفعت ${fmt(paidNow)} ج.م — ترحيل تلقائي ${fmt(newRemaining)} ج.م إلى ${nextMonthName}`
        : `دفعت ${fmt(paidNow)} ج.م — تم السداد بالكامل`,
      duration: 7000
    });
  };

  const totalLoans = updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0);
  const totalReceivable = updatedLoans.filter(l => l.isReceivable).reduce((s, l) => s + l.remaining, 0);
  const payables = updatedLoans.filter(l => !l.isReceivable);
  const receivables = updatedLoans.filter(l => l.isReceivable);
  const totalCards = cards.reduce((acc, c) => acc + safeNumber(c.openingDebt), 0);
  const addLoan = () => {
    if (!newLoan.name || safeNumber(newLoan.totalAmount) <= 0) { addNotification({ type: 'error', title: 'خطأ', message: 'الاسم والمبلغ مطلوبان' }); return; }
    saveHistory();
    dispatch({ type: 'UPDATE_LOANS', payload: [...updatedLoans, { id: Date.now(), name: newLoan.name, totalAmount: safeNumber(newLoan.totalAmount), prePaidAmount: 0, monthlyInstallment: safeNumber(newLoan.monthlyInstallment), dueDay: safeNumber(newLoan.dueDay, 1), interest: '', description: newLoan.description || '', type: newLoan.isReceivable ? 'receivable' : 'debt', isReceivable: newLoan.isReceivable }] });
    setShowAdd(false); setNewLoan({ name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false });
    addNotification({ type: 'success', title: '✅ تمت الإضافة' });
  };
  return (
    <div className="space-y-8 animate-fadeIn pb-24">
      <div className="glass p-8 rounded-2xl">
        <p className="text-slate-500 text-xs font-bold uppercase">إجمالي المديونية الصافية</p>
        <h3 className="text-4xl font-black font-mono mt-2 text-gradient">{fmt(totalLoans + totalCards - totalReceivable)} <span className="text-2xl text-slate-500">ج.م</span></h3>
        <p className="text-[11px] text-slate-500 font-bold mt-1">(صافي = مديونيات − مستحقات لك)</p>
        <div className="grid grid-cols-3 gap-4 mt-6 bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl">
          <div><span className="block text-[11px] text-slate-500 uppercase font-bold">القروض</span><span className="text-xl font-bold text-red-500">{fmt(totalLoans)}</span></div>
          <div><span className="block text-[11px] text-slate-500 uppercase font-bold">البطاقات</span><span className="text-xl font-bold text-red-500">{fmt(totalCards)}</span></div>
          <div><span className="block text-[11px] text-emerald-600 uppercase font-bold">➕ مستحقات لك</span><span className="text-xl font-bold text-emerald-600">{fmt(totalReceivable)}</span></div>
        </div>
        <div className="flex gap-3 mt-4 flex-wrap">
          <button onClick={() => setShowAdd(true)} className="gradient-bg-primary text-white px-6 py-3 rounded-xl font-bold shadow-lg flex items-center gap-2"><Plus size={18} /> إضافة التزام جديد</button>
          <button onClick={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: true })} className="bg-slate-100 dark:bg-slate-800 px-6 py-3 rounded-xl font-bold flex items-center gap-2"><Repeat size={18} /> التزام متكرر</button></div></div>
      {showAdd && (<div className="modal-backdrop"><div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl">
        <div className="p-6 border-b flex justify-between items-center"><h3 className="text-xl font-black">التزام جديد</h3><button onClick={() => setShowAdd(false)} aria-label="إغلاق"><X size={24} /></button></div>
        <div className="p-6 space-y-4">

  const handlePlanChange = (m, field, value) => { setLocalPlans(prev => ({ ...prev, [pk(m)]: { ...(prev[pk(m)] || {}), [field]: value } })); setHasChanges(true); };
  const handleSave = () => { saveHistory(); const cleaned = {}; Object.entries(localPlans).forEach(([k, p]) => { if (!parseMonthKey(k)) return; cleaned[k] = { expectedSalary: safeNumber(p.expectedSalary), expectedRent: safeNumber(p.expectedRent), expectedCashback: safeNumber(p.expectedCashback), expectedEmakWE: safeNumber(p.expectedEmakWE), expectedZakat: safeNumber(p.expectedZakat), expectedCash: safeNumber(p.expectedCash), expectedCashExpenses: safeNumber(p.expectedCashExpenses), plannedPayments: safeNumber(p.plannedPayments), notes: p.notes || '' }; }); dispatch({ type: 'UPDATE_MONTHLY_PLANS', payload: cleaned }); addNotification({ type: 'success', title: '✅ تم الحفظ' }); setHasChanges(false); };
  const computed = useMemo(() => { const r = {}; planningMonths.forEach(m => { const p = localPlans[pk(m)] || {}; const inc = safeNumber(p.expectedSalary) + safeNumber(p.expectedRent) + safeNumber(p.expectedCashback) + safeNumber(p.expectedEmakWE) + safeNumber(p.expectedZakat) + safeNumber(p.expectedCash); const out = safeNumber(p.expectedCashExpenses) + safeNumber(p.plannedPayments); r[pk(m)] = { inc, out, net: inc - out }; }); return r; }, [localPlans, planningMonths]);
  const debtRow = (m) => { const snap = data?.monthlySnapshots?.[pk(m)]; return snap && snap._totalDebt !== undefined ? snap._totalDebt : null; };
  const handleExportCSV = () => { const headers = ['البند', ...planningMonths.map(pk)]; const rows = [['راتب', ...planningMonths.map(m => safeNumber(localPlans[pk(m)]?.expectedSalary))], ['إيجار', ...planningMonths.map(m => safeNumber(localPlans[pk(m)]?.expectedRent))], ['CashBack', ...planningMonths.map(m => safeNumber(localPlans[pk(m)]?.expectedCashback))], ['إيماك', ...planningMonths.map(m => safeNumber(localPlans[pk(m)]?.expectedEmakWE))], ['زكاة', ...planningMonths.map(m => safeNumber(localPlans[pk(m)]?.expectedZakat))], ['نقدي', ...planningMonths.map(m => safeNumber(localPlans[pk(m)]?.expectedCash))], ['إجمالي الدخل', ...planningMonths.map(m => computed[pk(m)]?.inc || 0)], ['مصروفات', ...planningMonths.map(m => safeNumber(localPlans[pk(m)]?.expectedCashExpenses))], ['مدفوعات', ...planningMonths.map(m => safeNumber(localPlans[pk(m)]?.plannedPayments))], ['الصافي', ...planningMonths.map(m => computed[pk(m)]?.net || 0)]]; const csv = '\uFEFF' + [headers, ...rows].map(r => r.join(',')).join('\n'); const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `monthly_plan_${Date.now()}.csv`; a.click(); URL.revokeObjectURL(url); addNotification({ type: 'success', title: 'تم التصدير' }); };
  return (
    <div className="space-y-8 animate-fadeIn pb-24">
      <div className="glass p-8 rounded-2xl flex justify-between items-center flex-wrap gap-4">
        <div className="flex items-center gap-4"><div className="gradient-bg-primary p-4 rounded-2xl text-white shadow-lg"><Table size={32} /></div><div><h2 className="text-3xl font-black">التخطيط الشهري</h2><p className="text-slate-500 font-bold mt-1">خطة 6 أشهر — كل خلية قابلة للتعديل</p></div></div>
        <div className="flex gap-3 flex-wrap">{hasChanges && <button onClick={handleSave} className="gradient-bg-success text-white px-8 py-4 rounded-2xl font-black shadow-lg flex items-center gap-3 active:scale-95"><Save size={20} /> حفظ</button>}
          <button onClick={handleExportCSV} className="bg-blue-50 text-blue-600 px-6 py-4 rounded-2xl font-bold flex items-center gap-2 active:scale-95"><FileSpreadsheet size={20} /> CSV</button></div></div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div className="glass p-6 rounded-2xl border-r-4 border-r-blue-500"><p className="text-[11px] font-bold text-slate-500 uppercase">إجمالي الدخل</p><p className="text-2xl font-black text-blue-600 mt-2">{fmt(planningMonths.reduce((s, m) => s + (computed[pk(m)]?.inc || 0), 0))} ج.م</p></div>
        <div className="glass p-6 rounded-2xl border-r-4 border-r-red-500"><p className="text-[11px] font-bold text-slate-500 uppercase">إجمالي المصروفات</p><p className="text-2xl font-black text-red-600 mt-2">{fmt(planningMonths.reduce((s, m) => s + (computed[pk(m)]?.out || 0), 0))} ج.م</p></div>
        <div className="glass p-6 rounded-2xl border-r-4 border-r-emerald-500"><p className="text-[11px] font-bold text-slate-500 uppercase">صافي التوفير</p><p className={`text-2xl font-black mt-2 ${planningMonths.reduce((s, m) => s + (computed[pk(m)]?.net || 0), 0) >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(planningMonths.reduce((s, m) => s + (computed[pk(m)]?.net || 0), 0))} ج.م</p></div></div>
      <div className="glass rounded-2xl overflow-hidden">
        <div className="p-6 border-b bg-slate-50/50 dark:bg-slate-800/30"><h3 className="font-black text-lg flex items-center gap-3"><Calculator className="text-blue-500" /> جدول التخطيط اليدوي</h3></div>
        <div className="overflow-x-auto"><table className="w-full text-sm border-collapse min-w-[800px]">
          <thead><tr><th className="planning-cell-header sticky right-0 bg-slate-100 dark:bg-slate-800 z-10 min-w-[160px]">البند</th>
            {planningMonths.map(m => <th key={pk(m)} className="planning-cell-header min-w-[120px]"><div className="text-sm">{m.month}</div><div className="text-[11px] text-slate-500 mt-0.5">{m.year}</div></th>)}</tr></thead>
          <tbody>
            {[{ key: 'expectedSalary', label: 'راتب', icon: TrendingUp, color: 'text-emerald-500' }, { key: 'expectedRent', label: 'إيجار', icon: StoreIcon, color: 'text-cyan-500' }, { key: 'expectedCashback', label: 'Cash Back', icon: Zap, color: 'text-amber-500' }, { key: 'expectedEmakWE', label: 'عهدة إيماك', icon: Users, color: 'text-purple-500' }, { key: 'expectedZakat', label: 'زكاة', icon: Coins, color: 'text-teal-500' }, { key: 'expectedCash', label: 'نقدي مرحل', icon: Wallet, color: 'text-green-500' }].map(row => (
              <tr key={row.key} className="hover:bg-blue-50/30"><td className="planning-cell sticky right-0 bg-white dark:bg-slate-800 z-10 text-right font-bold"><div className="flex items-center gap-2"><row.icon size={14} className={row.color} /> {row.label}</div></td>
                {planningMonths.map(m => <td key={row.key + pk(m)} className="planning-cell"><input type="text" inputMode="decimal" className="planning-input" value={localPlans[pk(m)]?.[row.key] ?? ''} onChange={e => handlePlanChange(m, row.key, e.target.value)} /></td>)}</tr>))}
            <tr className="bg-emerald-50 dark:bg-emerald-900/20 border-t-2 border-emerald-500"><td className="planning-cell sticky right-0 bg-emerald-50 dark:bg-emerald-900/20 z-10 font-black text-emerald-700">إجمالي الدخل</td>{planningMonths.map(m => <td key={'i' + pk(m)} className="planning-cell font-black text-emerald-700">{fmt(computed[pk(m)]?.inc)}</td>)}</tr>
            <tr><td className="planning-cell sticky right-0 bg-white dark:bg-slate-800 z-10 font-bold"><div className="flex items-center gap-2"><TrendingDown size={14} className="text-red-500" /> مصروفات نقدية</div></td>{planningMonths.map(m => <td key={'ce' + pk(m)} className="planning-cell"><input type="text" inputMode="decimal" className="planning-input" value={localPlans[pk(m)]?.expectedCashExpenses ?? ''} onChange={e => handlePlanChange(m, 'expectedCashExpenses', e.target.value)} /></td>)}</tr>
            <tr><td className="planning-cell sticky right-0 bg-white dark:bg-slate-800 z-10 font-bold"><div className="flex items-center gap-2"><CreditCard size={14} className="text-red-600" /> مدفوعات مخططة</div></td>{planningMonths.map(m => <td key={'pp' + pk(m)} className="planning-cell"><input type="text" inputMode="decimal" className="planning-input" value={localPlans[pk(m)]?.plannedPayments ?? ''} onChange={e => handlePlanChange(m, 'plannedPayments', e.target.value)} /></td>)}</tr>
            <tr className="bg-red-50 dark:bg-red-900/20 border-t-2 border-red-500"><td className="planning-cell sticky right-0 bg-red-50 dark:bg-red-900/20 z-10 font-black text-red-700">إجمالي المصروف</td>{planningMonths.map(m => <td key={'o' + pk(m)} className="planning-cell font-black text-red-700">{fmt(computed[pk(m)]?.out)}</td>)}</tr>
            <tr className="bg-blue-50 dark:bg-blue-900/20 border-t-2"><td className="planning-cell sticky right-0 bg-white dark:bg-slate-800 z-10 font-black">الصافي</td>{planningMonths.map(m => { const n = computed[pk(m)]?.net || 0; return <td key={'n' + pk(m)} className={`planning-cell font-black ${n >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{n >= 0 ? '+' : ''}{fmt(n)}</td>; })}</tr>
            <tr className="bg-amber-50 dark:bg-amber-900/20 border-t-2 border-amber-500"><td className="planning-cell sticky right-0 bg-amber-50 dark:bg-amber-900/20 z-10 font-black text-amber-700"><div className="flex items-center gap-2"><Percent size={14} /> دين مثبت</div></td>{planningMonths.map(m => { const d = debtRow(m); return <td key={'d' + pk(m)} className={`planning-cell font-black ${d === null ? 'text-slate-500' : d > grandDebt ? 'text-amber-600' : 'text-emerald-600'}`}>{d === null ? '—' : fmt(d)}</td>; })}</tr>
            <tr className="border-t"><td className="planning-cell sticky right-0 bg-white dark:bg-slate-800 z-10 font-bold text-slate-500">ملاحظات</td>{planningMonths.map(m => <td key={'no' + pk(m)} className="planning-cell"><input type="text" className="planning-input text-xs" value={localPlans[pk(m)]?.notes || ''} onChange={e => handlePlanChange(m, 'notes', e.target.value)} placeholder="..." /></td>)}</tr>
          </tbody></table></div></div>
    </div>
  );
});

const PlannerView = memo(({ updatedLoans, cards, selectedMonth, selectedYear, monthlyPlans, totalLiquidityNow }) => {
  const projection = useMemo(() => {
    const seq = []; let y = selectedYear, mi = getMonthIndex(selectedMonth);
    for (let i = 0; i < 8; i++) { seq.push({ year: y, month: ALL_MONTHS[mi] }); mi++; if (mi > 11) { mi = 0; y++; } }
    let liq = totalLiquidityNow;
    let simLoans = JSON.parse(JSON.stringify(updatedLoans.filter(l => !l.isReceivable)));
    let simCards = cards.map(c => ({ d: safeNumber(c.openingDebt) }));
    return seq.map(({ year, month }) => {
      const plan = monthlyPlans?.[makeMonthKey(year, month)] || {};
      const inc = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent) + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE) + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedCash);
      const out = safeNumber(plan.expectedCashExpenses) + safeNumber(plan.plannedPayments);
      simLoans = simLoans.map(l => { const p = Math.min(l.remaining, safeNumber(l.monthlyInstallment)); return { ...l, remaining: l.remaining - p }; });
      simCards = simCards.map(c => ({ d: Math.round(c.d * 0.85) }));
      const opening = liq; liq = opening + inc - out;
      return { label: `${month} ${String(year).slice(2)}`, opening, inc, out, running: liq, danger: liq < 0 };
    });
  }, [selectedYear, selectedMonth, totalLiquidityNow, updatedLoans, cards, monthlyPlans]);
  return (
    <div className="space-y-8 animate-fadeIn pb-24">
      <div className="glass p-8 rounded-2xl"><h2 className="text-3xl font-black flex items-center gap-3"><Target className="text-emerald-400" size={32} /> المخطط الاستراتيجي</h2><p className="text-slate-500 mt-2 font-bold">محاكاة 8 أشهر قادمة — تعبر حدود السنة تلقائياً</p></div>
      <div className="glass rounded-2xl overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-right text-sm">
        <thead className="bg-slate-50 dark:bg-slate-800/50"><tr className="text-slate-500 font-bold"><th className="p-4">الشهر</th><th className="p-4">افتتاحي</th><th className="p-4 text-emerald-600">دخل متوقع</th><th className="p-4 text-rose-500">مصروف متوقع</th><th className="p-4">الصافي</th><th className="p-4 text-center">الأمان</th></tr></thead>
        <tbody className="divide-y dark:divide-slate-800">
          {projection.map(row => (<tr key={row.label}>
            <td className="p-4 font-black">{row.label}</td><td className="p-4 font-mono text-slate-500">{fmt(row.opening)}</td>
            <td className="p-4 font-mono text-emerald-600">+{fmt(row.inc)}</td><td className="p-4 font-mono text-rose-500 font-bold">-{fmt(row.out)}</td>
            <td className={`p-4 font-mono font-black ${row.danger ? 'text-red-600' : 'text-emerald-600'}`}>{fmt(row.running)}</td>
            <td className="p-4 text-center">{row.danger ? <span className="px-3 py-1 bg-red-100 text-red-600 rounded-lg text-[11px] font-black">عجز</span> : row.running < 10000 ? <span className="px-3 py-1 bg-amber-100 text-amber-600 rounded-lg text-[11px] font-black">انتباه</span> : <span className="px-3 py-1 bg-emerald-100 text-emerald-600 rounded-lg text-[11px] font-black">مستقر</span>}</td></tr>))}
        </tbody></table></div></div></div>
  );
});

const ForecastRow = ({ label, value, color, prefix = '' }) => (
  <div className="flex justify-between items-center"><span className="text-sm font-bold text-slate-500">{label}</span><span className={`text-lg font-black ${color}`}>{prefix}{fmt(value)} ج.م</span></div>
);

const LiquidityForecastView = memo(({ transactions, updatedLoans, recurringItems, liveBalances, selectedYear, selectedMonth, monthlyPlans }) => {
  const historical = useMemo(() => {
    const months = [];
    let y = selectedYear, mi = getMonthIndex(selectedMonth);
    for (let i = 1; i <= 3; i++) { mi--; if (mi < 0) { mi = 11; y--; } months.push({ year: y, month: ALL_MONTHS[mi] }); }
    const catData = {};
    months.forEach(({ year, month }) => {
      transactions.filter(t => t.type === 'expense' && t.status === 'paid' && t.month === month && (t.year || 2026) === year).forEach(t => {
        const c = t.category || 'أخرى';
        if (!catData[c]) catData[c] = { total: 0, samples: 0 };
        catData[c].total += safeNumber(t.amount);
        catData[c].samples++;
      });
    });
    const avgPerCat = {}; let grandTotal = 0;
    Object.entries(catData).forEach(([cat, d]) => { avgPerCat[cat] = d.total / months.length; grandTotal += avgPerCat[cat]; });
    const monthsWithData = months.filter(m => transactions.some(t => t.type === 'expense' && t.status === 'paid' && t.month === m.month && (t.year || 2026) === m.year)).length;
    return { months, avgPerCat, grandTotal, monthsWithData };
  }, [transactions, selectedYear, selectedMonth]);

  const committed = useMemo(() => {
    const items = [];
    updatedLoans.filter(l => !l.isReceivable && !l.autoGenerated && safeNumber(l.monthlyInstallment) > 0 && l.remaining > 0).forEach(l => items.push({ name: l.name, amount: safeNumber(l.monthlyInstallment), icon: Banknote }));
    updatedLoans.filter(l => l.autoGenerated && l.remaining > 0).forEach(l => items.push({ name: l.name, amount: safeNumber(l.remaining), icon: StoreIcon }));
    recurringItems.filter(r => r.type === 'expense').forEach(r => items.push({ name: r.title, amount: safeNumber(r.amount), icon: Repeat }));
    return { items, total: items.reduce((s, i) => s + i.amount, 0) };
  }, [updatedLoans, recurringItems]);

  const income = useMemo(() => {
    const items = [];
    recurringItems.filter(r => r.type === 'income').forEach(r => items.push({ name: r.title, amount: safeNumber(r.amount), icon: TrendingUp }));
    return { items, total: items.reduce((s, i) => s + i.amount, 0) };
  }, [recurringItems]);

  const projection = useMemo(() => {
    const result = [];
    let balance = ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(liveBalances[k]), 0);
    const committedCats = new Set();
    updatedLoans.forEach(l => l.autoMonthly && committedCats.add(l.category));
    recurringItems.filter(r => r.type === 'expense').forEach(r => committedCats.add(r.category));
    let y = selectedYear, mi = getMonthIndex(selectedMonth);
    for (let i = 1; i <= 2; i++) {
      mi++; if (mi > 11) { mi = 0; y++; }
      const month = ALL_MONTHS[mi];
      const plan = monthlyPlans?.[makeMonthKey(y, month)] || {};
      const planInc = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent) + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE) + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedCash);
      const inc = planInc > 0 ? planInc : income.total;
      const comm = committed.total;
      let variable = 0;
      Object.entries(historical.avgPerCat).forEach(([cat, avg]) => { if (!committedCats.has(cat)) variable += avg; });
      const exp = comm + variable;
      const closing = balance + inc - exp;
      result.push({ year: y, month, opening: balance, income: inc, committed: comm, variable, expenses: exp, closing, savings: inc - exp, safety: closing > 0 && (inc - exp) > 0 ? 'safe' : closing > 0 ? 'warn' : 'danger' });
      balance = closing;
    }
    return result;
  }, [selectedYear, selectedMonth, liveBalances, committed, income, historical, monthlyPlans, updatedLoans, recurringItems]);

  const confidence = useMemo(() => {
    const n = historical.monthsWithData;
    if (n >= 3) return { level: 'مرتفعة', pct: 90, bg: 'bg-emerald-50 dark:bg-emerald-900/20', text: 'text-emerald-600' };
    if (n >= 2) return { level: 'متوسطة', pct: 75, bg: 'bg-amber-50 dark:bg-amber-900/20', text: 'text-amber-600' };
    if (n >= 1) return { level: 'منخفضة', pct: 60, bg: 'bg-orange-50 dark:bg-orange-900/20', text: 'text-orange-600' };
    return { level: 'غير كافية', pct: 0, bg: 'bg-red-50 dark:bg-red-900/20', text: 'text-red-600' };
  }, [historical.monthsWithData]);

  const liveTotal = ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(liveBalances[k]), 0);
  const variableTotal = Object.entries(historical.avgPerCat).filter(([cat]) => !updatedLoans.some(l => l.autoMonthly && l.category === cat) && !recurringItems.some(r => r.type === 'expense' && r.category === cat)).reduce((s, [, v]) => s + v, 0);

  return (
    <div className="space-y-8 animate-fadeIn pb-24">
      <div className="glass p-8 rounded-2xl flex justify-between items-center flex-wrap gap-4">
        <div className="flex items-center gap-4"><div className="gradient-bg-primary p-4 rounded-2xl text-white shadow-lg"><LineChart size={32} /></div><div><h2 className="text-3xl font-black">توقع السيولة الذكي</h2><p className="text-slate-500 font-bold mt-1">محاكاة الشهرين القادمين بناءً على سلوكك الفعلي</p></div></div>
        <div className={`px-6 py-4 rounded-2xl ${confidence.bg} border-2 border-dashed`}><p className="text-[11px] font-bold text-slate-500 uppercase text-center">دقة التوقع</p><p className={`text-3xl font-black ${confidence.text} text-center`}>{confidence.pct}%</p><p className="text-[11px] font-bold text-slate-500 text-center">ثقة {confidence.level}</p></div></div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div className="glass p-6 rounded-2xl border-r-4 border-r-blue-500"><p className="text-[11px] font-bold text-slate-500 uppercase">الرصيد الحي الآن</p><p className="text-2xl font-black text-blue-600 mt-2">{fmt(liveTotal)} ج.م</p><p className="text-[11px] text-slate-500 mt-1">مجموع الحسابات الخمسة</p></div>
        <div className="glass p-6 rounded-2xl border-r-4 border-r-amber-500"><p className="text-[11px] font-bold text-slate-500 uppercase">متوسط مصروف شهري</p><p className="text-2xl font-black text-amber-600 mt-2">{fmt(historical.grandTotal)} ج.م</p><p className="text-[11px] text-slate-500 mt-1">بناءً على {historical.monthsWithData} شهر سابق</p></div>
        <div className="glass p-6 rounded-2xl border-r-4 border-r-emerald-500"><p className="text-[11px] font-bold text-slate-500 uppercase">دخل متوقع شهري</p><p className="text-2xl font-black text-emerald-600 mt-2">{fmt(income.total)} ج.م</p><p className="text-[11px] text-slate-500 mt-1">من الالتزامات المتكررة</p></div></div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
        {projection.map((p, idx) => (
          <div key={idx} className={`glass rounded-2xl overflow-hidden border-2 ${p.safety === 'safe' ? 'border-emerald-300 dark:border-emerald-800' : p.safety === 'warn' ? 'border-amber-300 dark:border-amber-800' : 'border-red-300 dark:border-red-800'}`}>
            <div className={`p-5 ${p.safety === 'safe' ? 'bg-emerald-50 dark:bg-emerald-900/20' : p.safety === 'warn' ? 'bg-amber-50 dark:bg-amber-900/20' : 'bg-red-50 dark:bg-red-900/20'}`}>
              <div className="flex justify-between items-center"><h3 className="text-2xl font-black">{p.month} {p.year}</h3><span className={`px-3 py-1 rounded-full text-xs font-black ${p.safety === 'safe' ? 'bg-emerald-100 text-emerald-700' : p.safety === 'warn' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700'}`}>{p.safety === 'safe' ? '✅ آمن' : p.safety === 'warn' ? '⚠️ انتباه' : '❌ خطر'}</span></div></div>
            <div className="p-6 space-y-3">
              <ForecastRow label="الرصيد الافتتاحي" value={p.opening} color="text-slate-600" />
              <ForecastRow label="دخل متوقع" value={p.income} color="text-emerald-600" prefix="+" />
              <ForecastRow label="التزامات ثابتة" value={p.committed} color="text-red-500" prefix="-" />
              <ForecastRow label="مصروف متغير (تاريخي)" value={p.variable} color="text-orange-500" prefix="-" />
              <div className="border-t-2 border-dashed pt-3">
                <div className="flex justify-between items-center"><span className="font-black text-base">الرصيد المتوقع</span><span className={`text-3xl font-black ${p.closing >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(p.closing)} <span className="text-base">ج.م</span></span></div>
                <div className="flex justify-between items-center mt-2 text-xs"><span className="text-slate-500 font-bold">صافي التوفير</span><span className={`font-black ${p.savings >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{p.savings >= 0 ? '+' : ''}{fmt(p.savings)} ج.م</span></div></div></div></div>))}

const PinLockScreen = ({ onSuccess, onLogout }) => {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const [success, setSuccess] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const [lastPressed, setLastPressed] = useState(null);

  const handleDigit = (d) => {
    if (pin.length >= 4 || success) return;
    const next = pin + d;
    setPin(next);
    setLastPressed(d);
    setTimeout(() => setLastPressed(null), 180);
    if (next.length === 4) {
      setTimeout(() => {
        if (next === CORRECT_PIN) {
          setSuccess(true);
          setTimeout(() => onSuccess(), 600);
        } else {
          setError(true);
          setAttempts(a => a + 1);
          setTimeout(() => { setPin(''); setError(false); }, 700);
        }
      }, 180);
    }
  };

  const handleDelete = () => { if (!success) setPin(p => p.slice(0, -1)); };

  return (
    <div className="min-h-screen flex items-center justify-center p-6 relative overflow-hidden"
         style={{ background: 'radial-gradient(ellipse at top, #1e293b 0%, #0f172a 55%, #020617 100%)' }}>

            success ? 'bg-gradient-to-br from-emerald-400 to-emerald-600 shadow-2xl shadow-emerald-500/40 scale-110' :
            error ? 'bg-gradient-to-br from-red-500/20 to-red-700/20 border border-red-500/30' :
            'bg-gradient-to-br from-blue-500/15 to-indigo-500/15 border border-blue-500/20'

            {success ? <CheckCircle2 size={38} className="text-white" /> :
             error ? <AlertTriangle size={34} className="text-red-400" /> :
             <Lock size={34} className="text-blue-400" />}
          </div>
          <h1 className="text-2xl font-black text-white mb-1.5 tracking-tight">
            {success ? 'تم التحقق ✓' : error ? 'رمز غير صحيح' : 'أهلاً بعودتك'}
          </h1>
          <p className="text-sm text-slate-400 font-medium">
            {success ? 'جارٍ فتح التطبيق...' : error ? `محاولة ${attempts} — أعد المحاولة` : 'أدخل رمز الحماية المكوّن من 4 أرقام'}

        </div>

        <div className="flex justify-center gap-4 mb-10 h-4">
          {[0, 1, 2, 3].map(i => (
            <div key={i} className={`w-3.5 h-3.5 rounded-full transition-all duration-300 ${
              success ? 'bg-emerald-400 border-2 border-emerald-400 scale-125 shadow-lg shadow-emerald-400/50' :
              error ? 'bg-red-500 border-2 border-red-500 scale-110' :
              pin.length > i ? 'bg-blue-400 border-2 border-blue-400 scale-125 shadow-lg shadow-blue-400/50' :
              'bg-transparent border-2 border-slate-600'
            }`}></div>

        <div className="grid grid-cols-3 gap-3.5 mb-8">

                    className={`aspect-square rounded-2xl font-black text-2xl transition-all duration-150 active:scale-90 select-none ${
                      lastPressed === d ? 'bg-blue-500 text-white scale-95 shadow-lg shadow-blue-500/40' :

                  }`}>0</button>
          <button type="button" onClick={handleDelete}
                  className="aspect-square rounded-2xl flex items-center justify-center text-slate-500 hover:bg-red-500/10 hover:text-red-400 transition-all duration-150 active:scale-90">
            <Delete size={24} />

function dataReducer(state, action) {
  switch (action.type) {
    case 'SET_DATA': return { ...state, data: action.payload };
    case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
    case 'SET_SELECTED_YEAR': return { ...state, selectedYear: action.payload, selectedMonth: getMonthsForYear(action.payload).includes(state.selectedMonth) ? state.selectedMonth : getMonthsForYear(action.payload)[0] };
    case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
    case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
    case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
    case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
    case 'SET_FORM_DATA': return { ...state, formData: action.payload };
    case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
    case 'SET_FORM_ERRORS': return { ...state, formErrors: action.payload };
    case 'SET_ACTIVE_CATEGORY_DETAIL': return { ...state, activeCategoryDetail: action.payload };
    case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
    case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
    case 'SET_BUDGETS': return { ...state, budgets: action.payload };
    case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
    case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
    case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
    case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
    case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
    case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
    case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
    case 'SET_AI_MODAL_OPEN': return { ...state, isAiModalOpen: action.payload };
    case 'SET_AI_RESPONSE': return { ...state, aiResponse: action.payload };
    case 'SET_AI_LOADING': return { ...state, isAiLoading: action.payload };
    case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
    case 'ADD_NOTIFICATION': return { ...state, notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }] };
    case 'REMOVE_NOTIFICATION': return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
    case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
    case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
    case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
    case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
    case 'UPDATE_ACCOUNTS': {
      const oldA = state.data.accountsData || {};
      let changed = false;
      ACCOUNT_KEYS.forEach(k => { if (safeNumber(oldA[k]?.balance) !== safeNumber(action.payload[k]?.balance)) changed = true; });
      return { ...state, data: { ...state.data, accountsData: action.payload, ...(changed ? { monthlySnapshots: {} } : {}) } };
    }
    case 'UPDATE_MONTHLY_PLANS': return { ...state, data: { ...state.data, monthlyPlans: action.payload } };
    case 'ADD_TO_HISTORY': { const limited = [...state.history].slice(-19); return { ...state, history: [...limited, action.payload], future: [] }; }
    case 'UNDO': {
      if (state.history.length === 0) return state;
      const prev = state.history[state.history.length - 1];
      return { ...state, data: prev.data || prev, budgets: prev.budgets !== undefined ? prev.budgets : state.budgets, history: state.history.slice(0, -1), future: [{ data: state.data, budgets: state.budgets }, ...state.future] };
    }
    case 'TOGGLE_LEDGER': return { ...state, expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] } };
    case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };
    case 'SET_STATUS_FILTER': return { ...state, statusFilter: action.payload };
    case 'SHOW_CONFIRM': return { ...state, confirmDialog: { isOpen: true, title: action.title, message: action.message, onConfirm: action.onConfirm, onCancel: action.onCancel, danger: action.danger || false } };
    case 'HIDE_CONFIRM': return { ...state, confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false } };
    case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
    case 'SET_QUICK_TRANSFER_DATA': return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
    case 'SET_VIEWING_CARD_STATEMENT': return { ...state, viewingCardStatement: action.payload };
    case 'CLOSE_MONTH': {
      const { year, month } = action.payload;
      const monthKey = makeMonthKey(year, month);
      const monthEnd = new Date(year, getMonthIndex(month) + 1, 0, 23, 59, 59);
      const snap = {};
      ACCOUNT_KEYS.forEach(k => { snap[k] = computeBalance(state.data, k, monthEnd); });
      snap._totalDebt = state.data.cards.reduce((s, c) => s + safeNumber(c.openingDebt), 0) + state.data.loans.filter(l => !l.isReceivable).reduce((s, l) => s + Math.max(0, safeNumber(l.totalAmount) - safeNumber(l.prePaidAmount)), 0);
      return { ...state, data: { ...state.data, closedMonths: [...(state.data.closedMonths || []), monthKey], monthlySnapshots: { ...(state.data.monthlySnapshots || {}), [monthKey]: snap } } };
    }
    case 'OPEN_MONTH': {
      const monthKey = action.payload;
      const parsedKey = parseMonthKey(monthKey);
      if (!parsedKey) return { ...state, data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey) } };
      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots, parsedKey.year, parsedKey.month);
      return { ...state, data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey), monthlySnapshots: snapshots } };
    }
    case 'DELETE_MONTH_TRANSACTIONS': {
      const { year, month } = action.payload;
      const monthKey = makeMonthKey(year, month);
      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots, year, month);
      const newMat = { ...(state.data.materializedRecurring || {}) };
      delete newMat[monthKey];
      return { ...state, data: { ...state.data, transactions: (state.data.transactions || []).filter(t => !(t.month === month && (t.year || 2026) === year)), closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey), monthlySnapshots: snapshots, materializedRecurring: newMat } };
    }
    case 'TOGGLE_WALLET_VISIBILITY': return { ...state, walletVisibility: { ...state.walletVisibility, [action.payload]: !state.walletVisibility[action.payload] } };
    case 'SET_IS_PROCESSING': return { ...state, isProcessing: action.payload };
    case 'MARK_NOTIFIED': return { ...state, data: { ...state.data, notifiedItems: { ...(state.data.notifiedItems || {}), [action.payload]: Date.now() } } };
    default: return state;
  }
}

const DRIVE_CLIENT_ID = '190006477168-odmpreq26b618rdn1dsg4k1aag3k056g.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER_NAME = 'Finance Backups';

let _driveTokenClient = null;
let _driveAccessToken = null;
let _driveTokenExpiry = 0;

const waitForGIS = (timeoutMs = 10000) => new Promise((resolve, reject) => {
  if (window.google?.accounts?.oauth2) return resolve();
  const start = Date.now();
  const timer = setInterval(() => {
    if (window.google?.accounts?.oauth2) { clearInterval(timer); resolve(); }
    else if (Date.now() - start > timeoutMs) { clearInterval(timer); reject(new Error('Google Identity Services لم يتم تحميله — تحقق من الاتصال')); }
  }, 150);
});

const initDriveTokenClient = async () => {
  if (_driveTokenClient) return _driveTokenClient;
  await waitForGIS();
  _driveTokenClient = window.google.accounts.oauth2.initTokenClient({ client_id: DRIVE_CLIENT_ID, scope: DRIVE_SCOPE, callback: () => {} });
  return _driveTokenClient;
};

const requestDriveToken = async () => {
  const client = await initDriveTokenClient();
  return new Promise((resolve, reject) => {
    client.callback = (resp) => {
      if (resp.error) return reject(new Error(resp.error));
      _driveAccessToken = resp.access_token;
      _driveTokenExpiry = Date.now() + (safeNumber(resp.expires_in, 3600) * 1000) - 60000;
      resolve(_driveAccessToken);
    };
    client.requestAccessToken({ prompt: _driveAccessToken ? '' : 'consent' });
  });
};

const ensureDriveToken = async () => {
  if (_driveAccessToken && Date.now() < _driveTokenExpiry) return _driveAccessToken;
  return requestDriveToken();
};

const getOrCreateBackupFolder = async () => {
  const token = await ensureDriveToken();
  const q = encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('فشل قراءة المجلدات: ' + res.status);
  const data = await res.json();
  if (data.files && data.files.length > 0) return data.files[0].id;
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }) });
  if (!createRes.ok) throw new Error('فشل إنشاء المجلد: ' + createRes.status);
  const created = await createRes.json();
  return created.id;
};

const uploadBackupToDrive = async (payload, fileName) => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const name = fileName || `finance_backup_${getLocalISODate()}_${Date.now()}.json`;
  const metadata = { name, parents: [folderId], mimeType: 'application/json' };
  const boundary = '----V71DriveBoundary' + Date.now();
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,createdTime', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` }, body });
  if (!res.ok) throw new Error('فشل الرفع: ' + res.status);
  return await res.json();
};

const listDriveBackups = async () => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false and mimeType='application/json'`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,size,createdTime)&orderBy=createdTime desc&pageSize=50`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('فشل جلب القائمة: ' + res.status);
  const data = await res.json();
  return data.files || [];
};

const downloadBackupFromDrive = async (fileId) => {
  const token = await ensureDriveToken();
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('فشل التنزيل: ' + res.status);
  return await res.json();
};

function playFamilyAlert(freq = 880) {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.35);
  } catch (e) { /* audio not supported */ }
}
