        </h3>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {reportCards.filter(c => c.id !== 'hany').map(card => {
            const Icon = card.icon;
            return (
              <button key={card.id} onClick={card.onPrimary}
                className="card card-hover p-4 text-right active:scale-[0.98] transition-all relative overflow-hidden">
                <div className="flex items-start gap-3 mb-3">
                  <div className="p-2.5 rounded-xl flex-shrink-0 text-white shadow-lg" style={{ background: card.color }}>
                    <Icon size={18} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 flex-wrap mb-1">
                      <h4 className="font-black text-sm">{card.title}</h4>
                      <span className="badge badge-neutral text-[9px]">{card.badge}</span>
                    </div>
                    <p className="text-[10px] leading-relaxed" style={{ color: 'var(--text-muted)' }}>{card.description}</p>
                  </div>
                </div>
                <div className="flex items-center justify-between pt-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
                  <span className="text-[10px] font-bold" style={{ color: 'var(--accent)' }}>🖨️ اضغط للمعاينة والطباعة</span>
                  <ChevronLeft size={14} style={{ color: 'var(--text-muted)' }} />
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {/* Tips */}
      <div className="card p-3" style={{ background: 'var(--bg-muted)' }}>
        <div className="flex items-start gap-2">
          <Info size={14} className="text-blue-600 mt-0.5 flex-shrink-0" />
          <div className="flex-1">
            <p className="text-[11px] font-black mb-1">💡 كيف تحوّل التقرير إلى PDF؟</p>
            <ol className="text-[10px] space-y-0.5 pr-4" style={{ color: 'var(--text-secondary)' }}>
              <li>1. اضغط على زر التقرير → ستفتح نافذة معاينة</li>
              <li>2. اضغط "طباعة" → تفتح نافذة طباعة المتصفح</li>
              <li>3. اختر "Save as PDF" أو "حفظ كـ PDF" من قائمة الطابعات</li>
              <li>4. اختر مجلد الحفظ → اضغط "حفظ"</li>
              <li>5. الملف جاهز للإرسال على واتساب أو إيميل ✉️</li>
            </ol>
          </div>
        </div>
      </div>

      {/* Print Preview Modal */}
      {previewContent && (
        <PrintPreviewModal
          content={previewContent}
          title={previewTitle}
          onClose={() => { setPreviewContent(null); setPreviewTitle(''); }}
          onPrint={handlePrint}
          onDownload={handleDownload}
          onShare={handleShare}
        />
      )}
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════
   🖨️ PRINT PREVIEW MODAL
   ═══════════════════════════════════════════════════════════════ */
const PrintPreviewModal = memo(({ content, title, onClose, onPrint, onDownload, onShare }) => {
  const iframeRef = useRef(null);

  useEffect(() => {
    // Block body scroll
    const orig = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = orig; };
  }, []);

  return (
    <div className="print-preview-overlay no-print">
      <div className="print-preview-toolbar">
        <div className="flex items-center gap-2 min-w-0 flex-1">
          <div className="w-8 h-8 rounded-lg flex items-center justify-center bg-white/10 flex-shrink-0">
            <FileText size={16} />
          </div>
          <div className="min-w-0">
            <p className="font-black text-xs truncate">{title}</p>
            <p className="text-[9px] opacity-70">معاينة التقرير قبل الطباعة</p>
          </div>
        </div>
        <div className="flex items-center gap-1.5 flex-shrink-0">
          <button onClick={onPrint} className="btn text-xs py-2 px-3 font-black" style={{ background: '#059669', color: 'white' }}>
            <PrinterIcon size={14} /> <span className="hidden sm:inline">طباعة</span>
          </button>
          <button onClick={onDownload} className="btn text-xs py-2 px-3 font-black" style={{ background: '#635BFF', color: 'white' }}>
            <Download size={14} /> <span className="hidden sm:inline">تنزيل</span>
          </button>
          <button onClick={onShare} className="btn text-xs py-2 px-3 font-black" style={{ background: '#0284C7', color: 'white' }}>
            <Share2 size={14} /> <span className="hidden sm:inline">إرسال</span>
          </button>
          <button onClick={onClose} className="btn text-xs py-2 px-2.5" style={{ background: 'rgba(255,255,255,0.1)', color: 'white' }}>
            <X size={14} />
          </button>
        </div>
      </div>
      <div className="print-preview-body">
        <iframe
          ref={iframeRef}
          srcDoc={content}
          className="print-preview-page"
          style={{ width: '100%', maxWidth: '210mm', height: '100%', minHeight: '297mm', border: 'none', display: 'block' }}
          title={title}
        />
      </div>
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════
   HANY LEDGER VIEW — With Print Button
   ═══════════════════════════════════════════════════════════════ */
const HanyLedgerView = memo(function HanyLedgerView(props) {
  const data = props.data;
  const dispatch = props.dispatch;
  const saveHistory = props.saveHistory;
  const addNotification = props.addNotification;
  const selectedYear = props.selectedYear;
  const selectedMonth = props.selectedMonth;

  const [searchTerm, setSearchTerm] = useState('');
  const [viewMode, setViewMode] = useState('list');
  const [sortBy, setSortBy] = useState('date');
  const [showSettle, setShowSettle] = useState(false);
  const [settleAmount, setSettleAmount] = useState('');
  const [settleMethod, setSettleMethod] = useState('cash');
  const [settleDate, setSettleDate] = useState(getLocalISODate());
  const [settleNote, setSettleNote] = useState('');
  const [linkedHanyMonth, setLinkedHanyMonth] = useState('');
  const [printPreview, setPrintPreview] = useState(null);
  const settlingRef = useRef(false);

  const hanyPayable = useMemo(function () { return computeHanyPayable(data); }, [data]);
  const monthSummary = useMemo(function () {
    return computeHanySummaryForMonth(data, selectedYear, selectedMonth);
  }, [data, selectedYear, selectedMonth]);

  const purchases = useMemo(function () {
    return (data.transactions || [])
      .filter(function (t) {
        return t.method === HANY_TAB_METHOD && isHanyShopCategory(t.category) && !isCarryoverMarker(t);
      })
      .slice()
      .sort(compareTransactions);
  }, [data.transactions]);

  const settlements = useMemo(function () {
    return (data.transactions || [])
      .filter(function (t) { return isHanySettleTx(t) && t.status === 'paid'; })
      .slice()
      .sort(compareTransactions);
  }, [data.transactions]);

  const filteredPurchases = useMemo(function () {
    let arr = purchases.slice();
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(function (t) { return normalizeText(t.description).includes(term); });
    }
    if (sortBy === 'amount') return arr.sort(function (a, b) { return safeNumber(b.amount) - safeNumber(a.amount); });
    if (sortBy === 'name') return arr.sort(function (a, b) { return normalizeText(a.description).localeCompare(normalizeText(b.description)); });
    return arr.sort(compareTransactions);
  }, [purchases, searchTerm, sortBy]);

  const groupedPurchases = useMemo(function () {
    const map = {};
    filteredPurchases.forEach(function (item) {
      const key = (item.description || 'بدون وصف').trim();
      if (!map[key]) map[key] = { name: key, count: 0, total: 0 };
      map[key].count = map[key].count + 1;
      map[key].total = map[key].total + safeNumber(item.amount);
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.total - a.total; });
  }, [filteredPurchases]);

  const totalPurchases = purchases.reduce(function (s, t) { return s + safeNumber(t.amount); }, 0);
  const totalSettlements = settlements.reduce(function (s, t) { return s + safeNumber(t.amount); }, 0);

  const availableMonths = useMemo(() => {
    const list = [];
    YEARS_LIST.forEach(y => {
      getMonthsForYear(y).forEach(m => {
        list.push({ key: makeMonthKey(y, m), label: `${m} ${y}` });
      });
    });
    return list;
  }, []);

  /* 🖨️ Print handler */
  const handlePrintReport = (monthFilter) => {
    const html = generateHanyLedgerReport(data, {
      includePurchases: true,
      includeSettlements: true,
      includeGrouped: true,
      monthFilter: monthFilter ? { month: monthFilter.month, year: monthFilter.year } : null,
      includeWatermark: true
    });
    const title = `كشف دفتر هاني — ${monthFilter ? `${monthFilter.month} ${monthFilter.year}` : 'كل الفترات'}`;
    setPrintPreview({ content: html, title });
  };

  const handlePrint = () => {
    if (!printPreview) return;
    openPrintWindow(printPreview.content, printPreview.title, { autoPrint: true });
    addNotification({ type: 'success', title: 'جاري فتح نافذة الطباعة...', duration: 3000 });
  };

  const handleDownload = () => {
    if (!printPreview) return;
    const fileName = `Hany_Ledger_${printPreview.title.replace(/[^\w\u0600-\u06FF\s-]/g, '_')}_${getLocalISODate()}.html`;
    downloadHtmlReport(printPreview.content, fileName);
    addNotification({ type: 'success', title: '✅ تم التنزيل' });
  };

  const handleShare = async () => {
    if (!printPreview) return;
    const fileName = `Hany_Ledger_${getLocalISODate()}.html`;
    const result = await shareReport(printPreview.title, printPreview.content, fileName);
    if (result.ok) {
      addNotification({ type: 'success', title: '✅ تمت المشاركة' });
    }
  };

  const executeSettle = useCallback(function () {
    if (settlingRef.current) return;
    settlingRef.current = true;

    const proceed = async function () {
      try {
        const check = validateAmount(settleAmount, {
          min: 0.01, max: hanyPayable || 10000000, label: 'المبلغ'
        });
        if (!check.valid) {
          addNotification({ type: 'error', title: 'خطأ', message: check.error });
          return;
        }
        const amount = roundMoney(check.value);
        if (amount > hanyPayable + 0.005) {
          addNotification({ type: 'error', title: 'المبلغ أكبر من المستحق' });
          return;
        }

        if (!HANY_SETTLE_ALLOWED_METHODS.includes(settleMethod)) {
          addNotification({ type: 'error', title: '❌ قناة سداد غير مسموحة', message: 'مسموح فقط: نقدي / CIB / AAIB / Fawry / Etisalat' });
          return;
        }

        const d = parseISODate(settleDate);
        if (!d) {
          addNotification({ type: 'error', title: 'تاريخ غير صحيح' });
          return;
        }
        const txYear = d.getFullYear();
        const txMonth = ALL_MONTHS[d.getMonth()];
        if (isMonthClosed(data, txYear, txMonth)) {
          addNotification({ type: 'error', title: 'شهر مغلق', message: txMonth + ' ' + txYear, duration: 6000 });
          return;
        }

        const liveBalances = computeBalancesAsOf(data);
        const available = safeNumber(liveBalances[settleMethod]);
        if (available < amount - 0.005) {
          addNotification({
            type: 'error',
            title: 'رصيد غير كافٍ',
            message: (ACCOUNT_SHORT_NAMES[settleMethod] || settleMethod) + ': ' + fmt(available) + ' ج.م',
            duration: 7000
          });
          return;
        }

        saveHistory();
        dispatch({
          type: 'HANY_SETTLE',
          payload: {
            amount,
            sourceMethod: settleMethod,
            date: settleDate,
            note: settleNote.trim() || 'سداد دفتر هاني',
            linkedHanyMonth: linkedHanyMonth || null
          }
        });

        const remainingAfter = Math.max(0, hanyPayable - amount);
        const wasPartial = remainingAfter > 0.01;
        let msg = fmt(amount) + ' ج.م من ' + (ACCOUNT_SHORT_NAMES[settleMethod] || settleMethod);
        if (linkedHanyMonth) msg += '\nمرتبط بـ: ' + linkedHanyMonth;
        if (wasPartial) msg += '\nمتبقي ' + fmt(remainingAfter) + ' ج.م';
        else msg += '\nتم سداد الرصيد كاملاً';

        addNotification({
          type: 'success',
          title: '✅ تم تسجيل السداد',
          message: msg,
          duration: 8000
        });

        setShowSettle(false);
        setSettleAmount('');
        setSettleNote('');
        setLinkedHanyMonth('');
      } finally {
        settlingRef.current = false;
      }
    };

    proceed();
  }, [settleAmount, settleDate, settleMethod, settleNote, linkedHanyMonth, hanyPayable, data, saveHistory, dispatch, addNotification]);

  const openSettleModal = function () {
    setSettleAmount(String(hanyPayable));
    setShowSettle(true);
  };

  const canSettle = hanyPayable > 0;
  const payClass = hanyPayable > 0 ? 'text-orange-600' : 'text-emerald-600';

    <div className="space-y-4 animate-fadeIn">

          <div className="flex flex-col gap-1.5">
            <button onClick={openSettleModal} className="btn btn-primary text-xs" disabled={!canSettle}>

            <button onClick={() => handlePrintReport(null)}

              style={{ background: 'linear-gradient(135deg, #0A1628 0%, #635BFF 100%)', color: 'white' }}>
              <PrinterIcon size={14} /> طباعة الكشف

            <button onClick={() => handlePrintReport({ month: selectedMonth, year: selectedYear })}

              style={{ background: 'white', color: '#EA580C', border: '2px solid #EA580C' }}>
              <FileDown size={14} /> {selectedMonth} فقط

        </div>

        <div className="grid grid-cols-3 gap-2 mt-4">
          <div className="p-2.5 rounded-xl bg-white/60 dark:bg-black/20 text-center">
            <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>إجمالي المشتريات</p>
            <p className="text-sm font-black text-red-600 mt-0.5 money tabular">{fmt(totalPurchases)}</p>
            <p className="text-[9px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{purchases.length} عملية</p>
          </div>
          <div className="p-2.5 rounded-xl bg-white/60 dark:bg-black/20 text-center">
            <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>إجمالي السداد</p>
            <p className="text-sm font-black text-emerald-600 mt-0.5 money tabular">{fmt(totalSettlements)}</p>
            <p className="text-[9px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{settlements.length} دفعة</p>
          </div>
          <div className="p-2.5 rounded-xl bg-white/60 dark:bg-black/20 text-center">
            <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الحالة</p>

          </div>
          <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
            <p className="text-[9px] font-bold text-emerald-700 dark:text-emerald-400">سداد</p>
            <p className="text-xs font-black text-emerald-600 money tabular">-{fmtShort(monthSummary.settlements)}</p>

              <div className="flex gap-1.5 mt-2 flex-wrap">

              <select className="input-field text-sm" value={settleMethod} onChange={function (e) { setSettleMethod(e.target.value); }}>
                {PAYMENT_METHODS.filter(function (m) { return HANY_SETTLE_ALLOWED_METHODS.includes(m.id); }).map(function (m) {
                  return <option key={m.id} value={m.id}>{m.label}</option>;

              </select>
            </div>

            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>مرتبط بشهر (اختياري)</label>
              <select className="input-field text-sm" value={linkedHanyMonth} onChange={function (e) { setLinkedHanyMonth(e.target.value); }}>
                <option value="">— غير محدد —</option>
                {availableMonths.map(function (m) {
                  return <option key={m.key} value={m.label}>{m.label}</option>;
                })}
              </select>
              <p className="text-[9px] mt-1 font-semibold" style={{ color: 'var(--text-muted)' }}>لربط السداد بشهر محدد — يساعد في التتبع</p>
            </div>

            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>التاريخ</label>
              <input type="date" className="input-field text-xs font-bold" value={settleDate} onChange={function (e) { setSettleDate(e.target.value); }} />
            </div>

            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>ملاحظة (اختياري)</label>
              <input type="text" className="input-field text-sm" value={settleNote} onChange={function (e) { setSettleNote(e.target.value); }} placeholder="سداد مسحوبات شهر..." />
            </div>

            <button onClick={executeSettle} className="btn btn-primary w-full py-3 text-sm">
              <CheckCircle2 size={16} />
              <span>تسجيل السداد</span>
            </button>
          </div>
        </Modal>
      ) : null}

      {printPreview && (
        <PrintPreviewModal
          content={printPreview.content}
          title={printPreview.title}
          onClose={() => setPrintPreview(null)}
          onPrint={handlePrint}
          onDownload={handleDownload}
          onShare={handleShare}
        />
      )}
    </div>
  );
});

/* ═══════════════ TX BADGES ═══════════════ */
const SmsBadge = memo(({ tx }) => {
  if (tx?.source !== 'sms') return null;
  const last4 = tx.cardLast4 || (tx.linkedCardId ? (DEFAULT_CARDS.find(c => c.id === tx.linkedCardId)?.last4) : null);
  return <span className="badge badge-accent" title={tx.smsBank ? `${tx.smsBank} • ${last4 || ''}` : ''}>SMS{last4 ? ` • ••••${last4}` : ''}</span>;
});
const TeldaBadge = memo(({ tx }) => {
  if (!EXTERNAL_TRANSFER_METHOD_IDS.includes(tx?.method) && !tx?.transferChannel) return null;
  return <span className="badge badge-accent">Telda</span>;
});
const RecurringBadge = memo(({ tx }) => {
  if (!tx?.sourceRecurringId) return null;
  return <span className="badge badge-warning" title="مولّد تلقائياً">تلقائي</span>;
});
const CarryoverBadge = memo(({ tx }) => {
  if (tx?.source !== 'carryover' || tx?.hanyEffect === 'carryover-marker') return null;
  return <span className="badge badge-warning">مرحّل{tx.carryCount ? ` ×${tx.carryCount}` : ''}</span>;
});
const TransferBadge = memo(({ tx }) => {
  if (!tx?.linkedTransferId && tx?.source !== 'external-transfer') return null;
  const dir = tx.transferDirection;
  if (dir === 'out') return <span className="badge badge-accent">خروج ↗</span>;
  if (dir === 'in') return <span className="badge badge-success">دخول ↘</span>;
  if (dir === 'fee') return <span className="badge badge-warning">رسوم</span>;
  return <span className="badge badge-accent">تحويل</span>;
});
const CreditBadge = memo(({ tx }) => {
  if (tx?.type !== 'income' || tx?.sourceRecurringId) return null;
  return <span className="badge badge-success">وارد</span>;
});
const ReconciliationBadge = memo(({ tx }) => {
  if (tx?.source !== 'reconciliation') return null;
  return <span className="badge badge-warning">⚖️ تسوية</span>;
});
const HanyPurchaseBadge = memo(({ tx }) => {
  if (isCarryoverMarker(tx)) return null;
  if (tx?.hanyEffect !== 'purchase' && tx?.method !== HANY_TAB_METHOD) return null;
  return <span className="badge badge-warning" title="مسجّلة على دفتر هاني — بدون تأثير نقدي">🛒 هاني</span>;
});
const HanySettleBadge = memo(({ tx }) => {
  if (tx?.hanyEffect !== 'settle' && !isHanySettleCategory(tx?.category)) return null;
  return <span className="badge badge-success" title={`سداد دفتر هاني${tx?.linkedHanyMonth ? ` — ${tx.linkedHanyMonth}` : ''}`}>💵 سداد هاني</span>;
});
const HanyMarkerBadge = memo(({ tx }) => {
  if (!isCarryoverMarker(tx)) return null;
  return <span className="badge badge-warning" title="قيد ترحيل للمرجع فقط — لا يُحسب">📌 ترحيل</span>;
});
const CardPaymentBadge = memo(({ tx, cardId }) => {
  if (!tx) return null;
  if (tx.source === 'card-payment-plan' || (tx.linkedCardId && isCardPaymentTx(tx, tx.linkedCardId))) {
    return <span className="badge badge-success" title="سداد بطاقة — يقلل المديونية">💳 سداد</span>;
  }
  return null;
});

const FAMILY_MEMBERS = {
  ans: { name: 'أنس', bg: 'bg-blue-50 dark:bg-blue-950/40', text: 'text-blue-700 dark:text-blue-300', border: 'border-blue-200 dark:border-blue-900' },
  abdelrahman: { name: 'عبد الرحمن', bg: 'bg-emerald-50 dark:bg-emerald-950/40', text: 'text-emerald-700 dark:text-emerald-300', border: 'border-emerald-200 dark:border-emerald-900' },
  salma: { name: 'سلمى', bg: 'bg-purple-50 dark:bg-purple-950/40', text: 'text-purple-700 dark:text-purple-300', border: 'border-purple-200 dark:border-purple-900' },
  om_abdo: { name: 'أم عبده', bg: 'bg-pink-50 dark:bg-pink-950/40', text: 'text-pink-700 dark:text-pink-300', border: 'border-pink-200 dark:border-pink-900' }
};
const getFamilyMember = (tx) => FAMILY_MEMBERS[tx?.createdBy] || null;
const isFamilyTx = (tx) => tx?.source === 'family-app' || !!FAMILY_MEMBERS[tx?.createdBy];

const FamilyBadge = memo(({ tx }) => {
  const m = getFamilyMember(tx);
  if (!m) return null;
  return (<span className={`badge ${m.bg} ${m.text} border ${m.border}`}>{m.name}</span>);
});

const getTxDisplay = (t) => {
  if (!t) return '';
  const base = t.description || t.category || 'بدون وصف';
  if (t.quantity && Number(t.quantity) > 1 && !String(base).includes('×')) return `${base} (×${t.quantity})`;
  return base;
};
const getTxDisplayText = (t) => {
  if (!t) return '';
  const base = t.description || t.category || 'بدون وصف';
  if (String(base).includes('×')) return base;
  if (t.quantity && Number(t.quantity) > 1) return `${base} ⟨${t.quantity} وحدة⟩`;
  return base;
};

const TxTimeChip = memo(({ createdAt }) => {
  const time = formatTxTime(createdAt);
  if (!time) return null;
  return (<span className="tx-time-chip"><Clock size={9} />{time}</span>);
});

const groupTransactionsByDate = (list) => {
  const groups = {};
  (list || []).forEach(t => {
    const d = t.date || 'unknown';
    if (!groups[d]) groups[d] = [];
    groups[d].push(t);
  });
  const today = getLocalISODate();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const yestISO = getLocalISODate(yest);

  return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
    const sortedItems = [...groups[date]].sort(compareTransactions);
    let label;
    if (date === today) label = '📅 النهاردة';
    else if (date === yestISO) label = '📅 امبارح';
    else {
      const dObj = parseISODate(date);
      if (dObj) {
        const ds = dObj.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' });
        const ys = dObj.getFullYear() !== new Date().getFullYear() ? ' ' + dObj.getFullYear() : '';
        label = '📅 ' + ds + ys;
      } else label = '📅 ' + date;
    }
    const total = sortedItems.reduce((s, t) => s + safeNumber(t.amount), 0);
    return { date, label, items: sortedItems, total };
  });
};

const DayGroupHeader = memo(({ label, total, count }) => (
  <div className="day-header">
    <div className="day-header-badge">

const DashboardView = memo(({
  data, financeSnapshot, liveBalances, liquidityDual, netWorthData,
  walletVisibility, onToggleVisibility, dispatch, selectedYear, selectedMonth,
  transactions, cards, updatedLoans, chartData, isDarkMode, addNotification,
  onSelectYear, onSelectMonth, custodySummary, monthCashback, bankFeesMonth, hanySummary
}) => {
  const totalCardDebt = useMemo(() =>
    cards.reduce((s, c) => s + Math.max(0, computeCardDebt(data, c)), 0),
    [cards, data]
  );
  const totalLoanDebt = useMemo(() =>
    updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0),
    [updatedLoans]
  );
  const grandTotalDebt = totalCardDebt + totalLoanDebt;
  const hanyPayable = netWorthData.hanyPayable;
  const netPosition = netWorthData.netWorth;

  const monthPendingCount = transactions.filter(t =>
    t.month === selectedMonth && (t.year || 2026) === selectedYear
    && t.status !== 'paid' && !isCarryoverMarker(t)
  ).length;

  const pieData = useMemo(() => {
    const acc = {};
    transactions.filter(t =>
      t.type === 'expense' && t.month === selectedMonth && (t.year || 2026) === selectedYear
      && t.status === 'paid' && safeNumber(t.amount) > 0
      && t.method !== HANY_TAB_METHOD && !isCarryoverMarker(t)
    ).forEach(t => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); });
    const sorted = Object.entries(acc).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
    if (sorted.length <= 5) return sorted;
    const top = sorted.slice(0, 4);
    const restVal = sorted.slice(4).reduce((s, i) => s + i.value, 0);
    return [...top, { name: 'أخرى', value: restVal }];
  }, [transactions, selectedMonth, selectedYear]);

  const net = financeSnapshot;
  const isDataEmpty = !transactions.length && !cards.some(c => safeNumber(c.limit) > 0);

  const openAddForm = (type) => {
    dispatch({ type: 'SET_FORM_MODE', payload: 'add' });

        subType: type === 'income' ? 'deposit' : 'withdrawal',
        category: '', status: 'pending'

              <h3 className="font-black text-sm text-orange-700 dark:text-orange-400">🛒 دفتر محل هاني — {selectedMonth}</h3>
              <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>رصيد تراكمي · بدون تأثير نقدي عند الشراء</p>
            </div>
            <ChevronLeft size={16} style={{ color: 'var(--text-muted)' }} />
          </div>
          <div className="grid grid-cols-3 gap-2">
            <div className="p-2 rounded-lg bg-white/60 dark:bg-black/20 text-center">
              <p className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>افتتاحي</p>
              <p className="text-xs font-black text-slate-700 dark:text-slate-300 money tabular">{fmtShort(hanySummary.opening)}</p>
            </div>
            <div className="p-2 rounded-lg bg-white/60 dark:bg-black/20 text-center">
              <p className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>مشتريات</p>
              <p className="text-xs font-black text-red-600 money tabular">+{fmtShort(hanySummary.purchases)}</p>
            </div>
            <div className="p-2 rounded-lg bg-white/60 dark:bg-black/20 text-center">
              <p className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>سداد</p>
              <p className="text-xs font-black text-emerald-600 money tabular">−{fmtShort(hanySummary.settlements)}</p>
            </div>
          </div>
          <div className="mt-2 p-2 rounded-lg bg-orange-50 dark:bg-orange-950/30 text-center">
            <p className="text-[10px] font-bold text-orange-700 dark:text-orange-400">الرصيد الحالي</p>
            <p className="text-base font-black text-orange-600 money tabular">{fmt(hanySummary.closing)}</p>
          </div>
        </button>
      )}

      {cards.length > 0 && (
        <CardsMiniPanel cards={cards} data={data} dispatch={dispatch} />
      )}

      <div className="grid grid-cols-3 gap-2">
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'loans' })} className="card card-hover py-3 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1.5">
            <Briefcase size={12} className="text-blue-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>عهدة</span>
          </div>
          <p className={`text-sm font-black money tabular ${custodySummary?.balance > 0 ? 'text-blue-600' : custodySummary?.balance < 0 ? 'text-red-600' : 'text-emerald-600'}`}>
            {fmt(custodySummary?.balance || 0)}
          </p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'cards' })} className="card card-hover py-3 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1.5">
            <Gift size={12} className="text-emerald-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>كاش باك</span>
          </div>
          <p className="text-sm font-black text-emerald-600 money tabular">{fmt(monthCashback?.received || 0)}</p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'transactions' })} className="card card-hover py-3 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1.5">
            <Receipt size={12} className="text-red-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>رسوم</span>
          </div>
          <p className="text-sm font-black text-red-600 money tabular">{fmt(bankFeesMonth || 0)}</p>
        </button>
      </div>

      <QuickBalanceOverview balances={liveBalances} walletVisibility={walletVisibility} onToggleVisibility={onToggleVisibility} />

      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
        <div className="card">
          <h3 className="font-black text-sm mb-3 flex items-center gap-2">
            <BarChart3 className="text-[color:var(--accent)]" size={16} /> التدفق النقدي — {selectedYear}
          </h3>
          <div className="h-48">
            {chartData.every(d => d['دخل'] === 0 && d['مصروف'] === 0) ? (
              <div className="h-full flex flex-col items-center justify-center">
                <BarChart3 size={32} style={{ color: 'var(--text-muted)' }} />
                <p className="font-semibold text-xs mt-2" style={{ color: 'var(--text-muted)' }}>لا توجد بيانات بعد</p>
              </div>
            ) : (
              <ResponsiveContainer width="100%" height="100%">
                <AreaChart data={chartData}>
                  <defs>
                    <linearGradient id="incGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="#00A86B" stopOpacity={0.3} />
                      <stop offset="100%" stopColor="#00A86B" stopOpacity={0} />
                    </linearGradient>
                    <linearGradient id="expGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="#DC2626" stopOpacity={0.3} />
                      <stop offset="100%" stopColor="#DC2626" stopOpacity={0} />
                    </linearGradient>
                  </defs>
                  <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.06} />
                  <XAxis dataKey="name" fontSize={9} stroke="#94A3B8" />
                  <YAxis fontSize={9} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
                  <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '12px', border: '1px solid var(--border-subtle)', backgroundColor: isDarkMode ? '#0D1524' : 'white', fontFamily: 'Cairo', fontSize: '12px' }} />
                  <Area type="monotone" dataKey="دخل" stroke="#00A86B" strokeWidth={2} fill="url(#incGrad)" />
                  <Area type="monotone" dataKey="مصروف" stroke="#DC2626" strokeWidth={2} fill="url(#expGrad)" />
                </AreaChart>
              </ResponsiveContainer>
            )}
          </div>
        </div>

        <div className="card">
          <h3 className="font-black text-sm mb-3 flex items-center gap-2">
            <PieChartIcon className="text-purple-500" size={16} /> توزيع مصروفات {selectedMonth}
          </h3>
          <div className="h-48">
            {pieData.length === 0 ? (
              <div className="h-full flex flex-col items-center justify-center">
                <PieChartIcon size={32} style={{ color: 'var(--text-muted)' }} />
                <p className="font-semibold text-xs mt-2" style={{ color: 'var(--text-muted)' }}>لا توجد مصروفات</p>
              </div>
            ) : (
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={pieData} cx="50%" cy="50%" innerRadius={50} outerRadius={80} paddingAngle={3} dataKey="value" cornerRadius={6}>
                    {pieData.map((e, i) => (<Cell key={i} fill={CATEGORY_COLORS[e.name] || '#94A3B8'} stroke="none" />))}
                  </Pie>
                  <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '12px', border: '1px solid var(--border-subtle)', backgroundColor: isDarkMode ? '#0D1524' : 'white', fontFamily: 'Cairo', fontSize: '12px' }} />
                  <Legend layout="vertical" verticalAlign="middle" align="right" iconType="circle" wrapperStyle={{ fontSize: '10px', fontWeight: 'bold' }} />
                </PieChart>
              </ResponsiveContainer>
            )}
          </div>
        </div>
      </div>
    </div>
  );
});

/* ═══════════════ CATEGORY DETAIL MODAL ═══════════════ */
const CategoryDetailModal = memo(({ category, transactions, selectedMonth, selectedYear, dispatch, addNotification }) => {
  const [filterType, setFilterType] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');

  const categoryTx = useMemo(() => transactions.filter(t =>
    t.category === category && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).sort(compareTransactions), [transactions, category, selectedMonth, selectedYear]);

  const filteredTx = useMemo(() => {
    let arr = categoryTx;
    if (filterType === 'paid') arr = arr.filter(t => t.status === 'paid');
    if (filterType === 'pending') arr = arr.filter(t => t.status !== 'paid');
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.method).includes(term));
    }
    return arr;
  }, [categoryTx, filterType, searchTerm]);

  const stats = useMemo(() => {
    const paid = categoryTx.filter(t => t.status === 'paid');
    const pending = categoryTx.filter(t => t.status !== 'paid');
    const totalPaid = paid.reduce((s, t) => s + safeNumber(t.amount), 0);
    const totalPending = pending.reduce((s, t) => s + safeNumber(t.amount), 0);
    const count = categoryTx.length;
    const average = count > 0 ? (totalPaid + totalPending) / count : 0;
    return { totalPaid, totalPending, total: totalPaid + totalPending, count, paidCount: paid.length, pendingCount: pending.length, average };
  }, [categoryTx]);

  const dailyGroups = useMemo(() => groupTransactionsByDate(filteredTx), [filteredTx]);

  const handlePrint = () => {
    const reportTitle = `كشف فئة: ${category} — ${selectedMonth} ${selectedYear}`;
    const rows = dailyGroups.map(group => `
      <tr class="report-day-header"><td colspan="3">${escapeHtml(group.label)} — إجمالي: ${fmt(group.total)} ج.م</td></tr>
      ${group.items.map(t => `
        <tr>
          <td class="col-date">${formatArabicDate(t.date)}</td>
          <td class="col-desc">${escapeHtml(getTxDisplayText(t))}</td>
          <td class="col-amount ${t.type === 'income' ? 'credit' : 'debit'}">${t.type === 'income' ? '+' : '−'}${fmt(t.amount)}</td>
        </tr>
      `).join('')}
    `).join('');

    const content = `
      ${buildReportHeader(reportTitle, { badge: 'تفاصيل فئة' })}
      <div class="report-kpi-grid">
        <div class="report-kpi success"><div class="kpi-label">معتمد</div><div class="kpi-value">${fmt(stats.totalPaid)}</div></div>
        <div class="report-kpi warning"><div class="kpi-label">معلق</div><div class="kpi-value">${fmt(stats.totalPending)}</div></div>
        <div class="report-kpi accent"><div class="kpi-label">العدد</div><div class="kpi-value">${stats.count}</div></div>
        <div class="report-kpi info"><div class="kpi-label">المتوسط</div><div class="kpi-value">${fmt(stats.average)}</div></div>
      </div>
      <div class="report-section-title"><span>📋 التفاصيل</span></div>
      <table class="report-table">
        <thead><tr><th style="width:100px">التاريخ</th><th>البيان</th><th style="width:120px">المبلغ (ج.م)</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="report-totals-box">
        <div class="report-totals-row final">
          <span class="total-label">📊 الإجمالي</span>
          <span class="total-value">${fmt(stats.total)} ج.م</span>
        </div>
      </div>
      ${buildReportFooter(`كشف فئة: ${category}`)}
    `;
    const html = wrapReportHtml(`<div style="position:relative">${content}</div>`, reportTitle);
    openPrintWindow(html, reportTitle, { autoPrint: true });
    addNotification({ type: 'success', title: 'جاري فتح الطباعة...' });
  };

  const close = () => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: null });

  return (
    <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) close(); }}>
      <div className="generic-modal max-w-3xl">
        <div className="generic-modal-header">
          <div className="flex items-center gap-2 min-w-0">
            <div className="p-2 rounded-lg flex-shrink-0" style={{ background: `${CATEGORY_COLORS[category] || '#635BFF'}20`, color: CATEGORY_COLORS[category] || '#635BFF' }}>
              <Layers size={18} />
            </div>
            <div className="min-w-0">
              <h3 className="text-base font-black truncate">{category}</h3>
              <p className="text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} • {stats.count} معاملة</p>
            </div>
          </div>
          <button onClick={close} className="btn btn-ghost p-1.5"><X size={16} /></button>
        </div>
        <div className="generic-modal-body">
          <div className="grid grid-cols-4 gap-2 mb-4">
            <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
              <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">معتمد</p>
              <p className="text-sm font-black text-emerald-600 mt-0.5 money tabular">{fmt(stats.totalPaid)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-center">
              <p className="text-[10px] font-bold text-amber-700 dark:text-amber-400">معلق</p>
              <p className="text-sm font-black text-amber-600 mt-0.5 money tabular">{fmt(stats.totalPending)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
              <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">العدد</p>
              <p className="text-sm font-black text-blue-600 mt-0.5 money tabular">{stats.count}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-center">
              <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">المتوسط</p>
              <p className="text-sm font-black text-purple-600 mt-0.5 money tabular">{fmt(stats.average)}</p>
            </div>
          </div>
          <div className="flex gap-1.5 flex-wrap mb-3">
            <div className="relative flex-1 min-w-[140px]">
              <Search className="absolute right-2.5 top-1/2 -translate-y-1/2" size={12} style={{ color: 'var(--text-muted)' }} />
              <input type="text" placeholder="ابحث..." className="input-field pr-8 text-[11px] py-2" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
            </div>
            <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <button type="button" onClick={() => setFilterType('all')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'all' ? 'shadow-sm' : ''}`} style={filterType === 'all' ? { background: 'var(--bg-card)', color: 'var(--accent)' } : { color: 'var(--text-muted)' }}>الكل ({categoryTx.length})</button>
              <button type="button" onClick={() => setFilterType('paid')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'paid' ? 'shadow-sm' : ''}`} style={filterType === 'paid' ? { background: 'var(--bg-card)', color: 'var(--success)' } : { color: 'var(--text-muted)' }}>معتمد ({stats.paidCount})</button>
              <button type="button" onClick={() => setFilterType('pending')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'pending' ? 'shadow-sm' : ''}`} style={filterType === 'pending' ? { background: 'var(--bg-card)', color: 'var(--warning)' } : { color: 'var(--text-muted)' }}>معلق ({stats.pendingCount})</button>
            </div>
            <button type="button" onClick={handlePrint} disabled={filteredTx.length === 0} className="btn btn-secondary text-[10px] py-2 px-2.5">
              <PrinterIcon size={11} /><span className="hidden sm:inline">طباعة</span>
            </button>
          </div>
          {filteredTx.length === 0 ? (
            <div className="text-center py-8">
              <Layers size={32} className="mx-auto mb-2" style={{ color: 'var(--text-muted)' }} />
              <p className="font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد نتائج</p>
            </div>
          ) : (
            <div className="space-y-2 max-h-[50vh] overflow-y-auto scroll-hide">
              {dailyGroups.map(group => (
                <div key={group.date}>
                  <DayGroupHeader label={group.label} total={group.total} count={group.items.length} />
                  <div className="space-y-1.5">
                    {group.items.map(t => (
                      <div key={t.id} className="flex justify-between items-center gap-2 p-2.5 rounded-lg" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                        <div className="min-w-0 flex-1">
                          <p className="font-bold text-xs truncate flex items-center gap-1 flex-wrap">
                            {getTxDisplayText(t)} <TxTimeChip createdAt={t.createdAt} />
                            <SmsBadge tx={t} /> <TeldaBadge tx={t} /> <TransferBadge tx={t} />
                            <RecurringBadge tx={t} /> <CarryoverBadge tx={t} /> <ReconciliationBadge tx={t} />
                            <HanyPurchaseBadge tx={t} /> <HanySettleBadge tx={t} /> <HanyMarkerBadge tx={t} />
                            <CardPaymentBadge tx={t} />
                          </p>
                          <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
                            {PAYMENT_METHODS.find(p => p.id === t.method)?.label || t.method || '—'}
                            {t.status === 'paid' ? <span className="text-emerald-600 mr-2">✅ معتمد</span> : <span className="text-amber-600 mr-2">⏳ معلق</span>}
                          </p>
                        </div>
                        <span className={`font-black text-xs flex-shrink-0 money tabular ${t.type === 'income' ? 'text-emerald-600' : 'text-red-600'}`}>
                          {t.type === 'income' ? '+' : '−'}{fmt(t.amount)}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="generic-modal-footer">
          <button onClick={close} className="btn btn-secondary flex-1 text-sm">إغلاق</button>
        </div>
      </div>
    </div>
  );
});

/* ═══════════════ CATEGORIES VIEW ═══════════════ */
const CategoriesView = memo(({
  transactions, selectedMonth, selectedYear, catViewType, budgets,
  dispatch, onSelectYear, onSelectMonth
}) => {
  const catTotals = useMemo(() => transactions.filter(t =>
    t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear
    && !isCarryoverMarker(t)
  ).reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); return acc; }, {}),
    [transactions, catViewType, selectedMonth, selectedYear]);

  const catCounts = useMemo(() => transactions.filter(t =>
    t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear
    && !isCarryoverMarker(t)
  ).reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + 1; return acc; }, {}),
    [transactions, catViewType, selectedMonth, selectedYear]);

  const hasAnyData = Object.keys(catTotals).length > 0;

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card flex justify-between items-center gap-2 flex-wrap">
        <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
          <button type="button" onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'expense' })}
            className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'expense' ? 'shadow-sm text-red-600 dark:text-red-400' : ''}`}
            style={catViewType === 'expense' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}>مصروفات</button>
          <button type="button" onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'income' })}
            className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'income' ? 'shadow-sm text-emerald-600 dark:text-emerald-400' : ''}`}
            style={catViewType === 'income' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}>إيرادات</button>
        </div>
        <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>💡 اضغط على الفئة لعرض التفاصيل والطباعة</p>
      </div>

      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />

      {!hasAnyData ? (
        <div className="card text-center p-12">
          <Layers size={40} className="mx-auto mb-3 text-[color:var(--accent)]" />
          <h3 className="text-base font-black mb-2">لا توجد {catViewType === 'expense' ? 'مصروفات' : 'إيرادات'} في {selectedMonth}</h3>
          <p className="text-xs" style={{ color: 'var(--text-muted)' }}>ابدأ بإضافة معاملات من صفحة المعاملات</p>
        </div>
      ) : (
        <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
          {CATEGORIES[catViewType].map(cat => {
            const spent = catTotals[cat] || 0;
            const budget = budgets[cat] || 0;
            const overBudget = budget > 0 && spent > budget;
            const count = catCounts[cat] || 0;
            if (spent === 0 && budget === 0) return null;
            return (
              <div key={cat} className="card card-hover p-3 cursor-pointer active:scale-[0.98]"
                onClick={() => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: cat })}>
                <div className="flex justify-between mb-2">
                  <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: CATEGORY_COLORS[cat] }}>
                    <Layers size={14} />
                  </div>
                  <button type="button" aria-label="ميزانية"
                    onClick={(e) => {
                      e.stopPropagation();
                      dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: cat });
                      dispatch({ type: 'SET_BUDGET_AMOUNT', payload: budgets[cat] || '' });
                    }}
                    className="btn btn-ghost p-1"><SettingsIcon size={12} /></button>
                </div>
                <h3 className="font-bold text-[11px] mb-1 truncate">{cat}</h3>
                <p className="text-base font-black tracking-tight money tabular">
                  {fmt(spent)}<span className="text-[9px] font-semibold mr-1" style={{ color: 'var(--text-muted)' }}>ج.م</span>
                </p>
                {count > 0 && <p className="text-[9px] font-bold mt-0.5" style={{ color: 'var(--text-muted)' }}>📋 {count} معاملة</p>}
                {catViewType === 'expense' && budget > 0 && (
                  <div className="mt-2 pt-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
                    <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                      <div style={{ width: `${Math.min(100, (spent / budget) * 100)}%` }} className={`h-full ${overBudget ? 'bg-red-500' : 'bg-emerald-500'}`}></div>
                    </div>
                    <p className="text-[9px] font-bold mt-1" style={{ color: 'var(--text-muted)' }}>من {fmt(budget)}</p>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
});

/* ═══════════════ TRANSACTIONS VIEW ═══════════════ */
const TransactionsView = memo(({
  groupedTransactions, transactions, selectedMonth, selectedYear, transViewMode,
  statusFilter, searchTerm, expandedGroup, data, monthInsights, dispatch,
  handleDelete, addNotification, onSelectYear, onSelectMonth, saveHistory, onBulkDelete
}) => {
  const [sourceFilter, setSourceFilter] = useState('all');
  const [showFilters, setShowFilters] = useState(false);
  const [showHanyOnly, setShowHanyOnly] = useState(false);
  const [showCardPaymentsOnly, setShowCardPaymentsOnly] = useState(false);
  const [selectMode, setSelectMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState(new Set());

  const monthTx = useMemo(() => transactions.filter(t =>
    t.month === selectedMonth && (t.year || 2026) === selectedYear && !isCarryoverMarker(t)
  ), [transactions, selectedMonth, selectedYear]);

  const filteredMonthTx = useMemo(() => {
    let arr = monthTx;
    if (transViewMode !== 'all') arr = arr.filter(t => t.type === transViewMode);
    if (statusFilter === 'paid') arr = arr.filter(t => t.status === 'paid');
    if (statusFilter === 'pending') arr = arr.filter(t => t.status !== 'paid');
    if (showHanyOnly) arr = arr.filter(t => isHanyPurchaseTx(t) || isHanySettleTx(t));
    if (showCardPaymentsOnly) arr = arr.filter(t => t.source === 'card-payment-plan' || (t.linkedCardId && isCardPaymentTx(t, t.linkedCardId)));
    if (sourceFilter === 'self') arr = arr.filter(t => !isFamilyTx(t));
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.category).includes(term));
    }
    return sortTransactions(arr);
  }, [monthTx, transViewMode, statusFilter, showHanyOnly, showCardPaymentsOnly, sourceFilter, searchTerm]);

  const pendingTx = filteredMonthTx.filter(t => t.status !== 'paid');
  const paidTx = filteredMonthTx.filter(t => t.status === 'paid');

  const dailyGroups = useMemo(() => groupTransactionsByDate(paidTx), [paidTx]);
  const pendingGroups = useMemo(() => {
    const map = {};
    pendingTx.forEach(t => {
      if (!map[t.category]) map[t.category] = { category: t.category, items: [], total: 0 };
      map[t.category].items.push(t);
      map[t.category].total += safeNumber(t.amount);
    });
    return Object.values(map).sort((a, b) => b.total - a.total);
  }, [pendingTx]);

  const isClosed = isMonthClosed(data, selectedYear, selectedMonth);

  const toggleSelect = useCallback((id) => {
    setSelectedIds(prev => { const next = new Set(prev); if (next.has(id)) next.delete(id); else next.add(id); return next; });
  }, []);
  const exitSelectMode = useCallback(() => { setSelectMode(false); setSelectedIds(new Set()); }, []);

  const approveOne = (t) => {
    if (isClosed) { addNotification({ type: 'error', title: 'محظور' }); return; }
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(tr => tr.id === t.id ? { ...tr, status: 'paid' } : tr) });
    addNotification({ type: 'success', title: 'تم الاعتماد' });
  };
  const approveAll = () => {
    if (isClosed) { addNotification({ type: 'error', title: 'محظور' }); return; }
    dispatch({
      type: 'SHOW_CONFIRM', danger: false,
      title: 'اعتماد الكل', message: `سيتم اعتماد ${pendingTx.length} عملية`,
      onConfirm: () => {
        saveHistory();
        const ids = new Set(pendingTx.map(t => t.id));
        dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t) });
        addNotification({ type: 'success', title: 'تم الاعتماد' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const handlePrint = () => {
    const html = generateTransactionsReport(data, {
      selectedMonth, selectedYear,
      filterType: transViewMode === 'all' ? 'all' : transViewMode,
      includeOnlyPaid: statusFilter === 'paid',
      includeWatermark: true
    });
    openPrintWindow(html, `كشف المعاملات — ${selectedMonth} ${selectedYear}`, { autoPrint: true });
    addNotification({ type: 'success', title: 'جاري فتح الطباعة...' });
  };

  const handleBulkDelete = () => {
    const ids = [...selectedIds];
    if (ids.length === 0) { addNotification({ type: 'info', title: 'لم تحدد أي معاملة' }); return; }
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: `حذف ${ids.length} معاملة`, message: 'سيتم نقلهم للأرشيف',
      onConfirm: () => { if (onBulkDelete) onBulkDelete(ids); exitSelectMode(); },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-center flex-wrap gap-2 mb-3">
          <div>
            <h2 className="text-lg font-black">
              {transViewMode === 'expense' ? 'المصروفات' : transViewMode === 'income' ? 'الإيرادات' : 'كل المعاملات'}
            </h2>
            <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>
              {selectedMonth} {selectedYear} • {monthTx.length} معاملة
            </p>
          </div>
          <div className="flex gap-1.5 flex-wrap">
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'all' })} className={`btn ${transViewMode === 'all' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>الكل</button>
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'expense' })} className={`btn ${transViewMode === 'expense' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>مصروفات</button>
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'income' })} className={`btn ${transViewMode === 'income' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>إيرادات</button>
            <button onClick={handlePrint} className="btn text-[11px] px-2.5 py-1.5" style={{ background: 'linear-gradient(135deg, #0A1628 0%, #635BFF 100%)', color: 'white' }}>
              <PrinterIcon size={12} /> طباعة
            </button>
          </div>
        </div>

        {selectMode ? (
          <div className="p-3 rounded-lg mb-3 flex flex-wrap items-center gap-2" style={{ background: 'var(--accent-soft)', border: '1px solid var(--accent)' }}>
            <div className="flex-1 min-w-[180px]">
              <p className="text-xs font-black" style={{ color: 'var(--accent)' }}>🔘 وضع التحديد المتعدد</p>
              <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>تم تحديد <strong className="money tabular">{selectedIds.size}</strong> معاملة</p>
            </div>
            <button onClick={handleBulkDelete} disabled={selectedIds.size === 0} className={`btn ${selectedIds.size === 0 ? 'btn-secondary' : 'btn-primary'} text-[11px] py-1.5 px-2.5`}>
              <Trash2 size={12} /> حذف ({selectedIds.size})
            </button>
            <button onClick={exitSelectMode} className="btn btn-ghost text-[11px] py-1.5 px-2.5">خروج</button>
          </div>
        ) : (
          <div className="flex gap-1.5 mb-3">
            <button onClick={() => setSelectMode(true)} className="btn btn-secondary text-[11px] py-1.5 px-2.5">
              <CheckCircle2 size={12} /> تحديد متعدد
            </button>
          </div>
        )}

        <div className="grid grid-cols-3 gap-2">
          <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30">
            <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">محصل</p>
            <p className="text-sm font-black text-emerald-600 mt-0.5 money tabular">{fmt(monthInsights.inc)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30">
            <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مدفوع</p>
            <p className="text-sm font-black text-red-600 mt-0.5 money tabular">{fmt(monthInsights.exp)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الصافي</p>
            <p className={`text-sm font-black mt-0.5 money tabular ${monthInsights.net >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(monthInsights.net)}</p>
          </div>
        </div>

        <div className="flex gap-1.5 mt-3 flex-wrap">
          <button onClick={() => setShowHanyOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showHanyOnly ? 'btn-primary' : 'btn-secondary'}`}>
            🛒 هاني
          </button>
          <button onClick={() => setShowCardPaymentsOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showCardPaymentsOnly ? 'btn-primary' : 'btn-secondary'}`}>
            💳 سداد بطاقات
          </button>
          {isClosed ? (
            <React.Fragment>
              <div className="badge badge-success px-2 py-1 text-[10px]"><ShieldCheck size={10} /> مغلق</div>
              <button onClick={() => dispatch({
                type: 'SHOW_CONFIRM', danger: false,
                title: 'إعادة فتح', message: 'سيتم إلغاء القفل + حذف markers الترحيل تلقائياً.',
                onConfirm: () => { saveHistory(); dispatch({ type: 'OPEN_MONTH', payload: makeMonthKey(selectedYear, selectedMonth) }); addNotification({ type: 'success', title: 'تم إعادة الفتح' }); },
                onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
              })} className="btn btn-secondary text-[11px] px-2.5 py-1.5"><Unlock size={12} /> فتح</button>
            </React.Fragment>
          ) : (
            <button onClick={() => {
              const pending = monthTx.filter(t => t.status !== 'paid' && !isCarryoverMarker(t));
              if (pending.length > 0) {
                dispatch({ type: 'SET_PENDING_CLOSE_MODAL', payload: { isOpen: true, pending, total: pending.reduce((s, t) => s + safeNumber(t.amount), 0), month: selectedMonth, year: selectedYear } });
              } else {
                dispatch({
                  type: 'SHOW_CONFIRM', danger: false,
                  title: 'إقفال الشهر', message: 'سيتم تثبيت الأرصدة وإنشاء قيد ترحيل تلقائي لرصيد هاني (لو موجود).',
                  onConfirm: () => { saveHistory(); dispatch({ type: 'CLOSE_MONTH', payload: { year: selectedYear, month: selectedMonth } }); addNotification({ type: 'success', title: 'تم الإقفال' }); },
                  onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
                });
              }
            }} className="btn btn-secondary text-[11px] px-2.5 py-1.5"><Lock size={12} /> إقفال</button>
          )}
        </div>
      </div>

      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />

      <div className="card py-3">
        <div className="flex gap-2">
          <div className="relative flex-1">
            <Search className="absolute right-3 top-1/2 -translate-y-1/2" size={14} style={{ color: 'var(--text-muted)' }} />
            <input type="text" placeholder="ابحث..." className="input-field pr-9 text-sm py-2.5" value={searchTerm} onChange={(e) => dispatch({ type: 'SET_SEARCH_TERM', payload: e.target.value })} />
          </div>
        </div>
      </div>

      {pendingGroups.length > 0 && (
        <section>
          <div className="flex justify-between items-center mb-2 flex-wrap gap-2">
            <h3 className="font-black flex items-center gap-2 text-sm">
              <Clock className="text-amber-500" size={14} /> الالتزامات
              <span className="badge badge-warning text-[10px]">{pendingTx.length}</span>
            </h3>
            <button onClick={approveAll} className="btn btn-primary text-[11px] px-2.5 py-1.5"><CheckCircle2 size={12} /> اعتماد الكل</button>
          </div>
          <div className="space-y-2">
            {pendingGroups.map(g => (
              <div key={g.category} className="card p-3">
                <div className="flex justify-between items-center mb-2">
                  <h4 className="font-bold text-xs">{g.category}</h4>
                  <span className="font-black text-sm money tabular">{fmt(g.total)}</span>
                </div>
                <div className="space-y-1.5">
                  {g.items.map(t => (
                    <div key={t.id} className="flex justify-between items-center gap-2 p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                      {selectMode && (<input type="checkbox" checked={selectedIds.has(t.id)} onChange={() => toggleSelect(t.id)} className="w-4 h-4 accent-[color:var(--accent)]" />)}
                      <button onClick={() => approveOne(t)} className="flex flex-col items-center px-1.5 py-1 rounded-lg hover:bg-[color:var(--bg-card)] active:scale-90">
                        <Clock className="text-amber-500" size={16} />
                      </button>
                      <div className="flex-1 min-w-0">
                        <p className="font-bold text-xs truncate">{t.description || 'بدون وصف'}</p>
                        <p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>{t.date}</p>
                      </div>
                      <span className="font-black text-xs money tabular">{fmt(t.amount)}</span>
                      {!selectMode && (
                        <button type="button" onClick={() => handleDelete(t.id)} className="btn btn-ghost p-1 text-red-500"><Trash2 size={12} /></button>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </section>
      )}

      {dailyGroups.length > 0 && (
        <section>
          <h3 className="font-black flex items-center gap-2 text-sm mb-2 text-emerald-600">
            <CheckCircle2 size={14} /> سجل المدفوعات ({paidTx.length})
          </h3>
          <div>
            {dailyGroups.map(group => (
              <div key={group.date}>
                <DayGroupHeader label={group.label} total={group.total} count={group.items.length} />
                <div className="space-y-2">
                  {group.items.map(t => (
                    <div key={t.id} className={`card py-2.5 flex justify-between items-center gap-2 ${selectedIds.has(t.id) ? 'ring-2 ring-[color:var(--accent)]' : ''}`}>
                      {selectMode && (<input type="checkbox" checked={selectedIds.has(t.id)} onChange={() => toggleSelect(t.id)} className="w-4 h-4 accent-[color:var(--accent)]" />)}
                      <div className="min-w-0 flex-1">
                        <p className="font-bold text-xs truncate flex items-center gap-1.5 flex-wrap">
                          {t.type === 'income' ? '💰' : '💸'} {t.description || t.category}
                          <TxTimeChip createdAt={t.createdAt} />
                          <SmsBadge tx={t} /> <TeldaBadge tx={t} /> <TransferBadge tx={t} /> <RecurringBadge tx={t} />
                          <CarryoverBadge tx={t} /> <CreditBadge tx={t} /> <ReconciliationBadge tx={t} />
                          <HanyPurchaseBadge tx={t} /> <HanySettleBadge tx={t} /> <CardPaymentBadge tx={t} />
                        </p>
                        <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                          {PAYMENT_METHODS.find(p => p.id === t.method)?.label || ''}
                        </p>
                      </div>
                      <div className="flex items-center gap-1 flex-shrink-0">
                        <span className="font-black text-xs money tabular">{fmt(t.amount)}</span>
                        {!selectMode && (
                          <button type="button" onClick={() => handleDelete(t.id)} className="btn btn-ghost p-1 text-red-500"><Trash2 size={12} /></button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </section>
      )}
    </div>
  );
});

/* ═══════════════ LOANS VIEW ═══════════════ */
const LoansView = memo(function LoansView(props) {
  const updatedLoans = props.updatedLoans || [];
  const cards = props.cards || [];
  const recurringItems = props.recurringItems || [];
  const transactions = props.transactions || [];
  const dispatch = props.dispatch;
  const deleteRecurring = props.deleteRecurring;
  const saveHistory = props.saveHistory;
  const addNotification = props.addNotification;
  const data = props.data;
  const selectedMonth = props.selectedMonth;
  const selectedYear = props.selectedYear;

  const [activeTab, setActiveTab] = useState('loans');
  const hanyPayable = useMemo(function () { return computeHanyPayable(data); }, [data]);
  const custodySummary = useMemo(function () {
    return computeCustodyBalance(data && data.custodyEntries);
  }, [data && data.custodyEntries]);

  const totalLoans = useMemo(function () {
    return updatedLoans.filter(function (l) { return !l.isReceivable && !l.autoGenerated; }).reduce(function (s, l) { return s + l.remaining; }, 0);
  }, [updatedLoans]);

  const totalReceivable = useMemo(function () {
    return updatedLoans.filter(function (l) { return l.isReceivable; }).reduce(function (s, l) { return s + l.remaining; }, 0);
  }, [updatedLoans]);

  const totalCards = useMemo(function () {
    return cards.reduce(function (acc, c) { return acc + Math.max(0, computeCardDebt(data, c)); }, 0);
  }, [cards, data]);

  const netDebt = totalLoans + totalCards - totalReceivable;

  const handlePrintLoans = () => {
    const html = generateLoansReport(data, updatedLoans, { includeWatermark: true });
    openPrintWindow(html, 'كشف الالتزامات', { autoPrint: true });
    addNotification({ type: 'success', title: 'جاري فتح الطباعة...' });
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="sub-tab-switcher">
        <button onClick={function () { setActiveTab('loans'); }} className={'sub-tab-btn ' + (activeTab === 'loans' ? 'active' : '')}>
          <Banknote size={14} />
          <span>القروض والمستحقات</span>
        </button>
        <button onClick={function () { setActiveTab('hany'); }} className={'sub-tab-btn ' + (activeTab === 'hany' ? 'active' : '')}>
          <StoreIcon size={14} />
          <span>دفتر هاني</span>
          {hanyPayable > 0 ? (
            <span className="badge badge-warning text-[9px] px-1.5 py-0 money tabular">{fmtShort(hanyPayable)}</span>
          ) : null}
        </button>
        <button onClick={function () { setActiveTab('custody'); }} className={'sub-tab-btn ' + (activeTab === 'custody' ? 'active' : '')}>
          <Briefcase size={14} />
          <span>العهدة</span>
        </button>
      </div>

      {activeTab === 'custody' ? (
        <CustodyView data={data} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />
      ) : activeTab === 'hany' ? (
        <HanyLedgerView data={data} dispatch={dispatch} saveHistory={saveHistory}
          addNotification={addNotification} selectedYear={selectedYear} selectedMonth={selectedMonth} />
      ) : (
        <div className="space-y-4">
          <div className="card">
            <div className="flex justify-between items-start gap-3 flex-wrap mb-3">
              <div>
                <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>إجمالي المديونية الصافية</p>
                <h2 className="text-3xl font-black tracking-tight text-gradient money tabular">
                  {fmt(netDebt)}
                  <span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
                </h2>
              </div>
              <button onClick={handlePrintLoans} className="btn text-xs font-black"
                style={{ background: 'linear-gradient(135deg, #0A1628 0%, #635BFF 100%)', color: 'white' }}>
                <PrinterIcon size={14} /> طباعة التقرير
              </button>
            </div>
            <div className="grid grid-cols-3 gap-2 mt-3">
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">القروض</p>
                <p className="text-xs font-black text-red-600 money tabular">{fmt(totalLoans)}</p>
              </div>
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">البطاقات</p>
                <p className="text-xs font-black text-red-600 money tabular">{fmt(totalCards)}</p>
              </div>
              <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
                <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">مستحقات لك</p>
                <p className="text-xs font-black text-emerald-600 money tabular">{fmt(totalReceivable)}</p>
              </div>
            </div>
          </div>

          {updatedLoans.length === 0 ? (
            <div className="card text-center p-12">
              <Banknote size={40} className="mx-auto mb-3 text-[color:var(--accent)]" />
              <h3 className="text-base font-black mb-2">لا توجد التزامات بعد</h3>
              <p className="text-xs mb-4" style={{ color: 'var(--text-muted)' }}>أضف أول قرض أو بند متكرر لتبدأ المتابعة</p>
            </div>
          ) : (
            <div className="space-y-2">
              {updatedLoans.map(function (loan) {
                const isPaid = loan.remaining <= 0;
                const pct = safeNumber(loan.totalAmount) > 0 ? (safeNumber(loan.totalPaid) / safeNumber(loan.totalAmount)) * 100 : 0;
                return (
                  <div key={loan.id} className="card py-3">
                    <div className="flex justify-between items-start gap-2 mb-2">
                      <div className="flex items-center gap-2 flex-1 min-w-0">
                        <div className={'p-1.5 rounded-lg flex-shrink-0 ' + (isPaid ? 'bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600' : 'bg-red-50 dark:bg-red-950/30 text-red-500')}>
                          <Banknote size={14} />
                        </div>
                        <div className="min-w-0">
                          <h4 className="font-bold text-xs truncate">{loan.name}</h4>
                          <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>يوم {loan.dueDay}</p>
                        </div>
                      </div>
                      <button type="button" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: loan })} className="btn btn-ghost p-1">
                        <Edit size={12} />
                      </button>
                    </div>
                    <div className="flex justify-between items-center mb-2">
                      <p className={'text-base font-black money tabular ' + (isPaid ? 'text-emerald-600' : 'text-red-600')}>{fmt(loan.remaining)}</p>
                      <p className="text-xs font-bold money tabular" style={{ color: 'var(--text-muted)' }}>قسط: {fmt(loan.monthlyInstallment)}</p>
                    </div>
                    <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                      <div className="bg-emerald-500 h-full rounded-full" style={{ width: Math.min(100, pct) + '%' }} />
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
});

/* ═══════════════ CUSTODY VIEW ═══════════════ */
const CustodyView = memo(({ data, dispatch, saveHistory, addNotification }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [newEntry, setNewEntry] = useState({
    type: CUSTODY_TYPE.RECEIVE, amount: '', date: getLocalISODate(), description: '',
    method: 'cib_savings', relatedCategory: 'عهدة شركة إيماك'
  });

  const custodyEntries = data?.custodyEntries || [];
  const summary = useMemo(() => computeCustodyBalance(custodyEntries), [custodyEntries]);

  const addEntry = () => {

    if (!descCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: descCheck.error }); return; }
    saveHistory();
    const amount = roundMoney(check.value);
    const entry = { ...newEntry, description: descCheck.value, id: getSafeId(), amount, status: 'open' };
    const newEntries = [entry, ...custodyEntries];
    dispatch({ type: 'SET_DATA', payload: { ...data, custodyEntries: newEntries } });
    setShowAdd(false);
    setNewEntry({ type: CUSTODY_TYPE.RECEIVE, amount: '', date: getLocalISODate(), description: '', method: 'cib_savings', relatedCategory: 'عهدة شركة إيماك' });

          <div className="p-2.5 rounded-xl bg-cyan-50 dark:bg-cyan-950/30 text-center">
            <p className="text-[10px] font-bold text-cyan-700 dark:text-cyan-400">محوّل</p>
            <p className="text-sm font-black text-cyan-600 mt-0.5 money tabular">{fmt(summary.transferred)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-orange-50 dark:bg-orange-950/30 text-center">
            <p className="text-[10px] font-bold text-orange-700 dark:text-orange-400">كاش</p>
            <p className="text-sm font-black text-orange-600 mt-0.5 money tabular">{fmt(summary.spentCash)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-purple-50 dark:bg-purple-950/30 text-center">
            <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">بطاقة</p>
            <p className="text-sm font-black text-purple-600 mt-0.5 money tabular">{fmt(summary.spentCard)}</p>
          </div>
        </div>
      </div>

      {custodyEntries.length === 0 ? (

          <Briefcase size={40} className="mx-auto mb-3 text-[color:var(--accent)]" />
          <h3 className="text-base font-black mb-2">لا توجد حركات بعد</h3>

        </div>
      ) : (
        <div className="space-y-2">
          {custodyEntries.map(entry => {

                    <div className="min-w-0">

                      <span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{CUSTODY_TYPE_LABELS[entry.type]} • {entry.date}</span>

const SettingsView = memo(({
  data, accountsData, cards, budgets, dispatch, saveHistory, addNotification,
  onResetPersonalData, onForceSave, forceSaveState

  const [localAccounts, setLocalAccounts] = useState(() => JSON.parse(JSON.stringify(accountsData)));
  const [localCards, setLocalCards] = useState(() => cards.map(c => ({ ...c })));
  const [activeSection, setActiveSection] = useState('accounts');
  const [hasChanges, setHasChanges] = useState(false);
  const [driveBusy, setDriveBusy] = useState(false);
  const [driveStatus, setDriveStatus] = useState('');
  const [folderIdInput, setFolderIdInput] = useState(() => localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID);
  const isDirtyRef = useRef(false);

  useEffect(() => {
    if (isDirtyRef.current) return;
    setLocalAccounts(JSON.parse(JSON.stringify(accountsData)));
    setHasChanges(false);
  }, [accountsData]);

  useEffect(() => {
    if (isDirtyRef.current) return;
    setLocalCards(cards.map(c => ({ ...c })));
    setHasChanges(false);
  }, [cards]);

  const handleAccountChange = (key, field, value) => {
    setLocalAccounts(prev => ({ ...prev, [key]: { ...prev[key], [field]: value } }));
    setHasChanges(true);
    isDirtyRef.current = true;
  };
  const handleCardChange = (id, field, value) => {
    setLocalCards(prev => prev.map(c => {
      if (c.id !== id) return c;
      const u = { ...c, [field]: value };
      if (field === 'limit') u.availableBalance = Math.max(0, safeNumber(value) - safeNumber(u.openingDebt));
      return u;
    }));
    setHasChanges(true);
    isDirtyRef.current = true;
  };

  const handleSave = () => {
    saveHistory();
    const cleaned = {};
    const today = getLocalISODate();
    ACCOUNT_KEYS.forEach(k => {
      const oldInit = safeNumber(accountsData[k]?.initialBalance);
      const newInit = parseNumberInput(localAccounts[k]?.initialBalance);
      cleaned[k] = {
        ...localAccounts[k], initialBalance: newInit, balance: newInit,
        initialDate: (oldInit !== newInit) ? today : (localAccounts[k]?.initialDate || null),
        lastUpdated: (oldInit !== newInit) ? today : (localAccounts[k]?.lastUpdated || null)
      };
    });
    dispatch({ type: 'UPDATE_ACCOUNTS', payload: cleaned });
    dispatch({
      type: 'UPDATE_CARDS',
      payload: localCards.map(c => ({
        ...c, limit: safeNumber(c.limit), openingDebt: safeNumber(c.openingDebt),
        openingDebtDate: c.openingDebtDate || getLocalISODate(),
        openingDate: c.openingDate || getLocalISODate(),
        cashbackRate: safeNumber(c.cashbackRate, 0),
        subCardLast4: Array.isArray(c.subCardLast4) ? c.subCardLast4 : []
