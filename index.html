      )}
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════
   PART 6D — Liquidity Forecast View
   ═══════════════════════════════════════════════════════════════ */
const LiquidityForecastView = memo(({ transactions, updatedLoans, recurringItems, liveBalances, selectedYear, selectedMonth, monthlyPlans }) => {
  const currentLiquidity = useMemo(() =>
    ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(liveBalances?.[k]), 0), [liveBalances]);

  const forecast = useMemo(() => {
    const startIdx = getMonthIndex(selectedMonth);
    const months = [];
    let runningBalance = currentLiquidity;

    for (let i = 0; i < 6; i++) {
      let mIdx = startIdx + i;
      let year = selectedYear;
      while (mIdx > 11) { mIdx -= 12; year++; }
      const monthName = ALL_MONTHS[mIdx];
      const monthKey = makeMonthKey(year, monthName);
      const plan = monthlyPlans?.[monthKey] || {};

      const plannedIncome = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent)
        + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE)
        + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedCash);
      const plannedExpense = safeNumber(plan.expectedCashExpenses) + safeNumber(plan.plannedPayments);

      const monthTxs = transactions.filter(t => t.month === monthName && (t.year || 2026) === year);
      const actualIncome = monthTxs.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
      const actualExpense = monthTxs.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);

      const income = i === 0 ? actualIncome : plannedIncome;
      const expense = i === 0 ? actualExpense : plannedExpense;
      runningBalance += income - expense;

      months.push({ month: monthName, year, income, expense, balance: runningBalance });
    }
    return months;
  }, [transactions, selectedYear, selectedMonth, monthlyPlans, currentLiquidity]);

  const chartData = forecast.map(f => ({
    name: f.month.slice(0, 3),
    الرصيد: f.balance,
    دخل: f.income,
    مصروف: f.expense
  }));

  const minBalance = Math.min(...forecast.map(f => f.balance));
  const lastBalance = forecast[forecast.length - 1]?.balance || 0;

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <h2 className="text-base font-black flex items-center gap-2 mb-3">
          <LineChart size={16} className="text-blue-500" /> توقع السيولة — 6 شهور
        </h2>
        <div className="grid grid-cols-3 gap-2">
          <div className="p-2.5 rounded-xl bg-blue-50 dark:bg-blue-950/30 text-center">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الآن</p>
            <p className="text-sm font-black text-blue-600 mt-1">{fmt(currentLiquidity)}</p>
          </div>
          <div className={`p-2.5 rounded-xl text-center ${lastBalance >= 0 ? 'bg-emerald-50 dark:bg-emerald-950/30' : 'bg-red-50 dark:bg-red-950/30'}`}>
            <p className={`text-[10px] font-bold ${lastBalance >= 0 ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-700 dark:text-red-400'}`}>بعد 6 شهور</p>
            <p className={`text-sm font-black mt-1 ${lastBalance >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(lastBalance)}</p>
          </div>
          <div className={`p-2.5 rounded-xl text-center ${minBalance >= 0 ? 'bg-emerald-50 dark:bg-emerald-950/30' : 'bg-amber-50 dark:bg-amber-950/30'}`}>
            <p className={`text-[10px] font-bold ${minBalance >= 0 ? 'text-emerald-700 dark:text-emerald-400' : 'text-amber-700 dark:text-amber-400'}`}>أدنى نقطة</p>
            <p className={`text-sm font-black mt-1 ${minBalance >= 0 ? 'text-emerald-600' : 'text-amber-600'}`}>{fmt(minBalance)}</p>
          </div>
        </div>
      </div>

      <div className="card">
        <h3 className="font-bold text-xs mb-3" style={{ color: 'var(--text-secondary)' }}>منحنى الرصيد المتوقع</h3>
        <div className="h-56">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={chartData}>
              <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.08} />
              <XAxis dataKey="name" fontSize={10} stroke="#94A3B8" />
              <YAxis fontSize={10} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
              <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '10px', border: 'none', fontFamily: 'Cairo', fontSize: '12px' }} />
              <Legend wrapperStyle={{ fontSize: '11px', fontWeight: 'bold' }} />
              <Bar dataKey="دخل" fill="#059669" radius={[4, 4, 0, 0]} barSize={12} />
              <Bar dataKey="مصروف" fill="#DC2626" radius={[4, 4, 0, 0]} barSize={12} />
              <Bar dataKey="الرصيد" fill="#2563EB" radius={[4, 4, 0, 0]} barSize={12} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="card">
        <h3 className="font-black text-sm mb-3">📋 التفاصيل الشهرية</h3>
        <div className="space-y-2">
          {forecast.map((f, i) => (
            <div key={i} className="p-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <div className="flex justify-between items-center mb-1.5">
                <span className="font-bold text-xs">{f.month} {f.year}</span>
                <span className={`font-black text-sm ${f.balance >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(f.balance)}</span>
              </div>
              <div className="flex justify-between text-[10px]" style={{ color: 'var(--text-muted)' }}>
                <span>دخل: <strong className="text-emerald-600">+{fmt(f.income)}</strong></span>
                <span>مصروف: <strong className="text-red-600">−{fmt(f.expense)}</strong></span>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════
   PART 6E — Month Comparison View
   ═══════════════════════════════════════════════════════════════ */
const MonthComparisonView = memo(({ transactions, selectedYear, selectedMonth }) => {
  const [compareMonthIdx, setCompareMonthIdx] = useState(() => Math.max(0, getMonthIndex(selectedMonth) - 1));

  const curMonthIdx = getMonthIndex(selectedMonth);
  const compareMonth = ALL_MONTHS[compareMonthIdx];

  const stats = useMemo(() => {
    const calc = (m, y) => {
      const txs = transactions.filter(t => t.month === m && (t.year || 2026) === y && t.status === 'paid');
      const income = txs.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
      const expense = txs.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
      const byCategory = {};
      txs.filter(t => t.type === 'expense').forEach(t => {
        byCategory[t.category] = (byCategory[t.category] || 0) + safeNumber(t.amount);
      });
      return { income, expense, net: income - expense, count: txs.length, byCategory };
    };
    return {
      current: calc(selectedMonth, selectedYear),
      previous: calc(compareMonth, selectedYear)
    };
  }, [transactions, selectedMonth, selectedYear, compareMonth]);

  const allCategories = useMemo(() => {
    const set = new Set([...Object.keys(stats.current.byCategory), ...Object.keys(stats.previous.byCategory)]);
    return Array.from(set).sort();
  }, [stats]);

  const pctChange = (cur, prev) => {
    if (prev === 0) return cur > 0 ? 100 : 0;
    return ((cur - prev) / prev) * 100;
  };

  const chartData = [
    { name: 'دخل', [selectedMonth]: stats.current.income, [compareMonth]: stats.previous.income },
    { name: 'مصروف', [selectedMonth]: stats.current.expense, [compareMonth]: stats.previous.expense },
    { name: 'صافي', [selectedMonth]: stats.current.net, [compareMonth]: stats.previous.net }
  ];

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <h2 className="text-base font-black flex items-center gap-2 mb-3">
          <Activity size={16} className="text-blue-500" /> مقارنة الشهور
        </h2>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الشهر الحالي</label>
            <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
              <p className="font-black text-sm text-blue-700 dark:text-blue-400">{selectedMonth} {selectedYear}</p>
            </div>
          </div>
          <div>
            <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>قارن مع</label>
            <select className="input-field text-sm py-2.5"
              value={compareMonthIdx}
              onChange={e => setCompareMonthIdx(Number(e.target.value))}>
              {ALL_MONTHS.map((m, i) => (
                <option key={m} value={i} disabled={i === curMonthIdx}>
                  {m} {selectedYear}
                </option>
              ))}
            </select>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-3 gap-3">
        {[
          { label: 'الدخل', cur: stats.current.income, prev: stats.previous.income, color: 'emerald' },
          { label: 'المصروف', cur: stats.current.expense, prev: stats.previous.expense, color: 'red' },
          { label: 'الصافي', cur: stats.current.net, prev: stats.previous.net, color: 'blue' }
        ].map(s => {
          const change = pctChange(s.cur, s.prev);
          const better = s.label === 'المصروف' ? change < 0 : change > 0;
          const colorCls = s.color === 'emerald' ? 'text-emerald-600' : s.color === 'red' ? 'text-red-600' : 'text-blue-600';
          return (
            <div key={s.label} className="stat-card">
              <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>{s.label}</p>
              <p className={`text-base font-black ${colorCls}`}>{fmt(s.cur)}</p>
              <p className="text-[10px] mt-1" style={{ color: 'var(--text-muted)' }}>
                السابق: {fmt(s.prev)}
              </p>
              {change !== 0 && (
                <p className={`text-[10px] font-black mt-1 ${better ? 'text-emerald-600' : 'text-red-600'}`}>
                  {change > 0 ? '↑' : '↓'} {Math.abs(Math.round(change))}%
                </p>
              )}
            </div>
          );
        })}
      </div>

      <div className="card">
        <h3 className="font-bold text-xs mb-3" style={{ color: 'var(--text-secondary)' }}>مقارنة بصرية</h3>
        <div className="h-56">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={chartData}>
              <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.08} />
              <XAxis dataKey="name" fontSize={10} stroke="#94A3B8" />
              <YAxis fontSize={10} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
              <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '10px', border: 'none', fontFamily: 'Cairo', fontSize: '12px' }} />
              <Legend wrapperStyle={{ fontSize: '11px', fontWeight: 'bold' }} />
              <Bar dataKey={selectedMonth} fill="#2563EB" radius={[4, 4, 0, 0]} barSize={30} />
              <Bar dataKey={compareMonth} fill="#94A3B8" radius={[4, 4, 0, 0]} barSize={30} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {allCategories.length > 0 && (
        <div className="card">
          <h3 className="font-black text-sm mb-3">📂 المقارنة حسب الفئة</h3>
          <div className="space-y-2">
            {allCategories.map(cat => {
              const cur = stats.current.byCategory[cat] || 0;
              const prev = stats.previous.byCategory[cat] || 0;
              const change = pctChange(cur, prev);
              if (cur === 0 && prev === 0) return null;
              return (
                <div key={cat} className="p-2.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className="flex justify-between items-center mb-1">
                    <span className="font-bold text-xs truncate">{cat}</span>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <span className="text-xs font-black text-blue-600">{fmt(cur)}</span>
                      {change !== 0 && (
                        <span className={`text-[10px] font-black ${change > 0 ? 'text-red-600' : 'text-emerald-600'}`}>
                          {change > 0 ? '↑' : '↓'} {Math.abs(Math.round(change))}%
                        </span>
                      )}
                    </div>
                  </div>
                  <div className="flex justify-between text-[10px]" style={{ color: 'var(--text-muted)' }}>
                    <span>السابق: {fmt(prev)}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════
   PART 6F — Calendar View
   ═══════════════════════════════════════════════════════════════ */
const CalendarView = memo(({ data, getAgendaItems, dispatch, saveHistory, addNotification }) => {
  const today = new Date();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [selectedDayDetails, setSelectedDayDetails] = useState(null);

  const agendaItems = useMemo(() => getAgendaItems(), [getAgendaItems]);

  const itemsByDay = useMemo(() => {
    const map = {};
    agendaItems.forEach(item => {
      const d = parseISODate(item.date);
      if (!d) return;
      if (d.getFullYear() !== viewYear || d.getMonth() !== viewMonth) return;
      const day = d.getDate();
      if (!map[day]) map[day] = [];
      map[day].push(item);
    });
    return map;
  }, [agendaItems, viewYear, viewMonth]);

  const monthName = ALL_MONTHS[viewMonth];
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  const navigate = (delta) => {
    let m = viewMonth + delta;
    let y = viewYear;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    setViewMonth(m);
    setViewYear(y);
  };

  const dayNames = ['أحد', 'إثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];
  const emptyCells = Array.from({ length: firstDay }, (_, i) => i);
  const dayCells = Array.from({ length: daysInMonth }, (_, i) => i + 1);

  const isToday = (day) =>
    today.getFullYear() === viewYear &&
    today.getMonth() === viewMonth &&
    today.getDate() === day;

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex items-center justify-between mb-3">
          <button type="button" onClick={() => navigate(-1)} className="btn btn-ghost p-2">
            <ArrowRight size={16} />
          </button>
          <h2 className="text-base font-black flex items-center gap-2">
            <CalendarDays size={16} className="text-blue-500" /> {monthName} {viewYear}
          </h2>
          <button type="button" onClick={() => navigate(1)} className="btn btn-ghost p-2">
            <ArrowRight size={16} className="rotate-180" />
          </button>
        </div>

        <div className="grid grid-cols-7 gap-1 mb-2">
          {dayNames.map(d => (
            <div key={d} className="text-center text-[10px] font-black py-1" style={{ color: 'var(--text-muted)' }}>
              {d}
            </div>
          ))}
        </div>

        <div className="grid grid-cols-7 gap-1">
          {emptyCells.map(i => <div key={`e-${i}`} />)}
          {dayCells.map(day => {
  const items = itemsByDay[day] || [];
  const hasItems = items.length > 0;
  const totalAmount = items.reduce((s, it) => s + safeNumber(it.amount), 0);

  return (
    <button
      key={day}
      type="button"
      onClick={() => hasItems && setSelectedDayDetails({ day, items })}
      className={`h-14 rounded-lg p-1 flex flex-col items-center justify-center transition-all relative ${isToday(day) ? 'ring-2 ring-blue-500' : ''} ${hasItems ? 'cursor-pointer hover:ring-2 hover:ring-blue-300' : 'cursor-default'}`}
      style={{
        background: hasItems ? 'var(--brand-soft)' : 'var(--bg-muted)',
        color: hasItems ? 'var(--brand)' : 'var(--text-secondary)'
      }}
    >
      <span className={`text-[11px] font-black ${isToday(day) ? 'text-blue-600' : ''}`}>{day}</span>
      {hasItems && (
        <>
          <span className="text-[8px] font-black mt-0.5">{items.length} التزام</span>
          <span className="text-[7px] font-bold opacity-70">{fmt(totalAmount).slice(0, 5)}</span>
        </>
      )}
    </button>
  );
})}
        </div>
      </div>

      <div className="card">
        <h3 className="font-black text-sm flex items-center gap-2 mb-3">
          <Bell size={14} className="text-amber-500" /> الأجندة ({agendaItems.length})
        </h3>
        {agendaItems.length === 0 ? (
          <p className="text-center py-6 text-xs font-semibold" style={{ color: 'var(--text-muted)' }}>
            لا توجد التزامات قادمة
          </p>
        ) : (
          <div className="space-y-2 max-h-[60vh] overflow-y-auto scroll-hide">
            {agendaItems.map(item => {
              const Icon = item.icon || Calendar;
              const typeCls = item.type === 'danger' ? 'text-red-600 bg-red-50 dark:bg-red-950/30'
                : item.type === 'warning' ? 'text-amber-600 bg-amber-50 dark:bg-amber-950/30'
                : item.type === 'success' ? 'text-emerald-600 bg-emerald-50 dark:bg-emerald-950/30'
                : 'text-blue-600 bg-blue-50 dark:bg-blue-950/30';
              const daysLeft = calculateDaysLeft(item.date);
              return (
                <div key={item.id} className="flex items-center gap-3 p-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className={`p-2 rounded-lg flex-shrink-0 ${typeCls}`}>
                    <Icon size={14} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-xs truncate">{item.title}</p>
                    <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>
                      {item.date} • {item.desc || ''}
                      {daysLeft !== null && (
                        <span className={`mr-2 font-black ${daysLeft < 0 ? 'text-red-500' : daysLeft <= 3 ? 'text-amber-600' : ''}`}>
                          {daysLeft < 0 ? `متأخر ${Math.abs(daysLeft)} يوم` :
                           daysLeft === 0 ? 'اليوم' :
                           daysLeft === 1 ? 'غداً' :
                           `بعد ${daysLeft} يوم`}
                        </span>
                      )}
                    </p>
                  </div>
                  <span className={`font-black text-sm flex-shrink-0 ${item.type === 'success' ? 'text-emerald-600' : 'text-red-600'}`}>
                    {fmt(item.amount)}
                  </span>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════
   dataReducer
   ═══════════════════════════════════════════════════════════════ */
function dataReducer(state, action) {
  switch (action.type) {
    case 'SET_DATA': {
      const incoming = { ...action.payload };
      if (!Array.isArray(incoming.deletedTxArchive)) incoming.deletedTxArchive = [...(state.data.deletedTxArchive || [])];
      if (!Array.isArray(incoming.deletedTxIds)) incoming.deletedTxIds = [...(state.data.deletedTxIds || [])];
      if (!Array.isArray(incoming.deletedDefaultIds)) incoming.deletedDefaultIds = [...(state.data.deletedDefaultIds || [])];
      return { ...state, data: incoming };
    }
    case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
    case 'SET_SELECTED_YEAR': return { 
      ...state, 
      selectedYear: action.payload, 
      selectedMonth: getMonthsForYear(action.payload).includes(state.selectedMonth) 
        ? state.selectedMonth 
        : getMonthsForYear(action.payload)[0] 
    };
    case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
    case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
    case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
    case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
    case 'SET_FORM_DATA': return { ...state, formData: action.payload };
    case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
    case 'SET_FORM_ERRORS': return { ...state, formErrors: action.payload };
    case 'SET_ACTIVE_CATEGORY_DETAIL': return { ...state, activeCategoryDetail: action.payload };
    case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
    case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
    case 'SET_BUDGETS': return { ...state, budgets: action.payload };
    case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
    case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
    case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
    case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
    case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
    case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
    case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
    case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
    case 'SET_VIEWING_RECEIPT': return { ...state, viewingReceipt: action.payload };
    case 'SET_PIN_CHANGE_OPEN': return { ...state, isPinChangeOpen: action.payload };
    case 'SET_SMS_MODAL_OPEN': return { ...state, isSmsModalOpen: action.payload };
    case 'SET_PENDING_CLOSE_MODAL': return { ...state, pendingCloseModal: action.payload };
    case 'ADD_NOTIFICATION': return { 
      ...state, 
      notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }] 
    };
    case 'REMOVE_NOTIFICATION': return { 
      ...state, 
      notifications: state.notifications.filter(n => n.id !== action.payload) 
    };
    case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
    case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
    case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
    case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
    case 'UPDATE_CASHBACK_TRACKERS': return { ...state, data: { ...state.data, cashbackTrackers: action.payload } };
    
    case 'UPDATE_ACCOUNTS': {
      const oldA = state.data.accountsData || {};
      const newA = action.payload || {};
      let earliestAffected = null;
      ACCOUNT_KEYS.forEach(k => {
        const oldBal = safeNumber(oldA[k]?.balance);
        const newBal = safeNumber(newA[k]?.balance);
        const oldDate = oldA[k]?.lastUpdated;
        const newDate = newA[k]?.lastUpdated;
        if (oldBal !== newBal || oldDate !== newDate) {
          const ref = newDate || oldDate;
          if (ref) {
            const d = parseISODate(ref);
            if (d) {
              const y = d.getFullYear();
              const mIdx = d.getMonth();
              const mName = ALL_MONTHS[mIdx];
              if (!earliestAffected) earliestAffected = { year: y, month: mName };
              else {
                const curIdx = getMonthIndex(earliestAffected.month);
                if (y < earliestAffected.year || (y === earliestAffected.year && mIdx < curIdx)) 
                  earliestAffected = { year: y, month: mName };
              }
            }
          }
        }
      });
      let newSnapshots = state.data.monthlySnapshots || {};
      if (earliestAffected) { 
        const { snapshots } = invalidateSnapshotsFrom(newSnapshots, earliestAffected.year, earliestAffected.month); 
        newSnapshots = snapshots; 
      }
      return { ...state, data: { ...state.data, accountsData: newA, monthlySnapshots: newSnapshots } };
    }
    
    case 'UPDATE_MONTHLY_PLANS': return { ...state, data: { ...state.data, monthlyPlans: action.payload } };
    
    case 'ADD_TO_HISTORY': { 
      const limited = [...state.history].slice(-19); 
      return { ...state, history: [...limited, action.payload], future: [] }; 
    }
    
    case 'UNDO': {
      if (state.history.length === 0) return state;
      const prev = state.history[state.history.length - 1];
      return { 
        ...state, 
        data: prev.data || prev, 
        budgets: prev.budgets !== undefined ? prev.budgets : state.budgets, 
        history: state.history.slice(0, -1), 
        future: [{ data: state.data, budgets: state.budgets }, ...state.future] 
      };
    }
    
    case 'TOGGLE_LEDGER': return { 
      ...state, 
      expandedLedgers: { 
        ...state.expandedLedgers, 
        [action.payload]: !state.expandedLedgers[action.payload] 
      } 
    };
    
    case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };
    case 'SET_STATUS_FILTER': return { ...state, statusFilter: action.payload };
    
    case 'SHOW_CONFIRM': return { 
      ...state, 
      confirmDialog: { 
        isOpen: true, 
        title: action.title, 
        message: action.message, 
        onConfirm: action.onConfirm, 
        onCancel: action.onCancel, 
        danger: action.danger || false 
      } 
    };
    
    case 'HIDE_CONFIRM': return { 
      ...state, 
      confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false } 
    };
    
    case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
    case 'SET_QUICK_TRANSFER_DATA': return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
    case 'SET_VIEWING_CARD_STATEMENT': return { ...state, viewingCardStatement: action.payload };

    case 'CLOSE_MONTH': {
      const { year, month } = action.payload;
      const monthKey = makeMonthKey(year, month);
      const monthIdx = getMonthIndex(month);
      const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
      const snap = {};
      ACCOUNT_KEYS.forEach(k => { snap[k] = computeBalance(state.data, k, monthEnd); });
      
      const cleanedSnapshots = { ...(state.data.monthlySnapshots || {}) };
      Object.keys(cleanedSnapshots).forEach(k => {
        const parsed = parseMonthKey(k);
        if (!parsed) return;
        if (parsed.year > year || (parsed.year === year && getMonthIndex(parsed.month) > monthIdx)) {
          delete cleanedSnapshots[k];
        }
      });
      
      return { 
        ...state, 
        data: { 
          ...state.data,
          closedMonths: Array.from(new Set([...(state.data.closedMonths || []), monthKey])),
          monthlySnapshots: { ...cleanedSnapshots, [monthKey]: snap } 
        } 
      };
    }

    case 'CLOSE_MONTH_AFTER_RESOLVE': {
      const { year, month, resolveAction, pendingIds } = action.payload;
      const monthKey = makeMonthKey(year, month);
      let newTxs = state.data.transactions || [];
      
      if (resolveAction === 'approve') { 
        const ids = new Set(pendingIds); 
        newTxs = newTxs.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t); 
      }
      else if (resolveAction === 'delete') { 
        const ids = new Set(pendingIds); 
        newTxs = newTxs.filter(t => !ids.has(t.id)); 
      }
      else if (resolveAction === 'carry') {
        const idx = getMonthIndex(month);
        const nextMonth = idx === 11 ? ALL_MONTHS[0] : ALL_MONTHS[idx + 1];
        const nextYear = idx === 11 ? year + 1 : year;
        const nextMonthIdx = getMonthIndex(nextMonth);
        const maxDay = new Date(nextYear, nextMonthIdx + 1, 0).getDate();
        const ids = new Set(pendingIds);
        const nextMonthKey = makeMonthKey(nextYear, nextMonth);
        const nextClosed = (state.data.closedMonths || []).includes(nextMonthKey);
        if (nextClosed) return { ...state, pendingCloseModal: { isOpen: false, pending: [], total: 0, month: '', year: 0 } };
        
        newTxs = newTxs.map(t => {
          if (!ids.has(t.id)) return t;
          const oldD = parseISODate(t.date);
          const oldDay = oldD ? oldD.getDate() : 1;
          const newDay = Math.min(Math.max(1, oldDay), maxDay);
          const newDate = `${nextYear}-${String(nextMonthIdx + 1).padStart(2, '0')}-${String(newDay).padStart(2, '0')}`;
          return { 
            ...t, 
            date: newDate, 
            month: nextMonth, 
            year: nextYear, 
            monthIndex: nextMonthIdx, 
            source: 'carryover', 
            carriedFromSource: t.source, 
            carryoverFrom: `${month} ${year}`, 
            status: 'pending' 
          };
        });
      }
      
      const newData = { ...state.data, transactions: newTxs };
      const monthEnd = new Date(year, getMonthIndex(month) + 1, 0, 23, 59, 59);
      const snap = {};
      ACCOUNT_KEYS.forEach(k => { snap[k] = computeBalance(newData, k, monthEnd); });
      
      return { 
        ...state, 
        data: { 
          ...newData, 
          closedMonths: Array.from(new Set([...(newData.closedMonths || []), monthKey])),
          monthlySnapshots: { ...(newData.monthlySnapshots || {}), [monthKey]: snap } 
        }, 
        pendingCloseModal: { isOpen: false, pending: [], total: 0, month: '', year: 0 } 
      };
    }

    case 'OPEN_MONTH': {
      const monthKey = action.payload;
      const parsedKey = parseMonthKey(monthKey);
      if (!parsedKey) return { 
        ...state, 
        data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey) } 
      };
      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots, parsedKey.year, parsedKey.month);
      return { 
        ...state, 
        data: { 
          ...state.data, 
          closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey), 
          monthlySnapshots: snapshots 
        } 
      };
    }

    case 'TOGGLE_WALLET_VISIBILITY': return { 
      ...state, 
      walletVisibility: { 
        ...state.walletVisibility, 
        [action.payload]: !state.walletVisibility[action.payload] 
      } 
    };
    
    case 'SET_IS_PROCESSING': return { ...state, isProcessing: action.payload };
    
    default: return state;
  }
}

/* ═══════════════════════════════════════════════════════════════
   materializeShoppingRecurring — Family App integration
   ═══════════════════════════════════════════════════════════════ */
const materializeShoppingRecurring = async () => {
  try {
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
    const snap = await docRef.get();
    if (!snap.exists) return;
    const d = snap.data() || {};
    const rules = d.shoppingRecurring || [];
    if (!rules.length) return;
    const today = new Date().toISOString().slice(0, 10);
    const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const due = rules.filter(r => r.active && r.nextDue && r.nextDue <= today);
    if (!due.length) return;
    
    const newTxs = [];
    const updates = [];
    due.forEach(r => {
      const t = r.template;
      const tObj = new Date(r.nextDue + 'T12:00:00');
      newTxs.push({
        id: 'rec-tx-' + r.id + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
        type: 'expense', 
        kind: 'operational',
        category: t.category, 
        subCategory: t.subCategory,
        amount: t.amount, 
        quantity: t.quantity, 
        unitPrice: t.unitPrice,
        description: t.description,
        source: 'shopping-app', 
        sourceLabel: t.sourceLabel,
        method: t.method, 
        linkedCardId: t.linkedCardId || undefined,
        date: r.nextDue, 
        month: MONTHS[tObj.getMonth()], 
        year: tObj.getFullYear(), 
        monthIndex: tObj.getMonth(),
        subType: 'withdrawal', 
        status: 'pending',
        recurringId: r.id, 
        createdAt: Date.now(), 
        receipts: []
      });
      
      const prefDay = r.preferredDay || 10;
      const addMonthsWithDay = (isoStr, m, day) => {
        const dt = new Date(isoStr + 'T12:00:00');
        dt.setMonth(dt.getMonth() + m);
        dt.setDate(parseInt(day));
        return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      };
      const next = addMonthsWithDay(r.nextDue, r.frequency === 'bimonthly' ? 2 : 1, prefDay);
      updates.push({ old: r, new: { ...r, nextDue: next, lastRun: today } });
    });
    
    if (newTxs.length > 0) {
      await docRef.set({ transactions: firebase.firestore.FieldValue.arrayUnion(...newTxs) }, { merge: true });
    }
    for (const u of updates) {
      await docRef.update({ shoppingRecurring: firebase.firestore.FieldValue.arrayRemove(u.old) });
      await docRef.set({ shoppingRecurring: firebase.firestore.FieldValue.arrayUnion(u.new) }, { merge: true });
    }
    console.log('✅ Materialized', newTxs.length, 'recurring shopping items');
  } catch (e) {
    console.warn('Shopping recurring:', e);
  }
};

/* ═══════════════════════════════════════════════════════════════
   APP COMPONENT

function App() {

  const [state, dispatch] = useReducer(dataReducer, {
    data: getInitialData(),
    activeTab: 'dashboard',
    selectedYear: defMY.year, 
    selectedMonth: defMY.month,
    transViewMode: 'all', 
    catViewType: 'expense',
    isFormOpen: false, 
    formMode: 'add',
    formData: { type: 'expense', subType: 'withdrawal', status: 'pending', receipts: [] },
    isLocked: false, 
    isDarkMode: localStorage.getItem('theme') === 'dark',
    budgets: safeParseJson(localStorage.getItem('budgets'), {}),
    editingCard: null, 
    editingLoan: null,
    searchTerm: '', 
    editingBudgetCategory: null, 
    budgetAmount: '',
    isRecurringModalOpen: false,
    recurringFormData: { 
      title: '', amount: '', day: 1, category: 'أخرى', type: 'expense', 
      startMonth: '', endMonth: '', active: true, method: 'cash', 
      kind: null, linkedLoanSystemId: null, linkedCardId: null, transferChannel: null 
    },
    notifications: [],
    history: [], 
    future: [],
    expandedLedgers: { fawry: false, etisalat: false, cib_savings: false, aaib_savings: false },
    expandedCardsSection: false, 
    statusFilter: 'all',
    confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false },
    isQuickTransferModalOpen: false,
    quickTransferData: { 
      transferMode: 'monthly',
      from: 'cash', to: 'fawry', amount: '', transferType: 'monthly', 
      date: getLocalISODate(), beneficiaryId: null, forceCash: false,
      internalFrom: 'cib_savings', internalTo: 'fawry', internalFees: '', internalDescription: ''
    },
    viewingCardStatement: null,
    viewingReceipt: null,
    isPinChangeOpen: false,
    isSmsModalOpen: false,
    pendingCloseModal: { isOpen: false, pending: [], total: 0, month: '', year: 0 },
    walletVisibility: { fawry: true, etisalat: true, cib_savings: true, aaib_savings: true, cash: true },
    isProcessing: false, 
    formErrors: {},
    activeCategoryDetail: null
  });

  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [authLoading, setAuthLoading] = useState(true);
  const [pinVerified, setPinVerified] = useState(() => sessionStorage.getItem('pin_verified') === 'yes');
  const [isDrawerOpen, setIsDrawerOpen] = useState(false);
  const [cloudSyncStatus, setCloudSyncStatus] = useState('pending');
  const [isSaving, setIsSaving] = useState(false);
  
  const saveTimeoutRef = useRef(null);
  const processingTimeoutRef = useRef(null);
  const saveLockRef = useRef(false);
  const lastRemoteRef = useRef(null);
  const lastMaterializeRef = useRef('');
  const isSavingRef = useRef(false);
  const hasReceivedInitialSnapshot = useRef(false);
  const initialSnapshotTimeoutRef = useRef(null);
  
  const currentTxRef = useRef([]);
  const dataRef = useRef(null);
  const budgetsRef = useRef({});
  
  const saveQueueRef = useRef(Promise.resolve());
  const cloudSaveRetriesRef = useRef(0);
  
  const { 
    data, activeTab, selectedYear, selectedMonth, transViewMode, catViewType, 
    isFormOpen, formMode, formData, isDarkMode, expandedGroup, budgets, 
    editingCard, editingLoan, searchTerm, editingBudgetCategory, budgetAmount, 
    isRecurringModalOpen, recurringFormData, notifications, history, 
    expandedLedgers, expandedCardsSection, statusFilter, confirmDialog, 
    isQuickTransferModalOpen, quickTransferData, viewingCardStatement, 
    viewingReceipt, isPinChangeOpen, isSmsModalOpen, pendingCloseModal, 
    walletVisibility, isProcessing, formErrors, activeCategoryDetail 
  } = state;
  
  const { 
    transactions = [], loans = [], cards = [], recurringItems = [], 
    accountsData = DEFAULT_ACCOUNTS, monthlyPlans = {} 
  } = data || {};

  const isOnline = useOnlineStatus();
  const prevOnlineRef = useRef(isOnline);

  useEffect(() => {
    currentTxRef.current = data?.transactions || [];
    dataRef.current = data;
    budgetsRef.current = budgets;
  }, [data?.transactions, data, budgets]);

  const addNotification = useCallback((notification) => 
    dispatch({ type: 'ADD_NOTIFICATION', payload: notification }), []);
  
  const removeNotification = useCallback((id) => 
    dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }), []);
  
  const saveHistory = useCallback(() => 
    dispatch({ 
      type: 'ADD_TO_HISTORY', 
      payload: { 
        data: JSON.parse(JSON.stringify(data)), 
        budgets: JSON.parse(JSON.stringify(budgets)) 
      } 
    }), [data, budgets]);

  const queueCloudSave = useCallback((newData, options = {}) => {
    if (!isAuthenticated || !hasReceivedInitialSnapshot.current) return;
    
    const { silent = false } = options;
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
    
    saveQueueRef.current = saveQueueRef.current.then(async () => {
      try {
        if (!silent) setIsSaving(true);
        const payloadStr = JSON.stringify(newData);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(newData)); } catch(e) {}
        
        const doc = await docRef.get();
        let finalData = { ...newData };
        
        if (doc.exists) {
          const remote = doc.data() || {};
          const remoteTx = Array.isArray(remote.transactions) ? remote.transactions : [];
          const localTx = Array.isArray(newData.transactions) ? newData.transactions : [];
          
          const permanentDeleted = new Set([
            ...(newData.deletedTxIds || []),
            ...(remote.deletedTxIds || [])
          ]);
          
          const mergedMap = new Map();
          remoteTx.forEach(t => { 
            if (t?.id && !permanentDeleted.has(t.id)) mergedMap.set(t.id, t); 
          });
          localTx.forEach(t => { 
            if (t?.id && !permanentDeleted.has(t.id)) mergedMap.set(t.id, t); 
          });
          
          finalData.transactions = Array.from(mergedMap.values())
            .filter(t => !t?.id || !(finalData.deletedTxIds || []).includes(t.id));
          finalData.deletedTxIds = Array.from(permanentDeleted).slice(-500);
          
          if (remote.budgets && typeof remote.budgets === 'object') {
            finalData.budgets = { ...remote.budgets, ...budgetsRef.current };
          }
        }
        
        await docRef.set({ ...finalData, budgets: finalData.budgets || budgetsRef.current }, { merge: true });
        lastRemoteRef.current = payloadStr;
        try { localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now())); } catch(e) {}
        cloudSaveRetriesRef.current = 0;
      } catch (err) {
        console.error('Queue save failed:', err);
        throw err;
      } finally {
        if (!silent) setTimeout(() => setIsSaving(false), 800);
      }
    }).catch(async (err) => {
      console.error('❌ Queue save failed, will retry:', err);
      const retries = cloudSaveRetriesRef.current + 1;
      if (retries <= 3) {
        cloudSaveRetriesRef.current = retries;
        console.log(`🔄 Retry #${retries} بعد 3 ثوانٍ...`);
        await new Promise(r => setTimeout(r, 3000));
        saveQueueRef.current = Promise.resolve();
        return queueCloudSave(newData, options);
      }
      console.error('❌ فشل بعد 3 محاولات — سيُحفظ محلياً فقط');
      cloudSaveRetriesRef.current = 0;
      saveQueueRef.current = Promise.resolve();
      setIsSaving(false);
    });
    
    return saveQueueRef.current;

        const newTx = latestTx.filter(t => !linkedSet.has(t.id));
        const finalTx = newTx.filter(t => !persistedDeleted.includes(t.id));
        const newMaterialized = { ...(latestData.materializedRecurring || {}) };

    if (!pending || pending.length === 0) return;
    
    if (action === 'carry') {
      const idx = getMonthIndex(month);
      const nextMonth = idx === 11 ? ALL_MONTHS[0] : ALL_MONTHS[idx + 1];
      const nextYear = idx === 11 ? year + 1 : year;
      const nextKey = makeMonthKey(nextYear, nextMonth);
      if ((data.closedMonths || []).includes(nextKey)) { 
        addNotification({ 
          type: 'error', 
          title: 'لا يمكن الترحيل', 
          message: `شهر ${nextMonth} ${nextYear} مغلق.`, 
          duration: 7000 
        }); 
        return; 
      }
    }
    
    saveHistory();
    const pendingIds = pending.map(t => t.id);
    dispatch({ type: 'CLOSE_MONTH_AFTER_RESOLVE', payload: { year, month, resolveAction: action, pendingIds } });
    const actionText = action === 'approve' ? 'تم الاعتماد والإقفال' 
      : action === 'carry' ? 'تم الترحيل والإقفال' 
      : 'تم الحذف والإقفال';
    addNotification({ type: 'success', title: actionText, message: `شهر ${month} ${year}` });
  }, [pendingCloseModal, data, saveHistory, addNotification]);

  useEffect(() => { 
    try { localStorage.setItem('budgets', JSON.stringify(budgets)); } catch (e) {} 
  }, [budgets]);
  
  useEffect(() => { 
    document.documentElement.classList.toggle('dark', isDarkMode); 
    localStorage.setItem('theme', isDarkMode ? 'dark' : 'light'); 
  }, [isDarkMode]);
  
  useEffect(() => { 
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDarkMode ? '#1A1508' : '#F5EFE0'); 
  }, [isDarkMode]);
  
  useEffect(() => () => { 
    if (processingTimeoutRef.current) clearTimeout(processingTimeoutRef.current); 
    saveLockRef.current = false; 
  }, []);

  if (authLoading) return (
    <div className="flex h-screen items-center justify-center" style={{ background: '#1A1508' }}>
      <div className="w-12 h-12 border-[3px] border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>
  );
  
  if (isAuthenticated && cloudSyncStatus === 'pending') {
    return (
      <div className="flex h-screen flex-col items-center justify-center" style={{ background: '#1A1508' }}>
        <div className="w-12 h-12 border-[3px] border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p className="text-white font-bold text-sm mb-1">جاري مزامنة البيانات...</p>
        <p className="text-xs" style={{ color: '#8A8270' }}>بنستقبل آخر نسخة من السحابة</p>
      </div>
    );
  }
  
  if (!isAuthenticated) return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
  
  if (!pinVerified) return (
    <PinLockScreen 
      onSuccess={() => { 
        sessionStorage.setItem('pin_verified', 'yes'); 
        setPinVerified(true); 
      }} 
      onLogout={() => { 
        firebase.auth().signOut(); 
        setIsAuthenticated(false); 
        sessionStorage.removeItem('pin_verified'); 
        setPinVerified(false); 
      }} 
    />
  );

  const renderActiveView = () => {
    switch (activeTab) {
      case 'dashboard': 
        return (
          <DashboardView 
            data={data} 
            financeSnapshot={financeSnapshot} 
            liveBalances={liveBalances} 
            totalLiquidity={totalLiquidity} 
            walletVisibility={walletVisibility} 
            onToggleVisibility={(k) => dispatch({ type: 'TOGGLE_WALLET_VISIBILITY', payload: k })} 
            dispatch={dispatch} 
            selectedYear={selectedYear} 
            selectedMonth={selectedMonth} 
            transactions={transactions} 
            cards={cards} 
            updatedLoans={updatedLoans} 
            chartData={chartData} 
            isDarkMode={isDarkMode} 
            addNotification={addNotification} 
            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} 
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} 
          />
        );
      case 'transactions': 
        return (
          <TransactionsView 
            groupedTransactions={groupedTransactions} 
            transactions={transactions} 
            selectedMonth={selectedMonth} 
            selectedYear={selectedYear} 
            transViewMode={transViewMode} 
            statusFilter={statusFilter} 
            searchTerm={searchTerm} 
            expandedGroup={expandedGroup} 
            data={data} 
            monthInsights={monthInsights} 
            dispatch={dispatch} 
            handleDelete={handleDelete} 
            addNotification={addNotification} 
            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} 
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} 
            saveHistory={saveHistory} 
            onBulkDelete={handleBulkDeleteInApp} 
          />
        );
      case 'categories': 
        return (
          <CategoriesView 
            transactions={transactions} 
            selectedMonth={selectedMonth} 
            selectedYear={selectedYear} 
            catViewType={catViewType} 
            budgets={budgets} 
            dispatch={dispatch} 
            handleDelete={handleDelete} 
            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} 
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} 
          />
        );
      case 'loans': 
        return (
          <LoansView 
            updatedLoans={updatedLoans} 
            cards={cards} 
            recurringItems={recurringItems} 
            transactions={transactions} 
            dispatch={dispatch} 
            deleteRecurring={deleteRecurring} 
            saveHistory={saveHistory} 
            getLocalISODate={getLocalISODate} 
            addNotification={addNotification} 
            data={data} 
            selectedMonth={selectedMonth} 
            selectedYear={selectedYear} 
          />
        );
      case 'cards': 
        return (
          <WalletsAndCardsView 
            cards={cards} 
            buildLedger={buildLedger} 
            expandedLedgers={expandedLedgers} 
            expandedCardsSection={expandedCardsSection} 
            selectedMonth={selectedMonth} 
            selectedYear={selectedYear} 
            dispatch={dispatch} 
            handleDelete={handleDelete} 
            handleAddWalletDeposit={handleAddWalletDeposit} 
            handleAddWalletWithdrawal={handleAddWalletWithdrawal} 
            walletVisibility={walletVisibility} 
            liveBalances={liveBalances} 
            saveHistory={saveHistory} 
            addNotification={addNotification} 
            data={data} 
          />
        );
      case 'planning': 
        return (
          <MonthlyPlanningView 
            data={data} 
            monthlyPlans={monthlyPlans} 
            cards={cards} 
            loans={updatedLoans} 
            dispatch={dispatch} 
            saveHistory={saveHistory} 
            addNotification={addNotification} 
          />
        );
      case 'planner': 
        return (
          <PlannerView 
            updatedLoans={updatedLoans} 
            cards={cards} 
            selectedMonth={selectedMonth} 
            selectedYear={selectedYear} 
            monthlyPlans={monthlyPlans} 
            totalLiquidityNow={totalLiquidity} 
            data={data} 
            transactions={transactions} 
            recurringItems={recurringItems} 
          />
        );
      case 'forecast': 
        return (
          <LiquidityForecastView 
            transactions={transactions} 
            updatedLoans={updatedLoans} 
            recurringItems={recurringItems} 
            liveBalances={liveBalances} 
            selectedYear={selectedYear} 
            selectedMonth={selectedMonth} 
            monthlyPlans={monthlyPlans} 
          />
        );
      case 'comparison': 
        return (
          <MonthComparisonView 
            transactions={transactions} 
            selectedYear={selectedYear} 
            selectedMonth={selectedMonth} 
          />
        );
      case 'calendar': 
        return (
          <CalendarView 
            data={data} 
            getAgendaItems={getAgendaItems} 
            transactions={transactions} 
            dispatch={dispatch} 
            saveHistory={saveHistory} 
            addNotification={addNotification} 
          />
        );
      case 'duplicates': 
        return (
          <DuplicateDetectionSystem 
            transactions={transactions} 
            data={data} 
            dispatch={dispatch} 
            addNotification={addNotification} 
            saveHistory={saveHistory} 
            onBulkDelete={handleBulkDeleteInApp} 
          />
        );
      case 'deleted': 
        return (
          <DeletedArchiveView 
            data={data} 
            dispatch={dispatch} 
            saveHistory={saveHistory} 
            addNotification={addNotification} 
            transactions={transactions} 
          />
        );
      case 'settings': 
        return (
          <SettingsView 
            data={data} 
            accountsData={accountsData} 
            cards={cards} 
            budgets={budgets} 
            dispatch={dispatch} 
            saveHistory={saveHistory} 
            addNotification={addNotification} 
          />
        );
      default: return null;
    }
  };

  const isHanyShopCategory = formData.category === 'مسحوبات محل هاني' || formData.category === 'مشتريات بقالة هاني';
  const appendQuickItem = (item) => {
    const current = formData.description || '';
    const sep = current && !current.endsWith(' ') && !current.endsWith(',') ? ' + ' : '';
    dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: current + sep + item } });
  };

  return (
    <PromiseModalProvider>
      <div className="flex h-screen overflow-hidden font-sans">
        <ProfessionalTicker 
          updatedLoans={updatedLoans} 
          cards={cards} 
          liveBalances={liveBalances} 
          walletVisibility={walletVisibility} 
          custodyBalance={custodySummary.balance} 
          data={data} 
        />
        <OfflineBanner online={isOnline} />
        <ToastContainer notifications={notifications} removeNotification={removeNotification} />
        <ConfirmDialog confirmDialog={confirmDialog} dispatch={dispatch} />
        
        {pendingCloseModal.isOpen && (
          <PendingCloseModal 
            data={pendingCloseModal} 
            onClose={() => dispatch({ 
              type: 'SET_PENDING_CLOSE_MODAL', 
              payload: { isOpen: false, pending: [], total: 0, month: '', year: 0 } 
            })} 
            onAction={handlePendingCloseAction} 
          />
        )}
        
        {isProcessing && (
          <div className="processing-overlay">
            <div className="processing-spinner mb-4"></div>
            <h3 className="text-base font-bold mb-2">جاري تطبيق العملية</h3>
            <button onClick={cancelProcessing} className="btn btn-secondary bg-red-500 text-white mt-3 text-xs">إلغاء</button>
          </div>
        )}
        
        {isPinChangeOpen && (
          <PinChangeModal 
            onClose={() => dispatch({ type: 'SET_PIN_CHANGE_OPEN', payload: false })} 
            addNotification={addNotification} 
          />
        )}
        
        {isSmsModalOpen && (
          <SmsParserModal 
            isOpen={true} 
            onClose={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: false })} 
            dispatch={dispatch} 
            addNotification={addNotification} 
            saveHistory={saveHistory} 
            data={data} 
          />
        )}
        
        {activeCategoryDetail && (
          <CategoryDetailModal 
            category={activeCategoryDetail} 
            transactions={transactions} 
            selectedMonth={selectedMonth} 
            selectedYear={selectedYear} 
            dispatch={dispatch} 
            addNotification={addNotification} 
          />
        )}
        
        {viewingCardStatement && (
          <CardStatementModal 
            card={viewingCardStatement} 
            data={data} 
            transactions={transactions} 
            onClose={() => dispatch({ type: 'SET_VIEWING_CARD_STATEMENT', payload: null })} 
            addNotification={addNotification} 
          />
        )}
        
        {viewingReceipt && (
          <ReceiptViewer 
            viewingReceipt={viewingReceipt} 
            dispatch={dispatch} 
            transactions={transactions} 
            saveHistory={saveHistory} 
            addNotification={addNotification} 
          />
        )}

        {/* Bottom Nav */}
        <div className="bottom-nav-container no-print">
          <div className="scrollable-nav scroll-hide">
            {[
              { id: 'dashboard', label: 'الرئيسية', icon: LayoutDashboard }, 
              { id: 'transactions', label: 'المعاملات', icon: ArrowUpRight }, 
              { id: 'cards', label: 'المحافظ', icon: CreditCard }, 
              { id: 'calendar', label: 'الأجندة', icon: CalendarDays }
            ].map(item => (
              <button 
                key={item.id} 
                type="button" 
                onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} 
                className={`nav-btn ${activeTab === item.id ? 'active' : ''}`}
              >
                <item.icon size={19} /><span>{item.label}</span>
              </button>
            ))}
            <button 
              type="button" 
              onClick={() => setIsDrawerOpen(true)} 
              className="nav-btn" 
              style={{ color: 'var(--brand)' }}
            >
              <Menu size={19} /><span>المزيد</span>
            </button>
          </div>
        </div>

        {/* Drawer */}
        {isDrawerOpen && (
          <div className="fixed inset-0 z-[4000] no-print">
            <div 
              className="absolute inset-0 backdrop-blur-sm animate-fadeIn" 
              style={{ background: 'rgba(42, 36, 24, 0.55)' }} 
              onClick={() => setIsDrawerOpen(false)}
            ></div>
            <div 
              className="absolute bottom-0 left-0 right-0 rounded-t-3xl shadow-2xl max-h-[85vh] overflow-y-auto scroll-hide animate-slideInBottom" 
              style={{ background: 'var(--bg-card)', paddingBottom: 'calc(20px + env(safe-area-inset-bottom))' }}
            >
              <div className="pt-3 pb-2 flex justify-center">
                <div className="w-10 h-1.5 rounded-full" style={{ background: 'var(--border-default)' }}></div>
              </div>
              <div className="px-4 pb-2 flex justify-between items-center">
                <h3 className="font-black text-sm">القائمة</h3>
                <button onClick={() => setIsDrawerOpen(false)} className="btn btn-ghost p-1.5">
                  <X size={16} />
                </button>
              </div>
              <div className="px-3 space-y-3">
                <div>
                  <p className="sidebar-group-title">المتابعة</p>
                  <div className="grid grid-cols-2 gap-1.5">
                    {[
                      { id: 'categories', label: 'الفئات', icon: Layers }, 
                      { id: 'loans', label: 'الالتزامات', icon: Banknote }
                    ].map(item => (
                      <button 
                        key={item.id} 
                        onClick={() => { dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id }); setIsDrawerOpen(false); }} 
                        className="flex items-center gap-2 p-2.5 rounded-lg text-xs font-bold" 
                        style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}
                      >
                        <item.icon size={14} /><span className="truncate">{item.label}</span>
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <p className="sidebar-group-title">التخطيط</p>
                  <div className="grid grid-cols-2 gap-1.5">
                    {[
                      { id: 'planning', label: 'التخطيط', icon: Table }, 
                      { id: 'planner', label: 'المخطط', icon: Target }, 
                      { id: 'forecast', label: 'التوقع', icon: LineChart }, 
                      { id: 'comparison', label: 'المقارنة', icon: Activity }
                    ].map(item => (
                      <button 
                        key={item.id} 
                        onClick={() => { dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id }); setIsDrawerOpen(false); }} 
                        className="flex items-center gap-2 p-2.5 rounded-lg text-xs font-bold" 
                        style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}
                      >
                        <item.icon size={14} /><span className="truncate">{item.label}</span>
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <p className="sidebar-group-title">الأدوات</p>
                  <div className="grid grid-cols-2 gap-1.5">
                    {[
                      { id: 'duplicates', label: 'المكررات', icon: Filter }, 
                      { id: 'deleted', label: 'المحذوفات', icon: Trash2 }, 
                      { id: 'settings', label: 'الإعدادات', icon: Sliders }
                    ].map(item => (
                      <button 
                        key={item.id} 
                        onClick={() => { dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id }); setIsDrawerOpen(false); }} 
                        className="flex items-center gap-2 p-2.5 rounded-lg text-xs font-bold" 
                        style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}
                      >
                        <item.icon size={14} /><span className="truncate">{item.label}</span>
                      </button>
                    ))}
                    <button 
                      onClick={() => { handleExport(); setIsDrawerOpen(false); }} 
                      className="flex items-center gap-2 p-2.5 rounded-lg text-xs font-bold" 
                      style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}
                    >
                      <Download size={14} className="text-blue-500" /><span className="truncate">حفظ نسخة</span>
                    </button>
                    <label 
                      className="flex items-center gap-2 p-2.5 rounded-lg text-xs font-bold cursor-pointer" 
                      style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}
                    >
                      <Upload size={14} className="text-purple-500" />
                      <span className="truncate">استيراد</span>
                      <input 
                        type="file" 
                        accept=".json" 
                        onChange={(e) => { handleImport(e); setIsDrawerOpen(false); }} 
                        className="hidden" 
                      />
                    </label>
                    <button 
                      onClick={() => { 
                        sessionStorage.removeItem('pin_verified'); 
                        setPinVerified(false); 
                        setIsDrawerOpen(false); 
                      }} 
                      className="flex items-center gap-2 p-2.5 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-amber-700 dark:text-amber-400 text-xs font-bold"
                    >
                      <Lock size={14} /><span className="truncate">قفل</span>
                    </button>
                    <button 
                      onClick={() => { 
                        firebase.auth().signOut(); 
                        setIsAuthenticated(false); 
                        sessionStorage.removeItem('pin_verified'); 
                        setPinVerified(false); 
                        setIsDrawerOpen(false); 
                      }} 
                      className="flex items-center gap-2 p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-red-600 text-xs font-bold"
                    >
                      <LogOut size={14} /><span className="truncate">خروج</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* FAB */}
        <button 
          type="button" 
          aria-label="إضافة" 
          onClick={() => { 
            dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); 
            dispatch({ 
              type: 'SET_FORM_DATA', 
              payload: { 
                type: 'expense', category: '', amount: '', date: getLocalISODate(), 
                method: 'cash', subType: 'withdrawal', status: 'pending', receipts: [] 
              } 
            }); 
            dispatch({ type: 'SET_FORM_OPEN', payload: true }); 
          }} 
          className="fab no-print"
        >
          <Plus size={22} />
        </button>

        <EnhancedSidebar activeTab={activeTab} dispatch={dispatch} canUndo={history.length > 0} onUndo={() => dispatch({ type: 'UNDO' })} />

        <main className={`flex-1 overflow-y-auto p-3 lg:p-5 ${isOnline ? 'pt-12' : 'pt-24'}`}>
          <div className="max-w-6xl mx-auto space-y-4 animate-fadeIn pb-24">
            <ProfessionalHeader 
              isDarkMode={isDarkMode} 
              dispatch={dispatch} 
              onOpenSms={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: true })} 
              isOnline={isOnline} 
              syncStatus={cloudSyncStatus} 
              isSaving={isSaving}        
            />
            {renderActiveView()}
          </div>
        </main>

        {/* Form Modal */}
        {isFormOpen && (
          <div className="modal-backdrop no-print">
            <div 
              className="w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-slideInBottom" 
              style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)', maxHeight: 'calc(100dvh - 24px)' }}
            >
              <div className="p-3.5 flex justify-between items-center flex-shrink-0" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-sm font-black">{formMode === 'add' ? 'إضافة عملية' : 'تعديل'}</h3>
                <button 
                  type="button" 
                  aria-label="إغلاق" 
                  onClick={() => dispatch({ type: 'SET_FORM_OPEN', payload: false })} 
                  className="btn btn-ghost p-1.5"
                ><X size={16} /></button>
              </div>
              <form onSubmit={handleSaveTransaction} className="p-3.5 space-y-2.5 overflow-y-auto scroll-hide" style={{ minHeight: 0 }}>
                {!isOnline && (
                  <div className="p-2 rounded-lg bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900 flex items-center gap-2">
                    <Wifi size={12} className="text-amber-600" />
                    <span className="text-[10px] font-bold text-amber-700 dark:text-amber-400">
                      أنت غير متصل — سيتم الحفظ محلياً والمزامنة تلقائياً
                    </span>
                  </div>
                )}
                
                <div className="grid grid-cols-2 gap-2.5">
                  <div>
                    <label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>النوع</label>
                    <select 
                      className="input-field font-bold text-sm py-2.5" 
                      value={formData.type} 
                      onChange={(e) => { 
                        const t = e.target.value; 
                        dispatch({ 
                          type: 'SET_FORM_DATA', 
                          payload: { ...formData, type: t, subType: t === 'income' ? 'deposit' : 'withdrawal', category: '' } 
                        }); 
                      }}
                    >
                      <option value="expense">مصروف 💸</option>
                      <option value="income">دخل 💰</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الفئة</label>
                    <select 
                      className={`input-field font-bold text-sm py-2.5 ${formErrors.category ? 'error' : ''}`} 
                      value={formData.category} 
                      onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, category: e.target.value } })} 
                      required
                    >
                      <option value="">اختر...</option>
                      {Object.entries(CATEGORY_GROUPS[formData.type]).map(([g, items]) => (
                        <optgroup key={g} label={g}>
                          {items.map(c => <option key={c} value={c}>{c}</option>)}
                        </optgroup>
                      ))}
                    </select>
                  </div>
                </div>
                
                <div className="p-2.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className="grid grid-cols-2 gap-1.5">
                    <label className={`flex items-center justify-center gap-1.5 p-2.5 rounded-lg cursor-pointer border-2 font-bold text-[11px] transition-all ${formData.status !== 'paid' ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-500 text-amber-700 dark:text-amber-400' : 'border-transparent'}`}>
                      <input 
                        type="radio" 
                        name="status" 
                        value="pending" 
                        className="hidden" 
                        checked={formData.status !== 'paid'} 
                        onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'pending' } })} 
                      />
                      <Clock size={12} /> معلق
                    </label>
                    <label className={`flex items-center justify-center gap-1.5 p-2.5 rounded-lg cursor-pointer border-2 font-bold text-[11px] transition-all ${formData.status === 'paid' ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-500 text-emerald-700 dark:text-emerald-400' : 'border-transparent'}`}>
                      <input 
                        type="radio" 
                        name="status" 
                        value="paid" 
                        className="hidden" 
                        checked={formData.status === 'paid'} 
                        onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'paid' } })} 
                      />
                      <CheckCircle2 size={12} /> معتمد
                    </label>
                  </div>
                </div>
                
                <div className="grid grid-cols-3 gap-2">
                  <div>

                      onChange={async (e) => {
                        const files = e.target.files;
                        if (!files || files.length === 0) return;
                        try {
                          const uploaded = [];
                          for (const file of Array.from(files).slice(0, 5)) {
                            const r = await uploadReceipt(formData.id || getSafeId(), file);
                            uploaded.push(r);
                          }
                          dispatch({ 
                            type: 'SET_FORM_DATA', 
                            payload: { ...formData, receipts: [...(formData.receipts || []), ...uploaded] } 
                          });
                          addNotification({ type: 'success', title: `تم رفع ${uploaded.length} فاتورة` });
                        } catch (err) { 
                          addNotification({ type: 'error', title: 'فشل الرفع', message: err.message }); 
                        }
                        e.target.value = '';
                      }}

                <div className="grid grid-cols-2 gap-2.5">

                      inputMode="decimal" 
                      required 
                      className="input-field font-bold text-blue-600 text-sm" 
                      value={recurringFormData.amount} 
                      onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, amount: e.target.value } })} 
                    />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>اليوم (1-31)</label>
                    <input 
                      type="number" 
                      required 
                      min="1" 
                      max="31" 
                      className="input-field text-center text-sm" 
                      value={recurringFormData.day} 
                      onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, day: e.target.value } })} 
                    />
                  </div>
                </div>
                <div>
                  <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>النوع</label>
                  <select 
                    className="input-field text-sm" 
                    value={recurringFormData.type} 
                    onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, type: e.target.value, category: '' } })}
                  >
                    <option value="expense">مصروف</option>
                    <option value="income">دخل</option>
                  </select>
                </div>
                <div>
                  <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الفئة</label>
                  <select 
                    className="input-field text-sm" 
                    value={recurringFormData.category} 
                    onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, category: e.target.value } })}
                  >
                    {CATEGORIES[recurringFormData.type].map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>طريقة الدفع/الحساب</label>
                  <select 
                    className="input-field text-sm" 
                    value={recurringFormData.method || 'cash'} 
                    onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, method: e.target.value } })}
                  >
                    {PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                  </select>
                </div>
                {recurringFormData.category && recurringFormData.category.startsWith('مصروف شهري - ') && (
                  <div>
                    <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>قناة التحويل (اختياري — Telda)</label>
                    <select 
                      className="input-field text-sm" 
                      value={recurringFormData.transferChannel || ''} 
                      onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, transferChannel: e.target.value || null } })}
                    >
                      <option value="">— بدون —</option>
                      {EXTERNAL_TRANSFER_METHOD_IDS.map(id => 
                        <option key={id} value={id}>{PAYMENT_METHODS.find(m => m.id === id)?.label || id}</option>
                      )}
                    </select>
                  </div>
                )}
                <div className="grid grid-cols-2 gap-2.5">
                  <div>
                    <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>من شهر (اختياري)</label>
                    <input 
                      type="month" 
                      className="input-field text-xs font-bold py-2" 
                      value={recurringFormData.startMonth || ''} 
                      onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, startMonth: e.target.value } })} 
                    />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>إلى شهر (اختياري)</label>
                    <input 
                      type="month" 
                      className="input-field text-xs font-bold py-2" 
                      value={recurringFormData.endMonth || ''} 
                      onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, endMonth: e.target.value } })} 
                    />
                  </div>
                </div>
                <label className="flex items-center gap-2.5 p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 cursor-pointer">
                  <input 
                    type="checkbox" 
                    checked={recurringFormData.active !== false} 
                    onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, active: e.target.checked } })} 
                    className="w-4 h-4 accent-emerald-600" 
                  />
                  <span className="text-xs font-bold text-emerald-700 dark:text-emerald-400">
                    نشط (سيُولّد تلقائياً كل شهر)
                  </span>
                </label>
                <button type="submit" className="btn btn-primary w-full py-2.5 text-sm">
                  <Save size={14} /> {recurringFormData.id ? 'تحديث البند' : 'إضافة البند'}
                </button>
              </form>
            </div>
          </div>
        )}
      </div>
    </PromiseModalProvider>
  );
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════ */
const rootElement = document.getElementById('root');
if (rootElement) {
  createRoot(rootElement).render(<ErrorBoundary><App /></ErrorBoundary>);
  const hideLoading = () => {
    const l = document.getElementById('loading');
    if (!l) return;
    l.style.transition = 'opacity 0.35s ease';
    l.style.opacity = '0';
    setTimeout(() => { l.style.display = 'none'; }, 350);
  };
  if (document.readyState === 'complete') { 
    setTimeout(hideLoading, 500); 
  } else { 
    window.addEventListener('load', () => setTimeout(hideLoading, 500)); 
  }
}
</script>
</body>
</html>
