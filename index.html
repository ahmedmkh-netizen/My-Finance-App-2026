const migrateTransactionV87 = (t) => {
  if (!t) return t;
  const normCat = normalizeCategory(t.category);

  if (isHanyShopCategory(normCat)) {
    const isMarker = isCarryoverMarker(t);
    if (isMarker) {
      return { ...t, category: HANY_TAB_CATEGORY, hanyEffect: 'carryover-marker', affectsCash: false, method: HANY_TAB_METHOD };
    }
    const isPaid = t.status === 'paid';
    return {
      ...t, category: HANY_TAB_CATEGORY, kind: 'operational',
      method: isPaid ? HANY_TAB_METHOD : (t.method || HANY_TAB_METHOD),
      affectsCash: false, hanyEffect: 'purchase'
    };
  }

  if (isHanySettleCategory(normCat) || t.hanyEffect === 'settle') {
    const settleMethod = LEDGER_METHOD_IDS.has(t.method) ? t.method : 'cash';
    return {
      ...t,
      category: HANY_SETTLE_CATEGORY,
      kind: 'financial',
      hanyEffect: 'settle',
      affectsCash: true,
      method: settleMethod
    };
  }

  if (t.settledHanyMonth && !t.hanyEffect) {
    return { ...t, hanyEffect: 'settle', category: HANY_SETTLE_CATEGORY };
  }

  if (t.subCategory === 'رصيد مرحل' ||
      (t.description || '').includes('مرحلة من') ||
      (t.description || '').includes('مرحل من الشهر') ||
      (t.description || '').includes('رصيد مرحل')) {
    return {
      ...t, method: HANY_TAB_METHOD, affectsCash: false,
      hanyEffect: 'carryover-marker', status: 'paid', source: 'carryover'
    };
  }

  return { ...t, category: normCat };
};

const migrateHanyTx = (t) => {
  if (!t) return t;
  if (isCarryoverMarker(t)) return t;
  if (isHanySettleCategory(t.category)) return t;
  if (!isHanyShopCategory(t.category)) return t;
  return {
    ...t, category: HANY_TAB_CATEGORY,
    method: t.status === 'paid' ? HANY_TAB_METHOD : (t.method || HANY_TAB_METHOD),
    affectsCash: false, hanyEffect: 'purchase',
  };
};

const migrateCardPayments = (transactions, cards) => {
  if (!Array.isArray(transactions)) return [];
  const cardMethods = new Map();
  (cards || []).forEach(c => cardMethods.set(getCardMethod(c), c.id));

  return transactions.map(t => {
    if (!t) return t;
    if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return t;

    if (t.__cardPaymentMigrated) return t;
    if (t.source === 'card-payment-plan' || t.source === 'payment-console') {
      return { ...t, __cardPaymentMigrated: true };
    }
    if (t.category === 'الالتزامات البنكية والتمويلية' && t.linkedCardId) {
      return { ...t, __cardPaymentMigrated: true };
    }
    if (t.category === 'الالتزامات البنكية والتمويلية'
        && t.type === 'expense'
        && t.method
        && cardMethods.has(t.method)
        && !t.linkedCardId
        && !t.linkedLoanId) {
      return { ...t, linkedCardId: cardMethods.get(t.method), __cardPaymentMigrated: true };
    }
    return t;
  });
};

const migrateSnapshotsAndClosed = (snapshots, closedMonths) => {
  let snaps = snapshots && typeof snapshots === 'object' ? { ...snapshots } : {};
  let closed = Array.isArray(closedMonths) ? [...closedMonths] : [];
  if (Object.keys(snaps).length > 0 && !Object.keys(snaps).every(k => /^\d{4}-/.test(k))) {
    const migrated = {};
    Object.entries(snaps).forEach(([month, val]) => {
      if (/^\d{4}-/.test(month)) migrated[month] = val;
      else migrated[makeMonthKey(2026, month)] = (typeof val === 'object' && val !== null) ? val : { cash: safeNumber(val) };
    });
    snaps = migrated;
  }
  if (closed.length > 0 && !closed.every(k => /^\d{4}-/.test(k))) {
    closed = closed.map(m => /^\d{4}-/.test(m) ? m : makeMonthKey(2026, m));
  }
  return { snapshots: snaps, closedMonths: closed };
};

const migrateCards = (cards) => {
  if (!Array.isArray(cards)) return DEFAULT_CARDS;
  return cards.map(c => {
    const migrated = { ...c };
    if (!Array.isArray(migrated.subCardLast4)) migrated.subCardLast4 = [];
    if (migrated.id === 2 && String(migrated.last4) === '0391') migrated.last4 = '3391';
    if (migrated.id === 1 && migrated.name === 'Titanium' && migrated.subCardLast4.length === 0) migrated.subCardLast4 = ['9380', '9352', '2014'];
    if (!migrated.openingDate) migrated.openingDate = null;
    if (!migrated.openingDebtDate) migrated.openingDebtDate = migrated.openingDate || null;
    if (c.openingDebt !== undefined && c.availableBalance !== undefined) {
      return { ...migrated, cashbackRate: c.cashbackRate !== undefined ? safeNumber(c.cashbackRate) : 0 };
    }
    const limit = safeNumber(c.limit);
    const oldOpening = safeNumber(c.openingBalance);
    return { ...migrated, openingDebt: Math.max(0, limit - oldOpening), availableBalance: oldOpening, cashbackRate: safeNumber(c.cashbackRate, 0) };
  });
};

const migrateTransaction = (t) => {
  if (!t) return t;
  const kind = inferKind(t);
  const category = normalizeCategory(t.category);
  let year = t.year, month = t.month, monthIndex = t.monthIndex;
  if (t.date && (!month || !year)) {
    const d = parseISODate(t.date);
    if (d) { if (!year) year = d.getFullYear(); if (!month) month = ALL_MONTHS[d.getMonth()]; }
  }
  if (!year) year = 2026;
  if (monthIndex === undefined || monthIndex === null || monthIndex < 0) monthIndex = getMonthIndex(month);
  if (monthIndex < 0 && month) {
    const norm = ALL_MONTHS.find(m => normalizeText(m) === normalizeText(month));
    if (norm) { month = norm; monthIndex = getMonthIndex(norm); }
  }
  let subType = t.subType;
  if (!subType) subType = t.type === 'income' ? 'deposit' : 'withdrawal';
  const createdAt = t.createdAt || (t.date ? `${t.date}T12:00:00.000Z` : new Date().toISOString());
  return { ...t, category, kind, year, month, monthIndex, subType, createdAt };
};

const migrateRecurringItems = (items) => {
  if (!Array.isArray(items)) return [];
  return items.map(r => {
    const migrated = { ...r };
    if (migrated.active === undefined) migrated.active = true;
    if (migrated.startMonth && !/^\d{4}-\d{2}$/.test(migrated.startMonth)) migrated.startMonth = keyToInputMonth(migrated.startMonth) || null;
    if (migrated.endMonth && !/^\d{4}-\d{2}$/.test(migrated.endMonth)) migrated.endMonth = keyToInputMonth(migrated.endMonth) || null;
    if (migrated.startMonth === undefined) migrated.startMonth = null;
    if (migrated.endMonth === undefined) migrated.endMonth = null;
    if (r.title && r.title.includes('تكييف محمود') && !migrated.linkedLoanSystemId) migrated.linkedLoanSystemId = SYSTEM_LOAN_IDS.TAKYEEF;
    if (!migrated.transferChannel && r.category && r.category.startsWith('مصروف شهري - ')) {
      const ben = BENEFICIARIES.find(b => `مصروف شهري - ${b.label}` === r.category);
      if (ben && ben.hasTelda) migrated.transferChannel = ben.method;
    }
    return migrated;
  });
};

const METHOD_BY_CATEGORY = {
  'إيجار المحل': 'cash', 'الزكاة والتبرعات': 'cib_savings', 'تكييف محمود': 'cash',
  'راتب شهري': 'aaib_savings', 'راتب AAIB': 'aaib_savings', 'عهدة إيماك WE': 'cib_savings',
  'عهدة شركة إيماك': 'cib_savings', 'استرداد كاش باك': 'cash',
  'الالتزامات البنكية والتمويلية': 'aaib_savings', 'الصحة والرعاية الطبية': 'cash',
  'مصروف شهري - شيماء': 'cib_savings', 'مصروف شهري - سلمى': 'cib_savings',
  'مصروف شهري - عبد الرحمن': 'cib_savings', 'مصروف شهري - أنس': 'cash'
};

const mergeById = (existing, defaults) => {
  if (!Array.isArray(existing) || existing.length === 0) return defaults;
  const merged = [...existing];
  defaults.forEach(d => {
    if (!merged.some(e => e.id === d.id || (e.systemId && d.systemId && e.systemId === d.systemId))) merged.push(d);
  });
  return merged;
};

const migrateData = (parsed) => {
  if (!parsed) return parsed;

  const deletedDefaultIds = Array.isArray(parsed.deletedDefaultIds) ? parsed.deletedDefaultIds : [];
  const deletedSet = new Set(deletedDefaultIds);

  const incomingCards = Array.isArray(parsed.cards) ? parsed.cards : [];
  const cardsFilteredDefaults = DEFAULT_CARDS.filter(c => !deletedSet.has(c.id));
  const mergedCards = mergeById(migrateCards(incomingCards), cardsFilteredDefaults);

  const incomingLoans = Array.isArray(parsed.loans) ? parsed.loans : [];
  const processedLoans = incomingLoans.map(l => {
    if (isTakyeefLoan(l)) return {
      ...l, systemId: SYSTEM_LOAN_IDS.TAKYEEF, isReceivable: true, type: 'receivable',
      interest: 'مستحق لنا شهرياً', paused: !!l.paused,
      totalInstallments: safeNumber(l.totalInstallments, 12),
      paidInstallments: safeNumber(l.paidInstallments, 0)
    };
    if (isHanyLoan(l) && !l.autoMonthly) return {
      ...l, systemId: SYSTEM_LOAN_IDS.HANY, autoMonthly: true, dueNextMonth: true,
      mergeIntoNextCycle: l.mergeIntoNextCycle || [],
      category: HANY_TAB_CATEGORY, totalAmount: 0, prePaidAmount: 0,
      monthlyInstallment: 0, dueDay: 5, interest: 'مستحق شهري',
      description: 'مشتريات يومية', type: 'debt'
    };
    if (l && l.autoMonthly && !l.systemId) return { ...l, systemId: SYSTEM_LOAN_IDS.HANY };
    return l;
  });
  const mergedLoans = mergeById(processedLoans, []);

  let { snapshots, closedMonths } = migrateSnapshotsAndClosed(parsed.monthlySnapshots, parsed.closedMonths);
  const incomingVersion = safeNumber(parsed.engineVersion, 1);
  if (incomingVersion < 10 && Object.keys(snapshots).length > 0) snapshots = {};

  let transactions = Array.isArray(parsed.transactions) ? parsed.transactions.map(migrateTransaction) : [];
  transactions = transactions.map(migrateTransactionV87).map(migrateHanyTx);
  transactions = migrateCardPayments(transactions, mergedCards);
  transactions = transactions.map(t => {
    if (t.id && t.sourceRecurringId && t.year && t.month && /^rec-.+-\d{4}-.+-[a-z0-9-]{6,}$/i.test(t.id)) {
      return { ...t, id: `rec-${t.sourceRecurringId}-${makeMonthKey(t.year, t.month)}` };
    }
    return t;
  });
  transactions = sortTransactions(transactions);

  const accountsData = parsed.accountsData && typeof parsed.accountsData === 'object'
    ? { ...DEFAULT_ACCOUNTS, ...parsed.accountsData }
    : JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));

  const renamedLabels = { 'CIB توفير': 'CIB Savings', 'AAIB توفير': 'AAIB Savings', 'نقدي': 'Cash', 'فوري': 'Fawry', 'اتصالات': 'Etisalat' };
  ACCOUNT_KEYS.forEach(k => {
    if (!accountsData[k]) accountsData[k] = { ...DEFAULT_ACCOUNTS[k] };
    if (accountsData[k].initialBalance === undefined || accountsData[k].initialBalance === null) {
      accountsData[k].initialBalance = safeNumber(accountsData[k].balance);
    }
    if (accountsData[k].initialDate === undefined || accountsData[k].initialDate === null) {
      accountsData[k].initialDate = accountsData[k].lastUpdated || null;
    }
    if (accountsData[k].lastUpdated === undefined) accountsData[k].lastUpdated = null;
    if (accountsData[k]?.label && renamedLabels[accountsData[k].label]) {
      accountsData[k] = { ...accountsData[k], label: renamedLabels[accountsData[k].label] };
    }
    if (!accountsData[k].label) accountsData[k] = { ...accountsData[k], label: DEFAULT_ACCOUNTS[k].label };
    if (k === 'cib_savings' && !accountsData[k].last4) accountsData[k] = { ...accountsData[k], last4: '1809' };
    if (k === 'aaib_savings' && !accountsData[k].last4) accountsData[k] = { ...accountsData[k], last4: '2106' };
  });

  let recurringItems = Array.isArray(parsed.recurringItems) ? parsed.recurringItems : [];
  recurringItems = migrateRecurringItems(recurringItems);
  recurringItems = recurringItems.map(r => {
    if (r.method) return r;
    if (r.linkedCardId) { const card = DEFAULT_CARDS.find(c => c.id === r.linkedCardId); return { ...r, method: card ? getCardMethod(card) : 'cash' }; }
    const m = METHOD_BY_CATEGORY[r.category];
    return m ? { ...r, method: m } : { ...r, method: 'cash' };
  });

  const settledHanyMonths = Array.isArray(parsed.settledHanyMonths) ? parsed.settledHanyMonths : [];
  const deletedTxIds = Array.isArray(parsed.deletedTxIds) ? parsed.deletedTxIds.slice(-500) : [];
  const existingArchive = Array.isArray(parsed.deletedTxArchive) ? parsed.deletedTxArchive : [];

  let migratedArchive = [...existingArchive];
  if (!parsed.legacyArchiveMigrated) {
    const archiveIds = new Set(existingArchive.map(a => a.id).filter(Boolean));
    deletedTxIds.forEach(id => {
      if (!archiveIds.has(id)) migratedArchive.push({ id, deletedAt: null, deletedBy: 'unknown', _legacy: true });
    });
  }

  const auditLog = Array.isArray(parsed.auditLog) ? parsed.auditLog.slice(0, 1000) : [];

  const { openingBalance2026: _drop, ...rest } = parsed;

  const base = {
    ...rest,
    engineVersion: CURRENT_ENGINE_VERSION,
    recurringInitialized: true,
    cards: mergedCards, loans: mergedLoans, recurringItems, closedMonths,
    monthlySnapshots: snapshots, transactions, accountsData,
    monthlyPlans: parsed.monthlyPlans && typeof parsed.monthlyPlans === 'object' ? parsed.monthlyPlans : {},
    materializedRecurring: parsed.materializedRecurring && typeof parsed.materializedRecurring === 'object' ? parsed.materializedRecurring : {},
    custodyEntries: Array.isArray(parsed.custodyEntries) ? parsed.custodyEntries : [],
    cashbackTrackers: Array.isArray(parsed.cashbackTrackers) ? parsed.cashbackTrackers : [],
    reconciliations: Array.isArray(parsed.reconciliations) ? parsed.reconciliations : [],
    settledHanyMonths, deletedTxIds, deletedTxArchive: migratedArchive.slice(-500),
    legacyArchiveMigrated: true, deletedDefaultIds, auditLog, defaultsSeeded: true,
    shoppingRecurring: Array.isArray(parsed.shoppingRecurring) ? parsed.shoppingRecurring : [],
    deleteRequests: Array.isArray(parsed.deleteRequests) ? parsed.deleteRequests : [],
  };

  base.hanyPayableCache = computeHanyPayable(base);
  base.__v87MigratedAt = new Date().toISOString();
  return base;
};

const getInitialData = () => {
  try {
    const cached = localStorage.getItem(STORAGE_KEY) || LEGACY_KEYS.map(k => localStorage.getItem(k)).find(Boolean);
    if (cached) {
      const migrated = migrateData(safeParseJson(cached, null));
      if (migrated) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated)); } catch(e){}
        return migrated;
      }
    }
  } catch (e) { console.warn('getInitialData failed:', e); }

  return {
    engineVersion: CURRENT_ENGINE_VERSION, recurringInitialized: true, defaultsSeeded: true,
    transactions: [], loans: [], cards: DEFAULT_CARDS,
    accountsData: JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS)),
    monthlyPlans: {}, recurringItems: [], closedMonths: [], monthlySnapshots: {},
    materializedRecurring: {}, custodyEntries: [], cashbackTrackers: [], reconciliations: [],
    settledHanyMonths: [], deletedTxIds: [], deletedTxArchive: [],
    deletedDefaultIds: [], auditLog: [], shoppingRecurring: [], deleteRequests: [],
    hanyPayableCache: 0,
  };
};

/* ═══════════════ RECURRING ENGINE ═══════════════ */
const materializeRecurringItems = (data, asOfDateStr) => {
  if (!data?.recurringItems?.length) return null;

  const now = asOfDateStr ? new Date(asOfDateStr) : new Date();

  const futureCutoff = new Date(now);
  futureCutoff.setMonth(futureCutoff.getMonth() + 12);
  futureCutoff.setHours(23, 59, 59, 999);

  const pastCutoff = new Date(now);
  pastCutoff.setFullYear(pastCutoff.getFullYear() - 3);
  pastCutoff.setHours(0, 0, 0, 0);

  const permanentDeleted = new Set(data.deletedTxIds || []);
  const existing = (data.transactions || []).filter(t => !(permanentDeleted.has(t.id)));
  const materialized = { ...(data.materializedRecurring || {}) };
  const newTxs = [];

  const loanPaidMap = {};
  existing.forEach(t => {
    if (t.status === 'paid' && t.sourceReceivableId)
      loanPaidMap[t.sourceReceivableId] = (loanPaidMap[t.sourceReceivableId] || 0) + safeNumber(t.amount);
  });

  data.recurringItems.forEach(r => {
    if (r.active === false || !r.id || !r.type) return;
    const day = safeNumber(r.day, 1);
    if (day < 1 || day > 31) return;

    const startInput = r.startMonth || `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const [sy, sm] = startInput.split('-').map(Number);
    if (isNaN(sy) || isNaN(sm)) return;
    const startYM = sy * 12 + (sm - 1);

    let endYM;
    if (r.endMonth) {
      const [ey, em] = r.endMonth.split('-').map(Number);
      if (isNaN(ey) || isNaN(em)) return;
      endYM = ey * 12 + (em - 1);
    } else {
      const endDefault = new Date(now);
      endDefault.setMonth(endDefault.getMonth() + 12);
      endYM = endDefault.getFullYear() * 12 + endDefault.getMonth();
    }

    if (startYM > endYM) return;

    for (let ym = startYM; ym <= endYM; ym++) {
      const y = Math.floor(ym / 12);
      const mIdx = ym % 12;
      const monthName = ALL_MONTHS[mIdx];
      const maxDayInMonth = new Date(y, mIdx + 1, 0).getDate();
      const safeDay = Math.min(day, maxDayInMonth);
      const targetDate = new Date(y, mIdx, safeDay);

      if (targetDate > futureCutoff) continue;
      if (targetDate < pastCutoff) continue;

      const matKey = `${r.id}_${makeMonthKey(y, monthName)}`;
      if (materialized[matKey] === 'deleted') continue;
      if (materialized[matKey]) continue;

      const manualExists = existing.some(t => t.sourceRecurringId === r.id && t.month === monthName && (t.year || y) === y);
      if (manualExists) { materialized[matKey] = true; continue; }

      let receivableLinkedId = null;
      if (r.linkedLoanSystemId) {
        const linkedLoan = (data.loans || []).find(l => l.systemId === r.linkedLoanSystemId);
        if (linkedLoan) {
          const collected = safeNumber(linkedLoan.prePaidAmount) + (loanPaidMap[linkedLoan.id] || 0);
          if (collected >= safeNumber(linkedLoan.totalAmount) - 0.005) continue;
          receivableLinkedId = linkedLoan.id;
        }
      }

      let method = 'cash';
      let linkedCardId = r.linkedCardId;
      if (r.method) method = r.method;
      else if (linkedCardId) { const card = (data.cards || []).find(c => c.id === linkedCardId); if (card) method = getCardMethod(card); }

      const isFee = BANK_FEE_CATEGORIES.has(r.category);
      const kind = r.kind || (isFee ? KIND.FINANCIAL : KIND.OPERATIONAL);
      const newId = `rec-${r.id}-${makeMonthKey(y, monthName)}`;
      if (permanentDeleted.has(newId)) { materialized[matKey] = 'deleted'; continue; }

      newTxs.push({
        id: newId, type: r.type, subType: r.type === 'income' ? 'deposit' : 'withdrawal',
        kind, category: r.category, amount: safeNumber(r.amount),
        description: r.title || 'بند متكرر', method,
        date: getLocalISODate(targetDate), month: monthName, year: y, monthIndex: mIdx,
        status: 'pending', sourceRecurringId: r.id,
        linkedCardId: linkedCardId || undefined,
        sourceReceivableId: receivableLinkedId || undefined,
        transferChannel: r.transferChannel || undefined,
        createdAt: new Date().toISOString()
      });
      materialized[matKey] = true;
    }
  });

  if (newTxs.length === 0) return null;
  return { ...data, transactions: sortTransactions([...newTxs, ...existing]), materializedRecurring: materialized };
};

/* ═══════════════ DRIVE OPERATIONS ═══════════════ */
const getOrCreateBackupFolder = async () => {
  const token = await ensureDriveToken();
  const customFolderId = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;
  if (customFolderId) {
    try {
      const checkRes = await fetch(`https://www.googleapis.com/drive/v3/files/${customFolderId}?fields=id,name,mimeType,trashed`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (checkRes.ok) { const info = await checkRes.json(); if (!info.trashed) return customFolderId; }
    } catch (e) {}
  }
  const q = encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive&pageSize=20`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  if (!res.ok) throw new Error('فشل قراءة المجلدات');
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    const folderId = data.files[0].id;
    localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, folderId);
    return folderId;
  }
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  if (!createRes.ok) throw new Error('فشل إنشاء المجلد');
  const created = await createRes.json();
  localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, created.id);
  return created.id;
};

const uploadBackupToDrive = async (payload, fileName) => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const name = fileName || `finance_backup_v876_${getLocalISODate()}_${Date.now()}.json`;
  const metadata = { name, parents: [folderId], mimeType: 'application/json' };
  const boundary = '----V87DriveBoundary' + Date.now();
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,createdTime', {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  if (!res.ok) throw new Error('فشل الرفع');
  return await res.json();
};

const listDriveBackups = async () => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false and mimeType='application/json'`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,size,createdTime)&orderBy=createdTime desc&pageSize=50`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  if (!res.ok) throw new Error('فشل الجلب');
  const data = await res.json();
  return data.files || [];
};

const downloadBackupFromDrive = async (fileId) => {

/* ═══════════════ ONLINE STATUS HOOK ═══════════════ */
const useOnlineStatus = () => {
  const [online, setOnline] = useState(() => (typeof navigator !== 'undefined' ? navigator.onLine : true));
  useEffect(() => {
    const onOnline = () => setOnline(true);
    const onOffline = () => setOnline(false);
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    return () => { window.removeEventListener('online', onOnline); window.removeEventListener('offline', onOffline); };
  }, []);
  return online;
};

/* ═══════════════ MODAL RESOLVERS ═══════════════ */
const _modalResolvers = new Map();
let _modalIdCounter = 0;
const clearAllModals = () => { _modalResolvers.forEach((resolve) => resolve(null)); _modalResolvers.clear(); };

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { hasError: false, error: null, errorInfo: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(e, i) { console.error('App Error:', e, i); this.setState({ errorInfo: i }); clearAllModals(); }
  safeReset = () => {
    const keep = {};
    try { [PIN_HASH_KEY, 'theme', 'budgets'].forEach(k => { const v = localStorage.getItem(k); if (v) keep[k] = v; }); } catch (e) {}
    try { localStorage.clear(); } catch (e) {}
    try { Object.entries(keep).forEach(([k, v]) => localStorage.setItem(k, v)); } catch (e) {}
    window.location.reload();
  };
  render() {
    if (this.state.hasError) return (
      <div className="flex flex-col h-screen items-center justify-center p-8 text-center" style={{ background: 'var(--bg-app)' }} dir="rtl">
        <div className="w-20 h-20 rounded-3xl flex items-center justify-center mb-6" style={{ background: 'var(--danger-soft)' }}>
          <AlertTriangle size={36} className="text-red-500" />
        </div>
        <h1 className="text-2xl font-black mb-3">حدث خطأ تقني</h1>
        <p className="text-sm mb-6 opacity-70 max-w-md break-all font-mono" style={{ color: 'var(--text-secondary)' }}>
          {String(this.state.error?.message || 'خطأ غير معروف')}
        </p>
        <div className="flex gap-3 flex-wrap justify-center">
          <button onClick={() => window.location.reload()} className="btn btn-primary"><RefreshCcw size={18} /> إعادة المحاولة</button>
          <button onClick={this.safeReset} className="btn btn-secondary"><RotateCcw size={18} /> إعادة تعيين آمنة</button>
        </div>
        <p className="text-[10px] mt-4" style={{ color: 'var(--text-muted)' }}>⚠️ "إعادة تعيين آمنة" تحفظ رمز الدخول والإعدادات</p>
      </div>
    );
    return this.props.children;
  }
}

const showInputModal = (opts) => new Promise((resolve) => {
  const id = ++_modalIdCounter;
  _modalResolvers.set(id, resolve);
  window.dispatchEvent(new CustomEvent('show-input-modal', { detail: { ...opts, _id: id } }));
});
const showConfirmModal = (opts) => new Promise((resolve) => {
  const id = ++_modalIdCounter;
  _modalResolvers.set(id, resolve);
  window.dispatchEvent(new CustomEvent('show-confirm-modal', { detail: { ...opts, _id: id } }));
});
const resolveModal = (id, value) => {
  const resolve = _modalResolvers.get(id);
  if (resolve) { _modalResolvers.delete(id); resolve(value); }
};

const PromiseModalProvider = ({ children }) => {
  const [stack, setStack] = useState([]);
  const [inputValues, setInputValues] = useState({});

  useEffect(() => {
    const handleInput = (e) => setStack(s => [...s, { kind: 'input', ...e.detail }]);
    const handleConfirm = (e) => setStack(s => [...s, { kind: 'confirm', ...e.detail }]);
    window.addEventListener('show-input-modal', handleInput);
    window.addEventListener('show-confirm-modal', handleConfirm);
    return () => {
      window.removeEventListener('show-input-modal', handleInput);
      window.removeEventListener('show-confirm-modal', handleConfirm);
    };
  }, []);

  const current = stack[stack.length - 1];
  const dismiss = useCallback((value) => {
    if (!current) return;
    const id = current._id;
    setStack(s => s.slice(0, -1));
    resolveModal(id, value);
    setInputValues(prev => { if (!(id in prev)) return prev; const next = { ...prev }; delete next[id]; return next; });
  }, [current]);

  const inputValue = current?._id !== undefined ? (inputValues[current._id] ?? current.inputValue ?? '') : '';
  const setInputValue = useCallback((v) => {
    if (current?._id === undefined) return;
    setInputValues(prev => ({ ...prev, [current._id]: v }));
  }, [current?._id]);

  return (
    <React.Fragment>
      {children}
      {current?.kind === 'input' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-md animate-scaleIn">
            <div className="generic-modal-header">
              <h3 className="text-base font-black flex items-center gap-2">
                <span>{current.icon || '💬'}</span>{current.title}
              </h3>
              <button onClick={() => dismiss(null)} className="btn btn-ghost p-1.5"><X size={16} /></button>
            </div>
            <div className="generic-modal-body">
              {current.message && <p className="text-sm mb-3 whitespace-pre-line leading-relaxed" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>}
              <input autoFocus type="text"
                inputMode={current.numeric ? 'decimal' : 'text'}
                className="input-field input-num text-2xl text-center py-4"
                style={{ color: 'var(--accent)' }}
                value={inputValue}
                onChange={e => setInputValue(current.numeric ? e.target.value.replace(/[^\d.\-]/g, '') : e.target.value)}
                onKeyDown={e => {
                  if (e.key === 'Enter') {
                    const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim();
                    dismiss(v);
                  }
                }}
                placeholder={current.placeholder || ''} />
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => dismiss(null)} className="btn btn-secondary flex-1">إلغاء</button>
              <button onClick={() => { const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim(); dismiss(v); }} className="btn btn-primary flex-1">
                {current.confirmText || 'تأكيد'}
              </button>
            </div>
          </div>
        </div>
      )}
      {current?.kind === 'confirm' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-sm animate-scaleIn">
            <div className="generic-modal-body text-center">
              <div className={`w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center text-3xl ${current.danger ? 'bg-red-50 dark:bg-red-950/40' : 'bg-blue-50 dark:bg-blue-950/40'}`}>
                {current.icon || (current.danger ? '⚠️' : '❓')}
              </div>
              <h3 className="text-base font-black mb-2">{current.title}</h3>
              <p className="text-sm leading-relaxed mb-2 whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => dismiss(false)} className="btn btn-secondary flex-1">إلغاء</button>
              <button onClick={() => dismiss(true)} className="btn flex-1" style={{ background: current.danger ? 'var(--danger)' : 'var(--accent)', color: 'white' }}>
                {current.confirmText || 'تأكيد'}
              </button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
};

/* ═══════════════ DATA REDUCER V87.6 ═══════════════ */
function dataReducer(state, action) {
  switch (action.type) {

    case 'SET_DATA': {
      const incoming = { ...action.payload };
      if (Array.isArray(incoming.transactions)) {
        incoming.transactions = incoming.transactions.map(t =>
          t ? { ...t, category: normalizeCategory(t.category) } : t
        );
      }
      if (!Array.isArray(incoming.deletedTxIds)) incoming.deletedTxIds = [...(state.data.deletedTxIds || [])];
      if (!Array.isArray(incoming.deletedDefaultIds)) incoming.deletedDefaultIds = [...(state.data.deletedDefaultIds || [])];
      if (!Array.isArray(incoming.reconciliations)) incoming.reconciliations = [...(state.data.reconciliations || [])];
      if (!Array.isArray(incoming.auditLog)) incoming.auditLog = [...(state.data.auditLog || [])];
      if (!Array.isArray(incoming.transactions)) incoming.transactions = [];
      incoming.transactions = sortTransactions(incoming.transactions);
      incoming.hanyPayableCache = computeHanyPayable(incoming);
      return { ...state, data: incoming };
    }

    case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
    case 'SET_SELECTED_YEAR': return {
      ...state, selectedYear: action.payload,
      selectedMonth: getMonthsForYear(action.payload).includes(state.selectedMonth)
        ? state.selectedMonth : getMonthsForYear(action.payload)[0]
    };
    case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
    case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
    case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
    case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
    case 'SET_FORM_DATA': return { ...state, formData: action.payload };
    case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
    case 'SET_FORM_ERRORS': return { ...state, formErrors: action.payload };
    case 'SET_ACTIVE_CATEGORY_DETAIL': return { ...state, activeCategoryDetail: action.payload };
    case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
    case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
    case 'SET_BUDGETS': return { ...state, budgets: action.payload };
    case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
    case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
    case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
    case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
    case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
    case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
    case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
    case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
    case 'SET_PIN_CHANGE_OPEN': return { ...state, isPinChangeOpen: action.payload };
    case 'SET_SMS_MODAL_OPEN': return { ...state, isSmsModalOpen: action.payload };
    case 'SET_PENDING_CLOSE_MODAL': return { ...state, pendingCloseModal: action.payload };
    case 'SET_SIDEBAR_OPEN': return { ...state, isSidebarOpen: action.payload };
    case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
    case 'SET_QUICK_TRANSFER_DATA': return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
    case 'SET_VIEWING_CARD_STATEMENT': return { ...state, viewingCardStatement: action.payload };
    case 'SET_RECONCILIATION_MODAL': return { ...state, reconciliationModal: action.payload };
    case 'SET_CARD_PAYMENT_MODAL': return { ...state, cardPaymentModal: action.payload };
    case 'SET_HANY_SETTLE_MODAL': return { ...state, hanySettleModal: action.payload };
    case 'SET_IS_PROCESSING': return { ...state, isProcessing: action.payload };
    case 'SET_STATUS_FILTER': return { ...state, statusFilter: action.payload };
    case 'SET_FORCE_SAVE_STATE': return { ...state, forceSaveState: action.payload };
    case 'SET_PRINT_MODAL': return { ...state, printModal: action.payload };

    case 'TOGGLE_LEDGER': return {
      ...state, expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] }
    };
    case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };

    case 'ADD_NOTIFICATION': return {
      ...state, notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }]
    };
    case 'REMOVE_NOTIFICATION': return {
      ...state, notifications: state.notifications.filter(n => n.id !== action.payload)
    };

    case 'UPDATE_TRANSACTIONS': {
      const oldTxs = state.data.transactions || [];
      const newTxs = sortTransactions(action.payload || []);
      const oldMap = new Map(oldTxs.map(t => [t.id, t]));
      const newMap = new Map(newTxs.map(t => [t.id, t]));
      const auditEntries = [];

      newTxs.forEach(t => {
        const old = oldMap.get(t.id);
        if (!old) {
          auditEntries.push(buildAuditEntry(AUDIT.CREATE, 'transaction', t.id, {
            after: { amount: t.amount, category: t.category, method: t.method, status: t.status },
            note: `إنشاء: ${t.description || t.category} — ${fmt(t.amount)} ج.م`
          }));
        } else if (JSON.stringify(old) !== JSON.stringify(t)) {
          const changes = [];
          if (old.status !== t.status) changes.push(`الحالة: ${old.status} → ${t.status}`);
          if (safeNumber(old.amount) !== safeNumber(t.amount)) changes.push(`المبلغ: ${fmt(old.amount)} → ${fmt(t.amount)}`);
          if (old.category !== t.category) changes.push(`الفئة: ${old.category} → ${t.category}`);
          if (changes.length > 0) {
            auditEntries.push(buildAuditEntry(AUDIT.UPDATE, 'transaction', t.id, {
              before: { status: old.status, amount: old.amount, category: old.category },
              after: { status: t.status, amount: t.amount, category: t.category },
              note: `تعديل: ${changes.join(' • ')}`
            }));
          }
        }
      });

      oldTxs.forEach(t => {
        if (!newMap.has(t.id)) {
          auditEntries.push(buildAuditEntry(AUDIT.DELETE, 'transaction', t.id, {
            before: { amount: t.amount, category: t.category, method: t.method },
            note: `حذف: ${t.description || t.category} — ${fmt(t.amount)} ج.م`
          }));
        }
      });

      const auditLog = [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000);
      const hanyPayableCache = computeHanyPayable({ ...state.data, transactions: newTxs });
      return { ...state, data: { ...state.data, transactions: newTxs, auditLog, hanyPayableCache } };
    }

    case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
    case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
    case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
    case 'UPDATE_CASHBACK_TRACKERS': return { ...state, data: { ...state.data, cashbackTrackers: action.payload } };
    case 'UPDATE_MONTHLY_PLANS': return { ...state, data: { ...state.data, monthlyPlans: action.payload } };

    case 'UPDATE_ACCOUNTS': {
      const oldA = state.data.accountsData || {};
      const newA = action.payload || {};
      let earliestAffected = null;

      ACCOUNT_KEYS.forEach(k => {
        const oldInit = safeNumber(oldA[k]?.initialBalance);
        const newInit = safeNumber(newA[k]?.initialBalance);
        const oldDate = oldA[k]?.initialDate;
        const newDate = newA[k]?.initialDate;
        if (oldInit !== newInit || oldDate !== newDate) {
          const ref = newDate || oldDate;
          if (ref) {
            const d = parseISODate(ref);
            if (d) {
              const y = d.getFullYear();
              const mIdx = d.getMonth();
              const mName = ALL_MONTHS[mIdx];
              if (!earliestAffected) earliestAffected = { year: y, month: mName };
              else {
                const curIdx = getMonthIndex(earliestAffected.month);
                if (y < earliestAffected.year || (y === earliestAffected.year && mIdx < curIdx))
                  earliestAffected = { year: y, month: mName };
              }
            }
          }
        }
      });

      let newSnapshots = state.data.monthlySnapshots || {};
      if (earliestAffected) {
        const { snapshots } = invalidateSnapshotsFrom(newSnapshots, earliestAffected.year, earliestAffected.month);
        newSnapshots = snapshots;
      }

      const auditEntries = [];
      ACCOUNT_KEYS.forEach(k => {
        const oldInit = safeNumber(oldA[k]?.initialBalance);
        const newInit = safeNumber(newA[k]?.initialBalance);
        if (oldInit !== newInit) {
          auditEntries.push(buildAuditEntry(AUDIT.UPDATE, 'account', k, {
            before: { initialBalance: oldInit }, after: { initialBalance: newInit },
            note: `${ACCOUNT_SHORT_NAMES[k]}: رصيد افتتاحي ${fmt(oldInit)} → ${fmt(newInit)}`
          }));
        }
      });

      return {
        ...state,
        data: {
          ...state.data, accountsData: newA, monthlySnapshots: newSnapshots,
          auditLog: [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000)
        }
      };
    }

    case 'ADD_TO_HISTORY': {
      const limited = [...state.history].slice(-19);
      return { ...state, history: [...limited, action.payload], future: [] };
    }
    case 'UNDO': {
      if (state.history.length === 0) return state;
      const prev = state.history[state.history.length - 1];
      return {
        ...state, data: prev.data || prev,
        budgets: prev.budgets !== undefined ? prev.budgets : state.budgets,
        history: state.history.slice(0, -1),
        future: [{ data: state.data, budgets: state.budgets }, ...state.future]
      };
    }
    case 'REDO': {
      if (state.future.length === 0) return state;
      const next = state.future[0];
      return {
        ...state, data: next.data, budgets: next.budgets,
        future: state.future.slice(1),
        history: [...state.history, { data: state.data, budgets: state.budgets }]
      };
    }

    case 'SHOW_CONFIRM': return {
      ...state,
      confirmDialog: {
        isOpen: true, title: action.title, message: action.message,
        onConfirm: action.onConfirm, onCancel: action.onCancel, danger: action.danger || false
      }
    };
    case 'HIDE_CONFIRM': return {
      ...state,
      confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false }
    };

    case 'CARD_PAYMENT': {
      const { cardId, amount, sourceMethod, date, note, withFee, feeAmount } = action.payload;

      const d = parseISODate(date);
      if (!d) return state;
      const txYear = d.getFullYear();
      const txMonth = ALL_MONTHS[d.getMonth()];
      if (isMonthClosed(state.data, txYear, txMonth)) return state;

      const card = (state.data.cards || []).find(c => c.id === cardId);
      if (!card) return state;

      if (CREDIT_CARD_METHOD_IDS.includes(sourceMethod)) return state;

      const balances = computeBalancesAsOf(state.data);
      const sourceBalance = safeNumber(balances[sourceMethod]);
      const totalDebit = safeNumber(amount) + (withFee ? safeNumber(feeAmount) : 0);
      if (sourceBalance < totalDebit - 0.005) return state;

      const paymentId = getSafeId();
      const paymentTx = {
        id: paymentId,
        type: 'expense',
        kind: KIND.FINANCIAL,
        category: 'الالتزامات البنكية والتمويلية',
        amount: roundMoney(safeNumber(amount)),
        description: note || `سداد بطاقة ${card.bank} - ${card.name}`,
        method: sourceMethod,
        date,
        month: txMonth,
        year: txYear,
        monthIndex: d.getMonth(),
        subType: 'withdrawal',
        status: 'paid',
        source: 'card-payment-plan',
        linkedCardId: card.id,
        cardLast4: card.last4,
        createdAt: new Date().toISOString()
      };

      const newTxs = [paymentTx];

      if (withFee && safeNumber(feeAmount) > 0) {
        newTxs.push({
          id: getSafeId(),
          type: 'expense',
          kind: KIND.FINANCIAL,
          category: 'رسوم بنكية شهرية',
          amount: roundMoney(safeNumber(feeAmount)),
          description: `رسوم سداد بطاقة ${card.bank} - ${card.name}`,
          method: sourceMethod,
          date,
          month: txMonth,
          year: txYear,
          monthIndex: d.getMonth(),
          subType: 'withdrawal',
          status: 'paid',
          source: 'card-payment-plan',
          linkedCardId: card.id,
          linkedPaymentId: paymentId,
          createdAt: new Date().toISOString()
        });
      }

      const allTxs = sortTransactions([...newTxs, ...(state.data.transactions || [])]);
      const auditEntries = [
        buildAuditEntry(AUDIT.UPDATE, 'card', card.id, {
          before: { debt: computeCardDebt(state.data, card) },
          after: { debt: computeCardDebt({ ...state.data, transactions: allTxs }, card) },
          note: `سداد بطاقة: ${fmt(amount)} ج.م من ${ACCOUNT_SHORT_NAMES[sourceMethod] || sourceMethod}`
        })
      ];

      return {
        ...state,
        data: {
          ...state.data,
          transactions: allTxs,
          auditLog: [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000),
          hanyPayableCache: computeHanyPayable({ ...state.data, transactions: allTxs })
        }
      };
    }

    case 'HANY_SETTLE': {
      const { amount, sourceMethod, date, note, linkedHanyMonth } = action.payload;

      const d = parseISODate(date);
      if (!d) return state;
      const txYear = d.getFullYear();
      const txMonth = ALL_MONTHS[d.getMonth()];
      if (isMonthClosed(state.data, txYear, txMonth)) return state;

      if (!HANY_SETTLE_ALLOWED_METHODS.includes(sourceMethod)) return state;

      const balances = computeBalancesAsOf(state.data);
      const sourceBalance = safeNumber(balances[sourceMethod]);
      if (sourceBalance < safeNumber(amount) - 0.005) return state;

      const currentPayable = computeHanyPayable(state.data);
      if (safeNumber(amount) > currentPayable + 0.005) return state;

      const settleTx = {
        id: getSafeId(),
        type: 'expense',
        kind: KIND.FINANCIAL,
        category: HANY_SETTLE_CATEGORY,
        amount: roundMoney(safeNumber(amount)),
        description: note || `سداد دفتر هاني${linkedHanyMonth ? ` - ${linkedHanyMonth}` : ''}`,
        method: sourceMethod,
        date,
        month: txMonth,
        year: txYear,
        monthIndex: d.getMonth(),
        subType: 'withdrawal',
        status: 'paid',
        source: 'hany-settle',
        hanyEffect: 'settle',
        affectsCash: true,
        linkedHanyMonth: linkedHanyMonth || null,
        createdAt: new Date().toISOString()
      };

      const allTxs = sortTransactions([settleTx, ...(state.data.transactions || [])]);
      const auditEntries = [
        buildAuditEntry(AUDIT.HANY_SETTLE, 'hany', settleTx.id, {
          before: { payable: currentPayable },
          after: { payable: computeHanyPayable({ ...state.data, transactions: allTxs }) },
          note: `سداد هاني: ${fmt(amount)} ج.م من ${ACCOUNT_SHORT_NAMES[sourceMethod] || sourceMethod}`
        })
      ];

      return {
        ...state,
        data: {
          ...state.data,
          transactions: allTxs,
          auditLog: [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000),
          hanyPayableCache: computeHanyPayable({ ...state.data, transactions: allTxs })
        }
      };
    }

    case 'EXTERNAL_TRANSFER': {
      const { fromMethod, amount, recipientName, date, note, withFee, feeAmount } = action.payload;

      const d = parseISODate(date);
      if (!d) return state;
      const txYear = d.getFullYear();
      const txMonth = ALL_MONTHS[d.getMonth()];
      if (isMonthClosed(state.data, txYear, txMonth)) return state;

      const balances = computeBalancesAsOf(state.data);
      const sourceBalance = safeNumber(balances[fromMethod]);
      const totalDebit = safeNumber(amount) + (withFee ? safeNumber(feeAmount) : 0);
      if (sourceBalance < totalDebit - 0.005) return state;

      const transferId = getSafeId();
      const newTxs = [
        {
          id: getSafeId(),
          type: 'expense',
          kind: KIND.FINANCIAL,
          category: 'تحويلات',
          amount: roundMoney(safeNumber(amount)),
          description: note || `تحويل إلى ${recipientName}`,
          method: fromMethod,
          date,
          month: txMonth,
          year: txYear,
          monthIndex: d.getMonth(),
          subType: 'withdrawal',
          status: 'paid',
          source: 'external-transfer',
          linkedTransferId: transferId,
          transferDirection: 'out',
          recipientName,
          createdAt: new Date().toISOString()
        }
      ];

      if (withFee && safeNumber(feeAmount) > 0) {
        newTxs.push({
          id: getSafeId(),
          type: 'expense',
          kind: KIND.FINANCIAL,
          category: 'رسوم تحويلات',
          amount: roundMoney(safeNumber(feeAmount)),
          description: `رسوم تحويل إلى ${recipientName}`,
          method: fromMethod,
          date,
          month: txMonth,
          year: txYear,
          monthIndex: d.getMonth(),
          subType: 'withdrawal',
          status: 'paid',
          source: 'external-transfer',
          linkedTransferId: transferId,
          transferDirection: 'fee',
          recipientName,
          createdAt: new Date().toISOString()
        });
      }

      const allTxs = sortTransactions([...newTxs, ...(state.data.transactions || [])]);
      const auditEntries = [
        buildAuditEntry(AUDIT.TRANSFER, 'external', transferId, {
          after: { amount, recipient: recipientName, source: fromMethod },
          note: `تحويل للغير: ${fmt(amount)} ج.م إلى ${recipientName}`
        })
      ];

      return {
        ...state,
        data: {
          ...state.data,
          transactions: allTxs,
          auditLog: [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000),
          hanyPayableCache: computeHanyPayable({ ...state.data, transactions: allTxs })
        }
      };
    }

    case 'CLOSE_MONTH': {
      const { year, month } = action.payload;
      const monthKey = makeMonthKey(year, month);
      const monthIdx = getMonthIndex(month);
      const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
      const snap = computeBalancesAsOf(state.data, monthEnd);
      const cardDebts = {};
      (state.data.cards || []).forEach(c => { cardDebts[c.id] = computeCardDebt(state.data, c, monthEnd); });
      const hanyPayable = computeHanyPayable(state.data, monthEnd);

      const marker = createHanyCarryoverMarker(state.data, year, month, hanyPayable);
      const newTxs = marker ? sortTransactions([...(state.data.transactions || []), marker]) : (state.data.transactions || []);

      const fullSnap = {
        ...snap, __v: CURRENT_ENGINE_VERSION,
        __cardDebts: cardDebts, __hanyPayable: hanyPayable,
        __closedAt: new Date().toISOString()
      };

      const cleanedSnapshots = { ...(state.data.monthlySnapshots || {}) };
      Object.keys(cleanedSnapshots).forEach(k => {
        const parsed = parseMonthKey(k);
        if (!parsed) return;
        if (parsed.year > year || (parsed.year === year && getMonthIndex(parsed.month) > monthIdx))
          delete cleanedSnapshots[k];
      });

      const auditEntries = [
        buildAuditEntry(AUDIT.CLOSE_MONTH, 'month', monthKey, { note: `إقفال شهر ${month} ${year}` })
      ];
      if (marker) {
        auditEntries.unshift(buildAuditEntry(AUDIT.CARRYOVER, 'hany', marker.id, {
          after: { amount: marker.amount },
          note: `ترحيل رصيد هاني: ${fmt(marker.amount)} ج.م`
        }));
      }

      return {
        ...state,
        data: {
          ...state.data,
          transactions: newTxs,
          closedMonths: Array.from(new Set([...(state.data.closedMonths || []), monthKey])),
          monthlySnapshots: { ...cleanedSnapshots, [monthKey]: fullSnap },
          hanyPayableCache: computeHanyPayable({ ...state.data, transactions: newTxs }),
          auditLog: [...auditEntries, ...(state.data.auditLog || [])].slice(0, 1000)
        }
      };
    }

    case 'CLOSE_MONTH_AFTER_RESOLVE': {
      const { year, month, resolveAction, pendingIds } = action.payload;
      const monthKey = makeMonthKey(year, month);
      let newTxs = state.data.transactions || [];
      let notes = [];

      if (resolveAction === 'approve') {
        const ids = new Set(pendingIds);
        newTxs = newTxs.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t);
        notes.push(`اعتماد ${pendingIds.length} قيد معلق`);
      }
      else if (resolveAction === 'carry') {
        const idx = getMonthIndex(month);
        const nextMonth = idx === 11 ? ALL_MONTHS[0] : ALL_MONTHS[idx + 1];
        const nextYear = idx === 11 ? year + 1 : year;
        const nextMonthIdx = getMonthIndex(nextMonth);
        const maxDay = new Date(nextYear, nextMonthIdx + 1, 0).getDate();
        const ids = new Set(pendingIds);
        const nextMonthKey = makeMonthKey(nextYear, nextMonth);
        const nextClosed = (state.data.closedMonths || []).includes(nextMonthKey);
        if (nextClosed) { notes.push(`⚠️ فشل الترحيل: شهر ${nextMonth} ${nextYear} مغلق`); }
        else {
          let autoApproved = 0;
          newTxs = newTxs.map(t => {
            if (!ids.has(t.id)) return t;
            const carryCount = (t.carryCount || 0) + 1;
            if (carryCount > 3) { autoApproved++; return { ...t, status: 'paid', carryCount, __forceApproved: true }; }
            const oldD = parseISODate(t.date);
            const oldDay = oldD ? oldD.getDate() : 1;
            const newDay = Math.min(Math.max(1, oldDay), maxDay);
            const newDate = `${nextYear}-${String(nextMonthIdx + 1).padStart(2, '0')}-${String(newDay).padStart(2, '0')}`;
            return {
              ...t, date: newDate, month: nextMonth, year: nextYear, monthIndex: nextMonthIdx,
              source: 'carryover', carriedFromSource: t.source,
              carryoverFrom: `${month} ${year}`, carryCount, status: 'pending'
            };
          });
          notes.push(`ترحيل ${pendingIds.length - autoApproved} قيد لشهر ${nextMonth}`);
          if (autoApproved > 0) notes.push(`اعتماد تلقائي لـ ${autoApproved} قيد (تجاوز 3 مرات)`);
        }
      }

      newTxs = sortTransactions(newTxs);
      const newData = { ...state.data, transactions: newTxs };
      const monthEnd = new Date(year, getMonthIndex(month) + 1, 0, 23, 59, 59);
      const snap = computeBalancesAsOf(newData, monthEnd);
      const cardDebts = {};
      (newData.cards || []).forEach(c => { cardDebts[c.id] = computeCardDebt(newData, c, monthEnd); });
      const hanyPayable = computeHanyPayable(newData, monthEnd);

      const marker = createHanyCarryoverMarker(newData, year, month, hanyPayable);
      const finalTxs = marker ? sortTransactions([...newTxs, marker]) : newTxs;

      const fullSnap = {
        ...snap, __v: CURRENT_ENGINE_VERSION,
        __cardDebts: cardDebts, __hanyPayable: hanyPayable,
        __closedAt: new Date().toISOString()
      };

      const auditEntries = [
        buildAuditEntry(AUDIT.CLOSE_MONTH, 'month', monthKey, { note: notes.join(' • ') })
      ];
      if (marker) {
        auditEntries.unshift(buildAuditEntry(AUDIT.CARRYOVER, 'hany', marker.id, {
          after: { amount: marker.amount },
          note: `ترحيل رصيد هاني: ${fmt(marker.amount)} ج.م`
        }));
      }

      return {
        ...state,
        data: {
          ...newData,
          transactions: finalTxs,
          closedMonths: Array.from(new Set([...(newData.closedMonths || []), monthKey])),
          monthlySnapshots: { ...(newData.monthlySnapshots || {}), [monthKey]: fullSnap },
          hanyPayableCache: computeHanyPayable({ ...newData, transactions: finalTxs }),
          auditLog: [...auditEntries, ...(newData.auditLog || [])].slice(0, 1000)
        },
        pendingCloseModal: { isOpen: false, pending: [], total: 0, month: '', year: 0 }
      };
    }

    case 'OPEN_MONTH': {
      const monthKey = action.payload;
      const parsedKey = parseMonthKey(monthKey);
      if (!parsedKey) return { ...state, data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey) } };

      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots, parsedKey.year, parsedKey.month);
      const cleanedTxs = cleanupHanyMarkersFrom(state.data.transactions || [], parsedKey.year, parsedKey.month);

      return {
        ...state,
        data: {
          ...state.data,
          transactions: cleanedTxs,
          closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey),
          monthlySnapshots: snapshots,
          hanyPayableCache: computeHanyPayable({ ...state.data, transactions: cleanedTxs }),
          auditLog: [
            buildAuditEntry(AUDIT.OPEN_MONTH, 'month', monthKey, { note: `فتح شهر ${parsedKey.month} ${parsedKey.year} + حذف markers الترحيل` }),
            ...(state.data.auditLog || [])
          ].slice(0, 1000)
        }
      };
    }

    case 'RECONCILE_ACCOUNT': {
      const { accountKey, actualBalance, diff, note, month, year, computedBalance } = action.payload;
      const now = new Date();
      const txMonth = month || ALL_MONTHS[now.getMonth()];
      const txYear = year || now.getFullYear();
      const txMonthIdx = getMonthIndex(txMonth);

      if (isMonthClosed(state.data, txYear, txMonth)) return state;

      if (Math.abs(diff) < 0.01) {
        return {
          ...state,
          data: {
            ...state.data,
            auditLog: [
              buildAuditEntry(AUDIT.RECONCILE, 'account', accountKey, {
                before: { balance: computedBalance }, after: { balance: actualBalance },
                note: `مطابقة ${ACCOUNT_SHORT_NAMES[accountKey]}: مطابق تماماً`
              }),
              ...(state.data.auditLog || [])
            ].slice(0, 1000)
          }
        };
      }

      const reconciliationId = getSafeId();
      const settlementTx = {
        id: getSafeId(),
        type: diff > 0 ? 'income' : 'expense',
        kind: KIND.ADJUSTMENT,
        category: 'تسوية رصيد',
        amount: roundMoney(Math.abs(diff)),
        description: note || `تسوية مطابقة ${ACCOUNT_SHORT_NAMES[accountKey] || accountKey}`,
        method: accountKey,
        date: getLocalISODate(now),
        month: txMonth, year: txYear, monthIndex: txMonthIdx,
        subType: diff > 0 ? 'deposit' : 'withdrawal',
        status: 'paid', source: 'reconciliation',
        linkedReconciliationId: reconciliationId,
        createdAt: now.toISOString()
      };

      const newTxs = sortTransactions([settlementTx, ...(state.data.transactions || [])]);

      const reconciliation = {
        id: reconciliationId, accountKey, date: getLocalISODate(now),
        computedBalance, actualBalance, diff,
        note: note || '', txId: settlementTx.id, createdAt: now.toISOString()
      };
      const newReconciliations = [reconciliation, ...(state.data.reconciliations || [])].slice(-200);
      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots || {}, txYear, txMonth);

      return {
        ...state,
        data: {
          ...state.data, transactions: newTxs, reconciliations: newReconciliations,
          monthlySnapshots: snapshots,
          hanyPayableCache: computeHanyPayable({ ...state.data, transactions: newTxs }),
          auditLog: [
            buildAuditEntry(AUDIT.RECONCILE, 'account', accountKey, {
              before: { balance: computedBalance }, after: { balance: actualBalance },
              note: `مطابقة ${ACCOUNT_SHORT_NAMES[accountKey]}: الفرق ${fmt(diff)} ج.م`
            }),
            ...(state.data.auditLog || [])
          ].slice(0, 1000)
        }
      };
    }

    case 'TOGGLE_WALLET_VISIBILITY': return {
      ...state,
      walletVisibility: { ...state.walletVisibility, [action.payload]: !state.walletVisibility[action.payload] }
    };

    case 'CLEAR_AUDIT_LOG': return { ...state, data: { ...state.data, auditLog: [] } };

    default: return state;
  }
}

/* ═══════════════ FORCE SAVE HOOK ═══════════════ */
const FORCE_SAVE_STATES = { IDLE: 'idle', SAVING: 'saving', SUCCESS: 'success', ERROR: 'error' };

const buildCloudPayload = (data, budgets) => ({
  ...data,
  budgets: budgets || {},
  __lastClientSync: new Date().toISOString(),
  __client: 'web-v87.6',
  __hanyPayable: computeHanyPayable(data),
  __netWorth: computeNetWorth(data).netWorth
});

const useForceSave = ({ isAuthenticated, data, budgets, addNotification, dbRef }) => {
  const [state, setState] = useState(FORCE_SAVE_STATES.IDLE);
  const [lastSaveAt, setLastSaveAt] = useState(null);
  const [lastError, setLastError] = useState(null);
  const busyRef = useRef(false);

  const dataRef = useRef(data);
  const budgetsRef = useRef(budgets);
  useEffect(() => { dataRef.current = data; }, [data]);
  useEffect(() => { budgetsRef.current = budgets; }, [budgets]);

  const forceSave = useCallback(async ({ silent = false } = {}) => {
    if (!isAuthenticated) {
      if (!silent) addNotification({ type: 'error', title: 'غير مصرح', message: 'يجب تسجيل الدخول' });
      setState(FORCE_SAVE_STATES.ERROR); setLastError('not_authenticated'); return false;
    }
    const currentData = dataRef.current;
    if (!currentData) {
      if (!silent) addNotification({ type: 'error', title: 'لا توجد بيانات' });
      setState(FORCE_SAVE_STATES.ERROR); return false;
    }
    if (busyRef.current) {
      if (!silent) addNotification({ type: 'info', title: 'العملية جارية بالفعل' });
      return false;
    }

    busyRef.current = true;
    setState(FORCE_SAVE_STATES.SAVING);
    setLastError(null);
    if (!silent) addNotification({ type: 'info', title: 'جاري الرفع للسحابة...', duration: 2000 });

    const maxAttempts = 3;
    let lastErr = null;
    let succeeded = false;

    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        const payload = buildCloudPayload(currentData, budgetsRef.current);
        await dbRef.set(payload, { merge: false });
        try { localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now())); } catch (e) {}
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(currentData)); } catch (e) {}
        succeeded = true;
        break;
      } catch (err) {
        lastErr = err;
        console.error(`Force save attempt ${attempt}/${maxAttempts} failed:`, err);
        if (attempt < maxAttempts) {
          await new Promise(r => setTimeout(r, 2000 * attempt));
        }
      }
    }

    busyRef.current = false;

    if (succeeded) {
      setState(FORCE_SAVE_STATES.SUCCESS);
      setLastSaveAt(Date.now());
      if (!silent) {
        addNotification({
          type: 'success', title: '✅ تم الرفع للسحابة',
          message: `آخر مزامنة: ${new Date().toLocaleTimeString('ar-EG')}`, duration: 4000
        });
      }
      setTimeout(() => setState(FORCE_SAVE_STATES.IDLE), 3000);
      return true;
    } else {
      setState(FORCE_SAVE_STATES.ERROR);
      setLastError(lastErr?.message || 'خطأ غير معروف');
      if (!silent) {
        addNotification({
          type: 'error', title: `❌ فشل الرفع بعد ${maxAttempts} محاولات`,
          message: lastErr?.message || 'تحقق من الاتصال', duration: 8000
        });
      }
      setTimeout(() => setState(FORCE_SAVE_STATES.IDLE), 5000);
      return false;
    }
  }, [isAuthenticated, addNotification, dbRef]);

  return { forceSave, state, lastSaveAt, lastError };
};

/* ═══════════════ DATA INTEGRITY ═══════════════ */
const checkDataIntegrity = (data, transactions, cards, updatedLoans, liveBalances) => {
  const issues = [];
  const now = Date.now();
  const dayMs = 24 * 60 * 60 * 1000;

  const oldPending = transactions.filter(t => {
    if (t.status === 'paid') return false;
    if (isCarryoverMarker(t)) return false;
    const d = parseISODate(t.date);
    return d && (now - d.getTime()) > 30 * dayMs;
  });
  if (oldPending.length > 0) {
    issues.push({ severity: 'warning', title: `${oldPending.length} معاملة معلقة قديمة (+30 يوم)`, description: 'يفضل اعتمادها أو ترحيلها', action: 'transactions' });
  }

  const multiCarried = transactions.filter(t => (t.carryCount || 0) >= 2);
  if (multiCarried.length > 0) {
    issues.push({ severity: 'warning', title: `${multiCarried.length} قيد مرحّل أكثر من مرتين`, description: 'يجب معالجتها قبل أن تتكرر للأبد' });
  }

  const orphans = findOrphanTransfers(transactions);
  if (orphans.length > 0) {
    issues.push({ severity: 'danger', title: `${orphans.length} تحويل يتيم`, description: 'قيد واحد فقط موجود من تحويل مزدوج' });
  }

  const staleAccounts = ACCOUNT_KEYS.filter(k => {
    const lastUpd = data.accountsData?.[k]?.initialDate || data.accountsData?.[k]?.lastUpdated;
    if (!lastUpd) return true;
    const d = parseISODate(lastUpd);
    return d && (now - d.getTime()) > 30 * dayMs;
  });
  if (staleAccounts.length > 0) {
    issues.push({ severity: 'info', title: `${staleAccounts.length} حساب لم يُحدّث من 30+ يوم`, description: staleAccounts.map(k => ACCOUNT_SHORT_NAMES[k]).join('، ') });
  }

  const overusedCards = cards.filter(c => {
    const debt = computeCardDebt(data, c);
    const limit = safeNumber(c.limit);
    return limit > 0 && debt / limit > 0.8;
  });
  if (overusedCards.length > 0) {
    issues.push({ severity: 'warning', title: `${overusedCards.length} بطاقة استُخدمت أكثر من 80%`, description: overusedCards.map(c => `${c.bank} ${c.name}`).join('، ') });
  }

  const negativeAccounts = ACCOUNT_KEYS.filter(k => safeNumber(liveBalances[k]) < 0);
  if (negativeAccounts.length > 0) {
    issues.push({ severity: 'danger', title: `${negativeAccounts.length} حساب برصيد سالب`, description: negativeAccounts.map(k => ACCOUNT_SHORT_NAMES[k]).join('، ') });
  }

  const orphanReconciliations = (data.reconciliations || []).filter(rec => {
    if (!rec.txId) return false;
    return !transactions.some(t => t.id === rec.txId);
  });
  if (orphanReconciliations.length > 0) {
    issues.push({ severity: 'warning', title: `${orphanReconciliations.length} تسوية بدون قيد`, description: 'قد تكون تمّت إزالتها يدوياً' });
  }

  const penalties = { danger: 25, warning: 10, info: 3 };
  const totalPenalty = issues.reduce((s, i) => s + (penalties[i.severity] || 0), 0);
  const score = Math.max(0, 100 - totalPenalty);

  return { issues, score };
};

const applyMaterialization = (data, asOfDateStr) => {
  const updated = materializeRecurringItems(data, asOfDateStr);
  if (!updated) return null;
  const permanentDeleted = new Set(data.deletedTxIds || []);
  const filteredTx = updated.transactions.filter(t => !permanentDeleted.has(t.id));
  if (filteredTx.length !== updated.transactions.length) return { ...updated, transactions: filteredTx };
  return updated;
};

const AnimatedNumber = memo(({ value, duration = 600, decimals = 2, prefix = '', suffix = '', className = '' }) => {
  const [display, setDisplay] = useState(0);
  const rafRef = useRef(null);
  const startRef = useRef(null);
  const startValRef = useRef(0);

  useEffect(() => {
    const target = safeNumber(value);
    const startVal = display;
    startValRef.current = startVal;
    const diff = target - startVal;
    if (Math.abs(diff) < 0.005) { setDisplay(target); return; }
    startRef.current = performance.now();
    const animate = (now) => {
      const elapsed = now - startRef.current;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setDisplay(startValRef.current + diff * eased);
      if (progress < 1) rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [value, duration]);

  return (
    <span className={`money ${className}`}>
      {prefix}{display.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}{suffix}
    </span>
  );
});

});

  const Icon = icons[notification.type] || Bell;
  return (
    <div className={`toast toast-${notification.type || 'info'}`} role="alert" aria-live="polite">
      <Icon size={18} className="flex-shrink-0 mt-0.5" />
      <div className="flex-1 min-w-0">
        {notification.title && <p className="font-bold text-sm mb-0.5">{notification.title}</p>}
        {notification.message && <p className="text-xs opacity-95 leading-relaxed whitespace-pre-line">{notification.message}</p>}

      <button onClick={onClose} aria-label="إغلاق" className="flex-shrink-0 p-1 hover:bg-white/20 rounded-full"><X size={14} /></button>

  );
};

const PinLockScreen = ({ onSuccess, onLogout }) => {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const [success, setSuccess] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const [lastPressed, setLastPressed] = useState(null);
  const pressTimerRef = useRef(null);
  const clearTimerRef = useRef(null);
  const navTimerRef = useRef(null);

  useEffect(() => () => {
    if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
    if (navTimerRef.current) clearTimeout(navTimerRef.current);
  }, []);

  const handleDigit = (d) => {
    if (pin.length >= 4 || success) return;
    const next = pin + d;
    setPin(next);
    setLastPressed(d);
    if (navigator.vibrate) navigator.vibrate(8);
    if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    pressTimerRef.current = setTimeout(() => setLastPressed(null), 150);
    if (next.length === 4) {
      if (navTimerRef.current) clearTimeout(navTimerRef.current);
      navTimerRef.current = setTimeout(async () => {
        const ok = await verifyPin(next);
        if (ok) {
          setSuccess(true);
          if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
          try { await savePinSession(next); } catch (e) {}
          if (navTimerRef.current) clearTimeout(navTimerRef.current);
          navTimerRef.current = setTimeout(() => onSuccess(next), 450);
        } else {
          setError(true);
          if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
          setAttempts(a => a + 1);
          if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
          clearTimerRef.current = setTimeout(() => { setPin(''); setError(false); }, 650);
        }
      }, 150);
    }
  };
  const handleDelete = () => { if (!success) setPin(p => p.slice(0, -1)); };

  return (
    <div className="min-h-screen flex items-center justify-center p-6 relative overflow-hidden" style={{ background: 'linear-gradient(135deg, #050A14 0%, #0A1628 40%, #1E2B4A 100%)' }}>
      <div className={`relative w-full max-w-sm ${error ? 'animate-shake' : ''}`}>
        <div className="flex flex-col items-center mb-8">
          <div className={`w-20 h-20 rounded-3xl flex items-center justify-center mb-5 transition-all duration-500 ${success ? 'bg-emerald-500 scale-110 shadow-2xl shadow-emerald-500/40' : error ? 'bg-red-500/20 border-2 border-red-500/30' : 'bg-[rgba(99,91,255,0.15)] border-2 border-[rgba(99,91,255,0.3)]'}`}>
            {success ? <CheckCircle2 size={32} className="text-white" /> : error ? <AlertTriangle size={30} className="text-red-400" /> : <Lock size={30} className="text-[#8B84FF]" />}
          </div>
          <h1 className="text-2xl font-black text-white mb-1.5">{success ? 'مرحباً ✓' : error ? 'رمز غير صحيح' : 'أهلاً بعودتك'}</h1>
          <p className="text-xs font-medium" style={{ color: '#64748B' }}>{success ? 'جارٍ الفتح...' : error ? `المحاولة ${attempts}` : 'أدخل رمز الدخول'}</p>
        </div>
        <div className="flex justify-center gap-3 mb-8 h-4">
          {[0, 1, 2, 3].map(i => (
            <div key={i} className={`w-3 h-3 rounded-full transition-all duration-300 ${success ? 'bg-emerald-400 scale-125' : error ? 'bg-red-500 scale-110' : pin.length > i ? 'bg-[#8B84FF] scale-125' : 'bg-transparent border-2 border-slate-600'}`}></div>
          ))}
        </div>
        <div className="grid grid-cols-3 gap-3 mb-6">
          {['1','2','3','4','5','6','7','8','9'].map(d => (
            <button key={d} type="button" onClick={() => handleDigit(d)}
              className={`aspect-square rounded-2xl font-black text-xl transition-all duration-100 active:scale-90 select-none ${lastPressed === d ? 'bg-[#635BFF] text-white scale-95' : 'bg-white/[0.05] border border-white/[0.08] text-white hover:bg-white/[0.1]'}`}>
              {d}
            </button>
          ))}
          <div className="aspect-square"></div>
          <button type="button" onClick={() => handleDigit('0')}
            className={`aspect-square rounded-2xl font-black text-xl transition-all duration-100 active:scale-90 select-none ${lastPressed === '0' ? 'bg-[#635BFF] text-white scale-95' : 'bg-white/[0.05] border border-white/[0.08] text-white hover:bg-white/[0.1]'}`}>
            0
          </button>
          <button type="button" onClick={handleDelete} className="aspect-square rounded-2xl flex items-center justify-center transition-all active:scale-90" style={{ color: '#64748B' }}>
            <Delete size={20} />
          </button>
        </div>
        <button type="button" onClick={onLogout} className="w-full py-3 text-xs font-bold flex items-center justify-center gap-2 transition-colors" style={{ color: '#64748B' }}>
          <LogOut size={14} /> تسجيل الخروج
        </button>
        <button type="button" onClick={() => {
          if (window.confirm('هل تريد إعادة تعيين الرمز؟ ستحتاج إعادة تسجيل الدخول.')) {
            localStorage.removeItem(PIN_HASH_KEY);
            sessionStorage.removeItem(PIN_SESSION_KEY);
            onLogout();
          }
        }} className="w-full py-2 text-[10px] font-bold" style={{ color: '#64748B' }}>
          نسيت الرمز؟ إعادة تعيين
        </button>
      </div>
    </div>
  );
};

const PinChangeModal = ({ onClose, addNotification }) => {
  const [current, setCurrent] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (!/^\d{4}$/.test(next)) { addNotification({ type: 'error', title: 'الرمز الجديد لازم 4 أرقام' }); return; }
    if (next !== confirm) { addNotification({ type: 'error', title: 'الرمز الجديد مش متطابق' }); return; }
    setBusy(true);
    try {
      const ok = await verifyPin(current);
      if (!ok) { addNotification({ type: 'error', title: 'الرمز الحالي غير صحيح' }); setBusy(false); return; }
      await savePinHash(next);
      try { await savePinSession(next); } catch (e) {}
      addNotification({ type: 'success', title: 'تم تغيير الرمز بنجاح' });
      setBusy(false);
      onClose();
    } catch (e) { addNotification({ type: 'error', title: 'فشل', message: e.message }); setBusy(false); }
  };
  return (
    <Modal isOpen={true} onClose={onClose} title="تغيير رمز الدخول" icon="🔐">
      <div className="space-y-3">
        <div>
          <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الرمز الحالي</label>
          <input type="password" inputMode="numeric" maxLength={4} className="input-field input-num text-center text-lg tracking-widest" value={current} onChange={e => setCurrent(e.target.value.replace(/\D/g, ''))} />
        </div>
        <div>
          <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الرمز الجديد</label>
          <input type="password" inputMode="numeric" maxLength={4} className="input-field input-num text-center text-lg tracking-widest" value={next} onChange={e => setNext(e.target.value.replace(/\D/g, ''))} />
        </div>
        <div>
          <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>تأكيد الرمز الجديد</label>
          <input type="password" inputMode="numeric" maxLength={4} className="input-field input-num text-center text-lg tracking-widest" value={confirm} onChange={e => setConfirm(e.target.value.replace(/\D/g, ''))} />
        </div>
        <button onClick={submit} disabled={busy} className="btn btn-primary w-full py-2.5 text-sm">{busy ? 'جاري الحفظ...' : 'حفظ'}</button>
      </div>
    </Modal>
  );
};

          <p className="text-[10px] font-black mb-2 text-orange-700 dark:text-orange-400">⚙️ خيارات التقرير:</p>

              <input type="checkbox" checked={hanyOptions.includeSettlements} onChange={e => setHanyOptions({ ...hanyOptions, includeSettlements: e.target.checked })} className="w-3.5 h-3.5 accent-orange-600" />

            <label className="flex items-center gap-1.5 p-1.5 rounded cursor-pointer text-[10px] font-bold">
              <input type="checkbox" checked={hanyOptions.includeGrouped} onChange={e => setHanyOptions({ ...hanyOptions, includeGrouped: e.target.checked })} className="w-3.5 h-3.5 accent-orange-600" />

        <div className="grid grid-cols-2 gap-2">
          <button onClick={() => handlePrintHany(false)} className="btn text-xs py-2.5 font-black" style={{ background: 'linear-gradient(135deg, #EA580C 0%, #C2410C 100%)', color: 'white', boxShadow: '0 6px 16px -4px rgba(234,88,12,0.5)' }}>
            <PrinterIcon size={14} /> طباعة كل الفترات

          <button onClick={() => handlePrintHany(true)} className="btn text-xs py-2.5 font-black" style={{ background: 'white', color: '#EA580C', border: '2px solid #EA580C' }}>

      </div>

      {/* Other Reports Grid */}
      <div>
        <h3 className="font-black text-sm mb-3 flex items-center gap-2">
          <FileSpreadsheet size={14} className="text-[color:var(--accent)]" />
