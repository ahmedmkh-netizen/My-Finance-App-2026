const MonthComparisonView = memo(({ transactions, selectedYear, selectedMonth }) => {
  const idx = getMonthIndex(selectedMonth);
  const prevMonth = idx > 0 ? ALL_MONTHS[idx - 1] : 'ديسمبر';
  const prevYear = idx > 0 ? selectedYear : selectedYear - 1;
  const curTx = transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
  const prevTx = transactions.filter(t => t.month === prevMonth && (t.year || 2026) === prevYear);
  const calc = (txs, type) => txs.filter(t => t.type === type && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
  const curInc = calc(curTx, 'income'), curExp = calc(curTx, 'expense');
  const prevInc = calc(prevTx, 'income'), prevExp = calc(prevTx, 'expense');
  const pct = (cur, prev) => prev === 0 ? (cur > 0 ? 100 : 0) : Math.round(((cur - prev) / prev) * 100);
  const catData = {};
  curTx.filter(t => t.status === 'paid').forEach(t => { if (!catData[t.category]) catData[t.category] = { cur: 0, prev: 0, type: t.type }; catData[t.category].cur += safeNumber(t.amount); });
  prevTx.filter(t => t.status === 'paid').forEach(t => { if (!catData[t.category]) catData[t.category] = { cur: 0, prev: 0, type: t.type }; catData[t.category].prev += safeNumber(t.amount); });
  const catRows = Object.entries(catData).map(([cat, d]) => ({ cat, cur: d.cur, prev: d.prev, change: pct(d.cur, d.prev), type: d.type })).sort((a, b) => Math.abs(b.cur - b.prev) - Math.abs(a.cur - a.prev));
  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <h2 className="text-lg font-black flex items-center gap-2"><Activity className="text-indigo-500" size={18} /> مقارنة الشهور</h2>
        <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} مقارنة بـ {prevMonth} {prevYear}</p>
      </div>
      <div className="grid grid-cols-3 gap-3">
        <div className="card py-3">
          <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الدخل</p>
          <p className="text-lg font-black text-emerald-600">{fmt(curInc, 0)}</p>
          <span className={`badge mt-1.5 ${curInc >= prevInc ? 'badge-success' : 'badge-danger'} text-[10px]`}>{curInc >= prevInc ? '↑' : '↓'} {Math.abs(pct(curInc, prevInc))}%</span>
        </div>
        <div className="card py-3">
          <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>المصروفات</p>
          <p className="text-lg font-black text-red-600">{fmt(curExp, 0)}</p>
          <span className={`badge mt-1.5 ${curExp <= prevExp ? 'badge-success' : 'badge-danger'} text-[10px]`}>{curExp <= prevExp ? '↓' : '↑'} {Math.abs(pct(curExp, prevExp))}%</span>
        </div>
        <div className="card py-3">
          <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الصافي</p>
          <p className={`text-lg font-black ${curInc - curExp >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(curInc - curExp, 0)}</p>
        </div>
      </div>
      <div className="card overflow-hidden p-0">
        <div className="p-4">
          <h3 className="font-black text-sm mb-3">تفاصيل الفئات</h3>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-right text-sm">
            <thead style={{ background: 'var(--bg-muted)' }}><tr>
              <th className="p-2.5 font-bold text-[11px]" style={{ color: 'var(--text-muted)' }}>الفئة</th>
              <th className="p-2.5 font-bold text-[11px] text-left" style={{ color: 'var(--text-muted)' }}>الحالي</th>
              <th className="p-2.5 font-bold text-[11px] text-center" style={{ color: 'var(--text-muted)' }}>التغيير</th>
            </tr></thead>
            <tbody>
              {catRows.length === 0 ? (<tr><td colSpan="3" className="p-6 text-center font-medium text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد بيانات</td></tr>) : catRows.slice(0, 15).map((row, i) => (
                <tr key={i} style={{ borderTop: '1px solid var(--border-subtle)' }}>
                  <td className="p-2.5 font-bold text-xs">{row.cat}</td>
                  <td className="p-2.5 text-left font-black text-xs">{fmt(row.cur, 0)}</td>
                  <td className="p-2.5 text-center"><span className={`badge ${row.change > 0 ? 'badge-danger' : row.change < 0 ? 'badge-success' : 'badge-neutral'} text-[10px]`}>{row.change > 0 ? '↑' : row.change < 0 ? '↓' : '—'} {Math.abs(row.change)}%</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
});

const DashboardView = memo(({ data, financeSnapshot, liveBalances, totalLiquidity, walletVisibility, onToggleVisibility, dispatch, selectedYear, selectedMonth, transactions, cards, updatedLoans, chartData, isDarkMode, handleManualReconciliation, addNotification, onSelectYear, onSelectMonth }) => {
  const totalCardDebt = cards.reduce((s, c) => s + safeNumber(c.openingDebt), 0);
  const totalLoanDebt = updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0);
  const grandTotalDebt = totalCardDebt + totalLoanDebt;
  const netPosition = totalLiquidity - grandTotalDebt;
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);
  const bankFeesMonth = useMemo(() => {
    return transactions.filter(t => t.status === 'paid' && t.type === 'expense' && BANK_FEE_CATEGORIES.has(t.category) && t.month === selectedMonth && (t.year || 2026) === selectedYear).reduce((s, t) => s + safeNumber(t.amount), 0);
  }, [transactions, selectedMonth, selectedYear]);
  const monthCashback = useMemo(() => {
    const trackers = (data?.cashbackTrackers || []).filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
    const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
    const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
    return { expected, received, pending: expected - received };
  }, [data?.cashbackTrackers, selectedMonth, selectedYear]);
  const pieData = useMemo(() => {
    const acc = {};
    transactions.filter(t => t.type === 'expense' && t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status === 'paid' && safeNumber(t.amount) > 0).forEach(t => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); });
    const sorted = Object.entries(acc).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
    if (sorted.length <= 5) return sorted;
    const top = sorted.slice(0, 4);
    const restVal = sorted.slice(4).reduce((s, i) => s + i.value, 0);
    return [...top, { name: 'أخرى', value: restVal }];
  }, [transactions, selectedMonth, selectedYear]);
  const net = financeSnapshot;

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex items-center justify-between gap-4 flex-wrap">
          <div>
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>صافي المركز</p>
            <h2 className={`text-3xl font-black tracking-tight ${netPosition >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
              {netPosition >= 0 ? '+' : ''}{fmt(netPosition)}
              <span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <p className={`text-[11px] font-bold mt-1.5 ${netPosition >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{netPosition >= 0 ? '✅ وضع آمن' : '⚠️ مراجعة'}</p>
          </div>
          <div className="flex gap-2">
            <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center min-w-[80px]">
              <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">سيولة</p>
              <p className="text-sm font-black text-emerald-600">{fmt(totalLiquidity, 0)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-center min-w-[80px]">
              <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مديونية</p>
              <p className="text-sm font-black text-red-600">{fmt(grandTotalDebt, 0)}</p>
            </div>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-3 gap-2">
        <button onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', amount: '', date: getLocalISODate(), method: 'cash', subType: 'withdrawal', category: '', status: 'pending' } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="card py-3 flex flex-col items-center gap-1 active:scale-95">
          <div className="p-1.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-red-600 dark:text-red-400"><TrendingDown size={16} /></div>
          <span className="text-[11px] font-bold">مصروف</span>
        </button>
        <button onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'income', amount: '', date: getLocalISODate(), method: 'cash', subType: 'deposit', category: '', status: 'pending' } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="card py-3 flex flex-col items-center gap-1 active:scale-95">
          <div className="p-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400"><TrendingUp size={16} /></div>
          <span className="text-[11px] font-bold">دخل</span>
        </button>
        <button onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: true })} className="card py-3 flex flex-col items-center gap-1 active:scale-95">
          <div className="p-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400"><Layers size={16} /></div>
          <span className="text-[11px] font-bold">تحويل</span>
        </button>
      </div>

      {/* Compact status — Custody goes to loans tab, Cashback goes to cards tab */}
      <div className="grid grid-cols-3 gap-2">
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'loans' })} className="card py-2.5 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1">
            <Briefcase size={11} className="text-blue-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>عهدة</span>
          </div>
          <p className={`text-sm font-black ${custodySummary.balance > 0 ? 'text-blue-600' : custodySummary.balance < 0 ? 'text-red-600' : 'text-emerald-600'}`}>{fmt(custodySummary.balance, 0)}</p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'cards' })} className="card py-2.5 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1">
            <Gift size={11} className="text-emerald-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>كاش باك</span>
          </div>
          <p className="text-sm font-black text-emerald-600">{fmt(monthCashback.received, 0)}</p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'transactions' })} className="card py-2.5 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1">
            <Receipt size={11} className="text-red-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>رسوم بنكية</span>
          </div>
          <p className="text-sm font-black text-red-600">{fmt(bankFeesMonth, 0)}</p>
        </button>
      </div>

      <QuickBalanceOverview balances={liveBalances} walletVisibility={walletVisibility} onToggleVisibility={onToggleVisibility} />

      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <EnhancedStatCard title="الكاش في اليد" amount={net.actualCashInHand} icon={Wallet} subtitle="حتى نهاية اليوم" isPrivate={!walletVisibility.cash} color="emerald" />
        <EnhancedStatCard title="دخل محصل" amount={net.actualIncome} icon={TrendingUp} subtitle={net.pendingIncome > 0 ? `+${fmt(net.pendingIncome, 0)} معلق` : ''} color="emerald" />
        <EnhancedStatCard title="مصاريف معلقة" amount={-net.pendingCash} icon={Clock} subtitle={`مدفوع: ${fmt(net.paidCash, 0)}`} color="red" />
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'forecast' })} className="stat-card text-right active:scale-95">
          <div className="flex justify-between items-start mb-2">
            <div>
              <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>توقع القادم</p>
              <h3 className={`text-lg font-black ${net.projectedClosingBalance >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(net.projectedClosingBalance, 0)}</h3>
            </div>
            <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400"><LineChart size={16} /></div>
          </div>
        </button>
      </div>

      <div className="grid grid-cols-3 gap-3">
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>استخدام البطاقات</p>
          <p className="text-base font-black text-amber-600">{cards.reduce((s,c) => s+safeNumber(c.limit),0) > 0 ? Math.round((totalCardDebt / cards.reduce((s,c) => s+safeNumber(c.limit),0)) * 100) : 0}%</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>فارق السيولة</p>
          <p className={`text-base font-black ${netPosition >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{netPosition >= 0 ? '+' : ''}{fmt(netPosition, 0)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>مستحقات لك</p>
          <p className="text-base font-black text-emerald-600">{fmt(updatedLoans.filter(l=>l.isReceivable).reduce((s,l)=>s+l.remaining,0), 0)}</p>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
        <div className="card">
          <h3 className="font-bold text-xs mb-3 flex items-center gap-2"><BarChart3 className="text-blue-500" size={14} /> التدفق النقدي — {selectedYear}</h3>
          <div className="h-48">{chartData.every(d => d.دخل === 0 && d.مصروف === 0) ? (<div className="h-full flex items-center justify-center font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد بيانات</div>) : (
            <ResponsiveContainer width="100%" height="100%"><BarChart data={chartData}>
              <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.08} /><XAxis dataKey="name" fontSize={9} stroke="#94A3B8" /><YAxis fontSize={9} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
              <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '10px', border: 'none', backgroundColor: isDarkMode ? '#262014' : 'white', fontFamily: 'Cairo', fontSize: '12px' }} />
              <Bar dataKey="دخل" fill="#059669" radius={[4, 4, 0, 0]} barSize={10} /><Bar dataKey="مصروف" fill="#DC2626" radius={[4, 4, 0, 0]} barSize={10} />
            </BarChart></ResponsiveContainer>)}</div>
        </div>
        <div className="card">
          <h3 className="font-bold text-xs mb-3 flex items-center gap-2"><PieChart className="text-purple-500" size={14} /> توزيع مصروفات {selectedMonth}</h3>
          <div className="h-48">{pieData.length === 0 ? (<div className="h-full flex items-center justify-center font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد مصروفات</div>) : (
            <ResponsiveContainer width="100%" height="100%"><PieChart>
              <Pie data={pieData} cx="50%" cy="50%" innerRadius={50} outerRadius={80} paddingAngle={3} dataKey="value" cornerRadius={4}>
                {pieData.map((e, i) => <Cell key={i} fill={CATEGORY_COLORS[e.name] || '#94A3B8'} stroke="none" />)}
              </Pie>
              <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '10px', border: 'none', backgroundColor: isDarkMode ? '#262014' : 'white', fontFamily: 'Cairo', fontSize: '12px' }} />
              <Legend layout="vertical" verticalAlign="middle" align="right" iconType="circle" wrapperStyle={{ fontSize: '10px', fontWeight: 'bold' }} />
            </PieChart></ResponsiveContainer>)}</div>
        </div>
      </div>

      <details className="card p-0 overflow-hidden">
        <summary className="p-4 cursor-pointer list-none flex items-center justify-between">
          <div className="flex items-center gap-2">
            <ShieldAlert size={14} className="text-amber-500" />
            <span className="font-bold text-xs">مساعد ضبط السيولة</span>
          </div>
          <ChevronDown size={14} style={{ color: 'var(--text-muted)' }} />
        </summary>
        <div className="px-4 pb-4 flex flex-col md:flex-row items-end gap-2" style={{ borderTop: '1px solid var(--border-subtle)', paddingTop: '12px' }}>
          <div className="flex-1 w-full">
            <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الحساب</label>
            <select id="adj-wallet" className="input-field py-2 text-xs font-bold w-full">{ACCOUNT_KEYS.map(k => <option key={k} value={k}>{DEFAULT_ACCOUNTS[k]?.label || k}</option>)}</select>
          </div>
          <div className="flex-1 w-full">
            <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الرصيد الفعلي</label>
            <input type="text" inputMode="decimal" id="adj-amount" placeholder="0.00" className="input-field py-2 text-xs font-black text-blue-600 w-full" />
          </div>
          <button type="button" onClick={() => { const w = document.getElementById('adj-wallet').value; const a = parseNumberInput(document.getElementById('adj-amount').value); if (!a || a < 0) { addNotification({ type: 'warning', title: 'خطأ', message: 'ادخل مبلغ صحيح' }); return; } handleManualReconciliation(w, a); document.getElementById('adj-amount').value = ''; }} className="btn btn-primary w-full md:w-auto py-2 text-xs">
            <CheckCircle2 size={12} /> اعتماد
          </button>
        </div>
      </details>
    </div>
  );
});

const CategoryDetailModal = memo(({ activeCategoryDetail, detailedTransactions, detailedTotal, paidTotal, pendingTotal, selectedMonth, selectedYear, dispatch, handleDelete, printReport, exportPdf }) => (
  <div className="fixed inset-0 z-[3000] no-print">
    <div className="absolute inset-0 backdrop-blur-md animate-fadeIn" style={{ background: 'rgba(42, 36, 24, 0.55)' }} onClick={() => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: null })}></div>
    <div className="relative h-full flex items-center justify-center p-2 md:p-4">
      <div className="w-full max-w-5xl rounded-2xl shadow-2xl overflow-hidden flex flex-col" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)', maxHeight: 'calc(100dvh - 20px)' }}>
        <div className="p-4 flex-shrink-0" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
          <div className="flex justify-between items-start flex-wrap gap-3">
            <div className="flex items-center gap-3 flex-1 min-w-0">
              <span className="p-2 rounded-lg flex-shrink-0" style={{ background: 'var(--bg-muted)', color: CATEGORY_COLORS[activeCategoryDetail] }}><Layers size={18} /></span>
              <div className="min-w-0">
                <h3 className="text-base font-black truncate">{activeCategoryDetail}</h3>
                <p className="text-[11px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} • {detailedTransactions.length}</p>
              </div>
            </div>
            <div className="flex gap-2">
              <button type="button" aria-label="PDF" onClick={() => exportPdf(`تقرير ${activeCategoryDetail}`, detailedTransactions)} className="btn btn-secondary p-2"><FileText size={16} /></button>
              <button type="button" aria-label="طباعة" onClick={() => printReport(`تقرير ${activeCategoryDetail}`, detailedTransactions)} className="btn btn-primary p-2"><Printer size={16} /></button>
              <button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: null })} className="btn btn-ghost p-2"><X size={18} /></button>
            </div>
          </div>
          <div className="grid grid-cols-3 gap-2 mt-3">
            <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الإجمالي</p>
              <p className="text-sm font-black text-blue-600">{fmt(detailedTotal)}</p>
            </div>
            <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30">
              <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">معتمد</p>
              <p className="text-sm font-black text-emerald-600">{fmt(paidTotal)}</p>
            </div>
            <div className="p-2 rounded-lg bg-amber-50 dark:bg-amber-950/30">
              <p className="text-[10px] font-bold text-amber-700 dark:text-amber-400">معلق</p>
              <p className="text-sm font-black text-amber-600">{fmt(pendingTotal)}</p>
            </div>
          </div>
        </div>
        <div className="flex-1 overflow-y-auto scroll-hide" style={{ minHeight: 0 }}>
          {detailedTransactions.length === 0 ? (<div className="text-center py-16 font-medium text-sm" style={{ color: 'var(--text-muted)' }}>لا توجد معاملات</div>) : (
            <div className="divide-y" style={{ borderColor: 'var(--border-subtle)' }}>
              {detailedTransactions.map(t => (
                <div key={t.id} className="p-3 flex justify-between items-center gap-3 hover:bg-[color:var(--bg-muted)]">
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2 flex-wrap mb-1">
                      <span className="font-bold text-xs">{t.description || t.category}</span>
                      <FamilyBadge tx={t} />
                    </div>
                    <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{t.date} • {PAYMENT_METHODS.find(p => p.id === t.method)?.label}</p>
                  </div>
                  <div className="flex items-center gap-1 flex-shrink-0">
                    <p className="font-black text-xs">{fmt(t.amount)}</p>
                    <button type="button" aria-label="تعديل" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: null }); }} className="btn btn-ghost p-1.5"><Edit size={12} /></button>
                    <button type="button" aria-label="حذف" onClick={() => handleDelete(t.id)} className="btn btn-ghost p-1.5 text-red-500"><Trash2 size={12} /></button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  </div>
));

const CategoriesView = memo(({ transactions, selectedMonth, selectedYear, catViewType, activeCategoryDetail, budgets, dispatch, handleDelete, printReport, exportPdf, onSelectYear, onSelectMonth }) => {
  const catTotals = transactions.filter(t => t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear).reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); return acc; }, {});
  const detailedTransactions = activeCategoryDetail ? transactions.filter(t => t.category === activeCategoryDetail && t.month === selectedMonth && (t.year || 2026) === selectedYear).sort((a, b) => new Date(a.date) - new Date(b.date)) : [];
  const detailedTotal = detailedTransactions.reduce((s, t) => s + safeNumber(t.amount), 0);
  const paidTotal = detailedTransactions.filter(t => t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
  const pendingTotal = detailedTotal - paidTotal;
  const printGlobalData = CATEGORIES[catViewType].map(cat => ({ date: `${selectedMonth} ${selectedYear}`, category: cat, description: 'إجمالي', method: '-', amount: catTotals[cat] || 0 })).filter(i => i.amount > 0);
  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card flex justify-between items-center gap-2 flex-wrap">
        <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
          <button type="button" onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'expense' })} className={`px-4 py-2 rounded-md text-xs font-bold transition-all ${catViewType === 'expense' ? 'shadow-sm text-red-600 dark:text-red-400' : ''}`} style={catViewType === 'expense' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}>مصروفات</button>
          <button type="button" onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'income' })} className={`px-4 py-2 rounded-md text-xs font-bold transition-all ${catViewType === 'income' ? 'shadow-sm text-emerald-600 dark:text-emerald-400' : ''}`} style={catViewType === 'income' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}>إيرادات</button>
        </div>
        <div className="flex gap-1.5">
          <button type="button" onClick={() => exportPdf(`ملخص ${selectedMonth}`, printGlobalData)} className="btn btn-secondary text-xs"><FileText size={12} /> PDF</button>
          <button type="button" onClick={() => printReport(`ملخص ${selectedMonth}`, printGlobalData)} className="btn btn-secondary text-xs"><Printer size={12} /> طباعة</button>
        </div>
      </div>
      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />
      <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
        {CATEGORIES[catViewType].map(cat => { const spent = catTotals[cat] || 0; const budget = budgets[cat] || 0; const overBudget = budget > 0 && spent > budget; if (spent === 0 && budget === 0) return null; return (
          <div key={cat} className="card p-3 cursor-pointer active:scale-[0.98]" onClick={() => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: cat })}>
            <div className="flex justify-between mb-2">
              <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: CATEGORY_COLORS[cat] }}><Layers size={14} /></div>
              <button type="button" aria-label="ميزانية" onClick={(e) => { e.stopPropagation(); dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: cat }); dispatch({ type: 'SET_BUDGET_AMOUNT', payload: budgets[cat] || '' }); }} className="btn btn-ghost p-1"><SettingsIcon size={12} /></button>
            </div>
            <h3 className="font-bold text-[11px] mb-1 truncate">{cat}</h3>
            <p className="text-base font-black tracking-tight">{fmt(spent, 0)}<span className="text-[9px] font-semibold mr-1" style={{ color: 'var(--text-muted)' }}>ج.م</span></p>
            {catViewType === 'expense' && budget > 0 && (
              <div className="mt-2 pt-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
                <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                  <div style={{ width: `${Math.min(100, (spent / budget) * 100)}%` }} className={`h-full ${overBudget ? 'bg-red-500' : 'bg-emerald-500'}`}></div>
                </div>
              </div>
            )}
          </div>
        ); })}
      </div>
      {activeCategoryDetail && <CategoryDetailModal activeCategoryDetail={activeCategoryDetail} detailedTransactions={detailedTransactions} detailedTotal={detailedTotal} paidTotal={paidTotal} pendingTotal={pendingTotal} selectedMonth={selectedMonth} selectedYear={selectedYear} dispatch={dispatch} handleDelete={handleDelete} printReport={printReport} exportPdf={exportPdf} />}
    </div>
  );
});

const TransactionsView = memo(({ groupedTransactions, transactions, selectedMonth, selectedYear, transViewMode, statusFilter, searchTerm, expandedGroup, data, monthInsights, dispatch, handleDelete, printReport, exportPdf, addNotification, onSelectYear, onSelectMonth, saveHistory, onPrintMonthlyReport }) => {
  const [sourceFilter, setSourceFilter] = useState('all');
  const [showFilters, setShowFilters] = useState(false);
  const [showBankFeesOnly, setShowBankFeesOnly] = useState(false);
  const filterBySource = (list) => { if (sourceFilter === 'all') return list; if (sourceFilter === 'self') return list.filter(t => !isFamilyTx(t)); return list.filter(t => t.createdBy === sourceFilter); };
  const filterByBankFees = (list) => showBankFeesOnly ? list.filter(t => isBankFee(t)) : list;
  const pendingGroups = groupedTransactions.map(g => ({ ...g, items: filterByBankFees(filterBySource(g.items.filter(t => t.status !== 'paid'))) })).filter(g => g.items.length > 0);
  const paidArchive = filterByBankFees(filterBySource(transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status === 'paid' && t.type === transViewMode))).sort((a, b) => new Date(b.date) - new Date(a.date));
  const totalPending = pendingGroups.reduce((s, g) => s + g.items.length, 0);
  const isClosed = isMonthClosed(data, selectedYear, selectedMonth);
  const approveOne = (t) => { if (isMonthClosed(data, t.year || 2026, t.month)) { addNotification({ type: 'error', title: 'محظور' }); return; } dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(tr => tr.id === t.id ? { ...tr, status: 'paid' } : tr) }); addNotification({ type: 'success', title: 'تم الاعتماد' }); };
  const approveAll = () => { if (isClosed) { addNotification({ type: 'error', title: 'محظور' }); return; } dispatch({ type: 'SHOW_CONFIRM', danger: false, title: 'اعتماد الكل', message: `سيتم اعتماد ${totalPending} عملية`, onConfirm: () => { saveHistory(); const ids = new Set(pendingGroups.flatMap(g => g.items.map(i => i.id))); dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t) }); addNotification({ type: 'success', title: 'تم الاعتماد' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) }); };
  const reopenOne = (t) => { if (isMonthClosed(data, t.year || 2026, t.month)) { addNotification({ type: 'error', title: 'محظور' }); return; } dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(tr => tr.id === t.id ? { ...tr, status: 'pending' } : tr) }); addNotification({ type: 'warning', title: 'إعادة تعليق' }); };
  const monthTx = transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
  const activeFiltersCount = (sourceFilter !== 'all' ? 1 : 0) + (statusFilter !== 'all' ? 1 : 0) + (showBankFeesOnly ? 1 : 0);
  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-center flex-wrap gap-2 mb-3">
          <div>
            <h2 className="text-lg font-black">{transViewMode === 'expense' ? 'المصروفات' : 'الإيرادات'}</h2>
            <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} • {monthTx.length} معاملة</p>
          </div>
          <div className="flex gap-1.5">
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'expense' })} className={`btn ${transViewMode === 'expense' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>مصروفات</button>
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'income' })} className={`btn ${transViewMode === 'income' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>إيرادات</button>
          </div>
        </div>
        <div className="grid grid-cols-3 gap-2">
          <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30">
            <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">محصل</p>
            <p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(monthInsights.inc, 0)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30">
            <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مدفوع</p>
            <p className="text-sm font-black text-red-600 mt-0.5">{fmt(monthInsights.exp, 0)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الصافي</p>
            <p className={`text-sm font-black mt-0.5 ${monthInsights.net >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(monthInsights.net, 0)}</p>
          </div>
        </div>
        <div className="flex gap-1.5 mt-3 flex-wrap">
          <button onClick={onPrintMonthlyReport} className="btn btn-secondary text-[11px] px-2.5 py-1.5"><FileText size={12} /> PDF</button>
          <button onClick={() => setShowBankFeesOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showBankFeesOnly ? 'btn-primary' : 'btn-secondary'}`}><Receipt size={12} /> رسوم بنكية</button>
          {isClosed ? (
            <>
              <div className="badge badge-success px-2 py-1 text-[10px]"><ShieldCheck size={10} /> مغلق</div>
              <button onClick={() => dispatch({ type: 'SHOW_CONFIRM', danger: false, title: `إعادة فتح`, message: 'سيتم إلغاء القفل.', onConfirm: () => { saveHistory(); dispatch({ type: 'OPEN_MONTH', payload: makeMonthKey(selectedYear, selectedMonth) }); addNotification({ type: 'success', title: 'تم إعادة الفتح' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) })} className="btn btn-secondary text-[11px] px-2.5 py-1.5"><Unlock size={12} /> فتح</button>
            </>
          ) : (
            <button onClick={() => dispatch({ type: 'SHOW_CONFIRM', danger: false, title: `إقفال`, message: 'سيتم تثبيت الأرصدة.', onConfirm: () => { saveHistory(); dispatch({ type: 'CLOSE_MONTH', payload: { year: selectedYear, month: selectedMonth } }); addNotification({ type: 'success', title: 'تم الإقفال' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) })} className="btn btn-secondary text-[11px] px-2.5 py-1.5"><Lock size={12} /> إقفال</button>
          )}
        </div>
      </div>

      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />

      <div className="card py-3">
        <div className="flex gap-2">
          <div className="relative flex-1">
            <Search className="absolute right-3 top-1/2 -translate-y-1/2" size={14} style={{ color: 'var(--text-muted)' }} />
            <input type="text" placeholder="ابحث..." className="input-field pr-9 text-sm py-2.5" value={searchTerm} onChange={(e) => dispatch({ type: 'SET_SEARCH_TERM', payload: e.target.value })} />
          </div>
          <button onClick={() => setShowFilters(!showFilters)} className={`btn ${showFilters ? 'btn-primary' : 'btn-secondary'} px-3 py-2.5 relative`}>
            <Filter size={14} />
            {activeFiltersCount > 0 && <span className="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 text-white text-[9px] rounded-full flex items-center justify-center font-black">{activeFiltersCount}</span>}
          </button>
        </div>
        {showFilters && (
          <div className="mt-3 pt-3 space-y-3 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            <div className="flex gap-2 flex-wrap">
              {[['all', 'الكل'], ['self', '👤 أنا'], ['ans', 'أنس'], ['abdelrahman', 'عبد الرحمن'], ['salma', 'سلمى'], ['om_abdo', 'أم عبده']].map(([id, label]) => (
                <button key={id} type="button" onClick={() => setSourceFilter(id)} className={`badge px-2.5 py-1 cursor-pointer text-[10px] ${sourceFilter === id ? 'badge-brand' : 'badge-neutral'}`}>{label}</button>
              ))}
            </div>
            <div className="flex gap-2 flex-wrap">
              {[['all', 'الكل'], ['pending', '⏳ معلق'], ['paid', '✅ مدفوع']].map(([id, label]) => (
                <button key={id} type="button" onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: id })} className={`badge px-2.5 py-1 cursor-pointer text-[10px] ${statusFilter === id ? 'badge-brand' : 'badge-neutral'}`}>{label}</button>
              ))}
            </div>
          </div>
        )}
      </div>

      <section>
        <div className="flex justify-between items-center mb-2 flex-wrap gap-2">
          <h3 className="font-black flex items-center gap-2 text-sm">
            <Clock className="text-amber-500" size={14} /> الالتزامات
            {totalPending > 0 && <span className="badge badge-warning text-[10px]">{totalPending}</span>}
          </h3>
          {totalPending > 0 && <button onClick={approveAll} className="btn btn-primary text-[11px] px-2.5 py-1.5"><CheckCircle2 size={12} /> اعتماد الكل</button>}
        </div>
        {pendingGroups.length === 0 ? (
          <div className="card text-center p-6">
            <CheckCircle2 size={24} className="text-emerald-500 mx-auto mb-2" />
            <p className="font-semibold text-xs" style={{ color: 'var(--text-secondary)' }}>لا توجد التزامات</p>
          </div>
        ) : (
          <div className="space-y-2">
            {pendingGroups.map(g => {
              const isExpanded = expandedGroup === g.category;
              return (
                <div key={g.category} className="card p-0 overflow-hidden">
                  <div className="flex justify-between items-center p-3 cursor-pointer" onClick={() => dispatch({ type: 'SET_EXPANDED_GROUP', payload: isExpanded ? null : g.category })}>
                    <div className="flex items-center gap-2 min-w-0 flex-1">
                      <span className="p-1.5 rounded-lg flex-shrink-0" style={{ backgroundColor: `${CATEGORY_COLORS[g.category]}20`, color: CATEGORY_COLORS[g.category] }}><Layers size={14} /></span>
                      <div className="min-w-0">
                        <h4 className="font-bold text-xs truncate">{g.category}</h4>
                        <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{g.items.length} عملية</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <span className="font-black text-sm">{fmt(g.items.reduce((s, i) => s + safeNumber(i.amount), 0), 0)}</span>
                      <ChevronDown size={14} className={`transition-transform ${isExpanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
                    </div>
                  </div>
                  {isExpanded && (
                    <div className="divide-y" style={{ borderTop: '1px solid var(--border-subtle)', borderColor: 'var(--border-subtle)' }}>
                      {g.items.map(t => (
                        <div key={t.id} className="p-3 flex justify-between items-center gap-2">
                          <button aria-label="اعتماد" onClick={() => approveOne(t)} className="flex flex-col items-center px-1.5 py-1 rounded-lg hover:bg-[color:var(--bg-muted)] active:scale-90 flex-shrink-0">
                            <Clock className="text-amber-500" size={16} />
                          </button>
                          <div className="flex-1 min-w-0">
                            <p className="font-bold text-xs truncate">{t.description || 'بدون وصف'} <FamilyBadge tx={t} /></p>
                            <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>{t.date} • {PAYMENT_METHODS.find(p => p.id === t.method)?.label}</p>
                          </div>
                          <div className="flex items-center gap-1 flex-shrink-0">
                            <span className="font-black text-xs">{fmt(t.amount, 0)}</span>
                            <button type="button" aria-label="تعديل" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="btn btn-ghost p-1"><Edit size={12} /></button>
                            <button type="button" aria-label="حذف" onClick={() => handleDelete(t.id)} className="btn btn-ghost p-1 text-red-500"><Trash2 size={12} /></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </section>

      {paidArchive.length > 0 && (
        <details className="group">
          <summary className="cursor-pointer list-none">
            <div className="card py-3 flex items-center justify-between">
              <h3 className="font-bold text-xs flex items-center gap-2 text-emerald-600"><CheckCircle2 size={14} /> سجل المدفوعات ({paidArchive.length})</h3>
              <ChevronDown className="transition-transform group-open:rotate-180" size={14} style={{ color: 'var(--text-muted)' }} />
            </div>
          </summary>
          <div className="space-y-2 mt-2">
            {paidArchive.map(t => (
              <div key={t.id} className="card py-2.5 flex justify-between items-center gap-2">
                <div className="min-w-0 flex-1">
                  <p className="font-bold text-xs truncate">{t.type === 'income' ? '💰' : '💸'} {t.description || t.category} <FamilyBadge tx={t} /></p>
                  <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{t.date}</p>
                </div>
                <div className="flex items-center gap-1 flex-shrink-0">
                  <span className="font-black text-xs">{fmt(t.amount, 0)}</span>
                  <button aria-label="إعادة تعليق" onClick={() => reopenOne(t)} className="btn btn-ghost p-1 text-amber-500"><Undo2 size={12} /></button>
                </div>
              </div>
            ))}
          </div>
        </details>
      )}
    </div>
  );
});

// ============ LoansView (مع دمج العهدة) ============
const LoansView = memo(({ updatedLoans, cards, recurringItems, transactions, dispatch, deleteRecurring, saveHistory, getLocalISODate, addNotification, data }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [activeTab, setActiveTab] = useState('loans');
  const [newLoan, setNewLoan] = useState({ name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false });

  const settleHany = (loan) => {
    const months = ALL_MONTHS;
    const total = safeNumber(loan.totalAmount);
    const paidAlready = safeNumber(loan.totalPaid);
    const remaining = Math.max(0, total - paidAlready);
    if (remaining <= 0.005) { addNotification({ type: 'info', title: 'مسدد بالكامل' }); return; }
    const monthLabel = `${loan.month} ${loan.year}`;
    const alreadyCarried = transactions.some(t => t.source === 'carryover' && t.carryoverFrom === monthLabel);
    if (alreadyCarried) { addNotification({ type: 'info', title: 'تمت التسوية مسبقاً' }); return; }
    const input = prompt(`تسوية مسحوبات محل هاني\n\nالإجمالي: ${fmt(total)}\nمدفوع: ${fmt(paidAlready)}\nالمتبقي: ${fmt(remaining)}\n\nالمبلغ المدفوع الآن:`, String(remaining));
    if (input === null) return;
    const paidNow = parseNumberInput(input);
    if (paidNow <= 0) { addNotification({ type: 'error', title: 'مبلغ غير صحيح' }); return; }
    if (paidNow > remaining + 0.005) { addNotification({ type: 'error', title: `الحد الأقصى ${fmt(remaining)}` }); return; }
    const newRemaining = remaining - paidNow;
    const willCarry = newRemaining > 0.005;
    let nextMIdx = 0, nextY = loan.year, nextMonthName = '';
    if (willCarry) {
      const monthIdx = months.indexOf(loan.month);
      nextMIdx = monthIdx + 1; nextY = loan.year;
      if (nextMIdx > 11) { nextMIdx = 0; nextY++; }
      nextMonthName = months[nextMIdx];
    }
    saveHistory();
    const now = new Date();
    const today = getLocalISODate(now);
    const newTxs = [];
    newTxs.push({ id: 'hany-pay-' + Date.now(), type: 'expense', kind: 'financial', category: 'الالتزامات البنكية والتمويلية', amount: paidNow, description: `سداد مسحوبات هاني`, method: 'cash', date: today, month: months[now.getMonth()], year: now.getFullYear(), monthIndex: now.getMonth(), subType: 'withdrawal', status: 'paid', linkedLoanId: loan.id });
    if (willCarry) {
      const nextMonthDate = `${nextY}-${String(nextMIdx + 1).padStart(2, '0')}-01`;
      newTxs.push({ id: 'hany-carry-' + Date.now(), type: 'expense', kind: 'operational', category: 'مسحوبات محل هاني', subCategory: 'رصيد مرحل', amount: newRemaining, description: `رصيد مرحل من ${loan.month}`, method: 'cash', date: nextMonthDate, month: nextMonthName, year: nextY, monthIndex: nextMIdx, subType: 'withdrawal', status: 'pending', source: 'carryover', carryoverFrom: monthLabel });
    }
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [...newTxs, ...transactions].sort((a, b) => new Date(b.date) - new Date(a.date)) });
    addNotification({ type: 'success', title: 'تمت التسوية', duration: 7000 });
  };

  const totalLoans = updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0);
  const totalReceivable = updatedLoans.filter(l => l.isReceivable).reduce((s, l) => s + l.remaining, 0);
  const payables = updatedLoans.filter(l => !l.isReceivable);
  const receivables = updatedLoans.filter(l => l.isReceivable);
  const totalCards = cards.reduce((acc, c) => acc + safeNumber(c.openingDebt), 0);
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);

  const addLoan = () => {
    if (!newLoan.name || safeNumber(newLoan.totalAmount) <= 0) { addNotification({ type: 'error', title: 'الاسم والمبلغ مطلوبان' }); return; }
    saveHistory();
    dispatch({ type: 'UPDATE_LOANS', payload: [...updatedLoans, { id: Date.now(), name: newLoan.name, totalAmount: safeNumber(newLoan.totalAmount), prePaidAmount: 0, monthlyInstallment: safeNumber(newLoan.monthlyInstallment), dueDay: safeNumber(newLoan.dueDay, 1), interest: '', description: newLoan.description || '', type: newLoan.isReceivable ? 'receivable' : 'debt', isReceivable: newLoan.isReceivable }] });
    setShowAdd(false); setNewLoan({ name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false });
    addNotification({ type: 'success', title: 'تمت الإضافة' });
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      {/* Sub-tab switcher: القروض | العهدة */}
      <div className="sub-tab-switcher">
        <button onClick={() => setActiveTab('loans')} className={`sub-tab-btn ${activeTab === 'loans' ? 'active' : ''}`}>
          <Banknote size={14} /> القروض والمستحقات
        </button>
        <button onClick={() => setActiveTab('custody')} className={`sub-tab-btn ${activeTab === 'custody' ? 'active' : ''}`}>
          <Briefcase size={14} /> العهدة
          {custodySummary.balance !== 0 && <span className="badge badge-warning text-[9px] px-1.5 py-0">{fmt(custodySummary.balance, 0)}</span>}
        </button>
      </div>

      {activeTab === 'custody' ? (
        <CustodyView data={data} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />
      ) : (
        <>
          <div className="card">
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>إجمالي المديونية الصافية</p>
            <h2 className="text-3xl font-black tracking-tight text-gradient">{fmt(totalLoans + totalCards - totalReceivable)}<span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span></h2>
            <div className="grid grid-cols-3 gap-2 mt-3">
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">القروض</p>
                <p className="text-xs font-black text-red-600">{fmt(totalLoans, 0)}</p>
              </div>
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">البطاقات</p>
                <p className="text-xs font-black text-red-600">{fmt(totalCards, 0)}</p>
              </div>
              <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
                <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">مستحقات لك</p>
                <p className="text-xs font-black text-emerald-600">{fmt(totalReceivable, 0)}</p>
              </div>
            </div>
            <div className="flex gap-2 mt-3 flex-wrap">
              <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs flex-1"><Plus size={14} /> إضافة التزام</button>
              <button onClick={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: true })} className="btn btn-secondary text-xs flex-1"><Repeat size={14} /> متكرر</button>
            </div>
          </div>

          {showAdd && (
            <div className="modal-backdrop">
              <div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                  <h3 className="text-base font-black">التزام جديد</h3>
                  <button onClick={() => setShowAdd(false)} className="btn btn-ghost p-1.5"><X size={16} /></button>
                </div>
                <div className="p-4 space-y-3">
                  <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الاسم *</label><input className="input-field text-sm" value={newLoan.name} onChange={e => setNewLoan({ ...newLoan, name: e.target.value })} /></div>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ *</label><input type="text" inputMode="decimal" className="input-field text-sm" value={newLoan.totalAmount} onChange={e => setNewLoan({ ...newLoan, totalAmount: e.target.value })} /></div>
                    <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>القسط</label><input type="text" inputMode="decimal" className="input-field text-sm" value={newLoan.monthlyInstallment} onChange={e => setNewLoan({ ...newLoan, monthlyInstallment: e.target.value })} /></div>
                  </div>
                  <label className="flex items-center gap-3 p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 cursor-pointer">
                    <input type="checkbox" checked={newLoan.isReceivable} onChange={e => setNewLoan({ ...newLoan, isReceivable: e.target.checked })} className="w-4 h-4 accent-emerald-600" />
                    <span className="text-xs font-bold text-emerald-700 dark:text-emerald-400">مستحق <strong>لي</strong></span>
                  </label>
                  <button onClick={addLoan} className="btn btn-primary w-full py-2.5 text-sm">إضافة</button>
                </div>
              </div>
            </div>
          )}

          {receivables.length > 0 && (
            <details className="card p-0 overflow-hidden">
              <summary className="p-4 cursor-pointer list-none flex items-center justify-between">
                <h3 className="font-black text-sm flex items-center gap-2 text-emerald-600"><TrendingUp size={14} /> مستحقات لك ({receivables.length})</h3>
                <ChevronDown size={14} style={{ color: 'var(--text-muted)' }} />
              </summary>

                    <div className="flex justify-end gap-1.5 mt-2">
                      {loan.autoGenerated && (hasCarryover ? <div className="badge badge-success text-[10px]">تمت التسوية</div> : <button onClick={() => settleHany(loan)} className="btn btn-primary text-[10px] py-1 px-2"><CheckCircle2 size={10} /> تسوية</button>)}
                      {!loan.autoGenerated && loan.monthlyInstallment > 0 && (
                        <button onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', category: 'الالتزامات البنكية والتمويلية', amount: loan.monthlyInstallment, description: `قسط ${loan.name}`, linkedLoanId: loan.id, method: 'instapay', date: getLocalISODate(), status: 'pending', subType: 'withdrawal' } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="btn btn-secondary text-[10px] py-1 px-2"><CheckCircle2 size={10} /> سداد</button>

          {recurringItems.length > 0 && (
            <details className="card p-0 overflow-hidden">

                <ChevronDown size={14} style={{ color: 'var(--text-muted)' }} />
              </summary>
              <div className="px-4 pb-4 space-y-1.5" style={{ borderTop: '1px solid var(--border-subtle)', paddingTop: '12px' }}>
                {recurringItems.map(r => {
                  const isFee = BANK_FEE_CATEGORIES.has(r.category);
                  return (
                    <div key={r.id} className="flex justify-between items-center p-2 rounded-lg" style={{ background: isFee ? 'rgba(220, 38, 38, 0.05)' : 'var(--bg-muted)' }}>
                      <div className="min-w-0 flex-1">
                        <p className="font-bold text-xs truncate">{r.title} {isFee && '🏦'}</p>
                        <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>يوم {r.day}</p>
                      </div>
                      <div className="flex items-center gap-1.5 flex-shrink-0">
                        <span className={`font-black text-xs ${r.type === 'income' ? 'text-emerald-600' : 'text-red-500'}`}>{fmt(r.amount, 0)}</span>
                        <button aria-label="حذف" onClick={() => deleteRecurring(r.id)} className="btn btn-ghost p-1 text-red-500"><Trash2 size={12} /></button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </details>
          )}
        </>
      )}
    </div>
  );
});

const MonthlyPlanningView = memo(({ data, monthlyPlans, cards, loans, dispatch, saveHistory, addNotification }) => {
  const planningMonths = useMemo(() => [...getMonthsForYear(2026).map(m => ({ month: m, year: 2026 })), { month: 'يناير', year: 2027 }, { month: 'فبراير', year: 2027 }], []);
  const pk = (m) => makeMonthKey(m.year, m.month);
  const [localPlans, setLocalPlans] = useState(() => JSON.parse(JSON.stringify(monthlyPlans || {})));
  const [hasChanges, setHasChanges] = useState(false);
  useEffect(() => { setLocalPlans(JSON.parse(JSON.stringify(monthlyPlans || {}))); setHasChanges(false); }, [monthlyPlans]);
  const handlePlanChange = (m, field, value) => { setLocalPlans(prev => ({ ...prev, [pk(m)]: { ...(prev[pk(m)] || {}), [field]: value } })); setHasChanges(true); };
  const handleSave = () => { saveHistory(); const cleaned = {}; Object.entries(localPlans).forEach(([k, p]) => { if (!parseMonthKey(k)) return; cleaned[k] = { expectedSalary: safeNumber(p.expectedSalary), expectedRent: safeNumber(p.expectedRent), expectedCashback: safeNumber(p.expectedCashback), expectedEmakWE: safeNumber(p.expectedEmakWE), expectedZakat: safeNumber(p.expectedZakat), expectedCash: safeNumber(p.expectedCash), expectedCashExpenses: safeNumber(p.expectedCashExpenses), plannedPayments: safeNumber(p.plannedPayments), notes: p.notes || '' }; }); dispatch({ type: 'UPDATE_MONTHLY_PLANS', payload: cleaned }); addNotification({ type: 'success', title: 'تم الحفظ' }); setHasChanges(false); };
  const computed = useMemo(() => { const r = {}; planningMonths.forEach(m => { const p = localPlans[pk(m)] || {}; const inc = safeNumber(p.expectedSalary) + safeNumber(p.expectedRent) + safeNumber(p.expectedCashback) + safeNumber(p.expectedEmakWE) + safeNumber(p.expectedZakat) + safeNumber(p.expectedCash); const out = safeNumber(p.expectedCashExpenses) + safeNumber(p.plannedPayments); r[pk(m)] = { inc, out, net: inc - out }; }); return r; }, [localPlans, planningMonths]);
  const totalInc = planningMonths.reduce((s, m) => s + (computed[pk(m)]?.inc || 0), 0);
  const totalOut = planningMonths.reduce((s, m) => s + (computed[pk(m)]?.out || 0), 0);
  const totalNet = totalInc - totalOut;
  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card flex justify-between items-center flex-wrap gap-3">
        <div className="flex items-center gap-3">
          <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400"><Table size={16} /></div>
          <div>
            <h2 className="text-base font-black">التخطيط الشهري</h2>
            <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>6 أشهر قادمة</p>
          </div>
        </div>
        {hasChanges && <button onClick={handleSave} className="btn btn-primary text-xs"><Save size={14} /> حفظ</button>}
      </div>
      <div className="grid grid-cols-3 gap-2">
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>دخل</p><p className="text-sm font-black text-blue-600 mt-1">{fmt(totalInc, 0)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>مصروف</p><p className="text-sm font-black text-red-600 mt-1">{fmt(totalOut, 0)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>صافي</p><p className={`text-sm font-black mt-1 ${totalNet >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(totalNet, 0)}</p></div>
      </div>
      <div className="card p-0 overflow-hidden">
        <div className="p-4" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="font-black text-sm">الجدول</h3></div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm border-collapse min-w-[700px]">
            <thead>
              <tr>
                <th className="planning-cell-header sticky right-0 z-10 min-w-[120px] text-[11px]" style={{ background: 'var(--bg-muted)' }}>البند</th>
                {planningMonths.map(m => <th key={pk(m)} className="planning-cell-header min-w-[90px] text-[10px]"><div>{m.month}</div><div className="text-[9px]" style={{ color: 'var(--text-muted)' }}>{m.year}</div></th>)}
              </tr>
            </thead>
            <tbody>
              {[
                { key: 'expectedSalary', label: 'راتب' },
                { key: 'expectedRent', label: 'إيجار' },
                { key: 'expectedCashback', label: 'كاش باك' },
                { key: 'expectedEmakWE', label: 'عهدة' },
                { key: 'expectedZakat', label: 'زكاة' },
                { key: 'expectedCash', label: 'نقدي' }
              ].map(row => (
                <tr key={row.key}>
                  <td className="planning-cell sticky right-0 z-10 text-right font-bold text-[11px]" style={{ background: 'var(--bg-card)' }}>{row.label}</td>
                  {planningMonths.map(m => <td key={row.key + pk(m)} className="planning-cell"><input type="text" inputMode="decimal" className="planning-input text-[11px]" value={localPlans[pk(m)]?.[row.key] ?? ''} onChange={e => handlePlanChange(m, row.key, e.target.value)} /></td>)}
                </tr>
              ))}
              <tr className="bg-emerald-50 dark:bg-emerald-950/30">
                <td className="planning-cell sticky right-0 z-10 font-black text-emerald-700 dark:text-emerald-400 text-[11px]" style={{ background: 'var(--bg-card)' }}>إجمالي دخل</td>
                {planningMonths.map(m => <td key={'i' + pk(m)} className="planning-cell font-black text-emerald-700 dark:text-emerald-400 text-[11px]">{fmt(computed[pk(m)]?.inc, 0)}</td>)}
              </tr>
              <tr>
                <td className="planning-cell sticky right-0 z-10 font-bold text-[11px]" style={{ background: 'var(--bg-card)' }}>مصروف نقدي</td>
                {planningMonths.map(m => <td key={'ce' + pk(m)} className="planning-cell"><input type="text" inputMode="decimal" className="planning-input text-[11px]" value={localPlans[pk(m)]?.expectedCashExpenses ?? ''} onChange={e => handlePlanChange(m, 'expectedCashExpenses', e.target.value)} /></td>)}
              </tr>
              <tr>
                <td className="planning-cell sticky right-0 z-10 font-bold text-[11px]" style={{ background: 'var(--bg-card)' }}>مدفوعات</td>
                {planningMonths.map(m => <td key={'pp' + pk(m)} className="planning-cell"><input type="text" inputMode="decimal" className="planning-input text-[11px]" value={localPlans[pk(m)]?.plannedPayments ?? ''} onChange={e => handlePlanChange(m, 'plannedPayments', e.target.value)} /></td>)}
              </tr>

const LiquidityForecastView = memo(({ transactions, updatedLoans, recurringItems, liveBalances, selectedYear, selectedMonth, monthlyPlans }) => {
  const historical = useMemo(() => {
    const months = [];
    let y = selectedYear, mi = getMonthIndex(selectedMonth);
    for (let i = 1; i <= 3; i++) { mi--; if (mi < 0) { mi = 11; y--; } months.push({ year: y, month: ALL_MONTHS[mi] }); }
    const catData = {};
    months.forEach(({ year, month }) => {
      transactions.filter(t => t.type === 'expense' && t.status === 'paid' && t.month === month && (t.year || 2026) === year).forEach(t => {
        const c = t.category || 'أخرى';
        if (!catData[c]) catData[c] = { total: 0, samples: 0 };
        catData[c].total += safeNumber(t.amount); catData[c].samples++;
      });
    });
    const avgPerCat = {}; let grandTotal = 0;
    Object.entries(catData).forEach(([cat, d]) => { avgPerCat[cat] = d.total / months.length; grandTotal += avgPerCat[cat]; });
    const monthsWithData = months.filter(m => transactions.some(t => t.type === 'expense' && t.status === 'paid' && t.month === m.month && (t.year || 2026) === m.year)).length;
    return { months, avgPerCat, grandTotal, monthsWithData };
  }, [transactions, selectedYear, selectedMonth]);

  const committed = useMemo(() => {
    const items = [];
    updatedLoans.filter(l => !l.isReceivable && !l.autoGenerated && safeNumber(l.monthlyInstallment) > 0 && l.remaining > 0).forEach(l => items.push({ name: l.name, amount: safeNumber(l.monthlyInstallment) }));
    updatedLoans.filter(l => l.autoGenerated && l.remaining > 0).forEach(l => items.push({ name: l.name, amount: safeNumber(l.remaining) }));
    recurringItems.filter(r => r.type === 'expense').forEach(r => items.push({ name: r.title, amount: safeNumber(r.amount) }));
    return { items, total: items.reduce((s, i) => s + i.amount, 0) };
  }, [updatedLoans, recurringItems]);

  const income = useMemo(() => {
    const items = [];
    recurringItems.filter(r => r.type === 'income').forEach(r => items.push({ name: r.title, amount: safeNumber(r.amount) }));
    return { items, total: items.reduce((s, i) => s + i.amount, 0) };
  }, [recurringItems]);

  const projection = useMemo(() => {
    const result = [];
    let balance = ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(liveBalances[k]), 0);
    const committedCats = new Set();
    updatedLoans.forEach(l => l.autoMonthly && committedCats.add(l.category));
    recurringItems.filter(r => r.type === 'expense').forEach(r => committedCats.add(r.category));
    let y = selectedYear, mi = getMonthIndex(selectedMonth);
    for (let i = 1; i <= 2; i++) {
      mi++; if (mi > 11) { mi = 0; y++; }
      const month = ALL_MONTHS[mi];
      const plan = monthlyPlans?.[makeMonthKey(y, month)] || {};
      const planInc = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent) + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE) + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedCash);
      const inc = planInc > 0 ? planInc : income.total;
      const comm = committed.total;
      let variable = 0;
      Object.entries(historical.avgPerCat).forEach(([cat, avg]) => { if (!committedCats.has(cat)) variable += avg; });
      const exp = comm + variable;
      const closing = balance + inc - exp;
      result.push({ year: y, month, opening: balance, income: inc, committed: comm, variable, closing, savings: inc - exp, safety: closing > 0 && (inc - exp) > 0 ? 'safe' : closing > 0 ? 'warn' : 'danger' });
      balance = closing;
    }
    return result;
  }, [selectedYear, selectedMonth, liveBalances, committed, income, historical, monthlyPlans, updatedLoans, recurringItems]);

  const confidence = useMemo(() => {
    const n = historical.monthsWithData;
    if (n >= 3) return { level: 'مرتفعة', pct: 90, cls: 'badge-success' };
    if (n >= 2) return { level: 'متوسطة', pct: 75, cls: 'badge-warning' };
    if (n >= 1) return { level: 'منخفضة', pct: 60, cls: 'badge-warning' };
    return { level: 'غير كافية', pct: 0, cls: 'badge-danger' };
  }, [historical.monthsWithData]);

  const liveTotal = ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(liveBalances[k]), 0);

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card flex justify-between items-center flex-wrap gap-3">
        <div>
          <h2 className="text-base font-black flex items-center gap-2"><LineChart className="text-teal-500" size={18} /> توقع السيولة</h2>
          <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>شهرين قادمين</p>
        </div>
        <div className={`badge ${confidence.cls} px-2.5 py-1.5 text-[10px]`}>دقة {confidence.pct}%</div>
      </div>
      <div className="grid grid-cols-3 gap-2">
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الرصيد</p><p className="text-sm font-black text-blue-600 mt-1">{fmt(liveTotal, 0)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>مصروف</p><p className="text-sm font-black text-amber-600 mt-1">{fmt(historical.grandTotal, 0)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>دخل</p><p className="text-sm font-black text-emerald-600 mt-1">{fmt(income.total, 0)}</p></div>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
        {projection.map((p, idx) => (
          <div key={idx} className="card">
            <div className="flex justify-between items-center mb-3">
              <h3 className="text-base font-black">{p.month} {p.year}</h3>
              <span className={`badge text-[10px] ${p.safety === 'safe' ? 'badge-success' : p.safety === 'warn' ? 'badge-warning' : 'badge-danger'}`}>{p.safety === 'safe' ? 'آمن' : p.safety === 'warn' ? 'انتباه' : 'خطر'}</span>
            </div>
            <div className="space-y-1.5 text-xs">
              <ForecastRow label="افتتاحي" value={p.opening} color="text-slate-600" />
              <ForecastRow label="دخل" value={p.income} color="text-emerald-600" prefix="+" />
              <ForecastRow label="ثابت" value={p.committed} color="text-red-500" prefix="-" />
              <ForecastRow label="متغير" value={p.variable} color="text-orange-500" prefix="-" />
              <div className="pt-2 mt-2" style={{ borderTop: '1px dashed var(--border-default)' }}>
                <div className="flex justify-between items-center">
                  <span className="font-black text-xs">المتوقع</span>
                  <span className={`text-lg font-black ${p.closing >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(p.closing, 0)}</span>
                </div>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
});

const PinLockScreen = ({ onSuccess, onLogout }) => {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const [success, setSuccess] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const [lastPressed, setLastPressed] = useState(null);
  const handleDigit = (d) => {
    if (pin.length >= 4 || success) return;
    const next = pin + d;
    setPin(next);
    setLastPressed(d);
    setTimeout(() => setLastPressed(null), 150);
    if (next.length === 4) {
      setTimeout(() => {
        if (next === CORRECT_PIN) { setSuccess(true); setTimeout(() => onSuccess(), 500); }
        else { setError(true); setAttempts(a => a + 1); setTimeout(() => { setPin(''); setError(false); }, 650); }
      }, 150);
    }
  };
  const handleDelete = () => { if (!success) setPin(p => p.slice(0, -1)); };
  return (
    <div className="min-h-screen flex items-center justify-center p-6 relative overflow-hidden" style={{ background: 'radial-gradient(ellipse at top, #2A2418 0%, #1A1508 55%, #0F0B04 100%)' }}>
      <div className={`relative w-full max-w-sm ${error ? 'animate-shake' : ''}`}>
        <div className="flex flex-col items-center mb-8">
          <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mb-4 transition-all duration-500 ${success ? 'bg-emerald-500 scale-110 shadow-2xl shadow-emerald-500/40' : error ? 'bg-red-500/20 border border-red-500/30' : 'bg-blue-500/10 border border-blue-500/20'}`}>
            {success ? <CheckCircle2 size={28} className="text-white" /> : error ? <AlertTriangle size={26} className="text-red-400" /> : <Lock size={26} className="text-blue-400" />}
          </div>
          <h1 className="text-xl font-black text-white mb-1">{success ? 'مرحباً ✓' : error ? 'رمز غير صحيح' : 'أهلاً بعودتك'}</h1>
          <p className="text-xs font-medium" style={{ color: '#8A8270' }}>{success ? 'جارٍ الفتح...' : error ? `محاولة ${attempts}` : 'أدخل الرمز'}</p>
        </div>
        <div className="flex justify-center gap-3 mb-8 h-4">
          {[0, 1, 2, 3].map(i => (
            <div key={i} className={`w-3 h-3 rounded-full transition-all duration-300 ${success ? 'bg-emerald-400 scale-125' : error ? 'bg-red-500 scale-110' : pin.length > i ? 'bg-blue-400 scale-125' : 'bg-transparent border-2 border-slate-600'}`}></div>
          ))}
        </div>
        <div className="grid grid-cols-3 gap-3 mb-6">
          {['1','2','3','4','5','6','7','8','9'].map(d => (
            <button key={d} type="button" onClick={() => handleDigit(d)} className={`aspect-square rounded-2xl font-black text-xl transition-all duration-100 active:scale-90 select-none ${lastPressed === d ? 'bg-blue-500 text-white scale-95' : 'bg-white/[0.04] border border-white/[0.08] text-white hover:bg-white/[0.09]'}`}>{d}</button>
          ))}
          <div className="aspect-square"></div>
          <button type="button" onClick={() => handleDigit('0')} className={`aspect-square rounded-2xl font-black text-xl transition-all duration-100 active:scale-90 select-none ${lastPressed === '0' ? 'bg-blue-500 text-white scale-95' : 'bg-white/[0.04] border border-white/[0.08] text-white hover:bg-white/[0.09]'}`}>0</button>
          <button type="button" onClick={handleDelete} className="aspect-square rounded-2xl flex items-center justify-center transition-all active:scale-90" style={{ color: '#8A8270' }}><Delete size={20} /></button>
        </div>
        <button type="button" onClick={onLogout} className="w-full py-3 text-xs font-bold flex items-center justify-center gap-2 transition-colors" style={{ color: '#8A8270' }}><LogOut size={14} /> تسجيل الخروج</button>
      </div>
    </div>
  );
};

function dataReducer(state, action) {
  switch (action.type) {
    case 'SET_DATA': return { ...state, data: action.payload };
    case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
    case 'SET_SELECTED_YEAR': return { ...state, selectedYear: action.payload, selectedMonth: getMonthsForYear(action.payload).includes(state.selectedMonth) ? state.selectedMonth : getMonthsForYear(action.payload)[0] };
    case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
    case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
    case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
    case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
    case 'SET_FORM_DATA': return { ...state, formData: action.payload };
    case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
    case 'SET_FORM_ERRORS': return { ...state, formErrors: action.payload };
    case 'SET_ACTIVE_CATEGORY_DETAIL': return { ...state, activeCategoryDetail: action.payload };
    case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
    case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
    case 'SET_BUDGETS': return { ...state, budgets: action.payload };
    case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
    case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
    case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
    case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
    case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
    case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
    case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
    case 'SET_AI_MODAL_OPEN': return { ...state, isAiModalOpen: action.payload };
    case 'SET_AI_RESPONSE': return { ...state, aiResponse: action.payload };
    case 'SET_AI_LOADING': return { ...state, isAiLoading: action.payload };
    case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
    case 'ADD_NOTIFICATION': return { ...state, notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }] };
    case 'REMOVE_NOTIFICATION': return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
    case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
    case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
    case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
    case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
    case 'UPDATE_CUSTODY_ENTRIES': return { ...state, data: { ...state.data, custodyEntries: action.payload } };
    case 'UPDATE_CASHBACK_TRACKERS': return { ...state, data: { ...state.data, cashbackTrackers: action.payload } };
    case 'UPDATE_ACCOUNTS': {
      const oldA = state.data.accountsData || {};
      let changed = false;
      ACCOUNT_KEYS.forEach(k => { if (safeNumber(oldA[k]?.balance) !== safeNumber(action.payload[k]?.balance)) changed = true; });
      return { ...state, data: { ...state.data, accountsData: action.payload, ...(changed ? { monthlySnapshots: {} } : {}) } };
    }
    case 'UPDATE_MONTHLY_PLANS': return { ...state, data: { ...state.data, monthlyPlans: action.payload } };
    case 'ADD_TO_HISTORY': { const limited = [...state.history].slice(-19); return { ...state, history: [...limited, action.payload], future: [] }; }
    case 'UNDO': {
      if (state.history.length === 0) return state;
      const prev = state.history[state.history.length - 1];
      return { ...state, data: prev.data || prev, budgets: prev.budgets !== undefined ? prev.budgets : state.budgets, history: state.history.slice(0, -1), future: [{ data: state.data, budgets: state.budgets }, ...state.future] };
    }
    case 'TOGGLE_LEDGER': return { ...state, expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] } };
    case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };
    case 'SET_STATUS_FILTER': return { ...state, statusFilter: action.payload };
    case 'SHOW_CONFIRM': return { ...state, confirmDialog: { isOpen: true, title: action.title, message: action.message, onConfirm: action.onConfirm, onCancel: action.onCancel, danger: action.danger || false } };
    case 'HIDE_CONFIRM': return { ...state, confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false } };
    case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
    case 'SET_QUICK_TRANSFER_DATA': return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
    case 'SET_VIEWING_CARD_STATEMENT': return { ...state, viewingCardStatement: action.payload };
    case 'CLOSE_MONTH': {
      const { year, month } = action.payload;
      const monthKey = makeMonthKey(year, month);
      const monthEnd = new Date(year, getMonthIndex(month) + 1, 0, 23, 59, 59);
      const snap = {};
      ACCOUNT_KEYS.forEach(k => { snap[k] = computeBalance(state.data, k, monthEnd); });
