          )}

          {comparison && (
            <div className="p-2.5 rounded-lg grid grid-cols-3 gap-2 text-center" style={{ background: 'var(--bg-muted)' }}>
              <div>
                <p className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>هذا الشهر</p>
                <p className="text-[12px] font-black text-red-600 mt-0.5 money tabular">{fmt(comparison.cur)}</p>
              </div>
              <div>
                <p className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>الشهر السابق</p>
                <p className="text-[12px] font-black mt-0.5 money tabular" style={{ color: 'var(--text-secondary)' }}>{fmt(comparison.prev)}</p>
              </div>
              <div>
                <p className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>الفرق</p>
                <p className={`text-[12px] font-black mt-0.5 money tabular ${comparison.direction === 'up' ? 'text-red-600' : comparison.direction === 'down' ? 'text-emerald-600' : 'text-slate-500'}`}>
                  {comparison.diff >= 0 ? '+' : ''}{fmt(comparison.diff)}
                </p>
              </div>
            </div>
          )}

          {top3.length > 0 && !searchTerm && (
            <div className="p-2.5 rounded-lg" style={{ background: 'rgba(99, 91, 255, 0.06)' }}>
              <p className="text-[10px] font-black text-[color:var(--accent)] mb-2">🏆 أعلى 3 أصناف</p>
              <div className="space-y-1">
                {top3.map((g, i) => (
                  <div key={g.name} className="flex justify-between items-center text-[10px]">
                    <span className="font-bold truncate flex items-center gap-1.5">
                      <span className="text-[11px]">{['🥇','🥈','🥉'][i]}</span>
                      <span className="truncate">{g.name}</span>
                    </span>
                    <span className="font-black text-[color:var(--accent)] flex-shrink-0 money tabular">{fmt(g.total)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {filteredItems.length === 0 ? (
            <div className="text-center py-6 text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>
              {searchTerm ? '🔍 لا توجد نتائج للبحث' : 'لا توجد مسحوبات معتمدة'}
            </div>
          ) : viewMode === 'list' ? (
            <div className="space-y-1.5 max-h-80 overflow-y-auto scroll-hide pdf-expand">
              {sortedItems.map(item => (
                <div key={item.id} className="flex justify-between items-center gap-2 p-2 rounded-lg text-[11px]" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                  <div className="min-w-0 flex-1">
                    <p className="font-bold truncate flex items-center gap-1.5 flex-wrap">
                      <span className="truncate">{item.description || 'بدون وصف'}</span>
                      {item.subCategory && <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[8.5px] font-black flex-shrink-0" style={{ background: 'var(--accent-soft)', color: 'var(--accent)', border: '1px solid rgba(99,91,255,0.2)' }}>{item.subCategory}</span>}
                    </p>
                    <p className="text-[9px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>{item.date} • {PAYMENT_METHODS.find(p => p.id === item.method)?.label || item.method}</p>
                  </div>
                  <span className="font-black text-red-600 flex-shrink-0 money tabular">{fmt(item.amount)}</span>
                </div>
              ))}
            </div>
          ) : (
            <div className="space-y-1.5 max-h-80 overflow-y-auto scroll-hide pdf-expand">
              {groupedItems.map(g => (
                <div key={g.name} className="flex justify-between items-center gap-2 p-2.5 rounded-lg text-[11px]" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                  <div className="min-w-0 flex-1">
                    <p className="font-bold truncate flex items-center gap-1.5 flex-wrap">
                      <span className="truncate">{g.name}</span>
                      {g.subCategory && <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[8.5px] font-black flex-shrink-0" style={{ background: 'var(--accent-soft)', color: 'var(--accent)', border: '1px solid rgba(99,91,255,0.2)' }}>{g.subCategory}</span>}
                    </p>
                    <p className="text-[9px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>عدد: <span className="money tabular">{g.count}</span> • متوسط: <span className="money tabular">{fmt(g.total / g.count)}</span></p>
                  </div>
                  <span className="font-black text-red-600 flex-shrink-0 money tabular">{fmt(g.total)}</span>
                </div>
              ))}
            </div>
          )}

          <div className="flex justify-between items-center p-2.5 rounded-lg" style={{ background: 'rgba(220, 38, 38, 0.08)' }}>
            <span className="text-[10px] font-bold text-red-700 dark:text-red-400">
              {searchTerm ? `نتائج البحث (${filteredItems.length} من ${paidItems.length})` : `إجمالي المعتمد (${paidItems.length} مسحوبة)`}
            </span>
            <span className="font-black text-red-600 text-[13px] money tabular">{fmt(totalFiltered)}</span>
          </div>

          {items.length > paidItems.length && (
            <div className="flex justify-between items-center p-2 rounded-lg" style={{ background: 'rgba(245, 158, 11, 0.08)' }}>
              <span className="text-[10px] font-bold text-amber-700 dark:text-amber-400">⏳ معلق ({items.length - paidItems.length})</span>
              <span className="font-black text-amber-600 text-[12px] money tabular">{fmt(totalAllAmount - totalFiltered)}</span>
            </div>
          )}

          {bySubCategory.length > 0 && (
            <div className="p-3 rounded-lg animate-fadeIn" style={{ background: 'var(--bg-muted)', border: '1px solid var(--border-subtle)' }}>
              <div className="flex items-center justify-between mb-3">
                <p className="text-[10px] font-black" style={{ color: 'var(--text-secondary)' }}>📊 التوزيع بالفئات</p>
                <span className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>{bySubCategory.length} فئة</span>
              </div>
              <div className="space-y-2">
                {bySubCategory.map((sub, i) => {
                  const pct = totalFiltered > 0 ? (sub.total / totalFiltered) * 100 : 0;
                  return (
                    <div key={sub.label}>
                      <div className="flex justify-between items-center text-[10px] mb-1">
                        <div className="flex items-center gap-1.5 min-w-0 flex-1">
                          <span className="font-black text-[11px] flex-shrink-0" style={{ color: 'var(--accent)' }}>#{i + 1}</span>
                          <span className="font-bold truncate">{sub.label}</span>
                          <span className="text-[9px] flex-shrink-0" style={{ color: 'var(--text-muted)' }}>({sub.count})</span>
                        </div>
                        <div className="flex items-center gap-2 flex-shrink-0">
                          <span className="font-black money tabular text-red-600">{fmt(sub.total)}</span>
                          <span className="text-[9px] font-bold tabular" style={{ color: 'var(--text-muted)' }}>{Math.round(pct)}%</span>
                        </div>
                      </div>
                      <div className="w-full rounded-full h-1.5 overflow-hidden" style={{ background: 'var(--bg-card)' }}>
                        <div className="h-full transition-all duration-500" style={{ width: pct + '%', background: i === 0 ? 'linear-gradient(90deg, #DC2626, #F87171)' : i === 1 ? 'linear-gradient(90deg, #F59E0B, #FBBF24)' : i === 2 ? 'linear-gradient(90deg, #635BFF, #8B84FF)' : 'linear-gradient(90deg, #0EA5E9, #38BDF8)' }} />
                      </div>
                    </div>
                  );
                })}
              </div>
              <p className="text-[9px] mt-3 pt-2 text-center font-bold" style={{ color: 'var(--text-muted)', borderTop: '1px dashed var(--border-default)' }}>
                💡 {bySubCategory[0].label} = {Math.round((bySubCategory[0].total / totalFiltered) * 100)}% من مصروفاتك
              </p>
            </div>
          )}

          <p className="text-[9px] text-center font-semibold" style={{ color: 'var(--text-muted)' }}>
            تم الانشاء بواسطة المحفظة الذكية — {new Date().toLocaleDateString('ar-EG')}
          </p>
        </div>
      )}
    </div>
  );
});

const LoansView = memo(({
  updatedLoans, cards, recurringItems, transactions, dispatch, deleteRecurring,
  saveHistory, getLocalISODate, addNotification, data, selectedMonth, selectedYear
}) => {
  const [showAdd, setShowAdd] = useState(false);
  const [activeTab, setActiveTab] = useState('loans');
  const [newLoan, setNewLoan] = useState({ name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false });
  const settlingRef = useRef(false);

  const openRecurringEdit = useCallback((item) => {
    dispatch({
      type: 'SET_RECURRING_FORM_DATA',
      payload: {
        id: item.id, title: item.title, amount: String(item.amount), day: item.day,
        category: item.category, type: item.type, startMonth: item.startMonth || '',
        endMonth: item.endMonth || '', active: item.active !== false,
        kind: item.kind || null, linkedLoanSystemId: item.linkedLoanSystemId || null,
        linkedCardId: item.linkedCardId || null, method: item.method || 'cash',
        transferChannel: item.transferChannel || null
      }
    });
    dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: true });
  }, [dispatch]);

  const hanyByMonth = useMemo(() => {
    const map = {};
    updatedLoans.filter(l => l.autoGenerated).forEach(l => { map[`${l.year}-${l.month}`] = l; });
    return map;
  }, [updatedLoans]);

  const getPrevMonth = useCallback((month, year) => {
    const idx = getMonthIndex(month);
    if (idx <= 0) return { month: 'ديسمبر', year: year - 1 };
    return { month: ALL_MONTHS[idx - 1], year };
  }, []);
  const settleHany = async (loan) => {
    if (settlingRef.current) { addNotification({ type: 'info', title: 'العملية جارية...' }); return; }
    settlingRef.current = true;
    try {
      const total = safeNumber(loan.totalAmount);
      const paidAlready = safeNumber(loan.totalPaid);
      const remaining = Math.max(0, total - paidAlready);
      if (remaining <= 0.005) { addNotification({ type: 'info', title: 'مسدد بالكامل' }); return; }
      const monthLabel = `${loan.month} ${loan.year}`;
      const monthKey = makeMonthKey(loan.year, loan.month);

      if (isMonthClosed(data, loan.year, loan.month)) {
        addNotification({ type: 'error', title: 'شهر المسحوبات مغلق', message: `شهر ${loan.month} ${loan.year} مغلق`, duration: 7000 });
        return;
      }
      const alreadySettled = Array.isArray(data.settledHanyMonths) && data.settledHanyMonths.includes(monthKey);
      if (alreadySettled) { addNotification({ type: 'info', title: 'تمت التسوية مسبقاً' }); return; }

      // ─── 1️⃣ خطوة 1: اسأل عن المبلغ ───
      const input = await showInputModal({
        title: 'تسوية مسحوبات محل هاني', icon: '💰',
        message: `الإجمالي: ${fmt(total)}\nمدفوع: ${fmt(paidAlready)}\nالمتبقي: ${fmt(remaining)}\n\nالمبلغ المدفوع الآن:`,
        inputValue: String(remaining), numeric: true, confirmText: 'التالي'
      });
      if (input === null) return;

      const paidNow = roundMoney(parseNumberInput(input));
      if (paidNow <= 0) { addNotification({ type: 'error', title: 'مبلغ غير صحيح' }); return; }
      if (paidNow > remaining + 0.005) { addNotification({ type: 'error', title: `الحد الأقصى ${fmt(remaining)}` }); return; }

      // ─── 2️⃣ خطوة 2: اسأل من أي حساب تدفع ───
      const liveBalances = computeBalancesAsOf(data);
      const accountOptions = [
        { id: 'cash',         label: 'Cash (كاش)',           bal: safeNumber(liveBalances.cash) },
        { id: 'cib_savings',  label: 'CIB Savings',          bal: safeNumber(liveBalances.cib_savings) },
        { id: 'aaib_savings', label: 'AAIB Savings',         bal: safeNumber(liveBalances.aaib_savings) },
        { id: 'fawry',        label: 'Fawry (محفظة)',        bal: safeNumber(liveBalances.fawry) },
        { id: 'etisalat',     label: 'Etisalat (محفظة)',     bal: safeNumber(liveBalances.etisalat) }
      ];
      const accountMessage = accountOptions.map((acc, i) => 
        `${i + 1} = ${acc.label}  →  ${fmt(acc.bal)} ج.م`
      ).join('\n') + '\n\nاكتب رقم الحساب:';

      const accountChoice = await showInputModal({
        title: 'من أي حساب تدفع؟',
        icon: '🏦',
        message: `المبلغ: ${fmt(paidNow)} ج.م\n\n${accountMessage}`,
        inputValue: '2',  // افتراضي: CIB Savings
        numeric: true,
        confirmText: 'تسوية'
      });
      if (accountChoice === null) return;

      const accIdx = parseInt(accountChoice, 10) - 1;
      if (accIdx < 0 || accIdx >= accountOptions.length) {
        addNotification({ type: 'error', title: 'اختيار غير صحيح' });
        return;
      }
      const chosenAccount = accountOptions[accIdx];

      // ─── 3️⃣ التحقق من كفاية الرصيد ───
      if (chosenAccount.bal < paidNow - 0.005) {
        addNotification({
          type: 'error',
          title: '⚠️ رصيد غير كافٍ',
          message: `${chosenAccount.label}: ${fmt(chosenAccount.bal)} ج.م — المطلوب ${fmt(paidNow)} ج.م`,
          duration: 8000
        });
        return;
      }

      // ─── 4️⃣ حساب الترحيل ───
      const newRemaining = remaining - paidNow;
      const willCarry = newRemaining > 0.005;
      let nextMIdx = 0, nextY = loan.year, nextMonthName = '';

      if (willCarry) {
        const monthIdx = getMonthIndex(loan.month);
        nextMIdx = monthIdx + 1;
        nextY = loan.year;
        if (nextMIdx > 11) { nextMIdx = 0; nextY++; }
        nextMonthName = ALL_MONTHS[nextMIdx];
        const nextMonthKey = makeMonthKey(nextY, nextMonthName);
        if ((data.closedMonths || []).includes(nextMonthKey)) {
          addNotification({ type: 'error', title: 'لا يمكن الترحيل', message: `شهر ${nextMonthName} ${nextY} مغلق.`, duration: 7000 });
          return;
        }
      }

      // ─── 5️⃣ تنفيذ العملية ───
      saveHistory();
      const loanMonthIdx = getMonthIndex(loan.month);
      const nowDate = new Date();
      const maxDayInLoanMonth = new Date(loan.year, loanMonthIdx + 1, 0).getDate();
      const actualPayDay = Math.min(nowDate.getDate(), maxDayInLoanMonth);
      const paymentDate = `${loan.year}-${String(loanMonthIdx + 1).padStart(2, '0')}-${String(actualPayDay).padStart(2, '0')}`;
      const newTxs = [];

      // ⭐ معاملة السداد (بالحساب المختار)
      newTxs.push({
        id: 'hany-pay-' + getSafeId(),
        type: 'expense',
        kind: 'financial',
        category: 'الالتزامات البنكية والتمويلية',
        amount: paidNow,
        description: `سداد مسحوبات هاني — ${loan.month} ${loan.year}`,
        method: chosenAccount.id,     // ← الحساب المختار
        date: paymentDate,
        month: loan.month, year: loan.year, monthIndex: loanMonthIdx,
        subType: 'withdrawal',
        status: 'paid',
        linkedLoanId: loan.id,
        settledHanyMonth: monthKey,
        createdAt: new Date().toISOString()
      });

      // ⭐ رصيد مرحّل للشهر التالي (لو فيه باقي)
      if (willCarry) {
        const nextMonthMaxDay = new Date(nextY, nextMIdx + 1, 0).getDate();
        const nextActualDay = Math.min(nowDate.getDate(), nextMonthMaxDay);
        const nextMonthDate = `${nextY}-${String(nextMIdx + 1).padStart(2, '0')}-${String(nextActualDay).padStart(2, '0')}`;
        newTxs.push({
          id: 'hany-carry-' + getSafeId(),
          type: 'expense',
          kind: 'operational',
          category: 'مسحوبات محل هاني',
          subCategory: 'رصيد مرحل',
          amount: newRemaining,
          description: `رصيد مرحل من ${loan.month} ${loan.year}`,
          method: 'cash',                     // ← الرصيد المرحل مش مربوط بحساب (مؤجل)
          date: nextMonthDate,
          month: nextMonthName, year: nextY, monthIndex: nextMIdx,
          subType: 'withdrawal',
          status: 'pending',                  // ← pending (مؤجل)
          source: 'carryover',
          carriedFromSource: 'hany-auto',
          carryoverFrom: monthLabel,
          carryCount: 1,
          createdAt: new Date().toISOString()
        });
      }

      const newSettled = Array.isArray(data.settledHanyMonths)
        ? [...data.settledHanyMonths, monthKey]
        : [monthKey];

      dispatch({
        type: 'SET_DATA',
        payload: {
          ...data,
          settledHanyMonths: newSettled,
          transactions: sortTransactions([...newTxs, ...(data.transactions || [])])
        }
      });

      // ─── 6️⃣ إشعارات ───
      const successMsg = willCarry
        ? `دفعت ${fmt(paidNow)} من ${chosenAccount.label} • المتبقي ${fmt(newRemaining)} رُحّل لشهر ${nextMonthName}`
        : `دفعت ${fmt(paidNow)} من ${chosenAccount.label} • تم السداد بالكامل`;
      addNotification({
        type: 'success',
        title: `✅ تمت التسوية بنجاح`,
        message: successMsg,
        duration: 8000
      });

    } finally {
      settlingRef.current = false;
    }
  };
  
  const totalLoans = useMemo(() => updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const totalReceivable = useMemo(() => updatedLoans.filter(l => l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const payables = useMemo(() => updatedLoans.filter(l => !l.isReceivable), [updatedLoans]);
  const receivables = useMemo(() => updatedLoans.filter(l => l.isReceivable), [updatedLoans]);
  const totalCards = useMemo(() => cards.reduce((acc, c) => acc + Math.max(0, computeCardDebt(data, c)), 0), [cards, data]);
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);

  const addLoan = () => {
    const nameCheck = validateText(newLoan.name, { min: 2, max: 200, label: 'الاسم' });
    if (!nameCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: nameCheck.error }); return; }
    const amountCheck = validateAmount(newLoan.totalAmount, { min: 0.01, max: 10000000, label: 'المبلغ' });
    if (!amountCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: amountCheck.error }); return; }
    saveHistory();
    dispatch({
      type: 'UPDATE_LOANS',
      payload: [...updatedLoans, {
        id: Date.now(), name: nameCheck.value, totalAmount: roundMoney(amountCheck.value),
        prePaidAmount: 0, monthlyInstallment: roundMoney(safeNumber(newLoan.monthlyInstallment)),
        dueDay: safeNumber(newLoan.dueDay, 1), interest: '', description: newLoan.description || '',
        type: newLoan.isReceivable ? 'receivable' : 'debt', isReceivable: newLoan.isReceivable, paused: false
      }]
    });
    setShowAdd(false);
    setNewLoan({ name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false });
    addNotification({ type: 'success', title: 'تمت الإضافة' });
  };

  const handleCollectReceivable = (loan, sourceTx) => {
    const d = new Date();
    const y = d.getFullYear(), m = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, y, m)) { addNotification({ type: 'error', title: 'الشهر مغلق' }); return; }

    const alreadyCollected = transactions.some(t => t.sourceReceivableId === loan.id && t.month === m && (t.year || y) === y && t.status === 'paid');
    if (alreadyCollected) { addNotification({ type: 'warning', title: '⚠️ تم التحصيل مسبقاً هذا الشهر', message: `دفعة ${m} ${y} محصّلة بالفعل`, duration: 6000 }); return; }

    saveHistory();
    if (sourceTx) {
      dispatch({
        type: 'UPDATE_TRANSACTIONS',
        payload: transactions.map(t => t.id === sourceTx.id ? { ...t, status: 'paid', date: getLocalISODate(d), sourceReceivableId: loan.id } : t)
      });
      addNotification({ type: 'success', title: 'تم اعتماد القسط', message: `${fmt(sourceTx.amount)} ج.م` });
      return;
    }
    const orphanPending = transactions.find(t =>
      t.status !== 'paid' && t.month === m && (t.year || y) === y
      && t.category === 'تكييف محمود' && !t.sourceReceivableId
      && safeNumber(t.amount) === safeNumber(loan.monthlyInstallment)
    );
    if (orphanPending) {
      dispatch({
        type: 'UPDATE_TRANSACTIONS',
        payload: transactions.map(t => t.id === orphanPending.id ? { ...t, status: 'paid', date: getLocalISODate(d), sourceReceivableId: loan.id } : t)
      });
      addNotification({ type: 'success', title: 'تم اعتماد القيد المعلق', message: `${fmt(orphanPending.amount)} ج.م` });
      return;
    }
    const newTx = {
      id: 'recv-manual-' + getSafeId(), type: 'income', kind: KIND.OPERATIONAL, category: 'تكييف محمود',
      amount: safeNumber(loan.monthlyInstallment),
      description: `تحصيل قسط ${loan.name} — ${m} ${y}`,
      method: 'cash', date: getLocalISODate(d), month: m, year: y, monthIndex: d.getMonth(),
      subType: 'deposit', status: 'paid', sourceReceivableId: loan.id,
      createdAt: new Date().toISOString()
    };
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: sortTransactions([newTx, ...transactions]) });
    addNotification({ type: 'success', title: 'تم التحصيل', message: `${fmt(loan.monthlyInstallment)} ج.م` });
  };

  const handleTogglePause = (loan) => {
    saveHistory();
    dispatch({ type: 'UPDATE_LOANS', payload: (data.loans || []).map(l => l.id === loan.id ? { ...l, paused: !l.paused } : l) });
    addNotification({ type: loan.paused ? 'success' : 'warning', title: loan.paused ? 'تم التفعيل' : 'تم الإيقاف المؤقت' });
  };

  const toggleRecurringActive = (id) => {
    saveHistory();
    dispatch({ type: 'UPDATE_RECURRING_ITEMS', payload: recurringItems.map(r => r.id === id ? { ...r, active: r.active === false } : r) });
    addNotification({ type: 'success', title: 'تم التحديث' });
  };

  const hasLoans = updatedLoans.length > 0;
  const hasRecurring = recurringItems.length > 0;

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="sub-tab-switcher">
        <button onClick={() => setActiveTab('loans')} className={`sub-tab-btn ${activeTab === 'loans' ? 'active' : ''}`}>
          <Banknote size={14} /> القروض والمستحقات
        </button>
        <button onClick={() => setActiveTab('custody')} className={`sub-tab-btn ${activeTab === 'custody' ? 'active' : ''}`}>
          <Briefcase size={14} /> العهدة
          {custodySummary.balance !== 0 && <span className="badge badge-warning text-[9px] px-1.5 py-0 money tabular">{fmt(custodySummary.balance)}</span>}
        </button>
      </div>

      {activeTab === 'custody' ? (
        <CustodyView data={data} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />
      ) : (
        <React.Fragment>
          <div className="card">
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>إجمالي المديونية الصافية</p>
            <h2 className="text-3xl font-black tracking-tight text-gradient money tabular">
              {fmt(totalLoans + totalCards - totalReceivable)}
              <span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <div className="grid grid-cols-3 gap-2 mt-3">
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">القروض</p>
                <p className="text-xs font-black text-red-600 money tabular">{fmt(totalLoans)}</p>
              </div>
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">البطاقات</p>
                <p className="text-xs font-black text-red-600 money tabular">{fmt(totalCards)}</p>
              </div>
              <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
                <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">مستحقات لك</p>
                <p className="text-xs font-black text-emerald-600 money tabular">{fmt(totalReceivable)}</p>
              </div>
            </div>
            <div className="flex gap-2 mt-3 flex-wrap">
              <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs flex-1"><Plus size={14} /> إضافة التزام</button>
              <button onClick={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: true })} className="btn btn-secondary text-xs flex-1"><Repeat size={14} /> متكرر</button>
            </div>
          </div>

          {showAdd && (
            <Modal isOpen={true} onClose={() => setShowAdd(false)} title="التزام جديد" icon="📋">
              <div className="space-y-3">
                <div>
                  <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الاسم *</label>
                  <input className="input-field text-sm" value={newLoan.name} onChange={e => setNewLoan({ ...newLoan, name: e.target.value })} />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ *</label>
                    <input type="text" inputMode="decimal" className="input-field input-num text-sm" value={newLoan.totalAmount} onChange={e => setNewLoan({ ...newLoan, totalAmount: e.target.value })} />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>القسط</label>
                    <input type="text" inputMode="decimal" className="input-field input-num text-sm" value={newLoan.monthlyInstallment} onChange={e => setNewLoan({ ...newLoan, monthlyInstallment: e.target.value })} />
                  </div>
                </div>
                <label className="flex items-center gap-3 p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 cursor-pointer">
                  <input type="checkbox" checked={newLoan.isReceivable} onChange={e => setNewLoan({ ...newLoan, isReceivable: e.target.checked })} className="w-4 h-4 accent-emerald-600" />
                  <span className="text-xs font-bold text-emerald-700 dark:text-emerald-400">مستحق لي</span>
                </label>
                <button onClick={addLoan} className="btn btn-primary w-full py-2.5 text-sm">إضافة</button>
              </div>
            </Modal>
          )}

          {!hasLoans && !hasRecurring && (
            <div className="card text-center p-12">
              <Banknote size={40} className="mx-auto mb-3 text-[color:var(--accent)]" />
              <h3 className="text-base font-black mb-2">لا توجد التزامات بعد</h3>
              <p className="text-xs mb-4" style={{ color: 'var(--text-muted)' }}>أضف أول قرض أو بند متكرر لتبدأ المتابعة</p>
              <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs"><Plus size={14} /> إضافة أول التزام</button>
            </div>
          )}

          {receivables.length > 0 && (
            <div className="space-y-2">
              <h3 className="font-black text-sm flex items-center gap-2 text-emerald-600"><TrendingUp size={14} /> مستحقات لك ({receivables.length})</h3>
              {receivables.map(loan => {
                const monthly = safeNumber(loan.monthlyInstallment);
                const explicitTotal = safeNumber(loan.totalInstallments);
                const explicitPaid = safeNumber(loan.paidInstallments);
                const remainingMonths = monthly > 0 ? Math.ceil(safeNumber(loan.remaining) / monthly) : 0;
                const totalMonths = explicitTotal > 0 ? explicitTotal : (explicitPaid + remainingMonths);
                const paidMonths = explicitTotal > 0 ? explicitPaid : Math.max(0, totalMonths - remainingMonths);
                const pct = safeNumber(loan.totalAmount) > 0 ? (safeNumber(loan.totalPaid) / safeNumber(loan.totalAmount)) * 100 : 0;
                const isComplete = loan.remaining <= 0.005;
                const thisMonthCollected = transactions.some(t => t.sourceReceivableId === loan.id && t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status === 'paid');
                const thisMonthPending = transactions.find(t => t.sourceReceivableId === loan.id && t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status !== 'paid');
                return (
                  <div key={loan.id} className="card">
                    <div className="flex justify-between items-start gap-3 flex-wrap mb-3">
                      <div className="flex items-center gap-3 flex-1 min-w-0">
                        <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400 flex-shrink-0">
                          <TrendingUp size={20} />
                        </div>
                        <div className="min-w-0">
                          <h4 className="font-bold text-sm truncate flex items-center gap-2 flex-wrap">
                            {loan.name}
                            {loan.paused && <span className="badge badge-warning text-[10px]">⏸ موقوف</span>}
                          </h4>
                          <p className="text-[11px] text-emerald-600 font-semibold mt-0.5">
                            يوم {loan.dueDay} • <span className="money tabular">{fmt(monthly)}</span> ج.م شهريًا
                          </p>
                        </div>
                      </div>
                      <div className="flex gap-1">
                        <button type="button" aria-label="إيقاف" onClick={() => handleTogglePause(loan)} className={`btn btn-ghost p-2 ${loan.paused ? 'text-emerald-500' : 'text-amber-500'}`}>
                          {loan.paused ? <CheckCircle2 size={16} /> : <Clock size={16} />}
                        </button>
                        <button type="button" aria-label="تعديل" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: loan })} className="btn btn-ghost p-2">
                          <Edit size={16} />
                        </button>
                      </div>
                    </div>
                    <div className="grid grid-cols-3 gap-2 mb-3">
                      <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
                        <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">محصّل</p>
                        <p className="text-sm font-black text-emerald-600 mt-0.5 money tabular">{fmt(loan.totalPaid)}</p>
                      </div>
                      <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
                        <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">المتبقي</p>
                        <p className="text-sm font-black text-blue-600 mt-0.5 money tabular">{fmt(loan.remaining)}</p>
                      </div>
                      <div className="p-2.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-center">
                        <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">الأقساط</p>
                        <p className="text-sm font-black text-purple-600 mt-0.5 money tabular">{paidMonths}/{totalMonths}</p>
                      </div>
                    </div>
                    <div className="w-full rounded-full h-1.5 overflow-hidden mb-3" style={{ background: 'var(--bg-muted)' }}>
                      <div className="bg-emerald-500 h-full rounded-full transition-all" style={{ width: `${Math.min(100, pct)}%` }}></div>
                    </div>
                    <div className="flex justify-end gap-2 flex-wrap">
                      {thisMonthCollected ? (
                        <div className="badge badge-success px-3 py-1.5"><CheckCircle2 size={12} /> تم تحصيل {selectedMonth}</div>
                      ) : isComplete ? (
                        <div className="badge badge-success px-3 py-1.5"><CheckCircle2 size={12} /> اكتمل التحصيل</div>
                      ) : loan.paused ? (
                        <div className="badge badge-warning px-3 py-1.5">⏸ موقوف</div>
                      ) : thisMonthPending ? (
                        <button onClick={() => handleCollectReceivable(loan, thisMonthPending)} className="btn btn-primary text-xs">
                          <CheckCircle2 size={14} /> اعتماد <span className="money tabular">{fmt(thisMonthPending.amount)}</span>
                        </button>
                      ) : (
                        <button onClick={() => handleCollectReceivable(loan, null)} className="btn btn-primary text-xs">
                          <Banknote size={14} /> تحصيل <span className="money tabular">{fmt(monthly)}</span> الآن
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {payables.length > 0 && (
            <div className="space-y-2">
              <h3 className="font-black text-sm flex items-center gap-2 text-red-600"><TrendingDown size={14} /> مديونيات ({payables.length})</h3>
              {payables.map(loan => {
                const isPaid = loan.remaining <= 0;
                const pct = loan.totalAmount > 0 ? (loan.totalPaid / loan.totalAmount) * 100 : 0;
                const monthKeyForLoan = makeMonthKey(loan.year, loan.month);
                const hasCarryover = loan.autoGenerated && Array.isArray(data.settledHanyMonths) && data.settledHanyMonths.includes(monthKeyForLoan);
                const prevM = loan.autoGenerated ? getPrevMonth(loan.month, loan.year) : null;
                const prevMonthLoan = prevM ? hanyByMonth[`${prevM.year}-${prevM.month}`] : null;
                return (
                  <div key={loan.id} className="card py-3">
                    <div className="flex justify-between items-start gap-2 mb-2">
                      <div className="flex items-center gap-2 flex-1 min-w-0">
                        <div className={`p-1.5 rounded-lg flex-shrink-0 ${isPaid ? 'bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600' : 'bg-red-50 dark:bg-red-950/30 text-red-500'}`}>
                          {loan.autoGenerated ? <StoreIcon size={14} /> : <Banknote size={14} />}
                        </div>
                        <div className="min-w-0">
                          <h4 className="font-bold text-xs truncate">{loan.name}</h4>
                          <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                            يوم {loan.dueDay}{loan.autoGenerated && loan.items ? ` • ${loan.items.length} مسحوبة` : ''}
                          </p>
                        </div>
                      </div>
                      <div className="flex gap-0.5 flex-shrink-0">
                        <button type="button" aria-label="تعديل" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: loan })} className="btn btn-ghost p-1">
                          <Edit size={12} />
                        </button>
                      </div>
                    </div>
                    <div className="flex justify-between items-center mb-2">
                      <p className={`text-base font-black money tabular ${isPaid ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(loan.remaining)}</p>
                      <p className="text-xs font-bold money tabular" style={{ color: 'var(--text-muted)' }}>قسط: {fmt(loan.monthlyInstallment)}</p>
                    </div>
                    <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                      <div className="bg-emerald-500 h-full rounded-full" style={{ width: `${Math.min(100, pct)}%` }}></div>
                    </div>
                    {loan.autoGenerated && <HanyShopLedger loan={loan} prevMonthLoan={prevMonthLoan} addNotification={addNotification} />}
                    {!isPaid && (loan.monthlyInstallment > 0 || loan.autoGenerated) && (
                      <div className="flex justify-end gap-1.5 mt-2">
                        {loan.autoGenerated && (hasCarryover
                          ? <div className="badge badge-success text-[10px]">تمت التسوية</div>
                          : <button onClick={() => settleHany(loan)} className="btn btn-primary text-[10px] py-1 px-2"><CheckCircle2 size={10} /> تسوية</button>
                        )}
                        {!loan.autoGenerated && loan.monthlyInstallment > 0 && (
                          <button onClick={() => {
                            dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
                            dispatch({
                              type: 'SET_FORM_DATA',
                              payload: { type: 'expense', category: 'الالتزامات البنكية والتمويلية', amount: loan.monthlyInstallment, description: `قسط ${loan.name}`, linkedLoanId: loan.id, method: 'instapay', date: getLocalISODate(), status: 'pending', subType: 'withdrawal' }
                            });
                            dispatch({ type: 'SET_FORM_OPEN', payload: true });
                          }} className="btn btn-secondary text-[10px] py-1 px-2"><CheckCircle2 size={10} /> سداد</button>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {recurringItems.length > 0 && (
            <details className="card p-0 overflow-hidden">
              <summary className="p-4 cursor-pointer list-none flex items-center justify-between">
                <h3 className="font-black text-sm flex items-center gap-2"><Repeat size={14} className="text-blue-500" /> البنود المتكررة ({recurringItems.length})</h3>
                <ChevronDown size={14} style={{ color: 'var(--text-muted)' }} />
              </summary>
              <div className="px-4 pb-4 space-y-1.5" style={{ borderTop: '1px solid var(--border-subtle)', paddingTop: '12px' }}>
                {recurringItems.map(r => {
                  const isFee = BANK_FEE_CATEGORIES.has(r.category);
                  const isMonthlyBen = isBeneficiaryCategorySafe(r.category);
                  const isInactive = r.active === false;
                  const hasRange = r.startMonth || r.endMonth;
                  const methodLabel = PAYMENT_METHODS.find(p => p.id === r.method)?.label || r.method || 'Cash';
                  const transferLabel = r.transferChannel ? ` • عبر ${PAYMENT_METHODS.find(p => p.id === r.transferChannel)?.label || r.transferChannel}` : '';
                  const formatRange = (v) => {
                    if (!v) return '—';
                    const parts = String(v).split('-');
                    if (parts.length !== 2) return v;
                    const idx = parseInt(parts[1], 10) - 1;
                    return `${parts[0]}-${ALL_MONTHS[idx] || parts[1]}`;
                  };
                  return (
                    <div key={r.id} onClick={() => openRecurringEdit(r)}
                      className="flex justify-between items-center p-2 rounded-lg cursor-pointer transition-all hover:shadow-sm active:scale-[0.99]"
                      style={{ background: isMonthlyBen ? 'rgba(245,158,11,0.05)' : isFee ? 'rgba(220, 38, 38, 0.05)' : 'var(--bg-muted)', opacity: isInactive ? 0.5 : 1 }}>
                      <div className="min-w-0 flex-1">
                        <p className="font-bold text-xs truncate flex items-center gap-1 flex-wrap">
                          {r.title} {isFee && '🏦'} {isMonthlyBen && '👨‍👩‍👧'} {isInactive && '⏸'}
                          <span className="badge badge-accent text-[9px]">✏️ تعديل</span>
                        </p>
                        <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                          يوم {r.day} • {methodLabel}{transferLabel}
                          {hasRange && ` • ${formatRange(r.startMonth)} ← ${formatRange(r.endMonth)}`}
                        </p>
                      </div>
                      <div className="flex items-center gap-1.5 flex-shrink-0" onClick={(e) => e.stopPropagation()}>
                        <span className={`font-black text-xs money tabular ${r.type === 'income' ? 'text-emerald-600' : 'text-red-500'}`}>{fmt(r.amount)}</span>
                        <button type="button" aria-label={isInactive ? 'تفعيل' : 'إيقاف'} onClick={() => toggleRecurringActive(r.id)} className={`btn btn-ghost p-1 ${isInactive ? 'text-emerald-500' : 'text-amber-500'}`}>
                          {isInactive ? <CheckCircle2 size={12} /> : <Clock size={12} />}
                        </button>
                        <button aria-label="حذف" onClick={() => deleteRecurring(r.id)} className="btn btn-ghost p-1 text-red-500"><Trash2 size={12} /></button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </details>
          )}
        </React.Fragment>
      )}
    </div>
  );
});

const CashbackView = memo(({ data, dispatch, saveHistory, addNotification, cards, selectedYear, selectedMonth }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [newTracker, setNewTracker] = useState({
    cardId: cards[0]?.id || 1, month: selectedMonth, year: selectedYear,
    expectedAmount: '', receivedAmount: '', receivedDate: '', status: CASHBACK_STATUS.EXPECTED, notes: ''
  });

  const trackers = data?.cashbackTrackers || [];
  const summary = useMemo(() => computeCashbackSummary(trackers), [trackers]);
  const filteredTrackers = useMemo(() => trackers.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear), [trackers, selectedMonth, selectedYear]);

  const monthExpected = filteredTrackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
  const monthReceived = filteredTrackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
  const monthPending = monthExpected - monthReceived;

  const addTracker = () => {
    const check = validateAmount(newTracker.expectedAmount, { min: 0.01, max: 1000000, label: 'المبلغ المتوقع' });
    if (!check.valid) { addNotification({ type: 'error', title: 'خطأ', message: check.error }); return; }
    saveHistory();
    const expected = roundMoney(check.value);
    const received = roundMoney(parseNumberInput(newTracker.receivedAmount));
    const tracker = {
      ...newTracker, id: getSafeId(), expectedAmount: expected, receivedAmount: received,
      status: received >= expected ? CASHBACK_STATUS.RECEIVED : received > 0 ? CASHBACK_STATUS.PARTIAL : CASHBACK_STATUS.EXPECTED
    };
    dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: [...trackers, tracker] });
    setShowAdd(false);
    setNewTracker({ cardId: cards[0]?.id || 1, month: selectedMonth, year: selectedYear, expectedAmount: '', receivedAmount: '', receivedDate: '', status: CASHBACK_STATUS.EXPECTED, notes: '' });
    addNotification({ type: 'success', title: 'تم الحفظ' });
  };

  const markReceived = async (tracker) => {
    const now = new Date();
    const txYear = now.getFullYear(), txMonth = ALL_MONTHS[now.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { addNotification({ type: 'error', title: 'شهر مغلق', message: `شهر ${txMonth} ${txYear} مغلق`, duration: 6000 }); return; }
    const card = cards.find(c => c.id === tracker.cardId);
    const cardMethod = card ? getCardMethod(card) : null;

    const choice = await showInputModal({
      title: 'أين استلمت الكاش باك؟', icon: '🎁',
      message: `البطاقة: ${card?.bank} - ${card?.name}\n\n1 = على البطاقة (خصم من المديونية)\n2 = نقدي (إضافة للكاش)\n\nاكتب الرقم:`,
      inputValue: '1', numeric: true, confirmText: 'تأكيد'
    });
    if (choice === null) return;
    const choiceNum = parseInt(choice, 10);
    if (choiceNum !== 1 && choiceNum !== 2) { addNotification({ type: 'error', title: 'اختر 1 أو 2' }); return; }
    const useCard = choiceNum === 1;
    const method = useCard && cardMethod ? cardMethod : 'cash';
    saveHistory();

    const updated = trackers.map(t => t.id === tracker.id ? { ...t, receivedAmount: t.expectedAmount, receivedDate: getLocalISODate(), status: CASHBACK_STATUS.RECEIVED } : t);
    dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: updated });

    const newTx = {
      id: getSafeId(), type: 'income', kind: KIND.OPERATIONAL, category: 'استرداد كاش باك',
      amount: safeNumber(tracker.expectedAmount),
      description: `كاش باك - ${card?.name || ''} (${useCard ? 'على البطاقة' : 'نقدي'})`,
      method, date: getLocalISODate(now), month: txMonth, year: txYear, monthIndex: now.getMonth(),
      subType: 'deposit', status: 'paid',
      linkedCardId: useCard && card ? card.id : undefined,
      createdAt: new Date().toISOString()
    };
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: sortTransactions([newTx, ...(data.transactions || [])]) });
    addNotification({ type: 'success', title: 'تم استلام الكاش باك', message: `${fmt(tracker.expectedAmount)} ج.م — ${useCard ? 'على البطاقة' : 'نقدي'}` });
  };

  const deleteTracker = (id) => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'حذف السجل', message: 'سيتم حذف سجل الكاش باك',
      onConfirm: () => { saveHistory(); dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: trackers.filter(t => t.id !== id) }); addNotification({ type: 'success', title: 'تم الحذف' }); },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div>
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>كاش باك {selectedMonth}</p>
            <h2 className="text-3xl font-black tracking-tight text-emerald-600 money tabular">
              {fmt(monthReceived)}<span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <p className="text-[11px] font-semibold mt-2" style={{ color: 'var(--text-muted)' }}>
              متوقع: <span className="money tabular">{fmt(monthExpected)}</span> • معلق: <span className="money tabular">{fmt(monthPending)}</span>
            </p>
          </div>
          <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs"><Plus size={14} /> إضافة</button>
        </div>
        <div className="grid grid-cols-3 gap-2 mt-4">
          <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 text-center">
            <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">مستلم</p>
            <p className="text-sm font-black text-emerald-600 mt-0.5 money tabular">{fmt(summary.received)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-blue-50 dark:bg-blue-950/30 text-center">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">متوقع</p>
            <p className="text-sm font-black text-blue-600 mt-0.5 money tabular">{fmt(summary.expected)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/30 text-center">
            <p className="text-[10px] font-bold text-amber-700 dark:text-amber-400">معلق</p>
            <p className="text-sm font-black text-amber-600 mt-0.5 money tabular">{fmt(summary.pending)}</p>
          </div>
        </div>
      </div>

      <div className="space-y-2">
        <h3 className="font-black text-sm">سجلات {selectedMonth}</h3>
        {filteredTrackers.length === 0 ? (
          <div className="card text-center p-8">
            <Gift size={32} className="mx-auto mb-2 text-emerald-500" />
            <p className="font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد سجلات لهذا الشهر</p>
          </div>
        ) : filteredTrackers.map(tracker => {
          const card = cards.find(c => c.id === tracker.cardId);
          const pct = safeNumber(tracker.expectedAmount) > 0 ? (safeNumber(tracker.receivedAmount) / safeNumber(tracker.expectedAmount)) * 100 : 0;
          const statusCls = tracker.status === CASHBACK_STATUS.RECEIVED ? 'badge-success' : tracker.status === CASHBACK_STATUS.PARTIAL ? 'badge-warning' : 'badge-neutral';
          return (
            <div key={tracker.id} className="card py-3">
              <div className="flex justify-between items-center gap-3 mb-2">
                <div className="flex items-center gap-2">
                  <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600"><Gift size={14} /></div>
                  <div>
                    <h4 className="font-bold text-xs">{card ? `${card.bank} - ${card.name} • ••••${card.last4}` : 'غير محدد'}</h4>
                    <span className={`badge ${statusCls} mt-1`}>{CASHBACK_STATUS_LABELS[tracker.status]}</span>
                  </div>
                </div>
                <div className="flex gap-1">
                  {tracker.status !== CASHBACK_STATUS.RECEIVED && (
                    <button onClick={() => markReceived(tracker)} className="btn btn-primary text-[10px] py-1.5 px-2"><CheckCircle2 size={12} /> استلمت</button>
                  )}
                  <button onClick={() => deleteTracker(tracker.id)} className="btn btn-ghost p-1.5 text-red-500"><Trash2 size={12} /></button>
                </div>
              </div>
              <div className="flex justify-between text-xs mb-1.5">
                <span style={{ color: 'var(--text-muted)' }}>
                  متوقع: <span className="money tabular">{fmt(tracker.expectedAmount)}</span> • مستلم: <span className="money tabular">{fmt(tracker.receivedAmount)}</span>
                </span>
              </div>
              <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                <div className={`h-full ${pct >= 100 ? 'bg-emerald-500' : pct > 0 ? 'bg-amber-500' : 'bg-slate-300'}`} style={{ width: `${Math.min(100, pct)}%` }}></div>
              </div>
            </div>
          );
        })}
      </div>

      {showAdd && (
        <Modal isOpen={true} onClose={() => setShowAdd(false)} title="متتبع كاش باك" icon="🎁">
          <div className="space-y-3">
            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>البطاقة</label>
              <select className="input-field" value={newTracker.cardId} onChange={e => setNewTracker({ ...newTracker, cardId: Number(e.target.value) })}>
                {cards.map(c => <option key={c.id} value={c.id}>{c.bank} - {c.name} • ••••{c.last4}</option>)}
              </select>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الشهر</label>
                <select className="input-field text-sm" value={newTracker.month} onChange={e => setNewTracker({ ...newTracker, month: e.target.value })}>
                  {getMonthsForYear(newTracker.year).map(m => <option key={m} value={m}>{m}</option>)}
                </select>
              </div>
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>السنة</label>
                <select className="input-field text-sm" value={newTracker.year} onChange={e => setNewTracker({ ...newTracker, year: Number(e.target.value) })}>
                  {YEARS_LIST.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>
            </div>
            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ المتوقع *</label>
              <input type="text" inputMode="decimal" className="input-field input-num text-base text-center" style={{ color: 'var(--accent)' }} value={newTracker.expectedAmount} onChange={e => setNewTracker({ ...newTracker, expectedAmount: e.target.value })} placeholder="0.00" />
            </div>
            <button onClick={addTracker} className="btn btn-primary w-full py-2.5 text-sm"><Save size={14} /> إضافة</button>
          </div>
        </Modal>
      )}
    </div>
  );
});

const GenericLedgerComponent = memo(({
  walletKey, ledgerData, liveBalance, isExpanded, onToggle, theme,
  onAddDeposit, onAddWithdrawal, walletVisibility, onToggleVisibility, onReconcile
}) => {
  const [filter, setFilter] = useState('all');
  const [dateFilter, setDateFilter] = useState('');

  const validatedLedger = useMemo(() => {
    try {
      return (ledgerData || []).map(item => ({
        ...item, amount: safeNumber(item.amount), runningBalance: safeNumber(item.runningBalance),
        date: item.date || 'غير معروف', description: item.description || 'بدون وصف',
        subType: item.subType || (item.type === 'income' ? 'deposit' : 'withdrawal')
      })).filter(item => item.amount > 0);
    } catch { return []; }
  }, [ledgerData]);

  const filteredLedger = useMemo(() => validatedLedger.filter(i => {
    if (filter === 'deposit' && i.subType !== 'deposit') return false;
    if (filter === 'withdrawal' && i.subType !== 'withdrawal') return false;
    if (dateFilter && !(i.date || '').includes(dateFilter)) return false;
    return true;
  }), [validatedLedger, filter, dateFilter]);

  const stats = useMemo(() => ({
    deposits: validatedLedger.filter(t => t.subType === 'deposit').reduce((s, t) => s + t.amount, 0),
    withdrawals: validatedLedger.filter(t => t.subType === 'withdrawal').reduce((s, t) => s + t.amount, 0),
    currentBalance: safeNumber(liveBalance)
  }), [validatedLedger, liveBalance]);

  const mask = (v) => !walletVisibility?.[walletKey] ? '•••••' : fmt(v);
  const IconComponent = theme.icon;
  const stop = (e, action) => { e.stopPropagation(); e.preventDefault(); if (action) action(); };
  const isWallet = theme.group === 'wallet';
  const isBank = theme.group === 'bank';
  const isCash = theme.group === 'cash';

  return (
    <div className="card mb-3">
      <div className="flex justify-between items-center cursor-pointer -m-[18px] p-[18px]" onClick={onToggle}>
        <div className="flex items-center gap-3 min-w-0 flex-1">
          <div className="p-2.5 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>
            <IconComponent size={20} />
          </div>
          <div className="min-w-0">
            <h3 className="font-bold text-sm truncate flex items-center gap-2 flex-wrap">
              {theme.title}
              {isWallet && <span className="badge badge-accent text-[9px]">محفظة</span>}
              {isBank && <span className="badge badge-neutral text-[9px]">بنك</span>}
              {isCash && <span className="badge badge-success text-[9px]">كاش</span>}
            </h3>
            <p className="text-[11px] mt-0.5 truncate" style={{ color: 'var(--text-muted)' }}>{theme.subtitle}</p>
          </div>
        </div>
        <div className="flex items-center gap-1 flex-shrink-0">
          <button type="button" aria-label="إيداع" onClick={(e) => stop(e, () => onAddDeposit?.(walletKey))} className="p-2 bg-emerald-500 text-white rounded-lg hover:bg-emerald-600 transition-colors">
            <ArrowDownCircle size={14} />
          </button>
          <button type="button" aria-label="سحب" onClick={(e) => stop(e, () => onAddWithdrawal?.(walletKey))} className="p-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors">
            <ArrowUpCircle size={14} />
          </button>
          {onReconcile && (
            <button type="button" aria-label="مطابقة" onClick={(e) => stop(e, () => onReconcile(walletKey))} className="p-2 hover:bg-[color:var(--bg-muted)] rounded-lg transition-colors" style={{ color: 'var(--text-muted)' }} title="مطابقة الرصيد">
              <Scale size={14} />
            </button>
          )}
          <button type="button" aria-label="إظهار" onClick={(e) => stop(e, () => onToggleVisibility?.(walletKey))} className="p-2 hover:bg-[color:var(--bg-muted)] rounded-lg transition-colors" style={{ color: 'var(--text-muted)' }}>
            {walletVisibility?.[walletKey] ? <EyeOff size={14} /> : <Eye size={14} />}
          </button>
          <ChevronDown size={18} className={`transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
        </div>
      </div>
      {isExpanded && (
        <div className="mt-4 pt-4 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
          {validatedLedger.length === 0 ? (
            <div className="p-6 text-center">
              <p className="font-medium mb-3 text-sm" style={{ color: 'var(--text-secondary)' }}>لا توجد عمليات بعد آخر تحديث رصيد</p>
              <button type="button" onClick={(e) => stop(e, () => onAddDeposit?.(walletKey))} className="btn btn-primary text-sm"><Plus size={16} /> إضافة أول عملية</button>
            </div>
          ) : (
            <React.Fragment>
              <div className="grid grid-cols-3 gap-2 mb-3">
                <div className="text-center p-2.5 bg-emerald-50 dark:bg-emerald-950/30 rounded-xl">
                  <div className="text-[10px] text-emerald-700 dark:text-emerald-400 font-bold mb-1">إيداع</div>
                  <div className="text-sm font-black text-emerald-600 dark:text-emerald-400 money tabular">{mask(stats.deposits)}</div>
                </div>
                <div className="text-center p-2.5 bg-red-50 dark:bg-red-950/30 rounded-xl">
                  <div className="text-[10px] text-red-700 dark:text-red-400 font-bold mb-1">سحب</div>
                  <div className="text-sm font-black text-red-600 dark:text-red-400 money tabular">{mask(stats.withdrawals)}</div>
                </div>
                <div className="text-center p-2.5 bg-blue-50 dark:bg-blue-950/30 rounded-xl">
                  <div className="text-[10px] text-blue-700 dark:text-blue-400 font-bold mb-1">الرصيد</div>
                  <div className="text-sm font-black text-blue-600 dark:text-blue-400 money tabular">{mask(stats.currentBalance)}</div>
                </div>
              </div>
              <div className="flex gap-2 mb-3 flex-wrap">
                <select className="input-field text-xs py-2 flex-1 min-w-[100px]" value={filter} onChange={(e) => setFilter(e.target.value)}>
                  <option value="all">الكل</option>
                  <option value="deposit">إيداعات</option>
                  <option value="withdrawal">سحوبات</option>
                </select>
                <input type="month" className="input-field text-xs py-2 flex-1 min-w-[120px]" value={dateFilter} onChange={(e) => setDateFilter(e.target.value)} />
              </div>
              <div className="overflow-x-auto -mx-4">
                <table className="w-full text-right text-sm">
                  <thead>
                    <tr style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                      <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>التاريخ</th>
                      <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الوصف</th>
                      <th className="p-2.5 text-[10px] font-bold text-left" style={{ color: 'var(--text-muted)' }}>المبلغ</th>
                      <th className="p-2.5 text-[10px] font-bold text-left" style={{ color: 'var(--text-muted)' }}>الرصيد</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredLedger.map((t) => (
                      <tr key={t.id} className="hover:bg-[color:var(--bg-muted)]">
                        <td className="p-2.5 text-[11px] whitespace-nowrap" style={{ color: 'var(--text-muted)' }}>{t.date}</td>
                        <td className="p-2.5 font-bold text-xs">{t.description} <FamilyBadge tx={t} /></td>
                        <td className={`p-2.5 text-left font-black text-xs money tabular ${t.subType === 'deposit' ? 'text-emerald-600' : 'text-red-500'}`}>
                          {t.subType === 'deposit' ? '+' : '-'}{mask(t.amount)}
                        </td>
                        <td className="p-2.5 text-left font-bold text-[11px] money tabular" style={{ color: 'var(--text-secondary)' }}>{mask(t.runningBalance)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
});

const WalletsAndCardsView = memo(({
  cards, buildLedger, expandedLedgers, expandedCardsSection, selectedMonth, selectedYear,
  dispatch, handleDelete, handleAddWalletDeposit, handleAddWalletWithdrawal,
  walletVisibility, liveBalances, saveHistory, addNotification, data, onReconcile
}) => {
  const [activeTab, setActiveTab] = useState('wallets');
  const [showAddCard, setShowAddCard] = useState(false);
  const [newCard, setNewCard] = useState({ name: '', bank: '', limit: '', last4: '', expiry: '', holderName: '', dueDate: '05 من كل شهر', theme: 'silver', cashbackRate: 1 });

  const cashbackSummary = useMemo(() => {
    const trackers = (data?.cashbackTrackers || []).filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
    const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
    const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
    return { expected, received, pending: expected - received };
  }, [data?.cashbackTrackers, selectedMonth, selectedYear]);

  const addCard = () => {
    if (!newCard.name || !newCard.bank) { addNotification({ type: 'error', title: 'الاسم والبنك مطلوبان' }); return; }
    const limitCheck = validateAmount(newCard.limit, { min: 100, max: 10000000, label: 'الحد' });
    if (!limitCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: limitCheck.error }); return; }
    saveHistory();
    dispatch({
      type: 'UPDATE_CARDS',
      payload: [...cards, {
        ...newCard, id: Date.now(), limit: roundMoney(limitCheck.value),
        availableBalance: roundMoney(limitCheck.value), openingDebt: 0,
        openingDebtDate: getLocalISODate(), openingDate: getLocalISODate(),
        cashbackRate: safeNumber(newCard.cashbackRate, 1),
        subCardLast4: Array.isArray(newCard.subCardLast4) ? newCard.subCardLast4 : []
      }]
    });
    setShowAddCard(false);
    setNewCard({ name: '', bank: '', limit: '', last4: '', expiry: '', holderName: '', dueDate: '05 من كل شهر', theme: 'silver', cashbackRate: 1 });
    addNotification({ type: 'success', title: 'تمت الإضافة' });
  };

  const lp = (key) => ({
    walletKey: key,
    ledgerData: buildLedger ? buildLedger(key) : [],
    liveBalance: safeNumber(liveBalances?.[key]),
    isExpanded: expandedLedgers[key],
    onToggle: () => dispatch({ type: 'TOGGLE_LEDGER', payload: key }),
    theme: WALLET_CONFIGS[key],
    onAddDeposit: handleAddWalletDeposit,
    onAddWithdrawal: handleAddWalletWithdrawal,
    walletVisibility,
    onToggleVisibility: (k) => dispatch({ type: 'TOGGLE_WALLET_VISIBILITY', payload: k }),
    onReconcile
  });

  const creditCards = cards;

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card py-3">
        <h2 className="text-base font-black flex items-center gap-2">
          <CreditCard size={18} className="text-[color:var(--accent)]" /> كروت الائتمان والمحافظ الإلكترونية
        </h2>
        <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>
          إدارة {creditCards.length} كارت ائتماني + {Object.keys(WALLET_CONFIGS).length} محافظ/حسابات
        </p>
      </div>

      <div className="sub-tab-switcher">
        <button onClick={() => setActiveTab('wallets')} className={`sub-tab-btn ${activeTab === 'wallets' ? 'active' : ''}`}>
          <CreditCard size={14} /> الكروت والمحافظ
        </button>
        <button onClick={() => setActiveTab('cashback')} className={`sub-tab-btn ${activeTab === 'cashback' ? 'active' : ''}`}>
          <Gift size={14} /> الكاش باك
          {cashbackSummary.received > 0 && <span className="badge badge-success text-[9px] px-1.5 py-0 money tabular">{fmt(cashbackSummary.received)}</span>}
        </button>
      </div>

      {activeTab === 'cashback' ? (
        <CashbackView data={data} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} cards={cards} selectedYear={selectedYear} selectedMonth={selectedMonth} />
      ) : (
        <React.Fragment>
          <details className="card p-0 overflow-hidden" open={expandedCardsSection}>
            <summary className="p-4 cursor-pointer list-none flex items-center justify-between"
              onClick={(e) => { e.preventDefault(); dispatch({ type: 'TOGGLE_CARDS_SECTION' }); }}>
              <div className="flex items-center gap-3">
                <div className="p-2 rounded-lg bg-indigo-50 dark:bg-indigo-950/30 text-indigo-600 dark:text-indigo-400"><CreditCard size={16} /></div>
                <div>
                  <h3 className="font-black text-sm">💳 كروت الائتمان ({creditCards.length})</h3>
                  <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>اضغط للعرض</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button type="button" aria-label="إضافة" onClick={(e) => { e.stopPropagation(); setShowAddCard(true); }} className="btn btn-primary p-1.5"><Plus size={14} /></button>
                <ChevronDown size={14} className={`transition-transform ${expandedCardsSection ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
              </div>
            </summary>
            {expandedCardsSection && (
              <div className="px-4 pb-4 grid grid-cols-1 md:grid-cols-2 gap-4" style={{ borderTop: '1px solid var(--border-subtle)', paddingTop: '16px' }}>
                {creditCards.map(card => {
                  const liveDebt = computeCardDebt(data, card);
                  const liveAvailable = Math.max(0, safeNumber(card.limit) - Math.max(0, liveDebt));
                  return (
                    <BankCard3D key={card.id} card={card} liveDebt={liveDebt} liveAvailable={liveAvailable}
                      onStatement={() => dispatch({ type: 'SET_VIEWING_CARD_STATEMENT', payload: card })}
                      onEdit={() => dispatch({ type: 'SET_EDITING_CARD', payload: card })} />
                  );
                })}
              </div>
            )}
          </details>

          <div className="card py-2">
            <div className="flex items-center gap-2 px-2">
              <Signal size={14} className="text-blue-500" />
              <h3 className="font-black text-xs">📱 المحافظ الإلكترونية ({Object.keys(WALLET_CONFIGS).filter(k => WALLET_CONFIGS[k].group === 'wallet').length})</h3>
            </div>
          </div>
          <div className="space-y-2">
            {['fawry', 'etisalat'].map(k => <GenericLedgerComponent key={k} {...lp(k)} />)}
          </div>

          <div className="card py-2">
            <div className="flex items-center gap-2 px-2">
              <BuildingBank size={14} className="text-purple-500" />
              <h3 className="font-black text-xs">🏦 الحسابات البنكية ({Object.keys(WALLET_CONFIGS).filter(k => WALLET_CONFIGS[k].group === 'bank').length})</h3>
            </div>
          </div>
          <div className="space-y-2">
            {['cib_savings', 'aaib_savings'].map(k => <GenericLedgerComponent key={k} {...lp(k)} />)}
          </div>

          <div className="card py-2">
            <div className="flex items-center gap-2 px-2">
              <Wallet size={14} className="text-emerald-500" />
              <h3 className="font-black text-xs">💵 الكاش (كاش في اليد)</h3>
            </div>
          </div>
          <div className="space-y-2">
            <GenericLedgerComponent {...lp('cash')} />
          </div>
        </React.Fragment>
      )}

      {showAddCard && (
        <Modal isOpen={true} onClose={() => setShowAddCard(false)} title="كارت ائتماني جديد" icon="💳">
          <div className="space-y-3">
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الاسم *</label>
                <input className="input-field text-sm" value={newCard.name} onChange={e => setNewCard({ ...newCard, name: e.target.value })} />
              </div>
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>البنك *</label>
                <input className="input-field text-sm" value={newCard.bank} onChange={e => setNewCard({ ...newCard, bank: e.target.value })} />
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الحد *</label>
                <input type="text" inputMode="decimal" className="input-field input-num text-sm" value={newCard.limit} onChange={e => setNewCard({ ...newCard, limit: e.target.value })} />
              </div>
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>آخر 4</label>
                <input maxLength="4" className="input-field mono text-center text-sm" value={newCard.last4} onChange={e => setNewCard({ ...newCard, last4: e.target.value })} />
              </div>
            </div>
            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>نسبة الكاش باك %</label>
              <input type="text" inputMode="decimal" className="input-field input-num text-center font-black text-amber-600 text-sm" value={newCard.cashbackRate} onChange={e => setNewCard({ ...newCard, cashbackRate: e.target.value })} />
            </div>
            <button onClick={addCard} className="btn btn-primary w-full py-2.5 text-sm">إضافة</button>
          </div>
        </Modal>
      )}
    </div>
  );
});

const CardStatementModal = memo(({ card, data, transactions, onClose, addNotification }) => {
  const [filterType, setFilterType] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');
  const [sortBy, setSortBy] = useState('date');
  const [exporting, setExporting] = useState(false);
  const containerRef = useRef(null);

  const cardMethod = getCardMethod(card);
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];

  const cardTx = useMemo(() => {
    if (!card) return [];
    const cutoffISO = card.openingDebtDate || card.openingDate;
    const cutoffDay = cutoffISO ? dayStart(parseISODate(cutoffISO) || new Date(0)) : null;
    return (transactions || []).filter(t => {
      if (t.status !== 'paid') return false;
      if (t.source === 'carryover') return false;
      const d = parseISODate(t.date);
      if (!d) return false;
      if (cutoffDay && d < cutoffDay) return false;
      const hasExplicitCardLink = (t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== '');
      if (hasExplicitCardLink) return t.linkedCardId === card.id;
      if (t.cardLast4 && subCards.includes(t.cardLast4)) return true;
      return t.method === cardMethod;
    }).sort(compareTransactions);
  }, [transactions, card, cardMethod, subCards]);

  const filteredTx = useMemo(() => {
    let arr = cardTx;
    if (filterType === 'expense') arr = arr.filter(t => t.type === 'expense');
    if (filterType === 'income') arr = arr.filter(t => t.type === 'income');
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.category).includes(term));
    }
    const sorted = [...arr];
    if (sortBy === 'amount') return sorted.sort((a, b) => safeNumber(b.amount) - safeNumber(a.amount));
    return sorted.sort(compareTransactions);
  }, [cardTx, filterType, searchTerm, sortBy]);

  const stats = useMemo(() => {
    const expenses = cardTx.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
    const incomes = cardTx.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
    const monthlyTotals = {};
    cardTx.forEach(t => {
      const d = parseISODate(t.date);
      if (!d) return;
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      if (!monthlyTotals[key]) monthlyTotals[key] = { month: ALL_MONTHS[d.getMonth()], year: d.getFullYear(), expenses: 0, incomes: 0, count: 0 };
      if (t.type === 'expense') monthlyTotals[key].expenses += safeNumber(t.amount);
      else monthlyTotals[key].incomes += safeNumber(t.amount);
      monthlyTotals[key].count++;
    });
    const monthly = Object.values(monthlyTotals).sort((a, b) => b.year - a.year || getMonthIndex(b.month) - getMonthIndex(a.month));
    return { expenses, incomes, total: expenses - incomes, count: cardTx.length, monthly };
  }, [cardTx]);

  const dailyGroups = useMemo(() => groupTransactionsByDate(filteredTx), [filteredTx]);

  const handlePrint = () => {
    const w = window.open('', '_blank', 'width=900,height=700');
    if (!w) { addNotification({ type: 'error', title: 'المتصفح منع الطباعة' }); return; }
    const html = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>كشف ${card.bank} - ${card.name}</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Cairo',sans-serif;padding:24px;color:#0A1628;background:white}.header{text-align:center;padding-bottom:16px;border-bottom:3px solid #635BFF;margin-bottom:20px}.header h1{font-size:22px;font-weight:900;color:#4A42E5;margin-bottom:4px}.header p{font-size:13px;color:#475569;font-weight:600}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.stat-box{background:#F1F5F9;padding:12px;border-radius:10px;text-align:center;border:1px solid #E2E8F0}.stat-box .label{font-size:11px;font-weight:700;color:#64748B;margin-bottom:4px}.stat-box .value{font-size:16px;font-weight:900;color:#0A1628;font-variant-numeric:tabular-nums}.stat-box.red .value{color:#DC2626}.stat-box.green .value{color:#00A86B}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}th{background:#635BFF;color:white;padding:10px 8px;text-align:right;font-weight:700}td{padding:8px;border-bottom:1px solid #E2E8F0;font-variant-numeric:tabular-nums}tr:nth-child(even) td{background:#F8FAFC}.footer{margin-top:30px;padding-top:12px;border-top:2px dashed #CBD5E1;text-align:center;font-size:10px;color:#94A3B8}.day-header-row td{background:#EEEDFF!important;font-weight:900;color:#4A42E5;font-size:11px;padding:6px 8px}</style></head><body><div class="header"><h1>💳 ${escapeHtml(card.bank)} - ${escapeHtml(card.name)}</h1><p>•••• ${escapeHtml(card.last4)} • ${new Date().toLocaleString('ar-EG')}</p></div><div class="stats"><div class="stat-box red"><div class="label">إجمالي المشتريات</div><div class="value">${fmt(stats.expenses)} ج.م</div></div><div class="stat-box green"><div class="label">إجمالي السدادات</div><div class="value">${fmt(stats.incomes)} ج.م</div></div><div class="stat-box"><div class="label">عدد العمليات</div><div class="value">${stats.count}</div></div><div class="stat-box red"><div class="label">الصافي</div><div class="value">${fmt(stats.total)} ج.م</div></div></div><table><thead><tr><th>التاريخ</th><th>الوصف</th><th style="text-align:left">المبلغ</th></tr></thead><tbody>${dailyGroups.map(g => `<tr class="day-header-row"><td colspan="3">${escapeHtml(g.label)} — ${fmt(g.total)} ج.م (${g.items.length})</td></tr>${g.items.map(t => `<tr><td>${escapeHtml(t.date)}</td><td>${escapeHtml(getTxDisplayText(t))}</td><td style="text-align:left;font-weight:900;color:${t.type === 'income' ? '#00A86B' : '#DC2626'}">${t.type === 'income' ? '+' : '−'}${fmt(t.amount)}</td></tr>`).join('')}`).join('')}</tbody></table><div class="footer">💼 المحفظة الذكية — كشف بطاقة ${escapeHtml(card.bank)} ${escapeHtml(card.name)}</div><script>window.onload=()=>setTimeout(()=>window.print(),300);<\/script></body></html>`;
    w.document.write(html);
    w.document.close();
  };

  const handleExportPdf = async () => {
    if (!containerRef.current || exporting) return;
    if (cardTx.length === 0) { addNotification({ type: 'warning', title: 'لا توجد معاملات للتصدير' }); return; }
    if (!window.html2pdf) { addNotification({ type: 'error', title: 'تعذّر تحميل مكتبة PDF' }); return; }
    setExporting(true);
    try {
      const element = containerRef.current.cloneNode(true);
      element.querySelectorAll('[data-pdf-hide="true"]').forEach(el => el.remove());
      element.querySelectorAll('.scroll-hide, .pdf-expand').forEach(el => { el.style.maxHeight = 'none'; el.style.overflow = 'visible'; });
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'background:white;padding:20px;font-family:Cairo,sans-serif;direction:rtl;';
      wrapper.innerHTML = `<div style="text-align:center;padding-bottom:12px;border-bottom:3px solid #635BFF;margin-bottom:16px;"><h1 style="font-size:20px;font-weight:900;color:#4A42E5;margin:0 0 4px;">💳 ${escapeHtml(card.bank)} - ${escapeHtml(card.name)}</h1><p style="font-size:12px;color:#475569;font-weight:600;margin:0;">•••• ${escapeHtml(card.last4)} • ${new Date().toLocaleDateString('ar-EG')}</p></div>`;
      wrapper.appendChild(element);
