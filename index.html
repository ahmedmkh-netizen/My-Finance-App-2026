        </div>
        <div className="generic-modal-body" ref={containerRef}>
          <div className="grid grid-cols-4 gap-2 mb-4">
            <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
              <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">معتمد</p>
              <p className="text-sm font-black text-emerald-600 mt-0.5 money tabular">{fmt(stats.totalPaid)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-center">
              <p className="text-[10px] font-bold text-amber-700 dark:text-amber-400">معلق</p>
              <p className="text-sm font-black text-amber-600 mt-0.5 money tabular">{fmt(stats.totalPending)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
              <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">العدد</p>
              <p className="text-sm font-black text-blue-600 mt-0.5 money tabular">{stats.count}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-center">
              <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">المتوسط</p>
              <p className="text-sm font-black text-purple-600 mt-0.5 money tabular">{fmt(stats.average)}</p>
            </div>
          </div>
          <div className="flex gap-1.5 flex-wrap mb-3" data-pdf-hide="true">
            <div className="relative flex-1 min-w-[140px]">
              <Search className="absolute right-2.5 top-1/2 -translate-y-1/2" size={12} style={{ color: 'var(--text-muted)' }} />
              <input type="text" placeholder="ابحث..." className="input-field pr-8 text-[11px] py-2" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
            </div>
            <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <button type="button" onClick={() => setFilterType('all')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'all' ? 'shadow-sm' : ''}`} style={filterType === 'all' ? { background: 'var(--bg-card)', color: 'var(--accent)' } : { color: 'var(--text-muted)' }}>
                الكل ({categoryTx.length})
              </button>
              <button type="button" onClick={() => setFilterType('paid')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'paid' ? 'shadow-sm' : ''}`} style={filterType === 'paid' ? { background: 'var(--bg-card)', color: 'var(--success)' } : { color: 'var(--text-muted)' }}>
                معتمد ({stats.paidCount})
              </button>
              <button type="button" onClick={() => setFilterType('pending')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'pending' ? 'shadow-sm' : ''}`} style={filterType === 'pending' ? { background: 'var(--bg-card)', color: 'var(--warning)' } : { color: 'var(--text-muted)' }}>
                معلق ({stats.pendingCount})
              </button>
            </div>
            <button type="button" onClick={handlePrint} disabled={filteredTx.length === 0} className="btn btn-secondary text-[10px] py-2 px-2.5">
              <Printer size={11} /><span className="hidden sm:inline">طباعة</span>
            </button>
            <button type="button" onClick={handleExportPdf} disabled={exporting || filteredTx.length === 0} className="btn btn-primary text-[10px] py-2 px-2.5">
              {exporting ? <RefreshCcw size={11} className="animate-spin" /> : <Download size={11} />}
              <span className="hidden sm:inline">PDF</span>
            </button>
          </div>
          {Object.keys(stats.methods).length > 0 && (
            <div className="p-2.5 rounded-lg mb-3" style={{ background: 'var(--bg-muted)' }}>
              <p className="text-[10px] font-bold mb-1.5" style={{ color: 'var(--text-secondary)' }}>💳 التوزيع:</p>
              <div className="flex flex-wrap gap-1.5">
                {Object.entries(stats.methods).sort((a, b) => b[1] - a[1]).map(([method, total]) => (
                  <span key={method} className="badge badge-neutral text-[9px]">
                    {PAYMENT_METHODS.find(p => p.id === method)?.label || method}: <strong className="mr-1 money tabular">{fmt(total)}</strong>
                  </span>
                ))}
              </div>
            </div>
          )}
          {filteredTx.length === 0 ? (
            <div className="text-center py-8">
              <Layers size={32} className="mx-auto mb-2" style={{ color: 'var(--text-muted)' }} />
              <p className="font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد نتائج</p>
            </div>
          ) : (
            <div className="space-y-2 max-h-[50vh] overflow-y-auto scroll-hide pdf-expand">
              {dailyGroups.map(group => (
                <div key={group.date}>
                  <DayGroupHeader label={group.label} total={group.total} count={group.items.length} />
                  <div className="space-y-1.5">
                    {group.items.map(t => (
                      <div key={t.id} className="flex justify-between items-center gap-2 p-2.5 rounded-lg" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                        <div className="min-w-0 flex-1">
                          <p className="font-bold text-xs truncate flex items-center gap-1 flex-wrap">
                            {getTxDisplayText(t)}
                            {t.quantity && Number(t.quantity) > 1 && !(t.description || '').includes('×') && (
                              <span className="inline-flex items-center justify-center min-w-[28px] h-5 px-1.5 rounded-md bg-indigo-100 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 font-black text-[11px] border border-indigo-300 dark:border-indigo-800">
                                ×{t.quantity}
                              </span>
                            )}
                            <TxTimeChip createdAt={t.createdAt} />
                            <FamilyBadge tx={t} /> <SmsBadge tx={t} /> <TeldaBadge tx={t} />
                            <TransferBadge tx={t} /> <RecurringBadge tx={t} />
                            <CarryoverBadge tx={t} /> <ReconciliationBadge tx={t} />
                          </p>
                          <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
                            {PAYMENT_METHODS.find(p => p.id === t.method)?.label || t.method || '—'}
                            {t.status === 'paid' ? <span className="text-emerald-600 mr-2">✅ معتمد</span> : <span className="text-amber-600 mr-2">⏳ معلق</span>}
                          </p>
                        </div>
                        <span className={`font-black text-xs flex-shrink-0 money tabular ${t.type === 'income' ? 'text-emerald-600' : 'text-red-600'}`}>
                          {t.type === 'income' ? '+' : '−'}{fmt(t.amount)}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
          {filteredTx.length > 0 && (
            <div className="mt-3 p-3 rounded-lg bg-gradient-to-br from-[#4A42E5] to-[#635BFF] text-white flex justify-between items-center">
              <span className="font-black text-sm">الإجمالي (المعروض)</span>
              <span className="text-xl font-black money tabular">{fmt(filteredTx.reduce((s, t) => s + safeNumber(t.amount), 0))} ج.م</span>
            </div>
          )}
        </div>
        <div className="generic-modal-footer" data-pdf-hide="true">
          <button onClick={close} className="btn btn-secondary flex-1 text-sm">إغلاق</button>
        </div>
      </div>
    </div>
  );
});

const CategoriesView = memo(({
  transactions, selectedMonth, selectedYear, catViewType, budgets,
  dispatch, handleDelete, onSelectYear, onSelectMonth
}) => {
  const catTotals = useMemo(() => transactions.filter(t =>
    t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); return acc; }, {}),
    [transactions, catViewType, selectedMonth, selectedYear]);

  const catCounts = useMemo(() => transactions.filter(t =>
    t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + 1; return acc; }, {}),
    [transactions, catViewType, selectedMonth, selectedYear]);

  const hasAnyData = Object.keys(catTotals).length > 0;

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card flex justify-between items-center gap-2 flex-wrap">
        <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
          <button type="button" onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'expense' })}
            className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'expense' ? 'shadow-sm text-red-600 dark:text-red-400' : ''}`}
            style={catViewType === 'expense' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}>
            مصروفات
          </button>
          <button type="button" onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'income' })}
            className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'income' ? 'shadow-sm text-emerald-600 dark:text-emerald-400' : ''}`}
            style={catViewType === 'income' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}>
            إيرادات
          </button>
        </div>
        <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>💡 اضغط على الفئة لعرض التفاصيل</p>
      </div>

      <MonthSelector
        selectedYear={selectedYear}
        selectedMonth={selectedMonth}
        onSelectYear={onSelectYear}
        onSelectMonth={onSelectMonth}
      />

      {!hasAnyData ? (
        <div className="card text-center p-12">
          <Layers size={40} className="mx-auto mb-3 text-[color:var(--accent)]" />
          <h3 className="text-base font-black mb-2">
            لا توجد {catViewType === 'expense' ? 'مصروفات' : 'إيرادات'} في {selectedMonth}
          </h3>
          <p className="text-xs" style={{ color: 'var(--text-muted)' }}>ابدأ بإضافة معاملات من صفحة المعاملات</p>
        </div>
      ) : (
        <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
          {CATEGORIES[catViewType].map(cat => {
            const spent = catTotals[cat] || 0;
            const budget = budgets[cat] || 0;
            const overBudget = budget > 0 && spent > budget;
            const count = catCounts[cat] || 0;
            if (spent === 0 && budget === 0) return null;
            return (
              <div key={cat} className="card card-hover p-3 cursor-pointer active:scale-[0.98]"
                onClick={() => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: cat })}>
                <div className="flex justify-between mb-2">
                  <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: CATEGORY_COLORS[cat] }}>
                    <Layers size={14} />
                  </div>
                  <button type="button" aria-label="ميزانية"
                    onClick={(e) => {
                      e.stopPropagation();
                      dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: cat });
                      dispatch({ type: 'SET_BUDGET_AMOUNT', payload: budgets[cat] || '' });
                    }}
                    className="btn btn-ghost p-1">
                    <SettingsIcon size={12} />
                  </button>
                </div>
                <h3 className="font-bold text-[11px] mb-1 truncate">{cat}</h3>
                <p className="text-base font-black tracking-tight money tabular">
                  {fmt(spent)}<span className="text-[9px] font-semibold mr-1" style={{ color: 'var(--text-muted)' }}>ج.م</span>
                </p>
                {count > 0 && <p className="text-[9px] font-bold mt-0.5" style={{ color: 'var(--text-muted)' }}>📋 {count} معاملة</p>}
                {catViewType === 'expense' && budget > 0 && (
                  <div className="mt-2 pt-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
                    <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                      <div style={{ width: `${Math.min(100, (spent / budget) * 100)}%` }} className={`h-full ${overBudget ? 'bg-red-500' : 'bg-emerald-500'}`}></div>
                    </div>
                    <p className="text-[9px] font-bold mt-1" style={{ color: 'var(--text-muted)' }}>من {fmt(budget)}</p>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
});

const TransactionsView = memo(({
  groupedTransactions, transactions, selectedMonth, selectedYear, transViewMode,
  statusFilter, searchTerm, expandedGroup, data, monthInsights, dispatch,
  handleDelete, addNotification, onSelectYear, onSelectMonth, saveHistory, onBulkDelete
}) => {
  const [sourceFilter, setSourceFilter] = useState('all');
  const [showFilters, setShowFilters] = useState(false);
  const [showBankFeesOnly, setShowBankFeesOnly] = useState(false);
  const [showSmsOnly, setShowSmsOnly] = useState(false);
  const [showBeneficiariesOnly, setShowBeneficiariesOnly] = useState(false);
  const [selectMode, setSelectMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState(new Set());
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [amountMin, setAmountMin] = useState('');
  const [amountMax, setAmountMax] = useState('');

  const pendingDeleteIds = useMemo(() => {
    const set = new Set();
    (data?.deleteRequests || []).forEach(r => { if (r && r.status === 'pending' && r.txId) set.add(r.txId); });
    return set;
  }, [data?.deleteRequests]);

  const filterBySource = useCallback((list) => {
    if (sourceFilter === 'all') return list;
    if (sourceFilter === 'self') return list.filter(t => !isFamilyTx(t));
    return list.filter(t => t.createdBy === sourceFilter);
  }, [sourceFilter]);

  const filterByDate = useCallback((list) => list.filter(t => {
    if (dateFrom && t.date < dateFrom) return false;
    if (dateTo && t.date > dateTo) return false;
    return true;
  }), [dateFrom, dateTo]);

  const filterByAmount = useCallback((list) => list.filter(t => {
    const a = safeNumber(t.amount);
    if (amountMin && a < parseNumberInput(amountMin)) return false;
    if (amountMax && a > parseNumberInput(amountMax)) return false;
    return true;
  }), [amountMin, amountMax]);

  const filterByBankFees = useCallback((list) => showBankFeesOnly ? list.filter(t => isBankFee(t)) : list, [showBankFeesOnly]);
  const filterBySms = useCallback((list) => showSmsOnly ? list.filter(t => t.source === 'sms') : list, [showSmsOnly]);
  const filterByBeneficiaries = useCallback((list) => showBeneficiariesOnly ? list.filter(t => isBeneficiaryCategorySafe(t.category)) : list, [showBeneficiariesOnly]);
  const filterByType = useCallback((list) => transViewMode === 'all' ? list : list.filter(t => t.type === transViewMode), [transViewMode]);

  const pendingGroups = useMemo(() => groupedTransactions.map(g => ({
    ...g,
    items: filterByAmount(filterByDate(filterByBeneficiaries(filterBySms(filterByBankFees(filterBySource(g.items.filter(t => t.status !== 'paid')))))))
  })).filter(g => g.items.length > 0),
    [groupedTransactions, filterBySource, filterByBankFees, filterBySms, filterByBeneficiaries, filterByDate, filterByAmount]);

  const paidArchive = useMemo(() => filterByAmount(
    filterByDate(filterByBeneficiaries(filterBySms(filterByBankFees(filterBySource(filterByType(
      transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status === 'paid')
    ))))))
  ).sort(compareTransactions),
    [transactions, selectedMonth, selectedYear, filterByType, filterBySource, filterByBankFees, filterBySms, filterByBeneficiaries, filterByDate, filterByAmount]
  );

  const totalPending = pendingGroups.reduce((s, g) => s + g.items.length, 0);
  const isClosed = isMonthClosed(data, selectedYear, selectedMonth);

  const toggleSelect = useCallback((id) => {
    setSelectedIds(prev => { const next = new Set(prev); if (next.has(id)) next.delete(id); else next.add(id); return next; });
  }, []);

  const toggleSelectAll = useCallback(() => {
    const allIds = [...pendingGroups.flatMap(g => g.items.map(i => i.id)), ...paidArchive.map(t => t.id)];
    setSelectedIds(prev => prev.size === allIds.length ? new Set() : new Set(allIds));
  }, [pendingGroups, paidArchive]);

  const exitSelectMode = useCallback(() => { setSelectMode(false); setSelectedIds(new Set()); }, []);

  const handleBulkDelete = useCallback(() => {
    const ids = [...selectedIds];
    if (ids.length === 0) { addNotification({ type: 'info', title: 'لم تحدد أي معاملة' }); return; }
    const blocked = [], allowed = [];
    ids.forEach(id => {
      const t = transactions.find(x => x.id === id);
      if (!t) return;
      if (isMonthClosed(data, t.year || 2026, t.month)) blocked.push(t);
      else allowed.push(t);
    });
    if (allowed.length === 0) { addNotification({ type: 'error', title: 'محظور', message: 'كل المعاملات المحددة في شهور مغلقة' }); return; }
    const message = blocked.length > 0
      ? `سيتم حذف ${allowed.length} معاملة.\n⚠️ سيتم تجاهل ${blocked.length} معاملة في شهور مغلقة.`
      : `سيتم نقل ${allowed.length} معاملة للأرشيف.`;
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: `حذف ${allowed.length} معاملة`, message,
      onConfirm: () => { if (onBulkDelete) onBulkDelete(allowed.map(t => t.id)); exitSelectMode(); },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  }, [selectedIds, transactions, data, addNotification, dispatch, exitSelectMode, onBulkDelete]);

  const approveOne = (t) => {
    if (isMonthClosed(data, t.year || 2026, t.month)) { addNotification({ type: 'error', title: 'محظور' }); return; }
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(tr => tr.id === t.id ? { ...tr, status: 'paid' } : tr) });
    addNotification({ type: 'success', title: 'تم الاعتماد' });
  };

  const approveAll = () => {
    if (isClosed) { addNotification({ type: 'error', title: 'محظور' }); return; }
    dispatch({
      type: 'SHOW_CONFIRM', danger: false,
      title: 'اعتماد الكل', message: `سيتم اعتماد ${totalPending} عملية`,
      onConfirm: () => {
        saveHistory();
        const ids = new Set(pendingGroups.flatMap(g => g.items.map(i => i.id)));
        dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t) });
        addNotification({ type: 'success', title: 'تم الاعتماد' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const reopenOne = (t) => {
    if (isMonthClosed(data, t.year || 2026, t.month)) { addNotification({ type: 'error', title: 'محظور' }); return; }
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(tr => tr.id === t.id ? { ...tr, status: 'pending' } : tr) });
    addNotification({ type: 'warning', title: 'إعادة تعليق' });
  };

  const monthTx = useMemo(() => transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear), [transactions, selectedMonth, selectedYear]);

  const activeFiltersCount =
    (sourceFilter !== 'all' ? 1 : 0) + (statusFilter !== 'all' ? 1 : 0) +
    (showBankFeesOnly ? 1 : 0) + (showSmsOnly ? 1 : 0) + (showBeneficiariesOnly ? 1 : 0) +
    (dateFrom ? 1 : 0) + (dateTo ? 1 : 0) + (amountMin ? 1 : 0) + (amountMax ? 1 : 0);

  const clearAllFilters = () => {
    setSourceFilter('all'); setShowBankFeesOnly(false); setShowSmsOnly(false); setShowBeneficiariesOnly(false);
    setDateFrom(''); setDateTo(''); setAmountMin(''); setAmountMax('');
    dispatch({ type: 'SET_STATUS_FILTER', payload: 'all' });
  };

  const dailyGroups = useMemo(() => groupTransactionsByDate(paidArchive), [paidArchive]);

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-center flex-wrap gap-2 mb-3">
          <div>
            <h2 className="text-lg font-black">
              {transViewMode === 'expense' ? 'المصروفات' : transViewMode === 'income' ? 'الإيرادات' : 'كل المعاملات'}
            </h2>
            <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>
              {selectedMonth} {selectedYear} • {monthTx.length} معاملة
            </p>
          </div>
          <div className="flex gap-1.5 flex-wrap">
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'all' })} className={`btn ${transViewMode === 'all' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>الكل</button>
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'expense' })} className={`btn ${transViewMode === 'expense' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>مصروفات</button>
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'income' })} className={`btn ${transViewMode === 'income' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>إيرادات</button>
          </div>
        </div>

        {selectMode ? (
          <div className="p-3 rounded-lg mb-3 flex flex-wrap items-center gap-2" style={{ background: 'var(--accent-soft)', border: '1px solid var(--accent)' }}>
            <div className="flex-1 min-w-[180px]">
              <p className="text-xs font-black" style={{ color: 'var(--accent)' }}>🔘 وضع التحديد المتعدد</p>
              <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>تم تحديد <strong className="money tabular">{selectedIds.size}</strong> معاملة</p>
            </div>
            <button onClick={toggleSelectAll} className="btn btn-secondary text-[11px] py-1.5 px-2.5">
              {selectedIds.size === (pendingGroups.flatMap(g => g.items).length + paidArchive.length) ? 'إلغاء الكل' : 'تحديد الكل'}
            </button>
            <button onClick={handleBulkDelete} disabled={selectedIds.size === 0} className={`btn ${selectedIds.size === 0 ? 'btn-secondary' : 'btn-primary'} text-[11px] py-1.5 px-2.5`}>
              <Trash2 size={12} /> حذف ({selectedIds.size})
            </button>
            <button onClick={exitSelectMode} className="btn btn-ghost text-[11px] py-1.5 px-2.5">خروج</button>
          </div>
        ) : (
          <div className="flex gap-1.5 mb-3">
            <button onClick={() => setSelectMode(true)} className="btn btn-secondary text-[11px] py-1.5 px-2.5">
              <CheckCircle2 size={12} /> تحديد متعدد
            </button>
          </div>
        )}

        <div className="grid grid-cols-3 gap-2">
          <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30">
            <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">محصل</p>
            <p className="text-sm font-black text-emerald-600 mt-0.5 money tabular">{fmt(monthInsights.inc)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30">
            <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مدفوع</p>
            <p className="text-sm font-black text-red-600 mt-0.5 money tabular">{fmt(monthInsights.exp)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الصافي</p>
            <p className={`text-sm font-black mt-0.5 money tabular ${monthInsights.net >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(monthInsights.net)}</p>
          </div>
        </div>

        <div className="flex gap-1.5 mt-3 flex-wrap">
          <button onClick={() => setShowBankFeesOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showBankFeesOnly ? 'btn-primary' : 'btn-secondary'}`}>
            <Receipt size={12} /> رسوم بنكية
          </button>
          <button onClick={() => setShowSmsOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showSmsOnly ? 'btn-primary' : 'btn-secondary'}`}>
            <MessageSquare size={12} /> SMS
          </button>
          <button onClick={() => setShowBeneficiariesOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showBeneficiariesOnly ? 'btn-primary' : 'btn-secondary'}`}>
            👨‍👩‍👧 مصاريف شهرية
          </button>
          {isClosed ? (
            <React.Fragment>
              <div className="badge badge-success px-2 py-1 text-[10px]"><ShieldCheck size={10} /> مغلق</div>
              <button onClick={() => dispatch({
                type: 'SHOW_CONFIRM', danger: false,
                title: 'إعادة فتح', message: 'سيتم إلغاء القفل.',
                onConfirm: () => { saveHistory(); dispatch({ type: 'OPEN_MONTH', payload: makeMonthKey(selectedYear, selectedMonth) }); addNotification({ type: 'success', title: 'تم إعادة الفتح' }); },
                onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
              })} className="btn btn-secondary text-[11px] px-2.5 py-1.5">
                <Unlock size={12} /> فتح
              </button>
            </React.Fragment>
          ) : (
            <button onClick={() => {
              const pending = monthTx.filter(t => t.status !== 'paid');
              if (pending.length > 0) {
                dispatch({
                  type: 'SET_PENDING_CLOSE_MODAL',
                  payload: { isOpen: true, pending, total: pending.reduce((s, t) => s + safeNumber(t.amount), 0), month: selectedMonth, year: selectedYear }
                });
              } else {
                dispatch({
                  type: 'SHOW_CONFIRM', danger: false,
                  title: 'إقفال الشهر', message: 'سيتم تثبيت الأرصدة.',
                  onConfirm: () => { saveHistory(); dispatch({ type: 'CLOSE_MONTH', payload: { year: selectedYear, month: selectedMonth } }); addNotification({ type: 'success', title: 'تم الإقفال' }); },
                  onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
                });
              }
            }} className="btn btn-secondary text-[11px] px-2.5 py-1.5">
              <Lock size={12} /> إقفال
            </button>
          )}
        </div>
      </div>

      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />

      <div className="card py-3">
        <div className="flex gap-2">
          <div className="relative flex-1">
            <Search className="absolute right-3 top-1/2 -translate-y-1/2" size={14} style={{ color: 'var(--text-muted)' }} />
            <input type="text" placeholder="ابحث..." className="input-field pr-9 text-sm py-2.5" value={searchTerm} onChange={(e) => dispatch({ type: 'SET_SEARCH_TERM', payload: e.target.value })} />
          </div>
          <button onClick={() => setShowFilters(!showFilters)} className={`btn ${showFilters ? 'btn-primary' : 'btn-secondary'} px-3 py-2.5 relative`}>
            <Filter size={14} />
            {activeFiltersCount > 0 && (
              <span className="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 text-white text-[9px] rounded-full flex items-center justify-center font-black">{activeFiltersCount}</span>
            )}
          </button>
        </div>
        {showFilters && (
          <div className="mt-3 pt-3 space-y-3 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            <div className="flex items-center justify-between">
              <p className="text-[10px] font-black" style={{ color: 'var(--text-muted)' }}>فلاتر متقدمة</p>
              {activeFiltersCount > 0 && <button onClick={clearAllFilters} className="text-[10px] font-black text-red-500 hover:underline">مسح الكل</button>}
            </div>
            <div>
              <p className="text-[10px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>مصدر المعاملة</p>
              <div className="flex gap-2 flex-wrap">
                {[['all', 'الكل'], ['self', '👤 أنا'], ['ans', 'أنس'], ['abdelrahman', 'عبد الرحمن'], ['salma', 'سلمى'], ['om_abdo', 'أم عبده']].map(([id, label]) => (
                  <button key={id} type="button" onClick={() => setSourceFilter(id)} className={`badge px-2.5 py-1 cursor-pointer text-[10px] ${sourceFilter === id ? 'badge-accent' : 'badge-neutral'}`}>{label}</button>
                ))}
              </div>
            </div>
            <div>
              <p className="text-[10px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>الحالة</p>
              <div className="flex gap-2 flex-wrap">
                {[['all', 'الكل'], ['pending', '⏳ معلق'], ['paid', '✅ مدفوع']].map(([id, label]) => (
                  <button key={id} type="button" onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: id })} className={`badge px-2.5 py-1 cursor-pointer text-[10px] ${statusFilter === id ? 'badge-accent' : 'badge-neutral'}`}>{label}</button>
                ))}
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <div>
                <p className="text-[10px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>من تاريخ</p>
                <input type="date" className="input-field text-xs py-2" value={dateFrom} onChange={e => setDateFrom(e.target.value)} />
              </div>
              <div>
                <p className="text-[10px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>إلى تاريخ</p>
                <input type="date" className="input-field text-xs py-2" value={dateTo} onChange={e => setDateTo(e.target.value)} />
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <div>
                <p className="text-[10px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>مبلغ من</p>
                <input type="text" inputMode="decimal" className="input-field text-xs py-2" value={amountMin} onChange={e => setAmountMin(e.target.value)} placeholder="0" />
              </div>
              <div>
                <p className="text-[10px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>مبلغ إلى</p>
                <input type="text" inputMode="decimal" className="input-field text-xs py-2" value={amountMax} onChange={e => setAmountMax(e.target.value)} placeholder="∞" />
              </div>
            </div>
          </div>
        )}
      </div>

      <section>
        <div className="flex justify-between items-center mb-2 flex-wrap gap-2">
          <h3 className="font-black flex items-center gap-2 text-sm">
            <Clock className="text-amber-500" size={14} /> الالتزامات
            {totalPending > 0 && <span className="badge badge-warning text-[10px]">{totalPending}</span>}
          </h3>
          {totalPending > 0 && (
            <button onClick={approveAll} className="btn btn-primary text-[11px] px-2.5 py-1.5">
              <CheckCircle2 size={12} /> اعتماد الكل
            </button>
          )}
        </div>
        {pendingGroups.length === 0 ? (
          <div className="card text-center p-6">
            <CheckCircle2 size={24} className="text-emerald-500 mx-auto mb-2" />
            <p className="font-semibold text-xs" style={{ color: 'var(--text-secondary)' }}>لا توجد التزامات معلقة</p>
          </div>
        ) : (
          <div className="space-y-2">
            {pendingGroups.map(g => {
              const isExpanded = expandedGroup === g.category;
              return (
                <div key={g.category} className="card p-0 overflow-hidden">
                  <div className="flex justify-between items-center p-3 cursor-pointer"
                    onClick={() => dispatch({ type: 'SET_EXPANDED_GROUP', payload: isExpanded ? null : g.category })}>
                    <div className="flex items-center gap-2 min-w-0 flex-1">
                      <span className="p-1.5 rounded-lg flex-shrink-0" style={{ backgroundColor: `${CATEGORY_COLORS[g.category]}20`, color: CATEGORY_COLORS[g.category] }}>
                        <Layers size={14} />
                      </span>
                      <div className="min-w-0">
                        <h4 className="font-bold text-xs truncate">{g.category}</h4>
                        <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{g.items.length} عملية</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <span className="font-black text-sm money tabular">{fmt(g.items.reduce((s, i) => s + safeNumber(i.amount), 0))}</span>
                      <ChevronDown size={14} className={`transition-transform ${isExpanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
                    </div>
                  </div>
                  {isExpanded && (
                    <div className="divide-y" style={{ borderTop: '1px solid var(--border-subtle)', borderColor: 'var(--border-subtle)' }}>
                      {g.items.map(t => (
                        <div key={t.id} className={`p-3 flex justify-between items-center gap-2 ${selectedIds.has(t.id) ? 'bg-blue-50 dark:bg-blue-950/20' : ''}`}>
                          {selectMode && (
                            <input type="checkbox" checked={selectedIds.has(t.id)} onChange={() => toggleSelect(t.id)} className="w-4 h-4 accent-[color:var(--accent)] flex-shrink-0" />
                          )}
                          <button aria-label="اعتماد" onClick={() => approveOne(t)} className="flex flex-col items-center px-1.5 py-1 rounded-lg hover:bg-[color:var(--bg-muted)] active:scale-90 flex-shrink-0">
                            <Clock className="text-amber-500" size={16} />
                          </button>
                          <div className="flex-1 min-w-0">
                            <p className="font-bold text-xs truncate flex items-center gap-1.5 flex-wrap">
                              {t.description || 'بدون وصف'}
                              <TxTimeChip createdAt={t.createdAt} />
                              {pendingDeleteIds.has(t.id) && <span className="badge badge-warning text-[9px]">🗑️ طلب مسح</span>}
                              <FamilyBadge tx={t} /> <SmsBadge tx={t} /> <TeldaBadge tx={t} />
                              <TransferBadge tx={t} /> <RecurringBadge tx={t} /> <CarryoverBadge tx={t} />
                            </p>
                            <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
                              {t.date} • {PAYMENT_METHODS.find(p => p.id === t.method)?.label}
                            </p>
                          </div>
                          <div className="flex items-center gap-1 flex-shrink-0">
                            <span className="font-black text-xs money tabular">{fmt(t.amount)}</span>
                            {!selectMode && (
                              <React.Fragment>
                                <button type="button" aria-label="تعديل" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="btn btn-ghost p-1">
                                  <Edit size={12} />
                                </button>
                                <button type="button" aria-label="حذف" onClick={() => handleDelete(t.id)} className="btn btn-ghost p-1 text-red-500">
                                  <Trash2 size={12} />
                                </button>
                              </React.Fragment>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </section>

      {dailyGroups.length > 0 && (
        <details className="group" open>
          <summary className="cursor-pointer list-none">
            <div className="card py-3 flex items-center justify-between">
              <h3 className="font-bold text-xs flex items-center gap-2 text-emerald-600">
                <CheckCircle2 size={14} /> سجل المدفوعات ({paidArchive.length})
              </h3>
              <ChevronDown className="transition-transform group-open:rotate-180" size={14} style={{ color: 'var(--text-muted)' }} />
            </div>
          </summary>
          <div className="mt-2">
            {dailyGroups.map(group => (
              <div key={group.date}>
                <DayGroupHeader label={group.label} total={group.total} count={group.items.length} />
                <div className="space-y-2">
                  {group.items.map(t => (
                    <div key={t.id} className={`card py-2.5 flex justify-between items-center gap-2 ${selectedIds.has(t.id) ? 'ring-2 ring-[color:var(--accent)]' : ''}`}>
                      {selectMode && (
                        <input type="checkbox" checked={selectedIds.has(t.id)} onChange={() => toggleSelect(t.id)} className="w-4 h-4 accent-[color:var(--accent)] flex-shrink-0" />
                      )}
                      <div className="min-w-0 flex-1">
                        <p className="font-bold text-xs truncate flex items-center gap-1.5 flex-wrap">
                          {t.type === 'income' ? '💰' : '💸'} {t.description || t.category}
                          <TxTimeChip createdAt={t.createdAt} />
                          {t.quantity && <span className="badge badge-accent text-[9px]">× {t.quantity}</span>}
                          {pendingDeleteIds.has(t.id) && <span className="badge badge-warning text-[9px]">🗑️ طلب مسح</span>}
                          <FamilyBadge tx={t} /> <SmsBadge tx={t} /> <TeldaBadge tx={t} />
                          <TransferBadge tx={t} /> <RecurringBadge tx={t} />
                          <CarryoverBadge tx={t} /> <CreditBadge tx={t} /> <ReconciliationBadge tx={t} />
                        </p>
                        <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                          {PAYMENT_METHODS.find(p => p.id === t.method)?.label || ''}
                          {t.createdAt && ` • ${formatTxTime(t.createdAt)}`}
                        </p>
                      </div>
                      <div className="flex items-center gap-1 flex-shrink-0">
                        <span className="font-black text-xs money tabular">{fmt(t.amount)}</span>
                        {!selectMode && (
                          <React.Fragment>
                            <button type="button" aria-label="تعديل" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="btn btn-ghost p-1">
                              <Edit size={12} />
                            </button>
                            <button aria-label="إعادة تعليق" onClick={() => reopenOne(t)} className="btn btn-ghost p-1 text-amber-500">
                              <Undo2 size={12} />
                            </button>
                          </React.Fragment>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </details>
      )}
    </div>
  );
});

const ReconciliationModal = memo(({ accountKey, computedBalance, onClose, onReconcile, addNotification }) => {
  const [actualBalance, setActualBalance] = useState('');
  const [note, setNote] = useState('');
  const [creating, setCreating] = useState(false);

  const actual = parseNumberInput(actualBalance);
  const diff = actual - computedBalance;
  const hasDiff = Math.abs(diff) >= 0.01;

  const handleReconcile = () => {
    if (!hasDiff) { addNotification({ type: 'info', title: 'لا يوجد فرق' }); onClose(); return; }
    setCreating(true);
    onReconcile({ accountKey, computedBalance, actualBalance: actual, diff, note: note.trim() || 'تسوية مطابقة رصيد' });
    setCreating(false);
    onClose();
  };

  const accountLabel = ACCOUNT_SHORT_NAMES[accountKey] || accountKey;

  return (
    <Modal isOpen={true} onClose={onClose} title="مطابقة الرصيد" icon="⚖️" size="md">
      <div className="space-y-4">
        <div className="p-3 rounded-xl" style={{ background: 'var(--bg-muted)' }}>
          <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الحساب</p>
          <p className="font-black text-sm">{accountLabel}</p>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الرصيد المحسوب</label>
            <div className="input-field input-num text-center py-3 font-black" style={{ background: 'var(--bg-muted)' }}>{fmt(computedBalance)}</div>
          </div>
          <div>
            <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الرصيد الفعلي *</label>

              <span className="text-xs font-bold" style={{ color: 'var(--text-secondary)' }}>الفرق</span>
              <span className={`font-black text-lg money tabular ${diff > 0 ? 'text-emerald-600' : 'text-red-600'}`}>{diff > 0 ? '+' : ''}{fmt(diff)}</span>
            </div>
            <p className="text-[10px] mt-1" style={{ color: 'var(--text-muted)' }}>
              {diff > 0 ? 'سيتم إضافة قيد تسوية (دخل)' : 'سيتم إضافة قيد تسوية (مصروف)'}
            </p>
          </div>
        )}
        {actualBalance && !hasDiff && (
          <div className="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/30">

              <CheckCircle2 size={16} className="text-emerald-600" />

const CustodyView = memo(({ data, dispatch, saveHistory, addNotification }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [filterType, setFilterType] = useState('all');
  const [newEntry, setNewEntry] = useState({
    type: CUSTODY_TYPE.RECEIVE, amount: '', date: getLocalISODate(), description: '',
    method: 'cib_savings', relatedCategory: 'عهدة شركة إيماك'
  });

  const custodyEntries = data?.custodyEntries || [];
  const summary = useMemo(() => computeCustodyBalance(custodyEntries), [custodyEntries]);

  const filtered = useMemo(() => {
    const sorted = [...custodyEntries].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
    if (filterType === 'all') return sorted;
    return sorted.filter(e => e.type === filterType);
  }, [custodyEntries, filterType]);

  const addEntry = () => {
    const check = validateAmount(newEntry.amount, { min: 0.01, max: 10000000, label: 'المبلغ' });
    if (!check.valid) { addNotification({ type: 'error', title: 'خطأ', message: check.error }); return; }
    const descCheck = validateText(newEntry.description, { min: 2, max: 200, label: 'الوصف' });
    if (!descCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: descCheck.error }); return; }
    const dateCheck = validateDate(newEntry.date);
    if (!dateCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: dateCheck.error }); return; }
    const d = dateCheck.value;
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { addNotification({ type: 'error', title: 'شهر مغلق', message: `شهر ${txMonth} ${txYear} مغلق`, duration: 6000 }); return; }

    if (newEntry.type === CUSTODY_TYPE.SPEND_CASH) {
      if (!CASH_METHOD_IDS.has(newEntry.method) && !WALLET_METHOD_IDS.has(newEntry.method)) {
        addNotification({ type: 'error', title: '❌ صرف كاش من حساب خاطئ', message: 'صرف الكاش يجب أن يكون من cash/fawry/etisalat', duration: 7000 }); return;
      }
    }
    if (newEntry.type === CUSTODY_TYPE.SPEND_CARD) {
      if (!CREDIT_CARD_METHOD_IDS.includes(newEntry.method)) {
        addNotification({ type: 'error', title: '❌ صرف بطاقة من حساب خاطئ', message: 'صرف البطاقة يجب أن يكون من CIB Master/SWYPE/AAIB Visa', duration: 7000 }); return;
      }
    }

    saveHistory();
    const amount = roundMoney(check.value);
    const entry = { ...newEntry, description: descCheck.value, id: getSafeId(), amount, status: newEntry.type === CUSTODY_TYPE.SETTLE ? 'settled' : 'open' };
    const newEntries = [entry, ...custodyEntries];
    const newTxs = [];
    const baseTx = { date: newEntry.date, month: txMonth, year: txYear, monthIndex: d.getMonth(), status: 'paid', createdAt: new Date().toISOString() };

    if (newEntry.type === CUSTODY_TYPE.RECEIVE)
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'income', kind: KIND.OPERATIONAL, category: newEntry.relatedCategory || 'عهدة شركة إيماك', amount, description: `استلام عهدة: ${newEntry.description}`, method: newEntry.method, subType: 'deposit', linkedCustodyId: entry.id });
    else if (newEntry.type === CUSTODY_TYPE.TRANSFER)
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'income', kind: KIND.FINANCIAL, category: 'تحويلات واردة', amount, description: `تحويل عهدة لحسابي: ${newEntry.description}`, method: newEntry.method, subType: 'deposit', linkedCustodyId: entry.id });
    else if (newEntry.type === CUSTODY_TYPE.SPEND_CASH)
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'expense', kind: KIND.OPERATIONAL, category: newEntry.relatedCategory || 'مصروفات عهدة', amount, description: `صرف عهدة كاش: ${newEntry.description}`, method: newEntry.method, subType: 'withdrawal', linkedCustodyId: entry.id });
    else if (newEntry.type === CUSTODY_TYPE.SPEND_CARD)
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'expense', kind: KIND.OPERATIONAL, category: newEntry.relatedCategory || 'فواتير عهدة', amount, description: `صرف عهدة من بطاقة: ${newEntry.description}`, method: newEntry.method, subType: 'withdrawal', linkedCustodyId: entry.id });
    else if (newEntry.type === CUSTODY_TYPE.SETTLE)
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'expense', kind: KIND.FINANCIAL, category: 'تحويلات', amount, description: `تسوية نهائية للعهدة: ${newEntry.description}`, method: newEntry.method, subType: 'withdrawal', linkedCustodyId: entry.id });

    const newData = { ...data, custodyEntries: newEntries, transactions: sortTransactions([...newTxs, ...(data.transactions || [])]) };
    dispatch({ type: 'SET_DATA', payload: newData });
    setShowAdd(false);
    setNewEntry({ type: CUSTODY_TYPE.RECEIVE, amount: '', date: getLocalISODate(), description: '', method: 'cib_savings', relatedCategory: 'عهدة شركة إيماك' });

  };

  const deleteEntry = (id) => {
    const linkedTxs = (data.transactions || []).filter(t => t.linkedCustodyId === id);
    const blocked = linkedTxs.find(t => isMonthClosed(data, t.year || 2026, t.month));
    if (blocked) {
      addNotification({ type: 'error', title: 'الشهر مغلق', message: `لا يمكن حذف حركة مرتبطة بمعاملات في شهر ${blocked.month} ${blocked.year}`, duration: 6000 });

    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'حذف حركة العهدة', message: 'سيتم حذف الحركة والقيود المرتبطة بها',
      onConfirm: () => {
        saveHistory();
        const newEntries = custodyEntries.filter(e => e.id !== id);
        const newTxs = (data.transactions || []).filter(t => t.linkedCustodyId !== id);
        dispatch({ type: 'SET_DATA', payload: { ...data, custodyEntries: newEntries, transactions: newTxs } });

  const usagePct = summary.received > 0 ? (summary.totalSpent / summary.received) * 100 : 0;

  return (

            <h2 className={`text-3xl font-black tracking-tight money tabular ${summary.balance >= 0 ? 'text-blue-600' : 'text-red-600'}`}>
              {fmt(summary.balance)}<span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <p className="text-[11px] font-semibold mt-2" style={{ color: 'var(--text-muted)' }}>
              {summary.balance > 0 ? '⚠️ مبلغ متبقي معك' : summary.balance < 0 ? '⚠️ صرفت أكثر من العهدة' : '✅ مسددة بالكامل'}
            </p>
          </div>
          <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs"><Plus size={14} /> حركة جديدة</button>
        </div>
        <div className="grid grid-cols-4 gap-2 mt-4">
          <div className="p-2.5 rounded-xl bg-blue-50 dark:bg-blue-950/30 text-center">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">مستلم</p>
            <p className="text-sm font-black text-blue-600 mt-0.5 money tabular">{fmt(summary.received)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-cyan-50 dark:bg-cyan-950/30 text-center">
            <p className="text-[10px] font-bold text-cyan-700 dark:text-cyan-400">محوّل</p>
            <p className="text-sm font-black text-cyan-600 mt-0.5 money tabular">{fmt(summary.transferred)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-orange-50 dark:bg-orange-950/30 text-center">
            <p className="text-[10px] font-bold text-orange-700 dark:text-orange-400">كاش</p>
            <p className="text-sm font-black text-orange-600 mt-0.5 money tabular">{fmt(summary.spentCash)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-purple-50 dark:bg-purple-950/30 text-center">
            <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">بطاقة</p>
            <p className="text-sm font-black text-purple-600 mt-0.5 money tabular">{fmt(summary.spentCard)}</p>
          </div>
        </div>
        <div className="mt-3">
          <div className="flex justify-between text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>
            <span>نسبة الاستهلاك</span>
            <span className="money tabular">{Math.round(usagePct)}%</span>
          </div>
          <div className="w-full rounded-full h-1.5 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
            <div className={`h-full ${usagePct > 90 ? 'bg-red-500' : usagePct > 60 ? 'bg-amber-500' : 'bg-blue-500'}`} style={{ width: `${Math.min(100, usagePct)}%` }}></div>
          </div>
        </div>

      <div className="card p-2">
        <div className="flex gap-2 overflow-x-auto scroll-hide">

            <button key={f.id} onClick={() => setFilterType(f.id)} className={`badge px-3 py-1.5 cursor-pointer whitespace-nowrap ${filterType === f.id ? 'badge-accent' : 'badge-neutral'}`}>{f.label}</button>

const HanyShopLedger = memo(({ loan, prevMonthLoan, addNotification }) => {
  const [expanded, setExpanded] = useState(false);
  const [searchTerm, setSearchTerm] = useState('');
  const [viewMode, setViewMode] = useState('list');
  const [exporting, setExporting] = useState(false);
  const [sortBy, setSortBy] = useState('date');
  const containerRef = useRef(null);

  const payments = useMemo(() => {
    const arr = Array.isArray(loan.payments) ? loan.payments : [];
    return arr.slice().sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
  }, [loan.payments]);

  const totalPayments = payments.reduce((s, p) => s + safeNumber(p.amount), 0);
  const remainingAfterPayments = Math.max(0, safeNumber(loan.totalAmount) - totalPayments);

  const items = useMemo(() => {
    const raw = Array.isArray(loan.items) ? loan.items : [];
    return raw.slice().sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
  }, [loan.items]);

  const paidItems = useMemo(() => items.filter(i => i.status === 'paid'), [items]);
  const totalAllAmount = items.reduce((s, i) => s + safeNumber(i.amount), 0);

  const filteredItems = useMemo(() => {
    if (!searchTerm.trim()) return paidItems;
    const term = normalizeText(searchTerm);
    return paidItems.filter(i => normalizeText(i.description).includes(term) || normalizeText(i.category).includes(term) || normalizeText(i.method).includes(term));
  }, [paidItems, searchTerm]);

  const sortedItems = useMemo(() => {
    const arr = [...filteredItems];
    if (sortBy === 'amount') return arr.sort((a, b) => safeNumber(b.amount) - safeNumber(a.amount));
    if (sortBy === 'name') return arr.sort((a, b) => normalizeText(a.description).localeCompare(normalizeText(b.description)));
    return arr.sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
  }, [filteredItems, sortBy]);

  const groupedItems = useMemo(() => {
    const map = {};
    filteredItems.forEach(item => {
      const key = (item.description || 'بدون وصف').trim();
      if (!map[key]) map[key] = { name: key, count: 0, total: 0, items: [], subCategory: item.subCategory || null };
      map[key].count += 1;
      map[key].total += safeNumber(item.amount);
      map[key].items.push(item);
      if (!map[key].subCategory && item.subCategory) map[key].subCategory = item.subCategory;
    });
    return Object.values(map).sort((a, b) => b.total - a.total);
  }, [filteredItems]);

  const comparison = useMemo(() => {
    if (!prevMonthLoan) return null;
    const cur = safeNumber(loan.totalPaid);
    const prev = safeNumber(prevMonthLoan.totalPaid);
    if (prev === 0) return { cur, prev, change: cur > 0 ? 100 : 0, direction: cur > 0 ? 'up' : 'same', diff: cur - prev };
    const change = ((cur - prev) / prev) * 100;
    return { cur, prev, change, direction: change > 0.5 ? 'up' : change < -0.5 ? 'down' : 'same', diff: cur - prev };
  }, [loan.totalPaid, prevMonthLoan]);

  const bySubCategory = useMemo(() => {
    const map = {};
    paidItems.forEach(item => {
      const sub = item.subCategory || 'غير مصنف';
      if (!map[sub]) map[sub] = { label: sub, count: 0, total: 0 };
      map[sub].count += 1;
      map[sub].total += safeNumber(item.amount);
    });
    return Object.values(map).sort((a, b) => b.total - a.total);
  }, [paidItems]);

  const top3 = useMemo(() => groupedItems.slice(0, 3), [groupedItems]);
  const totalFiltered = filteredItems.reduce((s, i) => s + safeNumber(i.amount), 0);

  const handleExportPdf = async () => {
    if (!containerRef.current || exporting) return;
    if (paidItems.length === 0) { addNotification({ type: 'warning', title: 'لا توجد مسحوبات معتمدة للتصدير' }); return; }
    if (!window.html2pdf) { addNotification({ type: 'error', title: 'تعذّر تحميل مكتبة PDF' }); return; }
    setExporting(true);
    if (!expanded) setExpanded(true);
    await new Promise(r => setTimeout(r, 350));
    try {
      const element = containerRef.current;
      if (!element) throw new Error('Container not found');
      const scrollables = element.querySelectorAll('.scroll-hide, .pdf-expand');
      const savedStyles = [];
      scrollables.forEach((el) => { savedStyles.push({ el, maxHeight: el.style.maxHeight, overflow: el.style.overflow }); el.style.maxHeight = 'none'; el.style.overflow = 'visible'; });
      const hiddenEls = element.querySelectorAll('[data-pdf-hide="true"]');
      const hiddenSaved = [];
      hiddenEls.forEach((el) => { hiddenSaved.push({ el, disp: el.style.display }); el.style.display = 'none'; });
      const opt = { margin: [10, 8, 10, 8], filename: `مسحوبات_هاني_${loan.month}_${loan.year}.pdf`, image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false, windowWidth: 800 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } };
      await window.html2pdf().set(opt).from(element).save();
      savedStyles.forEach(({ el, maxHeight, overflow }) => { el.style.maxHeight = maxHeight; el.style.overflow = overflow; });
      hiddenSaved.forEach(({ el, disp }) => { el.style.display = disp; });
      addNotification({ type: 'success', title: 'تم تصدير PDF', message: `${filteredItems.length} معاملة — ${fmt(totalFiltered)} ج.م` });
    } catch (e) { console.error('PDF Export Error:', e); addNotification({ type: 'error', title: 'فشل التصدير', message: e.message || 'خطأ غير معروف' }); }
    finally { setExporting(false); }
  };

  useEffect(() => { if ((searchTerm.trim() || viewMode === 'grouped') && !expanded) setExpanded(true); }, [searchTerm, viewMode, expanded]);

  return (
    <div ref={containerRef} className="mt-3 pt-3" style={{ borderTop: '1px dashed var(--border-default)' }}>
      <button type="button" data-pdf-hide="true" onClick={() => setExpanded(v => !v)}
        className="w-full flex items-center justify-between p-2.5 rounded-lg text-[11px] font-bold hover:bg-[color:var(--bg-muted)] transition-colors"
        style={{ background: 'var(--bg-muted)' }}>
        <div className="flex items-center gap-2 flex-wrap min-w-0">
          <Receipt size={13} className="text-blue-500 flex-shrink-0" />
          <span>📋 سجل المسحوبات المعتمدة ({paidItems.length})</span>
          {items.length > paidItems.length && <span className="badge badge-warning text-[9px]">{items.length - paidItems.length} معلق</span>}
          {payments.length > 0 && <span className="badge badge-success text-[9px]">💵 {payments.length} دفعة</span>}
          {comparison && comparison.direction !== 'same' && (
            <span className={`badge text-[9px] ${comparison.direction === 'up' ? 'badge-danger' : 'badge-success'}`}>
              {comparison.direction === 'up' ? '↑' : '↓'} {Math.abs(Math.round(comparison.change))}%
            </span>
          )}
        </div>
        <ChevronDown size={14} className={`transition-transform flex-shrink-0 ${expanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
      </button>

      {expanded && (
        <div className="mt-3 space-y-3 animate-fadeIn">
          <div className="flex gap-1.5 flex-wrap" data-pdf-hide="true">
            <div className="relative flex-1 min-w-[140px]">
              <Search className="absolute right-2.5 top-1/2 -translate-y-1/2" size={12} style={{ color: 'var(--text-muted)' }} />
              <input type="text" placeholder="ابحث في المسحوبات..." className="input-field pr-8 text-[11px] py-2" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
            </div>
            <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <button type="button" onClick={() => setViewMode('list')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold transition-all ${viewMode === 'list' ? 'shadow-sm' : ''}`} style={viewMode === 'list' ? { background: 'var(--bg-card)', color: 'var(--accent)' } : { color: 'var(--text-muted)' }}>قائمة</button>
              <button type="button" onClick={() => setViewMode('grouped')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold transition-all ${viewMode === 'grouped' ? 'shadow-sm' : ''}`} style={viewMode === 'grouped' ? { background: 'var(--bg-card)', color: 'var(--accent)' } : { color: 'var(--text-muted)' }}>مُجمّع</button>
            </div>
            {viewMode === 'list' && (
              <select className="input-field text-[10px] py-2 px-1.5 w-auto min-w-[80px]" value={sortBy} onChange={e => setSortBy(e.target.value)} title="ترتيب">
                <option value="date">📅 التاريخ</option>
                <option value="amount">💰 المبلغ</option>
                <option value="name">🔤 الاسم</option>
              </select>
            )}
            <button type="button" onClick={handleExportPdf} disabled={exporting || filteredItems.length === 0} className="btn btn-secondary text-[10px] py-2 px-2.5 flex items-center gap-1" title="تصدير PDF">
              {exporting ? <RefreshCcw size={11} className="animate-spin" /> : <Download size={11} />}

          </div>

          <div className="p-3 rounded-lg grid grid-cols-3 gap-2 text-center" style={{ background: 'var(--bg-muted)' }}>
            <div>
              <p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>🛒 المشتريات</p>
              <p className="text-[13px] font-black text-red-600 money tabular">{fmt(totalAllAmount)}</p>
            </div>
            <div>
              <p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>💵 المدفوع</p>
              <p className="text-[13px] font-black text-emerald-600 money tabular">{fmt(totalPayments)}</p>
            </div>
            <div>
              <p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>⏳ المتبقي</p>
              <p className={`text-[13px] font-black money tabular ${remainingAfterPayments > 0 ? 'text-amber-600' : 'text-emerald-600'}`}>{fmt(remainingAfterPayments)}</p>
            </div>
          </div>

          {payments.length > 0 && (
            <div className="p-2.5 rounded-lg" style={{ background: 'rgba(0, 168, 107, 0.08)' }}>
              <div className="flex items-center justify-between mb-2">
                <p className="text-[10px] font-black text-emerald-700 dark:text-emerald-400">💵 الدفعات المسجلة ({payments.length})</p>
                <span className="text-[10px] font-black text-emerald-600 money tabular">إجمالي: {fmt(totalPayments)} ج.م</span>
              </div>
              <div className="space-y-1 max-h-40 overflow-y-auto scroll-hide">
                {payments.map(p => (
                  <div key={p.id} className="flex justify-between items-center gap-2 p-2 rounded-lg text-[10px]" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                    <div className="min-w-0 flex-1">
                      <p className="font-bold truncate">{p.description || 'سداد مسحوبات هاني'}</p>
                      <p className="text-[9px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>{p.date} • {PAYMENT_METHODS.find(m => m.id === p.method)?.label || p.method || 'cash'}</p>

                    <span className="font-black text-emerald-600 flex-shrink-0 money tabular">−{fmt(p.amount)}</span>
