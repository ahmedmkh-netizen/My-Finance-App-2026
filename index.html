const DuplicateDetectionSystem = ({ transactions, dispatch, addNotification, MONTHS, closedMonths }) => {
const [duplicateThreshold, setDuplicateThreshold] = useState(2);
const [selectedMonth, setSelectedMonth] = useState('كل الشهور');
const [expandedGroups, setExpandedGroups] = useState({});

const detectDuplicates = useMemo(() => {
const amountMap = {};
const filtered = selectedMonth === 'كل الشهور' ? transactions : transactions.filter(t => t.month === selectedMonth);
filtered.forEach(t => {
const key = `${Number(t.amount)}_${t.method}_${t.category}`;
if (!amountMap[key]) amountMap[key] = [];
amountMap[key].push(t);
});
return Object.entries(amountMap).filter(([_, items]) => items.length >= duplicateThreshold).map(([key, items]) => ({
key, amount: items[0].amount, count: items.length, items, category: items[0].category,
risk: items.length >= 5 ? 'high' : items.length >= 3 ? 'medium' : 'low'
}));
}, [transactions, duplicateThreshold, selectedMonth]);

const handleDeleteAll = () => {
    let idsToDelete = [];
    let protectedCount = 0;

    detectDuplicates.forEach(d => {
        const itemsToDelete = d.items.slice(1);
        
        itemsToDelete.forEach(item => {
            if (closedMonths?.includes(item.month)) {
                protectedCount++;
            } else {
                idsToDelete.push(item.id);
            }
        });

function dataReducer(state, action) {
switch (action.type) {
case 'SET_DATA': return { ...state, data: action.payload };
case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload };
case 'SET_FORM_DATA': return { ...state, formData: action.payload };
case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
case 'SET_ACTIVE_CATEGORY_DETAIL': return { ...state, activeCategoryDetail: action.payload };
case 'SET_REPEAT_MONTHS': return { ...state, repeatMonths: action.payload };
case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
case 'SET_BUDGETS': return { ...state, budgets: action.payload };
case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
case 'SET_EDITING_FAWRY': return { ...state, editingFawry: action.payload };
case 'SET_EDITING_ETISALAT': return { ...state, editingEtisalat: action.payload };
case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
case 'SET_FILTER_TYPE': return { ...state, filterType: action.payload };
case 'SET_HIDE_PAST': return { ...state, hidePast: action.payload };
case 'SET_AI_MODAL_OPEN': return { ...state, isAiModalOpen: action.payload };
case 'SET_AI_TAB': return { ...state, aiTab: action.payload };
case 'SET_AI_QUERY': return { ...state, aiQuery: action.payload };
case 'SET_AI_RESPONSE': return { ...state, aiResponse: action.payload };
case 'SET_AI_LOADING': return { ...state, isAiLoading: action.payload };
case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
case 'ADD_NOTIFICATION': return { ...state, notifications: [...state.notifications, { id: Date.now(), ...action.payload }] };
case 'REMOVE_NOTIFICATION': return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
case 'UPDATE_OPENING_BALANCE': return { ...state, data: { ...state.data, openingBalance2026: action.payload } }; // Action جديدة
case 'UPDATE_FAWRY_DATA': return { ...state, fawryData: action.payload };
case 'UPDATE_ETISALAT_DATA': return { ...state, etisalatData: action.payload };
case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
case 'ADD_TO_HISTORY':
const limitedHistory = [...state.history].slice(-19);
return { ...state, history: [...limitedHistory, action.payload], future: [] };
case 'UNDO':
if (state.history.length === 0) return state;
const previous = state.history[state.history.length - 1];
return { ...state, data: previous, history: state.history.slice(0, state.history.length - 1), future: [state.data, ...state.future] };
case 'REDO':
if (state.future.length === 0) return state;
const next = state.future[0];
return { ...state, data: next, history: [...state.history, state.data], future: state.future.slice(1) };
case 'TOGGLE_LEDGER':
return { ...state, expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] } };
case 'TOGGLE_CARDS_SECTION':
return { ...state, expandedCardsSection: !state.expandedCardsSection };
case 'SET_STATUS_FILTER':
return { ...state, statusFilter: action.payload };
case 'UPDATE_LOAN_DUE_DATE':
return { ...state, data: { ...state.data, loans: state.data.loans.map(loan => loan.id === action.payload.loanId ? { ...loan, nextPaymentDate: action.payload.newDate } : loan) } };
case 'SHOW_CONFIRM':
return { 
  ...state, 
  confirmDialog: { 
    isOpen: true, 
    title: action.title, 
    message: action.message, 
    onConfirm: action.onConfirm,
    onCancel: action.onCancel || (() => dispatch({ type: 'HIDE_CONFIRM' }))
  } 
};
case 'HIDE_CONFIRM':
return { ...state, confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null } };
case 'SET_QUICK_TRANSFER_MODAL_OPEN':
return { ...state, isQuickTransferModalOpen: action.payload };
case 'SET_QUICK_TRANSFER_DATA':
return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
case 'SET_BACKUP_REMINDER_OPEN':
return { ...state, isBackupReminderOpen: action.payload };
case 'SET_VIEWING_CARD_STATEMENT':
return { ...state, viewingCardStatement: action.payload };
case 'CLOSE_MONTH':
  return {
    ...state,
    data: {
      ...state.data,
      closedMonths: [...(state.data.closedMonths || []), action.payload.month],
      monthlySnapshots: { 
        ...(state.data.monthlySnapshots || {}), 
        [action.payload.month]: action.payload.balance 
      }
    }
  };
case 'TOGGLE_WALLET_VISIBILITY':
  return {
    ...state,
    walletVisibility: {
      ...state.walletVisibility,
      [action.payload]: !state.walletVisibility[action.payload]
    }
  };
case 'SET_IS_PROCESSING':
  return { ...state, isProcessing: action.payload };
default: return state;
}
}

// Enhanced Finance Snapshot Logic
const financeSnapshot = useMemo(() => {
// استخدام الرصيد الافتتاحي المخزن أو الصفر كقيمة افتراضية
let actualCarryover = Number(data.openingBalance2026 || 0);
const selectedMonthIdx = getMonthIndex(selectedMonth);
const transferCats = ['شحن محفظة', 'تحويلات', 'شحن رصيد فوري', 'شحن رصيد', 'إيداع'];

const prevMonthName = MONTHS[selectedMonthIdx - 1];

if (prevMonthName && data.closedMonths?.includes(prevMonthName)) {
actualCarryover = Number(data.monthlySnapshots[prevMonthName] || 0);
} else {
transactions.filter(t => getMonthIndex(t.month) < selectedMonthIdx).forEach(t => {
const amt = Number(t.amount || 0);
if (t.type === 'income' && t.status === 'paid') {
actualCarryover += amt;
} else if (t.type === 'expense' && t.status === 'paid') {
if (!['cib_card', 'aaib_card'].includes(t.method) && !transferCats.includes(t.category)) {
actualCarryover -= amt;
}
}
});
}

const currentMonthTrans = transactions.filter(t => t.month === selectedMonth);

const currentActualIncome = currentMonthTrans
.filter(t => t.type === 'income' && t.status === 'paid')
.reduce((s, t) => s + Number(t.amount || 0), 0);

const currentPendingIncome = currentMonthTrans
.filter(t => t.type === 'income' && t.status !== 'paid')
.reduce((s, t) => s + Number(t.amount || 0), 0);

const currentPaidCash = currentMonthTrans
.filter(t => t.type === 'expense' && t.status === 'paid' &&
!['cib_card', 'aaib_card'].includes(t.method) &&
!transferCats.includes(t.category))
.reduce((s, t) => s + Number(t.amount || 0), 0);

const currentPendingCash = currentMonthTrans
.filter(t => t.type === 'expense' && t.status !== 'paid' &&
!['cib_card', 'aaib_card'].includes(t.method))
.reduce((s, t) => s + Number(t.amount || 0), 0);

const currentCreditExpenses = currentMonthTrans
.filter(t => t.type === 'expense' && ['cib_card', 'aaib_card'].includes(t.method))
.reduce((s, t) => s + Number(t.amount || 0), 0);

const actualCashInHand = actualCarryover + currentActualIncome - currentPaidCash;
const projectedClosingBalance = actualCashInHand + currentPendingIncome - currentPendingCash;

return {
actualCarryover: actualCarryover,
income: currentActualIncome,
actualIncome: currentActualIncome,
cashExpenses: currentPaidCash,
creditExpenses: currentCreditExpenses,
pendingIncome: currentPendingIncome,
actualCashInHand,
projectedClosingBalance,
pendingAmount: currentPendingCash
};
}, [transactions, selectedMonth, data.closedMonths, data.monthlySnapshots, data.openingBalance2026]);

const chartData = useMemo(() => MONTHS.map(m => ({
name: m,
دخل: transactions.filter(t => t.month === m && t.type === 'income').reduce((a, c) => a + (Number(c.amount) || 0), 0),
مصروف: transactions.filter(t => t.month === m && t.type === 'expense').reduce((a, c) => a + (Number(c.amount) || 0), 0)
})), [transactions]);

const updatedLoans = useMemo(() => {
const map = transactions.reduce((acc, t) => {
if (t.linkedLoanId && (t.status === 'paid' || t.status === 'partial')) { acc[t.linkedLoanId] = (acc[t.linkedLoanId] || 0) + Number(t.amount); }
return acc;
}, {});
return loans.map(l => ({ ...l, totalPaid: (Number(l.prePaidAmount) || 0) + (map[l.id] || 0), remaining: Math.max(0, Number(l.totalAmount) - ((Number(l.prePaidAmount) || 0) + (map[l.id] || 0))) }));
}, [transactions, loans]);

const monthInsights = useMemo(() => {
const monthTrans = transactions.filter(t => t.month === selectedMonth);
const inc = monthTrans.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + Number(t.amount), 0);
const exp = monthTrans.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + Number(t.amount), 0);
const pendInc = monthTrans.filter(t => t.type === 'income' && t.status !== 'paid').reduce((s, t) => s + Number(t.amount), 0);
const pendExp = monthTrans.filter(t => t.type === 'expense' && t.status !== 'paid').reduce((s, t) => s + Number(t.amount), 0);
return { inc, exp, pendInc, pendExp, net: inc - exp };
}, [transactions, selectedMonth]);

const groupedTransactions = useMemo(() => {
const groups = {};
const term = normalizeText(searchTerm);
const selectedMonthIndex = getMonthIndex(selectedMonth);

transactions.filter(t => {
const isMonth = getMonthIndex(t.month) === selectedMonthIndex;
const isType = t.type === transViewMode;
const isSearch = !searchTerm ||
normalizeText(t.description).includes(term) ||
normalizeText(t.category).includes(term) ||
normalizeText(Number(t.amount).toString()).includes(term);

let isStatusMatch = true;
if (statusFilter === 'paid') isStatusMatch = t.status === 'paid';
else if (statusFilter === 'pending') isStatusMatch = t.status !== 'paid';

if (!isMonth || !isType || !isSearch || !isStatusMatch) return false;
if (filterType === 'all') return true;
if (filterType === 'high' && Number(t.amount) >= 1000) return true;
if (filterType === 'cib' && (t.method === 'cib_card' || t.method === 'cib_savings')) return true;
if (filterType === 'aaib' && (t.method === 'aaib_card' || t.method === 'aaib_savings')) return true;
if (t.method === filterType) return true;
return false;
}).forEach(t => {
if (!groups[t.category]) groups[t.category] = { category: t.category, total: 0, count: 0, items: [] };
groups[t.category].total += Number(t.amount);
groups[t.category].count++;
groups[t.category].items.push(t);
});
return Object.values(groups).sort((a, b) => b.total - a.total);
}, [transactions, selectedMonth, transViewMode, searchTerm, filterType, statusFilter]);

const visibleStats = useMemo(() => {
const flatItems = groupedTransactions.flatMap(g => g.items);
return { count: flatItems.length, sum: flatItems.reduce((sum, t) => sum + Number(t.amount), 0) };
}, [groupedTransactions]);

const fawryStats = useMemo(() => {
const deposits = transactions.filter(t => t.method === 'fawry' && t.subType === 'deposit').reduce((sum, t) => sum + Number(t.amount), 0);
const withdrawals = transactions.filter(t => t.method === 'fawry' && t.subType === 'withdrawal').reduce((sum, t) => sum + Number(t.amount), 0);
return { deposits, withdrawals };
}, [transactions]);
const currentFawryBalance = (Number(fawryData.openingBalance) || 0) + fawryStats.deposits - fawryStats.withdrawals;

const etisalatStats = useMemo(() => {
const deposits = transactions.filter(t => t.method === 'etisalat' && t.subType === 'deposit').reduce((sum, t) => sum + Number(t.amount), 0);
const withdrawals = transactions.filter(t => t.method === 'etisalat' && t.subType === 'withdrawal').reduce((sum, t) => sum + Number(t.amount), 0);
return { deposits, withdrawals };
}, [transactions]);
const currentEtisalatBalance = (Number(etisalatData.openingBalance) || 0) + etisalatStats.deposits - etisalatStats.withdrawals;

const getSavingsLedger = useCallback((methodId) => {
const accTransactions = transactions
.filter(t => t.method === methodId && t.status === 'paid')
.sort((a, b) => new Date(a.date) - new Date(b.date));

let runningBalance = 0;
return accTransactions.map(t => {
const amount = Number(t.amount);
const isDeposit = t.subType === 'deposit' || (t.type === 'income' && !t.subType);
if (isDeposit) runningBalance += amount;
else runningBalance -= amount;
return { ...t, runningBalance };
}).reverse();
}, [transactions]);

const fawryLedger = useMemo(() => {
const accTransactions = transactions
.filter(t => t.method === 'fawry' && t.status === 'paid')
.sort((a, b) => new Date(a.date) - new Date(b.date));

let runningBalance = fawryData.openingBalance || 0;
return accTransactions.map(t => {
const amount = Number(t.amount);
if (t.subType === 'deposit') runningBalance += amount;
else runningBalance -= amount;
return { ...t, runningBalance };
}).reverse();
}, [transactions, fawryData]);

const etisalatLedger = useMemo(() => {
const accTransactions = transactions
.filter(t => t.method === 'etisalat' && t.status === 'paid')
.sort((a, b) => new Date(a.date) - new Date(b.date));

let runningBalance = etisalatData.openingBalance || 0;
return accTransactions.map(t => {
const amount = Number(t.amount);
if (t.subType === 'deposit') runningBalance += amount;
else runningBalance -= amount;
return { ...t, runningBalance };
}).reverse();
}, [transactions, etisalatData]);

const calculateCardHistory = useCallback((card) => {
let runningDebt = Number(card.openingBalance) || 0;
return MONTHS.map(m => {
const expenses = transactions.filter(t =>
t.month === m &&
t.type === 'expense' &&
((t.method === 'cib_card' && card.bank === 'CIB') || (t.method === 'aaib_card' && card.bank === 'AAIB'))
).reduce((a, b) => a + Number(b.amount), 0);

const payments = transactions.filter(t =>
t.month === m &&
t.category === 'الالتزامات البنكية والتمويلية' &&
(t.linkedCardId === card.id || t.description?.includes(card.bank)) &&
!t.linkedLoanId
).reduce((a, b) => a + Number(b.amount), 0);

const openingDebt = runningDebt;
runningDebt = runningDebt + expenses - payments;

return {
month: m,
openingDebt,
expenses,
payments,
closingDebt: runningDebt,
available: Number(card.limit) - runningDebt
};
});
}, [transactions]);

const getAgendaItems = useCallback(() => {
try {
const today = new Date();
const currentDay = today.getDate();
const currentMonth = today.getMonth();
const currentYear = today.getFullYear();
const items = [];
if (Array.isArray(cards)) {
cards.forEach(card => {
const dueDay = parseInt(card.dueDate) || 5;
let targetMonth = currentMonth;
let targetYear = currentYear;
if (dueDay < currentDay) { targetMonth++; if (targetMonth > 11) { targetMonth = 0; targetYear++; } }
const date = new Date(targetYear, targetMonth, dueDay);
items.push({
id: `agenda-card-${card.id}-${targetMonth}-${targetYear}`,
title: `سداد بطاقة ${card.bank}`,
date: date.toISOString().split('T')[0],
amount: Math.max(0, card.limit - (card.openingBalance || 0)),
type: 'warning',
icon: CreditCard,
desc: 'استحقاق دوري'
});
});
}
if (Array.isArray(loans)) {
loans.forEach(loan => {
if (loan.monthlyInstallment > 0) {
const dueDay = parseInt(loan.dueDay) || 1;
let targetMonth = currentMonth;
let targetYear = currentYear;
if (dueDay < currentDay) { targetMonth++; if (targetMonth > 11) { targetMonth = 0; targetYear++; } }
const date = new Date(targetYear, targetMonth, dueDay);
items.push({
id: `agenda-loan-${loan.id}-${targetMonth}-${targetYear}`,
title: `قسط ${loan.name}`,
date: date.toISOString().split('T')[0],
amount: loan.monthlyInstallment,
type: 'danger',
icon: Banknote,
desc: loan.description
});
}
});
}
return items.sort((a, b) => new Date(a.date) - new Date(b.date));
} catch (err) { console.error("Agenda Error:", err); return []; }
}, [cards, loans, recurringItems]);

const removeNotification = useCallback((id) => { dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }); }, []);
const addNotification = useCallback((notification) => {
const exists = notifications.some(n => n.title === notification.title && n.message === notification.message);
if (exists) return;
const id = Date.now() + Math.random();
dispatch({ type: 'ADD_NOTIFICATION', payload: { id, ...notification } });
if (!notification.persistent) setTimeout(() => removeNotification(id), 6000);
}, [notifications, removeNotification]);

const exportWalletCSV = useCallback((walletKey) => {
const ledger = walletKey === 'fawry' ? fawryLedger : etisalatLedger;
const walletName = walletKey === 'fawry' ? 'فوري' : 'اتصالات';
  
const header = "التاريخ,نوع العملية,الوصف,المبلغ,الرصيد الجاري\n";
const rows = ledger.map(t => 
  `${t.date},${t.subType === 'deposit' ? 'إيداع' : 'سحب'},"${t.description || ''}",${t.amount},${t.runningBalance}`
).join("\n");
  
const bom = "\uFEFF";
const blob = new Blob([bom + header + rows], { type: 'text/csv;charset=utf-8;' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = `${walletName}_transactions_${new Date().toISOString().split('T')[0]}.csv`;
a.click();
}, [fawryLedger, etisalatLedger]);

const handleSaveTransaction = useCallback((e) => {
  e.preventDefault();

  // منع المعالجة المزدوجة
  if (isProcessing) {
    addNotification({
      type: 'warning',
      title: 'جاري المعالجة',
      message: 'يرجى الانتظار حتى تنتهي العملية الحالية'
    });
    return;
  }

  dispatch({ type: 'SET_IS_PROCESSING', payload: true });

  // التحقق من الشهر المغلق
  if (data.closedMonths?.includes(formData.month)) {
    addNotification({ 
      type: 'error', 
      title: 'تنبيه', 
      message: `شهر ${formData.month} مغلق، لا يمكن إضافة أو تعديل عمليات فيه.` 
    });
    dispatch({ type: 'SET_IS_PROCESSING', payload: false });
    return;
  }

  // تأخير التنفيذ لمحاكاة المعالجة
  setTimeout(() => {
    try {
      saveHistory();
      
      let finalSubType = formData.subType;
      if (['شحن رصيد فوري', 'شحن رصيد', 'إيداع', 'شحن محفظة'].includes(formData.category) &&
          ['fawry', 'etisalat', 'cib_savings', 'aaib_savings'].includes(formData.method)) {
        finalSubType = 'deposit';
      } else {
        finalSubType = formData.subType || (formData.type === 'income' ? 'deposit' : 'withdrawal');
      }

      // التحقق من الرصيد للعمليات الفورية
      const immediateAccounts = ['cash', 'fawry', 'etisalat', 'cib_savings', 'aaib_savings'];
      const amount = Number(formData.amount);
      
      if (immediateAccounts.includes(formData.method) && formData.type === 'expense') {
        let availableBalance = 0;
        
        switch(formData.method) {
          case 'cash':
            availableBalance = financeSnapshot.actualCashInHand;
            break;
          case 'fawry':
            availableBalance = currentFawryBalance;
            break;
          case 'etisalat':
            availableBalance = currentEtisalatBalance;
            break;
          case 'cib_savings':
            const cibLedger = getSavingsLedger('cib_savings');
            availableBalance = cibLedger.length > 0 ? cibLedger[0].runningBalance : 0;
            break;
          case 'aaib_savings':
            const aaibLedger = getSavingsLedger('aaib_savings');
            availableBalance = aaibLedger.length > 0 ? aaibLedger[0].runningBalance : 0;
            break;
        }
        
        if (amount > availableBalance) {
          dispatch({
            type: 'SHOW_CONFIRM',
            title: 'رصيد غير كافٍ',
            message: `الرصيد المتاح في ${PAYMENT_METHODS.find(p => p.id === formData.method)?.label} هو ${availableBalance.toLocaleString()} ج.م. هل تريد الاستمرار وتسجيل هذا كمديونية؟`,
            onConfirm: () => {
              finalizeTransaction(finalSubType);
            },
            onCancel: () => {
              dispatch({ type: 'SET_IS_PROCESSING', payload: false });
            }
          });
          return;
        }
      }
      
      finalizeTransaction(finalSubType);
    } catch (error) {
      console.error('Error saving transaction:', error);
      addNotification({ 
        type: 'error', 
        title: 'خطأ في الحفظ', 
        message: 'حدث خطأ أثناء حفظ العملية' 
      });
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
    }
  }, 300);

  const finalizeTransaction = (finalSubType) => {
    const selectedDay = formData.date.split('-')[2] || '01';

    const processTransaction = (m, idOverride) => {
      const targetMonthIdx = String(getMonthIndex(m) + 1).padStart(2, '0');
      const adjustedDate = `${CURRENT_YEAR}-${targetMonthIdx}-${selectedDay}`;

      return {
        ...formData,
        id: idOverride || getSafeId(),
        amount: Number(formData.amount),
        month: m,
        monthIndex: getMonthIndex(m),
        date: adjustedDate,
        subType: finalSubType
      };
    };

    let newTransactions = [...transactions];
    if (formMode === 'add') {
      newTransactions.push(processTransaction(selectedMonth));
      if (repeatMonths && repeatMonths.length > 0) {
        repeatMonths.forEach(m => { 
          newTransactions.push(processTransaction(m)); 
        });
      }
    } else {
      newTransactions = newTransactions.map(t => 
        t.id === formData.id ? processTransaction(formData.month, formData.id) : t
      );
    }

    // تحديث تاريخ القرض إذا كان سداداً
    if (formMode === 'add' && formData.linkedLoanId && 
        formData.category === 'الالتزامات البنكية والتمويلية' && 
        formData.status === 'paid') {
      const targetLoan = loans.find(l => l.id === formData.linkedLoanId);
      if (targetLoan && targetLoan.nextPaymentDate) {
        const oldDate = new Date(targetLoan.nextPaymentDate);
        const newDateObj = new Date(oldDate.setMonth(oldDate.getMonth() + 1));
        const newDateStr = newDateObj.toISOString().split('T')[0];
        dispatch({ 
          type: 'UPDATE_LOAN_DUE_DATE', 
          payload: { loanId: targetLoan.id, newDate: newDateStr } 
        });
      }
    }

    newTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTransactions });
    dispatch({ type: 'SET_FORM_OPEN', payload: false });
    dispatch({ type: 'SET_REPEAT_MONTHS', payload: [] });
    
    addNotification({ 
      type: 'success', 
      title: formMode === 'add' ? 'تمت الإضافة بنجاح' : 'تم التعديل بنجاح',
      message: `تم ${formData.type === 'income' ? 'إضافة دخل' : 'خصم مصروف'} بقيمة ${formData.amount} ج.م`,
      persistent: true,
      duration: 3000
    });
    
    dispatch({ type: 'SET_IS_PROCESSING', payload: false });
  };
}, [formData, formMode, selectedMonth, repeatMonths, transactions, saveHistory, addNotification, currentFawryBalance, currentEtisalatBalance, loans, dispatch, data.closedMonths, financeSnapshot, getSavingsLedger, isProcessing]);

const handleQuickTransfer = useCallback((e) => {
e.preventDefault();
if (data.closedMonths?.includes(selectedMonth)) {
addNotification({ type: 'error', title: 'تنبيه', message: 'هذا الشهر مغلق محاسبياً، لا يمكن إجراء تحويلات فيه.' });

}

dispatch({ type: 'SET_IS_PROCESSING', payload: true });
setTimeout(() => {
saveHistory();
const amount = Number(quickTransferData.amount);

if (amount <= 0 || isNaN(amount)) {
addNotification({ type: 'error', title: 'خطأ', message: 'يرجى إدخال مبلغ صحيح أكبر من صفر' });
dispatch({ type: 'SET_IS_PROCESSING', payload: false });
return;
}

if (quickTransferData.from === quickTransferData.to) {
addNotification({ type: 'error', title: 'خطأ', message: 'لا يمكن التحويل لنفس المحفظة' });
dispatch({ type: 'SET_IS_PROCESSING', payload: false });
return;
}

let sourceBalance = 0;
if (quickTransferData.from === 'fawry') {
sourceBalance = currentFawryBalance;
} else if (quickTransferData.from === 'etisalat') {
sourceBalance = currentEtisalatBalance;
} else if (quickTransferData.from === 'cash') {
sourceBalance = financeSnapshot.actualCashInHand;
} else if (quickTransferData.from === 'cib_savings') {
const ledger = getSavingsLedger('cib_savings');
sourceBalance = ledger.length > 0 ? ledger[0].runningBalance : 0;
} else if (quickTransferData.from === 'aaib_savings') {
const ledger = getSavingsLedger('aaib_savings');
sourceBalance = ledger.length > 0 ? ledger[0].runningBalance : 0;
}

if (amount > sourceBalance) {
addNotification({ type: 'error', title: 'رصيد غير كافٍ', message: `رصيد الحساب المصدر (${sourceBalance.toLocaleString()}) لا يكفي للتحويل.` });
dispatch({ type: 'SET_IS_PROCESSING', payload: false });

const handleManualReconciliation = useCallback((walletKey, actualAmount) => {
    // حساب الرصيد الحالي لكل محفظة
    const calculateWalletBalance = (key) => {
        if (key === 'cash') {
            return financeSnapshot.actualCashInHand;
        } else if (key === 'fawry') {
            return currentFawryBalance;
        } else if (key === 'etisalat') {
            return currentEtisalatBalance;
        } else if (key === 'cib_savings') {
            const cibLedger = getSavingsLedger('cib_savings');
            return cibLedger.length > 0 ? cibLedger[0].runningBalance : 0;
        } else if (key === 'aaib_savings') {
            const aaibLedger = getSavingsLedger('aaib_savings');
            return aaibLedger.length > 0 ? aaibLedger[0].runningBalance : 0;
        }
        return 0;
    };

    const currentBalance = calculateWalletBalance(walletKey);
    const difference = Number(actualAmount) - currentBalance;

    if (actualAmount === "" || isNaN(difference)) {
        addNotification({ type: 'warning', title: 'خطأ', message: 'يرجى إدخال مبلغ صحيح.' });
        return;
    }

    if (difference === 0) {
        addNotification({ type: 'info', title: 'مطابقة', message: 'الرصيد في التطبيق مطابق للواقع.' });
        return;
    }

    if (data.closedMonths?.includes(selectedMonth)) {
        addNotification({ 
            type: 'error', 
            title: 'تنبيه', 
            message: `شهر ${selectedMonth} مغلق محاسبياً، لا يمكن إجراء تسوية فيه.` 
        });
        return;
    }

    dispatch({
        type: 'SHOW_CONFIRM',
        title: 'تأكيد التسوية اليدوية',
        message: `سيتم إضافة عملية ${difference > 0 ? 'إيداع' : 'خصم'} بقيمة ${Math.abs(difference).toLocaleString()} ج.م لضبط فارق المحفظة. هل تريد المتابعة؟`,
        onConfirm: () => {
            saveHistory();
            
            const reconciliationTrans = {
                id: 'adj-' + getSafeId(),
                type: difference > 0 ? 'income' : 'expense',
                category: 'أخرى',
                amount: Math.abs(difference),
                description: `تسوية يدوية لضبط رصيد ${PAYMENT_METHODS.find(p => p.id === walletKey)?.label || walletKey}`,
                method: walletKey,
                date: getLocalISODate(),
                month: selectedMonth,
                monthIndex: getMonthIndex(selectedMonth),
                subType: difference > 0 ? 'deposit' : 'withdrawal',
                status: 'paid'
            };

            const newTransactions = [reconciliationTrans, ...transactions];
            newTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
            dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTransactions });
            addNotification({ 
                type: 'success', 
                title: 'تمت التسوية بنجاح', 
                message: `تم إضافة عملية ${difference > 0 ? 'إيداع' : 'خصم'} بقيمة ${Math.abs(difference).toLocaleString()} ج.م لضبط رصيد المحفظة.` 
            });
        },
        onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
}, [financeSnapshot, currentFawryBalance, currentEtisalatBalance, getSavingsLedger, transactions, selectedMonth, saveHistory, addNotification, data.closedMonths, dispatch]);

const projection = {};

for(let i =0; i<12; i++) {

const monthKey = d.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });

updatedLoans.forEach(loan => {
const monthsToFinish = Math.ceil(loan.remaining / (loan.monthlyInstallment ||1));
if(i < monthsToFinish && loan.monthlyInstallment > 0) {
projection[monthKey] += Number(loan.monthlyInstallment);
}
});
}
return projection;
};

const plannerProjection = useMemo(() => {
const currentMonthIdx = new Date().getMonth();
const monthsRemaining = MONTHS.slice(currentMonthIdx);

let runningLiquidity = financeSnapshot.actualCashInHand;
let simulatedLoans = JSON.parse(JSON.stringify(updatedLoans));

let simulatedCards = cards.map(card => {
const history = calculateCardHistory(card);
const currentMonthDebt = history.find(h => h.month === selectedMonth)?.closingDebt || 0;
return { ...card, currentDebt: currentMonthDebt };
});

return monthsRemaining.map((month) => {
let monthlyLoanPayments = 0;
simulatedLoans = simulatedLoans.map(l => {
const payment = Math.min(l.remaining, l.monthlyInstallment);
monthlyLoanPayments += payment;
return { ...l, remaining: l.remaining - payment };
});

let monthlyCardPayments = simulatedCards.reduce((sum, c) => sum + c.currentDebt, 0);
simulatedCards = simulatedCards.map(c => ({ ...c, currentDebt: 0 }));

const totalOutflow = monthlyLoanPayments + monthlyCardPayments;

const monthlyNetIncome = financeSnapshot.actualIncome - financeSnapshot.cashExpenses;
const openingLiquidity = runningLiquidity;
runningLiquidity = (openingLiquidity + monthlyNetIncome) - totalOutflow;

const remainingTotalDebt = simulatedLoans.reduce((sum, l) => sum + l.remaining, 0);

const isDanger = runningLiquidity < 0;

return { month, openingLiquidity, totalOutflow, runningLiquidity, remainingTotalDebt, isDanger };
});
}, [financeSnapshot, updatedLoans, cards, selectedMonth]);

</summary>
<div className="p-4 border-t border-slate-100 dark:border-slate-700">
<select className="input-field text-sm font-bold w-full" value={formData.linkedLoanId || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, linkedLoanId: e.target.value ? Number(e.target.value) : '' } }) }><option value="">-- اختر القرض --</option>{updatedLoans.map(l => (<option key={l.id} value={l.id}>{l.name}</option>))}</select>
</div>
</details>
)}

{formData.type === 'expense' && formData.category === 'الالتزامات البنكية والتمويلية' && (
<div>
<label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2 flex items-center gap-2 tracking-wider"><CreditCard size={14} /> سداد بطاقة ائتمان</label>
<select className="input-field text-sm font-bold bg-blue-50/50 border-blue-200" value={formData.linkedCardId || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, linkedCardId: e.target.value ? Number(e.target.value) : '' } }) }><option value="">-- اختر البطاقة --</option>{cards.map(c => (<option key={c.id} value={c.id}>{c.name} - {c.bank}</option>))}</select>
</div>
)}

<div><label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2 block tracking-wider">الوصف</label><input type="text" id="form-desc" className="input-field font-bold" value={formData.description} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: e.target.value } })} placeholder="تفاصيل إضافية..." /></div>
{formMode === 'add' && (<details className="group border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden bg-white dark:bg-slate-800"><summary className="p-4 cursor-pointer text-xs font-bold text-slate-500 flex items-center justify-between select-none hover:bg-slate-50 transition-colors"><span className="flex items-center gap-2"><Repeat size={16} className="text-blue-500" /> تكرار العملية في المستقبل</span><ChevronDown size={16} className="group-open:rotate-180 transition-transform" /></summary><div className="p-4 border-t border-slate-100 dark:border-slate-700 flex flex-wrap gap-2">{MONTHS.map((m, idx) => { if (idx <= MONTHS.indexOf(selectedMonth)) return null; return (<label key={m} className="inline-flex items-center gap-2 bg-slate-50 dark:bg-slate-700 px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-600 cursor-pointer select-none text-xs font-bold hover:border-blue-300 transition-colors"><input type="checkbox" className="rounded text-blue-600 focus:rope-0 w-4 h-4" onChange={(e) => { if (e.target.checked) { dispatch({ type: 'SET_REPEAT_MONTHS', payload: [...(repeatMonths || []), m] }); } else { dispatch({ type: 'SET_REPEAT_MONTHS', payload: (repeatMonths || []).filter(rm => rm !== m) }); } }} />{m}</label>); })}</div></details>)}
<button type="submit" className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-black text-lg shadow-xl hover:shadow-2xl hover:scale-[1.02] active:scale-95 transition-all mt-4 relative overflow-hidden" disabled={isProcessing}>
  {isProcessing ? (
    <>
      <div className="absolute inset-0 bg-blue-600 flex items-center justify-center">
        <div className="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      </div>
      <span className="invisible">حفظ العملية</span>
    </>
  ) : 'حفظ العملية'}
</button>
</form>
</div>
</div>
)}

{isAiModalOpen && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden animate-fadeIn border border-purple-500/20 flex flex-col max-h-[90vh]">
<div className="p-8 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center gradient-border">
<h3 className="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3"><div className="gradient-bg-primary p-2 rounded-xl text-white shadow-lg"><Bot size={20} /></div>المساعد المالي الذكي</h3>
<button type="button" onClick={() => dispatch({ type: 'SET_AI_MODAL_OPEN', payload: false })} className="text-slate-400 hover:text-red-500 p-2 hover:bg-red-50 rounded-xl transition-colors"><X size={24} /></button>
</div>
<div className="p-8 flex-1 overflow-y-auto scroll-hide">
<div className="flex gap-4 mb-6 border-b border-slate-100 dark:border-slate-800 pb-4"><button type="button" onClick={handleAnalyzeFinances} disabled={isAiLoading} className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold shadow-lg hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3">{isAiLoading ? 'جاري التحليل...' : 'تحليل الوضع المالي الحالي'}</button>{aiResponse && (<div className="bg-slate-50 dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 animate-fadeIn"><p className="text-slate-700 dark:text-slate-200 leading-relaxed font-medium">{aiResponse}</p></div>)}</div>
</div>
</div>
</div>
)}

{editingBudgetCategory && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl shadow-2xl p-8 animate-fadeIn border border-blue-500/20">
<h3 className="text-2xl font-black mb-6 text-slate-800 dark:text-white">تعديل ميزانية: <span className="text-blue-600">{editingBudgetCategory}</span></h3>
<div className="space-y-6">
<div><label className="block text-sm font-bold mb-3 text-slate-500 uppercase">المبلغ المخصص</label><input type="number" className="input-field text-xl font-black text-blue-600" value={budgetAmount} onChange={e => dispatch({ type: 'SET_BUDGET_AMOUNT', payload: e.target.value })} /></div>
<div className="flex gap-4"><button type="button" onClick={handleSaveBudget} className="flex-1 gradient-bg-primary text-white py-3 rounded-2xl font-bold shadow-lg">حفظ</button><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null })} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-500 py-3 rounded-2xl font-bold">إلغاء</button></div>
</div>
</div>
</div>
)}

{editingCard && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-fadeIn border border-slate-200 dark:border-slate-700 max-h-[90vh] flex flex-col">
<div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50">
<h3 className="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2"><Edit size={20} className="text-blue-500"/> تعديل بيانات البطاقة</h3>
<button type="button" onClick={() => dispatch({ type: 'SET_EDITING_CARD', payload: null })} className="text-slate-400 hover:text-red-500 p-2 hover:bg-red-50 rounded-xl transition-colors"><X size={24} /></button>
</div>
<form onSubmit={handleUpdateCard} className="p-6 space-y-4 overflow-y-auto scroll-hide">
<div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-500 mb-1 block">اسم البطاقة</label><input type="text" required className="input-field" value={editingCard.name} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, name:e.target.value}})} /></div><div><label className="text-xs font-bold text-slate-500 mb-1 block">البنك</label><input type="text" required className="input-field" value={editingCard.bank} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, bank:e.target.value}})} /></div></div>
<div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-500 mb-1 block">الحد الائتماني (Limit)</label><input type="number" required className="input-field text-blue-600 font-bold" value={editingCard.limit} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, limit:Number(e.target.value)}})} /></div><div><label className="text-xs font-bold text-slate-500 mb-1 block">رصيد أول المدة (مديونية)</label><input type="number" className="input-field text-red-500 font-bold" value={editingCard.openingBalance} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, openingBalance:Number(e.target.value)}})} /></div></div>
<div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-500 mb-1 block">اسم حامل البطاقة</label><input type="text" className="input-field uppercase text-sm" value={editingCard.holderName} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, holderName:e.target.value}})} /></div><div><label className="text-xs font-bold text-slate-500 mb-1 block">تاريخ الانتهاء</label><input type="text" placeholder="MM/YY" className="input-field text-center" value={editingCard.expiry} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, expiry:e.target.value}})} /></div></div>
<div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-500 mb-1 block">آخر 4 أرقام</label><input type="text" maxLength="4" className="input-field text-center tracking-widest" value={editingCard.last4} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, last4:e.target.value}})} /></div><div><label className="text-xs font-bold text-slate-500 mb-1 block">يوم الاستحقاق</label><input type="text" className="input-field text-center" value={editingCard.dueDate} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, dueDate:e.target.value}})} /></div></div>
<div><label className="text-xs font-bold text-slate-500 mb-1 block">لون البطاقة (Theme)</label><select className="input-field" value={editingCard.theme} onChange={e=>dispatch({type:'SET_EDITING_CARD', payload:{...editingCard, theme:e.target.value}})}><option value="silver">فضي (Silver)</option><option value="gold">ذهبي (Gold)</option><option value="platinum">بلاتيني (Platinum)</option><option value="black">أسود (Black)</option><option value="blue">أزرق (Blue)</option></select></div>
<button type="submit" className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold shadow-lg hover:shadow-xl transition-all mt-2 active:scale-95">حفظ التعديلات</button>
</form>
</div>
</div>
)}

{editingLoan && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-fadeIn">
<div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center"><h3 className="text-xl font-black">تعديل الالتزام</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: null })}><X size={24} /></button></div>
<form onSubmit={handleUpdateLoan} className="p-6 space-y-4"><div><label className="text-xs font-bold text-slate-500">الاسم</label><input type="text" className="input-field" value={editingLoan.name} onChange={e=>dispatch({type:'SET_EDITING_LOAN', payload:{...editingLoan, name:e.target.value}})} /></div><div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-500">المبلغ الكلي</label><input type="number" className="input-field" value={editingLoan.totalAmount} onChange={e=>dispatch({type:'SET_EDITING_LOAN', payload:{...editingLoan, totalAmount:e.target.value}})} /></div><div><label className="text-xs font-bold text-slate-500">القسط الشهري</label><input type="number" className="input-field" value={editingLoan.monthlyInstallment} onChange={e=>dispatch({type:'SET_EDITING_LOAN', payload:{...editingLoan, monthlyInstallment:e.target.value}})} /></div></div><button type="submit" className="w-full gradient-bg-primary text-white py-3 rounded-xl font-bold mt-4">حفظ التعديلات</button></form>
</div>
</div>
)}

{editingFawry && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-fadeIn border border-yellow-400/50">
<div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-yellow-50 dark:bg-yellow-900/10">
<h3 className="text-xl font-black text-slate-800 dark:text-white">ضبط رصيد فوري</h3>
<button type="button" onClick={() => dispatch({ type: 'SET_EDITING_FAWRY', payload: null })} className="p-2 hover:bg-red-50 hover:text-red-500 rounded-xl transition-colors"><X size={24} /></button>
</div>
<form onSubmit={(e) => { e.preventDefault(); localStorage.setItem('fawryData', JSON.stringify(editingFawry)); dispatch({ type: 'UPDATE_FAWRY_DATA', payload: editingFawry }); dispatch({ type: 'SET_EDITING_FAWRY', payload: null }); addNotification({ type: 'success', title: 'تم الحفظ', message: 'تم تحديث رصيد فوري الافتتاحي' }); }} className="p-6 space-y-6">
<div className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700">
<div className="flex items-center gap-2 mb-4 text-sm font-bold text-fawryBlue"><Calculator size={18} /> معادلة الرصيد التلقائية</div>
<div className="space-y-2 text-sm font-mono">
<div className="flex justify-between items-center"><span className="text-slate-500">رصيد البداية (الافتتاحي)</span><span className="font-bold text-slate-800 dark:text-white">{Number(editingFawry.openingBalance).toLocaleString()}</span></div>
<div className="flex justify-between items-center text-emerald-600"><span>+ إجمالي الشحن (من المعاملات)</span><span className="font-bold">+{fawryStats.deposits.toLocaleString()}</span></div>
<div className="flex justify-between items-center text-red-500"><span>- إجمالي المدفوعات (من المعاملات)</span><span className="font-bold">-{fawryStats.withdrawals.toLocaleString()}</span></div>
<div className="h-px bg-slate-300 dark:bg-slate-600 my-2"></div>
<div className="flex justify-between items-center text-lg font-black text-fawryBlue"><span>= الرصيد الحالي المتوقع</span><span>{((Number(editingFawry.openingBalance) || 0) + fawryStats.deposits - fawryStats.withdrawals).toLocaleString()} ج.م</span></div>
</div>
</div>
<div><label className="block text-xs font-bold text-slate-500 mb-2">تعديل رصيد البداية</label><input type="number" step="0.01" className="input-field text-xl font-black text-fawryBlue" value={editingFawry.openingBalance} onChange={e => dispatch({ type: 'SET_EDITING_FAWRY', payload: { ...editingFawry, openingBalance: Number(e.target.value) } })} placeholder="أدخل الرصيد الموجود قبل 2026..." /><p className="text-[10px] text-slate-400 mt-2 leading-relaxed">💡 تلميح: لا تقم بكتابة الرصيد الحالي هنا. فقط اكتب الرصيد الذي بدأت به السنة (أو رصيد الترحيل)، وسيقوم التطبيق بحساب الباقي.</p></div>
<button type="submit" className="w-full gradient-bg-primary text-white py-3 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all">حفظ التعديلات</button>
</form>
</div>
</div>
)}

{editingEtisalat && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-fadeIn border border-green-500/50">
<div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-green-50 dark:bg-green-900/10">
<h3 className="text-xl font-black text-slate-800 dark:text-white">ضبط اتصالات كاش</h3>
<button type="button" onClick={() => dispatch({ type: 'SET_EDITING_ETISALAT', payload: null })} className="p-2 hover:bg-red-50 hover:text-red-500 rounded-xl transition-colors"><X size={24} /></button>
</div>
<form onSubmit={(e) => { e.preventDefault(); localStorage.setItem('etisalatData', JSON.stringify(editingEtisalat)); dispatch({ type: 'UPDATE_ETISALAT_DATA', payload: editingEtisalat }); dispatch({ type: 'SET_EDITING_ETISALAT', payload: null }); addNotification({ type: 'success', title: 'تم الحفظ', message: 'تم تحديث رصيد المحفظة الافتتاحي' }); }} className="p-6 space-y-6">
<div className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700">
<div className="flex items-center gap-2 mb-4 text-sm font-bold text-etisalatGreen"><Calculator size={18} /> معادلة الرصيد التلقائية</div>
<div className="space-y-2 text-sm font-mono">
<div className="flex justify-between items-center"><span className="text-slate-500">رصيد البداية (الافتتاحي)</span><span className="font-bold text-slate-800 dark:text-white">{Number(editingEtisalat.openingBalance).toLocaleString()}</span></div>
<div className="flex justify-between items-center text-emerald-600"><span>+ إجمالي الإيداع/التحويلات</span><span className="font-bold">+{etisalatStats.deposits.toLocaleString()}</span></div>
<div className="flex justify-between items-center text-red-500"><span>- إجمالي السحب/الشراء</span><span className="font-bold">-{etisalatStats.withdrawals.toLocaleString()}</span></div>
<div className="h-px bg-slate-300 dark:bg-slate-600 my-2"></div>
<div className="flex justify-between items-center text-lg font-black text-etisalatGreen"><span>= الرصيد الحالي المتوقع</span><span>{((Number(editingEtisalat.openingBalance) || 0) + etisalatStats.deposits - etisalatStats.withdrawals).toLocaleString()} ج.م</span></div>
</div>
</div>
<div><label className="block text-xs font-bold text-slate-500 mb-2">تعديل رصيد البداية</label><input type="number" step="0.01" className="input-field text-xl font-black text-etisalatGreen" value={editingEtisalat.openingBalance} onChange={e => dispatch({ type: 'SET_EDITING_ETISALAT', payload: { ...editingEtisalat, openingBalance: Number(e.target.value) } })} placeholder="أدخل الرصيد الافتتاحي..." /></div>
<button type="submit" className="w-full gradient-bg-success text-white py-3 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all">حفظ التعديلات</button>
</form>
</div>
</div>
)}

{isQuickTransferModalOpen && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-fadeIn border border-blue-500/50">
<div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center gradient-border">
<h3 className="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2"><ArrowRightLeft size={20} className="text-blue-600"/> تحويل سريع</h3>
<button type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false })} className="p-2 hover:bg-red-50 hover:text-red-500 rounded-xl transition-colors"><X size={24} /></button>
</div>
<form onSubmit={handleQuickTransfer} className="p-6 space-y-6">
<div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl">
<div className="flex justify-between items-center text-sm font-bold text-blue-700 dark:text-blue-300 mb-2">
<span>من</span>
<span>إلى</span>
</div>
<div className="flex justify-between items-center gap-4">
<select className="input-field text-sm" value={quickTransferData.from} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: e.target.value } })}>
{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
</select>
<div className="text-blue-300"><ArrowRightLeft size={20} /></div>
<select className="input-field text-sm" value={quickTransferData.to} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { to: e.target.value } })}>
{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
</select>
</div>
</div>
<div><label className="block text-sm font-bold mb-3 text-slate-500 uppercase">المبلغ</label><input type="number" required step="0.01" className="input-field text-xl font-black text-blue-600" value={quickTransferData.amount} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: e.target.value } })} placeholder="0.00" /></div>
<button type="submit" className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold shadow-lg hover:shadow-xl transition-all active:scale-95">تنفيذ التحويل</button>
</form>
</div>
</div>
)}
</div>
);
}

const rootElement = document.getElementById('root');
if(rootElement) {
// إخفاء شاشة التحميل عند تحميل التطبيق
setTimeout(() => {
  document.getElementById('loading').style.display = 'none';
}, 2000);

createRoot(rootElement).render(
<ErrorBoundary>
<App />
</ErrorBoundary>
);
}
</script>
</body>
</html>
