const parseMonthKey = (key) => { if (!key || typeof key !== 'string' || !key.includes('-')) return null; const [y, ...rest] = key.split('-'); const year = Number(y); if (isNaN(year)) return null; return { year, month: rest.join('-') }; };

// 🆕 helpers لأشهر المتكررات
const monthStrToNum = (str) => {
  if (!str || typeof str !== 'string') return null;
  const parts = str.split('-');
  const y = Number(parts[0]);
  const m = Number(parts[1]);
  if (!y || !m || m < 1 || m > 12) return null;
  return y * 100 + m;
};

const ALL_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const YEARS_CONFIG = { 2026: ['أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'], 2027: ALL_MONTHS, 2028: ALL_MONTHS };
const YEARS_LIST = [2026, 2027, 2028];
const getMonthsForYear = (y) => YEARS_CONFIG[y] || ALL_MONTHS;
const getMonthIndex = (m) => ALL_MONTHS.indexOf(m);

const isRecurringActiveInMonth = (r, targetYear, targetMonthIdx) => {
  if (!r) return false;
  if (r.isPaused) return false;
  const targetNum = targetYear * 100 + (targetMonthIdx + 1);
  if (r.startMonth) {
    const startNum = monthStrToNum(r.startMonth);
    if (startNum !== null && startNum > targetNum) return false;
  }
  if (r.endMonth) {
    const endNum = monthStrToNum(r.endMonth);
    if (endNum !== null && endNum < targetNum) return false;
  }
  return true;
};

const getDefaultMonthYear = () => {
  const now = new Date();
  const y = now.getFullYear();
  const m = ALL_MONTHS[now.getMonth()];
  if (YEARS_CONFIG[y] && YEARS_CONFIG[y].includes(m)) return { year: y, month: m };
  return { year: YEARS_LIST[0], month: getMonthsForYear(YEARS_LIST[0])[0] };
};

const isBankFee = (tx) => BANK_FEE_CATEGORIES.has(tx?.category);
const isBeneficiaryCategory = (cat) => typeof cat === 'string' && cat.startsWith('مصروف شهري - ');

const isMonthClosed = (data, year, month) => {
  const key = makeMonthKey(year, month);
  return Array.isArray(data?.closedMonths) && data.closedMonths.includes(key);
};

const invalidateSnapshotsFrom = (snapshots, year, month) => {
  const startIdx = getMonthIndex(month);
  if (startIdx < 0) return { snapshots: snapshots || {}, invalidated: 0 };
  const newSnaps = { ...(snapshots || {}) };
  let invalidated = 0;
  Object.keys(newSnaps).forEach(key => {
    const parsedKey = parseMonthKey(key);
    if (!parsedKey) { delete newSnaps[key]; invalidated++; return; }
    if (parsedKey.year > year || (parsedKey.year === year && getMonthIndex(parsedKey.month) >= startIdx)) { delete newSnaps[key]; invalidated++; }
  });
  return { snapshots: newSnaps, invalidated };
};

const getAccountCutoff = (accountsData, key) => {
  const iso = accountsData?.[key]?.lastUpdated;
  if (!iso) return new Date(0);
  const d = new Date(iso);
  return isNaN(d) ? new Date(0) : d;
};

const computeBalance = (data, key, asOfDate) => {
  const accountsData = data?.accountsData || DEFAULT_ACCOUNTS;
  const base = safeNumber(accountsData[key]?.balance);
  const cutoffDay = dayStart(getAccountCutoff(accountsData, key));
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();
  const backward = upper < cutoffDay;
  let bal = base;
  (data?.transactions || []).forEach(t => {
    if (t.status !== 'paid' || t.method !== key) return;
    const d = new Date(t.date);
    if (isNaN(d)) return;
    const amt = safeNumber(t.amount);
    const signed = (t.subType === 'deposit') ? amt : -amt;
    if (backward) { if (d > upper && d < cutoffDay) bal -= signed; }
    else { if (d >= cutoffDay && d <= upper) bal += signed; }
  });
  return bal;
};

const getCardMethod = (card) => {
  if (!card) return null;
  if (card.bank === 'CIB' && card.name === 'SWYPE') return 'cib_swype';
  if (card.bank === 'AAIB') return 'aaib_card';
  return 'cib_card';
};

const _cardDebtCache = new WeakMap();
const _computeCardDebtRaw = (data, card, asOfDate) => {
  if (!card) return 0;
  const method = getCardMethod(card);
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();
  let debt = safeNumber(card.openingDebt);
  (data?.transactions || []).forEach(t => {
    if (t.status !== 'paid') return;
    const d = new Date(t.date);
    if (isNaN(d) || d > upper) return;
    const amt = safeNumber(t.amount);
    if (t.linkedCardId === card.id && t.type === 'expense' && !t.linkedLoanId) { debt -= amt; return; }
    if (t.type === 'expense' && t.method === method) { debt += amt; return; }
    if (t.type === 'income' && t.method === method && t.subType === 'deposit') { debt -= amt; return; }
  });
  return Math.max(0, debt);
};

const computeCardDebt = (data, card, asOfDate) => {
  if (!card) return 0;
  if (asOfDate) return _computeCardDebtRaw(data, card, asOfDate);
  const cache = _cardDebtCache.get(data);
  if (cache && cache[card.id] !== undefined) return cache[card.id];
  const result = _computeCardDebtRaw(data, card);
  if (cache) cache[card.id] = result;
  else _cardDebtCache.set(data, { [card.id]: result });
  return result;
};

const getClosingBalance = (data, key, year, month) => {
  const monthKey = makeMonthKey(year, month);
  const snap = data?.monthlySnapshots?.[monthKey]?.[key];
  if (snap !== undefined && snap !== null) return safeNumber(snap);
  const monthIdx = getMonthIndex(month);
  if (monthIdx < 0) return computeBalance(data, key);
  const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
  return computeBalance(data, key, monthEnd);
};

const getOpeningBalance = (data, key, year, month) => {
  const idx = getMonthIndex(month);
  if (idx <= 0) return getClosingBalance(data, key, year - 1, 'ديسمبر');
  return getClosingBalance(data, key, year, ALL_MONTHS[idx - 1]);
};

const deriveDefaultCutoff = (txs) => {
  const dates = (txs || []).filter(t => t.status === 'paid' && t.date).map(t => t.date).sort();
  if (dates.length === 0) return '2026-08-31';
  const d = new Date(dates[0]);
  d.setDate(d.getDate() - 1);
  return getLocalISODate(d);
};

const computeCustodyBalance = (entries) => {
  if (!Array.isArray(entries)) return { received: 0, transferred: 0, spentCash: 0, spentCard: 0, settled: 0, balance: 0, totalSpent: 0 };
  let received = 0, transferred = 0, spentCash = 0, spentCard = 0, settled = 0;
  entries.forEach(e => {
    const amt = safeNumber(e.amount);
    switch (e.type) {
      case CUSTODY_TYPE.RECEIVE: received += amt; break;
      case CUSTODY_TYPE.TRANSFER: transferred += amt; break;
      case CUSTODY_TYPE.SPEND_CASH: spentCash += amt; break;
      case CUSTODY_TYPE.SPEND_CARD: spentCard += amt; break;
      case CUSTODY_TYPE.SETTLE: settled += amt; break;
    }
  });
  const totalSpent = spentCash + spentCard;
  const balance = received - transferred - totalSpent - settled;
  return { received, transferred, spentCash, spentCard, settled, balance, totalSpent };
};

const computeCashbackSummary = (trackers) => {
  if (!Array.isArray(trackers)) return { expected: 0, received: 0, pending: 0 };
  const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
  const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
  return { expected, received, pending: expected - received };
};

const migrateCards = (cards) => {
  if (!Array.isArray(cards)) return DEFAULT_CARDS;
  return cards.map(c => {
    if (c.openingDebt !== undefined && c.availableBalance !== undefined) {
      return { ...c, cashbackRate: c.cashbackRate !== undefined ? safeNumber(c.cashbackRate) : 1 };
    }
    const limit = safeNumber(c.limit);
    const oldOpening = safeNumber(c.openingBalance);
    return { ...c, openingDebt: Math.max(0, limit - oldOpening), availableBalance: oldOpening, cashbackRate: safeNumber(c.cashbackRate, 1) };
  });
};

const migrateSnapshotsAndClosed = (snapshots, closedMonths) => {
  let snaps = snapshots && typeof snapshots === 'object' ? { ...snapshots } : {};
  let closed = Array.isArray(closedMonths) ? [...closedMonths] : [];
  if (Object.keys(snaps).length > 0 && !Object.keys(snaps).every(k => /^\d{4}-/.test(k))) {
    const migrated = {};
    Object.entries(snaps).forEach(([month, val]) => {
      if (/^\d{4}-/.test(month)) migrated[month] = val;
      else migrated[makeMonthKey(2026, month)] = (typeof val === 'object' && val !== null) ? val : { cash: safeNumber(val) };
    });
    snaps = migrated;
  }
  if (closed.length > 0 && !closed.every(k => /^\d{4}-/.test(k))) {
    closed = closed.map(m => /^\d{4}-/.test(m) ? m : makeMonthKey(2026, m));
  }
  return { snapshots: snaps, closedMonths: closed };
};

const migrateTransaction = (t) => {
  if (!t) return t;
  const kind = inferKind(t);
  let year = t.year, month = t.month, monthIndex = t.monthIndex;
  if (t.date && (!month || !year)) {
    const d = new Date(t.date);
    if (!isNaN(d)) { if (!year) year = d.getFullYear(); if (!month) month = ALL_MONTHS[d.getMonth()]; }
  }
  if (!year) year = 2026;
  if (monthIndex === undefined || monthIndex === null || monthIndex < 0) monthIndex = getMonthIndex(month);
  if (monthIndex < 0 && month) {
    const norm = ALL_MONTHS.find(m => normalizeText(m) === normalizeText(month));
    if (norm) { month = norm; monthIndex = getMonthIndex(norm); }
  }
  let subType = t.subType;
  if (!subType) subType = t.type === 'income' ? 'deposit' : 'withdrawal';
  return { ...t, kind, year, month, monthIndex, subType, receipts: Array.isArray(t.receipts) ? t.receipts : [] };
};

const migrateData = (parsed) => {
  if (!parsed) return parsed;
  const cards = Array.isArray(parsed.cards) ? parsed.cards : [];
  const loans = Array.isArray(parsed.loans) ? parsed.loans : [];
  const recurring = Array.isArray(parsed.recurringItems) ? parsed.recurringItems : [];

  const hasSig = cards.some(c => c.name === 'Signature' && String(c.last4) === '0391');
  const hasSWYPE = cards.some(c => c.name === 'SWYPE');
  const hasTakyeef = loans.some(l => isTakyeefLoan(l));
  const hasHany = loans.some(l => isHanyLoan(l));

  let { snapshots, closedMonths } = migrateSnapshotsAndClosed(parsed.monthlySnapshots, parsed.closedMonths);
  const incomingVersion = safeNumber(parsed.engineVersion, 1);
  if (incomingVersion < CURRENT_ENGINE_VERSION && Object.keys(snapshots).length > 0) { snapshots = {}; }

  const transactions = Array.isArray(parsed.transactions) ? parsed.transactions.map(migrateTransaction) : [];

  const accountsData = parsed.accountsData && typeof parsed.accountsData === 'object' ? { ...DEFAULT_ACCOUNTS, ...parsed.accountsData } : { ...DEFAULT_ACCOUNTS };
  const defaultCutoff = deriveDefaultCutoff(transactions);
  const renamedLabels = { 'CIB توفير': 'CIB Savings', 'AAIB توفير': 'AAIB Savings', 'نقدي': 'Cash', 'فوري': 'Fawry', 'اتصالات': 'Etisalat' };
  ACCOUNT_KEYS.forEach(k => {
    if (!accountsData[k]?.lastUpdated) {
      accountsData[k] = { ...(DEFAULT_ACCOUNTS[k] || {}), ...(accountsData[k] || {}), lastUpdated: defaultCutoff };
    }
    if (accountsData[k] && accountsData[k].label && renamedLabels[accountsData[k].label]) {
      accountsData[k] = { ...accountsData[k], label: renamedLabels[accountsData[k].label] };
    }
    if (accountsData[k] && !accountsData[k].label) {
      accountsData[k] = { ...accountsData[k], label: DEFAULT_ACCOUNTS[k].label };
    }
  });

  const withReceivable = (loans || []).map(l => {
    if (isTakyeefLoan(l)) {
      return {
        ...l,
        systemId: SYSTEM_LOAN_IDS.TAKYEEF,
        isReceivable: true,
        type: 'receivable',
        interest: 'مستحق لنا شهرياً',
        paused: !!l.paused,
        totalInstallments: safeNumber(l.totalInstallments, 12),
        paidInstallments: safeNumber(l.paidInstallments, 1)
      };
    }
    return l;
  });

  const normalizedLoans = withReceivable.map(l => {
    if (isHanyLoan(l) && !l.autoMonthly) {
      return { id: l.id || 15, systemId: SYSTEM_LOAN_IDS.HANY, name: 'مسحوبات محل هاني', autoMonthly: true, dueNextMonth: true, mergeIntoNextCycle: ['2026-أغسطس'], category: 'مسحوبات محل هاني', totalAmount: 0, prePaidAmount: 0, monthlyInstallment: 0, dueDay: 5, interest: 'مستحق شهري', description: 'مسحوبات يومية', type: 'debt' };
    }
    if (l && l.autoMonthly && !l.systemId) return { ...l, systemId: SYSTEM_LOAN_IDS.HANY };
    if (l && l.autoMonthly && !l.mergeIntoNextCycle) return { ...l, mergeIntoNextCycle: ['2026-أغسطس'] };
    return l;
  });

  let recurringItems = recurring;
  if (!parsed.recurringInitialized && recurring.length === 0) recurringItems = DEFAULT_RECURRING;
  recurringItems = (recurringItems || []).map(r => {
    const enriched = { ...r };
    if (enriched.startMonth === undefined) enriched.startMonth = null;
    if (enriched.endMonth === undefined) enriched.endMonth = null;
    if (enriched.isPaused === undefined) enriched.isPaused = false;
    if (enriched.title && enriched.title.includes('تكييف محمود') && enriched.type !== 'income') {
      enriched.type = 'income';
      enriched.title = enriched.title.replace(/\s*\(دخل\)\s*$/, '') + ' (دخل)';
    }
    return enriched;
  });
  const hasBankFees = recurringItems.some(r => BANK_FEE_CATEGORIES.has(r.category));
  if (!hasBankFees && Array.isArray(recurringItems) && recurringItems.length > 0) {
    recurringItems = [...recurringItems, ...DEFAULT_RECURRING.filter(r => BANK_FEE_CATEGORIES.has(r.category))];
  }
  const hasMonthlyExpenses = recurringItems.some(r => isBeneficiaryCategory(r.category));
  if (!hasMonthlyExpenses && Array.isArray(recurringItems) && recurringItems.length > 0 && incomingVersion < CURRENT_ENGINE_VERSION) {
    recurringItems = [...recurringItems, ...DEFAULT_RECURRING.filter(r => isBeneficiaryCategory(r.category))];
  }

  const rest = { ...parsed };
  delete rest.openingBalance2026;

  return {
    ...rest,
    engineVersion: CURRENT_ENGINE_VERSION,
    recurringInitialized: true,
    cards: (!hasSig || !hasSWYPE || cards.length < 3) ? DEFAULT_CARDS : migrateCards(cards),
    loans: (!hasTakyeef || !hasHany) ? DEFAULT_LOANS : normalizedLoans,
    recurringItems,
    closedMonths,
    monthlySnapshots: snapshots,
    transactions,
    accountsData,
    monthlyPlans: parsed.monthlyPlans && typeof parsed.monthlyPlans === 'object' ? { ...DEFAULT_MONTHLY_PLANS, ...parsed.monthlyPlans } : DEFAULT_MONTHLY_PLANS,
    materializedRecurring: parsed.materializedRecurring && typeof parsed.materializedRecurring === 'object' ? parsed.materializedRecurring : {},
    notifiedItems: parsed.notifiedItems && typeof parsed.notifiedItems === 'object' ? parsed.notifiedItems : {},
    custodyEntries: Array.isArray(parsed.custodyEntries) ? parsed.custodyEntries : DEFAULT_CUSTODY_ENTRIES,
    cashbackTrackers: Array.isArray(parsed.cashbackTrackers) ? parsed.cashbackTrackers : DEFAULT_CASHBACK_TRACKERS
  };
};

const getInitialData = () => {
  try {
    const cached = localStorage.getItem('finance_tracker_V76_SECURE');
    if (cached) {
      const migrated = migrateData(JSON.parse(cached));
      try { localStorage.setItem('finance_tracker_V76_SECURE', JSON.stringify(migrated)); } catch(e){}
      return migrated;
    }
  } catch (e) { console.warn(e); }
  return { engineVersion: CURRENT_ENGINE_VERSION, recurringInitialized: true, transactions: [], loans: DEFAULT_LOANS, cards: DEFAULT_CARDS, accountsData: DEFAULT_ACCOUNTS, monthlyPlans: DEFAULT_MONTHLY_PLANS, recurringItems: DEFAULT_RECURRING, closedMonths: [], monthlySnapshots: {}, materializedRecurring: {}, notifiedItems: {}, custodyEntries: DEFAULT_CUSTODY_ENTRIES, cashbackTrackers: DEFAULT_CASHBACK_TRACKERS };
};

// ═══════════════════════════════════════════════════════
// deriveMonthlyPlanFromHistory
// ═══════════════════════════════════════════════════════
const deriveMonthlyPlanFromHistory = (data, targetYear, targetMonth, monthsBack) => {
  monthsBack = monthsBack || 3;
  const transactions = data?.transactions || [];
  const targetIdx = getMonthIndex(targetMonth);
  if (targetIdx < 0) return null;

  const refMonths = [];
  let y = targetYear, mi = targetIdx;
  for (let i = 1; i <= monthsBack; i++) {
    mi--;
    if (mi < 0) { mi = 11; y--; }
    refMonths.push({ year: y, month: ALL_MONTHS[mi] });
  }

  const avgIncomeCat = (cat) => {
    let total = 0, count = 0;
    refMonths.forEach(({ year, month }) => {
      const sum = transactions
        .filter(t => t.status === 'paid' && t.type === 'income' && t.month === month && (t.year || 2026) === year && t.category === cat)
        .reduce((s, t) => s + safeNumber(t.amount), 0);
      if (sum > 0) { total += sum; count++; }
    });
    return count > 0 ? total / count : 0;
  };

  const avgCashExpenses = () => {
    let total = 0, count = 0;
    refMonths.forEach(({ year, month }) => {
      const sum = transactions
        .filter(t => t.status === 'paid' && t.type === 'expense' && t.method === 'cash' && t.month === month && (t.year || 2026) === year)
        .reduce((s, t) => s + safeNumber(t.amount), 0);
      if (sum > 0) { total += sum; count++; }
    });
    return count > 0 ? total / count : 0;
  };

  const sumActiveInstallments = () => {
    const loans = data?.loans || [];
    return loans
      .filter(l => !l.isReceivable && !l.autoMonthly && safeNumber(l.monthlyInstallment) > 0)
      .reduce((s, l) => s + safeNumber(l.monthlyInstallment), 0);
  };

  return {
    expectedSalary: Math.round(avgIncomeCat('راتب شهري')),
    expectedRent: Math.round(avgIncomeCat('إيجار المحل')),
    expectedCashback: Math.round(avgIncomeCat('استرداد كاش باك') || avgIncomeCat('Cash Back')),
    expectedEmakWE: Math.round(avgIncomeCat('عهدة إيماك WE')),
    expectedZakat: Math.round(avgIncomeCat('الزكاة والتبرعات')),
    expectedCash: 0,
    expectedCashExpenses: Math.round(avgCashExpenses()),
    plannedPayments: Math.round(sumActiveInstallments()),
    _meta: { refMonths: refMonths.map(m => `${m.month} ${m.year}`).join(' • ') }
  };
};

// Promise Modal Manager
// ═══════════════════════════════════════════════════════
const _modalResolvers = new Map();
let _modalIdCounter = 0;

const showInputModal = (opts) => {
  return new Promise((resolve) => {
    const id = ++_modalIdCounter;
    _modalResolvers.set(id, resolve);
    window.dispatchEvent(new CustomEvent('show-input-modal', { detail: { ...opts, _id: id } }));
  });
};

const resolveModal = (id, value) => {
  const resolve = _modalResolvers.get(id);
  if (resolve) {
    _modalResolvers.delete(id);
    resolve(value);
  }
};

const clearAllModals = () => {
  _modalResolvers.forEach((resolve) => resolve(null));
  _modalResolvers.clear();
};

// ============ PIN ============
const hashPin = async (pin) => {
  try {
    const encoder = new TextEncoder();
    const data = encoder.encode('fintracker_v1_' + pin);
    const hashBuf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch { return 'plain_' + pin; }
};
const getStoredPinHash = () => localStorage.getItem(PIN_HASH_KEY);
const savePinHash = async (pin) => { localStorage.setItem(PIN_HASH_KEY, await hashPin(pin)); };
const verifyPin = async (pin) => {
  const stored = getStoredPinHash();
  if (!stored) return pin === DEFAULT_PIN;
  return (await hashPin(pin)) === stored;
};

// ============ ErrorBoundary ============
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(e, i) { console.error('App Error:', e, i); clearAllModals(); }
  render() {
    if (this.state.hasError) return (
      <div className="flex flex-col h-screen items-center justify-center p-8 text-center" style={{background: 'var(--bg-app)'}} dir="rtl">
        <AlertTriangle size={48} className="text-red-500 mb-4" />
        <h1 className="text-2xl font-black mb-6">عذراً، حدث خطأ تقني</h1>
        <p className="text-sm mb-6 opacity-70 max-w-md break-all" style={{ color: 'var(--text-secondary)' }}>{String(this.state.error?.message || '')}</p>
        <div className="flex gap-3">
          <button onClick={() => window.location.reload()} className="btn btn-primary"><RefreshCcw size={18}/> إعادة</button>
          <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="btn btn-secondary"><Trash2 size={18}/> مسح</button>
        </div>
      </div>
    );
    return this.props.children;
  }
}

// ═══════════════════════════════════════════════════════
// PromiseModalProvider
// ═══════════════════════════════════════════════════════
const PromiseModalProvider = ({ children }) => {
  const [stack, setStack] = useState([]);
  const [inputValues, setInputValues] = useState({});

  useEffect(() => {
    const handleInput = (e) => setStack(s => [...s, { kind: 'input', ...e.detail }]);
    window.addEventListener('show-input-modal', handleInput);
    return () => window.removeEventListener('show-input-modal', handleInput);
  }, []);

  const current = stack[stack.length - 1];

  const dismiss = useCallback((value) => {
    if (!current) return;
    const id = current._id;
    setStack(s => s.slice(0, -1));
    resolveModal(id, value);
    setInputValues(prev => {
      if (!(id in prev)) return prev;
      const next = { ...prev };
      delete next[id];
      return next;
    });
  }, [current]);

  const inputValue = current && current._id !== undefined
    ? (inputValues[current._id] !== undefined ? inputValues[current._id] : (current.inputValue || ''))
    : '';

  const setInputValue = useCallback((v) => {
    if (!current || current._id === undefined) return;
    setInputValues(prev => ({ ...prev, [current._id]: v }));
  }, [current]);

  return (
    <React.Fragment>
      {children}
      {current && current.kind === 'input' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-md">
            <div className="generic-modal-header">
              <h3 className="text-base font-black flex items-center gap-2">
                <span>{current.icon || '💬'}</span>
                {current.title}
              </h3>
              <button onClick={() => dismiss(null)} className="btn btn-ghost p-1.5"><X size={16} /></button>
            </div>
            <div className="generic-modal-body">
              {current.message && <p className="text-sm mb-3 whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>}
              <input
                autoFocus
                type="text"
                inputMode={current.numeric ? 'decimal' : 'text'}
                className="input-field text-2xl font-black text-center text-blue-600 py-4"
                value={inputValue}
                onChange={e => setInputValue(current.numeric ? e.target.value.replace(/[^\d.\-]/g, '') : e.target.value)}
                onKeyDown={e => {
                  if (e.key === 'Enter') {
                    const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim();
                    dismiss(v);
                  }
                }}
              />
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => dismiss(null)} className="btn btn-secondary flex-1">إلغاء</button>
              <button onClick={() => {
                const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim();
                dismiss(v);
              }} className="btn btn-primary flex-1">{current.confirmText || 'تأكيد'}</button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
};

// Modal

const Modal = memo(({ isOpen, onClose, title, icon, size, children }) => {
  if (!isOpen) return null;
  size = size || 'md';
  const sizeClass = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-lg', xl: 'max-w-xl', '2xl': 'max-w-2xl', '3xl': 'max-w-3xl', '5xl': 'max-w-5xl' }[size] || 'max-w-md';
  return (
    <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget && onClose) onClose(); }}>
      <div className={`generic-modal ${sizeClass}`}>
        {title && (
          <div className="generic-modal-header">
            <h3 className="text-base font-black flex items-center gap-2">
              {icon && <span>{icon}</span>}
              {title}
            </h3>
            {onClose && <button onClick={onClose} className="btn btn-ghost p-1.5"><X size={16} /></button>}
          </div>
        )}
        <div className="generic-modal-body">{children}</div>
      </div>
    </div>
  );
});

// Small Components
// ═══════════════════════════════════════════════════════
const Toast = ({ notification, onClose }) => {
  useEffect(() => { const t = setTimeout(onClose, notification.duration || 5000); return () => clearTimeout(t); }, [notification, onClose]);
  const icons = { success: CheckCircle2, error: AlertTriangle, warning: AlertTriangle, info: Bell };
  const Icon = icons[notification.type] || Bell;
  return (
    <div className={`toast toast-${notification.type || 'info'}`}>
      <Icon size={18} className="flex-shrink-0 mt-0.5" />
      <div className="flex-1 min-w-0">
        {notification.title && <p className="font-bold text-sm mb-0.5">{notification.title}</p>}
        {notification.message && <p className="text-xs opacity-95">{notification.message}</p>}
      </div>
      <button onClick={onClose} className="flex-shrink-0 p-1 hover:bg-white/20 rounded-full"><X size={14} /></button>
    </div>
  );
};

const ToastContainer = ({ notifications, removeNotification }) => {
  if (!notifications || notifications.length === 0) return null;
  return (<div className="toast-container no-print">{notifications.slice(-3).map(n => <Toast key={n.id} notification={n} onClose={() => removeNotification(n.id)} />)}</div>);
};

const SmsBadge = memo(({ tx }) => {
  if (tx?.source !== 'sms') return null;
  return <span className="badge badge-brand">📱 SMS</span>;
});

const TeldaBadge = memo(({ tx }) => {
  if (!EXTERNAL_TRANSFER_METHOD_IDS.includes(tx?.method)) return null;
  return <span className="badge badge-brand">💳 Telda</span>;
});

const FamilyBadge = memo(({ tx }) => {
  if (!tx?.createdBy) return null;
  return <span className="badge badge-neutral">👤 {tx.createdBy}</span>;
});

const ReceiptIndicator = memo(({ tx, dispatch }) => {
  if (!tx?.receipts?.length) return null;
  return (
    <button type="button" onClick={(e) => { e.stopPropagation(); dispatch({ type: 'SET_VIEWING_RECEIPT', payload: { tx, index: 0 } }); }} className="badge badge-brand cursor-pointer">
      <Camera size={10} /> {tx.receipts.length}
    </button>
  );
});

const DayGroupHeader = memo(({ label, total, count }) => (
  <div className="day-header">
    <div className="day-header-badge">
      {label}
      <span style={{ fontSize: '10px', opacity: 0.7, fontWeight: 700 }}>({count})</span>
    </div>
    <div className="day-header-total">{fmt(total)} ج.م</div>
  </div>
));

const groupTransactionsByDate = (list) => {
  const groups = {};
  list.forEach(t => {
    const d = t.date || 'unknown';
    if (!groups[d]) groups[d] = [];
    groups[d].push(t);
  });
  const today = getLocalISODate();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const yestISO = getLocalISODate(yest);
  return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
    let label;
    if (date === today) label = '📅 النهاردة';
    else if (date === yestISO) label = '📅 امبارح';
    else {
      try {
        const dObj = new Date(date);
        const ds = dObj.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' });
        label = '📅 ' + ds;
      } catch(e) { label = '📅 ' + date; }
    }
    const total = groups[date].reduce((s, t) => s + safeNumber(t.amount), 0);
    return { date, label, items: groups[date], total };
  });
};

// ═══════════════════════════════════════════════════════
// Month Selector
// ═══════════════════════════════════════════════════════
const MonthSelector = memo(({ selectedYear, selectedMonth, onSelectYear, onSelectMonth }) => {
  const months = getMonthsForYear(selectedYear);
  return (
    <div className="card py-3">
      <div className="flex items-center gap-2 mb-2 flex-wrap">
        <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
          {YEARS_LIST.map(year => (
            <button key={year} type="button" onClick={() => onSelectYear(year)} className={`px-3 py-1.5 rounded-md text-[11px] font-black transition-all ${selectedYear === year ? 'shadow-sm' : ''}`} style={selectedYear === year ? { background: 'var(--bg-card)', color: 'var(--brand)' } : { color: 'var(--text-muted)' }}>{year}</button>
          ))}
        </div>
      </div>
      <div className="flex gap-1.5 overflow-x-auto pb-0.5 scroll-hide">
        {months.map((m) => (
          <button key={m} type="button" onClick={() => onSelectMonth(m)} className="month-tab" style={selectedMonth === m ? { background: 'var(--brand)', color: 'white' } : { background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>{m}</button>
        ))}
      </div>
    </div>
  );
});

// ═══════════════════════════════════════════════════════
// ConfirmDialog
// ═══════════════════════════════════════════════════════
const ConfirmDialog = ({ confirmDialog, dispatch }) => {
  if (!confirmDialog.isOpen) return null;
  const isDanger = confirmDialog.danger;
  return (
    <div className="modal-backdrop z-[5000]">
      <div className="generic-modal max-w-sm">
        <div className="generic-modal-body text-center">
          <div className={`w-14 h-14 mx-auto mb-4 rounded-full flex items-center justify-center ${isDanger ? 'bg-red-50 dark:bg-red-950/40 text-red-500' : 'bg-blue-50 dark:bg-blue-950/40 text-blue-500'}`}>
            {isDanger ? <AlertTriangle size={24} /> : <Bell size={24} />}
          </div>
          <h3 className="text-base font-black mb-2">{confirmDialog.title}</h3>
          <p className="text-sm font-medium mb-2 leading-relaxed whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>{confirmDialog.message}</p>
        </div>
        <div className="generic-modal-footer">
          <button autoFocus onClick={() => { confirmDialog.onCancel && confirmDialog.onCancel(); dispatch({ type: 'HIDE_CONFIRM' }); }} className="btn btn-secondary flex-1 text-sm">إلغاء</button>
          <button onClick={() => { confirmDialog.onConfirm && confirmDialog.onConfirm(); dispatch({ type: 'HIDE_CONFIRM' }); }} className="btn flex-1 text-sm" style={{ background: isDanger ? 'var(--danger)' : 'var(--brand)', color: 'white' }}>تأكيد</button>
        </div>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════
// GenericLedgerComponent
// ═══════════════════════════════════════════════════════
const GenericLedgerComponent = memo(({ walletKey, ledgerData, liveBalance, isExpanded, onToggle, theme, onAddDeposit, onAddWithdrawal, walletVisibility, onToggleVisibility }) => {
  const [filter, setFilter] = useState('all');
  const [dateFilter, setDateFilter] = useState('');

  const validatedLedger = useMemo(() => {
    try { return (ledgerData || []).map(item => ({ ...item, amount: safeNumber(item.amount), date: item.date || 'غير معروف', description: item.description || 'بدون وصف', subType: item.subType || (item.type === 'income' ? 'deposit' : 'withdrawal') })).filter(item => item.amount > 0); } catch { return []; }
  }, [ledgerData]);

  const filteredLedger = useMemo(() => validatedLedger.filter(i => {
    if (filter === 'deposit' && i.subType !== 'deposit') return false;
    if (filter === 'withdrawal' && i.subType !== 'withdrawal') return false;
    if (dateFilter && !(i.date||'').includes(dateFilter)) return false;
    return true;
  }), [validatedLedger, filter, dateFilter]);

  const stats = useMemo(() => ({
    deposits: validatedLedger.filter(t => t.subType === 'deposit').reduce((s, t) => s + t.amount, 0),
    withdrawals: validatedLedger.filter(t => t.subType === 'withdrawal').reduce((s, t) => s + t.amount, 0),
    currentBalance: safeNumber(liveBalance)
  }), [validatedLedger, liveBalance]);

  const mask = (v) => !walletVisibility?.[walletKey] ? '•••••' : fmt(v);
  const IconComponent = theme.icon;
  const stop = (e, action) => { e.stopPropagation(); e.preventDefault(); if (action) action(); };

  return (
    <div className="card mb-3">
      <div className="flex justify-between items-center cursor-pointer" onClick={onToggle}>
        <div className="flex items-center gap-3 min-w-0 flex-1">
          <div className="p-2.5 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>
            <IconComponent size={20} />
          </div>
          <div className="min-w-0">
            <h3 className="font-bold text-sm truncate">{theme.title}</h3>
            <p className="text-[11px] mt-0.5 truncate" style={{ color: 'var(--text-muted)' }}>{theme.subtitle}</p>
          </div>
        </div>
        <div className="flex items-center gap-1 flex-shrink-0">
          <button type="button" onClick={(e) => stop(e, () => onAddDeposit && onAddDeposit(walletKey))} className="p-2 bg-emerald-500 text-white rounded-lg"><ArrowDownCircle size={14} /></button>
          <button type="button" onClick={(e) => stop(e, () => onAddWithdrawal && onAddWithdrawal(walletKey))} className="p-2 bg-red-500 text-white rounded-lg"><ArrowUpCircle size={14} /></button>
          <button type="button" onClick={(e) => stop(e, () => onToggleVisibility && onToggleVisibility(walletKey))} className="p-2 rounded-lg" style={{ color: 'var(--text-muted)' }}>{walletVisibility?.[walletKey] ? <EyeOff size={14} /> : <Eye size={14} />}</button>
          <ChevronDown size={18} className={`transition-transform ${isExpanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
        </div>
      </div>
      {isExpanded && (
        <div className="mt-4 pt-4 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
          {validatedLedger.length === 0 ? (
            <div className="p-6 text-center">
              <p className="font-medium mb-3 text-sm" style={{ color: 'var(--text-secondary)' }}>لا توجد عمليات</p>
              <button type="button" onClick={(e) => stop(e, () => onAddDeposit && onAddDeposit(walletKey))} className="btn btn-primary text-sm"><Plus size={16} /> إضافة أول عملية</button>
            </div>
          ) : (
            <React.Fragment>
              <div className="grid grid-cols-3 gap-2 mb-3">
                <div className="text-center p-2.5 bg-emerald-50 dark:bg-emerald-950/30 rounded-xl">
                  <div className="text-[10px] text-emerald-700 dark:text-emerald-400 font-bold mb-1">إيداع</div>
                  <div className="text-sm font-black text-emerald-600">{mask(stats.deposits)}</div>
                </div>
                <div className="text-center p-2.5 bg-red-50 dark:bg-red-950/30 rounded-xl">
                  <div className="text-[10px] text-red-700 dark:text-red-400 font-bold mb-1">سحب</div>
                  <div className="text-sm font-black text-red-600">{mask(stats.withdrawals)}</div>
                </div>
                <div className="text-center p-2.5 bg-blue-50 dark:bg-blue-950/30 rounded-xl">
                  <div className="text-[10px] text-blue-700 dark:text-blue-400 font-bold mb-1">الرصيد</div>
                  <div className="text-sm font-black text-blue-600">{mask(stats.currentBalance)}</div>
                </div>
              </div>
              <div className="flex gap-2 mb-3 flex-wrap">
                <select className="input-field text-xs py-2 flex-1 min-w-[100px]" value={filter} onChange={(e) => setFilter(e.target.value)}>
                  <option value="all">الكل</option>
                  <option value="deposit">إيداعات</option>
                  <option value="withdrawal">سحوبات</option>
                </select>
                <input type="month" className="input-field text-xs py-2 flex-1 min-w-[120px]" value={dateFilter} onChange={(e) => setDateFilter(e.target.value)} />
              </div>
              <div className="overflow-x-auto -mx-4">
                <table className="w-full text-right text-sm">
                  <thead><tr style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                    <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>التاريخ</th>
                    <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الوصف</th>
                    <th className="p-2.5 text-[10px] font-bold text-left" style={{ color: 'var(--text-muted)' }}>المبلغ</th>
                  </tr></thead>
                  <tbody>
                    {filteredLedger.map((t) => (
                      <tr key={t.id} className="hover:bg-[color:var(--bg-muted)]">
                        <td className="p-2.5 text-[11px] whitespace-nowrap" style={{ color: 'var(--text-muted)' }}>{t.date}</td>
                        <td className="p-2.5 font-bold text-xs">{t.description}</td>
                        <td className={`p-2.5 text-left font-black text-xs ${t.subType === 'deposit' ? 'text-emerald-600' : 'text-red-500'}`}>{t.subType === 'deposit' ? '+' : '-'}{mask(t.amount)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
});

// ═══════════════════════════════════════════════════════
// CustodyView
// ═══════════════════════════════════════════════════════
const CustodyView = memo(({ data, dispatch, saveHistory, addNotification }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [newEntry, setNewEntry] = useState({ type: CUSTODY_TYPE.RECEIVE, amount: '', date: getLocalISODate(), description: '', method: 'cash', relatedCategory: 'عهدة شركة إيماك' });
  const custodyEntries = data?.custodyEntries || [];
  const summary = useMemo(() => computeCustodyBalance(custodyEntries), [custodyEntries]);

  const addEntry = () => {
    const amount = parseNumberInput(newEntry.amount);
    if (amount <= 0) { addNotification({ type: 'error', title: 'مبلغ غير صحيح' }); return; }
    if (!newEntry.description || newEntry.description.trim().length < 2) { addNotification({ type: 'error', title: 'اكتب الوصف' }); return; }
    saveHistory();
    const entry = { ...newEntry, description: newEntry.description.trim(), id: getSafeId(), amount, status: 'open' };
    const newEntries = [entry, ...custodyEntries];
    const newTxs = [];
    const d = new Date(newEntry.date);
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    const baseTx = { date: newEntry.date, month: txMonth, year: txYear, monthIndex: d.getMonth(), status: 'paid' };
    if (newEntry.type === CUSTODY_TYPE.RECEIVE) {
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'income', kind: KIND.OPERATIONAL, category: newEntry.relatedCategory || 'عهدة شركة إيماك', amount, description: `استلام عهدة: ${newEntry.description}`, method: newEntry.method, subType: 'deposit', linkedCustodyId: entry.id });
    } else if (newEntry.type === CUSTODY_TYPE.TRANSFER) {
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'income', kind: KIND.FINANCIAL, category: 'تحويلات واردة', amount, description: `تحويل عهدة: ${newEntry.description}`, method: newEntry.method, subType: 'deposit', linkedCustodyId: entry.id });
    } else if (newEntry.type === CUSTODY_TYPE.SPEND_CASH) {
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'expense', kind: KIND.OPERATIONAL, category: newEntry.relatedCategory || 'مصروفات عهدة', amount, description: `صرف عهدة كاش: ${newEntry.description}`, method: newEntry.method, subType: 'withdrawal', linkedCustodyId: entry.id });
    } else if (newEntry.type === CUSTODY_TYPE.SPEND_CARD) {
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'expense', kind: KIND.OPERATIONAL, category: newEntry.relatedCategory || 'فواتير عهدة', amount, description: `صرف عهدة من بطاقة: ${newEntry.description}`, method: newEntry.method, subType: 'withdrawal', linkedCustodyId: entry.id });
    }
    const newData = { ...data, custodyEntries: newEntries, transactions: [...newTxs, ...(data.transactions || [])].sort((a, b) => new Date(b.date) - new Date(a.date)) };
    dispatch({ type: 'SET_DATA', payload: newData });
    setShowAdd(false);
    setNewEntry({ type: CUSTODY_TYPE.RECEIVE, amount: '', date: getLocalISODate(), description: '', method: 'cash', relatedCategory: 'عهدة شركة إيماك' });
    addNotification({ type: 'success', title: 'تم التسجيل' });
  };

  const deleteEntry = (id) => {
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'حذف حركة العهدة', message: 'سيتم حذف الحركة والقيود المرتبطة بها', onConfirm: () => {
      saveHistory();
      const newEntries = custodyEntries.filter(e => e.id !== id);
      const newTxs = (data.transactions || []).filter(t => t.linkedCustodyId !== id);
      dispatch({ type: 'SET_DATA', payload: { ...data, custodyEntries: newEntries, transactions: newTxs } });
      addNotification({ type: 'success', title: 'تم الحذف' });
    }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  };

  const usagePct = summary.received > 0 ? (summary.totalSpent / summary.received) * 100 : 0;

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div className="flex-1 min-w-[180px]">
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>رصيد العهدة الحالي</p>
            <h2 className={`text-3xl font-black tracking-tight ${summary.balance >= 0 ? 'text-blue-600' : 'text-red-600'}`}>
              {fmt(summary.balance)}
              <span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
          </div>
          <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs"><Plus size={14} /> حركة جديدة</button>
        </div>
        <div className="grid grid-cols-4 gap-2 mt-4">
          <div className="p-2.5 rounded-xl bg-blue-50 dark:bg-blue-950/30 text-center">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">مستلم</p>
            <p className="text-sm font-black text-blue-600 mt-0.5">{fmt(summary.received)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-cyan-50 dark:bg-cyan-950/30 text-center">
            <p className="text-[10px] font-bold text-cyan-700 dark:text-cyan-400">محوّل</p>
            <p className="text-sm font-black text-cyan-600 mt-0.5">{fmt(summary.transferred)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-orange-50 dark:bg-orange-950/30 text-center">
            <p className="text-[10px] font-bold text-orange-700 dark:text-orange-400">كاش</p>
            <p className="text-sm font-black text-orange-600 mt-0.5">{fmt(summary.spentCash)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-purple-50 dark:bg-purple-950/30 text-center">
            <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">بطاقة</p>
            <p className="text-sm font-black text-purple-600 mt-0.5">{fmt(summary.spentCard)}</p>
          </div>
        </div>
        <div className="mt-3">
          <div className="flex justify-between text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>
            <span>نسبة الاستهلاك</span><span>{Math.round(usagePct)}%</span>
          </div>
          <div className="w-full rounded-full h-1.5 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
            <div className={`h-full ${usagePct > 90 ? 'bg-red-500' : usagePct > 60 ? 'bg-amber-500' : 'bg-blue-500'}`} style={{ width: `${Math.min(100, usagePct)}%` }}></div>
          </div>
        </div>
      </div>

      {custodyEntries.length === 0 ? (
        <div className="card text-center p-12">
          <Briefcase size={40} className="mx-auto mb-3 text-blue-500" />
          <h3 className="text-base font-black mb-2">لا توجد حركات بعد</h3>
          <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs"><Plus size={14} /> إضافة أول حركة</button>
        </div>
      ) : (
        <div className="space-y-2">
          {custodyEntries.sort((a, b) => new Date(b.date) - new Date(a.date)).map(entry => {
            const Icon = CUSTODY_TYPE_ICONS[entry.type] || Briefcase;
            const color = CUSTODY_TYPE_COLORS[entry.type] || '#6B7280';
            const isIncoming = entry.type === CUSTODY_TYPE.RECEIVE || entry.type === CUSTODY_TYPE.TRANSFER;
            return (
              <div key={entry.id} className="card py-3">
                <div className="flex justify-between items-center gap-3">
                  <div className="flex items-center gap-3 flex-1 min-w-0">
                    <div className="p-2 rounded-lg flex-shrink-0" style={{ background: `${color}20`, color }}>
                      <Icon size={16} />
                    </div>
                    <div className="min-w-0">
                      <h4 className="font-bold text-xs truncate">{entry.description}</h4>
                      <span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{CUSTODY_TYPE_LABELS[entry.type]} • {entry.date}</span>
                    </div>
                  </div>
                  <div className="flex items-center gap-1 flex-shrink-0">
                    <p className={`font-black text-sm ${isIncoming ? 'text-emerald-600' : 'text-red-500'}`}>
                      {isIncoming ? '+' : '-'}{fmt(entry.amount)}
                    </p>
                    <button onClick={() => deleteEntry(entry.id)} className="btn btn-ghost p-1 text-red-500"><Trash2 size={12} /></button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {showAdd && (
        <Modal isOpen={true} onClose={() => setShowAdd(false)} title="حركة عهدة جديدة" icon="💼">
          <div className="space-y-3">
            <div>
              <p className="text-[11px] font-bold mb-2" style={{ color: 'var(--text-muted)' }}>نوع الحركة:</p>
              <div className="grid grid-cols-2 gap-2">
                {Object.entries(CUSTODY_TYPE_LABELS).map(([type, label]) => {
                  const Icon = CUSTODY_TYPE_ICONS[type] || Briefcase;
                  const color = CUSTODY_TYPE_COLORS[type];
                  const selected = newEntry.type === type;
                  return (
                    <button key={type} type="button" onClick={() => setNewEntry({ ...newEntry, type })} className="p-2.5 rounded-lg text-[11px] font-bold border-2 flex items-center gap-2" style={selected ? { borderColor: color, background: `${color}15`, color } : { borderColor: 'var(--border-default)' }}>
                      <Icon size={14} /><span>{label}</span>
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ *</label>
                <input type="text" inputMode="decimal" className="input-field text-base font-black text-blue-600 text-center" value={newEntry.amount} onChange={e => setNewEntry({ ...newEntry, amount: e.target.value })} placeholder="0.00" />
              </div>
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>التاريخ *</label>
                <input type="date" className="input-field text-xs font-bold" value={newEntry.date} onChange={e => setNewEntry({ ...newEntry, date: e.target.value })} />
              </div>
            </div>
            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الوصف *</label>
              <input type="text" className="input-field" placeholder="عهدة إيماك - WE..." value={newEntry.description} onChange={e => setNewEntry({ ...newEntry, description: e.target.value })} />

            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الحساب/البطاقة</label>
              <select className="input-field text-sm" value={newEntry.method} onChange={e => setNewEntry({ ...newEntry, method: e.target.value })}>

// ═══════════════════════════════════════════════════════
// CashbackView
// ═══════════════════════════════════════════════════════
const CashbackView = memo(({ data, dispatch, saveHistory, addNotification, cards, selectedYear, selectedMonth }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [newTracker, setNewTracker] = useState({ cardId: cards[0]?.id || 1, month: selectedMonth, year: selectedYear, expectedAmount: '', receivedAmount: '', status: CASHBACK_STATUS.EXPECTED, notes: '' });
  const trackers = data?.cashbackTrackers || [];
  const summary = useMemo(() => computeCashbackSummary(trackers), [trackers]);
  const filteredTrackers = useMemo(() => trackers.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear), [trackers, selectedMonth, selectedYear]);
  const monthExpected = filteredTrackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
  const monthReceived = filteredTrackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);

  const addTracker = () => {
    const expected = parseNumberInput(newTracker.expectedAmount);
    if (expected <= 0) { addNotification({ type: 'error', title: 'مبلغ غير صحيح' }); return; }
    saveHistory();
    const received = parseNumberInput(newTracker.receivedAmount);
    const tracker = { ...newTracker, id: getSafeId(), expectedAmount: expected, receivedAmount: received, status: received >= expected ? CASHBACK_STATUS.RECEIVED : received > 0 ? CASHBACK_STATUS.PARTIAL : CASHBACK_STATUS.EXPECTED };
    dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: [...trackers, tracker] });
    setShowAdd(false);
    setNewTracker({ cardId: cards[0]?.id || 1, month: selectedMonth, year: selectedYear, expectedAmount: '', receivedAmount: '', status: CASHBACK_STATUS.EXPECTED, notes: '' });
    addNotification({ type: 'success', title: 'تم الحفظ' });
  };

  const markReceived = async (tracker) => {
    const card = cards.find(c => c.id === tracker.cardId);
    const cardMethod = card ? getCardMethod(card) : null;
    const choice = await showInputModal({
      title: 'أين استلمت الكاش باك؟',
      icon: '🎁',
      message: `البطاقة: ${card?.bank} - ${card?.name}\n\n1 = على البطاقة\n2 = نقدي`,
      inputValue: '1',
      numeric: true,
      confirmText: 'تأكيد'
    });
    if (choice === null) return;
    const choiceNum = parseInt(choice, 10);
    if (choiceNum !== 1 && choiceNum !== 2) { addNotification({ type: 'error', title: 'اختر 1 أو 2' }); return; }
    const useCard = choiceNum === 1;
    const method = useCard && cardMethod ? cardMethod : 'cash';
    saveHistory();
    const updated = trackers.map(t => t.id === tracker.id ? { ...t, receivedAmount: t.expectedAmount, receivedDate: getLocalISODate(), status: CASHBACK_STATUS.RECEIVED } : t);
    dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: updated });
    const d = new Date();
    const newTx = { id: getSafeId(), type: 'income', kind: KIND.OPERATIONAL, category: 'استرداد كاش باك', amount: safeNumber(tracker.expectedAmount), description: `كاش باك - ${card?.name || ''}`, method, date: getLocalISODate(d), month: ALL_MONTHS[d.getMonth()], year: d.getFullYear(), monthIndex: d.getMonth(), subType: 'deposit', status: 'paid', linkedCardId: useCard && card ? card.id : undefined };
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [newTx, ...(data.transactions || [])].sort((a, b) => new Date(b.date) - new Date(a.date)) });
    addNotification({ type: 'success', title: 'تم الاستلام' });
  };

  const deleteTracker = (id) => {
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'حذف السجل', message: 'سيتم الحذف', onConfirm: () => { saveHistory(); dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: trackers.filter(t => t.id !== id) }); addNotification({ type: 'success', title: 'تم الحذف' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  };

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div>
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>كاش باك {selectedMonth}</p>
            <h2 className="text-3xl font-black tracking-tight text-emerald-600">
              {fmt(monthReceived)}<span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <p className="text-[11px] font-semibold mt-2" style={{ color: 'var(--text-muted)' }}>متوقع: {fmt(monthExpected)}</p>
          </div>
          <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs"><Plus size={14} /> إضافة</button>
        </div>
      </div>

      <div className="space-y-2">
        {filteredTrackers.length === 0 ? (
          <div className="card text-center p-8">
            <Gift size={32} className="mx-auto mb-2 text-emerald-500" />
            <p className="font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد سجلات لهذا الشهر</p>
          </div>
        ) : filteredTrackers.map(tracker => {
          const card = cards.find(c => c.id === tracker.cardId);
          const statusCls = tracker.status === CASHBACK_STATUS.RECEIVED ? 'badge-success' : tracker.status === CASHBACK_STATUS.PARTIAL ? 'badge-warning' : 'badge-neutral';
          return (
            <div key={tracker.id} className="card py-3">
              <div className="flex justify-between items-center gap-3">
                <div className="flex items-center gap-2">
                  <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600"><Gift size={14} /></div>
                  <div>
                    <h4 className="font-bold text-xs">{card ? `${card.bank} - ${card.name}` : 'غير محدد'}</h4>
                    <span className={`badge ${statusCls} mt-1`}>{CASHBACK_STATUS_LABELS[tracker.status]}</span>
                  </div>
                </div>
                <div className="flex gap-1">
                  {tracker.status !== CASHBACK_STATUS.RECEIVED && (
                    <button onClick={() => markReceived(tracker)} className="btn btn-primary text-[10px] py-1.5 px-2"><CheckCircle2 size={12} /> استلمت</button>
                  )}
                  <button onClick={() => deleteTracker(tracker.id)} className="btn btn-ghost p-1.5 text-red-500"><Trash2 size={12} /></button>
                </div>
              </div>
              <div className="flex justify-between text-xs mt-2">
                <span style={{ color: 'var(--text-muted)' }}>متوقع: {fmt(tracker.expectedAmount)} • مستلم: {fmt(tracker.receivedAmount)}</span>
              </div>
            </div>
          );
        })}
      </div>

      {showAdd && (
        <Modal isOpen={true} onClose={() => setShowAdd(false)} title="متتبع كاش باك" icon="🎁">
          <div className="space-y-3">
            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>البطاقة</label>
              <select className="input-field" value={newTracker.cardId} onChange={e => setNewTracker({ ...newTracker, cardId: Number(e.target.value) })}>
                {cards.map(c => <option key={c.id} value={c.id}>{c.bank} - {c.name}</option>)}
              </select>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الشهر</label>
                <select className="input-field text-sm" value={newTracker.month} onChange={e => setNewTracker({ ...newTracker, month: e.target.value })}>
                  {getMonthsForYear(newTracker.year).map(m => <option key={m} value={m}>{m}</option>)}
                </select>
              </div>
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>السنة</label>
                <select className="input-field text-sm" value={newTracker.year} onChange={e => setNewTracker({ ...newTracker, year: Number(e.target.value) })}>
                  {YEARS_LIST.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>
            </div>
            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ المتوقع *</label>
              <input type="text" inputMode="decimal" className="input-field text-base font-black text-blue-600 text-center" value={newTracker.expectedAmount} onChange={e => setNewTracker({ ...newTracker, expectedAmount: e.target.value })} placeholder="0.00" />
            </div>
            <button onClick={addTracker} className="btn btn-primary w-full py-2.5 text-sm"><Save size={14} /> إضافة</button>
          </div>
        </Modal>
      )}
    </div>
  );
});

// ═══════════════════════════════════════════════════════
// LoansView (with recurring start/end + pause)
// ═══════════════════════════════════════════════════════
const LoansView = memo(({ updatedLoans, cards, recurringItems, transactions, dispatch, deleteRecurring, saveHistory, getLocalISODate, addNotification, data, selectedMonth, selectedYear, onEditRecurring, onTogglePauseRecurring }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [activeTab, setActiveTab] = useState('loans');
  const [newLoan, setNewLoan] = useState({ name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false });

  const totalLoans = useMemo(() => updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const totalReceivable = useMemo(() => updatedLoans.filter(l => l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const payables = useMemo(() => updatedLoans.filter(l => !l.isReceivable), [updatedLoans]);
  const receivables = useMemo(() => updatedLoans.filter(l => l.isReceivable), [updatedLoans]);
  const totalCards = useMemo(() => cards.reduce((acc, c) => acc + computeCardDebt(data, c), 0), [cards, data]);
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);

  const addLoan = () => {
    if (!newLoan.name || newLoan.name.trim().length < 2) { addNotification({ type: 'error', title: 'اكتب الاسم' }); return; }
    const amount = parseNumberInput(newLoan.totalAmount);
    if (amount <= 0) { addNotification({ type: 'error', title: 'مبلغ غير صحيح' }); return; }
    saveHistory();
    dispatch({ type: 'UPDATE_LOANS', payload: [...updatedLoans, { id: Date.now(), name: newLoan.name.trim(), totalAmount: amount, prePaidAmount: 0, monthlyInstallment: safeNumber(newLoan.monthlyInstallment), dueDay: safeNumber(newLoan.dueDay, 1), interest: '', description: newLoan.description || '', type: newLoan.isReceivable ? 'receivable' : 'debt', isReceivable: newLoan.isReceivable, paused: false }] });
    setShowAdd(false);
    setNewLoan({ name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false });
    addNotification({ type: 'success', title: 'تمت الإضافة' });
  };

  const handleCollectReceivable = (loan, sourceTx) => {
    const d = new Date();
    const y = d.getFullYear(), m = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, y, m)) { addNotification({ type: 'error', title: 'الشهر مغلق' }); return; }
    saveHistory();
    if (sourceTx) {
      dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(t => t.id === sourceTx.id ? { ...t, status: 'paid', date: getLocalISODate(d) } : t) });
      addNotification({ type: 'success', title: 'تم اعتماد القسط' });
    } else {
      const newTx = { id: 'recv-manual-' + getSafeId(), type: 'income', kind: KIND.OPERATIONAL, category: 'تكييف محمود', amount: safeNumber(loan.monthlyInstallment), description: `تحصيل قسط ${loan.name}`, method: 'cash', date: getLocalISODate(d), month: m, year: y, monthIndex: d.getMonth(), subType: 'deposit', status: 'paid', sourceReceivableId: loan.id };
      dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [newTx, ...transactions].sort((a, b) => new Date(b.date) - new Date(a.date)) });
      addNotification({ type: 'success', title: 'تم التحصيل' });
    }
  };

  const handleTogglePause = (loan) => {
    saveHistory();
    dispatch({ type: 'UPDATE_LOANS', payload: (data.loans || []).map(l => l.id === loan.id ? { ...l, paused: !l.paused } : l) });
    addNotification({ type: loan.paused ? 'success' : 'warning', title: loan.paused ? 'تم التفعيل' : 'تم الإيقاف' });
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="sub-tab-switcher">
        <button onClick={() => setActiveTab('loans')} className={`sub-tab-btn ${activeTab === 'loans' ? 'active' : ''}`}>
          <Banknote size={14} /> القروض والمستحقات
        </button>
        <button onClick={() => setActiveTab('custody')} className={`sub-tab-btn ${activeTab === 'custody' ? 'active' : ''}`}>
          <Briefcase size={14} /> العهدة
          {custodySummary.balance !== 0 && <span className="badge badge-warning text-[9px] px-1.5 py-0">{fmt(custodySummary.balance)}</span>}
        </button>
      </div>

      {activeTab === 'custody' ? (
        <CustodyView data={data} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />
      ) : (
        <React.Fragment>
          <div className="card">
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>إجمالي المديونية الصافية</p>
            <h2 className="text-3xl font-black tracking-tight text-gradient">{fmt(totalLoans + totalCards - totalReceivable)}<span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span></h2>
            <div className="grid grid-cols-3 gap-2 mt-3">
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">القروض</p>
                <p className="text-xs font-black text-red-600">{fmt(totalLoans)}</p>
              </div>
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">البطاقات</p>
                <p className="text-xs font-black text-red-600">{fmt(totalCards)}</p>
              </div>
              <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
                <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">مستحقات لك</p>
                <p className="text-xs font-black text-emerald-600">{fmt(totalReceivable)}</p>
              </div>
            </div>
            <div className="flex gap-2 mt-3 flex-wrap">
              <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs flex-1"><Plus size={14} /> إضافة التزام</button>
              <button onClick={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: true })} className="btn btn-secondary text-xs flex-1"><Repeat size={14} /> متكرر</button>
            </div>
          </div>

          {showAdd && (
            <Modal isOpen={true} onClose={() => setShowAdd(false)} title="التزام جديد" icon="📋">
              <div className="space-y-3">
                <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الاسم *</label><input className="input-field text-sm" value={newLoan.name} onChange={e => setNewLoan({ ...newLoan, name: e.target.value })} /></div>
                <div className="grid grid-cols-2 gap-3">
                  <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ *</label><input type="text" inputMode="decimal" className="input-field text-sm" value={newLoan.totalAmount} onChange={e => setNewLoan({ ...newLoan, totalAmount: e.target.value })} /></div>
                  <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>القسط</label><input type="text" inputMode="decimal" className="input-field text-sm" value={newLoan.monthlyInstallment} onChange={e => setNewLoan({ ...newLoan, monthlyInstallment: e.target.value })} /></div>
                </div>
                <label className="flex items-center gap-3 p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 cursor-pointer">
                  <input type="checkbox" checked={newLoan.isReceivable} onChange={e => setNewLoan({ ...newLoan, isReceivable: e.target.checked })} className="w-4 h-4 accent-emerald-600" />
                  <span className="text-xs font-bold text-emerald-700 dark:text-emerald-400">مستحق لي</span>
                </label>
                <button onClick={addLoan} className="btn btn-primary w-full py-2.5 text-sm">إضافة</button>
              </div>
            </Modal>
          )}

          {receivables.length > 0 && (
            <div className="space-y-2">
              <h3 className="font-black text-sm flex items-center gap-2 text-emerald-600"><TrendingUp size={14} /> مستحقات لك ({receivables.length})</h3>
              {receivables.map(loan => {
                const monthly = safeNumber(loan.monthlyInstallment);
                const explicitTotal = safeNumber(loan.totalInstallments);
                const explicitPaid = safeNumber(loan.paidInstallments);
                const remainingMonths = monthly > 0 ? Math.ceil(safeNumber(loan.remaining) / monthly) : 0;
                const totalMonths = explicitTotal > 0 ? explicitTotal : (explicitPaid + remainingMonths);
                const paidMonths = explicitTotal > 0 ? explicitPaid : Math.max(0, totalMonths - remainingMonths);
                const pct = safeNumber(loan.totalAmount) > 0 ? (safeNumber(loan.totalPaid) / safeNumber(loan.totalAmount)) * 100 : 0;
                const isComplete = loan.remaining <= 0.005;

                return (
                  <div key={loan.id} className="card">
                    <div className="flex justify-between items-start gap-3 flex-wrap mb-3">
                      <div className="flex items-center gap-3 flex-1 min-w-0">
                        <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 flex-shrink-0"><TrendingUp size={20} /></div>
                        <div className="min-w-0">
                          <h4 className="font-bold text-sm truncate flex items-center gap-2 flex-wrap">
                            {loan.name}
                            {loan.paused && <span className="badge badge-warning text-[10px]">⏸ موقوف</span>}
                          </h4>
                          <p className="text-[11px] text-emerald-600 font-semibold mt-0.5">يوم {loan.dueDay} • {fmt(monthly)} ج.م شهريًا</p>
                        </div>
                      </div>
                      <div className="flex gap-1">
                        <button type="button" onClick={() => handleTogglePause(loan)} className={`btn btn-ghost p-2 ${loan.paused ? 'text-emerald-500' : 'text-amber-500'}`}>{loan.paused ? <CheckCircle2 size={16} /> : <Clock size={16} />}</button>
                        <button type="button" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: loan })} className="btn btn-ghost p-2"><Edit size={16} /></button>
                      </div>
                    </div>
                    <div className="grid grid-cols-3 gap-2 mb-3">
                      <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
                        <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">محصّل</p>
                        <p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(loan.totalPaid)}</p>
                      </div>
                      <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
                        <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">المتبقي</p>
                        <p className="text-sm font-black text-blue-600 mt-0.5">{fmt(loan.remaining)}</p>
                      </div>
                      <div className="p-2.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-center">
                        <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">الأقساط</p>
                        <p className="text-sm font-black text-purple-600 mt-0.5">{paidMonths}/{totalMonths}</p>
                      </div>
                    </div>
                    <div className="w-full rounded-full h-1.5 overflow-hidden mb-3" style={{ background: 'var(--bg-muted)' }}>
                      <div className="bg-emerald-500 h-full rounded-full" style={{ width: `${Math.min(100, pct)}%` }}></div>
                    </div>
                    <div className="flex justify-end gap-2 flex-wrap">
                      {isComplete ? (
                        <div className="badge badge-success px-3 py-1.5"><CheckCircle2 size={12} /> اكتمل</div>
                      ) : loan.paused ? (
                        <div className="badge badge-warning px-3 py-1.5">⏸ موقوف</div>
                      ) : (
                        <button onClick={() => handleCollectReceivable(loan, null)} className="btn btn-primary text-xs"><Banknote size={14} /> تحصيل {fmt(monthly)}</button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          <div className="space-y-2">
            <h3 className="font-black text-sm flex items-center gap-2 text-red-600"><TrendingDown size={14} /> مديونيات ({payables.length})</h3>
            {payables.map(loan => {
              const isPaid = loan.remaining <= 0;
              const pct = loan.totalAmount > 0 ? (loan.totalPaid / loan.totalAmount) * 100 : 0;
              return (
                <div key={loan.id} className="card py-3">
                  <div className="flex justify-between items-start gap-2 mb-2">
                    <div className="flex items-center gap-2 flex-1 min-w-0">
                      <div className={`p-1.5 rounded-lg flex-shrink-0 ${isPaid ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-500'}`}><Banknote size={14} /></div>
                      <div className="min-w-0">

                    </div>

                  </div>
                  <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                    <div className="bg-emerald-500 h-full rounded-full" style={{ width: `${Math.min(100, pct)}%` }}></div>
                  </div>
                </div>
              );

          </div>

          {recurringItems.length > 0 && (
            <details className="card p-0 overflow-hidden">
              <summary className="p-4 cursor-pointer list-none flex items-center justify-between">

                <ChevronDown size={14} style={{ color: 'var(--text-muted)' }} />
              </summary>
              <div className="px-4 pb-4 space-y-1.5" style={{ borderTop: '1px solid var(--border-subtle)', paddingTop: '12px' }}>

                  const isMonthlyBen = isBeneficiaryCategory(r.category);
                  const isPaused = !!r.isPaused;
                  const now = new Date();
                  const nowMonthIdx = now.getMonth();
                  const nowYear = now.getFullYear();
                  const isActive = isRecurringActiveInMonth(r, nowYear, nowMonthIdx);

                  const remainingMonths = (() => {
                    if (!r.endMonth) return null;
                    const endNum = monthStrToNum(r.endMonth);
                    if (endNum === null) return null;
                    const nowNum = nowYear * 100 + (nowMonthIdx + 1);
                    if (endNum < nowNum) return 0;
                    const eY = Math.floor(endNum / 100), eM = endNum % 100;
                    return (eY - nowYear) * 12 + (eM - nowMonthIdx - 1) + 1;
                  })();

                  return (
                    <div key={r.id} className="p-2.5 rounded-lg" style={{ background: isPaused ? 'rgba(148,163,184,0.08)' : isMonthlyBen ? 'rgba(217,119,6,0.05)' : isFee ? 'rgba(220,38,38,0.05)' : 'var(--bg-muted)' }}>

                            {!isPaused && !isActive && remainingMonths === 0 && <span className="badge badge-danger text-[9px] px-1.5 py-0">انتهى</span>}
                          </p>
                          <div className="flex items-center gap-1.5 flex-wrap mt-0.5">
                            <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>يوم {r.day}</p>
                            {(r.startMonth || r.endMonth) && (
                              <React.Fragment>
                                <span className="text-[9px]" style={{ color: 'var(--text-muted)' }}>•</span>
                                <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                                  {r.startMonth || 'البداية'} → {r.endMonth || 'للأبد'}
                                </p>
                                {remainingMonths !== null && remainingMonths > 0 && (
                                  <span className="badge badge-brand text-[9px] px-1.5 py-0">متبقي {remainingMonths} شهر</span>
                                )}
                              </React.Fragment>
                            )}
                          </div>
                        </div>
                        <div className="flex items-center gap-1 flex-shrink-0">
                          <span className={`font-black text-xs ${r.type === 'income' ? 'text-emerald-600' : 'text-red-500'}`}>{fmt(r.amount)}</span>
                          <button aria-label="إيقاف/تفعيل" onClick={() => onTogglePauseRecurring(r)} className={`btn btn-ghost p-1 ${isPaused ? 'text-emerald-500' : 'text-amber-500'}`}>
                            {isPaused ? <CheckCircle2 size={12} /> : <Clock size={12} />}
                          </button>
                          <button aria-label="تعديل" onClick={() => onEditRecurring(r)} className="btn btn-ghost p-1 text-blue-500"><Edit size={12} /></button>
                          <button aria-label="حذف" onClick={() => deleteRecurring(r.id)} className="btn btn-ghost p-1 text-red-500"><Trash2 size={12} /></button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </details>
          )}
        </React.Fragment>
      )}
    </div>
  );
});
