      case 'comparison':
        return (<MonthComparisonView transactions={transactions} selectedYear={selectedYear} selectedMonth={selectedMonth} />);
      case 'calendar':
        return (
          <CalendarView data={data} getAgendaItems={getAgendaItems}
            transactions={transactions} dispatch={dispatch}
            saveHistory={saveHistory} addNotification={addNotification}
          />
        );
      case 'duplicates':
        return (
          <DuplicateDetectionSystem
            transactions={transactions} data={data} dispatch={dispatch}
            addNotification={addNotification} saveHistory={saveHistory}
            onBulkDelete={handleBulkDeleteInApp}
          />
        );
      case 'data-health':
        return (
          <DataHealthView
            data={data} transactions={transactions} cards={cards}
            updatedLoans={updatedLoans} liveBalances={liveBalances} dispatch={dispatch}
          />
        );
      case 'deleted':
        return (
          <DeletedArchiveView
            data={data} dispatch={dispatch} saveHistory={saveHistory}
            addNotification={addNotification} transactions={transactions}
          />
        );
      case 'audit':
        return <AuditLogView data={data} dispatch={dispatch} />;
      case 'settings':
        return (
          <SettingsView
            data={data} accountsData={accountsData} cards={cards} budgets={budgets}
            dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification}
            onResetPersonalData={handleResetPersonalData}
            onForceSave={handleForceSave} forceSaveState={forceSaveState}
          />
        );
      default: return null;
    }
  };

  const isHanyShopCat = isHanyShopCategory(formData.category);
  const appendQuickItem = (item) => {
    const current = formData.description || '';
    const sep = current && !current.endsWith(' ') && !current.endsWith(',') ? ' + ' : '';
    dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: current + sep + item } });
  };

  const NAV_ITEMS = [
    { id: 'dashboard', label: 'الرئيسية', icon: Home },
    { id: 'transactions', label: 'المعاملات', icon: Receipt },
    { id: 'cards', label: 'البطاقات', icon: CreditCard },
    { id: 'calendar', label: 'الأجندة', icon: CalendarDays },
    { id: 'more', label: 'المزيد', icon: MoreHorizontal }
  ];

  const MORE_GROUPS = SIDEBAR_GROUPS;

  return (
    <PromiseModalProvider>
      <div className="min-h-screen font-sans">
        <OfflineBanner online={isOnline} />
        <ToastContainer notifications={notifications} removeNotification={removeNotification} />
        <ConfirmDialog confirmDialog={confirmDialog} dispatch={dispatch} />

        <Sidebar
          isOpen={isSidebarOpen}
          onClose={() => dispatch({ type: 'SET_SIDEBAR_OPEN', payload: false })}
          activeTab={activeTab}
          onNavigate={(id) => dispatch({ type: 'SET_ACTIVE_TAB', payload: id })}
          isDarkMode={isDarkMode}
          onToggleTheme={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: !isDarkMode })}
          isOnline={isOnline} syncStatus={cloudSyncStatus} isSaving={isSaving}
          custodyBalance={custodySummary.balance} data={data}
          onOpenSms={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: true })}
          onForceSync={forcePullFromCloud}
          forceSaveState={forceSaveState}
          onForceSave={handleForceSave}
          onLogout={() => {
            firebase.auth().signOut();
            setIsAuthenticated(false);
            sessionStorage.removeItem(PIN_SESSION_KEY);
            setPinVerified(false);
          }}
          onLock={() => {
            sessionStorage.removeItem(PIN_SESSION_KEY);
            setPinVerified(false);
          }}
        />

        {pendingCloseModal.isOpen && (
          <PendingCloseModal
            data={pendingCloseModal}
            onClose={() => dispatch({ type: 'SET_PENDING_CLOSE_MODAL', payload: { isOpen: false, pending: [], total: 0, month: '', year: 0 } })}
            onAction={handlePendingCloseAction}
          />
        )}

        {isProcessing && (
          <div className="processing-overlay">
            <div className="processing-spinner mb-4"></div>
            <h3 className="text-base font-bold mb-2">جاري تطبيق العملية</h3>
            <button onClick={cancelProcessing} className="btn btn-danger mt-3 text-xs">إلغاء</button>
          </div>
        )}

        {isPinChangeOpen && (<PinChangeModal onClose={() => dispatch({ type: 'SET_PIN_CHANGE_OPEN', payload: false })} addNotification={addNotification} />)}

        {isSmsModalOpen && (
          <SmsParserModal
            isOpen={true}
            onClose={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: false })}
            dispatch={dispatch} addNotification={addNotification}
            saveHistory={saveHistory} data={data}
          />
        )}

        {activeCategoryDetail && (
          <CategoryDetailModal
            category={activeCategoryDetail} transactions={transactions}
            selectedMonth={selectedMonth} selectedYear={selectedYear}
            dispatch={dispatch} addNotification={addNotification}
          />
        )}

        {viewingCardStatement && (
          <CardStatementModal
            card={viewingCardStatement} data={data} transactions={transactions}
            onClose={() => dispatch({ type: 'SET_VIEWING_CARD_STATEMENT', payload: null })}
            addNotification={addNotification}
          />
        )}

        {reconciliationModal && (
          <ReconciliationModal
            accountKey={reconciliationModal.accountKey}
            computedBalance={reconciliationModal.computedBalance}
            onClose={() => dispatch({ type: 'SET_RECONCILIATION_MODAL', payload: null })}
            onReconcile={handleReconcile}
            addNotification={addNotification}
          />
        )}

        {/* Bottom Nav */}
        <div className="bottom-nav-container no-print">
          <div className="nav-grid">
            {NAV_ITEMS.map(item => {
              const Icon = item.icon;
              const isActive = activeTab === item.id ||
                (item.id === 'more' && ['categories', 'loans', 'planning', 'forecast', 'financial-forecast', 'comparison', 'duplicates', 'data-health', 'deleted', 'audit', 'settings', 'more'].includes(activeTab));
              return (
                <button key={item.id} type="button" onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} className={`nav-btn ${isActive ? 'active' : ''}`}>
                  <Icon size={20} /><span>{item.label}</span>
                </button>
              );
            })}
          </div>
        </div>

        {/* "More" sheet */}
        {activeTab === 'more' && (
          <div className="fixed inset-0 z-[2000] no-print animate-fadeIn lg:hidden" style={{ background: 'var(--bg-app)' }}>
            <div className="h-full overflow-y-auto pb-24">
              <div className="sticky top-0 z-10 px-4 py-4 flex justify-between items-center backdrop-blur-lg" style={{ background: 'color-mix(in srgb, var(--bg-app) 92%, transparent)', borderBottom: '1px solid var(--border-subtle)' }}>
                <h2 className="text-lg font-black">المزيد</h2>
                <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'dashboard' })} className="btn btn-ghost p-2"><X size={18} /></button>
              </div>
              <div className="p-4 max-w-2xl mx-auto space-y-4">
                <div className="card flex items-center gap-3">
                  <div className="w-14 h-14 rounded-2xl flex items-center justify-center text-white shadow-md" style={{ background: 'linear-gradient(135deg, #635BFF 0%, #4A42E5 100%)' }}>
                    <UserIcon size={24} />
                  </div>
                  <div className="flex-1">
                    <h3 className="font-black text-sm">Ahmed M. Khalil</h3>
                    <p className="text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>ahmedmkh@gmail.com</p>
                  </div>
                  <ForceSaveButton onForceSave={handleForceSave} state={forceSaveState} isSaving={isSaving} compact={true} />
                </div>
                <div>
                  <StatusBar isOnline={isOnline} syncStatus={cloudSyncStatus} isSaving={isSaving} custodyBalance={custodySummary.balance} />
                </div>
                {MORE_GROUPS.map(group => (
                  <div key={group.group}>
                    <p className="sidebar-group-title">{group.group}</p>
                    <div className="grid grid-cols-2 gap-2">
                      {group.items.map(item => {
                        const Icon = item.icon;
                        return (
                          <button key={item.id} onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} className="card card-hover p-4 flex items-center gap-3 text-right active:scale-[0.98]">
                            <div className="p-2 rounded-xl" style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}><Icon size={16} /></div>
                            <span className="font-black text-xs">{item.label}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
                <div>
                  <p className="sidebar-group-title">البيانات</p>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={handleExport} className="card card-hover p-4 flex items-center gap-3 active:scale-[0.98]">
                      <div className="p-2 rounded-xl bg-blue-50 dark:bg-blue-950/30 text-blue-600"><Download size={16} /></div>
                      <span className="font-black text-xs">حفظ نسخة</span>
                    </button>
                    <label className="card card-hover p-4 flex items-center gap-3 cursor-pointer active:scale-[0.98]">
                      <div className="p-2 rounded-xl bg-purple-50 dark:bg-purple-950/30 text-purple-600"><Upload size={16} /></div>
                      <span className="font-black text-xs">استيراد</span>
                      <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                    </label>
                  </div>
                </div>
                <div>
                  <p className="sidebar-group-title">الأمان</p>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => { sessionStorage.removeItem(PIN_SESSION_KEY); setPinVerified(false); }} className="card card-hover p-4 flex items-center gap-3 active:scale-[0.98]">
                      <div className="p-2 rounded-xl bg-amber-50 dark:bg-amber-950/30 text-amber-600"><Lock size={16} /></div>
                      <span className="font-black text-xs">قفل التطبيق</span>
                    </button>
                    <button onClick={() => { firebase.auth().signOut(); setIsAuthenticated(false); sessionStorage.removeItem(PIN_SESSION_KEY); setPinVerified(false); }} className="card card-hover p-4 flex items-center gap-3 active:scale-[0.98]">
                      <div className="p-2 rounded-xl bg-red-50 dark:bg-red-950/30 text-red-600"><LogOut size={16} /></div>
                      <span className="font-black text-xs">تسجيل الخروج</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Main */}
        <main className="p-3 lg:p-5 w-full">
          <div className="max-w-5xl mx-auto space-y-4 animate-fadeIn pb-24">
            {activeTab !== 'more' && (
              <ProfessionalHeader
                isDarkMode={isDarkMode} dispatch={dispatch}
                onOpenSms={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: true })}
                isOnline={isOnline} syncStatus={cloudSyncStatus} isSaving={isSaving}
                custodyBalance={custodySummary.balance}
                onOpenSidebar={() => dispatch({ type: 'SET_SIDEBAR_OPEN', payload: true })}
                onForceSync={forcePullFromCloud}
                forceSaveState={forceSaveState} onForceSave={handleForceSave}
              />
            )}
            {activeTab !== 'more' && renderActiveView()}
          </div>
        </main>

        {/* Add/Edit Transaction Modal */}
        {isFormOpen && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)', maxHeight: 'calc(100dvh - 24px)' }}>
              <div className="p-4 flex justify-between items-center flex-shrink-0" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-base font-black">{formMode === 'add' ? 'إضافة عملية' : 'تعديل عملية'}</h3>
                <button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_FORM_OPEN', payload: false })} className="btn btn-ghost p-2"><X size={18} /></button>
              </div>
              <form onSubmit={handleSaveTransaction} className="p-4 space-y-3 overflow-y-auto scroll-hide">
                {!isOnline && (
                  <div className="p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900 flex items-center gap-2">
                    <Wifi size={14} className="text-amber-600" />
                    <span className="text-[11px] font-bold text-amber-700 dark:text-amber-400">أنت غير متصل — سيتم الحفظ محلياً والمزامنة تلقائياً</span>
                  </div>
                )}

                <div className="form-section">
                  <div className="form-section-title"><span>🎯</span> التصنيف</div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>النوع</label>
                      <select className="input-field font-bold text-sm py-3" value={formData.type}
                        onChange={(e) => {
                          const t = e.target.value;
                          dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, type: t, subType: t === 'income' ? 'deposit' : 'withdrawal', category: '' } });
                        }}>
                        <option value="expense">مصروف 💸</option>
                        <option value="income">دخل 💰</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>الفئة *</label>
                      <select className={`input-field font-bold text-sm py-3 ${formErrors.category ? 'error' : ''}`} value={formData.category}
                        onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, category: e.target.value } })} required>
                        <option value="">اختر...</option>
                        {Object.entries(CATEGORY_GROUPS[formData.type]).map(([g, items]) => (
                          <optgroup key={g} label={g}>{items.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>
                        ))}
                      </select>
                    </div>
                  </div>
                </div>

                <div className="form-section">
                  <div className="form-section-title"><span>📊</span> الحالة</div>
                  <div className="grid grid-cols-2 gap-2">
                    <label className={`flex items-center justify-center gap-2 p-3 rounded-xl cursor-pointer border-2 font-bold text-xs transition-all ${formData.status !== 'paid' ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-500 text-amber-700 dark:text-amber-400' : 'border-transparent'}`}>
                      <input type="radio" name="status" value="pending" className="hidden" checked={formData.status !== 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'pending' } })} />
                      <Clock size={14} /> معلق
                    </label>
                    <label className={`flex items-center justify-center gap-2 p-3 rounded-xl cursor-pointer border-2 font-bold text-xs transition-all ${formData.status === 'paid' ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-500 text-emerald-700 dark:text-emerald-400' : 'border-transparent'}`}>
                      <input type="radio" name="status" value="paid" className="hidden" checked={formData.status === 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'paid' } })} />
                      <CheckCircle2 size={14} /> معتمد
                    </label>
                  </div>
                </div>

                <div className="form-section">
                  <div className="form-section-title"><span>💰</span> المبلغ والدفع</div>
                  <div className="grid grid-cols-2 gap-2.5 mb-3">
                    <div>
                      <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>الكمية</label>
                      <input type="number" inputMode="numeric" min="1" className="input-field input-num text-base text-center py-3"
                        value={formData.quantity || ''}
                        onChange={e => {
                          const qty = e.target.value;
                          const price = formData.unitPrice;
                          const newAmount = (qty && price) ? String(Number(qty) * Number(price)) : formData.amount;
                          dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, quantity: qty, amount: newAmount } });
                        }}
                        placeholder="العدد" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>سعر الوحدة</label>
                      <input type="text" inputMode="decimal" className="input-field input-num text-base text-center py-3"
                        value={formData.unitPrice || ''}
                        onChange={e => {
                          const price = e.target.value;
                          const qty = formData.quantity;
                          const newAmount = (qty && price) ? String(Number(qty) * Number(price)) : formData.amount;
                          dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, unitPrice: price, amount: newAmount } });
                        }}
                        placeholder="السعر" />
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2.5">
                    <div>
                      <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ *</label>
                      <input type="text" inputMode="decimal" required className={`input-field input-num text-base text-center py-3 ${formErrors.amount ? 'error' : ''}`}
                        style={{ color: 'var(--accent)' }} value={formData.amount}
                        onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, amount: e.target.value } })} placeholder="0.00" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>التاريخ</label>
                      <input type="date" required className={`input-field text-[11px] font-bold py-3 ${formErrors.date ? 'error' : ''}`}
                        value={formData.date} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, date: e.target.value } })} />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>الدفع</label>
                      <select className="input-field text-[11px] font-bold py-3" value={formData.method}
                        onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, method: e.target.value } })}>
                        {PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                      </select>
                    </div>
                  </div>
                </div>

                <div className="form-section">
                  <div className="form-section-title"><span>📝</span> الوصف</div>
                  <input type="text" className={`input-field font-bold text-sm py-3 ${formErrors.description ? 'error' : ''}`}
                    value={formData.description || ''}
                    onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: e.target.value } })}
                    placeholder="تفاصيل..." />
                </div>

                {isHanyShopCat && (
                  <div className="p-3 rounded-xl animate-fadeIn" style={{ background: 'var(--warning-soft)', border: '1px dashed var(--warning)' }}>
                    <div className="flex items-center justify-between mb-2">
                      <p className="text-[10px] font-black text-amber-700 dark:text-amber-400">أصناف سريعة — محل هاني</p>
                      <button type="button" onClick={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: '' } })} className="text-[9px] font-bold text-red-500 hover:underline">مسح</button>
                    </div>
                    <div className="flex flex-wrap gap-1 max-h-32 overflow-y-auto scroll-hide">
                      {HANY_QUICK_ITEMS.map(item => (<button key={item} type="button" onClick={() => appendQuickItem(item)} className="quick-chip">{item}</button>))}
                    </div>
                  </div>
                )}

                <button type="submit" className="btn btn-primary w-full py-3 text-sm" disabled={isProcessing}>
                  {isProcessing ? 'جاري الحفظ...' : (<React.Fragment><Save size={16} /> {formData.status === 'paid' ? 'حفظ واعتماد' : 'حفظ كمعلق'}</React.Fragment>)}
                </button>
              </form>
            </div>
          </div>
        )}

        {/* Editing Card */}
        {editingCard && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-sm font-black">تعديل البطاقة</h3>
                <button type="button" onClick={() => dispatch({ type: 'SET_EDITING_CARD', payload: null })} className="btn btn-ghost p-2"><X size={18} /></button>
              </div>
              <form onSubmit={handleUpdateCard} className="p-4 space-y-3">
                <div className="grid grid-cols-2 gap-3">
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الاسم</label>
                    <input type="text" required className="input-field text-sm" value={editingCard.name} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, name: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>البنك</label>
                    <input type="text" required className="input-field text-sm" value={editingCard.bank} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, bank: e.target.value } })} /></div>
                </div>
                <div className="grid grid-cols-3 gap-3">
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الحد</label>
                    <input type="text" inputMode="decimal" className="input-field input-num text-blue-600 text-sm" value={editingCard.limit} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, limit: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>مديونية أساسية</label>
                    <input type="text" inputMode="decimal" className="input-field input-num text-red-500 text-sm" value={editingCard.openingDebt} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, openingDebt: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>كاش باك %</label>
                    <input type="text" inputMode="decimal" className="input-field input-num text-amber-600 text-sm text-center" value={editingCard.cashbackRate || 0} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, cashbackRate: e.target.value } })} /></div>
                </div>
                <div className="grid grid-cols-3 gap-3">
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>آخر 4 أرقام</label>
                    <input type="text" maxLength={4} className="input-field mono text-sm text-center" value={editingCard.last4 || ''} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, last4: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>تاريخ المديونية</label>
                    <input type="date" className="input-field text-sm" value={editingCard.openingDebtDate || getLocalISODate()} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, openingDebtDate: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>تاريخ القطع</label>
                    <input type="date" className="input-field text-sm" value={editingCard.openingDate || getLocalISODate()} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, openingDate: e.target.value } })} /></div>
                </div>
                <button type="submit" className="btn btn-primary w-full py-3 text-sm">حفظ</button>
              </form>
            </div>
          </div>
        )}

        {/* Editing Loan */}
        {editingLoan && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-sm font-black">تعديل الالتزام</h3>
                <button type="button" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: null })} className="btn btn-ghost p-2"><X size={18} /></button>
              </div>
              <form onSubmit={handleUpdateLoan} className="p-4 space-y-3">
                <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الاسم</label>
                  <input type="text" className="input-field text-sm" value={editingLoan.name} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, name: e.target.value } })} /></div>
                <div className="grid grid-cols-2 gap-3">
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>المبلغ</label>
                    <input type="text" inputMode="decimal" className="input-field text-sm" value={editingLoan.totalAmount} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, totalAmount: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>القسط</label>
                    <input type="text" inputMode="decimal" className="input-field text-sm" value={editingLoan.monthlyInstallment} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, monthlyInstallment: e.target.value } })} /></div>
                </div>
                {editingLoan.isReceivable && (
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>إجمالي الأقساط</label>
                      <input type="number" min="0" className="input-field text-sm text-center" value={editingLoan.totalInstallments ?? ''} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, totalInstallments: e.target.value } })} /></div>
                    <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>المدفوعة</label>
                      <input type="number" min="0" className="input-field text-sm text-center" value={editingLoan.paidInstallments ?? ''} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, paidInstallments: e.target.value } })} /></div>
                  </div>
                )}
                <button type="submit" className="btn btn-primary w-full py-3 text-sm">حفظ</button>
              </form>
            </div>
          </div>
        )}

        {/* Budget */}
        {editingBudgetCategory && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-sm rounded-2xl shadow-2xl p-5 animate-scaleIn" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <h3 className="text-sm font-black mb-3">ميزانية: {editingBudgetCategory}</h3>
              <input type="text" inputMode="decimal" className="input-field input-num text-base mb-3 text-center" style={{ color: 'var(--accent)' }} value={budgetAmount} onChange={e => dispatch({ type: 'SET_BUDGET_AMOUNT', payload: e.target.value })} placeholder="0.00" />
              <div className="flex gap-2">
                <button type="button" onClick={handleSaveBudget} className="btn btn-primary flex-1 text-sm">حفظ</button>
                <button type="button" onClick={() => dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null })} className="btn btn-secondary flex-1 text-sm">إلغاء</button>
              </div>
            </div>
          </div>
        )}

        {/* Quick Transfer */}
        {isQuickTransferModalOpen && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-sm font-black flex items-center gap-2"><ArrowLeftRight size={16} className="text-[color:var(--accent)]" /> التحويلات</h3>
                <button type="button" onClick={() => { dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false }); dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { transferMode: 'monthly' } }); }} className="btn btn-ghost p-2"><X size={18} /></button>
              </div>
              <div className="p-2" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <div className="sub-tab-switcher">
                  <button type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { transferMode: 'monthly' } })} className={`sub-tab-btn ${quickTransferData.transferMode !== 'internal' ? 'active' : ''}`}>👨‍👩‍👧 مصروف شهري</button>
                  <button type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { transferMode: 'internal' } })} className={`sub-tab-btn ${quickTransferData.transferMode === 'internal' ? 'active' : ''}`}>🔁 بين حساباتي</button>
                </div>
              </div>
              <form onSubmit={handleQuickTransfer} className="p-4 space-y-3">
                {quickTransferData.transferMode === 'internal' ? (
                  <React.Fragment>
                    <div className="p-3 rounded-xl" style={{ background: 'var(--accent-soft)', border: '1px solid var(--accent)' }}>
                      <p className="text-[10px] font-bold" style={{ color: 'var(--accent)' }}>💡 يسجّل عمليتين تلقائياً: خروج من المصدر + دخول للوجهة</p>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>من حساب</label>
                        <select className="input-field text-sm py-3" value={quickTransferData.internalFrom || 'cib_savings'} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { internalFrom: e.target.value } })}>
                          {PAYMENT_METHODS.filter(m => m.group === 'account').map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>إلى حساب</label>
                        <select className="input-field text-sm py-3" value={quickTransferData.internalTo || 'fawry'} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { internalTo: e.target.value } })}>
                          {PAYMENT_METHODS.filter(m => m.group === 'account').map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>المبلغ *</label>
                      <input type="text" inputMode="decimal" className="input-field input-num text-base text-center py-3" style={{ color: 'var(--accent)' }} value={quickTransferData.amount || ''} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: e.target.value } })} placeholder="0.00" />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>رسوم (اختياري)</label>
                        <input type="text" inputMode="decimal" className="input-field text-sm py-3" value={quickTransferData.internalFees || ''} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { internalFees: e.target.value } })} placeholder="0.00" /></div>
                      <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>التاريخ</label>
                        <input type="date" className="input-field text-sm font-bold py-3" value={quickTransferData.date || getLocalISODate()} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { date: e.target.value } })} /></div>
                    </div>
                    <div>
                      <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>ملاحظة (اختياري)</label>
                      <input type="text" className="input-field text-sm py-3" value={quickTransferData.internalDescription || ''} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { internalDescription: e.target.value } })} placeholder="مثلاً: تحويل لدفع فاتورة..." />
                    </div>
                    <button type="submit" className="btn btn-primary w-full py-3 text-sm" disabled={isProcessing}>
                      {isProcessing ? 'جاري التنفيذ...' : '🔁 تسجيل التحويل'}
                    </button>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <div>
                      <label className="text-[11px] font-bold block mb-2" style={{ color: 'var(--text-muted)' }}>المستفيد *</label>
                      <div className="grid grid-cols-2 gap-2">
                        {BENEFICIARIES.map(ben => (
                          <button key={ben.id} type="button"
                            onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { beneficiaryId: ben.id, amount: String(ben.defaultAmount) } })}
                            className={`p-3 rounded-xl text-xs font-bold transition-all border-2 ${quickTransferData.beneficiaryId === ben.id ? 'border-[color:var(--accent)] bg-[color:var(--accent-soft)]' : 'border-[color:var(--border-default)]'}`}
                            style={quickTransferData.beneficiaryId === ben.id ? { color: 'var(--accent)' } : {}}>
                            <div className="flex flex-col items-center gap-1">
                              <span className="font-black">{ben.label}</span>
                              <span className="text-[10px] opacity-70 money tabular">{fmt(ben.defaultAmount)}</span>
                            </div>
                          </button>
                        ))}
                      </div>
                    </div>
                    <div>
                      <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>من حساب</label>
                      <select className="input-field text-sm py-3" value={quickTransferData.from} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: e.target.value } })}>
                        {PAYMENT_METHODS.filter(m => m.group === 'account').map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>المبلغ</label>
                      <input type="text" inputMode="decimal" className="input-field input-num text-base text-center py-3" style={{ color: 'var(--accent)' }} value={quickTransferData.amount} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: e.target.value } })} placeholder="0.00" />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>التاريخ</label>
                      <input type="date" className="input-field text-sm font-bold py-3" value={quickTransferData.date || getLocalISODate()} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { date: e.target.value } })} />
                    </div>
                    <button type="submit" className="btn btn-primary w-full py-3 text-sm" disabled={isProcessing}>
                      {isProcessing ? 'جاري التنفيذ...' : 'تسجيل المصروف الشهري'}
                    </button>
                  </React.Fragment>
                )}
              </form>
            </div>
          </div>
        )}

        {/* Recurring Modal */}
        {isRecurringModalOpen && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-sm font-black flex items-center gap-2">
                  <Repeat size={16} className="text-[color:var(--accent)]" />
                  {recurringFormData.id ? 'تعديل بند متكرر' : 'التزام متكرر جديد'}
                </h3>
                <button type="button" onClick={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false })} className="btn btn-ghost p-2"><X size={18} /></button>
              </div>
              <form onSubmit={handleSaveRecurring} className="p-4 space-y-3">
                <div>
                  <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>العنوان *</label>
                  <input type="text" required className="input-field text-sm" value={recurringFormData.title} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, title: e.target.value } })} />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>المبلغ *</label>
                    <input type="text" inputMode="decimal" required className="input-field input-num text-sm text-center" style={{ color: 'var(--accent)' }} value={recurringFormData.amount} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, amount: e.target.value } })} />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>اليوم (1-31)</label>
                    <input type="number" required min="1" max="31" className="input-field text-center text-sm" value={recurringFormData.day} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, day: e.target.value } })} />
                  </div>
                </div>
                <div>
                  <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>النوع</label>
                  <select className="input-field text-sm" value={recurringFormData.type} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, type: e.target.value, category: '' } })}>
                    <option value="expense">مصروف</option>
                    <option value="income">دخل</option>
                  </select>
                </div>
                <div>
                  <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الفئة</label>
                  <select className="input-field text-sm" value={recurringFormData.category} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, category: e.target.value } })}>
                    {CATEGORIES[recurringFormData.type].map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>طريقة الدفع</label>
                  <select className="input-field text-sm" value={recurringFormData.method || 'cash'} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, method: e.target.value } })}>
                    {PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                  </select>
                </div>
                {recurringFormData.category && recurringFormData.category.startsWith('مصروف شهري - ') && (
                  <div>
                    <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>قناة التحويل (Telda)</label>
                    <select className="input-field text-sm" value={recurringFormData.transferChannel || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, transferChannel: e.target.value || null } })}>
                      <option value="">— بدون —</option>
                      {EXTERNAL_TRANSFER_METHOD_IDS.map(id => (<option key={id} value={id}>{PAYMENT_METHODS.find(m => m.id === id)?.label || id}</option>))}
                    </select>
                  </div>
                )}
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>من شهر</label>
                    <input type="month" className="input-field text-xs font-bold py-2" value={recurringFormData.startMonth || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, startMonth: e.target.value } })} />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>إلى شهر</label>
                    <input type="month" className="input-field text-xs font-bold py-2" value={recurringFormData.endMonth || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, endMonth: e.target.value } })} />
                  </div>
                </div>
                <label className="flex items-center gap-2.5 p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 cursor-pointer">
                  <input type="checkbox" checked={recurringFormData.active !== false} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, active: e.target.checked } })} className="w-4 h-4 accent-emerald-600" />
                  <span className="text-xs font-bold text-emerald-700 dark:text-emerald-400">نشط (سيُولّد تلقائياً كل شهر)</span>
                </label>
                <button type="submit" className="btn btn-primary w-full py-3 text-sm">
                  <Save size={16} /> {recurringFormData.id ? 'تحديث البند' : 'إضافة البند'}
                </button>
              </form>
            </div>
          </div>
        )}
      </div>
    </PromiseModalProvider>
  );
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════ */
const rootElement = document.getElementById('root');
if (rootElement) {
  createRoot(rootElement).render(<ErrorBoundary><App /></ErrorBoundary>);
  const hideLoading = () => {
    const l = document.getElementById('loading');
    if (!l) return;
    l.style.transition = 'opacity 0.4s ease';
    l.style.opacity = '0';
    setTimeout(() => { l.style.display = 'none'; }, 400);
  };
  if (document.readyState === 'complete') {
    setTimeout(hideLoading, 500);
  } else {
    window.addEventListener('load', () => setTimeout(hideLoading, 500));
  }
}
</script>
</body>
</html>
