const toEnglishDigits = (s) => { if (s === null || s === undefined) return s; const map = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9' }; return String(s).replace(/[٠-٩۰-۹]/g, d => map[d]); };
const parseNumberInput = (v) => { const cleaned = toEnglishDigits(v).replace(/[^\d.\-]/g, ''); const n = Number(cleaned); return isNaN(n) ? 0 : n; };

// ✅ جديد — parse آمن للتواريخ ISO (تفادي مشكلة UTC)
const parseISODate = (iso) => {
  if (!iso) return null;
  if (iso instanceof Date) return isNaN(iso) ? null : iso;
  const s = String(iso);
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if (m) {
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d) ? null : d;
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
};

const inputMonthToKey = (v) => { if (!v || !/^\d{4}-\d{2}$/.test(String(v))) return null; const [y, m] = String(v).split('-').map(Number); if (m < 1 || m > 12 || isNaN(y)) return null; return `${y}-${ALL_MONTHS_EARLY[m - 1]}`; };
const keyToInputMonth = (k) => { if (!k || typeof k !== 'string') return ''; const idx = k.indexOf('-'); if (idx < 0) return ''; const y = k.slice(0, idx); const mName = k.slice(idx + 1); const mIdx = ALL_MONTHS_EARLY.indexOf(mName); if (mIdx < 0 || !/^\d{4}$/.test(y)) return ''; return `${y}-${String(mIdx + 1).padStart(2, '0')}`; };

const parseBankSms = (rawInput) => {
  const result = { ok: false, bank: '', bankId: null, last4: null, amount: 0, type: 'expense', subType: 'withdrawal', date: getLocalISODate(), method: null, linkedCardId: null, accountKind: null, cardLabel: '', description: '', balance: null, rawText: String(rawInput || ''), notes: [] };
  if (!rawInput || typeof rawInput !== 'string' || rawInput.trim().length < 5) { result.notes.push('النص قصير جداً'); return result; }
  const text = toEnglishDigits(rawInput).replace(/\u00A0/g, ' ');

  // ✅ جديد — رفض OTP ورسائل التحقق
  if (/\b(OTP|one[\s-]?time|verification\s+code|رمز\s+(التحقق|التأكيد)|do\s+not\s+share)\b/i.test(text)) {
    result.notes.push('❌ هذه رسالة تحقق (OTP) — لا يمكن تسجيلها كمعاملة');
    return result;
  }

  if (/\bCIB\b|Commercial International|SWYPE|Titanium|سي آي بي/i.test(text)) { result.bank = 'CIB'; result.bankId = 'cib'; }
  else if (/\bAAIB\b|Arab African|العربي الأفريقي|العربي الافريقي|الإفريقي الدولي/i.test(text)) { result.bank = 'AAIB'; result.bankId = 'aaib'; }
  const last4Patterns = [/\b(?:ending|ends)\s*(?:with\s*)?(\d{4})\b/i, /\bcard\s*(?:no\.?|number|#)?\s*[:\-]?\s*(?:\*{2,}|\.{2,}|x{2,})?\s*(\d{4})\b/i, /(?:\*{2,}|\.{2,}|x{2,})\s*(\d{4})\b/i, /رقم\s*(?:\*{2,}|\.{2,})?\s*(\d{4})\b/, /بطاق[ةه]\s*(?:رقم\s*)?(?:\*{2,}|\.{2,})?\s*(\d{4})\b/, /(?:acct|account|حساب)\s*(?:no\.?|number|#)?\s*[:\-]?\s*(?:\*{2,}|\.{2,}|x{2,})?\s*(\d{4})\b/i];
  for (const p of last4Patterns) { const m = text.match(p); if (m) { result.last4 = m[1]; break; } }
  const incomeHints = [/\bcredit(?:ed)?\b/i, /\bdeposit(?:ed)?\b/i, /\breceived\b/i, /\bsalary\b/i, /\brefund\b/i, /\breimbursement\b/i, /\bcashback\b/i, /\badded\b/i, /إيداع/, /تم إيداع/, /أضيف/, /تم إضافة/, /راتب/, /استرداد/, /كاش باك/, /وارد/, /دائن/];
  const expenseHints = [/\bdebit(?:ed)?\b/i, /\bpurchase\b/i, /\bwithdraw(?:al|n)?\b/i, /\bpaid\b/i, /\bpayment\b/i, /\bcharge[d]?\b/i, /\bspent\b/i, /\batm\b/i, /خصم/, /تم خصم/, /سحب/, /شراء/, /دفع/, /مدفوع/, /صادر/, /استخدام/, /مدين/];
  const isIncome = incomeHints.some(r => r.test(text));
  const isExpense = expenseHints.some(r => r.test(text));
  if (isIncome && !isExpense) { result.type = 'income'; result.subType = 'deposit'; }
  else if (isExpense && !isIncome) { result.type = 'expense'; result.subType = 'withdrawal'; }
  else if (isIncome && isExpense) { result.notes.push('نوع العملية غير واضح — تم افتراض مصروف'); }
  else { result.notes.push('لم يتم التعرف على نوع العملية'); }

  // ✅ جديد — استخراج مبلغ محصّن: يفضّل الصيغة العشرية ويرفض الأرقام القصيرة
  const cur = '(?:EGP|LE|E£|ج\\.?م|جنيه|جم|ق\\.?م|ريال|SAR|USD|AED|درهم|دينار|\\$)';
  const amtPatterns = [
    new RegExp(`${cur}\\s*([0-9][0-9,]*\\.?[0-9]*)`, 'i'),
    new RegExp(`([0-9][0-9,]*\\.?[0-9]*)\\s*${cur}`, 'i'),
    /(?:amount|for|of|بقيمة|بمبلغ|مبلغ)\s*[:\s]*([0-9][0-9,]*\.?[0-9]*)/i
  ];
  for (const p of amtPatterns) {
    const m = text.match(p);
    if (m) {
      const n = Number(m[1].replace(/,/g, ''));
      // ✅ رفض المبالغ الصغيرة جداً أو الكبيرة جداً
      if (n >= 1 && n < 100000000) { result.amount = n; break; }
    }
  }
  // ✅ fallback محصّن: يفضّل الأرقام العشرية (X.XX)، يرفض 4-6 أرقام متتالية (OTP-like)
  if (!result.amount) {
    const decimalMatches = text.match(/\b\d{1,8}\.\d{2}\b/g) || [];
    const decNums = decimalMatches.map(s => Number(s)).filter(n => n >= 1 && n < 100000000);
    if (decNums.length === 1) { result.amount = decNums[0]; result.notes.push('تم استخراج المبلغ من الصيغة العشرية — راجعه'); }
    else if (decNums.length > 1) {
      result.amount = Math.max(...decNums);
      result.notes.push(`تم اختيار أكبر مبلغ عشري (${decNums.length} مرشح) — راجعه`);
    } else {
      const all = text.match(/[0-9][0-9,]*\.?[0-9]*/g) || [];
      const nums = all.map(s => Number(s.replace(/,/g, ''))).filter(n => n >= 10 && n < 1000000 && String(n).length < 10);
      if (nums.length === 1) { result.amount = nums[0]; result.notes.push('تم استخراج المبلغ — راجعه'); }
      else if (nums.length > 1) { result.notes.push(`⚠️ ${nums.length} أرقام محتملة — اختر المبلغ يدوياً`); }
    }
  }
  const balMatch = text.match(/(?:balance|الرصيد|رصيد)[^\d]{0,20}([0-9][0-9,]*\.?[0-9]*)/i);
  if (balMatch) { const b = Number(balMatch[1].replace(/,/g, '')); if (b > 0 && b !== result.amount) result.balance = b; }

  const now = new Date();
  let parsedDate = null;
  const MONTHS_EN = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
  const MONTHS_AR = { 'يناير':1,'فبراير':2,'مارس':3,'أبريل':4,'ابريل':4,'مايو':5,'يونيو':6,'يوليو':7,'أغسطس':8,'اغسطس':8,'سبتمبر':9,'أكتوبر':10,'اكتوبر':10,'نوفمبر':11,'ديسمبر':12 };
  let m = text.match(/\b(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})\b/);
  if (m) { const d = +m[1], mo = +m[2]; let y = +m[3]; if (y < 100) y += 2000; if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12 && y >= 2020 && y <= 2100) parsedDate = new Date(y, mo - 1, d); }
  if (!parsedDate) { m = text.match(/\b(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})\b/); if (m) { const y = +m[1], mo = +m[2], d = +m[3]; if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12 && y >= 2020 && y <= 2100) parsedDate = new Date(y, mo - 1, d); } }
  if (!parsedDate) { m = text.match(/\b(\d{1,2})[\s\-]*([A-Za-z]{3,9})[\s\-]*(\d{2,4})\b/); if (m) { const mo = MONTHS_EN[m[2].toLowerCase().slice(0, 3)]; if (mo) { let y = +m[3]; if (y < 100) y += 2000; parsedDate = new Date(y, mo - 1, +m[1]); } } }
  if (!parsedDate) { const arNames = Object.keys(MONTHS_AR).join('|'); const re = new RegExp(`(\\d{1,2})\\s*(${arNames})\\s*(\\d{2,4})`); m = text.match(re); if (m) { const mo = MONTHS_AR[m[2]]; let y = +m[3]; if (y < 100) y += 2000; parsedDate = new Date(y, mo - 1, +m[1]); } }
  if (parsedDate && !isNaN(parsedDate) && parsedDate <= now) result.date = getLocalISODate(parsedDate);
  else { result.date = getLocalISODate(now); if (parsedDate && !isNaN(parsedDate) && parsedDate > now) result.notes.push('التاريخ في المستقبل — تم استخدام اليوم'); }

  const merchantPatterns = [/\bat\s+([A-Z][A-Z0-9\s&'\.\-]{2,40}?)(?:\s+on\s|\s+at\s|\s*[\.\,\n]|$)/i, /\b(?:merchant|from|to)\s*[:\-]?\s*([A-Z][A-Z0-9\s&'\.\-]{2,40}?)(?:\s+on\s|\s*[\.\,\n]|$)/i, /لدى\s+([^\.,\n]{2,40}?)(?:\s+يوم|\s+بتاريخ|\s*[\.\,\n]|$)/, /في\s+([^\.,\n]{2,40}?)(?:\s+يوم|\s+بتاريخ|\s*[\.\,\n]|$)/];
  for (const p of merchantPatterns) { const mm = text.match(p); if (mm && mm[1]) { const desc = mm[1].trim().replace(/\s+/g, ' '); if (desc.length >= 2 && !/^\d+$/.test(desc)) { result.description = desc; break; } } }
  if (!result.description) { const caps = text.match(/\b[A-Z][A-Z0-9&'\.\-]{2,}(?:\s+[A-Z][A-Z0-9&'\.\-]{2,}){0,4}\b/g) || []; const filtered = caps.filter(w => !/^(CIB|AAIB|EGP|LE|ATM|SMS|OTP|REF|SWYPE|TITANIUM|SIGNATURE|MASTERCARD|VISA|USD|SAR|AED|THE|AND|FOR|OF|ON|AT|YOUR|CARD|WAS|USED)$/i.test(w)); if (filtered.length) result.description = filtered[0].trim(); }
  if (result.last4 && CARD_LAST4_MAP[result.last4]) {
    const mapping = CARD_LAST4_MAP[result.last4];
    result.method = mapping.method;
    result.linkedCardId = mapping.linkedCardId;
    result.bank = mapping.bank;
    result.accountKind = mapping.kind;
    result.cardLabel = mapping.label || '';
    if (mapping.kind === 'account') result.notes.push(`✅ تم التعرف: ${mapping.label} (حساب بنكي)`);
    else if (mapping.kind === 'subcard') result.notes.push(`✅ بطاقة فرعية (${result.last4}) تابعة لبطاقة Titanium`);
    else if (mapping.kind === 'card') result.notes.push(`✅ تم التعرف: ${mapping.label}`);
  }
  else if (result.bankId === 'cib') { result.method = 'cib_card'; result.linkedCardId = 1; result.notes.push('⚠️ لم يتم التعرف على البطاقة — تم افتراض Titanium'); }
  else if (result.bankId === 'aaib') { result.method = 'aaib_card'; result.linkedCardId = 2; result.notes.push('⚠️ لم يتم التعرف على البطاقة — تم افتراض Signature'); }
  if (/\bTelda\b|تيلدا/i.test(text)) {
    const personMatch = text.match(/(?:to|لـ|إلى)\s*(Shaimaa|Salma|Abdelrahman|شيماء|سلمى|عبد الرحمن)/i);
    if (personMatch) {
      const p = personMatch[1].toLowerCase();
      if (p === 'shaimaa' || p === 'شيماء') { result.method = 'telda_shaimaa'; result.description = result.description || 'تحويل Telda - شيماء'; }
      else if (p === 'salma' || p === 'سلمى') { result.method = 'telda_salma'; result.description = result.description || 'تحويل Telda - سلمى'; }
      else if (p === 'abdelrahman' || p === 'عبد الرحمن') { result.method = 'telda_abdelrahman'; result.description = result.description || 'تحويل Telda - عبد الرحمن'; }
    }
  }
  result.ok = result.amount > 0;
  if (!result.ok) result.notes.push('لم يتم العثور على مبلغ صالح — أدخله يدوياً');
  if (!result.method) result.notes.push('لم يتم التعرف على البطاقة — اختر يدوياً');
  if (!result.description) result.description = result.type === 'income' ? 'دخل من SMS' : 'مصروف من SMS';
  return result;
};

// ── Validation ──
const VALIDATION = { AMOUNT: { min: 0.01, max: 10000000, label: 'المبلغ' }, POSITIVE_INT: { min: 1, max: 31, label: 'الرقم' }, TEXT: { min: 1, max: 500, label: 'النص' }, LIMIT: { min: 100, max: 10000000, label: 'الحد الائتماني' }, INSTALLMENT: { min: 0, max: 10000000, label: 'القسط' } };
const validateAmount = (raw, opts = {}) => {
  const cfg = { ...VALIDATION.AMOUNT, ...opts };
  const cleaned = toEnglishDigits(String(raw ?? '')).replace(/[^\d.\-]/g, '');
  const n = parseFloat(cleaned);
  if (isNaN(n) || !isFinite(n)) return { valid: false, error: 'اكتب رقم صحيح', value: 0 };
  if (n < cfg.min) return { valid: false, error: `الحد الأدنى ${fmt(cfg.min)} ج.م`, value: 0 };
  if (n > cfg.max) return { valid: false, error: `الحد الأقصى ${fmt(cfg.max)} ج.م`, value: 0 };

const computeCardDebt = (data, card, asOfDate) => {
  if (!card) return 0;

  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();
  let debt = safeNumber(card.openingDebt);
  (data?.transactions || []).forEach(t => {
    if (t.status !== 'paid') return;
    const d = parseISODate(t.date);
    if (!d || d > upper) return;
    const amt = safeNumber(t.amount);

    // ✅ تحديد الانتماء بأولوية: linkedCardId > cardLast4 (sub) > method
    let belongsToCard = false;
    const hasExplicitCardLink = (t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== '');
    if (hasExplicitCardLink) {
      belongsToCard = (t.linkedCardId === card.id);

    } else {

};

// 🔁 materializeRecurringItems — يشمل transferChannel + sourceReceivableId
const materializeRecurringItems = (data, asOfDateStr) => {
  if (!data?.recurringItems?.length) return null;
  const now = asOfDateStr ? new Date(asOfDateStr) : new Date();
  const nowYear = now.getFullYear();
  const nowMonth = ALL_MONTHS[now.getMonth()];
  const nowMonthKey = makeMonthKey(nowYear, nowMonth);
  const nowInputMonth = `${nowYear}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const existing = data.transactions || [];
  const materialized = { ...(data.materializedRecurring || {}) };
  const newTxs = [];
  const loanPaidMap = {};
  existing.forEach(t => { if (t.status === 'paid' && t.sourceReceivableId) loanPaidMap[t.sourceReceivableId] = (loanPaidMap[t.sourceReceivableId] || 0) + safeNumber(t.amount); });
  data.recurringItems.forEach(r => {
    if (r.active === false) return;
    if (!r.id || !r.type) return;
    if (r.startMonth && nowInputMonth < r.startMonth) return;
    if (r.endMonth && nowInputMonth > r.endMonth) return;
    const day = safeNumber(r.day, 1);
    if (day < 1 || day > 31) return;
    const targetDate = new Date(nowYear, now.getMonth(), day);
    if (targetDate > now) return;
    const matKey = `${r.id}_${nowMonthKey}`;
    if (materialized[matKey]) return;
    const manualExists = existing.some(t => t.sourceRecurringId === r.id && t.month === nowMonth && (t.year || nowYear) === nowYear);
    if (manualExists) { materialized[matKey] = true; return; }
    let receivableLinkedId = null;
    if (r.linkedLoanSystemId) {
      const linkedLoan = (data.loans || []).find(l => l.systemId === r.linkedLoanSystemId);
      if (linkedLoan) { const collected = safeNumber(linkedLoan.prePaidAmount) + (loanPaidMap[linkedLoan.id] || 0); if (collected >= safeNumber(linkedLoan.totalAmount) - 0.005) return; receivableLinkedId = linkedLoan.id; }
    }
    let method = 'cash';
    let linkedCardId = r.linkedCardId;
    if (r.method) { method = r.method; }
    else if (linkedCardId) { const card = (data.cards || []).find(c => c.id === linkedCardId); if (card) method = getCardMethod(card); }
    const isFee = BANK_FEE_CATEGORIES.has(r.category);
    const kind = r.kind || (isFee ? KIND.FINANCIAL : KIND.OPERATIONAL);
    newTxs.push({
      id: `rec-${r.id}-${nowMonthKey}-${getSafeId()}`,
      type: r.type, subType: r.type === 'income' ? 'deposit' : 'withdrawal', kind,
      category: r.category, amount: safeNumber(r.amount), description: r.title || 'بند متكرر',
      method, date: getLocalISODate(targetDate), month: nowMonth, year: nowYear, monthIndex: now.getMonth(),
      status: 'pending', sourceRecurringId: r.id, linkedCardId: linkedCardId || undefined,
      sourceReceivableId: receivableLinkedId || undefined,
      transferChannel: r.transferChannel || undefined,
      receipts: [], createdAt: new Date().toISOString()
    });
    materialized[matKey] = true;
  });
  if (newTxs.length === 0) return null;
  return { ...data, transactions: [...newTxs, ...existing].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)), materializedRecurring: materialized };
};

// ── Derive monthly plan from history ──
const deriveMonthlyPlanFromHistory = (data, targetYear, targetMonth, monthsBack = 3) => {
  const transactions = data?.transactions || [];
  const targetIdx = getMonthIndex(targetMonth);
  if (targetIdx < 0) return null;
  const refMonths = [];
  let y = targetYear, mi = targetIdx;
  for (let i = 1; i <= monthsBack; i++) {
    mi--; if (mi < 0) { mi = 11; y--; }
    // ✅ لا نرجع قبل أغسطس 2026
    if (y < PROJECT_START_YEAR || (y === PROJECT_START_YEAR && mi < getMonthIndex(PROJECT_START_MONTH))) break;
    refMonths.push({ year: y, month: ALL_MONTHS[mi] });
  }
  if (refMonths.length === 0) return null;
  const isCounted = (t) => t.status === 'paid' || t.status === 'pending';
  // ✅ دالة سنة آمنة
  const txYear = (t) => t.year != null ? t.year : (parseISODate(t.date)?.getFullYear() ?? 2026);
  const avgIncomeCat = (cat) => { let total = 0, count = 0; refMonths.forEach(({ year, month }) => { const sum = transactions.filter(t => isCounted(t) && t.type === 'income' && t.month === month && txYear(t) === year && t.category === cat).reduce((s, t) => s + safeNumber(t.amount), 0); if (sum > 0) { total += sum; count++; } }); return count > 0 ? total / count : 0; };
  const avgCashExpenses = () => { let total = 0, count = 0; refMonths.forEach(({ year, month }) => { const sum = transactions.filter(t => isCounted(t) && t.type === 'expense' && t.method === 'cash' && t.month === month && txYear(t) === year).reduce((s, t) => s + safeNumber(t.amount), 0); if (sum > 0) { total += sum; count++; } }); return count > 0 ? total / count : 0; };
  const KNOWN_INCOME = new Set(['راتب شهري', 'إيجار المحل', 'استرداد كاش باك', 'Cash Back', 'عهدة إيماك WE', 'عهدة شركة إيماك', 'الزكاة والتبرعات', 'راتب AAIB', 'تكييف محمود']);
  const avgFreeIncome = () => { let total = 0, count = 0; refMonths.forEach(({ year, month }) => { const sum = transactions.filter(t => isCounted(t) && t.type === 'income' && t.month === month && txYear(t) === year && !KNOWN_INCOME.has(t.category)).reduce((s, t) => s + safeNumber(t.amount), 0); if (sum > 0) { total += sum; count++; } }); return count > 0 ? total / count : 0; };
  const sumActiveInstallments = () => { const loans = data?.loans || []; return loans.filter(l => !l.isReceivable && !l.autoMonthly && safeNumber(l.monthlyInstallment) > 0).reduce((s, l) => s + safeNumber(l.monthlyInstallment), 0); };
  return {
    expectedSalary: Math.round(avgIncomeCat('راتب شهري')), expectedRent: Math.round(avgIncomeCat('إيجار المحل')),
    expectedCashback: Math.round(avgIncomeCat('استرداد كاش باك') || avgIncomeCat('Cash Back')),
    expectedEmakWE: Math.round(avgIncomeCat('عهدة إيماك WE') || avgIncomeCat('عهدة شركة إيماك')),
    expectedZakat: Math.round(avgIncomeCat('الزكاة والتبرعات')), expectedCash: Math.round(avgFreeIncome()),
    expectedCashExpenses: Math.round(avgCashExpenses()), plannedPayments: Math.round(sumActiveInstallments()),
    _meta: { refMonths: refMonths.map(m => `${m.month} ${m.year}`).join(' • ') }
  };
};

const PromiseModalProvider = ({ children }) => {
  const [stack, setStack] = useState([]);
  const [inputValues, setInputValues] = useState({});
  useEffect(() => {
    const handleInput = (e) => setStack(s => [...s, { kind: 'input', ...e.detail }]);
    const handleConfirm = (e) => setStack(s => [...s, { kind: 'confirm', ...e.detail }]);
    window.addEventListener('show-input-modal', handleInput);
    window.addEventListener('show-confirm-modal', handleConfirm);
    return () => { window.removeEventListener('show-input-modal', handleInput); window.removeEventListener('show-confirm-modal', handleConfirm); };
  }, []);
  const current = stack[stack.length - 1];
  const dismiss = useCallback((value) => {
    if (!current) return;
    const id = current._id;
    setStack(s => s.slice(0, -1));
    resolveModal(id, value);
    setInputValues(prev => { if (!(id in prev)) return prev; const next = { ...prev }; delete next[id]; return next; });
  }, [current]);
  const inputValue = current?._id !== undefined ? (inputValues[current._id] ?? current.inputValue ?? '') : '';
  const setInputValue = useCallback((v) => { if (current?._id === undefined) return; setInputValues(prev => ({ ...prev, [current._id]: v })); }, [current?._id]);
  return (
    <React.Fragment>
      {children}
      {current?.kind === 'input' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-md">
            <div className="generic-modal-header">
              <h3 className="text-base font-black flex items-center gap-2"><span>{current.icon || '💬'}</span>{current.title}</h3>
              <button onClick={() => dismiss(null)} className="btn btn-ghost p-1.5"><X size={16} /></button>
            </div>
            <div className="generic-modal-body">
              {current.message && <p className="text-sm mb-3 whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>}
              <input autoFocus type="text" inputMode={current.numeric ? 'decimal' : 'text'} className="input-field text-2xl font-black text-center text-blue-600 py-4" value={inputValue} onChange={e => setInputValue(current.numeric ? e.target.value.replace(/[^\d.\-]/g, '') : e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim(); dismiss(v); } }} placeholder={current.placeholder || ''} />
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => dismiss(null)} className="btn btn-secondary flex-1">إلغاء</button>
              <button onClick={() => { const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim(); dismiss(v); }} className="btn btn-primary flex-1">{current.confirmText || 'تأكيد'}</button>
            </div>
          </div>
        </div>
      )}
      {current?.kind === 'confirm' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-sm">
            <div className="generic-modal-body text-center">
              <div className={`w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl ${current.danger ? 'bg-red-50 dark:bg-red-950/40' : 'bg-blue-50 dark:bg-blue-950/40'}`}>{current.icon || (current.danger ? '⚠️' : '❓')}</div>
              <h3 className="text-base font-black mb-2">{current.title}</h3>
              <p className="text-sm leading-relaxed mb-2 whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => dismiss(false)} className="btn btn-secondary flex-1">إلغاء</button>
              <button onClick={() => dismiss(true)} className="btn flex-1" style={{ background: current.danger ? 'var(--danger)' : 'var(--brand)', color: 'white' }}>{current.confirmText || 'تأكيد'}</button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
};

const groupTransactionsByDate = (list) => {
  const groups = {};
  list.forEach(t => { const d = t.date || 'unknown'; if (!groups[d]) groups[d] = []; groups[d].push(t); });
  const today = getLocalISODate();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const yestISO = getLocalISODate(yest);
  return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
    let label;
    if (date === today) label = '📅 النهاردة';
    else if (date === yestISO) label = '📅 امبارح';
    else {
      const dObj = parseISODate(date);
      if (dObj) { const ds = dObj.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' }); const ys = dObj.getFullYear() !== new Date().getFullYear() ? ' ' + dObj.getFullYear() : ''; label = '📅 ' + ds + ys; }
      else label = '📅 ' + date;
    }
    const total = groups[date].reduce((s, t) => s + safeNumber(t.amount), 0);
    return { date, label, items: groups[date], total };
  });
};

// ── PinLockScreen ──
const PinLockScreen = ({ onSuccess, onLogout }) => {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const [success, setSuccess] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const [lastPressed, setLastPressed] = useState(null);
  const pressTimerRef = useRef(null);
  const clearTimerRef = useRef(null);
  const navTimerRef = useRef(null);

  useEffect(() => {
    return () => {
      if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
      if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
      if (navTimerRef.current) clearTimeout(navTimerRef.current);
    };
  }, []);

  const handleDigit = (d) => {
    if (pin.length >= 4 || success) return;
    const next = pin + d;
    setPin(next); setLastPressed(d);
    if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    pressTimerRef.current = setTimeout(() => setLastPressed(null), 150);
    if (next.length === 4) {
      if (navTimerRef.current) clearTimeout(navTimerRef.current);
      navTimerRef.current = setTimeout(async () => {
        const ok = await verifyPin(next);
        if (ok) { setSuccess(true); if (navTimerRef.current) clearTimeout(navTimerRef.current); navTimerRef.current = setTimeout(() => onSuccess(), 500); }
        else {
          setError(true); setAttempts(a => a + 1);
          if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
          clearTimerRef.current = setTimeout(() => { setPin(''); setError(false); }, 650);
        }
      }, 150);
    }
  };
  const handleDelete = () => { if (!success) setPin(p => p.slice(0, -1)); };
  return (
    <div className="min-h-screen flex items-center justify-center p-6 relative overflow-hidden" style={{ background: 'radial-gradient(ellipse at top, #2A2418 0%, #1A1508 55%, #0F0B04 100%)' }}>
      <div className={`relative w-full max-w-sm ${error ? 'animate-shake' : ''}`}>
        <div className="flex flex-col items-center mb-8">
          <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mb-4 transition-all duration-500 ${success ? 'bg-emerald-500 scale-110 shadow-2xl shadow-emerald-500/40' : error ? 'bg-red-500/20 border border-red-500/30' : 'bg-blue-500/10 border border-blue-500/20'}`}>
            {success ? <CheckCircle2 size={28} className="text-white" /> : error ? <AlertTriangle size={26} className="text-red-400" /> : <Lock size={26} className="text-blue-400" />}
          </div>
          <h1 className="text-xl font-black text-white mb-1">{success ? 'مرحباً ✓' : error ? 'رمز غير صحيح' : 'أهلاً بعودتك'}</h1>
          <p className="text-xs font-medium" style={{ color: '#8A8270' }}>{success ? 'جارٍ الفتح...' : error ? `محاولة ${attempts}` : 'أدخل الرمز'}</p>
        </div>
        <div className="flex justify-center gap-3 mb-8 h-4">
          {[0, 1, 2, 3].map(i => (<div key={i} className={`w-3 h-3 rounded-full transition-all duration-300 ${success ? 'bg-emerald-400 scale-125' : error ? 'bg-red-500 scale-110' : pin.length > i ? 'bg-blue-400 scale-125' : 'bg-transparent border-2 border-slate-600'}`}></div>))}
        </div>
        <div className="grid grid-cols-3 gap-3 mb-6">
          {['1','2','3','4','5','6','7','8','9'].map(d => (<button key={d} type="button" onClick={() => handleDigit(d)} className={`aspect-square rounded-2xl font-black text-xl transition-all duration-100 active:scale-90 select-none ${lastPressed === d ? 'bg-blue-500 text-white scale-95' : 'bg-white/[0.04] border border-white/[0.08] text-white hover:bg-white/[0.09]'}`}>{d}</button>))}
          <div className="aspect-square"></div>
          <button type="button" onClick={() => handleDigit('0')} className={`aspect-square rounded-2xl font-black text-xl transition-all duration-100 active:scale-90 select-none ${lastPressed === '0' ? 'bg-blue-500 text-white scale-95' : 'bg-white/[0.04] border border-white/[0.08] text-white hover:bg-white/[0.09]'}`}>0</button>
          <button type="button" onClick={handleDelete} className="aspect-square rounded-2xl flex items-center justify-center transition-all active:scale-90" style={{ color: '#8A8270' }}><Delete size={20} /></button>
        </div>
        <button type="button" onClick={onLogout} className="w-full py-3 text-xs font-bold flex items-center justify-center gap-2 transition-colors" style={{ color: '#8A8270' }}><LogOut size={14} /> تسجيل الخروج</button>
      </div>
    </div>
  );
};

  const [current, setCurrent] = useState('');

// ── SmsParserModal ──
const SmsParserModal = memo(({ isOpen, onClose, dispatch, addNotification, saveHistory, data }) => {
  const [rawText, setRawText] = useState('');
  const [parsed, setParsed] = useState(null);
  const [category, setCategory] = useState('');
  const [method, setMethod] = useState('cash');
  const [manualAmount, setManualAmount] = useState('');

  useEffect(() => { if (!isOpen) { setRawText(''); setParsed(null); setCategory(''); setMethod('cash'); setManualAmount(''); } }, [isOpen]);

  const handlePaste = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.readText) {
        const txt = await navigator.clipboard.readText();
        if (txt && txt.trim()) { setRawText(txt); addNotification({ type: 'success', title: 'تم اللصق', duration: 2000 }); return; }
      }
      addNotification({ type: 'info', title: 'الصق الرسالة يدوياً في الصندوق' });
    } catch (e) { addNotification({ type: 'info', title: 'الصق الرسالة يدوياً في الصندوق' }); }
  };

  const handleAnalyze = () => {
    if (!rawText.trim()) { addNotification({ type: 'error', title: 'الصق رسالة البنك أولاً' }); return; }
    const res = parseBankSms(rawText);
    setParsed(res);
    if (res.method) setMethod(res.method);
    if (res.amount > 0) setManualAmount(String(res.amount));
    if (res.ok) {
      const cardInfo = res.cardLabel ? ` • ${res.cardLabel}` : '';
      addNotification({ type: 'success', title: `تم التحليل: ${fmt(res.amount)} ج.م`, message: `${res.type === 'income' ? 'دخل' : 'مصروف'} • ${res.bank || 'بنك'}${cardInfo}`, duration: 5000 });
    } else { addNotification({ type: 'warning', title: 'تحليل جزئي', message: res.notes.join(' • ') }); }
  };

  const handleSave = () => {
    const amt = parseNumberInput(manualAmount);
    if (!amt || amt <= 0) { addNotification({ type: 'error', title: 'أدخل مبلغ صالح' }); return; }
    if (!category) { addNotification({ type: 'error', title: 'اختر الفئة' }); return; }
    const d = parseISODate(parsed.date) || new Date();
    const year = d.getFullYear();
    const month = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, year, month)) { addNotification({ type: 'error', title: `شهر ${month} ${year} مغلق`, message: 'افتح الشهر أو غيّر التاريخ' }); return; }
    saveHistory();
    const newTx = {
      id: getSafeId(), type: parsed.type, subType: parsed.subType, kind: KIND.OPERATIONAL,
      category, amount: amt, description: parsed.description || 'SMS import',
      method, date: parsed.date, month, year, monthIndex: d.getMonth(),
      status: 'pending', source: 'sms', smsRawText: parsed.rawText, smsBank: parsed.bank,
      linkedCardId: parsed.linkedCardId || undefined,
      cardLast4: parsed.last4 || undefined,
      accountKind: parsed.accountKind || undefined,
      receipts: []
    };
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [newTx, ...(data.transactions || [])].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) });
    addNotification({ type: 'success', title: 'تم الحفظ كمعلق', message: 'راجعها واعتمدها من صفحة المعاملات', duration: 5000 });
    onClose();
  };

  if (!isOpen) return null;

  return (
    <Modal isOpen={true} onClose={onClose} title="تحليل رسالة بنك" icon="📱" size="lg">
      <div className="space-y-3">
        <div>
          <div className="flex justify-between items-center mb-1.5">

const DRIVE_CLIENT_ID = '190006477168-odmpreq26b618rdn1dsg4k1aag3k056g.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive';
const DRIVE_FOLDER_NAME = 'Finance Backups';
const DRIVE_DEFAULT_FOLDER_ID = '1rAupM2llGpThcodBrmL4DZIhDSJ-dGXW';
const DRIVE_FOLDER_ID_LS_KEY = 'v78_drive_folder_id';
const AUTO_BACKUP_LS_KEY = 'v78_last_drive_backup_ts';
let _driveTokenClient = null;
let _driveAccessToken = null;
let _driveTokenExpiry = 0;

const waitForGIS = (timeoutMs = 10000) => new Promise((resolve, reject) => {
  if (window.google?.accounts?.oauth2) return resolve();
  const start = Date.now();
  const timer = setInterval(() => {
    if (window.google?.accounts?.oauth2) { clearInterval(timer); resolve(); }
    else if (Date.now() - start > timeoutMs) { clearInterval(timer); reject(new Error('GIS غير محمّل')); }
  }, 150);
});

const initDriveTokenClient = async () => {
  if (_driveTokenClient) return _driveTokenClient;
  await waitForGIS();
  _driveTokenClient = window.google.accounts.oauth2.initTokenClient({ client_id: DRIVE_CLIENT_ID, scope: DRIVE_SCOPE, callback: () => {} });
  return _driveTokenClient;
};

const requestDriveToken = async () => {
  const client = await initDriveTokenClient();
  return new Promise((resolve, reject) => {
    client.callback = (resp) => {
      if (resp.error) return reject(new Error(resp.error));
      _driveAccessToken = resp.access_token;
      _driveTokenExpiry = Date.now() + (safeNumber(resp.expires_in, 3600) * 1000) - 60000;
      resolve(_driveAccessToken);
    };
    client.requestAccessToken({ prompt: _driveAccessToken ? '' : 'consent' });
  });
};

const ensureDriveToken = async () => {
  if (_driveAccessToken && Date.now() < _driveTokenExpiry) return _driveAccessToken;
  return requestDriveToken();
};

const getOrCreateBackupFolder = async () => {
  const token = await ensureDriveToken();
  const customFolderId = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;
  if (customFolderId) {
    try {
      const checkRes = await fetch(`https://www.googleapis.com/drive/v3/files/${customFolderId}?fields=id,name,mimeType,trashed`, { headers: { Authorization: `Bearer ${token}` } });
      if (checkRes.ok) { const info = await checkRes.json(); if (!info.trashed) return customFolderId; }
    } catch (e) {}
  }
  const q = encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive&pageSize=20`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('فشل قراءة المجلدات');
  const data = await res.json();
  if (data.files && data.files.length > 0) { const folderId = data.files[0].id; localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, folderId); return folderId; }
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }) });
  if (!createRes.ok) throw new Error('فشل إنشاء المجلد');
  const created = await createRes.json();
  localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, created.id);
  return created.id;
};

const uploadBackupToDrive = async (payload, fileName) => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const name = fileName || `finance_backup_${getLocalISODate()}_${Date.now()}.json`;
  const metadata = { name, parents: [folderId], mimeType: 'application/json' };
  const boundary = '----V80DriveBoundary' + Date.now();
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,createdTime', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` }, body });
  if (!res.ok) throw new Error('فشل الرفع');
  return await res.json();
};

const listDriveBackups = async () => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false and mimeType='application/json'`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,size,createdTime)&orderBy=createdTime desc&pageSize=50`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('فشل الجلب');
  const data = await res.json();
  return data.files || [];
};

const downloadBackupFromDrive = async (fileId) => {
  const token = await ensureDriveToken();
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('فشل التنزيل');
  return await res.json();
};

  const totalLoanDebt = useMemo(() => updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const grandTotalDebt = totalCardDebt + totalLoanDebt;
  const netPosition = totalLiquidity - grandTotalDebt;
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);
  const bankFeesMonth = useMemo(() => transactions.filter(t => t.status === 'paid' && t.type === 'expense' && BANK_FEE_CATEGORIES.has(t.category) && t.month === selectedMonth && (t.year || 2026) === selectedYear).reduce((s, t) => s + safeNumber(t.amount), 0), [transactions, selectedMonth, selectedYear]);
  const monthCashback = useMemo(() => {
    const trackers = (data?.cashbackTrackers || []).filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
    const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
    const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
    return { expected, received, pending: expected - received };
  }, [data?.cashbackTrackers, selectedMonth, selectedYear]);
  const pieData = useMemo(() => {

    transactions.filter(t => t.type === 'expense' && t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status === 'paid' && safeNumber(t.amount) > 0).forEach(t => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); });
    const sorted = Object.entries(acc).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
    if (sorted.length <= 5) return sorted;
    const top = sorted.slice(0, 4);
    const restVal = sorted.slice(4).reduce((s, i) => s + i.value, 0);
    return [...top, { name: 'أخرى', value: restVal }];
  }, [transactions, selectedMonth, selectedYear]);
  const net = financeSnapshot;
  const monthPendingCount = transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status !== 'paid').length;
  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex items-center justify-between gap-4 flex-wrap">
          <div>
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>صافي المركز</p>
            <h2 className={`text-3xl font-black tracking-tight ${netPosition >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{netPosition >= 0 ? '+' : ''}{fmt(netPosition)}<span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span></h2>
            <p className={`text-[11px] font-bold mt-1.5 ${netPosition >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{netPosition >= 0 ? '✅ وضع آمن' : '⚠️ مراجعة'}</p>
          </div>
          <div className="flex gap-2">
            <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center min-w-[80px]"><p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">سيولة</p><p className="text-sm font-black text-emerald-600">{fmt(totalLiquidity)}</p></div>
            <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-center min-w-[80px]"><p className="text-[10px] font-bold text-red-700 dark:text-red-400">مديونية</p><p className="text-sm font-black text-red-600">{fmt(grandTotalDebt)}</p></div>
          </div>
        </div>
      </div>
      {monthPendingCount > 0 && (
        <div className="card" style={{ background: 'var(--warning-soft)', borderColor: 'var(--warning)' }}>
          <div className="flex items-center gap-2">
            <Clock size={16} className="text-amber-600 flex-shrink-0" />
            <div className="flex-1">
              <p className="text-xs font-bold text-amber-700 dark:text-amber-400">⚠️ {monthPendingCount} عملية معلقة في {selectedMonth}</p>
              <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>لا تؤثر على الرصيد الحي — اعتمدها أو رحّلها</p>
            </div>
            <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'transactions' })} className="btn btn-secondary text-[10px] py-1.5 px-2.5">عرض</button>
          </div>
        </div>
      )}
      <div className="grid grid-cols-3 gap-2">
        <button onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', amount: '', date: getLocalISODate(), method: 'cash', subType: 'withdrawal', category: '', status: 'pending', receipts: [] } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="card py-3 flex flex-col items-center gap-1 active:scale-95">
          <div className="p-1.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-red-600 dark:text-red-400"><TrendingDown size={16} /></div>
          <span className="text-[11px] font-bold">مصروف</span>
        </button>
        <button onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'income', amount: '', date: getLocalISODate(), method: 'cash', subType: 'deposit', category: '', status: 'pending', receipts: [] } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="card py-3 flex flex-col items-center gap-1 active:scale-95">
          <div className="p-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400"><TrendingUp size={16} /></div>
          <span className="text-[11px] font-bold">دخل</span>
        </button>
        <button onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: true })} className="card py-3 flex flex-col items-center gap-1 active:scale-95">
          <div className="p-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400"><Layers size={16} /></div>
          <span className="text-[11px] font-bold">تحويل / شهري</span>
        </button>
      </div>
      <div className="grid grid-cols-3 gap-2">
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'loans' })} className="card py-2.5 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1"><Briefcase size={11} className="text-blue-500" /><span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>عهدة</span></div>
          <p className={`text-sm font-black ${custodySummary.balance > 0 ? 'text-blue-600' : custodySummary.balance < 0 ? 'text-red-600' : 'text-emerald-600'}`}>{fmt(custodySummary.balance)}</p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'cards' })} className="card py-2.5 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1"><Gift size={11} className="text-emerald-500" /><span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>كاش باك</span></div>
          <p className="text-sm font-black text-emerald-600">{fmt(monthCashback.received)}</p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'transactions' })} className="card py-2.5 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1"><Receipt size={11} className="text-red-500" /><span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>رسوم بنكية</span></div>
          <p className="text-sm font-black text-red-600">{fmt(bankFeesMonth)}</p>
        </button>
      </div>
      <QuickBalanceOverview balances={liveBalances} walletVisibility={walletVisibility} onToggleVisibility={onToggleVisibility} />
      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <EnhancedStatCard title="الكاش في اليد" amount={net.actualCashInHand} icon={Wallet} subtitle="حتى نهاية اليوم" isPrivate={!walletVisibility.cash} color="emerald" />
        <EnhancedStatCard title="دخل محصل" amount={net.actualIncome} icon={TrendingUp} subtitle={net.pendingIncome > 0 ? `+${fmt(net.pendingIncome)} معلق` : ''} color="emerald" />
        <EnhancedStatCard title="مصاريف معلقة" amount={-net.pendingCash} icon={Clock} subtitle={`مدفوع: ${fmt(net.paidCash)}`} color="red" />
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'forecast' })} className="stat-card text-right active:scale-95">
          <div className="flex justify-between items-start mb-2">
            <div><p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>توقع القادم</p><h3 className={`text-lg font-black ${net.projectedClosingBalance >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(net.projectedClosingBalance)}</h3></div>
            <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400"><LineChart size={16} /></div>
          </div>
        </button>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
        <div className="card">
          <h3 className="font-bold text-xs mb-3 flex items-center gap-2"><BarChart3 className="text-blue-500" size={14} /> التدفق النقدي — {selectedYear}</h3>
          <div className="h-48">
            {chartData.every(d => d.دخل === 0 && d.مصروف === 0) ? (
              <div className="h-full flex items-center justify-center font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد بيانات</div>
            ) : (
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={chartData}>
                  <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.08} />
                  <XAxis dataKey="name" fontSize={9} stroke="#94A3B8" />
                  <YAxis fontSize={9} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
                  <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '10px', border: 'none', backgroundColor: isDarkMode ? '#262014' : 'white', fontFamily: 'Cairo', fontSize: '12px' }} />
                  <Bar dataKey="دخل" fill="#059669" radius={[4, 4, 0, 0]} barSize={10} />
                  <Bar dataKey="مصروف" fill="#DC2626" radius={[4, 4, 0, 0]} barSize={10} />
                </BarChart>
              </ResponsiveContainer>
            )}
          </div>
        </div>
        <div className="card">
          <h3 className="font-bold text-xs mb-3 flex items-center gap-2"><PieChartIcon className="text-purple-500" size={14} /> توزيع مصروفات {selectedMonth}</h3>
          <div className="h-48">
            {pieData.length === 0 ? (
              <div className="h-full flex items-center justify-center font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد مصروفات</div>
            ) : (
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={pieData} cx="50%" cy="50%" innerRadius={50} outerRadius={80} paddingAngle={3} dataKey="value" cornerRadius={4}>
                    {pieData.map((e, i) => <Cell key={i} fill={CATEGORY_COLORS[e.name] || '#94A3B8'} stroke="none" />)}
                  </Pie>
                  <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '10px', border: 'none', backgroundColor: isDarkMode ? '#262014' : 'white', fontFamily: 'Cairo', fontSize: '12px' }} />
                  <Legend layout="vertical" verticalAlign="middle" align="right" iconType="circle" wrapperStyle={{ fontSize: '10px', fontWeight: 'bold' }} />
                </PieChart>
              </ResponsiveContainer>
            )}
          </div>
        </div>
      </div>
    </div>
  );
});

// ── CategoryDetailModal ──
const CategoryDetailModal = memo(({ category, transactions, selectedMonth, selectedYear, dispatch, addNotification }) => {
  const [filterType, setFilterType] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');
  const [exporting, setExporting] = useState(false);
  const containerRef = useRef(null);
  const categoryTx = useMemo(() => transactions.filter(t => t.category === category && t.month === selectedMonth && (t.year || 2026) === selectedYear).sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)), [transactions, category, selectedMonth, selectedYear]);
  const filteredTx = useMemo(() => {
    let arr = categoryTx;
    if (filterType === 'paid') arr = arr.filter(t => t.status === 'paid');
    if (filterType === 'pending') arr = arr.filter(t => t.status !== 'paid');
    if (searchTerm.trim()) { const term = normalizeText(searchTerm); arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.method).includes(term)); }
    return arr;
  }, [categoryTx, filterType, searchTerm]);
  const stats = useMemo(() => {
    const paid = categoryTx.filter(t => t.status === 'paid');
    const pending = categoryTx.filter(t => t.status !== 'paid');
    const totalPaid = paid.reduce((s, t) => s + safeNumber(t.amount), 0);
    const totalPending = pending.reduce((s, t) => s + safeNumber(t.amount), 0);
    const count = categoryTx.length;
    const average = count > 0 ? (totalPaid + totalPending) / count : 0;
    const methods = {};
    categoryTx.forEach(t => { methods[t.method] = (methods[t.method] || 0) + safeNumber(t.amount); });
    return { totalPaid, totalPending, total: totalPaid + totalPending, count, paidCount: paid.length, pendingCount: pending.length, average, methods };
  }, [categoryTx]);
  const dailyGroups = useMemo(() => groupTransactionsByDate(filteredTx), [filteredTx]);

  const handlePrint = () => {
    if (!containerRef.current) return;
    const printWindow = window.open('', '_blank', 'width=900,height=700');
    if (!printWindow) { addNotification({ type: 'error', title: 'المتصفح منع الطباعة', message: 'اسمح بالنوافذ المنبثقة' }); return; }
    const html = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>${category} — ${selectedMonth} ${selectedYear}</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><style>* { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: 'Cairo', sans-serif; padding: 24px; color: #1f2937; background: white; } .header { text-align: center; padding-bottom: 16px; border-bottom: 3px solid #2563EB; margin-bottom: 20px; } .header h1 { font-size: 22px; font-weight: 900; color: #1E40AF; margin-bottom: 4px; } .header p { font-size: 13px; color: #6b7280; font-weight: 600; } .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; } .stat-box { background: #f3f4f6; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #e5e7eb; } .stat-box .label { font-size: 11px; font-weight: 700; color: #6b7280; margin-bottom: 4px; } .stat-box .value { font-size: 16px; font-weight: 900; color: #1f2937; } .stat-box.green .value { color: #059669; } .stat-box.amber .value { color: #d97706; } table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; } th { background: #2563EB; color: white; padding: 10px 8px; text-align: right; font-weight: 700; } td { padding: 8px; border-bottom: 1px solid #e5e7eb; } tr:nth-child(even) td { background: #f9fafb; } td.amount-income { color: #059669; font-weight: 900; } td.amount-expense { color: #dc2626; font-weight: 900; } td.status-paid { color: #059669; font-weight: 700; font-size: 10px; } td.status-pending { color: #d97706; font-weight: 700; font-size: 10px; } .footer { margin-top: 30px; padding-top: 12px; border-top: 2px dashed #d1d5db; text-align: center; font-size: 10px; color: #9ca3af; } .day-header-row td { background: #dbeafe !important; font-weight: 900; color: #1E40AF; font-size: 11px; padding: 6px 8px; }</style></head><body><div class="header"><h1>📊 ${escapeHtml(category)}</h1><p>${selectedMonth} ${selectedYear} • تم التوليد: ${new Date().toLocaleString('ar-EG')}</p></div><div class="stats"><div class="stat-box green"><div class="label">الإجمالي (معتمد)</div><div class="value">${fmt(stats.totalPaid)} ج.م</div></div><div class="stat-box amber"><div class="label">معلق</div><div class="value">${fmt(stats.totalPending)} ج.م</div></div><div class="stat-box"><div class="label">عدد المعاملات</div><div class="value">${stats.count}</div></div><div class="stat-box"><div class="label">المتوسط</div><div class="value">${fmt(stats.average)} ج.م</div></div></div><table><thead><tr><th>التاريخ</th><th>الوصف</th><th>طريقة الدفع</th><th>الحالة</th><th style="text-align: left;">المبلغ</th></tr></thead><tbody>${dailyGroups.map(group => `<tr class="day-header-row"><td colspan="5">${escapeHtml(group.label)} — ${fmt(group.total)} ج.م (${group.items.length})</td></tr>${group.items.map(t => `<tr><td>${escapeHtml(t.date)}</td><td>${escapeHtml(t.description || t.category || '')}</td><td>${escapeHtml(PAYMENT_METHODS.find(p => p.id === t.method)?.label || t.method || '—')}</td><td class="${t.status === 'paid' ? 'status-paid' : 'status-pending'}">${t.status === 'paid' ? '✅ معتمد' : '⏳ معلق'}</td><td class="amount-${t.type === 'income' ? 'income' : 'expense'}" style="text-align: left;">${t.type === 'income' ? '+' : '−'}${fmt(t.amount)}</td></tr>`).join('')}`).join('')}</tbody></table><div class="footer">💼 المحفظة الذكية — تقرير تفصيلي لفئة ${escapeHtml(category)} • إجمالي: ${fmt(stats.total)} ج.م</div><script>window.onload = () => { setTimeout(() => { window.print(); }, 300); };<\/script></body></html>`;
    printWindow.document.write(html);
    printWindow.document.close();
  };

  const handleExportPdf = async () => {
    if (!containerRef.current || exporting) return;
    if (categoryTx.length === 0) { addNotification({ type: 'warning', title: 'لا توجد معاملات للتصدير' }); return; }
    setExporting(true);
    try {
      const element = containerRef.current.cloneNode(true);
      element.querySelectorAll('[data-pdf-hide="true"]').forEach(el => el.remove());
      element.querySelectorAll('.scroll-hide, .pdf-expand').forEach(el => { el.style.maxHeight = 'none'; el.style.overflow = 'visible'; });
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'background:white;padding:20px;font-family:Cairo,sans-serif;direction:rtl;';
      wrapper.innerHTML = `<div style="text-align:center;padding-bottom:12px;border-bottom:3px solid #2563EB;margin-bottom:16px;"><h1 style="font-size:20px;font-weight:900;color:#1E40AF;margin:0 0 4px;">📊 ${escapeHtml(category)}</h1><p style="font-size:12px;color:#6b7280;font-weight:600;margin:0;">${selectedMonth} ${selectedYear} • ${new Date().toLocaleDateString('ar-EG')}</p></div>`;
      wrapper.appendChild(element);
      const opt = { margin: [10, 8, 10, 8], filename: `فئة_${category.replace(/[\/\\:*?"<>|]/g, '_')}_${selectedMonth}_${selectedYear}.pdf`, image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } };
      await window.html2pdf().set(opt).from(wrapper).save();
      addNotification({ type: 'success', title: 'تم تصدير PDF', message: `${filteredTx.length} معاملة` });
    } catch (e) { console.error('PDF Error:', e); addNotification({ type: 'error', title: 'فشل التصدير', message: e.message }); }
    finally { setExporting(false); }
  };

  const close = () => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: null });

  return (
    <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) close(); }}>
      <div className="generic-modal max-w-3xl">
        <div className="generic-modal-header">
          <div className="flex items-center gap-2 min-w-0">
            <div className="p-2 rounded-lg flex-shrink-0" style={{ background: `${CATEGORY_COLORS[category] || '#2563EB'}20`, color: CATEGORY_COLORS[category] || '#2563EB' }}><Layers size={18} /></div>
            <div className="min-w-0">
              <h3 className="text-base font-black truncate">{category}</h3>
              <p className="text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} • {stats.count} معاملة</p>
            </div>
          </div>
          <button onClick={close} className="btn btn-ghost p-1.5"><X size={16} /></button>
        </div>
        <div className="generic-modal-body" ref={containerRef}>
          <div className="grid grid-cols-4 gap-2 mb-4">
            <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center"><p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">معتمد</p><p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(stats.totalPaid)}</p></div>
            <div className="p-2.5 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-center"><p className="text-[10px] font-bold text-amber-700 dark:text-amber-400">معلق</p><p className="text-sm font-black text-amber-600 mt-0.5">{fmt(stats.totalPending)}</p></div>
            <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center"><p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">العدد</p><p className="text-sm font-black text-blue-600 mt-0.5">{stats.count}</p></div>
            <div className="p-2.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-center"><p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">المتوسط</p><p className="text-sm font-black text-purple-600 mt-0.5">{fmt(stats.average)}</p></div>
          </div>
          <div className="flex gap-1.5 flex-wrap mb-3" data-pdf-hide="true">
            <div className="relative flex-1 min-w-[140px]">
              <Search className="absolute right-2.5 top-1/2 -translate-y-1/2" size={12} style={{ color: 'var(--text-muted)' }} />
              <input type="text" placeholder="ابحث..." className="input-field pr-8 text-[11px] py-2" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
            </div>
            <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <button type="button" onClick={() => setFilterType('all')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'all' ? 'shadow-sm' : ''}`} style={filterType === 'all' ? { background: 'var(--bg-card)', color: 'var(--brand)' } : { color: 'var(--text-muted)' }}>الكل ({categoryTx.length})</button>
              <button type="button" onClick={() => setFilterType('paid')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'paid' ? 'shadow-sm' : ''}`} style={filterType === 'paid' ? { background: 'var(--bg-card)', color: 'var(--success)' } : { color: 'var(--text-muted)' }}>معتمد ({stats.paidCount})</button>
              <button type="button" onClick={() => setFilterType('pending')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'pending' ? 'shadow-sm' : ''}`} style={filterType === 'pending' ? { background: 'var(--bg-card)', color: 'var(--warning)' } : { color: 'var(--text-muted)' }}>معلق ({stats.pendingCount})</button>
            </div>
            <button type="button" onClick={handlePrint} disabled={filteredTx.length === 0} className="btn btn-secondary text-[10px] py-2 px-2.5"><Printer size={11} /><span className="hidden sm:inline">طباعة</span></button>
            <button type="button" onClick={handleExportPdf} disabled={exporting || filteredTx.length === 0} className="btn btn-primary text-[10px] py-2 px-2.5">{exporting ? <RefreshCcw size={11} className="animate-spin" /> : <Download size={11} />}<span className="hidden sm:inline">PDF</span></button>
          </div>
          {Object.keys(stats.methods).length > 0 && (
            <div className="p-2.5 rounded-lg mb-3" style={{ background: 'var(--bg-muted)' }}>
              <p className="text-[10px] font-bold mb-1.5" style={{ color: 'var(--text-secondary)' }}>💳 التوزيع:</p>
              <div className="flex flex-wrap gap-1.5">
                {Object.entries(stats.methods).sort((a, b) => b[1] - a[1]).map(([method, total]) => (
                  <span key={method} className="badge badge-neutral text-[9px]">{PAYMENT_METHODS.find(p => p.id === method)?.label || method}: <strong className="mr-1">{fmt(total)}</strong></span>
                ))}
              </div>
            </div>
          )}
          {filteredTx.length === 0 ? (

const CategoriesView = memo(({ transactions, selectedMonth, selectedYear, catViewType, budgets, dispatch, handleDelete, onSelectYear, onSelectMonth }) => {
  const catTotals = useMemo(() => transactions.filter(t => t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear).reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); return acc; }, {}), [transactions, catViewType, selectedMonth, selectedYear]);
  const catCounts = useMemo(() => transactions.filter(t => t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear).reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + 1; return acc; }, {}), [transactions, catViewType, selectedMonth, selectedYear]);
  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card flex justify-between items-center gap-2 flex-wrap">
        <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
          <button type="button" onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'expense' })} className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'expense' ? 'shadow-sm text-red-600 dark:text-red-400' : ''}`} style={catViewType === 'expense' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}>مصروفات</button>
          <button type="button" onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'income' })} className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'income' ? 'shadow-sm text-emerald-600 dark:text-emerald-400' : ''}`} style={catViewType === 'income' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}>إيرادات</button>
        </div>
        <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>💡 اضغط على الفئة لعرض التفاصيل</p>
      </div>
      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />
      <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
        {CATEGORIES[catViewType].map(cat => {
          const spent = catTotals[cat] || 0;
          const budget = budgets[cat] || 0;
          const overBudget = budget > 0 && spent > budget;
          const count = catCounts[cat] || 0;
          if (spent === 0 && budget === 0) return null;
          return (
            <div key={cat} className="card p-3 cursor-pointer active:scale-[0.98]" onClick={() => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: cat })}>
              <div className="flex justify-between mb-2">
                <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: CATEGORY_COLORS[cat] }}><Layers size={14} /></div>
                <button type="button" aria-label="ميزانية" onClick={(e) => { e.stopPropagation(); dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: cat }); dispatch({ type: 'SET_BUDGET_AMOUNT', payload: budgets[cat] || '' }); }} className="btn btn-ghost p-1"><SettingsIcon size={12} /></button>
              </div>
              <h3 className="font-bold text-[11px] mb-1 truncate">{cat}</h3>
              <p className="text-base font-black tracking-tight">{fmt(spent)}<span className="text-[9px] font-semibold mr-1" style={{ color: 'var(--text-muted)' }}>ج.م</span></p>
              {count > 0 && <p className="text-[9px] font-bold mt-0.5" style={{ color: 'var(--text-muted)' }}>📋 {count} معاملة</p>}
              {catViewType === 'expense' && budget > 0 && (
                <div className="mt-2 pt-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
                  <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                    <div style={{ width: `${Math.min(100, (spent / budget) * 100)}%` }} className={`h-full ${overBudget ? 'bg-red-500' : 'bg-emerald-500'}`}></div>

});

const TransactionsView = memo(({ groupedTransactions, transactions, selectedMonth, selectedYear, transViewMode, statusFilter, searchTerm, expandedGroup, data, monthInsights, dispatch, handleDelete, addNotification, onSelectYear, onSelectMonth, saveHistory, onPrintMonthlyReport }) => {

  const filterBySource = useCallback((list) => { if (sourceFilter === 'all') return list; if (sourceFilter === 'self') return list.filter(t => !isFamilyTx(t)); return list.filter(t => t.createdBy === sourceFilter); }, [sourceFilter]);
  const filterByBankFees = useCallback((list) => showBankFeesOnly ? list.filter(t => isBankFee(t)) : list, [showBankFeesOnly]);
  const filterBySms = useCallback((list) => showSmsOnly ? list.filter(t => t.source === 'sms') : list, [showSmsOnly]);
  const filterByBeneficiaries = useCallback((list) => showBeneficiariesOnly ? list.filter(t => isBeneficiaryCategorySafe(t.category)) : list, [showBeneficiariesOnly]);
  const filterByType = useCallback((list) => transViewMode === 'all' ? list : list.filter(t => t.type === transViewMode), [transViewMode]);
  const pendingGroups = useMemo(() => groupedTransactions.map(g => ({ ...g, items: filterByBeneficiaries(filterBySms(filterByBankFees(filterBySource(g.items.filter(t => t.status !== 'paid'))))) })).filter(g => g.items.length > 0), [groupedTransactions, filterBySource, filterByBankFees, filterBySms, filterByBeneficiaries]);
  const paidArchive = useMemo(() => filterByBeneficiaries(filterBySms(filterByBankFees(filterBySource(filterByType(transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status === 'paid')))))).sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)), [transactions, selectedMonth, selectedYear, filterByType, filterBySource, filterByBankFees, filterBySms, filterByBeneficiaries]);

            <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} • {monthTx.length} معاملة</p>
          </div>
          <div className="flex gap-1.5">
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'all' })} className={`btn ${transViewMode === 'all' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>الكل</button>
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'expense' })} className={`btn ${transViewMode === 'expense' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>مصروفات</button>
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'income' })} className={`btn ${transViewMode === 'income' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>إيرادات</button>
          </div>
        </div>
        <div className="grid grid-cols-3 gap-2">
          <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30"><p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">محصل</p><p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(monthInsights.inc)}</p></div>
          <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30"><p className="text-[10px] font-bold text-red-700 dark:text-red-400">مدفوع</p><p className="text-sm font-black text-red-600 mt-0.5">{fmt(monthInsights.exp)}</p></div>
          <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30"><p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الصافي</p><p className={`text-sm font-black mt-0.5 ${monthInsights.net >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(monthInsights.net)}</p></div>
        </div>
        <div className="flex gap-1.5 mt-3 flex-wrap">

          <button onClick={() => setShowSmsOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showSmsOnly ? 'btn-primary' : 'btn-secondary'}`}><MessageSquare size={12} /> SMS</button>
          <button onClick={() => setShowBeneficiariesOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showBeneficiariesOnly ? 'btn-primary' : 'btn-secondary'}`}>👨‍👩‍👧 مصاريف شهرية</button>
          {isClosed ? (
            <React.Fragment>
              <div className="badge badge-success px-2 py-1 text-[10px]"><ShieldCheck size={10} /> مغلق</div>
              <button onClick={() => dispatch({ type: 'SHOW_CONFIRM', danger: false, title: 'إعادة فتح', message: 'سيتم إلغاء القفل.', onConfirm: () => { saveHistory(); dispatch({ type: 'OPEN_MONTH', payload: makeMonthKey(selectedYear, selectedMonth) }); addNotification({ type: 'success', title: 'تم إعادة الفتح' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) })} className="btn btn-secondary text-[11px] px-2.5 py-1.5"><Unlock size={12} /> فتح</button>
            </React.Fragment>

              else { dispatch({ type: 'SHOW_CONFIRM', danger: false, title: 'إقفال الشهر', message: 'سيتم تثبيت الأرصدة.', onConfirm: () => { saveHistory(); dispatch({ type: 'CLOSE_MONTH', payload: { year: selectedYear, month: selectedMonth } }); addNotification({ type: 'success', title: 'تم الإقفال' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) }); }
            }} className="btn btn-secondary text-[11px] px-2.5 py-1.5"><Lock size={12} /> إقفال</button>

      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />
      <div className="card py-3">

          </div>
          <button onClick={() => setShowFilters(!showFilters)} className={`btn ${showFilters ? 'btn-primary' : 'btn-secondary'} px-3 py-2.5 relative`}>
            <Filter size={14} />
            {activeFiltersCount > 0 && <span className="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 text-white text-[9px] rounded-full flex items-center justify-center font-black">{activeFiltersCount}</span>}
          </button>
        </div>
        {showFilters && (
          <div className="mt-3 pt-3 space-y-3 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            <div className="flex gap-2 flex-wrap">
              {[['all', 'الكل'], ['self', '👤 أنا'], ['ans', 'أنس'], ['abdelrahman', 'عبد الرحمن'], ['salma', 'سلمى'], ['om_abdo', 'أم عبده']].map(([id, label]) => (
                <button key={id} type="button" onClick={() => setSourceFilter(id)} className={`badge px-2.5 py-1 cursor-pointer text-[10px] ${sourceFilter === id ? 'badge-brand' : 'badge-neutral'}`}>{label}</button>
              ))}

            <div className="flex gap-2 flex-wrap">
              {[['all', 'الكل'], ['pending', '⏳ معلق'], ['paid', '✅ مدفوع']].map(([id, label]) => (
                <button key={id} type="button" onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: id })} className={`badge px-2.5 py-1 cursor-pointer text-[10px] ${statusFilter === id ? 'badge-brand' : 'badge-neutral'}`}>{label}</button>

        ) : (

                <div className="space-y-2">
                  {group.items.map(t => (
