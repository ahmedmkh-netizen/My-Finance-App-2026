/* ─────────────── Cashback View ─────────────── */
const CashbackView = memo(({ data, dispatch, saveHistory, addNotification, cards, selectedYear, selectedMonth }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [newTracker, setNewTracker] = useState({ 
    cardId: cards[0]?.id || 1, 
    month: selectedMonth, 
    year: selectedYear, 
    expectedAmount: '', 
    receivedAmount: '', 
    receivedDate: '', 
    status: CASHBACK_STATUS.EXPECTED, 
    notes: '' 
  });
  
  const trackers = data?.cashbackTrackers || [];
  const summary = useMemo(() => computeCashbackSummary(trackers), [trackers]);
  const filteredTrackers = useMemo(() => trackers.filter(t => 
    t.month === selectedMonth && (t.year || 2026) === selectedYear
  ), [trackers, selectedMonth, selectedYear]);
  
  const monthExpected = filteredTrackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
  const monthReceived = filteredTrackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
  const monthPending = monthExpected - monthReceived;

  const addTracker = () => {
    const check = validateAmount(newTracker.expectedAmount, { min: 0.01, max: 1000000, label: 'المبلغ المتوقع' });
    if (!check.valid) { 
      addNotification({ type: 'error', title: 'خطأ', message: check.error }); 
      return; 
    }
    saveHistory();
    const expected = check.value;
    const received = parseNumberInput(newTracker.receivedAmount);
    const tracker = { 
      ...newTracker, 
      id: getSafeId(), 
      expectedAmount: expected, 
      receivedAmount: received, 
      status: received >= expected ? CASHBACK_STATUS.RECEIVED : received > 0 ? CASHBACK_STATUS.PARTIAL : CASHBACK_STATUS.EXPECTED 
    };
    dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: [...trackers, tracker] });
    setShowAdd(false);
    setNewTracker({ 
      cardId: cards[0]?.id || 1, month: selectedMonth, year: selectedYear, 
      expectedAmount: '', receivedAmount: '', receivedDate: '', 
      status: CASHBACK_STATUS.EXPECTED, notes: '' 
    });
    addNotification({ type: 'success', title: 'تم الحفظ' });
  };

  const markReceived = async (tracker) => {
    const now = new Date();
    const txYear = now.getFullYear(), txMonth = ALL_MONTHS[now.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { 
      addNotification({ type: 'error', title: 'شهر مغلق', message: `شهر ${txMonth} ${txYear} مغلق`, duration: 6000 }); 
      return; 
    }
    const card = cards.find(c => c.id === tracker.cardId);
    const cardMethod = card ? getCardMethod(card) : null;
    
    const choice = await showInputModal({
      title: 'أين استلمت الكاش باك؟', icon: '🎁',
      message: `البطاقة: ${card?.bank} - ${card?.name}\n\n1 = على البطاقة (خصم من المديونية)\n2 = نقدي (إضافة للكاش)\n\nاكتب الرقم:`,
      inputValue: '1', numeric: true, confirmText: 'تأكيد'
    });
    if (choice === null) return;
    const choiceNum = parseInt(choice, 10);
    if (choiceNum !== 1 && choiceNum !== 2) { 
      addNotification({ type: 'error', title: 'اختر 1 أو 2' }); 
      return; 
    }
    const useCard = choiceNum === 1;
    const method = useCard && cardMethod ? cardMethod : 'cash';
    saveHistory();
    
    const updated = trackers.map(t => t.id === tracker.id ? { 
      ...t, 
      receivedAmount: t.expectedAmount, 
      receivedDate: getLocalISODate(), 
      status: CASHBACK_STATUS.RECEIVED 
    } : t);
    dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: updated });
    
    const newTx = {
      id: getSafeId(), 
      type: 'income', 
      kind: KIND.OPERATIONAL,
      category: 'استرداد كاش باك', 
      amount: safeNumber(tracker.expectedAmount),
      description: `كاش باك - ${card?.name || ''} (${useCard ? 'على البطاقة' : 'نقدي'})`,
      method, 
      date: getLocalISODate(now), 
      month: txMonth, 
      year: txYear, 
      monthIndex: now.getMonth(),
      subType: 'deposit', 
      status: 'paid',
      linkedCardId: useCard && card ? card.id : undefined
    };
    dispatch({ 
      type: 'UPDATE_TRANSACTIONS', 
      payload: [newTx, ...(data.transactions || [])].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) 
    });
    addNotification({ 
      type: 'success', 
      title: 'تم استلام الكاش باك', 
      message: `${fmt(tracker.expectedAmount)} ج.م — ${useCard ? 'على البطاقة' : 'نقدي'}` 
    });
  };

  const deleteTracker = (id) => {
    dispatch({ 
      type: 'SHOW_CONFIRM', 
      danger: true, 
      title: 'حذف السجل', 
      message: 'سيتم حذف سجل الكاش باك', 
      onConfirm: () => { 
        saveHistory(); 
        dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: trackers.filter(t => t.id !== id) }); 
        addNotification({ type: 'success', title: 'تم الحذف' }); 
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  };

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div>
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>كاش باك {selectedMonth}</p>
            <h2 className="text-3xl font-black tracking-tight text-emerald-600">
              {fmt(monthReceived)}
              <span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <p className="text-[11px] font-semibold mt-2" style={{ color: 'var(--text-muted)' }}>
              متوقع: {fmt(monthExpected)} • معلق: {fmt(monthPending)}
            </p>
          </div>
          <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs">
            <Plus size={14} /> إضافة
          </button>
        </div>
        <div className="grid grid-cols-3 gap-2 mt-4">
          <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 text-center">
            <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">مستلم</p>
            <p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(summary.received)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-blue-50 dark:bg-blue-950/30 text-center">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">متوقع</p>
            <p className="text-sm font-black text-blue-600 mt-0.5">{fmt(summary.expected)}</p>
          </div>
          <div className="p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/30 text-center">
            <p className="text-[10px] font-bold text-amber-700 dark:text-amber-400">معلق</p>
            <p className="text-sm font-black text-amber-600 mt-0.5">{fmt(summary.pending)}</p>
          </div>
        </div>
      </div>

      <div className="space-y-2">
        <h3 className="font-black text-sm">سجلات {selectedMonth}</h3>
        {filteredTrackers.length === 0 ? (
          <div className="card text-center p-8">
            <Gift size={32} className="mx-auto mb-2 text-emerald-500" />
            <p className="font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد سجلات لهذا الشهر</p>
          </div>
        ) : filteredTrackers.map(tracker => {
          const card = cards.find(c => c.id === tracker.cardId);
          const pct = safeNumber(tracker.expectedAmount) > 0 ? (safeNumber(tracker.receivedAmount) / safeNumber(tracker.expectedAmount)) * 100 : 0;
          const statusCls = tracker.status === CASHBACK_STATUS.RECEIVED ? 'badge-success' : tracker.status === CASHBACK_STATUS.PARTIAL ? 'badge-warning' : 'badge-neutral';
          return (
            <div key={tracker.id} className="card py-3">
              <div className="flex justify-between items-center gap-3 mb-2">
                <div className="flex items-center gap-2">
                  <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600"><Gift size={14} /></div>
                  <div>
                    <h4 className="font-bold text-xs">
                      {card ? `${card.bank} - ${card.name} • ••••${card.last4}` : 'غير محدد'}
                    </h4>
                    <span className={`badge ${statusCls} mt-1`}>{CASHBACK_STATUS_LABELS[tracker.status]}</span>
                  </div>
                </div>
                <div className="flex gap-1">
                  {tracker.status !== CASHBACK_STATUS.RECEIVED && (
                    <button onClick={() => markReceived(tracker)} className="btn btn-primary text-[10px] py-1.5 px-2">
                      <CheckCircle2 size={12} /> استلمت
                    </button>
                  )}
                  <button onClick={() => deleteTracker(tracker.id)} className="btn btn-ghost p-1.5 text-red-500">
                    <Trash2 size={12} />
                  </button>
                </div>
              </div>
              <div className="flex justify-between text-xs mb-1.5">
                <span style={{ color: 'var(--text-muted)' }}>متوقع: {fmt(tracker.expectedAmount)} • مستلم: {fmt(tracker.receivedAmount)}</span>
              </div>
              <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                <div 
                  className={`h-full ${pct >= 100 ? 'bg-emerald-500' : pct > 0 ? 'bg-amber-500' : 'bg-slate-300'}`} 
                  style={{ width: `${Math.min(100, pct)}%` }}
                ></div>
              </div>
            </div>
          );
        })}
      </div>

      {showAdd && (
        <Modal isOpen={true} onClose={() => setShowAdd(false)} title="متتبع كاش باك" icon="🎁">
          <div className="space-y-3">
            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>البطاقة</label>
              <select className="input-field" value={newTracker.cardId} onChange={e => setNewTracker({ ...newTracker, cardId: Number(e.target.value) })}>
                {cards.map(c => <option key={c.id} value={c.id}>{c.bank} - {c.name} • ••••{c.last4}</option>)}
              </select>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الشهر</label>
                <select className="input-field text-sm" value={newTracker.month} onChange={e => setNewTracker({ ...newTracker, month: e.target.value })}>
                  {getMonthsForYear(newTracker.year).map(m => <option key={m} value={m}>{m}</option>)}
                </select>
              </div>
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>السنة</label>
                <select className="input-field text-sm" value={newTracker.year} onChange={e => setNewTracker({ ...newTracker, year: Number(e.target.value) })}>
                  {YEARS_LIST.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>
            </div>
            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ المتوقع *</label>
              <input 
                type="text" 
                inputMode="decimal" 
                className="input-field text-base font-black text-blue-600 text-center" 
                value={newTracker.expectedAmount} 
                onChange={e => setNewTracker({ ...newTracker, expectedAmount: e.target.value })} 
                placeholder="0.00" 
              />
            </div>
            <button onClick={addTracker} className="btn btn-primary w-full py-2.5 text-sm">
              <Save size={14} /> إضافة
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
});

/* ─────────────── Hany Shop Ledger ─────────────── */
const HanyShopLedger = memo(({ loan, prevMonthLoan, addNotification }) => {
  const [expanded, setExpanded] = useState(false);
  const [searchTerm, setSearchTerm] = useState('');
  const [viewMode, setViewMode] = useState('list');
  const [exporting, setExporting] = useState(false);
  const [sortBy, setSortBy] = useState('date');
  const containerRef = useRef(null);

  const items = useMemo(() => {
    const raw = Array.isArray(loan.items) ? loan.items : [];
    return raw.slice().sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
  }, [loan.items]);

  const paidItems = useMemo(() => items.filter(i => i.status === 'paid'), [items]);
  const totalPaidAmount = paidItems.reduce((s, i) => s + safeNumber(i.amount), 0);
  const totalAllAmount = items.reduce((s, i) => s + safeNumber(i.amount), 0);

  const filteredItems = useMemo(() => {
    if (!searchTerm.trim()) return paidItems;
    const term = normalizeText(searchTerm);
    return paidItems.filter(i => 
      normalizeText(i.description).includes(term) || 
      normalizeText(i.category).includes(term) || 
      normalizeText(i.method).includes(term)
    );
  }, [paidItems, searchTerm]);

  const sortedItems = useMemo(() => {
    const arr = [...filteredItems];
    if (sortBy === 'amount') return arr.sort((a, b) => safeNumber(b.amount) - safeNumber(a.amount));
    if (sortBy === 'name') return arr.sort((a, b) => normalizeText(a.description).localeCompare(normalizeText(b.description)));
    return arr.sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
  }, [filteredItems, sortBy]);

  const groupedItems = useMemo(() => {
    const map = {};
    filteredItems.forEach(item => {
      const key = (item.description || 'بدون وصف').trim();
      if (!map[key]) map[key] = { name: key, count: 0, total: 0, items: [] };
      map[key].count += 1;
      map[key].total += safeNumber(item.amount);
      map[key].items.push(item);
    });
    return Object.values(map).sort((a, b) => b.total - a.total);
  }, [filteredItems]);

  const comparison = useMemo(() => {
    if (!prevMonthLoan) return null;
    const cur = safeNumber(loan.totalPaid);
    const prev = safeNumber(prevMonthLoan.totalPaid);
    if (prev === 0) return { cur, prev, change: cur > 0 ? 100 : 0, direction: cur > 0 ? 'up' : 'same', diff: cur - prev };
    const change = ((cur - prev) / prev) * 100;
    return { cur, prev, change, direction: change > 0.5 ? 'up' : change < -0.5 ? 'down' : 'same', diff: cur - prev };
  }, [loan.totalPaid, prevMonthLoan]);

  const top3 = useMemo(() => groupedItems.slice(0, 3), [groupedItems]);
  const totalFiltered = filteredItems.reduce((s, i) => s + safeNumber(i.amount), 0);

  const handleExportPdf = async () => {
    if (!containerRef.current || exporting) return;
    if (paidItems.length === 0) { 
      addNotification({ type: 'warning', title: 'لا توجد مسحوبات معتمدة للتصدير' }); 
      return; 
    }
    setExporting(true);
    if (!expanded) setExpanded(true);
    await new Promise(r => setTimeout(r, 350));
    try {
      const element = containerRef.current;
      if (!element) throw new Error('Container not found');
      const scrollables = element.querySelectorAll('.scroll-hide, .pdf-expand');
      const savedStyles = [];
      scrollables.forEach((el) => {
        savedStyles.push({ el, maxHeight: el.style.maxHeight, overflow: el.style.overflow });
        el.style.maxHeight = 'none';
        el.style.overflow = 'visible';
      });
      const hiddenEls = element.querySelectorAll('[data-pdf-hide="true"]');
      const hiddenSaved = [];
      hiddenEls.forEach((el) => { hiddenSaved.push({ el, disp: el.style.display }); el.style.display = 'none'; });
      const opt = { 
        margin: [10, 8, 10, 8], 
        filename: `مسحوبات_هاني_${loan.month}_${loan.year}.pdf`, 
        image: { type: 'jpeg', quality: 0.95 }, 
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false, windowWidth: 800 }, 
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, 
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } 
      };
      await window.html2pdf().set(opt).from(element).save();
      savedStyles.forEach(({ el, maxHeight, overflow }) => { 
        el.style.maxHeight = maxHeight; 
        el.style.overflow = overflow; 
      });
      hiddenSaved.forEach(({ el, disp }) => { el.style.display = disp; });
      addNotification({ type: 'success', title: 'تم تصدير PDF', message: `${filteredItems.length} معاملة — ${fmt(totalFiltered)} ج.م` });
    } catch (e) {
      console.error('PDF Export Error:', e);
      addNotification({ type: 'error', title: 'فشل التصدير', message: e.message || 'خطأ غير معروف' });
    } finally { setExporting(false); }
  };

  useEffect(() => { 
    if ((searchTerm.trim() || viewMode === 'grouped') && !expanded) setExpanded(true); 
  }, [searchTerm, viewMode]);

  return (
    <div ref={containerRef} className="mt-3 pt-3" style={{ borderTop: '1px dashed var(--border-default)' }}>
      <button 
        type="button" 
        data-pdf-hide="true" 
        onClick={() => setExpanded(v => !v)} 
        className="w-full flex items-center justify-between p-2.5 rounded-lg text-[11px] font-bold hover:bg-[color:var(--bg-muted)] transition-colors" 
        style={{ background: 'var(--bg-muted)' }}
      >
        <div className="flex items-center gap-2 flex-wrap min-w-0">
          <Receipt size={13} className="text-blue-500 flex-shrink-0" />
          <span>📋 سجل المسحوبات المعتمدة ({paidItems.length})</span>
          {items.length > paidItems.length && (
            <span className="badge badge-warning text-[9px]">{items.length - paidItems.length} معلق</span>
          )}
          {comparison && comparison.direction !== 'same' && (
            <span className={`badge text-[9px] ${comparison.direction === 'up' ? 'badge-danger' : 'badge-success'}`}>
              {comparison.direction === 'up' ? '↑' : '↓'} {Math.abs(Math.round(comparison.change))}% عن الشهر السابق
            </span>
          )}
        </div>
        <ChevronDown size={14} className={`transition-transform flex-shrink-0 ${expanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
      </button>

      {expanded && (
        <div className="mt-3 space-y-3 animate-fadeIn">
          <div className="flex gap-1.5 flex-wrap" data-pdf-hide="true">
            <div className="relative flex-1 min-w-[140px]">
              <Search className="absolute right-2.5 top-1/2 -translate-y-1/2" size={12} style={{ color: 'var(--text-muted)' }} />
              <input 
                type="text" 
                placeholder="ابحث في المسحوبات..." 
                className="input-field pr-8 text-[11px] py-2" 
                value={searchTerm} 
                onChange={e => setSearchTerm(e.target.value)} 
              />
            </div>
            <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <button 
                type="button" 
                onClick={() => setViewMode('list')} 
                className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold transition-all ${viewMode === 'list' ? 'shadow-sm' : ''}`} 
                style={viewMode === 'list' ? { background: 'var(--bg-card)', color: 'var(--brand)' } : { color: 'var(--text-muted)' }}
              >قائمة</button>
              <button 
                type="button" 
                onClick={() => setViewMode('grouped')} 
                className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold transition-all ${viewMode === 'grouped' ? 'shadow-sm' : ''}`} 
                style={viewMode === 'grouped' ? { background: 'var(--bg-card)', color: 'var(--brand)' } : { color: 'var(--text-muted)' }}
              >مُجمّع</button>
            </div>
            {viewMode === 'list' && (
              <select className="input-field text-[10px] py-2 px-1.5 w-auto min-w-[80px]" value={sortBy} onChange={e => setSortBy(e.target.value)} title="ترتيب">
                <option value="date">📅 التاريخ</option>
                <option value="amount">💰 المبلغ</option>
                <option value="name">🔤 الاسم</option>
              </select>
            )}
            <button 
              type="button" 
              onClick={handleExportPdf} 
              disabled={exporting || filteredItems.length === 0} 
              className="btn btn-secondary text-[10px] py-2 px-2.5 flex items-center gap-1" 
              title="تصدير PDF"
            >
              {exporting ? <RefreshCcw size={11} className="animate-spin" /> : <Download size={11} />}
              <span className="hidden sm:inline">PDF</span>
            </button>
          </div>

          {comparison && (
            <div className="p-2.5 rounded-lg grid grid-cols-3 gap-2 text-center" style={{ background: 'var(--bg-muted)' }}>
              <div>
                <p className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>هذا الشهر (معتمد)</p>
                <p className="text-[12px] font-black text-red-600 mt-0.5">{fmt(comparison.cur)}</p>
              </div>
              <div>
                <p className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>الشهر السابق</p>
                <p className="text-[12px] font-black mt-0.5" style={{ color: 'var(--text-secondary)' }}>{fmt(comparison.prev)}</p>
              </div>
              <div>
                <p className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>الفرق</p>
                <p className={`text-[12px] font-black mt-0.5 ${comparison.direction === 'up' ? 'text-red-600' : comparison.direction === 'down' ? 'text-emerald-600' : 'text-slate-500'}`}>
                  {comparison.diff >= 0 ? '+' : ''}{fmt(comparison.diff)}
                </p>
              </div>
            </div>
          )}

          {top3.length > 0 && !searchTerm && (
            <div className="p-2.5 rounded-lg" style={{ background: 'rgba(37, 99, 235, 0.06)' }}>
              <p className="text-[10px] font-black text-blue-700 dark:text-blue-400 mb-2">🏆 أعلى 3 أصناف</p>
              <div className="space-y-1">
                {top3.map((g, i) => (
                  <div key={g.name} className="flex justify-between items-center text-[10px]">
                    <span className="font-bold truncate flex items-center gap-1.5">
                      <span className="text-[11px]">{['🥇','🥈','🥉'][i]}</span>
                      <span className="truncate">{g.name}</span>
                    </span>
                    <span className="font-black text-blue-600 flex-shrink-0">{fmt(g.total)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {filteredItems.length === 0 ? (
            <div className="text-center py-6 text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>
              {searchTerm ? '🔍 لا توجد نتائج للبحث' : 'لا توجد مسحوبات معتمدة'}
            </div>
          ) : viewMode === 'list' ? (
            <div className="space-y-1.5 max-h-80 overflow-y-auto scroll-hide pdf-expand">
              {sortedItems.map(item => (
                <div key={item.id} className="flex justify-between items-center gap-2 p-2 rounded-lg text-[11px]" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                  <div className="min-w-0 flex-1">
                    <p className="font-bold truncate">{item.description || 'بدون وصف'}</p>
                    <p className="text-[9px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
                      {item.date} • {PAYMENT_METHODS.find(p => p.id === item.method)?.label || item.method}
                    </p>
                  </div>
                  <span className="font-black text-red-600 flex-shrink-0">{fmt(item.amount)}</span>
                </div>
              ))}
            </div>
          ) : (
            <div className="space-y-1.5 max-h-80 overflow-y-auto scroll-hide pdf-expand">
              {groupedItems.map(g => (
                <div key={g.name} className="flex justify-between items-center gap-2 p-2.5 rounded-lg text-[11px]" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                  <div className="min-w-0 flex-1">
                    <p className="font-bold truncate">{g.name}</p>
                    <p className="text-[9px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
                      عدد: {g.count} • متوسط: {fmt(g.total / g.count)}
                    </p>
                  </div>
                  <span className="font-black text-red-600 flex-shrink-0">{fmt(g.total)}</span>
                </div>
              ))}
            </div>
          )}

          <div className="flex justify-between items-center p-2.5 rounded-lg" style={{ background: 'rgba(220, 38, 38, 0.08)' }}>
            <span className="text-[10px] font-bold text-red-700 dark:text-red-400">
              {searchTerm ? `نتائج البحث (${filteredItems.length} من ${paidItems.length})` : `إجمالي المعتمد (${paidItems.length} مسحوبة)`}
            </span>
            <span className="font-black text-red-600 text-[13px]">{fmt(totalFiltered)}</span>
          </div>
          
          {items.length > paidItems.length && (
            <div className="flex justify-between items-center p-2 rounded-lg" style={{ background: 'rgba(217, 119, 6, 0.08)' }}>
              <span className="text-[10px] font-bold text-amber-700 dark:text-amber-400">
                ⏳ معلق ({items.length - paidItems.length})
              </span>
              <span className="font-black text-amber-600 text-[12px]">{fmt(totalAllAmount - totalPaidAmount)}</span>
            </div>
          )}

          <p className="text-[9px] text-center font-semibold" style={{ color: 'var(--text-muted)' }}>
            تم التوليد بواسطة المحفظة الذكية — {new Date().toLocaleDateString('ar-EG')}
          </p>
        </div>
      )}
    </div>
  );
});

/* ─────────────── Card Statement Modal ─────────────── */
const CardStatementModal = memo(({ card, data, transactions, onClose, addNotification }) => {
  const [filterType, setFilterType] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');
  const [sortBy, setSortBy] = useState('date');
  const [exporting, setExporting] = useState(false);
  const containerRef = useRef(null);
  
  const cardMethod = getCardMethod(card);
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];

  const cardTx = useMemo(() => {
    if (!card) return [];
    return (transactions || []).filter(t => {
      if (t.status !== 'paid') return false;
      const hasExplicitCardLink = (t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== '');
      if (hasExplicitCardLink) return t.linkedCardId === card.id;
      if (t.cardLast4 && subCards.includes(t.cardLast4)) return true;
      return t.method === cardMethod;
    }).sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
  }, [transactions, card, cardMethod, subCards]);

  const filteredTx = useMemo(() => {
    let arr = cardTx;
    if (filterType === 'expense') arr = arr.filter(t => t.type === 'expense');
    if (filterType === 'income') arr = arr.filter(t => t.type === 'income');
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.category).includes(term));
    }
    const sorted = [...arr];
    if (sortBy === 'amount') return sorted.sort((a, b) => safeNumber(b.amount) - safeNumber(a.amount));
    return sorted.sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
  }, [cardTx, filterType, searchTerm, sortBy]);

  const stats = useMemo(() => {
    const expenses = cardTx.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
    const incomes = cardTx.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
    const monthlyTotals = {};
    cardTx.forEach(t => {
      const d = parseISODate(t.date);
      if (!d) return;
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      if (!monthlyTotals[key]) monthlyTotals[key] = { month: ALL_MONTHS[d.getMonth()], year: d.getFullYear(), expenses: 0, incomes: 0, count: 0 };
      if (t.type === 'expense') monthlyTotals[key].expenses += safeNumber(t.amount);
      else monthlyTotals[key].incomes += safeNumber(t.amount);
      monthlyTotals[key].count++;
    });
    const monthly = Object.values(monthlyTotals).sort((a, b) => b.year - a.year || getMonthIndex(b.month) - getMonthIndex(a.month));
    return { expenses, incomes, total: expenses - incomes, count: cardTx.length, monthly };
  }, [cardTx]);

  const dailyGroups = useMemo(() => groupTransactionsByDate(filteredTx), [filteredTx]);

  const handlePrint = () => {
    if (!containerRef.current) return;
    const w = window.open('', '_blank', 'width=900,height=700');
    if (!w) { 
      addNotification({ type: 'error', title: 'المتصفح منع الطباعة', message: 'اسمح بالنوافذ المنبثقة' }); 
      return; 
    }
    const html = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>كشف ${card.bank} - ${card.name}</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Cairo',sans-serif;padding:24px;color:#1f2937;background:white}.header{text-align:center;padding-bottom:16px;border-bottom:3px solid #2563EB;margin-bottom:20px}.header h1{font-size:22px;font-weight:900;color:#1E40AF;margin-bottom:4px}.header p{font-size:13px;color:#6b7280;font-weight:600}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.stat-box{background:#f3f4f6;padding:12px;border-radius:10px;text-align:center;border:1px solid #e5e7eb}.stat-box .label{font-size:11px;font-weight:700;color:#6b7280;margin-bottom:4px}.stat-box .value{font-size:16px;font-weight:900;color:#1f2937}.stat-box.red .value{color:#dc2626}.stat-box.green .value{color:#059669}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}th{background:#2563EB;color:white;padding:10px 8px;text-align:right;font-weight:700}td{padding:8px;border-bottom:1px solid #e5e7eb}tr:nth-child(even) td{background:#f9fafb}.footer{margin-top:30px;padding-top:12px;border-top:2px dashed #d1d5db;text-align:center;font-size:10px;color:#9ca3af}.day-header-row td{background:#dbeafe!important;font-weight:900;color:#1E40AF;font-size:11px;padding:6px 8px}</style></head><body><div class="header"><h1>💳 ${escapeHtml(card.bank)} - ${escapeHtml(card.name)}</h1><p>•••• ${escapeHtml(card.last4)} • ${new Date().toLocaleString('ar-EG')}</p></div><div class="stats"><div class="stat-box red"><div class="label">إجمالي المشتريات</div><div class="value">${fmt(stats.expenses)} ج.م</div></div><div class="stat-box green"><div class="label">إجمالي السدادات</div><div class="value">${fmt(stats.incomes)} ج.م</div></div><div class="stat-box"><div class="label">عدد العمليات</div><div class="value">${stats.count}</div></div><div class="stat-box red"><div class="label">الصافي</div><div class="value">${fmt(stats.total)} ج.م</div></div></div><table><thead><tr><th>التاريخ</th><th>الوصف</th><th>الفئة</th><th style="text-align:left">المبلغ</th></tr></thead><tbody>${dailyGroups.map(g => `<tr class="day-header-row"><td colspan="4">${escapeHtml(g.label)} — ${fmt(g.total)} ج.م (${g.items.length})</td></tr>${g.items.map(t => `<tr><td>${escapeHtml(t.date)}</td><td>${escapeHtml(t.description || '')}</td><td>${escapeHtml(t.category || '')}</td><td style="text-align:left;font-weight:900;color:${t.type === 'income' ? '#059669' : '#dc2626'}">${t.type === 'income' ? '+' : '−'}${fmt(t.amount)}</td></tr>`).join('')}`).join('')}</tbody></table><div class="footer">💼 المحفظة الذكية — كشف بطاقة ${escapeHtml(card.bank)} ${escapeHtml(card.name)}</div><script>window.onload=()=>setTimeout(()=>window.print(),300);<\/script></body></html>`;
    w.document.write(html);
    w.document.close();
  };

  const handleExportPdf = async () => {
    if (!containerRef.current || exporting) return;
    if (cardTx.length === 0) { 
      addNotification({ type: 'warning', title: 'لا توجد معاملات للتصدير' }); 
      return; 
    }
    setExporting(true);
    try {
      const element = containerRef.current.cloneNode(true);
      element.querySelectorAll('[data-pdf-hide="true"]').forEach(el => el.remove());
      element.querySelectorAll('.scroll-hide, .pdf-expand').forEach(el => { 
        el.style.maxHeight = 'none'; 
        el.style.overflow = 'visible'; 
      });
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'background:white;padding:20px;font-family:Cairo,sans-serif;direction:rtl;';
      wrapper.innerHTML = `<div style="text-align:center;padding-bottom:12px;border-bottom:3px solid #2563EB;margin-bottom:16px;"><h1 style="font-size:20px;font-weight:900;color:#1E40AF;margin:0 0 4px;">💳 ${escapeHtml(card.bank)} - ${escapeHtml(card.name)}</h1><p style="font-size:12px;color:#6b7280;font-weight:600;margin:0;">•••• ${escapeHtml(card.last4)} • ${new Date().toLocaleDateString('ar-EG')}</p></div>`;
      wrapper.appendChild(element);
      const opt = { 
        margin: [10, 8, 10, 8], 
        filename: `كشف_${card.bank}_${card.name}_${card.last4}.pdf`, 
        image: { type: 'jpeg', quality: 0.95 }, 
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false }, 
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, 
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } 
      };
      await window.html2pdf().set(opt).from(wrapper).save();
      addNotification({ type: 'success', title: 'تم تصدير PDF', message: `${filteredTx.length} معاملة` });
    } catch (e) {
      console.error('PDF Error:', e);
      addNotification({ type: 'error', title: 'فشل التصدير', message: e.message });
    } finally { setExporting(false); }
  };

  if (!card) return null;

  const liveDebt = computeCardDebt(data, card);
  const liveAvailable = Math.max(0, safeNumber(card.limit) - liveDebt);
  const usagePct = safeNumber(card.limit) > 0 ? (liveDebt / safeNumber(card.limit)) * 100 : 0;

  return (
    <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="generic-modal max-w-3xl">
        <div className="generic-modal-header">
          <div className="flex items-center gap-2 min-w-0">
            <div className="p-2 rounded-lg flex-shrink-0 bg-indigo-50 dark:bg-indigo-950/30 text-indigo-600 dark:text-indigo-400">
              <CreditCard size={18} />
            </div>
            <div className="min-w-0">
              <h3 className="text-base font-black truncate">{card.bank} - {card.name}</h3>
              <p className="text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>•••• {card.last4} • {stats.count} معاملة</p>
            </div>
          </div>
          <button onClick={onClose} className="btn btn-ghost p-1.5"><X size={16} /></button>
        </div>
        <div className="generic-modal-body" ref={containerRef}>
          <div className="p-3 rounded-xl mb-3" style={{ background: 'var(--bg-muted)' }}>
            <div className="grid grid-cols-3 gap-2">
              <div className="text-center">
                <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>المديونية الحية</p>
                <p className="text-base font-black text-red-600 mt-0.5">{fmt(liveDebt)}</p>
              </div>
              <div className="text-center">
                <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>المتاح</p>
                <p className="text-base font-black text-emerald-600 mt-0.5">{fmt(liveAvailable)}</p>
              </div>
              <div className="text-center">
                <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الحد الكلي</p>
                <p className="text-base font-black text-blue-600 mt-0.5">{fmt(card.limit)}</p>
              </div>
            </div>
            <div className="w-full rounded-full h-1.5 overflow-hidden mt-2" style={{ background: 'var(--bg-card)' }}>
              <div 
                className={`h-full ${usagePct > 70 ? 'bg-red-500' : usagePct > 40 ? 'bg-amber-500' : 'bg-emerald-500'}`} 
                style={{ width: `${Math.min(100, usagePct)}%` }}
              ></div>
            </div>
          </div>
          
          <div className="grid grid-cols-3 gap-2 mb-3">
            <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
              <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مشتريات</p>
              <p className="text-sm font-black text-red-600 mt-0.5">{fmt(stats.expenses)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
              <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">سدادات</p>
              <p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(stats.incomes)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
              <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الصافي</p>
              <p className={`text-sm font-black mt-0.5 ${stats.total >= 0 ? 'text-blue-600' : 'text-emerald-600'}`}>{fmt(Math.abs(stats.total))}</p>
            </div>
          </div>
          
          <div className="flex gap-1.5 flex-wrap mb-3" data-pdf-hide="true">
            <div className="relative flex-1 min-w-[140px]">
              <Search className="absolute right-2.5 top-1/2 -translate-y-1/2" size={12} style={{ color: 'var(--text-muted)' }} />
              <input 
                type="text" 
                placeholder="ابحث..." 
                className="input-field pr-8 text-[11px] py-2" 
                value={searchTerm} 
                onChange={e => setSearchTerm(e.target.value)} 
              />
            </div>
            <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <button 
                type="button" 
                onClick={() => setFilterType('all')} 
                className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'all' ? 'shadow-sm' : ''}`} 
                style={filterType === 'all' ? { background: 'var(--bg-card)', color: 'var(--brand)' } : { color: 'var(--text-muted)' }}
              >الكل ({cardTx.length})</button>
              <button 
                type="button" 
                onClick={() => setFilterType('expense')} 
                className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'expense' ? 'shadow-sm' : ''}`} 
                style={filterType === 'expense' ? { background: 'var(--bg-card)', color: 'var(--danger)' } : { color: 'var(--text-muted)' }}
              >مشتريات</button>
              <button 
                type="button" 
                onClick={() => setFilterType('income')} 
                className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'income' ? 'shadow-sm' : ''}`} 
                style={filterType === 'income' ? { background: 'var(--bg-card)', color: 'var(--success)' } : { color: 'var(--text-muted)' }}
              >سدادات</button>
            </div>
            <select className="input-field text-[10px] py-2 px-1.5 w-auto min-w-[90px]" value={sortBy} onChange={e => setSortBy(e.target.value)}>
              <option value="date">📅 التاريخ</option>
              <option value="amount">💰 المبلغ</option>
            </select>
            <button type="button" onClick={handlePrint} disabled={filteredTx.length === 0} className="btn btn-secondary text-[10px] py-2 px-2.5">
              <Printer size={11} /><span className="hidden sm:inline">طباعة</span>
            </button>
            <button 
              type="button" 
              onClick={handleExportPdf} 
              disabled={exporting || filteredTx.length === 0} 
              className="btn btn-primary text-[10px] py-2 px-2.5"
            >
              {exporting ? <RefreshCcw size={11} className="animate-spin" /> : <Download size={11} />}
              <span className="hidden sm:inline">PDF</span>
            </button>
          </div>
          
          {stats.monthly.length > 0 && (
            <details className="mb-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <summary className="p-2.5 cursor-pointer text-[10px] font-black" style={{ color: 'var(--text-secondary)' }}>
                📊 الملخص الشهري ({stats.monthly.length} شهر)
              </summary>
              <div className="px-2.5 pb-2.5 space-y-1">
                {stats.monthly.slice(0, 6).map((m, i) => (
                  <div key={i} className="flex justify-between items-center text-[10px] p-1.5 rounded" style={{ background: 'var(--bg-card)' }}>
                    <span className="font-bold">{m.month} {m.year} <span style={{ color: 'var(--text-muted)' }}>({m.count})</span></span>
                    <div className="flex gap-2">
                      <span className="text-red-600 font-bold">-{fmt(m.expenses)}</span>
                      {m.incomes > 0 && <span className="text-emerald-600 font-bold">+{fmt(m.incomes)}</span>}
                    </div>
                  </div>
                ))}
              </div>
            </details>
          )}
          
          {filteredTx.length === 0 ? (
            <div className="text-center py-8">
              <CreditCard size={32} className="mx-auto mb-2" style={{ color: 'var(--text-muted)' }} />
              <p className="font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>
                {cardTx.length === 0 ? 'لا توجد معاملات مسجلة على هذه البطاقة بعد' : 'لا توجد نتائج مطابقة'}
              </p>
              {cardTx.length === 0 && (
                <p className="text-[10px] mt-1" style={{ color: 'var(--text-muted)' }}>
                  أضف معاملة واختر طريقة الدفع: {PAYMENT_METHODS.find(p => p.id === cardMethod)?.label}
                </p>
              )}
            </div>
          ) : (
            <div className="space-y-2 max-h-[45vh] overflow-y-auto scroll-hide pdf-expand">
              {dailyGroups.map(group => (
                <div key={group.date}>
                  <DayGroupHeader label={group.label} total={group.total} count={group.items.length} />
                  <div className="space-y-1.5">
                    {group.items.map(t => (
                      <div key={t.id} className="flex justify-between items-center gap-2 p-2.5 rounded-lg" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                        <div className="min-w-0 flex-1">
                          <p className="font-bold text-xs truncate">
                            {t.description || t.category} <SmsBadge tx={t} /> <TeldaBadge tx={t} /> <RecurringBadge tx={t} />
                          </p>
                          <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
                            {t.category}
                            {t.cardLast4 && <span className="font-mono"> • ••••{t.cardLast4}</span>}
                            {t.linkedLoanId && <span className="text-amber-600"> • مرتبط بقرض</span>}
                          </p>
                        </div>
                        <span className={`font-black text-xs flex-shrink-0 ${t.type === 'income' ? 'text-emerald-600' : 'text-red-600'}`}>
                          {t.type === 'income' ? '+' : '−'}{fmt(t.amount)}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
          
          {filteredTx.length > 0 && (
            <div className="mt-3 p-3 rounded-lg bg-gradient-to-br from-blue-600 to-blue-800 text-white flex justify-between items-center">
              <span className="font-black text-sm">الإجمالي (المعروض)</span>
              <span className="text-xl font-black">
                {fmt(filteredTx.reduce((s, t) => s + (t.type === 'income' ? -safeNumber(t.amount) : safeNumber(t.amount)), 0))} ج.م
              </span>
            </div>
          )}
        </div>
        <div className="generic-modal-footer" data-pdf-hide="true">
          <button onClick={onClose} className="btn btn-secondary flex-1 text-sm">إغلاق</button>
        </div>
      </div>
    </div>
  );
});

/* ─────────────── Loans View ─────────────── */
const LoansView = memo(({ 
  updatedLoans, cards, recurringItems, transactions, dispatch, deleteRecurring, 
  saveHistory, getLocalISODate, addNotification, data, selectedMonth, selectedYear 
}) => {
  const [showAdd, setShowAdd] = useState(false);
  const [activeTab, setActiveTab] = useState('loans');
  const [newLoan, setNewLoan] = useState({ name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false });
  const settlingRef = useRef(false);

  const openRecurringEdit = useCallback((item) => {
    dispatch({ 
      type: 'SET_RECURRING_FORM_DATA', 
      payload: { 
        id: item.id, title: item.title, amount: String(item.amount), day: item.day, 
        category: item.category, type: item.type, startMonth: item.startMonth || '', 
        endMonth: item.endMonth || '', active: item.active !== false, 
        kind: item.kind || null, linkedLoanSystemId: item.linkedLoanSystemId || null, 
        linkedCardId: item.linkedCardId || null, method: item.method || 'cash', 
        transferChannel: item.transferChannel || null 
      } 
    });
    dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: true });
  }, [dispatch]);

  const hanyByMonth = useMemo(() => {
    const map = {};
    updatedLoans.filter(l => l.autoGenerated).forEach(l => { map[`${l.year}-${l.month}`] = l; });
    return map;
  }, [updatedLoans]);

  const getPrevMonth = useCallback((month, year) => {
    const idx = getMonthIndex(month);
    if (idx <= 0) return { month: 'ديسمبر', year: year - 1 };
    return { month: ALL_MONTHS[idx - 1], year };
  }, []);

  const settleHany = async (loan) => {
    if (settlingRef.current) { 
      addNotification({ type: 'info', title: 'العملية جارية...' }); 
      return; 
    }
    settlingRef.current = true;
    try {
      const total = safeNumber(loan.totalAmount);
      const paidAlready = safeNumber(loan.totalPaid);
      const remaining = Math.max(0, total - paidAlready);
      if (remaining <= 0.005) { 
        addNotification({ type: 'info', title: 'مسدد بالكامل' }); 
        return; 
      }
      const monthLabel = `${loan.month} ${loan.year}`;
      const monthKey = makeMonthKey(loan.year, loan.month);
      
      if (isMonthClosed(data, loan.year, loan.month)) {
        addNotification({ type: 'error', title: 'شهر المسحوبات مغلق', message: `شهر ${loan.month} ${loan.year} مغلق`, duration: 7000 });
        return;
      }
      
      const alreadySettled = Array.isArray(data.settledHanyMonths) && data.settledHanyMonths.includes(monthKey);
      if (alreadySettled) { 
        addNotification({ type: 'info', title: 'تمت التسوية مسبقاً' }); 
        return; 
      }
      
      const input = await showInputModal({
        title: 'تسوية مسحوبات محل هاني', icon: '💰',
        message: `الإجمالي: ${fmt(total)}\nمدفوع: ${fmt(paidAlready)}\nالمتبقي: ${fmt(remaining)}\n\nالمبلغ المدفوع الآن:`,
        inputValue: String(remaining), numeric: true, confirmText: 'تسوية'
      });
      if (input === null) return;
      
      const paidNow = parseNumberInput(input);
      if (paidNow <= 0) { 
        addNotification({ type: 'error', title: 'مبلغ غير صحيح' }); 
        return; 
      }
      if (paidNow > remaining + 0.005) { 
        addNotification({ type: 'error', title: `الحد الأقصى ${fmt(remaining)}` }); 
        return; 
      }
      
      const newRemaining = remaining - paidNow;
      const willCarry = newRemaining > 0.005;
      let nextMIdx = 0, nextY = loan.year, nextMonthName = '';
      
      if (willCarry) {
        const monthIdx = getMonthIndex(loan.month);
        nextMIdx = monthIdx + 1; 
        nextY = loan.year;
        if (nextMIdx > 11) { nextMIdx = 0; nextY++; }
        nextMonthName = ALL_MONTHS[nextMIdx];
        const nextMonthKey = makeMonthKey(nextY, nextMonthName);
        if ((data.closedMonths || []).includes(nextMonthKey)) {
          addNotification({ type: 'error', title: 'لا يمكن الترحيل', message: `شهر ${nextMonthName} ${nextY} مغلق.`, duration: 7000 });
          return;
        }
      }
      
      saveHistory();
      const loanMonthIdx = getMonthIndex(loan.month);
      const nowDate = new Date();
      const maxDayInLoanMonth = new Date(loan.year, loanMonthIdx + 1, 0).getDate();
      const actualPayDay = Math.min(nowDate.getDate(), maxDayInLoanMonth);
      const paymentDate = `${loan.year}-${String(loanMonthIdx + 1).padStart(2, '0')}-${String(actualPayDay).padStart(2, '0')}`;
      const newTxs = [];
      
      newTxs.push({
        id: 'hany-pay-' + getSafeId(),
        type: 'expense', 
        kind: 'financial',
        category: 'الالتزامات البنكية والتمويلية',
        amount: paidNow,
        description: `سداد مسحوبات هاني — ${loan.month} ${loan.year}`,
        method: 'cash',
        date: paymentDate,
        month: loan.month, 
        year: loan.year, 
        monthIndex: loanMonthIdx,
        subType: 'withdrawal', 
        status: 'paid',
        linkedLoanId: loan.id,
        settledHanyMonth: monthKey,
        createdAt: new Date().toISOString()
      });
      
      if (willCarry) {
        const nextMonthMaxDay = new Date(nextY, nextMIdx + 1, 0).getDate();
        const nextActualDay = Math.min(nowDate.getDate(), nextMonthMaxDay);
        const nextMonthDate = `${nextY}-${String(nextMIdx + 1).padStart(2, '0')}-${String(nextActualDay).padStart(2, '0')}`;
        newTxs.push({
          id: 'hany-carry-' + getSafeId(),
          type: 'expense', 
          kind: 'operational',
          category: 'مسحوبات محل هاني', 
          subCategory: 'رصيد مرحل',
          amount: newRemaining,
          description: `رصيد مرحل من ${loan.month} ${loan.year}`,
          method: 'cash',
          date: nextMonthDate,
          month: nextMonthName, 
          year: nextY, 
          monthIdx: nextMIdx,
          monthIndex: nextMIdx,
          subType: 'withdrawal', 
          status: 'pending',
          source: 'carryover', 
          carriedFromSource: 'hany-auto', 
          carryoverFrom: monthLabel
        });
      }
      
      const newSettled = Array.isArray(data.settledHanyMonths) ? [...data.settledHanyMonths, monthKey] : [monthKey];
      
      dispatch({
        type: 'SET_DATA',
        payload: {
          ...data,
          settledHanyMonths: newSettled,
          transactions: [...newTxs, ...transactions].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0))
        }
      });
      addNotification({ type: 'success', title: 'تمت التسوية', duration: 7000 });
    } finally {
      settlingRef.current = false;
    }
  };

  const totalLoans = useMemo(() => updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const totalReceivable = useMemo(() => updatedLoans.filter(l => l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const payables = useMemo(() => updatedLoans.filter(l => !l.isReceivable), [updatedLoans]);
  const receivables = useMemo(() => updatedLoans.filter(l => l.isReceivable), [updatedLoans]);
  const totalCards = useMemo(() => cards.reduce((acc, c) => acc + computeCardDebt(data, c), 0), [cards, data]);
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);

  const addLoan = () => {
    const nameCheck = validateText(newLoan.name, { min: 2, max: 200, label: 'الاسم' });
    if (!nameCheck.valid) { 
      addNotification({ type: 'error', title: 'خطأ', message: nameCheck.error }); 
      return; 
    }
    const amountCheck = validateAmount(newLoan.totalAmount, { min: 0.01, max: 10000000, label: 'المبلغ' });
    if (!amountCheck.valid) { 
      addNotification({ type: 'error', title: 'خطأ', message: amountCheck.error }); 
      return; 
    }
    saveHistory();
    dispatch({ 
      type: 'UPDATE_LOANS', 
      payload: [...updatedLoans, { 
        id: Date.now(), 
        name: nameCheck.value, 
        totalAmount: amountCheck.value, 
        prePaidAmount: 0, 
        monthlyInstallment: safeNumber(newLoan.monthlyInstallment), 
        dueDay: safeNumber(newLoan.dueDay, 1), 
        interest: '', 
        description: newLoan.description || '', 
        type: newLoan.isReceivable ? 'receivable' : 'debt', 
        isReceivable: newLoan.isReceivable, 
        paused: false 
      }] 
    });
    setShowAdd(false); 
    setNewLoan({ name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false });
    addNotification({ type: 'success', title: 'تمت الإضافة' });
  };

  const handleCollectReceivable = (loan, sourceTx) => {
    const d = new Date();
    const y = d.getFullYear(), m = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, y, m)) { 
      addNotification({ type: 'error', title: 'الشهر مغلق' }); 
      return; 
    }
    saveHistory();
    if (sourceTx) {
      dispatch({ 
        type: 'UPDATE_TRANSACTIONS', 
        payload: transactions.map(t => t.id === sourceTx.id ? { ...t, status: 'paid', date: getLocalISODate(d), sourceReceivableId: loan.id } : t) 
      });
      addNotification({ type: 'success', title: 'تم اعتماد القسط', message: `${fmt(sourceTx.amount)} ج.م` });
      return;
    }
    const orphanPending = transactions.find(t => 
      t.status !== 'paid' && t.month === m && (t.year || y) === y 
      && t.category === 'تكييف محمود' && !t.sourceReceivableId 
      && safeNumber(t.amount) === safeNumber(loan.monthlyInstallment)
    );
    if (orphanPending) {
      dispatch({ 
        type: 'UPDATE_TRANSACTIONS', 
        payload: transactions.map(t => t.id === orphanPending.id ? { ...t, status: 'paid', date: getLocalISODate(d), sourceReceivableId: loan.id } : t) 
      });
      addNotification({ type: 'success', title: 'تم اعتماد القيد المعلق', message: `${fmt(orphanPending.amount)} ج.م` });
      return;
    }
    const newTx = { 
      id: 'recv-manual-' + getSafeId(), 
      type: 'income', 
      kind: KIND.OPERATIONAL, 
      category: 'تكييف محمود', 
      amount: safeNumber(loan.monthlyInstallment), 
      description: `تحصيل قسط ${loan.name} — ${m} ${y}`, 
      method: 'cash', 
      date: getLocalISODate(d), 
      month: m, 
      year: y, 
      monthIndex: d.getMonth(), 
      subType: 'deposit', 
      status: 'paid', 
      sourceReceivableId: loan.id 
    };
    dispatch({ 
      type: 'UPDATE_TRANSACTIONS', 
      payload: [newTx, ...transactions].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) 
    });
    addNotification({ type: 'success', title: 'تم التحصيل', message: `${fmt(loan.monthlyInstallment)} ج.م` });
  };

  const handleTogglePause = (loan) => {
    saveHistory();
    dispatch({ type: 'UPDATE_LOANS', payload: (data.loans || []).map(l => l.id === loan.id ? { ...l, paused: !l.paused } : l) });
    addNotification({ type: loan.paused ? 'success' : 'warning', title: loan.paused ? 'تم التفعيل' : 'تم الإيقاف المؤقت' });
  };

  const toggleRecurringActive = (id) => {
    saveHistory();
    dispatch({ type: 'UPDATE_RECURRING_ITEMS', payload: recurringItems.map(r => r.id === id ? { ...r, active: r.active === false } : r) });
    addNotification({ type: 'success', title: 'تم التحديث' });
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="sub-tab-switcher">
        <button onClick={() => setActiveTab('loans')} className={`sub-tab-btn ${activeTab === 'loans' ? 'active' : ''}`}>
          <Banknote size={14} /> القروض والمستحقات
        </button>
        <button onClick={() => setActiveTab('custody')} className={`sub-tab-btn ${activeTab === 'custody' ? 'active' : ''}`}>
          <Briefcase size={14} /> العهدة 
          {custodySummary.balance !== 0 && <span className="badge badge-warning text-[9px] px-1.5 py-0">{fmt(custodySummary.balance)}</span>}
        </button>
      </div>

      {activeTab === 'custody' ? (
        <CustodyView data={data} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />
      ) : (
        <React.Fragment>
          <div className="card">
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>إجمالي المديونية الصافية</p>
            <h2 className="text-3xl font-black tracking-tight text-gradient">
              {fmt(totalLoans + totalCards - totalReceivable)}
              <span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <div className="grid grid-cols-3 gap-2 mt-3">
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">القروض</p>
                <p className="text-xs font-black text-red-600">{fmt(totalLoans)}</p>
              </div>
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">البطاقات</p>
                <p className="text-xs font-black text-red-600">{fmt(totalCards)}</p>
              </div>
              <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
                <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">مستحقات لك</p>
                <p className="text-xs font-black text-emerald-600">{fmt(totalReceivable)}</p>
              </div>
            </div>
            <div className="flex gap-2 mt-3 flex-wrap">
              <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs flex-1">
                <Plus size={14} /> إضافة التزام
              </button>
              <button onClick={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: true })} className="btn btn-secondary text-xs flex-1">
                <Repeat size={14} /> متكرر
              </button>
            </div>
          </div>

          {showAdd && (
            <Modal isOpen={true} onClose={() => setShowAdd(false)} title="التزام جديد" icon="📋">
              <div className="space-y-3">
                <div>
                  <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الاسم *</label>
                  <input className="input-field text-sm" value={newLoan.name} onChange={e => setNewLoan({ ...newLoan, name: e.target.value })} />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ *</label>
                    <input type="text" inputMode="decimal" className="input-field text-sm" value={newLoan.totalAmount} onChange={e => setNewLoan({ ...newLoan, totalAmount: e.target.value })} />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>القسط</label>
                    <input type="text" inputMode="decimal" className="input-field text-sm" value={newLoan.monthlyInstallment} onChange={e => setNewLoan({ ...newLoan, monthlyInstallment: e.target.value })} />
                  </div>
                </div>
                <label className="flex items-center gap-3 p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 cursor-pointer">
                  <input type="checkbox" checked={newLoan.isReceivable} onChange={e => setNewLoan({ ...newLoan, isReceivable: e.target.checked })} className="w-4 h-4 accent-emerald-600" />
                  <span className="text-xs font-bold text-emerald-700 dark:text-emerald-400">مستحق لي</span>
                </label>
                <button onClick={addLoan} className="btn btn-primary w-full py-2.5 text-sm">إضافة</button>
              </div>
            </Modal>
          )}

          {receivables.length > 0 && (
            <div className="space-y-2">
              <h3 className="font-black text-sm flex items-center gap-2 text-emerald-600">
                <TrendingUp size={14} /> مستحقات لك ({receivables.length})
              </h3>
              {receivables.map(loan => {
                const monthly = safeNumber(loan.monthlyInstallment);
                const explicitTotal = safeNumber(loan.totalInstallments);
                const explicitPaid = safeNumber(loan.paidInstallments);
                const remainingMonths = monthly > 0 ? Math.ceil(safeNumber(loan.remaining) / monthly) : 0;
                const totalMonths = explicitTotal > 0 ? explicitTotal : (explicitPaid + remainingMonths);
                const paidMonths = explicitTotal > 0 ? explicitPaid : Math.max(0, totalMonths - remainingMonths);
                const pct = safeNumber(loan.totalAmount) > 0 ? (safeNumber(loan.totalPaid) / safeNumber(loan.totalAmount)) * 100 : 0;
                const isComplete = loan.remaining <= 0.005;
                const thisMonthCollected = transactions.some(t => 
                  t.sourceReceivableId === loan.id && t.month === selectedMonth 
                  && (t.year || 2026) === selectedYear && t.status === 'paid'
                );
                const thisMonthPending = transactions.find(t => 
                  t.sourceReceivableId === loan.id && t.month === selectedMonth 
                  && (t.year || 2026) === selectedYear && t.status !== 'paid'
                );
                
                return (
                  <div key={loan.id} className="card">
                    <div className="flex justify-between items-start gap-3 flex-wrap mb-3">
                      <div className="flex items-center gap-3 flex-1 min-w-0">
                        <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400 flex-shrink-0">
                          <TrendingUp size={20} />
                        </div>
                        <div className="min-w-0">
                          <h4 className="font-bold text-sm truncate flex items-center gap-2 flex-wrap">
                            {loan.name}
                            {loan.paused && <span className="badge badge-warning text-[10px]">⏸ موقوف</span>}
                          </h4>
                          <p className="text-[11px] text-emerald-600 font-semibold mt-0.5">يوم {loan.dueDay} • {fmt(monthly)} ج.م شهريًا</p>
                        </div>
                      </div>
                      <div className="flex gap-1">
                        <button 
                          type="button" 
                          aria-label="إيقاف" 
                          onClick={() => handleTogglePause(loan)} 
                          className={`btn btn-ghost p-2 ${loan.paused ? 'text-emerald-500' : 'text-amber-500'}`}
                        >{loan.paused ? <CheckCircle2 size={16} /> : <Clock size={16} />}</button>
                        <button 
                          type="button" 
                          aria-label="تعديل" 
                          onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: loan })} 
                          className="btn btn-ghost p-2"
                        ><Edit size={16} /></button>
                      </div>
                    </div>
                    <div className="grid grid-cols-3 gap-2 mb-3">
                      <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
                        <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">محصّل</p>
                        <p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(loan.totalPaid)}</p>
                      </div>
                      <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
                        <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">المتبقي</p>
                        <p className="text-sm font-black text-blue-600 mt-0.5">{fmt(loan.remaining)}</p>
                      </div>
                      <div className="p-2.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-center">
                        <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">الأقساط</p>
                        <p className="text-sm font-black text-purple-600 mt-0.5">{paidMonths}/{totalMonths}</p>
                      </div>
                    </div>
                    <div className="w-full rounded-full h-1.5 overflow-hidden mb-3" style={{ background: 'var(--bg-muted)' }}>
                      <div className="bg-emerald-500 h-full rounded-full transition-all" style={{ width: `${Math.min(100, pct)}%` }}></div>
                    </div>
                    <div className="flex justify-end gap-2 flex-wrap">
                      {thisMonthCollected ? (
                        <div className="badge badge-success px-3 py-1.5">
                          <CheckCircle2 size={12} /> تم تحصيل {selectedMonth}
                        </div>
                      )
                       : isComplete ? (
                        <div className="badge badge-success px-3 py-1.5">
                          <CheckCircle2 size={12} /> اكتمل التحصيل
                        </div>
                      )
                       : loan.paused ? (
                        <div className="badge badge-warning px-3 py-1.5">⏸ موقوف</div>
                      )
                       : thisMonthPending ? (
                        <button onClick={() => handleCollectReceivable(loan, thisMonthPending)} className="btn btn-primary text-xs">
