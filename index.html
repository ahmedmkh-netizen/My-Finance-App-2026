  });

  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [authLoading, setAuthLoading] = useState(true);
  const [pinVerified, setPinVerified] = useState(() => sessionStorage.getItem('pin_verified') === 'yes');
  const [isDrawerOpen, setIsDrawerOpen] = useState(false);
  const [cloudSyncStatus, setCloudSyncStatus] = useState('pending');
  const [isSaving, setIsSaving] = useState(false);
  
  const saveTimeoutRef = useRef(null);
  const processingTimeoutRef = useRef(null);
  const saveLockRef = useRef(false);
  const lastRemoteRef = useRef(null);
  const lastMaterializeRef = useRef('');
  const isSavingRef = useRef(false);
  const hasReceivedInitialSnapshot = useRef(false);
  const initialSnapshotTimeoutRef = useRef(null);
  
  const currentTxRef = useRef([]);
  const dataRef = useRef(null);
  const budgetsRef = useRef({});
  
  const saveQueueRef = useRef(Promise.resolve());
  const cloudSaveRetriesRef = useRef(0);
  
  const { 
    data, activeTab, selectedYear, selectedMonth, transViewMode, catViewType, 
    isFormOpen, formMode, formData, isDarkMode, expandedGroup, budgets, 
    editingCard, editingLoan, searchTerm, editingBudgetCategory, budgetAmount, 
    isRecurringModalOpen, recurringFormData, notifications, history, 
    expandedLedgers, expandedCardsSection, statusFilter, confirmDialog, 
    isQuickTransferModalOpen, quickTransferData, viewingCardStatement, 
    isPinChangeOpen, isSmsModalOpen, pendingCloseModal, 
    walletVisibility, isProcessing, formErrors, activeCategoryDetail 
  } = state;
  
  const { 
    transactions = [], loans = [], cards = [], recurringItems = [], 
    accountsData = DEFAULT_ACCOUNTS, monthlyPlans = {} 
  } = data || {};

  const isOnline = useOnlineStatus();
  const prevOnlineRef = useRef(isOnline);

  useEffect(() => {
    currentTxRef.current = data?.transactions || [];
    dataRef.current = data;
    budgetsRef.current = budgets;
  }, [data?.transactions, data, budgets]);

  const addNotification = useCallback((notification) => dispatch({ type: 'ADD_NOTIFICATION', payload: notification }), []);
  const removeNotification = useCallback((id) => dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }), []);
  const saveHistory = useCallback(() => 
    dispatch({ 
      type: 'ADD_TO_HISTORY', 
      payload: { data: JSON.parse(JSON.stringify(data)), budgets: JSON.parse(JSON.stringify(budgets)) } 
    }), [data, budgets]);

  const queueCloudSave = useCallback((newData, options = {}) => {
    if (!isAuthenticated || !hasReceivedInitialSnapshot.current) return;
    const { silent = false } = options;
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
    
    saveQueueRef.current = saveQueueRef.current.then(async () => {
      try {
        if (!silent) setIsSaving(true);
        const payloadStr = JSON.stringify(newData);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(newData)); } catch {}
        
        const doc = await docRef.get();
        let finalData = { ...newData };
        
        if (doc.exists) {
          const remote = doc.data() || {};
          const remoteTx = Array.isArray(remote.transactions) ? remote.transactions : [];
          const localTx = Array.isArray(newData.transactions) ? newData.transactions : [];
          
          const permanentDeleted = new Set([...(newData.deletedTxIds || []), ...(remote.deletedTxIds || [])]);
          
          const mergedMap = new Map();
          remoteTx.forEach(t => { if (t?.id && !permanentDeleted.has(t.id)) mergedMap.set(t.id, t); });
          localTx.forEach(t => { if (t?.id && !permanentDeleted.has(t.id)) mergedMap.set(t.id, t); });
          
          finalData.transactions = Array.from(mergedMap.values()).filter(t => !t?.id || !(finalData.deletedTxIds || []).includes(t.id));
          finalData.deletedTxIds = Array.from(permanentDeleted).slice(-500);
          
          if (remote.budgets && typeof remote.budgets === 'object') {
            finalData.budgets = { ...remote.budgets, ...budgetsRef.current };
          }
        }
        
        await docRef.set({ ...finalData, budgets: finalData.budgets || budgetsRef.current }, { merge: true });
        lastRemoteRef.current = payloadStr;
        try { localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now())); } catch {}
        cloudSaveRetriesRef.current = 0;
      } catch (err) {
        console.error('Queue save failed:', err);
        throw err;
      } finally {
        if (!silent) setTimeout(() => setIsSaving(false), 800);
      }
    }).catch(async (err) => {
      console.error('❌ Queue save failed:', err);
      const retries = cloudSaveRetriesRef.current + 1;
      if (retries <= 3) {
        cloudSaveRetriesRef.current = retries;
        await new Promise(r => setTimeout(r, 3000));
        saveQueueRef.current = Promise.resolve();
        return queueCloudSave(newData, options);
      }
      cloudSaveRetriesRef.current = 0;
      saveQueueRef.current = Promise.resolve();
      setIsSaving(false);
    });
    
    return saveQueueRef.current;
  }, [isAuthenticated]);

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((user) => {
      setAuthLoading(false);
      setIsAuthenticated(!!(user && user.email === ALLOWED_EMAIL));
    });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!isAuthenticated) return;
    materializeShoppingRecurring();
    const interval = setInterval(materializeShoppingRecurring, 60 * 60 * 1000);
    return () => clearInterval(interval);
  }, [isAuthenticated]);

  // ─── Firestore Snapshot — Online-First (V84 priority) ───
  useEffect(() => {
    if (!isAuthenticated) return;
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
    
    initialSnapshotTimeoutRef.current = setTimeout(() => {
      if (!hasReceivedInitialSnapshot.current) {
        console.warn('⚠️ Firestore اتأخر — استخدام localStorage');
        hasReceivedInitialSnapshot.current = true;
        setCloudSyncStatus('offline');
      }
    }, 8000);

    const unsub = docRef.onSnapshot((doc) => {
      const isFirst = !hasReceivedInitialSnapshot.current;
      if (isFirst) {
        hasReceivedInitialSnapshot.current = true;
        if (initialSnapshotTimeoutRef.current) {
          clearTimeout(initialSnapshotTimeoutRef.current);
          initialSnapshotTimeoutRef.current = null;
        }
        setCloudSyncStatus('ready');
      }
      
      if (doc.exists) {
        const raw = doc.data();
        let migrated = migrateData(raw);
        
        const { transactions: cleanTx, removed } = dedupeRecurringTransactions(migrated.transactions || []);
        if (removed.length > 0) {
          const newArchive = [...(migrated.deletedTxArchive || [])];
          const newDeletedIds = [...(migrated.deletedTxIds || [])];
          removed.forEach(r => {
            if (r.tx) {
              newArchive.push({ 
                ...r.tx, deletedAt: new Date().toISOString(), deletedBy: 'dedupe', 
                originalStatus: r.tx.status || 'pending', reason: 'dedupe_' + r.reason 
              });
              newDeletedIds.push(r.tx.id);
            }
          });
          migrated = {
            ...migrated, transactions: cleanTx,
            deletedTxArchive: newArchive.slice(-500),
            deletedTxIds: Array.from(new Set(newDeletedIds)).slice(-500)
          };
          setTimeout(() => queueCloudSave(migrated, { silent: true }), 500);
        }
        
        const permanentDeleted = new Set([...(migrated.deletedTxIds || [])]);
        migrated.transactions = (migrated.transactions || []).filter(t => !t?.id || !permanentDeleted.has(t.id));
        
        const remoteIds = new Set(migrated.transactions.map(t => t.id));
        const localOnly = currentTxRef.current.filter(t => t?.id && !remoteIds.has(t.id) && !permanentDeleted.has(t.id));
        
        const now = Date.now();
        const localOnlyToUpload = localOnly.filter(t => {
          if (t.sourceRecurringId || t.recurringId) return true;
          if (t.createdAt) {
            const age = now - new Date(t.createdAt).getTime();
            if (age >= 0 && age < 60000) return true;
          }
          return false;
        });
        
        if (localOnlyToUpload.length > 0) {
          migrated.transactions = [...migrated.transactions, ...localOnlyToUpload];
          setTimeout(() => queueCloudSave(migrated, { silent: true }), 800);
        }
        
        const incoming = JSON.stringify(migrated);
        if (lastRemoteRef.current === incoming && !isFirst) return;
        lastRemoteRef.current = incoming;
        
        if (raw.budgets && typeof raw.budgets === 'object') {
          dispatch({ type: 'SET_BUDGETS', payload: raw.budgets });
        }
        dispatch({ type: 'SET_DATA', payload: migrated });
      }
    }, (error) => {
      console.error('❌ Firestore error:', error);
      if (!hasReceivedInitialSnapshot.current) {
        hasReceivedInitialSnapshot.current = true;
        setCloudSyncStatus('offline');
      }
    });

    return () => {
      unsub();
      if (initialSnapshotTimeoutRef.current) clearTimeout(initialSnapshotTimeoutRef.current);
    };
  }, [isAuthenticated, queueCloudSave]);
  
  useEffect(() => {
    if (!isAuthenticated || !data?.transactions) return;
    if (!hasReceivedInitialSnapshot.current) return;
    
    if (cloudSyncStatus === 'offline') {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
      return;
    }
    
    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(() => {
      if (isSavingRef.current) return;
      const payloadStr = JSON.stringify(data);
      if (lastRemoteRef.current && payloadStr === lastRemoteRef.current) return;
      isSavingRef.current = true;
      const safetyTimer = setTimeout(() => { isSavingRef.current = false; }, 8000);
      
      queueCloudSave(data, { silent: true }).finally(() => {
        clearTimeout(safetyTimer);
        isSavingRef.current = false;
      });
    }, 2000);
    return () => clearTimeout(saveTimeoutRef.current);
  }, [data, isAuthenticated, cloudSyncStatus, queueCloudSave]);
  
  useEffect(() => {
    if (!isAuthenticated || !data?.recurringItems?.length) return;
    const today = getLocalISODate();
    const activeCount = data.recurringItems.filter(r => r.active !== false).length;
    const loansSig = (data.loans || []).filter(l => l.systemId === SYSTEM_LOAN_IDS.TAKYEEF).map(l => `${l.id}:${l.prePaidAmount}:${l.totalAmount}`).join('|');
    const sig = `${today}_${data.recurringItems.length}_${activeCount}_${loansSig}`;
    if (lastMaterializeRef.current === sig) return;
    lastMaterializeRef.current = sig;
    
    let updated = materializeRecurringItems(data, today);
    if (updated) {
      const permanentDeleted = new Set(data.deletedTxIds || []);
      const filteredTx = updated.transactions.filter(t => !permanentDeleted.has(t.id));
      if (filteredTx.length !== updated.transactions.length) {
        updated = { ...updated, transactions: filteredTx };
      }
      const added = updated.transactions.length - (data.transactions?.length || 0);
      dispatch({ type: 'SET_DATA', payload: updated });
      setTimeout(() => queueCloudSave(updated, { silent: true }), 200);
      
      if (added > 0) {
        addNotification({ type: 'info', title: 'تم توليد التزامات شهرية', message: `${added} بند بانتظار الاعتماد`, duration: 6000 });
      }
    }
  }, [isAuthenticated, data?.recurringItems, data?.transactions?.length, data?.loans, addNotification, queueCloudSave]);

  useEffect(() => {
    if (!isAuthenticated || cloudSyncStatus !== 'offline') return;
    let cancelled = false;
    const retryTimer = setInterval(async () => {
      if (cancelled) return;
      try {
        await db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc).get({ source: 'server' });
        if (cancelled) return;
        hasReceivedInitialSnapshot.current = true;
        setCloudSyncStatus('ready');
        addNotification({ type: 'success', title: 'تم استعادة الاتصال بالسحابة', duration: 4000 });
      } catch {}
    }, 30000);
    return () => { cancelled = true; clearInterval(retryTimer); };
  }, [isAuthenticated, cloudSyncStatus, addNotification]);

  useEffect(() => {
    if (prevOnlineRef.current !== isOnline) {
      if (isOnline) {
        addNotification({ type: 'success', title: 'تم استعادة الاتصال', message: 'جاري المزامنة...', duration: 4000 });
        if (cloudSyncStatus === 'offline') setCloudSyncStatus('pending');
      } else {
        addNotification({ type: 'warning', title: 'انقطع الاتصال', message: 'التغييرات محفوظة محلياً', duration: 6000 });
      }
      prevOnlineRef.current = isOnline;
    }
  }, [isOnline, addNotification, cloudSyncStatus]);

  const cancelProcessing = useCallback(() => {
    if (processingTimeoutRef.current) { clearTimeout(processingTimeoutRef.current); processingTimeoutRef.current = null; }
    saveLockRef.current = false;
    dispatch({ type: 'SET_IS_PROCESSING', payload: false });
    addNotification({ type: 'info', title: 'تم الإلغاء' });
  }, [addNotification]);

  const liveBalances = useMemo(() => { 
    const b = {}; ACCOUNT_KEYS.forEach(k => { b[k] = computeBalance(data, k); }); return b; 
  }, [data]);
  
  const totalLiquidity = useMemo(() => ACCOUNT_KEYS.reduce((s, k) => s + liveBalances[k], 0), [liveBalances]);
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);

  const financeSnapshot = useMemo(() => {
    const actualCashInHand = computeBalance(data, 'cash', endOfToday());
    const today = endOfToday();
    const curMonth = transactions.filter(t => t.month === selectedMonth && (t.year || new Date(t.date).getFullYear()) === selectedYear);
    
    const actualIncome = curMonth.filter(t => t.type === 'income' && t.status === 'paid' && t.method === 'cash' && (parseISODate(t.date) || new Date()) <= today)
      .reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncome = curMonth.filter(t => t.type === 'income' && t.status !== 'paid' && t.method === 'cash')
      .reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncomeAll = curMonth.filter(t => t.type === 'income' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingExpensesAll = curMonth.filter(t => t.type === 'expense' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidExpensesAll = curMonth.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    
    return { 
      actualIncome, pendingIncome, actualCashInHand, pendingIncomeAll, pendingExpensesAll, paidExpensesAll,
      projectedClosingBalance: actualCashInHand + pendingIncomeAll - pendingExpensesAll 
    };
  }, [data, transactions, selectedYear, selectedMonth]);

  const chartData = useMemo(() => {
    const byMonth = new Map();
    transactions.forEach(t => {
      if (t.status !== 'paid') return;
      const y = t.year || 2026;
      if (y !== selectedYear) return;
      if (!byMonth.has(t.month)) byMonth.set(t.month, { income: 0, expense: 0 });
      const b = byMonth.get(t.month);
      if (t.type === 'income') b.income += safeNumber(t.amount);
      else if (t.type === 'expense') b.expense += safeNumber(t.amount);
    });
    return getMonthsForYear(selectedYear).map(m => ({
      name: m.slice(0, 3),
      دخل: byMonth.get(m)?.income || 0,
      مصروف: byMonth.get(m)?.expense || 0
    }));
  }, [transactions, selectedYear]);

  const updatedLoans = useMemo(() => {
    const permanentlyDeleted = new Set(data?.deletedTxIds || []);
    const map = transactions.reduce((acc, t) => { 
      if (t.linkedLoanId && t.status === 'paid') acc[t.linkedLoanId] = (acc[t.linkedLoanId] || 0) + safeNumber(t.amount); 
      return acc; 
    }, {});
    const receivablesPaidMap = transactions.reduce((acc, t) => { 
      if (t.sourceReceivableId && t.status === 'paid') acc[t.sourceReceivableId] = (acc[t.sourceReceivableId] || 0) + safeNumber(t.amount); 
      return acc; 
    }, {});
    const paymentsByLoanId = transactions.reduce((acc, t) => {
      if (t.linkedLoanId && t.status === 'paid') {
        if (!acc[t.linkedLoanId]) acc[t.linkedLoanId] = [];
        acc[t.linkedLoanId].push(t);
      }
      return acc;
    }, {});
    
    const txByKey = new Map();
    transactions.forEach(t => {
      if (t.type !== 'expense' || !t.category || permanentlyDeleted.has(t.id)) return;
      const key = `${t.category}|${t.year || 2026}|${t.month}`;
      if (!txByKey.has(key)) txByKey.set(key, []);
      txByKey.get(key).push(t);
    });
    
    const regular = loans.filter(l => !l.autoMonthly && !l.isReceivable).map(l => ({ 
      ...l, isReceivable: l.type === 'receivable' || !!l.isReceivable, 
      totalPaid: safeNumber(l.prePaidAmount) + (map[l.id] || 0), 
      remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (map[l.id] || 0))) 
    }));
    
    const receivables = loans.filter(l => l.isReceivable).map(l => ({ 
      ...l, isReceivable: true, paused: !!l.paused, 
      totalPaid: safeNumber(l.prePaidAmount) + (receivablesPaidMap[l.id] || 0), 
      remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (receivablesPaidMap[l.id] || 0))) 
    }));
    
    const autoMonthly = [];
    const allMonths = YEARS_LIST.flatMap(y => getMonthsForYear(y).map(m => ({ year: y, month: m })));
    
    loans.filter(l => l.autoMonthly).forEach(tpl => {
      allMonths.forEach(({ year, month }) => {
        const monthKey = makeMonthKey(year, month);
        if (tpl.mergeIntoNextCycle && tpl.mergeIntoNextCycle.includes(monthKey)) return;
        
        let monthTx = txByKey.get(`${tpl.category}|${year}|${month}`) || [];
        const prevMonthIdx = getMonthIndex(month) - 1;
        let prevYear = year, prevMonthName;
        if (prevMonthIdx < 0) { prevMonthName = ALL_MONTHS[11]; prevYear = year - 1; } 
        else { prevMonthName = ALL_MONTHS[prevMonthIdx]; }
        const prevMonthKey = makeMonthKey(prevYear, prevMonthName);
        
        if (tpl.mergeIntoNextCycle && tpl.mergeIntoNextCycle.includes(prevMonthKey)) {
          const prevMonthTx = txByKey.get(`${tpl.category}|${prevYear}|${prevMonthName}`) || [];
          monthTx = [...prevMonthTx, ...monthTx];
        }
        if (monthTx.length === 0) return;
        
        const dueDay = safeNumber(tpl.dueDay, 5);
        let dueMonthIdx = getMonthIndex(month) + (tpl.dueNextMonth ? 1 : 0);
        let dueYear = year;
        if (dueMonthIdx > 11) { dueMonthIdx = 0; dueYear++; }
        const dueDateISO = `${dueYear}-${String(dueMonthIdx + 1).padStart(2, '0')}-${String(dueDay).padStart(2, '0')}`;
        const total = monthTx.reduce((s, t) => s + safeNumber(t.amount), 0);
        const compositeId = `auto-${tpl.id}-${year}-${month}`;
        const repayments = safeNumber(map[compositeId]);
        
        autoMonthly.push({ 
          ...tpl, id: compositeId, name: `${tpl.name} - ${month} ${year}`, 
          totalAmount: total, prePaidAmount: 0, monthlyInstallment: 0, 
          remaining: Math.max(0, total - repayments), totalPaid: repayments, 
          dueDate: dueDateISO, dueDay, description: `${monthTx.length} مسحوبة`, autoGenerated: true, 
          month, year, 
          items: monthTx.slice().sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)),
          payments: (paymentsByLoanId[compositeId] || []).slice().sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0))
        });
      });
    });
    
    const sortedAuto = autoMonthly.sort((a, b) => { 
      if (a.year !== b.year) return b.year - a.year; 
      return getMonthIndex(b.month) - getMonthIndex(a.month); 
    });
    
    return [...sortedAuto, ...receivables, ...regular];
  }, [transactions, loans, data?.deletedTxIds]);

  const monthInsights = useMemo(() => {
    const m = transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
    const inc = m.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const exp = m.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    return { inc, exp, net: inc - exp };
  }, [transactions, selectedYear, selectedMonth]);

  const groupedTransactions = useMemo(() => {
    const groups = {};
    const term = normalizeText(searchTerm);
    transactions.filter(t => {
      if (t.month !== selectedMonth || (t.year || 2026) !== selectedYear) return false;
      if (transViewMode !== 'all' && t.type !== transViewMode) return false;
      if (searchTerm && !normalizeText(t.description).includes(term) && !normalizeText(t.category).includes(term)) return false;
      if (statusFilter === 'paid' && t.status !== 'paid') return false;
      if (statusFilter === 'pending' && t.status === 'paid') return false;
      return true;
    }).forEach(t => {
      if (!groups[t.category]) groups[t.category] = { category: t.category, total: 0, count: 0, items: [] };
      groups[t.category].total += safeNumber(t.amount);
      groups[t.category].count++;
      groups[t.category].items.push(t);
    });
    return Object.values(groups).sort((a, b) => b.total - a.total);
  }, [transactions, selectedYear, selectedMonth, transViewMode, searchTerm, statusFilter]);

  const buildLedger = useCallback((methodId) => {
    const cutoffDay = dayStart(getAccountCutoff(accountsData, methodId));
    const acc = transactions
      .filter(t => 
        t.method === methodId && t.status === 'paid' && t.source !== 'carryover'
        && !(methodId === 'cash' && isHanyShopCategory(t.category))
        && (parseISODate(t.date) || new Date(0)) >= cutoffDay
      )
      .sort((a, b) => (parseISODate(a.date) || 0) - (parseISODate(b.date) || 0));
    let bal = safeNumber(accountsData?.[methodId]?.balance);
    return acc.map(t => { 
      const a = safeNumber(t.amount); 
      bal += (t.subType === 'deposit') ? a : -a; 
      return { ...t, runningBalance: bal }; 
    }).reverse();
  }, [transactions, accountsData]);

  const getAgendaItems = useCallback(() => {
    try {
      const today = new Date();
      const cd = today.getDate(), cm = today.getMonth(), cy = today.getFullYear();
      const items = [];
      
      cards.forEach(c => {
        const d = parseInt(c.dueDate) || 5;
        let tm = cm, ty = cy;
        if (d < cd) { tm++; if (tm > 11) { tm = 0; ty++; } }
        items.push({ 
          id: `ag-card-${c.id}`, title: `سداد ${c.bank} - ${c.name}`, 
          date: getLocalISODate(new Date(ty, tm, d)),

          type: 'warning', icon: CreditCard, desc: 'استحقاق دوري' 
        });
      });
      
      updatedLoans.forEach(l => {
        if (safeNumber(l.monthlyInstallment) > 0 && l.remaining > 0 && !l.autoGenerated && !l.isReceivable) {
          const d = parseInt(l.dueDay) || 1;
          let tm = cm, ty = cy;
          if (d < cd) { tm++; if (tm > 11) { tm = 0; ty++; } }
          if (isLoanActiveInMonth(l, ty, ALL_MONTHS[tm])) {
            items.push({ 
              id: `ag-loan-${l.id}`, title: `قسط ${l.name}`, 
              date: getLocalISODate(new Date(ty, tm, d)), 
              amount: safeNumber(l.monthlyInstallment), 
              type: 'danger', icon: Banknote, desc: l.description 
            });
          }
        }
        if (l.isReceivable && !l.paused && l.remaining > 0 && safeNumber(l.monthlyInstallment) > 0) {
          const d = parseInt(l.dueDay) || 1;
          let tm = cm, ty = cy;
          if (d < cd) { tm++; if (tm > 11) { tm = 0; ty++; } }
          items.push({ 
            id: `ag-recv-${l.id}`, title: `تحصيل ${l.name}`, 
            date: getLocalISODate(new Date(ty, tm, d)), 
            amount: safeNumber(l.monthlyInstallment), 
            type: 'success', icon: TrendingUp, desc: '💰 مستحق لك' 
          });
        }
      });
      
      recurringItems.forEach(r => {
        if (r.active === false || r.linkedLoanSystemId) return;
        const d = parseInt(r.day) || 1;
        let tm = cm, ty = cy;
        if (d < cd) { tm++; if (tm > 11) { tm = 0; ty++; } }
        const targetInputMonth = `${ty}-${String(tm + 1).padStart(2, '0')}`;
        if (r.startMonth && targetInputMonth < r.startMonth) return;
        if (r.endMonth && targetInputMonth > r.endMonth) return;
        const isIncome = r.type === 'income';
        const isFee = BANK_FEE_CATEGORIES.has(r.category);
        const isMonthlyBen = isBeneficiaryCategorySafe(r.category);
        const desc = isIncome ? '💰 دخل شهري' : isMonthlyBen ? '👨‍👩‍👧 مصروف شهري' : isFee ? '🏦 رسم بنكي' : 'التزام متكرر';
        const icon = isIncome ? TrendingUp : isMonthlyBen ? Users : isFee ? Receipt : Repeat;
        items.push({ 
          id: `ag-rec-${r.id}`, date: getLocalISODate(new Date(ty, tm, d)), 
          title: r.title, amount: safeNumber(r.amount), 
          type: isIncome ? 'success' : 'warning', icon, desc 
        });
      });
      
      return items.sort((a, b) => (parseISODate(a.date) || 0) - (parseISODate(b.date) || 0));
    } catch (err) { console.error(err); return []; }
  }, [cards, updatedLoans, recurringItems, data]);

  const handleAddWalletDeposit = useCallback((k) => openWalletForm(k, 'deposit'), [openWalletForm]);
  const handleAddWalletWithdrawal = useCallback((k) => openWalletForm(k, 'withdrawal'), [openWalletForm]);

  const handleSaveTransaction = useCallback((e) => {
    e.preventDefault();
    if (isProcessing || saveLockRef.current) return;
    saveLockRef.current = true;
    const errors = {};
    
    const amountCheck = validateAmount(formData.amount);
    if (!amountCheck.valid) errors.amount = amountCheck.error;
    if (!formData.category) errors.category = 'اختر الفئة';
    if (!formData.date) errors.date = 'اختر التاريخ';
    
    if (Object.keys(errors).length > 0) { 
      saveLockRef.current = false; 
      dispatch({ type: 'SET_FORM_ERRORS', payload: errors }); 
      addNotification({ type: 'error', title: Object.values(errors)[0] }); 
      return; 
    }
    
    const amount = amountCheck.value;
    const d = parseISODate(formData.date);
    if (!d) { saveLockRef.current = false; addNotification({ type: 'error', title: 'تاريخ غير صالح' }); return; }
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    
    if (formMode === 'edit') {
      const orig = transactions.find(t => t.id === formData.id);

    processingTimeoutRef.current = setTimeout(() => {

        dispatch({ type: 'UPDATE_TRANSACTIONS', payload: next });

      saveLockRef.current = false;

      processingTimeoutRef.current = null;

  }, [formData, formMode, transactions, data, saveHistory, addNotification, isProcessing, cards]);

  const handleDelete = useCallback((id, reason = 'user_action') => {
    const freshTx = currentTxRef.current;
    const freshData = dataRef.current;
    const target = freshTx.find(t => t.id === id);
    if (!target) return;
    
    if (isMonthClosed(freshData, target.year || 2026, target.month)) { addNotification({ type: 'error', title: 'الشهر مغلق' }); return; }
    
    const isTransfer = !!target.linkedTransferId;
    const linkedIds = isTransfer ? freshTx.filter(t => t.linkedTransferId === target.linkedTransferId).map(t => t.id) : [id];
    const linkedCount = linkedIds.length;
    
    if (isTransfer) {
      const blockedLink = linkedIds.map(lid => freshTx.find(x => x.id === lid)).find(t => t && isMonthClosed(freshData, t.year || 2026, t.month));
      if (blockedLink) { addNotification({ type: 'error', title: 'قيد مرافق في شهر مغلق' }); return; }
    }
    
    dispatch({ 
      type: 'SHOW_CONFIRM', danger: true, 
      title: isTransfer ? `حذف التحويل (${linkedCount} قيود)` : 'تأكيد الحذف', 
      message: isTransfer ? `${linkedCount} قيود مترابطة ستُحذف معاً` : 'سيتم نقلها للأرشيف', 
      onConfirm: () => {
        const latestTx = currentTxRef.current;
        const latestData = dataRef.current;
        saveHistory();
        const tombstones = [];
        linkedIds.forEach(lid => {
          const t = latestTx.find(x => x.id === lid);
          if (!t) return;
          tombstones.push({
            ...t, deletedAt: new Date().toISOString(),
            deletedBy: isFamilyTx(t) ? (t.createdBy || 'family') : 'self',
            originalStatus: t.status || 'pending', reason
          });
        });
        
        const newArchive = [...(latestData.deletedTxArchive || []), ...tombstones].slice(-500);
        const linkedSet = new Set(linkedIds);
        const persistedDeleted = Array.from(new Set([...(latestData.deletedTxIds || []), ...linkedIds])).slice(-500);
        const finalTx = latestTx.filter(t => !linkedSet.has(t.id) && !persistedDeleted.includes(t.id));
        const newMaterialized = { ...(latestData.materializedRecurring || {}) };
        tombstones.forEach(t => {
          if (t.sourceRecurringId && t.year && t.month) 
            newMaterialized[`${t.sourceRecurringId}_${makeMonthKey(t.year, t.month)}`] = 'deleted';
        });
        
        const newData = { 
          ...latestData, transactions: finalTx, deletedTxArchive: newArchive, 
          deletedTxIds: persistedDeleted, materializedRecurring: newMaterialized 
        };
        dispatch({ type: 'SET_DATA', payload: newData });
        queueCloudSave(newData);
        addNotification({ type: 'success', title: `تم حذف ${linkedCount} قيد` });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  }, [saveHistory, addNotification, queueCloudSave]);

  const handleBulkDeleteInApp = useCallback((ids) => {

    const latestTx = currentTxRef.current;
    const latestData = dataRef.current;
    const expandedSet = new Set(ids);
    ids.forEach(id => {
      const t = latestTx.find(x => x.id === id);

    });
    const finalIds = Array.from(expandedSet);
    const idsSet = new Set(finalIds);
    
    const tombstones = finalIds.map(id => {
      const t = latestTx.find(x => x.id === id);
      if (!t) return null;
      return { 
        ...t, deletedAt: new Date().toISOString(), 
        deletedBy: isFamilyTx(t) ? (t.createdBy || 'family') : 'self', 
        originalStatus: t.status || 'pending', reason: 'bulk_delete' 
      };
    }).filter(Boolean);
    
    const newArchive = [...(latestData.deletedTxArchive || []), ...tombstones].slice(-500);

    if (!d) { saveLockRef.current = false; addNotification({ type: 'error', title: 'تاريخ غير صحيح' }); return; }
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { saveLockRef.current = false; addNotification({ type: 'error', title: 'محظور' }); return; }
    if (!quickTransferData.beneficiaryId) { saveLockRef.current = false; addNotification({ type: 'error', title: 'اختر المستفيد' }); return; }
    
    dispatch({ type: 'SET_IS_PROCESSING', payload: true });
    processingTimeoutRef.current = setTimeout(() => {
      saveHistory();
      const date = getLocalISODate(d);
      const ben = BENEFICIARIES.find(b => b.id === quickTransferData.beneficiaryId);
      const isFromBank = quickTransferData.from === 'cib_savings' || quickTransferData.from === 'aaib_savings';
      const useTelda = isFromBank && ben.hasTelda && !quickTransferData.forceCash;
      
      const newTx = {
        id: 'monthly-' + getSafeId(), type: 'expense', kind: KIND.OPERATIONAL,
        category: `مصروف شهري - ${ben.label}`, amount,
        description: useTelda ? `مصروف شهري - ${ben.label} (عبر Telda)` : `مصروف شهري - ${ben.label}`,
        method: quickTransferData.from,
        transferChannel: useTelda ? ben.method : undefined,
        date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
        subType: 'withdrawal', status: 'paid', beneficiaryId: ben.id,
        createdAt: new Date().toISOString()
      };
      
      dispatch({ 
        type: 'UPDATE_TRANSACTIONS', 
        payload: [newTx, ...transactions].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) 
      });
      dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
      dispatch({ 
        type: 'SET_QUICK_TRANSFER_DATA', 
        payload: { 
          transferMode: 'monthly', from: 'cib_savings', to: 'fawry', amount: '', 
          transferType: 'monthly', date: getLocalISODate(), beneficiaryId: null, 
          forceCash: false, internalFrom: 'cib_savings', internalTo: 'fawry', 
          internalFees: '', internalDescription: '' 
        } 
      });
      addNotification({ type: 'success', title: 'تم التسجيل' });
      saveLockRef.current = false;
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
      processingTimeoutRef.current = null;
    }, 600);
  }, [quickTransferData, data, transactions, saveHistory, addNotification, isProcessing]);

  const handleUpdateLoan = useCallback((e) => {
    e.preventDefault();
    saveHistory();
    dispatch({ 
      type: 'UPDATE_LOANS', 
      payload: loans.map(l => l.id === editingLoan.id ? { 
        ...editingLoan, totalAmount: safeNumber(editingLoan.totalAmount), 
        prePaidAmount: safeNumber(editingLoan.prePaidAmount), 
        monthlyInstallment: safeNumber(editingLoan.monthlyInstallment), 
        dueDay: safeNumber(editingLoan.dueDay, 1), paused: !!editingLoan.paused, 
        totalInstallments: safeNumber(editingLoan.totalInstallments), 
        paidInstallments: safeNumber(editingLoan.paidInstallments) 
      } : l) 
    });
    dispatch({ type: 'SET_EDITING_LOAN', payload: null });
    addNotification({ type: 'success', title: 'تم التحديث' });
  }, [loans, editingLoan, saveHistory, addNotification]);

  const handleUpdateCard = useCallback((e) => {
    e.preventDefault();
    saveHistory();
    dispatch({ 
      type: 'UPDATE_CARDS', 
      payload: cards.map(c => c.id === editingCard.id ? { 
        ...editingCard, limit: safeNumber(editingCard.limit), 
        availableBalance: Math.max(0, safeNumber(editingCard.limit) - safeNumber(editingCard.openingDebt)), 
        openingDebt: safeNumber(editingCard.openingDebt), 
        cashbackRate: safeNumber(editingCard.cashbackRate, 1), 
        openingDate: editingCard.openingDate || CUTOFF_DATE_2026_09_30,
        subCardLast4: Array.isArray(editingCard.subCardLast4) ? editingCard.subCardLast4 : [] 
      } : c) 
    });
    dispatch({ type: 'SET_EDITING_CARD', payload: null });
    addNotification({ type: 'success', title: 'تم التحديث' });
  }, [cards, editingCard, saveHistory, addNotification]);

  const handleSaveBudget = useCallback(() => {
    saveHistory();
    const nb = { ...budgets, [editingBudgetCategory]: parseNumberInput(budgetAmount) };
    dispatch({ type: 'SET_BUDGETS', payload: nb });
    dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null });
    dispatch({ type: 'SET_BUDGET_AMOUNT', payload: '' });
    addNotification({ type: 'success', title: 'تم الحفظ' });
  }, [budgets, editingBudgetCategory, budgetAmount, saveHistory, addNotification]);

  const handleSaveRecurring = useCallback((e) => {
    e.preventDefault();
    const titleCheck = validateText(recurringFormData.title, { min: 2, max: 100, label: 'العنوان' });
    if (!titleCheck.valid) { addNotification({ type: 'error', title: titleCheck.error }); return; }
    const amountCheck = validateAmount(recurringFormData.amount);
    if (!amountCheck.valid) { addNotification({ type: 'error', title: amountCheck.error }); return; }
    saveHistory();
    
    const payload = { 
      title: titleCheck.value, amount: amountCheck.value, day: safeNumber(recurringFormData.day, 1), 
      category: recurringFormData.category, type: recurringFormData.type, 
      startMonth: recurringFormData.startMonth || null, endMonth: recurringFormData.endMonth || null, 
      active: recurringFormData.active !== false, kind: recurringFormData.kind || null, 
      linkedLoanSystemId: recurringFormData.linkedLoanSystemId || null, 
      linkedCardId: recurringFormData.linkedCardId || null, 
      method: recurringFormData.method || 'cash', 
      transferChannel: recurringFormData.transferChannel || null 
    };
    
    if (recurringFormData.id) {
      dispatch({ 
        type: 'UPDATE_RECURRING_ITEMS', 
        payload: recurringItems.map(r => r.id === recurringFormData.id ? { ...r, ...payload } : r) 
      });
      addNotification({ type: 'success', title: 'تم تحديث البند' });
    } else {
      dispatch({ 
        type: 'UPDATE_RECURRING_ITEMS', 
        payload: [...recurringItems, { ...payload, id: 'r-' + getSafeId() }] 
      });
      addNotification({ type: 'success', title: 'تمت الإضافة' });
    }
    
    dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false });
    dispatch({ 
      type: 'SET_RECURRING_FORM_DATA', 
      payload: { 
        title: '', amount: '', day: 1, category: 'أخرى', type: 'expense', 
        startMonth: '2026-10', endMonth: '', active: true, method: 'cash', 
        kind: null, linkedLoanSystemId: null, linkedCardId: null, transferChannel: null 
      } 
    });
  }, [recurringFormData, recurringItems, saveHistory, addNotification]);

  const deleteRecurring = useCallback((id) => {
    const pendingFromThis = (data.transactions || []).filter(t => t.sourceRecurringId === id && t.status !== 'paid');
    const blocked = pendingFromThis.find(t => isMonthClosed(data, t.year || 2026, t.month));
    if (blocked) { addNotification({ type: 'error', title: `لا يمكن الحذف — شهر ${blocked.month} مغلق` }); return; }
    
    dispatch({ 
      type: 'SHOW_CONFIRM', danger: true, title: 'حذف الالتزام', message: 'سيتم حذف البند والقيود المعلقة', 
      onConfirm: () => {
        saveHistory();
        const isDefault = DEFAULT_RECURRING.some(dr => dr.id === id);
        const newDeletedDefaults = isDefault ? Array.from(new Set([...(data.deletedDefaultIds || []), id])) : (data.deletedDefaultIds || []);
        const newRecurring = recurringItems.filter(i => i.id !== id);
        const newTx = (data.transactions || []).filter(t => !(t.sourceRecurringId === id && t.status !== 'paid'));
        const newMaterialized = { ...(data.materializedRecurring || {}) };
        Object.keys(newMaterialized).forEach(k => { if (k.startsWith(id + '_')) delete newMaterialized[k]; });
        dispatch({ 
          type: 'SET_DATA', 
          payload: { 
            ...data, recurringItems: newRecurring, transactions: newTx, 
            deletedDefaultIds: newDeletedDefaults, materializedRecurring: newMaterialized 
          } 
        });
        addNotification({ type: 'success', title: 'تم الحذف' });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  }, [recurringItems, data, saveHistory, addNotification]);

  const handlePendingCloseAction = useCallback((action) => {
    const { pending, month, year } = pendingCloseModal;
    if (!pending || pending.length === 0) return;
    
    if (action === 'carry') {
      const idx = getMonthIndex(month);
      const nextMonth = idx === 11 ? ALL_MONTHS[0] : ALL_MONTHS[idx + 1];
      const nextYear = idx === 11 ? year + 1 : year;
      const nextKey = makeMonthKey(nextYear, nextMonth);
      if ((data.closedMonths || []).includes(nextKey)) { 
        addNotification({ type: 'error', title: `شهر ${nextMonth} ${nextYear} مغلق` }); return; 
      }
    }
    
    saveHistory();
    const pendingIds = pending.map(t => t.id);
    dispatch({ type: 'CLOSE_MONTH_AFTER_RESOLVE', payload: { year, month, resolveAction: action, pendingIds } });
    const actionText = action === 'approve' ? 'تم الاعتماد والإقفال' : action === 'carry' ? 'تم الترحيل والإقفال' : 'تم الحذف والإقفال';
    addNotification({ type: 'success', title: actionText });
  }, [pendingCloseModal, data, saveHistory, addNotification]);

  useEffect(() => { try { localStorage.setItem('budgets', JSON.stringify(budgets)); } catch {} }, [budgets]);
  useEffect(() => { 
    document.documentElement.classList.toggle('dark', isDarkMode); 
    localStorage.setItem('theme', isDarkMode ? 'dark' : 'light'); 
  }, [isDarkMode]);
  useEffect(() => { 
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDarkMode ? '#0B1220' : '#F8FAFC'); 
  }, [isDarkMode]);
  useEffect(() => () => { 
    if (processingTimeoutRef.current) clearTimeout(processingTimeoutRef.current); 
    saveLockRef.current = false; 
  }, []);

  if (authLoading) return (
    <div className="flex h-screen items-center justify-center" style={{ background: '#0B1220' }}>
      <div className="w-12 h-12 border-[3px] border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>
  );
  
  if (isAuthenticated && cloudSyncStatus === 'pending') {
    return (
      <div className="flex h-screen flex-col items-center justify-center" style={{ background: '#0B1220' }}>
        <div className="w-12 h-12 border-[3px] border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p className="text-white font-bold text-sm mb-1">جاري مزامنة البيانات...</p>
        <p className="text-xs" style={{ color: '#64748B' }}>بنستقبل آخر نسخة من السحابة</p>
      </div>
    );
  }
  
  if (!isAuthenticated) return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
  
  if (!pinVerified) return (
    <PinLockScreen 
      onSuccess={() => { sessionStorage.setItem('pin_verified', 'yes'); setPinVerified(true); }} 
      onLogout={() => { 
        firebase.auth().signOut(); setIsAuthenticated(false); 
        sessionStorage.removeItem('pin_verified'); setPinVerified(false); 
      }} 
    />
  );

  const renderActiveView = () => {
    switch (activeTab) {
      case 'dashboard': 
        return <DashboardView 
          data={data} financeSnapshot={financeSnapshot} liveBalances={liveBalances} 
          totalLiquidity={totalLiquidity} walletVisibility={walletVisibility} 
          onToggleVisibility={(k) => dispatch({ type: 'TOGGLE_WALLET_VISIBILITY', payload: k })} 
          dispatch={dispatch} selectedYear={selectedYear} selectedMonth={selectedMonth} 
          transactions={transactions} cards={cards} updatedLoans={updatedLoans} 
          chartData={chartData} isDarkMode={isDarkMode} 
          onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} 
          onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} 
        />;
      case 'transactions': 
        return <TransactionsView 
          groupedTransactions={groupedTransactions} transactions={transactions} 
          selectedMonth={selectedMonth} selectedYear={selectedYear} 
          transViewMode={transViewMode} statusFilter={statusFilter} 
          searchTerm={searchTerm} expandedGroup={expandedGroup} data={data} 
          monthInsights={monthInsights} dispatch={dispatch} 
          handleDelete={handleDelete} addNotification={addNotification} 
          onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} 
          onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} 
          saveHistory={saveHistory} onBulkDelete={handleBulkDeleteInApp} 
        />;
      case 'categories': 
        return <CategoriesView 
          transactions={transactions} selectedMonth={selectedMonth} selectedYear={selectedYear} 
          catViewType={catViewType} budgets={budgets} dispatch={dispatch} 
          onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} 
          onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} 
        />;
      case 'loans': 
        return <LoansView 
          updatedLoans={updatedLoans} cards={cards} recurringItems={recurringItems} 
          transactions={transactions} dispatch={dispatch} deleteRecurring={deleteRecurring} 
          saveHistory={saveHistory} addNotification={addNotification} data={data} 
          selectedMonth={selectedMonth} selectedYear={selectedYear} 
        />;
      case 'cards': 
        return <WalletsAndCardsView 
          cards={cards} buildLedger={buildLedger} expandedLedgers={expandedLedgers} 
          expandedCardsSection={expandedCardsSection} selectedMonth={selectedMonth} 
          selectedYear={selectedYear} dispatch={dispatch} handleDelete={handleDelete} 
          handleAddWalletDeposit={handleAddWalletDeposit} 
          handleAddWalletWithdrawal={handleAddWalletWithdrawal} 
          walletVisibility={walletVisibility} liveBalances={liveBalances} 
          saveHistory={saveHistory} addNotification={addNotification} data={data} 
        />;
      case 'financial-forecast': 
        return <FinancialForecastView 
          data={data} transactions={transactions} cards={cards} 
          updatedLoans={updatedLoans} recurringItems={recurringItems} 
          liveBalances={liveBalances} monthlyPlans={monthlyPlans} 
          selectedYear={selectedYear} selectedMonth={selectedMonth} 
        />;
      case 'calendar': 
        return <CalendarView 
          data={data} getAgendaItems={getAgendaItems} transactions={transactions} 
          dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} 
        />;
      case 'deleted': 
        return <DeletedArchiveView 
          data={data} dispatch={dispatch} saveHistory={saveHistory} 
          addNotification={addNotification} transactions={transactions} 
        />;
      case 'settings': 
        return <SettingsView 
          data={data} accountsData={accountsData} cards={cards} budgets={budgets} 
          dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} 
        />;
      default: return null;
    }
  };

  const isHanyShopCategoryForm = formData.category === 'مسحوبات محل هاني' || formData.category === 'مشتريات بقالة هاني';
  const appendQuickItem = (item) => {
    const current = formData.description || '';
    const sep = current && !current.endsWith(' ') && !current.endsWith(',') ? ' + ' : '';
    dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: current + sep + item } });
  };

  return (
    <PromiseModalProvider>
      <div className="flex h-screen overflow-hidden font-sans">
        <OfflineBanner online={isOnline} />
        <ToastContainer notifications={notifications} removeNotification={removeNotification} />
        <ConfirmDialog confirmDialog={confirmDialog} dispatch={dispatch} />
        
        {pendingCloseModal.isOpen && (
          <PendingCloseModal 
            data={pendingCloseModal} 
            onClose={() => dispatch({ type: 'SET_PENDING_CLOSE_MODAL', payload: { isOpen: false, pending: [], month: '', year: 0 } })} 
            onAction={handlePendingCloseAction} 
          />
        )}
        
        {isProcessing && (
          <div className="processing-overlay">
            <div className="processing-spinner mb-4"></div>
            <h3 className="text-base font-bold mb-2">جاري تطبيق العملية</h3>
            <button onClick={cancelProcessing} className="btn bg-red-500 text-white mt-3 text-xs">إلغاء</button>
          </div>
        )}
        
        {isPinChangeOpen && <PinChangeModal onClose={() => dispatch({ type: 'SET_PIN_CHANGE_OPEN', payload: false })} addNotification={addNotification} />}
        
        {isSmsModalOpen && (
          <SmsParserModal 
            isOpen={true} onClose={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: false })} 
            dispatch={dispatch} addNotification={addNotification} saveHistory={saveHistory} data={data} 
          />
        )}
        
        {activeCategoryDetail && (
          <StatementModal 
            mode="category" entity={activeCategoryDetail} transactions={transactions} 
            selectedMonth={selectedMonth} selectedYear={selectedYear} data={data} 
            dispatch={dispatch} addNotification={addNotification} 
            onClose={() => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: null })} 
          />
        )}
        
        {viewingCardStatement && (
          <StatementModal 
            mode="card" entity={viewingCardStatement} transactions={transactions} 
            selectedMonth={selectedMonth} selectedYear={selectedYear} data={data} 
            dispatch={dispatch} addNotification={addNotification} 
            onClose={() => dispatch({ type: 'SET_VIEWING_CARD_STATEMENT', payload: null })} 
          />
        )}
      
        <div className="bottom-nav-container no-print">
          <div className="scrollable-nav scroll-hide">
            {[
              { id: 'dashboard', label: 'الرئيسية', icon: LayoutDashboard }, 
              { id: 'transactions', label: 'المعاملات', icon: ArrowUpRight }, 
              { id: 'cards', label: 'الكروت', icon: CreditCard }, 
              { id: 'calendar', label: 'الأجندة', icon: CalendarDays }
            ].map(item => (
              <button key={item.id} type="button" onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} 
                className={`nav-btn ${activeTab === item.id ? 'active' : ''}`}>
                <item.icon size={19} /><span>{item.label}</span>
              </button>
            ))}
            <button type="button" onClick={() => setIsDrawerOpen(true)} className="nav-btn" style={{ color: 'var(--brand)' }}>
              <Menu size={19} /><span>المزيد</span>
            </button>
          </div>
        </div>

        {isDrawerOpen && (
          <div className="fixed inset-0 z-[4000] no-print">
            <div className="absolute inset-0 backdrop-blur-sm animate-fadeIn" style={{ background: 'rgba(11, 18, 32, 0.55)' }} onClick={() => setIsDrawerOpen(false)}></div>
            <div className="absolute bottom-0 left-0 right-0 rounded-t-3xl shadow-2xl max-h-[85vh] overflow-y-auto scroll-hide animate-slideInBottom" 
              style={{ background: 'var(--bg-card)', paddingBottom: 'calc(20px + env(safe-area-inset-bottom))' }}>
              <div className="pt-3 pb-2 flex justify-center"><div className="w-10 h-1.5 rounded-full" style={{ background: 'var(--border-default)' }}></div></div>
              <div className="px-4 pb-2 flex justify-between items-center">
                <h3 className="font-black text-sm">القائمة</h3>
                <button onClick={() => setIsDrawerOpen(false)} className="btn btn-ghost p-1.5"><X size={16} /></button>
              </div>
              <div className="px-3 space-y-3">
                <div>
                  <p className="sidebar-group-title">المتابعة</p>
                  <div className="grid grid-cols-2 gap-1.5">
                    {[
                      { id: 'categories', label: 'الفئات', icon: Layers }, 
                      { id: 'loans', label: 'الالتزامات', icon: Banknote }
                    ].map(item => (
                      <button key={item.id} onClick={() => { dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id }); setIsDrawerOpen(false); }} 
                        className="flex items-center gap-2 p-2.5 rounded-lg text-xs font-bold" 
                        style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>
                        <item.icon size={14} /><span className="truncate">{item.label}</span>
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <p className="sidebar-group-title">التحليلات</p>
                  <div className="grid grid-cols-2 gap-1.5">
                    <button onClick={() => { dispatch({ type: 'SET_ACTIVE_TAB', payload: 'financial-forecast' }); setIsDrawerOpen(false); }} 
                      className="flex items-center gap-2 p-2.5 rounded-lg text-xs font-bold" 
                      style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>
                      <TrendingUp size={14} /><span>التنبؤ الشامل</span>
                    </button>
                  </div>
                </div>
                <div>
                  <p className="sidebar-group-title">الأدوات</p>
                  <div className="grid grid-cols-2 gap-1.5">
                    {[
                      { id: 'deleted', label: 'المحذوفات', icon: Trash2 }, 
                      { id: 'settings', label: 'الإعدادات', icon: Sliders }
                    ].map(item => (
                      <button key={item.id} onClick={() => { dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id }); setIsDrawerOpen(false); }} 
                        className="flex items-center gap-2 p-2.5 rounded-lg text-xs font-bold" 
                        style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>
                        <item.icon size={14} /><span className="truncate">{item.label}</span>
                      </button>
                    ))}
                    <button onClick={() => { sessionStorage.removeItem('pin_verified'); setPinVerified(false); setIsDrawerOpen(false); }} 
                      className="flex items-center gap-2 p-2.5 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-amber-700 dark:text-amber-400 text-xs font-bold">
                      <Lock size={14} /><span>قفل</span>
                    </button>
                    <button onClick={() => { firebase.auth().signOut(); setIsAuthenticated(false); sessionStorage.removeItem('pin_verified'); setPinVerified(false); setIsDrawerOpen(false); }} 
                      className="flex items-center gap-2 p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-red-600 text-xs font-bold">
                      <LogOut size={14} /><span>خروج</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

        <button type="button" aria-label="إضافة" 
          onClick={() => { 
            dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); 
            dispatch({ 
              type: 'SET_FORM_DATA', 
              payload: { 
                type: 'expense', category: '', amount: '', date: getLocalISODate(), 
                method: 'cash', subType: 'withdrawal', status: 'pending' 
              } 
            }); 
            dispatch({ type: 'SET_FORM_OPEN', payload: true }); 
          }} 
          className="fab no-print">
          <Plus size={22} />
        </button>

        <Sidebar activeTab={activeTab} dispatch={dispatch} canUndo={history.length > 0} onUndo={() => dispatch({ type: 'UNDO' })} />

        <main className={`flex-1 overflow-y-auto p-3 lg:p-6 ${isOnline ? 'pt-3' : 'pt-16'}`}>
          <div className="max-w-6xl mx-auto space-y-4 animate-fadeIn pb-24">
            <ProfessionalHeader 
              isDarkMode={isDarkMode} dispatch={dispatch} 
              onOpenSms={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: true })} 
              isOnline={isOnline} syncStatus={cloudSyncStatus} isSaving={isSaving}        
            />
            {renderActiveView()}
          </div>
        </main>

        {/* Form Modal */}
        {isFormOpen && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-lg rounded-lg shadow-2xl overflow-hidden flex flex-col animate-slideInBottom" 
              style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)', maxHeight: 'calc(100dvh - 24px)' }}>
              <div className="p-3.5 flex justify-between items-center flex-shrink-0" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-sm font-black">{formMode === 'add' ? 'إضافة عملية' : 'تعديل'}</h3>
                <button type="button" onClick={() => dispatch({ type: 'SET_FORM_OPEN', payload: false })} className="btn btn-ghost p-1.5"><X size={16} /></button>
              </div>
              <form onSubmit={handleSaveTransaction} className="p-3.5 space-y-2.5 overflow-y-auto scroll-hide" style={{ minHeight: 0 }}>
                {!isOnline && (
                  <div className="p-2 rounded-lg bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900 flex items-center gap-2">
                    <Wifi size={12} className="text-amber-600" />
                    <span className="text-[10px] font-bold text-amber-700 dark:text-amber-400">غير متصل — سيتم الحفظ محلياً</span>
                  </div>
                )}
                
                <div className="grid grid-cols-2 gap-2.5">
                  <FormField label="النوع" as="select" value={formData.type} 
                    onChange={(e) => { 
                      const t = e.target.value; 
                      dispatch({ 
                        type: 'SET_FORM_DATA', 
                        payload: { ...formData, type: t, subType: t === 'income' ? 'deposit' : 'withdrawal', category: '' } 
                      }); 
                    }}
                    options={[{ value: 'expense', label: 'مصروف 💸' }, { value: 'income', label: 'دخل 💰' }]} />
                  <FormField label="الفئة" as="select" value={formData.category} 
                    onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, category: e.target.value } })} 
                    required error={formErrors.category}
                    options={[
                      { value: '', label: 'اختر...' }, 
                      ...Object.entries(CATEGORY_GROUPS[formData.type]).flatMap(([g, items]) => 
                        items.map(c => ({ value: c, label: `[${g}] ${c}` }))
                      )
                    ]} />
                </div>
                
                <div className="p-2.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className="grid grid-cols-2 gap-1.5">
                    <label className={`flex items-center justify-center gap-1.5 p-2.5 rounded-lg cursor-pointer border-2 font-bold text-[11px] transition-all ${formData.status !== 'paid' ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-500 text-amber-700 dark:text-amber-400' : 'border-transparent'}`}>
                      <input type="radio" name="status" value="pending" className="hidden" 
                        checked={formData.status !== 'paid'} 
                        onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'pending' } })} />
                      <Clock size={12} /> معلق
                    </label>
                    <label className={`flex items-center justify-center gap-1.5 p-2.5 rounded-lg cursor-pointer border-2 font-bold text-[11px] transition-all ${formData.status === 'paid' ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-500 text-emerald-700 dark:text-emerald-400' : 'border-transparent'}`}>
                      <input type="radio" name="status" value="paid" className="hidden" 
                        checked={formData.status === 'paid'} 
                        onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'paid' } })} />
                      <CheckCircle2 size={12} /> معتمد
                    </label>
                  </div>
                </div>
                
                <div className="grid grid-cols-3 gap-2">
                  <FormField label="المبلغ" inputMode="decimal" value={formData.amount} 
                    onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, amount: e.target.value } })} 
                    required error={formErrors.amount} />
                  <FormField label="التاريخ" type="date" value={formData.date} 
                    onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, date: e.target.value } })} 
                    required error={formErrors.date} />
                  <FormField label="الدفع" as="select" value={formData.method} 
                    onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, method: e.target.value } })}
                    options={PAYMENT_METHODS.map(m => ({ value: m.id, label: m.label }))} />
                </div>
                
                <FormField label="الوصف" value={formData.description || ''} 
                  onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: e.target.value } })} 
                  placeholder="تفاصيل..." />

                {isHanyShopCategoryForm && (
                  <div className="p-2.5 rounded-lg animate-fadeIn" style={{ background: 'var(--warning-soft)', border: '1px dashed var(--warning)' }}>
                    <div className="flex items-center justify-between mb-2">
                      <p className="text-[10px] font-black text-amber-700 dark:text-amber-400">🛒 أصناف سريعة — محل هاني</p>
                      <button type="button" onClick={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: '' } })} 
                        className="text-[9px] font-bold text-red-500 hover:underline">مسح</button>
                    </div>
                    <div className="flex flex-wrap gap-1 max-h-32 overflow-y-auto scroll-hide">
                      {HANY_QUICK_ITEMS.map(item => (
                        <button key={item} type="button" onClick={() => appendQuickItem(item)} className="quick-chip">{item}</button>
                      ))}
                    </div>
                  </div>
                )}
       
                <button type="submit" className="btn btn-primary w-full py-2.5 text-sm" disabled={isProcessing}>
                  {isProcessing ? 'جاري الحفظ...' : (
                    <React.Fragment>
                      <Save size={14} /> {formData.status === 'paid' ? 'حفظ واعتماد' : 'حفظ كمعلق'}
                    </React.Fragment>
                  )}
                </button>
              </form>
            </div>
          </div>
        )}

        {/* Edit Card Modal */}
        {editingCard && (
          <ModalShell isOpen={true} onClose={() => dispatch({ type: 'SET_EDITING_CARD', payload: null })} title="تعديل البطاقة" icon="💳">
            <form onSubmit={handleUpdateCard} className="space-y-3">
              <div className="grid grid-cols-2 gap-3">
                <FormField label="الاسم" value={editingCard.name} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, name: e.target.value } })} required />
                <FormField label="البنك" value={editingCard.bank} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, bank: e.target.value } })} required />
              </div>
              <div className="grid grid-cols-3 gap-3">
                <FormField label="الحد" inputMode="decimal" value={editingCard.limit} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, limit: e.target.value } })} />
                <FormField label="مديونية" inputMode="decimal" value={editingCard.openingDebt} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, openingDebt: e.target.value } })} />
                <FormField label="كاش باك %" inputMode="decimal" value={editingCard.cashbackRate || 1} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, cashbackRate: e.target.value } })} />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <FormField label="آخر 4" value={editingCard.last4 || ''} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, last4: e.target.value.slice(0, 4) } })} />
                <FormField label="تاريخ القطع" type="date" value={editingCard.openingDate || CUTOFF_DATE_2026_09_30} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, openingDate: e.target.value } })} />
              </div>
              <button type="submit" className="btn btn-primary w-full py-2.5 text-sm">حفظ</button>
            </form>
          </ModalShell>
        )}

        {/* Edit Loan Modal */}
        {editingLoan && (
          <ModalShell isOpen={true} onClose={() => dispatch({ type: 'SET_EDITING_LOAN', payload: null })} title="تعديل الالتزام" icon="📋">
            <form onSubmit={handleUpdateLoan} className="space-y-3">
              <FormField label="الاسم" value={editingLoan.name} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, name: e.target.value } })} />
              <div className="grid grid-cols-2 gap-3">
                <FormField label="المبلغ" inputMode="decimal" value={editingLoan.totalAmount} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, totalAmount: e.target.value } })} />
                <FormField label="القسط" inputMode="decimal" value={editingLoan.monthlyInstallment} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, monthlyInstallment: e.target.value } })} />
              </div>
              {editingLoan.isReceivable && (
                <div className="grid grid-cols-2 gap-3">
                  <FormField label="إجمالي الأقساط" type="number" value={editingLoan.totalInstallments ?? ''} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, totalInstallments: e.target.value } })} />
                  <FormField label="المدفوعة" type="number" value={editingLoan.paidInstallments ?? ''} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, paidInstallments: e.target.value } })} />
                </div>
              )}
              <button type="submit" className="btn btn-primary w-full py-2.5 text-sm">حفظ</button>
            </form>
          </ModalShell>
        )}

        {/* Budget Modal */}
        {editingBudgetCategory && (
          <ModalShell isOpen={true} onClose={() => dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null })} title={`ميزانية: ${editingBudgetCategory}`} icon="💰">
            <div className="space-y-3">
              <FormField label="المبلغ" inputMode="decimal" value={budgetAmount} onChange={e => dispatch({ type: 'SET_BUDGET_AMOUNT', payload: e.target.value })} />
              <div className="flex gap-2">
                <button type="button" onClick={handleSaveBudget} className="btn btn-primary flex-1 text-sm">حفظ</button>
                <button type="button" onClick={() => dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null })} className="btn btn-secondary flex-1 text-sm">إلغاء</button>
              </div>
            </div>
          </ModalShell>
        )}

        {/* Quick Transfer Modal */}
        {isQuickTransferModalOpen && (
          <ModalShell 
            isOpen={true} 
            onClose={() => { dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false }); dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { transferMode: 'monthly' } }); }} 
            title="التحويلات" icon="🔄"
          >
            <div className="sub-tab-switcher mb-3">
              <button type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { transferMode: 'monthly' } })} 
                className={`sub-tab-btn ${quickTransferData.transferMode !== 'internal' ? 'active' : ''}`}>👨‍👩‍👧 مصروف شهري</button>
              <button type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { transferMode: 'internal' } })} 
                className={`sub-tab-btn ${quickTransferData.transferMode === 'internal' ? 'active' : ''}`}>🔁 بين حساباتي</button>
            </div>
            
            <form onSubmit={handleQuickTransfer} className="space-y-3">
              {quickTransferData.transferMode === 'internal' ? (
                <React.Fragment>
                  <div className="p-2.5 rounded-lg" style={{ background: 'var(--brand-soft)', border: '1px solid var(--brand)' }}>
                    <p className="text-[10px] font-bold" style={{ color: 'var(--brand)' }}>💡 يسجّل عمليتين: خروج + دخول</p>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <FormField label="من حساب" as="select" value={quickTransferData.internalFrom || 'cib_savings'} 
                      onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { internalFrom: e.target.value } })}
                      options={PAYMENT_METHODS.filter(m => m.group === 'account').map(m => ({ value: m.id, label: m.label }))} />
                    <FormField label="إلى حساب" as="select" value={quickTransferData.internalTo || 'fawry'} 
                      onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { internalTo: e.target.value } })}
                      options={PAYMENT_METHODS.filter(m => m.group === 'account').map(m => ({ value: m.id, label: m.label }))} />
                  </div>
                  <FormField label="المبلغ" inputMode="decimal" value={quickTransferData.amount || ''} 
                    onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: e.target.value } })} placeholder="0.00" required />
                  <FormField label="رسوم التحويل (اختياري)" inputMode="decimal" value={quickTransferData.internalFees || ''} 
                    onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { internalFees: e.target.value } })} placeholder="0.00" />
                  <FormField label="التاريخ" type="date" value={quickTransferData.date || getLocalISODate()} 
                    onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { date: e.target.value } })} />
                  <FormField label="ملاحظة (اختياري)" value={quickTransferData.internalDescription || ''} 
                    onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { internalDescription: e.target.value } })} placeholder="تحويل لدفع فاتورة..." />
                  <button type="submit" className="btn btn-primary w-full py-2.5 text-sm" disabled={isProcessing}>
                    {isProcessing ? 'جاري التنفيذ...' : '🔁 تسجيل التحويل'}
                  </button>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <div>
                    <label className="form-label">المستفيد</label>
                    <div className="grid grid-cols-2 gap-1.5">
                      {BENEFICIARIES.map(ben => (
                        <button key={ben.id} type="button" 
                          onClick={() => dispatch({ 
                            type: 'SET_QUICK_TRANSFER_DATA', 
                            payload: { beneficiaryId: ben.id, amount: String(ben.defaultAmount) } 
                          })} 
                          className={`p-2.5 rounded-lg text-[11px] font-bold transition-all border-2 ${quickTransferData.beneficiaryId === ben.id ? 'border-blue-500 bg-blue-50 dark:bg-blue-950/30 text-blue-700 dark:text-blue-400' : 'border-[color:var(--border-default)]'}`}>
                          <div className="flex flex-col items-center gap-0.5">
                            <span>{ben.label}</span>
                            <span className="text-[9px] opacity-70">{fmt(ben.defaultAmount)} ج.م</span>
                          </div>
                        </button>
                      ))}
                    </div>
                  </div>
                  <FormField label="من حساب" as="select" value={quickTransferData.from} 
                    onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: e.target.value } })}
                    options={PAYMENT_METHODS.filter(m => m.group === 'account').map(m => ({ value: m.id, label: m.label }))} />
                  <FormField label="المبلغ" inputMode="decimal" value={quickTransferData.amount} 
                    onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: e.target.value } })} placeholder="0.00" required />
                  <FormField label="التاريخ" type="date" value={quickTransferData.date || getLocalISODate()} 
                    onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { date: e.target.value } })} />
                  <button type="submit" className="btn btn-primary w-full py-2.5 text-sm" disabled={isProcessing}>
                    {isProcessing ? 'جاري التنفيذ...' : 'تسجيل المصروف'}
                  </button>
                </React.Fragment>
              )}
            </form>
          </ModalShell>
        )}

        {/* Recurring Modal */}
        {isRecurringModalOpen && (
          <ModalShell 
            isOpen={true} 
            onClose={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false })} 
            title={recurringFormData.id ? 'تعديل بند متكرر' : 'التزام متكرر جديد'} 
            icon="🔁"
          >
            <form onSubmit={handleSaveRecurring} className="space-y-3">
              <FormField label="العنوان" value={recurringFormData.title} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, title: e.target.value } })} required />
              <div className="grid grid-cols-2 gap-3">
                <FormField label="المبلغ" inputMode="decimal" value={recurringFormData.amount} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, amount: e.target.value } })} required />
                <FormField label="اليوم (1-31)" type="number" value={recurringFormData.day} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, day: e.target.value } })} required />
              </div>
              <FormField label="النوع" as="select" value={recurringFormData.type} 
                onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, type: e.target.value, category: '' } })}
                options={[{ value: 'expense', label: 'مصروف' }, { value: 'income', label: 'دخل' }]} />
              <FormField label="الفئة" as="select" value={recurringFormData.category} 
                onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, category: e.target.value } })}
                options={CATEGORIES[recurringFormData.type].map(c => ({ value: c, label: c }))} />
              <FormField label="طريقة الدفع" as="select" value={recurringFormData.method || 'cash'} 
                onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, method: e.target.value } })}
                options={PAYMENT_METHODS.map(m => ({ value: m.id, label: m.label }))} />
              {recurringFormData.category && recurringFormData.category.startsWith('مصروف شهري - ') && (
                <FormField label="قناة التحويل (اختياري)" as="select" value={recurringFormData.transferChannel || ''} 
                  onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, transferChannel: e.target.value || null } })}
                  options={[{ value: '', label: '— بدون —' }, ...EXTERNAL_TRANSFER_METHOD_IDS.map(id => ({ value: id, label: PAYMENT_METHODS.find(m => m.id === id)?.label || id }))]} />
              )}
              <div className="grid grid-cols-2 gap-3">
                <FormField label="من شهر" type="month" value={recurringFormData.startMonth || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, startMonth: e.target.value } })} />
                <FormField label="إلى شهر" type="month" value={recurringFormData.endMonth || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, endMonth: e.target.value } })} />
              </div>
              <label className="flex items-center gap-2.5 p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 cursor-pointer">
                <input type="checkbox" checked={recurringFormData.active !== false} 
                  onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, active: e.target.checked } })} 
                  className="w-4 h-4 accent-emerald-600" />
                <span className="text-xs font-bold text-emerald-700 dark:text-emerald-400">نشط (سيُولّد تلقائياً)</span>
              </label>
              <button type="submit" className="btn btn-primary w-full py-2.5 text-sm">
                <Save size={14} /> {recurringFormData.id ? 'تحديث البند' : 'إضافة البند'}
              </button>
            </form>
          </ModalShell>
        )}
      </div>
    </PromiseModalProvider>
  );
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════ */
const rootElement = document.getElementById('root');
if (rootElement) {
  createRoot(rootElement).render(<ErrorBoundary><App /></ErrorBoundary>);
  const hideLoading = () => {
    const l = document.getElementById('loading');
    if (!l) return;
    l.style.transition = 'opacity 0.35s ease';
    l.style.opacity = '0';
    setTimeout(() => { l.style.display = 'none'; }, 350);
  };
  if (document.readyState === 'complete') { 
    setTimeout(hideLoading, 500); 
  } else { 
    window.addEventListener('load', () => setTimeout(hideLoading, 500)); 
  }
}
</script>
</body>
</html>
