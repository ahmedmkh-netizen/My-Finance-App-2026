                        <button type="button" aria-label="إيقاف" onClick={() => handleTogglePause(loan)} className={`btn btn-ghost p-2 ${loan.paused ? 'text-emerald-500' : 'text-amber-500'}`}>
                          {loan.paused ? <CheckCircle2 size={16} /> : <Clock size={16} />}
                        </button>
                        <button type="button" aria-label="تعديل" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: loan })} className="btn btn-ghost p-2">
                          <Edit size={16} />
                        </button>
                      </div>
                    </div>
                    <div className="grid grid-cols-3 gap-2 mb-3">
                      <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
                        <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">محصّل</p>
                        <p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(loan.totalPaid)}</p>
                      </div>
                      <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
                        <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">المتبقي</p>
                        <p className="text-sm font-black text-blue-600 mt-0.5">{fmt(loan.remaining)}</p>
                      </div>
                      <div className="p-2.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-center">
                        <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">الأقساط</p>
                        <p className="text-sm font-black text-purple-600 mt-0.5">{paidMonths}/{totalMonths}</p>
                      </div>
                    </div>
                    <div className="w-full rounded-full h-1.5 overflow-hidden mb-3" style={{ background: 'var(--bg-muted)' }}>
                      <div className="bg-emerald-500 h-full rounded-full" style={{ width: `${Math.min(100, pct)}%` }}></div>
                    </div>
                    <div className="flex justify-end gap-2 flex-wrap">
                      {thisMonthCollected ? (
                        <div className="badge badge-success px-3 py-1.5"><CheckCircle2 size={12} /> تم تحصيل {selectedMonth}</div>
                      ) : isComplete ? (
                        <div className="badge badge-success px-3 py-1.5"><CheckCircle2 size={12} /> اكتمل</div>
                      ) : loan.paused ? (
                        <div className="badge badge-warning px-3 py-1.5">⏸ موقوف</div>
                      ) : thisMonthPending ? (
                        <button onClick={() => handleCollectReceivable(loan, thisMonthPending)} className="btn btn-primary text-xs">
                          <CheckCircle2 size={14} /> اعتماد {fmt(thisMonthPending.amount)}
                        </button>
                      ) : (
                        <button onClick={() => handleCollectReceivable(loan, null)} className="btn btn-primary text-xs">
                          <Banknote size={14} /> تحصيل {fmt(monthly)}
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          <div className="space-y-2">
            <h3 className="font-black text-sm flex items-center gap-2 text-red-600"><TrendingDown size={14} /> مديونيات ({payables.length})</h3>
            {payables.map(loan => {
              const isPaid = loan.remaining <= 0;
              const pct = loan.totalAmount > 0 ? (loan.totalPaid / loan.totalAmount) * 100 : 0;
              const monthKeyForLoan = makeMonthKey(loan.year, loan.month);
              const hasCarryover = loan.autoGenerated && Array.isArray(data.settledHanyMonths) && data.settledHanyMonths.includes(monthKeyForLoan);
              
              return (
                <div key={loan.id} className="card py-3">
                  <div className="flex justify-between items-start gap-2 mb-2">
                    <div className="flex items-center gap-2 flex-1 min-w-0">
                      <div className={`p-1.5 rounded-lg flex-shrink-0 ${isPaid ? 'bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600' : 'bg-red-50 dark:bg-red-950/30 text-red-500'}`}>
                        {loan.autoGenerated ? <StoreIcon size={14} /> : <Banknote size={14} />}
                      </div>
                      <div className="min-w-0">
                        <h4 className="font-bold text-xs truncate">{loan.name}</h4>
                        <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                          يوم {loan.dueDay}{loan.autoGenerated && loan.items ? ` • ${loan.items.length} مسحوبة` : ''}
                        </p>
                      </div>
                    </div>
                    <button type="button" aria-label="تعديل" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: loan })} className="btn btn-ghost p-1">
                      <Edit size={12} />
                    </button>
                  </div>
                  <div className="flex justify-between items-center mb-2">
                    <p className={`text-base font-black ${isPaid ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(loan.remaining)}</p>
                    <p className="text-xs font-bold" style={{ color: 'var(--text-muted)' }}>قسط: {fmt(loan.monthlyInstallment)}</p>
                  </div>
                  <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                    <div className="bg-emerald-500 h-full rounded-full" style={{ width: `${Math.min(100, pct)}%` }}></div>
                  </div>
                  
                  {loan.autoGenerated && <HanyShopLedger loan={loan} addNotification={addNotification} />}
                  
                  {!isPaid && (loan.monthlyInstallment > 0 || loan.autoGenerated) && (
                    <div className="flex justify-end gap-1.5 mt-2">
                      {loan.autoGenerated && (
                        hasCarryover 
                          ? <div className="badge badge-success text-[10px]">تمت التسوية</div> 
                          : <button onClick={() => settleHany(loan)} className="btn btn-primary text-[10px] py-1 px-2"><CheckCircle2 size={10} /> تسوية</button>
                      )}
                      {!loan.autoGenerated && loan.monthlyInstallment > 0 && (
                        <button onClick={() => { 
                          dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); 
                          dispatch({ 
                            type: 'SET_FORM_DATA', 
                            payload: { 
                              type: 'expense', category: 'الالتزامات البنكية والتمويلية', 
                              amount: loan.monthlyInstallment, description: `قسط ${loan.name}`, 
                              linkedLoanId: loan.id, method: 'instapay', date: getLocalISODate(), 
                              status: 'pending', subType: 'withdrawal' 
                            } 
                          }); 
                          dispatch({ type: 'SET_FORM_OPEN', payload: true }); 
                        }} className="btn btn-secondary text-[10px] py-1 px-2">
                          <CheckCircle2 size={10} /> سداد
                        </button>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {recurringItems.length > 0 && (
            <details className="card p-0 overflow-hidden">
              <summary className="p-4 cursor-pointer list-none flex items-center justify-between">
                <h3 className="font-black text-sm flex items-center gap-2"><Repeat size={14} className="text-blue-500" /> المتكررة ({recurringItems.length})</h3>
                <ChevronDown size={14} style={{ color: 'var(--text-muted)' }} />
              </summary>
              <div className="px-4 pb-4 space-y-1.5" style={{ borderTop: '1px solid var(--border-subtle)', paddingTop: '12px' }}>
                {recurringItems.map(r => {
                  const isFee = BANK_FEE_CATEGORIES.has(r.category);
                  const isMonthlyBen = isBeneficiaryCategorySafe(r.category);
                  const isInactive = r.active === false;
                  const methodLabel = PAYMENT_METHODS.find(p => p.id === r.method)?.label || r.method || 'Cash';
                  
                  return (
                    <div key={r.id} onClick={() => openRecurringEdit(r)} 
                      className="flex justify-between items-center p-2 rounded-lg cursor-pointer transition-all hover:shadow-sm" 
                      style={{ 
                        background: isMonthlyBen ? 'rgba(180,83,9,0.05)' : isFee ? 'rgba(185, 28, 28, 0.05)' : 'var(--bg-muted)', 
                        opacity: isInactive ? 0.5 : 1 
                      }}
                    >
                      <div className="min-w-0 flex-1">
                        <p className="font-bold text-xs truncate">{r.title} {isFee && '🏦'} {isMonthlyBen && '👨‍👩‍👧'} {isInactive && '⏸'}</p>
                        <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>يوم {r.day} • {methodLabel}</p>
                      </div>
                      <div className="flex items-center gap-1.5 flex-shrink-0" onClick={(e) => e.stopPropagation()}>
                        <span className={`font-black text-xs ${r.type === 'income' ? 'text-emerald-600' : 'text-red-500'}`}>{fmt(r.amount)}</span>
                        <button type="button" aria-label={isInactive ? 'تفعيل' : 'إيقاف'} onClick={() => toggleRecurringActive(r.id)} className={`btn btn-ghost p-1 ${isInactive ? 'text-emerald-500' : 'text-amber-500'}`}>
                          {isInactive ? <CheckCircle2 size={12} /> : <Clock size={12} />}
                        </button>
                        <button aria-label="حذف" onClick={() => deleteRecurring(r.id)} className="btn btn-ghost p-1 text-red-500">
                          <Trash2 size={12} />
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </details>
          )}
        </React.Fragment>
      )}
    </div>
  );
});

/* ─── Cards & Wallets View ─── */
const WalletsAndCardsView = memo(({ 
  cards, buildLedger, expandedLedgers, expandedCardsSection, selectedMonth, selectedYear, 
  dispatch, handleDelete, handleAddWalletDeposit, handleAddWalletWithdrawal, 
  walletVisibility, liveBalances, saveHistory, addNotification, data 
}) => {
  const [activeTab, setActiveTab] = useState('wallets');
  const [showAddCard, setShowAddCard] = useState(false);
  const [newCard, setNewCard] = useState({ 
    name: '', bank: '', limit: '', last4: '', expiry: '', 
    holderName: '', dueDate: '05 من كل شهر', theme: 'silver', cashbackRate: 1 
  });

  const cashbackSummary = useMemo(() => {
    const trackers = (data?.cashbackTrackers || []).filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
    const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
    return { received };
  }, [data?.cashbackTrackers, selectedMonth, selectedYear]);

  const addCard = () => {
    if (!newCard.name || !newCard.bank) { addNotification({ type: 'error', title: 'الاسم والبنك مطلوبان' }); return; }
    const limitCheck = validateAmount(newCard.limit, { min: 100 });
    if (!limitCheck.valid) { addNotification({ type: 'error', title: limitCheck.error }); return; }
    saveHistory();
    dispatch({ 
      type: 'UPDATE_CARDS', 
      payload: [...cards, { 
        ...newCard, id: Date.now(), limit: limitCheck.value, 
        availableBalance: limitCheck.value, openingDebt: 0, openingDate: getLocalISODate(),
        cashbackRate: safeNumber(newCard.cashbackRate, 1), subCardLast4: [] 
      }] 
    });
    setShowAddCard(false);
    setNewCard({ name: '', bank: '', limit: '', last4: '', expiry: '', holderName: '', dueDate: '05 من كل شهر', theme: 'silver', cashbackRate: 1 });
    addNotification({ type: 'success', title: 'تمت الإضافة' });
  };

  const lp = (key) => ({
    walletKey: key, ledgerData: buildLedger ? buildLedger(key) : [], 
    liveBalance: safeNumber(liveBalances?.[key]),
    isExpanded: expandedLedgers[key], onToggle: () => dispatch({ type: 'TOGGLE_LEDGER', payload: key }),
    theme: WALLET_CONFIGS[key], onAddDeposit: handleAddWalletDeposit, onAddWithdrawal: handleAddWalletWithdrawal,
    walletVisibility, onToggleVisibility: (k) => dispatch({ type: 'TOGGLE_WALLET_VISIBILITY', payload: k })
  });

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="sub-tab-switcher">
        <button onClick={() => setActiveTab('wallets')} className={`sub-tab-btn ${activeTab === 'wallets' ? 'active' : ''}`}>
          <CreditCard size={14} /> الكروت والمحافظ
        </button>
        <button onClick={() => setActiveTab('cashback')} className={`sub-tab-btn ${activeTab === 'cashback' ? 'active' : ''}`}>
          <Gift size={14} /> الكاش باك 
          {cashbackSummary.received > 0 && <span className="badge badge-success text-[9px] px-1.5 py-0">{fmt(cashbackSummary.received)}</span>}
        </button>
      </div>

      {activeTab === 'cashback' ? (
        <CashbackView 
          data={data} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} 
          cards={cards} selectedYear={selectedYear} selectedMonth={selectedMonth} 
        />
      ) : (
        <React.Fragment>
          <details className="card p-0 overflow-hidden" open={expandedCardsSection}>
            <summary className="p-4 cursor-pointer list-none flex items-center justify-between"

/* ─── Cashback View ─── */
const CashbackView = memo(({ data, dispatch, saveHistory, addNotification, cards, selectedYear, selectedMonth }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [newTracker, setNewTracker] = useState({ 
    cardId: cards[0]?.id || 1, month: selectedMonth, year: selectedYear, expectedAmount: '' 
  });
  
  const trackers = data?.cashbackTrackers || [];
  const summary = useMemo(() => computeCashbackSummary(trackers), [trackers]);
  const filteredTrackers = useMemo(() => trackers.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear), [trackers, selectedMonth, selectedYear]);
  
  const monthExpected = filteredTrackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
  const monthReceived = filteredTrackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);

  const addTracker = () => {
    const check = validateAmount(newTracker.expectedAmount, { min: 0.01, max: 1000000 });
    if (!check.valid) { addNotification({ type: 'error', title: check.error }); return; }
    saveHistory();
    const tracker = { 
      ...newTracker, id: getSafeId(), expectedAmount: check.value, receivedAmount: 0, 
      receivedDate: '', status: CASHBACK_STATUS.EXPECTED 
    };
    dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: [...trackers, tracker] });
    setShowAdd(false);
    setNewTracker({ cardId: cards[0]?.id || 1, month: selectedMonth, year: selectedYear, expectedAmount: '' });
    addNotification({ type: 'success', title: 'تم الحفظ' });
  };

  const markReceived = async (tracker) => {
    const now = new Date();
    const txYear = now.getFullYear(), txMonth = ALL_MONTHS[now.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { addNotification({ type: 'error', title: 'شهر مغلق' }); return; }
    const card = cards.find(c => c.id === tracker.cardId);
    const cardMethod = card ? getCardMethod(card) : null;
    
    const choice = await showInputModal({
      title: 'أين استلمت الكاش باك؟', icon: '🎁',
      message: `البطاقة: ${card?.bank} - ${card?.name}\n\n1 = على البطاقة\n2 = نقدي\n\nاكتب الرقم:`,
      inputValue: '1', numeric: true, confirmText: 'تأكيد'
    });
    if (choice === null) return;
    const choiceNum = parseInt(choice, 10);
    if (choiceNum !== 1 && choiceNum !== 2) { addNotification({ type: 'error', title: 'اختر 1 أو 2' }); return; }
    const useCard = choiceNum === 1;
    const method = useCard && cardMethod ? cardMethod : 'cash';
    saveHistory();
    
    const updated = trackers.map(t => t.id === tracker.id ? { ...t, receivedAmount: t.expectedAmount, receivedDate: getLocalISODate(), status: CASHBACK_STATUS.RECEIVED } : t);
    dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: updated });
    
    const newTx = {
      id: getSafeId(), type: 'income', kind: KIND.OPERATIONAL, category: 'استرداد كاش باك', 
      amount: safeNumber(tracker.expectedAmount),
      description: `كاش باك - ${card?.name || ''} (${useCard ? 'على البطاقة' : 'نقدي'})`,
      method, date: getLocalISODate(now), month: txMonth, year: txYear, monthIndex: now.getMonth(),
      subType: 'deposit', status: 'paid', linkedCardId: useCard && card ? card.id : undefined,
      createdAt: new Date().toISOString()
    };
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [newTx, ...(data.transactions || [])].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) });
    addNotification({ type: 'success', title: 'تم استلام الكاش باك' });
  };

  const deleteTracker = (id) => {
    dispatch({ 
      type: 'SHOW_CONFIRM', danger: true, title: 'حذف السجل', message: 'سيتم حذف سجل الكاش باك', 
      onConfirm: () => { saveHistory(); dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: trackers.filter(t => t.id !== id) }); }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  };

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div>
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>كاش باك {selectedMonth}</p>
            <h2 className="text-3xl font-black tracking-tight text-emerald-600">
              {fmt(monthReceived)}<span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <p className="text-[11px] font-semibold mt-2" style={{ color: 'var(--text-muted)' }}>
              متوقع: {fmt(monthExpected)} • معلق: {fmt(monthExpected - monthReceived)}
            </p>
          </div>
          <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs"><Plus size={14} /> إضافة</button>
        </div>
        <div className="grid grid-cols-3 gap-2 mt-4">
          <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
            <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">مستلم</p>
            <p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(summary.received)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">متوقع</p>
            <p className="text-sm font-black text-blue-600 mt-0.5">{fmt(summary.expected)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-center">
            <p className="text-[10px] font-bold text-amber-700 dark:text-amber-400">معلق</p>
            <p className="text-sm font-black text-amber-600 mt-0.5">{fmt(summary.pending)}</p>
          </div>
        </div>
      </div>

      <div className="space-y-2">
        <h3 className="font-black text-sm">سجلات {selectedMonth}</h3>
        {filteredTrackers.length === 0 ? (
          <div className="card text-center p-8">
            <Gift size={32} className="mx-auto mb-2 text-emerald-500" />
            <p className="font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد سجلات</p>
          </div>
        ) : filteredTrackers.map(tracker => {
          const card = cards.find(c => c.id === tracker.cardId);
          const pct = safeNumber(tracker.expectedAmount) > 0 ? (safeNumber(tracker.receivedAmount) / safeNumber(tracker.expectedAmount)) * 100 : 0;
          const statusCls = tracker.status === CASHBACK_STATUS.RECEIVED ? 'badge-success' : tracker.status === CASHBACK_STATUS.PARTIAL ? 'badge-warning' : 'badge-neutral';
          return (
            <div key={tracker.id} className="card py-3">
              <div className="flex justify-between items-center gap-3 mb-2">
                <div className="flex items-center gap-2">
                  <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600"><Gift size={14} /></div>
                  <div>
                    <h4 className="font-bold text-xs">{card ? `${card.bank} - ${card.name} • ••••${card.last4}` : 'غير محدد'}</h4>
                    <span className={`badge ${statusCls} mt-1`}>{CASHBACK_STATUS_LABELS[tracker.status]}</span>
                  </div>
                </div>
                <div className="flex gap-1">
                  {tracker.status !== CASHBACK_STATUS.RECEIVED && (
                    <button onClick={() => markReceived(tracker)} className="btn btn-primary text-[10px] py-1.5 px-2">
                      <CheckCircle2 size={12} /> استلمت
                    </button>
                  )}
                  <button onClick={() => deleteTracker(tracker.id)} className="btn btn-ghost p-1.5 text-red-500"><Trash2 size={12} /></button>
                </div>
              </div>
              <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                <div className={`h-full ${pct >= 100 ? 'bg-emerald-500' : pct > 0 ? 'bg-amber-500' : 'bg-slate-300'}`} style={{ width: `${Math.min(100, pct)}%` }}></div>
              </div>
            </div>
          );
        })}
      </div>

      {showAdd && (
        <ModalShell isOpen={true} onClose={() => setShowAdd(false)} title="متتبع كاش باك" icon="🎁">
          <div className="space-y-3">
            <FormField label="البطاقة" as="select" value={newTracker.cardId} onChange={e => setNewTracker({ ...newTracker, cardId: Number(e.target.value) })}
              options={cards.map(c => ({ value: c.id, label: `${c.bank} - ${c.name} • ••••${c.last4}` }))} />
            <div className="grid grid-cols-2 gap-3">
              <FormField label="الشهر" as="select" value={newTracker.month} onChange={e => setNewTracker({ ...newTracker, month: e.target.value })}
                options={getMonthsForYear(newTracker.year).map(m => ({ value: m, label: m }))} />
              <FormField label="السنة" as="select" value={newTracker.year} onChange={e => setNewTracker({ ...newTracker, year: Number(e.target.value) })}
                options={YEARS_LIST.map(y => ({ value: y, label: String(y) }))} />
            </div>
            <FormField label="المبلغ المتوقع" inputMode="decimal" value={newTracker.expectedAmount} onChange={e => setNewTracker({ ...newTracker, expectedAmount: e.target.value })} placeholder="0.00" required />
            <button onClick={addTracker} className="btn btn-primary w-full py-2.5 text-sm"><Save size={14} /> إضافة</button>
          </div>
        </ModalShell>
      )}
    </div>
  );
});

/* ─── Financial Forecast View ─── */
const FinancialForecastView = memo(({ 
  data, transactions, cards, updatedLoans, recurringItems, 
  liveBalances, monthlyPlans, selectedYear, selectedMonth 
}) => {
  const [cardPaymentOverride, setCardPaymentOverride] = useState('');
  const [cardSpendingOverride, setCardSpendingOverride] = useState('');
  const [showSettings, setShowSettings] = useState(false);
  
  const currentLiquidity = useMemo(() => ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(liveBalances?.[k]), 0), [liveBalances]);
  const currentCardDebt = useMemo(() => cards.reduce((s, c) => s + Math.max(0, computeCardDebt(data, c)), 0), [cards, data]);
  const currentLoanDebt = useMemo(() => updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  
  const isCardPayment = (t) => {
    if (t.type !== 'expense') return false;
    if (CREDIT_CARD_METHOD_IDS.includes(t.method)) return false;
    if (t.linkedCardId) return false;
    const cat = t.category || '';
    const desc = t.description || '';
    return (cat === 'الالتزامات البنكية والتمويلية' || cat === 'بنوك / فيزا / تمويل عقاري' 
      || cat === 'مصاريف وسلف شخصية' || desc.includes('سداد') || desc.includes('بطاقة'));
  };
  
  const isCardSpending = (t) => t.type === 'expense' && (CREDIT_CARD_METHOD_IDS.includes(t.method) || t.linkedCardId);
  
  const autoAverages = useMemo(() => {
    const curIdx = getMonthIndex(selectedMonth);
    let y = selectedYear, m = curIdx;
    const refMonths = [];
    for (let i = 0; i < 3; i++) {
      m--; if (m < 0) { m = 11; y--; }
      refMonths.push({ year: y, month: ALL_MONTHS[m] });
    }
    let payTotal = 0, payCount = 0, spTotal = 0, spCount = 0;
    refMonths.forEach(({ year, month }) => {
      const monthTxs = transactions.filter(t => t.month === month && (t.year || 2026) === year && t.status === 'paid');
      const paySum = monthTxs.filter(isCardPayment).reduce((s, t) => s + safeNumber(t.amount), 0);
      const spSum = monthTxs.filter(isCardSpending).reduce((s, t) => s + safeNumber(t.amount), 0);
      if (paySum > 0) { payTotal += paySum; payCount++; }
      if (spSum > 0) { spTotal += spSum; spCount++; }
    });
    return {
      payment: payCount > 0 ? Math.round(payTotal / payCount) : 0,
      spending: spCount > 0 ? Math.round(spTotal / spCount) : 0
    };
  }, [transactions, selectedMonth, selectedYear]);
  
  const baseCardPayment = cardPaymentOverride !== '' ? parseNumberInput(cardPaymentOverride) : autoAverages.payment;
  const baseCardSpending = cardSpendingOverride !== '' ? parseNumberInput(cardSpendingOverride) : autoAverages.spending;
  
  const forecast = useMemo(() => {
    const startIdx = getMonthIndex(selectedMonth);
    const months = [];
    let liq = currentLiquidity, cardDebt = currentCardDebt, loanDebt = currentLoanDebt;
    
    for (let i = 0; i < 6; i++) {
      let mIdx = startIdx + i, year = selectedYear;
      while (mIdx > 11) { mIdx -= 12; year++; }
      const mName = ALL_MONTHS[mIdx];
      const mKey = makeMonthKey(year, mName);
      const monthTxs = transactions.filter(t => t.month === mName && (t.year || 2026) === year);
      
      let income, cardPayment, cardSpending, cashExpenses;
      let pendingCount = 0;
      
      if (i === 0) {
        income = monthTxs.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
        pendingCount = monthTxs.filter(t => t.status !== 'paid').length;
        cardSpending = monthTxs.filter(isCardSpending).reduce((s, t) => s + safeNumber(t.amount), 0);
        cardPayment = monthTxs.filter(isCardPayment).reduce((s, t) => s + safeNumber(t.amount), 0);
        if (cardPayment === 0) cardPayment = baseCardPayment;
        cashExpenses = monthTxs.filter(t => t.type === 'expense' && !isCardSpending(t) && !isCardPayment(t)).reduce((s, t) => s + safeNumber(t.amount), 0);
      } else {
        const plan = monthlyPlans?.[mKey] || {};
        const planIncome = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent)
          + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE)
          + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedCash);
        const planExpense = safeNumber(plan.expectedCashExpenses) + safeNumber(plan.plannedPayments);
        const recIncome = recurringItems.filter(r => r.active !== false && r.type === 'income' && !r.linkedLoanSystemId).reduce((s, r) => s + safeNumber(r.amount), 0);
        const recExpense = recurringItems.filter(r => r.active !== false && r.type === 'expense' && !r.linkedLoanSystemId).reduce((s, r) => s + safeNumber(r.amount), 0);
        income = planIncome || recIncome;
        cashExpenses = planExpense || recExpense;
        cardPayment = baseCardPayment;
        cardSpending = baseCardSpending;
      }
      
      const loanInstallments = updatedLoans.filter(l => !l.isReceivable && !l.autoGenerated && safeNumber(l.monthlyInstallment) > 0).reduce((s, l) => s + safeNumber(l.monthlyInstallment), 0);
      
      const newCardDebt = Math.max(0, cardDebt - cardPayment + cardSpending);
      const newLoanDebt = Math.max(0, loanDebt - loanInstallments);
      const newLiquidity = liq + income - cashExpenses - cardPayment - loanInstallments;
      const totalDebt = newCardDebt + newLoanDebt;
      
      months.push({
        month: mName, year, startCardDebt: cardDebt, income, cashExpenses, cardSpending, cardPayment, 
        loanInstallments, pendingCount, endLiquidity: newLiquidity, endCardDebt: newCardDebt, 
        endLoanDebt: newLoanDebt, totalDebt, netPosition: newLiquidity - totalDebt
      });
      
      liq = newLiquidity; cardDebt = newCardDebt; loanDebt = newLoanDebt;
    }
    return months;
  }, [transactions, selectedMonth, selectedYear, monthlyPlans, currentLiquidity, currentCardDebt, currentLoanDebt, baseCardPayment, baseCardSpending, recurringItems, updatedLoans]);
  
  const chartData = forecast.map(f => ({
    name: f.month.slice(0, 3),
    'السيولة': Math.round(f.endLiquidity),
    'المديونية': Math.round(f.totalDebt),
    'صافي المركز': Math.round(f.netPosition)
  }));
  
  const alerts = useMemo(() => {
    const list = [];
    let warnedNeg = false;
    forecast.forEach(f => {
      if (f.endLiquidity < 0 && !warnedNeg) {
        list.push({ type: 'danger', title: `⚠️ سيولة سلبية في ${f.month} ${f.year}`, message: `السيولة هتبقى ${fmt(f.endLiquidity)} ج.م` });
        warnedNeg = true;
      }
    });
    const last = forecast[forecast.length - 1];
    if (last && last.netPosition < 0) {
      list.push({ type: 'warning', title: `📉 صافي المركز سالب بعد 6 شهور`, message: `في ${last.month} ${last.year}: ${fmt(last.netPosition)} ج.م` });
    }
    return list;
  }, [forecast]);
  
  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div>
            <h2 className="text-base font-black flex items-center gap-2">
              <TrendingUp size={16} className="text-blue-600" /> التنبؤ المالي الشامل
            </h2>
            <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>6 شهور قادمة من البيانات الفعلية والمعلقة</p>
          </div>
          <button onClick={() => setShowSettings(!showSettings)} className={`btn text-xs ${showSettings ? 'btn-primary' : 'btn-secondary'}`}>
            <Sliders size={12} /> إعدادات
          </button>
        </div>
        
        {showSettings && (
          <div className="mt-3 pt-3 space-y-3 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            <div className="grid grid-cols-2 gap-3">
              <FormField label="سداد البطاقة الشهري" inputMode="decimal" value={cardPaymentOverride} onChange={e => setCardPaymentOverride(e.target.value)} 
                placeholder={`تلقائي: ${fmt(autoAverages.payment)}`} hint={`افتراضي من آخر 3 شهور (${fmt(autoAverages.payment)})`} />
              <FormField label="مشتريات البطاقة الشهرية" inputMode="decimal" value={cardSpendingOverride} onChange={e => setCardSpendingOverride(e.target.value)} 
                placeholder={`تلقائي: ${fmt(autoAverages.spending)}`} hint={`افتراضي من آخر 3 شهور (${fmt(autoAverages.spending)})`} />
            </div>
          </div>
        )}
      </div>
      
      {alerts.map((a, i) => (
        <div key={i} className="card" style={{ background: a.type === 'danger' ? 'var(--danger-soft)' : 'var(--warning-soft)', borderColor: a.type === 'danger' ? 'var(--danger)' : 'var(--warning)' }}>
          <p className={`text-xs font-black ${a.type === 'danger' ? 'text-red-700 dark:text-red-400' : 'text-amber-700 dark:text-amber-400'}`}>{a.title}</p>
          <p className="text-[11px] mt-1" style={{ color: 'var(--text-secondary)' }}>{a.message}</p>
        </div>
      ))}
      
      <div className="grid grid-cols-3 gap-2">
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>السيولة الآن</p>
          <p className="text-base font-black text-emerald-600">{fmt(currentLiquidity)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>المديونية</p>
          <p className="text-base font-black text-red-600">{fmt(currentCardDebt + currentLoanDebt)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>صافي المركز</p>
          <p className={`text-base font-black ${currentLiquidity - currentCardDebt - currentLoanDebt >= 0 ? 'text-blue-600' : 'text-red-600'}`}>
            {fmt(currentLiquidity - currentCardDebt - currentLoanDebt)}
          </p>
        </div>
      </div>
      
      <div className="card">
        <h3 className="font-bold text-xs mb-3" style={{ color: 'var(--text-secondary)' }}>📈 تطور السيولة والمديونية</h3>
        <div className="h-72">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={chartData}>
              <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.08} />
              <XAxis dataKey="name" fontSize={10} stroke="#94A3B8" />
              <YAxis fontSize={10} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
              <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '8px', border: 'none', fontFamily: 'Cairo', fontSize: '12px' }} />
              <Legend wrapperStyle={{ fontSize: '11px', fontWeight: 'bold' }} />
              <Bar dataKey="السيولة" fill="#047857" radius={[4, 4, 0, 0]} barSize={18} />
              <Bar dataKey="المديونية" fill="#B91C1C" radius={[4, 4, 0, 0]} barSize={18} />
              <Bar dataKey="صافي المركز" fill="#0F4C81" radius={[4, 4, 0, 0]} barSize={18} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
      
      <div className="space-y-3">
        <h3 className="font-black text-sm">📋 التفاصيل الشهرية</h3>
        {forecast.map((f, i) => (
          <div key={i} className="card">
            <div className="flex justify-between items-center mb-3 flex-wrap gap-2">
              <h4 className="font-black text-sm">{f.month} {f.year}</h4>
              <div className="flex gap-1.5 flex-wrap">
                {i === 0 && <span className="badge badge-brand text-[9px]">الحالي</span>}
                {f.pendingCount > 0 && <span className="badge badge-warning text-[9px]">⏳ {f.pendingCount} معلق</span>}
              </div>
            </div>
            
            <div className="grid grid-cols-2 gap-2 mb-3">
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                <p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>💰 الدخل</p>
                <p className="text-sm font-black text-emerald-600">{fmt(f.income)}</p>
              </div>
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                <p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>💸 مصروفات نقدية</p>

              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>

              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                <p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>💵 سداد البطاقة</p>

              </div>
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>

              </div>

                <span className={`font-black text-base ${f.netPosition >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(f.netPosition)}</span>

/* ─── Calendar View ─── */
const CalendarView = memo(({ data, getAgendaItems, dispatch }) => {
  const today = new Date();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [selectedDayDetails, setSelectedDayDetails] = useState(null);

  const agendaItems = useMemo(() => getAgendaItems(), [getAgendaItems]);

  const itemsByDay = useMemo(() => {
    const map = {};
    agendaItems.forEach(item => {
      const d = parseISODate(item.date);
      if (!d || d.getFullYear() !== viewYear || d.getMonth() !== viewMonth) return;
      const day = d.getDate();
      if (!map[day]) map[day] = [];
      map[day].push(item);
    });
    return map;
  }, [agendaItems, viewYear, viewMonth]);

  const monthName = ALL_MONTHS[viewMonth];
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  const navigate = (delta) => {
    let m = viewMonth + delta, y = viewYear;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    setViewMonth(m); setViewYear(y);
  };

  const dayNames = ['أحد', 'إثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];
  const emptyCells = Array.from({ length: firstDay }, (_, i) => i);
  const dayCells = Array.from({ length: daysInMonth }, (_, i) => i + 1);
  const isToday = (day) => today.getFullYear() === viewYear && today.getMonth() === viewMonth && today.getDate() === day;

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex items-center justify-between mb-3">
          <button type="button" onClick={() => navigate(-1)} className="btn btn-ghost p-2"><ArrowRight size={16} /></button>
          <h2 className="text-base font-black flex items-center gap-2">
            <CalendarDays size={16} className="text-blue-600" /> {monthName} {viewYear}
          </h2>
          <button type="button" onClick={() => navigate(1)} className="btn btn-ghost p-2"><ArrowRight size={16} className="rotate-180" /></button>
        </div>

        <div className="grid grid-cols-7 gap-1 mb-2">
          {dayNames.map(d => (
            <div key={d} className="text-center text-[10px] font-black py-1" style={{ color: 'var(--text-muted)' }}>{d}</div>
          ))}
        </div>

        <div className="grid grid-cols-7 gap-1">
          {emptyCells.map(i => <div key={`e-${i}`} />)}
          {dayCells.map(day => {
            const items = itemsByDay[day] || [];
            const hasItems = items.length > 0;
            const totalAmount = items.reduce((s, it) => s + safeNumber(it.amount), 0);

            return (
              <button key={day} type="button" onClick={() => hasItems && setSelectedDayDetails({ day, items })}
                className={`h-14 rounded-lg p-1 flex flex-col items-center justify-center transition-all ${isToday(day) ? 'ring-2 ring-blue-500' : ''}`}
                style={{ background: hasItems ? 'var(--brand-soft)' : 'var(--bg-muted)', color: hasItems ? 'var(--brand)' : 'var(--text-secondary)' }}
              >
                <span className={`text-[11px] font-black ${isToday(day) ? 'text-blue-600' : ''}`}>{day}</span>
                {hasItems && (
                  <>
                    <span className="text-[8px] font-black mt-0.5">{items.length}</span>
                    <span className="text-[7px] font-bold opacity-70">{fmt(totalAmount).slice(0, 5)}</span>
                  </>
                )}
              </button>
            );
          })}
        </div>
      </div>

      <div className="card">
        <h3 className="font-black text-sm flex items-center gap-2 mb-3">
          <Bell size={14} className="text-amber-500" /> الأجندة ({agendaItems.length})
        </h3>
        {agendaItems.length === 0 ? (
          <p className="text-center py-6 text-xs font-semibold" style={{ color: 'var(--text-muted)' }}>لا توجد التزامات</p>
        ) : (
          <div className="space-y-2 max-h-[60vh] overflow-y-auto scroll-hide">
            {agendaItems.map(item => {
              const Icon = item.icon || Calendar;
              const typeCls = item.type === 'danger' ? 'text-red-600 bg-red-50 dark:bg-red-950/30'
                : item.type === 'warning' ? 'text-amber-600 bg-amber-50 dark:bg-amber-950/30'
                : item.type === 'success' ? 'text-emerald-600 bg-emerald-50 dark:bg-emerald-950/30'
                : 'text-blue-600 bg-blue-50 dark:bg-blue-950/30';
              const daysLeft = calculateDaysLeft(item.date);
              return (
                <div key={item.id} className="flex items-center gap-3 p-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className={`p-2 rounded-lg flex-shrink-0 ${typeCls}`}><Icon size={14} /></div>
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-xs truncate">{item.title}</p>
                    <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>
                      {item.date}
                      {daysLeft !== null && (
                        <span className={`mr-2 font-black ${daysLeft < 0 ? 'text-red-500' : daysLeft <= 3 ? 'text-amber-600' : ''}`}>
                          {daysLeft < 0 ? `متأخر ${Math.abs(daysLeft)} يوم` : daysLeft === 0 ? 'اليوم' : daysLeft === 1 ? 'غداً' : `بعد ${daysLeft} يوم`}
                        </span>
                      )}
                    </p>
                  </div>
                  <span className={`font-black text-sm flex-shrink-0 ${item.type === 'success' ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(item.amount)}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {selectedDayDetails && (
        <ModalShell isOpen={true} onClose={() => setSelectedDayDetails(null)} title={`تفاصيل يوم ${selectedDayDetails.day} ${monthName} ${viewYear}`} icon="📅">
          <div className="space-y-2">
            {selectedDayDetails.items.map(item => {
              const Icon = item.icon || Calendar;
              const typeCls = item.type === 'danger' ? 'text-red-600 bg-red-50 dark:bg-red-950/30'
                : item.type === 'warning' ? 'text-amber-600 bg-amber-50 dark:bg-amber-950/30'
                : item.type === 'success' ? 'text-emerald-600 bg-emerald-50 dark:bg-emerald-950/30'
                : 'text-blue-600 bg-blue-50 dark:bg-blue-950/30';
              return (
                <div key={item.id} className="flex items-center gap-3 p-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className={`p-2 rounded-lg flex-shrink-0 ${typeCls}`}><Icon size={14} /></div>
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-xs truncate">{item.title}</p>
                    <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{item.desc || ''}</p>
                  </div>
                  <span className={`font-black text-sm flex-shrink-0 ${item.type === 'success' ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(item.amount)}</span>
                </div>
              );
            })}
          </div>
        </ModalShell>
      )}
    </div>
  );
});

/* ─── Deleted Archive View ─── */
const DeletedArchiveView = memo(({ data, dispatch, saveHistory, addNotification, transactions }) => {
  const archive = data?.deletedTxArchive || [];
  const [searchTerm, setSearchTerm] = useState('');
  
  const filtered = useMemo(() => {
    let arr = archive;
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.category).includes(term));
    }
    return arr.slice().sort((a, b) => {
      const da = parseISODate(a.deletedAt) || parseISODate(a.date) || new Date(0);
      const db = parseISODate(b.deletedAt) || parseISODate(b.date) || new Date(0);
      return db - da;
    });
  }, [archive, searchTerm]);

  const restoreOne = (tombstone) => {
    if (tombstone._legacy) { addNotification({ type: 'error', title: 'لا يمكن استرجاع هذه' }); return; }
    const d = parseISODate(tombstone.date);
    const y = tombstone.year || (d ? d.getFullYear() : null);
    const m = tombstone.month || (d ? ALL_MONTHS[d.getMonth()] : null);
    if (!y || !m) { addNotification({ type: 'error', title: 'بيانات ناقصة' }); return; }
    if (isMonthClosed(data, y, m)) { addNotification({ type: 'error', title: `افتح شهر ${m} ${y} أولاً` }); return; }
    
    dispatch({ 
      type: 'SHOW_CONFIRM', title: 'استرجاع المعاملة', 
      message: `استرجاع "${tombstone.description || tombstone.category}" بمبلغ ${fmt(tombstone.amount)}`, 
      onConfirm: () => {
        saveHistory();
        const { deletedAt, deletedBy, originalStatus, reason, _legacy, ...original } = tombstone;
        const restoredTx = { ...original, status: originalStatus || 'pending' };
        const newTx = [...transactions, restoredTx].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
        const newArchive = (data.deletedTxArchive || []).filter(a => a.id !== tombstone.id);
        const newDeletedIds = (data.deletedTxIds || []).filter(id => id !== tombstone.id);
        const newMaterialized = { ...(data.materializedRecurring || {}) };
        if (restoredTx.sourceRecurringId && restoredTx.year && restoredTx.month) {
          delete newMaterialized[`${restoredTx.sourceRecurringId}_${makeMonthKey(restoredTx.year, restoredTx.month)}`];
        }
        dispatch({ 
          type: 'SET_DATA', 
          payload: { ...data, transactions: newTx, deletedTxArchive: newArchive, deletedTxIds: newDeletedIds, materializedRecurring: newMaterialized } 
        });
        addNotification({ type: 'success', title: 'تم الاسترجاع' });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  };

  const permanentlyDelete = (id) => {
    dispatch({ 
      type: 'SHOW_CONFIRM', danger: true, title: 'حذف نهائي', message: 'لن يمكن استرجاعه', 
      onConfirm: () => {
        saveHistory();
        const newArchive = (data.deletedTxArchive || []).filter(a => a.id !== id);
        const newTx = (data.transactions || []).filter(t => t.id !== id);
        const newDeletedIds = Array.from(new Set([...(data.deletedTxIds || []), id])).slice(-500);
        dispatch({ type: 'SET_DATA', payload: { ...data, transactions: newTx, deletedTxArchive: newArchive, deletedTxIds: newDeletedIds } });
        addNotification({ type: 'success', title: 'تم الحذف نهائياً' });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div className="flex items-center gap-3">
            <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-red-600 dark:text-red-400">
              <Trash2 size={16} />
            </div>
            <div>
              <h2 className="text-base font-black">سجل المحذوفات</h2>
              <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{archive.length} سجل</p>
            </div>
          </div>
        </div>
      </div>

      <div className="card py-3">
        <div className="relative">
          <Search className="absolute right-3 top-1/2 -translate-y-1/2" size={14} style={{ color: 'var(--text-muted)' }} />
          <input type="text" placeholder="ابحث..." className="input-field pr-9 text-sm py-2.5" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
        </div>
      </div>

      {filtered.length === 0 ? (
        <div className="card text-center p-12">
          <CheckCircle2 size={40} className="text-emerald-500 mx-auto mb-3" />
          <h3 className="text-base font-black mb-2">{archive.length === 0 ? 'الأرشيف فارغ' : 'لا نتائج'}</h3>
        </div>
      ) : (
        <div className="space-y-2">
          {filtered.map(tombstone => {
            const isLegacy = tombstone._legacy;
            const delDate = parseISODate(tombstone.deletedAt);
            return (
              <div key={tombstone.id} className="card py-3">
                <div className="flex justify-between items-start gap-2 mb-2">
                  <div className="min-w-0 flex-1">
                    <p className="font-bold text-xs truncate">
                      {tombstone.type === 'income' ? '💰' : '💸'} {tombstone.description || tombstone.category || 'بدون وصف'}
                      <FamilyBadge tx={tombstone} />
                      {isLegacy && <span className="badge badge-warning text-[9px] mr-1">قديم</span>}
                    </p>
                    <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
                      {tombstone.category || '—'} • {tombstone.date || '—'}
                    </p>
                    <p className="text-[10px] font-semibold mt-0.5 text-red-500">
                      🗑️ {delDate ? delDate.toLocaleDateString('ar-EG') : 'غير معروف'}
                    </p>
                  </div>
                  <span className={`font-black text-sm flex-shrink-0 ${tombstone.type === 'income' ? 'text-emerald-600' : 'text-red-600'}`}>

                  </span>

                  <div className="flex justify-end gap-1.5 mt-2">

                )}

            );
          })}
        </div>
      )}

});

/* ─── Settings View ─── */
const SettingsView = memo(({ data, accountsData, cards, budgets, dispatch, saveHistory, addNotification }) => {
  const [localAccounts, setLocalAccounts] = useState(() => JSON.parse(JSON.stringify(accountsData)));
  const [localCards, setLocalCards] = useState(() => cards.map(c => ({ ...c })));
  const [activeSection, setActiveSection] = useState('accounts');
  const [hasChanges, setHasChanges] = useState(false);
  const [driveBusy, setDriveBusy] = useState(false);
  const [driveStatus, setDriveStatus] = useState('');
  const [folderIdInput, setFolderIdInput] = useState(() => localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID);
  const isDirtyRef = useRef(false);

  useEffect(() => {
    if (isDirtyRef.current) return;
    setLocalAccounts(JSON.parse(JSON.stringify(accountsData)));
    setHasChanges(false);
  }, [accountsData]);

  useEffect(() => {
    if (isDirtyRef.current) return;
    setLocalCards(cards.map(c => ({ ...c })));
    setHasChanges(false);
  }, [cards]);

  const handleAccountChange = (key, field, value) => {
    setLocalAccounts(prev => ({ ...prev, [key]: { ...prev[key], [field]: value } }));
    setHasChanges(true); isDirtyRef.current = true;
  };
  
  const handleCardChange = (id, field, value) => {
    setLocalCards(prev => prev.map(c => { 
      if (c.id !== id) return c; 
      const u = { ...c, [field]: value }; 
      if (field === 'limit') u.availableBalance = Math.max(0, safeNumber(value) - safeNumber(u.openingDebt)); 
      return u; 
    }));
    setHasChanges(true); isDirtyRef.current = true;
  };

  const handleSave = () => {
    saveHistory();
    const cleaned = {};
    const today = getLocalISODate();
    ACCOUNT_KEYS.forEach(k => {
      const oldBal = safeNumber(accountsData[k]?.balance);
      const newBal = parseNumberInput(localAccounts[k]?.balance);
      cleaned[k] = { ...localAccounts[k], balance: newBal, lastUpdated: (oldBal !== newBal) ? today : (localAccounts[k]?.lastUpdated || today) };
    });
    dispatch({ type: 'UPDATE_ACCOUNTS', payload: cleaned });
    dispatch({ 
      type: 'UPDATE_CARDS', 
      payload: localCards.map(c => ({ 
        ...c, limit: safeNumber(c.limit), openingDebt: safeNumber(c.openingDebt), 
        cashbackRate: safeNumber(c.cashbackRate, 1), subCardLast4: Array.isArray(c.subCardLast4) ? c.subCardLast4 : [] 
      })) 
    });
    addNotification({ type: 'success', title: 'تم الحفظ' });
    setHasChanges(false); isDirtyRef.current = false;
  };

  const handleDriveConnect = async () => {
    setDriveBusy(true); setDriveStatus('جاري الاتصال...');
    try { await ensureDriveToken(); setDriveStatus('متصل'); addNotification({ type: 'success', title: 'Drive متصل' }); }
    catch (e) { setDriveStatus('فشل: ' + e.message); }
    finally { setDriveBusy(false); }
  };

  const handleDriveBackupNow = async () => {
    setDriveBusy(true); setDriveStatus('جاري الرفع...');
    try {
      const payload = { data, budgets, exportedAt: new Date().toISOString(), version: 'V84' };
      const result = await uploadBackupToDrive(payload);
      localStorage.setItem(AUTO_BACKUP_LS_KEY, String(Date.now()));
      const folderId = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;
      setDriveStatus(`✅ ${result.name}`);
      addNotification({ type: 'success', title: 'تم رفع النسخة' });
      if (folderId) { 
        setTimeout(() => { 
          dispatch({ 
            type: 'SHOW_CONFIRM', title: '✅ تم الرفع', message: 'هل تريد فتح المجلد؟',
            onConfirm: () => { window.open(`https://drive.google.com/drive/folders/${folderId}`, '_blank'); dispatch({ type: 'HIDE_CONFIRM' }); },
            onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
          });
        }, 600); 
      }
    } catch (e) { setDriveStatus('❌ ' + e.message); addNotification({ type: 'error', title: 'فشل الرفع', message: e.message }); }
    finally { setDriveBusy(false); }
  };

  const handleDriveRestore = async () => {
    setDriveBusy(true); setDriveStatus('جاري الجلب...');
    try {
      const files = await listDriveBackups();
      if (files.length === 0) { setDriveStatus('لا توجد نسخ'); setDriveBusy(false); return; }
      const labels = files.slice(0, 10).map((f, i) => `${i + 1}) ${f.name}`).join('\n');
      const choice = await showInputModal({ title: 'اختر رقم النسخة', icon: '☁️', message: labels, inputValue: '1', numeric: true });
      if (!choice) { setDriveBusy(false); setDriveStatus(''); return; }
      const idx = Math.max(1, Math.min(files.length, parseInt(choice, 10) || 1)) - 1;
      const payload = await downloadBackupFromDrive(files[idx].id);
      if (!payload?.data) throw new Error('الملف لا يحتوي بيانات');
      dispatch({ 
        type: 'SHOW_CONFIRM', danger: true, title: 'استعادة نسخة', message: 'سيتم استبدال بياناتك', 
        onConfirm: () => {

          if (payload.budgets) dispatch({ type: 'SET_BUDGETS', payload: payload.budgets });

        }, 
        onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })

    finally { setDriveBusy(false); }
  };

  const handleFreshStart = () => {

        dispatch({ 
          type: 'SET_DATA',

          }

  return (

      {activeSection === 'accounts' && (

          {ACCOUNT_KEYS.map(key => {
            const acc = localAccounts[key] || {};
            const Icon = ACCOUNT_ICONS[key] || Wallet;
            const last4 = DEFAULT_ACCOUNTS[key]?.last4;
            return (
              <div key={key} className="card">

                    <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>
                      <Icon size={14} />
                    </div>
                    <h4 className="font-black text-xs">{acc.label || key}</h4>
                  </div>
                </div>
                <div className="space-y-2.5">
                  <FormField label="الرصيد الأساسي" inputMode="decimal" value={acc.balance ?? ''} 
                    onChange={e => handleAccountChange(key, 'balance', e.target.value)} />
                  <FormField label="تاريخ التثبيت" type="date" value={acc.lastUpdated || ''} 
                    onChange={e => handleAccountChange(key, 'lastUpdated', e.target.value)} />
                  {last4 && (
                    <div className="p-2 rounded-lg text-center" style={{ background: 'var(--bg-muted)' }}>
                      <p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>رقم البطاقة</p>
                      <p className="font-mono font-bold text-xs mt-0.5">•••• {last4}</p>

      {activeSection === 'cards' && (
        <div className="space-y-3">

                  </span>
                  {subCards.map(s => (
                    <span key={s} className="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full" style={{ background: 'var(--brand-soft)', color: 'var(--brand)' }}>•••• {s}</span>

      <div className="card">

        </p>
        <button onClick={() => dispatch({ type: 'SET_PIN_CHANGE_OPEN', payload: true })} className="btn btn-secondary text-xs w-full">
          <Lock size={12} /> تغيير الرمز

      <details className="card p-0 overflow-hidden" open>

        </button>
      </div>
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════
   PART 5 — dataReducer
   V84 — Banking Edition
   ═══════════════════════════════════════════════════════════════ */
function dataReducer(state, action) {
  switch (action.type) {
    case 'SET_DATA': {
      const incoming = { ...action.payload };
      if (!Array.isArray(incoming.deletedTxArchive)) incoming.deletedTxArchive = [...(state.data.deletedTxArchive || [])];
      if (!Array.isArray(incoming.deletedTxIds)) incoming.deletedTxIds = [...(state.data.deletedTxIds || [])];
      if (!Array.isArray(incoming.deletedDefaultIds)) incoming.deletedDefaultIds = [...(state.data.deletedDefaultIds || [])];
      return { ...state, data: incoming };
    }
    case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
    case 'SET_SELECTED_YEAR': return { 
      ...state, selectedYear: action.payload, 
      selectedMonth: getMonthsForYear(action.payload).includes(state.selectedMonth) ? state.selectedMonth : getMonthsForYear(action.payload)[0] 
    };
    case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
    case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
    case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
    case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
    case 'SET_FORM_DATA': return { ...state, formData: action.payload };
    case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
    case 'SET_FORM_ERRORS': return { ...state, formErrors: action.payload };
    case 'SET_ACTIVE_CATEGORY_DETAIL': return { ...state, activeCategoryDetail: action.payload };
    case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
    case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
    case 'SET_BUDGETS': return { ...state, budgets: action.payload };
    case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
    case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
    case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
    case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
    case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
    case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
    case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
    case 'SET_PIN_CHANGE_OPEN': return { ...state, isPinChangeOpen: action.payload };
    case 'SET_SMS_MODAL_OPEN': return { ...state, isSmsModalOpen: action.payload };
    case 'SET_PENDING_CLOSE_MODAL': return { ...state, pendingCloseModal: action.payload };
    case 'ADD_NOTIFICATION': return { 
      ...state, notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }] 
    };
    case 'REMOVE_NOTIFICATION': return { 
      ...state, notifications: state.notifications.filter(n => n.id !== action.payload) 
    };
    case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
    case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
    case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
    case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
    case 'UPDATE_CASHBACK_TRACKERS': return { ...state, data: { ...state.data, cashbackTrackers: action.payload } };
    
    case 'UPDATE_ACCOUNTS': {
      const oldA = state.data.accountsData || {};
      const newA = action.payload || {};
      let earliestAffected = null;
      ACCOUNT_KEYS.forEach(k => {
        const oldBal = safeNumber(oldA[k]?.balance);
        const newBal = safeNumber(newA[k]?.balance);
        const oldDate = oldA[k]?.lastUpdated;
        const newDate = newA[k]?.lastUpdated;
        if (oldBal !== newBal || oldDate !== newDate) {
          const ref = newDate || oldDate;
          if (ref) {
            const d = parseISODate(ref);
            if (d) {
              const y = d.getFullYear(), mIdx = d.getMonth();
              const mName = ALL_MONTHS[mIdx];
              if (!earliestAffected) earliestAffected = { year: y, month: mName };
              else {
                const curIdx = getMonthIndex(earliestAffected.month);
                if (y < earliestAffected.year || (y === earliestAffected.year && mIdx < curIdx)) 
                  earliestAffected = { year: y, month: mName };
              }
            }
          }
        }
      });
      let newSnapshots = state.data.monthlySnapshots || {};
      if (earliestAffected) { 
        const { snapshots } = invalidateSnapshotsFrom(newSnapshots, earliestAffected.year, earliestAffected.month); 
        newSnapshots = snapshots; 
      }
      return { ...state, data: { ...state.data, accountsData: newA, monthlySnapshots: newSnapshots } };
    }
    
    case 'ADD_TO_HISTORY': { 
      const limited = [...state.history].slice(-19); 
      return { ...state, history: [...limited, action.payload], future: [] }; 
    }
    
    case 'UNDO': {
      if (state.history.length === 0) return state;
      const prev = state.history[state.history.length - 1];
      return { 
        ...state, 
        data: prev.data || prev, 
        budgets: prev.budgets !== undefined ? prev.budgets : state.budgets, 
        history: state.history.slice(0, -1), 
        future: [{ data: state.data, budgets: state.budgets }, ...state.future] 
      };
    }
    
    case 'TOGGLE_LEDGER': return { 
      ...state, 
      expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] } 
    };
    
    case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };
    case 'SET_STATUS_FILTER': return { ...state, statusFilter: action.payload };
    
    case 'SHOW_CONFIRM': return { 
      ...state, 
      confirmDialog: { 
        isOpen: true, title: action.title, message: action.message, 
        onConfirm: action.onConfirm, onCancel: action.onCancel, danger: action.danger || false 
      } 
    };
    
    case 'HIDE_CONFIRM': return { 
      ...state, 
      confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false } 
    };
    
    case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
    case 'SET_QUICK_TRANSFER_DATA': return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
    case 'SET_VIEWING_CARD_STATEMENT': return { ...state, viewingCardStatement: action.payload };

    case 'CLOSE_MONTH': {
      const { year, month } = action.payload;
      const monthKey = makeMonthKey(year, month);
      const monthIdx = getMonthIndex(month);
      const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
      const snap = {};
      ACCOUNT_KEYS.forEach(k => { snap[k] = computeBalance(state.data, k, monthEnd); });
      
      const cleanedSnapshots = { ...(state.data.monthlySnapshots || {}) };
      Object.keys(cleanedSnapshots).forEach(k => {
        const parsed = parseMonthKey(k);
        if (!parsed) return;
        if (parsed.year > year || (parsed.year === year && getMonthIndex(parsed.month) > monthIdx)) {
          delete cleanedSnapshots[k];
        }
      });
      
      return { 
        ...state, 
        data: { 
          ...state.data, 
          closedMonths: Array.from(new Set([...(state.data.closedMonths || []), monthKey])),
          monthlySnapshots: { ...cleanedSnapshots, [monthKey]: snap } 
        } 
      };
    }

    case 'CLOSE_MONTH_AFTER_RESOLVE': {
      const { year, month, resolveAction, pendingIds } = action.payload;
      const monthKey = makeMonthKey(year, month);
      let newTxs = state.data.transactions || [];
      
      if (resolveAction === 'approve') { 
        const ids = new Set(pendingIds); 
        newTxs = newTxs.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t); 
      } else if (resolveAction === 'delete') { 
        const ids = new Set(pendingIds); 
        newTxs = newTxs.filter(t => !ids.has(t.id)); 
      } else if (resolveAction === 'carry') {
        const idx = getMonthIndex(month);
        const nextMonth = idx === 11 ? ALL_MONTHS[0] : ALL_MONTHS[idx + 1];
        const nextYear = idx === 11 ? year + 1 : year;
        const nextMonthIdx = getMonthIndex(nextMonth);
        const maxDay = new Date(nextYear, nextMonthIdx + 1, 0).getDate();
        const ids = new Set(pendingIds);
        const nextMonthKey = makeMonthKey(nextYear, nextMonth);
        const nextClosed = (state.data.closedMonths || []).includes(nextMonthKey);
        if (nextClosed) return { ...state, pendingCloseModal: { isOpen: false, pending: [], month: '', year: 0 } };
        
        newTxs = newTxs.map(t => {
          if (!ids.has(t.id)) return t;
          const oldD = parseISODate(t.date);
          const oldDay = oldD ? oldD.getDate() : 1;
          const newDay = Math.min(Math.max(1, oldDay), maxDay);
          const newDate = `${nextYear}-${String(nextMonthIdx + 1).padStart(2, '0')}-${String(newDay).padStart(2, '0')}`;
          return { 
            ...t, date: newDate, month: nextMonth, year: nextYear, monthIndex: nextMonthIdx, 
            source: 'carryover', carryoverFrom: `${month} ${year}`, status: 'pending' 
          };
        });
      }
      
      const newData = { ...state.data, transactions: newTxs };
      const monthEnd = new Date(year, getMonthIndex(month) + 1, 0, 23, 59, 59);
      const snap = {};
      ACCOUNT_KEYS.forEach(k => { snap[k] = computeBalance(newData, k, monthEnd); });
      
      return { 
        ...state, 
        data: { 
          ...newData, 
          closedMonths: Array.from(new Set([...(newData.closedMonths || []), monthKey])),
          monthlySnapshots: { ...(newData.monthlySnapshots || {}), [monthKey]: snap } 
        }, 
        pendingCloseModal: { isOpen: false, pending: [], month: '', year: 0 } 
      };
    }

    case 'OPEN_MONTH': {
      const monthKey = action.payload;
      const parsedKey = parseMonthKey(monthKey);
      if (!parsedKey) return { 
        ...state, 
        data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey) } 
      };
      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots, parsedKey.year, parsedKey.month);
      return { 
        ...state, 
        data: { 
          ...state.data, 
          closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey), 
          monthlySnapshots: snapshots 
        } 
      };
    }

    case 'TOGGLE_WALLET_VISIBILITY': return { 
      ...state, 
      walletVisibility: { ...state.walletVisibility, [action.payload]: !state.walletVisibility[action.payload] } 
    };
    
    case 'SET_IS_PROCESSING': return { ...state, isProcessing: action.payload };
    
    default: return state;
  }
}

/* ═══════════════════════════════════════════════════════════════
   materializeShoppingRecurring — Family App + Hany Shop integration
   ═══════════════════════════════════════════════════════════════ */
const materializeShoppingRecurring = async () => {
  try {
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
    const snap = await docRef.get();
    if (!snap.exists) return;
    const d = snap.data() || {};
    const rules = d.shoppingRecurring || [];
    if (!rules.length) return;
    const today = new Date().toISOString().slice(0, 10);
    const due = rules.filter(r => r.active && r.nextDue && r.nextDue <= today);
    if (!due.length) return;
    
    const newTxs = [];
    const updates = [];
    due.forEach(r => {
      const t = r.template;
      const tObj = new Date(r.nextDue + 'T12:00:00');
      newTxs.push({
        id: 'rec-tx-' + r.id + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
        type: 'expense', kind: 'operational',
        category: t.category, subCategory: t.subCategory,
        amount: t.amount, quantity: t.quantity, unitPrice: t.unitPrice,
        description: t.description, source: 'shopping-app', sourceLabel: t.sourceLabel,
        method: t.method, linkedCardId: t.linkedCardId || undefined,
        date: r.nextDue, month: ALL_MONTHS[tObj.getMonth()], year: tObj.getFullYear(), monthIndex: tObj.getMonth(),
        subType: 'withdrawal', status: 'pending', recurringId: r.id, createdAt: Date.now(), 
      });
      
      const prefDay = r.preferredDay || 10;
      const addMonthsWithDay = (isoStr, m, day) => {
        const dt = new Date(isoStr + 'T12:00:00');
        dt.setMonth(dt.getMonth() + m);
        dt.setDate(parseInt(day));
        return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      };
      const next = addMonthsWithDay(r.nextDue, r.frequency === 'bimonthly' ? 2 : 1, prefDay);
      updates.push({ old: r, new: { ...r, nextDue: next, lastRun: today } });
    });
    
    if (newTxs.length > 0) {
      await docRef.set({ transactions: firebase.firestore.FieldValue.arrayUnion(...newTxs) }, { merge: true });
    }
    for (const u of updates) {
      await docRef.update({ shoppingRecurring: firebase.firestore.FieldValue.arrayRemove(u.old) });
      await docRef.set({ shoppingRecurring: firebase.firestore.FieldValue.arrayUnion(u.new) }, { merge: true });
    }
    console.log('✅ Materialized', newTxs.length, 'recurring shopping items');
  } catch (e) {
    console.warn('Shopping recurring:', e);
  }
};
