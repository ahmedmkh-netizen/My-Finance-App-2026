            {filtered.length === 0 ? (
              <div className="card text-center p-12">
                <CheckCircle2 size={40} className="text-emerald-500 mx-auto mb-3" />
                <h3 className="text-base font-black mb-2">{archive.length === 0 ? 'الأرشيف فارغ' : 'لا نتائج مطابقة'}</h3>
              </div>
            ) : (
              <div className="space-y-2">
                {filtered.map(tombstone => {
                  const isFamily = isFamilyTx(tombstone) || tombstone.deletedBy === 'family';
                  const isLegacy = tombstone._legacy;
                  const delDate = parseISODate(tombstone.deletedAt);
                  return (
                    <div key={tombstone.id} className="card py-3">
                      <div className="flex justify-between items-start gap-2 mb-2">
                        <div className="min-w-0 flex-1">
                          <p className="font-bold text-xs truncate flex items-center gap-2 flex-wrap">
                            {tombstone.type === 'income' ? '💰' : '💸'} {tombstone.description || tombstone.category || 'بدون وصف'}
                            {isFamily && <FamilyBadge tx={tombstone} />}
                            {isLegacy && <span className="badge badge-warning text-[9px]">بيانات قديمة</span>}
                            {isCarryoverMarker(tombstone) && <HanyMarkerBadge tx={tombstone} />}
                            {isHanySettleTx(tombstone) && <HanySettleBadge tx={tombstone} />}
                          </p>
                          <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>{tombstone.category || '—'} • {tombstone.date || '—'}</p>
                          <p className="text-[10px] font-semibold mt-0.5 text-red-500">
                            🗑️ حُذفت {delDate ? delDate.toLocaleDateString('ar-EG') : 'في تاريخ غير معروف'}
                            {tombstone.deletedBy && ` بواسطة ${tombstone.deletedBy === 'self' ? 'أنت' : tombstone.deletedBy}`}
                            {tombstone.reason && ` • السبب: ${tombstone.reason}`}
                          </p>
                        </div>
                        <span className={`font-black text-sm flex-shrink-0 money tabular ${tombstone.type === 'income' ? 'text-emerald-600' : 'text-red-600'}`}>
                          {tombstone.type === 'income' ? '+' : '−'}{fmt(tombstone.amount)}
                        </span>
                      </div>
                      {!isLegacy && (
                        <div className="flex justify-end gap-1.5 mt-2">
                          <button onClick={() => restoreOne(tombstone)} className="btn btn-secondary text-[10px] py-1 px-2"><Undo2 size={10} /> استرجاع</button>
                          <button onClick={() => permanentlyDelete(tombstone.id)} className="btn btn-ghost text-[10px] py-1 px-2 text-red-500"><Trash2 size={10} /> حذف نهائي</button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </React.Fragment>
        )}

        {tab === 'audit' && (
          <React.Fragment>
            {auditLog.length > 0 && (
              <div className="card flex justify-end">
                <button onClick={clearAuditLog} className="btn btn-secondary text-xs"><Trash2 size={12} /> تفريغ</button>
              </div>
            )}

            <div className="grid grid-cols-3 md:grid-cols-6 gap-2">
              {Object.entries(AUDIT).slice(0, 6).map(([key, action]) => (
                <button key={action} onClick={() => setAuditFilterAction(auditFilterAction === action ? 'all' : action)} className="stat-card text-center py-2"
                  style={auditFilterAction === action ? { background: `${AUDIT_COLORS[action]}15`, borderColor: AUDIT_COLORS[action] } : {}}>
                  <p className="text-[9px] font-bold mb-0.5" style={{ color: AUDIT_COLORS[action] }}>{AUDIT_LABELS[action]}</p>
                  <p className="text-base font-black money tabular">{auditStats[action] || 0}</p>
                </button>
              ))}
            </div>

            <div className="card py-3">
              <div className="flex gap-2">
                <div className="relative flex-1">
                  <Search className="absolute right-3 top-1/2 -translate-y-1/2" size={14} style={{ color: 'var(--text-muted)' }} />
                  <input type="text" placeholder="ابحث في السجل..." className="input-field pr-9 text-sm py-2.5" value={auditSearchTerm} onChange={(e) => setAuditSearchTerm(e.target.value)} />
                </div>
                {auditFilterAction !== 'all' && (<button onClick={() => setAuditFilterAction('all')} className="btn btn-secondary text-xs px-3"><X size={14} /> مسح</button>)}
              </div>
            </div>

            {filteredAudit.length === 0 ? (
              <div className="card text-center p-12">
                <History size={40} className="text-slate-400 mx-auto mb-3" />
                <h3 className="text-base font-black mb-2">{auditLog.length === 0 ? 'السجل فارغ' : 'لا نتائج مطابقة'}</h3>
              </div>
            ) : (
              <div className="space-y-2">
                {filteredAudit.slice(0, 200).map(entry => {
                  const d = new Date(entry.ts);
                  const dateStr = d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short', year: 'numeric' });
                  const timeStr = d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                  const color = AUDIT_COLORS[entry.action] || '#64748B';
                  return (
                    <div key={entry.id} className="audit-item" style={{ color }}>
                      <div className="audit-dot" style={{ background: color, color }} />
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 flex-wrap mb-0.5">
                          <span className="font-black text-xs" style={{ color }}>{AUDIT_LABELS[entry.action] || entry.action}</span>
                          <span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{entry.entity}</span>
                          {entry.entityId && (<span className="text-[9px] font-mono px-1.5 py-0.5 rounded" style={{ background: 'var(--bg-card)', color: 'var(--text-secondary)' }}>#{String(entry.entityId).slice(0, 10)}</span>)}
                        </div>
                        {entry.note && <p className="text-[11px] font-semibold" style={{ color: 'var(--text-primary)' }}>{entry.note}</p>}
                        <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{dateStr} • {timeStr}{entry.by && ` • بواسطة: ${entry.by === 'ahmed' ? 'أنت' : entry.by}`}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </React.Fragment>
        )}
      </div>
    </React.Fragment>
  );
});

/* ═══════════════ DATA HEALTH VIEW ═══════════════ */
const DataHealthView = memo(({ data, transactions, cards, updatedLoans, liveBalances, dispatch }) => {
  const { issues, score } = useMemo(() => checkDataIntegrity(data, transactions, cards, updatedLoans, liveBalances), [data, transactions, cards, updatedLoans, liveBalances]);
  const scoreColor = score >= 80 ? 'emerald' : score >= 50 ? 'amber' : 'red';

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex items-center justify-between mb-3">
          <h2 className="text-base font-black flex items-center gap-2"><ShieldCheck size={16} className="text-[color:var(--accent)]" /> صحة البيانات</h2>
          <div className={`badge badge-${scoreColor === 'emerald' ? 'success' : scoreColor === 'amber' ? 'warning' : 'danger'} text-sm px-3 py-1 money tabular`}>{score}%</div>
        </div>
        <div className="w-full rounded-full h-2 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
          <div className={`h-full transition-all ${scoreColor === 'emerald' ? 'bg-emerald-500' : scoreColor === 'amber' ? 'bg-amber-500' : 'bg-red-500'}`} style={{ width: `${score}%` }}></div>
        </div>
        <p className="text-[11px] mt-2" style={{ color: 'var(--text-muted)' }}>
          {score === 100 ? '✨ كل شيء ممتاز!' : `${issues.length} مشكلة تحتاج انتباهك`}
        </p>
      </div>

      {issues.length === 0 ? (
        <div className="card text-center p-12">
          <CheckCircle2 size={48} className="text-emerald-500 mx-auto mb-3" />
          <h3 className="text-base font-black mb-2">بياناتك سليمة 100%</h3>
          <p className="text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد مشاكل حسابية حالياً</p>
        </div>
      ) : (
        <div className="space-y-2">
          {issues.map((issue, idx) => {
            const color = issue.severity === 'danger' ? 'red' : issue.severity === 'warning' ? 'amber' : 'blue';
            const Icon = issue.severity === 'danger' ? AlertTriangle : issue.severity === 'warning' ? AlertCircle : Info;
            const bgClass = color === 'red' ? 'bg-red-50 dark:bg-red-950/30 text-red-600' : color === 'amber' ? 'bg-amber-50 dark:bg-amber-950/30 text-amber-600' : 'bg-blue-50 dark:bg-blue-950/30 text-blue-600';
            const borderColor = color === 'red' ? 'var(--danger)' : color === 'amber' ? 'var(--warning)' : 'var(--info)';
            return (
              <div key={idx} className="card py-3" style={{ borderRightWidth: '4px', borderRightColor: borderColor }}>
                <div className="flex items-start gap-3">
                  <div className={`p-2 rounded-lg ${bgClass} flex-shrink-0`}><Icon size={16} /></div>
                  <div className="flex-1 min-w-0">
                    <h4 className="font-black text-xs mb-0.5">{issue.title}</h4>
                    {issue.description && <p className="text-[10px] leading-relaxed" style={{ color: 'var(--text-muted)' }}>{issue.description}</p>}
                    {issue.action && (<button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: issue.action })} className="btn btn-secondary text-[10px] py-1 px-2 mt-2">اذهب</button>)}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
});

/* ═══════════════ CARD PAYMENT MODAL ═══════════════ */
const CardPaymentModal = memo(({ cardId, data, dispatch, saveHistory, addNotification, onClose }) => {
  const cards = data?.cards || [];
  const [selectedCardId, setSelectedCardId] = useState(cardId || (cards[0]?.id || null));
  const [amount, setAmount] = useState('');
  const [sourceMethod, setSourceMethod] = useState('cib_savings');
  const [date, setDate] = useState(getLocalISODate());
  const [note, setNote] = useState('');
  const [withFee, setWithFee] = useState(false);
  const [feeAmount, setFeeAmount] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const selectedCard = cards.find(c => c.id === selectedCardId);
  const cardInfo = useMemo(() => selectedCard ? computeCardPaymentInfo(data, selectedCard) : null, [data, selectedCard]);

  const liveBalances = useMemo(() => computeBalancesAsOf(data), [data]);
  const sourceBalance = safeNumber(liveBalances[sourceMethod]);

  const parsedAmount = parseNumberInput(amount);
  const parsedFee = withFee ? parseNumberInput(feeAmount) : 0;
  const totalDebit = parsedAmount + parsedFee;
  const remainingAfter = cardInfo ? Math.max(0, cardInfo.debt - parsedAmount) : 0;
  const canSubmit = parsedAmount > 0 && sourceBalance >= totalDebit - 0.005 && cardInfo && parsedAmount <= cardInfo.debt + 0.005;

  const setFullAmount = () => { if (cardInfo && cardInfo.debt > 0) setAmount(String(roundMoney(cardInfo.debt))); };
  const setHalfAmount = () => { if (cardInfo && cardInfo.debt > 0) setAmount(String(roundMoney(cardInfo.debt / 2))); };
  const setQuarterAmount = () => { if (cardInfo && cardInfo.debt > 0) setAmount(String(roundMoney(cardInfo.debt / 4))); };

  const handleSubmit = () => {
    if (!canSubmit || submitting) return;
    const d = parseISODate(date);
    if (!d) { addNotification({ type: 'error', title: 'تاريخ غير صحيح' }); return; }
    const txYear = d.getFullYear();
    const txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { addNotification({ type: 'error', title: 'شهر مغلق', duration: 6000 }); return; }

    setSubmitting(true);
    saveHistory();
    dispatch({
      type: 'CARD_PAYMENT',
      payload: {
        cardId: selectedCardId, amount: parsedAmount, sourceMethod, date,
        note: note.trim() || `سداد بطاقة ${selectedCard.bank} - ${selectedCard.name}`,
        withFee, feeAmount: parsedFee
      }
    });

    const feeMsg = withFee && parsedFee > 0 ? ` + رسوم ${fmt(parsedFee)} ج.م` : '';
    addNotification({
      type: 'success', title: '✅ تم تسجيل السداد',
      message: `${fmt(parsedAmount)} ج.م من ${ACCOUNT_SHORT_NAMES[sourceMethod] || sourceMethod}${feeMsg}\nالمديونية المتبقية: ${fmt(remainingAfter)} ج.م`,
      duration: 8000
    });
    setTimeout(() => { setSubmitting(false); onClose(); }, 400);
  };

  if (!selectedCard) {
    return (
      <Modal isOpen={true} onClose={onClose} title="سداد بطاقة" icon="💳">
        <div className="text-center py-8">
          <CreditCard size={40} className="mx-auto mb-3 text-slate-400" />
          <p className="font-bold text-sm mb-2">لا توجد بطاقات مسجلة</p>
          <p className="text-xs mb-4" style={{ color: 'var(--text-muted)' }}>أضف بطاقة أولاً من صفحة البطاقات</p>
          <button onClick={onClose} className="btn btn-secondary text-sm">إغلاق</button>
        </div>
      </Modal>
    );
  }

  return (
    <Modal isOpen={true} onClose={onClose} title="سداد بطاقة ائتمانية" icon="💳" size="lg">
      <div className="space-y-4">
        <div className="card-payment-hero">
          <p className="text-[11px] font-bold opacity-90 mb-1">المديونية الحالية</p>
          <p className="payment-amount-display mb-1">{fmt(cardInfo.debt)}</p>
          <p className="text-xs font-bold opacity-80">{selectedCard.bank} - {selectedCard.name} • ••••{selectedCard.last4}</p>
          {cardInfo.lastPayment && (<p className="text-[10px] opacity-70 mt-2">آخر سداد: {cardInfo.lastPayment.date} — {fmt(cardInfo.lastPayment.amount)} ج.م</p>)}
        </div>

        {!cardId && cards.length > 1 && (
          <div>
            <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>اختر البطاقة</label>
            <div className="space-y-2 max-h-40 overflow-y-auto scroll-hide">
              {cards.map(c => {
                const cInfo = computeCardPaymentInfo(data, c);
                const isSel = c.id === selectedCardId;
                return (
                  <button key={c.id} type="button" onClick={() => { setSelectedCardId(c.id); setAmount(''); }} className={`payment-card-option ${isSel ? 'selected' : ''}`}>
                    <div className="p-2 rounded-lg flex-shrink-0" style={{ background: isSel ? 'var(--accent)' : 'var(--bg-muted)', color: isSel ? 'white' : 'var(--text-secondary)' }}><CreditCard size={16} /></div>
                    <div className="flex-1 min-w-0 text-right">
                      <p className="font-black text-xs">{c.bank} - {c.name}</p>
                      <p className="text-[10px] font-mono" style={{ color: 'var(--text-muted)' }}>•••• {c.last4}</p>
                    </div>
                    <div className="text-left flex-shrink-0">
                      <p className={`font-black text-xs money tabular ${cInfo.debt > 0 ? 'text-red-600' : 'text-emerald-600'}`}>{fmt(cInfo.debt)}</p>
                      <p className="text-[9px]" style={{ color: 'var(--text-muted)' }}>ج.م</p>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        <div>
          <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>المبلغ المسدَّد *</label>
          <input type="text" inputMode="decimal" autoFocus className="input-field input-num text-3xl font-black text-center py-4" style={{ color: 'var(--accent)' }} value={amount} onChange={e => setAmount(e.target.value)} placeholder="0.00" />
          <div className="flex gap-1.5 mt-2 flex-wrap">
            <button type="button" onClick={setFullAmount} className="quick-amount-chip" style={{ flex: 1 }}>الكل ({fmtShort(cardInfo.debt)})</button>
            <button type="button" onClick={setHalfAmount} className="quick-amount-chip" style={{ flex: 1 }}>نصف</button>
            <button type="button" onClick={setQuarterAmount} className="quick-amount-chip" style={{ flex: 1 }}>ربع</button>
          </div>
          {parsedAmount > 0 && (
            <div className="mt-2 p-2.5 rounded-xl" style={{ background: 'var(--bg-muted)' }}>
              <div className="flex justify-between text-[11px] font-bold mb-1">
                <span style={{ color: 'var(--text-muted)' }}>المتبقي بعد السداد</span>
                <span className={`money tabular ${remainingAfter > 0 ? 'text-amber-600' : 'text-emerald-600'}`}>{fmt(remainingAfter)} ج.م</span>
              </div>
              <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-card)' }}>
                <div className="bg-emerald-500 h-full transition-all" style={{ width: `${Math.min(100, cardInfo.debt > 0 ? (parsedAmount / cardInfo.debt) * 100 : 100)}%` }}></div>
              </div>
            </div>
          )}
        </div>

        <div>
          <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>من حساب *</label>
          <div className="grid grid-cols-2 gap-2">
            {PAYMENT_METHODS.filter(m => m.group === 'account' && m.id !== HANY_TAB_METHOD).map(m => {
              const bal = safeNumber(liveBalances[m.id]);
              const isSel = sourceMethod === m.id;
              const insufficient = parsedAmount > 0 && bal < totalDebit - 0.005;
              return (
                <button key={m.id} type="button" onClick={() => setSourceMethod(m.id)} className={`payment-source-option ${isSel ? 'selected' : ''}`}>
                  <span style={{ fontSize: '18px' }}>{m.icon}</span>
                  <div className="flex-1 min-w-0 text-right">
                    <p className="font-black text-xs truncate">{m.label}</p>
                    <p className={`text-[10px] money tabular ${insufficient ? 'text-red-600' : ''}`} style={{ color: insufficient ? undefined : 'var(--text-muted)' }}>{fmtShort(bal)} ج.م</p>
                  </div>
                  {isSel && <CheckCircle2 size={14} className="text-emerald-500 flex-shrink-0" />}
                </button>
              );
            })}
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2">
          <div><label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>التاريخ *</label><SafeDateInput className="input-field text-xs font-bold py-3" value={date} onChange={setDate} /></div>
          <div><label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>ملاحظة</label><input type="text" className="input-field text-xs py-3" value={note} onChange={e => setNote(e.target.value)} placeholder="اختياري" /></div>
        </div>

        <div>
          <div className={`fee-toggle-row ${withFee ? 'active' : ''}`} onClick={() => setWithFee(!withFee)}>
            <div className="flex items-center gap-2">
              <Receipt size={16} style={{ color: withFee ? 'var(--warning)' : 'var(--text-muted)' }} />
              <div>
                <p className="text-xs font-black">يوجد رسوم سداد؟</p>
                <p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>فعّل لو البنك حاسبك على السداد</p>
              </div>
            </div>
            <div className={`w-10 h-6 rounded-full transition-all relative ${withFee ? 'bg-amber-500' : 'bg-slate-300 dark:bg-slate-600'}`}>
              <div className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all ${withFee ? 'right-0.5' : 'left-0.5'}`} />
            </div>
          </div>
          {withFee && (
            <div className="mt-2 animate-fadeIn">
              <input type="text" inputMode="decimal" className="input-field input-num text-sm text-center font-bold" style={{ color: 'var(--warning)' }} value={feeAmount} onChange={e => setFeeAmount(e.target.value)} placeholder="مبلغ الرسوم" />
            </div>
          )}
        </div>

        {parsedAmount > 0 && (
          <div className="p-3 rounded-xl" style={{ background: 'var(--bg-card-alt)', border: '1px solid var(--border-subtle)' }}>
            <div className="flex justify-between items-center mb-1.5 text-xs"><span style={{ color: 'var(--text-muted)' }}>السداد</span><span className="font-black money tabular">{fmt(parsedAmount)}</span></div>
            {withFee && parsedFee > 0 && (<div className="flex justify-between items-center mb-1.5 text-xs"><span style={{ color: 'var(--text-muted)' }}>الرسوم</span><span className="font-black text-amber-600 money tabular">+{fmt(parsedFee)}</span></div>)}
            <div className="flex justify-between items-center pt-1.5 text-sm" style={{ borderTop: '1px dashed var(--border-default)' }}>
              <span className="font-black">إجمالي الخصم</span>
              <span className="font-black text-red-600 money tabular">{fmt(totalDebit)}</span>
            </div>
            <div className="flex justify-between items-center mt-1 text-[11px]">
              <span style={{ color: 'var(--text-muted)' }}>الرصيد الحالي للحساب</span>
              <span className={`font-bold money tabular ${sourceBalance >= totalDebit ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(sourceBalance)}</span>
            </div>
          </div>
        )}

        <div className="flex gap-2 pt-1">
          <button type="button" onClick={onClose} className="btn btn-secondary flex-1 py-3 text-sm">إلغاء</button>
          <button type="button" onClick={handleSubmit} disabled={!canSubmit || submitting} className="btn flex-1 py-3 text-sm font-black"
            style={{ background: canSubmit ? 'linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%)' : 'var(--bg-muted)', color: canSubmit ? 'white' : 'var(--text-muted)', boxShadow: canSubmit ? '0 8px 20px -6px rgba(79,70,229,0.5)' : 'none' }}>
            {submitting ? 'جاري الحفظ...' : (<React.Fragment><Banknote size={16} /> تسجيل السداد</React.Fragment>)}
          </button>
        </div>
        {!canSubmit && parsedAmount > 0 && (
          <p className="text-[10px] text-center font-bold text-red-500">
            {sourceBalance < totalDebit ? '⚠️ الرصيد غير كافٍ' : parsedAmount > cardInfo.debt + 0.005 ? '⚠️ المبلغ أكبر من المديونية' : ''}
          </p>
        )}
      </div>
    </Modal>
  );
});

/* ═══════════════ RECONCILIATION MODAL ═══════════════ */
const ReconciliationModal = memo(({ accountKey, computedBalance, onClose, onReconcile, addNotification }) => {
  const [actualBalance, setActualBalance] = useState(String(computedBalance || 0));
  const [note, setNote] = useState('');

  const parsedActual = parseNumberInput(actualBalance);
  const diff = parsedActual - safeNumber(computedBalance);

  const handleReconcile = () => {
    if (!accountKey) return;
    onReconcile({ accountKey, actualBalance: parsedActual, diff, note: note.trim(), computedBalance: safeNumber(computedBalance) });
    onClose();
  };

  return (
    <Modal isOpen={true} onClose={onClose} title="مطابقة الرصيد" icon="⚖️">
      <div className="space-y-4">
        <div className="p-3 rounded-xl" style={{ background: 'var(--bg-muted)' }}>
          <div className="flex items-center gap-2 mb-2">
            <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600"><Scale size={16} /></div>
            <div>
              <p className="text-xs font-black">{ACCOUNT_SHORT_NAMES[accountKey] || accountKey}</p>
              <p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>مطابقة الرصيد الفعلي مع الرصيد المحسوب</p>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div className="p-3 rounded-xl bg-blue-50 dark:bg-blue-950/30 text-center">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400 mb-1">الرصيد المحسوب</p>
            <p className="text-base font-black text-blue-600 money tabular">{fmt(computedBalance)}</p>
          </div>
          <div className="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 text-center">
            <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400 mb-1">الرصيد الفعلي</p>
            <p className="text-base font-black text-emerald-600 money tabular">{fmt(parsedActual)}</p>
          </div>
        </div>

        <div>
          <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الرصيد الفعلي (من البنك)</label>
          <input type="text" inputMode="decimal" className="input-field input-num text-2xl text-center font-black py-4" style={{ color: 'var(--accent)' }} value={actualBalance} onChange={e => setActualBalance(e.target.value)} placeholder="0.00" />
        </div>

        {Math.abs(diff) > 0.005 && (
          <div className={`p-3 rounded-xl text-center ${diff > 0 ? 'bg-emerald-50 dark:bg-emerald-950/30' : 'bg-red-50 dark:bg-red-950/30'}`}>
            <p className={`text-[11px] font-bold ${diff > 0 ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-700 dark:text-red-400'}`}>
              {diff > 0 ? '⬆️ زيادة فعلية' : '⬇️ عجز فعلي'}
            </p>
            <p className={`text-2xl font-black money tabular ${diff > 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(Math.abs(diff))} ج.م</p>
            <p className="text-[10px] mt-1" style={{ color: 'var(--text-muted)' }}>سيتم إنشاء قيد تسوية تلقائياً</p>
          </div>
        )}

        {Math.abs(diff) <= 0.005 && parsedActual === safeNumber(computedBalance) && (
          <div className="p-3 rounded-xl text-center bg-emerald-50 dark:bg-emerald-950/30">
            <CheckCircle2 size={20} className="text-emerald-600 mx-auto mb-1" />
            <p className="text-xs font-bold text-emerald-700 dark:text-emerald-400">مطابق تماماً — لا حاجة لتسوية</p>
          </div>
        )}

        <div>
          <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>ملاحظة (اختياري)</label>
          <input type="text" className="input-field text-sm" value={note} onChange={e => setNote(e.target.value)} placeholder="سبب الفرق..." />
        </div>

        <div className="flex gap-2">
          <button onClick={onClose} className="btn btn-secondary flex-1 py-3 text-sm">إلغاء</button>
          <button onClick={handleReconcile} className="btn btn-primary flex-1 py-3 text-sm">
            <Scale size={16} /> {Math.abs(diff) > 0.005 ? 'تسوية الفرق' : 'تأكيد المطابقة'}
          </button>
        </div>
      </div>
    </Modal>
  );
});

/* ═══════════════ SETTINGS VIEW ═══════════════ */
const SettingsView = memo(({
  data, accountsData, cards, budgets, dispatch, saveHistory, addNotification,
  onResetPersonalData
}) => {
  const [localAccounts, setLocalAccounts] = useState(() => JSON.parse(JSON.stringify(accountsData)));
  const [localCards, setLocalCards] = useState(() => cards.map(c => ({ ...c })));
  const [activeSection, setActiveSection] = useState('accounts');
  const [hasChanges, setHasChanges] = useState(false);
  const [driveBusy, setDriveBusy] = useState(false);
  const [driveStatus, setDriveStatus] = useState('');
  const [folderIdInput, setFolderIdInput] = useState(() => localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID);
  const isDirtyRef = useRef(false);

  useEffect(() => {
    if (isDirtyRef.current) return;
    setLocalAccounts(JSON.parse(JSON.stringify(accountsData)));
    setHasChanges(false);
  }, [accountsData]);

  useEffect(() => {
    if (isDirtyRef.current) return;
    setLocalCards(cards.map(c => ({ ...c })));
    setHasChanges(false);
  }, [cards]);

  const handleAccountChange = (key, field, value) => {
    setLocalAccounts(prev => ({ ...prev, [key]: { ...prev[key], [field]: value } }));
    setHasChanges(true);
    isDirtyRef.current = true;
  };
  const handleCardChange = (id, field, value) => {
    setLocalCards(prev => prev.map(c => {
      if (c.id !== id) return c;
      const u = { ...c, [field]: value };
      if (field === 'limit') u.availableBalance = Math.max(0, safeNumber(value) - safeNumber(u.openingDebt));
      return u;
    }));
    setHasChanges(true);
    isDirtyRef.current = true;
  };

  const handleSave = () => {
    saveHistory();
    const cleaned = {};
    const today = getLocalISODate();
    ACCOUNT_KEYS.forEach(k => {
      const oldInit = safeNumber(accountsData[k]?.initialBalance);
      const newInit = parseNumberInput(localAccounts[k]?.initialBalance);
      const oldProviderKey = accountsData[k]?.providerKey || DEFAULT_ACCOUNTS[k].providerKey;
      const oldType = accountsData[k]?.type || DEFAULT_ACCOUNTS[k].type;
      cleaned[k] = {
        ...localAccounts[k], initialBalance: newInit, balance: newInit,
        initialDate: (oldInit !== newInit) ? today : (localAccounts[k]?.initialDate || null),
        lastUpdated: (oldInit !== newInit) ? today : (localAccounts[k]?.lastUpdated || null),
        providerKey: localAccounts[k]?.providerKey || oldProviderKey,
        type: localAccounts[k]?.type || oldType
      };
    });
    dispatch({ type: 'UPDATE_ACCOUNTS', payload: cleaned });
    dispatch({
      type: 'UPDATE_CARDS',
      payload: localCards.map(c => ({
        ...c,
        limit: safeNumber(c.limit),
        openingDebt: safeNumber(c.openingDebt),
        statementDay: Math.min(28, Math.max(1, safeNumber(c.statementDay, 5))),
        openingDebtDate: c.openingDebtDate || getLocalISODate(),
        openingDate: c.openingDate || getLocalISODate(),
        cashbackRate: safeNumber(c.cashbackRate, 0),
        subCardLast4: Array.isArray(c.subCardLast4) ? c.subCardLast4 : [],
        providerKey: c.providerKey || 'cib'
      }))
    });
    addNotification({ type: 'success', title: 'تم الحفظ' });
    setHasChanges(false);
    isDirtyRef.current = false;
  };

  const handleDriveConnect = async () => {
    setDriveBusy(true); setDriveStatus('جاري الاتصال...');
    try { await ensureDriveToken(); setDriveStatus('متصل'); addNotification({ type: 'success', title: 'Drive متصل' }); }
    catch (e) { setDriveStatus('فشل: ' + e.message); }
    finally { setDriveBusy(false); }
  };

  const handleDriveBackupNow = async () => {
    setDriveBusy(true); setDriveStatus('جاري الرفع...');
    try {
      const payload = { data, budgets, exportedAt: new Date().toISOString(), version: 'V88.1.1' };
      const result = await uploadBackupToDrive(payload);
      localStorage.setItem(AUTO_BACKUP_LS_KEY, String(Date.now()));
      const folderId = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;
      setDriveStatus(`✅ تم الرفع: ${result.name}`);
      addNotification({ type: 'success', title: 'تم رفع النسخة', duration: 6000 });
      if (folderId) {
        setTimeout(() => {
          dispatch({
            type: 'SHOW_CONFIRM', danger: false,
            title: '✅ تم الرفع بنجاح',
            message: 'هل تريد فتح المجلد في Google Drive للتأكد؟',
            onConfirm: () => { window.open(`https://drive.google.com/drive/folders/${folderId}`, '_blank'); dispatch({ type: 'HIDE_CONFIRM' }); },
            onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
          });
        }, 600);
      }
    } catch (e) { setDriveStatus('❌ فشل: ' + e.message); addNotification({ type: 'error', title: 'فشل الرفع', message: e.message }); }
    finally { setDriveBusy(false); }
  };

  const handleDriveRestore = async () => {
    setDriveBusy(true); setDriveStatus('جاري الجلب...');
    try {
      const files = await listDriveBackups();
      if (files.length === 0) { setDriveStatus('لا توجد نسخ'); setDriveBusy(false); return; }
      const labels = files.slice(0, 10).map((f, i) => `${i + 1}) ${f.name}`).join('\n');
      const choice = await showInputModal({ title: 'اختر رقم النسخة', icon: '☁️', message: labels, inputValue: '1', numeric: true, confirmText: 'استعادة' });
      if (!choice) { setDriveBusy(false); setDriveStatus(''); return; }
      const idx = Math.max(1, Math.min(files.length, parseInt(choice, 10) || 1)) - 1;
      const file = files[idx];
      const payload = await downloadBackupFromDrive(file.id);
      if (!payload?.data) throw new Error('الملف لا يحتوي بيانات');
      dispatch({
        type: 'SHOW_CONFIRM', danger: true,
        title: 'استعادة نسخة', message: 'سيتم استبدال بياناتك',
        onConfirm: () => {
          saveHistory();
          dispatch({ type: 'SET_DATA', payload: migrateData(payload.data) });
          if (payload.budgets) dispatch({ type: 'SET_BUDGETS', payload: payload.budgets });
          addNotification({ type: 'success', title: 'تمت الاستعادة' });
        },
        onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
      });
    } catch (e) { setDriveStatus('فشل: ' + e.message); }
    finally { setDriveBusy(false); }
  };

  const handleResetCardsToZero = () => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'تصفير بطاقات', message: 'سيتم تصفير مديونيات البطاقات مع الاحتفاظ بالأسماء والحدود',
      onConfirm: () => {
        saveHistory();
        dispatch({
          type: 'UPDATE_CARDS',
          payload: cards.map(c => ({ ...c, openingDebt: 0, availableBalance: safeNumber(c.limit), openingDebtDate: getLocalISODate(), openingDate: getLocalISODate() }))
        });
        addNotification({ type: 'success', title: 'تم التصفير' });
        dispatch({ type: 'HIDE_CONFIRM' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const handleFreshStartWithCardsAndHany = () => {
    if (onResetPersonalData) {
      onResetPersonalData({ keepHanyTransactions: true, keepRecurringItems: true, keepCards: true, keepLoansOtherThanHany: false });
    }
  };

  const handleFreshStart = () => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: '⚠️ بداية جديدة — تصفير شامل',
      message: 'سيتم مسح كل المعاملات والقروض والبنود المتكررة والعهد والخطط.\nلن تُمس أسماء الحسابات وأرقام البطاقات والإعدادات.',
      onConfirm: () => {
        saveHistory();
        const zeroed = {};
        ACCOUNT_KEYS.forEach(k => {
          zeroed[k] = { ...(accountsData[k] || {}), initialBalance: 0, balance: 0, initialDate: null, lastUpdated: null };
        });
        const allRemovedIds = (data.transactions || []).map(t => t.id).filter(Boolean);
        const fresh = {
          ...data, transactions: [], loans: [], closedMonths: [], monthlySnapshots: {},
          accountsData: zeroed,
          cards: (data.cards || []).map(c => ({ ...c, openingDebt: 0, availableBalance: safeNumber(c.limit), openingDebtDate: null, openingDate: null })),
          recurringItems: [], materializedRecurring: {}, custodyEntries: [], cashbackTrackers: [], monthlyPlans: {},
          cardInstallments: [],
          settledHanyMonths: [], deletedTxIds: allRemovedIds, deletedTxArchive: [], deletedDefaultIds: [], deleteRequests: [], auditLog: [],
          hanyPayableCache: 0
        };
        dispatch({ type: 'SET_DATA', payload: fresh });
        addNotification({ type: 'success', title: 'تم التصفير الشامل', duration: 5000 });
        dispatch({ type: 'HIDE_CONFIRM' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const openDriveFolder = () => {
    const id = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;
    window.open(`https://drive.google.com/drive/folders/${id}`, '_blank');
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card flex justify-between items-center flex-wrap gap-3">
        <div className="flex items-center gap-2">
          <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><Sliders size={16} /></div>
          <h2 className="text-base font-black">الإعدادات</h2>
        </div>
        {hasChanges && (<button onClick={handleSave} className="btn btn-primary text-xs"><Save size={14} /> حفظ التغييرات</button>)}
      </div>

      <div className="card p-1 flex gap-1.5">
        {[{ id: 'accounts', label: 'الحسابات', icon: Wallet }, { id: 'cards', label: 'الكروت', icon: CreditCard }].map(s => {
          const Icon = s.icon;
          return (
            <button key={s.id} onClick={() => setActiveSection(s.id)}
              className={`flex-1 py-2.5 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 transition-all ${activeSection === s.id ? 'text-white shadow-sm' : ''}`}
              style={activeSection === s.id ? { background: 'var(--accent)' } : { color: 'var(--text-muted)' }}>
              <Icon size={14} /> {s.label}
            </button>
          );
        })}
      </div>

      {activeSection === 'accounts' && (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          {ACCOUNT_KEYS.map(key => {
            const acc = localAccounts[key] || {};
            const Icon = ACCOUNT_ICONS[key] || Wallet;
            const last4 = DEFAULT_ACCOUNTS[key]?.last4;
            const isWallet = WALLET_METHOD_IDS.has(key);
            const isCash = CASH_METHOD_IDS.has(key);
            return (
              <div key={key} className="card">
                <div className="flex justify-between items-center mb-3">
                  <div className="flex items-center gap-2">
                    <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><Icon size={14} /></div>
                    <h4 className="font-black text-xs">{acc.label || key}</h4>
                    {isCash && <span className="badge badge-success text-[8px]">كاش</span>}
                    {isWallet && <span className="badge badge-accent text-[8px]">محفظة</span>}
                  </div>
                </div>
                <div className="space-y-2.5">
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الرصيد الافتتاحي</label>
                    <input type="text" inputMode="decimal" value={acc.initialBalance ?? ''} onChange={e => handleAccountChange(key, 'initialBalance', e.target.value)}
                      className="input-field input-num text-base text-center py-2" style={{ color: 'var(--accent)' }} />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>تاريخ الافتتاح</label>
                    <SafeDateInput value={acc.initialDate || ''} onChange={v => handleAccountChange(key, 'initialDate', v)}
                      className="input-field text-center font-bold text-xs py-2" />
                  </div>
                  {last4 && (
                    <div className="p-2 rounded-lg text-center" style={{ background: 'var(--bg-muted)' }}>
                      <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>رقم البطاقة</p>
                      <p className="font-mono font-bold text-xs mt-0.5">•••• {last4}</p>
                    </div>
                  )}

/* ═══════════════ CYCLE PARAMETERS ═══════════════ */
const getCardCycleParams = (card) => {
  const dueDayMatch = String(card?.dueDate || '25').match(/(\d{1,2})/);
  const dueDay = Math.min(28, Math.max(1, dueDayMatch ? parseInt(dueDayMatch[1], 10) : 25));
  let statementDay = safeNumber(card?.statementDay, 0);
  if (statementDay < 1 || statementDay > 28) {
    statementDay = dueDay > 20 ? dueDay - 20 : dueDay + 10;
    statementDay = Math.min(28, Math.max(1, statementDay));
  }
  return { dueDay, statementDay };
};

const getCycleKeyForDate = (card, dateISO) => {
  const d = parseISODate(dateISO);
  if (!d) return null;
  const { statementDay } = getCardCycleParams(card);
  let endMonth = d.getMonth();
  let endYear = d.getFullYear();
  if (d.getDate() > statementDay) {
    endMonth++;
    if (endMonth > 11) { endMonth = 0; endYear++; }
  }
  return `${endYear}-${String(endMonth + 1).padStart(2, '0')}`;
};

const getCycleRange = (card, cycleKey) => {
  const parts = String(cycleKey).split('-');
  if (parts.length !== 2) return null;
  const y = Number(parts[0]);
  const m = Number(parts[1]);
  if (isNaN(y) || isNaN(m) || m < 1 || m > 12) return null;

  const { dueDay, statementDay } = getCardCycleParams(card);

  const cycleEnd = new Date(y, m - 1, statementDay);
  let sm = m - 2, sy = y;
  if (sm < 0) { sm = 11; sy--; }
  const cycleStart = new Date(sy, sm, statementDay + 1);

  let dm = m - 1, dy = y;
  if (dueDay < statementDay) {
    dm++;
    if (dm > 11) { dm = 0; dy++; }
  }
  const dueDate = new Date(dy, dm, dueDay);

  return {
    cycleStart, cycleEnd, dueDate, statementDate: cycleEnd,
    cycleStartISO: getLocalISODate(cycleStart),
    cycleEndISO: getLocalISODate(cycleEnd),
    statementDateISO: getLocalISODate(cycleEnd),
    dueDateISO: getLocalISODate(dueDate)
  };
};

/* ═══════════════ INSTALLMENTS ENGINE ═══════════════ */
const computeInstallmentProgress = (plan, asOfDate = new Date()) => {
  if (!plan || !plan.months || plan.months <= 0) {
    return { monthsElapsed: 0, dueAmount: 0, remainingAmount: 0, remainingMonths: 0, completed: false, monthlyAmount: 0, progressPct: 0 };
  }
  const startMonthIdx = getMonthIndex(plan.startMonth);
  const startYM = safeNumber(plan.startYear, 2026) * 12 + (startMonthIdx >= 0 ? startMonthIdx : 0);
  const nowYM = asOfDate.getFullYear() * 12 + asOfDate.getMonth();

  let monthsElapsed = Math.max(0, nowYM - startYM + 1);
  monthsElapsed = Math.min(monthsElapsed, plan.months);

  const monthlyAmount = safeNumber(plan.monthlyAmount, safeNumber(plan.totalAmount) / plan.months);
  const dueAmount = monthsElapsed * monthlyAmount;
  const remainingAmount = Math.max(0, safeNumber(plan.totalAmount) - dueAmount);
  const remainingMonths = Math.max(0, plan.months - monthsElapsed);
  const progressPct = plan.months > 0 ? (monthsElapsed / plan.months) * 100 : 0;

  return { monthsElapsed, dueAmount, remainingAmount, remainingMonths, monthlyAmount, completed: monthsElapsed >= plan.months, progressPct };
};

// ✅ V88.1.1 — الدالة اللي كان مرجعها مفقود في Part 3
const computeCardInstallmentsInfo = (data, card, asOfDate = new Date()) => {
  if (!card) return { plans: [], activeCount: 0, totalDueSoFar: 0, totalRemaining: 0, currentMonthly: 0 };
  const plans = (data?.cardInstallments || []).filter(p => p && p.cardId === card.id && p.status !== 'cancelled');
  let totalDueSoFar = 0, totalRemaining = 0, currentMonthly = 0;
  const enriched = plans.map(p => {
    const prog = computeInstallmentProgress(p, asOfDate);
    totalDueSoFar += prog.dueAmount;
    totalRemaining += prog.remainingAmount;
    if (!prog.completed) currentMonthly += prog.monthlyAmount;
    return { ...p, ...prog };
  });
  return { plans: enriched, activeCount: enriched.filter(p => !p.completed).length, totalDueSoFar, totalRemaining, currentMonthly };
};

/* ═══════════════ STATEMENT CYCLE ENGINE ═══════════════ */
const buildCardStatementEngine = (card, data, asOfDate = new Date()) => {
  if (!card) return { cycles: [], currentStatement: null, openCycle: null, totalDebt: 0, installmentsInfo: null };

  const openingDebt = safeNumber(card.openingDebt);
  const openingDate = parseISODate(card.openingDebtDate || card.openingDate);
  const now = new Date(asOfDate);
  const upperTime = now.getTime();

  const method = getCardMethod(card);
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
  const allTxs = (data?.transactions || []).filter(t => {
    if (!t || t.status !== 'paid') return false;
    if (t.source === 'void' || t.source === 'carryover' || isCarryoverMarker(t)) return false;
    if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return false;
    if (t.method === HANY_TAB_METHOD) return false;
    const hasExplicitLink = t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== '';
    if (hasExplicitLink) return t.linkedCardId === card.id;
    if (t.cardLast4 && subCards.includes(t.cardLast4)) return true;
    return t.method === method;
  }).sort((a, b) => {
    const da = parseISODate(a.date)?.getTime() ?? 0;
    const db = parseISODate(b.date)?.getTime() ?? 0;
    if (da !== db) return da - db;
    return (getTxTimestamp(a) || 0) - (getTxTimestamp(b) || 0);
  });

  const instInfo = computeCardInstallmentsInfo(data, card, now);

  const cycleKeysSet = new Set();
  allTxs.forEach(t => {
    const d = parseISODate(t.date);
    if (!d) return;
    if (openingDate && d < openingDate) return;
    if (d > now) return;
    const k = getCycleKeyForDate(card, t.date);
    if (k) cycleKeysSet.add(k);
  });

  if (openingDate) {
    const k = getCycleKeyForDate(card, getLocalISODate(openingDate));
    if (k) cycleKeysSet.add(k);
  }

  instInfo.plans.forEach(plan => {
    if (plan.status === 'cancelled') return;
    const startIdx = getMonthIndex(plan.startMonth);
    if (startIdx < 0) return;
    for (let i = 0; i < plan.months; i++) {
      const totalIdx = startIdx + i;
      const m = totalIdx % 12;
      const y = safeNumber(plan.startYear, 2026) + Math.floor(totalIdx / 12);
      cycleKeysSet.add(`${y}-${String(m + 1).padStart(2, '0')}`);
    }
  });

  const sortedKeys = Array.from(cycleKeysSet).sort();
  if (sortedKeys.length === 0) {
    return {
      cycles: [], currentStatement: null, openCycle: null,
      totalDebt: openingDebt, installmentsInfo: instInfo,
      cycleParams: getCardCycleParams(card), openingDebt, openingDate
    };
  }

  let runningBalance = openingDebt;
  const cycles = [];

  sortedKeys.forEach((cycleKey) => {
    const range = getCycleRange(card, cycleKey);
    if (!range) return;

    const { cycleStart, cycleEnd, dueDate, statementDate } = range;
    const cycleStartTs = cycleStart.getTime();
    const cycleEndTs = cycleEnd.getTime();
    const statementTs = statementDate.getTime();
    const dueTs = dueDate.getTime();

    if (cycleStartTs > upperTime) return;

    const cycleTxs = allTxs.filter(t => {
      const d = parseISODate(t.date);
      if (!d) return false;
      const ts = d.getTime();
      if (openingDate && d < openingDate) return false;
      return ts >= cycleStartTs && ts <= cycleEndTs;
    });

    const purchases = cycleTxs.filter(t => t.type === 'expense' && !isCardPaymentTx(t, card.id)).reduce((s, t) => s + safeNumber(t.amount), 0);
    const refunds = cycleTxs.filter(t => t.type === 'income' && !isCardPaymentTx(t, card.id)).reduce((s, t) => s + safeNumber(t.amount), 0);
    const paymentsInCycle = cycleTxs.filter(t => isCardPaymentTx(t, card.id)).reduce((s, t) => s + safeNumber(t.amount), 0);

    let installmentsDueThisCycle = 0;
    const dueMonthIdx = dueDate.getMonth();
    const dueYM = dueDate.getFullYear() * 12 + dueMonthIdx;
    instInfo.plans.forEach(plan => {
      if (plan.status === 'cancelled') return;
      const pStartIdx = getMonthIndex(plan.startMonth);
      if (pStartIdx < 0) return;
      const pStartYM = safeNumber(plan.startYear, 2026) * 12 + pStartIdx;
      const diff = dueYM - pStartYM;
      if (diff >= 0 && diff < plan.months) {
        installmentsDueThisCycle += plan.monthlyAmount;
      }
    });

    const openingBalance = runningBalance;
    const closingBalance = openingBalance + purchases - refunds - paymentsInCycle;
    runningBalance = closingBalance;

    const minBase = closingBalance > 0 ? Math.max(100, Math.round(closingBalance * 0.05 * 100) / 100) : 0;
    const minDue = minBase + installmentsDueThisCycle;
    const totalDue = Math.max(0, closingBalance) + installmentsDueThisCycle;

    let status = 'open';
    if (upperTime > cycleEndTs && upperTime > statementTs) status = 'closed';
    if (upperTime > dueTs && closingBalance > 0.01) status = 'overdue';
    if (closingBalance <= 0.01 && upperTime > cycleEndTs) status = 'paid';

    const daysUntilDue = Math.ceil((dueTs - upperTime) / 86400000);

    cycles.push({
      cycleKey,
      cycleStartISO: range.cycleStartISO, cycleEndISO: range.cycleEndISO,
      statementDateISO: range.statementDateISO, dueDateISO: range.dueDateISO,
      cycleStart, cycleEnd, statementDate, dueDate,
      openingBalance, purchases, refunds, paymentsInCycle,
      closingBalance, installmentsDueThisCycle, minDue, totalDue, minBase,
      status, daysUntilDue, txCount: cycleTxs.length, transactions: cycleTxs,
      isPaid: closingBalance <= 0.01
    });
  });

  const closedWithBalance = cycles.filter(c => c.status === 'closed' || c.status === 'overdue');
  const openCycles = cycles.filter(c => c.status === 'open');

  const currentStatement = closedWithBalance.length > 0 ? closedWithBalance[closedWithBalance.length - 1] : null;
  const openCycle = openCycles.length > 0 ? openCycles[openCycles.length - 1] : null;

  return {
    cycles, currentStatement, openCycle,
    totalDebt: runningBalance,
    installmentsInfo: instInfo,
    cycleParams: getCardCycleParams(card),
    openingDebt, openingDate
  };
};

/* ═══════════════ SMART PREDICTION ═══════════════ */
const computeCardPaymentPrediction = (data, card, asOfDate = new Date()) => {
  if (!card) return null;
  const engine = buildCardStatementEngine(card, data, asOfDate);
  const now = new Date(asOfDate);

  const currentDebt = Math.max(0, computeCardDebt(data, card, asOfDate));
  const instInfo = engine.installmentsInfo || { currentMonthly: 0, totalRemaining: 0, activeCount: 0, plans: [] };

  const currentStatement = engine.currentStatement;
  const openCycle = engine.openCycle;

  const statementBalance = currentStatement ? Math.max(0, currentStatement.closingBalance) : 0;
  const installmentsThisMonth = currentStatement ? currentStatement.installmentsDueThisCycle : 0;
  const minBase = currentStatement ? currentStatement.minBase : 0;
  const minPayment = currentStatement ? currentStatement.minDue : 0;
  const totalMandatory = currentStatement ? currentStatement.totalDue : 0;

  const nextCycleEstimate = openCycle ? Math.max(0, openCycle.closingBalance) + openCycle.installmentsDueThisCycle : 0;
  const nextCycleDueDate = openCycle ? openCycle.dueDate : null;

  const dueDate = currentStatement ? currentStatement.dueDate : (openCycle ? openCycle.dueDate : null);
  const daysUntilDue = dueDate ? Math.ceil((dueDate.getTime() - now.getTime()) / 86400000) : null;

  const limit = safeNumber(card.limit);
  const availableLimit = Math.max(0, limit - currentDebt - instInfo.totalRemaining);

  return {
    cardId: card.id,
    cardName: `${card.bank} - ${card.name}`,
    last4: card.last4,
    currentDebt, statementBalance, installmentsThisMonth,
    minBase, minPayment, totalMandatory,
    nextCycleEstimate, nextCycleDueDate,
    fullPayment: currentDebt,
    nextDueDate: dueDate,
    nextDueDateISO: dueDate ? getLocalISODate(dueDate) : null,
    daysUntilDue,
    urgency: daysUntilDue === null ? 'normal'
      : daysUntilDue <= 0 ? 'overdue'
      : daysUntilDue <= 3 ? 'urgent'
      : daysUntilDue <= 7 ? 'soon'
      : 'normal',
    activeInstallments: instInfo.activeCount,
    installmentsRemainingTotal: instInfo.totalRemaining,
    availableLimit, limit, plans: instInfo.plans,
    cycles: engine.cycles,
    currentStatement, openCycle,
    cycleParams: engine.cycleParams
  };
};

const computeAllCardsPredictions = (data, asOfDate = new Date()) =>
  (data?.cards || []).map(c => computeCardPaymentPrediction(data, c, asOfDate)).filter(Boolean);

const computeTotalMonthlyObligation = (data, asOfDate = new Date()) => {
  const preds = computeAllCardsPredictions(data, asOfDate);
  return {
    totalDebt: preds.reduce((s, p) => s + p.currentDebt, 0),
    totalMinPayment: preds.reduce((s, p) => s + p.minPayment, 0),
    totalInstallments: preds.reduce((s, p) => s + p.installmentsThisMonth, 0),
    totalMandatory: preds.reduce((s, p) => s + p.totalMandatory, 0),
    totalNextCycle: preds.reduce((s, p) => s + p.nextCycleEstimate, 0),
    totalFullPayment: preds.reduce((s, p) => s + p.fullPayment, 0),
    predictions: preds
  };
};

/* ═══════════════ INSTALLMENT PLAN MODAL ═══════════════ */
const InstallmentPlanModal = memo(({ card, data, onClose, dispatch, saveHistory, addNotification }) => {
  const [totalAmount, setTotalAmount] = useState('');
  const [months, setMonths] = useState('12');
  const [startMonth, setStartMonth] = useState(getDefaultMonthYear().month);
  const [startYear, setStartYear] = useState(getDefaultMonthYear().year);
  const [note, setNote] = useState('');
  const [selectedTxIds, setSelectedTxIds] = useState(new Set());

  const cardTxs = useMemo(() => {
    if (!card) return [];
    const method = getCardMethod(card);
    const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
    return (data.transactions || [])
      .filter(t => {
        if (t.status !== 'paid' || t.type !== 'expense') return false;
        if (t.installmentPlanId) return false;
        if (isCardPaymentTx(t, card.id)) return false;
        if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return false;
        if (t.method === HANY_TAB_METHOD) return false;
        if (t.method !== method && t.linkedCardId !== card.id && !(t.cardLast4 && subCards.includes(t.cardLast4))) return false;
        return true;
      })
      .sort(compareTransactions).slice(0, 50);
  }, [data.transactions, card]);

  const parsedTotal = parseNumberInput(totalAmount);
  const parsedMonths = Math.max(1, Math.min(60, parseInt(months, 10) || 12));
  const monthlyAmount = parsedTotal > 0 ? roundMoney(parsedTotal / parsedMonths) : 0;

  const handleCreate = () => {
    if (parsedTotal <= 0) { addNotification({ type: 'error', title: 'أدخل مبلغ صحيح' }); return; }
    const startIdx = getMonthIndex(startMonth);
    if (startIdx < 0) { addNotification({ type: 'error', title: 'شهر بداية غير صالح' }); return; }

    const plan = {
      id: getSafeId(), cardId: card.id,
      totalAmount: roundMoney(parsedTotal), months: parsedMonths, monthlyAmount,
      startMonth, startYear: safeNumber(startYear, 2026),
      note: note.trim(), status: 'active',
      linkedTxIds: Array.from(selectedTxIds),
      createdAt: new Date().toISOString()
    };

    saveHistory();
    const newPlans = [...(data.cardInstallments || []), plan];
    const newTxs = selectedTxIds.size > 0
      ? (data.transactions || []).map(t => selectedTxIds.has(t.id) ? { ...t, installmentPlanId: plan.id } : t)
      : (data.transactions || []);

    dispatch({ type: 'SET_DATA', payload: { ...data, cardInstallments: newPlans, transactions: newTxs } });
    addNotification({
      type: 'success', title: '✅ تم إنشاء خطة التقسيط',
      message: `${fmt(parsedTotal)} ج.م على ${parsedMonths} شهر (${fmt(monthlyAmount)} ج.م/شهر)`,
      duration: 6000
    });
    onClose();
  };

  const toggleTx = (id) => setSelectedTxIds(prev => {
    const n = new Set(prev);
    if (n.has(id)) n.delete(id); else n.add(id);
    return n;
  });

  const autoFillFromSelected = () => {
    const sum = cardTxs.filter(t => selectedTxIds.has(t.id)).reduce((s, t) => s + safeNumber(t.amount), 0);
    if (sum > 0) setTotalAmount(String(roundMoney(sum)));
  };

  return (
    <Modal isOpen={true} onClose={onClose} title="خطة تقسيط جديدة" icon="📅" size="lg">
      <div className="space-y-4">
        <div className="p-3 rounded-xl" style={{ background: 'var(--accent-soft)', border: '1px solid var(--accent)' }}>
          <p className="text-[11px] font-bold" style={{ color: 'var(--accent)' }}>💳 {card.bank} - {card.name} • ••••{card.last4}</p>
          <p className="text-[10px] mt-1" style={{ color: 'var(--text-secondary)' }}>الحد: {fmt(card.limit)} ج.م • المديونية: {fmt(computeCardDebt(data, card))} ج.م</p>
        </div>

        <div>
          <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>اختر المعاملات لضمها (اختياري)</label>
          {cardTxs.length === 0 ? (
            <p className="text-[11px] p-2 rounded-lg" style={{ background: 'var(--bg-muted)', color: 'var(--text-muted)' }}>لا توجد معاملات مؤهلة</p>
          ) : (
            <div className="space-y-1.5 max-h-40 overflow-y-auto scroll-hide p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              {cardTxs.slice(0, 20).map(t => (
                <label key={t.id} className="flex items-center gap-2 p-1.5 rounded cursor-pointer hover:bg-[color:var(--bg-card)]">
                  <input type="checkbox" checked={selectedTxIds.has(t.id)} onChange={() => toggleTx(t.id)} className="w-3.5 h-3.5 accent-[color:var(--accent)]" />
                  <span className="text-[10px] font-bold flex-1 truncate">{t.description || t.category}</span>
                  <span className="text-[10px] font-black money tabular">{fmt(t.amount)}</span>
                </label>
              ))}
              {selectedTxIds.size > 0 && (
                <button type="button" onClick={autoFillFromSelected} className="btn btn-secondary w-full text-[10px] py-1.5 mt-1">
                  <Sparkles size={11} /> استخدم مجموع المحدد ({fmt(cardTxs.filter(t => selectedTxIds.has(t.id)).reduce((s, t) => s + safeNumber(t.amount), 0))})
                </button>
              )}
            </div>
          )}
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>إجمالي المبلغ *</label>
            <input type="text" inputMode="decimal" className="input-field input-num text-base text-center font-black" style={{ color: 'var(--accent)' }} value={totalAmount} onChange={e => setTotalAmount(e.target.value)} placeholder="0.00" />
          </div>
          <div>
            <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>عدد الأشهر *</label>
            <input type="number" min="1" max="60" className="input-field text-base text-center font-black" value={months} onChange={e => setMonths(e.target.value)} />
            <div className="flex gap-1 mt-1.5">
              {[3, 6, 12, 18, 24, 36].map(m => (
                <button key={m} type="button" onClick={() => setMonths(String(m))} className={`quick-chip flex-1 text-[9px] py-1 ${months === String(m) ? 'bg-[color:var(--accent)] text-white' : ''}`}>{m}</button>
              ))}
            </div>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>شهر البداية</label>
            <select className="input-field text-sm py-2" value={startMonth} onChange={e => setStartMonth(e.target.value)}>
              {getMonthsForYear(startYear).map(m => <option key={m} value={m}>{m}</option>)}
            </select>
          </div>
          <div>
            <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>السنة</label>
            <select className="input-field text-sm py-2" value={startYear} onChange={e => setStartYear(Number(e.target.value))}>
              {YEARS_LIST.map(y => <option key={y} value={y}>{y}</option>)}
            </select>
          </div>
        </div>

        {parsedTotal > 0 && (
          <div className="p-3 rounded-xl text-center" style={{ background: 'linear-gradient(135deg, rgba(99,91,255,0.12), rgba(74,66,229,0.08))', border: '1px solid var(--accent)' }}>
            <p className="text-[11px] font-bold" style={{ color: 'var(--accent)' }}>القسط الشهري</p>
            <p className="text-2xl font-black money tabular" style={{ color: 'var(--accent)' }}>{fmt(monthlyAmount)}</p>
            <p className="text-[10px] mt-1" style={{ color: 'var(--text-secondary)' }}>ج.م/شهر × {parsedMonths} شهر = {fmt(parsedTotal)} ج.م</p>
          </div>
        )}

        <div>
          <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>ملاحظة (اختياري)</label>
          <input type="text" className="input-field text-sm" value={note} onChange={e => setNote(e.target.value)} placeholder="مثال: تقسيط تلفزيون" />
        </div>

        <div className="p-2.5 rounded-lg flex items-start gap-2" style={{ background: 'var(--warning-soft)' }}>
          <Info size={14} className="text-amber-600 mt-0.5 flex-shrink-0" />
          <p className="text-[10px] font-bold text-amber-700 dark:text-amber-400 leading-relaxed">
            💡 البنك يحجز {parsedTotal > 0 ? fmt(parsedTotal) : 'المبلغ'} من الحد المتاح، لكن المديونية تُحسب قسطاً بقسط في كل دورة.
          </p>
        </div>

        <div className="flex gap-2 pt-1">
          <button type="button" onClick={onClose} className="btn btn-secondary flex-1 py-3 text-sm">إلغاء</button>
          <button type="button" onClick={handleCreate} disabled={parsedTotal <= 0}
            className="btn flex-1 py-3 text-sm font-black"
            style={{ background: parsedTotal > 0 ? 'linear-gradient(135deg, #635BFF 0%, #4A42E5 100%)' : 'var(--bg-muted)', color: parsedTotal > 0 ? 'white' : 'var(--text-muted)' }}>
            <CheckCircle2 size={16} /> إنشاء الخطة
          </button>
        </div>
      </div>
    </Modal>
  );
});

/* ═══════════════ INSTALLMENTS PANEL ═══════════════ */
const CardInstallmentsPanel = memo(({ card, data, dispatch, saveHistory, addNotification }) => {
  const [showCreate, setShowCreate] = useState(false);
  const info = useMemo(() => computeCardInstallmentsInfo(data, card), [data, card]);

  const cancelPlan = (plan) => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'إلغاء خطة التقسيط',
      message: 'سيتم إلغاء الخطة فقط، المعاملات الأصلية لن تتأثر.',
      onConfirm: () => {
        saveHistory();
        const newPlans = (data.cardInstallments || []).map(p => p.id === plan.id ? { ...p, status: 'cancelled', cancelledAt: new Date().toISOString() } : p);
        dispatch({ type: 'SET_DATA', payload: { ...data, cardInstallments: newPlans } });
        addNotification({ type: 'success', title: 'تم إلغاء الخطة' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const deletePlan = (plan) => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'حذف الخطة نهائياً',
      message: 'سيتم حذف الخطة واستعادة المعاملات المرتبطة.',
      onConfirm: () => {
        saveHistory();
        const newPlans = (data.cardInstallments || []).filter(p => p.id !== plan.id);
        const newTxs = (data.transactions || []).map(t => t.installmentPlanId === plan.id ? { ...t, installmentPlanId: undefined } : t);
        dispatch({ type: 'SET_DATA', payload: { ...data, cardInstallments: newPlans, transactions: newTxs } });
        addNotification({ type: 'success', title: 'تم الحذف' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  return (
    <div className="space-y-2">
      <div className="flex justify-between items-center flex-wrap gap-2">
        <div className="flex items-center gap-2 flex-wrap">
          <span className="badge badge-accent text-[9px]">نشطة: {info.activeCount}</span>
          <span className="badge badge-warning text-[9px] money tabular">شهري: {fmtShort(info.currentMonthly)}</span>
          <span className="badge badge-danger text-[9px] money tabular">متبقي: {fmtShort(info.totalRemaining)}</span>
        </div>
        <button onClick={() => setShowCreate(true)} className="btn btn-primary text-[10px] py-1.5 px-2.5"><Plus size={11} /> خطة جديدة</button>
      </div>

      {info.plans.length === 0 ? (
        <p className="text-[10px] text-center py-3" style={{ color: 'var(--text-muted)' }}>لا توجد خطط تقسيط على هذه البطاقة</p>
      ) : (
        <div className="space-y-1.5">
          {info.plans.map(plan => {
            const isCancelled = plan.status === 'cancelled';
            return (
              <div key={plan.id} className="p-2.5 rounded-lg"
                style={{ background: isCancelled ? 'var(--bg-muted)' : 'var(--accent-soft)', opacity: isCancelled ? 0.5 : 1, border: '1px solid var(--border-subtle)' }}>
                <div className="flex justify-between items-start gap-2 mb-1.5 flex-wrap">
                  <div className="min-w-0 flex-1">
                    <p className="font-black text-[11px] truncate">
                      {plan.note || `خطة ${fmtShort(plan.totalAmount)}`}
                      {isCancelled && <span className="badge badge-danger text-[8px] mr-1">ملغاة</span>}
                      {plan.completed && !isCancelled && <span className="badge badge-success text-[8px] mr-1">مكتملة</span>}
                    </p>
                    <p className="text-[9px] mt-0.5" style={{ color: 'var(--text-muted)' }}>
                      {plan.startMonth} {plan.startYear} • {plan.months} شهر • {fmt(plan.monthlyAmount)} ج.م/شهر
                    </p>
                  </div>
                  <div className="flex gap-1 flex-shrink-0">
                    {!isCancelled && (<button onClick={() => cancelPlan(plan)} className="btn btn-ghost p-1 text-amber-500" title="إلغاء"><X size={11} /></button>)}
                    <button onClick={() => deletePlan(plan)} className="btn btn-ghost p-1 text-red-500" title="حذف"><Trash2 size={11} /></button>
                  </div>
                </div>
                <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-card)' }}>
                  <div className={`h-full ${plan.completed ? 'bg-emerald-500' : 'bg-[color:var(--accent)]'}`} style={{ width: `${Math.min(100, plan.progressPct)}%` }}></div>
                </div>
                <div className="flex justify-between text-[9px] mt-1" style={{ color: 'var(--text-muted)' }}>
                  <span>متبقي: <strong className="money tabular">{fmt(plan.remainingAmount)}</strong> ج.م</span>
                  <span><strong className="money tabular">{plan.monthsElapsed}/{plan.months}</strong> شهر</span>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {showCreate && (
        <InstallmentPlanModal card={card} data={data} dispatch={dispatch}
          saveHistory={saveHistory} addNotification={addNotification}
          onClose={() => setShowCreate(false)} />
      )}
    </div>
  );
});

          <p className="text-sm font-black text-amber-600 mt-0.5 money tabular">{fmtShort(summary.totalMinPayment)}</p>

          <p className="text-[9px] font-bold" style={{ color: 'var(--accent)' }}>الدورة القادمة</p>

                    <p className="text-[10px] text-center py-2" style={{ color: 'var(--text-muted)' }}>لا يوجد كشف مستحق حالياً</p>
                  )}

                    <div className="mt-2 pt-2" style={{ borderTop: '1px dashed var(--border-default)' }}>
                      <div className="flex justify-between text-[10px]"><span style={{ color: 'var(--text-muted)' }}>🔮 الدورة القادمة</span><span className="font-mono text-[9px]">{getLocalISODate(p.nextCycleDueDate)}</span></div>
                      <div className="flex justify-between text-[10px]"><span style={{ color: 'var(--text-muted)' }}>تقديري</span><span className="font-black text-amber-600 money tabular">{fmt(p.nextCycleEstimate)}</span></div>
                    </div>
                  )}

                  <button onClick={(e) => { e.stopPropagation(); dispatch({ type: 'SET_CARD_PAYMENT_MODAL', payload: { cardId: p.cardId } }); }}
                    className="btn btn-primary w-full text-[10px] py-1.5 mt-2">
                    <Banknote size={11} /> سداد الآن
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
});

/* ═══════════════ FORCE SAVE HOOK ═══════════════ */
const FORCE_SAVE_STATES = { IDLE: 'idle', SAVING: 'saving', SUCCESS: 'success', ERROR: 'error' };

const buildCloudPayload = (data, budgets) => ({
  ...data,
  budgets: budgets || {},
  __lastClientSync: new Date().toISOString(),
  __client: 'web-v88.1.1',
  __hanyPayable: computeHanyPayable(data),
  __netWorth: computeNetWorth(data).netWorth
});

const useForceSave = ({ isAuthenticated, data, budgets, addNotification, dbRef }) => {
  const [state, setState] = useState(FORCE_SAVE_STATES.IDLE);
  const [lastSaveAt, setLastSaveAt] = useState(null);
  const [lastError, setLastError] = useState(null);
  const busyRef = useRef(false);

  const dataRef = useRef(data);
  const budgetsRef = useRef(budgets);
  useEffect(() => { dataRef.current = data; }, [data]);
  useEffect(() => { budgetsRef.current = budgets; }, [budgets]);

  const forceSave = useCallback(async ({ silent = false } = {}) => {
    if (!isAuthenticated) {
      if (!silent) addNotification({ type: 'error', title: 'غير مصرح', message: 'يجب تسجيل الدخول' });
      setState(FORCE_SAVE_STATES.ERROR); setLastError('not_authenticated'); return false;
    }
    const currentData = dataRef.current;
    if (!currentData) {
      if (!silent) addNotification({ type: 'error', title: 'لا توجد بيانات' });
      setState(FORCE_SAVE_STATES.ERROR); return false;
    }
    if (busyRef.current) {
      if (!silent) addNotification({ type: 'info', title: 'العملية جارية بالفعل' });
      return false;
    }

    busyRef.current = true;
    setState(FORCE_SAVE_STATES.SAVING);
    setLastError(null);
    if (!silent) addNotification({ type: 'info', title: 'جاري الرفع للسحابة...', duration: 2000 });

    const maxAttempts = 3;
    let lastErr = null;
    let succeeded = false;

    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        const payload = buildCloudPayload(currentData, budgetsRef.current);
        await dbRef.set(payload, { merge: false });
        try { localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now())); } catch (e) {}
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(currentData)); } catch (e) {}
        succeeded = true;
        break;
      } catch (err) {
        lastErr = err;
        console.error(`Force save attempt ${attempt}/${maxAttempts} failed:`, err);
        if (attempt < maxAttempts) await new Promise(r => setTimeout(r, 2000 * attempt));
      }
    }

    busyRef.current = false;

    if (succeeded) {
      setState(FORCE_SAVE_STATES.SUCCESS);
      setLastSaveAt(Date.now());
      if (!silent) {
        addNotification({
          type: 'success', title: '✅ تم الرفع للسحابة',
          message: `آخر مزامنة: ${new Date().toLocaleTimeString('ar-EG')}`, duration: 4000
        });
      }
      setTimeout(() => setState(FORCE_SAVE_STATES.IDLE), 3000);
      return true;
    } else {
      setState(FORCE_SAVE_STATES.ERROR);
      setLastError(lastErr?.message || 'خطأ غير معروف');
      if (!silent) {
        addNotification({
          type: 'error', title: `❌ فشل الرفع بعد ${maxAttempts} محاولات`,
          message: lastErr?.message || 'تحقق من الاتصال', duration: 8000
        });
      }
      setTimeout(() => setState(FORCE_SAVE_STATES.IDLE), 5000);
      return false;
    }
  }, [isAuthenticated, addNotification, dbRef]);

  return { forceSave, state, lastSaveAt, lastError };
};

/* ═══════════════ APP ROOT ═══════════════ */

      externalFrom: 'cib_savings', externalRecipient: '', externalAccount: '',

    },

    isPinChangeOpen: false,
    isSmsModalOpen: false,
