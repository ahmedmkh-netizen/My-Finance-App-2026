    addNotification({ type: 'success', title: 'تم الحفظ' });
    setHasChanges(false);
    isDirtyRef.current = false;
  };

  const handleDriveBackupNow = async () => {
    setDriveBusy(true); setDriveStatus('جاري الرفع...');
    try {
      const payload = { data, budgets, exportedAt: new Date().toISOString(), version: 'V87.6' };
      const result = await uploadBackupToDrive(payload);
      localStorage.setItem(AUTO_BACKUP_LS_KEY, String(Date.now()));
      setDriveStatus(`✅ تم الرفع: ${result.name}`);
      addNotification({ type: 'success', title: 'تم رفع النسخة' });

  const handleResetCardsToZero = () => {

      type: 'SHOW_CONFIRM', danger: true,

        saveHistory();
        dispatch({
          type: 'UPDATE_CARDS',
          payload: cards.map(c => ({ ...c, openingDebt: 0, availableBalance: safeNumber(c.limit), openingDebtDate: getLocalISODate(), openingDate: getLocalISODate() }))
        });
        addNotification({ type: 'success', title: 'تم التصفير' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const handleFreshStart = () => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,

          recurringItems: [], materializedRecurring: {}, custodyEntries: [], cashbackTrackers: [], monthlyPlans: {},
          hanyPayableCache: 0
        };
        dispatch({ type: 'SET_DATA', payload: fresh });
        addNotification({ type: 'success', title: 'تم التصفير الشامل' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card flex justify-between items-center flex-wrap gap-3">

          <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><Sliders size={16} /></div>

      <div className="card p-1 flex gap-1.5">
        {[{ id: 'accounts', label: 'الحسابات', icon: Wallet }, { id: 'cards', label: 'الكروت', icon: CreditCard }].map(s => {
          const Icon = s.icon;
          return (
            <button key={s.id} onClick={() => setActiveSection(s.id)}

              <Icon size={14} /> {s.label}

      {activeSection === 'accounts' && (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">

            const acc = localAccounts[key] || {};

            return (
              <div key={key} className="card">

                  <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><Icon size={14} /></div>
                  <h4 className="font-black text-xs">{acc.label || key}</h4>
                </div>
                <div className="space-y-2.5">
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الرصيد الافتتاحي</label>

                  </div>
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>تاريخ الافتتاح</label>
                    <input type="date" value={acc.initialDate || ''} onChange={e => handleAccountChange(key, 'initialDate', e.target.value)}

      {activeSection === 'cards' && (

          {localCards.map(card => {
            const liveDebt = computeCardDebt(data, card);
            return (

                <div className="flex items-center gap-2 mb-3 flex-wrap">
                  <div className="p-1.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-purple-600"><CreditCard size={14} /></div>
                  <h3 className="font-black text-sm">{card.bank} - {card.name}</h3>
                  <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>•••• {card.last4}</span>
                </div>
                <div className="grid grid-cols-3 gap-2 mb-3">
                  <div><label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الحد</label><input type="text" inputMode="decimal" value={card.limit} onChange={e => handleCardChange(card.id, 'limit', e.target.value)} className="input-field input-num font-black text-blue-600 text-center text-xs py-2" /></div>

                  <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>المديونية الحية</p>

      <div className="card p-3" style={{ background: 'var(--bg-muted)' }}>
        <div className="flex items-start gap-2">
          <Info size={14} className="text-blue-600 mt-0.5 flex-shrink-0" />

/* ═══════════════ FINANCIAL FORECAST (Simplified) ═══════════════ */
const FinancialForecastView = memo(({ data, transactions, cards, updatedLoans, liveBalances, selectedYear, selectedMonth, liquidityDual }) => {
  const currentCardDebt = useMemo(() => computeTotalCardDebtNet(data), [data]);
  const currentHanyPayable = useMemo(() => computeHanyPayable(data), [data]);
  const currentLoanDebt = useMemo(() =>
    updatedLoans.filter(l => !l.isReceivable && !l.autoGenerated).reduce((s, l) => s + l.remaining, 0)
  , [updatedLoans]);

  const forecast = useMemo(() => {
    const months = [];
    let liq = liquidityDual.comprehensive;
    let cardDebt = currentCardDebt;
    let loanDebt = currentLoanDebt;
    let hanyPayable = currentHanyPayable;

    for (let i = 0; i < 6; i++) {
      const { year, month } = addMonthsToYM(selectedYear, selectedMonth, i);
      if (getMonthIndex(month) < 0) continue;

      const flows = computeMonthlyFlows(transactions, year, month);
      const inc = flows.pendingIncome || 0;
      const cashExp = flows.pendingCashExpense || 0;
      const cardSpend = flows.pendingCardSpending || 0;
      const cardPay = flows.pendingCardPayment || 0;
      const loanInst = flows.pendingLoanInstallment || 0;
      const hanyPurchase = flows.pendingHanyPurchase || 0;
      const hanySettle = flows.pendingHanySettle || 0;

      const newCardDebt = Math.max(0, cardDebt + cardSpend - cardPay);
      const newLoanDebt = Math.max(0, loanDebt - loanInst);
      const newHanyPayable = Math.max(0, hanyPayable + hanyPurchase - hanySettle);
      const netCashFlow = inc - cashExp - cardPay - loanInst - hanySettle;
      const newLiquidity = liq + netCashFlow;

      months.push({
        month, year,
        income: inc, cashExpense: cashExp, cardSpending: cardSpend, cardPayment: cardPay,
        loanInstallment: loanInst, hanyPurchase, hanySettle,
        netCashFlow,
        endLiquidity: newLiquidity, endCardDebt: newCardDebt, endLoanDebt: newLoanDebt,
        endHanyPayable: newHanyPayable,
        totalDebt: newCardDebt + newLoanDebt + newHanyPayable,
        netPosition: newLiquidity - (newCardDebt + newLoanDebt + newHanyPayable)
      });

      liq = newLiquidity;
      cardDebt = newCardDebt;
      loanDebt = newLoanDebt;
      hanyPayable = newHanyPayable;
    }
    return months;
  }, [transactions, selectedMonth, selectedYear, liquidityDual, currentCardDebt, currentLoanDebt, currentHanyPayable]);

  const chartData = forecast.map(f => ({
    name: f.month.slice(0, 3),
    'السيولة': Math.round(f.endLiquidity),
    'المديونية': Math.round(f.totalDebt),
    'صافي': Math.round(f.netPosition)
  }));

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <h2 className="text-base font-black flex items-center gap-2 mb-2">
          <TrendingUp size={16} className="text-[color:var(--accent)]" /> التنبؤ المالي الشامل — 6 شهور
        </h2>
        <p className="text-[11px]" style={{ color: 'var(--text-muted)' }}>توقع مستقبلي بناءً على المعلقات الحالية</p>
      </div>

      <div className="grid grid-cols-4 gap-2">
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>سيولة الآن</p>
          <p className="text-base font-black text-emerald-600 money tabular">{fmtShort(liquidityDual.comprehensive)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>مديونية</p>

/* ═══════════════ CALENDAR VIEW (Simplified) ═══════════════ */
const CalendarView = memo(({ data, getAgendaItems, dispatch, saveHistory, addNotification }) => {
  const today = new Date();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());

  const agendaItems = useMemo(() => getAgendaItems(viewYear, ALL_MONTHS[viewMonth]), [getAgendaItems, viewYear, viewMonth]);
  const monthName = ALL_MONTHS[viewMonth];

  const itemsByDay = useMemo(() => {
    const map = {};
    agendaItems.forEach(item => {
      const d = parseISODate(item.date);
      if (!d) return;
      if (d.getFullYear() !== viewYear || d.getMonth() !== viewMonth) return;
      const day = d.getDate();
      if (!map[day]) map[day] = [];
      map[day].push(item);
    });
    return map;
  }, [agendaItems, viewYear, viewMonth]);

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  const navigate = (delta) => {
    let m = viewMonth + delta;
    let y = viewYear;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    setViewMonth(m); setViewYear(y);
  };

  const dayNames = ['أحد', 'إثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];
  const emptyCells = Array.from({ length: firstDay }, (_, i) => i);
  const dayCells = Array.from({ length: daysInMonth }, (_, i) => i + 1);
  const isToday = (day) => today.getFullYear() === viewYear && today.getMonth() === viewMonth && today.getDate() === day;

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex items-center justify-between mb-3">
          <button type="button" onClick={() => navigate(-1)} className="btn btn-ghost p-2"><ArrowRight size={16} /></button>
          <h2 className="text-base font-black flex items-center gap-2"><CalendarDays size={16} className="text-[color:var(--accent)]" /> {monthName} {viewYear}</h2>
          <button type="button" onClick={() => navigate(1)} className="btn btn-ghost p-2"><ArrowRight size={16} className="rotate-180" /></button>
        </div>
        <div className="grid grid-cols-7 gap-1 mb-2">
          {dayNames.map(d => (<div key={d} className="text-center text-[10px] font-black py-1" style={{ color: 'var(--text-muted)' }}>{d}</div>))}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {emptyCells.map(i => <div key={`e-${i}`} />)}
          {dayCells.map(day => {
            const items = itemsByDay[day] || [];
            const hasItems = items.length > 0;
            const totalAmount = items.reduce((s, it) => s + safeNumber(it.amount), 0);
            return (
              <div key={day}
                className={`h-14 rounded-lg p-1 flex flex-col items-center justify-center transition-all relative ${isToday(day) ? 'ring-2 ring-[color:var(--accent)]' : ''}`}
                style={{ background: hasItems ? 'var(--accent-soft)' : 'var(--bg-muted)', color: hasItems ? 'var(--accent)' : 'var(--text-secondary)' }}>
                <span className={`text-[11px] font-black ${isToday(day) ? 'text-[color:var(--accent)]' : ''}`}>{day}</span>
                {hasItems && (
                  <React.Fragment>
                    <span className="text-[8px] font-black mt-0.5">{items.length}</span>
                    <span className="text-[7px] font-bold opacity-70 money tabular">{fmt(totalAmount).slice(0, 5)}</span>
                  </React.Fragment>
                )}
              </div>
            );
          })}
        </div>
      </div>
      <div className="card">
        <h3 className="font-black text-sm flex items-center gap-2 mb-3"><Bell size={14} className="text-amber-500" /> الأجندة ({agendaItems.length})</h3>
        {agendaItems.length === 0 ? (
          <p className="text-center py-6 text-xs font-semibold" style={{ color: 'var(--text-muted)' }}>لا توجد التزامات قادمة</p>
        ) : (
          <div className="space-y-2 max-h-[60vh] overflow-y-auto scroll-hide">
            {agendaItems.map(item => {
              const Icon = item.icon || Calendar;
              const typeCls = item.type === 'danger' ? 'text-red-600 bg-red-50 dark:bg-red-950/30' : item.type === 'warning' ? 'text-amber-600 bg-amber-50 dark:bg-amber-950/30' : item.type === 'success' ? 'text-emerald-600 bg-emerald-50 dark:bg-emerald-950/30' : 'text-blue-600 bg-blue-50 dark:bg-blue-950/30';
              return (
                <div key={item.id} className="flex items-center gap-3 p-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className={`p-2 rounded-lg flex-shrink-0 ${typeCls}`}><Icon size={14} /></div>
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-xs truncate">{item.title}</p>
                    <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{item.date} • {item.desc || ''}</p>
                  </div>
                  <span className={`font-black text-sm flex-shrink-0 money tabular ${item.type === 'success' ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(item.amount)}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
});

/* ═══════════════ CARD PAYMENT MODAL ═══════════════ */
const CardPaymentModal = memo(({ cardId, data, dispatch, saveHistory, addNotification, onClose }) => {
  const cards = data?.cards || [];
  const [selectedCardId, setSelectedCardId] = useState(cardId || (cards[0]?.id || null));
  const [amount, setAmount] = useState('');
  const [sourceMethod, setSourceMethod] = useState('cib_savings');
  const [date, setDate] = useState(getLocalISODate());
  const [note, setNote] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const selectedCard = cards.find(c => c.id === selectedCardId);
  const cardDebt = selectedCard ? computeCardDebt(data, selectedCard) : 0;
  const liveBalances = useMemo(() => computeBalancesAsOf(data), [data]);
  const sourceBalance = safeNumber(liveBalances[sourceMethod]);
  const parsedAmount = parseNumberInput(amount);
  const canSubmit = parsedAmount > 0 && sourceBalance >= parsedAmount - 0.005 && parsedAmount <= cardDebt + 0.005;

  const handleSubmit = () => {
    if (!canSubmit || submitting) return;
    setSubmitting(true);
    saveHistory();
    dispatch({
      type: 'CARD_PAYMENT',
      payload: { cardId: selectedCardId, amount: parsedAmount, sourceMethod, date, note: note.trim() || `سداد بطاقة ${selectedCard.bank} - ${selectedCard.name}` }
    });
    addNotification({ type: 'success', title: '✅ تم السداد', message: `${fmt(parsedAmount)} ج.م` });
    setTimeout(() => { setSubmitting(false); onClose(); }, 400);
  };

  if (!selectedCard) {
    return (
      <Modal isOpen={true} onClose={onClose} title="سداد بطاقة" icon="💳">
        <div className="text-center py-8">
          <CreditCard size={40} className="mx-auto mb-3 text-slate-400" />
          <p className="font-bold text-sm">لا توجد بطاقات</p>
          <button onClick={onClose} className="btn btn-secondary text-sm mt-4">إغلاق</button>
        </div>
      </Modal>
    );
  }

  return (
    <Modal isOpen={true} onClose={onClose} title="سداد بطاقة ائتمانية" icon="💳" size="lg">
      <div className="space-y-4">
        <div className="card-payment-hero">
          <p className="text-[11px] font-bold opacity-90 mb-1">المديونية الحالية</p>
          <p className="payment-amount-display mb-1">{fmt(cardDebt)}</p>
          <p className="text-xs font-bold opacity-80">{selectedCard.bank} - {selectedCard.name} • ••••{selectedCard.last4}</p>
        </div>

        {!cardId && cards.length > 1 && (
          <div>
            <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>اختر البطاقة</label>
            <div className="space-y-2 max-h-40 overflow-y-auto scroll-hide">
              {cards.map(c => {
                const cDebt = computeCardDebt(data, c);
                const isSel = c.id === selectedCardId;
                return (
                  <button key={c.id} type="button" onClick={() => { setSelectedCardId(c.id); setAmount(''); }}
                    className={`payment-card-option ${isSel ? 'selected' : ''}`}>
                    <div className="p-2 rounded-lg flex-shrink-0" style={{ background: isSel ? 'var(--accent)' : 'var(--bg-muted)', color: isSel ? 'white' : 'var(--text-secondary)' }}>
                      <CreditCard size={16} />
                    </div>
                    <div className="flex-1 min-w-0 text-right">
                      <p className="font-black text-xs">{c.bank} - {c.name}</p>
                      <p className="text-[10px] font-mono" style={{ color: 'var(--text-muted)' }}>•••• {c.last4}</p>
                    </div>
                    <p className={`font-black text-xs money tabular ${cDebt > 0 ? 'text-red-600' : 'text-emerald-600'}`}>{fmt(cDebt)}</p>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        <div>
          <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>المبلغ *</label>
          <input type="text" inputMode="decimal" autoFocus
            className="input-field input-num text-3xl font-black text-center py-4"
            style={{ color: 'var(--accent)' }}
            value={amount} onChange={e => setAmount(e.target.value)} placeholder="0.00" />
          <div className="flex gap-1.5 mt-2 flex-wrap">
            <button type="button" onClick={() => setAmount(String(roundMoney(cardDebt)))} className="quick-amount-chip" style={{ flex: 1 }}>الكل</button>
            <button type="button" onClick={() => setAmount(String(roundMoney(cardDebt / 2)))} className="quick-amount-chip" style={{ flex: 1 }}>نصف</button>
            <button type="button" onClick={() => setAmount(String(roundMoney(cardDebt / 4)))} className="quick-amount-chip" style={{ flex: 1 }}>ربع</button>
          </div>
        </div>

        <div>
          <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>من حساب *</label>
          <div className="grid grid-cols-2 gap-2">
            {PAYMENT_METHODS.filter(m => m.group === 'account' && m.id !== HANY_TAB_METHOD).map(m => {
              const bal = safeNumber(liveBalances[m.id]);
              const isSel = sourceMethod === m.id;
              return (
                <button key={m.id} type="button" onClick={() => setSourceMethod(m.id)}
                  className={`payment-source-option ${isSel ? 'selected' : ''}`}>
                  <div className="flex-1 min-w-0 text-right">
                    <p className="font-black text-xs">{m.label}</p>
                    <p className="text-[10px] money tabular" style={{ color: 'var(--text-muted)' }}>{fmtShort(bal)} ج.م</p>
                  </div>
                  {isSel && <CheckCircle2 size={14} className="text-emerald-500" />}
                </button>
              );
            })}
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2">
          <div>
            <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>التاريخ *</label>
            <input type="date" className="input-field text-xs font-bold py-3" value={date} onChange={e => setDate(e.target.value)} />
          </div>
          <div>
            <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>ملاحظة</label>
            <input type="text" className="input-field text-xs py-3" value={note} onChange={e => setNote(e.target.value)} placeholder="اختياري" />
          </div>
        </div>

        <div className="flex gap-2 pt-1">
          <button type="button" onClick={onClose} className="btn btn-secondary flex-1 py-3 text-sm">إلغاء</button>
          <button type="button" onClick={handleSubmit} disabled={!canSubmit || submitting}
            className="btn flex-1 py-3 text-sm font-black"
            style={{ background: canSubmit ? 'linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%)' : 'var(--bg-muted)', color: canSubmit ? 'white' : 'var(--text-muted)' }}>
            {submitting ? 'جاري الحفظ...' : 'تسجيل السداد'}
          </button>
        </div>
      </div>
    </Modal>
  );
});

/* ═══════════════════════════════════════════════════════════════
   APP ROOT V87.6
   ═══════════════════════════════════════════════════════════════ */
function App() {
  const defMY = useMemo(() => getDefaultMonthYear(), []);

  const [state, dispatch] = useReducer(dataReducer, {
    data: getInitialData(),
    activeTab: 'dashboard',
    selectedYear: defMY.year,
    selectedMonth: defMY.month,
    transViewMode: 'all',
    catViewType: 'expense',
    isFormOpen: false,
    formMode: 'add',
    formData: { type: 'expense', subType: 'withdrawal', status: 'pending', quantity: '', unitPrice: '' },
    isLocked: false,
    isDarkMode: localStorage.getItem('theme') === 'dark',
    budgets: safeParseJson(localStorage.getItem('budgets'), {}),
    editingCard: null,
    editingLoan: null,
    searchTerm: '',
    editingBudgetCategory: null,
    budgetAmount: '',
    isRecurringModalOpen: false,
    recurringFormData: {
      title: '', amount: '', day: 1, category: 'أخرى', type: 'expense',
      startMonth: '', endMonth: '', active: true, method: 'cash',
      kind: null, linkedLoanSystemId: null, linkedCardId: null, transferChannel: null
    },
    notifications: [],
    history: [],
    future: [],
    expandedLedgers: { cash: false, fawry: false, etisalat: false, cib_savings: false, aaib_savings: false },
    expandedCardsSection: false,
    statusFilter: 'all',
    confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false },
    isQuickTransferModalOpen: false,
    quickTransferData: {
      transferMode: 'monthly', from: 'cib_savings', to: 'fawry', amount: '', transferType: 'monthly',
      date: getLocalISODate(), beneficiaryId: null, forceCash: false,
      internalFrom: 'cib_savings', internalTo: 'fawry', internalFees: '', internalDescription: '',
      externalFrom: 'cib_savings', externalRecipient: '', externalAccount: '',
      externalFees: '', externalWithFee: false, externalNote: ''
    },
    viewingCardStatement: null,
    isPinChangeOpen: false,
    isSmsModalOpen: false,
    pendingCloseModal: { isOpen: false, pending: [], total: 0, month: '', year: 0 },
    walletVisibility: { cash: true, fawry: true, etisalat: true, cib_savings: true, aaib_savings: true },
    isProcessing: false,
    formErrors: {},
    activeCategoryDetail: null,
    reconciliationModal: null,
    isSidebarOpen: false,
    forceSaveState: 'idle',
    cardPaymentModal: null,
    hanySettleModal: null,
    printModal: null
  });

  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [authLoading, setAuthLoading] = useState(true);
  const [pinVerified, setPinVerified] = useState(false);
  const [cloudSyncStatus, setCloudSyncStatus] = useState('pending');
  const [isSaving, setIsSaving] = useState(false);

  const saveTimeoutRef = useRef(null);
  const lastRemoteRef = useRef(null);
  const currentTxRef = useRef([]);
  const dataRef = useRef(null);
  const budgetsRef = useRef({});
  const saveQueueRef = useRef(Promise.resolve());

  const {
    data, activeTab, selectedYear, selectedMonth, transViewMode, catViewType,
    isFormOpen, formMode, formData, isDarkMode, budgets,
    editingCard, editingLoan, searchTerm, editingBudgetCategory, budgetAmount,
    isRecurringModalOpen, recurringFormData, notifications,
    isQuickTransferModalOpen, quickTransferData, viewingCardStatement,
    isPinChangeOpen, isSmsModalOpen, pendingCloseModal,
    walletVisibility, isProcessing, formErrors, activeCategoryDetail,
    isSidebarOpen, forceSaveState, cardPaymentModal
  } = state;

  const { transactions = [], loans = [], cards = [], recurringItems = [], accountsData = DEFAULT_ACCOUNTS } = data || {};

  const isOnline = useOnlineStatus();

  useEffect(() => {
    currentTxRef.current = data?.transactions || [];
    dataRef.current = data;
    budgetsRef.current = budgets;
  }, [data?.transactions, data, budgets]);

  const addNotification = useCallback((notification) => dispatch({ type: 'ADD_NOTIFICATION', payload: notification }), []);
  const removeNotification = useCallback((id) => dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }), []);
  const saveHistory = useCallback(() => dispatch({
    type: 'ADD_TO_HISTORY',
    payload: { data: JSON.parse(JSON.stringify(data)), budgets: JSON.parse(JSON.stringify(budgets)) }
  }), [data, budgets]);

  const queueCloudSave = useCallback((newData, options = {}) => {
    if (!isAuthenticated) return;
    const { silent = false } = options;
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);

    saveQueueRef.current = saveQueueRef.current.then(async () => {
      try {
        if (!silent) setIsSaving(true);
        const payloadStr = JSON.stringify(newData);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(newData)); } catch (e) {}
        await docRef.set({ ...newData, budgets: newData.budgets || budgetsRef.current }, { merge: false });
        lastRemoteRef.current = payloadStr;
        try { localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now())); } catch (e) {}
      } catch (err) {
        console.error('Queue save failed:', err);
      } finally {
        if (!silent) setTimeout(() => setIsSaving(false), 800);
      }
    }).catch(err => { console.error('Save queue error:', err); setIsSaving(false); });

    return saveQueueRef.current;
  }, [isAuthenticated]);

  const docRef = useMemo(() => db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc), []);
  const { forceSave: handleForceSave } = useForceSave({ isAuthenticated, data, budgets, addNotification, dbRef: docRef });

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((user) => {
      setAuthLoading(false);
      setIsAuthenticated(!!(user && user.email === ALLOWED_EMAIL));
    });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!isAuthenticated) return;
    const innerDocRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);

    const unsub = innerDocRef.onSnapshot((doc) => {
      setCloudSyncStatus('ready');
      if (doc.exists) {
        const raw = doc.data();
        const migrated = migrateData(raw);
        const incoming = JSON.stringify(migrated);
        if (lastRemoteRef.current === incoming) return;
        lastRemoteRef.current = incoming;
        if (raw.budgets && typeof raw.budgets === 'object') {
          dispatch({ type: 'SET_BUDGETS', payload: raw.budgets });
        }
        dispatch({ type: 'SET_DATA', payload: migrated });
      }
    }, (error) => {
      console.error('Firestore error:', error);
      setCloudSyncStatus('offline');
    });

    return () => unsub();
  }, [isAuthenticated]);

  useEffect(() => {
    if (!isAuthenticated || !data?.transactions) return;
    if (cloudSyncStatus === 'offline') {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      return;
    }
    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(() => {
      const payloadStr = JSON.stringify(data);
      if (lastRemoteRef.current && payloadStr === lastRemoteRef.current) return;
      queueCloudSave(data, { silent: false });
    }, 2000);
    return () => clearTimeout(saveTimeoutRef.current);
  }, [data, isAuthenticated, cloudSyncStatus, queueCloudSave]);

  /* Derived data */
  const liveBalances = useMemo(() => computeBalancesAsOf(data), [data]);
  const liquidityDual = useMemo(() => computeDualLiquidity(liveBalances), [liveBalances]);
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);
  const netWorthData = useMemo(() => computeNetWorth(data), [data]);
  const hanySummary = useMemo(() => computeHanySummaryForMonth(data, selectedYear, selectedMonth), [data, selectedYear, selectedMonth]);

  const financeSnapshot = useMemo(() => {
    const opening = getOpeningBalance(data, 'cash', selectedYear, selectedMonth);
    const actualCashInHand = liveBalances.cash || 0;
    const today = endOfToday();
    const curMonth = transactions.filter(t =>
      t.month === selectedMonth && (t.year || new Date(t.date).getFullYear()) === selectedYear && !isCarryoverMarker(t)
    );
    const actualIncome = curMonth.filter(t => t.type === 'income' && t.status === 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncome = curMonth.filter(t => t.type === 'income' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidCash = curMonth.filter(t => t.type === 'expense' && t.status === 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingCash = curMonth.filter(t => t.type === 'expense' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncomeAll = curMonth.filter(t => t.type === 'income' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingExpensesAll = curMonth.filter(t => t.type === 'expense' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidExpensesAll = curMonth.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    return {
      opening, actualIncome, pendingIncome, paidCash, pendingCash, actualCashInHand,
      pendingIncomeAll, pendingExpensesAll, paidExpensesAll,
      projectedClosingBalance: actualCashInHand + pendingIncomeAll - pendingExpensesAll
    };
  }, [data, transactions, selectedYear, selectedMonth, liveBalances]);

  const chartData = useMemo(() => {
    const byMonth = new Map();
    transactions.forEach(t => {
      if (t.status !== 'paid' || isCarryoverMarker(t)) return;
      const y = t.year || 2026;
      if (y !== selectedYear) return;
      if (!byMonth.has(t.month)) byMonth.set(t.month, { income: 0, expense: 0 });
      const b = byMonth.get(t.month);
      if (t.type === 'income') b.income += safeNumber(t.amount);
      else if (t.type === 'expense') b.expense += safeNumber(t.amount);
    });
    return getMonthsForYear(selectedYear).map(m => ({
      name: m.slice(0, 3),
      'دخل': byMonth.get(m)?.income || 0,
      'مصروف': byMonth.get(m)?.expense || 0
    }));
  }, [transactions, selectedYear]);

  const updatedLoans = useMemo(() => {
    const map = transactions.reduce((acc, t) => {
      if (t.linkedLoanId && t.status === 'paid') acc[t.linkedLoanId] = (acc[t.linkedLoanId] || 0) + safeNumber(t.amount);
      return acc;
    }, {});
    return loans.map(l => ({
      ...l,
      isReceivable: l.type === 'receivable' || !!l.isReceivable,
      totalPaid: safeNumber(l.prePaidAmount) + (map[l.id] || 0),
      remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (map[l.id] || 0)))
    }));
  }, [loans, transactions]);

  const monthInsights = useMemo(() => {
    const m = transactions.filter(t =>
      t.month === selectedMonth && (t.year || 2026) === selectedYear && !isCarryoverMarker(t)
    );
    const inc = m.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const exp = m.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    return { inc, exp, net: inc - exp };
  }, [transactions, selectedYear, selectedMonth]);

  const monthCashback = useMemo(() => {
    const trackers = (data?.cashbackTrackers || []).filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
    const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
    const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
    return { expected, received, pending: expected - received };
  }, [data?.cashbackTrackers, selectedMonth, selectedYear]);

  const bankFeesMonth = useMemo(() => transactions.filter(t =>
    t.status === 'paid' && t.type === 'expense' && BANK_FEE_CATEGORIES.has(t.category)
    && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).reduce((s, t) => s + safeNumber(t.amount), 0), [transactions, selectedMonth, selectedYear]);

  const groupedTransactions = useMemo(() => {
    const groups = {};
    const term = normalizeText(searchTerm);
    transactions.filter(t => {
      if (t.month !== selectedMonth || (t.year || 2026) !== selectedYear) return false;
      if (isCarryoverMarker(t)) return false;
      if (transViewMode !== 'all' && t.type !== transViewMode) return false;
      if (searchTerm && !normalizeText(t.description).includes(term) && !normalizeText(t.category).includes(term)) return false;
      return true;
    }).forEach(t => {
      if (!groups[t.category]) groups[t.category] = { category: t.category, total: 0, count: 0, items: [] };
      groups[t.category].total += safeNumber(t.amount);
      groups[t.category].count++;
      groups[t.category].items.push(t);
    });
    return Object.values(groups).sort((a, b) => b.total - a.total);
  }, [transactions, selectedYear, selectedMonth, transViewMode, searchTerm]);

  const getAgendaItems = useCallback((targetYear, targetMonth) => {
    try {
      const items = [];
      const y = targetYear || new Date().getFullYear();
      const mIdx = targetMonth ? getMonthIndex(targetMonth) : new Date().getMonth();
      const pad = (n) => String(n).padStart(2, '0');

      cards.forEach(c => {
        const liveDebt = Math.max(0, computeCardDebt(data, c));
        if (liveDebt <= 0.01) return;
        const d = parseInt(c.dueDate) || 5;
        const maxDay = new Date(y, mIdx + 1, 0).getDate();
        items.push({
          id: `ag-card-${c.id}-${y}-${mIdx}`,
          title: `سداد ${c.bank} - ${c.name}`,
          date: `${y}-${pad(mIdx + 1)}-${pad(Math.min(d, maxDay))}`,
          amount: liveDebt, type: 'warning', icon: CreditCard, desc: 'استحقاق دوري'
        });
      });

      updatedLoans.forEach(l => {
        if (safeNumber(l.monthlyInstallment) > 0 && l.remaining > 0 && !l.autoGenerated) {
          const d = parseInt(l.dueDay) || 1;
          const maxDay = new Date(y, mIdx + 1, 0).getDate();
          items.push({
            id: `ag-loan-${l.id}-${y}-${mIdx}`,
            title: `قسط ${l.name}`,
            date: `${y}-${pad(mIdx + 1)}-${pad(Math.min(d, maxDay))}`,
            amount: safeNumber(l.monthlyInstallment),
            type: l.isReceivable ? 'success' : 'danger',
            icon: l.isReceivable ? TrendingUp : Banknote,
            desc: l.isReceivable ? '💰 مستحق لك' : 'قسط شهري'
          });
        }
      });

      return items.sort((a, b) => (parseISODate(a.date) || 0) - (parseISODate(b.date) || 0));
    } catch (err) { return []; }
  }, [cards, updatedLoans, data]);

  const handleDelete = useCallback((id) => {
    const target = currentTxRef.current.find(t => t.id === id);
    if (!target) return;
    const expandedIds = expandTransferLinks([id], currentTxRef.current);
    const blocked = expandedIds.map(lid => currentTxRef.current.find(x => x.id === lid)).find(t => t && isMonthClosed(dataRef.current, t.year || 2026, t.month));
    if (blocked) {
      addNotification({ type: 'error', title: 'محظور', message: `قيد في شهر مغلق`, duration: 6000 });
      return;
    }
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: expandedIds.length > 1 ? `حذف التحويل (${expandedIds.length} قيود)` : 'تأكيد الحذف',
      message: 'سيتم نقلهم للأرشيف',
      onConfirm: () => {
        saveHistory();
        const idsSet = new Set(expandedIds);
        const latestTx = currentTxRef.current;
        const latestData = dataRef.current;
        const tombstones = expandedIds.map(lid => {
          const t = latestTx.find(x => x.id === lid);
          return t ? { ...t, deletedAt: new Date().toISOString(), deletedBy: 'self', originalStatus: t.status } : null;
        }).filter(Boolean);
        const newData = {
          ...latestData,
          transactions: latestTx.filter(t => !idsSet.has(t.id)),
          deletedTxArchive: [...(latestData.deletedTxArchive || []), ...tombstones].slice(-500),
          deletedTxIds: Array.from(new Set([...(latestData.deletedTxIds || []), ...expandedIds])).slice(-500)
        };
        dispatch({ type: 'SET_DATA', payload: newData });
        addNotification({ type: 'success', title: `تم حذف ${expandedIds.length} قيد` });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  }, [saveHistory, addNotification]);

  const handleBulkDeleteInApp = useCallback((ids) => {
    if (!Array.isArray(ids) || ids.length === 0) return;
    const latestTx = currentTxRef.current;
    const latestData = dataRef.current;
    const finalIds = expandTransferLinks(ids, latestTx);
    const idsSet = new Set(finalIds);
    saveHistory();
    const tombstones = finalIds.map(id => {
      const t = latestTx.find(x => x.id === id);
      return t ? { ...t, deletedAt: new Date().toISOString(), deletedBy: 'self', originalStatus: t.status } : null;
    }).filter(Boolean);
    const newData = {
      ...latestData,
      transactions: latestTx.filter(t => !idsSet.has(t.id)),
      deletedTxArchive: [...(latestData.deletedTxArchive || []), ...tombstones].slice(-500),
      deletedTxIds: Array.from(new Set([...(latestData.deletedTxIds || []), ...finalIds])).slice(-500)
    };
    dispatch({ type: 'SET_DATA', payload: newData });
    addNotification({ type: 'success', title: `تم حذف ${finalIds.length} قيد` });
  }, [saveHistory, addNotification]);

  if (authLoading) return (
    <div className="flex h-screen items-center justify-center" style={{ background: '#050A14' }}>
      <div className="w-12 h-12 border-[3px] border-[#635BFF] border-t-transparent rounded-full animate-spin"></div>
    </div>
  );

  if (isAuthenticated && cloudSyncStatus === 'pending') {
    return (
      <div className="flex h-screen flex-col items-center justify-center" style={{ background: '#050A14' }}>
        <div className="w-12 h-12 border-[3px] border-[#635BFF] border-t-transparent rounded-full animate-spin mb-4"></div>
        <p className="text-white font-bold text-sm">جاري مزامنة البيانات...</p>
      </div>
    );
  }

  if (!isAuthenticated) return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;

  if (!pinVerified) return (
    <PinLockScreen
      onSuccess={async (pin) => { try { await savePinSession(pin); } catch (e) {} setPinVerified(true); }}
      onLogout={() => {
        firebase.auth().signOut();
        setIsAuthenticated(false);
        sessionStorage.removeItem(PIN_SESSION_KEY);
        setPinVerified(false);
      }}
    />
  );

  const renderActiveView = () => {
    switch (activeTab) {
      case 'dashboard':
        return (
          <DashboardView
            data={data} financeSnapshot={financeSnapshot} liveBalances={liveBalances}
            liquidityDual={liquidityDual} netWorthData={netWorthData}
            walletVisibility={walletVisibility}
            onToggleVisibility={(k) => dispatch({ type: 'TOGGLE_WALLET_VISIBILITY', payload: k })}
            dispatch={dispatch} selectedYear={selectedYear} selectedMonth={selectedMonth}
            transactions={transactions} cards={cards} updatedLoans={updatedLoans}
            chartData={chartData} isDarkMode={isDarkMode} addNotification={addNotification}
            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })}
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })}
            custodySummary={custodySummary} monthCashback={monthCashback} bankFeesMonth={bankFeesMonth}
            hanySummary={hanySummary}
          />
        );
      case 'reports':
        return (
          <ReportsHubView
            data={data} liveBalances={liveBalances} updatedLoans={updatedLoans}
            selectedMonth={selectedMonth} selectedYear={selectedYear}
            dispatch={dispatch} addNotification={addNotification}
          />
        );
      case 'transactions':
        return (
          <TransactionsView
            groupedTransactions={groupedTransactions} transactions={transactions}
            selectedMonth={selectedMonth} selectedYear={selectedYear} transViewMode={transViewMode}
            statusFilter={state.statusFilter} searchTerm={searchTerm} expandedGroup={state.expandedGroup}
            data={data} monthInsights={monthInsights} dispatch={dispatch}
            handleDelete={handleDelete} addNotification={addNotification}
            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })}
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })}
            saveHistory={saveHistory} onBulkDelete={handleBulkDeleteInApp}
          />
        );
      case 'categories':
        return (
          <CategoriesView
            transactions={transactions} selectedMonth={selectedMonth} selectedYear={selectedYear}
            catViewType={catViewType} budgets={budgets} dispatch={dispatch}
            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })}
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })}
          />
        );
      case 'loans':
        return (
          <LoansView
            updatedLoans={updatedLoans} cards={cards} recurringItems={recurringItems}
            transactions={transactions} dispatch={dispatch}
            saveHistory={saveHistory} addNotification={addNotification} data={data}
            selectedMonth={selectedMonth} selectedYear={selectedYear}
          />
        );
      case 'cards':
        return (
          <WalletsAndCardsView
            cards={cards} liveBalances={liveBalances} dispatch={dispatch}
            data={data} saveHistory={saveHistory} addNotification={addNotification}
            selectedMonth={selectedMonth} selectedYear={selectedYear}
          />
        );
      case 'financial-forecast':
        return (
          <FinancialForecastView
            data={data} transactions={transactions} cards={cards}
            updatedLoans={updatedLoans} liveBalances={liveBalances}
            selectedYear={selectedYear} selectedMonth={selectedMonth}
            liquidityDual={liquidityDual}
          />
        );
      case 'calendar':
        return (
          <CalendarView data={data} getAgendaItems={getAgendaItems}
            transactions={transactions} dispatch={dispatch}
            saveHistory={saveHistory} addNotification={addNotification} />
        );
      case 'duplicates':
        return (
          <DuplicateDetectionSystem
            transactions={transactions} data={data} dispatch={dispatch}
            addNotification={addNotification} saveHistory={saveHistory}
            onBulkDelete={handleBulkDeleteInApp} />
        );
      case 'data-health':
        return (
          <DataHealthView
            data={data} transactions={transactions} cards={cards}
            updatedLoans={updatedLoans} liveBalances={liveBalances} dispatch={dispatch} />
        );
      case 'deleted':
        return (
          <DeletedArchiveView
            data={data} dispatch={dispatch} saveHistory={saveHistory}
            addNotification={addNotification} transactions={transactions} />
        );
      case 'audit':
        return <AuditLogView data={data} dispatch={dispatch} />;
      case 'settings':
        return (
          <SettingsView
            data={data} accountsData={accountsData} cards={cards} budgets={budgets}
            dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification}
            onResetPersonalData={null}
            onForceSave={handleForceSave} forceSaveState={forceSaveState}
          />
        );
      default: return null;
    }
  };

  const NAV_ITEMS = [
    { id: 'dashboard', label: 'الرئيسية', icon: Home },
    { id: 'transactions', label: 'المعاملات', icon: Receipt },
    { id: 'cards', label: 'البطاقات', icon: CreditCard },
    { id: 'reports', label: 'تقارير', icon: PrinterIcon },
    { id: 'more', label: 'المزيد', icon: MoreHorizontal }
  ];

  return (
    <PromiseModalProvider>
      <div className="min-h-screen font-sans">
        <OfflineBanner online={isOnline} />
        <ToastContainer notifications={notifications} removeNotification={removeNotification} />
        <ConfirmDialog confirmDialog={state.confirmDialog} dispatch={dispatch} />

        <Sidebar
          isOpen={isSidebarOpen}
          onClose={() => dispatch({ type: 'SET_SIDEBAR_OPEN', payload: false })}
          activeTab={activeTab}
          onNavigate={(id) => dispatch({ type: 'SET_ACTIVE_TAB', payload: id })}
          isDarkMode={isDarkMode}
          onToggleTheme={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: !isDarkMode })}
          isOnline={isOnline} syncStatus={cloudSyncStatus} isSaving={isSaving}
          custodyBalance={custodySummary.balance} hanyPayable={netWorthData.hanyPayable} data={data}
          onOpenSms={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: true })}
          onForceSync={() => {
            addNotification({ type: 'info', title: 'ميزة المزامنة قيد التطوير' });
          }}
          forceSaveState={forceSaveState}
          onForceSave={handleForceSave}
          onLogout={() => {
            firebase.auth().signOut();
            setIsAuthenticated(false);
            sessionStorage.removeItem(PIN_SESSION_KEY);
            setPinVerified(false);
          }}
          onLock={() => {
            sessionStorage.removeItem(PIN_SESSION_KEY);
            setPinVerified(false);
          }}
        />

        {cardPaymentModal && (
          <CardPaymentModal
            cardId={cardPaymentModal.cardId}
            data={data}
            dispatch={dispatch}
            saveHistory={saveHistory}
            addNotification={addNotification}
            onClose={() => dispatch({ type: 'SET_CARD_PAYMENT_MODAL', payload: null })}
          />
        )}

        <div className="bottom-nav-container no-print">
          <div className="nav-grid">
            {NAV_ITEMS.map(item => {
              const Icon = item.icon;
              const isActive = activeTab === item.id ||
                (item.id === 'more' && ['categories', 'loans', 'financial-forecast', 'duplicates', 'data-health', 'deleted', 'audit', 'settings', 'more'].includes(activeTab));
              return (
                <button key={item.id} type="button" onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} className={`nav-btn ${isActive ? 'active' : ''}`}>
                  <Icon size={20} /><span>{item.label}</span>
                </button>
              );
            })}
          </div>
        </div>

        <main className="p-3 lg:p-5 w-full">
          <div className="max-w-5xl mx-auto space-y-4 animate-fadeIn pb-24">
            {activeTab !== 'more' && (
              <ProfessionalHeader
                isDarkMode={isDarkMode} dispatch={dispatch}
                onOpenSms={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: true })}
                isOnline={isOnline} syncStatus={cloudSyncStatus} isSaving={isSaving}
                custodyBalance={custodySummary.balance} hanyPayable={netWorthData.hanyPayable}
                onOpenSidebar={() => dispatch({ type: 'SET_SIDEBAR_OPEN', payload: true })}
                onForceSync={() => addNotification({ type: 'info', title: 'جاري السحب...' })}
                forceSaveState={forceSaveState} onForceSave={handleForceSave}
                onOpenPrintCenter={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'reports' })}
              />
            )}
            {activeTab !== 'more' && renderActiveView()}
          </div>
        </main>

        {/* Floating Print FAB */}
        {activeTab !== 'reports' && activeTab !== 'more' && (
          <button
            onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'reports' })}
            className="print-fab no-print"
            title="فتح مركز التقارير والطباعة">
            <PrinterIcon size={24} />
          </button>
        )}
      </div>
    </PromiseModalProvider>
  );
}

const rootElement = document.getElementById('root');
if (rootElement) {
  createRoot(rootElement).render(<ErrorBoundary><App /></ErrorBoundary>);
  const hideLoading = () => {
    const l = document.getElementById('loading');
    if (!l) return;
    l.style.transition = 'opacity 0.4s ease';
    l.style.opacity = '0';
    setTimeout(() => { l.style.display = 'none'; }, 400);
  };
  if (document.readyState === 'complete') {
    setTimeout(hideLoading, 500);
  } else {
    window.addEventListener('load', () => setTimeout(hideLoading, 500));
  }
}
</script>
</body>
</html>
