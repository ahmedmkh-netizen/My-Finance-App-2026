const safeNumber = (v, f = 0) => { const n = Number(v); return isNaN(n) || !isFinite(n) ? f : n; };
const fmt = (n) => safeNumber(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const isLoanActiveInMonth = (loan, year, month) => {
  if (!loan) return false;
  if (safeNumber(loan.monthlyInstallment) <= 0) return false;
  if (loan.remaining !== undefined && loan.remaining <= 0) return false;
  const targetYM = year * 12 + getMonthIndex(month);
  if (loan.endYear && loan.endMonth) return targetYM <= safeNumber(loan.endYear) * 12 + getMonthIndex(loan.endMonth);
  if (loan.startYear && loan.startMonth) { if (targetYM < safeNumber(loan.startYear) * 12 + getMonthIndex(loan.startMonth)) return false; }
  if (!loan.startYear && !loan.endYear) return targetYM <= LOANS_FINAL_SETTLEMENT_YM;
  return true;
};

const safeParseJson = (raw, fallback) => {
  if (raw === null || raw === undefined) return fallback;
  try { const v = JSON.parse(raw); return v === null || v === undefined ? fallback : v; }
  catch { return fallback; }
};

const escapeHtml = (u) => { 
  if (typeof u !== 'string') return u; 
  return u.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); 
};

let _idSeq = 0;
const getSafeId = () => {
  try { if (crypto?.randomUUID) return crypto.randomUUID(); } catch {}
  return `${Date.now()}-${(++_idSeq).toString(36)}-${Math.random().toString(36).slice(2, 8)}`;

const normalizeText = (t) => !t ? "" : t.toString()

const toEnglishDigits = (s) => { 
  if (s === null || s === undefined) return s; 
  const map = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9' }; 
  return String(s).replace(/[٠-٩۰-۹]/g, d => map[d]); 
};

const parseNumberInput = (v) => {

/* ─── Date Helpers ─── */
const getLocalISODate = (d = new Date()) => 
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const dayStart = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const endOfToday = () => { const x = new Date(); x.setHours(23,59,59,999); return x; };

const calculateDaysLeft = (d) => { 
  if (!d) return null; 
  try { 
    const t = new Date(); t.setHours(0,0,0,0); 
    const g = new Date(d); g.setHours(0,0,0,0); 
    return Math.ceil((g-t)/86400000); 
  } catch { return null; } 
};

const parseISODate = (iso) => {
  if (!iso) return null;
  if (iso instanceof Date) return isNaN(iso) ? null : iso;
  const s = String(iso);
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if (m) {
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d) ? null : d;
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
};

  if (!key || typeof key !== 'string' || !key.includes('-')) return null; 
  const [y, ...rest] = key.split('-'); 
  const year = Number(y); 
  if (isNaN(year)) return null; 
  return { year, month: rest.join('-') }; 
};

const keyToInputMonth = (k) => { 
  if (!k || typeof k !== 'string') return ''; 
  const idx = k.indexOf('-'); 
  if (idx < 0) return ''; 
  const y = k.slice(0, idx); 
  const mName = k.slice(idx + 1); 
  const mIdx = ALL_MONTHS.indexOf(mName); 
  if (mIdx < 0 || !/^\d{4}$/.test(y)) return ''; 
  return `${y}-${String(mIdx + 1).padStart(2, '0')}`; 
};

const parseBankSms = (rawInput) => {
  const result = { 
    ok: false, bank: '', bankId: null, last4: null, amount: 0, type: 'expense',

  if (!rawInput || typeof rawInput !== 'string' || rawInput.trim().length < 5) { 
    result.notes.push('النص قصير جداً'); return result; 
  }
  
  const text = toEnglishDigits(rawInput).replace(/\u00A0/g, ' ');

  if (/\b(OTP|one[\s-]?time|verification\s+code|رمز\s+(التحقق|التأكيد)|do\s+not\s+share)\b/i.test(text)) {
    result.notes.push('❌ رسالة تحقق (OTP) — لا يمكن تسجيلها');
    return result;
  }

  if (/\bCIB\b|Commercial International|SWYPE|Titanium|سي آي بي/i.test(text)) { result.bank = 'CIB'; result.bankId = 'cib'; }
  else if (/\bAAIB\b|Arab African|العربي الأفريقي/i.test(text)) { result.bank = 'AAIB'; result.bankId = 'aaib'; }
  
  const last4Patterns = [
    /\b(?:ending|ends)\s*(?:with\s*)?(\d{4})\b/i,
    /\bcard\s*(?:no\.?|number|#)?\s*[:\-]?\s*(?:\*{2,}|\.{2,}|x{2,})?\s*(\d{4})\b/i,
    /(?:\*{2,}|\.{2,}|x{2,})\s*(\d{4})\b/i,
    /رقم\s*(?:\*{2,}|\.{2,})?\s*(\d{4})\b/,
    /بطاق[ةه]\s*(?:رقم\s*)?(?:\*{2,}|\.{2,})?\s*(\d{4})\b/
  ];
  for (const p of last4Patterns) { 
    const m = text.match(p); 
    if (m) { result.last4 = m[1]; break; } 
  }
  
  const incomeHints = [/\bcredit(?:ed)?\b/i, /\bdeposit(?:ed)?\b/i, /\breceived\b/i, /\bsalary\b/i, /\brefund\b/i, /\bcashback\b/i, /إيداع/, /تم إيداع/, /أضيف/, /راتب/, /استرداد/, /كاش باك/, /وارد/];
  const expenseHints = [/\bdebit(?:ed)?\b/i, /\bpurchase\b/i, /\bwithdraw(?:al|n)?\b/i, /\bpaid\b/i, /\bpayment\b/i, /خصم/, /تم خصم/, /سحب/, /شراء/, /دفع/, /مدفوع/, /صادر/];
  
  const isIncome = incomeHints.some(r => r.test(text));
  const isExpense = expenseHints.some(r => r.test(text));
  
  if (isIncome && !isExpense) { result.type = 'income'; result.subType = 'deposit'; }
  else if (isExpense && !isIncome) { result.type = 'expense'; result.subType = 'withdrawal'; }

  const cur = '(?:EGP|LE|E£|ج\\.?م|جنيه|جم|\\$)';
  const amtPatterns = [
    new RegExp(`${cur}\\s*([0-9][0-9,]*\\.?[0-9]*)`, 'i'),
    new RegExp(`([0-9][0-9,]*\\.?[0-9]*)\\s*${cur}`, 'i'),
    /(?:amount|for|of|بقيمة|بمبلغ|مبلغ)\s*[:\s]*([0-9][0-9,]*\.?[0-9]*)/i
  ];
  
  for (const p of amtPatterns) {
    const m = text.match(p);
    if (m) {
      const n = Number(m[1].replace(/,/g, ''));
      if (n >= 1 && n < 100000000) { result.amount = n; break; }
    }
  }
  
  if (!result.amount) {
    const decNums = (text.match(/\b\d{1,8}\.\d{2}\b/g) || []).map(Number).filter(n => n >= 1);
    if (decNums.length === 1) result.amount = decNums[0];
    else if (decNums.length > 1) { result.amount = Math.max(...decNums); result.notes.push('مبالغ متعددة — اختر يدوياً'); }
  }
  
  const balMatch = text.match(/(?:balance|الرصيد|رصيد)[^\d]{0,20}([0-9][0-9,]*\.?[0-9]*)/i);
  if (balMatch) { 
    const b = Number(balMatch[1].replace(/,/g, '')); 
    if (b > 0 && b !== result.amount) result.balance = b; 
  }

  const now = new Date();
  let parsedDate = null;
  const MONTHS_EN = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
  
  let m = text.match(/\b(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})\b/);
  if (m) { 
    const d = +m[1], mo = +m[2]; let y = +m[3]; 
    if (y < 100) y += 2000; 
    if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12 && y >= 2020) parsedDate = new Date(y, mo - 1, d); 
  }
  
  if (!parsedDate) { 
    m = text.match(/\b(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})\b/); 
    if (m) { 
      const y = +m[1], mo = +m[2], d = +m[3]; 
      if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12) parsedDate = new Date(y, mo - 1, d); 
    } 
  }
  
  if (!parsedDate) { 
    m = text.match(/\b(\d{1,2})[\s\-]*([A-Za-z]{3,9})[\s\-]*(\d{2,4})\b/); 
    if (m) { 
      const mo = MONTHS_EN[m[2].toLowerCase().slice(0, 3)]; 
      if (mo) { let y = +m[3]; if (y < 100) y += 2000; parsedDate = new Date(y, mo - 1, +m[1]); } 
    } 
  }
  
  if (parsedDate && !isNaN(parsedDate) && parsedDate <= now) result.date = getLocalISODate(parsedDate);

  const merchantPatterns = [
    /\bat\s+([A-Z][A-Z0-9\s&'\.\-]{2,40}?)(?:\s+on\s|\s+at\s|\s*[\.\,\n]|$)/i,
    /\b(?:merchant|from|to)\s*[:\-]?\s*([A-Z][A-Z0-9\s&'\.\-]{2,40}?)(?:\s+on\s|\s*[\.\,\n]|$)/i,
    /لدى\s+([^\.,\n]{2,40}?)(?:\s+يوم|\s+بتاريخ|\s*[\.\,\n]|$)/
  ];
  
  for (const p of merchantPatterns) { 
    const mm = text.match(p); 
    if (mm && mm[1]) { 
      const desc = mm[1].trim().replace(/\s+/g, ' '); 
      if (desc.length >= 2 && !/^\d+$/.test(desc)) { result.description = desc; break; } 
    } 
  }
  
  if (result.last4 && CARD_LAST4_MAP[result.last4]) {
    const mapping = CARD_LAST4_MAP[result.last4];
    result.method = mapping.method;
    result.linkedCardId = mapping.linkedCardId;
    result.bank = mapping.bank;
    result.accountKind = mapping.kind;
    result.cardLabel = mapping.label || '';
    result.notes.push(`✅ ${mapping.label}`);
  }
  else if (result.bankId === 'cib') { result.method = 'cib_card'; result.linkedCardId = 1; result.notes.push('⚠️ افتراض Titanium'); }
  else if (result.bankId === 'aaib') { result.method = 'aaib_card'; result.linkedCardId = 2; result.notes.push('⚠️ افتراض Signature'); }
  
  if (/\bTelda\b|تيلدا/i.test(text)) {
    const personMatch = text.match(/(?:to|لـ|إلى)\s*(Shaimaa|Salma|Abdelrahman|شيماء|سلمى|عبد الرحمن)/i);
    if (personMatch) {
      const p = personMatch[1].toLowerCase();
      if (p === 'shaimaa' || p === 'شيماء') result.method = 'telda_shaimaa';
      else if (p === 'salma' || p === 'سلمى') result.method = 'telda_salma';
      else if (p === 'abdelrahman' || p === 'عبد الرحمن') result.method = 'telda_abdelrahman';
    }
  }
  
  result.ok = result.amount > 0;
  if (!result.ok) result.notes.push('لم يتم العثور على مبلغ');
  if (!result.method) result.notes.push('لم يتم التعرف على البطاقة');
  if (!result.description) result.description = result.type === 'income' ? 'دخل من SMS' : 'مصروف من SMS';
  return result;
};

/* ═══════════════════════════════════════════════════════════════
   PIN — PBKDF2 (Self-Healing)
   ═══════════════════════════════════════════════════════════════ */
const hashPin = async (pin) => {
  if (!crypto?.subtle?.importKey || !crypto?.subtle?.deriveBits) {
    throw new Error('المتصفح لا يدعم التشفير');
  }
  try {
    const encoder = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', encoder.encode(String(pin)), 'PBKDF2', false, ['deriveBits']);
    const salt = encoder.encode('fintracker_salt_v2_2026');
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, keyMaterial, 256
    );
    return 'pbkdf2_' + Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    console.error('hashPin failed:', e);
    throw new Error('فشل تشفير الرمز');
  }
};

const getStoredPinHash = () => {
  try { return localStorage.getItem(PIN_HASH_KEY); } catch { return null; }
};

const savePinHash = async (pin) => { 
  const hash = await hashPin(pin); 
  localStorage.setItem(PIN_HASH_KEY, hash); 
};

const verifyPin = async (pin) => { 
  const stored = getStoredPinHash(); 
  
  if (!stored) {
    if (pin === DEFAULT_PIN) {
      try { await savePinHash(pin); } catch {}
      return true;
    }
    return false;
  }
  
  if (!stored.startsWith('pbkdf2_')) {
    console.warn('⚠️ PIN hash corrupt — resetting');
    try { localStorage.removeItem(PIN_HASH_KEY); } catch {}
    if (pin === DEFAULT_PIN) {
      try { await savePinHash(pin); } catch {}
      return true;
    }
    return false;
  }
  
  try {
    const current = await hashPin(pin);
    return current === stored;
  } catch (e) {
    console.error('verifyPin error:', e);
    if (pin === DEFAULT_PIN) {
      try { localStorage.removeItem(PIN_HASH_KEY); await savePinHash(pin); } catch {}
      return true;
    }
    return false;
  }
};

const computeBalance = (data, key, asOfDate) => {
  const accountsData = data?.accountsData || DEFAULT_ACCOUNTS;
  const base = safeNumber(accountsData[key]?.balance);
  
  const cutoffDay = dayStart(getAccountCutoff(accountsData, key));
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();
  const backward = upper < cutoffDay;
  let bal = base;
  
  (data?.transactions || []).forEach(t => {
    if (t.status !== 'paid' || t.method !== key) return;
    if (t.source === 'carryover') return;
    if (isCashAccount(key) && isHanyShopCategory(t.category)) return;
    const d = parseISODate(t.date);
    if (!d) return;
    const amt = safeNumber(t.amount);
    const signed = (t.subType === 'deposit') ? amt : -amt;
    if (backward) { if (d > upper && d < cutoffDay) bal -= signed; }
    else { if (d >= cutoffDay && d <= upper) bal += signed; }
  });
  return bal;
};

const computeCardDebt = (data, card, asOfDate) => {
  if (!card) return 0;
  const method = getCardMethod(card);
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();
  const cutoffISO = card.openingDate || CUTOFF_DATE_2026_09_30;
  const cutoffDay = dayStart(parseISODate(cutoffISO) || new Date(0));
  
  let debt = safeNumber(card.openingDebt);
  (data?.transactions || []).forEach(t => {
    if (t.status !== 'paid' || t.source === 'carryover') return;
    const d = parseISODate(t.date);
    if (!d || d < cutoffDay || d > upper) return;
    
    const amt = safeNumber(t.amount);
    let belongsToCard = false;
    const hasExplicitCardLink = (t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== '');
    
    if (hasExplicitCardLink) belongsToCard = (t.linkedCardId === card.id);
    else if (t.cardLast4 && subCards.includes(t.cardLast4)) belongsToCard = true;
    else belongsToCard = (t.method === method);
    
    if (!belongsToCard) return;
    if (t.type === 'expense') debt += amt;
    else if (t.type === 'income') debt -= amt;
  });
  return debt;
};

const getClosingBalance = (data, key, year, month) => {
  const monthKey = makeMonthKey(year, month);
  const snap = data?.monthlySnapshots?.[monthKey]?.[key];
  if (snap !== undefined && snap !== null) return safeNumber(snap);
  const monthIdx = getMonthIndex(month);
  if (monthIdx < 0) return computeBalance(data, key);
  const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
  return computeBalance(data, key, monthEnd);
};

const deriveDefaultCutoff = (txs) => { 
  const dates = (txs || []).filter(t => t.status === 'paid' && t.date).map(t => t.date).sort(); 
  if (dates.length === 0) return CUTOFF_DATE_2026_09_30; 
  const d = parseISODate(dates[0]); 
  if (!d) return CUTOFF_DATE_2026_09_30; 
  d.setDate(d.getDate() - 1); 
  return getLocalISODate(d); 
};

/* ─── Custody + Cashback ─── */
const computeCustodyBalance = (entries) => {
  if (!Array.isArray(entries)) return { received: 0, transferred: 0, spentCash: 0, spentCard: 0, settled: 0, balance: 0, totalSpent: 0 };
  let received = 0, transferred = 0, spentCash = 0, spentCard = 0, settled = 0;
  entries.forEach(e => {
    const amt = safeNumber(e.amount);
    switch (e.type) {
      case CUSTODY_TYPE.RECEIVE: received += amt; break;
      case CUSTODY_TYPE.TRANSFER: transferred += amt; break;
      case CUSTODY_TYPE.SPEND_CASH: spentCash += amt; break;
      case CUSTODY_TYPE.SPEND_CARD: spentCard += amt; break;
      case CUSTODY_TYPE.SETTLE: settled += amt; break;
    }
  });
  const totalSpent = spentCash + spentCard;
  return { received, transferred, spentCash, spentCard, settled, balance: received - transferred - totalSpent - settled, totalSpent };
};

const computeCashbackSummary = (trackers) => { 
  if (!Array.isArray(trackers)) return { expected: 0, received: 0, pending: 0, list: [] }; 
  const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0); 
  const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0); 
  return { expected, received, pending: expected - received, list: trackers }; 
};

/* ═══════════════════════════════════════════════════════════════
   Migration helpers (simplified for V84)
   ═══════════════════════════════════════════════════════════════ */
const mergeById = (existing, defaults) => {
  if (!Array.isArray(existing) || existing.length === 0) return defaults;
  const merged = [...existing];
  defaults.forEach(d => {
    if (!merged.some(e => e.id === d.id || (e.systemId && d.systemId && e.systemId === d.systemId))) merged.push(d);
  });
  return merged;
};

const migrateCards = (cards) => {
  if (!Array.isArray(cards)) return DEFAULT_CARDS;
  return cards.map(c => {
    const migrated = { ...c };
    if (!Array.isArray(migrated.subCardLast4)) migrated.subCardLast4 = [];
    if (migrated.id === 2 && String(migrated.last4) === '0391') migrated.last4 = '3391';
    if (!migrated.openingDate) migrated.openingDate = CUTOFF_DATE_2026_09_30;
    if (c.openingDebt !== undefined && c.availableBalance !== undefined) {
      return { ...migrated, cashbackRate: c.cashbackRate !== undefined ? safeNumber(c.cashbackRate) : 1 };
    }
    const limit = safeNumber(c.limit);
    const oldOpening = safeNumber(c.openingBalance);
    return { ...migrated, openingDebt: Math.max(0, limit - oldOpening), availableBalance: oldOpening, cashbackRate: safeNumber(c.cashbackRate, 1) };
  });
};

const migrateSnapshotsAndClosed = (snapshots, closedMonths) => {
  let snaps = snapshots && typeof snapshots === 'object' ? { ...snapshots } : {};
  let closed = Array.isArray(closedMonths) ? [...closedMonths] : [];
  if (Object.keys(snaps).length > 0 && !Object.keys(snaps).every(k => /^\d{4}-/.test(k))) {
    const migrated = {};
    Object.entries(snaps).forEach(([month, val]) => { 
      if (/^\d{4}-/.test(month)) migrated[month] = val; 
      else migrated[makeMonthKey(2026, month)] = (typeof val === 'object' && val !== null) ? val : { cash: safeNumber(val) }; 
    });
    snaps = migrated;
  }
  if (closed.length > 0 && !closed.every(k => /^\d{4}-/.test(k))) { 
    closed = closed.map(m => /^\d{4}-/.test(m) ? m : makeMonthKey(2026, m)); 
  }
  return { snapshots: snaps, closedMonths: closed };
};

const migrateTransaction = (t) => {
  if (!t) return t;
  const kind = inferKind(t);
  let year = t.year, month = t.month, monthIndex = t.monthIndex;
  if (t.date && (!month || !year)) { 
    const d = parseISODate(t.date); 
    if (d) { if (!year) year = d.getFullYear(); if (!month) month = ALL_MONTHS[d.getMonth()]; } 
  }
  if (!year) year = 2026;
  if (monthIndex === undefined || monthIndex === null || monthIndex < 0) monthIndex = getMonthIndex(month);
  let subType = t.subType;
  if (!subType) subType = t.type === 'income' ? 'deposit' : 'withdrawal';
  return { ...t, kind, year, month, monthIndex, subType };
};

const migrateRecurringItems = (items) => {  
  if (!Array.isArray(items)) return DEFAULT_RECURRING;
  return items.map(r => {
    const migrated = { ...r };
    if (migrated.active === undefined) migrated.active = true;
    if (migrated.startMonth && !/^\d{4}-\d{2}$/.test(migrated.startMonth)) migrated.startMonth = keyToInputMonth(migrated.startMonth) || '2026-10';
    if (migrated.endMonth && !/^\d{4}-\d{2}$/.test(migrated.endMonth)) migrated.endMonth = keyToInputMonth(migrated.endMonth) || null;
    if (migrated.startMonth === undefined) migrated.startMonth = '2026-10';
    if (migrated.endMonth === undefined) migrated.endMonth = null;
    return migrated;
  });
};

const METHOD_BY_CATEGORY = {
  'إيجار المحل': 'cash', 'الزكاة والتبرعات': 'cib_savings', 'تكييف محمود': 'cash',
  'راتب شهري': 'aaib_savings', 'راتب AAIB': 'aaib_savings', 'عهدة إيماك WE': 'cib_savings',
  'عهدة شركة إيماك': 'cib_savings', 'Cash Back': 'cash', 'استرداد كاش باك': 'cash',
  'الالتزامات البنكية والتمويلية': 'aaib_savings', 'الصحة والرعاية الطبية': 'cash'
};

const migrateData = (parsed) => {
  if (!parsed) return parsed;

  const deletedDefaultIds = Array.isArray(parsed.deletedDefaultIds) ? parsed.deletedDefaultIds : [];
  const deletedSet = new Set(deletedDefaultIds);

  const incomingCards = Array.isArray(parsed.cards) ? parsed.cards : [];
  const cardsFilteredDefaults = DEFAULT_CARDS.filter(c => !deletedSet.has(c.id));
  const mergedCards = mergeById(migrateCards(incomingCards), cardsFilteredDefaults);

  const incomingLoans = Array.isArray(parsed.loans) ? parsed.loans : [];
  const loansFilteredDefaults = DEFAULT_LOANS.filter(l => !deletedSet.has(l.id) && !(l.systemId && deletedSet.has(l.systemId)));
  const mergedLoans = mergeById(incomingLoans, loansFilteredDefaults);

  let { snapshots, closedMonths } = migrateSnapshotsAndClosed(parsed.monthlySnapshots, parsed.closedMonths);

  let transactions = Array.isArray(parsed.transactions) ? parsed.transactions.map(migrateTransaction) : [];
  transactions = transactions.map(t => {
    if (t.id && t.sourceRecurringId && t.year && t.month && /^rec-.+-\d{4}-.+-[a-z0-9-]{6,}$/i.test(t.id)) {
      return { ...t, id: `rec-${t.sourceRecurringId}-${makeMonthKey(t.year, t.month)}` };
    }
    return t;
  });

  const accountsData = parsed.accountsData && typeof parsed.accountsData === 'object' ? { ...DEFAULT_ACCOUNTS, ...parsed.accountsData } : { ...DEFAULT_ACCOUNTS };
  const defaultCutoff = deriveDefaultCutoff(transactions);
  
  ACCOUNT_KEYS.forEach(k => {
    if (!accountsData[k]?.lastUpdated) accountsData[k] = { ...(DEFAULT_ACCOUNTS[k] || {}), ...(accountsData[k] || {}), lastUpdated: defaultCutoff };
  });

  let recurringItems = Array.isArray(parsed.recurringItems) ? parsed.recurringItems : [];
  if (!parsed.recurringInitialized && recurringItems.length === 0) recurringItems = DEFAULT_RECURRING.slice();
  
  const recurringIds = new Set(recurringItems.map(r => r.id));
  DEFAULT_RECURRING.forEach(dr => { if (!recurringIds.has(dr.id) && !deletedSet.has(dr.id)) recurringItems.push(dr); });
  recurringItems = migrateRecurringItems(recurringItems);
  recurringItems = recurringItems.map(r => {
    if (r.method) return r;
    if (r.linkedCardId) { 
      const card = DEFAULT_CARDS.find(c => c.id === r.linkedCardId); 
      return { ...r, method: card ? getCardMethod(card) : 'cash' }; 
    }
    const m = METHOD_BY_CATEGORY[r.category];
    return m ? { ...r, method: m } : { ...r, method: 'cash' };
  });

  const settledHanyMonths = Array.isArray(parsed.settledHanyMonths) ? parsed.settledHanyMonths : [];
  const deletedTxIds = Array.isArray(parsed.deletedTxIds) ? parsed.deletedTxIds.slice(-500) : [];
  const deletedTxArchive = Array.isArray(parsed.deletedTxArchive) ? parsed.deletedTxArchive.slice(-500) : [];

  return {
    ...parsed,
    engineVersion: CURRENT_ENGINE_VERSION, 
    recurringInitialized: true,
    cards: mergedCards, 
    loans: mergedLoans,
    recurringItems, 
    closedMonths, 
    monthlySnapshots: snapshots, 
    transactions, 
    accountsData,
    monthlyPlans: parsed.monthlyPlans && typeof parsed.monthlyPlans === 'object' ? { ...DEFAULT_MONTHLY_PLANS, ...parsed.monthlyPlans } : DEFAULT_MONTHLY_PLANS,
    materializedRecurring: parsed.materializedRecurring && typeof parsed.materializedRecurring === 'object' ? parsed.materializedRecurring : {},
    custodyEntries: Array.isArray(parsed.custodyEntries) ? parsed.custodyEntries : DEFAULT_CUSTODY_ENTRIES,
    cashbackTrackers: Array.isArray(parsed.cashbackTrackers) ? parsed.cashbackTrackers : [],
    settledHanyMonths, 
    deletedTxIds, 
    deletedTxArchive, 
    deletedDefaultIds,
    defaultsSeeded: true
  };
};

const getInitialData = () => {
  try {
    const cached = localStorage.getItem(STORAGE_KEY) || LEGACY_KEYS.map(k => localStorage.getItem(k)).find(Boolean);
    if (cached) {
      const migrated = migrateData(safeParseJson(cached, null));
      if (migrated) { 
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated)); } catch {}
        return migrated; 
      }
    }
  } catch (e) { console.warn('getInitialData failed:', e); }
  
  return {
    engineVersion: CURRENT_ENGINE_VERSION, recurringInitialized: true, defaultsSeeded: true,

    closedMonths: [], monthlySnapshots: {}, materializedRecurring: {},
    custodyEntries: DEFAULT_CUSTODY_ENTRIES, cashbackTrackers: [],
    settledHanyMonths: [], deletedTxIds: [], deletedTxArchive: [], deletedDefaultIds: []
  };
};

/* ─── materializeRecurringItems ─── */
const materializeRecurringItems = (data, asOfDateStr) => {
  if (!data?.recurringItems?.length) return null;
  
  const now = asOfDateStr ? new Date(asOfDateStr) : new Date();
  const permanentDeleted = new Set(data.deletedTxIds || []);
  const existing = (data.transactions || []).filter(t => !(permanentDeleted.has(t.id)));
  const materialized = { ...(data.materializedRecurring || {}) };
  const newTxs = [];
  
  const loanPaidMap = {};
  existing.forEach(t => { 
    if (t.status === 'paid' && t.sourceReceivableId) 
      loanPaidMap[t.sourceReceivableId] = (loanPaidMap[t.sourceReceivableId] || 0) + safeNumber(t.amount); 
  });
  
  data.recurringItems.forEach(r => {
    if (r.active === false || !r.id || !r.type) return;
    const day = safeNumber(r.day, 1);
    if (day < 1 || day > 31) return;
    
    const startInput = r.startMonth || '2026-10';
    const [sy, sm] = startInput.split('-').map(Number);
    if (isNaN(sy) || isNaN(sm)) return;
    
    const endInput = r.endMonth || `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const [ey, em] = endInput.split('-').map(Number);
    if (isNaN(ey) || isNaN(em)) return;
    
    const startYM = sy * 12 + (sm - 1);
    const endYM = ey * 12 + (em - 1);
    
    for (let ym = startYM; ym <= endYM; ym++) {
      const y = Math.floor(ym / 12);
      const mIdx = ym % 12;
      const monthName = ALL_MONTHS[mIdx];
      
      const maxDayInMonth = new Date(y, mIdx + 1, 0).getDate();
      const safeDay = Math.min(day, maxDayInMonth);
      const targetDate = new Date(y, mIdx, safeDay);
      if (targetDate > now) break;
      
      const matKey = `${r.id}_${makeMonthKey(y, monthName)}`;
      if (materialized[matKey] === 'deleted') continue;
      if (materialized[matKey]) continue;
      
      const manualExists = existing.some(t => 
        t.sourceRecurringId === r.id && t.month === monthName && (t.year || y) === y
      );
      if (manualExists) { materialized[matKey] = true; continue; }
      
      let receivableLinkedId = null;
      if (r.linkedLoanSystemId) {
        const linkedLoan = (data.loans || []).find(l => l.systemId === r.linkedLoanSystemId);
        if (linkedLoan) { 
          const collected = safeNumber(linkedLoan.prePaidAmount) + (loanPaidMap[linkedLoan.id] || 0); 
          if (collected >= safeNumber(linkedLoan.totalAmount) - 0.005) break;
          receivableLinkedId = linkedLoan.id; 
        }
      }
      
      let method = 'cash';
      let linkedCardId = r.linkedCardId;
      if (r.method) { method = r.method; }
      else if (linkedCardId) { 
        const card = (data.cards || []).find(c => c.id === linkedCardId); 
        if (card) method = getCardMethod(card); 
      }
      
      const isFee = BANK_FEE_CATEGORIES.has(r.category);
      const kind = r.kind || (isFee ? KIND.FINANCIAL : KIND.OPERATIONAL);
      const newId = `rec-${r.id}-${makeMonthKey(y, monthName)}`;
      
      if (permanentDeleted.has(newId)) { materialized[matKey] = 'deleted'; continue; }
      
      newTxs.push({
        id: newId, type: r.type, subType: r.type === 'income' ? 'deposit' : 'withdrawal', kind,
        category: r.category, amount: safeNumber(r.amount), description: r.title || 'بند متكرر',
        method, date: getLocalISODate(targetDate), month: monthName, year: y, monthIndex: mIdx,
        status: 'pending', sourceRecurringId: r.id, 
        linkedCardId: linkedCardId || undefined,
        sourceReceivableId: receivableLinkedId || undefined,
        transferChannel: r.transferChannel || undefined,
        createdAt: new Date().toISOString()
      });
      materialized[matKey] = true;
    }
  });
  
  if (newTxs.length === 0) return null;
  
  return { 
    ...data, 
    transactions: [...newTxs, ...existing].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)), 
    materializedRecurring: materialized 
  };
};

/* ─── dedupeRecurringTransactions ─── */
const dedupeRecurringTransactions = (transactions) => {
  if (!Array.isArray(transactions) || transactions.length === 0) {
    return { transactions: transactions || [], removed: [] };
  }
  
  const removed = [];
  const seenById = new Set();
  const seenRecurringKey = new Map();
  const seenFuzzyKey = new Map();
  const keep = [];
  
  const sorted = [...transactions].sort((a, b) => {
    const aTs = a.createdAt ? new Date(a.createdAt).getTime() : 0;
    const bTs = b.createdAt ? new Date(b.createdAt).getTime() : 0;
    if (aTs !== bTs) return bTs - aTs;
    return String(b.id || '').localeCompare(String(a.id || ''));
  });
  
  sorted.forEach(t => {
    if (!t || !t.id) { keep.push(t); return; }
    if (seenById.has(t.id)) { removed.push({ reason: 'duplicate_id', id: t.id, tx: t }); return; }
    
    if (t.sourceRecurringId && t.year && t.month) {
      const rKey = `${t.sourceRecurringId}|${t.year}|${t.month}`;
      if (seenRecurringKey.has(rKey)) { removed.push({ reason: 'duplicate_recurring', id: t.id, tx: t }); return; }
      seenRecurringKey.set(rKey, t.id);
    }
    
    if (t.createdAt && t.source !== 'sms' && !t.linkedTransferId && safeNumber(t.amount) > 0) {
      const FUZZY_WINDOW_MS = 5000;
      const tTime = new Date(t.createdAt).getTime();
      if (!isNaN(tTime)) {
        const descKey = normalizeText(t.description || '').slice(0, 30);
        const fKey = `${safeNumber(t.amount)}|${t.category}|${t.method}|${t.type}|${descKey}`;
        const lastSeen = seenFuzzyKey.get(fKey);
        if (lastSeen && (lastSeen.time - tTime) < FUZZY_WINDOW_MS) {
          removed.push({ reason: 'fuzzy_duplicate', id: t.id, tx: t });
          return;
        }
        seenFuzzyKey.set(fKey, { id: t.id, time: tTime });
      }
    }
    
    seenById.add(t.id);
    keep.push(t);
  });
  
  return { transactions: keep, removed };
};

const useOnlineStatus = () => {
  const [online, setOnline] = useState(() => (typeof navigator !== 'undefined' ? navigator.onLine : true));
  useEffect(() => {
    const onOnline = () => setOnline(true);
    const onOffline = () => setOnline(false);
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    return () => { 
      window.removeEventListener('online', onOnline); 
      window.removeEventListener('offline', onOffline); 
    };
  }, []);
  return online;
};

  const metadata = { name, parents: [folderId], mimeType: 'application/json' };
  const boundary = '----V84DriveBoundary' + Date.now();
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,createdTime', { 
    method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` }, body 
  });
  if (!res.ok) throw new Error('فشل الرفع');
  return await res.json();
};

const listDriveBackups = async () => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false and mimeType='application/json'`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,size,createdTime)&orderBy=createdTime desc&pageSize=50`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('فشل الجلب');
  const data = await res.json();
  return data.files || [];
};

const downloadBackupFromDrive = async (fileId) => {
  const token = await ensureDriveToken();
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('فشل التنزيل');
  return await res.json();
};

/* ─── Error Boundary ─── */
class ErrorBoundary extends React.Component {
  constructor(p) { 
    super(p); 
    this.state = { hasError: false, error: null }; 
  }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(e, i) { 
    console.error('App Error:', e, i); 
    clearAllModals(); 
  }
  render() {
    if (this.state.hasError) return (
      <div className="flex flex-col h-screen items-center justify-center p-8 text-center" style={{background: 'var(--bg-app)'}} dir="rtl">
        <AlertTriangle size={48} className="text-red-500 mb-4" />

        <div className="flex gap-3">

          <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="btn btn-secondary"><Trash2 size={18}/> مسح</button>

    );
    return this.props.children;
  }
}

/* ─── Promise Modal Provider ─── */
const PromiseModalProvider = ({ children }) => {
  const [stack, setStack] = useState([]);
  const [inputValues, setInputValues] = useState({});
  
  useEffect(() => {
    const handleInput = (e) => setStack(s => [...s, { kind: 'input', ...e.detail }]);
    window.addEventListener('show-input-modal', handleInput);
    return () => window.removeEventListener('show-input-modal', handleInput);
  }, []);
  
  const current = stack[stack.length - 1];
  
  const dismiss = useCallback((value) => {
    if (!current) return;
    const id = current._id;
    setStack(s => s.slice(0, -1));
    resolveModal(id, value);
    setInputValues(prev => { 
      if (!(id in prev)) return prev; 
      const next = { ...prev }; 
      delete next[id]; 
      return next; 
    });
  }, [current]);
  
  const inputValue = current?._id !== undefined ? (inputValues[current._id] ?? current.inputValue ?? '') : '';
  const setInputValue = useCallback((v) => { 
    if (current?._id === undefined) return; 
    setInputValues(prev => ({ ...prev, [current._id]: v })); 
  }, [current?._id]);
  
  if (!current?.kind) return <>{children}</>;
  
  return (
    <React.Fragment>
      {children}
      <div className="modal-backdrop z-[6000] no-print">
        <div className="generic-modal max-w-md">
          <div className="generic-modal-header">
            <h3 className="text-base font-black flex items-center gap-2"><span>{current.icon || '💬'}</span>{current.title}</h3>
            <button onClick={() => dismiss(null)} className="btn btn-ghost p-1.5"><X size={16} /></button>
          </div>
          <div className="generic-modal-body">
            {current.message && <p className="text-sm mb-3 whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>}
            <input 
              autoFocus type="text" inputMode={current.numeric ? 'decimal' : 'text'} 
              className="input-field text-2xl font-black text-center py-4" 
              style={{ color: 'var(--brand)' }}
              value={inputValue} 
              onChange={e => setInputValue(current.numeric ? e.target.value.replace(/[^\d.\-]/g, '') : e.target.value)} 
              onKeyDown={e => { if (e.key === 'Enter') dismiss(current.numeric ? parseNumberInput(inputValue) : inputValue.trim()); }} 
              placeholder={current.placeholder || ''} 
            />
          </div>
          <div className="generic-modal-footer">
            <button onClick={() => dismiss(null)} className="btn btn-secondary flex-1">إلغاء</button>
            <button onClick={() => dismiss(current.numeric ? parseNumberInput(inputValue) : inputValue.trim())} className="btn btn-primary flex-1">
              {current.confirmText || 'تأكيد'}
            </button>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
};

/* ─── Group Transactions ─── */
const groupTransactionsByDate = (list) => {
  const groups = {};
  list.forEach(t => { 
    const d = t.date || 'unknown'; 
    if (!groups[d]) groups[d] = []; 
    groups[d].push(t); 
  });
  const today = getLocalISODate();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const yestISO = getLocalISODate(yest);
  
  return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
    let label;
    if (date === today) label = '📅 النهاردة';
    else if (date === yestISO) label = '📅 امبارح';
    else {
      const dObj = parseISODate(date);
      if (dObj) label = '📅 ' + dObj.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' });
      else label = '📅 ' + date;
    }
    const total = groups[date].reduce((s, t) => s + safeNumber(t.amount), 0);
    return { date, label, items: groups[date], total };
  });
};

/* ─── PIN Lock Screen ─── */
const PinLockScreen = ({ onSuccess, onLogout }) => {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const [success, setSuccess] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const [lastPressed, setLastPressed] = useState(null);
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const pressTimerRef = useRef(null);
  const clearTimerRef = useRef(null);
  const navTimerRef = useRef(null);

  useEffect(() => {
    return () => {
      if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
      if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
      if (navTimerRef.current) clearTimeout(navTimerRef.current);
    };
  }, []);

  const handleDigit = (d) => {
    if (pin.length >= 4 || success) return;
    const next = pin + d;
    setPin(next); 
    setLastPressed(d);
    
    if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    pressTimerRef.current = setTimeout(() => setLastPressed(null), 150);
    
    if (next.length === 4) {
      if (navTimerRef.current) clearTimeout(navTimerRef.current);
      navTimerRef.current = setTimeout(async () => {
        const ok = await verifyPin(next);
        if (ok) { 
          setSuccess(true); 
          navTimerRef.current = setTimeout(() => onSuccess(), 500); 
        } else {
          setError(true); 
          setAttempts(a => a + 1);
          if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
          clearTimerRef.current = setTimeout(() => { setPin(''); setError(false); }, 650);
        }
      }, 150);
    }
  };
  
  const handleDelete = () => { if (!success) setPin(p => p.slice(0, -1)); };
  
  const handleReset = () => {
    try { localStorage.removeItem(PIN_HASH_KEY); sessionStorage.removeItem('pin_verified'); } catch {}
    window.location.reload();
  };
  
  return (
    <div className="min-h-screen flex items-center justify-center p-6 relative overflow-hidden" style={{ background: 'radial-gradient(ellipse at top, #1A2332 0%, #0B1220 55%, #060A14 100%)' }}>
      <div className={`relative w-full max-w-sm ${error ? 'animate-shake' : ''}`}>
        <div className="flex flex-col items-center mb-8">
          <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mb-4 transition-all duration-500 ${success ? 'bg-emerald-500 scale-110 shadow-2xl shadow-emerald-500/40' : error ? 'bg-red-500/20 border border-red-500/30' : 'bg-blue-500/10 border border-blue-500/20'}`}>
            {success ? <CheckCircle2 size={28} className="text-white" /> : error ? <AlertTriangle size={26} className="text-red-400" /> : <Lock size={26} className="text-blue-400" />}
          </div>
          <h1 className="text-xl font-black text-white mb-1">{success ? 'مرحباً ✓' : error ? 'رمز غير صحيح' : 'أهلاً بعودتك'}</h1>
          <p className="text-xs font-medium" style={{ color: '#64748B' }}>{success ? 'جارٍ الفتح...' : error ? `محاولة ${attempts}` : 'أدخل الرمز'}</p>
        </div>
        <div className="flex justify-center gap-3 mb-8 h-4">
          {[0, 1, 2, 3].map(i => (
            <div key={i} 
              className={`w-3 h-3 rounded-full transition-all duration-300 ${success ? 'bg-emerald-400 scale-125' : error ? 'bg-red-500 scale-110' : pin.length > i ? 'bg-blue-400 scale-125' : 'bg-transparent border-2 border-slate-600'}`}
            ></div>
          ))}
        </div>
        <div className="grid grid-cols-3 gap-3 mb-6">
          {['1','2','3','4','5','6','7','8','9'].map(d => (
            <button key={d} type="button" onClick={() => handleDigit(d)} 
              className={`aspect-square rounded-2xl font-black text-xl transition-all active:scale-90 select-none ${lastPressed === d ? 'bg-blue-500 text-white scale-95' : 'bg-white/[0.04] border border-white/[0.08] text-white hover:bg-white/[0.09]'}`}
            >{d}</button>
          ))}
          <div className="aspect-square"></div>
          <button type="button" onClick={() => handleDigit('0')} 
            className={`aspect-square rounded-2xl font-black text-xl transition-all active:scale-90 select-none ${lastPressed === '0' ? 'bg-blue-500 text-white scale-95' : 'bg-white/[0.04] border border-white/[0.08] text-white hover:bg-white/[0.09]'}`}
          >0</button>
          <button type="button" onClick={handleDelete} className="aspect-square rounded-2xl flex items-center justify-center active:scale-90" style={{ color: '#64748B' }}>
            <Delete size={20} />
          </button>
        </div>
        <button type="button" onClick={onLogout} 
          className="w-full py-3 text-xs font-bold flex items-center justify-center gap-2 transition-colors" 
          style={{ color: '#64748B' }}
        ><LogOut size={14} /> تسجيل الخروج</button>
        
        {!showResetConfirm ? (
          <button type="button" onClick={() => setShowResetConfirm(true)} className="w-full py-2 text-[10px] font-bold hover:text-blue-400 transition-colors" style={{ color: '#64748B' }}>
            نسيت الرمز؟ إعادة تعيين
          </button>
        ) : (
          <div className="mt-3 p-3 rounded-xl bg-red-500/10 border border-red-500/30 animate-fadeIn">
            <p className="text-[11px] text-red-300 font-bold mb-2 text-center">
              ⚠️ سيتم مسح الرمز وإعادة التحميل<br/>
              الرمز الافتراضي بعدها: <strong className="text-white">1033</strong>
            </p>
            <div className="flex gap-2">
              <button type="button" onClick={handleReset} className="flex-1 py-2 rounded-lg bg-red-500 text-white text-[11px] font-black active:scale-95">تأكيد</button>
              <button type="button" onClick={() => setShowResetConfirm(false)} className="flex-1 py-2 rounded-lg bg-white/10 text-white text-[11px] font-black active:scale-95">إلغاء</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

/* ─── PIN Change Modal ─── */
const PinChangeModal = ({ onClose, addNotification }) => {
  const [current, setCurrent] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [busy, setBusy] = useState(false);
  
  const submit = async () => {
    if (!/^\d{4}$/.test(next)) { addNotification({ type: 'error', title: 'الرمز الجديد لازم 4 أرقام' }); return; }
    if (next !== confirm) { addNotification({ type: 'error', title: 'الرمز الجديد مش متطابق' }); return; }
    setBusy(true);
    try {
      const ok = await verifyPin(current);
      if (!ok) { addNotification({ type: 'error', title: 'الرمز الحالي غير صحيح' }); setBusy(false); return; }
      await savePinHash(next);
      addNotification({ type: 'success', title: 'تم تغيير الرمز بنجاح' });
      setBusy(false); onClose();
    } catch (e) {
      addNotification({ type: 'error', title: 'فشل', message: e.message });
      setBusy(false);
    }
  };
  
  return (
    <ModalShell isOpen={true} onClose={onClose} title="تغيير رمز الدخول" icon="🔐">
      <div className="space-y-3">
        <FormField label="الرمز الحالي" type="password" inputMode="numeric" value={current} onChange={e => setCurrent(e.target.value.replace(/\D/g, '').slice(0, 4))} />
        <FormField label="الرمز الجديد" type="password" inputMode="numeric" value={next} onChange={e => setNext(e.target.value.replace(/\D/g, '').slice(0, 4))} />
        <FormField label="تأكيد الرمز الجديد" type="password" inputMode="numeric" value={confirm} onChange={e => setConfirm(e.target.value.replace(/\D/g, '').slice(0, 4))} />
        <button onClick={submit} disabled={busy} className="btn btn-primary w-full py-2.5 text-sm">{busy ? 'جاري الحفظ...' : 'حفظ'}</button>
      </div>
    </ModalShell>
  );
};

/* ─── SMS Parser Modal ─── */
const SmsParserModal = memo(({ isOpen, onClose, dispatch, addNotification, saveHistory, data }) => {
  const [rawText, setRawText] = useState('');
  const [parsed, setParsed] = useState(null);
  const [category, setCategory] = useState('');
  const [method, setMethod] = useState('cash');
  const [manualAmount, setManualAmount] = useState('');

  useEffect(() => { 
    if (!isOpen) { setRawText(''); setParsed(null); setCategory(''); setMethod('cash'); setManualAmount(''); } 
  }, [isOpen]);

  const handlePaste = async () => {
    try {
      if (navigator.clipboard?.readText) {
        const txt = await navigator.clipboard.readText();
        if (txt && txt.trim()) { setRawText(txt); addNotification({ type: 'success', title: 'تم اللصق', duration: 2000 }); return; }
      }
      addNotification({ type: 'info', title: 'الصق الرسالة يدوياً' });
    } catch { addNotification({ type: 'info', title: 'الصق الرسالة يدوياً' }); }
  };

  const handleAnalyze = () => {
    if (!rawText.trim()) { addNotification({ type: 'error', title: 'الصق رسالة البنك أولاً' }); return; }
    const res = parseBankSms(rawText);
    setParsed(res);
    if (res.method) setMethod(res.method);
    if (res.amount > 0) setManualAmount(String(res.amount));
    if (res.ok) {
      addNotification({ type: 'success', title: `تم التحليل: ${fmt(res.amount)} ج.م`, message: `${res.type === 'income' ? 'دخل' : 'مصروف'} • ${res.bank || 'بنك'}`, duration: 5000 });
    } else { addNotification({ type: 'warning', title: 'تحليل جزئي', message: res.notes.join(' • ') }); }
  };

  const handleSave = () => {
    const amt = parseNumberInput(manualAmount);
    if (!amt || amt <= 0) { addNotification({ type: 'error', title: 'أدخل مبلغ صالح' }); return; }
    if (!category) { addNotification({ type: 'error', title: 'اختر الفئة' }); return; }
    const d = parseISODate(parsed.date) || new Date();
    const year = d.getFullYear();
    const month = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, year, month)) { addNotification({ type: 'error', title: `شهر ${month} مغلق` }); return; }
    saveHistory();
    const newTx = {
      id: getSafeId(), type: parsed.type, subType: parsed.subType, kind: KIND.OPERATIONAL,
      category, amount: amt, description: parsed.description || 'SMS import',
      method, date: parsed.date, month, year, monthIndex: d.getMonth(),
      status: 'pending', source: 'sms', smsRawText: parsed.rawText, smsBank: parsed.bank,
      linkedCardId: parsed.linkedCardId || undefined, cardLast4: parsed.last4 || undefined,
      accountKind: parsed.accountKind || undefined, createdAt: new Date().toISOString()
    };
    dispatch({ 
      type: 'UPDATE_TRANSACTIONS', 
      payload: [newTx, ...(data.transactions || [])].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) 
    });
    addNotification({ type: 'success', title: 'تم الحفظ كمعلق' });
    onClose();
  };

  if (!isOpen) return null;

  return (
    <ModalShell isOpen={true} onClose={onClose} title="تحليل رسالة بنك" icon="📱" size="lg">
      <div className="space-y-3">
        <div>
          <div className="flex justify-between items-center mb-1.5">
            <label className="form-label">الصق رسالة البنك</label>
            <button type="button" onClick={handlePaste} className="text-[11px] font-black flex items-center gap-1" style={{ color: 'var(--brand)' }}>📋 لصق تلقائي</button>
          </div>
          <textarea className="input-field text-xs leading-relaxed" rows={6}
            placeholder="CIB: Purchase of EGP 1500.00 on card ending 9380..."
            value={rawText} onChange={e => setRawText(e.target.value)} dir="auto" />
          <p className="text-[10px] mt-1.5" style={{ color: 'var(--text-muted)' }}>🛡️ يرفض OTP • يدعم: 1016/9380/9352/2014/3391/2017/1809/2106</p>
        </div>
        <button type="button" onClick={handleAnalyze} disabled={!rawText.trim()} className="btn btn-primary w-full py-2.5 text-sm">
          <Sparkles size={14} /> حلّل الرسالة
        </button>
        {parsed && (
          <div className="space-y-3 pt-3 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            <div className={`p-3 rounded-lg ${parsed.ok ? 'bg-emerald-50 dark:bg-emerald-950/30' : 'bg-amber-50 dark:bg-amber-950/30'}`}>
              <div className="flex items-center gap-2 mb-2">
                {parsed.ok ? <CheckCircle2 size={16} className="text-emerald-600" /> : <AlertTriangle size={16} className="text-amber-600" />}
                <span className={`font-black text-sm ${parsed.ok ? 'text-emerald-700 dark:text-emerald-400' : 'text-amber-700 dark:text-amber-400'}`}>
                  {parsed.ok ? 'تم الاستخراج' : 'استخراج جزئي'}
                </span>
              </div>
              <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 text-xs">
                <div><span style={{ color: 'var(--text-muted)' }}>المبلغ:</span> <strong>{parsed.amount ? fmt(parsed.amount) + ' ج.م' : '—'}</strong></div>
                <div><span style={{ color: 'var(--text-muted)' }}>النوع:</span> <strong>{parsed.type === 'income' ? 'دخل 💰' : 'مصروف 💸'}</strong></div>
                <div><span style={{ color: 'var(--text-muted)' }}>البنك:</span> <strong>{parsed.bank || '—'}</strong></div>
                <div><span style={{ color: 'var(--text-muted)' }}>البطاقة:</span> <strong>{parsed.cardLabel || (parsed.last4 ? '••••' + parsed.last4 : '—')}</strong></div>
              </div>
            </div>
            <FormField label="المبلغ (راجعه)" inputMode="decimal" value={manualAmount} onChange={e => setManualAmount(e.target.value)} placeholder="0.00" required />
            <div className="grid grid-cols-2 gap-2">
              <FormField label="الفئة" as="select" value={category} onChange={e => setCategory(e.target.value)} required
                options={[{value:'',label:'اختر...'}, ...Object.entries(CATEGORY_GROUPS[parsed.type]).flatMap(([g, items]) => 
                  items.map(c => ({ value: c, label: `[${g}] ${c}` }))
                )]}
              />
              <FormField label="طريقة الدفع" as="select" value={method} onChange={e => setMethod(e.target.value)}
                options={PAYMENT_METHODS.map(m => ({ value: m.id, label: m.label }))} />
            </div>
            <button type="button" onClick={handleSave} disabled={!manualAmount || !category} className="btn btn-primary w-full py-2.5 text-sm">
              <Save size={14} /> حفظ كمعلق
            </button>
          </div>
        )}
      </div>
    </ModalShell>
  );
});

});

   PART 4 — Views (Dashboard + Transactions + Categories + Loans

/* ─── Pending Close Modal ─── */
const PendingCloseModal = memo(({ data, onClose, onAction }) => {
  const pending = data.pending || [];
  const totalIncome = pending.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
  const totalExpense = pending.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
  
  return (
    <ModalShell isOpen={true} onClose={onClose} title="عمليات معلقة قبل الإقفال" icon="⚠️" size="lg">
      <div className="p-3 rounded-lg bg-amber-50 dark:bg-amber-950/30 mb-4">
        <p className="text-xs font-bold text-amber-700 dark:text-amber-400 mb-2">
          يوجد <strong>{pending.length}</strong> عملية معلقة في شهر {data.month} {data.year}
        </p>
        <div className="flex gap-3 text-[11px] font-bold">
          {totalIncome > 0 && <span className="text-emerald-700 dark:text-emerald-400">دخل: +{fmt(totalIncome)}</span>}
          {totalExpense > 0 && <span className="text-red-700 dark:text-red-400">مصروف: −{fmt(totalExpense)}</span>}
        </div>
        <p className="text-[11px] mt-2" style={{ color: 'var(--text-secondary)' }}>
          العمليات المعلقة لا تؤثر على الرصيد الحي.
        </p>
      </div>
      <div className="max-h-56 overflow-y-auto space-y-1.5 mb-3">
        {pending.map(t => (
          <div key={t.id} className="flex justify-between items-center p-2 rounded-lg text-xs" style={{ background: 'var(--bg-muted)' }}>
            <div className="flex items-center gap-2 min-w-0 flex-1">
              <span className={`p-1 rounded text-[10px] font-black ${t.type === 'income' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-400' : 'bg-red-100 text-red-700 dark:bg-red-950/50 dark:text-red-400'}`}>
                {t.type === 'income' ? 'دخل' : 'مصروف'}
              </span>
              <div className="min-w-0">
                <p className="font-bold truncate">{t.description || t.category}</p>
                <p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>{t.date}</p>
              </div>
            </div>
            <span className={`font-black flex-shrink-0 ${t.type === 'income' ? 'text-emerald-600' : 'text-red-600'}`}>
              {t.type === 'income' ? '+' : '−'}{fmt(t.amount)}
            </span>
          </div>
        ))}
      </div>
      <div className="flex flex-col gap-2">
        <button onClick={() => onAction('approve')} className="w-full py-3 rounded-lg bg-emerald-500 text-white font-bold text-sm flex items-center justify-center gap-2 hover:bg-emerald-600">
          <CheckCircle2 size={16} /> اعتماد الكل ثم إقفال ({pending.length})
        </button>
        <button onClick={() => onAction('carry')} className="w-full py-3 rounded-lg bg-blue-500 text-white font-bold text-sm flex items-center justify-center gap-2 hover:bg-blue-600">
          <Calendar size={16} /> ترحيل للشهر التالي ثم إقفال
        </button>
        <button onClick={() => onAction('delete')} className="w-full py-3 rounded-lg bg-red-500 text-white font-bold text-sm flex items-center justify-center gap-2 hover:bg-red-600">
          <Trash2 size={16} /> حذف الكل ثم إقفال
        </button>
      </div>
    </ModalShell>
  );
});

/* ─── Ledger Component ─── */
const LedgerComponent = memo(({ walletKey, ledgerData, liveBalance, isExpanded, onToggle, theme, onAddDeposit, onAddWithdrawal, walletVisibility, onToggleVisibility }) => {
  const [filter, setFilter] = useState('all');
  const [dateFilter, setDateFilter] = useState('');
  
  const validatedLedger = useMemo(() => {
    try { 
      return (ledgerData || []).map(item => ({ 
        ...item, amount: safeNumber(item.amount), 
        date: item.date || '—', description: item.description || 'بدون وصف', 
        subType: item.subType || (item.type === 'income' ? 'deposit' : 'withdrawal') 
      })).filter(item => item.amount > 0); 
    } catch { return []; }
  }, [ledgerData]);
  
  const filteredLedger = useMemo(() => validatedLedger.filter(i => { 
    if (filter === 'deposit' && i.subType !== 'deposit') return false; 
    if (filter === 'withdrawal' && i.subType !== 'withdrawal') return false; 
    if (dateFilter && !(i.date||'').includes(dateFilter)) return false; 
    return true; 
  }), [validatedLedger, filter, dateFilter]);
  
  const stats = useMemo(() => ({ 
    deposits: validatedLedger.filter(t => t.subType === 'deposit').reduce((s, t) => s + t.amount, 0), 
    withdrawals: validatedLedger.filter(t => t.subType === 'withdrawal').reduce((s, t) => s + t.amount, 0), 
    currentBalance: safeNumber(liveBalance) 
  }), [validatedLedger, liveBalance]);
  
  const mask = (v) => !walletVisibility?.[walletKey] ? '•••••' : fmt(v);
  const IconComponent = theme.icon;
  const stop = (e, action) => { e.stopPropagation(); e.preventDefault(); if (action) action(); };
  
  return (
    <div className="card mb-3">
      <div className="flex justify-between items-center cursor-pointer -m-4 p-4" onClick={onToggle}>
        <div className="flex items-center gap-3 min-w-0 flex-1">
          <div className="p-2.5 rounded-lg flex items-center justify-center flex-shrink-0" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>
            <IconComponent size={20} />
          </div>
          <div className="min-w-0">
            <h3 className="font-bold text-sm truncate">{theme.title}</h3>
            <p className="text-[11px] mt-0.5 truncate" style={{ color: 'var(--text-muted)' }}>{theme.subtitle}</p>
          </div>
        </div>
        <div className="flex items-center gap-1 flex-shrink-0">
          <button type="button" aria-label="إيداع" onClick={(e) => stop(e, () => onAddDeposit?.(walletKey))} 
            className="p-2 bg-emerald-500 text-white rounded-lg hover:bg-emerald-600">
            <ArrowDownCircle size={14} />
          </button>
          <button type="button" aria-label="سحب" onClick={(e) => stop(e, () => onAddWithdrawal?.(walletKey))} 
            className="p-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
            <ArrowUpCircle size={14} />
          </button>
          <button type="button" aria-label="إظهار" onClick={(e) => stop(e, () => onToggleVisibility?.(walletKey))} 
            className="p-2 rounded-lg" style={{ color: 'var(--text-muted)' }}>
            {walletVisibility?.[walletKey] ? <EyeOff size={14} /> : <Eye size={14} />}
          </button>
          <ChevronDown size={18} className={`transition-transform ${isExpanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
        </div>
      </div>
      {isExpanded && (
        <div className="mt-4 pt-4 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
          {validatedLedger.length === 0 ? (
            <div className="p-6 text-center">
              <p className="font-medium mb-3 text-sm" style={{ color: 'var(--text-secondary)' }}>لا توجد عمليات بعد آخر تحديث</p>
              <button type="button" onClick={(e) => stop(e, () => onAddDeposit?.(walletKey))} className="btn btn-primary text-sm">
                <Plus size={16} /> إضافة أول عملية
              </button>
            </div>
          ) : (
            <React.Fragment>
              <div className="grid grid-cols-3 gap-2 mb-3">
                <div className="text-center p-2.5 bg-emerald-50 dark:bg-emerald-950/30 rounded-lg">
                  <div className="text-[10px] text-emerald-700 dark:text-emerald-400 font-bold mb-1">إيداع</div>
                  <div className="text-sm font-black text-emerald-600">{mask(stats.deposits)}</div>
                </div>
                <div className="text-center p-2.5 bg-red-50 dark:bg-red-950/30 rounded-lg">
                  <div className="text-[10px] text-red-700 dark:text-red-400 font-bold mb-1">سحب</div>
                  <div className="text-sm font-black text-red-600">{mask(stats.withdrawals)}</div>
                </div>
                <div className="text-center p-2.5 bg-blue-50 dark:bg-blue-950/30 rounded-lg">
                  <div className="text-[10px] text-blue-700 dark:text-blue-400 font-bold mb-1">الرصيد</div>
                  <div className="text-sm font-black text-blue-600">{mask(stats.currentBalance)}</div>
                </div>
              </div>
              <div className="flex gap-2 mb-3 flex-wrap">
                <select className="input-field text-xs py-2 flex-1 min-w-[100px]" value={filter} onChange={(e) => setFilter(e.target.value)}>
                  <option value="all">الكل</option>
                  <option value="deposit">إيداعات</option>
                  <option value="withdrawal">سحوبات</option>
                </select>
                <input type="month" className="input-field text-xs py-2 flex-1 min-w-[120px]" value={dateFilter} onChange={(e) => setDateFilter(e.target.value)} />
              </div>
              <div className="overflow-x-auto -mx-4">
                <table className="w-full text-right text-sm">
                  <thead>
                    <tr style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                      <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>التاريخ</th>
                      <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الوصف</th>
                      <th className="p-2.5 text-[10px] font-bold text-left" style={{ color: 'var(--text-muted)' }}>المبلغ</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredLedger.map((t) => (
                      <tr key={t.id}>
                        <td className="p-2.5 text-[11px] whitespace-nowrap" style={{ color: 'var(--text-muted)' }}>{t.date}</td>
                        <td className="p-2.5 font-bold text-xs">{t.description} <FamilyBadge tx={t} /></td>
                        <td className={`p-2.5 text-left font-black text-xs ${t.subType === 'deposit' ? 'text-emerald-600' : 'text-red-500'}`}>
                          {t.subType === 'deposit' ? '+' : '-'}{mask(t.amount)}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
});

/* ─── Dashboard View ─── */
const DashboardView = memo(({ 
  data, financeSnapshot, liveBalances, totalLiquidity, walletVisibility, 
  onToggleVisibility, dispatch, selectedYear, selectedMonth, transactions, 
  cards, updatedLoans, chartData, isDarkMode, onSelectYear, onSelectMonth 
}) => {
  const totalCardDebt = useMemo(() => cards.reduce((s, c) => s + Math.max(0, computeCardDebt(data, c)), 0), [cards, data]);
  const totalLoanDebt = useMemo(() => updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const grandTotalDebt = totalCardDebt + totalLoanDebt;
  const netPosition = totalLiquidity - grandTotalDebt;
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);
  
  const bankFeesMonth = useMemo(() => transactions.filter(t => 
    t.status === 'paid' && t.type === 'expense' && BANK_FEE_CATEGORIES.has(t.category) 
    && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).reduce((s, t) => s + safeNumber(t.amount), 0), [transactions, selectedMonth, selectedYear]);
  
  const monthCashback = useMemo(() => {
    const trackers = (data?.cashbackTrackers || []).filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
    return { 
      received: trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0) 
    };
  }, [data?.cashbackTrackers, selectedMonth, selectedYear]);
  
  const pieData = useMemo(() => {
    const acc = {};
    transactions.filter(t => 
      t.type === 'expense' && t.month === selectedMonth && (t.year || 2026) === selectedYear 
      && t.status === 'paid' && safeNumber(t.amount) > 0
    ).forEach(t => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); });
    const sorted = Object.entries(acc).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
    if (sorted.length <= 5) return sorted;
    return [...sorted.slice(0, 4), { name: 'أخرى', value: sorted.slice(4).reduce((s, i) => s + i.value, 0) }];
  }, [transactions, selectedMonth, selectedYear]);
  
  const net = financeSnapshot;
  const monthPendingCount = transactions.filter(t => 
    t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status !== 'paid'
  ).length;

  return (
    <div className="space-y-4 animate-fadeIn">
      {/* Main Balance Card */}
      <div className="card" style={{ background: 'linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%)', border: 'none' }}>
        <div className="flex items-center justify-between gap-4 flex-wrap">
          <div>
            <p className="text-[11px] font-bold mb-1 text-white/70">صافي المركز المالي</p>
            <h2 className="text-3xl font-black tracking-tight text-white">
              {netPosition >= 0 ? '+' : ''}{fmt(netPosition)}
              <span className="text-sm font-bold mr-2 text-white/70">ج.م</span>
            </h2>
            <p className="text-[11px] font-bold mt-1.5 text-white/80">
              {netPosition >= 0 ? '✅ وضع مالي آمن' : '⚠️ مراجعة مطلوبة'}
            </p>
          </div>
          <div className="flex gap-2">
            <div className="p-2.5 rounded-lg bg-white/10 backdrop-blur text-center min-w-[80px]">
              <p className="text-[10px] font-bold text-white/70">سيولة</p>
              <p className="text-sm font-black text-white">{fmt(totalLiquidity)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-white/10 backdrop-blur text-center min-w-[80px]">
              <p className="text-[10px] font-bold text-white/70">مديونية</p>
              <p className="text-sm font-black text-white">{fmt(grandTotalDebt)}</p>
            </div>
          </div>
        </div>
      </div>
      
      {monthPendingCount > 0 && (
        <div className="card" style={{ background: 'var(--warning-soft)', borderColor: 'var(--warning)' }}>
          <div className="flex items-center gap-2">
            <Clock size={16} className="text-amber-600 flex-shrink-0" />
            <div className="flex-1">
              <p className="text-xs font-bold text-amber-700 dark:text-amber-400">{monthPendingCount} عملية معلقة في {selectedMonth}</p>
            </div>
            <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'transactions' })} className="btn btn-secondary text-[10px] py-1.5 px-2.5">عرض</button>
          </div>
        </div>
      )}
      
      {/* Quick Actions */}
      <div className="grid grid-cols-3 gap-2">
        <button onClick={() => { 
          dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); 
          dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', amount: '', date: getLocalISODate(), method: 'cash', subType: 'withdrawal', category: '', status: 'pending' } }); 
          dispatch({ type: 'SET_FORM_OPEN', payload: true }); 
        }} className="card py-3 flex flex-col items-center gap-1 active:scale-95">
          <div className="p-1.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-red-600 dark:text-red-400"><TrendingDown size={16} /></div>
          <span className="text-[11px] font-bold">مصروف</span>
        </button>
        <button onClick={() => { 
          dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); 
          dispatch({ type: 'SET_FORM_DATA', payload: { type: 'income', amount: '', date: getLocalISODate(), method: 'cib_savings', subType: 'deposit', category: '', status: 'pending' } }); 
          dispatch({ type: 'SET_FORM_OPEN', payload: true }); 
        }} className="card py-3 flex flex-col items-center gap-1 active:scale-95">
          <div className="p-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400"><TrendingUp size={16} /></div>
          <span className="text-[11px] font-bold">دخل</span>
        </button>
        <button onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: true })} className="card py-3 flex flex-col items-center gap-1 active:scale-95">
          <div className="p-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400"><Layers size={16} /></div>
          <span className="text-[11px] font-bold">تحويل</span>
        </button>
      </div>
      
      {/* Quick Stats */}
      <div className="grid grid-cols-3 gap-2">
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'loans' })} className="card py-2.5 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1">
            <Briefcase size={11} className="text-blue-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>عهدة</span>
          </div>
          <p className={`text-sm font-black ${custodySummary.balance > 0 ? 'text-blue-600' : custodySummary.balance < 0 ? 'text-red-600' : 'text-emerald-600'}`}>
            {fmt(custodySummary.balance)}
          </p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'cards' })} className="card py-2.5 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1">
            <Gift size={11} className="text-emerald-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>كاش باك</span>
          </div>
          <p className="text-sm font-black text-emerald-600">{fmt(monthCashback.received)}</p>
        </button>
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'transactions' })} className="card py-2.5 text-center active:scale-95">
          <div className="flex items-center justify-center gap-1 mb-1">
            <Receipt size={11} className="text-red-500" />
            <span className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>رسوم</span>
          </div>
          <p className="text-sm font-black text-red-600">{fmt(bankFeesMonth)}</p>
        </button>
      </div>
      
      <BalanceOverview balances={liveBalances} walletVisibility={walletVisibility} onToggleVisibility={onToggleVisibility} />
      
      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />
      
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <StatCard title="الكاش في الجيب" amount={net.actualCashInHand} icon={Wallet} subtitle="حسب آخر تحديث" isPrivate={!walletVisibility.cash} color="success" />
        <StatCard title="دخل محصل" amount={net.actualIncome} icon={TrendingUp} subtitle={net.pendingIncome > 0 ? `+${fmt(net.pendingIncome)} معلق` : ''} color="success" />
        <StatCard title="مصاريف معلقة" amount={-net.pendingExpensesAll} icon={Clock} subtitle={`مدفوع: ${fmt(net.paidExpensesAll)}`} color="danger" />
        <button onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'financial-forecast' })} className="stat-card text-right active:scale-95">
          <div className="flex justify-between items-start mb-2">
            <div>
              <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>توقع القادم</p>
              <h3 className={`text-lg font-black ${net.projectedClosingBalance >= 0 ? 'text-blue-600' : 'text-red-600'}`}>
                {fmt(net.projectedClosingBalance)}
              </h3>
              <p className="text-[10px] mt-1" style={{ color: 'var(--text-muted)' }}>شامل المعلقات</p>
            </div>
            <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400"><Activity size={16} /></div>
          </div>
        </button>
      </div>
      
      {/* Charts */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
        <div className="card">
          <h3 className="font-bold text-xs mb-3 flex items-center gap-2">
            <BarChart3 className="text-blue-600" size={14} /> التدفق النقدي — {selectedYear}
          </h3>
          <div className="h-48">
            {chartData.every(d => d.دخل === 0 && d.مصروف === 0) ? (
              <div className="h-full flex items-center justify-center font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد بيانات</div>
            ) : (
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={chartData}>
                  <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.08} />
                  <XAxis dataKey="name" fontSize={9} stroke="#94A3B8" />
                  <YAxis fontSize={9} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
                  <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '8px', border: 'none', backgroundColor: isDarkMode ? '#1A2332' : 'white', fontFamily: 'Cairo', fontSize: '12px' }} />
                  <Bar dataKey="دخل" fill="#047857" radius={[4, 4, 0, 0]} barSize={10} />
                  <Bar dataKey="مصروف" fill="#B91C1C" radius={[4, 4, 0, 0]} barSize={10} />
                </BarChart>
              </ResponsiveContainer>
            )}
          </div>
        </div>
        <div className="card">
          <h3 className="font-bold text-xs mb-3 flex items-center gap-2">
            <PieChartIcon className="text-purple-500" size={14} /> توزيع مصروفات {selectedMonth}
          </h3>
          <div className="h-48">
            {pieData.length === 0 ? (
              <div className="h-full flex items-center justify-center font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد مصروفات</div>
            ) : (
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={pieData} cx="50%" cy="50%" innerRadius={50} outerRadius={80} paddingAngle={3} dataKey="value" cornerRadius={4}>
                    {pieData.map((e, i) => <Cell key={i} fill={CATEGORY_COLORS[e.name] || '#94A3B8'} stroke="none" />)}
                  </Pie>
                  <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '8px', border: 'none', backgroundColor: isDarkMode ? '#1A2332' : 'white', fontFamily: 'Cairo', fontSize: '12px' }} />
                  <Legend layout="vertical" verticalAlign="middle" align="right" iconType="circle" wrapperStyle={{ fontSize: '10px', fontWeight: 'bold' }} />
                </PieChart>
              </ResponsiveContainer>
            )}
          </div>
        </div>
      </div>
    </div>
  );
});

/* ─── Statement Modal (موحّد للفئات والبطاقات) ─── */
const StatementModal = memo(({ mode, entity, transactions, selectedMonth, selectedYear, data, dispatch, addNotification, onClose }) => {
  const [filterType, setFilterType] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');
  const [exporting, setExporting] = useState(false);
  const containerRef = useRef(null);
  
  const isCard = mode === 'card';
  const cardMethod = isCard ? getCardMethod(entity) : null;
  const subCards = isCard && Array.isArray(entity.subCardLast4) ? entity.subCardLast4 : [];
  
  const filteredTx = useMemo(() => {
    if (isCard) {
      const cutoffISO = entity.openingDate || CUTOFF_DATE_2026_09_30;
      const cutoffDay = dayStart(parseISODate(cutoffISO) || new Date(0));
      return (transactions || []).filter(t => {
        if (t.status !== 'paid' || t.source === 'carryover') return false;
        const d = parseISODate(t.date);
        if (!d || d < cutoffDay) return false;
        const hasExplicitCardLink = (t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== '');
        if (hasExplicitCardLink) return t.linkedCardId === entity.id;
        if (t.cardLast4 && subCards.includes(t.cardLast4)) return true;
        return t.method === cardMethod;
      }).sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
    }
    return transactions.filter(t => 
      t.category === entity && t.month === selectedMonth && (t.year || 2026) === selectedYear
    ).sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
  }, [transactions, entity, cardMethod, subCards, isCard, selectedMonth, selectedYear]);
  
  const displayTx = useMemo(() => {
    let arr = filteredTx;
    if (filterType === 'paid') arr = arr.filter(t => t.status === 'paid');
    if (filterType === 'pending') arr = arr.filter(t => t.status !== 'paid');
    if (filterType === 'expense') arr = arr.filter(t => t.type === 'expense');
    if (filterType === 'income') arr = arr.filter(t => t.type === 'income');
    if (searchTerm.trim()) { 
      const term = normalizeText(searchTerm); 
      arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.category).includes(term)); 
    }
    return arr;
  }, [filteredTx, filterType, searchTerm]);
  
  const stats = useMemo(() => {
    const expenses = filteredTx.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
    const incomes = filteredTx.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paid = filteredTx.filter(t => t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pending = filteredTx.filter(t => t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const count = filteredTx.length;
    const average = count > 0 ? (expenses + incomes) / count : 0;
    const methods = {};
    filteredTx.forEach(t => { methods[t.method] = (methods[t.method] || 0) + safeNumber(t.amount); });
    return { expenses, incomes, total: expenses - incomes, paid, pending, count, average, methods };
  }, [filteredTx]);
  
  const dailyGroups = useMemo(() => groupTransactionsByDate(displayTx), [displayTx]);
  
  const liveDebt = isCard ? computeCardDebt(data, entity) : 0;
  const liveAvailable = isCard ? Math.max(0, safeNumber(entity.limit) - Math.max(0, liveDebt)) : 0;
  const usagePct = isCard && safeNumber(entity.limit) > 0 ? (Math.max(0, liveDebt) / safeNumber(entity.limit)) * 100 : 0;
  const isCredit = liveDebt < 0;

  const handlePrint = () => {
    if (!containerRef.current) return;
    const w = window.open('', '_blank', 'width=900,height=700');
    if (!w) { addNotification({ type: 'error', title: 'المتصفح منع الطباعة' }); return; }
    
    const title = isCard ? `${entity.bank} - ${entity.name}` : entity;
    const subtitle = isCard ? `•••• ${entity.last4}` : `${selectedMonth} ${selectedYear}`;
