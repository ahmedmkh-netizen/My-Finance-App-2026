/* ═══════════════════════════════════════════════════════════════════
   10) TRANSACTION FORM (Add/Edit)
   ═══════════════════════════════════════════════════════════════════ */
const TransactionForm = memo(function TransactionForm({
  isOpen, formMode, formData, dispatch, saveHistory, addNotification,
  transactions, data, cards, liveBalances, onClose,
}) {
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [showAllHany, setShowAllHany] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [errors, setErrors] = useState({});

  const isHanyShopCat = isHanyShopCategory(formData.category);

  useEffect(() => {
    if (!isOpen) {
      setShowAdvanced(false);
      setShowAllHany(false);
      setErrors({});
    }
  }, [isOpen]);

  const handleSubmit = (e) => {
    if (e) e.preventDefault();
    if (submitting) return;
    setSubmitting(true);
    const newErrors = {};

    const amountCheck = validateAmount(formData.amount, { min: 0.01, max: 10000000, label: "المبلغ" });
    if (!amountCheck.valid) newErrors.amount = amountCheck.error;
    if (!formData.category) newErrors.category = "اختر الفئة";
    if (!formData.date) newErrors.date = "اختر التاريخ";

    if (Object.keys(newErrors).length > 0) {
      setErrors(newErrors);
      addNotification({ type: "error", title: "خطأ", message: Object.values(newErrors)[0] });
      setSubmitting(false);
      return;
    }

    const amount = roundMoney(amountCheck.value);
    const d = parseISODate(formData.date);
    if (!d) {
      addNotification({ type: "error", title: "تاريخ غير صالح" });
      setSubmitting(false);
      return;
    }
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];

    if (isMonthClosed(data, txYear, txMonth)) {
      addNotification({ type: "error", title: "شهر مغلق", message: `${txMonth} ${txYear}` });
      setSubmitting(false);
      return;
    }

    saveHistory();
    const isHany = isHanyShopCategory(formData.category);
    const isHanySettle = isHanySettleCategory(formData.category);
    const finalSubType = formData.subType || (formData.type === "income" ? "deposit" : "withdrawal");

    let syncLinkedCardId = formData.linkedCardId;
    if (CREDIT_CARD_METHOD_IDS.includes(formData.method)) {
      const matchingCard = cards.find((c) => getCardMethod(c) === formData.method);
      if (matchingCard) syncLinkedCardId = matchingCard.id;
    } else {
      syncLinkedCardId = undefined;
    }

    const newTx = {
      id: formMode === "edit" ? formData.id : getSafeId(),
      type: formData.type,
      subType: finalSubType,
      kind: formData.kind || inferKind(formData),
      category: normalizeCategory(formData.category),
      amount,
      description: formData.description || "",
      method: formData.method || "cash",
      date: formData.date,
      month: txMonth,
      year: txYear,
      monthIndex: d.getMonth(),
      status: formData.status || "pending",
      linkedCardId: syncLinkedCardId,
      createdAt: formData.createdAt || new Date().toISOString(),
      ...(isHany ? { method: HANY_TAB_METHOD, affectsCash: false, hanyEffect: "purchase" } : {}),
      ...(isHanySettle ? { hanyEffect: "settle", affectsCash: true, kind: KIND.FINANCIAL } : {}),
    };

    const next = formMode === "add"
      ? sortTransactions([...transactions, newTx])
      : sortTransactions(transactions.map((t) => (t.id === newTx.id ? newTx : t)));

    dispatch({ type: "UPDATE_TRANSACTIONS", payload: next });
    addNotification({
      type: "success",
      title: formData.status === "paid" ? "تم الحفظ والاعتماد" : "تم الحفظ كمعلق",
    });
    setSubmitting(false);
    onClose();
  };

  const appendQuickItem = (item) => {
    const current = formData.description || "";
    const sep = current && !current.endsWith(" ") && !current.endsWith(",") ? " + " : "";
    dispatch({ type: "SET_FORM_DATA", payload: { ...formData, description: current + sep + item } });
  };

  return (
    <Modal isOpen={isOpen} onClose={onClose} title={formMode === "add" ? "إضافة عملية" : "تعديل عملية"} size="lg" hideHeader={false}>
      <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        {/* Type + Category */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1.5fr", gap: 10 }}>
          <div>
            <label style={{ fontSize: 11, fontWeight: 900, color: "var(--text-muted)", display: "block", marginBottom: 6 }}>
              النوع
            </label>
            <select
              className="input-field"
              style={{ fontSize: 13, padding: "10px 14px", fontWeight: 800 }}
              value={formData.type}
              onChange={(e) => {
                const t = e.target.value;
                dispatch({
                  type: "SET_FORM_DATA",
                  payload: { ...formData, type: t, subType: t === "income" ? "deposit" : "withdrawal", category: "" },
                });
              }}
            >
              <option value="expense">مصروف 💸</option>
              <option value="income">دخل 💰</option>
            </select>
          </div>
          <div>
            <label style={{ fontSize: 11, fontWeight: 900, color: "var(--text-muted)", display: "block", marginBottom: 6 }}>
              الفئة *
            </label>
            <CategoryPicker
              value={formData.category}
              onChange={(cat) => dispatch({ type: "SET_FORM_DATA", payload: { ...formData, category: cat } })}
              type={formData.type}
            />
          </div>
        </div>

        {/* Amount */}
        <div>
          <label style={{ fontSize: 11, fontWeight: 900, color: "var(--text-muted)", display: "block", marginBottom: 8 }}>
            المبلغ *
          </label>
          <AmountInput
            value={formData.amount || ""}
            onChange={(v) => dispatch({ type: "SET_FORM_DATA", payload: { ...formData, amount: v } })}
            error={!!errors.amount}
          />
        </div>

        {/* Method + Date */}
        <div style={{ display: "grid", gridTemplateColumns: "1.5fr 1fr", gap: 10 }}>
          <div>
            <label style={{ fontSize: 11, fontWeight: 900, color: "var(--text-muted)", display: "block", marginBottom: 6 }}>
              طريقة الدفع
            </label>
            <select
              className="input-field"
              style={{ fontSize: 12, padding: "10px 14px", fontWeight: 700 }}
              value={formData.method || "cash"}
              onChange={(e) => dispatch({ type: "SET_FORM_DATA", payload: { ...formData, method: e.target.value } })}
            >
              {PAYMENT_METHODS.map((m) => (
                <option key={m.id} value={m.id}>{m.label}</option>
              ))}
            </select>
          </div>
          <div>
            <label style={{ fontSize: 11, fontWeight: 900, color: "var(--text-muted)", display: "block", marginBottom: 6 }}>
              التاريخ *
            </label>
            <SafeDateInput
              className="input-field"
              style={{ fontSize: 12, padding: "10px 12px", fontWeight: 800 }}
              value={formData.date || getLocalISODate()}
              onChange={(v) => dispatch({ type: "SET_FORM_DATA", payload: { ...formData, date: v } })}
            />
          </div>
        </div>

        {/* Status */}
        <div>
          <label style={{ fontSize: 11, fontWeight: 900, color: "var(--text-muted)", display: "block", marginBottom: 6 }}>
            الحالة
          </label>
          <SegmentedControl
            value={formData.status || "pending"}
            onChange={(v) => dispatch({ type: "SET_FORM_DATA", payload: { ...formData, status: v } })}
            options={[
              { value: "pending", label: "معلق", icon: Clock },
              { value: "paid", label: "معتمد", icon: CheckCircle2 },
            ]}
          />
        </div>

        {/* Description */}
        <div>
          <label style={{ fontSize: 11, fontWeight: 900, color: "var(--text-muted)", display: "block", marginBottom: 6 }}>
            الوصف
          </label>
          <input
            type="text"
            className="input-field"
            style={{ fontSize: 13, padding: "10px 14px", fontWeight: 700 }}
            value={formData.description || ""}
            onChange={(e) => dispatch({ type: "SET_FORM_DATA", payload: { ...formData, description: e.target.value } })}
            placeholder="تفاصيل..."
          />
        </div>

        {/* Hany quick items */}
        {isHanyShopCat && (
          <div style={{
            padding: 12, borderRadius: 14,
            background: "var(--warning-soft)",
            border: "1px dashed var(--warning)",
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <p style={{ fontSize: 10, fontWeight: 900, color: "var(--warning)", margin: 0 }}>
                ⚡ أصناف سريعة
              </p>
              <button
                type="button"
                onClick={() => setShowAllHany(true)}
                style={{
                  fontSize: 9, fontWeight: 900, padding: "3px 8px",
                  borderRadius: 999, background: "var(--warning)",
                  color: "white", border: "none", cursor: "pointer",
                  fontFamily: "inherit",
                }}
              >
                عرض الكل ({HANY_QUICK_ITEMS.length})
              </button>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
              {HANY_QUICK_ITEMS.slice(0, 12).map((item) => (
                <button
                  key={item}
                  type="button"
                  onClick={() => appendQuickItem(item)}
                  className="chip"
                  style={{ fontSize: 10, padding: "4px 8px" }}
                >
                  {item}
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Advanced toggle */}
        <button
          type="button"
          onClick={() => setShowAdvanced(!showAdvanced)}
          style={{
            fontSize: 11, fontWeight: 800, color: "var(--text-muted)",
            background: "none", border: "none", cursor: "pointer",
            fontFamily: "inherit", padding: 4,
            display: "flex", alignItems: "center", gap: 6, justifyContent: "center",
          }}
        >
          <ChevronDown size={12} style={{ transform: showAdvanced ? "rotate(180deg)" : "none", transition: "transform 0.2s ease" }} />
          تفاصيل متقدمة
        </button>

        {showAdvanced && (
          <div className="animate-slideDown" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <div>
              <label style={{ fontSize: 11, fontWeight: 900, color: "var(--text-muted)", display: "block", marginBottom: 6 }}>
                الكمية
              </label>
              <input
                type="number"
                min="1"
                className="input-field input-num"
                style={{ fontSize: 13, padding: "10px 14px", textAlign: "center" }}
                value={formData.quantity || ""}
                onChange={(e) => dispatch({ type: "SET_FORM_DATA", payload: { ...formData, quantity: e.target.value } })}
                placeholder="العدد"
              />
            </div>
            <div>
              <label style={{ fontSize: 11, fontWeight: 900, color: "var(--text-muted)", display: "block", marginBottom: 6 }}>
                سعر الوحدة
              </label>
              <input
                type="text"
                inputMode="decimal"
                className="input-field input-num"
                style={{ fontSize: 13, padding: "10px 14px", textAlign: "center" }}
                value={formData.unitPrice || ""}
                onChange={(e) => dispatch({ type: "SET_FORM_DATA", payload: { ...formData, unitPrice: e.target.value } })}
                placeholder="السعر"
              />
            </div>
          </div>
        )}

        {/* Actions */}
        <div style={{ display: "flex", gap: 8, paddingTop: 4 }}>
          <button type="button" onClick={onClose} className="btn btn-secondary" style={{ flex: 1, fontSize: 13, padding: 12 }}>
            إلغاء
          </button>
          <button
            type="submit"
            disabled={submitting}
            className="btn btn-primary"
            style={{ flex: 2, fontSize: 13, padding: 12, fontWeight: 900 }}
          >
            {submitting ? (
              <>
                <div className="spinner" style={{ width: 14, height: 14, borderWidth: 2 }} />
                جاري الحفظ...
              </>
            ) : (
              <>
                <Save size={14} />
                {formData.status === "paid" ? "حفظ واعتماد" : "حفظ كمعلق"}
              </>
            )}
          </button>
        </div>
      </form>

      {showAllHany && (
        <Modal isOpen={true} onClose={() => setShowAllHany(false)} title={`كل أصناف محل هاني (${HANY_QUICK_ITEMS.length})`} icon="🛒">
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, maxHeight: 400, overflowY: "auto" }}>
            {HANY_QUICK_ITEMS.map((item) => (
              <button
                key={item}
                type="button"
                onClick={() => { appendQuickItem(item); setShowAllHany(false); }}
                className="chip"
              >
                {item}
              </button>
            ))}
          </div>
        </Modal>
      )}
    </Modal>
  );
});

/* ═══════════════════════════════════════════════════════════════════
   11) PIN CHANGE MODAL
   ═══════════════════════════════════════════════════════════════════ */
const PinChangeModal = memo(({ onClose, addNotification }) => {
  const [current, setCurrent] = useState("");
  const [next, setNext] = useState("");
  const [confirm, setConfirm] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    if (!/^\d{4}$/.test(next)) {
      addNotification({ type: "error", title: "الرمز الجديد لازم 4 أرقام" });
      return;
    }
    if (next !== confirm) {
      addNotification({ type: "error", title: "الرمز غير متطابق" });
      return;
    }
    setBusy(true);
    try {
      const ok = await verifyPin(current);
      if (!ok) {
        addNotification({ type: "error", title: "الرمز الحالي غير صحيح" });
        setBusy(false);
        return;
      }
      await savePinHash(next);
      try { await savePinSession(next); } catch (e) {}
      addNotification({ type: "success", title: "تم تغيير الرمز بنجاح" });
      setBusy(false);
      onClose();
    } catch (e) {
      addNotification({ type: "error", title: "فشل", message: e.message });
      setBusy(false);
    }
  };

  return (
    <Modal isOpen={true} onClose={onClose} title="تغيير رمز الدخول" icon="🔐" size="sm">
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {[
          { label: "الرمز الحالي", value: current, setValue: setCurrent },
          { label: "الرمز الجديد", value: next, setValue: setNext },
          { label: "تأكيد الرمز الجديد", value: confirm, setValue: setConfirm },
        ].map((field, i) => (
          <div key={i}>
            <label style={{ fontSize: 11, fontWeight: 900, color: "var(--text-muted)", display: "block", marginBottom: 6 }}>
              {field.label}
            </label>
            <input
              type="password"
              inputMode="numeric"
              maxLength={4}
              className="input-field input-num"
              style={{ fontSize: 20, padding: "12px 14px", textAlign: "center", letterSpacing: 8, fontWeight: 900 }}
              value={field.value}
              onChange={(e) => field.setValue(e.target.value.replace(/\D/g, ""))}
            />
          </div>
        ))}
        <button onClick={submit} disabled={busy} className="btn btn-primary" style={{ width: "100%", fontSize: 13, padding: 12 }}>
          {busy ? "جاري الحفظ..." : "حفظ"}
        </button>
      </div>
    </Modal>
  );
});

/* ═══════════════════════════════════════════════════════════════════
   12) RECURRING MODAL
   ═══════════════════════════════════════════════════════════════════ */
const RecurringModal = memo(function RecurringModal({

const CategoryDetailModal = memo(function CategoryDetailModal({
  category, transactions, selectedMonth, selectedYear, onClose, addNotification,
}) {
  const [filterType, setFilterType] = useState("all");
  const [searchTerm, setSearchTerm] = useState("");

  const categoryTx = useMemo(
    () => transactions
      .filter(
        (t) =>
          t.category === category &&
          t.month === selectedMonth &&
          (t.year || 2026) === selectedYear,
      )
      .sort(compareTransactions),
    [transactions, category, selectedMonth, selectedYear],
  );

  const filteredTx = useMemo(() => {
    let arr = categoryTx;
    if (filterType === "paid") arr = arr.filter((t) => t.status === "paid");
    if (filterType === "pending") arr = arr.filter((t) => t.status !== "paid");
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(
        (t) =>
          normalizeText(t.description).includes(term) ||
          normalizeText(t.method).includes(term),
      );
    }
    return arr;
  }, [categoryTx, filterType, searchTerm]);

  const stats = useMemo(() => {
    const paid = categoryTx.filter((t) => t.status === "paid");
    const pending = categoryTx.filter((t) => t.status !== "paid");
    const totalPaid = paid.reduce((s, t) => s + safeNumber(t.amount), 0);
    const totalPending = pending.reduce((s, t) => s + safeNumber(t.amount), 0);
    return {
      totalPaid, totalPending, total: totalPaid + totalPending,
      count: categoryTx.length, paidCount: paid.length, pendingCount: pending.length,
      average: categoryTx.length > 0 ? (totalPaid + totalPending) / categoryTx.length : 0,
    };
  }, [categoryTx]);

  const dailyGroups = useMemo(() => {
    const map = new Map();
    filteredTx.forEach((t) => {
      const day = t.date || "unknown";
      if (!map.has(day)) map.set(day, { date: day, items: [], total: 0 });
      const g = map.get(day);
      g.items.push(t);
      g.total += safeNumber(t.amount);
    });
    return Array.from(map.values()).sort((a, b) => b.date.localeCompare(a.date));
  }, [filteredTx]);

  const color = getCategoryColor(category);
  const icon = getCategoryIcon(category);

  return (
    <Modal isOpen={true} onClose={onClose} title={category} icon={icon} size="xl">
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8 }}>
          <MiniStat label="معتمد" value={fmt(stats.totalPaid)} color="var(--positive)" />
          <MiniStat label="معلق" value={fmt(stats.totalPending)} color="var(--warning)" />
          <MiniStat label="العدد" value={stats.count} color="var(--brand)" />
          <MiniStat label="المتوسط" value={fmt(stats.average)} color="var(--brand)" />
        </div>

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <div style={{ position: "relative", flex: 1, minWidth: 180 }}>
            <Search size={14} style={{
              position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)",
              color: "var(--text-muted)",
            }} />
            <input
              type="text"
              placeholder="ابحث..."
              className="input-field"
              style={{ paddingRight: 36, fontSize: 12, padding: "10px 36px 10px 12px" }}
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
            />
          </div>
          <SegmentedControl
            value={filterType}
            onChange={setFilterType}
            fullWidth={false}
            options={[
              { value: "all", label: `الكل (${categoryTx.length})` },
              { value: "paid", label: `معتمد (${stats.paidCount})` },
              { value: "pending", label: `معلق (${stats.pendingCount})` },
            ]}
          />
        </div>

        {filteredTx.length === 0 ? (
          <EmptyState icon={Layers} title="لا توجد نتائج" size="sm" />
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10, maxHeight: 400, overflowY: "auto" }}>
            {dailyGroups.map((group) => (
              <div key={group.date}>
                <div className="day-header">
                  <div className="day-header-badge">
                    {formatArabicDate(group.date)}
                    <span style={{ fontSize: 10, opacity: 0.7, fontWeight: 700 }}>
                      ({group.items.length})
                    </span>
                  </div>
                  <div className="day-header-total money">{fmt(group.total)} ج.م</div>
                </div>
                {group.items.map((t) => (
                  <div key={t.id} style={{
                    display: "flex", justifyContent: "space-between",
                    alignItems: "center", gap: 10,
                    padding: 10, borderRadius: 12,
                    background: "var(--bg-card)", border: "1px solid var(--border)",
                    marginBottom: 6,
                  }}>
                    <div style={{ minWidth: 0, flex: 1 }}>
                      <p style={{
                        fontSize: 12, fontWeight: 800, margin: 0,
                        overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                      }}>
                        {getTxDisplay(t)}
                      </p>
                      <p style={{
                        fontSize: 10, fontWeight: 700, marginTop: 2, marginBottom: 0,
                        color: "var(--text-muted)",
                      }}>
                        {getPaymentMethodShort(t.method)}
                        {t.status === "paid" ? (
                          <span style={{ color: "var(--positive)", marginRight: 8 }}>✅ معتمد</span>
                        ) : (
                          <span style={{ color: "var(--warning)", marginRight: 8 }}>⏳ معلق</span>
                        )}
                      </p>
                    </div>
                    <span className="money" style={{
                      fontSize: 12, fontWeight: 900, flexShrink: 0,
                      color: t.type === "income" ? "var(--positive)" : "var(--negative)",
                    }}>
                      {t.type === "income" ? "+" : "−"}{fmt(t.amount)}
                    </span>
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}
      </div>
    </Modal>
  );
});

/* ═══════════════════════════════════════════════════════════════════
   1) GOOGLE DRIVE OPERATIONS
   ═══════════════════════════════════════════════════════════════════ */
const waitForGIS = (timeoutMs = 10000) =>
  new Promise((resolve, reject) => {
    if (window.google?.accounts?.oauth2) return resolve();
    const start = Date.now();
    const timer = setInterval(() => {
      if (window.google?.accounts?.oauth2) {
        clearInterval(timer);
        resolve();
      } else if (Date.now() - start > timeoutMs) {
        clearInterval(timer);
        reject(new Error("GIS غير محمّل"));
      }
    }, 150);
  });

const initDriveTokenClient = async () => {
  if (_driveTokenClient) return _driveTokenClient;
  await waitForGIS();
  _driveTokenClient = window.google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: () => {},
  });
  return _driveTokenClient;
};

const requestDriveToken = async () => {
  const client = await initDriveTokenClient();
  return new Promise((resolve, reject) => {
    client.callback = (resp) => {
      if (resp.error) return reject(new Error(resp.error));
      _driveAccessToken = resp.access_token;
      _driveTokenExpiry = Date.now() + safeNumber(resp.expires_in, 3600) * 1000 - 60000;
      resolve(_driveAccessToken);
    };
    client.requestAccessToken({ prompt: _driveAccessToken ? "" : "consent" });
  });
};

const ensureDriveToken = async () => {
  if (_driveAccessToken && Date.now() < _driveTokenExpiry) return _driveAccessToken;
  return requestDriveToken();
};

const getOrCreateBackupFolder = async () => {
  const token = await ensureDriveToken();
  const customFolderId = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;

  if (customFolderId) {
    try {
      const checkRes = await fetch(
        `https://www.googleapis.com/drive/v3/files/${customFolderId}?fields=id,name,mimeType,trashed`,
        { headers: { Authorization: `Bearer ${token}` } },
      );
      if (checkRes.ok) {
        const info = await checkRes.json();
        if (!info.trashed) return customFolderId;
      }
    } catch (e) {}
  }

  const q = encodeURIComponent(
    `mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false`,
  );
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive&pageSize=20`,
    { headers: { Authorization: `Bearer ${token}` } },
  );
  if (!res.ok) throw new Error("فشل قراءة المجلدات");
  const data = await res.json();

  if (data.files && data.files.length > 0) {
    const folderId = data.files[0].id;
    localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, folderId);
    return folderId;
  }

  const createRes = await fetch("https://www.googleapis.com/drive/v3/files", {
    method: "POST",
    headers: {
      Authorization: `Bearer ${token}`,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({
      name: DRIVE_FOLDER_NAME,
      mimeType: "application/vnd.google-apps.folder",
    }),
  });
  if (!createRes.ok) throw new Error("فشل إنشاء المجلد");
  const created = await createRes.json();
  localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, created.id);
  return created.id;
};

const uploadBackupToDrive = async (payload, fileName) => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const name = fileName || `finance_backup_v890_${getLocalISODate()}_${Date.now()}.json`;
  const metadata = { name, parents: [folderId], mimeType: "application/json" };
  const boundary = "----V890DriveBoundary" + Date.now();
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n--${boundary}--`;
  const res = await fetch(
    "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,createdTime",
    {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`,
        "Content-Type": `multipart/related; boundary=${boundary}`,
      },
      body,
    },
  );
  if (!res.ok) throw new Error("فشل الرفع");
  return await res.json();
};

const listDriveBackups = async () => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const q = encodeURIComponent(
    `'${folderId}' in parents and trashed=false and mimeType='application/json'`,
  );
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,size,createdTime)&orderBy=createdTime desc&pageSize=50`,
    { headers: { Authorization: `Bearer ${token}` } },
  );
  if (!res.ok) throw new Error("فشل الجلب");
  const data = await res.json();
  return data.files || [];
};

const downloadBackupFromDrive = async (fileId) => {
  const token = await ensureDriveToken();
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!res.ok) throw new Error("فشل التنزيل");
  return await res.json();
};

/* ═══════════════════════════════════════════════════════════════════
   2) ONLINE STATUS HOOK
   ═══════════════════════════════════════════════════════════════════ */
const useOnlineStatus = () => {
  const [online, setOnline] = useState(() =>
    typeof navigator !== "undefined" ? navigator.onLine : true,
  );
  useEffect(() => {
    const onOnline = () => setOnline(true);
    const onOffline = () => setOnline(false);
    window.addEventListener("online", onOnline);
    window.addEventListener("offline", onOffline);
    return () => {
      window.removeEventListener("online", onOnline);
      window.removeEventListener("offline", onOffline);
    };
  }, []);
  return online;
};

/* ═══════════════════════════════════════════════════════════════════
   3) SMS PARSER (المنطق الأساسي)
   ═══════════════════════════════════════════════════════════════════ */
const parseBankSms = (rawText) => {
  const text = String(rawText || "").trim();
  const result = {
    ok: false, amount: 0, type: "expense", subType: "withdrawal",
    date: getLocalISODate(), description: "", notes: [], rawText,
    bank: null, last4: null, merchant: "",
  };

  if (/OTP\s+\d+/i.test(text) || /Use OTP/i.test(text)) {
    result.notes.push("❌ رسالة OTP — مرفوضة");
    return result;
  }

  let m = text.match(
    /credit card ending with#(\d{4})\s+was charged for EGP\s+([\d,]+\.?\d*)\s+at\s+(.+?)\s+on\s+(\d{2}\/\d{2}\/\d{2})(?:\s+at\s+(\d{2}:\d{2}))?/i,
  );
  if (m) {
    result.ok = true;
    result.last4 = m[1];
    result.amount = parseFloat(m[2].replace(/,/g, ""));
    result.merchant = m[3].trim();
    result.description = `مشتريات: ${result.merchant}`;
    result.bank = "CIB";
    const [dd, mm, yy] = m[4].split("/");
    result.date = `20${yy}-${mm}-${dd}`;
    if (m[5]) result.time = m[5];
    const limitM = text.match(/available limit is EGP\s+([\d,]+\.?\d*)/i);
    if (limitM) result.availableLimit = parseFloat(limitM[1].replace(/,/g, ""));
    result.notes.push(`✅ CIB: ${result.merchant} — ${result.amount} ج.م`);
    const mapInfo = CARD_LAST4_MAP[result.last4];
    if (mapInfo) {
      result.linkedCardId = mapInfo.linkedCardId;
      result.cardLabel = mapInfo.label;
    }
    return result;
  }

  m = text.match(
    /credit card \*\*(\d{4})\s+was debited by\s+([\d,]+\.?\d*)EGP\s+at\s+(.+?)\.\s+Available limit is\s+([\d ,]+\.?\d*)/i,
  );
  if (m) {
    result.ok = true;
    result.last4 = m[1];
    result.amount = parseFloat(m[2].replace(/,/g, ""));
    result.merchant = m[3].trim();
    result.description = `مشتريات: ${result.merchant}`;
    result.bank = "CIB";
    result.availableLimit = parseFloat(m[4].replace(/[,\s]/g, ""));
    result.notes.push(`✅ CIB (بطاقة ${result.last4}): ${result.merchant} — ${result.amount} ج.م`);
    const mapInfo = CARD_LAST4_MAP[result.last4];
    if (mapInfo) {
      result.linkedCardId = mapInfo.linkedCardId;
      result.cardLabel = mapInfo.label;
    }
    return result;
  }

  m = text.match(
    /Covered Card\s+\*(\d{4})\s+was charged for EGP\s*([\d,]+\.?\d*)\s+at\s+(.+?)\s+on\s+(\d{2}\/\d{2}\/\d{2})(?:\s+at\s+(\d{2}:\d{2}))?/i,
  );
  if (m) {
    result.ok = true;
    result.last4 = m[1];
    result.amount = parseFloat(m[2].replace(/,/g, ""));
    result.merchant = m[3].trim();
    result.description = `مشتريات: ${result.merchant}`;
    result.bank = "ADIB";
    const [dd, mm, yy] = m[4].split("/");
    result.date = `20${yy}-${mm}-${dd}`;
    if (m[5]) result.time = m[5];
    const limitM = text.match(/available card limit is EGP\s*([\d,]+\.?\d*)/i);
    if (limitM) result.availableLimit = parseFloat(limitM[1].replace(/,/g, ""));
    result.notes.push(`✅ ADIB: ${result.merchant} — ${result.amount} ج.م`);
    const mapInfo = CARD_LAST4_MAP[result.last4];
    if (mapInfo) {
      result.linkedCardId = mapInfo.linkedCardId;
      result.cardLabel = mapInfo.label;
    }
    return result;
  }

  m = text.match(/card ending with \*(\d{4})\s+was debited/i);
  if (m) {
    result.last4 = m[1];
    result.bank = "AAIB";
    result.notes.push(`⚠️ AAIB: بطاقة ${result.last4} — أدخل المبلغ يدوياً`);
    const mapInfo = CARD_LAST4_MAP[result.last4];
    if (mapInfo) {
      result.linkedCardId = mapInfo.linkedCardId;
      result.cardLabel = mapInfo.label;
    }
    return result;
  }

  result.notes.push("⚠️ لم يتم التعرف على النمط — أدخل البيانات يدوياً");
  return result;
};

const getTxDisplay = (t) => {
  if (!t) return "";
  const base = t.description || t.category || "بدون وصف";
  if (t.quantity && Number(t.quantity) >= 1 && t.unitPrice && !String(base).includes("×")) {
    return `${base} (${t.quantity} × ${t.unitPrice})`;
  }
  return base;
};

    .filter(

        isHanyShopCategory(t.category) && !isCarryoverMarker(t),
    )
    .sort(compareTransactions);

  const settlements = (data.transactions || [])
    .filter((t) => isHanySettleTx(t) && t.status === "paid")
    .sort(compareTransactions);

  const totalPurchases = purchases.reduce((s, t) => s + safeNumber(t.amount), 0);
  const totalSettlements = settlements.reduce((s, t) => s + safeNumber(t.amount), 0);
  const currentPayable = Math.max(0, totalPurchases - totalSettlements);

  const filteredPurchases = monthFilter
    ? purchases.filter(
        (t) => t.month === monthFilter.month && (t.year || 2026) === monthFilter.year,

    ? settlements.filter(

  const groupedMap = {};

    groupedMap[key].total += safeNumber(t.amount);

/* Transactions Report */
const generateTransactionsReport = (data, options = {}) => {
  const {
    selectedMonth = "أكتوبر", selectedYear = 2026,
    filterType = "all", includeOnlyPaid = false,
  } = options;

  const allTxs = (data.transactions || [])
    .filter((t) => {
      if (isCarryoverMarker(t)) return false;
      if (t.month !== selectedMonth || (t.year || 2026) !== selectedYear) return false;
      if (filterType !== "all" && t.type !== filterType) return false;
      if (includeOnlyPaid && t.status !== "paid") return false;
      return true;
    })
    .sort(compareTransactions);

  const totalIncome = allTxs.filter((t) => t.type === "income" && t.status === "paid")
    .reduce((s, t) => s + safeNumber(t.amount), 0);
  const totalExpense = allTxs.filter((t) => t.type === "expense" && t.status === "paid")
    .reduce((s, t) => s + safeNumber(t.amount), 0);
  const netFlow = totalIncome - totalExpense;

  const reportTitle = `كشف المعاملات — ${selectedMonth} ${selectedYear}`;

  const rows = allTxs.map((t) => {
    const isIncome = t.type === "income";
    return `
      <tr>
        <td style="white-space:nowrap;color:#64748B;font-size:9px">${formatArabicDate(t.date)}</td>
        <td><strong>${escapeHtml(t.description || t.category || "بدون وصف")}</strong><br/><span style="font-size:9px;color:#94A3B8">${escapeHtml(t.category)} · ${escapeHtml(getMethodLabel(t.method))}${t.status !== "paid" ? ' · <span style="color:#D97706">معلق</span>' : ""}</span></td>
        <td style="text-align:left;font-weight:900;color:${isIncome ? "#059669" : "#DC2626"};font-variant-numeric:tabular-nums">${isIncome ? "+" : "−"}${fmt(t.amount)}</td>
      </tr>
    `;
  }).join("");

  const content = `

    <div class="report-kpi-grid">
      <div class="report-kpi success"><div class="kpi-label">إجمالي الإيرادات</div><div class="kpi-value">${fmt(totalIncome)}</div></div>
      <div class="report-kpi danger"><div class="kpi-label">إجمالي المصروفات</div><div class="kpi-value">${fmt(totalExpense)}</div></div>
      <div class="report-kpi accent"><div class="kpi-label">صافي التدفق</div><div class="kpi-value">${netFlow >= 0 ? "+" : ""}${fmt(netFlow)}</div></div>
      <div class="report-kpi"><div class="kpi-label">عدد العمليات</div><div class="kpi-value">${allTxs.length}</div></div>
    </div>
    <div class="report-section-title">📋 تفاصيل المعاملات</div>
    <table class="report-table">
      <thead><tr><th style="width:80px">التاريخ</th><th>البيان</th><th style="width:110px">المبلغ (ج.م)</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="3" style="text-align:center;padding:20px;color:#94A3B8">لا توجد معاملات</td></tr>'}</tbody>
    </table>
    <div class="report-totals-box">
      <div class="report-totals-row"><span>💰 إجمالي الإيرادات</span><span style="color:#059669;font-weight:900">+${fmt(totalIncome)} ج.م</span></div>
      <div class="report-totals-row"><span>💸 إجمالي المصروفات</span><span style="color:#DC2626;font-weight:900">−${fmt(totalExpense)} ج.م</span></div>
      <div class="report-totals-row final"><span>📊 صافي التدفق</span><span style="color:#635BFF">${netFlow >= 0 ? "+" : ""}${fmt(netFlow)} ج.م</span></div>

/* Cards Report */
const generateCardsReport = (data) => {
  const reportTitle = "كشف البطاقات الائتمانية";
  const cards = data.cards || [];

  const cardsData = cards.map((card) => {
    const debt = computeCardDebt(data, card);
    return {
      card, debt,
      available: Math.max(0, safeNumber(card.limit) - Math.max(0, debt)),
      limit: safeNumber(card.limit),
    };
  });

  const totalDebt = cardsData.reduce((s, c) => s + Math.max(0, c.debt), 0);
  const totalLimit = cardsData.reduce((s, c) => s + c.limit, 0);
  const totalAvailable = cardsData.reduce((s, c) => s + c.available, 0);
  const usagePct = totalLimit > 0 ? (totalDebt / totalLimit) * 100 : 0;

  const rows = cardsData.map(({ card, debt, available, limit }) => {
    const pct = limit > 0 ? (Math.max(0, debt) / limit) * 100 : 0;
    return `
      <tr>
        <td><strong>${escapeHtml(card.bank)} - ${escapeHtml(card.name)}</strong><br/><span style="font-size:9px;color:#94A3B8">•••• ${escapeHtml(card.last4)}</span></td>
        <td style="text-align:left;font-variant-numeric:tabular-nums">${fmt(limit)}</td>
        <td style="text-align:left;color:#DC2626;font-weight:800;font-variant-numeric:tabular-nums">${fmt(Math.max(0, debt))}</td>
        <td style="text-align:left;color:#059669;font-weight:800;font-variant-numeric:tabular-nums">${fmt(available)}</td>
        <td style="text-align:center;font-weight:800;color:${pct > 70 ? "#DC2626" : pct > 40 ? "#D97706" : "#059669"}">${Math.round(pct)}%</td>
      </tr>
    `;
  }).join("");

  const content = `
    ${buildReportHeader(reportTitle, { badge: `${cards.length} بطاقة` })}
    <div class="report-kpi-grid">
      <div class="report-kpi accent"><div class="kpi-label">إجمالي الحدود</div><div class="kpi-value">${fmt(totalLimit)}</div></div>
      <div class="report-kpi danger"><div class="kpi-label">إجمالي المديونية</div><div class="kpi-value">${fmt(totalDebt)}</div></div>
      <div class="report-kpi success"><div class="kpi-label">إجمالي المتاح</div><div class="kpi-value">${fmt(totalAvailable)}</div></div>
      <div class="report-kpi ${usagePct > 70 ? "danger" : usagePct > 40 ? "warning" : "success"}"><div class="kpi-label">نسبة الاستخدام</div><div class="kpi-value">${Math.round(usagePct)}%</div></div>
    </div>
