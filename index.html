class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, errorInfo) { 
    console.error('Application Error:', error, errorInfo); 
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="flex flex-col h-screen items-center justify-center gradient-bg-danger text-white p-8 text-center animate-fadeIn" dir="rtl">
          <div className="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-6 animate-pulse backdrop-blur-sm">
            <AlertTriangle size={48} />
          </div>
          <h1 className="text-3xl font-black mb-2">عذراً، حدث خطأ تقني</h1>
          <p className="mb-6 max-w-md text-sm opacity-90">يبدو أن هناك مشكلة في تحميل التطبيق. يرجى المحاولة مرة أخرى.</p>
          <div className="flex gap-4 flex-wrap justify-center">
            <button onClick={() => window.location.reload()} className="gradient-bg-primary text-white px-8 py-4 rounded-2xl font-bold shadow-hard hover:shadow-neon transition-all flex items-center gap-2">
              <RefreshCcw size={20}/> إعادة التحميل
            </button>
            <button onClick={() => {
              localStorage.removeItem(STORAGE_KEY);
              window.location.reload();
            }} className="bg-red-500 hover:bg-red-600 text-white px-8 py-4 rounded-2xl font-bold shadow-hard hover:shadow-neon transition-all flex items-center gap-2">
              <Trash2 size={20}/> مسح الذاكرة المحلية
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

// Helper for Bank Logos
const BankLogo = ({ type, size = 40, className = "" }) => {
  const getLogoSrc = () => {
    switch(type) {
      case 'cib_card':
      case 'cib_savings':
        return "https://upload.wikimedia.org/wikipedia/commons/e/e0/Commercial_International_Bank_%28CIB%29_Logo.svg";
      case 'aaib_card':
      case 'aaib_savings':
        return "https://upload.wikimedia.org/wikipedia/commons/2/22/Arab_African_International_Bank_logo.svg";
      case 'fawry':
        return "https://upload.wikimedia.org/wikipedia/commons/5/59/Fawry_logo.svg";
      case 'etisalat':
        return "https://upload.wikimedia.org/wikipedia/commons/e/e4/Etisalat_logo.svg";
      default:
        return null;
    }
  };

  const src = getLogoSrc();
  const altText = type.replace('_', ' ');

  const [error, setError] = useState(false);

  return (
    <div className={`flex items-center justify-center ${className}`} style={{width: size, height: size}}>
      {src && !error ? (
        <img 
          src={src} 
          alt={altText}
          className="w-full h-full object-contain drop-shadow-md"
          onError={() => setError(true)}
          loading="lazy"
        />
      ) : (
        <span className="text-[10px] font-black text-center leading-tight opacity-50">
          {altText}
        </span>
      )}
    </div>
  );
};

const GenericLedgerComponent = React.memo(({
  walletKey,
  ledgerData,
  isExpanded,
  onToggle,
  onDelete,
  onEditTransaction,
  theme,
  isPrivate,
  onAddDeposit,
  onAddWithdrawal,
  onExportCSV,
  walletVisibility,
  onToggleVisibility
}) => {
  const [filter, setFilter] = useState('all');
  const [dateFilter, setDateFilter] = useState('');

  const validatedLedger = useMemo(() => {
    try {
      return (ledgerData || []).map(item => ({
        ...item,
        amount: Number(item.amount) || 0,
        runningBalance: Number(item.runningBalance) || 0,
        date: item.date || 'غير معروف',
        description: item.description || 'بدون وصف',
        subType: item.subType || (item.type === 'income' ? 'deposit' : 'withdrawal')
      })).filter(item => item.amount > 0);
    } catch (error) {
      console.error('خطأ في معالجة سجل المحفظة:', error);
      return [];
    }
  }, [ledgerData]);

  const filteredLedger = useMemo(() => {
    return validatedLedger.filter(item => {
      if (filter === 'deposit' && item.subType !== 'deposit') return false;
      if (filter === 'withdrawal' && item.subType !== 'withdrawal') return false;
      if (dateFilter && !item.date.includes(dateFilter)) return false;
      return true;
    });
  }, [validatedLedger, filter, dateFilter]);

  const stats = useMemo(() => {
    const deposits = validatedLedger
      .filter(t => t.subType === 'deposit')
      .reduce((sum, t) => sum + Number(t.amount), 0);
      
    const withdrawals = validatedLedger
      .filter(t => t.subType === 'withdrawal')
      .reduce((sum, t) => sum + Number(t.amount), 0);
      
    const currentBalance = validatedLedger.length > 0 
      ? validatedLedger[0].runningBalance 
      : 0;

    return { deposits, withdrawals, currentBalance };
  }, [validatedLedger]);

  const handleVisibilityToggle = useCallback((e) => {
    e.stopPropagation();
    if (onToggleVisibility) {
      onToggleVisibility(walletKey);
    }
  }, [onToggleVisibility, walletKey]);

  if (!ledgerData || ledgerData.length === 0) {
    return (
      <div className={`glass rounded-2xl overflow-hidden border border-slate-200/60 dark:border-slate-700/60 ${theme.bgColor} hover-lift`}>
        <div className={`collapsible-header p-6 flex justify-between items-center border-b border-slate-100/50 dark:border-slate-800/50 ${theme.headerClass}`} onClick={onToggle}>
          <div className="flex items-center gap-4">
            <div className={`p-3 rounded-xl bg-gradient-to-br ${theme.gradient} text-white shadow-md`}>
              <theme.icon size={24} />
            </div>
            <div>
              <h3 className="text-xl font-black">{theme.title}</h3>
              <p className="text-xs text-slate-500 font-bold mt-1">{theme.subtitle}</p>
            </div>
          </div>

          <div className="flex items-center gap-3">
            <button 
              type="button"
              onClick={(e) => {
                e.stopPropagation();
                onAddDeposit && onAddDeposit(walletKey);
              }}
              className="p-2 bg-emerald-500 text-white rounded-xl hover:bg-emerald-600 transition-colors shadow-md"
              title="إيداع جديد"
            >
              <ArrowDownCircle size={20} />
            </button>

            <button 
              type="button"
              onClick={(e) => {
                e.stopPropagation();
                onAddWithdrawal && onAddWithdrawal(walletKey);
              }}
              className="p-2 bg-red-500 text-white rounded-xl hover:bg-red-600 transition-colors shadow-md"
              title="سحب جديد"
            >
              <ArrowUpCircle size={20} />
            </button>

            <button 
              type="button"
              onClick={handleVisibilityToggle}
              className="p-2 bg-slate-500 text-white rounded-xl hover:bg-slate-600 transition-colors shadow-md"
              title={walletVisibility?.[walletKey] ? 'إخفاء الرصيد' : 'إظهار الرصيد'}
            >
              {walletVisibility?.[walletKey] ? <EyeOff size={20} /> : <Eye size={20} />}
            </button>

            <ChevronDown size={24} className={`text-slate-400 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}`} />
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className={`glass rounded-2xl overflow-hidden border border-slate-200/60 dark:border-slate-700/60 mb-6 ${theme.bgColor} hover-lift`}>

            <h3 className="text-xl font-black">{theme.title}</h3>

          </div>
        </div>

        <div className="flex items-center gap-3">
          <button 
            type="button"
            onClick={(e) => {
              e.stopPropagation();
              onAddDeposit && onAddDeposit(walletKey);
            }}
            className="p-2 bg-emerald-500 text-white rounded-xl hover:bg-emerald-600 transition-colors shadow-md"
            title="إيداع جديد"
          >
            <ArrowDownCircle size={20} />
          </button>

          <button 
            type="button"
            onClick={(e) => {
              e.stopPropagation();
              onAddWithdrawal && onAddWithdrawal(walletKey);
            }}
            className="p-2 bg-red-500 text-white rounded-xl hover:bg-red-600 transition-colors shadow-md"
            title="سحب جديد"
          >
            <ArrowUpCircle size={20} />
          </button>

          <button 
            type="button"
            onClick={handleVisibilityToggle}
            className="p-2 bg-slate-500 text-white rounded-xl hover:bg-slate-600 transition-colors shadow-md"

          >
            {walletVisibility?.[walletKey] ? <EyeOff size={20} /> : <Eye size={20} />}
          </button>

          <button 
            type="button"
            onClick={(e) => {
              e.stopPropagation();

                </div>
                <div className="text-center">
                  <div className="text-xs text-slate-500">إجمالي السحب</div>
                  <div className="text-lg font-black text-red-600">
                    {isPrivate || !walletVisibility?.[walletKey] ? '•••••' : stats.withdrawals.toLocaleString()} ج.م
                  </div>
                </div>
                <div className="text-center">
                  <div className="text-xs text-slate-500">الرصيد الحالي</div>
                  <div className="text-lg font-black text-blue-600">

const DuplicateDetectionSystem = ({ transactions, dispatch, addNotification, MONTHS, closedMonths }) => {
  const [duplicateThreshold, setDuplicateThreshold] = useState(2);
  const [selectedMonth, setSelectedMonth] = useState('كل الشهور');
  const [expandedGroups, setExpandedGroups] = useState({});

  const detectDuplicates = useMemo(() => {
    const amountMap = {};
    const filtered = selectedMonth === 'كل الشهور' ? transactions : transactions.filter(t => t.month === selectedMonth);
    filtered.forEach(t => {
      const key = `${Number(t.amount)}_${t.method}_${t.category}`;
      if (!amountMap[key]) amountMap[key] = [];
      amountMap[key].push(t);
    });
    return Object.entries(amountMap).filter(([_, items]) => items.length >= duplicateThreshold).map(([key, items]) => ({
      key, amount: items[0].amount, count: items.length, items, category: items[0].category,
      risk: items.length >= 5 ? 'high' : items.length >= 3 ? 'medium' : 'low'
    }));
  }, [transactions, duplicateThreshold, selectedMonth]);

  const handleDeleteAll = () => {
      let idsToDelete = [];
      let protectedCount = 0;

      detectDuplicates.forEach(d => {
          const itemsToDelete = d.items.slice(1);
          
          itemsToDelete.forEach(item => {
              if (closedMonths?.includes(item.month)) {
                  protectedCount++;
              } else {
                  idsToDelete.push(item.id);
              }
          });
      });

      if (idsToDelete.length === 0 && protectedCount > 0) {
          addNotification({ 
              type: 'error', 
              title: 'محظور', 
              message: 'جميع العمليات المكررة المكتشفة تخص أشهراً مغلقة ولا يمكن حذفها.' 
          });
          return;
      }

      const message = protectedCount > 0
          ? `سيتم حذف ${idsToDelete.length} عملية مكررة. ${protectedCount} عمليات تم تجاهلها لأنها في أشهر مغلقة.`
          : `هل أنت متأكد من حذف العمليات المكررة؟ سيتم الاحتفاظ بنسخة واحدة فقط لكل مجموعة (${detectDuplicates.length} مجموعة).`;

      dispatch({
          type: 'SHOW_CONFIRM',
          title: protectedCount > 0 ? 'تأكيد الحذف (جزئي)' : 'تأكيد الحذف الجماعي',
          message: message,
          onConfirm: () => {
              dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.filter(t => !idsToDelete.includes(t.id)) });
              addNotification({ type: 'success', title: 'تم التنظيف', message: `تم حذف ${idsToDelete.length} عملية مكررة${protectedCount > 0 ? ` (تم تجاهل ${protectedCount})` : ''}` });
          },
          onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
      });
  };

  return (
    <div className="space-y-8 animate-fadeIn pb-20">
      <div className="glass p-8 rounded-2xl flex justify-between items-center gradient-border mb-6">
        <div><h2 className="text-2xl font-black flex items-center gap-3"><Filter className="text-blue-500" /> كاشف التكرار الذكي</h2><p className="text-slate-500 mt-1 text-sm font-bold">تحليل ذكي لاكتشاف المبالغ التي قد تكون سجلت مرتين بالخطأ</p></div>
        <button onClick={handleDeleteAll} disabled={detectDuplicates.length === 0} className={`px-6 py-3 rounded-xl font-bold transition-all flex items-center gap-2 ${detectDuplicates.length === 0 ? 'bg-slate-100 text-slate-400' : 'gradient-bg-danger text-white shadow-lg hover:scale-105'}`} title="حذف جميع المكررات"><Trash2 size={18} /> تنظيف السجل</button>
      </div>
      <div className="glass p-6 rounded-2xl grid grid-cols-1 md:grid-cols-2 gap-8">
        <div><label className="block text-xs font-black mb-3 opacity-50 uppercase tracking-widest">نطاق البحث</label><select className="input-field" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}><option value="كل الشهور">جميع الشهور</option>{MONTHS.map(m => <option key={m} value={m}>{m}</option>)}</select></div>
        <div><label className="block text-xs font-black mb-3 opacity-50 uppercase tracking-widest">حساسية الكشف (أكثر من {duplicateThreshold} مرات)</label><input type="range" min="2" max="10" className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer" value={duplicateThreshold} onChange={e => setDuplicateThreshold(Number(e.target.value))} /></div>
      </div>
      <div className="space-y-4">
        {detectDuplicates.map(dup => (
          <div key={dup.key} className="glass rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700">
            <div className={`p-5 flex justify-between items-center cursor-pointer ${dup.risk === 'high' ? 'bg-red-50/50' : 'bg-amber-50/50'}`} onClick={() => setExpandedGroups(p => ({...p, [dup.key]: !p[dup.key]}))}>
              <div className="flex items-center gap-4"><div className={`p-3 rounded-2xl ${dup.risk === 'high' ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-600'}`}><Repeat size={24} /></div><div><h4 className="font-black text-lg">{Number(dup.amount).toLocaleString()} ج.م</h4><span className="text-xs font-bold opacity-60">{dup.category} - تكرر {dup.count} مرات</span></div></div>
              <ChevronDown className={`transition-transform duration-300 ${expandedGroups[dup.key] ? 'rotate-180' : ''}`} />
            </div>
            {expandedGroups[dup.key] && (
              <div className="p-4 bg-white/50 dark:bg-black/20 divide-y dark:divide-slate-800 animate-fadeIn">
                {dup.items.map((item, idx) => (
                  <div key={item.id} className="py-4 flex justify-between items-center px-4">
                    <div className="text-sm font-bold">📅 {item.date} <span className="mx-2 text-slate-300">|</span> 📝 {item.description || 'بدون وصف'} {closedMonths?.includes(item.month) && <span className="text-red-500 text-xs mr-2 font-bold">(مغلق)</span>}</div>
                    {idx !== 0 && !closedMonths?.includes(item.month) && <button onClick={() => dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.filter(t => t.id !== item.id) })} className="text-red-500 hover:bg-red-50 p-2 rounded-xl transition-all" title="حذف هذه المكررة"><Trash2 size={16} /></button>}
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
};

      };

      return {

        notifications: state.notifications.filter(n => n.id !== action.payload) 
      };
    case 'UPDATE_TRANSACTIONS': 
      return { 
        ...state, 
        data: { 
          ...state.data, 
          transactions: action.payload 
        } 
      };
    case 'UPDATE_LOANS': 
      return { 
        ...state, 
        data: { 
          ...state.data, 
          loans: action.payload 
        } 
      };
    case 'UPDATE_CARDS': 
      return { 
        ...state, 
        data: { 
          ...state.data, 
          cards: action.payload 
        } 
      };
    case 'UPDATE_OPENING_BALANCE': 
      return { 
        ...state, 
        data: { 
          ...state.data, 
          openingBalance2026: action.payload 
        } 
      };
    case 'UPDATE_FAWRY_DATA': 
      return { 
        ...state, 
        fawryData: action.payload 
      };
    case 'UPDATE_ETISALAT_DATA': 
      return { 
        ...state, 
        etisalatData: action.payload 
      };
    case 'UPDATE_RECURRING_ITEMS': 
      return { 
        ...state, 
        data: { 
          ...state.data, 
          recurringItems: action.payload 
        } 
      };
    case 'ADD_TO_HISTORY':
      const limitedHistory = [...state.history].slice(-19);
      return { 
        ...state, 
        history: [...limitedHistory, action.payload], 
        future: [] 
      };
    case 'UNDO':
      if (state.history.length === 0) return state;
      const previous = state.history[state.history.length - 1];
      return { 
        ...state, 
        data: previous, 
        history: state.history.slice(0, state.history.length - 1), 
        future: [state.data, ...state.future] 
      };
    case 'REDO':
      if (state.future.length === 0) return state;
      const next = state.future[0];
      return { 
        ...state, 
        data: next, 
        history: [...state.history, state.data], 
        future: state.future.slice(1) 
      };
    case 'TOGGLE_LEDGER':
      return { 
        ...state, 
        expandedLedgers: { 
          ...state.expandedLedgers, 
          [action.payload]: !state.expandedLedgers[action.payload] 
        } 
      };
    case 'TOGGLE_CARDS_SECTION':
      return { 
        ...state, 
        expandedCardsSection: !state.expandedCardsSection 
      };
    case 'SET_STATUS_FILTER':
      return { 
        ...state, 
        statusFilter: action.payload 
      };
    case 'UPDATE_LOAN_DUE_DATE':
      return { 
        ...state, 
        data: { 
          ...state.data, 
          loans: state.data.loans.map(loan => 
            loan.id === action.payload.loanId ? 
            { ...loan, nextPaymentDate: action.payload.newDate } : 
            loan
          ) 
        } 
      };
    case 'SHOW_CONFIRM':
      return { 
        ...state, 
        confirmDialog: { 
          isOpen: true, 
          title: action.title, 
          message: action.message, 
          onConfirm: action.onConfirm,
          onCancel: action.onCancel || (() => dispatch({ type: 'HIDE_CONFIRM' }))
        } 
      };
    case 'HIDE_CONFIRM':
      return { 
        ...state, 
        confirmDialog: { 
          isOpen: false, 
          title: '', 
          message: '', 
          onConfirm: null, 
          onCancel: null 
        } 
      };
    case 'SET_QUICK_TRANSFER_MODAL_OPEN':
      return { 
        ...state, 
        isQuickTransferModalOpen: action.payload 
      };
    case 'SET_QUICK_TRANSFER_DATA':
      return { 
        ...state, 
        quickTransferData: { 
          ...state.quickTransferData, 
          ...action.payload 
        } 
      };
    case 'SET_BACKUP_REMINDER_OPEN':
      return { 
        ...state, 
        isBackupReminderOpen: action.payload 
      };
    case 'SET_VIEWING_CARD_STATEMENT':
      return { 
        ...state, 
        viewingCardStatement: action.payload 
      };
    case 'CLOSE_MONTH':
      return {
        ...state,
        data: {
          ...state.data,
          closedMonths: [...(state.data.closedMonths || []), action.payload.month],
          monthlySnapshots: { 
            ...(state.data.monthlySnapshots || {}), 
            [action.payload.month]: action.payload.balance 
          }
        }
      };
    case 'TOGGLE_WALLET_VISIBILITY':
      return {
        ...state,
        walletVisibility: {
          ...state.walletVisibility,
          [action.payload]: !state.walletVisibility[action.payload]
        }
      };
    case 'SET_IS_PROCESSING':
      return { 
        ...state, 
        isProcessing: action.payload 
      };
    default: 
      return state;
  }
}

// Enhanced Finance Snapshot Logic - Improved Cash Calculation
const useFinanceSnapshot = (transactions, selectedMonth, closedMonths, monthlySnapshots, openingBalance2026) => {
  return useMemo(() => {
    // حساب الرصيد المرحل بدقة
    const calculateCarryoverBalance = () => {
      let carryover = Number(openingBalance2026 || 0);
      const selectedMonthIdx = getMonthIndex(selectedMonth);
      const transferCategories = ['شحن محفظة', 'تحويلات', 'شحن رصيد فوري', 'شحن رصيد', 'إيداع'];

      // التحقق من الشهر السابق المغلق
      const prevMonthName = MONTHS[selectedMonthIdx - 1];
      
      if (prevMonthName && closedMonths?.includes(prevMonthName)) {
        // إذا كان الشهر السابق مغلقاً، استخدم القيمة المحفوظة
        return Number(monthlySnapshots[prevMonthName] || 0);
      }

      // حساب الرصيد المرحل من المعاملات السابقة
      transactions.forEach(t => {
        const transactionMonthIdx = getMonthIndex(t.month);
        if (transactionMonthIdx < selectedMonthIdx) {
          const amount = Number(t.amount || 0);
          
          if (t.type === 'income' && t.status === 'paid') {
            // إضافة الدخل المدفوع
            carryover += amount;
          } else if (t.type === 'expense' && t.status === 'paid') {
            // خصم المصاريف المدفوعة نقدياً (باستثناء البطاقات والتحويلات)
            if (!['cib_card', 'aaib_card'].includes(t.method) && !transferCategories.includes(t.category)) {
              carryover -= amount;
            }
          }
        }
      });

      return carryover;
    };

    // حساب الإحصائيات للشهر الحالي
    const calculateMonthStats = () => {
      const monthTransactions = transactions.filter(t => t.month === selectedMonth);
      const transferCategories = ['شحن محفظة', 'تحويلات', 'شحن رصيد فوري', 'شحن رصيد', 'إيداع'];

      const stats = {
        actualIncome: 0,
        pendingIncome: 0,
        cashExpenses: 0,
        pendingCashExpenses: 0,
        creditExpenses: 0,
        transfers: 0
      };

      monthTransactions.forEach(t => {
        const amount = Number(t.amount || 0);
        
        if (t.type === 'income') {
          if (t.status === 'paid') {
            stats.actualIncome += amount;
          } else {
            stats.pendingIncome += amount;
          }
        } else if (t.type === 'expense') {
          if (transferCategories.includes(t.category)) {
            stats.transfers += amount;
          } else if (['cib_card', 'aaib_card'].includes(t.method)) {
            stats.creditExpenses += amount;
          } else if (t.status === 'paid') {
            stats.cashExpenses += amount;
          } else {
            stats.pendingCashExpenses += amount;
          }
        }
      });

      return stats;
    };

    const carryoverBalance = calculateCarryoverBalance();
    const monthStats = calculateMonthStats();

    // حساب السيولة الفعلية
    const actualCashInHand = carryoverBalance + monthStats.actualIncome - monthStats.cashExpenses - monthStats.transfers;
    
    // حساب الرصيد المتوقع (شامل الدخل والمصروفات المعلقة)
    const projectedClosingBalance = actualCashInHand + monthStats.pendingIncome - monthStats.pendingCashExpenses;

    // حساب الفارق المحتمل (للتسوية)
    const reconciliationDifference = 0; // سيتم حسابه من خلال مكون التسوية

    return {
      // الأرصدة الأساسية
      actualCarryover: carryoverBalance,
      actualCashInHand: Math.max(0, actualCashInHand), // التأكد من عدم وجود قيم سالبة
      projectedClosingBalance: Math.max(0, projectedClosingBalance),
      
      // الإحصائيات الشهرية
      actualIncome: monthStats.actualIncome,
      pendingIncome: monthStats.pendingIncome,
      cashExpenses: monthStats.cashExpenses,
      pendingCashExpenses: monthStats.pendingCashExpenses,
      creditExpenses: monthStats.creditExpenses,
      transfers: monthStats.transfers,
      
      // معلومات إضافية للتصحيح
      reconciliationDifference,
      isBalanceValid: actualCashInHand >= 0
    };
  }, [transactions, selectedMonth, closedMonths, monthlySnapshots, openingBalance2026]);
};

      }

              amount: loan.monthlyInstallment,
              type: 'danger',
              icon: Banknote,
              desc: loan.description
            });
          }
        });

                finalizeTransaction(finalSubType);
              },
              onCancel: () => {
                processingRef.current = false;
                dispatch({ type: 'SET_IS_PROCESSING', payload: false });
              }
            });
            return;

        finalizeTransaction(finalSubType);

          type: 'error', 
          title: 'خطأ في الحفظ',

        dispatch({ type: 'SET_IS_PROCESSING', payload: false });

        const adjustedDate = `${CURRENT_YEAR}-${targetMonthIdx}-${selectedDay}`;

        return {
          ...formData,
          id: idOverride || getSafeId(),
          amount: Number(formData.amount),
          month: m,
          monthIndex: getMonthIndex(m),
          date: adjustedDate,
          subType: finalSubType
        };
      };

      let newTransactions = [...transactions];
      if (formMode === 'add') {
        newTransactions.push(processTransaction(selectedMonth));
        if (repeatMonths && repeatMonths.length > 0) {
          repeatMonths.forEach(m => { 
            newTransactions.push(processTransaction(m)); 
          });
        }
      } else {
        newTransactions = newTransactions.map(t => 
          t.id === formData.id ? processTransaction(formData.month, formData.id) : t
        );
      }

      if (formMode === 'add' && formData.linkedLoanId && 
          formData.category === 'الالتزامات البنكية والتمويلية' && 
          formData.status === 'paid') {
        const targetLoan = loans.find(l => l.id === formData.linkedLoanId);
        if (targetLoan && targetLoan.nextPaymentDate) {
          const oldDate = new Date(targetLoan.nextPaymentDate);
          const newDateObj = new Date(oldDate.setMonth(oldDate.getMonth() + 1));
          const newDateStr = newDateObj.toISOString().split('T')[0];
          dispatch({ 
            type: 'UPDATE_LOAN_DUE_DATE', 
            payload: { loanId: targetLoan.id, newDate: newDateStr } 
          });

      newTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
      dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTransactions });
      dispatch({ type: 'SET_FORM_OPEN', payload: false });
      dispatch({ type: 'SET_REPEAT_MONTHS', payload: [] });
      
      addNotification({ 
        type: 'success', 
        title: formMode === 'add' ? 'تمت الإضافة بنجاح' : 'تم التعديل بنجاح',
        message: `تم ${formData.type === 'income' ? 'إضافة دخل' : 'خصم مصروف'} بقيمة ${formData.amount} ج.م`,
        persistent: true,
        duration: 3000
      });
      
      processingRef.current = false;
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
    };
  }, [formData, formMode, selectedMonth, repeatMonths, transactions, saveHistory, addNotification, currentFawryBalance, currentEtisalatBalance, loans, dispatch, data.closedMonths, financeSnapshot, getSavingsLedger]);

        } 
      } catch(err) { 
        console.error('Import error:', err);
        addNotification({ type: 'error', title: 'ملف غير صالح', message: 'الملف ليس بصيغة JSON صحيحة' });

      dispatch({ type: 'SET_AI_LOADING', payload: false }); 
    }, 1500);

  const handleSmartAdd = useCallback(async () => { 
    dispatch({ type: 'SET_AI_LOADING', payload: true });

      let amount = txt.match(/\d+/)?.[0]; 
      let type = (txt.includes('قبضت') || txt.includes('اخدت') || txt.includes('تحويل لي')) ? 'income' : 'expense'; 
      let category = 'أخرى'; 
      if (txt.includes('اكل') || txt.includes('غدا') || txt.includes('سوبر')) category = 'مصروفات المعيشة اليومية'; 
      else if (txt.includes('رصيد') || txt.includes('شحن')) category = 'الاتصالات وشحن الهواتف المحمولة'; 
      else if (txt.includes('بنزين') || txt.includes('مواصلات')) category = 'المواصلات والانتقالات'; 
      else if (txt.includes('درس') || txt.includes('مدرسة')) category = 'التعليم والدروس والأنشطة'; 
      if (amount) { 
        dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); 
        dispatch({ type: 'SET_FORM_DATA', payload: { 
          type, 
          category, 
          amount: Number(amount), 
          description: aiQuery, 
          date: getLocalISODate(),

          quantity:1, 
          unitPrice: Number(amount),

      cards.forEach(card => {

                      <button
                        onClick={() => {
                          dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
                          dispatch({ type: 'SET_FORM_DATA', payload: {
                            type: 'expense',
                            amount: item.amount,
                            description: item.title,
                            category: 'الالتزامات البنكية والتمويلية',
                            date: getLocalISODate(),
                            month: selectedMonth,
                            method: 'instapay',
                            subType: 'withdrawal'
                          }});
                          dispatch({ type: 'SET_FORM_OPEN', payload: true });
                        }}
                        className="p-2 bg-blue-100 text-blue-600 rounded-lg hover:bg-blue-200 transition-colors active:scale-95 no-print"
                        title="دفع سريع"
                      >
                        <CheckCircle2 size={16} />
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          ))
        )}
      </div>
    );
  };

  const renderDashboard = () => (
    <div className="space-y-8 animate-fadeIn">
      {/* مكون الرصيد الافتتاحي */}
      <div className="glass bg-blue-50/50 dark:bg-blue-900/10 p-6 rounded-2xl border border-blue-100 dark:border-blue-900/30 shadow-sm animate-fadeIn">
        <div className="flex flex-col md:flex-row items-center justify-between gap-4">
          <div>
            <h3 className="text-lg font-bold text-blue-900 dark:text-blue-100 flex items-center gap-2">
              <Wallet size={20} className="text-blue-600 dark:text-blue-400" />
              الرصيد الافتتاحي لعام 2026
            </h3>
            <p className="text-sm text-slate-600 dark:text-slate-400 mt-1">سيتم اعتماد هذا المبلغ كنقطة بداية لحسابات شهر يناير.</p>
          </div>
          <div className="flex items-center gap-3 bg-white dark:bg-slate-800 p-2 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
            <input 
              type="number" 
              value={data.openingBalance2026 || ''}
              onChange={(e) => {
                const value = e.target.value;
                if (value === '' || Number(value) >= 0) {
                  dispatch({ type: 'UPDATE_OPENING_BALANCE', payload: Number(value) || 0 });
                }
              }}
              className="w-32 md:w-48 p-2 bg-transparent text-center font-black text-blue-600 outline-none text-lg placeholder:text-slate-300" 
              placeholder="0.00"
            />
            <button 
              onClick={() => {
                addNotification({ 
                  type: 'success', 
                  title: 'تم الحفظ', 
                  message: 'تم تحديث الرصيد الافتتاحي وتحديث الحسابات' 
                });
              }}
              className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors flex items-center gap-2"
            >
              <Save size={16} /> حفظ
            </button>
          </div>
        </div>
      </div>

      {/* لوحة السيولة الفورية مع إضافة خاصية التسوية */}
      <QuickBalanceOverview 
        financeSnapshot={financeSnapshot}
        currentFawryBalance={currentFawryBalance}
        currentEtisalatBalance={currentEtisalatBalance}
        getSavingsLedger={getSavingsLedger}
        isPrivate={false}
        walletVisibility={walletVisibility}
        onToggleVisibility={(key) => dispatch({ type: 'TOGGLE_WALLET_VISIBILITY', payload: key })}
        onReconcile={handleReconcileAccount}
      />

      {/* لوحة تحسين دقة السيولة */}
      <div className="glass p-6 rounded-2xl border-r-4 border-r-amber-500 bg-amber-50/10 mb-8 no-print animate-fadeIn">
        <div className="flex items-center gap-3 mb-4">
          <div className="p-3 bg-amber-100 text-amber-600 rounded-xl">
            <ShieldAlert size={24} />
          </div>
          <div>
            <h4 className="font-black text-lg text-slate-800 dark:text-white">مركز ضبط دقة السيولة</h4>
            <p className="text-xs text-slate-500 font-bold mt-1">أداة متقدمة لضمان دقة الأرصدة المحسوبة مع الواقع</p>
          </div>
        </div>
        
        <div className="space-y-4">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
              <div className="flex items-center gap-2 mb-2">
                <div className="p-2 bg-blue-100 text-blue-600 rounded-lg">
                  <Calculator size={18} />
                </div>
                <div>
                  <p className="text-sm font-bold text-slate-700 dark:text-slate-300">الرصيد المحسوب</p>
                  <p className="text-lg font-black text-blue-600">{financeSnapshot.actualCashInHand.toLocaleString()} ج.م</p>
                </div>
              </div>
            </div>
            
            <div className="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
              <div className="flex items-center gap-2 mb-2">
                <div className="p-2 bg-emerald-100 text-emerald-600 rounded-lg">
                  <ArrowUpCircle size={18} />
                </div>
                <div>
                  <p className="text-sm font-bold text-slate-700 dark:text-slate-300">الدخل المحصل</p>
                  <p className="text-lg font-black text-emerald-600">{financeSnapshot.actualIncome.toLocaleString()} ج.م</p>
                </div>
              </div>
            </div>
            
            <div className="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
              <div className="flex items-center gap-2 mb-2">
                <div className="p-2 bg-red-100 text-red-600 rounded-lg">
                  <ArrowDownCircle size={18} />
                </div>
                <div>
                  <p className="text-sm font-bold text-slate-700 dark:text-slate-300">المصروف النقدي</p>
                  <p className="text-lg font-black text-red-600">{financeSnapshot.cashExpenses.toLocaleString()} ج.م</p>
                </div>
              </div>
            </div>
          </div>
          
          <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
            <p className="text-sm text-slate-600 dark:text-slate-400 mb-2">
              <span className="font-bold">📊 معادلة السيولة:</span>
            </p>
            <div className="text-xs font-mono bg-white dark:bg-slate-800 p-3 rounded-lg">
              <div className="flex justify-between items-center mb-1">
                <span>رصيد البداية</span>
                <span className="font-bold">{financeSnapshot.actualCarryover.toLocaleString()} ج.م</span>
              </div>
              <div className="flex justify-between items-center mb-1 text-emerald-600">
                <span>+ الدخل المحصل</span>
                <span className="font-bold">+{financeSnapshot.actualIncome.toLocaleString()} ج.م</span>
              </div>
              <div className="flex justify-between items-center mb-1 text-red-600">
                <span>- المصروف النقدي</span>
                <span className="font-bold">-{financeSnapshot.cashExpenses.toLocaleString()} ج.م</span>
              </div>
              <div className="h-px bg-slate-200 dark:bg-slate-700 my-2"></div>
              <div className="flex justify-between items-center font-bold">
                <span>= السيولة الفعلية</span>
                <span className="text-lg">{financeSnapshot.actualCashInHand.toLocaleString()} ج.م</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 no-print">
        <button
          onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: true })}
          className="gradient-bg-primary text-white p-6 rounded-2xl flex items-center justify-center gap-3 hover:shadow-xl transition-all active:scale-[0.98] group"
        >
          <div className="bg-white/20 p-3 rounded-xl group-hover:rotate-12 transition-transform duration-300">
            <ArrowRightLeft size={24} />
          </div>
          <span className="font-bold text-lg">تحويل فوري</span>
        </button>

        <button
          onClick={() => {
            dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
            dispatch({ type: 'SET_FORM_DATA', payload: { 
              type: 'income', 
              amount: '', 
              date: getLocalISODate(), 
              month: selectedMonth, 
              method: 'cash', 
              subType: 'deposit',
              category: ''
            } });
            dispatch({ type: 'SET_FORM_OPEN', payload: true });
          }}
          className="gradient-bg-success text-white p-6 rounded-2xl flex flex-col items-center justify-center gap-3 hover:shadow-xl transition-all active:scale-[0.98] group"
        >
          <TrendingUp size={28} className="group-hover:scale-110 transition-transform" />
          <span className="font-bold">تسجيل دخل</span>
        </button>

        <button
          onClick={() => {
            dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
            dispatch({ type: 'SET_FORM_DATA', payload: { 
              type: 'expense', 
              amount: '', 
              date: getLocalISODate(), 
              month: selectedMonth, 
              method: 'cash', 
              subType: 'withdrawal',
              category: ''
            } });
            dispatch({ type: 'SET_FORM_OPEN', payload: true });
          }}
          className="gradient-bg-danger text-white p-6 rounded-2xl flex flex-col items-center justify-center gap-3 hover:shadow-xl transition-all active:scale-[0.98] group"
        >
          <TrendingDown size={28} className="group-hover:scale-110 transition-transform" />
          <span className="font-bold">تسجيل مصروف</span>
        </button>
      </div>

      <MonthSelector 
        selectedMonth={selectedMonth}
        onSelectMonth={(month) => dispatch({ type: 'SET_SELECTED_MONTH', payload: month })}
        className="no-print"
      />

      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <EnhancedStatCard
          title="السيولة الحالية"
          amount={financeSnapshot.actualCashInHand}
          icon={Wallet}
          subtitle={`رصيد مُرّحل: ${financeSnapshot.actualCarryover.toLocaleString()} ج.م`}
          isPrivate={!walletVisibility.cash}
        />

        <EnhancedStatCard
          title="الدخل المعلّق"
          amount={financeSnapshot.pendingIncome}
          icon={PendingCircle}
          subtitle="مبالغ متوقعة لم تستلم بعد"
          isPrivate={false}
        />

        <EnhancedStatCard
          title="المصاريف المعلقة"
          amount={-financeSnapshot.pendingCashExpenses}
          icon={Clock}
          subtitle="التزامات لم تسدد بعد"
          isPrivate={false}
        />

        <div 
          className="stat-card stat-card-balance cursor-pointer hover-lift"
          onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'planner' })}
        >
          <div className="flex justify-between items-center">
            <div>
              <p className="text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">
                الرصيد المتوقع
              </p>
              <h3 className={`text-2xl font-black ${
                financeSnapshot.projectedClosingBalance >= 0 
                ? 'text-blue-600' 
                : 'text-red-600'
              }`}>
                {Math.round(financeSnapshot.projectedClosingBalance).toLocaleString()}
                <span className="text-sm font-medium text-slate-400 mr-1">ج.م</span>
              </h3>
            </div>
            <div className="p-3 rounded-xl bg-blue-50 dark:bg-blue-900/20 text-blue-600">
              <TrendingUp size={24} />
            </div>
          </div>
          <div className="mt-4 text-xs text-slate-500">
            {financeSnapshot.projectedClosingBalance >= 0 ? '✅ وضع مالي آمن' : '⚠️ تحتاج لمراجعة المصروفات'}
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div className="glass p-6 rounded-2xl">
          <div className="flex justify-between items-center mb-6">
            <h3 className="text-lg font-bold dark:text-white flex items-center gap-2">
              <BarChart3 className="text-blue-500" />
              التدفق النقدي الشهري
            </h3>
            <span className="text-sm text-slate-500">{CURRENT_YEAR}</span>
          </div>
          <div className="h-64">
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={chartData}>
                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" opacity={0.5} />
                <XAxis dataKey="name" stroke="#94a3b8" fontSize={12} axisLine={false} tickLine={false} />
                <YAxis stroke="#94a3b8" fontSize={12} axisLine={false} tickLine={false} />
                <Tooltip 
                  cursor={{ fill: 'transparent' }}
                  contentStyle={{ 
                    borderRadius: '12px', 
                    border: 'none', 
                    boxShadow: '0 10px 30px -5px rgba(0,0,0,0.1)',
                    backgroundColor: isDarkMode ? '#1E293B' : 'white'
                  }}
                  formatter={(value) => `${Number(value).toLocaleString()} ج.م`}
                />
                <Legend />
                <Bar dataKey="دخل" fill="#10B981" radius={[8, 8, 8, 8]} barSize={10} />
                <Bar dataKey="مصروف" fill="#EF4444" radius={[8, 8, 8, 8]} barSize={10} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>

        <div className="glass p-6 rounded-2xl">
          <div className="flex justify-between items-center mb-6">
            <h3 className="text-lg font-bold dark:text-white flex items-center gap-2">
              <PieChart className="text-purple-500" />
              توزيع المصروفات
              <span className="text-sm font-normal text-slate-500">({selectedMonth})</span>
            </h3>
          </div>
          <div className="h-64">
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie 
                  data={transactions
                    .filter(t => t.type === 'expense' && t.month === selectedMonth && Number(t.amount) > 0)
                    .reduce((acc, t) => {
                      const existing = acc.find(item => item.name === t.category);
                      if (existing) {
                        existing.value += Number(t.amount);
                      } else {
                        acc.push({ name: t.category, value: Number(t.amount) });
                      }
                      return acc;
                    }, [])
                    .sort((a, b) => b.value - a.value)
                    .slice(0, 5)}
                  cx="50%" 
                  cy="45%" 
                  innerRadius={70} 
                  outerRadius={110} 
                  paddingAngle={4} 
                  dataKey="value" 
                  cornerRadius={6}
                >
                  {transactions
                    .filter(t => t.type === 'expense' && t.month === selectedMonth && Number(t.amount) > 0)
                    .reduce((acc, t) => {
                      const existing = acc.find(item => item.name === t.category);
                      if (existing) {
                        existing.value += Number(t.amount);
                      } else {
                        acc.push({ name: t.category, value: Number(t.amount) });
                      }
                      return acc;
                    }, [])
                    .sort((a, b) => b.value - a.value)
                    .slice(0, 5)
                    .map((entry, index) => (
                      <Cell key={`cell-${index}`} fill={CATEGORY_COLORS[entry.name] || '#9CA3AF'} stroke="none" />
                    ))}
                </Pie>
                <Tooltip 
                  contentStyle={{ 
                    borderRadius: '12px', 
                    border: 'none', 
                    boxShadow: '0 10px 30px -5px rgba(0,0,0,0.1)',
                    backgroundColor: isDarkMode ? '#1E293B' : 'white'
                  }}
                  formatter={(value) => `${Number(value).toLocaleString()} ج.م`}
                />
                <Legend layout="vertical" verticalAlign="middle" align="right" iconType="circle" />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>
    </div>
  );

  if (authLoading) {
    return (
      <div className="flex h-screen items-center justify-center bg-slate-900">
        <div className="text-center">
          <div className="loading-spinner mx-auto mb-4"></div>
          <p className="text-white">جاري التحقق من المصادقة...</p>
        </div>
      </div>
    );
  }

  if (!isAuthenticated) {
    return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
  }

  return (
    <div className="flex h-screen overflow-hidden text-slate-800 dark:text-slate-100 font-sans">
      <ProfessionalTicker />
      <NotificationCenter notifications={notifications} removeNotification={removeNotification} />
      
      {/* Processing Overlay */}
      {isProcessing && (
        <div className="processing-overlay">
          <div className="processing-spinner mb-4"></div>
          <h3 className="text-xl font-bold mb-2">جاري تطبيق العملية</h3>
          <p className="text-sm opacity-80 mb-6">قد تستغرق العملية بضع ثوانٍ</p>
          <button
            onClick={() => {
              processingRef.current = false;
              dispatch({ type: 'SET_IS_PROCESSING', payload: false });
              addNotification({ type: 'info', title: 'تم الإلغاء', message: 'تم إلغاء العملية' });
            }}
            className="px-6 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold transition-colors"
          >
            إلغاء العملية
          </button>
        </div>
      )}

      <ConfirmDialog />
      <ReconciliationModal />

      {/* Quick Transfer Modal */}
      {isQuickTransferModalOpen && (
        <div className="modal-backdrop z-[4000]">
          <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-fadeIn border border-blue-500/50">
            <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-blue-50 dark:bg-blue-900/10">
              <h3 className="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2">
                <ArrowRightLeft className="text-blue-600" size={20}/> تحويل فوري بين الحسابات
              </h3>
              <button 
                type="button" 
                onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false })}
                className="p-2 hover:bg-red-50 hover:text-red-500 rounded-xl transition-colors"
              >
                <X size={24} />
              </button>
            </div>
            
            <form onSubmit={handleQuickTransfer} className="p-6 space-y-6">
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-bold mb-2 text-slate-500">من حساب:</label>
                  <select 
                    className="input-field"
                    value={quickTransferData.from}
                    onChange={(e) => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: e.target.value } })}
                  >
                    <option value="cash">النقدية</option>
                    <option value="fawry">فوري</option>
                    <option value="etisalat">اتصالات</option>
                    <option value="cib_savings">CIB توفير</option>
                    <option value="aaib_savings">AAIB توفير</option>
                  </select>
                </div>
                
                <div>
                  <label className="block text-sm font-bold mb-2 text-slate-500">إلى حساب:</label>
                  <select 
                    className="input-field"
                    value={quickTransferData.to}
                    onChange={(e) => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { to: e.target.value } })}
                  >
                    <option value="fawry">فوري</option>
                    <option value="etisalat">اتصالات</option>
                    <option value="cash">النقدية</option>
                    <option value="cib_savings">CIB توفير</option>
                    <option value="aaib_savings">AAIB توفير</option>
                  </select>
                </div>
              </div>
              
              <div>
                <label className="block text-sm font-bold mb-2 text-slate-500">المبلغ (ج.م):</label>
                <input
                  type="number"
                  min="0"
                  step="0.01"
                  className="input-field text-xl font-black"
                  value={quickTransferData.amount}
                  onChange={(e) => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: e.target.value } })}
                  placeholder="0.00"
                  autoFocus
                />
              </div>
              
              <div className="flex gap-4">
                <button
                  type="button"
                  onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false })}
                  className="flex-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 py-3 rounded-xl font-bold transition-colors"
                >
                  إلغاء
                </button>
                <button
                  type="submit"
                  disabled={isProcessing}
                  className={`flex-1 py-3 rounded-xl font-bold transition-all ${isProcessing ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'gradient-bg-primary text-white hover:shadow-lg'}`}
                >
                  {isProcessing ? 'جاري التحويل...' : 'تأكيد التحويل'}
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* Main Content */}
      <main ref={mainContentRef} className="flex-1 overflow-y-auto pb-32 pt-12 px-4 md:px-8">
        <div className="max-w-7xl mx-auto">
          {activeTab === 'dashboard' && renderDashboard()}
          {activeTab === 'calendar' && renderCalendarView()}
        </div>
      </main>

      {/* Bottom Navigation */}
      <div className="bottom-nav-container">
        <div className="scrollable-nav">
          <button 
            type="button"
            className={`nav-btn ${activeTab === 'dashboard' ? 'active' : ''}`}
            onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'dashboard' })}
          >
            <LayoutDashboard size={24} />
            <span>لوحة التحكم</span>
          </button>
          
          <button 
            type="button"
            className={`nav-btn ${activeTab === 'calendar' ? 'active' : ''}`}
            onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'calendar' })}
          >
            <CalendarDays size={24} />
            <span>المواعيد</span>
          </button>
          
          <div className="v-line"></div>
          
          <button 
            type="button"
            className={`nav-btn ${activeTab === 'categories' ? 'active' : ''}`}
            onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'categories' })}
          >
            <Layers size={24} />
            <span>الفئات</span>
          </button>
          
          <button 
            type="button"
            className={`nav-btn ${activeTab === 'loans' ? 'active' : ''}`}
            onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'loans' })}
          >
            <Banknote size={24} />
            <span>الديون</span>
          </button>
          
          <button 
            type="button"
            className={`nav-btn ${activeTab === 'cards' ? 'active' : ''}`}
            onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: 'cards' })}
          >
            <CreditCard size={24} />
            <span>البطاقات</span>
          </button>
        </div>
      </div>

      {/* FAB Button */}
      <button
        type="button"
        className="fab"
        onClick={() => {
          dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
          dispatch({ type: 'SET_FORM_DATA', payload: { 
            type: 'expense', 
            amount: '', 
            date: getLocalISODate(), 
            month: selectedMonth, 
            method: 'cash', 
            subType: 'withdrawal',
            category: ''
          } });
          dispatch({ type: 'SET_FORM_OPEN', payload: true });
        }}
      >
        <Plus size={28} />
      </button>
    </div>
  );
}

const rootElement = document.getElementById('root');
if(rootElement) {
  setTimeout(() => {
    const loadingElement = document.getElementById('loading');
    if (loadingElement) {
      loadingElement.style.display = 'none';
    }
  }, 2000);

  createRoot(rootElement).render(
    <ErrorBoundary>
