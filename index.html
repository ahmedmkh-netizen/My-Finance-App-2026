/* ─────────────── Safe Utilities ─────────────── */
const safeParseJson = (raw, fallback) => {
  if (raw === null || raw === undefined) return fallback;
  try { const v = JSON.parse(raw); return v === null || v === undefined ? fallback : v; }
  catch (e) { console.warn('safeParseJson failed:', e); return fallback; }
};

const escapeHtml = (u) => { 
  if (typeof u !== 'string') return u; 
  return u.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); 
};

const getSafeId = () => { 
  try { return crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2, 11)}`; } 
  catch { return `${Date.now()}-${Math.random().toString(36).slice(2, 11)}`; } 
};

const normalizeText = (t) => !t ? "" : t.toString()
  .replace(/[أإآ]/g,'ا')
  .replace(/ى/g,'ي')
  .replace(/ة/g,'ه')
  .replace(/[\u064B-\u065F]/g,'')
  .replace(/\s+/g,' ')
  .trim().toLowerCase();

const toEnglishDigits = (s) => { 
  if (s === null || s === undefined) return s; 
  const map = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9' }; 
  return String(s).replace(/[٠-٩۰-۹]/g, d => map[d]); 
};

const parseNumberInput = (v) => { 
  const cleaned = toEnglishDigits(v).replace(/[^\d.\-]/g, ''); 
  const n = Number(cleaned); 
  return isNaN(n) ? 0 : n; 
};

/* ─────────────── Date Helpers ─────────────── */
const getLocalISODate = (d = new Date()) => 
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const dayStart = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const endOfToday = () => { const x = new Date(); x.setHours(23,59,59,999); return x; };

const calculateDaysLeft = (d) => { 
  if (!d) return null; 
  try { 
    const t = new Date(); t.setHours(0,0,0,0); 
    const g = new Date(d); g.setHours(0,0,0,0); 
    return Math.ceil((g-t)/86400000); 
  } catch { return null; } 
};

const parseISODate = (iso) => {
  if (!iso) return null;
  if (iso instanceof Date) return isNaN(iso) ? null : iso;
  const s = String(iso);
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if (m) {
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d) ? null : d;
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
};

/* ─────────────── Month Key Helpers ─────────────── */
const makeMonthKey = (year, month) => `${year}-${month}`;
const parseMonthKey = (key) => { 
  if (!key || typeof key !== 'string' || !key.includes('-')) return null; 
  const [y, ...rest] = key.split('-'); 
  const year = Number(y); 
  if (isNaN(year)) return null; 
  return { year, month: rest.join('-') }; 
};

const inputMonthToKey = (v) => { 
  if (!v || !/^\d{4}-\d{2}$/.test(String(v))) return null; 
  const [y, m] = String(v).split('-').map(Number); 
  if (m < 1 || m > 12 || isNaN(y)) return null; 
  return `${y}-${ALL_MONTHS_EARLY[m - 1]}`; 
};

const keyToInputMonth = (k) => { 
  if (!k || typeof k !== 'string') return ''; 
  const idx = k.indexOf('-'); 
  if (idx < 0) return ''; 
  const y = k.slice(0, idx); 
  const mName = k.slice(idx + 1); 
  const mIdx = ALL_MONTHS_EARLY.indexOf(mName); 
  if (mIdx < 0 || !/^\d{4}$/.test(y)) return ''; 
  return `${y}-${String(mIdx + 1).padStart(2, '0')}`; 
};

/* ═══════════════════════════════════════════════════════════════
   Bank SMS Parser
   ═══════════════════════════════════════════════════════════════ */
const parseBankSms = (rawInput) => {
  const result = { 
    ok: false, bank: '', bankId: null, last4: null, amount: 0, type: 'expense', 
    subType: 'withdrawal', date: getLocalISODate(), method: null, linkedCardId: null, 
    accountKind: null, cardLabel: '', description: '', balance: null, 
    rawText: String(rawInput || ''), notes: [] 
  };
  
  if (!rawInput || typeof rawInput !== 'string' || rawInput.trim().length < 5) { 
    result.notes.push('النص قصير جداً'); return result; 
  }
  
  const text = toEnglishDigits(rawInput).replace(/\u00A0/g, ' ');

  if (/\b(OTP|one[\s-]?time|verification\s+code|رمز\s+(التحقق|التأكيد)|do\s+not\s+share)\b/i.test(text)) {
    result.notes.push('❌ هذه رسالة تحقق (OTP) — لا يمكن تسجيلها كمعاملة');
    return result;
  }

  if (/\bCIB\b|Commercial International|SWYPE|Titanium|سي آي بي/i.test(text)) { result.bank = 'CIB'; result.bankId = 'cib'; }
  else if (/\bAAIB\b|Arab African|العربي الأفريقي|العربي الافريقي|الإفريقي الدولي/i.test(text)) { result.bank = 'AAIB'; result.bankId = 'aaib'; }
  
  const last4Patterns = [
    /\b(?:ending|ends)\s*(?:with\s*)?(\d{4})\b/i,
    /\bcard\s*(?:no\.?|number|#)?\s*[:\-]?\s*(?:\*{2,}|\.{2,}|x{2,})?\s*(\d{4})\b/i,
    /(?:\*{2,}|\.{2,}|x{2,})\s*(\d{4})\b/i,
    /رقم\s*(?:\*{2,}|\.{2,})?\s*(\d{4})\b/,
    /بطاق[ةه]\s*(?:رقم\s*)?(?:\*{2,}|\.{2,})?\s*(\d{4})\b/,
    /(?:acct|account|حساب)\s*(?:no\.?|number|#)?\s*[:\-]?\s*(?:\*{2,}|\.{2,}|x{2,})?\s*(\d{4})\b/i
  ];
  for (const p of last4Patterns) { 
    const m = text.match(p); 
    if (m) { result.last4 = m[1]; break; } 
  }
  
  const incomeHints = [/\bcredit(?:ed)?\b/i, /\bdeposit(?:ed)?\b/i, /\breceived\b/i, /\bsalary\b/i, /\brefund\b/i, /\breimbursement\b/i, /\bcashback\b/i, /\badded\b/i, /إيداع/, /تم إيداع/, /أضيف/, /تم إضافة/, /راتب/, /استرداد/, /كاش باك/, /وارد/, /دائن/];
  const expenseHints = [/\bdebit(?:ed)?\b/i, /\bpurchase\b/i, /\bwithdraw(?:al|n)?\b/i, /\bpaid\b/i, /\bpayment\b/i, /\bcharge[d]?\b/i, /\bspent\b/i, /\batm\b/i, /خصم/, /تم خصم/, /سحب/, /شراء/, /دفع/, /مدفوع/, /صادر/, /استخدام/, /مدين/];
  
  const isIncome = incomeHints.some(r => r.test(text));
  const isExpense = expenseHints.some(r => r.test(text));
  
  if (isIncome && !isExpense) { result.type = 'income'; result.subType = 'deposit'; }
  else if (isExpense && !isIncome) { result.type = 'expense'; result.subType = 'withdrawal'; }
  else if (isIncome && isExpense) { result.notes.push('نوع العملية غير واضح — تم افتراض مصروف'); }
  else { result.notes.push('لم يتم التعرف على نوع العملية'); }

  const cur = '(?:EGP|LE|E£|ج\\.?م|جنيه|جم|ق\\.?م|ريال|SAR|USD|AED|درهم|دينار|\\$)';
  const amtPatterns = [
    new RegExp(`${cur}\\s*([0-9][0-9,]*\\.?[0-9]*)`, 'i'),
    new RegExp(`([0-9][0-9,]*\\.?[0-9]*)\\s*${cur}`, 'i'),
    /(?:amount|for|of|بقيمة|بمبلغ|مبلغ)\s*[:\s]*([0-9][0-9,]*\.?[0-9]*)/i
  ];
  
  for (const p of amtPatterns) {
    const m = text.match(p);
    if (m) {
      const n = Number(m[1].replace(/,/g, ''));
      if (n >= 1 && n < 100000000) { result.amount = n; break; }
    }
  }
  
  if (!result.amount) {
    const decimalMatches = text.match(/\b\d{1,8}\.\d{2}\b/g) || [];
    const decNums = decimalMatches.map(s => Number(s)).filter(n => n >= 1 && n < 100000000);
    if (decNums.length === 1) { result.amount = decNums[0]; result.notes.push('تم استخراج المبلغ من الصيغة العشرية — راجعه'); }
    else if (decNums.length > 1) {
      result.amount = Math.max(...decNums);
      result.notes.push(`تم اختيار أكبر مبلغ عشري (${decNums.length} مرشح) — راجعه`);
    } else {
      const all = text.match(/[0-9][0-9,]*\.?[0-9]*/g) || [];
      const nums = all.map(s => Number(s.replace(/,/g, ''))).filter(n => n >= 10 && n < 1000000 && String(n).length < 10);
      if (nums.length === 1) { result.amount = nums[0]; result.notes.push('تم استخراج المبلغ — راجعه'); }
      else if (nums.length > 1) { result.notes.push(`⚠️ ${nums.length} أرقام محتملة — اختر المبلغ يدوياً`); }
    }
  }
  
  const balMatch = text.match(/(?:balance|الرصيد|رصيد)[^\d]{0,20}([0-9][0-9,]*\.?[0-9]*)/i);
  if (balMatch) { 
    const b = Number(balMatch[1].replace(/,/g, '')); 
    if (b > 0 && b !== result.amount) result.balance = b; 
  }

  const now = new Date();
  let parsedDate = null;
  const MONTHS_EN = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
  const MONTHS_AR = { 'يناير':1,'فبراير':2,'مارس':3,'أبريل':4,'ابريل':4,'مايو':5,'يونيو':6,'يوليو':7,'أغسطس':8,'اغسطس':8,'سبتمبر':9,'أكتوبر':10,'اكتوبر':10,'نوفمبر':11,'ديسمبر':12 };
  
  let m = text.match(/\b(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})\b/);
  if (m) { 
    const d = +m[1], mo = +m[2]; 
    let y = +m[3]; 
    if (y < 100) y += 2000; 
    if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12 && y >= 2020 && y <= 2100) parsedDate = new Date(y, mo - 1, d); 
  }
  
  if (!parsedDate) { 
    m = text.match(/\b(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})\b/); 
    if (m) { 
      const y = +m[1], mo = +m[2], d = +m[3]; 
      if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12 && y >= 2020 && y <= 2100) parsedDate = new Date(y, mo - 1, d); 
    } 
  }
  
  if (!parsedDate) { 
    m = text.match(/\b(\d{1,2})[\s\-]*([A-Za-z]{3,9})[\s\-]*(\d{2,4})\b/); 
    if (m) { 
      const mo = MONTHS_EN[m[2].toLowerCase().slice(0, 3)]; 
      if (mo) { 
        let y = +m[3]; 
        if (y < 100) y += 2000; 
        parsedDate = new Date(y, mo - 1, +m[1]); 
      } 
    } 
  }
  
  if (!parsedDate) { 
    const arNames = Object.keys(MONTHS_AR).join('|'); 
    const re = new RegExp(`(\\d{1,2})\\s*(${arNames})\\s*(\\d{2,4})`); 
    m = text.match(re); 
    if (m) { 
      const mo = MONTHS_AR[m[2]]; 
      let y = +m[3]; 
      if (y < 100) y += 2000; 
      parsedDate = new Date(y, mo - 1, +m[1]); 
    } 
  }
  
  if (parsedDate && !isNaN(parsedDate) && parsedDate <= now) result.date = getLocalISODate(parsedDate);
  else { 
    result.date = getLocalISODate(now); 
    if (parsedDate && !isNaN(parsedDate) && parsedDate > now) result.notes.push('التاريخ في المستقبل — تم استخدام اليوم'); 
  }

  const merchantPatterns = [
    /\bat\s+([A-Z][A-Z0-9\s&'\.\-]{2,40}?)(?:\s+on\s|\s+at\s|\s*[\.\,\n]|$)/i,
    /\b(?:merchant|from|to)\s*[:\-]?\s*([A-Z][A-Z0-9\s&'\.\-]{2,40}?)(?:\s+on\s|\s*[\.\,\n]|$)/i,
    /لدى\s+([^\.,\n]{2,40}?)(?:\s+يوم|\s+بتاريخ|\s*[\.\,\n]|$)/,
    /في\s+([^\.,\n]{2,40}?)(?:\s+يوم|\s+بتاريخ|\s*[\.\,\n]|$)/
  ];
  
  for (const p of merchantPatterns) { 
    const mm = text.match(p); 
    if (mm && mm[1]) { 
      const desc = mm[1].trim().replace(/\s+/g, ' '); 
      if (desc.length >= 2 && !/^\d+$/.test(desc)) { result.description = desc; break; } 
    } 
  }
  
  if (!result.description) { 
    const caps = text.match(/\b[A-Z][A-Z0-9&'\.\-]{2,}(?:\s+[A-Z][A-Z0-9&'\.\-]{2,}){0,4}\b/g) || []; 
    const filtered = caps.filter(w => !/^(CIB|AAIB|EGP|LE|ATM|SMS|OTP|REF|SWYPE|TITANIUM|SIGNATURE|MASTERCARD|VISA|USD|SAR|AED|THE|AND|FOR|OF|ON|AT|YOUR|CARD|WAS|USED)$/i.test(w)); 
    if (filtered.length) result.description = filtered[0].trim(); 
  }
  
  if (result.last4 && CARD_LAST4_MAP[result.last4]) {
    const mapping = CARD_LAST4_MAP[result.last4];
    result.method = mapping.method;
    result.linkedCardId = mapping.linkedCardId;
    result.bank = mapping.bank;
    result.accountKind = mapping.kind;
    result.cardLabel = mapping.label || '';
    if (mapping.kind === 'account') result.notes.push(`✅ تم التعرف: ${mapping.label} (حساب بنكي)`);
    else if (mapping.kind === 'subcard') result.notes.push(`✅ بطاقة فرعية (${result.last4}) تابعة لبطاقة Titanium`);
    else if (mapping.kind === 'card') result.notes.push(`✅ تم التعرف: ${mapping.label}`);
  }
  else if (result.bankId === 'cib') { result.method = 'cib_card'; result.linkedCardId = 1; result.notes.push('⚠️ لم يتم التعرف على البطاقة — تم افتراض Titanium'); }
  else if (result.bankId === 'aaib') { result.method = 'aaib_card'; result.linkedCardId = 2; result.notes.push('⚠️ لم يتم التعرف على البطاقة — تم افتراض Signature'); }
  
  if (/\bTelda\b|تيلدا/i.test(text)) {
    const personMatch = text.match(/(?:to|لـ|إلى)\s*(Shaimaa|Salma|Abdelrahman|شيماء|سلمى|عبد الرحمن)/i);
    if (personMatch) {
      const p = personMatch[1].toLowerCase();
      if (p === 'shaimaa' || p === 'شيماء') { result.method = 'telda_shaimaa'; result.description = result.description || 'تحويل Telda - شيماء'; }
      else if (p === 'salma' || p === 'سلمى') { result.method = 'telda_salma'; result.description = result.description || 'تحويل Telda - سلمى'; }
      else if (p === 'abdelrahman' || p === 'عبد الرحمن') { result.method = 'telda_abdelrahman'; result.description = result.description || 'تحويل Telda - عبد الرحمن'; }
    }
  }
  
  result.ok = result.amount > 0;
  if (!result.ok) result.notes.push('لم يتم العثور على مبلغ صالح — أدخله يدوياً');
  if (!result.method) result.notes.push('لم يتم التعرف على البطاقة — اختر يدوياً');
  if (!result.description) result.description = result.type === 'income' ? 'دخل من SMS' : 'مصروف من SMS';
  return result;
};

/* ═══════════════════════════════════════════════════════════════
   Validation
   ═══════════════════════════════════════════════════════════════ */
const VALIDATION = { 
  AMOUNT: { min: 0.01, max: 10000000, label: 'المبلغ' }, 
  POSITIVE_INT: { min: 1, max: 31, label: 'الرقم' }, 
  TEXT: { min: 1, max: 500, label: 'النص' }, 
  LIMIT: { min: 100, max: 10000000, label: 'الحد الائتماني' }, 
  INSTALLMENT: { min: 0, max: 10000000, label: 'القسط' } 
};

const validateAmount = (raw, opts = {}) => {
  const cfg = { ...VALIDATION.AMOUNT, ...opts };
  const cleaned = toEnglishDigits(String(raw ?? '')).replace(/[^\d.\-]/g, '');
  const n = parseFloat(cleaned);
  if (isNaN(n) || !isFinite(n)) return { valid: false, error: 'اكتب رقم صحيح', value: 0 };
  if (n < cfg.min) return { valid: false, error: `الحد الأدنى ${fmt(cfg.min)} ج.م`, value: 0 };
  if (n > cfg.max) return { valid: false, error: `الحد الأقصى ${fmt(cfg.max)} ج.م`, value: 0 };
  return { valid: true, value: n };
};

const validateText = (raw, opts = {}) => { 
  const cfg = { ...VALIDATION.TEXT, ...opts }; 
  const s = String(raw || '').trim(); 
  if (s.length < cfg.min) return { valid: false, error: `${cfg.label} مطلوب` }; 
  if (s.length > cfg.max) return { valid: false, error: `${cfg.label} طويل جداً` }; 
  return { valid: true, value: s }; 
};

const validateDate = (raw) => { 
  if (!raw) return { valid: false, error: 'التاريخ مطلوب' }; 
  const d = parseISODate(raw); 
  if (!d) return { valid: false, error: 'تاريخ غير صالح' }; 
  const year = d.getFullYear(); 
  if (year < 2020 || year > 2100) return { valid: false, error: 'السنة خارج النطاق' }; 
  return { valid: true, value: d }; 
};

/* ═══════════════════════════════════════════════════════════════
   PIN — PBKDF2
   ═══════════════════════════════════════════════════════════════ */
const hashPin = async (pin) => {
  if (!crypto?.subtle?.importKey || !crypto?.subtle?.deriveBits) {
    throw new Error('هذا المتصفح لا يدعم التشفير الآمن. حدّث المتصفح.');
  }
  try {
    const encoder = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', encoder.encode(String(pin)), 'PBKDF2', false, ['deriveBits']
    );
    const salt = encoder.encode('fintracker_salt_v2_2026');
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial, 256
    );
    return 'pbkdf2_' + Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    console.error('hashPin failed:', e);
    throw new Error('فشل تشفير الرمز');
  }
};

const getStoredPinHash = () => localStorage.getItem(PIN_HASH_KEY);

const savePinHash = async (pin) => { 
  const hash = await hashPin(pin); 
  localStorage.setItem(PIN_HASH_KEY, hash); 
};

const verifyPin = async (pin) => { 
  const stored = getStoredPinHash(); 
  if (!stored) return pin === DEFAULT_PIN;
  if (stored.startsWith('plain_') || !stored.startsWith('pbkdf2_')) {
    console.warn('Old PIN hash format detected, resetting...');
    localStorage.removeItem(PIN_HASH_KEY);
    return pin === DEFAULT_PIN;
  }
  try {
    const current = await hashPin(pin);
    return current === stored;
  } catch { return false; }
};

/* ═══════════════════════════════════════════════════════════════
   Receipt / Cloudinary
   ═══════════════════════════════════════════════════════════════ */
const MAX_RECEIPT_SIZE_MB = 5;

const compressImage = (file, maxWidth = 1280, quality = 0.75) => new Promise((resolve, reject) => {
  if (!file.type.startsWith('image/')) return reject(new Error('الملف ليس صورة'));
  if (file.size > MAX_RECEIPT_SIZE_MB * 1024 * 1024) return reject(new Error(`حجم الصورة أكبر من ${MAX_RECEIPT_SIZE_MB}MB`));
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let { width, height } = img;
      if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('فشل الضغط')), 'image/jpeg', quality);
    };
    img.onerror = () => reject(new Error('فشل قراءة الصورة'));
    img.src = e.target.result;
  };
  reader.onerror = () => reject(new Error('فشل قراءة الملف'));
  reader.readAsDataURL(file);
});

const uploadReceipt = async (txId, file) => {
  const blob = await compressImage(file);
  const formData = new FormData();
  formData.append('file', blob, `${txId}_${Date.now()}.jpg`);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  formData.append('folder', `receipts/${txId}`);
  formData.append('public_id', `${Date.now()}_${Math.random().toString(36).slice(2,8)}`);
  const res = await fetch(CLOUDINARY_UPLOAD_URL, { method: 'POST', body: formData });
  if (!res.ok) { const errText = await res.text(); console.error('Cloudinary Error:', errText); throw new Error('فشل رفع الصورة'); }
  const data = await res.json();
  return { url: data.secure_url, path: data.public_id, name: file.name, size: data.bytes };
};

const deleteReceipt = async (path) => { 
  if (!path) return { success: false, reason: 'no_path' }; 
  try { 
    try { 
      const orphans = safeParseJson(localStorage.getItem('cloudinary_orphans'), []); 
      orphans.push({ path, deletedAt: new Date().toISOString() }); 
      if (orphans.length > 200) orphans.splice(0, orphans.length - 200); 
      localStorage.setItem('cloudinary_orphans', JSON.stringify(orphans)); 
    } catch {} 
    return { success: true, reason: 'marked_orphan', path }; 
  } catch (e) { return { success: false, reason: 'error', error: e.message }; } 
};

/* ═══════════════════════════════════════════════════════════════
   Business helpers

const getDefaultMonthYear = () => {
  const now = new Date();
  const y = now.getFullYear();
  const m = ALL_MONTHS[now.getMonth()];
  if (YEARS_CONFIG[y] && YEARS_CONFIG[y].includes(m)) return { year: y, month: m };
  return { year: PROJECT_START_YEAR, month: PROJECT_START_MONTH };
};

const inferKind = (tx) => { 
  if (tx.kind) return tx.kind; 
  if (tx.category === 'أخرى' && (tx.description || '').includes('تسوية')) return KIND.ADJUSTMENT; 
  if (FINANCIAL_CATEGORIES.has(tx.category)) return KIND.FINANCIAL; 
  return KIND.OPERATIONAL; 
};

const isBankFee = (tx) => BANK_FEE_CATEGORIES.has(tx?.category);
const isBeneficiaryCategorySafe = (cat) => typeof cat === 'string' && cat.startsWith('مصروف شهري - ');
const isMonthClosed = (data, year, month) => { 
  const key = makeMonthKey(year, month); 
  return Array.isArray(data?.closedMonths) && data.closedMonths.includes(key); 
};

const invalidateSnapshotsFrom = (snapshots, year, month) => {
  const startIdx = getMonthIndex(month);
  if (startIdx < 0) return { snapshots: snapshots || {}, invalidated: 0 };
  const newSnaps = { ...(snapshots || {}) };
  let invalidated = 0;
  Object.keys(newSnaps).forEach(key => {
    const parsedKey = parseMonthKey(key);
    if (!parsedKey) return;
    if (parsedKey.year > year || (parsedKey.year === year && getMonthIndex(parsedKey.month) >= startIdx)) {
      delete newSnaps[key];
      invalidated++;
    }
  });
  return { snapshots: newSnaps, invalidated };
};

const getAccountCutoff = (accountsData, key) => { 
  const iso = accountsData?.[key]?.lastUpdated; 
  const d = parseISODate(iso); 
  return d || new Date(0); 
};

/* ═══════════════════════════════════════════════════════════════
   Balance Computation
   ═══════════════════════════════════════════════════════════════ */
const computeBalance = (data, key, asOfDate) => {
  const accountsData = data?.accountsData || DEFAULT_ACCOUNTS;
  const base = safeNumber(accountsData[key]?.balance);
  const cutoffDay = dayStart(getAccountCutoff(accountsData, key));
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();
  const backward = upper < cutoffDay;
  let bal = base;
  (data?.transactions || []).forEach(t => {
    if (t.status !== 'paid' || t.method !== key) return;
    const d = parseISODate(t.date);
    if (!d) return;
    const amt = safeNumber(t.amount);
    const signed = (t.subType === 'deposit') ? amt : -amt;
    if (backward) { if (d > upper && d < cutoffDay) bal -= signed; }
    else { if (d >= cutoffDay && d <= upper) bal += signed; }
  });
  return bal;
};

const getCardMethod = (card) => { 
  if (!card) return null; 
  if (card.bank === 'CIB' && card.name === 'SWYPE') return 'cib_swype'; 
  if (card.bank === 'AAIB') return 'aaib_card'; 
  return 'cib_card'; 
};

const computeCardDebt = (data, card, asOfDate) => {
  if (!card) return 0;
  const method = getCardMethod(card);
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();
  let debt = safeNumber(card.openingDebt);
  (data?.transactions || []).forEach(t => {
    if (t.status !== 'paid') return;
    const d = parseISODate(t.date);
    if (!d || d > upper) return;
    const amt = safeNumber(t.amount);
    let belongsToCard = false;
    const hasExplicitCardLink = (t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== '');
    if (hasExplicitCardLink) { belongsToCard = (t.linkedCardId === card.id); }
    else if (t.cardLast4 && subCards.includes(t.cardLast4)) { belongsToCard = true; }
    else { belongsToCard = (t.method === method); }
    if (!belongsToCard) return;
    if (t.type === 'expense') { debt += amt; return; }
    if (t.type === 'income') { debt -= amt; return; }
  });
  return Math.max(0, debt);
};

const getClosingBalance = (data, key, year, month) => {
  const monthKey = makeMonthKey(year, month);
  const snap = data?.monthlySnapshots?.[monthKey]?.[key];
  if (snap !== undefined && snap !== null) return safeNumber(snap);
  const monthIdx = getMonthIndex(month);
  if (monthIdx < 0) return computeBalance(data, key);
  const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
  return computeBalance(data, key, monthEnd);
};

const getOpeningBalance = (data, key, year, month) => {
  const idx = getMonthIndex(month);
  if (year < PROJECT_START_YEAR) return safeNumber(data?.accountsData?.[key]?.balance);
  if (year === PROJECT_START_YEAR && idx <= getMonthIndex(PROJECT_START_MONTH)) return safeNumber(data?.accountsData?.[key]?.balance);
  if (idx <= 0) return getClosingBalance(data, key, year - 1, 'ديسمبر');
  return getClosingBalance(data, key, year, ALL_MONTHS[idx - 1]);
};

const deriveDefaultCutoff = (txs) => { 
  const dates = (txs || []).filter(t => t.status === 'paid' && t.date).map(t => t.date).sort(); 
  if (dates.length === 0) return '2026-08-31'; 
  const d = parseISODate(dates[0]); 
  if (!d) return '2026-08-31'; 
  d.setDate(d.getDate() - 1); 
  return getLocalISODate(d); 
};

/* ═══════════════════════════════════════════════════════════════
   Custody + Cashback
   ═══════════════════════════════════════════════════════════════ */
const computeCustodyBalance = (entries) => {
  if (!Array.isArray(entries)) return { received: 0, transferred: 0, spentCash: 0, spentCard: 0, settled: 0, balance: 0, totalSpent: 0 };
  let received = 0, transferred = 0, spentCash = 0, spentCard = 0, settled = 0;
  entries.forEach(e => {
    const amt = safeNumber(e.amount);
    switch (e.type) {
      case CUSTODY_TYPE.RECEIVE: received += amt; break;
      case CUSTODY_TYPE.TRANSFER: transferred += amt; break;
      case CUSTODY_TYPE.SPEND_CASH: spentCash += amt; break;
      case CUSTODY_TYPE.SPEND_CARD: spentCard += amt; break;
      case CUSTODY_TYPE.SETTLE: settled += amt; break;
    }
  });
  const totalSpent = spentCash + spentCard;
  const balance = received - transferred - totalSpent - settled;
  return { received, transferred, spentCash, spentCard, settled, balance, totalSpent };
};

const computeCashbackSummary = (trackers) => { 
  if (!Array.isArray(trackers)) return { expected: 0, received: 0, pending: 0, list: [] }; 
  const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0); 
  const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0); 
  return { expected, received, pending: expected - received, list: trackers }; 
};

/* ═══════════════════════════════════════════════════════════════
   Migration helpers
   ═══════════════════════════════════════════════════════════════ */
const mergeById = (existing, defaults) => {
  if (!Array.isArray(existing) || existing.length === 0) return defaults;
  const merged = [...existing];
  defaults.forEach(d => {
    if (!merged.some(e => e.id === d.id || (e.systemId && d.systemId && e.systemId === d.systemId))) merged.push(d);
  });
  return merged;
};

const migrateCards = (cards) => {
  if (!Array.isArray(cards)) return DEFAULT_CARDS;
  return cards.map(c => {
    const migrated = { ...c };
    if (!Array.isArray(migrated.subCardLast4)) migrated.subCardLast4 = [];
    if (migrated.id === 2 && String(migrated.last4) === '0391') migrated.last4 = '3391';
    if (migrated.id === 1 && migrated.name === 'Titanium' && migrated.subCardLast4.length === 0) { migrated.subCardLast4 = ['9380', '9352', '2014']; }
    if (c.openingDebt !== undefined && c.availableBalance !== undefined) { 
      return { ...migrated, cashbackRate: c.cashbackRate !== undefined ? safeNumber(c.cashbackRate) : 1 }; 
    }
    const limit = safeNumber(c.limit); 
    const oldOpening = safeNumber(c.openingBalance);
    return { ...migrated, openingDebt: Math.max(0, limit - oldOpening), availableBalance: oldOpening, cashbackRate: safeNumber(c.cashbackRate, 1) };
  });
};

const migrateSnapshotsAndClosed = (snapshots, closedMonths) => {
  let snaps = snapshots && typeof snapshots === 'object' ? { ...snapshots } : {};
  let closed = Array.isArray(closedMonths) ? [...closedMonths] : [];
  if (Object.keys(snaps).length > 0 && !Object.keys(snaps).every(k => /^\d{4}-/.test(k))) {
    const migrated = {};
    Object.entries(snaps).forEach(([month, val]) => { 
      if (/^\d{4}-/.test(month)) migrated[month] = val; 
      else migrated[makeMonthKey(2026, month)] = (typeof val === 'object' && val !== null) ? val : { cash: safeNumber(val) }; 
    });
    snaps = migrated;
  }
  if (closed.length > 0 && !closed.every(k => /^\d{4}-/.test(k))) { 
    closed = closed.map(m => /^\d{4}-/.test(m) ? m : makeMonthKey(2026, m)); 
  }
  return { snapshots: snaps, closedMonths: closed };
};

const migrateTransaction = (t) => {
  if (!t) return t;
  const kind = inferKind(t);
  let year = t.year, month = t.month, monthIndex = t.monthIndex;
  if (t.date && (!month || !year)) { 
    const d = parseISODate(t.date); 
    if (d) { if (!year) year = d.getFullYear(); if (!month) month = ALL_MONTHS[d.getMonth()]; } 
  }
  if (!year) year = 2026;
  if (monthIndex === undefined || monthIndex === null || monthIndex < 0) monthIndex = getMonthIndex(month);
  if (monthIndex < 0 && month) { 
    const norm = ALL_MONTHS.find(m => normalizeText(m) === normalizeText(month)); 
    if (norm) { month = norm; monthIndex = getMonthIndex(norm); } 
  }
  let subType = t.subType;
  if (!subType) subType = t.type === 'income' ? 'deposit' : 'withdrawal';
  return { ...t, kind, year, month, monthIndex, subType, receipts: Array.isArray(t.receipts) ? t.receipts : [] };
};

const migrateRecurringItems = (items) => {
  if (!Array.isArray(items)) return DEFAULT_RECURRING;
  return items.map(r => {
    const migrated = { ...r };
    if (migrated.active === undefined) migrated.active = true;
    if (migrated.startMonth && !/^\d{4}-\d{2}$/.test(migrated.startMonth)) migrated.startMonth = keyToInputMonth(migrated.startMonth) || null;
    if (migrated.endMonth && !/^\d{4}-\d{2}$/.test(migrated.endMonth)) migrated.endMonth = keyToInputMonth(migrated.endMonth) || null;
    if (migrated.startMonth === undefined) migrated.startMonth = null;
    if (migrated.endMonth === undefined) migrated.endMonth = null;
    if (r.title && r.title.includes('تكييف محمود') && !migrated.linkedLoanSystemId) migrated.linkedLoanSystemId = SYSTEM_LOAN_IDS.TAKYEEF;
    if (!migrated.transferChannel && r.category && r.category.startsWith('مصروف شهري - ')) {
      const ben = BENEFICIARIES.find(b => `مصروف شهري - ${b.label}` === r.category);
      if (ben && ben.hasTelda) migrated.transferChannel = ben.method;
    }
    return migrated;
  });
};

const METHOD_BY_CATEGORY = {

  'الالتزامات البنكية والتمويلية': 'aaib_savings', 
  'الصحة والرعاية الطبية': 'cash', 
  'مصروف شهري - شيماء': 'cib_savings', 
  'مصروف شهري - سلمى': 'cib_savings', 
  'مصروف شهري - عبد الرحمن': 'cib_savings', 
  'مصروف شهري - أنس': 'cash'
};

const migrateData = (parsed) => {
  if (!parsed) return parsed;

  const deletedDefaultIds = Array.isArray(parsed.deletedDefaultIds) ? parsed.deletedDefaultIds : [];
  const deletedSet = new Set(deletedDefaultIds);

  const incomingCards = Array.isArray(parsed.cards) ? parsed.cards : [];
  const cardsFilteredDefaults = DEFAULT_CARDS.filter(c => !deletedSet.has(c.id));
  const mergedCards = mergeById(migrateCards(incomingCards), cardsFilteredDefaults);

  const incomingLoans = Array.isArray(parsed.loans) ? parsed.loans : [];
  const processedLoans = incomingLoans.map(l => {
    if (isTakyeefLoan(l)) return { 
      ...l, 
      systemId: SYSTEM_LOAN_IDS.TAKYEEF, 
      isReceivable: true, 
      type: 'receivable', 
      interest: 'مستحق لنا شهرياً', 
      paused: !!l.paused, 
      totalInstallments: safeNumber(l.totalInstallments, 12), 
      paidInstallments: safeNumber(l.paidInstallments, 1) 
    };
    if (isHanyLoan(l) && !l.autoMonthly) return { 
      ...l, 
      systemId: SYSTEM_LOAN_IDS.HANY, 
      autoMonthly: true, 
      dueNextMonth: true, 
      mergeIntoNextCycle: l.mergeIntoNextCycle || [PROJECT_START_MONTH_KEY], 
      category: l.category || 'مسحوبات محل هاني', 
      totalAmount: 0, 
      prePaidAmount: 0, 
      monthlyInstallment: 0, 
      dueDay: 5, 
      interest: 'مستحق شهري', 
      description: 'مسحوبات يومية', 
      type: 'debt' 
    };
    if (l && l.autoMonthly && !l.systemId) return { ...l, systemId: SYSTEM_LOAN_IDS.HANY };
    return l;
  });
  
  const loansFilteredDefaults = DEFAULT_LOANS.filter(l => !deletedSet.has(l.id) && !(l.systemId && deletedSet.has(l.systemId)));
  const mergedLoans = mergeById(processedLoans, loansFilteredDefaults);

  let { snapshots, closedMonths } = migrateSnapshotsAndClosed(parsed.monthlySnapshots, parsed.closedMonths);
  const incomingVersion = safeNumber(parsed.engineVersion, 1);
  if (incomingVersion < 10 && Object.keys(snapshots).length > 0) { snapshots = {}; }

  let transactions = Array.isArray(parsed.transactions) ? parsed.transactions.map(migrateTransaction) : [];
  transactions = transactions.map(t => {
    if (t.id && t.sourceRecurringId && t.year && t.month && /^rec-.+-\d{4}-.+-[a-z0-9-]{6,}$/i.test(t.id)) {
      return { ...t, id: `rec-${t.sourceRecurringId}-${makeMonthKey(t.year, t.month)}` };
    }
    return t;
  });

  const accountsData = parsed.accountsData && typeof parsed.accountsData === 'object' ? { ...DEFAULT_ACCOUNTS, ...parsed.accountsData } : { ...DEFAULT_ACCOUNTS };
  const defaultCutoff = deriveDefaultCutoff(transactions);
  const renamedLabels = { 'CIB توفير': 'CIB Savings', 'AAIB توفير': 'AAIB Savings', 'نقدي': 'Cash', 'فوري': 'Fawry', 'اتصالات': 'Etisalat' };
  
  ACCOUNT_KEYS.forEach(k => {
    if (!accountsData[k]?.lastUpdated) accountsData[k] = { ...(DEFAULT_ACCOUNTS[k] || {}), ...(accountsData[k] || {}), lastUpdated: defaultCutoff };
    if (accountsData[k] && accountsData[k].label && renamedLabels[accountsData[k].label]) accountsData[k] = { ...accountsData[k], label: renamedLabels[accountsData[k].label] };
    if (accountsData[k] && !accountsData[k].label) accountsData[k] = { ...accountsData[k], label: DEFAULT_ACCOUNTS[k].label };
    if (k === 'cib_savings' && !accountsData[k].last4) accountsData[k] = { ...accountsData[k], last4: '1809' };
    if (k === 'aaib_savings' && !accountsData[k].last4) accountsData[k] = { ...accountsData[k], last4: '2106' };
  });

  let recurringItems = Array.isArray(parsed.recurringItems) ? parsed.recurringItems : [];
  if (!parsed.recurringInitialized && recurringItems.length === 0) recurringItems = DEFAULT_RECURRING.slice();
  
  recurringItems = recurringItems.map(r => { 
    if (r && r.title && r.title.includes('تكييف محمود') && r.type !== 'income') 
      return { ...r, type: 'income', title: r.title.replace(/\s*\(دخل\)\s*$/, '') + ' (دخل)' }; 
    return r; 
  });
  
  const recurringIds = new Set(recurringItems.map(r => r.id));
  DEFAULT_RECURRING.forEach(dr => { if (!recurringIds.has(dr.id) && !deletedSet.has(dr.id)) recurringItems.push(dr); });
  recurringItems = migrateRecurringItems(recurringItems);
  recurringItems = recurringItems.map(r => {
    if (r.method) return r;
    if (r.linkedCardId) { 
      const card = DEFAULT_CARDS.find(c => c.id === r.linkedCardId); 
      return { ...r, method: card ? getCardMethod(card) : 'cash' }; 
    }
    const m = METHOD_BY_CATEGORY[r.category];
    return m ? { ...r, method: m } : { ...r, method: 'cash' };
  });

  const settledHanyMonths = Array.isArray(parsed.settledHanyMonths) ? parsed.settledHanyMonths : [];
  const deletedTxIds = Array.isArray(parsed.deletedTxIds) ? parsed.deletedTxIds.slice(-500) : [];

  const existingArchive = Array.isArray(parsed.deletedTxArchive) ? parsed.deletedTxArchive : [];
  const archiveIds = new Set(existingArchive.map(a => a.id).filter(Boolean));
  const migratedArchive = [...existingArchive];
  deletedTxIds.forEach(id => {
    if (!archiveIds.has(id)) {
      migratedArchive.push({ id, deletedAt: null, deletedBy: 'unknown', _legacy: true });
    }
  });
  const deletedTxArchive = migratedArchive.slice(-500);

  const { openingBalance2026: _drop, ...rest } = parsed;
  
  return {
    ...rest, 
    engineVersion: CURRENT_ENGINE_VERSION, 
    recurringInitialized: true,
    cards: mergedCards, 
    loans: mergedLoans,
    recurringItems, 
    closedMonths, 
    monthlySnapshots: snapshots, 
    transactions, 
    accountsData,
    monthlyPlans: parsed.monthlyPlans && typeof parsed.monthlyPlans === 'object' ? { ...DEFAULT_MONTHLY_PLANS, ...parsed.monthlyPlans } : DEFAULT_MONTHLY_PLANS,
    materializedRecurring: parsed.materializedRecurring && typeof parsed.materializedRecurring === 'object' ? parsed.materializedRecurring : {},
    custodyEntries: Array.isArray(parsed.custodyEntries) ? parsed.custodyEntries : DEFAULT_CUSTODY_ENTRIES,
    cashbackTrackers: Array.isArray(parsed.cashbackTrackers) ? parsed.cashbackTrackers : DEFAULT_CASHBACK_TRACKERS,
    settledHanyMonths, 
    deletedTxIds, 
    deletedTxArchive, 
    deletedDefaultIds,
    defaultsSeeded: true
  };
};

/* ═══════════════════════════════════════════════════════════════
   materializeRecurringItems — ID حتمي (مع إصلاح الفلترة)
   ═══════════════════════════════════════════════════════════════ */
const materializeRecurringItems = (data, asOfDateStr) => {
  if (!data?.recurringItems?.length) return null;
  
  const now = asOfDateStr ? new Date(asOfDateStr) : new Date();
  const nowYear = now.getFullYear();
  const nowMonth = ALL_MONTHS[now.getMonth()];
  const nowMonthKey = makeMonthKey(nowYear, nowMonth);
  const nowInputMonth = `${nowYear}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const permanentDeleted = new Set(data.deletedTxIds || []);
  const existing = (data.transactions || []).filter(t => !(permanentDeleted.has(t.id)));
  const materialized = { ...(data.materializedRecurring || {}) };
  const newTxs = [];
  const loanPaidMap = {};
  
  // ✅ إصلاح: فلترة deletedTxIds قبل بناء الخريطة
  existing.forEach(t => { 
    if (permanentDeleted.has(t.id)) return;
    if (t.status === 'paid' && t.sourceReceivableId) 
      loanPaidMap[t.sourceReceivableId] = (loanPaidMap[t.sourceReceivableId] || 0) + safeNumber(t.amount); 
  });
  
  data.recurringItems.forEach(r => {
    if (r.active === false) return;
    if (!r.id || !r.type) return;
    if (r.startMonth && nowInputMonth < r.startMonth) return;
    if (r.endMonth && nowInputMonth > r.endMonth) return;
    
    const day = safeNumber(r.day, 1);
    if (day < 1 || day > 31) return;
    
    const maxDayInMonth = new Date(nowYear, now.getMonth() + 1, 0).getDate();
    const safeDay = Math.min(day, maxDayInMonth);
    const targetDate = new Date(nowYear, now.getMonth(), safeDay);
    if (targetDate > now) return;    
    
    const matKey = `${r.id}_${nowMonthKey}`;
    if (materialized[matKey] === 'deleted') return;
    if (materialized[matKey]) return;
    
    const manualExists = existing.some(t => t.sourceRecurringId === r.id && t.month === nowMonth && (t.year || nowYear) === nowYear);
    if (manualExists) { materialized[matKey] = true; return; }
    
    let receivableLinkedId = null;
    if (r.linkedLoanSystemId) {
      const linkedLoan = (data.loans || []).find(l => l.systemId === r.linkedLoanSystemId);
      if (linkedLoan) { 
        const collected = safeNumber(linkedLoan.prePaidAmount) + (loanPaidMap[linkedLoan.id] || 0); 
        if (collected >= safeNumber(linkedLoan.totalAmount) - 0.005) return; 
        receivableLinkedId = linkedLoan.id; 
      }
    }
    
    let method = 'cash';
    let linkedCardId = r.linkedCardId;
    if (r.method) { method = r.method; }
    else if (linkedCardId) { 
      const card = (data.cards || []).find(c => c.id === linkedCardId); 
      if (card) method = getCardMethod(card); 
    }
    
    const isFee = BANK_FEE_CATEGORIES.has(r.category);
    const kind = r.kind || (isFee ? KIND.FINANCIAL : KIND.OPERATIONAL);
    const newId = `rec-${r.id}-${nowMonthKey}`;
    if (permanentDeleted.has(newId)) { materialized[matKey] = 'deleted'; return; }
    
    newTxs.push({
      id: newId,
      type: r.type, 
      subType: r.type === 'income' ? 'deposit' : 'withdrawal', 
      kind,
      category: r.category, 
      amount: safeNumber(r.amount), 
      description: r.title || 'بند متكرر',
      method, 
      date: getLocalISODate(targetDate), 
      month: ALL_MONTHS[targetDate.getMonth()], 
      year: targetDate.getFullYear(), 
      monthIndex: targetDate.getMonth(),
      status: 'pending', 
      sourceRecurringId: r.id, 
      linkedCardId: linkedCardId || undefined,
      sourceReceivableId: receivableLinkedId || undefined,
      transferChannel: r.transferChannel || undefined,
      receipts: [], 
      createdAt: new Date().toISOString()
    });
    materialized[matKey] = true;
  });
  
  if (newTxs.length === 0) return null;
  
  return { 
    ...data, 
    transactions: [...newTxs, ...existing].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)), 
    materializedRecurring: materialized 
  };
};

/* ═══════════════════════════════════════════════════════════════
   dedupeRecurringTransactions
   ═══════════════════════════════════════════════════════════════ */
const dedupeRecurringTransactions = (transactions) => {
  if (!Array.isArray(transactions) || transactions.length === 0) {
    return { transactions: transactions || [], removed: [] };
  }
  
  const removed = [];
  const seenById = new Set();
  const seenRecurringKey = new Map();
  const seenFuzzyKey = new Map();
  const keep = [];
  
  const sorted = [...transactions].sort((a, b) => {
    const aTs = a.createdAt ? new Date(a.createdAt).getTime() : 0;
    const bTs = b.createdAt ? new Date(b.createdAt).getTime() : 0;
    if (aTs !== bTs) return bTs - aTs;
    return String(b.id || '').localeCompare(String(a.id || ''));
  });
  
  sorted.forEach(t => {
    if (!t || !t.id) { keep.push(t); return; }
    
    if (seenById.has(t.id)) {
      removed.push({ reason: 'duplicate_id', id: t.id, tx: t });
      return;
    }
    
    if (t.sourceRecurringId && t.year && t.month) {
      const rKey = `${t.sourceRecurringId}|${t.year}|${t.month}`;
      if (seenRecurringKey.has(rKey)) {
        removed.push({ reason: 'duplicate_recurring', key: rKey, id: t.id, existingId: seenRecurringKey.get(rKey), tx: t });
        return;
      }
      seenRecurringKey.set(rKey, t.id);
    }
    
    if (t.source !== 'sms' && !t.linkedTransferId && t.status === 'paid' && safeNumber(t.amount) > 0) {
      const fKey = `${t.date}|${safeNumber(t.amount)}|${t.category}|${t.method}|${t.type}`;
      if (seenFuzzyKey.has(fKey)) {
        removed.push({ reason: 'fuzzy_duplicate', key: fKey, id: t.id, existingId: seenFuzzyKey.get(fKey), tx: t });
        return;
      }
      seenFuzzyKey.set(fKey, t.id);
    }
    
    seenById.add(t.id);
    keep.push(t);
  });
  
  if (removed.length > 0) {
    console.warn(`🧹 dedupeRecurringTransactions: أزال ${removed.length} قيد مكرر`, removed);
  }
  
  return { transactions: keep, removed };
};

const applyDedupe = (data, addNotification) => {
  const { transactions: cleanTx, removed } = dedupeRecurringTransactions(data?.transactions || []);
  if (removed.length === 0) return data;
  
  const newArchive = [...(data.deletedTxArchive || [])];
  const newDeletedIds = [...(data.deletedTxIds || [])];
  
  removed.forEach(r => {
    if (r.tx) {
      newArchive.push({
        ...r.tx,
        deletedAt: new Date().toISOString(),
        deletedBy: 'dedupe',
        originalStatus: r.tx.status || 'pending',
        reason: 'dedupe_' + r.reason
      });
      newDeletedIds.push(r.tx.id);
    }
  });
  
  addNotification?.({
    type: 'info',
    title: `🧹 تم تنظيف ${removed.length} قيد مكرر`,
    message: 'نُقلت للأرشيف — يمكن استرجاعها',
    duration: 6000
  });
  
  return {
    ...data,
    transactions: cleanTx,
    deletedTxArchive: newArchive.slice(-500),
    deletedTxIds: Array.from(new Set(newDeletedIds)).slice(-500)
  };
};

/* ═══════════════════════════════════════════════════════════════
   deriveMonthlyPlanFromHistory
   ═══════════════════════════════════════════════════════════════ */
const deriveMonthlyPlanFromHistory = (data, targetYear, targetMonth, monthsBack = 3) => {
  const transactions = data?.transactions || [];
  const targetIdx = getMonthIndex(targetMonth);
  if (targetIdx < 0) return null;
  
  const refMonths = [];
  let y = targetYear, mi = targetIdx;
  for (let i = 1; i <= monthsBack; i++) {
    mi--; 
    if (mi < 0) { mi = 11; y--; }
    if (y < PROJECT_START_YEAR || (y === PROJECT_START_YEAR && mi < getMonthIndex(PROJECT_START_MONTH))) break;
    refMonths.push({ year: y, month: ALL_MONTHS[mi] });
  }
  if (refMonths.length === 0) return null;
  
  const isCounted = (t) => t.status === 'paid' || t.status === 'pending';
  const txYear = (t) => t.year != null ? t.year : (parseISODate(t.date)?.getFullYear() ?? 2026);
  
  const avgIncomeCat = (cat) => { 
    let total = 0, count = 0; 
    refMonths.forEach(({ year, month }) => { 
      const sum = transactions.filter(t => isCounted(t) && t.type === 'income' && t.month === month && txYear(t) === year && t.category === cat).reduce((s, t) => s + safeNumber(t.amount), 0); 
      if (sum > 0) { total += sum; count++; } 
    }); 
    return count > 0 ? total / count : 0; 
  };
  
  const avgCashExpenses = () => { 
    let total = 0, count = 0; 
    refMonths.forEach(({ year, month }) => { 
      const sum = transactions.filter(t => isCounted(t) && t.type === 'expense' && t.method === 'cash' && t.month === month && txYear(t) === year).reduce((s, t) => s + safeNumber(t.amount), 0); 
      if (sum > 0) { total += sum; count++; } 
    }); 
    return count > 0 ? total / count : 0; 
  };
  
  const KNOWN_INCOME = new Set(['راتب شهري', 'إيجار المحل', 'استرداد كاش باك', 'Cash Back', 'عهدة إيماك WE', 'عهدة شركة إيماك', 'الزكاة والتبرعات', 'راتب AAIB', 'تكييف محمود']);
  
  const avgFreeIncome = () => { 
    let total = 0, count = 0; 
    refMonths.forEach(({ year, month }) => { 
      const sum = transactions.filter(t => isCounted(t) && t.type === 'income' && t.month === month && txYear(t) === year && !KNOWN_INCOME.has(t.category)).reduce((s, t) => s + safeNumber(t.amount), 0); 
      if (sum > 0) { total += sum; count++; } 
    }); 
    return count > 0 ? total / count : 0; 
  };
  
  const sumActiveInstallments = () => { 
    const loans = data?.loans || []; 
    return loans.filter(l => !l.isReceivable && !l.autoMonthly && safeNumber(l.monthlyInstallment) > 0).reduce((s, l) => s + safeNumber(l.monthlyInstallment), 0); 
  };
  
  return {
    expectedSalary: Math.round(avgIncomeCat('راتب شهري')), 
    expectedRent: Math.round(avgIncomeCat('إيجار المحل')),
    expectedCashback: Math.round(avgIncomeCat('استرداد كاش باك') || avgIncomeCat('Cash Back')),
    expectedEmakWE: Math.round(avgIncomeCat('عهدة إيماك WE') || avgIncomeCat('عهدة شركة إيماك')),
    expectedZakat: Math.round(avgIncomeCat('الزكاة والتبرعات')), 
    expectedCash: Math.round(avgFreeIncome()),
    expectedCashExpenses: Math.round(avgCashExpenses()), 
    plannedPayments: Math.round(sumActiveInstallments()),
    _meta: { refMonths: refMonths.map(m => `${m.month} ${m.year}`).join(' • ') }
  };
};

const useOnlineStatus = () => {
  const [online, setOnline] = useState(() => (typeof navigator !== 'undefined' ? navigator.onLine : true));
  useEffect(() => {
    const onOnline = () => setOnline(true);
    const onOffline = () => setOnline(false);
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    return () => { 
      window.removeEventListener('online', onOnline); 
      window.removeEventListener('offline', onOffline); 
    };
  }, []);
  return online;
};

    else if (Date.now() - start > timeoutMs) { clearInterval(timer); reject(new Error('GIS غير محمّل')); }
  }, 150);

      _driveAccessToken = resp.access_token;

    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }) 
  });
  if (!createRes.ok) throw new Error('فشل إنشاء المجلد');
  const created = await createRes.json();
  localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, created.id);
  return created.id;
};

const uploadBackupToDrive = async (payload, fileName) => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const name = fileName || `finance_backup_${getLocalISODate()}_${Date.now()}.json`;
  const metadata = { name, parents: [folderId], mimeType: 'application/json' };
  const boundary = '----V81DriveBoundary' + Date.now();
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,createdTime', { 
    method: 'POST', 
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` }, 
    body 
  });
  if (!res.ok) throw new Error('فشل الرفع');
  return await res.json();
};

const listDriveBackups = async () => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false and mimeType='application/json'`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,size,createdTime)&orderBy=createdTime desc&pageSize=50`, { 
    headers: { Authorization: `Bearer ${token}` } 
  });
  if (!res.ok) throw new Error('فشل الجلب');
  const data = await res.json();
  return data.files || [];
};

const downloadBackupFromDrive = async (fileId) => {
  const token = await ensureDriveToken();
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { 
    headers: { Authorization: `Bearer ${token}` } 
  });
  if (!res.ok) throw new Error('فشل التنزيل');
  return await res.json();
};

/* ─────────────── Error Boundary ─────────────── */
class ErrorBoundary extends React.Component {
  constructor(p) { 
    super(p); 
    this.state = { hasError: false, error: null }; 
  }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(e, i) { 
    console.error('App Error:', e, i); 
    clearAllModals(); 
  }
  render() {
    if (this.state.hasError) return (
      <div className="flex flex-col h-screen items-center justify-center p-8 text-center" style={{background: 'var(--bg-app)'}} dir="rtl">
        <AlertTriangle size={48} className="text-red-500 mb-4" />

        <p className="text-sm mb-6 opacity-70 max-w-md break-all" style={{ color: 'var(--text-secondary)' }}>{String(this.state.error?.message || '')}</p>
        <div className="flex gap-3">
          <button onClick={() => window.location.reload()} className="btn btn-primary"><RefreshCcw size={18}/> إعادة</button>
          <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="btn btn-secondary"><Trash2 size={18}/> مسح</button>
        </div>
      </div>
    );
    return this.props.children;
  }
}

/* ─────────────── Promise-based Modal Provider ─────────────── */
const PromiseModalProvider = ({ children }) => {
  const [stack, setStack] = useState([]);
  const [inputValues, setInputValues] = useState({});
  
  useEffect(() => {
    const handleInput = (e) => setStack(s => [...s, { kind: 'input', ...e.detail }]);
    const handleConfirm = (e) => setStack(s => [...s, { kind: 'confirm', ...e.detail }]);
    window.addEventListener('show-input-modal', handleInput);
    window.addEventListener('show-confirm-modal', handleConfirm);
    return () => { 
      window.removeEventListener('show-input-modal', handleInput); 
      window.removeEventListener('show-confirm-modal', handleConfirm); 
    };
  }, []);
  
  const current = stack[stack.length - 1];
  
  const dismiss = useCallback((value) => {
    if (!current) return;
    const id = current._id;
    setStack(s => s.slice(0, -1));
    resolveModal(id, value);
    setInputValues(prev => { 
      if (!(id in prev)) return prev; 
      const next = { ...prev }; 
      delete next[id]; 
      return next; 
    });
  }, [current]);
  
  const inputValue = current?._id !== undefined ? (inputValues[current._id] ?? current.inputValue ?? '') : '';
  const setInputValue = useCallback((v) => { 
    if (current?._id === undefined) return; 
    setInputValues(prev => ({ ...prev, [current._id]: v })); 
  }, [current?._id]);
  
  return (
    <React.Fragment>
      {children}
      {current?.kind === 'input' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-md">
            <div className="generic-modal-header">
              <h3 className="text-base font-black flex items-center gap-2"><span>{current.icon || '💬'}</span>{current.title}</h3>
              <button onClick={() => dismiss(null)} className="btn btn-ghost p-1.5"><X size={16} /></button>
            </div>
            <div className="generic-modal-body">
              {current.message && <p className="text-sm mb-3 whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>}
              <input 
                autoFocus 
                type="text" 
                inputMode={current.numeric ? 'decimal' : 'text'} 
                className="input-field text-2xl font-black text-center text-blue-600 py-4" 
                value={inputValue} 
                onChange={e => setInputValue(current.numeric ? e.target.value.replace(/[^\d.\-]/g, '') : e.target.value)} 
                onKeyDown={e => { 
                  if (e.key === 'Enter') { 
                    const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim(); 
                    dismiss(v); 
                  } 
                }} 
                placeholder={current.placeholder || ''} 
              />
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => dismiss(null)} className="btn btn-secondary flex-1">إلغاء</button>
              <button 
                onClick={() => { 
                  const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim(); 
                  dismiss(v); 
                }} 
                className="btn btn-primary flex-1"
              >{current.confirmText || 'تأكيد'}</button>
            </div>
          </div>
        </div>
      )}
      {current?.kind === 'confirm' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-sm">
            <div className="generic-modal-body text-center">
              <div className={`w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl ${current.danger ? 'bg-red-50 dark:bg-red-950/40' : 'bg-blue-50 dark:bg-blue-950/40'}`}>
                {current.icon || (current.danger ? '⚠️' : '❓')}
              </div>
              <h3 className="text-base font-black mb-2">{current.title}</h3>
              <p className="text-sm leading-relaxed mb-2 whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => dismiss(false)} className="btn btn-secondary flex-1">إلغاء</button>
              <button 
                onClick={() => dismiss(true)} 
                className="btn flex-1" 
                style={{ background: current.danger ? 'var(--danger)' : 'var(--brand)', color: 'white' }}
              >{current.confirmText || 'تأكيد'}</button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
};

/* ─────────────── Group Transactions by Date ─────────────── */
const groupTransactionsByDate = (list) => {
  const groups = {};
  list.forEach(t => { 
    const d = t.date || 'unknown'; 
    if (!groups[d]) groups[d] = []; 
    groups[d].push(t); 
  });
  const today = getLocalISODate();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const yestISO = getLocalISODate(yest);
  
  return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
    let label;
    if (date === today) label = '📅 النهاردة';
    else if (date === yestISO) label = '📅 امبارح';
    else {
      const dObj = parseISODate(date);
      if (dObj) { 
        const ds = dObj.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' }); 
        const ys = dObj.getFullYear() !== new Date().getFullYear() ? ' ' + dObj.getFullYear() : ''; 
        label = '📅 ' + ds + ys; 
      }
      else label = '📅 ' + date;
    }
    const total = groups[date].reduce((s, t) => s + safeNumber(t.amount), 0);
    return { date, label, items: groups[date], total };
  });
};

/* ─────────────── PIN Lock Screen ─────────────── */
const PinLockScreen = ({ onSuccess, onLogout }) => {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const [success, setSuccess] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const [lastPressed, setLastPressed] = useState(null);
  const pressTimerRef = useRef(null);
  const clearTimerRef = useRef(null);
  const navTimerRef = useRef(null);

  useEffect(() => {
    return () => {
      if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
      if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
      if (navTimerRef.current) clearTimeout(navTimerRef.current);
    };
  }, []);

  const handleDigit = (d) => {
    if (pin.length >= 4 || success) return;
    const next = pin + d;
    setPin(next); 
    setLastPressed(d);
    
    if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    pressTimerRef.current = setTimeout(() => setLastPressed(null), 150);
    
    if (next.length === 4) {
      if (navTimerRef.current) clearTimeout(navTimerRef.current);
      navTimerRef.current = setTimeout(async () => {
        const ok = await verifyPin(next);
        if (ok) { 
          setSuccess(true); 
          if (navTimerRef.current) clearTimeout(navTimerRef.current); 
          navTimerRef.current = setTimeout(() => onSuccess(), 500); 
        }
        else {
          setError(true); 
          setAttempts(a => a + 1);
          if (clearTimerRef.current) clearTimeout(clearTimerRef.current);
          clearTimerRef.current = setTimeout(() => { setPin(''); setError(false); }, 650);
        }
      }, 150);
    }
  };
  
  const handleDelete = () => { if (!success) setPin(p => p.slice(0, -1)); };
  
  return (
    <div className="min-h-screen flex items-center justify-center p-6 relative overflow-hidden" style={{ background: 'radial-gradient(ellipse at top, #2A2418 0%, #1A1508 55%, #0F0B04 100%)' }}>
      <div className={`relative w-full max-w-sm ${error ? 'animate-shake' : ''}`}>
        <div className="flex flex-col items-center mb-8">
          <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mb-4 transition-all duration-500 ${success ? 'bg-emerald-500 scale-110 shadow-2xl shadow-emerald-500/40' : error ? 'bg-red-500/20 border border-red-500/30' : 'bg-blue-500/10 border border-blue-500/20'}`}>
            {success ? <CheckCircle2 size={28} className="text-white" /> : error ? <AlertTriangle size={26} className="text-red-400" /> : <Lock size={26} className="text-blue-400" />}
          </div>
          <h1 className="text-xl font-black text-white mb-1">{success ? 'مرحباً ✓' : error ? 'رمز غير صحيح' : 'أهلاً بعودتك'}</h1>
          <p className="text-xs font-medium" style={{ color: '#8A8270' }}>{success ? 'جارٍ الفتح...' : error ? `محاولة ${attempts}` : 'أدخل الرمز'}</p>
        </div>
        <div className="flex justify-center gap-3 mb-8 h-4">
          {[0, 1, 2, 3].map(i => (
            <div 
              key={i} 
              className={`w-3 h-3 rounded-full transition-all duration-300 ${success ? 'bg-emerald-400 scale-125' : error ? 'bg-red-500 scale-110' : pin.length > i ? 'bg-blue-400 scale-125' : 'bg-transparent border-2 border-slate-600'}`}
            ></div>
          ))}
        </div>
        <div className="grid grid-cols-3 gap-3 mb-6">
          {['1','2','3','4','5','6','7','8','9'].map(d => (
            <button 
              key={d} 
              type="button" 
              onClick={() => handleDigit(d)} 
              className={`aspect-square rounded-2xl font-black text-xl transition-all duration-100 active:scale-90 select-none ${lastPressed === d ? 'bg-blue-500 text-white scale-95' : 'bg-white/[0.04] border border-white/[0.08] text-white hover:bg-white/[0.09]'}`}
            >{d}</button>
          ))}
          <div className="aspect-square"></div>
          <button 
            type="button" 
            onClick={() => handleDigit('0')} 
            className={`aspect-square rounded-2xl font-black text-xl transition-all duration-100 active:scale-90 select-none ${lastPressed === '0' ? 'bg-blue-500 text-white scale-95' : 'bg-white/[0.04] border border-white/[0.08] text-white hover:bg-white/[0.09]'}`}
          >0</button>
          <button 
            type="button" 
            onClick={handleDelete} 
            className="aspect-square rounded-2xl flex items-center justify-center transition-all active:scale-90" 
            style={{ color: '#8A8270' }}
          ><Delete size={20} /></button>
        </div>
        <button 
          type="button" 
          onClick={onLogout} 
          className="w-full py-3 text-xs font-bold flex items-center justify-center gap-2 transition-colors" 
          style={{ color: '#8A8270' }}
        ><LogOut size={14} /> تسجيل الخروج</button>
      </div>
    </div>
  );
};

/* ─────────────── PIN Change Modal ─────────────── */
const PinChangeModal = ({ onClose, addNotification }) => {
  const [current, setCurrent] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [busy, setBusy] = useState(false);
  
  const submit = async () => {
    if (!/^\d{4}$/.test(next)) { 
      addNotification({ type: 'error', title: 'الرمز الجديد لازم 4 أرقام' }); 
      return; 
    }
    if (next !== confirm) { 
      addNotification({ type: 'error', title: 'الرمز الجديد مش متطابق' }); 
      return; 
    }
    setBusy(true);
    try {
      const ok = await verifyPin(current);
      if (!ok) { 
        addNotification({ type: 'error', title: 'الرمز الحالي غير صحيح' }); 
        setBusy(false); 
        return; 
      }
      await savePinHash(next);
      addNotification({ type: 'success', title: 'تم تغيير الرمز بنجاح' });
      setBusy(false);
      onClose();
    } catch (e) {
      addNotification({ type: 'error', title: 'فشل', message: e.message });
      setBusy(false);
    }
  };
  
  return (
    <Modal isOpen={true} onClose={onClose} title="تغيير رمز الدخول" icon="🔐">
      <div className="space-y-3">
        <div>
          <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الرمز الحالي</label>
          <input 
            type="password" 
            inputMode="numeric" 
            maxLength={4} 
            className="input-field text-center text-lg font-black tracking-widest" 
            value={current} 
            onChange={e => setCurrent(e.target.value.replace(/\D/g, ''))} 
          />
        </div>
        <div>
          <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الرمز الجديد</label>
          <input 
            type="password" 
            inputMode="numeric" 
            maxLength={4} 
            className="input-field text-center text-lg font-black tracking-widest" 
            value={next} 
            onChange={e => setNext(e.target.value.replace(/\D/g, ''))} 
          />
        </div>
        <div>
          <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>تأكيد الرمز الجديد</label>
          <input 
            type="password" 
            inputMode="numeric" 
            maxLength={4} 
            className="input-field text-center text-lg font-black tracking-widest" 
            value={confirm} 
            onChange={e => setConfirm(e.target.value.replace(/\D/g, ''))} 
          />
        </div>
        <button onClick={submit} disabled={busy} className="btn btn-primary w-full py-2.5 text-sm">
          {busy ? 'جاري الحفظ...' : 'حفظ'}
        </button>
      </div>
    </Modal>
  );
};

/* ─────────────── SMS Parser Modal ─────────────── */
const SmsParserModal = memo(({ isOpen, onClose, dispatch, addNotification, saveHistory, data }) => {
  const [rawText, setRawText] = useState('');
  const [parsed, setParsed] = useState(null);
  const [category, setCategory] = useState('');
  const [method, setMethod] = useState('cash');
  const [manualAmount, setManualAmount] = useState('');

  useEffect(() => { 
    if (!isOpen) { 
      setRawText(''); 
      setParsed(null); 
      setCategory(''); 
      setMethod('cash'); 
      setManualAmount(''); 
    } 
  }, [isOpen]);

  const handlePaste = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.readText) {
        const txt = await navigator.clipboard.readText();
        if (txt && txt.trim()) { 
          setRawText(txt); 
          addNotification({ type: 'success', title: 'تم اللصق', duration: 2000 }); 
          return; 
        }
      }
      addNotification({ type: 'info', title: 'الصق الرسالة يدوياً في الصندوق' });
    } catch (e) { 
      addNotification({ type: 'info', title: 'الصق الرسالة يدوياً في الصندوق' }); 
    }
  };

  const handleAnalyze = () => {
    if (!rawText.trim()) { 
      addNotification({ type: 'error', title: 'الصق رسالة البنك أولاً' }); 
      return; 
    }
    const res = parseBankSms(rawText);
    setParsed(res);
    if (res.method) setMethod(res.method);
    if (res.amount > 0) setManualAmount(String(res.amount));
    if (res.ok) {
      const cardInfo = res.cardLabel ? ` • ${res.cardLabel}` : '';
      addNotification({ 
        type: 'success', 
        title: `تم التحليل: ${fmt(res.amount)} ج.م`, 
        message: `${res.type === 'income' ? 'دخل' : 'مصروف'} • ${res.bank || 'بنك'}${cardInfo}`, 
        duration: 5000 
      });
    } else { 
      addNotification({ type: 'warning', title: 'تحليل جزئي', message: res.notes.join(' • ') }); 
    }
  };

  const handleSave = () => {
    const amt = parseNumberInput(manualAmount);
    if (!amt || amt <= 0) { 
      addNotification({ type: 'error', title: 'أدخل مبلغ صالح' }); 
      return; 
    }
    if (!category) { 
      addNotification({ type: 'error', title: 'اختر الفئة' }); 
      return; 
    }
    const d = parseISODate(parsed.date) || new Date();
    const year = d.getFullYear();
    const month = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, year, month)) { 
      addNotification({ type: 'error', title: `شهر ${month} ${year} مغلق`, message: 'افتح الشهر أو غيّر التاريخ' }); 
      return; 
    }
    saveHistory();
    const newTx = {
      id: getSafeId(), 
      type: parsed.type, 
      subType: parsed.subType, 
      kind: KIND.OPERATIONAL,
      category, 
      amount: amt, 
      description: parsed.description || 'SMS import',
      method, 
      date: parsed.date, 
      month, 
      year, 
      monthIndex: d.getMonth(),
      status: 'pending', 
      source: 'sms', 
      smsRawText: parsed.rawText, 
      smsBank: parsed.bank,
      linkedCardId: parsed.linkedCardId || undefined,
      cardLast4: parsed.last4 || undefined,
      accountKind: parsed.accountKind || undefined,
      receipts: []
    };
    dispatch({ 
      type: 'UPDATE_TRANSACTIONS', 
      payload: [newTx, ...(data.transactions || [])].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) 
    });
    addNotification({ type: 'success', title: 'تم الحفظ كمعلق', message: 'راجعها واعتمدها من صفحة المعاملات', duration: 5000 });
    onClose();
  };

  if (!isOpen) return null;

  return (
    <Modal isOpen={true} onClose={onClose} title="تحليل رسالة بنك" icon="📱" size="lg">
      <div className="space-y-3">
        <div>
          <div className="flex justify-between items-center mb-1.5">
            <label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الصق رسالة البنك هنا</label>
            <button type="button" onClick={handlePaste} className="text-[11px] font-black text-blue-600 flex items-center gap-1">📋 لصق تلقائي</button>
          </div>
          <textarea 
            className="input-field text-xs leading-relaxed font-semibold" 
            rows={6}
            placeholder="مثال: CIB: Purchase of EGP 1500.00 on card ending 9380 at CARREFOUR on 17/09/2026"
            value={rawText} 
            onChange={e => setRawText(e.target.value)} 
            dir="auto" 
          />
          <p className="text-[10px] mt-1.5" style={{ color: 'var(--text-muted)' }}>
            💡 يدعم: 1016 (Titanium) • 9380/9352/2014 (فرعية) • 3391 (Signature) • 2017 (SWYPE) • 1809 (CIB Saving) • 2106 (AAIB Saving)
            <br />🛡️ يرفض رسائل OTP تلقائياً
          </p>
        </div>
        <button type="button" onClick={handleAnalyze} disabled={!rawText.trim()} className="btn btn-primary w-full py-2.5 text-sm">
          <Sparkles size={14} /> حلّل الرسالة
        </button>
        {parsed && (
          <div className="space-y-3 pt-3 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            <div className={`p-3 rounded-lg ${parsed.ok ? 'bg-emerald-50 dark:bg-emerald-950/30' : 'bg-amber-50 dark:bg-amber-950/30'}`}>
              <div className="flex items-center gap-2 mb-2">
                {parsed.ok ? <CheckCircle2 size={16} className="text-emerald-600" /> : <AlertTriangle size={16} className="text-amber-600" />}

/* ─────────────── Receipt Viewer ─────────────── */
const ReceiptViewer = memo(({ viewingReceipt, dispatch, transactions, saveHistory, addNotification }) => {
  if (!viewingReceipt) return null;
  const { tx } = viewingReceipt;
  const [index, setIndex] = useState(viewingReceipt.index || 0);
  const receipts = tx?.receipts || [];
  const [uploading, setUploading] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    setIndex(viewingReceipt.index || 0);
  }, [tx?.id, viewingReceipt.index]);

  useEffect(() => {
    if (receipts.length > 0 && index >= receipts.length) {
      setIndex(receipts.length - 1);
    }
  }, [receipts.length, index]);

  const close = () => dispatch({ type: 'SET_VIEWING_RECEIPT', payload: null });

  const handleUpload = async (files) => {
    if (!files || files.length === 0) return;
    setUploading(true);
    try {
      const uploaded = [];
      for (const file of Array.from(files).slice(0, 5)) {
        const result = await uploadReceipt(tx.id, file);
        uploaded.push(result);
      }
      saveHistory();
      const updatedTx = { ...tx, receipts: [...(tx.receipts || []), ...uploaded] };
      const newTxList = transactions.map(t => t.id === tx.id ? updatedTx : t);
      dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTxList });
      dispatch({ type: 'SET_VIEWING_RECEIPT', payload: { tx: updatedTx, index: (tx.receipts?.length || 0) } });
      addNotification({ type: 'success', title: `تم رفع ${uploaded.length} فاتورة` });
    } catch (e) {
      addNotification({ type: 'error', title: 'فشل الرفع', message: e.message });
    } finally { setUploading(false); }
  };

  const deleteOne = (idx) => {
    const r = receipts[idx];
    if (!r) return;
    dispatch({ 
      type: 'SHOW_CONFIRM', 
      danger: true, 
      title: 'حذف الفاتورة', 
      message: 'سيتم حذف الصورة نهائياً', 
      onConfirm: async () => {
        saveHistory();
        await deleteReceipt(r.path);
        const newReceipts = receipts.filter((_, i) => i !== idx);
        const updatedTx = { ...tx, receipts: newReceipts };
        dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(t => t.id === tx.id ? updatedTx : t) });
        if (newReceipts.length === 0) close();
        else dispatch({ type: 'SET_VIEWING_RECEIPT', payload: { tx: updatedTx, index: Math.min(idx, newReceipts.length - 1) } });
        addNotification({ type: 'success', title: 'تم الحذف' });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  };

  return (
    <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) close(); }}>
      <div className="generic-modal max-w-3xl">
        <div className="generic-modal-header">
          <div className="min-w-0">
            <h3 className="text-base font-black truncate flex items-center gap-2">
              <Camera size={16} className="text-blue-500" /> فواتير المعاملة
            </h3>
            <p className="text-[11px] font-semibold truncate" style={{ color: 'var(--text-muted)' }}>
              {tx?.description || tx?.category} • {fmt(tx?.amount)} ج.م
            </p>
          </div>
          <button onClick={close} className="btn btn-ghost p-1.5"><X size={16} /></button>
        </div>
        <div className="generic-modal-body">
          {receipts.length === 0 ? (
            <div className="text-center py-8">
              <Camera size={40} className="mx-auto mb-3" style={{ color: 'var(--text-muted)' }} />
              <p className="font-bold text-sm mb-4" style={{ color: 'var(--text-secondary)' }}>لا توجد فواتير بعد</p>
              <button onClick={() => fileInputRef.current?.click()} disabled={uploading} className="btn btn-primary text-sm">
                <Upload size={14} /> {uploading ? 'جاري الرفع...' : 'رفع فاتورة'}
              </button>
            </div>
          ) : (
            <React.Fragment>
              <div className="rounded-xl overflow-hidden mb-3" style={{ background: 'var(--bg-muted)' }}>
                <img src={receipts[index]?.url} alt={`فاتورة ${index + 1}`} className="w-full max-h-[55vh] object-contain" />
              </div>
              {receipts.length > 1 && (
                <div className="flex gap-2 overflow-x-auto scroll-hide pb-2 mb-3">
                  {receipts.map((r, i) => (
                    <button 
                      key={i} 
                      onClick={() => setIndex(i)} 
                      className={`flex-shrink-0 w-16 h-16 rounded-lg overflow-hidden border-2 ${i === index ? 'border-blue-500' : 'border-transparent'}`}
                    >
                      <img src={r.url} alt={`thumb ${i+1}`} className="w-full h-full object-cover" />
                    </button>
                  ))}
                </div>
              )}
              <div className="flex gap-2 flex-wrap">
                <button onClick={() => fileInputRef.current?.click()} disabled={uploading} className="btn btn-secondary text-xs flex-1 min-w-[120px]">
                  <Upload size={12} /> إضافة
                </button>
                <button onClick={() => window.open(receipts[index]?.url, '_blank')} className="btn btn-secondary text-xs flex-1 min-w-[120px]">
                  <Eye size={12} /> عرض كامل
                </button>
                <button onClick={() => deleteOne(index)} className="btn btn-secondary text-xs text-red-600 flex-1 min-w-[120px]">
                  <Trash2 size={12} /> حذف
                </button>
              </div>
            </React.Fragment>
          )}
          <input 
            ref={fileInputRef} 
            type="file" 
            accept="image/*" 
            multiple 
            className="hidden" 
            onChange={(e) => { handleUpload(e.target.files); e.target.value = ''; }} 
          />
        </div>
        <div className="generic-modal-footer" data-pdf-hide="true">
          <button onClick={close} className="btn btn-secondary flex-1 text-sm">إغلاق</button>
        </div>
      </div>
    </div>
  );
});

  const pending = data.pending || [];
  const totalIncome = pending.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
  const totalExpense = pending.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
  
  return (
    <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="generic-modal max-w-lg">
        <div className="generic-modal-header">
          <h3 className="text-base font-black flex items-center gap-2">
            <AlertTriangle size={18} className="text-amber-500" /> عمليات معلقة قبل الإقفال
          </h3>
          <button onClick={onClose} className="btn btn-ghost p-1.5"><X size={16} /></button>
        </div>
        <div className="generic-modal-body">
          <div className="p-3 rounded-lg bg-amber-50 dark:bg-amber-950/30 mb-4">
            <p className="text-xs font-bold text-amber-700 dark:text-amber-400 mb-2">
              ⚠️ يوجد <strong>{pending.length}</strong> عملية معلقة في شهر {data.month} {data.year}

              {totalExpense > 0 && <span className="text-red-700 dark:text-red-400">مصروف متوقع: −{fmt(totalExpense)}</span>}
            </div>
            <p className="text-[11px] mt-2 leading-relaxed" style={{ color: 'var(--text-secondary)' }}>
              العمليات المعلقة <strong>لا تؤثر على الرصيد الحي</strong>. اختر كيف تريد معالجتها قبل الإقفال.
            </p>
          </div>
          <button 
            type="button"

            style={{ background: 'var(--bg-muted)' }}
          >
            <span>📋 تفاصيل العمليات</span>

          </button>
          {expanded && (
            <div className="max-h-56 overflow-y-auto space-y-1.5 mb-3">

                <div key={t.id} className="flex justify-between items-center p-2 rounded-lg text-xs" style={{ background: 'var(--bg-muted)' }}>
                  <div className="flex items-center gap-2 min-w-0 flex-1">

                      {t.type === 'income' ? 'دخل' : 'مصروف'}
                    </span>
                    <div className="min-w-0">
                      <p className="font-bold truncate">{t.description || t.category}</p>

const GenericLedgerComponent = memo(({

}) => {
  const [filter, setFilter] = useState('all');
  const [dateFilter, setDateFilter] = useState('');
  
  const validatedLedger = useMemo(() => {
    try { 
      return (ledgerData || []).map(item => ({ 
        ...item, 
        amount: safeNumber(item.amount), 
        runningBalance: safeNumber(item.runningBalance), 
        date: item.date || 'غير معروف', 
        description: item.description || 'بدون وصف', 
        subType: item.subType || (item.type === 'income' ? 'deposit' : 'withdrawal') 
      })).filter(item => item.amount > 0); 
    } catch { return []; }
  }, [ledgerData]);
  
  const filteredLedger = useMemo(() => validatedLedger.filter(i => { 
    if (filter === 'deposit' && i.subType !== 'deposit') return false; 
    if (filter === 'withdrawal' && i.subType !== 'withdrawal') return false; 
    if (dateFilter && !(i.date||'').includes(dateFilter)) return false; 
    return true; 
  }), [validatedLedger, filter, dateFilter]);
  
  const stats = useMemo(() => ({ 
    deposits: validatedLedger.filter(t => t.subType === 'deposit').reduce((s, t) => s + t.amount, 0), 
    withdrawals: validatedLedger.filter(t => t.subType === 'withdrawal').reduce((s, t) => s + t.amount, 0),

  const mask = (v) => !walletVisibility?.[walletKey] ? '•••••' : fmt(v);

      </div>
      {isExpanded && (

                  <div className="text-sm font-black text-blue-600 dark:text-blue-400">{mask(stats.currentBalance)}</div>

              </div>
