}
.dark .glass {
  background: var(--glass-dark-bg);
}

/* Text Effects */
.text-gradient { 
  background: var(--primary-gradient);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.gradient-text-success {
  background: var(--success-gradient);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.gradient-text-danger {
  background: var(--danger-gradient);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

@media print {

// إنشاء قيد محاسبي
const createJournalEntry = (entries, description, date, reference = '') => {
  // التحقق من توازن القيد (المدين = الدائن)
  const totalDebit = entries.filter(e => e.type === 'debit').reduce((sum, e) => sum + e.amount, 0);
  const totalCredit = entries.filter(e => e.type === 'credit').reduce((sum, e) => sum + e.amount, 0);
  
  if (Math.abs(totalDebit - totalCredit) > 0.01) {
    throw new Error(`القيد غير متوازن! المدين: ${totalDebit}, الدائن: ${totalCredit}`);
  }
  
  return {
    id: `je_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
    date: date || new Date().toISOString().split('T')[0],
    description,
    reference,
    entries: entries.map(entry => ({
      ...entry,
      accountId: entry.accountId,
      accountName: CHART_OF_ACCOUNTS[entry.accountId]?.name || 'غير معروف'
    })),
    createdAt: new Date().toISOString(),
    totalDebit,
    totalCredit
  };
};

// تحديث حسابات الأستاذ
const updateLedgerAccounts = (currentLedger, journalEntry) => {
  const newLedger = { ...currentLedger };
  
  journalEntry.entries.forEach(entry => {
    const accountId = entry.accountId;
    if (!newLedger[accountId]) {
      newLedger[accountId] = {
        accountId,
        accountName: CHART_OF_ACCOUNTS[accountId]?.name || 'غير معروف',
        accountType: CHART_OF_ACCOUNTS[accountId]?.type,
        normalBalance: CHART_OF_ACCOUNTS[accountId]?.normalBalance,
        debitBalance: 0,
        creditBalance: 0,
        transactions: []
      };
    }
    
    // إضافة الحركة
    const transaction = {
      id: `tr_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
      date: journalEntry.date,
      description: journalEntry.description,
      journalEntryId: journalEntry.id,
      debit: entry.type === 'debit' ? entry.amount : 0,
      credit: entry.type === 'credit' ? entry.amount : 0,
      balance: 0
    };
    
    newLedger[accountId].transactions.push(transaction);
    
    // تحديث الأرصدة
    if (entry.type === 'debit') {
      newLedger[accountId].debitBalance += entry.amount;
    } else {
      newLedger[accountId].creditBalance += entry.amount;
    }
    
    // حساب الرصيد النهائي
    const account = newLedger[accountId];
    if (account.normalBalance === 'debit') {
      account.balance = account.debitBalance - account.creditBalance;
    } else {
      account.balance = account.creditBalance - account.debitBalance;
    }
  });
  
  return newLedger;
};

// حساب ميزان المراجعة
const calculateTrialBalance = (ledgerAccounts) => {
  const trialBalance = {
    assets: [],
    liabilities: [],
    equity: [],
    income: [],
    expenses: [],
    totals: {
      debit: 0,
      credit: 0,
      balance: 0
    }
  };
  
  Object.values(ledgerAccounts).forEach(account => {
    const accountData = {
      accountId: account.accountId,
      accountName: account.accountName,
      debitBalance: account.debitBalance,
      creditBalance: account.creditBalance,
      balance: account.balance
    };
    
    switch(account.accountType) {
      case ACCOUNT_TYPES.ASSET:
        trialBalance.assets.push(accountData);
        break;
      case ACCOUNT_TYPES.LIABILITY:
        trialBalance.liabilities.push(accountData);
        break;
      case ACCOUNT_TYPES.EQUITY:
        trialBalance.equity.push(accountData);
        break;
      case ACCOUNT_TYPES.INCOME:
        trialBalance.income.push(accountData);
        break;
      case ACCOUNT_TYPES.EXPENSE:
        trialBalance.expenses.push(accountData);
        break;
    }
    
    // حساب المجاميع
    trialBalance.totals.debit += account.debitBalance;
    trialBalance.totals.credit += account.creditBalance;
  });
  
  trialBalance.totals.balance = Math.abs(trialBalance.totals.debit - trialBalance.totals.credit);
  
  return trialBalance;
};

// توليد القيود المحاسبية من المعاملات المالية
const generateJournalEntriesFromTransactions = (transactions) => {
  const journalEntries = [];
  
  transactions.forEach(transaction => {
    let entries = [];
    const date = transaction.date;
    const description = transaction.description || transaction.category;
    
    if (transaction.type === 'income') {
      // قيد الإيرادات: مدين الأصول (النقد/المحفظة)، دائن الإيرادات
      const assetAccount = getAssetAccountId(transaction.method);
      if (assetAccount) {
        entries = [
          { accountId: assetAccount, type: 'debit', amount: transaction.amount },
          { accountId: getIncomeAccountId(transaction.category), type: 'credit', amount: transaction.amount }
        ];
      }
    } else if (transaction.type === 'expense') {
      // قيد المصروفات: مدين المصروفات، دائن الأصول (النقد/المحفظة)
      const assetAccount = getAssetAccountId(transaction.method);
      if (assetAccount) {
        entries = [
          { accountId: getExpenseAccountId(transaction.category), type: 'debit', amount: transaction.amount },
          { accountId: assetAccount, type: 'credit', amount: transaction.amount }
        ];
      }
    }
    
    if (entries.length > 0) {
      try {
        const journalEntry = createJournalEntry(entries, description, date, transaction.id);
        journalEntries.push(journalEntry);
      } catch (error) {
        console.error('خطأ في توليد القيد المحاسبي:', error);
      }
    }
  });
  
  return journalEntries;
};

const escapeHtml = (unsafe) => {
  if (typeof unsafe !== 'string') return unsafe;
  return unsafe
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
};

const generateId = () => {
  try {
    return typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : null;
  } catch (e) {
    return null;
  }
};

const getSafeId = () => {
  const secureId = generateId();
  if (secureId) return secureId;
  return `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
};

const normalizeText = (text) => {
  if (!text) return "";
  return text.toString()
    .replace(/[أإآ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/[\u064B-\u065F]/g, '')
    .trim()
    .toLowerCase();
};

const getLocalISODate = () => {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
};

const calculateDaysLeft = (targetDate) => {
  if (!targetDate) return null;
  try {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(targetDate);
    target.setHours(0, 0, 0, 0);
    const diffTime = target - today;
    const days = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    return days;
  } catch (error) {
    console.error('Error calculating days left:', error);
    return null;
  }
};

  const date = new Date(dateString);

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }

  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }

  componentDidCatch(error, errorInfo) {
    console.error('Application Error:', error, errorInfo);
  }

        className: "flex flex-col h-screen items-center justify-center gradient-bg-danger text-white p-8 text-center animate-fadeIn",

                React.createElement('span', { className: "text-purple-600" }, `${totalLiabilitiesEquity.toLocaleString()} ج.م`)
              ),
              
              React.createElement('div', { 
                className: `mt-2 p-3 rounded-lg text-center font-black ${
                  Math.abs(totalAssets - totalLiabilitiesEquity) < 0.01
                    ? 'bg-emerald-100 text-emerald-700'
                    : 'bg-red-100 text-red-700'
                }` 
              }, Math.abs(totalAssets - totalLiabilitiesEquity) < 0.01
                ? '✓ الميزانية متوازنة'
                : `✗ الميزانية غير متوازنة (فارق: ${Math.abs(totalAssets - totalLiabilitiesEquity).toLocaleString()} ج.م)`)
            )
          )
        )
      ),
      
      React.createElement('div', { className: "flex gap-4" },
        React.createElement('button', {
          type: "button",
          onClick: () => {
            // تصدير قائمة الدخل
            const incomeStatement = [
              ['قائمة الدخل'],
              ['الفترة:', `${dateRange.start} إلى ${dateRange.end}`],
              [],
              ['الإيرادات', 'المبلغ'],
              ...Object.values(ledgerAccounts)
                .filter(a => a.accountType === ACCOUNT_TYPES.INCOME && a.balance > 0)
                .map(a => [a.accountName, a.balance]),
              ['إجمالي الإيرادات', Object.values(ledgerAccounts)
                .filter(a => a.accountType === ACCOUNT_TYPES.INCOME)
                .reduce((sum, a) => sum + a.balance, 0)],
              [],
              ['المصروفات', 'المبلغ'],
              ...Object.values(ledgerAccounts)
                .filter(a => a.accountType === ACCOUNT_TYPES.EXPENSE && a.balance > 0)
                .map(a => [a.accountName, a.balance]),
              ['إجمالي المصروفات', Object.values(ledgerAccounts)
                .filter(a => a.accountType === ACCOUNT_TYPES.EXPENSE)
                .reduce((sum, a) => sum + a.balance, 0)],
              [],
              ['صافي الدخل', netIncome]
            ];
            
            const csvContent = incomeStatement.map(row => row.join(',')).join('\n');
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `income_statement_${dateRange.start}_to_${dateRange.end}.csv`;
            a.click();
            URL.revokeObjectURL(url);
          },
          className: "gradient-bg-profit text-white px-4 py-2 rounded-xl font-bold"
        }, "تصدير قائمة الدخل"),
        
        React.createElement('button', {
          type: "button",
          onClick: () => {
            // تصدير الميزانية العمومية
            const balanceSheet = [
              ['الميزانية العمومية'],
              ['التاريخ:', dateRange.end],
              [],
              ['الأصول', 'المبلغ'],
              ...Object.values(ledgerAccounts)
                .filter(a => a.accountType === ACCOUNT_TYPES.ASSET && a.balance > 0)
                .map(a => [a.accountName, a.balance]),
              ['إجمالي الأصول', totalAssets],
              [],
              ['الخصوم', 'المبلغ'],
              ...Object.values(ledgerAccounts)
                .filter(a => a.accountType === ACCOUNT_TYPES.LIABILITY && a.balance > 0)
                .map(a => [a.accountName, a.balance]),
              [],
              ['حقوق الملكية', 'المبلغ'],
              ...Object.values(ledgerAccounts)
                .filter(a => a.accountType === ACCOUNT_TYPES.EQUITY && a.balance > 0)
                .map(a => [a.accountName, a.balance]),
              ['إجمالي الخصوم وحقوق الملكية', totalLiabilitiesEquity]
            ];
            
            const csvContent = balanceSheet.map(row => row.join(',')).join('\n');
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `balance_sheet_${dateRange.end}.csv`;
            a.click();
            URL.revokeObjectURL(url);
          },
          className: "gradient-bg-primary text-white px-4 py-2 rounded-xl font-bold"
        }, "تصدير الميزانية العمومية"),
        
        React.createElement('button', {
          type: "button",
          onClick: () => {
            // تصدير التقرير المالي الكامل
            const fullReport = [
              ['التقرير المالي الكامل'],
              ['الفترة:', `${dateRange.start} إلى ${dateRange.end}`],
              [],
              ['ميزان المراجعة'],
              ['رقم الحساب', 'اسم الحساب', 'مدين', 'دائن', 'الرصيد', 'نوع الحساب'],
              ...Object.values(ledgerAccounts)
                .sort((a, b) => a.accountId.localeCompare(b.accountId))
                .map(a => [a.accountId, a.accountName, a.debitBalance, a.creditBalance, a.balance, a.accountType]),
              [],
              ['المجاميع', '', 
                Object.values(ledgerAccounts).reduce((sum, a) => sum + a.debitBalance, 0),
                Object.values(ledgerAccounts).reduce((sum, a) => sum + a.creditBalance, 0),
                Math.abs(
                  Object.values(ledgerAccounts).reduce((sum, a) => sum + a.debitBalance, 0) -
                  Object.values(ledgerAccounts).reduce((sum, a) => sum + a.creditBalance, 0)
                ),
                ''
              ]
            ];
            
            const csvContent = fullReport.map(row => row.join(',')).join('\n');
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `financial_report_${dateRange.start}_to_${dateRange.end}.csv`;
            a.click();
            URL.revokeObjectURL(url);
          },
          className: "gradient-bg-warning text-white px-4 py-2 rounded-xl font-bold"
        }, "تصدير تقرير كامل")
      )
    )
  );
});
AccountingLedgerView.displayName = 'AccountingLedgerView';

// المكون الرئيسي للتطبيق
const App = () => {
  const [state, setState] = useState({
    activeTab: 'dashboard',
    selectedMonth: MONTHS[new Date().getMonth()],
    isLocked: false,
    isDarkMode: localStorage.getItem('theme') === 'dark',
    accountingData: {
      journalEntries: JSON.parse(localStorage.getItem('journalEntries') || '[]'),
      ledgerAccounts: JSON.parse(localStorage.getItem('ledgerAccounts') || '{}'),
      trialBalance: JSON.parse(localStorage.getItem('trialBalance') || '{}')
    }
  });

  const toggleDarkMode = () => {
    const newMode = !state.isDarkMode;
    setState(prev => ({ ...prev, isDarkMode: newMode }));
    localStorage.setItem('theme', newMode ? 'dark' : 'light');
    if (newMode) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  };

  const renderActiveView = () => {
    switch (state.activeTab) {
      case 'dashboard':
        return React.createElement('div', { className: "space-y-6" },
          React.createElement('h1', { className: "text-2xl font-bold" }, "لوحة التحكم"),
          React.createElement('p', null, "مرحباً بك في نظام المحاسبة المتكامل")
        );
      case 'accounting':
        return React.createElement(AccountingLedgerView, {
          ledgerAccounts: state.accountingData.ledgerAccounts,
          journalEntries: state.accountingData.journalEntries,
          trialBalance: state.accountingData.trialBalance,
          onExportReport: () => {
            const allData = {
              journalEntries: state.accountingData.journalEntries,
              ledgerAccounts: state.accountingData.ledgerAccounts,
              trialBalance: state.accountingData.trialBalance,
              chartOfAccounts: CHART_OF_ACCOUNTS
            };
            
            const blob = new Blob([JSON.stringify(allData, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `accounting_records_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            alert('تم تصدير السجلات المحاسبية بنجاح');
          }
        });
      default:
        return React.createElement('div', { className: "space-y-6" },
          React.createElement('h1', { className: "text-2xl font-bold" }, "لوحة التحكم"),
          React.createElement('p', null, "مرحباً بك في نظام المحاسبة المتكامل")
        );
    }
  };

  // التأثيرات
  useEffect(() => {
    // تحميل حالة Dark Mode
    if (state.isDarkMode) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    // إخفاء شاشة التحميل
    setTimeout(() => {
      const loadingElement = document.getElementById('loading');
      if (loadingElement) {
        loadingElement.style.display = 'none';
      }
    }, 1000);
  }, [state.isDarkMode]);

  return React.createElement('div', { 
    className: `min-h-screen transition-colors duration-300 ${state.isDarkMode ? 'dark bg-dark-bg' : 'bg-gray-50'}`
  },
    // Header
    React.createElement('header', { className: "glass sticky top-0 z-50 border-b border-slate-200 dark:border-slate-800" },
      React.createElement('div', { className: "px-4 py-3 flex justify-between items-center" },
        React.createElement('div', { className: "flex items-center gap-3" },
          React.createElement('div', { className: "gradient-bg-primary p-2 rounded-lg" },
            React.createElement(IconWrapper, { icon: 'Wallet', size: 24, className: "text-white" })
          ),
          React.createElement('div', null,
            React.createElement('h1', { className: "font-black text-lg" }, "المحفظة المالية"),
            React.createElement('p', { className: "text-xs text-slate-500" }, "V52 المحاسبة المتكاملة")
          )
        ),
        React.createElement('button', {
          onClick: toggleDarkMode,
          className: "p-2 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700"
        },
          state.isDarkMode 
            ? React.createElement(IconWrapper, { icon: 'Sun', size: 20, className: "text-yellow-500" })
            : React.createElement(IconWrapper, { icon: 'Moon', size: 20, className: "text-slate-600" })
        )
      )
    ),

    // Main Content
    React.createElement('main', { className: "p-4 max-w-7xl mx-auto" },
      // Navigation Tabs
      React.createElement('div', { className: "flex gap-2 mb-6 overflow-x-auto pb-2" },
        ['dashboard', 'accounting'].map(tab => 
          React.createElement('button', {
            key: tab,
            onClick: () => setState(prev => ({ ...prev, activeTab: tab })),
            className: `px-4 py-2 rounded-lg font-medium whitespace-nowrap ${
              state.activeTab === tab 
                ? 'gradient-bg-primary text-white' 
                : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'
            }` 
          }, 
            tab === 'dashboard' ? 'لوحة التحكم' : 'المحاسبة'
          )
        )
      ),

      // Active View
      renderActiveView()
    ),

    // Lock Screen
    state.isLocked && React.createElement('div', { 
      className: "fixed inset-0 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center z-50" 
    },
      React.createElement(IconWrapper, { icon: 'Lock', size: 80, className: "text-blue-500 mb-4" }),
      React.createElement('h2', { className: "text-2xl font-bold text-white mb-4" }, "التطبيق مقفل"),
      React.createElement('button', {
        onClick: () => setState(prev => ({ ...prev, isLocked: false })),
        className: "gradient-bg-primary text-white px-8 py-3 rounded-xl font-bold"
      }, "فتح التطبيق")
    )
  );
};

// التقديم
const rootElement = document.getElementById('root');
if (rootElement) {
  const root = ReactDOM.createRoot(rootElement);
  root.render(
    React.createElement(ErrorBoundary, null,
      React.createElement(App)
    )
  );
}
</script>
</body>
</html>
