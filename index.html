const isInternalTransfer = (transaction) => {
  if (!transaction) return false;
  const isTransferCategory = TRANSFER_CATEGORIES.includes(transaction.category);
  const isBetweenCashAccounts = CASH_ACCOUNTS.includes(transaction.method) && 
                                (transaction.type === 'expense' || 
                                 (transaction.type === 'income' && 
                                  TRANSFER_CATEGORIES.includes(transaction.category)));
  return isTransferCategory || isBetweenCashAccounts;
};

const calculateNetWealth = (cashBalance, cardDebts, loanDebts) => {
  return cashBalance - cardDebts - loanDebts;
};

const getMonthIndex = (monthName) => {

};

const getLocalISODate = () => {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
};

const generateId = () => {
  try {
    return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
  } catch (e) {
    return `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
  }
};

const normalizeText = (text) => {
  if (!text) return "";
  return text.toString()
    .replace(/[أإآ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/[\u064B-\u065F]/g, '')
    .trim()
    .toLowerCase();
};

// ========== PART 5: REDUCER ==========
function dataReducer(state, action) {
  switch (action.type) {
    case 'SET_DATA':
      return { ...state, data: action.payload };
    case 'SET_ACTIVE_TAB':
      return { ...state, activeTab: action.payload };
    case 'SET_SELECTED_MONTH':
      return { ...state, selectedMonth: action.payload };
    case 'SET_TRANS_VIEW_MODE':
      return { ...state, transViewMode: action.payload };
    case 'SET_FORM_OPEN':
      return { ...state, isFormOpen: action.payload };
    case 'SET_FORM_DATA':
      return { ...state, formData: action.payload };
    case 'SET_FORM_MODE':
      return { ...state, formMode: action.payload };
    case 'TOGGLE_DARK_MODE':
      return { ...state, isDarkMode: action.payload };
    case 'ADD_NOTIFICATION':
      return { ...state, notifications: [...state.notifications, { id: Date.now(), ...action.payload }] };
    case 'REMOVE_NOTIFICATION':
      return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
    case 'UPDATE_TRANSACTIONS':
      return { ...state, data: { ...state.data, transactions: action.payload } };
    case 'UPDATE_LOANS':
      return { ...state, data: { ...state.data, loans: action.payload } };
    case 'UPDATE_CARDS':
      return { ...state, data: { ...state.data, cards: action.payload } };
    case 'UPDATE_OPENING_BALANCE':
      return { ...state, data: { ...state.data, openingBalance2026: action.payload } };
    case 'UPDATE_FAWRY_DATA':
      return { ...state, fawryData: action.payload };
    case 'UPDATE_ETISALAT_DATA':
      return { ...state, etisalatData: action.payload };
    case 'ADD_TO_HISTORY':
      const limitedHistory = [...state.history].slice(-19);
      return { ...state, history: [...limitedHistory, action.payload], future: [] };
    case 'UNDO':
      if (state.history.length === 0) return state;
      const previous = state.history[state.history.length - 1];
      return { ...state, data: previous, history: state.history.slice(0, state.history.length - 1), future: [state.data, ...state.future] };
    case 'REDO':
      if (state.future.length === 0) return state;
      const next = state.future[0];
      return { ...state, data: next, history: [...state.history, state.data], future: state.future.slice(1) };
    case 'TOGGLE_LEDGER':
      return { ...state, expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] } };
    case 'SHOW_CONFIRM':
      return { 
        ...state, 
        confirmDialog: { 
          isOpen: true, 
          title: action.payload.title, 
          message: action.payload.message, 
          onConfirm: action.payload.onConfirm, 
          onCancel: action.payload.onCancel || (() => dispatch({ type: 'HIDE_CONFIRM' })) 
        } 
      };
    case 'HIDE_CONFIRM':
      return { ...state, confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null } };
    case 'SET_QUICK_TRANSFER_MODAL_OPEN':
      return { ...state, isQuickTransferModalOpen: action.payload };
    case 'SET_QUICK_TRANSFER_DATA':
      return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
    case 'CLOSE_MONTH':
      return {
        ...state,
        data: {
          ...state.data,
          closedMonths: [...(state.data.closedMonths || []), action.payload.month],
          monthlySnapshots: { 
            ...(state.data.monthlySnapshots || {}), 
            [action.payload.month]: action.payload.balance 
          }
        }
      };
    case 'TOGGLE_WALLET_VISIBILITY':
      return {
        ...state,
        walletVisibility: {
          ...state.walletVisibility,
          [action.payload]: !state.walletVisibility[action.payload]
        }
      };
    case 'SET_IS_PROCESSING':
      return { ...state, isProcessing: action.payload };
    case 'SET_EDITING_CARD':
      return { ...state, editingCard: action.payload };
    case 'SET_EDITING_LOAN':
      return { ...state, editingLoan: action.payload };
    case 'SET_SEARCH_TERM':
      return { ...state, searchTerm: action.payload };
    case 'SET_STATUS_FILTER':
      return { ...state, statusFilter: action.payload };
    case 'SET_FILTER_TYPE':
      return { ...state, filterType: action.payload };
    case 'SET_VIEWING_CARD_STATEMENT':
      return { ...state, viewingCardStatement: action.payload };
    case 'SET_AUTH':
      return { ...state, isAuthenticated: action.payload.isAuthenticated, authLoading: action.payload.authLoading || false };
    default:
      return state;
  }
}

          addNotification({ type: 'success', title: 'تم الحذف' });
        }
      }
    });
  }, [transactions, addNotification]);

  const handleQuickTransfer = useCallback((e) => {
    e.preventDefault();
    
    const amount = Number(quickTransferData.amount);
    if (amount <= 0 || isNaN(amount)) {
      addNotification({ type: 'error', title: 'خطأ', message: 'يرجى إدخال مبلغ صحيح أكبر من صفر' });
      return;
    }

    if (quickTransferData.from === quickTransferData.to) {
      addNotification({ type: 'error', title: 'خطأ', message: 'لا يمكن التحويل لنفس المحفظة' });
      return;
    }

    saveHistory();

    const fromLabel = PAYMENT_METHODS.find(p => p.id === quickTransferData.from)?.label || quickTransferData.from;
    const toLabel = PAYMENT_METHODS.find(p => p.id === quickTransferData.to)?.label || quickTransferData.to;

    const fromTransaction = {
      id: generateId(),
      type: 'expense',
      category: 'تحويلات',
      amount: amount,
      description: `تحويل سريع إلى ${toLabel}`,
      method: quickTransferData.from,
      date: getLocalISODate(),
      month: selectedMonth,
      monthIndex: getMonthIndex(selectedMonth),
      subType: 'withdrawal',
      status: 'paid'
    };

    const toTransaction = {
      id: generateId(),
      type: 'income',
      category: 'تحويلات واردة',
      amount: amount,
      description: `تحويل من ${fromLabel}`,
      method: quickTransferData.to,
      date: getLocalISODate(),
      month: selectedMonth,
      monthIndex: getMonthIndex(selectedMonth),
      subType: 'deposit',
      status: 'paid'
    };

    const newTransactions = [fromTransaction, toTransaction, ...transactions];
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTransactions });
    dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
    dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: 'cash', to: 'fawry', amount: 0 } });
    
    addNotification({ 
      type: 'success', 
      title: 'تم التحويل بنجاح', 
      message: `تم تحويل ${amount.toLocaleString()} ج.م` 
    });
  }, [quickTransferData, selectedMonth, transactions, saveHistory, addNotification]);

          dispatch({ type: 'SET_AUTH', payload: { isAuthenticated: true } });
          addNotification({
            type: 'success',
            title: 'تم تسجيل الدخول بنجاح',

        } else {
          await auth.signOut();
          addNotification({
            type: 'error',
            title: 'دخول غير مصرح',
            message: 'يُسمح فقط بحساب ahmedmkh@gmail.com'
          });
        }
      } catch (error) {
        console.error("❌ خطأ تسجيل الدخول:", error);
        addNotification({
          type: 'error',
          title: 'خطأ في تسجيل الدخول',
          message: error.message

        setIsLoading(false);

    return (

          <div className="absolute top-0 right-0 w-40 h-40 bg-blue-600/20 rounded-full blur-[80px] -translate-y-1/2 translate-x-1/2"></div>
          <div className="absolute bottom-0 left-0 w-40 h-40 bg-emerald-600/20 rounded-full blur-[80px] translate-y-1/2 -translate-x-1/2"></div>

          <div className="w-24 h-24 bg-gradient-to-br from-blue-500/20 to-indigo-500/20 rounded-full flex items-center justify-center mb-8 shadow-glow text-blue-500 animate-bounce-slight relative z-10 backdrop-blur-sm border border-blue-500/10">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>

          >
            {isLoading ? (
              <>
                <div className="w-5 h-5 border-2 border-slate-900 border-t-transparent rounded-full animate-spin"></div>

              <>

        </div>
      </div>
    );
  };

  const NotificationCenter = () => {
    if (!notifications || notifications.length === 0) return null;
    
    return (
      <div className="fixed top-16 left-6 z-[10000] max-w-sm w-full space-y-3 animate-fadeInUp pointer-events-none no-print">
        {notifications.map(n => {
          const bgColor = n.type === 'success' ? 'gradient-bg-success' : 
                         n.type === 'warning' ? 'gradient-bg-warning' : 
                         n.type === 'error' ? 'gradient-bg-danger' : 'gradient-bg-primary';
          return (
            <div key={n.id} className={`relative flex items-start p-4 text-white rounded-2xl shadow-xl backdrop-blur-md animate-slideInRight pointer-events-auto ${bgColor}`}>
              <div className="ml-3 text-sm font-bold pr-6">

  const ConfirmDialog = () => {

    return (
      <div className="modal-backdrop z-[5000]">

                className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>
            </div>
            
            <div className="space-y-3">
              <div className="flex justify-between">
                <span className="text-sm text-slate-500">الحد الائتماني</span>
                <span className="font-bold">{card.limit.toLocaleString()} ج.م</span>
              </div>
              <div className="flex justify-between">
                <span className="text-sm text-slate-500">رصيد أول المدة</span>
                <span className="font-bold text-red-600">{card.openingBalance.toLocaleString()} ج.م</span>
              </div>
              <div className="flex justify-between">
                <span className="text-sm text-slate-500">تاريخ الانتهاء</span>
                <span className="font-bold">{card.expiry}</span>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  const renderLoansView = () => (
    <div className="space-y-8 animate-fadeIn">
      <div className="glass p-8 rounded-2xl gradient-border relative overflow-hidden">
        <div className="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full blur-[80px] -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
        <p className="text-slate-400 text-xs font-bold uppercase tracking-widest relative z-10">إجمالي المديونية الشاملة</p>
        <h3 className="text-4xl font-black font-mono mt-2 text-gradient relative z-10">
          {updatedLoans.reduce((sum, l) => sum + l.remaining, 0).toLocaleString()} <span className="text-2xl text-slate-500 font-normal">ج.م</span>
        </h3>
      </div>
      
      <div className="grid grid-cols-1 gap-6">
        {updatedLoans.map(loan => {
          const isPaid = loan.remaining <= 0;
          const percentPaid = loan.totalAmount > 0 ? (loan.totalPaid / loan.totalAmount) * 100 : 0;
          
          return (
            <div key={loan.id} className={`glass p-6 rounded-2xl border ${isPaid ? 'border-emerald-200' : 'border-slate-200'}`}>
              <div className="flex justify-between items-start mb-4">
                <div>
                  <h4 className="font-bold text-lg text-slate-800 dark:text-white">{loan.name}</h4>
                  <p className="text-sm text-slate-500">{loan.description}</p>
                </div>
                <button
                  onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: loan })}
                  className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                </button>
              </div>
              
              <div className="space-y-3">
                <div className="flex justify-between">
                  <span className="text-sm text-slate-500">المبلغ الكلي</span>
                  <span className="font-bold">{loan.totalAmount.toLocaleString()} ج.م</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-sm text-slate-500">المتبقي</span>
                  <span className={`font-bold ${isPaid ? 'text-emerald-600' : 'text-red-600'}`}>
                    {loan.remaining.toLocaleString()} ج.م
                  </span>
                </div>
                <div className="flex justify-between">
                  <span className="text-sm text-slate-500">القسط الشهري</span>
                  <span className="font-bold">{loan.monthlyInstallment.toLocaleString()} ج.م</span>
                </div>
                
                <div className="mt-4">
                  <div className="flex justify-between text-sm mb-1">
                    <span>نسبة السداد</span>
                    <span>{Math.round(percentPaid)}%</span>
                  </div>
                  <div className="w-full bg-slate-200 rounded-full h-2 dark:bg-slate-700">
                    <div 
                      className="gradient-bg-success h-2 rounded-full transition-all"
                      style={{ width: `${Math.min(100, percentPaid)}%` }}
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  const renderActiveView = () => {
    switch (activeTab) {
      case 'dashboard': return renderDashboard();
      case 'transactions': return renderTransactionsView();
      case 'cards': return renderCardsView();
      case 'loans': return renderLoansView();
      default: return renderDashboard();
    }
  };

  // ========== PART 12: MAIN RENDER ==========
  if (authLoading) {
    return (
      <div className="flex h-screen items-center justify-center bg-slate-900">
        <div className="text-center">
          <div className="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
          <p className="text-white text-lg font-bold">جاري التحقق من المصادقة...</p>
        </div>
      </div>
    );
  }

  if (!isAuthenticated) {
    return <LoginScreen />;
  }

  return (
    <div className="flex h-screen overflow-hidden text-slate-800 dark:text-slate-100 font-sans">
      <NotificationCenter />
      <ConfirmDialog />

      {isProcessing && (
        <div className="processing-overlay">
          <div className="processing-spinner mb-4"></div>
          <h3 className="text-xl font-bold mb-2">جاري تطبيق العملية</h3>
          <p className="text-sm opacity-80 mb-6">قد تستغرق العملية بضع ثوانٍ</p>
          <button
            onClick={() => dispatch({ type: 'SET_IS_PROCESSING', payload: false })}
            className="px-6 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold transition-colors"
          >
            إلغاء العملية
          </button>
        </div>
      )}

      <div className="bottom-nav-container no-print">
        <div className="scrollable-nav scroll-hide">
          {[
            { id: 'dashboard', label: 'الرئيسية', icon: '📊' },
            { id: 'transactions', label: 'المعاملات', icon: '💸' },
            { id: 'cards', label: 'البطاقات', icon: '💳' },
            { id: 'loans', label: 'القروض', icon: '💰' },
          ].map(item => (
            <button 
              key={item.id} 
              type="button" 
              onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} 
              className={`nav-btn ${activeTab === item.id ? 'active' : ''}`} 
              aria-label={item.label}
            >
              <span className="text-xl">{item.icon}</span>
              <span>{item.label}</span>
              {activeTab === item.id && (
                <div className="absolute -top-1 w-1.5 h-1.5 bg-white rounded-full animate-pulse" />
              )}
            </button>
          ))}
          
          <div className="v-line"></div>
          
          <button 
            type="button" 
            onClick={() => {
              dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
              dispatch({ 
                type: 'SET_FORM_DATA', 
                payload: { 
                  type: 'income', 
                  amount: '', 
                  date: getLocalISODate(), 
                  month: selectedMonth, 
                  method: 'cash', 
                  subType: 'deposit',
                  category: ''
                } 
              });
              dispatch({ type: 'SET_FORM_OPEN', payload: true });
            }}
            className="nav-btn text-emerald-600 hover:bg-emerald-50"
            aria-label="إضافة دخل"
          >
            <span className="text-xl">➕</span>
            <span>دخل</span>
          </button>
          
          <button 
            type="button" 
            onClick={() => {
              dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
              dispatch({ 
                type: 'SET_FORM_DATA', 
                payload: { 
                  type: 'expense', 
                  amount: '', 
                  date: getLocalISODate(), 
                  month: selectedMonth, 
                  method: 'cash', 
                  subType: 'withdrawal',
                  category: ''
                } 
              });
              dispatch({ type: 'SET_FORM_OPEN', payload: true });
            }}
            className="nav-btn text-red-600 hover:bg-red-50"
            aria-label="إضافة مصروف"
          >
            <span className="text-xl">➖</span>
            <span>مصروف</span>
          </button>
          
          <button 
            type="button" 
            onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: true })}
            className="nav-btn text-blue-600 hover:bg-blue-50"
            aria-label="تحويل سريع"
          >
            <span className="text-xl">🔄</span>
            <span>تحويل</span>
          </button>
          
          <div className="v-line"></div>
          
          <button 
            type="button" 
            onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: !isDarkMode })}
            className="nav-btn"
            aria-label="تبديل الوضع"
          >
            <span className="text-xl">{isDarkMode ? '🌙' : '☀️'}</span>
            <span>مظهر</span>
          </button>
          
          <button 
            type="button" 
            onClick={() => {
              auth.signOut();
              dispatch({ type: 'SET_AUTH', payload: { isAuthenticated: false } });
            }}
            className="nav-btn text-red-600 hover:bg-red-50"
            aria-label="تسجيل الخروج"
          >
            <span className="text-xl">🚪</span>
            <span>خروج</span>
          </button>
        </div>
      </div>

      {!isLocked && (
        <button 
          type="button" 
          onClick={() => {
            dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
            dispatch({ 
              type: 'SET_FORM_DATA', 
              payload: { 
                type: 'expense', 
                category: '', 
                amount: '', 
                date: getLocalISODate(), 
                month: selectedMonth, 
                method: 'cash', 
                subType: 'withdrawal' 
              } 
            });
            dispatch({ type: 'SET_FORM_OPEN', payload: true });
          }} 
          className="fab no-print"
          title="إضافة عملية جديدة"
          aria-label="إضافة عملية جديدة"
        >
          <span className="text-2xl">+</span>
        </button>
      )}

      <main ref={mainContentRef} className="flex-1 overflow-y-auto p-4 lg:p-8 relative scroll-smooth pt-12">
        {isLocked ? (
          <div className="lock-screen backdrop-blur-3xl animate-fadeIn no-print">
            <div className="w-24 h-24 bg-gradient-to-br from-blue-500/20 to-indigo-500/20 rounded-full flex items-center justify-center mb-8 shadow-glow text-blue-500 animate-bounce-slight relative z-10 backdrop-blur-sm border border-blue-500/10">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <h2 className="text-4xl font-black mb-8 tracking-tight text-white">التطبيق مقفل</h2>
            <button 
              type="button" 
              onClick={() => dispatch({ type: 'SET_IS_LOCKED', payload: false })}
              className="gradient-bg-primary text-white px-16 py-5 rounded-full font-bold shadow-2xl flex items-center gap-3 transition-all hover:scale-105 active:scale-95"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
              </svg>
              فتح التطبيق
            </button>
          </div>
        ) : (
          <div className="max-w-7xl mx-auto space-y-8 animate-fadeIn pb-24">
            <header className="flex flex-col md:flex-row justify-between items-center gap-6 mb-8">
              <div className="flex-1">
                <div className="flex items-center gap-4 mb-2">
                  <div className="gradient-bg-primary p-3 rounded-2xl text-white shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
                      <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
                      <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
                    </svg>
                  </div>
                  <div>
                    <h1 className="text-3xl font-black text-slate-900 dark:text-white tracking-tight">
                      محفظتي المالية
                    </h1>
                    <p className="text-sm text-slate-500 font-medium mt-1">
                      إدارة مالية ذكية • {CURRENT_YEAR}
                    </p>
                  </div>
                </div>
              </div>

              <div className="flex flex-wrap gap-3">
                <div className="flex bg-white dark:bg-slate-800 p-1 rounded-xl shadow-md">
                  <button 
                    type="button" 
                    onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: false })}
                    className={`p-3 rounded-lg transition-all ${!isDarkMode ? 'bg-blue-50 text-blue-600 shadow-sm' : 'text-slate-400'}`}
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <circle cx="12" cy="12" r="4"/>
                      <path d="M12 2v2"/>
                      <path d="M12 20v2"/>
                      <path d="m4.93 4.93 1.41 1.41"/>
                      <path d="m17.66 17.66 1.41 1.41"/>
                      <path d="M2 12h2"/>
                      <path d="M20 12h2"/>
                      <path d="m6.34 17.66-1.41 1.41"/>
                      <path d="m19.07 4.93-1.41 1.41"/>
                    </svg>
                  </button>
                  <button 
                    type="button" 
                    onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: true })}
                    className={`p-3 rounded-lg transition-all ${isDarkMode ? 'bg-slate-700 text-blue-400 shadow-sm' : 'text-slate-400'}`}
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                    </svg>
                  </button>
                </div>
              </div>
            </header>

            {renderActiveView()}
          </div>
        )}
      </main>

      {/* Transaction Form Modal */}
      {isFormOpen && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-fadeIn border border-white/20">
            <div className="p-8 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/30">
              <h3 className="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                <div className="gradient-bg-primary p-2 rounded-xl text-white shadow-lg">
                  {formMode === 'add' ? '+' : '✏️'}
                </div>
                {formMode === 'add' ? 'إضافة عملية' : 'تعديل عملية'}
              </h3>
              <button 
                type="button" 
                onClick={() => dispatch({ type: 'SET_FORM_OPEN', payload: false })} 
                className="text-slate-400 hover:text-red-500 p-2 hover:bg-red-50 rounded-xl transition-colors"
                aria-label="إغلاق"
              >
                ✕
              </button>
            </div>
            
            <form onSubmit={handleSaveTransaction} className="p-8 space-y-6">
              <div className="grid grid-cols-2 gap-6">
                <div>
                  <label className="block text-sm font-bold mb-2 text-slate-400 uppercase">النوع</label>
                  <select 
                    className="input-field font-bold" 
                    value={formData.type} 
                    onChange={(e) => {
                      const newType = e.target.value;
                      const newSubType = newType === 'income' ? 'deposit' : 'withdrawal';
                      dispatch({ 
                        type: 'SET_FORM_DATA', 
                        payload: { ...formData, type: newType, subType: newSubType } 
                      });
                    }}
                  >
                    <option value="expense">مصروف 💸</option>
                    <option value="income">دخل 💰</option>
                  </select>
                </div>
                
                <div>
                  <label className="block text-sm font-bold mb-2 text-slate-400 uppercase">الفئة</label>
                  <select 
                    className="input-field font-bold" 
                    value={formData.category} 
                    onChange={e => dispatch({ 
                      type: 'SET_FORM_DATA', 
                      payload: { ...formData, category: e.target.value } 
                    })} 
                    required
                  >
                    <option value="">اختر التصنيف...</option>
                    {CATEGORIES[formData.type].map(category => (
                      <option key={category} value={category}>{category}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-sm font-bold mb-2 text-slate-400 uppercase">المبلغ</label>
                <input 
                  type="number" 
                  required 
                  step="0.01" 
                  min="0.01" 
                  className="input-field text-xl font-black text-blue-600" 
                  value={formData.amount} 
                  onChange={e => dispatch({ 
                    type: 'SET_FORM_DATA', 
                    payload: { ...formData, amount: e.target.value } 
                  })} 
                />
              </div>

              <div className="grid grid-cols-2 gap-6">
                <div>
                  <label className="block text-sm font-bold mb-2 text-slate-400 uppercase">التاريخ</label>
                  <input 
                    type="date" 
                    required 
                    className="input-field text-sm font-bold" 
                    value={formData.date} 
                    onChange={e => dispatch({ 
                      type: 'SET_FORM_DATA', 
                      payload: { ...formData, date: e.target.value } 
                    })} 
                  />
                </div>
                
                <div>
                  <label className="block text-sm font-bold mb-2 text-slate-400 uppercase">طريقة الدفع</label>
                  <select 
                    className="input-field text-sm font-bold" 
                    value={formData.method} 
                    onChange={e => dispatch({ 
                      type: 'SET_FORM_DATA', 
                      payload: { ...formData, method: e.target.value } 
                    })}
                  >
                    {PAYMENT_METHODS.map(method => (
                      <option key={method.id} value={method.id}>{method.label}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-sm font-bold mb-2 text-slate-400 uppercase">الوصف</label>
                <input 
                  type="text" 
                  className="input-field font-bold" 
                  value={formData.description || ''} 
                  onChange={e => dispatch({ 
                    type: 'SET_FORM_DATA', 
                    payload: { ...formData, description: e.target.value } 
                  })} 
                  placeholder="تفاصيل إضافية..." 
                />
              </div>

              <button 
                type="submit" 
                className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-black text-lg shadow-xl hover:shadow-2xl hover:scale-[1.02] active:scale-95 transition-all mt-4 relative overflow-hidden"
                disabled={isProcessing}
              >
                {isProcessing ? (
                  <>
                    <div className="absolute inset-0 bg-blue-600 flex items-center justify-center">
                      <div className="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <span className="invisible">حفظ العملية</span>
                  </>
                ) : 'حفظ العملية'}
              </button>
            </form>
          </div>
        </div>
      )}

      {/* Quick Transfer Modal */}
      {isQuickTransferModalOpen && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-fadeIn border border-blue-500/50">
            <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center gradient-border">
              <h3 className="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2">
                <span className="text-blue-600">🔄</span>
                تحويل سريع
              </h3>
              <button 
                type="button" 
                onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false })} 
                className="p-2 hover:bg-red-50 hover:text-red-500 rounded-xl transition-colors"
              >
                ✕
              </button>
            </div>
            
            <form onSubmit={handleQuickTransfer} className="p-6 space-y-6">
              <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl">
                <div className="flex justify-between items-center text-sm font-bold text-blue-700 dark:text-blue-300 mb-2">
                  <span>من</span>
                  <span>إلى</span>
                </div>
                <div className="flex justify-between items-center gap-4">
                  <select 
                    className="input-field text-sm" 
                    value={quickTransferData.from} 
                    onChange={e => dispatch({ 
                      type: 'SET_QUICK_TRANSFER_DATA', 
                      payload: { from: e.target.value } 
                    })}
                  >
                    {PAYMENT_METHODS.map(method => (
                      <option key={method.id} value={method.id}>{method.label}</option>
                    ))}
                  </select>
                  
                  <div className="text-blue-300">🔄</div>
                  
                  <select 
                    className="input-field text-sm" 
                    value={quickTransferData.to} 
                    onChange={e => dispatch({ 
                      type: 'SET_QUICK_TRANSFER_DATA', 
                      payload: { to: e.target.value } 
                    })}
                  >
                    {PAYMENT_METHODS.map(method => (
                      <option key={method.id} value={method.id}>{method.label}</option>
                    ))}
                  </select>
                </div>
              </div>
              
              <div>
                <label className="block text-sm font-bold mb-2 text-slate-500 uppercase">المبلغ</label>
                <input 
                  type="number" 
                  required 
                  step="0.01" 
                  min="0.01" 
                  className="input-field text-xl font-black text-blue-600" 
                  value={quickTransferData.amount} 
                  onChange={e => dispatch({ 
                    type: 'SET_QUICK_TRANSFER_DATA', 
                    payload: { amount: e.target.value } 
                  })} 
                  placeholder="0.00" 
                />
              </div>
              
              <button 
                type="submit" 
                className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold shadow-lg hover:shadow-xl transition-all active:scale-95"
              >
                تنفيذ التحويل
              </button>
            </form>
          </div>
        </div>
      )}

      {/* Edit Card Modal */}
      {editingCard && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-fadeIn">
            <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center">
              <h3 className="text-xl font-black">تعديل بيانات البطاقة</h3>
              <button 
                type="button" 
                onClick={() => dispatch({ type: 'SET_EDITING_CARD', payload: null })} 
                className="text-slate-400 hover:text-red-500 p-2 hover:bg-red-50 rounded-xl transition-colors"
              >
                ✕
              </button>
            </div>
            
            <form 
              onSubmit={(e) => {
                e.preventDefault();
                saveHistory();
                const updatedCards = cards.map(c => 
                  c.id === editingCard.id ? editingCard : c
                );
                dispatch({ type: 'UPDATE_CARDS', payload: updatedCards });
                dispatch({ type: 'SET_EDITING_CARD', payload: null });
                addNotification({ 
                  type: 'success', 
                  title: 'تم التحديث', 
                  message: 'تم تحديث بيانات البطاقة بنجاح' 
                });
              }} 
              className="p-6 space-y-4"
            >
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-xs font-bold text-slate-500 mb-1 block">اسم البطاقة</label>
                  <input 
                    type="text" 
                    required 
                    className="input-field" 
                    value={editingCard.name} 
                    onChange={e => dispatch({ 
                      type: 'SET_EDITING_CARD', 
                      payload: { ...editingCard, name: e.target.value } 
                    })} 
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-500 mb-1 block">البنك</label>
                  <input 
                    type="text" 
                    required 
                    className="input-field" 
                    value={editingCard.bank} 
                    onChange={e => dispatch({ 
                      type: 'SET_EDITING_CARD', 
                      payload: { ...editingCard, bank: e.target.value } 
                    })} 
                  />
                </div>
              </div>
              
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-xs font-bold text-slate-500 mb-1 block">الحد الائتماني</label>
                  <input 
                    type="number" 
                    required 
                    min="0" 
                    className="input-field text-blue-600 font-bold" 
                    value={editingCard.limit} 
                    onChange={e => dispatch({ 
                      type: 'SET_EDITING_CARD', 
                      payload: { ...editingCard, limit: Number(e.target.value) } 
                    })} 
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-500 mb-1 block">رصيد أول المدة</label>
                  <input 
                    type="number" 
                    min="0" 
                    className="input-field text-red-500 font-bold" 
                    value={editingCard.openingBalance} 
                    onChange={e => dispatch({ 
                      type: 'SET_EDITING_CARD', 
                      payload: { ...editingCard, openingBalance: Number(e.target.value) } 
                    })} 
                  />
                </div>
              </div>
              
              <button 
                type="submit" 
                className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold shadow-lg hover:shadow-xl transition-all mt-2 active:scale-95"
              >
                حفظ التعديلات
              </button>
            </form>
          </div>
        </div>
      )}

      {/* Edit Loan Modal */}
      {editingLoan && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-fadeIn">
            <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center">
              <h3 className="text-xl font-black">تعديل الالتزام</h3>
              <button 
                type="button" 
                onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: null })} 
                className="text-slate-400 hover:text-red-500 p-2 hover:bg-red-50 rounded-xl transition-colors"
              >
                ✕
              </button>
            </div>
            
            <form 
              onSubmit={(e) => {
                e.preventDefault();
                saveHistory();
                const updatedLoans = loans.map(l => 
                  l.id === editingLoan.id ? editingLoan : l
                );
                dispatch({ type: 'UPDATE_LOANS', payload: updatedLoans });
                dispatch({ type: 'SET_EDITING_LOAN', payload: null });
                addNotification({ 
                  type: 'success', 
                  title: 'تم التحديث', 
                  message: 'تم تحديث بيانات القرض بنجاح' 
                });
              }} 
              className="p-6 space-y-4"
            >
              <div>
                <label className="text-xs font-bold text-slate-500">الاسم</label>
                <input 
                  type="text" 
                  className="input-field" 
                  value={editingLoan.name} 
                  onChange={e => dispatch({ 
                    type: 'SET_EDITING_LOAN', 
                    payload: { ...editingLoan, name: e.target.value } 
                  })} 
                />
              </div>
              
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-xs font-bold text-slate-500">المبلغ الكلي</label>
                  <input 
                    type="number" 
                    min="0" 
                    className="input-field" 
                    value={editingLoan.totalAmount} 
                    onChange={e => dispatch({ 
                      type: 'SET_EDITING_LOAN', 
                      payload: { ...editingLoan, totalAmount: e.target.value } 
                    })} 
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-500">القسط الشهري</label>
                  <input 
                    type="number" 
                    min="0" 
                    className="input-field" 
                    value={editingLoan.monthlyInstallment} 
                    onChange={e => dispatch({ 
                      type: 'SET_EDITING_LOAN', 
                      payload: { ...editingLoan, monthlyInstallment: e.target.value } 
                    })} 
                  />
                </div>
              </div>
              
              <button 
                type="submit" 
                className="w-full gradient-bg-primary text-white py-3 rounded-xl font-bold mt-4"
              >
                حفظ التعديلات
              </button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

// ========== PART 13: INITIALIZATION ==========
const rootElement = document.getElementById('root');
if (rootElement) {
  // Hide loading screen after 2 seconds
  setTimeout(() => {
    const loadingElement = document.getElementById('loading');
    if (loadingElement) {
      loadingElement.style.display = 'none';
    }
  }, 2000);

  // Render the app
  const root = ReactDOM.createRoot(rootElement);
  root.render(<App />);
}
</script>
</body>
</html>
