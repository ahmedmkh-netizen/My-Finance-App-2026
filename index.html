if (!parsed) return parsed;
const cards = Array.isArray(parsed.cards) ? parsed.cards : [];
const loans = Array.isArray(parsed.loans) ? parsed.loans : [];
const recurring = Array.isArray(parsed.recurringItems) ? parsed.recurringItems : [];
const hasSig = cards.some(c => c.name === 'Signature' && String(c.last4) === '0391');
const hasSWYPE = cards.some(c => c.name === 'SWYPE');
const hasTakyeef = loans.some(l => l.name && l.name.includes('تكييف محمود'));
const hasHany = loans.some(l => l.name && l.name.includes('محل هاني'));
return {
...parsed,
cards: (!hasSig || !hasSWYPE || cards.length < 3) ? DEFAULT_CARDS : cards,
loans: (!hasTakyeef || !hasHany) ? DEFAULT_LOANS : loans,
recurringItems: recurring.length < 5 ? DEFAULT_RECURRING : recurring,
closedMonths: Array.isArray(parsed.closedMonths) ? parsed.closedMonths : []
};
};

class ErrorBoundary extends React.Component {
constructor(p) { super(p); this.state = { hasError: false, error: null }; }
static getDerivedStateFromError(error) { return { hasError: true, error }; }
componentDidCatch(e, i) { console.error('App Error:', e, i); }
render() {
if (this.state.hasError) return (
<div className="flex flex-col h-screen items-center justify-center gradient-bg-danger text-white p-8 text-center" dir="rtl">
<div className="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-6"><AlertTriangle size={48} /></div>
<h1 className="text-3xl font-black mb-2">عذراً، حدث خطأ تقني</h1>
<p className="text-sm opacity-80 mb-4 max-w-md break-words">{this.state.error?.message || 'خطأ غير معروف'}</p>
<div className="flex gap-4 flex-wrap justify-center mt-6">
<button onClick={() => window.location.reload()} className="gradient-bg-primary text-white px-8 py-4 rounded-2xl font-bold flex items-center gap-2"><RefreshCcw size={20}/> إعادة</button>
<button onClick={() => { localStorage.clear(); window.location.reload(); }} className="bg-red-500 text-white px-8 py-4 rounded-2xl font-bold flex items-center gap-2"><Trash2 size={20}/> مسح</button>
</div>
</div>
);
return this.props.children;
}
}

const DuplicateDetectionSystem = ({ transactions, dispatch, addNotification, closedMonths }) => {
const [threshold, setThreshold] = useState(2);
const [selectedMonth, setSelectedMonth] = useState('كل الشهور');
const [expandedGroups, setExpandedGroups] = useState({});
const duplicates = useMemo(() => {
const map = {};
const filtered = selectedMonth === 'كل الشهور' ? transactions : transactions.filter(t => t.month === selectedMonth);
filtered.forEach(t => { const key = `${safeNumber(t.amount)}_${t.method}_${t.category}`; if (!map[key]) map[key] = []; map[key].push(t); });
return Object.entries(map).filter(([_, items]) => items.length >= threshold).map(([key, items]) => ({ key, amount: items[0].amount, count: items.length, items, category: items[0].category, risk: items.length >= 5 ? 'high' : items.length >= 3 ? 'medium' : 'low' }));
}, [transactions, threshold, selectedMonth]);
const handleDeleteAll = () => {
let idsToDelete = [], protectedCount = 0;
duplicates.forEach(d => { d.items.slice(1).forEach(item => { if (closedMonths?.includes(item.month)) protectedCount++; else idsToDelete.push(item.id); }); });
if (idsToDelete.length === 0 && protectedCount > 0) { addNotification({ type: 'error', title: 'محظور', message: 'جميع المكررات في أشهر مغلقة.' }); return; }
dispatch({ type: 'SHOW_CONFIRM', title: 'تأكيد الحذف', message: `سيتم حذف ${idsToDelete.length} عملية مكررة.${protectedCount > 0 ? ` تم تجاهل ${protectedCount}.` : ''}`, onConfirm: () => { dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.filter(t => !idsToDelete.includes(t.id)) }); addNotification({ type: 'success', title: 'تم التنظيف' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
};
return (
<div className="space-y-8 animate-fadeIn pb-20">
<div className="glass p-8 rounded-2xl flex justify-between items-center gradient-border mb-6 flex-wrap gap-4">
<div><h2 className="text-2xl font-black flex items-center gap-3"><Filter className="text-blue-500" /> كاشف التكرار الذكي</h2><p className="text-slate-500 mt-1 text-sm font-bold">تحليل لاكتشاف المبالغ المسجلة مرتين</p></div>
<button onClick={handleDeleteAll} disabled={duplicates.length === 0} className={`px-6 py-3 rounded-xl font-bold flex items-center gap-2 ${duplicates.length === 0 ? 'bg-slate-100 text-slate-400' : 'gradient-bg-danger text-white shadow-lg'}`}><Trash2 size={18} /> تنظيف السجل</button>
</div>
<div className="glass p-6 rounded-2xl grid grid-cols-1 md:grid-cols-2 gap-8">
<div><label className="block text-xs font-black mb-3 opacity-50 uppercase tracking-widest">نطاق البحث</label>
<select className="input-field" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}>
<option value="كل الشهور">جميع الشهور</option>
{[...getMonthsForYear(2026), ...getMonthsForYear(2027)].map(m => <option key={m} value={m}>{m}</option>)}
</select></div>
<div><label className="block text-xs font-black mb-3 opacity-50 uppercase tracking-widest">الحساسية (أكثر من {threshold})</label>
<input type="range" min="2" max="10" className="w-full h-2 bg-slate-200 rounded-lg appearance-none" value={threshold} onChange={e => setThreshold(Number(e.target.value))} /></div>
</div>
<div className="space-y-4">
{duplicates.length === 0 ? (
<div className="glass p-20 text-center rounded-2xl"><CheckCircle2 size={60} className="text-emerald-500 mx-auto mb-4" /><h3 className="text-xl font-black">ممتاز! لا توجد تكرارات</h3></div>
) : duplicates.map(dup => (
<div key={dup.key} className="glass rounded-2xl overflow-hidden border">
<div className={`p-5 flex justify-between items-center cursor-pointer ${dup.risk === 'high' ? 'bg-red-50/50' : 'bg-amber-50/50'}`} onClick={() => setExpandedGroups(p => ({ ...p, [dup.key]: !p[dup.key] }))}>
<div className="flex items-center gap-4">
<div className={`p-3 rounded-2xl ${dup.risk === 'high' ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-600'}`}><Repeat size={24} /></div>
<div><h4 className="font-black text-lg">{safeNumber(dup.amount).toLocaleString()} ج.م</h4><span className="text-xs font-bold opacity-60">{dup.category} - تكرر {dup.count} مرات</span></div>
</div>
<ChevronDown className={`transition-transform ${expandedGroups[dup.key] ? 'rotate-180' : ''}`} />
</div>
{expandedGroups[dup.key] && (
<div className="p-4 bg-white/50 dark:bg-black/20 divide-y">
{dup.items.map((item, idx) => (
<div key={item.id} className="py-4 flex justify-between items-center px-4">
<div className="text-sm font-bold">📅 {item.date} | 📝 {item.description || 'بدون وصف'}{closedMonths?.includes(item.month) && <span className="text-red-500 text-xs mr-2">(مغلق)</span>}</div>
{idx !== 0 && !closedMonths?.includes(item.month) && <button onClick={() => dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.filter(t => t.id !== item.id) })} className="text-red-500 hover:bg-red-50 p-2 rounded-xl"><Trash2 size={16} /></button>}
</div>
))}
</div>

function dataReducer(state, action) {
switch (action.type) {
case 'SET_DATA': return { ...state, data: action.payload };
case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
case 'SET_SELECTED_YEAR': return { ...state, selectedYear: action.payload, selectedMonth: getMonthsForYear(action.payload)[0] };
case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
case 'SET_FORM_DATA': return { ...state, formData: action.payload };
case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
case 'SET_FORM_ERRORS': return { ...state, formErrors: action.payload };
case 'SET_ACTIVE_CATEGORY_DETAIL': return { ...state, activeCategoryDetail: action.payload };
case 'SET_REPEAT_MONTHS': return { ...state, repeatMonths: action.payload };
case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
case 'SET_BUDGETS': return { ...state, budgets: action.payload };
case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
case 'SET_EDITING_FAWRY': return { ...state, editingFawry: action.payload };
case 'SET_EDITING_ETISALAT': return { ...state, editingEtisalat: action.payload };
case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
case 'SET_FILTER_TYPE': return { ...state, filterType: action.payload };
case 'SET_AI_MODAL_OPEN': return { ...state, isAiModalOpen: action.payload };
case 'SET_AI_QUERY': return { ...state, aiQuery: action.payload };
case 'SET_AI_RESPONSE': return { ...state, aiResponse: action.payload };
case 'SET_AI_LOADING': return { ...state, isAiLoading: action.payload };
case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
case 'ADD_NOTIFICATION': return { ...state, notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }] };
case 'REMOVE_NOTIFICATION': return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
case 'UPDATE_OPENING_BALANCE': return { ...state, data: { ...state.data, openingBalance2026: action.payload } };
case 'UPDATE_FAWRY_DATA': return { ...state, fawryData: action.payload };
case 'UPDATE_ETISALAT_DATA': return { ...state, etisalatData: action.payload };
case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
case 'ADD_TO_HISTORY': { const limited = [...state.history].slice(-19); return { ...state, history: [...limited, action.payload], future: [] }; }
case 'UNDO': { if (state.history.length === 0) return state; const prev = state.history[state.history.length - 1]; return { ...state, data: prev, history: state.history.slice(0, -1), future: [state.data, ...state.future] }; }
case 'REDO': { if (state.future.length === 0) return state; const next = state.future[0]; return { ...state, data: next, history: [...state.history, state.data], future: state.future.slice(1) }; }
case 'TOGGLE_LEDGER': return { ...state, expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] } };
case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };
case 'SET_STATUS_FILTER': return { ...state, statusFilter: action.payload };
case 'UPDATE_LOAN_DUE_DATE': return { ...state, data: { ...state.data, loans: state.data.loans.map(l => l.id === action.payload.loanId ? { ...l, nextPaymentDate: action.payload.newDate } : l) } };
case 'SHOW_CONFIRM': return { ...state, confirmDialog: { isOpen: true, title: action.title, message: action.message, onConfirm: action.onConfirm, onCancel: action.onCancel } };
case 'HIDE_CONFIRM': return { ...state, confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null } };
case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
case 'SET_QUICK_TRANSFER_DATA': return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
case 'SET_VIEWING_CARD_STATEMENT': return { ...state, viewingCardStatement: action.payload };
case 'CLOSE_MONTH': return { ...state, data: { ...state.data, closedMonths: [...(state.data.closedMonths || []), action.payload.month], monthlySnapshots: { ...(state.data.monthlySnapshots || {}), [action.payload.month]: action.payload.balance } } };
case 'TOGGLE_WALLET_VISIBILITY': return { ...state, walletVisibility: { ...state.walletVisibility, [action.payload]: !state.walletVisibility[action.payload] } };
case 'SET_IS_PROCESSING': return { ...state, isProcessing: action.payload };
default: return state;
}
}

activeCategoryDetail, repeatMonths, isLocked, isDarkMode, expandedGroup, budgets,
editingCard, editingLoan, searchTerm, editingBudgetCategory, budgetAmount,
editingFawry, editingEtisalat, isRecurringModalOpen, recurringFormData, filterType,
notifications, isAiModalOpen, aiQuery, aiResponse, isAiLoading, fawryData, etisalatData,
expandedLedgers, expandedCardsSection, statusFilter, confirmDialog,
isQuickTransferModalOpen, quickTransferData, viewingCardStatement, walletVisibility,
isProcessing, formErrors } = state;

const { transactions = [], loans = [], cards = [], recurringItems = [] } = data || {};

// ===== Auth =====
useEffect(() => {
const unsubscribe = firebase.auth().onAuthStateChanged((user) => {
setAuthLoading(false);
setIsAuthenticated(!!(user && user.email === "ahmedmkh@gmail.com"));
});
return () => unsubscribe();
}, []);

// ===== Firestore Sync =====
useEffect(() => {
if (!isAuthenticated) return;
const docRef = db.collection("finance_2026").doc("user_ahmed_data");
const unsubscribe = docRef.onSnapshot((doc) => {
if (doc.exists) {
const cloudData = doc.data();

dispatch({ type: 'SET_DATA', payload: migrated });

docRef.set(migrated, { merge: true });
}
}
});
return () => unsubscribe();
}, [isAuthenticated]);

// ===== Auto-Save =====
useEffect(() => {

saveTimeoutRef.current = setTimeout(() => {
try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}

}, 1500);
}
return () => clearTimeout(saveTimeoutRef.current);
}, [data, isAuthenticated]);

// ===== Keyboard Shortcuts =====
useEffect(() => {
const handler = (e) => {
if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); if (isFormOpen) document.getElementById('transaction-form')?.requestSubmit(); }
if (e.key === 'Escape') {

if (isRecurringModalOpen) dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false });
}
if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.querySelector('input[placeholder*="ابحث"]')?.focus(); }
};
window.addEventListener('keydown', handler);
return () => window.removeEventListener('keydown', handler);
}, [isFormOpen, isAiModalOpen, editingCard, editingLoan, isQuickTransferModalOpen, activeCategoryDetail, viewingCardStatement, isRecurringModalOpen]);

// ===== Notifications =====
const removeNotification = useCallback((id) => dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }), []);
const addNotification = useCallback((notification) => dispatch({ type: 'ADD_NOTIFICATION', payload: notification }), []);
const saveHistory = useCallback(() => dispatch({ type: 'ADD_TO_HISTORY', payload: JSON.parse(JSON.stringify(data)) }), [data]);

// ===== Finance Snapshot =====
const financeSnapshot = useMemo(() => {
let actualCarryover = safeNumber(data.openingBalance2026);
const selectedMonthIdx = getMonthIndex(selectedMonth);
const prevMonthName = selectedMonthIdx > 0 ? ALL_MONTHS[selectedMonthIdx - 1] : null;
if (prevMonthName && data.closedMonths?.includes(prevMonthName)) {
actualCarryover = safeNumber(data.monthlySnapshots?.[prevMonthName]);
} else {
transactions.filter(t => getMonthIndex(t.month) < selectedMonthIdx).forEach(t => {
const amt = safeNumber(t.amount);
if (t.status === 'paid') {
if (t.type === 'income') actualCarryover += amt;
else if (t.type === 'expense' && t.method === 'cash') actualCarryover -= amt;
}
});
}
const curMonth = transactions.filter(t => t.month === selectedMonth);
const actualIncome = curMonth.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
const pendingIncome = curMonth.filter(t => t.type === 'income' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
const paidCash = curMonth.filter(t => t.type === 'expense' && t.status === 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
const pendingCash = curMonth.filter(t => t.type === 'expense' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
const actualCashInHand = actualCarryover + actualIncome - paidCash;
const projectedClosingBalance = actualCashInHand + pendingIncome - pendingCash;
return { actualCarryover, income: actualIncome, actualIncome, pendingIncome, actualCashInHand, projectedClosingBalance, pendingAmount: pendingCash, cashExpenses: paidCash };
}, [transactions, selectedMonth, data.closedMonths, data.monthlySnapshots, data.openingBalance2026]);

// ===== Chart Data =====

name: m,

})), [transactions, selectedYear]);

// ===== Updated Loans =====
const updatedLoans = useMemo(() => {
const map = transactions.reduce((acc, t) => {
if (t.linkedLoanId && (t.status === 'paid' || t.status === 'partial')) acc[t.linkedLoanId] = (acc[t.linkedLoanId] || 0) + safeNumber(t.amount);
return acc;
}, {});
return loans.map(l => ({ ...l, totalPaid: safeNumber(l.prePaidAmount) + (map[l.id] || 0), remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (map[l.id] || 0))) }));
}, [transactions, loans]);

// ===== Month Insights =====
const monthInsights = useMemo(() => {
const m = transactions.filter(t => t.month === selectedMonth);
const inc = m.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
const exp = m.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
const pendInc = m.filter(t => t.type === 'income' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
const pendExp = m.filter(t => t.type === 'expense' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
return { inc, exp, pendInc, pendExp, net: inc - exp };
}, [transactions, selectedMonth]);

// ===== Grouped Transactions =====
const groupedTransactions = useMemo(() => {
const groups = {};
const term = normalizeText(searchTerm);

</div>

{recurringItems.length > 0 && (

</div>
</div>

</div>
</div>
)}
</div>
);

// ===== CARDS =====
const renderWalletsAndCardsView = () => {
const cib = getSavingsLedger('cib_savings');
const aaib = getSavingsLedger('aaib_savings');
const lp = (key) => ({
walletKey: key,
ledgerData: key === 'fawry' ? fawryLedger : key === 'etisalat' ? etisalatLedger : key === 'cib_savings' ? cib : aaib,
isExpanded: expandedLedgers[key],
onToggle: () => dispatch({ type: 'TOGGLE_LEDGER', payload: key }),
onDelete: handleDelete,
onEditTransaction: (t) => { dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); },
theme: WALLET_CONFIGS[key],
onAddDeposit: handleAddWalletDeposit,
onAddWithdrawal: handleAddWalletWithdrawal,

</div>
<ChevronDown size={24} className={`text-slate-400 transition-transform ${expandedCardsSection ? 'rotate-180' : ''}`} />
</div>
{expandedCardsSection && (

{cards.map(card => {
const history = calculateCardHistory(card);
const themeCls = { silver: 'bg-gradient-to-br from-slate-100 via-slate-200 to-slate-300 border-slate-300 text-slate-800', gold: 'bg-gradient-to-br from-yellow-100 via-yellow-200 to-yellow-400 border-yellow-300 text-yellow-900', platinum: 'bg-gradient-to-br from-slate-200 via-gray-100 to-slate-300', black: 'bg-gradient-to-br from-slate-800 via-black to-slate-900 border-slate-600 text-white', blue: 'bg-gradient-to-br from-blue-100 to-blue-400 border-blue-300 text-blue-900' }[card.theme] || 'bg-gradient-to-br from-slate-100 to-slate-300';
return (

</div>
<div dir="ltr" className={`p-8 rounded-2xl relative overflow-hidden shadow-2xl min-h-[260px] flex flex-col justify-between ${themeCls} border`}>
<div className="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-[50px] -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
<div className="flex justify-between items-start relative z-10">
<span className="font-black text-2xl uppercase">{card.bank}</span>
<div className="bg-white/20 backdrop-blur-md p-2.5 rounded-xl border border-white/20"><Wifi size={20} className="rotate-90" /></div>
</div>
<div className="absolute top-4 left-4 z-20 opacity-80"><BankLogo type={`${card.bank.toLowerCase()}_card`} size={40} /></div>
<div className="flex gap-4 items-center relative z-10 mt-4">
<div className="w-12 h-9 credit-card-chip"></div>
<div className="text-xl font-mono tracking-[0.2em] font-bold">••••• •••• •••• {card.last4}</div>
</div>
<div className="flex justify-between items-end font-bold relative z-10 mt-4">
<div className="flex flex-col"><span className="text-[9px] uppercase opacity-70">{card.name}</span><span className="font-bold text-sm tracking-widest">{card.holderName}</span></div>
<div className="flex flex-col items-end"><span className="text-[9px] uppercase opacity-70">Expires</span><span className="font-bold text-sm tracking-widest">{card.expiry}</span></div>
</div>
</div>
</div>
<div className="glass rounded-2xl overflow-hidden shadow-sm">
<table className="w-full text-right text-xs">
<thead className="bg-slate-50/80 dark:bg-slate-800/80">

<td className="p-4 text-blue-500 font-black">{Math.round(h.available).toLocaleString()}</td>

})}

</div>

})}

</div>
</div>

<div className="flex justify-between items-start mb-6 z-10 relative">

<div className="text-left flex flex-col items-end z-10 relative"><span className="block text-xs uppercase font-bold mb-1 opacity-80">الرصيد</span><span className="font-black text-4xl">{walletVisibility.etisalat ? currentEtisalatBalance.toLocaleString() : '•••••'}</span></div>
</div>
<div className="grid grid-cols-2 gap-3 w-full font-bold mt-auto z-10 relative">
<div className="bg-white/40 backdrop-blur-md p-3 rounded-xl border border-white/40 text-center"><span className="block text-[10px] mb-1">إيداع</span><span className="font-bold text-lg">+{walletVisibility.etisalat ? etisalatStats.deposits.toLocaleString() : '•••••'}</span></div>
<div className="bg-white/40 backdrop-blur-md p-3 rounded-xl border border-white/40 text-center"><span className="block text-[10px] mb-1">سحب</span><span className="font-bold text-lg">-{walletVisibility.etisalat ? etisalatStats.withdrawals.toLocaleString() : '•••••'}</span></div>

</div>
</div>
</div>

<GenericLedgerComponent {...lp('fawry')} />
<GenericLedgerComponent {...lp('etisalat')} />
<GenericLedgerComponent {...lp('cib_savings')} />
<GenericLedgerComponent {...lp('aaib_savings')} />
</div>
);

// ===== Transactions =====

const pendingGroups = groupedTransactions.map(g => ({ ...g, items: g.items.filter(t => t.status !== 'paid') })).filter(g => g.items.length > 0);
const paidArchive = transactions.filter(t => t.month === selectedMonth && t.status === 'paid' && t.type === transViewMode).sort((a, b) => new Date(b.date) - new Date(a.date));
const totalPending = pendingGroups.reduce((s, g) => s + g.items.length, 0);

const renderMonthlyInsight = () => (
<div className="space-y-6 animate-fadeIn">
<div className="glass p-3 rounded-2xl flex justify-between items-center flex-wrap gap-3">
<div className="flex items-center gap-2 text-xs font-bold text-slate-500"><CalendarDays size={16} /> حالة: {selectedMonth} {selectedYear}</div>
{data.closedMonths?.includes(selectedMonth) ? (
<div className="bg-emerald-100 text-emerald-700 px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 border border-emerald-200"><ShieldCheck size={14} /> مغلق</div>
) : (
<button onClick={() => dispatch({ type: 'SHOW_CONFIRM', title: `إقفال ${selectedMonth}`, message: `سيتم اعتماد ${financeSnapshot.actualCashInHand.toLocaleString()} ج.م`, onConfirm: () => { dispatch({ type: 'CLOSE_MONTH', payload: { month: selectedMonth, balance: financeSnapshot.actualCashInHand } }); addNotification({ type: 'success', title: 'تم الإقفال' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) })} className="gradient-bg-warning text-white px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2"><Lock size={14} /> اعتماد وإقفال</button>

<MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} className="no-print" />

{renderMonthlyInsight()}

<div className="flex gap-2 justify-center flex-wrap px-2 mb-4 no-print">

<button type="button" onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: 'pending' })} className={`px-3 py-1.5 rounded-xl text-[11px] font-bold border flex items-center gap-1 ${statusFilter === 'pending' ? 'gradient-bg-warning text-white' : 'bg-white dark:bg-slate-800'}`}><Clock size={12} /> معلق</button>
<button type="button" onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: 'paid' })} className={`px-3 py-1.5 rounded-xl text-[11px] font-bold border flex items-center gap-1 ${statusFilter === 'paid' ? 'gradient-bg-success text-white' : 'bg-white dark:bg-slate-800'}`}><CheckCircle2 size={12} /> مدفوع</button>
</div>

<div className="glass p-4 rounded-2xl no-print">
<div className="relative">
<Search className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400" size={20} />
<input type="text" placeholder="🔍 ابحث (Ctrl+K)" className="w-full p-4 pr-12 bg-transparent border-0 focus:outline-none text-lg" value={searchTerm} onChange={(e) => dispatch({ type: 'SET_SEARCH_TERM', payload: e.target.value })} />

<section>

<Clock size={24} /> الالتزامات الحالية {totalPending > 0 && <span className="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-xs font-black">{totalPending} معلق</span>}
</h3>
{totalPending > 0 && (
<button onClick={() => dispatch({ type: 'SHOW_CONFIRM', title: 'اعتماد الكل', message: `سيتم اعتماد ${totalPending} عملية`, onConfirm: () => { const ids = pendingGroups.flatMap(g => g.items.map(i => i.id)); dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(t => ids.includes(t.id) ? { ...t, status: 'paid' } : t) }); addNotification({ type: 'success', title: '✅ تم الاعتماد' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) })} className="gradient-bg-success text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg flex items-center gap-2 no-print active:scale-95"><CheckCircle2 size={16} /> اعتماد الكل</button>
)}

<div className="hidden md:block glass rounded-2xl overflow-hidden mb-12">

</thead>

{pendingGroups.map(g => {

<React.Fragment key={g.category}>

})}
{pendingGroups.length === 0 && (<tr><td colSpan="5" className="p-8 text-center text-slate-400 font-bold">لا توجد التزامات ✅</td></tr>)}
</tbody>
</table>
</div>

<div className="block md:hidden space-y-4 p-2 pb-32">
{pendingGroups.map(g => (
<div key={g.category} className="space-y-2">

{g.items.map(t => (

<div className="flex-1 min-w-0"><p className="font-bold text-sm truncate">{t.description || 'بدون وصف'}</p><p className="text-[9px] text-slate-400">{t.date}</p></div>

</div>
</div>
))}

};

// ===== PLANNER =====
const renderStrategicPlanner = () => {
const curIdx = ALL_MONTHS.indexOf(selectedMonth);
const months = ALL_MONTHS.slice(curIdx);
let liq = financeSnapshot.actualCashInHand;
let simLoans = JSON.parse(JSON.stringify(updatedLoans));
let simCards = cards.map(c => ({ ...c, currentDebt: calculateCardHistory(c).find(x => x.month === selectedMonth)?.closingDebt || 0 }));
const projection = months.map(month => {
let loanPays = 0;
simLoans = simLoans.map(l => { const p = Math.min(l.remaining, safeNumber(l.monthlyInstallment)); loanPays += p; return { ...l, remaining: l.remaining - p }; });
const cardPays = simCards.reduce((s, c) => s + c.currentDebt, 0);
simCards = simCards.map(c => ({ ...c, currentDebt: 0 }));
const outflow = loanPays + cardPays;
const netInc = financeSnapshot.actualIncome - financeSnapshot.cashExpenses;
const opening = liq;
liq = opening + netInc - outflow;
return { month, opening, outflow, running: liq, remainDebt: simLoans.reduce((s, l) => s + l.remaining, 0), danger: liq < 0 };
});
return (
<div className="space-y-8 animate-fadeIn pb-24">
<div className="glass p-8 rounded-2xl gradient-border">
<h2 className="text-3xl font-black flex items-center gap-3"><Target className="text-emerald-400" size={32} /> المخطط الاستراتيجي {selectedYear}</h2>
<p className="text-slate-400 mt-2 font-bold">محاكاة ذكية للتدفق النقدي</p>
</div>
<div className="glass rounded-2xl overflow-hidden">
<div className="overflow-x-auto">
<table className="w-full text-right text-sm">
<thead className="bg-slate-50 dark:bg-slate-800/50">
<tr className="text-slate-500 font-bold"><th className="p-4">الشهر</th><th className="p-4">افتتاحي</th><th className="p-4 text-rose-500">التزامات</th><th className="p-4 text-emerald-600">صافي</th><th className="p-4">المديونية</th><th className="p-4 text-center">الأمان</th></tr>
</thead>
<tbody className="divide-y dark:divide-slate-800">
{projection.map(row => (
<tr key={row.month}>
<td className="p-4 font-black">{row.month}</td>
<td className="p-4 font-mono text-slate-500">{Math.round(row.opening).toLocaleString()}</td>
<td className="p-4 font-mono text-rose-500 font-bold">-{Math.round(row.outflow).toLocaleString()}</td>
<td className={`p-4 font-mono font-black ${row.danger ? 'text-red-600' : 'text-emerald-600'}`}>{Math.round(row.running).toLocaleString()}</td>
<td className="p-4 font-mono text-slate-600">{Math.round(row.remainDebt).toLocaleString()}</td>
<td className="p-4 text-center">
{row.danger ? <span className="px-3 py-1 bg-red-100 text-red-600 rounded-lg text-[10px] font-black">عجز</span> : row.running < 10000 ? <span className="px-3 py-1 bg-amber-100 text-amber-600 rounded-lg text-[10px] font-black">انتباه</span> : <span className="px-3 py-1 bg-emerald-100 text-emerald-600 rounded-lg text-[10px] font-black">مستقر</span>}
</td>
</tr>
))}
</tbody>
</table>
</div>
</div>
</div>
);
};

// ===== CALENDAR =====
const renderCalendarView = () => {
const items = getAgendaItems();
const [filterCat, setFilterCat] = useState('all');
const filtered = filterCat === 'all' ? items : items.filter(i => {
if (filterCat === 'loans') return i.title.includes('قسط') || i.title.includes('عقاري');
if (filterCat === 'cards') return i.title.includes('بطاقة');
if (filterCat === 'personal') return i.title.includes('محمود') || i.title.includes('سلفة') || i.title.includes('جامعة') || i.title.includes('مدرسة') || i.title.includes('تقويم');
if (filterCat === 'recurring') return i.desc === 'التزام شهري متكرر';
return true;
});
const grouped = filtered.reduce((acc, item) => { const mn = new Date(item.date).toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' }); if (!acc[mn]) acc[mn] = []; acc[mn].push(item); return acc; }, {});
const totalAmount = filtered.reduce((s, i) => s + safeNumber(i.amount), 0);
const urgentCount = filtered.filter(i => { const d = calculateDaysLeft(i.date); return d !== null && d <= 7 && d >= 0; }).length;
const filters = [{ id: 'all', label: 'الكل', icon: Layers }, { id: 'loans', label: 'قروض', icon: Banknote }, { id: 'cards', label: 'بطاقات', icon: CreditCard }, { id: 'personal', label: 'شخصي', icon: Users }, { id: 'recurring', label: 'شهري', icon: Repeat }];
return (
<div className="space-y-6 animate-fadeIn pb-20">
<div className="grid grid-cols-1 md:grid-cols-3 gap-4">
<div className="glass p-6 rounded-2xl border-r-4 border-r-blue-500 flex items-center justify-between"><div><p className="text-[10px] font-bold text-slate-400 uppercase">المواعيد</p><p className="text-3xl font-black text-blue-600 mt-1">{filtered.length}</p></div><div className="p-4 bg-blue-50 text-blue-600 rounded-2xl"><Calendar size={28} /></div></div>
<div className="glass p-6 rounded-2xl border-r-4 border-r-red-500 flex items-center justify-between"><div><p className="text-[10px] font-bold text-slate-400 uppercase">قريباً</p><p className="text-3xl font-black text-red-600 mt-1">{urgentCount}</p></div><div className="p-4 bg-red-50 text-red-600 rounded-2xl"><AlertTriangle size={28} /></div></div>
<div className="glass p-6 rounded-2xl border-r-4 border-r-emerald-500 flex items-center justify-between"><div><p className="text-[10px] font-bold text-slate-400 uppercase">الإجمالي</p><p className="text-2xl font-black text-emerald-600 mt-1">{totalAmount.toLocaleString()}</p></div><div className="p-4 bg-emerald-50 text-emerald-600 rounded-2xl"><Coins size={28} /></div></div>
</div>
<div className="glass p-4 rounded-2xl">
<div className="flex gap-2 overflow-x-auto scroll-hide">
{filters.map(f => { const Icon = f.icon; const isActive = filterCat === f.id; return <button key={f.id} onClick={() => setFilterCat(f.id)} className={`flex-shrink-0 px-5 py-3 rounded-xl text-sm font-bold flex items-center gap-2 ${isActive ? 'gradient-bg-primary text-white shadow-md' : 'bg-slate-100 dark:bg-slate-800'}`}><Icon size={16} /> {f.label}</button>; })}
</div>
</div>
{Object.keys(grouped).length === 0 ? (
<div className="glass p-20 text-center rounded-2xl"><Calendar size={60} className="text-slate-300 mx-auto mb-4" /><p className="text-slate-400 font-bold">لا توجد مواعيد</p></div>
) : Object.entries(grouped).map(([month, list]) => (
<div key={month} className="space-y-4">
<div className="sticky top-12 z-20 flex items-center gap-3 pr-2 bg-gradient-to-b from-white/80 to-transparent dark:from-slate-900/80 py-2 backdrop-blur-sm">
<div className="gradient-bg-primary text-white px-5 py-2 rounded-xl font-black text-sm shadow-lg">{month}</div>
<div className="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
<span className="text-xs text-slate-400 font-bold bg-white dark:bg-slate-800 px-3 py-1 rounded-full">{list.length} موعد</span>
</div>
<div className="relative pr-8 space-y-3">
<div className="absolute right-3 top-0 bottom-0 w-0.5 timeline-line"></div>
{list.map(item => {
const d = calculateDaysLeft(item.date);
const isUrg = d !== null && d <= 3 && d >= 0;
const isOver = d !== null && d < 0;
const Icon = item.icon;
return (
<div key={item.id} className="relative">
<div className={`absolute -right-[22px] top-6 w-5 h-5 rounded-full border-4 border-white dark:border-slate-900 shadow-lg ${isOver ? 'bg-red-500 animate-pulse' : isUrg ? 'bg-amber-500 animate-pulse' : item.type === 'danger' ? 'bg-red-400' : 'bg-blue-500'}`}></div>
<div className={`glass p-5 rounded-2xl flex justify-between items-center shadow-sm flex-wrap gap-3 ${isOver ? 'border-r-4 border-r-red-500' : isUrg ? 'border-r-4 border-r-amber-500' : 'border-r-4 border-r-slate-300'}`}>
<div className="flex items-center gap-4 flex-1 min-w-0">
<div className={`p-3 rounded-2xl ${isOver ? 'gradient-bg-danger text-white' : isUrg ? 'gradient-bg-warning text-white' : item.type === 'danger' ? 'bg-red-100 text-red-600' : 'gradient-bg-primary text-white'}`}><Icon size={22} /></div>
<div className="flex-1 min-w-0">
<p className="font-bold truncate">{item.title}</p>
<div className="flex items-center gap-2 mt-1 flex-wrap">
<span className="text-[10px] font-bold bg-slate-100 dark:bg-slate-700 text-slate-500 px-2 py-0.5 rounded-lg">📅 {item.date}</span>
{d !== null && <span className={`text-[10px] font-black px-2 py-0.5 rounded-lg ${isOver ? 'bg-red-100 text-red-600' : d === 0 ? 'bg-red-100 text-red-600 animate-pulse' : isUrg ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'}`}>{isOver ? `متأخر ${Math.abs(d)}` : d === 0 ? 'اليوم!' : `${d} يوم`}</span>}
</div>
</div>
</div>
<div className="flex items-center gap-3">
<p className="font-black text-lg">{safeNumber(item.amount).toLocaleString()}<span className="text-xs font-normal text-slate-400 mr-1">ج.م</span></p>
<button onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', amount: item.amount, description: item.title, category: 'الالتزامات البنكية والتمويلية', date: getLocalISODate(), month: selectedMonth, method: 'instapay', subType: 'withdrawal', status: 'pending' } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="p-3 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100 no-print"><CheckCircle2 size={18} /></button>
</div>
</div>
</div>
);
})}
</div>
</div>
))}
</div>
);
};

case 'transactions': return renderTransactionsViewFull();

{[{ id: 'dashboard', label: 'لوحة التحكم', icon: LayoutDashboard, color: 'text-blue-500' }, { id: 'transactions', label: 'سجل المعاملات', icon: ArrowUpRight, color: 'text-emerald-500' }, { id: 'categories', label: 'الفئات والميزانية', icon: Layers, color: 'text-purple-500' }, { id: 'loans', label: 'القروض والديون', icon: Banknote, color: 'text-red-500' }, { id: 'cards', label: 'البطاقات والمحافظ', icon: CreditCard, color: 'text-amber-500' }, { id: 'planner', label: 'المخطط الاستراتيجي', icon: Target, color: 'text-indigo-500' }, { id: 'calendar', label: 'الأجندة والمواعيد', icon: CalendarDays, color: 'text-pink-500' }, { id: 'duplicates', label: 'كشف المكررات', icon: Filter, color: 'text-cyan-500' }].map(item => (

<div className="mt-8 p-4 rounded-2xl bg-slate-50/50 dark:bg-slate-800/30">

<div className="flex justify-between"><span>إغلاق</span><span className="kbd">Esc</span></div>

</div>
</div>
</aside>
);

// ===== Header =====
const ProfessionalHeader = () => (
<header className="flex flex-col md:flex-row justify-between items-center gap-6 mb-8">
<div className="flex-1">
<div className="flex items-center gap-4">
<div className="gradient-bg-primary p-3 rounded-2xl text-white shadow-lg"><Wallet size={28} /></div>
<div>
<h1 className="text-3xl font-black">محفظتي المالية</h1>

<button type="button" onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: true })} className={`p-3 rounded-lg ${isDarkMode ? 'bg-slate-700 text-blue-400' : 'text-slate-400'}`}><Moon size={20} /></button>

if (!isAuthenticated) return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;

// ===== MAIN RENDER =====
return (
<div className="flex h-screen overflow-hidden font-sans">

<ToastContainer notifications={notifications} removeNotification={removeNotification} />
<ConfirmDialog confirmDialog={confirmDialog} dispatch={dispatch} />

{isProcessing && (

{viewingCardStatement && (() => {

return (

<div className="grid grid-cols-2 gap-4 mt-4">

<div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border-r-4 border-blue-500"><p className="text-[10px] font-bold text-slate-400 uppercase">نهاية المدة</p><p className="text-lg font-black text-blue-600">{Math.round(monthData?.closingDebt || 0).toLocaleString()} ج.م</p></div>
</div>
</div>
<div className="flex-1 overflow-y-auto p-6 scroll-hide" style={{ minHeight: 0 }}>

</thead>
<tbody className="divide-y text-sm font-bold">
{transactions.filter(t => t.method === cardMethod && t.month === selectedMonth).sort((a, b) => new Date(b.date) - new Date(a.date)).map(t => (
<tr key={t.id} className="hover:bg-blue-50/50"><td className="p-4 text-slate-500">{t.date}</td><td className="p-4">{t.description || '-'}</td><td className="p-4"><span className="bg-white dark:bg-slate-800 px-2 py-1 rounded text-xs border">{t.category}</span></td><td className="p-4 text-left font-black">{safeNumber(t.amount).toLocaleString()}</td></tr>
))}
{transactions.filter(t => t.method === cardMethod && t.month === selectedMonth).length === 0 && <tr><td colSpan="4" className="p-12 text-center text-slate-400">لا توجد عمليات</td></tr>}
</tbody>
</table>
</div>
</div>
</div>
);
})()}

<div className="bottom-nav-container no-print">
<div className="scrollable-nav scroll-hide">
{[{ id: 'dashboard', label: 'الرئيسية', icon: LayoutDashboard }, { id: 'transactions', label: 'المعاملات', icon: ArrowUpRight }, { id: 'cards', label: 'المحافظ', icon: CreditCard }, { id: 'loans', label: 'القروض', icon: Banknote }, { id: 'planner', label: 'المخطط', icon: Target }, { id: 'calendar', label: 'الأجندة', icon: CalendarDays }, { id: 'duplicates', label: 'المكررات', icon: Filter }, { id: 'categories', label: 'الفئات', icon: Layers }].map(item => (
<button key={item.id} type="button" onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} className={`nav-btn ${activeTab === item.id ? 'active' : ''}`}>
<item.icon size={24} /><span>{item.label}</span>
</button>
))}
<div className="v-line"></div>
<button type="button" onClick={handleExportCSV} className="nav-btn text-emerald-600 hover:bg-emerald-50"><FileSpreadsheet size={24} /><span>CSV</span></button>
<button type="button" onClick={handleExport} className="nav-btn text-blue-600 hover:bg-blue-50"><Download size={24} /><span>حفظ</span></button>
<label className="nav-btn cursor-pointer text-purple-600 hover:bg-purple-50"><input type="file" accept=".json" onChange={handleImport} className="hidden" /><Upload size={24} /><span>جلب</span></label>
<button type="button" onClick={resetData} className="nav-btn text-red-500 hover:bg-red-50"><RefreshCcw size={24} /><span>مسح</span></button>
<div className="v-line"></div>
<button type="button" onClick={() => mainContentRef.current?.scrollTo({ top: 0, behavior: 'smooth' })} className="nav-btn"><ArrowUp size={24} /><span>أعلى</span></button>
<button type="button" onClick={() => dispatch({ type: 'SET_IS_LOCKED', payload: true })} className="nav-btn text-amber-500 hover:bg-amber-50"><Lock size={24} /><span>قفل</span></button>
<button type="button" onClick={() => { firebase.auth().signOut(); setIsAuthenticated(false); }} className="nav-btn text-red-600 hover:bg-red-50"><LogOut size={24} /><span>خروج</span></button>
</div>
</div>

{!isLocked && (
<button type="button" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', category: '', amount: '', date: getLocalISODate(), month: selectedMonth, method: 'cash', subType: 'withdrawal', status: 'pending' } }); dispatch({ type: 'SET_REPEAT_MONTHS', payload: [] }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="fab no-print"><Plus size={32} /></button>
)}

<EnhancedSidebar />

<main ref={mainContentRef} className="flex-1 overflow-y-auto p-4 lg:p-8 pt-12">
{isLocked ? (
<div className="min-h-screen flex flex-col items-center justify-center backdrop-blur-3xl no-print">
<Lock size={80} className="mb-8 text-blue-500 animate-bounce-slight" />
<h2 className="text-4xl font-black mb-8">التطبيق مقفل</h2>
<button type="button" onClick={() => dispatch({ type: 'SET_IS_LOCKED', payload: false })} className="gradient-bg-primary text-white px-16 py-5 rounded-full font-bold shadow-2xl flex items-center gap-3 hover:scale-105">
<Unlock size={24} /> فتح التطبيق
</button>
</div>
) : (
<div className="max-w-7xl mx-auto space-y-8 animate-fadeIn pb-24">
<ProfessionalHeader />
{renderActiveView()}
</div>
)}
</main>

{/* ✅ Transaction Form Modal مع ميزة التكرار */}
{isFormOpen && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col" style={{ maxHeight: 'calc(100vh - 60px)' }}>
<div className="p-5 border-b flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/30 flex-shrink-0">
<h3 className="text-xl font-black flex items-center gap-3">
<div className="gradient-bg-primary p-2 rounded-xl text-white shadow-lg"><Plus size={20} /></div>
{formMode === 'add' ? 'إضافة عملية' : 'تعديل عملية'}
</h3>
<button type="button" onClick={() => dispatch({ type: 'SET_FORM_OPEN', payload: false })} className="text-slate-400 hover:text-red-500 p-2 hover:bg-red-50 rounded-xl"><X size={24} /></button>
</div>
<form onSubmit={handleSaveTransaction} className="p-5 space-y-4 overflow-y-auto scroll-hide" id="transaction-form" style={{ minHeight: 0 }}>
<div className="grid grid-cols-2 gap-4">
<div>
<label className="block text-sm font-bold mb-2 text-slate-400">النوع</label>
<select className="input-field font-bold" value={formData.type} onChange={(e) => { const t = e.target.value; dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, type: t, subType: t === 'income' ? 'deposit' : 'withdrawal', category: '' } }); }}>
<option value="expense">مصروف 💸</option>
<option value="income">دخل 💰</option>
</select>
</div>
<div>
<label className="block text-sm font-bold mb-2 text-slate-400">الفئة</label>
<select className={`input-field font-bold ${formErrors.category ? 'error' : ''}`} value={formData.category} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, category: e.target.value } })} required>
<option value="">اختر التصنيف...</option>
{Object.entries(CATEGORY_GROUPS[formData.type]).map(([g, items]) => (<optgroup key={g} label={g}>{items.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>))}
</select>
</div>
</div>

{/* حالة العملية */}
<div className="bg-gradient-to-r from-amber-50 to-emerald-50 dark:from-amber-900/20 dark:to-emerald-900/20 p-3 rounded-2xl border-2 border-dashed border-amber-300 dark:border-amber-700">
<div className="flex items-center gap-2 mb-2"><Clock size={16} className="text-amber-600" /><label className="text-xs font-black uppercase">حالة العملية</label></div>
<div className="grid grid-cols-2 gap-3">
<label className={`flex items-center justify-center gap-2 p-3 rounded-xl cursor-pointer border-2 transition-all font-bold text-sm ${formData.status !== 'paid' ? 'bg-white border-amber-500 shadow-md text-amber-700 dark:bg-slate-800' : 'border-transparent bg-white/50 text-slate-400'}`}>
<input type="radio" name="status" value="pending" className="hidden" checked={formData.status !== 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'pending' } })} />
<Clock size={18} /><div className="text-right"><div>⏳ معلق</div><div className="text-[9px] opacity-70">لا يؤثر</div></div>
</label>
<label className={`flex items-center justify-center gap-2 p-3 rounded-xl cursor-pointer border-2 transition-all font-bold text-sm ${formData.status === 'paid' ? 'bg-white border-emerald-500 shadow-md text-emerald-700 dark:bg-slate-800' : 'border-transparent bg-white/50 text-slate-400'}`}>
<input type="radio" name="status" value="paid" className="hidden" checked={formData.status === 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'paid' } })} />
<CheckCircle2 size={18} /><div className="text-right"><div>✅ معتمد</div><div className="text-[9px] opacity-70">يدخل الرصيد</div></div>
</label>
</div>
</div>

{['fawry', 'etisalat', 'cib_savings', 'aaib_savings'].includes(formData.method) && (
<div className="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-2xl border border-dashed">
<div className="flex gap-3">
<label className={`flex-1 flex items-center justify-center gap-2 p-2 rounded-xl cursor-pointer border-2 transition-all ${formData.subType === 'deposit' ? 'border-emerald-500 bg-emerald-50' : 'border-transparent bg-white dark:bg-slate-800'}`}>
<input type="radio" name="subType" value="deposit" className="hidden" checked={formData.subType === 'deposit'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, subType: 'deposit' } })} />
<span className="text-sm font-bold">إيداع (+)</span>
</label>
<label className={`flex-1 flex items-center justify-center gap-2 p-2 rounded-xl cursor-pointer border-2 transition-all ${formData.subType === 'withdrawal' ? 'border-red-500 bg-red-50' : 'border-transparent bg-white dark:bg-slate-800'}`}>
<input type="radio" name="subType" value="withdrawal" className="hidden" checked={formData.subType === 'withdrawal'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, subType: 'withdrawal' } })} />
<span className="text-sm font-bold">سحب (-)</span>
</label>
</div>
</div>
)}

<div className="grid grid-cols-3 gap-3">
<div>
<label className="block text-sm font-bold mb-2 text-slate-400">المبلغ</label>
<input type="number" required step="0.01" min="0.01" className={`input-field text-lg font-black text-blue-600 ${formErrors.amount ? 'error' : ''}`} value={formData.amount} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, amount: e.target.value } })} />
</div>
<div>
<label className="block text-sm font-bold mb-2 text-slate-400">التاريخ</label>
<input type="date" required className={`input-field text-sm font-bold ${formErrors.date ? 'error' : ''}`} value={formData.date} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, date: e.target.value } })} />
</div>
<div>
<label className="block text-sm font-bold mb-2 text-slate-400">الدفع</label>
<select className="input-field text-sm font-bold" value={formData.method} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, method: e.target.value } })}>
{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
</select>
</div>
</div>

{formData.type === 'expense' && (
<details className="border rounded-2xl overflow-hidden bg-white dark:bg-slate-800">
<summary className="p-3 cursor-pointer text-xs font-bold text-slate-500 flex items-center justify-between"><span className="flex items-center gap-2"><Hash size={16} className="text-blue-500" /> ربط بقرض</span><ChevronDown size={16} /></summary>
<div className="p-3 border-t"><select className="input-field text-sm font-bold w-full" value={formData.linkedLoanId || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, linkedLoanId: e.target.value ? Number(e.target.value) : '' } })}><option value="">-- اختر --</option>{updatedLoans.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}</select></div>
</details>
)}

{formData.type === 'expense' && formData.category === 'الالتزامات البنكية والتمويلية' && (
<div>
<label className="block text-sm font-bold mb-2 text-slate-400 flex items-center gap-2"><CreditCard size={14} /> سداد بطاقة</label>
<select className="input-field text-sm font-bold bg-blue-50/50 border-blue-200" value={formData.linkedCardId || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, linkedCardId: e.target.value ? Number(e.target.value) : '' } })}>
<option value="">-- اختر البطاقة --</option>
{cards.map(c => <option key={c.id} value={c.id}>{c.name} - {c.bank}</option>)}
</select>
</div>
)}

<div>
<label className="block text-sm font-bold mb-2 text-slate-400">الوصف</label>
<input type="text" className="input-field font-bold" value={formData.description || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: e.target.value } })} placeholder="تفاصيل..." />
</div>

{/* ✅ ميزة التكرار في الشهور المستقبلية */}
{formMode === 'add' && (
<details className="border rounded-2xl overflow-hidden bg-white dark:bg-slate-800">
<summary className="p-3 cursor-pointer text-xs font-bold text-slate-500 flex items-center justify-between">
<span className="flex items-center gap-2"><Repeat size={16} className="text-blue-500" /> تكرار العملية في المستقبل</span>
<ChevronDown size={16} />
</summary>
<div className="p-3 border-t">
<p className="text-[10px] text-slate-400 mb-2 font-bold">اختر الشهور اللي عايز العملية تتكرر فيها تلقائياً (زي الراتب أو القسط):</p>
<div className="flex flex-wrap gap-2 max-h-48 overflow-y-auto p-1">
{MONTHS.filter((m) => getMonthIndex(m) > getMonthIndex(selectedMonth) && getMonthsForYear(selectedYear).includes(m)).map(m => (
<label key={m} className="inline-flex items-center gap-2 bg-slate-50 dark:bg-slate-700 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 cursor-pointer text-xs font-bold hover:border-blue-300 transition-colors">
<input type="checkbox" className="rounded text-blue-600 w-4 h-4" checked={(repeatMonths || []).includes(m)} onChange={(e) => {
if (e.target.checked) dispatch({ type: 'SET_REPEAT_MONTHS', payload: [...(repeatMonths || []), m] });
else dispatch({ type: 'SET_REPEAT_MONTHS', payload: (repeatMonths || []).filter(rm => rm !== m) });
}} />
{m}
</label>
))}
</div>
{(repeatMonths || []).length > 0 && (
<div className="mt-3 p-2 bg-blue-50 dark:bg-blue-900/20 rounded-lg text-[10px] text-blue-600 dark:text-blue-400 font-bold flex items-center gap-2">
<CheckCircle2 size={12} /> سيتم إنشاء {(repeatMonths || []).length + 1} عملية (الشهر الحالي + {(repeatMonths || []).length} شهور)
</div>
)}
</div>
</details>
)}

<button type="submit" className={`w-full text-white py-3 rounded-2xl font-black shadow-xl active:scale-95 ${formData.status === 'paid' ? 'gradient-bg-success' : 'gradient-bg-warning'}`} disabled={isProcessing}>
{isProcessing ? 'جاري الحفظ...' : <><Save size={20} className="inline ml-2" /> {formData.status === 'paid' ? 'حفظ واعتماد ✅' : 'حفظ كمعلق ⏳'}</>}
</button>
</form>
</div>
</div>
)}

{/* AI Modal */}
{isAiModalOpen && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
<div className="p-6 border-b flex justify-between items-center gradient-border">
<h3 className="text-2xl font-black flex items-center gap-3"><div className="gradient-bg-primary p-2 rounded-xl text-white"><Bot size={20} /></div>المساعد الذكي</h3>
<button type="button" onClick={() => dispatch({ type: 'SET_AI_MODAL_OPEN', payload: false })} className="p-2 hover:bg-red-50 rounded-xl"><X size={24} /></button>
</div>
<div className="p-6">
<button type="button" onClick={handleAnalyzeFinances} disabled={isAiLoading} className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3 mb-6">
{isAiLoading ? 'جاري التحليل...' : <><Sparkles size={20} /> تحليل الوضع المالي</>}
</button>
{aiResponse && (<div className="bg-slate-50 dark:bg-slate-800 p-6 rounded-2xl whitespace-pre-line">{aiResponse}</div>)}
</div>
</div>
</div>
)}

{/* Edit Card Modal */}
{editingCard && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden max-h-[calc(100vh-60px)] flex flex-col">
<div className="p-6 border-b flex justify-between items-center"><h3 className="text-xl font-black">تعديل البطاقة</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_CARD', payload: null })}><X size={24} /></button></div>
<form onSubmit={handleUpdateCard} className="p-6 space-y-4 overflow-y-auto">
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500">الاسم</label><input type="text" required className="input-field" value={editingCard.name} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, name: e.target.value } })} /></div>
<div><label className="text-xs font-bold text-slate-500">البنك</label><input type="text" required className="input-field" value={editingCard.bank} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, bank: e.target.value } })} /></div>
</div>
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500">الحد</label><input type="number" className="input-field text-blue-600 font-bold" value={editingCard.limit} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, limit: safeNumber(e.target.value) } })} /></div>
<div><label className="text-xs font-bold text-slate-500">رصيد أول المدة</label><input type="number" className="input-field text-red-500 font-bold" value={editingCard.openingBalance} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, openingBalance: safeNumber(e.target.value) } })} /></div>
</div>
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500">حامل البطاقة</label><input type="text" className="input-field uppercase text-sm" value={editingCard.holderName} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, holderName: e.target.value } })} /></div>
<div><label className="text-xs font-bold text-slate-500">الانتهاء</label><input type="text" placeholder="MM/YY" className="input-field text-center" value={editingCard.expiry} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, expiry: e.target.value } })} /></div>
</div>
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500">آخر 4 أرقام</label><input type="text" maxLength="4" className="input-field text-center tracking-widest" value={editingCard.last4} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, last4: e.target.value } })} /></div>
<div><label className="text-xs font-bold text-slate-500">يوم الاستحقاق</label><input type="text" className="input-field text-center" value={editingCard.dueDate} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, dueDate: e.target.value } })} /></div>
</div>
<div>
<label className="text-xs font-bold text-slate-500">اللون</label>
<select className="input-field" value={editingCard.theme} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, theme: e.target.value } })}>
<option value="silver">فضي</option><option value="gold">ذهبي</option><option value="platinum">بلاتيني</option><option value="black">أسود</option><option value="blue">أزرق</option>
</select>
</div>
<button type="submit" className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold">حفظ</button>
</form>
</div>
</div>
)}

{/* Edit Loan Modal */}
{editingLoan && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl">
<div className="p-6 border-b flex justify-between items-center"><h3 className="text-xl font-black">تعديل الالتزام</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: null })}><X size={24} /></button></div>
<form onSubmit={handleUpdateLoan} className="p-6 space-y-4">
<div><label className="text-xs font-bold text-slate-500">الاسم</label><input type="text" className="input-field" value={editingLoan.name} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, name: e.target.value } })} /></div>
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500">المبلغ الكلي</label><input type="number" className="input-field" value={editingLoan.totalAmount} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, totalAmount: e.target.value } })} /></div>
<div><label className="text-xs font-bold text-slate-500">القسط</label><input type="number" className="input-field" value={editingLoan.monthlyInstallment} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, monthlyInstallment: e.target.value } })} /></div>
</div>
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500">المدفوع مقدم</label><input type="number" className="input-field text-emerald-600" value={editingLoan.prePaidAmount || 0} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, prePaidAmount: e.target.value } })} /></div>
<div><label className="text-xs font-bold text-slate-500">يوم الاستحقاق</label><input type="number" className="input-field text-center" value={editingLoan.dueDay} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, dueDay: e.target.value } })} /></div>

</form>
</div>
</div>

{editingBudgetCategory && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl shadow-2xl p-8">
<h3 className="text-2xl font-black mb-6">ميزانية: {editingBudgetCategory}</h3>
<input type="number" className="input-field text-xl font-black text-blue-600 mb-4" value={budgetAmount} onChange={e => dispatch({ type: 'SET_BUDGET_AMOUNT', payload: e.target.value })} />
<div className="flex gap-4">
<button type="button" onClick={handleSaveBudget} className="flex-1 gradient-bg-primary text-white py-3 rounded-2xl font-bold">حفظ</button>
<button type="button" onClick={() => dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null })} className="flex-1 bg-slate-100 py-3 rounded-2xl font-bold">إلغاء</button>
</div>
</div>
</div>
)}

{/* Fawry Modal */}
{editingFawry && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-yellow-400/50">
<div className="p-6 border-b flex justify-between items-center bg-yellow-50 dark:bg-yellow-900/10"><h3 className="text-xl font-black">ضبط رصيد فوري</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_FAWRY', payload: null })}><X size={24} /></button></div>
<form onSubmit={(e) => { e.preventDefault(); localStorage.setItem('fawryData', JSON.stringify(editingFawry)); dispatch({ type: 'UPDATE_FAWRY_DATA', payload: editingFawry }); dispatch({ type: 'SET_EDITING_FAWRY', payload: null }); addNotification({ type: 'success', title: 'تم الحفظ' }); }} className="p-6 space-y-6">
<div className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-5 border">
<div className="flex items-center gap-2 mb-4 text-sm font-bold text-fawryBlue"><Calculator size={18} /> معادلة الرصيد</div>
<div className="space-y-2 text-sm font-mono">
<div className="flex justify-between"><span>البداية</span><span className="font-bold">{safeNumber(editingFawry.openingBalance).toLocaleString()}</span></div>
<div className="flex justify-between text-emerald-600"><span>+ الشحن</span><span>+{fawryStats.deposits.toLocaleString()}</span></div>
<div className="flex justify-between text-red-500"><span>- السحب</span><span>-{fawryStats.withdrawals.toLocaleString()}</span></div>
<div className="h-px bg-slate-300 my-2"></div>
<div className="flex justify-between text-lg font-black text-fawryBlue"><span>= المتوقع</span><span>{(safeNumber(editingFawry.openingBalance) + fawryStats.deposits - fawryStats.withdrawals).toLocaleString()} ج.م</span></div>
</div>
</div>
<input type="number" step="0.01" min="0" className="input-field text-xl font-black text-fawryBlue" value={editingFawry.openingBalance} onChange={e => dispatch({ type: 'SET_EDITING_FAWRY', payload: { ...editingFawry, openingBalance: safeNumber(e.target.value) } })} />
<button type="submit" className="w-full gradient-bg-primary text-white py-3 rounded-xl font-bold">حفظ</button>
</form>
</div>
</div>
)}

{/* Etisalat Modal */}
{editingEtisalat && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-green-500/50">
<div className="p-6 border-b flex justify-between items-center bg-green-50 dark:bg-green-900/10"><h3 className="text-xl font-black">ضبط اتصالات</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_ETISALAT', payload: null })}><X size={24} /></button></div>
<form onSubmit={(e) => { e.preventDefault(); localStorage.setItem('etisalatData', JSON.stringify(editingEtisalat)); dispatch({ type: 'UPDATE_ETISALAT_DATA', payload: editingEtisalat }); dispatch({ type: 'SET_EDITING_ETISALAT', payload: null }); addNotification({ type: 'success', title: 'تم الحفظ' }); }} className="p-6 space-y-6">
<div className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-5 border">
<div className="flex items-center gap-2 mb-4 text-sm font-bold text-etisalatGreen"><Calculator size={18} /> معادلة الرصيد</div>
<div className="space-y-2 text-sm font-mono">
<div className="flex justify-between"><span>البداية</span><span className="font-bold">{safeNumber(editingEtisalat.openingBalance).toLocaleString()}</span></div>
<div className="flex justify-between text-emerald-600"><span>+ الإيداع</span><span>+{etisalatStats.deposits.toLocaleString()}</span></div>
<div className="flex justify-between text-red-500"><span>- السحب</span><span>-{etisalatStats.withdrawals.toLocaleString()}</span></div>
<div className="h-px bg-slate-300 my-2"></div>
<div className="flex justify-between text-lg font-black text-etisalatGreen"><span>= المتوقع</span><span>{(safeNumber(editingEtisalat.openingBalance) + etisalatStats.deposits - etisalatStats.withdrawals).toLocaleString()} ج.م</span></div>
</div>
</div>
<input type="number" step="0.01" min="0" className="input-field text-xl font-black text-etisalatGreen" value={editingEtisalat.openingBalance} onChange={e => dispatch({ type: 'SET_EDITING_ETISALAT', payload: { ...editingEtisalat, openingBalance: safeNumber(e.target.value) } })} />
<button type="submit" className="w-full gradient-bg-success text-white py-3 rounded-xl font-bold">حفظ</button>
</form>
</div>
</div>
)}

{/* Quick Transfer Modal */}
{isQuickTransferModalOpen && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-blue-500/50">
<div className="p-6 border-b flex justify-between items-center gradient-border"><h3 className="text-xl font-black flex items-center gap-2"><ArrowRight size={20} className="text-blue-600" /> تحويل سريع</h3><button type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false })}><X size={24} /></button></div>
<form onSubmit={handleQuickTransfer} className="p-6 space-y-6">
<div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl">
<div className="flex justify-between text-sm font-bold text-blue-700 mb-2"><span>من</span><span>إلى</span></div>
<div className="flex justify-between items-center gap-4">
<select className="input-field text-sm" value={quickTransferData.from} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: e.target.value } })}>{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select>
<div className="text-blue-300"><ArrowRight size={20} /></div>
<select className="input-field text-sm" value={quickTransferData.to} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { to: e.target.value } })}>{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select>
</div>
</div>
<input type="number" required step="0.01" min="0.01" className="input-field text-xl font-black text-blue-600" value={quickTransferData.amount} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: e.target.value } })} placeholder="المبلغ" />
<button type="submit" className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold">تنفيذ التحويل</button>
</form>
</div>
</div>
)}

{/* Recurring Modal */}
{isRecurringModalOpen && (
<div className="modal-backdrop no-print">
<div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-blue-500/50">
<div className="p-6 border-b flex justify-between items-center gradient-border"><h3 className="text-xl font-black flex items-center gap-2"><Repeat size={20} className="text-blue-600" /> إضافة التزام متكرر</h3><button type="button" onClick={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false })}><X size={24} /></button></div>
<form onSubmit={handleSaveRecurring} className="p-6 space-y-4">
<div><label className="text-xs font-bold text-slate-500 block mb-2">العنوان</label><input type="text" required className="input-field" value={recurringFormData.title} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, title: e.target.value } })} /></div>
<div className="grid grid-cols-2 gap-4">
<div><label className="text-xs font-bold text-slate-500 block mb-2">المبلغ</label><input type="number" required min="0" className="input-field font-bold text-blue-600" value={recurringFormData.amount} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, amount: e.target.value } })} /></div>
<div><label className="text-xs font-bold text-slate-500 block mb-2">اليوم</label><input type="number" required min="1" max="31" className="input-field text-center" value={recurringFormData.day} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, day: e.target.value } })} /></div>
</div>
<div><label className="text-xs font-bold text-slate-500 block mb-2">النوع</label>
<select className="input-field" value={recurringFormData.type} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, type: e.target.value } })}>
<option value="expense">💸 مصروف</option><option value="income">💰 دخل</option>
</select></div>
<div><label className="text-xs font-bold text-slate-500 block mb-2">الفئة</label>
<select className="input-field" value={recurringFormData.category} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, category: e.target.value } })}>
<option value="أخرى">أخرى</option>
{CATEGORIES.expense.map(c => <option key={c} value={c}>{c}</option>)}
</select></div>
<button type="submit" className="w-full gradient-bg-primary text-white py-3 rounded-xl font-bold">إضافة</button>
</form>
</div>
</div>
)}
</div>
);
}

// ===== Root =====
const rootElement = document.getElementById('root');
if (rootElement) {
setTimeout(() => { const l = document.getElementById('loading'); if (l) l.style.display = 'none'; }, 1500);
createRoot(rootElement).render(<ErrorBoundary><App /></ErrorBoundary>);
}
</script>
</body>
</html>
