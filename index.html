    isSmsModalOpen: false,
    pendingCloseModal: { isOpen: false, pending: [], total: 0, month: '', year: 0 },
    walletVisibility: { fawry: true, etisalat: true, cib_savings: true, aaib_savings: true, cash: true },
    isProcessing: false, formErrors: {},
    activeCategoryDetail: null
  });

  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [authLoading, setAuthLoading] = useState(true);
  const [pinVerified, setPinVerified] = useState(() => sessionStorage.getItem('pin_verified') === 'yes');
  const [isDrawerOpen, setIsDrawerOpen] = useState(false);
  const mainContentRef = useRef(null);
  const saveTimeoutRef = useRef(null);
  const processingTimeoutRef = useRef(null);
  const saveLockRef = useRef(false);
  const lastRemoteRef = useRef(null);
  const lastMaterializeRef = useRef('');

  const { data, activeTab, selectedYear, selectedMonth, transViewMode, catViewType, isFormOpen, formMode, formData, isLocked, isDarkMode, expandedGroup, budgets, editingCard, editingLoan, searchTerm, editingBudgetCategory, budgetAmount, isRecurringModalOpen, recurringFormData, notifications, history, expandedLedgers, expandedCardsSection, statusFilter, confirmDialog, isQuickTransferModalOpen, quickTransferData, viewingCardStatement, viewingReceipt, isPinChangeOpen, isSmsModalOpen, pendingCloseModal, walletVisibility, isProcessing, formErrors, activeCategoryDetail } = state;
  const { transactions = [], loans = [], cards = [], recurringItems = [], accountsData = DEFAULT_ACCOUNTS, monthlyPlans = {} } = data || {};

  const isOnline = useOnlineStatus();
  const prevOnlineRef = useRef(isOnline);

  const addNotification = useCallback((notification) => dispatch({ type: 'ADD_NOTIFICATION', payload: notification }), []);
  const removeNotification = useCallback((id) => dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }), []);
  const saveHistory = useCallback(() => dispatch({ type: 'ADD_TO_HISTORY', payload: { data: JSON.parse(JSON.stringify(data)), budgets: JSON.parse(JSON.stringify(budgets)) } }), [data, budgets]);

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((user) => {
      setAuthLoading(false);
      setIsAuthenticated(!!(user && user.email === "ahmedmkh@gmail.com"));
    });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!isAuthenticated) return;
    const docRef = db.collection("finance_2026").doc("user_ahmed_data");
    const unsub = docRef.onSnapshot((doc) => {
      if (doc.exists) {
        const raw = doc.data();
        const migrated = migrateData(raw);
        lastRemoteRef.current = JSON.stringify(migrated);
        if (raw.budgets && typeof raw.budgets === 'object') dispatch({ type: 'SET_BUDGETS', payload: raw.budgets });
        dispatch({ type: 'SET_DATA', payload: migrated });
      }
    });
    return () => unsub();
  }, [isAuthenticated]);

  useEffect(() => {
    if (isAuthenticated && data && data.transactions) {
      clearTimeout(saveTimeoutRef.current);
      saveTimeoutRef.current = setTimeout(() => {
        if (lastRemoteRef.current && JSON.stringify(data) === lastRemoteRef.current) return;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { console.warn('LS save failed:', e); }
        db.collection("finance_2026").doc("user_ahmed_data").set({ ...data, budgets }, { merge: true }).catch(err => console.error(err));
      }, 5000);
    }
    return () => clearTimeout(saveTimeoutRef.current);
  }, [data, isAuthenticated, budgets]);

  // ✅ materialize مع sig يشمل القروض
  useEffect(() => {
    if (!isAuthenticated || !data?.recurringItems?.length) return;
    const today = getLocalISODate();
    const activeCount = data.recurringItems.filter(r => r.active !== false).length;
    const loansSig = (data.loans || []).filter(l => l.systemId === SYSTEM_LOAN_IDS.TAKYEEF).map(l => `${l.id}:${l.prePaidAmount}:${l.totalAmount}`).join('|');
    const sig = `${today}_${data.recurringItems.length}_${activeCount}_${loansSig}`;
    if (lastMaterializeRef.current === sig) return;
    lastMaterializeRef.current = sig;
    const updated = materializeRecurringItems(data, today);
    if (updated) {
      const added = updated.transactions.length - (data.transactions?.length || 0);
      dispatch({ type: 'SET_DATA', payload: updated });
      if (added > 0) addNotification({ type: 'info', title: 'تم توليد التزامات شهرية', message: `${added} بند متكرر بانتظار الاعتماد`, duration: 6000 });
    }
  }, [isAuthenticated, data?.recurringItems, data?.transactions?.length, data?.loans, addNotification]);

  useEffect(() => {
    if (prevOnlineRef.current !== isOnline) {
      if (isOnline) addNotification({ type: 'success', title: 'تم استعادة الاتصال', message: 'جاري المزامنة مع السحابة...', duration: 4000 });
      else addNotification({ type: 'warning', title: 'انقطع الاتصال', message: 'التغييرات محفوظة محلياً وستُزامَن تلقائياً', duration: 6000 });
      prevOnlineRef.current = isOnline;
    }
  }, [isOnline, addNotification]);

  const cancelProcessing = useCallback(() => {
    if (processingTimeoutRef.current) { clearTimeout(processingTimeoutRef.current); processingTimeoutRef.current = null; }
    saveLockRef.current = false;
    dispatch({ type: 'SET_IS_PROCESSING', payload: false });
    addNotification({ type: 'info', title: 'تم الإلغاء' });
  }, [addNotification]);

  const liveBalances = useMemo(() => { const b = {}; ACCOUNT_KEYS.forEach(k => { b[k] = computeBalance(data, k); }); return b; }, [data]);
  const totalLiquidity = useMemo(() => ACCOUNT_KEYS.reduce((s, k) => s + liveBalances[k], 0), [liveBalances]);
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);

  const financeSnapshot = useMemo(() => {
    const opening = getOpeningBalance(data, 'cash', selectedYear, selectedMonth);
    const actualCashInHand = computeBalance(data, 'cash', endOfToday());
    const today = endOfToday();
    const curMonth = transactions.filter(t => t.month === selectedMonth && (t.year || new Date(t.date).getFullYear()) === selectedYear);
    const actualIncome = curMonth.filter(t => t.type === 'income' && t.status === 'paid' && t.method === 'cash' && (parseISODate(t.date) || new Date()) <= today).reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncome = curMonth.filter(t => t.type === 'income' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidCash = curMonth.filter(t => t.type === 'expense' && t.status === 'paid' && t.method === 'cash' && (parseISODate(t.date) || new Date()) <= today).reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingCash = curMonth.filter(t => t.type === 'expense' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
    return { opening, actualIncome, pendingIncome, paidCash, pendingCash, actualCashInHand, projectedClosingBalance: actualCashInHand + pendingIncome - pendingCash };
  }, [data, transactions, selectedYear, selectedMonth]);

  // ✅ chartData يفلتر paid
  const chartData = useMemo(() => getMonthsForYear(selectedYear).map(m => ({
    name: m.slice(0, 3),
    دخل: transactions.filter(t => t.month === m && (t.year || 2026) === selectedYear && t.type === 'income' && t.status === 'paid').reduce((a, c) => a + safeNumber(c.amount), 0),
    مصروف: transactions.filter(t => t.month === m && (t.year || 2026) === selectedYear && t.type === 'expense' && t.status === 'paid').reduce((a, c) => a + safeNumber(c.amount), 0)
  })), [transactions, selectedYear]);

  // ✅ updatedLoans — items يشمل الكل مع status
  const updatedLoans = useMemo(() => {
    const map = transactions.reduce((acc, t) => { if (t.linkedLoanId && t.status === 'paid') acc[t.linkedLoanId] = (acc[t.linkedLoanId] || 0) + safeNumber(t.amount); return acc; }, {});
    const receivablesPaidMap = transactions.reduce((acc, t) => { if (t.sourceReceivableId && t.status === 'paid') acc[t.sourceReceivableId] = (acc[t.sourceReceivableId] || 0) + safeNumber(t.amount); return acc; }, {});
    const regular = loans.filter(l => !l.autoMonthly && !l.isReceivable).map(l => ({ ...l, isReceivable: false, totalPaid: safeNumber(l.prePaidAmount) + (map[l.id] || 0), remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (map[l.id] || 0))) }));
    const receivables = loans.filter(l => l.isReceivable).map(l => ({ ...l, isReceivable: true, paused: !!l.paused, totalPaid: safeNumber(l.prePaidAmount) + (receivablesPaidMap[l.id] || 0), remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (receivablesPaidMap[l.id] || 0))) }));
    const autoMonthly = [];
    const allMonths = YEARS_LIST.flatMap(y => getMonthsForYear(y).map(m => ({ year: y, month: m })));
    loans.filter(l => l.autoMonthly).forEach(tpl => {
      allMonths.forEach(({ year, month }) => {
        const monthKey = makeMonthKey(year, month);
        if (tpl.mergeIntoNextCycle && tpl.mergeIntoNextCycle.includes(monthKey)) return;
        let monthTx = transactions.filter(t => t.category === tpl.category && t.month === month && (t.year || 2026) === year && t.type === 'expense');
        const prevMonthIdx = getMonthIndex(month) - 1;
        let prevYear = year, prevMonthName;
        if (prevMonthIdx < 0) { prevMonthName = ALL_MONTHS[11]; prevYear = year - 1; } else { prevMonthName = ALL_MONTHS[prevMonthIdx]; }
        const prevMonthKey = makeMonthKey(prevYear, prevMonthName);
        if (tpl.mergeIntoNextCycle && tpl.mergeIntoNextCycle.includes(prevMonthKey)) {
          const prevMonthTx = transactions.filter(t => t.category === tpl.category && t.month === prevMonthName && (t.year || 2026) === prevYear && t.type === 'expense');
          monthTx = [...prevMonthTx, ...monthTx];
        }
        if (monthTx.length === 0) return;
        const dueDay = safeNumber(tpl.dueDay, 5);
        let dueMonthIdx = getMonthIndex(month) + (tpl.dueNextMonth ? 1 : 0);
        let dueYear = year;
        if (dueMonthIdx > 11) { dueMonthIdx = 0; dueYear++; }
        const dueDateISO = `${dueYear}-${String(dueMonthIdx + 1).padStart(2, '0')}-${String(dueDay).padStart(2, '0')}`;
        const total = monthTx.reduce((s, t) => s + safeNumber(t.amount), 0);
        const paidTotal = monthTx.filter(t => t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
        const compositeId = `auto-${tpl.id}-${year}-${month}`;
        const repayments = safeNumber(map[compositeId]);
        autoMonthly.push({ ...tpl, id: compositeId, name: `${tpl.name} - ${month} ${year}`, totalAmount: total, prePaidAmount: 0, monthlyInstallment: 0, remaining: Math.max(0, total - repayments), totalPaid: repayments, dueDate: dueDateISO, dueDay, description: `${monthTx.length} مسحوبة`, autoGenerated: true, month, year, items: monthTx.slice().sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) });
      });
    });

    const exp = m.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);

  const groupedTransactions = useMemo(() => {
    const groups = {};
    const term = normalizeText(searchTerm);

      if (t.month !== selectedMonth || (t.year || 2026) !== selectedYear) return false;
      if (transViewMode !== 'all' && t.type !== transViewMode) return false;
      if (searchTerm && !normalizeText(t.description).includes(term) && !normalizeText(t.category).includes(term)) return false;
      if (statusFilter === 'paid' && t.status !== 'paid') return false;
      if (statusFilter === 'pending' && t.status === 'paid') return false;
      return true;
    }).forEach(t => {
      if (!groups[t.category]) groups[t.category] = { category: t.category, total: 0, count: 0, items: [] };
      groups[t.category].total += safeNumber(t.amount);
      groups[t.category].count++;
      groups[t.category].items.push(t);
    });
    return Object.values(groups).sort((a, b) => b.total - a.total);
  }, [transactions, selectedYear, selectedMonth, transViewMode, searchTerm, statusFilter]);

  const buildLedger = useCallback((methodId) => {
    const cutoffDay = dayStart(getAccountCutoff(accountsData, methodId));

    return acc.map(t => { const a = safeNumber(t.amount); bal += (t.subType === 'deposit') ? a : -a; return { ...t, runningBalance: bal }; }).reverse();
  }, [transactions, accountsData]);

  const getAgendaItems = useCallback(() => {
    try {
      const today = new Date();
      const cd = today.getDate(), cm = today.getMonth(), cy = today.getFullYear();
      const items = [];
      cards.forEach(c => {
        const d = parseInt(c.dueDate) || 5;
        let tm = cm, ty = cy;
        if (d < cd) { tm++; if (tm > 11) { tm = 0; ty++; } }

      });
      updatedLoans.forEach(l => {
        if (safeNumber(l.monthlyInstallment) > 0 && l.remaining > 0 && !l.autoGenerated && !l.isReceivable) {
          const d = parseInt(l.dueDay) || 1;
          let tm = cm, ty = cy;
          if (d < cd) { tm++; if (tm > 11) { tm = 0; ty++; } }
          items.push({ id: `ag-loan-${l.id}`, title: `قسط ${l.name}`, date: new Date(ty, tm, d).toISOString().split('T')[0], amount: safeNumber(l.monthlyInstallment), type: 'danger', icon: Banknote, desc: l.description });
        }
        if (l.isReceivable && !l.paused && l.remaining > 0 && safeNumber(l.monthlyInstallment) > 0) {
          const d = parseInt(l.dueDay) || 1;
          let tm = cm, ty = cy;
          if (d < cd) { tm++; if (tm > 11) { tm = 0; ty++; } }
          items.push({ id: `ag-recv-${l.id}`, title: `تحصيل ${l.name}`, date: new Date(ty, tm, d).toISOString().split('T')[0], amount: safeNumber(l.monthlyInstallment), type: 'success', icon: TrendingUp, desc: '💰 مستحق لك' });
        }
      });
      recurringItems.forEach(r => {
        if (r.active === false) return;

        if (r.endMonth && targetInputMonth > r.endMonth) return;

        const icon = isIncome ? TrendingUp : isMonthlyBen ? Users : isFee ? Receipt : Repeat;
        items.push({ id: `ag-rec-${r.id}`, date: new Date(ty, tm, d).toISOString().split('T')[0], title: r.title, amount: safeNumber(r.amount), type: isIncome ? 'success' : 'warning', icon, desc });
      });
      return items.sort((a, b) => (parseISODate(a.date) || 0) - (parseISODate(b.date) || 0));
    } catch (err) { console.error(err); return []; }
  }, [cards, updatedLoans, recurringItems, data]);

  // ✅ handleSaveTransaction مع مزامنة + تحذير طرق بلا حساب
  const handleSaveTransaction = useCallback((e) => {
    e.preventDefault();

    if (!amount || amount <= 0) errors.amount = 'مبلغ غير صحيح';

    }

    dispatch({ type: 'SET_IS_PROCESSING', payload: true });
    processingTimeoutRef.current = setTimeout(() => {
      try {
        saveHistory();
        const finalSubType = formData.subType || (formData.type === 'income' ? 'deposit' : 'withdrawal');
        const status = formData.status || 'pending';
        let syncLinkedCardId = formData.linkedCardId;
        let syncCardLast4 = formData.cardLast4;
        if (CREDIT_CARD_METHOD_IDS.includes(formData.method)) {
          const matchingCard = cards.find(c => getCardMethod(c) === formData.method);
          if (matchingCard && syncLinkedCardId !== matchingCard.id) { syncLinkedCardId = matchingCard.id; syncCardLast4 = undefined; }
        } else { syncLinkedCardId = undefined; syncCardLast4 = undefined; }

        const next = formMode === 'add' ? [...transactions, newTx] : transactions.map(t => t.id === newTx.id ? { ...newTx } : t);
        next.sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
        dispatch({ type: 'UPDATE_TRANSACTIONS', payload: next });
        dispatch({ type: 'SET_FORM_OPEN', payload: false });
        addNotification({ type: 'success', title: status === 'paid' ? 'تم الحفظ والاعتماد' : 'تم الحفظ كمعلق' });
      } catch (err) {
        console.error('Save transaction error:', err);
        addNotification({ type: 'error', title: 'فشل الحفظ', message: err.message || 'خطأ غير متوقع' });
      }
      saveLockRef.current = false;
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
      processingTimeoutRef.current = null;
    }, 300);
  }, [formData, formMode, transactions, data, saveHistory, addNotification, isProcessing, cards]);

  const handleQuickTransfer = useCallback((e) => {

    processingTimeoutRef.current = setTimeout(() => {

      const txs = [];
      if (transferType === 'monthly') {
        const ben = BENEFICIARIES.find(b => b.id === quickTransferData.beneficiaryId);
        const isFromBank = quickTransferData.from === 'cib_savings' || quickTransferData.from === 'aaib_savings';
        const useTelda = isFromBank && ben.hasTelda && !quickTransferData.forceCash;
        // ✅ الحساب المصدر هو method دائماً (المال يخرج منه فعلاً)
        txs.push({
          id: 'monthly-' + getSafeId(),
          type: 'expense', kind: KIND.OPERATIONAL,
          category: `مصروف شهري - ${ben.label}`,
          amount,
          description: useTelda ? `مصروف شهري - ${ben.label} (عبر Telda)` : `مصروف شهري - ${ben.label}`,
          method: quickTransferData.from,
          transferChannel: useTelda ? ben.method : undefined,
          date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
          subType: 'withdrawal', status: 'paid', beneficiaryId: ben.id, receipts: []
        });
      }
      dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [...txs, ...transactions].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) });
      dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
      dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: 'cash', to: 'fawry', amount: '', fees: '', transferType: 'monthly', externalEntity: '', date: getLocalISODate(), beneficiaryId: null, forceCash: false } });
      addNotification({ type: 'success', title: 'تم التسجيل' });
      saveLockRef.current = false;
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
      processingTimeoutRef.current = null;
    }, 600);
  }, [quickTransferData, data, transactions, saveHistory, addNotification, isProcessing]);

  const handleManualReconciliation = useCallback((walletKey, actualAmount) => {

    switch (activeTab) {
      case 'dashboard': return <DashboardView data={data} financeSnapshot={financeSnapshot} liveBalances={liveBalances} totalLiquidity={totalLiquidity} walletVisibility={walletVisibility} onToggleVisibility={(k) => dispatch({ type: 'TOGGLE_WALLET_VISIBILITY', payload: k })} dispatch={dispatch} selectedYear={selectedYear} selectedMonth={selectedMonth} transactions={transactions} cards={cards} updatedLoans={updatedLoans} chartData={chartData} isDarkMode={isDarkMode} handleManualReconciliation={handleManualReconciliation} addNotification={addNotification} onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} />;
      case 'transactions': return <TransactionsView groupedTransactions={groupedTransactions} transactions={transactions} selectedMonth={selectedMonth} selectedYear={selectedYear} transViewMode={transViewMode} statusFilter={statusFilter} searchTerm={searchTerm} expandedGroup={expandedGroup} data={data} monthInsights={monthInsights} dispatch={dispatch} handleDelete={handleDelete} addNotification={addNotification} onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} saveHistory={saveHistory} onPrintMonthlyReport={() => {}} />;
      case 'categories': return <CategoriesView transactions={transactions} selectedMonth={selectedMonth} selectedYear={selectedYear} catViewType={catViewType} budgets={budgets} dispatch={dispatch} handleDelete={handleDelete} onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} />;
      case 'loans': return <LoansView updatedLoans={updatedLoans} cards={cards} recurringItems={recurringItems} transactions={transactions} dispatch={dispatch} deleteRecurring={deleteRecurring} saveHistory={saveHistory} getLocalISODate={getLocalISODate} addNotification={addNotification} data={data} selectedMonth={selectedMonth} selectedYear={selectedYear} />;
      case 'cards': return <WalletsAndCardsView cards={cards} buildLedger={buildLedger} expandedLedgers={expandedLedgers} expandedCardsSection={expandedCardsSection} selectedMonth={selectedMonth} selectedYear={selectedYear} dispatch={dispatch} handleDelete={handleDelete} handleAddWalletDeposit={handleAddWalletDeposit} handleAddWalletWithdrawal={handleAddWalletWithdrawal} walletVisibility={walletVisibility} liveBalances={liveBalances} saveHistory={saveHistory} addNotification={addNotification} data={data} />;
      case 'planning': return <MonthlyPlanningView data={data} monthlyPlans={monthlyPlans} cards={cards} loans={updatedLoans} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />;
      case 'planner': return <PlannerView updatedLoans={updatedLoans} cards={cards} selectedMonth={selectedMonth} selectedYear={selectedYear} monthlyPlans={monthlyPlans} totalLiquidityNow={totalLiquidity} data={data} transactions={transactions} recurringItems={recurringItems} />;
      case 'forecast': return <LiquidityForecastView transactions={transactions} updatedLoans={updatedLoans} recurringItems={recurringItems} liveBalances={liveBalances} selectedYear={selectedYear} selectedMonth={selectedMonth} monthlyPlans={monthlyPlans} />;
      case 'comparison': return <MonthComparisonView transactions={transactions} selectedYear={selectedYear} selectedMonth={selectedMonth} />;
      case 'calendar': return <CalendarView data={data} getAgendaItems={getAgendaItems} transactions={transactions} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />;
      case 'duplicates': return <DuplicateDetectionSystem transactions={transactions} data={data} dispatch={dispatch} addNotification={addNotification} saveHistory={saveHistory} />;
      case 'settings': return <SettingsView data={data} accountsData={accountsData} cards={cards} budgets={budgets} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />;
      default: return null;
    }
  };

  return (
    <PromiseModalProvider>
      <div className="flex h-screen overflow-hidden font-sans">
        <ProfessionalTicker updatedLoans={updatedLoans} cards={cards} liveBalances={liveBalances} walletVisibility={walletVisibility} custodyBalance={custodySummary.balance} data={data} />
        <OfflineBanner online={isOnline} />
        <ToastContainer notifications={notifications} removeNotification={removeNotification} />
        <ConfirmDialog confirmDialog={confirmDialog} dispatch={dispatch} />
        {pendingCloseModal.isOpen && (<PendingCloseModal data={pendingCloseModal} onClose={() => dispatch({ type: 'SET_PENDING_CLOSE_MODAL', payload: { isOpen: false, pending: [], total: 0, month: '', year: 0 } })} onAction={handlePendingCloseAction} />)}
        {isProcessing && (<div className="processing-overlay"><div className="processing-spinner mb-4"></div><h3 className="text-base font-bold mb-2">جاري تطبيق العملية</h3><button onClick={cancelProcessing} className="btn btn-secondary bg-red-500 text-white mt-3 text-xs">إلغاء</button></div>)}
        {isPinChangeOpen && (<PinChangeModal onClose={() => dispatch({ type: 'SET_PIN_CHANGE_OPEN', payload: false })} addNotification={addNotification} />)}
        {isSmsModalOpen && (<SmsParserModal isOpen={true} onClose={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: false })} dispatch={dispatch} addNotification={addNotification} saveHistory={saveHistory} data={data} />)}
        {activeCategoryDetail && (<CategoryDetailModal category={activeCategoryDetail} transactions={transactions} selectedMonth={selectedMonth} selectedYear={selectedYear} dispatch={dispatch} addNotification={addNotification} />)}
{viewingCardStatement && (
  <CardStatementModal
    card={viewingCardStatement}
    data={data}
    transactions={transactions}
    onClose={() => dispatch({ type: 'SET_VIEWING_CARD_STATEMENT', payload: null })}
    addNotification={addNotification}
  />
)}
        {!isLocked && (
          <div className="bottom-nav-container no-print">
            <div className="scrollable-nav scroll-hide">
              {[{ id: 'dashboard', label: 'الرئيسية', icon: LayoutDashboard }, { id: 'transactions', label: 'المعاملات', icon: ArrowUpRight }, { id: 'cards', label: 'المحافظ', icon: CreditCard }, { id: 'calendar', label: 'الأجندة', icon: CalendarDays }].map(item => (
                <button key={item.id} type="button" onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} className={`nav-btn ${activeTab === item.id ? 'active' : ''}`}><item.icon size={19} /><span>{item.label}</span></button>
              ))}
              <button type="button" onClick={() => setIsDrawerOpen(true)} className="nav-btn" style={{ color: 'var(--brand)' }}><Menu size={19} /><span>المزيد</span></button>
            </div>
          </div>
        )}

        {isDrawerOpen && (
          <div className="fixed inset-0 z-[4000] no-print">
            <div className="absolute inset-0 backdrop-blur-sm animate-fadeIn" style={{ background: 'rgba(42, 36, 24, 0.55)' }} onClick={() => setIsDrawerOpen(false)}></div>
            <div className="absolute bottom-0 left-0 right-0 rounded-t-3xl shadow-2xl max-h-[85vh] overflow-y-auto scroll-hide animate-slideInBottom" style={{ background: 'var(--bg-card)', paddingBottom: 'calc(20px + env(safe-area-inset-bottom))' }}>
              <div className="pt-3 pb-2 flex justify-center"><div className="w-10 h-1.5 rounded-full" style={{ background: 'var(--border-default)' }}></div></div>
              <div className="px-4 pb-2 flex justify-between items-center"><h3 className="font-black text-sm">القائمة</h3><button onClick={() => setIsDrawerOpen(false)} className="btn btn-ghost p-1.5"><X size={16} /></button></div>
              <div className="px-3 space-y-3">
                <div><p className="sidebar-group-title">المتابعة</p>
                  <div className="grid grid-cols-2 gap-1.5">
                    {[{ id: 'categories', label: 'الفئات', icon: Layers }, { id: 'loans', label: 'الالتزامات', icon: Banknote }].map(item => (
                      <button key={item.id} onClick={() => { dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id }); setIsDrawerOpen(false); }} className="flex items-center gap-2 p-2.5 rounded-lg text-xs font-bold" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><item.icon size={14} /><span className="truncate">{item.label}</span></button>
                    ))}
                  </div>
                </div>
                <div><p className="sidebar-group-title">التخطيط</p>
                  <div className="grid grid-cols-2 gap-1.5">
                    {[{ id: 'planning', label: 'التخطيط', icon: Table }, { id: 'planner', label: 'المخطط', icon: Target }, { id: 'forecast', label: 'التوقع', icon: LineChart }, { id: 'comparison', label: 'المقارنة', icon: Activity }, { id: 'duplicates', label: 'المكررات', icon: Filter }].map(item => (
                      <button key={item.id} onClick={() => { dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id }); setIsDrawerOpen(false); }} className="flex items-center gap-2 p-2.5 rounded-lg text-xs font-bold" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><item.icon size={14} /><span className="truncate">{item.label}</span></button>
                    ))}
                  </div>
                </div>
                <div><p className="sidebar-group-title">الإعدادات</p>
                  <div className="grid grid-cols-2 gap-1.5">
                    <button onClick={() => { handleExport(); setIsDrawerOpen(false); }} className="flex items-center gap-2 p-2.5 rounded-lg text-xs font-bold" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><Download size={14} className="text-blue-500" /><span className="truncate">حفظ نسخة</span></button>
                    <label className="flex items-center gap-2 p-2.5 rounded-lg text-xs font-bold cursor-pointer" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><Upload size={14} className="text-purple-500" /><span className="truncate">استيراد</span><input type="file" accept=".json" onChange={(e) => { handleImport(e); setIsDrawerOpen(false); }} className="hidden" /></label>
                    <button onClick={() => { dispatch({ type: 'SET_ACTIVE_TAB', payload: 'settings' }); setIsDrawerOpen(false); }} className="col-span-2 flex items-center justify-center gap-2 p-2.5 rounded-lg text-xs font-bold" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><Sliders size={14} /><span>الإعدادات</span></button>
                    <button onClick={() => { sessionStorage.removeItem('pin_verified'); setPinVerified(false); setIsDrawerOpen(false); }} className="flex items-center gap-2 p-2.5 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-amber-700 dark:text-amber-400 text-xs font-bold"><Lock size={14} /><span className="truncate">قفل</span></button>
                    <button onClick={() => { firebase.auth().signOut(); setIsAuthenticated(false); sessionStorage.removeItem('pin_verified'); setPinVerified(false); setIsDrawerOpen(false); }} className="flex items-center gap-2 p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-red-600 text-xs font-bold"><LogOut size={14} /><span className="truncate">خروج</span></button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

        {!isLocked && (<button type="button" aria-label="إضافة" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', category: '', amount: '', date: getLocalISODate(), method: 'cash', subType: 'withdrawal', status: 'pending', receipts: [] } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="fab no-print"><Plus size={22} /></button>)}

        <EnhancedSidebar activeTab={activeTab} dispatch={dispatch} canUndo={history.length > 0} onUndo={() => dispatch({ type: 'UNDO' })} />

        <main ref={mainContentRef} className={`flex-1 overflow-y-auto p-3 lg:p-5 ${isOnline ? 'pt-9' : 'pt-20'}`}>
          {isLocked ? (
            <div className="min-h-screen flex flex-col items-center justify-center no-print">
              <Lock size={48} className="mb-4 text-blue-500" />
              <h2 className="text-xl font-black mb-4">التطبيق مقفل</h2>
              <button type="button" onClick={() => dispatch({ type: 'SET_IS_LOCKED', payload: false })} className="btn btn-primary px-6 py-3"><Unlock size={18} /> فتح</button>
            </div>
          ) : (
            <div className="max-w-6xl mx-auto space-y-4 animate-fadeIn pb-24">
              <ProfessionalHeader isDarkMode={isDarkMode} dispatch={dispatch} onOpenSms={() => dispatch({ type: 'SET_SMS_MODAL_OPEN', payload: true })} isOnline={isOnline} />
              {renderActiveView()}
            </div>
          )}
        </main>

        {isFormOpen && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)', maxHeight: 'calc(100dvh - 24px)' }}>
              <div className="p-3.5 flex justify-between items-center flex-shrink-0" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-sm font-black">{formMode === 'add' ? 'إضافة عملية' : 'تعديل'}</h3>
                <button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_FORM_OPEN', payload: false })} className="btn btn-ghost p-1.5"><X size={16} /></button>
              </div>
              <form onSubmit={handleSaveTransaction} className="p-3.5 space-y-2.5 overflow-y-auto scroll-hide" style={{ minHeight: 0 }}>
                {!isOnline && (<div className="p-2 rounded-lg bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900 flex items-center gap-2"><Wifi size={12} className="text-amber-600" /><span className="text-[10px] font-bold text-amber-700 dark:text-amber-400">أنت غير متصل — سيتم الحفظ محلياً والمزامنة تلقائياً</span></div>)}
                <div className="grid grid-cols-2 gap-2.5">
                  <div>
                    <label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>النوع</label>
                    <select className="input-field font-bold text-sm py-2.5" value={formData.type} onChange={(e) => { const t = e.target.value; dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, type: t, subType: t === 'income' ? 'deposit' : 'withdrawal', category: '' } }); }}><option value="expense">مصروف 💸</option><option value="income">دخل 💰</option></select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الفئة</label>
                    <select className={`input-field font-bold text-sm py-2.5 ${formErrors.category ? 'error' : ''}`} value={formData.category} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, category: e.target.value } })} required>
                      <option value="">اختر...</option>
                      {Object.entries(CATEGORY_GROUPS[formData.type]).map(([g, items]) => (<optgroup key={g} label={g}>{items.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>))}
                    </select>
                  </div>
                </div>
                <div className="p-2.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className="grid grid-cols-2 gap-1.5">
                    <label className={`flex items-center justify-center gap-1.5 p-2.5 rounded-lg cursor-pointer border-2 font-bold text-[11px] transition-all ${formData.status !== 'paid' ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-500 text-amber-700 dark:text-amber-400' : 'border-transparent'}`}>
                      <input type="radio" name="status" value="pending" className="hidden" checked={formData.status !== 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'pending' } })} /><Clock size={12} /> معلق
                    </label>
                    <label className={`flex items-center justify-center gap-1.5 p-2.5 rounded-lg cursor-pointer border-2 font-bold text-[11px] transition-all ${formData.status === 'paid' ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-500 text-emerald-700 dark:text-emerald-400' : 'border-transparent'}`}>
                      <input type="radio" name="status" value="paid" className="hidden" checked={formData.status === 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'paid' } })} /><CheckCircle2 size={12} /> معتمد
                    </label>
                  </div>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  <div><label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>المبلغ</label><input type="text" inputMode="decimal" required className={`input-field text-sm font-black text-blue-600 text-center py-2.5 ${formErrors.amount ? 'error' : ''}`} value={formData.amount} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, amount: e.target.value } })} /></div>
                  <div><label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>التاريخ</label><input type="date" required className={`input-field text-[11px] font-bold py-2.5 ${formErrors.date ? 'error' : ''}`} value={formData.date} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, date: e.target.value } })} /></div>
                  <div><label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الدفع</label><select className="input-field text-[11px] font-bold py-2.5" value={formData.method} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, method: e.target.value } })}>{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select></div>
                </div>
                <div><label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الوصف</label><input type="text" className={`input-field font-bold text-sm py-2.5 ${formErrors.description ? 'error' : ''}`} value={formData.description || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: e.target.value } })} placeholder="تفاصيل..." /></div>
                <button type="submit" className="btn btn-primary w-full py-2.5 text-sm" disabled={isProcessing}>{isProcessing ? 'جاري الحفظ...' : <React.Fragment><Save size={14} /> {formData.status === 'paid' ? 'حفظ واعتماد' : 'حفظ كمعلق'}</React.Fragment>}</button>
              </form>
            </div>
          </div>
        )}

        {editingCard && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="text-sm font-black">تعديل البطاقة</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_CARD', payload: null })} className="btn btn-ghost p-1.5"><X size={16} /></button></div>
              <form onSubmit={handleUpdateCard} className="p-4 space-y-2.5">
                <div className="grid grid-cols-2 gap-2.5">
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الاسم</label><input type="text" required className="input-field text-sm" value={editingCard.name} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, name: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>البنك</label><input type="text" required className="input-field text-sm" value={editingCard.bank} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, bank: e.target.value } })} /></div>
                </div>
                <div className="grid grid-cols-3 gap-2.5">
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الحد</label><input type="text" inputMode="decimal" className="input-field text-blue-600 font-bold text-sm" value={editingCard.limit} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, limit: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>مديونية أساسية</label><input type="text" inputMode="decimal" className="input-field text-red-500 font-bold text-sm" value={editingCard.openingDebt} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, openingDebt: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>كاش باك %</label><input type="text" inputMode="decimal" className="input-field text-amber-600 font-black text-sm text-center" value={editingCard.cashbackRate || 1} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, cashbackRate: e.target.value } })} /></div>
                </div>
                <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>آخر 4 أرقام</label><input type="text" maxLength={4} className="input-field font-mono text-sm text-center" value={editingCard.last4 || ''} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, last4: e.target.value } })} /></div>
                <button type="submit" className="btn btn-primary w-full py-2.5 text-sm">حفظ</button>
              </form>
            </div>
          </div>
        )}

        {editingLoan && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="text-sm font-black">تعديل الالتزام</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: null })} className="btn btn-ghost p-1.5"><X size={16} /></button></div>
              <form onSubmit={handleUpdateLoan} className="p-4 space-y-2.5">
                <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الاسم</label><input type="text" className="input-field text-sm" value={editingLoan.name} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, name: e.target.value } })} /></div>
                <div className="grid grid-cols-2 gap-2.5">
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>المبلغ</label><input type="text" inputMode="decimal" className="input-field text-sm" value={editingLoan.totalAmount} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, totalAmount: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>القسط</label><input type="text" inputMode="decimal" className="input-field text-sm" value={editingLoan.monthlyInstallment} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, monthlyInstallment: e.target.value } })} /></div>
                </div>
                {editingLoan.isReceivable && (
                  <div className="grid grid-cols-2 gap-2.5">
                    <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>إجمالي الأقساط</label><input type="number" min="0" className="input-field text-sm text-center" value={editingLoan.totalInstallments ?? ''} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, totalInstallments: e.target.value } })} /></div>
                    <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>المدفوعة</label><input type="number" min="0" className="input-field text-sm text-center" value={editingLoan.paidInstallments ?? ''} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, paidInstallments: e.target.value } })} /></div>
                  </div>
                )}
                <button type="submit" className="btn btn-primary w-full py-2.5 text-sm">حفظ</button>
              </form>
            </div>
          </div>
        )}

        {editingBudgetCategory && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-sm rounded-2xl shadow-2xl p-5" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <h3 className="text-sm font-black mb-3">ميزانية: {editingBudgetCategory}</h3>
              <input type="text" inputMode="decimal" className="input-field text-base font-black text-blue-600 mb-3" value={budgetAmount} onChange={e => dispatch({ type: 'SET_BUDGET_AMOUNT', payload: e.target.value })} />
              <div className="flex gap-2">
                <button type="button" onClick={handleSaveBudget} className="btn btn-primary flex-1 text-sm">حفظ</button>
                <button type="button" onClick={() => dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null })} className="btn btn-secondary flex-1 text-sm">إلغاء</button>
              </div>
            </div>
          </div>
        )}

        {isQuickTransferModalOpen && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="text-sm font-black flex items-center gap-2"><ArrowRight size={16} className="text-blue-500" /> تحويل / مصروف شهري</h3><button type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false })} className="btn btn-ghost p-1.5"><X size={16} /></button></div>
              <form onSubmit={handleQuickTransfer} className="p-4 space-y-3">
                <div>
                  <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المستفيد *</label>
                  <div className="grid grid-cols-2 gap-1.5">
                    {BENEFICIARIES.map(ben => (
                      <button key={ben.id} type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { beneficiaryId: ben.id, amount: String(ben.defaultAmount) } })} className={`p-2.5 rounded-lg text-[11px] font-bold transition-all border-2 ${quickTransferData.beneficiaryId === ben.id ? 'border-blue-500 bg-blue-50 dark:bg-blue-950/30 text-blue-700 dark:text-blue-400' : 'border-[color:var(--border-default)]'}`}>
                        <div className="flex flex-col items-center gap-0.5"><span>{ben.label}</span><span className="text-[9px] opacity-70">{fmt(ben.defaultAmount)} ج.م</span></div>
                      </button>
                    ))}
                  </div>
                </div>
                <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>من حساب (سيُخصم منه فعلاً)</label><select className="input-field text-sm py-2.5" value={quickTransferData.from} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: e.target.value } })}>{PAYMENT_METHODS.filter(m => m.group === 'account').map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select></div>
                <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>المبلغ</label><input type="text" inputMode="decimal" className="input-field text-base font-black text-blue-600 text-center py-2.5" value={quickTransferData.amount} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: e.target.value } })} placeholder="0.00" /></div>
                <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>التاريخ</label><input type="date" className="input-field text-sm font-bold py-2.5" value={quickTransferData.date || getLocalISODate()} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { date: e.target.value } })} /></div>
                <button type="submit" className="btn btn-primary w-full py-2.5 text-sm" disabled={isProcessing}>{isProcessing ? 'جاري التنفيذ...' : 'تسجيل المصروف الشهري'}</button>
              </form>
            </div>
          </div>
        )}

        {isRecurringModalOpen && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-sm font-black flex items-center gap-2"><Repeat size={14} className="text-blue-500" />{recurringFormData.id ? 'تعديل بند متكرر' : 'التزام متكرر جديد'}</h3>
                <button type="button" onClick={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false })} className="btn btn-ghost p-1.5"><X size={16} /></button>
              </div>
              <form onSubmit={handleSaveRecurring} className="p-4 space-y-2.5">
                <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>العنوان *</label><input type="text" required className="input-field text-sm" value={recurringFormData.title} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, title: e.target.value } })} /></div>
                <div className="grid grid-cols-2 gap-2.5">
                  <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>المبلغ *</label><input type="text" inputMode="decimal" required className="input-field font-bold text-blue-600 text-sm" value={recurringFormData.amount} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, amount: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>اليوم (1-31)</label><input type="number" required min="1" max="31" className="input-field text-center text-sm" value={recurringFormData.day} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, day: e.target.value } })} /></div>
                </div>
                <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>النوع</label><select className="input-field text-sm" value={recurringFormData.type} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, type: e.target.value, category: '' } })}><option value="expense">مصروف</option><option value="income">دخل</option></select></div>
                <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الفئة</label><select className="input-field text-sm" value={recurringFormData.category} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, category: e.target.value } })}>{CATEGORIES[recurringFormData.type].map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                <div>
                  <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>طريقة الدفع/الحساب (يُخصم منه فعلاً)</label>
                  <select className="input-field text-sm" value={recurringFormData.method || 'cash'} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, method: e.target.value } })}>{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select>
                </div>
                {recurringFormData.category && recurringFormData.category.startsWith('مصروف شهري - ') && (
                  <div>
                    <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>قناة التحويل (اختياري — Telda)</label>
                    <select className="input-field text-sm" value={recurringFormData.transferChannel || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, transferChannel: e.target.value || null } })}>
                      <option value="">— بدون —</option>
                      {EXTERNAL_TRANSFER_METHOD_IDS.map(id => <option key={id} value={id}>{PAYMENT_METHODS.find(m => m.id === id)?.label || id}</option>)}
                    </select>
                  </div>
                )}
                <div className="grid grid-cols-2 gap-2.5">
                  <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>من شهر (اختياري)</label><input type="month" className="input-field text-xs font-bold py-2" value={recurringFormData.startMonth || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, startMonth: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>إلى شهر (اختياري)</label><input type="month" className="input-field text-xs font-bold py-2" value={recurringFormData.endMonth || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, endMonth: e.target.value } })} /></div>
                </div>
                <label className="flex items-center gap-2.5 p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 cursor-pointer">
                  <input type="checkbox" checked={recurringFormData.active !== false} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, active: e.target.checked } })} className="w-4 h-4 accent-emerald-600" />
                  <span className="text-xs font-bold text-emerald-700 dark:text-emerald-400">نشط (سيُولّد تلقائياً كل شهر)</span>
                </label>
                <button type="submit" className="btn btn-primary w-full py-2.5 text-sm"><Save size={14} /> {recurringFormData.id ? 'تحديث البند' : 'إضافة البند'}</button>
              </form>
            </div>
          </div>
        )}
      </div>
    </PromiseModalProvider>
  );
}

const rootElement = document.getElementById('root');
if (rootElement) {
  createRoot(rootElement).render(<ErrorBoundary><App /></ErrorBoundary>);
  const hideLoading = () => {
    const l = document.getElementById('loading');
    if (!l) return;
    l.style.transition = 'opacity 0.35s ease';
    l.style.opacity = '0';
    setTimeout(() => { l.style.display = 'none'; }, 350);
  };
  if (document.readyState === 'complete') { setTimeout(hideLoading, 500); }
  else { window.addEventListener('load', () => setTimeout(hideLoading, 500)); }
}
</script>
</body>
</html>
