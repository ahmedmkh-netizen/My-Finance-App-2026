// إنشاء قيد محاسبي
const createJournalEntry = (entries, description, date, reference = '') => {
  // التحقق من توازن القيد (المدين = الدائن)
  const totalDebit = entries.filter(e => e.type === 'debit').reduce((sum, e) => sum + e.amount, 0);
  const totalCredit = entries.filter(e => e.type === 'credit').reduce((sum, e) => sum + e.amount, 0);
  
  if (Math.abs(totalDebit - totalCredit) > 0.01) {
    throw new Error(`القيد غير متوازن! المدين: ${totalDebit}, الدائن: ${totalCredit}`);
  }
  
  return {
    id: `je_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
    date: date || new Date().toISOString().split('T')[0],
    description,
    reference,
    entries: entries.map(entry => ({
      ...entry,
      accountId: entry.accountId,
      accountName: CHART_OF_ACCOUNTS[entry.accountId]?.name || 'غير معروف'
    })),
    createdAt: new Date().toISOString(),
    totalDebit,
    totalCredit
  };
};

// تحديث حسابات الأستاذ
const updateLedgerAccounts = (currentLedger, journalEntry) => {
  const newLedger = { ...currentLedger };
  
  journalEntry.entries.forEach(entry => {
    const accountId = entry.accountId;
    if (!newLedger[accountId]) {
      newLedger[accountId] = {
        accountId,
        accountName: CHART_OF_ACCOUNTS[accountId]?.name || 'غير معروف',
        accountType: CHART_OF_ACCOUNTS[accountId]?.type,
        normalBalance: CHART_OF_ACCOUNTS[accountId]?.normalBalance,
        debitBalance: 0,
        creditBalance: 0,
        transactions: []
      };
    }
    
    // إضافة الحركة
    const transaction = {
      id: `tr_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
      date: journalEntry.date,
      description: journalEntry.description,
      journalEntryId: journalEntry.id,
      debit: entry.type === 'debit' ? entry.amount : 0,
      credit: entry.type === 'credit' ? entry.amount : 0,
      balance: 0
    };
    
    newLedger[accountId].transactions.push(transaction);
    
    // تحديث الأرصدة
    if (entry.type === 'debit') {
      newLedger[accountId].debitBalance += entry.amount;
    } else {
      newLedger[accountId].creditBalance += entry.amount;
    }
    
    // حساب الرصيد النهائي
    const account = newLedger[accountId];
    if (account.normalBalance === 'debit') {
      account.balance = account.debitBalance - account.creditBalance;
    } else {
      account.balance = account.creditBalance - account.debitBalance;
    }
  });
  
  return newLedger;
};

// حساب ميزان المراجعة
const calculateTrialBalance = (ledgerAccounts) => {
  const trialBalance = {
    assets: [],
    liabilities: [],
    equity: [],
    income: [],
    expenses: [],
    totals: {
      debit: 0,
      credit: 0,
      balance: 0
    }
  };
  
  Object.values(ledgerAccounts).forEach(account => {
    const accountData = {
      accountId: account.accountId,
      accountName: account.accountName,
      debitBalance: account.debitBalance,
      creditBalance: account.creditBalance,
      balance: account.balance
    };
    
    switch(account.accountType) {
      case ACCOUNT_TYPES.ASSET:
        trialBalance.assets.push(accountData);
        break;
      case ACCOUNT_TYPES.LIABILITY:
        trialBalance.liabilities.push(accountData);
        break;
      case ACCOUNT_TYPES.EQUITY:
        trialBalance.equity.push(accountData);
        break;
      case ACCOUNT_TYPES.INCOME:
        trialBalance.income.push(accountData);
        break;
      case ACCOUNT_TYPES.EXPENSE:
        trialBalance.expenses.push(accountData);
        break;
    }
    
    // حساب المجاميع
    trialBalance.totals.debit += account.debitBalance;
    trialBalance.totals.credit += account.creditBalance;
  });
  
  trialBalance.totals.balance = Math.abs(trialBalance.totals.debit - trialBalance.totals.credit);
  
  return trialBalance;
};

// توليد القيود المحاسبية من المعاملات المالية
const generateJournalEntriesFromTransactions = (transactions) => {
  const journalEntries = [];
  
  transactions.forEach(transaction => {
    let entries = [];
    const date = transaction.date;
    const description = transaction.description || transaction.category;
    
    if (transaction.type === 'income') {
      // قيد الإيرادات: مدين الأصول (النقد/المحفظة)، دائن الإيرادات
      const assetAccount = getAssetAccountId(transaction.method);
      if (assetAccount) {
        entries = [
          { accountId: assetAccount, type: 'debit', amount: transaction.amount },
          { accountId: getIncomeAccountId(transaction.category), type: 'credit', amount: transaction.amount }
        ];
      }
    } else if (transaction.type === 'expense') {
      // قيد المصروفات: مدين المصروفات، دائن الأصول (النقد/المحفظة)
      const assetAccount = getAssetAccountId(transaction.method);
      if (assetAccount) {
        entries = [
          { accountId: getExpenseAccountId(transaction.category), type: 'debit', amount: transaction.amount },
          { accountId: assetAccount, type: 'credit', amount: transaction.amount }
        ];
      }
    }
    
    if (entries.length > 0) {
      try {
        const journalEntry = createJournalEntry(entries, description, date, transaction.id);
        journalEntries.push(journalEntry);
      } catch (error) {
        console.error('خطأ في توليد القيد المحاسبي:', error);
      }
    }
  });
  
  return journalEntries;
};

return unsafe
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");
};

}

const normalizeText = (text) => {
if (!text) return "";
return text.toString()
.replace(/[أإآ]/g, 'ا')
.replace(/ى/g, 'ي')
.replace(/ة/g, 'ه')
.replace(/[\u064B-\u065F]/g, '')
.trim()
.toLowerCase();
};

const year = now.getFullYear();
const month = String(now.getMonth() + 1).padStart(2, '0');
const day = String(now.getDate()).padStart(2, '0');
return `${year}-${month}-${day}`;
};

const calculateDaysLeft = (targetDate) => {
if (!targetDate) return null;
try {
const today = new Date();
today.setHours(0, 0, 0, 0);
const target = new Date(targetDate);
target.setHours(0, 0, 0, 0);
const diffTime = target - today;
const days = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
return days;
} catch (error) {
console.error('Error calculating days left:', error);
return null;
}
};

  headerClass: 'bg-gradient-to-r from-yellow-50 to-yellow-100 dark:from-yellow-900/20 dark:to-yellow-900/10 text-yellow-900 dark:text-yellow-100',
  gradient: 'from-yellow-400 to-yellow-600'
},
etisalat: {

  title: 'سجل اتصالات كاش', 
  subtitle: 'تتبع الإيداع والسحب', 
  themeColor: 'text-etisalatGreen', 
  bgColor: 'bg-emerald-50/50 dark:bg-emerald-900/10', 
  icon: Signal, 
  headerClass: 'bg-gradient-to-r from-emerald-50 to-emerald-100 dark:from-emerald-900/20 dark:to-emerald-900/10 text-emerald-900 dark:text-emerald-100',
  gradient: 'from-emerald-400 to-emerald-600'
},
cib_savings: { 
  id: 'cib_savings', 
  title: 'سجل حساب توفير CIB', 
  subtitle: 'تتبع المعاملات والأرصدة الجارية', 
  themeColor: 'text-cibBlue', 
  bgColor: 'bg-blue-50/50 dark:bg-blue-900/10', 
  icon: BuildingBank, 
  headerClass: 'bg-gradient-to-r from-blue-50 to-blue-100 dark:from-blue-900/20 dark:to-blue-900/10 text-cibBlue dark:text-blue-100',
  gradient: 'from-blue-400 to-blue-600'
},
aaib_savings: { 
  id: 'aaib_savings', 
  title: 'سجل حساب توفير AAIB', 
  subtitle: 'تتبع المعاملات والأرصدة الجارية', 
  themeColor: 'text-aaibRed', 
  bgColor: 'bg-red-50/50 dark:bg-red-900/10', 
  icon: PiggyBank, 
  headerClass: 'bg-gradient-to-r from-red-50 to-red-100 dark:from-red-900/20 dark:to-red-900/10 text-aaibRed dark:text-red-100',
  gradient: 'from-red-400 to-red-600'
}

// ========== مكون السجلات المحاسبية ==========
const AccountingLedgerView = React.memo(({
  ledgerAccounts,
  journalEntries,
  trialBalance,
  onExportReport
}) => {
  const [activeTab, setActiveTab] = useState('ledger');
  const [selectedAccount, setSelectedAccount] = useState(null);
  const [dateRange, setDateRange] = useState({
    start: new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0],
    end: new Date().toISOString().split('T')[0]
  });

  // حساب إجمالي الأصول
  const totalAssets = useMemo(() => {
    return Object.values(ledgerAccounts)
      .filter(account => account.accountType === ACCOUNT_TYPES.ASSET)
      .reduce((sum, account) => sum + (account.balance || 0), 0);
  }, [ledgerAccounts]);

  // حساب إجمالي الخصوم وحقوق الملكية
  const totalLiabilitiesEquity = useMemo(() => {
    const liabilities = Object.values(ledgerAccounts)
      .filter(account => account.accountType === ACCOUNT_TYPES.LIABILITY)
      .reduce((sum, account) => sum + (account.balance || 0), 0);
    
    const equity = Object.values(ledgerAccounts)
      .filter(account => account.accountType === ACCOUNT_TYPES.EQUITY)
      .reduce((sum, account) => sum + (account.balance || 0), 0);
    
    return liabilities + equity;
  }, [ledgerAccounts]);

  // حساب صافي الدخل
  const netIncome = useMemo(() => {
    const totalIncome = Object.values(ledgerAccounts)
      .filter(account => account.accountType === ACCOUNT_TYPES.INCOME)
      .reduce((sum, account) => sum + (account.balance || 0), 0);
    
    const totalExpenses = Object.values(ledgerAccounts)
      .filter(account => account.accountType === ACCOUNT_TYPES.EXPENSE)
      .reduce((sum, account) => sum + (account.balance || 0), 0);
    
    return totalIncome - totalExpenses;
  }, [ledgerAccounts]);

  // تصدير تقرير القيود اليومية
  const exportJournalEntries = () => {
    const csvContent = [
      ['تاريخ القيد', 'رقم القيد', 'الوصف', 'الحساب المدين', 'المدين', 'الحساب الدائن', 'الدائن'],
      ...journalEntries.map(je => [
        je.date,
        je.id,
        je.description,
        je.entries.find(e => e.type === 'debit')?.accountName || '',
        je.entries.find(e => e.type === 'debit')?.amount || 0,
        je.entries.find(e => e.type === 'credit')?.accountName || '',
        je.entries.find(e => e.type === 'credit')?.amount || 0
      ])
    ].map(row => row.join(',')).join('\n');
    
    const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `journal_entries_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // تصدير ميزان المراجعة
  const exportTrialBalance = () => {
    const csvContent = [
      ['رقم الحساب', 'اسم الحساب', 'مدين', 'دائن', 'الرصيد'],
      ...Object.values(ledgerAccounts).map(account => [
        account.accountId,
        account.accountName,
        account.debitBalance,
        account.creditBalance,
        account.balance
      ])
    ].map(row => row.join(',')).join('\n');
    
    const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `trial_balance_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // عرض دفتر الأستاذ لحساب محدد
  const renderLedgerAccount = (account) => {
    const openingBalance = 0; // يمكن إضافة منطق لحساب رصيد الافتتاح
    
    return (
      <div className="ledger-account" key={account.accountId}>
        <div className="flex justify-between items-center mb-4">
          <div>
            <h4 className="font-bold text-lg">{account.accountName}</h4>
            <p className="text-sm text-slate-500">رقم الحساب: {account.accountId}</p>
          </div>
          <div className={`text-lg font-black ${account.balance >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
            {account.balance.toLocaleString()} ج.م
          </div>
        </div>
        
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="bg-slate-50 dark:bg-slate-800">
                <th className="p-2">التاريخ</th>
                <th className="p-2">الوصف</th>
                <th className="p-2 text-center">مدين</th>
                <th className="p-2 text-center">دائن</th>
                <th className="p-2 text-center">الرصيد</th>
              </tr>
            </thead>
            <tbody>
              <tr className="border-b border-slate-200">
                <td className="p-2">{dateRange.start}</td>
                <td className="p-2">رصيد افتتاحي</td>
                <td className="p-2 text-center text-emerald-600">
                  {account.normalBalance === 'debit' ? openingBalance.toLocaleString() : '-'}
                </td>
                <td className="p-2 text-center text-red-600">
                  {account.normalBalance === 'credit' ? openingBalance.toLocaleString() : '-'}
                </td>
                <td className="p-2 text-center font-bold">
                  {openingBalance.toLocaleString()}
                </td>
              </tr>
              
              {account.transactions?.map((transaction, index) => (
                <tr key={transaction.id} className="border-b border-slate-100">
                  <td className="p-2">{transaction.date}</td>
                  <td className="p-2">{transaction.description}</td>
                  <td className="p-2 text-center text-emerald-600">
                    {transaction.debit > 0 ? transaction.debit.toLocaleString() : '-'}
                  </td>
                  <td className="p-2 text-center text-red-600">
                    {transaction.credit > 0 ? transaction.credit.toLocaleString() : '-'}
                  </td>
                  <td className="p-2 text-center font-bold">
                    {(openingBalance + account.transactions
                      .slice(0, index + 1)
                      .reduce((sum, t) => sum + t.debit - t.credit, 0)).toLocaleString()}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );
  };

  return (
    <div className="space-y-6 animate-fadeIn">
      {/* شريط التحكم */}
      <div className="glass p-4 rounded-2xl flex flex-wrap gap-4 items-center">
        <div className="flex gap-2">
          <button
            type="button"
            onClick={() => setActiveTab('ledger')}
            className={`px-4 py-2 rounded-xl font-bold ${activeTab === 'ledger' ? 'gradient-bg-primary text-white' : 'bg-slate-100 dark:bg-slate-800'}`}
          >
            <BookOpen size={16} className="inline ml-2" />
            دفتر الأستاذ
          </button>
          <button
            type="button"
            onClick={() => setActiveTab('journal')}
            className={`px-4 py-2 rounded-xl font-bold ${activeTab === 'journal' ? 'gradient-bg-primary text-white' : 'bg-slate-100 dark:bg-slate-800'}`}
          >
            <Receipt size={16} className="inline ml-2" />
            القيود اليومية
          </button>
          <button
            type="button"
            onClick={() => setActiveTab('trial')}
            className={`px-4 py-2 rounded-xl font-bold ${activeTab === 'trial' ? 'gradient-bg-primary text-white' : 'bg-slate-100 dark:bg-slate-800'}`}
          >
            <Scale size={16} className="inline ml-2" />
            ميزان المراجعة
          </button>
          <button
            type="button"
            onClick={() => setActiveTab('reports')}
            className={`px-4 py-2 rounded-xl font-bold ${activeTab === 'reports' ? 'gradient-bg-primary text-white' : 'bg-slate-100 dark:bg-slate-800'}`}
          >
            <FileBarChart size={16} className="inline ml-2" />
            التقارير المالية
          </button>
        </div>
        
        <div className="flex-1"></div>
        
        <div className="flex gap-2">
          <input
            type="date"
            value={dateRange.start}
            onChange={(e) => setDateRange({...dateRange, start: e.target.value})}
            className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm"
          />
          <span className="self-center">إلى</span>
          <input
            type="date"
            value={dateRange.end}
            onChange={(e) => setDateRange({...dateRange, end: e.target.value})}
            className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm"
          />
        </div>
      </div>

      {/* بطاقات النتائج السريعة */}
      <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div className="glass p-4 rounded-2xl border-r-4 border-blue-500">
          <p className="text-sm text-slate-500 mb-2">إجمالي الأصول</p>
          <p className="text-2xl font-black text-blue-600">{totalAssets.toLocaleString()} ج.م</p>
        </div>
        <div className="glass p-4 rounded-2xl border-r-4 border-red-500">
          <p className="text-sm text-slate-500 mb-2">إجمالي الخصوم</p>
          <p className="text-2xl font-black text-red-600">
            {Object.values(ledgerAccounts)
              .filter(a => a.accountType === ACCOUNT_TYPES.LIABILITY)
              .reduce((sum, a) => sum + a.balance, 0)
              .toLocaleString()} ج.م
          </p>
        </div>
        <div className="glass p-4 rounded-2xl border-r-4 border-emerald-500">
          <p className="text-sm text-slate-500 mb-2">صافي الدخل</p>
          <p className={`text-2xl font-black ${netIncome >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
            {netIncome.toLocaleString()} ج.م
          </p>
        </div>
        <div className="glass p-4 rounded-2xl border-r-4 border-purple-500">
          <p className="text-sm text-slate-500 mb-2">توازن الميزانية</p>
          <p className={`text-2xl font-black ${Math.abs(totalAssets - totalLiabilitiesEquity) < 0.01 ? 'text-emerald-600' : 'text-red-600'}`}>
            {Math.abs(totalAssets - totalLiabilitiesEquity) < 0.01 ? 'متوازنة ✓' : 'غير متوازنة ✗'}
          </p>
        </div>
      </div>

      {/* محتوى التبويب النشط */}
      {activeTab === 'ledger' && (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <h3 className="text-lg font-bold">دفتر الأستاذ العام</h3>
            <button
              type="button"
              onClick={exportTrialBalance}
              className="gradient-bg-primary text-white px-4 py-2 rounded-xl text-sm font-bold"
            >
              <Download size={16} className="inline ml-2" />
              تصدير دفتر الأستاذ
            </button>
          </div>
          
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            {Object.values(ledgerAccounts)
              .sort((a, b) => a.accountId.localeCompare(b.accountId))
              .map(account => (
                <div key={account.accountId}>
                  {renderLedgerAccount(account)}
                </div>
              ))}
          </div>
        </div>
      )}

      {activeTab === 'journal' && (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <h3 className="text-lg font-bold">سجل القيود اليومية</h3>
            <button
              type="button"
              onClick={exportJournalEntries}
              className="gradient-bg-primary text-white px-4 py-2 rounded-xl text-sm font-bold"
            >
              <Download size={16} className="inline ml-2" />
              تصدير القيود
            </button>
          </div>
          
          <div className="space-y-4">
            {journalEntries.map(entry => (
              <div key={entry.id} className="journal-entry">
                <div className="flex justify-between items-center mb-3">
                  <div>
                    <span className="font-bold">{entry.date}</span>
                    <span className="text-sm text-slate-500 mr-3"> - {entry.description}</span>
                  </div>
                  <span className="text-sm text-slate-500">رقم القيد: {entry.id.substring(0, 8)}</span>
                </div>
                
                <div className="accounting-grid">
                  <div className="debit-column">
                    <div className="font-bold mb-2">مدين</div>
                    {entry.entries
                      .filter(e => e.type === 'debit')
                      .map(e => (
                        <div key={e.accountId} className="flex justify-between mb-1">
                          <span>{e.accountName}</span>
                          <span className="font-bold">{e.amount.toLocaleString()} ج.م</span>
                        </div>
                      ))}
                  </div>
                  
                  <div className="credit-column">
                    <div className="font-bold mb-2">دائن</div>
                    {entry.entries
                      .filter(e => e.type === 'credit')
                      .map(e => (
                        <div key={e.accountId} className="flex justify-between mb-1">
                          <span>{e.accountName}</span>
                          <span className="font-bold">{e.amount.toLocaleString()} ج.م</span>
                        </div>
                      ))}
                  </div>
                </div>
                
                <div className="flex justify-between mt-3 pt-3 border-t border-slate-200">
                  <span className="font-bold text-emerald-600">
                    إجمالي المدين: {entry.totalDebit.toLocaleString()} ج.م
                  </span>
                  <span className="font-bold text-red-600">
                    إجمالي الدائن: {entry.totalCredit.toLocaleString()} ج.م
                  </span>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {activeTab === 'trial' && (
        <div className="space-y-4">
          <h3 className="text-lg font-bold">ميزان المراجعة</h3>
          
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="bg-slate-50 dark:bg-slate-800">
                  <th className="p-3">رقم الحساب</th>
                  <th className="p-3">اسم الحساب</th>
                  <th className="p-3 text-center">مدين</th>
                  <th className="p-3 text-center">دائن</th>
                  <th className="p-3 text-center">الرصيد</th>
                  <th className="p-3">نوع الحساب</th>
                </tr>
              </thead>
              <tbody>
                {Object.values(ledgerAccounts)
                  .sort((a, b) => a.accountId.localeCompare(b.accountId))
                  .map(account => (
                    <tr key={account.accountId} className="border-b border-slate-100">
                      <td className="p-3 font-mono">{account.accountId}</td>
                      <td className="p-3">{account.accountName}</td>
                      <td className="p-3 text-center text-emerald-600">
                        {account.debitBalance > 0 ? account.debitBalance.toLocaleString() : '-'}
                      </td>
                      <td className="p-3 text-center text-red-600">
                        {account.creditBalance > 0 ? account.creditBalance.toLocaleString() : '-'}
                      </td>
                      <td className="p-3 text-center font-bold">
                        {account.balance.toLocaleString()}
                      </td>
                      <td className="p-3">
                        <span className={`px-2 py-1 rounded text-xs ${
                          account.accountType === ACCOUNT_TYPES.ASSET ? 'bg-blue-100 text-blue-800' :
                          account.accountType === ACCOUNT_TYPES.LIABILITY ? 'bg-red-100 text-red-800' :
                          account.accountType === ACCOUNT_TYPES.EQUITY ? 'bg-purple-100 text-purple-800' :
                          account.accountType === ACCOUNT_TYPES.INCOME ? 'bg-emerald-100 text-emerald-800' :
                          'bg-amber-100 text-amber-800'
                        }`}>
                          {account.accountType}
                        </span>
                      </td>
                    </tr>
                  ))}
              </tbody>
              <tfoot className="bg-slate-50 dark:bg-slate-800 font-bold">
                <tr>
                  <td colSpan="2" className="p-3">المجموع</td>
                  <td className="p-3 text-center text-emerald-600">
                    {Object.values(ledgerAccounts).reduce((sum, a) => sum + a.debitBalance, 0).toLocaleString()}
                  </td>
                  <td className="p-3 text-center text-red-600">
                    {Object.values(ledgerAccounts).reduce((sum, a) => sum + a.creditBalance, 0).toLocaleString()}
                  </td>
                  <td colSpan="2" className="p-3 text-center">
                    {Math.abs(
                      Object.values(ledgerAccounts).reduce((sum, a) => sum + a.debitBalance, 0) -
                      Object.values(ledgerAccounts).reduce((sum, a) => sum + a.creditBalance, 0)
                    ).toLocaleString()} ج.م
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      )}

      {activeTab === 'reports' && (
        <div className="space-y-6">
          <h3 className="text-lg font-bold">التقارير المالية</h3>
          
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* قائمة الدخل */}
            <div className="glass p-6 rounded-2xl">
              <h4 className="font-bold text-lg mb-4 flex items-center gap-2">
                <Profit size={20} className="text-emerald-600" />
                قائمة الدخل
              </h4>
              
              <div className="space-y-4">
                <div>
                  <h5 className="font-bold text-emerald-700 mb-2">الإيرادات</h5>
                  {Object.values(ledgerAccounts)
                    .filter(a => a.accountType === ACCOUNT_TYPES.INCOME && a.balance > 0)
                    .map(account => (
                      <div key={account.accountId} className="flex justify-between mb-1">
                        <span>{account.accountName}</span>
                        <span className="font-bold text-emerald-600">{account.balance.toLocaleString()} ج.م</span>
                      </div>
                    ))}
                  <div className="border-t border-emerald-200 pt-2 mt-2">
                    <div className="flex justify-between font-bold">
                      <span>إجمالي الإيرادات</span>
                      <span className="text-emerald-600">
                        {Object.values(ledgerAccounts)
                          .filter(a => a.accountType === ACCOUNT_TYPES.INCOME)
                          .reduce((sum, a) => sum + a.balance, 0)
                          .toLocaleString()} ج.م
                      </span>
                    </div>
                  </div>
                </div>
                
                <div>
                  <h5 className="font-bold text-red-700 mb-2">المصروفات</h5>
                  {Object.values(ledgerAccounts)
                    .filter(a => a.accountType === ACCOUNT_TYPES.EXPENSE && a.balance > 0)
                    .map(account => (
                      <div key={account.accountId} className="flex justify-between mb-1">
                        <span>{account.accountName}</span>
                        <span className="font-bold text-red-600">{account.balance.toLocaleString()} ج.م</span>
                      </div>
                    ))}
                  <div className="border-t border-red-200 pt-2 mt-2">
                    <div className="flex justify-between font-bold">
                      <span>إجمالي المصروفات</span>
                      <span className="text-red-600">
                        {Object.values(ledgerAccounts)
                          .filter(a => a.accountType === ACCOUNT_TYPES.EXPENSE)
                          .reduce((sum, a) => sum + a.balance, 0)
                          .toLocaleString()} ج.م
                      </span>
                    </div>
                  </div>
                </div>
                
                <div className="border-t-2 border-slate-300 pt-4">
                  <div className={`flex justify-between text-lg font-black ${netIncome >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                    <span>صافي الدخل (الخسارة)</span>
                    <span>{netIncome.toLocaleString()} ج.م</span>
                  </div>
                </div>
              </div>
            </div>
            
            {/* الميزانية العمومية */}
            <div className="glass p-6 rounded-2xl">
              <h4 className="font-bold text-lg mb-4 flex items-center gap-2">
                <Scale size={20} className="text-blue-600" />
                الميزانية العمومية
              </h4>
              
              <div className="space-y-4">
                <div>
                  <h5 className="font-bold text-blue-700 mb-2">الأصول</h5>
                  {Object.values(ledgerAccounts)
                    .filter(a => a.accountType === ACCOUNT_TYPES.ASSET && a.balance > 0)
                    .map(account => (
                      <div key={account.accountId} className="flex justify-between mb-1">
                        <span>{account.accountName}</span>
                        <span className="font-bold text-blue-600">{account.balance.toLocaleString()} ج.م</span>
                      </div>
                    ))}
                  <div className="border-t border-blue-200 pt-2 mt-2">
                    <div className="flex justify-between font-bold">
                      <span>إجمالي الأصول</span>
                      <span className="text-blue-600">{totalAssets.toLocaleString()} ج.م</span>
                    </div>
                  </div>
                </div>
                
                <div>
                  <h5 className="font-bold text-red-700 mb-2">الخصوم</h5>
                  {Object.values(ledgerAccounts)
                    .filter(a => a.accountType === ACCOUNT_TYPES.LIABILITY && a.balance > 0)
                    .map(account => (
                      <div key={account.accountId} className="flex justify-between mb-1">
                        <span>{account.accountName}</span>
                        <span className="font-bold text-red-600">{account.balance.toLocaleString()} ج.م</span>
                      </div>
                    ))}
                </div>
                
                <div>
                  <h5 className="font-bold text-purple-700 mb-2">حقوق الملكية</h5>
                  {Object.values(ledgerAccounts)

},

  financialStatements: JSON.parse(localStorage.getItem('financialStatements') || '{}')
}
};

// تحديث reducer لإضافة حالة محاسبية
function dataReducer(state, action) {
switch (action.type) {
// ... [جميع حالات الـ reducer السابقة] ...

case 'UPDATE_ACCOUNTING_DATA':
return { 
  ...state, 
  accountingData: {
    ...state.accountingData,
    ...action.payload
  } 
};

case 'ADD_JOURNAL_ENTRY':
const newJournalEntries = [...state.accountingData.journalEntries, action.payload];
const updatedLedger = updateLedgerAccounts(state.accountingData.ledgerAccounts, action.payload);
const updatedTrialBalance = calculateTrialBalance(updatedLedger);
return {
  ...state,
  accountingData: {
    ...state.accountingData,
    journalEntries: newJournalEntries,
    ledgerAccounts: updatedLedger,
    trialBalance: updatedTrialBalance
  }
};

case 'RECALCULATE_ACCOUNTING':
const journalEntries = generateJournalEntriesFromTransactions(state.data.transactions);
let ledgerAccounts = {};
journalEntries.forEach(je => {
  ledgerAccounts = updateLedgerAccounts(ledgerAccounts, je);
});
const trialBalance = calculateTrialBalance(ledgerAccounts);
return {
  ...state,
  accountingData: {
    journalEntries,
    ledgerAccounts,
    trialBalance,
    financialStatements: {}
  }
};

default: 
  return state;
}
}

// تحديث App component لإضافة المكون المحاسبي
function App() {
// ... [الكود السابق] ...

// تأثير لتوليد السجلات المحاسبية عند تحميل المعاملات
useEffect(() => {
  if (transactions.length > 0 && state.accountingData.journalEntries.length === 0) {
    dispatch({ type: 'RECALCULATE_ACCOUNTING' });
  }
}, [transactions]);

// تحديث saveHistory ليشمل البيانات المحاسبية
const saveHistory = useCallback(() => { 
  dispatch({ type: 'ADD_TO_HISTORY', payload: JSON.parse(JSON.stringify(data)) }); 
}, [data]);

// تحديث handleSaveTransaction لتشمل إضافة قيد محاسبي
const handleSaveTransaction = useCallback((e) => {
  e.preventDefault();

  if (isProcessing) {
    addNotification({
      type: 'warning',
      title: 'جاري المعالجة',
      message: 'يرجى الانتظار حتى تنتهي العملية الحالية'
    });
    return;
  }

  dispatch({ type: 'SET_IS_PROCESSING', payload: true });

  if (!formData.amount || Number(formData.amount) <= 0) {
    addNotification({
      type: 'error',
      title: 'خطأ في المدخلات',
      message: 'يرجى إدخال مبلغ صحيح أكبر من صفر'
    });
    dispatch({ type: 'SET_IS_PROCESSING', payload: false });
    return;
  }

  if (data.closedMonths?.includes(formData.month)) {
    addNotification({ 
      type: 'error', 
      title: 'تنبيه', 
      message: `شهر ${formData.month} مغلق، لا يمكن إضافة أو تعديل عمليات فيه.` 
    });
    dispatch({ type: 'SET_IS_PROCESSING', payload: false });
    return;
  }

  setTimeout(() => {
    try {
      saveHistory();
      
      let finalSubType = formData.subType;
      if (['شحن رصيد فوري', 'شحن رصيد', 'إيداع', 'شحن محفظة'].includes(formData.category) &&
          ['fawry', 'etisalat', 'cib_savings', 'aaib_savings'].includes(formData.method)) {
        finalSubType = 'deposit';
      } else {
        finalSubType = formData.subType || (formData.type === 'income' ? 'deposit' : 'withdrawal');
      }

      const amount = Number(formData.amount);
      
      // التحقق من الرصيد
      const immediateAccounts = ['cash', 'fawry', 'etisalat', 'cib_savings', 'aaib_savings'];
      
      if (immediateAccounts.includes(formData.method) && formData.type === 'expense') {
        let availableBalance = 0;
        
        switch(formData.method) {
          case 'cash':
            availableBalance = financeSnapshot.actualCashInHand;
            break;
          case 'fawry':
            availableBalance = currentFawryBalance;
            break;
          case 'etisalat':
            availableBalance = currentEtisalatBalance;
            break;
          case 'cib_savings':
            const cibLedger = getSavingsLedger('cib_savings');
            availableBalance = cibLedger.length > 0 ? cibLedger[0].runningBalance : 0;
            break;
          case 'aaib_savings':
            const aaibLedger = getSavingsLedger('aaib_savings');
            availableBalance = aaibLedger.length > 0 ? aaibLedger[0].runningBalance : 0;
            break;
        }
        
        if (amount > availableBalance) {
          dispatch({
            type: 'SHOW_CONFIRM',
            title: 'رصيد غير كافٍ',
            message: `الرصيد المتاح في ${PAYMENT_METHODS.find(p => p.id === formData.method)?.label} هو ${availableBalance.toLocaleString()} ج.م. هل تريد الاستمرار وتسجيل هذا كمديونية؟`,
            onConfirm: () => {
              finalizeTransaction(finalSubType, true);
            },
            onCancel: () => {
              dispatch({ type: 'SET_IS_PROCESSING', payload: false });
            }
          });
          return;
        }
      }
      
      finalizeTransaction(finalSubType, false);
    } catch (error) {
      console.error('Error saving transaction:', error);
      addNotification({ 
        type: 'error', 
        title: 'خطأ في الحفظ', 
        message: 'حدث خطأ أثناء حفظ العملية' 
      });
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
    }
  }, 300);

  const finalizeTransaction = (finalSubType, isOverdraft) => {
    const selectedDay = formData.date.split('-')[2] || '01';

    const processTransaction = (m, idOverride) => {
      const targetMonthIdx = String(getMonthIndex(m) + 1).padStart(2, '0');
      const adjustedDate = `${CURRENT_YEAR}-${targetMonthIdx}-${selectedDay}`;

      return {
        ...formData,
        id: idOverride || getSafeId(),
        amount: Number(formData.amount),
        month: m,
        monthIndex: getMonthIndex(m),
        date: adjustedDate,
        subType: finalSubType,
        isOverdraft: isOverdraft
      };
    };

    let newTransactions = [...transactions];
    if (formMode === 'add') {
      const newTransaction = processTransaction(selectedMonth);
      newTransactions.push(newTransaction);
      
      // إنشاء قيد محاسبي
      try {
        let journalEntry;
        if (formData.type === 'income') {
          const assetAccount = getAssetAccountId(formData.method);
          const incomeAccount = getIncomeAccountId(formData.category);
          journalEntry = createJournalEntry(
            [
              { accountId: assetAccount, type: 'debit', amount: Number(formData.amount) },
              { accountId: incomeAccount, type: 'credit', amount: Number(formData.amount) }
            ],
            formData.description || formData.category,
            formData.date,
            newTransaction.id
          );
        } else {
          const assetAccount = getAssetAccountId(formData.method);
          const expenseAccount = getExpenseAccountId(formData.category);
          journalEntry = createJournalEntry(
            [
              { accountId: expenseAccount, type: 'debit', amount: Number(formData.amount) },
              { accountId: assetAccount, type: 'credit', amount: Number(formData.amount) }
            ],
            formData.description || formData.category,
            formData.date,
            newTransaction.id
          );
        }
        
        dispatch({ type: 'ADD_JOURNAL_ENTRY', payload: journalEntry });
      } catch (error) {
        console.error('Error creating journal entry:', error);
      }
      
      if (repeatMonths && repeatMonths.length > 0) {
        repeatMonths.forEach(m => { 
          newTransactions.push(processTransaction(m)); 
        });
      }
    } else {
      newTransactions = newTransactions.map(t => 
        t.id === formData.id ? processTransaction(formData.month, formData.id) : t
      );
    }

    // تحديث تاريخ القرض إذا كان سداداً
    if (formMode === 'add' && formData.linkedLoanId && 
        formData.category === 'الالتزامات البنكية والتمويلية' && 
        formData.status === 'paid') {
      const targetLoan = loans.find(l => l.id === formData.linkedLoanId);
      if (targetLoan && targetLoan.nextPaymentDate) {
        const oldDate = new Date(targetLoan.nextPaymentDate);
        const newDateObj = new Date(oldDate.setMonth(oldDate.getMonth() + 1));
        const newDateStr = newDateObj.toISOString().split('T')[0];
        dispatch({ 
          type: 'UPDATE_LOAN_DUE_DATE', 
          payload: { loanId: targetLoan.id, newDate: newDateStr } 
        });
      }
    }

    newTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTransactions });
    dispatch({ type: 'SET_FORM_OPEN', payload: false });
    dispatch({ type: 'SET_REPEAT_MONTHS', payload: [] });
    
    addNotification({ 
      type: 'success', 
      title: formMode === 'add' ? 'تمت الإضافة بنجاح' : 'تم التعديل بنجاح',
      message: `تم ${formData.type === 'income' ? 'إضافة دخل' : 'خصم مصروف'} بقيمة ${formData.amount} ج.م`,
      persistent: true,
      duration: 3000
    });
    
    dispatch({ type: 'SET_IS_PROCESSING', payload: false });
  };
}, [formData, formMode, selectedMonth, repeatMonths, transactions, saveHistory, addNotification, currentFawryBalance, currentEtisalatBalance, loans, dispatch, data.closedMonths, financeSnapshot, getSavingsLedger, isProcessing]);

          onClick={() => {
            dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
            dispatch({ type: 'SET_FORM_DATA', payload: { type: 'income', amount: '', date: getLocalISODate(), month: selectedMonth, method: 'cash', subType: 'deposit', category: '' } });
            dispatch({ type: 'SET_FORM_OPEN', payload: true });
          }}
          className="w-full flex items-center gap-2 px-3 py-2 rounded-lg bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 hover:bg-emerald-100 transition-colors text-sm font-medium"
        >
          <Plus size={16} /> تسجيل دخل جديد
        </button>
        <button 
          type="button"
          onClick={() => {
            dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
            dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', amount: '', date: getLocalISODate(), month: selectedMonth, method: 'cash', subType: 'withdrawal', category: '' } });
            dispatch({ type: 'SET_FORM_OPEN', payload: true });
          }}
          className="w-full flex items-center gap-2 px-3 py-2 rounded-lg bg-red-50 dark:bg-red-900/20 text-red-600 hover:bg-red-100 transition-colors text-sm font-medium"
        >
          <Plus size={16} /> تسجيل مصروف جديد
        </button>
        <button 
          type="button"
          onClick={() => {
            dispatch({ type: 'RECALCULATE_ACCOUNTING' });
            addNotification({
              type: 'info',
              title: 'جاري المعالجة',
              message: 'جاري إعادة حساب السجلات المحاسبية...'
            });
          }}
          className="w-full flex items-center gap-2 px-3 py-2 rounded-lg bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 hover:bg-indigo-100 transition-colors text-sm font-medium"
        >
          <RefreshCw size={16} /> إعادة حساب المحاسبة
        </button>
      </div>
    </div>
  </aside>
);

// ... [بقية الكود يبقى كما هو] ...

// إضافة تبويب المحاسبة في شريط التنقل السفلي
const bottomNavItems = [
  { id: 'dashboard', label: 'الرئيسية', icon: LayoutDashboard },
  { id: 'transactions', label: 'المعاملات', icon: ArrowUpRight },
  { id: 'cards', label: 'المحافظ', icon: CreditCard },
  { id: 'loans', label: 'القروض', icon: Banknote },
  { id: 'accounting', label: 'المحاسبة', icon: BookOpen },
  { id: 'planner', label: 'المخطط', icon: CalendarDays },
  { id: 'calendar', label: 'الأجندة', icon: CalendarDays },
  { id: 'duplicates', label: 'المكررات', icon: Filter },
  { id: 'categories', label: 'الفئات', icon: Layers }
];

// ... [بقية الكود] ...

return (
  <div className="flex h-screen overflow-hidden text-slate-800 dark:text-slate-100 font-sans">
    {/* ... [المكونات الأخرى] ... */}
    
    <main ref={mainContentRef} className="flex-1 overflow-y-auto p-4 lg:p-8 relative scroll-smooth pt-12">
      {isLocked ? (
        <div className="lock-screen backdrop-blur-3xl animate-fadeIn no-print">
          <Lock size={80} className="mb-8 text-blue-500 animate-bounce-slight" />
          <h2 className="text-4xl font-black mb-8 tracking-tight">التطبيق مقفل</h2>
          <button 
            type="button" 
            onClick={() => dispatch({ type: 'SET_IS_LOCKED', payload: false })}
            className="gradient-bg-primary text-white px-16 py-5 rounded-full font-bold shadow-2xl flex items-center gap-3 transition-all hover:scale-105 active:scale-95"
          >
            <Unlock size={24} /> فتح التطبيق
          </button>
        </div>
      ) : (
        <div className="max-w-7xl mx-auto space-y-8 animate-fadeIn pb-24">
          <ProfessionalHeader />
          {renderActiveView()}
        </div>
      )}
    </main>
    
    {/* ... [بقية المكونات] ... */}
  </div>
);
}

// ... [بقية الكود] ...

const rootElement = document.getElementById('root');
if(rootElement) {
setTimeout(() => {
  const loadingElement = document.getElementById('loading');
  if (loadingElement) {
    loadingElement.style.display = 'none';
  }
}, 2000);

createRoot(rootElement).render(
<ErrorBoundary>
<App />
</ErrorBoundary>
);
}
</script>
</body>
</html>
