.toast-container {

.toast-error { background: linear-gradient(135deg,#B91C1C 0%,#DC2626 100%); }
.toast-warning { background: linear-gradient(135deg,#D97706 0%,#F59E0B 100%); }

.bank-card {

  justify-content: space-between;

  transition: all .45s var(--ease);
  cursor: pointer;
}
.bank-card::before {

}
.bank-card-chip {

}
.bank-card-silver { background: linear-gradient(135deg,#E8ECF2 0%,#B8C2D3 50%,#8B96AB 100%); color: #1E2B4A; }
.bank-card-black { background: linear-gradient(135deg,#0A1628 0%,#1E2B4A 60%,#000000 100%); color: #F8FAFC; }
.bank-card-gold { background: linear-gradient(135deg,#F2D57E 0%,#D4AF37 50%,#A67C00 100%); color: #3B2A00; }
.bank-card-blue { background: linear-gradient(135deg,#6B8FDC 0%,#3B6FD4 50%,#1E40AF 100%); color: #FFFFFF; }
.bank-card-accent { background: linear-gradient(135deg,#8B84FF 0%,#635BFF 50%,#4A42E5 100%); color: #FFFFFF; }

.tx-item {

}
.tx-item:hover {

}
.tx-icon {

}

.month-tab {

}

.sub-tab-switcher {

}
.sub-tab-btn {

}

}

.day-header {

}

.card-sub-badge {

  color: var(--accent);

}
.quick-chip {
  display: inline-flex; align-items: center;
  padding: 6px 12px;
  border-radius: var(--r-full);
  font-size: 11px; font-weight: 700;
  background: var(--bg-muted);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  cursor: pointer;

  font-family: inherit;
}
.quick-chip:hover {

}
.quick-chip:active { transform: scale(.95); }

.skeleton {
  background: linear-gradient(90deg,var(--bg-muted) 25%,var(--bg-card-alt) 50%,var(--bg-muted) 75%);

  border-radius: var(--r-md);
}

.audit-item {

}
.audit-dot {

  flex-shrink: 0;

}

.tx-time-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-size: 9px; font-weight: 800;
  background: var(--bg-muted);
  color: var(--text-muted);

}

.form-section {

  border-radius: var(--r-lg);

}
.form-section-title {

  margin-bottom: 10px;

}

.force-save-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px;
  border-radius: var(--r-md);
  font-size: 11px; font-weight: 800;
  background: var(--accent);
  color: white;
  border: none; cursor: pointer;
  transition: all .18s ease;
  box-shadow: var(--shadow-glow);
}
.force-save-btn:hover:not(:disabled) { background: var(--accent-dark); transform: translateY(-1px); }
.force-save-btn:disabled { opacity: .6; cursor: wait; }
.force-save-btn.saving { background: var(--warning); }
.force-save-btn.success { background: var(--success); }
.force-save-btn.error { background: var(--danger); }

.liquidity-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .liquidity-hero { grid-template-columns: 1fr; gap: 8px; } }

.analytics-toggle {
  display: flex; gap: 6px;
  padding: 4px;
  background: var(--bg-muted);
  border-radius: var(--r-lg);
}
.analytics-toggle button {
  flex: 1;
  padding: 8px 12px;
  border-radius: var(--r-md);
  font-size: 11px; font-weight: 800;
  border: none; cursor: pointer;
  background: transparent;
  color: var(--text-muted);
  transition: all .22s;
}
.analytics-toggle button.active {
  background: var(--bg-card);
  color: var(--accent);
  box-shadow: var(--shadow-1);
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes popIn { 0% { opacity: 0; transform: scale(.9); } 100% { opacity: 1; transform: scale(1); } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes pulse-slow { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
@keyframes scaleIn { 0% { opacity: 0; transform: scale(.95); } 100% { opacity: 1; transform: scale(1); } }

.animate-fadeIn { animation: fadeIn .3s ease-out; }
.animate-slideInBottom { animation: slideUp .35s var(--ease); }
.animate-slideDown { animation: slideDown .3s ease-out; }
.animate-scaleIn { animation: scaleIn .28s var(--ease-snap); }
.animate-shake { animation: shake .45s ease-in-out; }

.light-glow-emerald { box-shadow: 0 0 10px 2px rgba(0,168,107,.7),0 0 3px 1px rgba(0,168,107,1); }
.light-glow-amber { box-shadow: 0 0 10px 2px rgba(245,158,11,.7),0 0 3px 1px rgba(245,158,11,1); }
.light-glow-red { box-shadow: 0 0 10px 2px rgba(220,38,38,.7),0 0 3px 1px rgba(220,38,38,1); }

.text-gradient {
  background: linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

@media print {

    margin: 12mm 10mm;
  }
  body {
    background: white !important;
    padding: 0 !important;
    color: #000 !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  .no-print,
  .sidebar,
  .sidebar-overlay,
  .bottom-nav-container,
  .status-bar,
  .force-save-btn,
  .toast-container,
  .processing-overlay,
  .modal-backdrop {
    display: none !important;
  }
  .card {
    box-shadow: none !important;
    border: 1px solid #E2E8F0 !important;
    page-break-inside: avoid;

}

/* ═══════════════ NUMERIC ENGINE ═══════════════ */
const toPiasters = (v) => {
  const n = Number(v);
  if (!isFinite(n) || isNaN(n)) return 0;
  return Math.round(n * 100);
};
const fromPiasters = (p) => (p || 0) / 100;
const roundMoney = (v) => { const n = Number(v); if (!isFinite(n)) return 0; return Math.round(n * 100) / 100; };
const safeNumber = (v, f = 0) => { const n = Number(v); return isNaN(n) || !isFinite(n) ? f : n; };
const fmt = (n) => safeNumber(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtInt = (n) => Math.round(safeNumber(n)).toLocaleString('en-US');
const fmtShort = (n) => {
  const v = Math.abs(safeNumber(n));
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toFixed(0);
};

/* ═══════════════ SAFE UTILS ═══════════════ */
const safeParseJson = (raw, fallback) => {
  if (raw === null || raw === undefined) return fallback;
  try { const v = JSON.parse(raw); return v === null || v === undefined ? fallback : v; }
  catch (e) { return fallback; }
};

const escapeHtml = (u) => {
  if (typeof u !== 'string') return u;
  return u.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
};

const normalizeText = (t) => !t ? "" : t.toString()
  .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
  .replace(/[\u064B-\u065F]/g,'').replace(/\s+/g,' ')

const toEnglishDigits = (s) => {
  if (s === null || s === undefined) return s;
  const map = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9', '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9' };
  return String(s).replace(/[٠-٩۰-۹]/g, d => map[d]);
};

const parseNumberInput = (v) => {
  const cleaned = toEnglishDigits(v).replace(/[^\d.\-]/g, '');
  const n = Number(cleaned);

};

const getLocalISODate = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const dayStart = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const endOfToday = () => { const x = new Date(); x.setHours(23,59,59,999); return x; };

const calculateDaysLeft = (d) => {
  if (!d) return null;
  try {
    const t = new Date(); t.setHours(0,0,0,0);
    const g = new Date(d); g.setHours(0,0,0,0);
    return Math.ceil((g-t)/86400000);
  } catch { return null; }
};

const parseISODate = (iso) => {
  if (!iso) return null;
  if (iso instanceof Date) return isNaN(iso) ? null : iso;
  const s = String(iso).trim();
  if (!s) return null;
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if (m) {
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d) ? null : d;
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
};

const getTxTimestamp = (t) => {
  if (!t) return 0;
  if (t.createdAt) { const ts = new Date(t.createdAt).getTime(); if (!isNaN(ts)) return ts; }
  const d = parseISODate(t.date);
  return d ? d.getTime() : 0;
};

const formatTxTime = (createdAt) => {
  if (!createdAt) return '';
  try { const d = new Date(createdAt); if (isNaN(d)) return ''; return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }); }
  catch { return ''; }
};

const compareTransactions = (a, b) => {
  const dA = parseISODate(a?.date)?.getTime() ?? 0;
  const dB = parseISODate(b?.date)?.getTime() ?? 0;
  if (dA !== dB) return dB - dA;
  const cA = getTxTimestamp(a);
  const cB = getTxTimestamp(b);
  if (cA !== cB) return cB - cA;
  return String(b?.id || '').localeCompare(String(a?.id || ''));
};

const sortTransactions = (txs) => {
  if (!Array.isArray(txs)) return [];
  return [...txs].sort(compareTransactions);
};

const makeMonthKey = (year, month) => `${year}-${month}`;
const parseMonthKey = (key) => {
  if (!key || typeof key !== 'string' || !key.includes('-')) return null;
  const [y, ...rest] = key.split('-');
  const year = Number(y);
  if (isNaN(year)) return null;
  return { year, month: rest.join('-') };
};
const keyToInputMonth = (k) => {
  if (!k || typeof k !== 'string') return '';
  const idx = k.indexOf('-');
  if (idx < 0) return '';
  const y = k.slice(0, idx);
  const mName = k.slice(idx + 1);
  const mIdx = ALL_MONTHS.indexOf(mName);
  if (mIdx < 0 || !/^\d{4}$/.test(y)) return '';
  return `${y}-${String(mIdx + 1).padStart(2, '0')}`;
};
const addMonthsToYM = (year, month, offset) => {
  let idx = getMonthIndex(month) + offset;
  let y = year;
  while (idx > 11) { idx -= 12; y++; }
  while (idx < 0) { idx += 12; y--; }
  return { year: y, month: ALL_MONTHS[idx] };
};

const getDefaultMonthYear = () => {
  const now = new Date();
  const y = now.getFullYear();
  const m = ALL_MONTHS[now.getMonth()];
  if (YEARS_CONFIG[y] && YEARS_CONFIG[y].includes(m)) return { year: y, month: m };
  return { year: PROJECT_START_YEAR, month: PROJECT_START_MONTH };
};

/* ═══════════════ SMS PARSER ═══════════════ */
const parseBankSms = (rawInput) => {
  const result = {
    ok: false, bank: '', bankId: null, last4: null, amount: 0, type: 'expense',
    subType: 'withdrawal', date: getLocalISODate(), method: null, linkedCardId: null,
    accountKind: null, cardLabel: '', description: '', balance: null,
    rawText: String(rawInput || ''), notes: []
  };
  if (!rawInput || typeof rawInput !== 'string' || rawInput.trim().length < 5) {
    result.notes.push('النص قصير جداً'); return result;
  }
  const text = toEnglishDigits(rawInput).replace(/\u00A0/g, ' ');

  if (/\b(OTP|one[\s-]?time|verification\s+code|رمز\s+(التحقق|التأكيد)|do\s+not\s+share)\b/i.test(text)) {
    result.notes.push('❌ هذه رسالة تحقق (OTP) — لا يمكن تسجيلها كمعاملة'); return result;
  }
  if (/\bCIB\b|Commercial International|SWYPE|Titanium|سي آي بي/i.test(text)) { result.bank = 'CIB'; result.bankId = 'cib'; }
  else if (/\bAAIB\b|Arab African|العربي الأفريقي|العربي الافريقي|الإفريقي الدولي/i.test(text)) { result.bank = 'AAIB'; result.bankId = 'aaib'; }

  const last4Patterns = [
    /\b(?:ending|ends)\s*(?:with\s*)?(\d{4})\b/i,
    /\bcard\s*(?:no\.?|number|#)?\s*[:\-]?\s*(?:\*{2,}|\.{2,}|x{2,})?\s*(\d{4})\b/i,
    /(?:\*{2,}|\.{2,}|x{2,})\s*(\d{4})\b/i,
  ];
  for (const p of last4Patterns) { const m = text.match(p); if (m) { result.last4 = m[1]; break; } }

  const incomeHints = [/\bcredit(?:ed)?\b/i,/\bdeposit(?:ed)?\b/i,/\breceived\b/i,/\bsalary\b/i,/\brefund\b/i,/\bcashback\b/i,/إيداع/,/راتب/,/استرداد/,/وارد/];
  const expenseHints = [/\bdebit(?:ed)?\b/i,/\bpurchase\b/i,/\bwithdraw(?:al|n)?\b/i,/\bpaid\b/i,/\bpayment\b/i,/\bcharge[d]?\b/i,/خصم/,/سحب/,/شراء/,/دفع/,/مدفوع/];

  const isIncome = incomeHints.some(r => r.test(text));
  const isExpense = expenseHints.some(r => r.test(text));

  if (isIncome && !isExpense) { result.type = 'income'; result.subType = 'deposit'; }
  else if (isExpense && !isIncome) { result.type = 'expense'; result.subType = 'withdrawal'; }

  const cur = '(?:EGP|LE|E£|ج\\.?م|جنيه|جم|ق\\.?م)';
  const amtPatterns = [
    new RegExp(`${cur}\\s*([0-9][0-9,]*\\.?[0-9]*)`, 'i'),
    new RegExp(`([0-9][0-9,]*\\.?[0-9]*)\\s*${cur}`, 'i'),
  ];
  for (const p of amtPatterns) {
    const m = text.match(p);
    if (m) { const n = Number(m[1].replace(/,/g, '')); if (n >= 1 && n < 100000000) { result.amount = n; break; } }
  }
  const balMatch = text.match(/(?:balance|الرصيد|رصيد)[^\d]{0,20}([0-9][0-9,]*\.?[0-9]*)/i);
  if (balMatch) { const b = Number(balMatch[1].replace(/,/g, '')); if (b > 0 && b !== result.amount) result.balance = b; }

  result.ok = result.amount > 0;
  if (!result.ok) result.notes.push('لم يتم العثور على مبلغ صالح — أدخله يدوياً');
  if (!result.description) result.description = result.type === 'income' ? 'دخل من SMS' : 'مصروف من SMS';
  return result;
};

/* ═══════════════ VALIDATION ═══════════════ */
const VALIDATION = {
  AMOUNT: { min: 0.01, max: 10000000, label: 'المبلغ' },
  TEXT: { min: 1, max: 500, label: 'النص' },
};

const validateAmount = (raw, opts = {}) => {
  const cfg = { ...VALIDATION.AMOUNT, ...opts };
  const cleaned = toEnglishDigits(String(raw ?? '')).replace(/[^\d.\-]/g, '');
  const n = parseFloat(cleaned);
  if (isNaN(n) || !isFinite(n)) return { valid: false, error: 'اكتب رقم صحيح', value: 0 };
  if (n < cfg.min) return { valid: false, error: `الحد الأدنى ${fmt(cfg.min)} ج.م`, value: 0 };
  if (n > cfg.max) return { valid: false, error: `الحد الأقصى ${fmt(cfg.max)} ج.م`, value: 0 };
  return { valid: true, value: n };
};

const validateText = (raw, opts = {}) => {
  const cfg = { ...VALIDATION.TEXT, ...opts };
  const s = String(raw || '').trim();
  if (s.length < cfg.min) return { valid: false, error: `${cfg.label} مطلوب` };
  if (s.length > cfg.max) return { valid: false, error: `${cfg.label} طويل جداً` };
  return { valid: true, value: s };
};

const validateDate = (raw) => {
  if (!raw) return { valid: false, error: 'التاريخ مطلوب' };
  const d = parseISODate(raw);
  if (!d) return { valid: false, error: 'تاريخ غير صالح' };
  const year = d.getFullYear();
  if (year < 2020 || year > 2100) return { valid: false, error: 'السنة خارج النطاق' };
  return { valid: true, value: d };
};

/* ═══════════════ PIN (PBKDF2) ═══════════════ */
const hashPin = async (pin) => {
  if (!crypto?.subtle?.importKey || !crypto?.subtle?.deriveBits) throw new Error('هذا المتصفح لا يدعم التشفير الآمن');
  try {
    const encoder = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', encoder.encode(String(pin)), 'PBKDF2', false, ['deriveBits']);
    const salt = encoder.encode('fintracker_salt_v87_2026');
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, keyMaterial, 256);
    return 'pbkdf2_' + Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { console.error('hashPin failed:', e); throw new Error('فشل تشفير الرمز'); }
};
const getStoredPinHash = () => localStorage.getItem(PIN_HASH_KEY);
const savePinHash = async (pin) => { const hash = await hashPin(pin); localStorage.setItem(PIN_HASH_KEY, hash); };
const verifyPin = async (pin) => {
  const stored = getStoredPinHash();
  if (!stored) { if (pin === DEFAULT_PIN) { try { await savePinHash(pin); } catch(e) {} return true; } return false; }
  if (!stored.startsWith('pbkdf2_')) return false;
  try { const current = await hashPin(pin); return current === stored; } catch { return false; }
};

const PIN_SESSION_KEY = 'pin_session_token_v87_6';
const buildPinSessionToken = async (pin) => {
  try {
    const encoder = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', encoder.encode(pin + '|' + getLocalISODate()), 'PBKDF2', false, ['deriveBits']);
    const salt = encoder.encode('session_salt_v87');
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 10000, hash: 'SHA-256' }, keyMaterial, 128);
    return 'sess_' + Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch { return null; }
};
const savePinSession = async (pin) => { const token = await buildPinSessionToken(pin); if (token) sessionStorage.setItem(PIN_SESSION_KEY, token); };
const verifyPinSession = async (pin) => {
  const stored = sessionStorage.getItem(PIN_SESSION_KEY);
  if (!stored) return false;
  const expected = await buildPinSessionToken(pin);
  return stored === expected;
};

 */
const openPrintWindow = (htmlContent, title = 'تقرير', options = {}) => {
  const { autoPrint = true, fileName = null } = options;
  const printWindow = window.open('', '_blank', 'width=900,height=1100');
  if (!printWindow) {
    alert('⚠️ الرجاء السماح بالنوافذ المنبثقة لتفعيل الطباعة');
    return null;
  }
  printWindow.document.write(htmlContent);
  printWindow.document.close();
  printWindow.document.title = title;
  if (autoPrint) {
    printWindow.onload = () => {
      setTimeout(() => {
        try { printWindow.focus(); printWindow.print(); } catch (e) { console.warn('Print failed:', e); }
      }, 500);
    };
  }
  return printWindow;
};

   ═══════════════════════════════════════════════════════════════ */
const generateHanyLedgerReport = (data, options = {}) => {
  const {
    includePurchases = true,
    includeSettlements = true,
    includeGrouped = true,
    monthFilter = null, // null = all time, or { month: 'سبتمبر', year: 2026 }
    includeWatermark = true
  } = options;

  const purchases = (data.transactions || [])
    .filter(t => t.method === HANY_TAB_METHOD && isHanyShopCategory(t.category) && !isCarryoverMarker(t))
    .sort(compareTransactions);

  const settlements = (data.transactions || [])
    .filter(t => isHanySettleTx(t) && t.status === 'paid')
    .sort(compareTransactions);

  const totalPurchases = purchases.reduce((s, t) => s + safeNumber(t.amount), 0);
  const totalSettlements = settlements.reduce((s, t) => s + safeNumber(t.amount), 0);
  const currentPayable = Math.max(0, totalPurchases - totalSettlements);

  // Filter by month if specified
  const filteredPurchases = monthFilter
    ? purchases.filter(t => t.month === monthFilter.month && (t.year || 2026) === monthFilter.year)
    : purchases;

  const filteredSettlements = monthFilter
    ? settlements.filter(t => t.month === monthFilter.month && (t.year || 2026) === monthFilter.year)
    : settlements;

  // Group purchases by item name
  const groupedMap = {};
  filteredPurchases.forEach(t => {
    const key = (t.description || 'بدون وصف').trim();
    if (!groupedMap[key]) groupedMap[key] = { name: key, count: 0, total: 0, firstDate: t.date, lastDate: t.date };
    groupedMap[key].count++;
    groupedMap[key].total += safeNumber(t.amount);
    if (t.date < groupedMap[key].firstDate) groupedMap[key].firstDate = t.date;
    if (t.date > groupedMap[key].lastDate) groupedMap[key].lastDate = t.date;
  });
  const groupedList = Object.values(groupedMap).sort((a, b) => b.total - a.total);

  const monthLabel = monthFilter ? `${monthFilter.month} ${monthFilter.year}` : 'كل الفترات';
  const reportTitle = `كشف حساب دفتر محل هاني — ${monthLabel}`;

  // Purchases table rows
  const purchaseRows = filteredPurchases.map(t => `
    <tr>
      <td class="col-date">${formatArabicDate(t.date)}</td>
      <td class="col-desc">
        <div class="desc-main">${escapeHtml(t.description || 'بدون وصف')}</div>
        <div class="desc-sub">${escapeHtml(t.month || '')} ${t.year || ''}${t.status === 'paid' ? ' · معتمد' : ' · معلق'}</div>
      </td>
      <td class="col-amount debit">+${fmt(t.amount)}</td>
    </tr>
  `).join('');

  // Settlements table rows
  const settleRows = filteredSettlements.map(t => `
    <tr>
      <td class="col-date">${formatArabicDate(t.date)}</td>
      <td class="col-desc">
        <div class="desc-main">${escapeHtml(t.description || 'سداد دفتر هاني')}</div>

      </td>

      </div>
      <div class="report-kpi warning">

        <div class="kpi-value" style="font-size:11px">${escapeHtml(monthLabel)}</div>

    </div>

    ${includeGrouped && groupedList.length > 0 ? `
      <div class="report-section-title">
        <span>📋 ملخص الأصناف المُجمَّع</span>
        <span class="section-sub">${groupedList.length} صنف</span>

      <table class="report-table">

    ${includePurchases && filteredPurchases.length > 0 ? `

/* ═══════════════════════════════════════════════════════════════
   🖨️ REPORT 2: TRANSACTIONS REPORT (كشف معاملات)
   ═══════════════════════════════════════════════════════════════ */
const generateTransactionsReport = (data, options = {}) => {
  const {
    selectedMonth = 'سبتمبر',
    selectedYear = 2026,
    filterType = 'all', // 'all' | 'expense' | 'income'
    includeOnlyPaid = false,
    includeWatermark = true
  } = options;

  const allTxs = (data.transactions || []).filter(t => {
    if (isCarryoverMarker(t)) return false;
    if (t.month !== selectedMonth || (t.year || 2026) !== selectedYear) return false;
    if (filterType !== 'all' && t.type !== filterType) return false;
    if (includeOnlyPaid && t.status !== 'paid') return false;
    return true;
  }).sort(compareTransactions);

  const totalIncome = allTxs.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
  const totalExpense = allTxs.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
  const netFlow = totalIncome - totalExpense;

  const reportTitle = `كشف المعاملات — ${selectedMonth} ${selectedYear}`;
  const typeLabel = filterType === 'expense' ? 'مصروفات' : filterType === 'income' ? 'إيرادات' : 'شامل';

  // Group by date
  const groupedByDate = {};
  allTxs.forEach(t => {
    const d = t.date || 'unknown';
    if (!groupedByDate[d]) groupedByDate[d] = [];
    groupedByDate[d].push(t);
  });
  const sortedDates = Object.keys(groupedByDate).sort((a, b) => b.localeCompare(a));

  let runningBalance = 0;
  const rows = [];
  sortedDates.forEach(date => {
    const dayTxs = groupedByDate[date].sort(compareTransactions);
    const dayTotal = dayTxs.reduce((s, t) => s + (t.type === 'income' ? safeNumber(t.amount) : -safeNumber(t.amount)), 0);
    rows.push(`
      <tr class="report-day-header">
        <td colspan="4">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span>📅 ${formatArabicDate(date)}</span>
            <span style="font-size:10px">${dayTxs.length} عملية · صافي اليوم: ${dayTotal >= 0 ? '+' : ''}${fmt(dayTotal)} ج.م</span>
          </div>
        </td>
      </tr>
    `);
    dayTxs.forEach(t => {
      const isIncome = t.type === 'income';
      runningBalance += isIncome ? safeNumber(t.amount) : -safeNumber(t.amount);
      rows.push(`
        <tr>
          <td class="col-desc">
            <div class="desc-main">${escapeHtml(t.description || t.category || 'بدون وصف')}</div>
            <div class="desc-sub">${escapeHtml(t.category)} · ${escapeHtml(getMethodLabel(t.method))}${t.status !== 'paid' ? ' · <span style="color:#D97706;font-weight:700">معلق</span>' : ''}</div>
          </td>
          <td style="text-align:center;width:80px">
            <span style="padding:2px 8px;border-radius:999px;font-size:9px;font-weight:800;background:${isIncome ? '#DCFCE7' : '#FEE2E2'};color:${isIncome ? '#059669' : '#DC2626'}">
              ${isIncome ? 'وارد' : 'صادر'}
            </span>
          </td>
          <td class="col-amount ${isIncome ? 'credit' : 'debit'}">${isIncome ? '+' : '−'}${fmt(t.amount)}</td>
          <td class="col-balance">${fmt(runningBalance)}</td>
        </tr>
      `);
    });
  });

  const content = `
    ${buildReportHeader(reportTitle, { badge: `فلتر: ${typeLabel}` })}

    <div class="report-kpi-grid">
      <div class="report-kpi success">
        <div class="kpi-label">إجمالي الإيرادات</div>
        <div class="kpi-value">${fmt(totalIncome)}</div>
      </div>
      <div class="report-kpi danger">
        <div class="kpi-label">إجمالي المصروفات</div>
        <div class="kpi-value">${fmt(totalExpense)}</div>
      </div>
      <div class="report-kpi ${netFlow >= 0 ? 'accent' : 'danger'}">
        <div class="kpi-label">صافي التدفق</div>
        <div class="kpi-value">${netFlow >= 0 ? '+' : ''}${fmt(netFlow)}</div>
      </div>
      <div class="report-kpi info">
        <div class="kpi-label">عدد العمليات</div>
        <div class="kpi-value">${allTxs.length}</div>
      </div>
    </div>

    <div class="report-section-title">
      <span>📋 تفاصيل المعاملات</span>
      <span class="section-sub">${sortedDates.length} يوم · ${allTxs.length} عملية</span>
    </div>

    <table class="report-table">
      <thead>
        <tr>
          <th>البيان / الفئة</th>
          <th style="width:80px;text-align:center">النوع</th>
          <th style="width:110px">المبلغ (ج.م)</th>
          <th style="width:110px">الرصيد التراكمي</th>
        </tr>
      </thead>
      <tbody>
        ${rows.join('')}
      </tbody>
    </table>

    <div class="report-totals-box">
      <div class="report-totals-row">
        <span class="total-label">💰 إجمالي الإيرادات (معتمد)</span>
        <span class="total-value credit">+${fmt(totalIncome)} ج.م</span>
      </div>
      <div class="report-totals-row">
        <span class="total-label">💸 إجمالي المصروفات (معتمد)</span>
        <span class="total-value debit">−${fmt(totalExpense)} ج.م</span>
      </div>
      <div class="report-totals-row final">
        <span class="total-label">📊 صافي التدفق النقدي</span>
        <span class="total-value">${netFlow >= 0 ? '+' : ''}${fmt(netFlow)} ج.م</span>
      </div>
    </div>

    ${buildReportFooter(`كشف معاملات ${selectedMonth} ${selectedYear}`)}
  `;

  const watermark = includeWatermark ? '<div class="report-watermark">كشف معاملات</div>' : '';
  return wrapReportHtml(`<div style="position:relative">${watermark}${content}</div>`, reportTitle);
};

    <div class="report-section-title">
      <span>🏦 تفاصيل أرصدة الحسابات والمحافظ</span>

    <table class="report-table">
      <thead>

      </div>
      <div class="report-totals-row final">

/* ═══════════════════════════════════════════════════════════════
   🖨️ REPORT 4: CARDS & DEBT REPORT
   ═══════════════════════════════════════════════════════════════ */
const generateCardsReport = (data, options = {}) => {
  const { includeWatermark = true } = options;
  const reportTitle = 'كشف البطاقات الائتمانية والمديونيات';
  const cards = data.cards || [];

  const cardsData = cards.map(card => ({
    card,
    debt: computeCardDebt(data, card),
    available: Math.max(0, safeNumber(card.limit) - Math.max(0, computeCardDebt(data, card))),
    limit: safeNumber(card.limit)
  }));

  const totalDebt = cardsData.reduce((s, c) => s + Math.max(0, c.debt), 0);
  const totalLimit = cardsData.reduce((s, c) => s + c.limit, 0);
  const totalAvailable = cardsData.reduce((s, c) => s + c.available, 0);
  const usagePct = totalLimit > 0 ? (totalDebt / totalLimit) * 100 : 0;

  const cardRows = cardsData.map(({ card, debt, available, limit }) => {
    const pct = limit > 0 ? (Math.max(0, debt) / limit) * 100 : 0;
    return `
      <tr>
        <td class="col-desc">
          <div class="desc-main">${escapeHtml(card.bank)} - ${escapeHtml(card.name)}</div>
          <div class="desc-sub">•••• ${escapeHtml(card.last4)} · ${escapeHtml(card.holderName || '')} · ينتهي ${escapeHtml(card.expiry || '')}</div>
        </td>
        <td class="col-balance">${fmt(limit)}</td>
        <td class="col-amount ${debt > 0 ? 'debit' : 'credit'}">${fmt(Math.max(0, debt))}</td>
        <td class="col-balance">${fmt(available)}</td>
        <td style="text-align:center;font-weight:800;color:${pct > 70 ? '#DC2626' : pct > 40 ? '#D97706' : '#059669'}">${Math.round(pct)}%</td>
      </tr>
    `;
  }).join('');

  const content = `
    ${buildReportHeader(reportTitle, { badge: `${cards.length} بطاقة` })}

    <div class="report-kpi-grid">
      <div class="report-kpi accent">
        <div class="kpi-label">إجمالي الحدود الائتمانية</div>
        <div class="kpi-value">${fmt(totalLimit)}</div>
      </div>
      <div class="report-kpi danger">
        <div class="kpi-label">إجمالي المديونية</div>
        <div class="kpi-value">${fmt(totalDebt)}</div>
      </div>
      <div class="report-kpi success">
        <div class="kpi-label">إجمالي المتاح</div>
        <div class="kpi-value">${fmt(totalAvailable)}</div>
      </div>
      <div class="report-kpi ${usagePct > 70 ? 'danger' : usagePct > 40 ? 'warning' : 'success'}">
        <div class="kpi-label">نسبة الاستخدام</div>
        <div class="kpi-value">${Math.round(usagePct)}%</div>
      </div>
    </div>

    <div class="report-section-title">
      <span>💳 تفاصيل البطاقات</span>
      <span class="section-sub">${cards.length} بطاقة</span>
    </div>

    <table class="report-table">
      <thead>
        <tr>
          <th>البطاقة</th>
          <th style="width:100px">الحد</th>
          <th style="width:100px">المديونية</th>
          <th style="width:100px">المتاح</th>
          <th style="width:60px;text-align:center">الاستخدام</th>
        </tr>
      </thead>
      <tbody>
        ${cardRows}
        <tr style="background:#EEEDFF">
          <td style="font-weight:900;color:#4A42E5">الإجمالي</td>
          <td class="col-balance" style="font-weight:900">${fmt(totalLimit)}</td>
          <td class="col-amount debit" style="font-weight:900">${fmt(totalDebt)}</td>
          <td class="col-balance" style="font-weight:900">${fmt(totalAvailable)}</td>
          <td style="text-align:center;font-weight:900;color:#4A42E5">${Math.round(usagePct)}%</td>
        </tr>
      </tbody>
    </table>

    ${cardsData.some(c => safeNumber(c.card.limit) > 0) ? `
      <div class="report-section-title">
        <span>📊 تفصيل الاستخدام</span>
      </div>
      <div style="display:grid;gap:8px">
        ${cardsData.map(({ card, debt, limit }) => {
          const pct = limit > 0 ? (Math.max(0, debt) / limit) * 100 : 0;
          const color = pct > 70 ? '#DC2626' : pct > 40 ? '#D97706' : '#059669';
          return `

/**
 * Download HTML report as .html file (يمكن فتحه وطباعته كـ PDF لاحقاً)
 */
const downloadHtmlReport = (htmlContent, fileName) => {
  const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName || `report_${Date.now()}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
};

/**
 * Share report via Web Share API (يفتح قائمة المشاركة: واتساب، إيميل، إلخ)
 */
const shareReport = async (reportTitle, htmlContent, fileName) => {
  try {
    // Try native share with file
    if (navigator.canShare && navigator.share) {
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const file = new File([blob], fileName || 'report.html', { type: 'text/html' });

      if (navigator.canShare({ files: [file] })) {
        await navigator.share({
          title: reportTitle,
          text: `📊 ${reportTitle}\n\nتم إنشاء التقرير من محفظتي المالية V87.6`,
          files: [file]
        });
        return { ok: true, method: 'file' };
      }
    }

    // Fallback: share as text with report summary
    if (navigator.share) {
      await navigator.share({
        title: reportTitle,
        text: `📊 ${reportTitle}\n\nتم إنشاء التقرير من محفظتي المالية V87.6`
      });
      return { ok: true, method: 'text' };
    }

    // Final fallback: download
    downloadHtmlReport(htmlContent, fileName);
    return { ok: true, method: 'download' };
  } catch (e) {
    if (e.name === 'AbortError') return { ok: false, method: 'cancelled' };
    console.error('Share failed:', e);
    downloadHtmlReport(htmlContent, fileName);
    return { ok: true, method: 'download-fallback' };
  }
};

/* ═══════════════════════════════════════════════════════════════
   ACCOUNTING CORE V87.6 (نفس V87.5)
   ═══════════════════════════════════════════════════════════════ */
const inferKind = (tx) => {
  if (tx.kind) return tx.kind;
  if (tx.category === 'أخرى' && (tx.description || '').includes('تسوية')) return KIND.ADJUSTMENT;
  if (tx.category === 'تسوية رصيد') return KIND.ADJUSTMENT;
  if (isHanySettleCategory(tx.category)) return KIND.FINANCIAL;
  if (isFinancial(tx.category)) return KIND.FINANCIAL;
  return KIND.OPERATIONAL;
};

const isBeneficiaryCategorySafe = (cat) => typeof cat === 'string' && cat.startsWith('مصروف شهري - ');
const isMonthClosed = (data, year, month) => {
  const key = makeMonthKey(year, month);
  return Array.isArray(data?.closedMonths) && data.closedMonths.includes(key);
};

const expandTransferLinks = (ids, allTx) => {
  const set = new Set(ids);
  const list = allTx || [];
  ids.forEach(id => {
    const t = list.find(x => x.id === id);
    if (t?.linkedTransferId) {
      list.forEach(x => { if (x.linkedTransferId === t.linkedTransferId) set.add(x.id); });
    }
  });
  return Array.from(set);
};

const findOrphanTransfers = (transactions) => {
  const groups = {};
  (transactions || []).forEach(t => {
    if (!t.linkedTransferId) return;
    if (!groups[t.linkedTransferId]) groups[t.linkedTransferId] = [];
    groups[t.linkedTransferId].push(t);
  });
  return Object.entries(groups).filter(([_, arr]) => arr.length < 2).map(([id, arr]) => ({ transferId: id, items: arr }));
};

const invalidateSnapshotsFrom = (snapshots, year, month) => {
  const startIdx = getMonthIndex(month);
  if (startIdx < 0) return { snapshots: snapshots || {}, invalidated: 0 };
  const newSnaps = { ...(snapshots || {}) };
  let invalidated = 0;
  Object.keys(newSnaps).forEach(key => {
    const parsedKey = parseMonthKey(key);
    if (!parsedKey) return;
    if (parsedKey.year > year || (parsedKey.year === year && getMonthIndex(parsedKey.month) >= startIdx)) {
      delete newSnaps[key]; invalidated++;
    }
  });
  return { snapshots: newSnaps, invalidated };
};

const getAccountInitialDate = (accountsData, key) => {
  const acc = accountsData?.[key];
  if (!acc) return null;
  const iso = acc.initialDate || acc.lastUpdated;
  return parseISODate(iso) || null;
};

const getAccountInitialBalance = (accountsData, key) => {
  const acc = accountsData?.[key];
  if (!acc) return 0;
  if (acc.initialBalance !== undefined && acc.initialBalance !== null) return safeNumber(acc.initialBalance);
  return safeNumber(acc.balance);
};

const isLoanActiveInMonth = (loan, year, month) => {
  if (!loan) return false;
  if (safeNumber(loan.monthlyInstallment) <= 0) return false;
  if (loan.remaining !== undefined && loan.remaining <= 0) return false;
  const targetYM = year * 12 + getMonthIndex(month);
  if (loan.endYear && loan.endMonth) {
    const endYM = safeNumber(loan.endYear) * 12 + getMonthIndex(loan.endMonth);
    return targetYM <= endYM;
  }
  if (loan.startYear && loan.startMonth) {
    const startYM = safeNumber(loan.startYear) * 12 + getMonthIndex(loan.startMonth);
    if (targetYM < startYM) return false;
  }
  if (!loan.startYear && !loan.endYear) return targetYM <= LOANS_FINAL_SETTLEMENT_YM;
  return true;
};

const getCardMethod = (card) => {
  if (!card) return null;
  if (card.bank === 'CIB' && card.name === 'SWYPE') return 'cib_swype';
  if (card.bank === 'AAIB') return 'aaib_card';
  return 'cib_card';
};

const hasCashEffect = (t) => {
  if (!t) return false;
  if (t.status !== 'paid') return false;
  if (t.source === 'void') return false;
  if (t.affectsCash === false) return false;
  if (t.hanyEffect === 'carryover-marker') return false;
  if (t.method === HANY_TAB_METHOD) return false;
  if (t.method && PAYMENT_METHODS_WITHOUT_ACCOUNT.has(t.method)) return false;
  if (t.source === 'carryover' && t.status !== 'paid') return false;
  if (t.source === 'reconciliation') return true;
  return true;
};

const isCarryoverMarker = (t) => {
  if (!t) return false;
  if (t.hanyEffect === 'carryover-marker') return true;
  if (t.subCategory === 'رصيد مرحل') return true;
  const desc = t.description || '';
  if (desc.includes('مرحلة من') || desc.includes('مرحل من الشهر') || desc.includes('رصيد مرحل')) return true;
  return false;
};

const isHanyPurchaseTx = (t) => t && (t.hanyEffect === 'purchase' || t.method === HANY_TAB_METHOD) && !isCarryoverMarker(t);
const isHanySettleTx = (t) => t && (t.hanyEffect === 'settle' || isHanySettleCategory(t.category));

const computeBalancesAsOf = (data, asOfDate = null) => {
  const accountsData = data?.accountsData || DEFAULT_ACCOUNTS;
  const result = {};
  const anchorTs = {};

  ACCOUNT_KEYS.forEach(k => {
    result[k] = toPiasters(getAccountInitialBalance(accountsData, k));
    const d = getAccountInitialDate(accountsData, k);
    anchorTs[k] = d ? dayStart(d).getTime() : 0;
  });

  const upper = asOfDate ? new Date(asOfDate).getTime() : endOfToday().getTime();

  (data?.transactions || []).forEach(t => {
    if (!hasCashEffect(t)) return;
    const method = t.method;
    if (!ACCOUNT_KEYS.includes(method)) return;
    const d = parseISODate(t.date);
    if (!d) return;
    const dTs = dayStart(d).getTime();
    const anchor = anchorTs[method];
    const signedP = t.subType === 'deposit' ? toPiasters(t.amount) : -toPiasters(t.amount);

    if (upper >= anchor) {
      if (dTs >= anchor && dTs <= upper) result[method] += signedP;
    } else {
      if (dTs > upper && dTs < anchor) result[method] -= signedP;
    }
  });

  ACCOUNT_KEYS.forEach(k => { result[k] = fromPiasters(result[k]); });
  return result;
};

const computeAllBalances = (data, asOfDate) => computeBalancesAsOf(data, asOfDate);
const computeBalance = (data, key, asOfDate) => {
  const all = computeBalancesAsOf(data, asOfDate);
  return safeNumber(all[key]);
};

const computeDualLiquidity = (balances) => {
  const comprehensive = ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(balances?.[k]), 0);
  const withoutWallets = CORE_LIQUIDITY_KEYS.reduce((s, k) => s + safeNumber(balances?.[k]), 0);
  const walletsOnly = WALLET_ONLY_KEYS.reduce((s, k) => s + safeNumber(balances?.[k]), 0);
  return { comprehensive, withoutWallets, walletsOnly };
};

const isCardPaymentTx = (t, cardId) => {
  if (!t || !cardId) return false;
  if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return false;
  if (t.method === HANY_TAB_METHOD) return false;
  if (t.source === 'card-payment-plan') return t.linkedCardId === cardId;
  if (t.source === 'payment-console' && t.linkedCardId === cardId) return true;
  if (t.category === 'الالتزامات البنكية والتمويلية'
      && t.type === 'expense'
      && t.linkedCardId === cardId
      && !t.linkedLoanId
      && !t.sourceRecurringId) return true;
  return false;
};

const computeCardDebt = (data, card, asOfDate = null) => {
  if (!card) return 0;
  const method = getCardMethod(card);
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();

  const cutoffISO = card.openingDebtDate || card.openingDate;
  const parsedCutoff = cutoffISO ? parseISODate(cutoffISO) : null;
  const cutoffDay = parsedCutoff ? dayStart(parsedCutoff) : null;

  let debt = safeNumber(card.openingDebt);

  (data?.transactions || []).forEach(t => {
    if (!t) return;
    if (t.status !== 'paid') return;
    if (t.source === 'carryover') return;
    if (t.source === 'void') return;
    if (isCarryoverMarker(t)) return;
    if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return;
    if (t.method === HANY_TAB_METHOD) return;

    const d = parseISODate(t.date);
    if (!d) return;
    if (cutoffDay && d < cutoffDay) return;
    if (d > upper) return;

    const amt = safeNumber(t.amount);
    const hasExplicitLink = t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== '';
    let belongsToCard = false;
    if (hasExplicitLink) belongsToCard = (t.linkedCardId === card.id);
    else if (t.cardLast4 && subCards.includes(t.cardLast4)) belongsToCard = true;
    else belongsToCard = (t.method === method);

    if (!belongsToCard) return;

    if (isCardPaymentTx(t, card.id)) {
      debt -= amt;
      return;
    }
    if (t.type === 'expense') debt += amt;
    else if (t.type === 'income') debt -= amt;
  });

  return debt;
};

const computeCardPaymentInfo = (data, card, asOfDate = null) => {
  if (!card) return { debt: 0, paymentsTotal: 0, purchasesTotal: 0, refundsTotal: 0, lastPayment: null, paymentCount: 0 };
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();
  let paymentsTotal = 0, purchasesTotal = 0, refundsTotal = 0, paymentCount = 0;
  let lastPayment = null;
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
  const method = getCardMethod(card);

  (data?.transactions || []).forEach(t => {
    if (!t || t.status !== 'paid' || isCarryoverMarker(t)) return;
    if (t.source === 'void') return;
    if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return;
    if (t.method === HANY_TAB_METHOD) return;

    const d = parseISODate(t.date);
    if (!d || d > upper) return;

    const hasExplicitLink = t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== '';
    let belongsToCard = false;
    if (hasExplicitLink) belongsToCard = (t.linkedCardId === card.id);
    else if (t.cardLast4 && subCards.includes(t.cardLast4)) belongsToCard = true;
    else belongsToCard = (t.method === method);
    if (!belongsToCard) return;

    if (isCardPaymentTx(t, card.id)) {
      paymentsTotal += safeNumber(t.amount);
      paymentCount++;
      if (!lastPayment || d > parseISODate(lastPayment.date)) lastPayment = t;
    } else if (t.type === 'expense') {
      purchasesTotal += safeNumber(t.amount);
    } else if (t.type === 'income') {
      refundsTotal += safeNumber(t.amount);
    }
  });

  return {
    debt: computeCardDebt(data, card, asOfDate),
    paymentsTotal, purchasesTotal, refundsTotal, lastPayment, paymentCount
  };
};

const computeCardAvailable = (data, card, asOfDate = null) => {
  if (!card) return 0;
  const debt = computeCardDebt(data, card, asOfDate);
  const limit = safeNumber(card.limit);
  return Math.max(0, limit - Math.max(0, debt));
};

const computeTotalCardDebtNet = (data, asOfDate = null) => {
  const sum = (data?.cards || []).reduce((s, c) => s + computeCardDebt(data, c, asOfDate), 0);
  return Math.max(0, sum);
};

const computeHanyPayable = (data, asOfDate = null) => {
  const upper = asOfDate ? new Date(asOfDate).getTime() : endOfToday().getTime();
  let purchases = 0;
  let settlements = 0;

  (data?.transactions || []).forEach(t => {
    if (!t || t.status === 'void' || t.source === 'void') return;
    if (isCarryoverMarker(t)) return;

    const d = parseISODate(t.date);
    if (!d || d.getTime() > upper) return;

    if (t.method === HANY_TAB_METHOD && isHanyShopCategory(t.category)) {
      purchases += safeNumber(t.amount);
      return;
    }
    if ((t.hanyEffect === 'settle' || isHanySettleCategory(t.category)) && t.status === 'paid') {
      settlements += safeNumber(t.amount);
    }
  });

  return Math.max(0, purchases - settlements);
};

const computeHanySummaryForMonth = (data, year, month) => {
  const monthKey = makeMonthKey(year, month);
  let purchases = 0, settlements = 0, purchaseCount = 0, settleCount = 0;

  (data?.transactions || []).forEach(t => {
    if (!t || t.status === 'void') return;
    if (isCarryoverMarker(t)) return;

    if (t.month === month && (t.year || 2026) === year
        && t.method === HANY_TAB_METHOD && isHanyShopCategory(t.category)) {
      purchases += safeNumber(t.amount);
      purchaseCount++;
    }
    if (t.month === month && (t.year || 2026) === year
        && (t.hanyEffect === 'settle' || isHanySettleCategory(t.category)) && t.status === 'paid') {
      settlements += safeNumber(t.amount);
      settleCount++;
    }
  });

  const monthIdx = getMonthIndex(month);
  const dayBefore = new Date(year, monthIdx, 0, 23, 59, 59);
  const opening = computeHanyPayable(data, dayBefore);

  return {
    monthKey, opening, purchases, settlements,
    closing: Math.max(0, opening + purchases - settlements),
    purchaseCount, settleCount
  };
};

const createHanyCarryoverMarker = (data, year, month, remainingAmount) => {
  if (remainingAmount <= 0.01) return null;
  const monthIdx = getMonthIndex(month);
  if (monthIdx < 0) return null;
  const endDate = new Date(year, monthIdx + 1, 0);
  const isoDate = getLocalISODate(endDate);
  const id = `hany-marker-${year}-${monthIdx + 1}`;
  const exists = (data.transactions || []).some(t => t.id === id);
  if (exists) return null;
  return {
    id,
    type: 'expense',
    kind: KIND.ADJUSTMENT,
    category: HANY_TAB_CATEGORY,
    subCategory: 'رصيد مرحل',
    description: `رصيد مرحل من ${month} ${year}`,
    amount: roundMoney(remainingAmount),
    method: HANY_TAB_METHOD,
    date: isoDate,
    month, year, monthIndex: monthIdx,
    subType: 'withdrawal',
    status: 'paid',
    affectsCash: false,
    hanyEffect: 'carryover-marker',
    source: 'carryover',
    createdAt: new Date().toISOString(),
    _markerOnly: true
  };
};

const cleanupHanyMarkersFrom = (transactions, year, month) => {
  const fromIdx = getMonthIndex(month);
  if (fromIdx < 0) return transactions;
  return (transactions || []).filter(t => {
    if (t.hanyEffect !== 'carryover-marker') return true;
    const parsed = parseISODate(t.date);
    if (!parsed) return true;
    const tYear = parsed.getFullYear();
    const tMonthIdx = parsed.getMonth();
    if (tYear > year) return false;
    if (tYear === year && tMonthIdx >= fromIdx) return false;
    return true;
  });
};

const computeNetWorth = (data, asOfDate = null) => {
  const balances = computeBalancesAsOf(data, asOfDate);
  const liquidity = ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(balances[k]), 0);
  const cardDebt = computeTotalCardDebtNet(data, asOfDate);

  const loanDebt = (data?.loans || [])
    .filter(l => !l.isReceivable && !l.autoMonthly)
    .reduce((s, l) => s + Math.max(0, safeNumber(l.remaining ?? l.totalAmount)), 0);

  const hanyPayable = computeHanyPayable(data, asOfDate);

  const totalLiabilities = cardDebt + loanDebt + hanyPayable;
  return {
    liquidity, cardDebt, loanDebt, hanyPayable, totalLiabilities,
    netWorth: liquidity - totalLiabilities,
    balances
  };
};

const FLOW = {
  INCOME: 'income', CASH_EXPENSE: 'cashExpense', CARD_SPENDING: 'cardSpending',
  CARD_PAYMENT: 'cardPayment', LOAN_INSTALLMENT: 'loanInstallment',
  HANY_PURCHASE: 'hanyPurchase', HANY_SETTLE: 'hanySettle',
  TRANSFER_OUT: 'transferOut', TRANSFER_IN: 'transferIn',
  RECONCILIATION: 'reconciliation', CARRYOVER_MARKER: 'carryoverMarker', VOID: 'void',
};

const classifyFlow = (t) => {
  if (!t) return FLOW.VOID;
  if (t.status === 'void' || t.source === 'void') return FLOW.VOID;
  if (isCarryoverMarker(t)) return FLOW.CARRYOVER_MARKER;

  if (t.hanyEffect === 'purchase' || t.method === HANY_TAB_METHOD) return FLOW.HANY_PURCHASE;
  if (t.hanyEffect === 'settle' || isHanySettleCategory(t.category)) return FLOW.HANY_SETTLE;

  if (t.source === 'card-payment-plan') return FLOW.CARD_PAYMENT;
  if (t.source === 'payment-console' && t.linkedCardId) return FLOW.CARD_PAYMENT;
  if (t.category === 'الالتزامات البنكية والتمويلية'
      && t.type === 'expense'
      && t.linkedCardId
      && !t.linkedLoanId
      && !t.sourceRecurringId) return FLOW.CARD_PAYMENT;

  if (t.sourceRecurringId && t.sourceRecurringId.indexOf('r-mortgage') === 0) return FLOW.LOAN_INSTALLMENT;
  if (t.linkedLoanId) return FLOW.LOAN_INSTALLMENT;

  if (t.category === 'الالتزامات البنكية والتمويلية'
      && t.type === 'expense'
      && !t.linkedCardId) return FLOW.LOAN_INSTALLMENT;

  if (t.source === 'reconciliation') return FLOW.RECONCILIATION;
  if (t.linkedTransferId) {
    if (t.transferDirection === 'in') return FLOW.TRANSFER_IN;
    return FLOW.TRANSFER_OUT;
  }
  if (t.source === 'external-transfer') return FLOW.TRANSFER_OUT;
  if (t.source === 'carryover' && t.status !== 'paid') return FLOW.VOID;
  if (t.source === 'payment-console') {
    return t.linkedCardId ? FLOW.CARD_PAYMENT : FLOW.LOAN_INSTALLMENT;
  }
  const desc = t.description || '';
  if (desc.includes('قرض التمويل') || desc.includes('شقة العبور')
      || desc.includes('تمويل عقاري') || desc.includes('قرض عقاري')) {
    return FLOW.LOAN_INSTALLMENT;
  }
  if (t.type === 'income') return FLOW.INCOME;
  if (t.type === 'expense') {
    if (CREDIT_CARD_METHOD_IDS.includes(t.method)) return FLOW.CARD_SPENDING;
    if (t.method && PAYMENT_METHODS_WITHOUT_ACCOUNT.has(t.method)) return FLOW.CASH_EXPENSE;
    if (BANK_FEE_CATEGORIES.has(t.category)) return FLOW.CASH_EXPENSE;
    if (t.category === 'مصاريف وسلف شخصية') return FLOW.CASH_EXPENSE;
    return FLOW.CASH_EXPENSE;
  }
  return FLOW.VOID;
};

const computeMonthlyFlows = (transactions, year, month) => {
  const monthTxs = (transactions || []).filter(t =>
    t.month === month && (t.year || 2026) === year
  );

  const emptyBucket = () => ({
    income: 0, cashExpense: 0, cardSpending: 0, cardPayment: 0,
    loanInstallment: 0, hanyPurchase: 0, hanySettle: 0,
    transferOut: 0, transferIn: 0, reconciliation: 0
  });

  const acc = { paid: emptyBucket(), pending: emptyBucket() };

  monthTxs.forEach(t => {
    const kind = classifyFlow(t);
    if (kind === FLOW.VOID || kind === FLOW.CARRYOVER_MARKER) return;
    const bucket = t.status === 'paid' ? acc.paid : acc.pending;
    const amt = safeNumber(t.amount);
    const keyMap = {
      [FLOW.INCOME]: 'income',
      [FLOW.CASH_EXPENSE]: 'cashExpense',
      [FLOW.CARD_SPENDING]: 'cardSpending',
      [FLOW.CARD_PAYMENT]: 'cardPayment',
      [FLOW.LOAN_INSTALLMENT]: 'loanInstallment',
      [FLOW.HANY_PURCHASE]: 'hanyPurchase',
      [FLOW.HANY_SETTLE]: 'hanySettle',
      [FLOW.TRANSFER_OUT]: 'transferOut',
      [FLOW.TRANSFER_IN]: 'transferIn',
      [FLOW.RECONCILIATION]: 'reconciliation'
    };
    const key = keyMap[kind];
    if (key) bucket[key] += amt;
  });

  const p = acc.paid;
  const q = acc.pending;

  return {
    paidIncome: p.income, paidCashExpense: p.cashExpense, paidCardSpending: p.cardSpending,
    paidCardPayment: p.cardPayment, paidLoanInstallment: p.loanInstallment,
    paidHanyPurchase: p.hanyPurchase, paidHanySettle: p.hanySettle,
    paidTransferOut: p.transferOut, paidTransferIn: p.transferIn, paidReconciliation: p.reconciliation,
    pendingIncome: q.income, pendingCashExpense: q.cashExpense, pendingCardSpending: q.cardSpending,
    pendingCardPayment: q.cardPayment, pendingLoanInstallment: q.loanInstallment,
    pendingHanyPurchase: q.hanyPurchase, pendingHanySettle: q.hanySettle,
    pendingTransferOut: q.transferOut, pendingTransferIn: q.transferIn, pendingReconciliation: q.reconciliation,
    paidExpense: p.cashExpense + p.cardSpending + p.cardPayment + p.loanInstallment + p.hanySettle + p.hanyPurchase,
    pendingExpense: q.cashExpense + q.cardSpending + q.cardPayment + q.loanInstallment + q.hanySettle + q.hanyPurchase,
    paidReportableIncome: p.income,
    paidReportableExpense: p.cashExpense + p.cardSpending + p.cardPayment + p.loanInstallment + p.hanySettle + p.hanyPurchase,
    txCount: monthTxs.length,
    monthTxs, classifyFlow
  };
};

const computeMonthlyAverage = (transactions, endYear, endMonth, monthsBack, filterFn) => {
  let total = 0, count = 0;
  for (let i = 1; i <= monthsBack; i++) {
    const { year, month } = addMonthsToYM(endYear, endMonth, -i);
    if (year < PROJECT_START_YEAR || (year === PROJECT_START_YEAR && getMonthIndex(month) < getMonthIndex(PROJECT_START_MONTH))) continue;
    const monthTxs = (transactions || []).filter(t =>
      t.month === month && (t.year || 2026) === year && t.status === 'paid'
    );
    const val = monthTxs.filter(filterFn).reduce((s, t) => s + safeNumber(t.amount), 0);
    if (val > 0) { total += val; count++; }
  }
  return count > 0 ? total / count : 0;
};

const computeMonthSnapshot = (data, year, month) => {
  const monthIdx = getMonthIndex(month);
  if (monthIdx < 0) return null;
  const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
  const balances = computeBalancesAsOf(data, monthEnd);
  const cardDebts = {};
  (data.cards || []).forEach(c => { cardDebts[c.id] = computeCardDebt(data, c, monthEnd); });
  const hanyPayable = computeHanyPayable(data, monthEnd);
  return {
    ...balances, __v: CURRENT_ENGINE_VERSION,
    __cardDebts: cardDebts, __hanyPayable: hanyPayable,
    __closedAt: new Date().toISOString()
  };
};

const getClosingBalance = (data, key, year, month) => {
  const monthKey = makeMonthKey(year, month);
  const snap = data?.monthlySnapshots?.[monthKey]?.[key];
  if (snap !== undefined && snap !== null) return safeNumber(snap);
  const monthIdx = getMonthIndex(month);
  if (monthIdx < 0) return computeBalance(data, key);
  const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
  return computeBalance(data, key, monthEnd);
};

const getOpeningBalance = (data, key, year, month) => {
  const idx = getMonthIndex(month);
  if (idx < 0) return computeBalance(data, key);
  if (idx === 0) return getClosingBalance(data, key, year - 1, 'ديسمبر');
  return getClosingBalance(data, key, year, ALL_MONTHS[idx - 1]);
};

const buildLedgerWithBalance = (transactions, accountsData, methodId) => {
  const cutoffDay = getAccountInitialDate(accountsData, methodId);
  const cutoffTime = cutoffDay ? dayStart(cutoffDay).getTime() : 0;

  const sorted = (transactions || [])
    .filter(t =>
      t.method === methodId &&
      t.status === 'paid' &&
      t.source !== 'void' &&
      t.affectsCash !== false &&
      !isCarryoverMarker(t) &&
      (parseISODate(t.date)?.getTime() ?? 0) >= cutoffTime
    )
    .sort((a, b) => {
      const da = parseISODate(a.date)?.getTime() ?? 0;
      const db = parseISODate(b.date)?.getTime() ?? 0;
      if (da !== db) return da - db;
      const ca = getTxTimestamp(a);
      const cb = getTxTimestamp(b);
      if (ca !== cb) return ca - cb;
      return String(a.id).localeCompare(String(b.id));
    });

  let balP = toPiasters(getAccountInitialBalance(accountsData, methodId));
  return sorted.map(t => {
    const a = toPiasters(t.amount);
    const prevBalP = balP;
    balP += (t.subType === 'deposit') ? a : -a;
    return { ...t, runningBalance: fromPiasters(balP), __opening: fromPiasters(prevBalP) };
  }).reverse();
};

const computeCustodyBalance = (entries) => {
  if (!Array.isArray(entries)) return { received: 0, transferred: 0, spentCash: 0, spentCard: 0, settled: 0, balance: 0, totalSpent: 0 };
  let received = 0, transferred = 0, spentCash = 0, spentCard = 0, settled = 0;
  entries.forEach(e => {
    const amt = safeNumber(e.amount);
    switch (e.type) {
      case CUSTODY_TYPE.RECEIVE: received += amt; break;
      case CUSTODY_TYPE.TRANSFER: transferred += amt; break;
      case CUSTODY_TYPE.SPEND_CASH: spentCash += amt; break;
      case CUSTODY_TYPE.SPEND_CARD: spentCard += amt; break;
      case CUSTODY_TYPE.SETTLE: settled += amt; break;
    }
  });
  const totalSpent = spentCash + spentCard;
  const balance = received - transferred - totalSpent - settled;
  return { received, transferred, spentCash, spentCard, settled, balance, totalSpent };
};

const computeCashbackSummary = (trackers) => {
  if (!Array.isArray(trackers)) return { expected: 0, received: 0, pending: 0, list: [] };
  const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
  const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
  return { expected, received, pending: expected - received, list: trackers };
};
