function dataReducer(state, action) {
  switch (action.type) {
    case 'SET_DATA': {
      const incoming = { ...action.payload };
      if (!Array.isArray(incoming.deletedTxArchive)) incoming.deletedTxArchive = [...(state.data.deletedTxArchive || [])];
      if (!Array.isArray(incoming.deletedTxIds)) incoming.deletedTxIds = [...(state.data.deletedTxIds || [])];
      if (!Array.isArray(incoming.deletedDefaultIds)) incoming.deletedDefaultIds = [...(state.data.deletedDefaultIds || [])];
      if (!Array.isArray(incoming.reconciliations)) incoming.reconciliations = [...(state.data.reconciliations || [])];
      return { ...state, data: incoming };
    }
    case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
    case 'SET_SELECTED_YEAR': return { 
      ...state, 
      selectedYear: action.payload, 
      selectedMonth: getMonthsForYear(action.payload).includes(state.selectedMonth) 
        ? state.selectedMonth 
        : getMonthsForYear(action.payload)[0] 
    };
    case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
    case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
    case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
    case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
    case 'SET_FORM_DATA': return { ...state, formData: action.payload };
    case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
    case 'SET_FORM_ERRORS': return { ...state, formErrors: action.payload };
    case 'SET_ACTIVE_CATEGORY_DETAIL': return { ...state, activeCategoryDetail: action.payload };
    case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
    case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
    case 'SET_BUDGETS': return { ...state, budgets: action.payload };
    case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
    case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
    case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
    case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
    case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
    case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
    case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
    case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
    case 'SET_PIN_CHANGE_OPEN': return { ...state, isPinChangeOpen: action.payload };
    case 'SET_SMS_MODAL_OPEN': return { ...state, isSmsModalOpen: action.payload };
    case 'SET_PENDING_CLOSE_MODAL': return { ...state, pendingCloseModal: action.payload };
    case 'ADD_NOTIFICATION': return { 
      ...state, 
      notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }] 
    };
    case 'REMOVE_NOTIFICATION': return { 
      ...state, 
      notifications: state.notifications.filter(n => n.id !== action.payload) 
    };
    case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
    case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
    case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
    case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
    case 'UPDATE_CASHBACK_TRACKERS': return { ...state, data: { ...state.data, cashbackTrackers: action.payload } };
    
    case 'UPDATE_ACCOUNTS': {
      const oldA = state.data.accountsData || {};
      const newA = action.payload || {};
      let earliestAffected = null;
      ACCOUNT_KEYS.forEach(k => {
        const oldBal = safeNumber(oldA[k]?.balance);
        const newBal = safeNumber(newA[k]?.balance);
        const oldDate = oldA[k]?.lastUpdated;
        const newDate = newA[k]?.lastUpdated;
        if (oldBal !== newBal || oldDate !== newDate) {
          const ref = newDate || oldDate;
          if (ref) {
            const d = parseISODate(ref);
            if (d) {
              const y = d.getFullYear();
              const mIdx = d.getMonth();
              const mName = ALL_MONTHS[mIdx];
              if (!earliestAffected) earliestAffected = { year: y, month: mName };
              else {
                const curIdx = getMonthIndex(earliestAffected.month);
                if (y < earliestAffected.year || (y === earliestAffected.year && mIdx < curIdx)) 
                  earliestAffected = { year: y, month: mName };
              }
            }
          }
        }
      });
      let newSnapshots = state.data.monthlySnapshots || {};
      if (earliestAffected) { 
        const { snapshots } = invalidateSnapshotsFrom(newSnapshots, earliestAffected.year, earliestAffected.month); 
        newSnapshots = snapshots; 
      }
      return { ...state, data: { ...state.data, accountsData: newA, monthlySnapshots: newSnapshots } };
    }
    
    case 'UPDATE_MONTHLY_PLANS': return { ...state, data: { ...state.data, monthlyPlans: action.payload } };
    
    case 'ADD_TO_HISTORY': { 
      const limited = [...state.history].slice(-19); 
      return { ...state, history: [...limited, action.payload], future: [] }; 
    }
    
    case 'UNDO': {
      if (state.history.length === 0) return state;
      const prev = state.history[state.history.length - 1];
      return { 
        ...state, 
        data: prev.data || prev, 
        budgets: prev.budgets !== undefined ? prev.budgets : state.budgets, 
        history: state.history.slice(0, -1), 
        future: [{ data: state.data, budgets: state.budgets }, ...state.future] 
      };
    }
    
    case 'TOGGLE_LEDGER': return { 
      ...state, 
      expandedLedgers: { 
        ...state.expandedLedgers, 
        [action.payload]: !state.expandedLedgers[action.payload] 
      } 
    };
    
    case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };
    case 'SET_STATUS_FILTER': return { ...state, statusFilter: action.payload };
    
    case 'SHOW_CONFIRM': return { 
      ...state, 
      confirmDialog: { 
        isOpen: true, 
        title: action.title, 
        message: action.message, 
        onConfirm: action.onConfirm, 
        onCancel: action.onCancel, 
        danger: action.danger || false 
      } 
    };
    
    case 'HIDE_CONFIRM': return { 
      ...state, 
      confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false } 
    };
    
    case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
    case 'SET_QUICK_TRANSFER_DATA': return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
    case 'SET_VIEWING_CARD_STATEMENT': return { ...state, viewingCardStatement: action.payload };
    case 'SET_RECONCILIATION_MODAL': return { ...state, reconciliationModal: action.payload };

    case 'CLOSE_MONTH': {
      const { year, month } = action.payload;
      const monthKey = makeMonthKey(year, month);
      const monthIdx = getMonthIndex(month);
      const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
      const snap = computeAllBalances(state.data, monthEnd);
      
      const cleanedSnapshots = { ...(state.data.monthlySnapshots || {}) };
      Object.keys(cleanedSnapshots).forEach(k => {
        const parsed = parseMonthKey(k);
        if (!parsed) return;
        if (parsed.year > year || (parsed.year === year && getMonthIndex(parsed.month) > monthIdx)) {
          delete cleanedSnapshots[k];
        }
      });
      
      return { 
        ...state, 
        data: { 
          ...state.data,
          closedMonths: Array.from(new Set([...(state.data.closedMonths || []), monthKey])),
          monthlySnapshots: { ...cleanedSnapshots, [monthKey]: snap } 
        } 
      };
    }

    case 'CLOSE_MONTH_AFTER_RESOLVE': {
      const { year, month, resolveAction, pendingIds } = action.payload;
      const monthKey = makeMonthKey(year, month);
      let newTxs = state.data.transactions || [];
      
      if (resolveAction === 'approve') { 
        const ids = new Set(pendingIds); 
        newTxs = newTxs.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t); 
      }
      else if (resolveAction === 'delete') { 
        const ids = new Set(pendingIds); 
        newTxs = newTxs.filter(t => !ids.has(t.id)); 
      }
      else if (resolveAction === 'carry') {
        const idx = getMonthIndex(month);
        const nextMonth = idx === 11 ? ALL_MONTHS[0] : ALL_MONTHS[idx + 1];
        const nextYear = idx === 11 ? year + 1 : year;
        const nextMonthIdx = getMonthIndex(nextMonth);
        const maxDay = new Date(nextYear, nextMonthIdx + 1, 0).getDate();
        const ids = new Set(pendingIds);
        const nextMonthKey = makeMonthKey(nextYear, nextMonth);
        const nextClosed = (state.data.closedMonths || []).includes(nextMonthKey);
        if (nextClosed) return { ...state, pendingCloseModal: { isOpen: false, pending: [], total: 0, month: '', year: 0 } };
        
        newTxs = newTxs.map(t => {
          if (!ids.has(t.id)) return t;
          const oldD = parseISODate(t.date);
          const oldDay = oldD ? oldD.getDate() : 1;
          const newDay = Math.min(Math.max(1, oldDay), maxDay);
          const newDate = `${nextYear}-${String(nextMonthIdx + 1).padStart(2, '0')}-${String(newDay).padStart(2, '0')}`;
          return { 
            ...t, 
            date: newDate, 
            month: nextMonth, 
            year: nextYear, 
            monthIndex: nextMonthIdx, 
            source: 'carryover', 
            carriedFromSource: t.source, 
            carryoverFrom: `${month} ${year}`, 
            status: 'pending' 
          };
        });
      }
      
      const newData = { ...state.data, transactions: newTxs };
      const monthEnd = new Date(year, getMonthIndex(month) + 1, 0, 23, 59, 59);
      const snap = computeAllBalances(newData, monthEnd);
      
      return { 
        ...state, 
        data: { 
          ...newData, 
          closedMonths: Array.from(new Set([...(newData.closedMonths || []), monthKey])),
          monthlySnapshots: { ...(newData.monthlySnapshots || {}), [monthKey]: snap } 
        }, 
        pendingCloseModal: { isOpen: false, pending: [], total: 0, month: '', year: 0 } 
      };
    }

    case 'OPEN_MONTH': {
      const monthKey = action.payload;
      const parsedKey = parseMonthKey(monthKey);
      if (!parsedKey) return { 
        ...state, 
        data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey) } 
      };
      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots, parsedKey.year, parsedKey.month);
      return { 
        ...state, 
        data: { 
          ...state.data, 
          closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey), 
          monthlySnapshots: snapshots
        } 
      };
    }

    /* ⭐ RECONCILE ACCOUNT — مطابقة رصيد مع إنشاء تسوية */
    case 'RECONCILE_ACCOUNT': {
      const { accountKey, actualBalance, diff, note, month, year, computedBalance } = action.payload;
      const now = new Date();
      const txMonth = month || ALL_MONTHS[now.getMonth()];
      const txYear = year || now.getFullYear();
      const txMonthIdx = getMonthIndex(txMonth);
      
      /* 1) تحديث الرصيد الأساسي للحساب = الفعلي */
      const newAccounts = { ...(state.data.accountsData || {}) };
      newAccounts[accountKey] = { 
        ...newAccounts[accountKey], 
        balance: actualBalance, 
        lastUpdated: getLocalISODate() 
      };
      
      /* 2) إنشاء تسوية كحركة واحدة لتسجيل الفرق */
      const reconciliationId = getSafeId();
      const settlementTx = {
        id: getSafeId(),
        type: diff > 0 ? 'income' : 'expense',
        kind: KIND.ADJUSTMENT,
        category: 'تسوية رصيد',
        amount: Math.abs(diff),
        description: note || `تسوية مطابقة ${ACCOUNT_SHORT_NAMES[accountKey] || accountKey}`,
        method: accountKey,
        date: getLocalISODate(now),
        month: txMonth,
        year: txYear,
        monthIndex: txMonthIdx,
        subType: diff > 0 ? 'deposit' : 'withdrawal',
        status: 'paid',
        source: 'reconciliation',
        linkedReconciliationId: reconciliationId,
        createdAt: now.toISOString()
      };
      
      const newTxs = [settlementTx, ...(state.data.transactions || [])]
        .sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
      
      /* 3) تسجيل في سجل المطابقات */
      const reconciliation = {
        id: reconciliationId,
        accountKey,
        date: getLocalISODate(now),
        computedBalance,
        actualBalance,
        diff,
        note: note || '',
        txId: settlementTx.id,
        createdAt: now.toISOString()
      };
      const newReconciliations = [reconciliation, ...(state.data.reconciliations || [])].slice(-200);
      
      /* 4) إبطال snapshots من هذا الشهر */
      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots || {}, txYear, txMonth);
      
      return { 
        ...state, 
        data: { 
          ...state.data, 
          accountsData: newAccounts, 
          transactions: newTxs,
          reconciliations: newReconciliations,
          monthlySnapshots: snapshots
        } 
      };
    }

    case 'TOGGLE_WALLET_VISIBILITY': return { 
      ...state, 
      walletVisibility: { 
        ...state.walletVisibility, 
        [action.payload]: !state.walletVisibility[action.payload] 
      } 
    };
    
    case 'SET_IS_PROCESSING': return { ...state, isProcessing: action.payload };
    
    default: return state;
  }
}

/* ═══════════════════════════════════════════════════════════════
   APP COMPONENT
   ═══════════════════════════════════════════════════════════════ */
function App() {
  const defMY = useMemo(() => getDefaultMonthYear(), []);
  const [state, dispatch] = useReducer(dataReducer, {
    data: getInitialData(),
    activeTab: 'dashboard',
    selectedYear: defMY.year, 
    selectedMonth: defMY.month,
    transViewMode: 'all', 
    catViewType: 'expense',
    isFormOpen: false, 
    formMode: 'add',
    formData: { type: 'expense', subType: 'withdrawal', status: 'pending'},
    isLocked: false, 
    isDarkMode: localStorage.getItem('theme') === 'dark',
    budgets: safeParseJson(localStorage.getItem('budgets'), {}),
    editingCard: null, 
    editingLoan: null,
    searchTerm: '', 
    editingBudgetCategory: null, 
    budgetAmount: '',
    isRecurringModalOpen: false,
    recurringFormData: { 
      title: '', amount: '', day: 1, category: 'أخرى', type: 'expense', 
      startMonth: '', endMonth: '', active: true, method: 'cash', 
      kind: null, linkedLoanSystemId: null, linkedCardId: null, transferChannel: null 
    },
    notifications: [],
    history: [], 
    future: [],
    expandedLedgers: { cash: false, fawry: false, etisalat: false, cib_savings: false, aaib_savings: false },
    expandedCardsSection: false, 
    statusFilter: 'all',
    confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false },
    isQuickTransferModalOpen: false,
    quickTransferData: { 
      transferMode: 'monthly',
      from: 'cib_savings', to: 'fawry', amount: '', transferType: 'monthly', 
      date: getLocalISODate(), beneficiaryId: null, forceCash: false,
      internalFrom: 'cib_savings', internalTo: 'fawry', internalFees: '', internalDescription: ''
    },
    viewingCardStatement: null,
    isPinChangeOpen: false,
    isSmsModalOpen: false,
    pendingCloseModal: { isOpen: false, pending: [], total: 0, month: '', year: 0 },
    walletVisibility: { cash: true, fawry: true, etisalat: true, cib_savings: true, aaib_savings: true },
    isProcessing: false, 
    formErrors: {},
    activeCategoryDetail: null,
    reconciliationModal: null
  });

  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [authLoading, setAuthLoading] = useState(true);
  const [pinVerified, setPinVerified] = useState(() => sessionStorage.getItem('pin_verified') === 'yes');
  const [cloudSyncStatus, setCloudSyncStatus] = useState('pending');
  const [isSaving, setIsSaving] = useState(false);
  
  const saveTimeoutRef = useRef(null);
  const processingTimeoutRef = useRef(null);
  const saveLockRef = useRef(false);
  const lastRemoteRef = useRef(null);
  const lastMaterializeRef = useRef('');
  const isSavingRef = useRef(false);
  const hasReceivedInitialSnapshot = useRef(false);
  const initialSnapshotTimeoutRef = useRef(null);
  
  const currentTxRef = useRef([]);
  const dataRef = useRef(null);
  const budgetsRef = useRef({});
  const saveQueueRef = useRef(Promise.resolve());
  const cloudSaveRetriesRef = useRef(0);
  
  const { 
    data, activeTab, selectedYear, selectedMonth, transViewMode, catViewType, 
    isFormOpen, formMode, formData, isDarkMode, expandedGroup, budgets, 
    editingCard, editingLoan, searchTerm, editingBudgetCategory, budgetAmount, 
    isRecurringModalOpen, recurringFormData, notifications, history, 
    expandedLedgers, expandedCardsSection, statusFilter, confirmDialog, 
    isQuickTransferModalOpen, quickTransferData, viewingCardStatement, 
    isPinChangeOpen, isSmsModalOpen, pendingCloseModal, 
    walletVisibility, isProcessing, formErrors, activeCategoryDetail,
    reconciliationModal
  } = state;
  
  const { 
    transactions = [], loans = [], cards = [], recurringItems = [], 
    accountsData = DEFAULT_ACCOUNTS, monthlyPlans = {} 
  } = data || {};

  const isOnline = useOnlineStatus();
  const prevOnlineRef = useRef(isOnline);

  useEffect(() => {
    currentTxRef.current = data?.transactions || [];
    dataRef.current = data;
    budgetsRef.current = budgets;
  }, [data?.transactions, data, budgets]);

  const addNotification = useCallback((notification) => 
    dispatch({ type: 'ADD_NOTIFICATION', payload: notification }), []);
  
  const removeNotification = useCallback((id) => 
    dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }), []);
  
  const saveHistory = useCallback(() => 
    dispatch({ 
      type: 'ADD_TO_HISTORY', 
      payload: { 
        data: JSON.parse(JSON.stringify(data)), 
        budgets: JSON.parse(JSON.stringify(budgets)) 
      } 
    }), [data, budgets]);

  /* ═══════════ Firestore Sync ═══════════ */
  const queueCloudSave = useCallback((newData, options = {}) => {
    if (!isAuthenticated || !hasReceivedInitialSnapshot.current) return;
    
    const { silent = false } = options;
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
    
    saveQueueRef.current = saveQueueRef.current.then(async () => {
      try {
        if (!silent) setIsSaving(true);
        const payloadStr = JSON.stringify(newData);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(newData)); } catch(e) {}
        
        const doc = await docRef.get();
        let finalData = { ...newData };
        
        if (doc.exists) {
          const remote = doc.data() || {};
          const remoteTx = Array.isArray(remote.transactions) ? remote.transactions : [];
          const localTx = Array.isArray(newData.transactions) ? newData.transactions : [];
          
          const permanentDeleted = new Set([
            ...(newData.deletedTxIds || []),
            ...(remote.deletedTxIds || [])
          ]);
          
          const mergedMap = new Map();
          remoteTx.forEach(t => { 
            if (t?.id && !permanentDeleted.has(t.id)) mergedMap.set(t.id, t); 
          });
          localTx.forEach(t => { 
            if (t?.id && !permanentDeleted.has(t.id)) mergedMap.set(t.id, t); 
          });
          
          finalData.transactions = Array.from(mergedMap.values())
            .filter(t => !t?.id || !(finalData.deletedTxIds || []).includes(t.id));
          finalData.deletedTxIds = Array.from(permanentDeleted).slice(-500);
          
          if (remote.budgets && typeof remote.budgets === 'object') {
            finalData.budgets = { ...remote.budgets, ...budgetsRef.current };
          }
        }
        
        await docRef.set({ ...finalData, budgets: finalData.budgets || budgetsRef.current }, { merge: true });
        lastRemoteRef.current = payloadStr;
        try { localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now())); } catch(e) {}
        cloudSaveRetriesRef.current = 0;
      } catch (err) {
        console.error('Queue save failed:', err);
        throw err;
      } finally {
        if (!silent) setTimeout(() => setIsSaving(false), 800);
      }
    }).catch(async (err) => {
      console.error('❌ Queue save failed, will retry:', err);
      const retries = cloudSaveRetriesRef.current + 1;
      if (retries <= 3) {
        cloudSaveRetriesRef.current = retries;
        await new Promise(r => setTimeout(r, 3000));
        saveQueueRef.current = Promise.resolve();
        return queueCloudSave(newData, options);
      }
      cloudSaveRetriesRef.current = 0;
      saveQueueRef.current = Promise.resolve();
      setIsSaving(false);
    });
    
    return saveQueueRef.current;
  }, [isAuthenticated]);

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((user) => {
      setAuthLoading(false);
      setIsAuthenticated(!!(user && user.email === ALLOWED_EMAIL));
    });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!isAuthenticated) return;
    materializeShoppingRecurring();
    const interval = setInterval(materializeShoppingRecurring, 60 * 60 * 1000);
    return () => clearInterval(interval);
  }, [isAuthenticated]);

  /* Firestore Snapshot */
  useEffect(() => {
    if (!isAuthenticated) return;
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
    
    initialSnapshotTimeoutRef.current = setTimeout(() => {
      if (!hasReceivedInitialSnapshot.current) {
        console.warn('⚠️ Firestore اتأخر — استخدام localStorage');
        hasReceivedInitialSnapshot.current = true;
        setCloudSyncStatus('offline');
      }
    }, 8000);

    const unsub = docRef.onSnapshot((doc) => {
      const isFirst = !hasReceivedInitialSnapshot.current;
      if (isFirst) {
        hasReceivedInitialSnapshot.current = true;
        if (initialSnapshotTimeoutRef.current) {
          clearTimeout(initialSnapshotTimeoutRef.current);
          initialSnapshotTimeoutRef.current = null;
        }
        setCloudSyncStatus('ready');
      }
      
      if (doc.exists) {
        const raw = doc.data();
        let migrated = migrateData(raw);
        
        const { transactions: cleanTx, removed } = dedupeRecurringTransactions(migrated.transactions || []);
        if (removed.length > 0) {
          console.log(`🧹 تنظيف ${removed.length} قيد مكرر من السحابة`);
          const newArchive = [...(migrated.deletedTxArchive || [])];
          const newDeletedIds = [...(migrated.deletedTxIds || [])];
          removed.forEach(r => {
            if (r.tx) {
              newArchive.push({ 
                ...r.tx, deletedAt: new Date().toISOString(), deletedBy: 'dedupe', 
                originalStatus: r.tx.status || 'pending', reason: 'dedupe_' + r.reason 
              });
              newDeletedIds.push(r.tx.id);
            }
          });
          migrated = {
            ...migrated,
            transactions: cleanTx,
            deletedTxArchive: newArchive.slice(-500),
            deletedTxIds: Array.from(new Set(newDeletedIds)).slice(-500)
          };
          setTimeout(() => queueCloudSave(migrated, { silent: true }), 500);
        }
        
        const permanentDeleted = new Set([
          ...(migrated.deletedTxIds || []),
          ...(currentTxRef.current.filter(t => t?._deleted).map(t => t.id))
        ]);
        
        migrated.transactions = (migrated.transactions || []).filter(t => 
          !t?.id || !permanentDeleted.has(t.id)
        );
        
        const remoteIds = new Set(migrated.transactions.map(t => t.id));
        const localOnly = currentTxRef.current.filter(t => 
          t?.id && !remoteIds.has(t.id) && !permanentDeleted.has(t.id)
        );
        
        const now = Date.now();
        const localOnlyToUpload = localOnly.filter(t => {
          if (t.sourceRecurringId) return true;
          if (t.recurringId) return true;
          if (t.createdAt) {
            const age = now - new Date(t.createdAt).getTime();
            if (age >= 0 && age < 60000) return true;
          }
          return false;
        });
        
        if (localOnlyToUpload.length > 0) {
          console.log(`📤 ${localOnlyToUpload.length} قيد محلي جديد — جاري رفعه للسحابة`);
          migrated.transactions = [...migrated.transactions, ...localOnlyToUpload];
          setTimeout(() => queueCloudSave(migrated, { silent: true }), 800);
        }
        
        const incoming = JSON.stringify(migrated);
        if (lastRemoteRef.current === incoming && !isFirst) return;
        lastRemoteRef.current = incoming;
        
        if (raw.budgets && typeof raw.budgets === 'object') {
          dispatch({ type: 'SET_BUDGETS', payload: raw.budgets });
        }
        dispatch({ type: 'SET_DATA', payload: migrated });
        console.log('☁️ تم استقبال البيانات من Firestore');
      } else if (isFirst) {
        console.log('📤 Firestore فاضي — أول استخدام');
      }
    }, (error) => {
      console.error('❌ Firestore error:', error);
      if (!hasReceivedInitialSnapshot.current) {
        hasReceivedInitialSnapshot.current = true;
        setCloudSyncStatus('offline');
      }
    });

    return () => {
      unsub();
      if (initialSnapshotTimeoutRef.current) clearTimeout(initialSnapshotTimeoutRef.current);
    };
  }, [isAuthenticated, queueCloudSave]);
  
  /* Auto-save */
  useEffect(() => {
    if (!isAuthenticated || !data?.transactions) return;
    if (!hasReceivedInitialSnapshot.current) return;
    
    if (cloudSyncStatus === 'offline') {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      return;
    }
    
    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(() => {
      if (isSavingRef.current) return;
      const payloadStr = JSON.stringify(data);
      if (lastRemoteRef.current && payloadStr === lastRemoteRef.current) return;
      isSavingRef.current = true;
      const safetyTimer = setTimeout(() => { isSavingRef.current = false; }, 8000);
      
      queueCloudSave(data, { silent: true }).finally(() => {
        clearTimeout(safetyTimer);
        isSavingRef.current = false;
      });
    }, 2000);
    return () => clearTimeout(saveTimeoutRef.current);
  }, [data, isAuthenticated, cloudSyncStatus, queueCloudSave]);
  
  /* Materialize recurring */
  useEffect(() => {
    if (!isAuthenticated || !data?.recurringItems?.length) return;
    const today = getLocalISODate();
    const activeCount = data.recurringItems.filter(r => r.active !== false).length;
    const loansSig = (data.loans || []).filter(l => l.systemId === SYSTEM_LOAN_IDS.TAKYEEF).map(l => `${l.id}:${l.prePaidAmount}:${l.totalAmount}`).join('|');
    const sig = `${today}_${data.recurringItems.length}_${activeCount}_${loansSig}`;
    if (lastMaterializeRef.current === sig) return;
    lastMaterializeRef.current = sig;
    
    let updated = materializeRecurringItems(data, today);
    if (updated) {
      const permanentDeleted = new Set(data.deletedTxIds || []);
      const filteredTx = updated.transactions.filter(t => !permanentDeleted.has(t.id));
      if (filteredTx.length !== updated.transactions.length) {
        updated = { ...updated, transactions: filteredTx };
      }
      const added = updated.transactions.length - (data.transactions?.length || 0);
      dispatch({ type: 'SET_DATA', payload: updated });
      
      setTimeout(() => queueCloudSave(updated, { silent: true }), 200);
      
      if (added > 0) {
        addNotification({ 
          type: 'info', 
          title: 'تم توليد التزامات شهرية', 
          message: `${added} بند متكرر بانتظار الاعتماد`, 
          duration: 6000 
        });
      }
    }
  }, [isAuthenticated, data?.recurringItems, data?.transactions?.length, data?.loans, addNotification, queueCloudSave]);

  /* Retry Firestore connection */
  useEffect(() => {
    if (!isAuthenticated || cloudSyncStatus !== 'offline') return;
    let cancelled = false;
    const retryTimer = setInterval(async () => {
      if (cancelled) return;
      try {
        await db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc).get({ source: 'server' });
        if (cancelled) return;
        hasReceivedInitialSnapshot.current = true;
        setCloudSyncStatus('ready');
        addNotification({ type: 'success', title: '✅ تم استعادة الاتصال بالسحابة', duration: 4000 });
      } catch (e) {}
    }, 30000);
    return () => { cancelled = true; clearInterval(retryTimer); };
  }, [isAuthenticated, cloudSyncStatus, addNotification]);

  /* Online/offline notifications */
  useEffect(() => {
    if (prevOnlineRef.current !== isOnline) {
      if (isOnline) {
        addNotification({ type: 'success', title: 'تم استعادة الاتصال', message: 'جاري المزامنة...', duration: 4000 });
        if (cloudSyncStatus === 'offline') setCloudSyncStatus('pending');
      } else {
        addNotification({ type: 'warning', title: 'انقطع الاتصال', message: 'التغييرات محفوظة محلياً', duration: 6000 });
      }
      prevOnlineRef.current = isOnline;
    }
  }, [isOnline, addNotification, cloudSyncStatus]);

  const cancelProcessing = useCallback(() => {
    if (processingTimeoutRef.current) { 
      clearTimeout(processingTimeoutRef.current); 
      processingTimeoutRef.current = null; 
    }
    saveLockRef.current = false;
    dispatch({ type: 'SET_IS_PROCESSING', payload: false });
    addNotification({ type: 'info', title: 'تم الإلغاء' });
  }, [addNotification]);

  /* ⭐ Compute all balances in one pass */
  const liveBalances = useMemo(() => computeAllBalances(data), [data]);
  
  const totalLiquidity = useMemo(() => 
    ACCOUNT_KEYS.reduce((s, k) => s + liveBalances[k], 0), [liveBalances]);
  
  const custodySummary = useMemo(() => 
    computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);

  /* Finance Snapshot */
  const financeSnapshot = useMemo(() => {
    const opening = getOpeningBalance(data, 'cash', selectedYear, selectedMonth);
    const actualCashInHand = liveBalances.cash || 0;
    const today = endOfToday();
    const curMonth = transactions.filter(t => 
      t.month === selectedMonth && (t.year || new Date(t.date).getFullYear()) === selectedYear
    );
    const actualIncome = curMonth.filter(t => 
      t.type === 'income' && t.status === 'paid' && t.method === 'cash' 
      && (parseISODate(t.date) || new Date()) <= today
    ).reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncome = curMonth.filter(t => 
      t.type === 'income' && t.status !== 'paid' && t.method === 'cash'
    ).reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidCash = curMonth.filter(t => 
      t.type === 'expense' && t.status === 'paid' && t.method === 'cash' 
      && (parseISODate(t.date) || new Date()) <= today
    ).reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingCash = curMonth.filter(t => 
      t.type === 'expense' && t.status !== 'paid' && t.method === 'cash'
    ).reduce((s, t) => s + safeNumber(t.amount), 0);
    
    const pendingIncomeAll = curMonth.filter(t => t.type === 'income' && t.status !== 'paid')
      .reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingExpensesAll = curMonth.filter(t => t.type === 'expense' && t.status !== 'paid')
      .reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidExpensesAll = curMonth.filter(t => t.type === 'expense' && t.status === 'paid')
      .reduce((s, t) => s + safeNumber(t.amount), 0);
    
    return { 
      opening, actualIncome, pendingIncome, paidCash, pendingCash, actualCashInHand, 
      pendingIncomeAll, pendingExpensesAll, paidExpensesAll,
      projectedClosingBalance: actualCashInHand + pendingIncomeAll - pendingExpensesAll 
    };
  }, [data, transactions, selectedYear, selectedMonth, liveBalances]);

  const chartData = useMemo(() => {
    const byMonth = new Map();
    transactions.forEach(t => {
      if (t.status !== 'paid') return;
      const y = t.year || 2026;
      if (y !== selectedYear) return;
      if (!byMonth.has(t.month)) byMonth.set(t.month, { income: 0, expense: 0 });
      const b = byMonth.get(t.month);
      if (t.type === 'income') b.income += safeNumber(t.amount);
      else if (t.type === 'expense') b.expense += safeNumber(t.amount);
    });
    return getMonthsForYear(selectedYear).map(m => ({
      name: m.slice(0, 3),
      'دخل': byMonth.get(m)?.income || 0,
      'مصروف': byMonth.get(m)?.expense || 0
    }));
  }, [transactions, selectedYear]);

  /* ⭐ updatedLoans — Optimized with hash */
  const loansHash = useMemo(() => {
    const txSig = transactions
      .filter(t => t.linkedLoanId || t.sourceReceivableId)
      .map(t => `${t.id}:${t.linkedLoanId || ''}:${t.sourceReceivableId || ''}:${t.status}:${t.amount}`)
      .join('|');
    const loansSig = loans.map(l => `${l.id}:${l.totalAmount}:${l.prePaidAmount}:${l.autoMonthly ? 1 : 0}`).join('|');
    const deletedSig = (data?.deletedTxIds || []).slice(-100).join(',');
    return `${txSig}#${loansSig}#${deletedSig}`;
  }, [transactions, loans, data?.deletedTxIds]);

  const updatedLoans = useMemo(() => {
    const permanentlyDeleted = new Set(data?.deletedTxIds || []);
    const map = transactions.reduce((acc, t) => { 
      if (t.linkedLoanId && t.status === 'paid') 
        acc[t.linkedLoanId] = (acc[t.linkedLoanId] || 0) + safeNumber(t.amount); 
      return acc; 
    }, {});
    const receivablesPaidMap = transactions.reduce((acc, t) => { 
      if (t.sourceReceivableId && t.status === 'paid') 
        acc[t.sourceReceivableId] = (acc[t.sourceReceivableId] || 0) + safeNumber(t.amount); 
      return acc; 
    }, {});

    const paymentsByLoanId = transactions.reduce((acc, t) => {
      if (t.linkedLoanId && t.status === 'paid') {
        if (!acc[t.linkedLoanId]) acc[t.linkedLoanId] = [];
        acc[t.linkedLoanId].push(t);
      }
      return acc;
    }, {});
    
    const txByKey = new Map();
    transactions.forEach(t => {
      if (t.type !== 'expense' || !t.category) return;
      if (permanentlyDeleted.has(t.id)) return;
      const key = `${t.category}|${t.year || 2026}|${t.month}`;
      if (!txByKey.has(key)) txByKey.set(key, []);
      txByKey.get(key).push(t);
    });
    
    const regular = loans.filter(l => !l.autoMonthly && !l.isReceivable).map(l => ({ 
      ...l, 
      isReceivable: l.type === 'receivable' || !!l.isReceivable, 
      totalPaid: safeNumber(l.prePaidAmount) + (map[l.id] || 0), 
      remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (map[l.id] || 0))) 
    }));
    
    const receivables = loans.filter(l => l.isReceivable).map(l => ({ 
      ...l, 
      isReceivable: true, 
      paused: !!l.paused, 
      totalPaid: safeNumber(l.prePaidAmount) + (receivablesPaidMap[l.id] || 0), 
      remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (receivablesPaidMap[l.id] || 0))) 
    }));
    
    const autoMonthly = [];
    const allMonths = YEARS_LIST.flatMap(y => getMonthsForYear(y).map(m => ({ year: y, month: m })));
    
    loans.filter(l => l.autoMonthly).forEach(tpl => {
      allMonths.forEach(({ year, month }) => {
        const monthKey = makeMonthKey(year, month);
        if (tpl.mergeIntoNextCycle && tpl.mergeIntoNextCycle.includes(monthKey)) return;
        
        let monthTx = txByKey.get(`${tpl.category}|${year}|${month}`) || [];
        
        const prevMonthIdx = getMonthIndex(month) - 1;
        let prevYear = year, prevMonthName;
        if (prevMonthIdx < 0) { prevMonthName = ALL_MONTHS[11]; prevYear = year - 1; } 
        else { prevMonthName = ALL_MONTHS[prevMonthIdx]; }
        const prevMonthKey = makeMonthKey(prevYear, prevMonthName);
        
        if (tpl.mergeIntoNextCycle && tpl.mergeIntoNextCycle.includes(prevMonthKey)) {
          const prevMonthTx = txByKey.get(`${tpl.category}|${prevYear}|${prevMonthName}`) || [];
          monthTx = [...prevMonthTx, ...monthTx];
        }
        
        if (monthTx.length === 0) return;
        
        const dueDay = safeNumber(tpl.dueDay, 5);
        let dueMonthIdx = getMonthIndex(month) + (tpl.dueNextMonth ? 1 : 0);
        let dueYear = year;
        if (dueMonthIdx > 11) { dueMonthIdx = 0; dueYear++; }
        const dueDateISO = `${dueYear}-${String(dueMonthIdx + 1).padStart(2, '0')}-${String(dueDay).padStart(2, '0')}`;
        const total = monthTx.reduce((s, t) => s + safeNumber(t.amount), 0);
        const compositeId = `auto-${tpl.id}-${year}-${month}`;
        const repayments = safeNumber(map[compositeId]);
        
        autoMonthly.push({ 
          ...tpl, 
          id: compositeId, 
          name: `${tpl.name} - ${month} ${year}`, 
          totalAmount: total, 
          prePaidAmount: 0, 
          monthlyInstallment: 0, 
          remaining: Math.max(0, total - repayments), 
          totalPaid: repayments, 
          dueDate: dueDateISO, 
          dueDay, 
          description: `${monthTx.length} مسحوبة`, 
          autoGenerated: true, 
          month, year, 
          items: monthTx.slice().sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)),
          payments: (paymentsByLoanId[compositeId] || []).slice().sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0))
        });
      });
    });
    
    const sortedAuto = autoMonthly.sort((a, b) => { 
      if (a.year !== b.year) return b.year - a.year; 
      return getMonthIndex(b.month) - getMonthIndex(a.month); 
    });
    
    return [...sortedAuto, ...receivables, ...regular];
  }, [loansHash]);

  const monthInsights = useMemo(() => {
    const m = transactions.filter(t => 
      t.month === selectedMonth && (t.year || 2026) === selectedYear
    );
    const inc = m.filter(t => t.type === 'income' && t.status === 'paid')
      .reduce((s, t) => s + safeNumber(t.amount), 0);
    const exp = m.filter(t => t.type === 'expense' && t.status === 'paid')
      .reduce((s, t) => s + safeNumber(t.amount), 0);
    return { inc, exp, net: inc - exp };
  }, [transactions, selectedYear, selectedMonth]);

  const monthCashback = useMemo(() => {
    const trackers = (data?.cashbackTrackers || []).filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
    const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
    const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
    return { expected, received, pending: expected - received };
  }, [data?.cashbackTrackers, selectedMonth, selectedYear]);

  const bankFeesMonth = useMemo(() => transactions.filter(t => 
    t.status === 'paid' && t.type === 'expense' && BANK_FEE_CATEGORIES.has(t.category) 
    && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).reduce((s, t) => s + safeNumber(t.amount), 0), [transactions, selectedMonth, selectedYear]);

  const groupedTransactions = useMemo(() => {
    const groups = {};
    const term = normalizeText(searchTerm);
    transactions.filter(t => {
      if (t.month !== selectedMonth || (t.year || 2026) !== selectedYear) return false;
      if (transViewMode !== 'all' && t.type !== transViewMode) return false;
      if (searchTerm && !normalizeText(t.description).includes(term) && !normalizeText(t.category).includes(term)) return false;
      if (statusFilter === 'paid' && t.status !== 'paid') return false;
      if (statusFilter === 'pending' && t.status === 'paid') return false;
      return true;
    }).forEach(t => {
      if (!groups[t.category]) groups[t.category] = { category: t.category, total: 0, count: 0, items: [] };
      groups[t.category].total += safeNumber(t.amount);
      groups[t.category].count++;
      groups[t.category].items.push(t);
    });
    return Object.values(groups).sort((a, b) => b.total - a.total);
  }, [transactions, selectedYear, selectedMonth, transViewMode, searchTerm, statusFilter]);

  /* ⭐ buildLedger — piasters-based */
  const buildLedger = useCallback((methodId) => {
    const cutoffDay = dayStart(getAccountCutoff(accountsData, methodId));
    const acc = transactions
      .filter(t => 
        t.method === methodId && t.status === 'paid' 
        && t.source !== 'carryover'
        && !(methodId === 'cash' && isHanyShopCategory(t.category))
        && (parseISODate(t.date) || new Date(0)) >= cutoffDay
      )
      .sort((a, b) => (parseISODate(a.date) || 0) - (parseISODate(b.date) || 0));
    
    let balPiasters = toPiasters(accountsData?.[methodId]?.balance);
    return acc.map(t => { 
      const a = toPiasters(t.amount); 
      balPiasters += (t.subType === 'deposit') ? a : -a; 
      return { ...t, runningBalance: fromPiasters(balPiasters) }; 
    }).reverse();
  }, [transactions, accountsData]);

  const getAgendaItems = useCallback(() => {
    try {
      const today = new Date();
      const cd = today.getDate(), cm = today.getMonth(), cy = today.getFullYear();
      const items = [];
      
      cards.forEach(c => {
        const d = parseInt(c.dueDate) || 5;
        let tm = cm, ty = cy;
        if (d < cd) { tm++; if (tm > 11) { tm = 0; ty++; } }
        items.push({ 
          id: `ag-card-${c.id}`, 
          title: `سداد ${c.bank} - ${c.name}`, 
          date: getLocalISODate(new Date(ty, tm, d)), 
          amount: Math.max(0, computeCardDebt(data, c)), 
          type: 'warning', icon: CreditCard, desc: 'استحقاق دوري' 
        });
      });
      
      updatedLoans.forEach(l => {
        if (safeNumber(l.monthlyInstallment) > 0 && l.remaining > 0 && !l.autoGenerated && !l.isReceivable) {
          const d = parseInt(l.dueDay) || 1;
          let tm = cm, ty = cy;
          if (d < cd) { tm++; if (tm > 11) { tm = 0; ty++; } }
          if (isLoanActiveInMonth(l, ty, ALL_MONTHS[tm])) {
            items.push({ 
              id: `ag-loan-${l.id}`, 
              title: `قسط ${l.name}`, 
              date: getLocalISODate(new Date(ty, tm, d)), 
              amount: safeNumber(l.monthlyInstallment), 
              type: 'danger', icon: Banknote, desc: l.description 
            });
          }
        }
        
        if (l.isReceivable && !l.paused && l.remaining > 0 && safeNumber(l.monthlyInstallment) > 0) {
          const d = parseInt(l.dueDay) || 1;
          let tm = cm, ty = cy;
          if (d < cd) { tm++; if (tm > 11) { tm = 0; ty++; } }
          items.push({ 
            id: `ag-recv-${l.id}`, 
            title: `تحصيل ${l.name}`, 
            date: getLocalISODate(new Date(ty, tm, d)), 
            amount: safeNumber(l.monthlyInstallment), 
            type: 'success', icon: TrendingUp, desc: '💰 مستحق لك' 
          });
        }
      });
      
      recurringItems.forEach(r => {
        if (r.active === false) return;
        if (r.linkedLoanSystemId) return;
        const d = parseInt(r.day) || 1;
        let tm = cm, ty = cy;
        if (d < cd) { tm++; if (tm > 11) { tm = 0; ty++; } }
        const targetInputMonth = `${ty}-${String(tm + 1).padStart(2, '0')}`;
        if (r.startMonth && targetInputMonth < r.startMonth) return;
        if (r.endMonth && targetInputMonth > r.endMonth) return;
        const isIncome = r.type === 'income';
        const isFee = BANK_FEE_CATEGORIES.has(r.category);
        const isMonthlyBen = isBeneficiaryCategorySafe(r.category);
        const desc = isIncome ? '💰 دخل شهري متكرر' 
          : isMonthlyBen ? '👨‍👩‍👧 مصروف شهري' 
          : isFee ? '🏦 رسم بنكي شهري' 
          : 'التزام شهري متكرر';
        const icon = isIncome ? TrendingUp : isMonthlyBen ? Users : isFee ? Receipt : Repeat;
        items.push({ 
          id: `ag-rec-${r.id}`, 
          date: getLocalISODate(new Date(ty, tm, d)), 
          title: r.title, amount: safeNumber(r.amount), 
          type: isIncome ? 'success' : 'warning', icon, desc 
        });
      });
      
      return items.sort((a, b) => (parseISODate(a.date) || 0) - (parseISODate(b.date) || 0));
    } catch (err) { 
      console.error(err); 
      return []; 
    }
  }, [cards, updatedLoans, recurringItems, data]);

  const openWalletForm = useCallback((walletKey, kind) => {

    dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
    dispatch({

        category: 'شحن محفظة', amount: '', 
        description: kind === 'deposit' ? `إيداع ${w}` : `سحب من ${w}`,

  const handleAddWalletDeposit = useCallback((k) => openWalletForm(k, 'deposit'), [openWalletForm]);
  const handleAddWalletWithdrawal = useCallback((k) => openWalletForm(k, 'withdrawal'), [openWalletForm]);

  /* Save Transaction */
  const handleSaveTransaction = useCallback((e) => {
    e.preventDefault();
    if (isProcessing || saveLockRef.current) return;
    saveLockRef.current = true;
    const errors = {};
    
    const amountCheck = validateAmount(formData.amount, { min: 0.01, max: 10000000, label: 'المبلغ' });
    if (!amountCheck.valid) errors.amount = amountCheck.error;
    if (!formData.category) errors.category = 'اختر الفئة';
    if (!formData.date) errors.date = 'اختر التاريخ';
    
    if (Object.keys(errors).length > 0) { 
      saveLockRef.current = false; 
      dispatch({ type: 'SET_FORM_ERRORS', payload: errors }); 
      addNotification({ type: 'error', title: 'خطأ', message: Object.values(errors)[0] }); 
      return; 
    }
    
    const amount = roundMoney(amountCheck.value);
    const d = parseISODate(formData.date);
    if (!d) { 
      saveLockRef.current = false; 
      addNotification({ type: 'error', title: 'تاريخ غير صالح' }); 
      return; 
    }
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    
    if (formMode === 'edit') {
      const orig = transactions.find(t => t.id === formData.id);
      if (orig && isMonthClosed(data, orig.year || 2026, orig.month)) { 
        saveLockRef.current = false; 
        addNotification({ type: 'error', title: 'محظور' }); 
        return; 
      }
    }
    if (isMonthClosed(data, txYear, txMonth)) { 
      saveLockRef.current = false; 
      addNotification({ type: 'error', title: 'محظور', message: `شهر ${txMonth} مغلق` }); 
      return; 
    }
    
    if (PAYMENT_METHODS_WITHOUT_ACCOUNT.has(formData.method) && formData.status === 'paid') {
      addNotification({ 
        type: 'warning', 
        title: '⚠️ طريقة دفع بلا حساب', 
        message: `${PAYMENT_METHODS.find(p => p.id === formData.method)?.label || formData.method} لا يُخصم من أي رصيد.`, 
        duration: 8000 
      });
    }
    
    dispatch({ type: 'SET_IS_PROCESSING', payload: true });
    processingTimeoutRef.current = setTimeout(() => {
      try {
        saveHistory();
        const finalSubType = formData.subType || (formData.type === 'income' ? 'deposit' : 'withdrawal');
        const status = formData.status || 'pending';
        let syncLinkedCardId = formData.linkedCardId;
        let syncCardLast4 = formData.cardLast4;
        
        if (CREDIT_CARD_METHOD_IDS.includes(formData.method)) {
          const matchingCard = cards.find(c => getCardMethod(c) === formData.method);
          if (matchingCard && syncLinkedCardId !== matchingCard.id) { 
            syncLinkedCardId = matchingCard.id; 
            syncCardLast4 = undefined; 
          }
        } else { 
          syncLinkedCardId = undefined; 
          syncCardLast4 = undefined; 
        }
        
        const newTx = { 
          ...formData, 
          id: formMode === 'edit' ? formData.id : getSafeId(), 
          amount, 
          month: txMonth, year: txYear, monthIndex: d.getMonth(), 
          date: formData.date, subType: finalSubType, status, 
          linkedCardId: syncLinkedCardId, cardLast4: syncCardLast4,
          createdAt: formData.createdAt || new Date().toISOString()
        };
        
        const next = formMode === 'add' 
          ? [...transactions, newTx] 
          : transactions.map(t => t.id === newTx.id ? { ...newTx } : t);
        next.sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
        
        dispatch({ type: 'UPDATE_TRANSACTIONS', payload: next });
        dispatch({ type: 'SET_FORM_OPEN', payload: false });
        addNotification({ 
          type: 'success', 
          title: status === 'paid' ? 'تم الحفظ والاعتماد' : 'تم الحفظ كمعلق' 
        });
      } catch (err) {
        console.error('Save transaction error:', err);
        addNotification({ type: 'error', title: 'فشل الحفظ', message: err.message || 'خطأ غير متوقع' });
      }
      saveLockRef.current = false;
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
      processingTimeoutRef.current = null;

  /* ⭐ RECONCILE HANDLER */
  const handleReconcile = useCallback((payload) => {

    dispatch({ 
      type: 'RECONCILE_ACCOUNT', 
      payload: { 
        ...payload, 
        year: selectedYear, 
        month: selectedMonth 
      } 
    });
    addNotification({ 
      type: 'success', 
      title: 'تمت المطابقة', 
      message: `تسوية ${fmt(payload.diff)} ج.م — ${ACCOUNT_SHORT_NAMES[payload.accountKey]}`, 
      duration: 6000 
    });
  }, [saveHistory, addNotification, selectedYear, selectedMonth]);

  /* Delete Handlers */
  const handleDelete = useCallback((id, reason = 'user_action') => {
    const freshTx = currentTxRef.current;
    const freshData = dataRef.current;
    const target = freshTx.find(t => t.id === id);
    if (!target) return;
    
    if (isMonthClosed(freshData, target.year || 2026, target.month)) {
      addNotification({ type: 'error', title: 'محظور', message: 'الشهر مغلق' });
      return;
    }
    
    const isTransfer = !!target.linkedTransferId;
    const linkedIds = isTransfer 
      ? freshTx.filter(t => t.linkedTransferId === target.linkedTransferId).map(t => t.id)
      : [id];
    const linkedCount = linkedIds.length;
    
    if (isTransfer) {
      const blockedLink = linkedIds
        .map(lid => freshTx.find(x => x.id === lid))
        .find(t => t && isMonthClosed(freshData, t.year || 2026, t.month));
      if (blockedLink) {
        addNotification({ 
          type: 'error', title: 'محظور', 
          message: `قيد مرافق في شهر ${blockedLink.month} ${blockedLink.year} مغلق` 
        });
        return;
      }
    }
    
    dispatch({ 
      type: 'SHOW_CONFIRM', danger: true, 
      title: isTransfer ? `حذف التحويل (${linkedCount} قيود)` : 'تأكيد الحذف', 
      message: isTransfer 
        ? `هذا التحويل يتكون من ${linkedCount} قيود مترابطة.\nسيتم حذفها كلها معاً ونقلها للأرشيف.`
        : 'سيتم نقلها للأرشيف مع إمكانية الاسترجاع', 
      onConfirm: () => {
        const latestTx = currentTxRef.current;
        const latestData = dataRef.current;
        
        saveHistory();
        const tombstones = [];
        linkedIds.forEach(lid => {
          const t = latestTx.find(x => x.id === lid);
          if (!t) return;
          tombstones.push({
            ...t, deletedAt: new Date().toISOString(),
            deletedBy: isFamilyTx(t) ? (t.createdBy || 'family') : 'self',
            originalStatus: t.status || 'pending', reason
          });
        });
        
        const newArchive = [...(latestData.deletedTxArchive || []), ...tombstones].slice(-500);
        const linkedSet = new Set(linkedIds);
        const persistedDeleted = Array.from(new Set([...(latestData.deletedTxIds || []), ...linkedIds])).slice(-500);
        const newTx = latestTx.filter(t => !linkedSet.has(t.id));
        const finalTx = newTx.filter(t => !persistedDeleted.includes(t.id));
        const newMaterialized = { ...(latestData.materializedRecurring || {}) };
        tombstones.forEach(t => {
          if (t.sourceRecurringId && t.year && t.month) {
            newMaterialized[`${t.sourceRecurringId}_${makeMonthKey(t.year, t.month)}`] = 'deleted';
          }
        });
        
        const newData = { 
          ...latestData, transactions: finalTx,
          deletedTxArchive: newArchive, deletedTxIds: persistedDeleted, 
          materializedRecurring: newMaterialized 
        };
        dispatch({ type: 'SET_DATA', payload: newData });
        queueCloudSave(newData);
        addNotification({ type: 'success', title: `تم حذف ${linkedCount} قيد`, duration: 5000 });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  }, [saveHistory, addNotification, queueCloudSave]);

  const handleBulkDeleteInApp = useCallback((ids) => {
    if (!Array.isArray(ids) || ids.length === 0) return;
    saveHistory();
    
    const latestTx = currentTxRef.current;
    const latestData = dataRef.current;
    
    const expandedSet = new Set(ids);
    ids.forEach(id => {
      const t = latestTx.find(x => x.id === id);
      if (t?.linkedTransferId) {
        latestTx
          .filter(x => x.linkedTransferId === t.linkedTransferId)
          .forEach(x => expandedSet.add(x.id));
      }
    });
    const finalIds = Array.from(expandedSet);
    const idsSet = new Set(finalIds);
    
    const tombstones = finalIds.map(id => {
      const t = latestTx.find(x => x.id === id);
      if (!t) return null;
      return { 
        ...t, deletedAt: new Date().toISOString(), 
        deletedBy: isFamilyTx(t) ? (t.createdBy || 'family') : 'self', 
        originalStatus: t.status || 'pending', reason: 'bulk_delete' 
      };
    }).filter(Boolean);
    
    const newArchive = [...(latestData.deletedTxArchive || []), ...tombstones].slice(-500);
    const newTx = latestTx.filter(t => !idsSet.has(t.id));
    const persistedDeleted = Array.from(new Set([...(latestData.deletedTxIds || []), ...finalIds])).slice(-500);
    const newMaterialized = { ...(latestData.materializedRecurring || {}) };
    tombstones.forEach(t => { 
      if (t.sourceRecurringId && t.year && t.month) 
        newMaterialized[`${t.sourceRecurringId}_${makeMonthKey(t.year, t.month)}`] = 'deleted'; 
    });
    
    const newData = { 
      ...latestData, transactions: newTx, 
      deletedTxArchive: newArchive, deletedTxIds: persistedDeleted, 
      materializedRecurring: newMaterialized 
    };
    dispatch({ type: 'SET_DATA', payload: newData });
    queueCloudSave(newData);
    addNotification({ 
      type: 'success', 
      title: `تم حذف ${finalIds.length} قيد${finalIds.length > ids.length ? ` (شمل ${finalIds.length - ids.length} مرتبط)` : ''}` 
    });
  }, [saveHistory, addNotification, queueCloudSave]);

  /* Quick Transfer */
  const handleQuickTransfer = useCallback((e) => {

    if (isProcessing || saveLockRef.current) return;
    saveLockRef.current = true;
    const transferMode = quickTransferData.transferMode || 'monthly';
    
    if (transferMode === 'internal') {
      const amountCheck = validateAmount(quickTransferData.amount, { min: 0.01, max: 10000000, label: 'المبلغ' });
      if (!amountCheck.valid) { 
        saveLockRef.current = false; 
        addNotification({ type: 'error', title: 'خطأ', message: amountCheck.error }); 
        return; 
      }
      const amount = roundMoney(amountCheck.value);
      const fees = roundMoney(parseNumberInput(quickTransferData.internalFees || 0));
      const from = quickTransferData.internalFrom || 'cib_savings';
      const to = quickTransferData.internalTo || 'fawry';
      const dateStr = quickTransferData.date || getLocalISODate();
      const d = parseISODate(dateStr);
      
      if (!d) {

      }
      const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];

      if (from === to) { 
        saveLockRef.current = false; 
        addNotification({ type: 'error', title: 'اختر حسابين مختلفين' }); 
        return; 
      }
      if (fees < 0) { 
        saveLockRef.current = false; 
        addNotification({ type: 'error', title: 'الرسوم لا تكون سالبة' }); 
        return; 
      }
      
      dispatch({ type: 'SET_IS_PROCESSING', payload: true });
      processingTimeoutRef.current = setTimeout(() => {
        try {
          saveHistory();
          const transferId = getSafeId();
          const date = getLocalISODate(d);
          const fromLabel = PAYMENT_METHODS.find(p => p.id === from)?.label || from;
          const toLabel = PAYMENT_METHODS.find(p => p.id === to)?.label || to;
          const description = (quickTransferData.internalDescription || '').trim() || `تحويل من ${fromLabel} إلى ${toLabel}`;
          
          const now = new Date().toISOString();
          const txs = [
            {
              id: getSafeId(), type: 'expense', kind: KIND.FINANCIAL,
              category: 'تحويلات', amount,
              description: `${description} (خروج)`,
              method: from, date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
              subType: 'withdrawal', status: 'paid',
              linkedTransferId: transferId, transferDirection: 'out', createdAt: now
            },
            {
              id: getSafeId(), type: 'income', kind: KIND.FINANCIAL,
              category: 'تحويلات واردة', amount,
              description: `${description} (دخول)`,
              method: to, date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
              subType: 'deposit', status: 'paid',
              linkedTransferId: transferId, transferDirection: 'in', createdAt: now
            }
          ];
          
          if (fees > 0) {
            txs.push({
              id: getSafeId(), type: 'expense', kind: KIND.FINANCIAL,
              category: 'رسوم تحويلات', amount: fees,
              description: `رسوم تحويل — ${description}`,
              method: from, date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
              subType: 'withdrawal', status: 'paid',
              linkedTransferId: transferId, transferDirection: 'fee', createdAt: now
            });
          }
          
          const allTxs = [...txs, ...transactions].sort((a, b) => 
            (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
          dispatch({ type: 'UPDATE_TRANSACTIONS', payload: allTxs });
          dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
          dispatch({ 
            type: 'SET_QUICK_TRANSFER_DATA', 
            payload: { 
              transferMode: 'monthly', from: 'cib_savings', to: 'fawry', amount: '', 
              transferType: 'monthly', date: getLocalISODate(), beneficiaryId: null, 
              forceCash: false, internalFrom: 'cib_savings', internalTo: 'fawry', 
              internalFees: '', internalDescription: ''
            } 
          });
          
          addNotification({ 
            type: 'success', title: 'تم التحويل بنجاح', 
            message: `${fmt(amount)} ج.م من ${fromLabel} إلى ${toLabel}${fees > 0 ? ` + رسوم ${fmt(fees)}` : ''}`, 
            duration: 6000 
          });
        } catch (err) {
          console.error('Internal transfer error:', err);
          addNotification({ type: 'error', title: 'فشل التحويل', message: err.message });
        }
        saveLockRef.current = false;
        dispatch({ type: 'SET_IS_PROCESSING', payload: false });
        processingTimeoutRef.current = null;
      }, 600);
      return;
    }
    
    const transferType = quickTransferData.transferType || 'monthly';
    const amountCheck = validateAmount(quickTransferData.amount, { min: 0.01, max: 10000000, label: 'المبلغ' });
    if (!amountCheck.valid) { 
      saveLockRef.current = false; 
      addNotification({ type: 'error', title: 'خطأ', message: amountCheck.error }); 
      return; 
    }
    const amount = roundMoney(amountCheck.value);
    const dateStr = quickTransferData.date || getLocalISODate();
    const d = parseISODate(dateStr);
    if (!d) { 
      saveLockRef.current = false; 
      addNotification({ type: 'error', title: 'تحقق', message: 'تاريخ غير صحيح' }); 
      return; 
    }
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { 
      saveLockRef.current = false; 
      addNotification({ type: 'error', title: 'محظور' }); 
      return; 
    }
    if (transferType === 'monthly' && !quickTransferData.beneficiaryId) { 
      saveLockRef.current = false; 
      addNotification({ type: 'error', title: 'اختر المستفيد' }); 
      return; 
    }
    
    dispatch({ type: 'SET_IS_PROCESSING', payload: true });
    processingTimeoutRef.current = setTimeout(() => {
      saveHistory();
      const date = getLocalISODate(d);
      const txs = [];
      
      if (transferType === 'monthly') {
        const ben = BENEFICIARIES.find(b => b.id === quickTransferData.beneficiaryId);
        const isFromBank = quickTransferData.from === 'cib_savings' || quickTransferData.from === 'aaib_savings';
        const useTelda = isFromBank && ben.hasTelda && !quickTransferData.forceCash;
        txs.push({
          id: 'monthly-' + getSafeId(), type: 'expense', kind: KIND.OPERATIONAL,
          category: `مصروف شهري - ${ben.label}`, amount,
          description: useTelda ? `مصروف شهري - ${ben.label} (عبر Telda)` : `مصروف شهري - ${ben.label}`,
          method: quickTransferData.from,
          transferChannel: useTelda ? ben.method : undefined,
          date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
          subType: 'withdrawal', status: 'paid', beneficiaryId: ben.id,
          createdAt: new Date().toISOString()
        });
      }
      
      dispatch({ 
        type: 'UPDATE_TRANSACTIONS', 
        payload: [...txs, ...transactions].sort((a, b) => 
          (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) 
      });
      dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
      dispatch({ 
        type: 'SET_QUICK_TRANSFER_DATA', 
        payload: { 
          transferMode: 'monthly', from: 'cib_savings', to: 'fawry', amount: '', 
          transferType: 'monthly', date: getLocalISODate(), beneficiaryId: null, 
          forceCash: false, internalFrom: 'cib_savings', internalTo: 'fawry', 
          internalFees: '', internalDescription: ''
        } 
      });
      addNotification({ type: 'success', title: 'تم التسجيل' });
      saveLockRef.current = false;
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
      processingTimeoutRef.current = null;
    }, 600);
  }, [quickTransferData, data, transactions, saveHistory, addNotification, isProcessing]);

  const handleUpdateLoan = useCallback((e) => {

    dispatch({

        monthlyInstallment: safeNumber(editingLoan.monthlyInstallment), 
        dueDay: safeNumber(editingLoan.dueDay, 1), 
        paused: !!editingLoan.paused, 
        totalInstallments: safeNumber(editingLoan.totalInstallments),

      } : l) 
    });
    dispatch({ type: 'SET_EDITING_LOAN', payload: null });
    addNotification({ type: 'success', title: 'تم التحديث' });
  }, [loans, editingLoan, saveHistory, addNotification]);

      payload: cards.map(c => c.id === editingCard.id ? {

      addNotification({ type: 'error', title: 'خطأ', message: titleCheck.error }); 
      return;

    const amountCheck = validateAmount(recurringFormData.amount, { min: 0.01, max: 10000000, label: 'المبلغ' });

      addNotification({ type: 'error', title: 'خطأ', message: amountCheck.error }); 
      return; 
    }
    saveHistory();
    
    const payload = { 
      title: titleCheck.value, amount: roundMoney(amountCheck.value),

      category: recurringFormData.category, type: recurringFormData.type, 
      startMonth: recurringFormData.startMonth || null, 
      endMonth: recurringFormData.endMonth || null,

      dispatch({ 
        type: 'UPDATE_RECURRING_ITEMS', 
        payload: [...recurringItems, { ...payload, id: 'r-' + getSafeId() }] 
      });
      addNotification({ type: 'success', title: 'تمت الإضافة' });
    }
    
    dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false });
    dispatch({ 
      type: 'SET_RECURRING_FORM_DATA', 
      payload: { 
        title: '', amount: '', day: 1, category: 'أخرى', type: 'expense', 
        startMonth: '', endMonth: '', active: true, method: 'cash', 
        kind: null, linkedLoanSystemId: null, linkedCardId: null, transferChannel: null 
      } 
    });
  }, [recurringFormData, recurringItems, saveHistory, addNotification]);

  const deleteRecurring = useCallback((id) => {
    const pendingFromThis = (data.transactions || []).filter(t => 
      t.sourceRecurringId === id && t.status !== 'paid'
    );
    const blocked = pendingFromThis.find(t => isMonthClosed(data, t.year || 2026, t.month));
    if (blocked) {
      addNotification({ 
        type: 'error', title: 'الشهر مغلق', 
        message: `لا يمكن حذف البند — له قيود في شهر ${blocked.month} ${blocked.year}` 
      });
      return;
    }
    
    dispatch({ 
      type: 'SHOW_CONFIRM', danger: true, title: 'حذف الالتزام', 
      message: 'سيتم حذف البند والقيود المعلقة المرتبطة', 
      onConfirm: () => {
        saveHistory();
        const isDefault = DEFAULT_RECURRING.some(dr => dr.id === id);
        const newDeletedDefaults = isDefault
          ? Array.from(new Set([...(data.deletedDefaultIds || []), id]))
          : (data.deletedDefaultIds || []);
        const newRecurring = recurringItems.filter(i => i.id !== id);
        const newTx = (data.transactions || []).filter(t => !(t.sourceRecurringId === id && t.status !== 'paid'));
        const newMaterialized = { ...(data.materializedRecurring || {}) };
        Object.keys(newMaterialized).forEach(k => { 
          if (k.startsWith(id + '_')) delete newMaterialized[k]; 
        });
        dispatch({ 
          type: 'SET_DATA', 
          payload: { 
            ...data, recurringItems: newRecurring, transactions: newTx, 
            deletedDefaultIds: newDeletedDefaults, materializedRecurring: newMaterialized 
          } 
        });
        addNotification({ type: 'success', title: 'تم الحذف نهائياً' });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  }, [recurringItems, data, saveHistory, addNotification]);

  const handleExport = useCallback(() => {
    const blob = new Blob([JSON.stringify({ data, budgets, exportedAt: new Date().toISOString(), version: 'V84' })], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; 
    a.download = `finance_backup_${getLocalISODate()}.json`; 
    a.click();
    URL.revokeObjectURL(url);
    addNotification({ type: 'success', title: 'تم التصدير' });
  }, [data, budgets, addNotification]);

  const handleImport = useCallback((e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        if (parsed.data) {
          saveHistory();
          dispatch({ type: 'SET_DATA', payload: migrateData(parsed.data) });
          if (parsed.budgets) dispatch({ type: 'SET_BUDGETS', payload: parsed.budgets });
          addNotification({ type: 'success', title: 'تم الاستيراد' });
        }
      } catch { 
        addNotification({ type: 'error', title: 'ملف غير صالح' }); 
      }
    };
    reader.readAsText(file);
  }, [saveHistory, addNotification]);

  const handlePendingCloseAction = useCallback((action) => {
    const { pending, month, year } = pendingCloseModal;
    if (!pending || pending.length === 0) return;
    
    if (action === 'carry') {
      const idx = getMonthIndex(month);
      const nextMonth = idx === 11 ? ALL_MONTHS[0] : ALL_MONTHS[idx + 1];
      const nextYear = idx === 11 ? year + 1 : year;
      const nextKey = makeMonthKey(nextYear, nextMonth);
      if ((data.closedMonths || []).includes(nextKey)) { 
        addNotification({ 
          type: 'error', title: 'لا يمكن الترحيل', 
          message: `شهر ${nextMonth} ${nextYear} مغلق.`, duration: 7000 
        }); 
        return; 
      }
    }
    
    saveHistory();
    const pendingIds = pending.map(t => t.id);
    dispatch({ type: 'CLOSE_MONTH_AFTER_RESOLVE', payload: { year, month, resolveAction: action, pendingIds } });
    const actionText = action === 'approve' ? 'تم الاعتماد والإقفال' 
      : action === 'carry' ? 'تم الترحيل والإقفال' 
      : 'تم الحذف والإقفال';
    addNotification({ type: 'success', title: actionText, message: `شهر ${month} ${year}` });
  }, [pendingCloseModal, data, saveHistory, addNotification]);

  }, [budgets]);

    localStorage.setItem('theme', isDarkMode ? 'dark' : 'light'); 
  }, [isDarkMode]);
  
  useEffect(() => { 
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDarkMode ? '#050A14' : '#F4F7FB'); 
  }, [isDarkMode]);
  
  useEffect(() => () => {
