const getAccountCutoff = (accountsData, key) => { const iso = accountsData?.[key]?.lastUpdated; if (!iso) return new Date(0); const d = new Date(iso); return isNaN(d) ? new Date(0) : d; };

const getCardMethod = (card) => { if (!card) return null; if (card.bank === 'CIB' && card.name === 'SWYPE') return 'cib_swype'; if (card.bank === 'AAIB') return 'aaib_card'; return 'cib_card'; };

const _cardDebtCache = new WeakMap();

const computeCardDebt = (data, card, asOfDate) => {

const getClosingBalance = (data, key, year, month) => {

const deriveDefaultCutoff = (txs) => { const dates = (txs || []).filter(t => t.status === 'paid' && t.date).map(t => t.date).sort(); if (dates.length === 0) return '2026-08-31'; const d = new Date(dates[0]); d.setDate(d.getDate() - 1); return getLocalISODate(d); };

const computeCustodyBalance = (entries) => {

const computeCashbackSummary = (trackers) => { if (!Array.isArray(trackers)) return { expected: 0, received: 0, pending: 0, list: [] }; const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0); const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0); return { expected, received, pending: expected - received, list: trackers }; };

const migrateCards = (cards) => { if (!Array.isArray(cards)) return DEFAULT_CARDS; return cards.map(c => { if (c.openingDebt !== undefined && c.availableBalance !== undefined) return { ...c, cashbackRate: c.cashbackRate !== undefined ? safeNumber(c.cashbackRate) : 1 }; const limit = safeNumber(c.limit); const oldOpening = safeNumber(c.openingBalance); return { ...c, openingDebt: Math.max(0, limit - oldOpening), availableBalance: oldOpening, cashbackRate: safeNumber(c.cashbackRate, 1) }; }); };

  if (closed.length > 0 && !closed.every(k => /^\d{4}-/.test(k))) closed = closed.map(m => /^\d{4}-/.test(m) ? m : makeMonthKey(2026, m));

const migrateTransaction = (t) => {

const migrateRecurringItems = (items) => { if (!Array.isArray(items)) return DEFAULT_RECURRING; return items.map(r => { const migrated = { ...r }; if (migrated.active === undefined) migrated.active = true; if (migrated.startMonth === undefined) migrated.startMonth = null; if (migrated.endMonth === undefined) migrated.endMonth = null; if (r.title && r.title.includes('تكييف محمود') && !migrated.linkedLoanSystemId) migrated.linkedLoanSystemId = SYSTEM_LOAN_IDS.TAKYEEF; return migrated; }); };

const migrateData = (parsed) => {
  if (!parsed) return parsed;

  const loans = Array.isArray(parsed.loans) ? parsed.loans : [];

  const hasSWYPE = cards.some(c => c.name === 'SWYPE');
  const hasTakyeef = loans.some(l => isTakyeefLoan(l));
  const hasHany = loans.some(l => isHanyLoan(l));
  let { snapshots, closedMonths } = migrateSnapshotsAndClosed(parsed.monthlySnapshots, parsed.closedMonths);
  const incomingVersion = safeNumber(parsed.engineVersion, 1);
  if (incomingVersion < CURRENT_ENGINE_VERSION && Object.keys(snapshots).length > 0) { snapshots = {}; }
  const transactions = Array.isArray(parsed.transactions) ? parsed.transactions.map(migrateTransaction) : [];
  const accountsData = parsed.accountsData && typeof parsed.accountsData === 'object' ? { ...DEFAULT_ACCOUNTS, ...parsed.accountsData } : { ...DEFAULT_ACCOUNTS };
  const defaultCutoff = deriveDefaultCutoff(transactions);
  const renamedLabels = { 'CIB توفير': 'CIB Savings', 'AAIB توفير': 'AAIB Savings', 'نقدي': 'Cash', 'فوري': 'Fawry', 'اتصالات': 'Etisalat' };
  ACCOUNT_KEYS.forEach(k => { if (!accountsData[k]?.lastUpdated) accountsData[k] = { ...(DEFAULT_ACCOUNTS[k] || {}), ...(accountsData[k] || {}), lastUpdated: defaultCutoff }; if (accountsData[k] && accountsData[k].label && renamedLabels[accountsData[k].label]) accountsData[k] = { ...accountsData[k], label: renamedLabels[accountsData[k].label] }; if (accountsData[k] && !accountsData[k].label) accountsData[k] = { ...accountsData[k], label: DEFAULT_ACCOUNTS[k].label }; });
  const withReceivable = (loans || []).map(l => { if (isTakyeefLoan(l)) return { ...l, systemId: SYSTEM_LOAN_IDS.TAKYEEF, isReceivable: true, type: 'receivable', interest: 'مستحق لنا شهرياً', paused: !!l.paused, totalInstallments: safeNumber(l.totalInstallments, 12), paidInstallments: safeNumber(l.paidInstallments, 1) }; return l; });
  const normalizedLoans = withReceivable.map(l => { if (isHanyLoan(l) && !l.autoMonthly) return { id: l.id || 15, systemId: SYSTEM_LOAN_IDS.HANY, name: 'مسحوبات محل هاني', autoMonthly: true, dueNextMonth: true, mergeIntoNextCycle: ['2026-أغسطس'], category: 'مسحوبات محل هاني', totalAmount: 0, prePaidAmount: 0, monthlyInstallment: 0, dueDay: 5, interest: 'مستحق شهري', description: 'مسحوبات يومية — تُحسب تلقائياً من قيود الشهر', type: 'debt' }; if (l && l.autoMonthly && !l.systemId) return { ...l, systemId: SYSTEM_LOAN_IDS.HANY }; if (l && l.autoMonthly && !l.mergeIntoNextCycle) return { ...l, mergeIntoNextCycle: ['2026-أغسطس'] }; return l; });
  let recurringItems = recurring;

  } catch (e) { console.warn(e); }
  return { engineVersion: CURRENT_ENGINE_VERSION, recurringInitialized: true, transactions: [], loans: DEFAULT_LOANS, cards: DEFAULT_CARDS, accountsData: DEFAULT_ACCOUNTS, monthlyPlans: {}, recurringItems: DEFAULT_RECURRING, closedMonths: [], monthlySnapshots: {}, materializedRecurring: {}, notifiedItems: {}, custodyEntries: DEFAULT_CUSTODY_ENTRIES, cashbackTrackers: DEFAULT_CASHBACK_TRACKERS };

const materializeRecurringItems = (data, asOfDateStr) => {
  if (!data?.recurringItems?.length) return null;
  const now = asOfDateStr ? new Date(asOfDateStr) : new Date();
  const nowYear = now.getFullYear();
  const nowMonth = ALL_MONTHS[now.getMonth()];
  const nowMonthKey = makeMonthKey(nowYear, nowMonth);
  const existing = data.transactions || [];
  const materialized = { ...(data.materializedRecurring || {}) };
  const newTxs = [];
  const loanPaidMap = {};
  existing.forEach(t => { if (t.status === 'paid' && t.sourceReceivableId) loanPaidMap[t.sourceReceivableId] = (loanPaidMap[t.sourceReceivableId] || 0) + safeNumber(t.amount); });
  data.recurringItems.forEach(r => {

    if (day < 1 || day > 31) return;

// deriveMonthlyPlanFromHistory — V13
// • يقرأ من البنود المتكررة أولاً

const deriveMonthlyPlanFromHistory = (data, targetYear, targetMonth, monthsBack = 3) => {
  const transactions = data?.transactions || [];
  const recurringItems = data?.recurringItems || [];
  const targetIdx = getMonthIndex(targetMonth);
  if (targetIdx < 0) return null;
  const targetMonthKey = makeMonthKey(targetYear, targetMonth);
  const refMonths = [];
  let y = targetYear, mi = targetIdx;
  for (let i = 1; i <= monthsBack; i++) { mi--; if (mi < 0) { mi = 11; y--; } refMonths.push({ year: y, month: ALL_MONTHS[mi] }); }
  const isRecurringActiveInTargetMonth = (r) => { if (r.active === false) return false; if (r.startMonth && targetMonthKey < r.startMonth) return false; if (r.endMonth && targetMonthKey > r.endMonth) return false; return true; };
  const sumRecurringByCategory = (cat, type) => recurringItems.filter(r => isRecurringActiveInTargetMonth(r) && r.category === cat && (!type || r.type === type)).reduce((s, r) => s + safeNumber(r.amount), 0);
  const avgHistByCategory = (cat, type) => { let total = 0, count = 0; refMonths.forEach(({ year, month }) => { const sum = transactions.filter(t => t.type === type && t.month === month && (t.year || 2026) === year && t.category === cat && t.status !== 'cancelled').reduce((s, t) => s + safeNumber(t.amount), 0); if (sum > 0) { total += sum; count++; } }); return count > 0 ? total / count : 0; };
  const avgFreelanceIncome = () => {
    const knownCats = new Set(['راتب شهري','راتب AAIB','إيجار المحل','Cash Back','استرداد كاش باك','عهدة إيماك WE','عهدة شركة إيماك','تكييف محمود']);
    let total = 0, count = 0;
    refMonths.forEach(({ year, month }) => { const sum = transactions.filter(t => t.type === 'income' && t.month === month && (t.year || 2026) === year && !knownCats.has(t.category) && t.status !== 'cancelled').reduce((s, t) => s + safeNumber(t.amount), 0); if (sum > 0) { total += sum; count++; } });
    return count > 0 ? total / count : 0;
  };
  const sumRecurringFreelance = () => {
    const knownCats = new Set(['راتب شهري','راتب AAIB','إيجار المحل','Cash Back','استرداد كاش باك','عهدة إيماك WE','عهدة شركة إيماك','تكييف محمود','الزكاة والتبرعات']);
    return recurringItems.filter(r => isRecurringActiveInTargetMonth(r) && r.type === 'income' && !knownCats.has(r.category)).reduce((s, r) => s + safeNumber(r.amount), 0);
  };
  const pickIncome = (cat) => { const rec = sumRecurringByCategory(cat, 'income'); if (rec > 0) return rec; return avgHistByCategory(cat, 'income'); };
  const avgCashExpenses = () => { let total = 0, count = 0; refMonths.forEach(({ year, month }) => { const sum = transactions.filter(t => t.type === 'expense' && t.method === 'cash' && t.month === month && (t.year || 2026) === year && t.status !== 'cancelled').reduce((s, t) => s + safeNumber(t.amount), 0); if (sum > 0) { total += sum; count++; } }); return count > 0 ? total / count : 0; };
  const avgAllExpenses = () => { let total = 0, count = 0; refMonths.forEach(({ year, month }) => { const sum = transactions.filter(t => t.type === 'expense' && t.month === month && (t.year || 2026) === year && t.status !== 'cancelled').reduce((s, t) => s + safeNumber(t.amount), 0); if (sum > 0) { total += sum; count++; } }); return count > 0 ? total / count : 0; };
  const sumActiveInstallments = () => { const loans = data?.loans || []; return loans.filter(l => !l.isReceivable && !l.autoMonthly && safeNumber(l.monthlyInstallment) > 0 && !l.paused).reduce((s, l) => s + safeNumber(l.monthlyInstallment), 0); };
  const salaryFromRec = sumRecurringByCategory('راتب شهري', 'income') > 0;
  const rentFromRec = sumRecurringByCategory('إيجار المحل', 'income') > 0;
  const cashbackFromRec = (sumRecurringByCategory('Cash Back', 'income') + sumRecurringByCategory('استرداد كاش باك', 'income')) > 0;
  const emakFromRec = sumRecurringByCategory('عهدة إيماك WE', 'income') > 0;
  const zakatFromRec = sumRecurringByCategory('الزكاة والتبرعات', 'income') > 0;
  const freelanceFromRec = sumRecurringFreelance() > 0;
  const freelanceValue = freelanceFromRec ? sumRecurringFreelance() : avgFreelanceIncome();
  return {
    expectedSalary: Math.round(pickIncome('راتب شهري') || pickIncome('راتب AAIB')),
    expectedRent: Math.round(pickIncome('إيجار المحل')),
    expectedCashback: Math.round(pickIncome('استرداد كاش باك') || pickIncome('Cash Back')),
    expectedEmakWE: Math.round(pickIncome('عهدة إيماك WE')),
    expectedZakat: Math.round(pickIncome('الزكاة والتبرعات')),
    expectedFreelance: Math.round(freelanceValue),
    expectedCash: 0,
    expectedCashExpenses: Math.round(avgCashExpenses()),
    expectedAllExpenses: Math.round(avgAllExpenses()),
    plannedPayments: Math.round(sumActiveInstallments()),
    _meta: {
      refMonths: refMonths.map(m => `${m.month} ${m.year}`).join(' • '),
      salarySource: salaryFromRec ? 'متكرر' : 'تاريخي',
      rentSource: rentFromRec ? 'متكرر' : 'تاريخي',
      cashbackSource: cashbackFromRec ? 'متكرر' : 'تاريخي',
      emakSource: emakFromRec ? 'متكرر' : 'تاريخي',
      zakatSource: zakatFromRec ? 'متكرر' : 'تاريخي',
      freelanceSource: freelanceFromRec ? 'متكرر' : 'تاريخي',
    }
  };
};

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(e, i) { console.error('App Error:', e, i); clearAllModals(); }
  render() {
    if (this.state.hasError) return (
      <div className="flex flex-col h-screen items-center justify-center p-8 text-center" style={{background: 'var(--bg-app)'}} dir="rtl">
        <AlertTriangle size={48} className="text-red-500 mb-4" />

}

const PromiseModalProvider = ({ children }) => {
  const [stack, setStack] = useState([]);
  const [inputValues, setInputValues] = useState({});
  useEffect(() => {
    const handleInput = (e) => setStack(s => [...s, { kind: 'input', ...e.detail }]);
    const handleConfirm = (e) => setStack(s => [...s, { kind: 'confirm', ...e.detail }]);
    window.addEventListener('show-input-modal', handleInput);
    window.addEventListener('show-confirm-modal', handleConfirm);
    return () => { window.removeEventListener('show-input-modal', handleInput); window.removeEventListener('show-confirm-modal', handleConfirm); };
  }, []);
  const current = stack[stack.length - 1];
  const dismiss = useCallback((value) => { if (!current) return; const id = current._id; setStack(s => s.slice(0, -1)); resolveModal(id, value); setInputValues(prev => { if (!(id in prev)) return prev; const next = { ...prev }; delete next[id]; return next; }); }, [current]);
  const inputValue = current?._id !== undefined ? (inputValues[current._id] ?? current.inputValue ?? '') : '';
  const setInputValue = useCallback((v) => { if (current?._id === undefined) return; setInputValues(prev => ({ ...prev, [current._id]: v })); }, [current?._id]);
  return (
    <React.Fragment>
      {children}
      {current?.kind === 'input' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-md">
            <div className="generic-modal-header"><h3 className="text-base font-black flex items-center gap-2"><span>{current.icon || '💬'}</span>{current.title}</h3><button onClick={() => dismiss(null)} className="btn btn-ghost p-1.5"><X size={16} /></button></div>
            <div className="generic-modal-body">{current.message && <p className="text-sm mb-3 whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>}<input autoFocus type="text" inputMode={current.numeric ? 'decimal' : 'text'} className="input-field text-2xl font-black text-center text-blue-600 py-4" value={inputValue} onChange={e => setInputValue(current.numeric ? e.target.value.replace(/[^\d.\-]/g, '') : e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim(); dismiss(v); } }} placeholder={current.placeholder || ''} /></div>
            <div className="generic-modal-footer"><button onClick={() => dismiss(null)} className="btn btn-secondary flex-1">إلغاء</button><button onClick={() => { const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim(); dismiss(v); }} className="btn btn-primary flex-1">{current.confirmText || 'تأكيد'}</button></div>
          </div>
        </div>
      )}
      {current?.kind === 'confirm' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-sm">
            <div className="generic-modal-body text-center">
              <div className={`w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center text-3xl ${current.danger ? 'bg-red-50 dark:bg-red-950/40' : 'bg-blue-50 dark:bg-blue-950/40'}`}>{current.icon || (current.danger ? '⚠️' : '❓')}</div>
              <h3 className="text-base font-black mb-2">{current.title}</h3>
              <p className="text-sm leading-relaxed mb-2 whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>
            </div>
            <div className="generic-modal-footer"><button onClick={() => dismiss(false)} className="btn btn-secondary flex-1">إلغاء</button><button onClick={() => dismiss(true)} className="btn flex-1" style={{ background: current.danger ? 'var(--danger)' : 'var(--brand)', color: 'white' }}>{current.confirmText || 'تأكيد'}</button></div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
};

const groupTransactionsByDate = (list) => {
  const groups = {};
  list.forEach(t => { const d = t.date || 'unknown'; if (!groups[d]) groups[d] = []; groups[d].push(t); });
  const today = getLocalISODate();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const yestISO = getLocalISODate(yest);
  return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
    let label;
    if (date === today) label = '📅 النهاردة';
    else if (date === yestISO) label = '📅 امبارح';
    else { try { const dObj = new Date(date); const ds = dObj.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' }); const ys = dObj.getFullYear() !== new Date().getFullYear() ? ' ' + dObj.getFullYear() : ''; label = '📅 ' + ds + ys; } catch(e) { label = '📅 ' + date; } }
    const total = groups[date].reduce((s, t) => s + safeNumber(t.amount), 0);
    return { date, label, items: groups[date], total };
  });
};

                <td style={{ padding: '6px 8px', border: '1px solid #ccc', fontSize: '11px', textAlign: 'center', fontFamily: 'Cairo, sans-serif' }}>{t.status === 'paid' ? '✅ مدفوع' : '⏳ معلق'}</td>
              </tr>))}</tbody>
            </table>
          </div>
          <div className="mt-4 no-print">
            <div className="flex gap-2 mb-3 flex-wrap">
              <div className="relative flex-1 min-w-[150px]"><Search className="absolute right-3 top-1/2 -translate-y-1/2" size={14} style={{ color: 'var(--text-muted)' }} /><input type="text" placeholder="ابحث في الوصف..." className="input-field pr-9 text-xs py-2" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} /></div>

                <div key={t.id} className="flex justify-between items-center p-2.5 rounded-lg gap-2" style={{ background: 'var(--bg-muted)' }}>
                  <div className="min-w-0 flex-1"><p className="font-bold text-xs truncate">{t.type === 'income' ? '💰' : '💸'} {t.description || '—'} <RecurringBadge tx={t} /> <CarryoverBadge tx={t} /> <SmsBadge tx={t} /></p><p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{t.date} • {PAYMENT_METHODS.find(p => p.id === t.method)?.label || t.method}</p></div>
                  <div className="flex items-center gap-2 flex-shrink-0">
                    <span className={`text-xs font-black ${t.type === 'income' ? 'text-emerald-600' : 'text-red-500'}`}>{t.type === 'income' ? '+' : '−'}{fmt(t.amount)}</span>
                    <span className={`badge ${t.status === 'paid' ? 'badge-success' : 'badge-warning'} text-[9px]`}>{t.status === 'paid' ? 'مدفوع' : 'معلق'}</span>
                    <button onClick={() => { handleClose(); dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="btn btn-ghost p-1" aria-label="تعديل"><Edit size={11} /></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
});

const GenericLedgerComponent = memo(({ walletKey, ledgerData, liveBalance, isExpanded, onToggle, theme, onAddDeposit, onAddWithdrawal, walletVisibility, onToggleVisibility }) => {
  const [filter, setFilter] = useState('all');
  const [dateFilter, setDateFilter] = useState('');
  const validatedLedger = useMemo(() => { try { return (ledgerData || []).map(item => ({ ...item, amount: safeNumber(item.amount), runningBalance: safeNumber(item.runningBalance), date: item.date || 'غير معروف', description: item.description || 'بدون وصف', subType: item.subType || (item.type === 'income' ? 'deposit' : 'withdrawal') })).filter(item => item.amount > 0); } catch { return []; } }, [ledgerData]);
  const filteredLedger = useMemo(() => validatedLedger.filter(i => { if (filter === 'deposit' && i.subType !== 'deposit') return false; if (filter === 'withdrawal' && i.subType !== 'withdrawal') return false; if (dateFilter && !(i.date||'').includes(dateFilter)) return false; return true; }), [validatedLedger, filter, dateFilter]);
  const stats = useMemo(() => ({ deposits: validatedLedger.filter(t => t.subType === 'deposit').reduce((s, t) => s + t.amount, 0), withdrawals: validatedLedger.filter(t => t.subType === 'withdrawal').reduce((s, t) => s + t.amount, 0), currentBalance: safeNumber(liveBalance) }), [validatedLedger, liveBalance]);
  const mask = (v) => !walletVisibility?.[walletKey] ? '•••••' : fmt(v);
  const IconComponent = theme.icon;
  const stop = (e, action) => { e.stopPropagation(); e.preventDefault(); if (action) action(); };
  return (
    <div className="card mb-3">
      <div className="flex justify-between items-center cursor-pointer -m-4.5 p-4.5" onClick={onToggle}>
        <div className="flex items-center gap-3 min-w-0 flex-1"><div className="p-2.5 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><IconComponent size={20} /></div><div className="min-w-0"><h3 className="font-bold text-sm truncate">{theme.title}</h3><p className="text-[11px] mt-0.5 truncate" style={{ color: 'var(--text-muted)' }}>{theme.subtitle}</p></div></div>
        <div className="flex items-center gap-1 flex-shrink-0">
          <button type="button" aria-label="إيداع" onClick={(e) => stop(e, () => onAddDeposit?.(walletKey))} className="p-2 bg-emerald-500 text-white rounded-lg hover:bg-emerald-600 transition-colors"><ArrowDownCircle size={14} /></button>
          <button type="button" aria-label="سحب" onClick={(e) => stop(e, () => onAddWithdrawal?.(walletKey))} className="p-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"><ArrowUpCircle size={14} /></button>
          <button type="button" aria-label="إظهار" onClick={(e) => stop(e, () => onToggleVisibility?.(walletKey))} className="p-2 hover:bg-[color:var(--bg-muted)] rounded-lg transition-colors" style={{ color: 'var(--text-muted)' }}>{walletVisibility?.[walletKey] ? <EyeOff size={14} /> : <Eye size={14} />}</button>
          <ChevronDown size={18} className={`transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
        </div>
      </div>
      {isExpanded && (
        <div className="mt-4 pt-4 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
          {validatedLedger.length === 0 ? (
            <div className="p-6 text-center"><p className="font-medium mb-3 text-sm" style={{ color: 'var(--text-secondary)' }}>لا توجد عمليات بعد آخر تحديث رصيد</p><button type="button" onClick={(e) => stop(e, () => onAddDeposit?.(walletKey))} className="btn btn-primary text-sm"><Plus size={16} /> إضافة أول عملية</button></div>
          ) : (
            <React.Fragment>
              <div className="grid grid-cols-3 gap-2 mb-3">
                <div className="text-center p-2.5 bg-emerald-50 dark:bg-emerald-950/30 rounded-xl"><div className="text-[10px] text-emerald-700 dark:text-emerald-400 font-bold mb-1">إيداع</div><div className="text-sm font-black text-emerald-600 dark:text-emerald-400">{mask(stats.deposits)}</div></div>
                <div className="text-center p-2.5 bg-red-50 dark:bg-red-950/30 rounded-xl"><div className="text-[10px] text-red-700 dark:text-red-400 font-bold mb-1">سحب</div><div className="text-sm font-black text-red-600 dark:text-red-400">{mask(stats.withdrawals)}</div></div>
                <div className="text-center p-2.5 bg-blue-50 dark:bg-blue-950/30 rounded-xl"><div className="text-[10px] text-blue-700 dark:text-blue-400 font-bold mb-1">الرصيد</div><div className="text-sm font-black text-blue-600 dark:text-blue-400">{mask(stats.currentBalance)}</div></div>
              </div>
              <div className="flex gap-2 mb-3 flex-wrap">
                <select className="input-field text-xs py-2 flex-1 min-w-[100px]" value={filter} onChange={(e) => setFilter(e.target.value)}><option value="all">الكل</option><option value="deposit">إيداعات</option><option value="withdrawal">سحوبات</option></select>
                <input type="month" className="input-field text-xs py-2 flex-1 min-w-[120px]" value={dateFilter} onChange={(e) => setDateFilter(e.target.value)} />
              </div>
              <div className="overflow-x-auto -mx-4">
                <table className="w-full text-right text-sm">
                  <thead><tr style={{ borderBottom: '1px solid var(--border-subtle)' }}><th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>التاريخ</th><th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الوصف</th><th className="p-2.5 text-[10px] font-bold text-left" style={{ color: 'var(--text-muted)' }}>المبلغ</th></tr></thead>
                  <tbody>{filteredLedger.map((t) => (<tr key={t.id} className="hover:bg-[color:var(--bg-muted)]"><td className="p-2.5 text-[11px] whitespace-nowrap" style={{ color: 'var(--text-muted)' }}>{t.date}</td><td className="p-2.5 font-bold text-xs">{t.description} <FamilyBadge tx={t} /></td><td className={`p-2.5 text-left font-black text-xs ${t.subType === 'deposit' ? 'text-emerald-600' : 'text-red-500'}`}>{t.subType === 'deposit' ? '+' : '-'}{mask(t.amount)}</td></tr>))}</tbody>
                </table>
              </div>
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
});

const CustodyView = memo(({ data, dispatch, saveHistory, addNotification }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [filterType, setFilterType] = useState('all');
  const [newEntry, setNewEntry] = useState({ type: CUSTODY_TYPE.RECEIVE, amount: '', date: getLocalISODate(), description: '', method: 'cash', relatedCategory: 'عهدة شركة إيماك' });
  const custodyEntries = data?.custodyEntries || [];
  const summary = useMemo(() => computeCustodyBalance(custodyEntries), [custodyEntries]);
  const filtered = useMemo(() => { const sorted = [...custodyEntries].sort((a, b) => new Date(b.date) - new Date(a.date)); if (filterType === 'all') return sorted; return sorted.filter(e => e.type === filterType); }, [custodyEntries, filterType]);
  const addEntry = () => {
    const check = validateAmount(newEntry.amount, { min: 0.01, max: 10000000, label: 'المبلغ' });
    if (!check.valid) { addNotification({ type: 'error', title: 'خطأ', message: check.error }); return; }
    const descCheck = validateText(newEntry.description, { min: 2, max: 200, label: 'الوصف' });
    if (!descCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: descCheck.error }); return; }
    const dateCheck = validateDate(newEntry.date);
    if (!dateCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: dateCheck.error }); return; }
    saveHistory();
    const amount = check.value;
    const entry = { ...newEntry, description: descCheck.value, id: getSafeId(), amount, status: newEntry.type === CUSTODY_TYPE.SETTLE ? 'settled' : 'open' };
    const newEntries = [entry, ...custodyEntries];
    const newTxs = [];
    const d = new Date(newEntry.date);
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    const baseTx = { date: newEntry.date, month: txMonth, year: txYear, monthIndex: d.getMonth(), status: 'paid' };
    if (newEntry.type === CUSTODY_TYPE.RECEIVE) newTxs.push({ ...baseTx, id: getSafeId(), type: 'income', kind: KIND.OPERATIONAL, category: newEntry.relatedCategory || 'عهدة شركة إيماك', amount, description: `استلام عهدة: ${newEntry.description}`, method: newEntry.method, subType: 'deposit', linkedCustodyId: entry.id });
    else if (newEntry.type === CUSTODY_TYPE.TRANSFER) newTxs.push({ ...baseTx, id: getSafeId(), type: 'income', kind: KIND.FINANCIAL, category: 'تحويلات واردة', amount, description: `تحويل عهدة لحسابي: ${newEntry.description}`, method: newEntry.method, subType: 'deposit', linkedCustodyId: entry.id });
    else if (newEntry.type === CUSTODY_TYPE.SPEND_CASH) newTxs.push({ ...baseTx, id: getSafeId(), type: 'expense', kind: KIND.OPERATIONAL, category: newEntry.relatedCategory || 'مصروفات عهدة', amount, description: `صرف عهدة كاش: ${newEntry.description}`, method: newEntry.method, subType: 'withdrawal', linkedCustodyId: entry.id });
    else if (newEntry.type === CUSTODY_TYPE.SPEND_CARD) newTxs.push({ ...baseTx, id: getSafeId(), type: 'expense', kind: KIND.OPERATIONAL, category: newEntry.relatedCategory || 'فواتير عهدة', amount, description: `صرف عهدة من بطاقة: ${newEntry.description}`, method: newEntry.method, subType: 'withdrawal', linkedCustodyId: entry.id });
    const newData = { ...data, custodyEntries: newEntries, transactions: [...newTxs, ...(data.transactions || [])].sort((a, b) => new Date(b.date) - new Date(a.date)) };
    dispatch({ type: 'SET_DATA', payload: newData });
    setShowAdd(false);
    setNewEntry({ type: CUSTODY_TYPE.RECEIVE, amount: '', date: getLocalISODate(), description: '', method: 'cash', relatedCategory: 'عهدة شركة إيماك' });
    addNotification({ type: 'success', title: 'تم التسجيل', message: `${CUSTODY_TYPE_LABELS[newEntry.type]} — ${fmt(amount)} ج.م` });
  };
  const deleteEntry = (id) => {
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'حذف حركة العهدة', message: 'سيتم حذف الحركة والقيود المرتبطة بها', onConfirm: () => {
      saveHistory();
      const newEntries = custodyEntries.filter(e => e.id !== id);
      const newTxs = (data.transactions || []).filter(t => t.linkedCustodyId !== id);
      dispatch({ type: 'SET_DATA', payload: { ...data, custodyEntries: newEntries, transactions: newTxs } });
      addNotification({ type: 'success', title: 'تم الحذف' });
    }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  };
  const usagePct = summary.received > 0 ? (summary.totalSpent / summary.received) * 100 : 0;
  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div className="flex-1 min-w-[180px]">
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>رصيد العهدة الحالي</p>
            <h2 className={`text-3xl font-black tracking-tight ${summary.balance >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(summary.balance)}<span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span></h2>
            <p className="text-[11px] font-semibold mt-2" style={{ color: 'var(--text-muted)' }}>{summary.balance > 0 ? '⚠️ مبلغ متبقي معك' : summary.balance < 0 ? '⚠️ صرفت أكثر من العهدة' : '✅ مسددة بالكامل'}</p>
          </div>
          <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs"><Plus size={14} /> حركة جديدة</button>
        </div>
        <div className="grid grid-cols-4 gap-2 mt-4">
          <div className="p-2.5 rounded-xl bg-blue-50 dark:bg-blue-950/30 text-center"><p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">مستلم</p><p className="text-sm font-black text-blue-600 mt-0.5">{fmt(summary.received)}</p></div>
          <div className="p-2.5 rounded-xl bg-cyan-50 dark:bg-cyan-950/30 text-center"><p className="text-[10px] font-bold text-cyan-700 dark:text-cyan-400">محوّل</p><p className="text-sm font-black text-cyan-600 mt-0.5">{fmt(summary.transferred)}</p></div>
          <div className="p-2.5 rounded-xl bg-orange-50 dark:bg-orange-950/30 text-center"><p className="text-[10px] font-bold text-orange-700 dark:text-orange-400">كاش</p><p className="text-sm font-black text-orange-600 mt-0.5">{fmt(summary.spentCash)}</p></div>
          <div className="p-2.5 rounded-xl bg-purple-50 dark:bg-purple-950/30 text-center"><p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">بطاقة</p><p className="text-sm font-black text-purple-600 mt-0.5">{fmt(summary.spentCard)}</p></div>
        </div>
        <div className="mt-3">
          <div className="flex justify-between text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}><span>نسبة الاستهلاك</span><span>{Math.round(usagePct)}%</span></div>
          <div className="w-full rounded-full h-1.5 overflow-hidden" style={{ background: 'var(--bg-muted)' }}><div className={`h-full ${usagePct > 90 ? 'bg-red-500' : usagePct > 60 ? 'bg-amber-500' : 'bg-blue-500'}`} style={{ width: `${Math.min(100, usagePct)}%` }}></div></div>
        </div>
      </div>
      <div className="card p-2"><div className="flex gap-2 overflow-x-auto scroll-hide">
        {[{ id: 'all', label: 'الكل' }, { id: CUSTODY_TYPE.RECEIVE, label: 'استلام' }, { id: CUSTODY_TYPE.TRANSFER, label: 'تحويل' }, { id: CUSTODY_TYPE.SPEND_CASH, label: 'صرف كاش' }, { id: CUSTODY_TYPE.SPEND_CARD, label: 'صرف بطاقة' }].map(f => (<button key={f.id} onClick={() => setFilterType(f.id)} className={`badge px-3 py-1.5 cursor-pointer whitespace-nowrap ${filterType === f.id ? 'badge-brand' : 'badge-neutral'}`}>{f.label}</button>))}
      </div></div>
      {filtered.length === 0 ? (
        <div className="card text-center p-12"><Briefcase size={40} className="mx-auto mb-3 text-blue-500" /><h3 className="text-base font-black mb-2">لا توجد حركات بعد</h3><button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs"><Plus size={14} /> إضافة أول حركة</button></div>
      ) : (
        <div className="space-y-2">
          {filtered.map(entry => {
            const Icon = CUSTODY_TYPE_ICONS[entry.type] || Briefcase;
            const color = CUSTODY_TYPE_COLORS[entry.type] || '#6B7280';
            const isIncoming = entry.type === CUSTODY_TYPE.RECEIVE || entry.type === CUSTODY_TYPE.TRANSFER;
            return (
              <div key={entry.id} className="card py-3">
                <div className="flex justify-between items-center gap-3">
                  <div className="flex items-center gap-3 flex-1 min-w-0">
                    <div className="p-2 rounded-lg flex-shrink-0" style={{ background: `${color}20`, color }}><Icon size={16} /></div>
                    <div className="min-w-0"><h4 className="font-bold text-xs truncate">{entry.description}</h4><div className="flex items-center gap-2 flex-wrap mt-0.5"><span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{CUSTODY_TYPE_LABELS[entry.type]} • {entry.date}</span></div></div>
                  </div>
                  <div className="flex items-center gap-1 flex-shrink-0"><p className={`font-black text-sm ${isIncoming ? 'text-emerald-600' : 'text-red-500'}`}>{isIncoming ? '+' : '-'}{fmt(entry.amount)}</p><button onClick={() => deleteEntry(entry.id)} className="btn btn-ghost p-1 text-red-500"><Trash2 size={12} /></button></div>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {showAdd && (
        <Modal isOpen={true} onClose={() => setShowAdd(false)} title="حركة عهدة جديدة" icon="💼">
          <div className="space-y-3">
            <div>
              <p className="text-[11px] font-bold mb-2" style={{ color: 'var(--text-muted)' }}>نوع الحركة:</p>
              <div className="grid grid-cols-2 gap-2">
                {Object.entries(CUSTODY_TYPE_LABELS).map(([type, label]) => { const Icon = CUSTODY_TYPE_ICONS[type] || Briefcase; const color = CUSTODY_TYPE_COLORS[type]; const selected = newEntry.type === type; return (<button key={type} type="button" onClick={() => setNewEntry({ ...newEntry, type })} className="p-2.5 rounded-lg text-[11px] font-bold transition-all border-2 flex items-center gap-2" style={selected ? { borderColor: color, background: `${color}15`, color } : { borderColor: 'var(--border-default)' }}><Icon size={14} /><span>{label}</span></button>); })}
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ *</label><input type="text" inputMode="decimal" className="input-field text-base font-black text-blue-600 text-center" value={newEntry.amount} onChange={e => setNewEntry({ ...newEntry, amount: e.target.value })} placeholder="0.00" /></div>
              <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>التاريخ *</label><input type="date" className="input-field text-xs font-bold" value={newEntry.date} onChange={e => setNewEntry({ ...newEntry, date: e.target.value })} /></div>
            </div>
            <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الوصف *</label><input type="text" className="input-field" placeholder="عهدة إيماك - WE..." value={newEntry.description} onChange={e => setNewEntry({ ...newEntry, description: e.target.value })} /></div>
            <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الحساب/البطاقة</label><select className="input-field text-sm" value={newEntry.method} onChange={e => setNewEntry({ ...newEntry, method: e.target.value })}>{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select></div>
            <button onClick={addEntry} className="btn btn-primary w-full py-2.5 text-sm"><Save size={14} /> تسجيل الحركة</button>
          </div>
        </Modal>
      )}
    </div>
  );
});

const CashbackView = memo(({ data, dispatch, saveHistory, addNotification, cards, selectedYear, selectedMonth }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [newTracker, setNewTracker] = useState({ cardId: cards[0]?.id || 1, month: selectedMonth, year: selectedYear, expectedAmount: '', receivedAmount: '', receivedDate: '', status: CASHBACK_STATUS.EXPECTED, notes: '' });
  const trackers = data?.cashbackTrackers || [];
  const summary = useMemo(() => computeCashbackSummary(trackers), [trackers]);
  const filteredTrackers = useMemo(() => trackers.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear), [trackers, selectedMonth, selectedYear]);
  const monthExpected = filteredTrackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
  const monthReceived = filteredTrackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
  const monthPending = monthExpected - monthReceived;
  const addTracker = () => {
    const check = validateAmount(newTracker.expectedAmount, { min: 0.01, max: 1000000, label: 'المبلغ المتوقع' });
    if (!check.valid) { addNotification({ type: 'error', title: 'خطأ', message: check.error }); return; }
    saveHistory();
    const expected = check.value;
    const received = parseNumberInput(newTracker.receivedAmount);
    const tracker = { ...newTracker, id: getSafeId(), expectedAmount: expected, receivedAmount: received, status: received >= expected ? CASHBACK_STATUS.RECEIVED : received > 0 ? CASHBACK_STATUS.PARTIAL : CASHBACK_STATUS.EXPECTED };
    dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: [...trackers, tracker] });
    setShowAdd(false);
    setNewTracker({ cardId: cards[0]?.id || 1, month: selectedMonth, year: selectedYear, expectedAmount: '', receivedAmount: '', receivedDate: '', status: CASHBACK_STATUS.EXPECTED, notes: '' });
    addNotification({ type: 'success', title: 'تم الحفظ' });
  };
  const markReceived = async (tracker) => {
    const card = cards.find(c => c.id === tracker.cardId);
    const cardMethod = card ? getCardMethod(card) : null;
    const choice = await showInputModal({ title: 'أين استلمت الكاش باك؟', icon: '🎁', message: `البطاقة: ${card?.bank} - ${card?.name}\n\n1 = على البطاقة (خصم من المديونية)\n2 = نقدي (إضافة للكاش)\n\nاكتب الرقم:`, inputValue: '1', numeric: true, confirmText: 'تأكيد' });
    if (choice === null) return;
    const choiceNum = parseInt(choice, 10);
    if (choiceNum !== 1 && choiceNum !== 2) { addNotification({ type: 'error', title: 'اختر 1 أو 2' }); return; }
    const useCard = choiceNum === 1;
    const method = useCard && cardMethod ? cardMethod : 'cash';
    saveHistory();
    const updated = trackers.map(t => t.id === tracker.id ? { ...t, receivedAmount: t.expectedAmount, receivedDate: getLocalISODate(), status: CASHBACK_STATUS.RECEIVED } : t);
    dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: updated });
    const d = new Date();
    const newTx = { id: getSafeId(), type: 'income', kind: KIND.OPERATIONAL, category: 'استرداد كاش باك', amount: safeNumber(tracker.expectedAmount), description: `كاش باك - ${card?.name || ''} (${useCard ? 'على البطاقة' : 'نقدي'})`, method, date: getLocalISODate(d), month: ALL_MONTHS[d.getMonth()], year: d.getFullYear(), monthIndex: d.getMonth(), subType: 'deposit', status: 'paid', linkedCardId: useCard && card ? card.id : undefined };
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [newTx, ...(data.transactions || [])].sort((a, b) => new Date(b.date) - new Date(a.date)) });
    addNotification({ type: 'success', title: 'تم استلام الكاش باك', message: `${fmt(tracker.expectedAmount)} ج.م — ${useCard ? 'على البطاقة' : 'نقدي'}` });
  };
  const deleteTracker = (id) => {
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'حذف السجل', message: 'سيتم حذف سجل الكاش باك', onConfirm: () => { saveHistory(); dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: trackers.filter(t => t.id !== id) }); addNotification({ type: 'success', title: 'تم الحذف' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  };
  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div>
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>كاش باك {selectedMonth}</p>
            <h2 className="text-3xl font-black tracking-tight text-emerald-600">{fmt(monthReceived)}<span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span></h2>
            <p className="text-[11px] font-semibold mt-2" style={{ color: 'var(--text-muted)' }}>متوقع: {fmt(monthExpected)} • معلق: {fmt(monthPending)}</p>
          </div>
          <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs"><Plus size={14} /> إضافة</button>
        </div>
        <div className="grid grid-cols-3 gap-2 mt-4">
          <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 text-center"><p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">مستلم</p><p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(summary.received)}</p></div>
          <div className="p-2.5 rounded-xl bg-blue-50 dark:bg-blue-950/30 text-center"><p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">متوقع</p><p className="text-sm font-black text-blue-600 mt-0.5">{fmt(summary.expected)}</p></div>
          <div className="p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/30 text-center"><p className="text-[10px] font-bold text-amber-700 dark:text-amber-400">معلق</p><p className="text-sm font-black text-amber-600 mt-0.5">{fmt(summary.pending)}</p></div>
        </div>
      </div>
      <div className="space-y-2">
        <h3 className="font-black text-sm">سجلات {selectedMonth}</h3>
        {filteredTrackers.length === 0 ? (
          <div className="card text-center p-8"><Gift size={32} className="mx-auto mb-2 text-emerald-500" /><p className="font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد سجلات لهذا الشهر</p></div>
        ) : filteredTrackers.map(tracker => {
          const card = cards.find(c => c.id === tracker.cardId);
          const pct = safeNumber(tracker.expectedAmount) > 0 ? (safeNumber(tracker.receivedAmount) / safeNumber(tracker.expectedAmount)) * 100 : 0;
          const statusCls = tracker.status === CASHBACK_STATUS.RECEIVED ? 'badge-success' : tracker.status === CASHBACK_STATUS.PARTIAL ? 'badge-warning' : 'badge-neutral';
          return (
            <div key={tracker.id} className="card py-3">
              <div className="flex justify-between items-center gap-3 mb-2">
                <div className="flex items-center gap-2"><div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600"><Gift size={14} /></div><div><h4 className="font-bold text-xs">{card ? `${card.bank} - ${card.name}` : 'غير محدد'}</h4><span className={`badge ${statusCls} mt-1`}>{CASHBACK_STATUS_LABELS[tracker.status]}</span></div></div>
                <div className="flex gap-1">{tracker.status !== CASHBACK_STATUS.RECEIVED && (<button onClick={() => markReceived(tracker)} className="btn btn-primary text-[10px] py-1.5 px-2"><CheckCircle2 size={12} /> استلمت</button>)}<button onClick={() => deleteTracker(tracker.id)} className="btn btn-ghost p-1.5 text-red-500"><Trash2 size={12} /></button></div>
              </div>
              <div className="flex justify-between text-xs mb-1.5"><span style={{ color: 'var(--text-muted)' }}>متوقع: {fmt(tracker.expectedAmount)} • مستلم: {fmt(tracker.receivedAmount)}</span></div>
              <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}><div className={`h-full ${pct >= 100 ? 'bg-emerald-500' : pct > 0 ? 'bg-amber-500' : 'bg-slate-300'}`} style={{ width: `${Math.min(100, pct)}%` }}></div></div>
            </div>
          );
        })}
      </div>
      {showAdd && (
        <Modal isOpen={true} onClose={() => setShowAdd(false)} title="متتبع كاش باك" icon="🎁">
          <div className="space-y-3">
            <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>البطاقة</label><select className="input-field" value={newTracker.cardId} onChange={e => setNewTracker({ ...newTracker, cardId: Number(e.target.value) })}>{cards.map(c => <option key={c.id} value={c.id}>{c.bank} - {c.name}</option>)}</select></div>
            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الشهر</label><select className="input-field text-sm" value={newTracker.month} onChange={e => setNewTracker({ ...newTracker, month: e.target.value })}>{getMonthsForYear(newTracker.year).map(m => <option key={m} value={m}>{m}</option>)}</select></div>
              <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>السنة</label><select className="input-field text-sm" value={newTracker.year} onChange={e => setNewTracker({ ...newTracker, year: Number(e.target.value) })}>{YEARS_LIST.map(y => <option key={y} value={y}>{y}</option>)}</select></div>
            </div>
            <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ المتوقع *</label><input type="text" inputMode="decimal" className="input-field text-base font-black text-blue-600 text-center" value={newTracker.expectedAmount} onChange={e => setNewTracker({ ...newTracker, expectedAmount: e.target.value })} placeholder="0.00" /></div>
            <button onClick={addTracker} className="btn btn-primary w-full py-2.5 text-sm"><Save size={14} /> إضافة</button>
          </div>
        </Modal>
      )}
    </div>
  );
});

const DuplicateDetectionSystem = ({ transactions, data, dispatch, addNotification, saveHistory }) => {
  const [threshold, setThreshold] = useState(2);
  const [selectedMonth, setSelectedMonth] = useState('all');
  const [expandedGroups, setExpandedGroups] = useState({});
  const duplicates = useMemo(() => {
    const map = {};
    const filtered = selectedMonth === 'all' ? transactions : transactions.filter(t => t.month === selectedMonth);
    filtered.forEach(t => { const key = `${safeNumber(t.amount)}_${t.method}_${t.category}_${(t.date||'').slice(0,10)}`; if (!map[key]) map[key] = []; map[key].push(t); });
    return Object.entries(map).filter(([_, items]) => items.length >= threshold).map(([key, items]) => ({ key, amount: items[0].amount, count: items.length, items, category: items[0].category, risk: items.length >= 5 ? 'high' : items.length >= 3 ? 'medium' : 'low' }));
  }, [transactions, threshold, selectedMonth]);
  const doDelete = (ids) => { dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'تأكيد الحذف', message: `سيتم حذف ${ids.length} عملية مكررة.`, onConfirm: () => { saveHistory(); dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.filter(t => !ids.includes(t.id)) }); addNotification({ type: 'success', title: 'تم التنظيف' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) }); };
  const handleDeleteAll = () => { let idsToDelete = []; duplicates.forEach(d => { d.items.slice(1).forEach(item => { if (!isMonthClosed(data, item.year || 2026, item.month)) idsToDelete.push(item.id); }); }); if (idsToDelete.length === 0) { addNotification({ type: 'info', title: 'لا يوجد' }); return; } doDelete(idsToDelete); };
  const deleteSingle = (item) => { if (isMonthClosed(data, item.year || 2026, item.month)) { addNotification({ type: 'error', title: 'محظور', message: 'الشهر مغلق' }); return; } doDelete([item.id]); };
  return (
    <div className="space-y-4 animate-fadeIn pb-20">
      <div className="card">
        <div className="flex items-start justify-between gap-3 flex-wrap">
          <div><h2 className="text-lg font-black flex items-center gap-2"><Filter className="text-blue-500" size={18} /> كاشف التكرار</h2><p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>{threshold}+ تكرار بنفس المبلغ والطريقة والتاريخ</p></div>
          <button onClick={handleDeleteAll} disabled={duplicates.length === 0} className={`btn ${duplicates.length === 0 ? 'btn-secondary' : 'btn-primary'} text-xs`}><Trash2 size={14} /> تنظيف</button>
        </div>
      </div>
      <div className="card grid grid-cols-2 gap-4">
        <div><label className="block text-[11px] font-bold mb-2" style={{ color: 'var(--text-muted)' }}>نطاق البحث</label><select className="input-field text-sm" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}><option value="all">جميع الشهور</option>{YEARS_LIST.flatMap(y => getMonthsForYear(y).map(m => <option key={makeMonthKey(y,m)} value={m}>{m} {y}</option>))}</select></div>
        <div><label className="block text-[11px] font-bold mb-2" style={{ color: 'var(--text-muted)' }}>الحساسية ({threshold})</label><input type="range" min="2" max="10" className="w-full mt-3 accent-blue-600" value={threshold} onChange={e => setThreshold(Number(e.target.value))} /></div>
      </div>
      {duplicates.length === 0 ? (
        <div className="card text-center p-12"><CheckCircle2 size={40} className="text-emerald-500 mx-auto mb-3" /><h3 className="text-base font-black">ممتاز! لا توجد تكرارات</h3></div>
      ) : duplicates.map(dup => (
        <div key={dup.key} className="card">
          <div className="flex justify-between items-center cursor-pointer -m-4.5 p-4.5" onClick={() => setExpandedGroups(p => ({ ...p, [dup.key]: !p[dup.key] }))}>
            <div className="flex items-center gap-3"><div className={`p-2 rounded-lg ${dup.risk === 'high' ? 'bg-red-50 text-red-500 dark:bg-red-950/30' : 'bg-amber-50 text-amber-500 dark:bg-amber-950/30'}`}><Repeat size={16} /></div><div><h4 className="font-black text-sm">{fmt(dup.amount)} ج.م</h4><span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{dup.category} - {dup.count} مرات</span></div></div>
            <ChevronDown className={`transition-transform ${expandedGroups[dup.key] ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} size={16} />
          </div>
          {expandedGroups[dup.key] && (
            <div className="mt-3 pt-3 space-y-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
              {dup.items.map((item, idx) => (<div key={item.id} className="flex justify-between items-center p-2.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}><div className="text-xs font-medium flex items-center gap-2 flex-wrap">{item.date} • {item.description || 'بدون وصف'}</div>{idx !== 0 && <button onClick={() => deleteSingle(item)} aria-label="حذف" className="text-red-500 p-1.5 rounded-lg"><Trash2 size={12} /></button>}</div>))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
};

});

const MonthComparisonView = memo(({ transactions, selectedYear, selectedMonth }) => {
  const idx = getMonthIndex(selectedMonth);
  const prevMonth = idx > 0 ? ALL_MONTHS[idx - 1] : 'ديسمبر';
  const prevYear = idx > 0 ? selectedYear : selectedYear - 1;
  const curTx = transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
  const prevTx = transactions.filter(t => t.month === prevMonth && (t.year || 2026) === prevYear);
  const calc = (txs, type) => txs.filter(t => t.type === type && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
  const curInc = calc(curTx, 'income'), curExp = calc(curTx, 'expense');
  const prevInc = calc(prevTx, 'income'), prevExp = calc(prevTx, 'expense');
  const pct = (cur, prev) => prev === 0 ? (cur > 0 ? 100 : 0) : Math.round(((cur - prev) / prev) * 100);
  const catData = {};
  curTx.filter(t => t.status === 'paid').forEach(t => { if (!catData[t.category]) catData[t.category] = { cur: 0, prev: 0, type: t.type }; catData[t.category].cur += safeNumber(t.amount); });
  prevTx.filter(t => t.status === 'paid').forEach(t => { if (!catData[t.category]) catData[t.category] = { cur: 0, prev: 0, type: t.type }; catData[t.category].prev += safeNumber(t.amount); });
  const catRows = Object.entries(catData).map(([cat, d]) => ({ cat, cur: d.cur, prev: d.prev, change: pct(d.cur, d.prev), type: d.type })).sort((a, b) => Math.abs(b.cur - b.prev) - Math.abs(a.cur - a.prev));
  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card"><h2 className="text-lg font-black flex items-center gap-2"><Activity className="text-indigo-500" size={18} /> مقارنة الشهور</h2><p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} مقارنة بـ {prevMonth} {prevYear}</p></div>
      <div className="grid grid-cols-3 gap-3">
        <div className="card py-3"><p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الدخل</p><p className="text-lg font-black text-emerald-600">{fmt(curInc)}</p><span className={`badge mt-1.5 ${curInc >= prevInc ? 'badge-success' : 'badge-danger'} text-[10px]`}>{curInc >= prevInc ? '↑' : '↓'} {Math.abs(pct(curInc, prevInc))}%</span></div>
        <div className="card py-3"><p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>المصروفات</p><p className="text-lg font-black text-red-600">{fmt(curExp)}</p><span className={`badge mt-1.5 ${curExp <= prevExp ? 'badge-success' : 'badge-danger'} text-[10px]`}>{curExp <= prevExp ? '↓' : '↑'} {Math.abs(pct(curExp, prevExp))}%</span></div>
        <div className="card py-3"><p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الصافي</p><p className={`text-lg font-black ${curInc - curExp >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(curInc - curExp)}</p></div>
      </div>

const CategoriesView = memo(({ transactions, selectedMonth, selectedYear, catViewType, budgets, dispatch, handleDelete, onSelectYear, onSelectMonth }) => {

  return (

            </div>
          );
        })}
      </div>
    </div>
  );
});
  const PlannerView = memo(({ updatedLoans, cards, selectedMonth, selectedYear, monthlyPlans, totalLiquidityNow, data }) => {
  const projection = useMemo(() => {
    const seq = [];
    const now = new Date();
    let y = now.getFullYear(), mi = now.getMonth();
    for (let i = 0; i < 6; i++) { seq.push({ year: y, month: ALL_MONTHS[mi] }); mi++; if (mi > 11) { mi = 0; y++; } }
    let cumulative = totalLiquidityNow;
    const result = [];
    seq.forEach(({ year, month }) => {
      const plan = monthlyPlans?.[makeMonthKey(year, month)] || {};
      const inc = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent) + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE) + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedFreelance) + safeNumber(plan.expectedCash);
      const out = safeNumber(plan.expectedCashExpenses) + safeNumber(plan.plannedPayments);
      const opening = cumulative;
      const net = inc - out;
      cumulative = opening + net;
      result.push({ year, month, opening, inc, out, net, running: cumulative, danger: cumulative < 0, warn: cumulative < 5000 && cumulative >= 0 });
    });
    return result;
  }, [totalLiquidityNow, monthlyPlans]);
  const maxAbsRunning = useMemo(() => Math.max(1, ...projection.map(p => Math.abs(p.running))), [projection]);
  const minPoint = useMemo(() => projection.reduce((min, p) => p.running < min.running ? p : min, projection[0] || { running: 0, month: '-' }), [projection]);

        <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>إجمالي مصروف متوقع</p><p className="text-base font-black text-red-600">{fmt(totalOut)}</p></div>
        <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>أدنى سيولة</p><p className={`text-base font-black ${minPoint.running < 0 ? 'text-red-600' : 'text-amber-600'}`}>{fmt(minPoint.running)}</p><p className="text-[9px] mt-0.5" style={{ color: 'var(--text-muted)' }}>في {minPoint.month}</p></div>
      </div>
      <div className="card">
        <h3 className="font-black text-sm mb-4 flex items-center gap-2"><Activity className="text-blue-500" size={14} /> تدفق السيولة</h3>
        <div className="space-y-2.5">
          {projection.map((p, idx) => {
            const pct = Math.round((Math.abs(p.running) / maxAbsRunning) * 100);
            const isNeg = p.running < 0;
            return (
              <div key={idx}>
                <div className="flex justify-between items-center mb-1"><div className="flex items-center gap-2"><span className="text-xs font-black">{p.month}</span><span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{String(p.year).slice(2)}</span></div><div className="flex items-center gap-2"><span className={`text-xs font-black ${isNeg ? 'text-red-600' : p.warn ? 'text-amber-600' : 'text-emerald-600'}`}>{fmt(p.running)} ج.م</span>{isNeg && <span className="badge badge-danger text-[9px] px-1.5 py-0">عجز</span>}{p.warn && !isNeg && <span className="badge badge-warning text-[9px] px-1.5 py-0">انتباه</span>}</div></div>

              </div>
            );
          })}
        </div>

      <div className="card p-0 overflow-hidden">
