/* ═══════════════ NUMERIC ENGINE ═══════════════ */
const toPiasters = (v) => { const n = Number(v); if (!isFinite(n) || isNaN(n)) return 0; return Math.round(n * 100); };
const fromPiasters = (p) => (p || 0) / 100;
const roundMoney = (v) => { const n = Number(v); if (!isFinite(n)) return 0; return Math.round(n * 100) / 100; };
const safeNumber = (v, f = 0) => { const n = Number(v); return isNaN(n) || !isFinite(n) ? f : n; };
const fmt = (n) => safeNumber(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtInt = (n) => Math.round(safeNumber(n)).toLocaleString('en-US');
const fmtShort = (n) => {
  const v = Math.abs(safeNumber(n));
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toFixed(0);
};
const formatAdaptive = (value, maxChars = 12) => {
  const str = fmt(value);
  if (str.length <= maxChars) return str;
  const abs = Math.abs(safeNumber(value));
  if (abs >= 1e9) return `${(value / 1e9).toFixed(2)}B`;
  if (abs >= 1e6) return `${(value / 1e6).toFixed(2)}M`;
  if (abs >= 1e3) return `${(value / 1e3).toFixed(1)}K`;
  return str;
};

/* ═══════════════ SAFE UTILS ═══════════════ */
const safeParseJson = (raw, fallback) => {
  if (raw === null || raw === undefined) return fallback;
  try { const v = JSON.parse(raw); return v === null || v === undefined ? fallback : v; }
  catch (e) { return fallback; }
};

const escapeHtml = (u) => {
  if (typeof u !== 'string') return u;
  return u.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
};

let _idSeq = 0;
const getSafeId = () => {
  try { if (crypto?.randomUUID) return crypto.randomUUID(); } catch {}
  return `${Date.now()}-${(++_idSeq).toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
};

const normalizeText = (t) => !t ? "" : t.toString()
  .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
  .replace(/[\u064B-\u065F]/g,'').replace(/\s+/g,' ')
  .trim().toLowerCase();

const toEnglishDigits = (s) => {
  if (s === null || s === undefined) return s;
  const map = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9', '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9' };
  return String(s).replace(/[٠-٩۰-۹]/g, d => map[d]);
};

const parseNumberInput = (v) => {
  const cleaned = toEnglishDigits(v).replace(/[^\d.\-]/g, '');
  const n = Number(cleaned);
  return isNaN(n) ? 0 : n;
};

const getLocalISODate = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const dayStart = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const endOfToday = () => { const x = new Date(); x.setHours(23,59,59,999); return x; };

const calculateDaysLeft = (d) => {
  if (!d) return null;
  try {
    const t = new Date(); t.setHours(0,0,0,0);
    const g = new Date(d); g.setHours(0,0,0,0);
    return Math.ceil((g-t)/86400000);
  } catch { return null; }
};

const parseISODate = (iso) => {
  if (!iso) return null;
  if (iso instanceof Date) return isNaN(iso) ? null : iso;
  const s = String(iso).trim();
  if (!s) return null;
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if (m) {
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d) ? null : d;
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
};

const getTxTimestamp = (t) => {
  if (!t) return 0;
  if (t.createdAt) { const ts = new Date(t.createdAt).getTime(); if (!isNaN(ts)) return ts; }
  const d = parseISODate(t.date);
  return d ? d.getTime() : 0;
};

const formatTxTime = (createdAt) => {
  if (!createdAt) return '';
  try { const d = new Date(createdAt); if (isNaN(d)) return ''; return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }); }
  catch { return ''; }
};

const compareTransactions = (a, b) => {
  const dA = parseISODate(a?.date)?.getTime() ?? 0;
  const dB = parseISODate(b?.date)?.getTime() ?? 0;
  if (dA !== dB) return dB - dA;
  const cA = getTxTimestamp(a);
  const cB = getTxTimestamp(b);
  if (cA !== cB) return cB - cA;
  return String(b?.id || '').localeCompare(String(a?.id || ''));
};

const sortTransactions = (txs) => {
  if (!Array.isArray(txs)) return [];
  return [...txs].sort(compareTransactions);
};

const makeMonthKey = (year, month) => `${year}-${month}`;
const parseMonthKey = (key) => {
  if (!key || typeof key !== 'string' || !key.includes('-')) return null;
  const [y, ...rest] = key.split('-');
  const year = Number(y);
  if (isNaN(year)) return null;
  return { year, month: rest.join('-') };
};
const keyToInputMonth = (k) => {
  if (!k || typeof k !== 'string') return '';
  const idx = k.indexOf('-');
  if (idx < 0) return '';
  const y = k.slice(0, idx);
  const mName = k.slice(idx + 1);
  const mIdx = ALL_MONTHS.indexOf(mName);
  if (mIdx < 0 || !/^\d{4}$/.test(y)) return '';
  return `${y}-${String(mIdx + 1).padStart(2, '0')}`;
};
const addMonthsToYM = (year, month, offset) => {
  let idx = getMonthIndex(month) + offset;
  let y = year;
  while (idx > 11) { idx -= 12; y++; }
  while (idx < 0) { idx += 12; y--; }
  return { year: y, month: ALL_MONTHS[idx] };
};

const getDefaultMonthYear = () => {
  const now = new Date();
  const y = now.getFullYear();
  const m = ALL_MONTHS[now.getMonth()];
  if (YEARS_CONFIG[y] && YEARS_CONFIG[y].includes(m)) return { year: y, month: m };
  return { year: PROJECT_START_YEAR, month: PROJECT_START_MONTH };
};

const formatArabicDate = (iso) => {
  const d = parseISODate(iso);
  if (!d) return iso || '—';
  return d.toLocaleDateString('ar-EG', { day: '2-digit', month: 'short', year: 'numeric' });
};

const formatArabicDateTime = (d = new Date()) =>

/* ═══════════════ VALIDATION ═══════════════ */
const VALIDATION = {
  AMOUNT: { min: 0.01, max: 10000000, label: 'المبلغ' },
  TEXT: { min: 1, max: 500, label: 'النص' },
};

const validateAmount = (raw, opts = {}) => {
  const cfg = { ...VALIDATION.AMOUNT, ...opts };
  const cleaned = toEnglishDigits(String(raw ?? '')).replace(/[^\d.\-]/g, '');
  const n = parseFloat(cleaned);
  if (isNaN(n) || !isFinite(n)) return { valid: false, error: 'اكتب رقم صحيح', value: 0 };
  if (n < cfg.min) return { valid: false, error: `الحد الأدنى ${fmt(cfg.min)} ج.م`, value: 0 };
  if (n > cfg.max) return { valid: false, error: `الحد الأقصى ${fmt(cfg.max)} ج.م`, value: 0 };
  return { valid: true, value: n };
};

const validateText = (raw, opts = {}) => {
  const cfg = { ...VALIDATION.TEXT, ...opts };
  const s = String(raw || '').trim();
  if (s.length < cfg.min) return { valid: false, error: `${cfg.label} مطلوب` };
  if (s.length > cfg.max) return { valid: false, error: `${cfg.label} طويل جداً` };
  return { valid: true, value: s };
};

const validateDate = (raw) => {
  if (!raw) return { valid: false, error: 'التاريخ مطلوب' };
  const d = parseISODate(raw);
  if (!d) return { valid: false, error: 'تاريخ غير صالح' };
  const year = d.getFullYear();
  if (year < 2020 || year > 2100) return { valid: false, error: 'السنة خارج النطاق' };
  return { valid: true, value: d };
};

/* ═══════════════ PIN ═══════════════ */
const hashPin = async (pin) => {
  if (!crypto?.subtle?.importKey || !crypto?.subtle?.deriveBits) throw new Error('هذا المتصفح لا يدعم التشفير الآمن');
  try {
    const encoder = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', encoder.encode(String(pin)), 'PBKDF2', false, ['deriveBits']);
    const salt = encoder.encode('fintracker_salt_v88_2026');
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, keyMaterial, 256);
    return 'pbkdf2_' + Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { console.error('hashPin failed:', e); throw new Error('فشل تشفير الرمز'); }
};
const getStoredPinHash = () => localStorage.getItem(PIN_HASH_KEY);
const savePinHash = async (pin) => { const hash = await hashPin(pin); localStorage.setItem(PIN_HASH_KEY, hash); };
const verifyPin = async (pin) => {
  const stored = getStoredPinHash();
  if (!stored) { if (pin === DEFAULT_PIN) { try { await savePinHash(pin); } catch(e) {} return true; } return false; }
  if (!stored.startsWith('pbkdf2_')) return false;
  try { const current = await hashPin(pin); return current === stored; } catch { return false; }
};

const PIN_SESSION_KEY = 'pin_session_token_v88_1';
const buildPinSessionToken = async (pin) => {
  try {
    const encoder = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', encoder.encode(pin + '|' + getLocalISODate()), 'PBKDF2', false, ['deriveBits']);
    const salt = encoder.encode('session_salt_v88');
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 10000, hash: 'SHA-256' }, keyMaterial, 128);
    return 'sess_' + Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch { return null; }
};
const savePinSession = async (pin) => { const token = await buildPinSessionToken(pin); if (token) sessionStorage.setItem(PIN_SESSION_KEY, token); };
const verifyPinSession = async (pin) => {
  const stored = sessionStorage.getItem(PIN_SESSION_KEY);
  if (!stored) return false;
  const expected = await buildPinSessionToken(pin);
  return stored === expected;
};

const openPrintWindow = (htmlContent, title = 'تقرير', options = {}) => {
  const { autoPrint = true } = options;
  const printWindow = window.open('', '_blank', 'width=900,height=1100');
  if (!printWindow) {
    alert('⚠️ الرجاء السماح بالنوافذ المنبثقة لتفعيل الطباعة');
    return null;
  }
  printWindow.document.write(htmlContent);
  printWindow.document.close();
  printWindow.document.title = title;
  if (autoPrint) {
    printWindow.onload = () => {
      setTimeout(() => {
        try { printWindow.focus(); printWindow.print(); } catch (e) { console.warn('Print failed:', e); }
      }, 500);
    };
  }
  return printWindow;
};

const generateHanyLedgerReport = (data, options = {}) => {
  const { includePurchases = true, includeSettlements = true, includeGrouped = true, monthFilter = null, includeWatermark = true } = options;

  // ✅ V88.1.1 FIX — يقبل method أو hanyEffect
  const purchases = (data.transactions || [])
    .filter(t => (t.method === HANY_TAB_METHOD || t.hanyEffect === 'purchase') && isHanyShopCategory(t.category) && !isCarryoverMarker(t))
    .sort(compareTransactions);

  const settlements = (data.transactions || [])
    .filter(t => isHanySettleTx(t) && t.status === 'paid')
    .sort(compareTransactions);

  const totalPurchases = purchases.reduce((s, t) => s + safeNumber(t.amount), 0);
  const totalSettlements = settlements.reduce((s, t) => s + safeNumber(t.amount), 0);
  const currentPayable = Math.max(0, totalPurchases - totalSettlements);

  const filteredPurchases = monthFilter
    ? purchases.filter(t => t.month === monthFilter.month && (t.year || 2026) === monthFilter.year)
    : purchases;
  const filteredSettlements = monthFilter
    ? settlements.filter(t => t.month === monthFilter.month && (t.year || 2026) === monthFilter.year)
    : settlements;

  const groupedMap = {};
  filteredPurchases.forEach(t => {
    const key = (t.description || 'بدون وصف').trim();
    if (!groupedMap[key]) groupedMap[key] = { name: key, count: 0, total: 0 };
    groupedMap[key].count++;
    groupedMap[key].total += safeNumber(t.amount);
  });
  const groupedList = Object.values(groupedMap).sort((a, b) => b.total - a.total);

  const monthLabel = monthFilter ? `${monthFilter.month} ${monthFilter.year}` : 'كل الفترات';
  const reportTitle = `كشف حساب دفتر محل هاني — ${monthLabel}`;

  const purchaseRows = filteredPurchases.map(t => `
    <tr>
      <td class="col-date">${formatArabicDate(t.date)}</td>
      <td class="col-desc">
        <div class="desc-main">${escapeHtml(t.description || 'بدون وصف')}</div>
        <div class="desc-sub">${escapeHtml(t.month || '')} ${t.year || ''}${t.status === 'paid' ? ' · معتمد' : ' · معلق'}</div>
      </td>
      <td class="col-amount debit">+${fmt(t.amount)}</td>
    </tr>
  `).join('');

  const settleRows = filteredSettlements.map(t => `
    <tr>
      <td class="col-date">${formatArabicDate(t.date)}</td>
      <td class="col-desc">
        <div class="desc-main">${escapeHtml(t.description || 'سداد دفتر هاني')}</div>
        <div class="desc-sub">${escapeHtml(getMethodLabel(t.method))}${t.linkedHanyMonth ? ` · مرتبط بـ ${escapeHtml(t.linkedHanyMonth)}` : ''}</div>
      </td>
      <td class="col-amount credit">−${fmt(t.amount)}</td>
    </tr>
  `).join('');

  const groupedRows = groupedList.map((g, i) => `
    <tr>
      <td class="col-date">${i + 1}</td>
      <td class="col-desc"><div class="desc-main">${escapeHtml(g.name)}</div></td>
      <td style="text-align:center;font-weight:800">${g.count}</td>
      <td class="col-amount" style="color:#635BFF">${fmt(g.total)}</td>
      <td class="col-amount" style="color:#64748B;font-size:9px">${fmt(g.total / g.count)}</td>
    </tr>
  `).join('');

  const content = `
    ${buildReportHeader(reportTitle, { badge: 'كشف حساب مورد' })}
    <div class="report-hero-strip">
      <div class="hero-cell opening"><div class="hero-label">📊 الرصيد المستحق الحالي</div><div class="hero-value">${fmt(currentPayable)} ج.م</div></div>

const generateTransactionsReport = (data, options = {}) => {
  const { selectedMonth = 'أكتوبر', selectedYear = 2026, filterType = 'all', includeOnlyPaid = false, includeWatermark = true } = options;

  const allTxs = (data.transactions || []).filter(t => {
    if (isCarryoverMarker(t)) return false;
    if (t.month !== selectedMonth || (t.year || 2026) !== selectedYear) return false;
    if (filterType !== 'all' && t.type !== filterType) return false;
    if (includeOnlyPaid && t.status !== 'paid') return false;
    return true;
  }).sort(compareTransactions);

  const totalIncome = allTxs.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
  const totalExpense = allTxs.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
  const netFlow = totalIncome - totalExpense;

  const reportTitle = `كشف المعاملات — ${selectedMonth} ${selectedYear}`;
  const typeLabel = filterType === 'expense' ? 'مصروفات' : filterType === 'income' ? 'إيرادات' : 'شامل';

  const groupedByDate = {};
  allTxs.forEach(t => {
    const d = t.date || 'unknown';
    if (!groupedByDate[d]) groupedByDate[d] = [];
    groupedByDate[d].push(t);
  });
  const sortedDates = Object.keys(groupedByDate).sort((a, b) => b.localeCompare(a));

  let runningBalance = 0;
  const rows = [];
  sortedDates.forEach(date => {
    const dayTxs = groupedByDate[date].sort(compareTransactions);
    const dayTotal = dayTxs.reduce((s, t) => s + (t.type === 'income' ? safeNumber(t.amount) : -safeNumber(t.amount)), 0);
    rows.push(`
      <tr class="report-day-header">
        <td colspan="4">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span>📅 ${formatArabicDate(date)}</span>
            <span style="font-size:10px">${dayTxs.length} عملية · صافي اليوم: ${dayTotal >= 0 ? '+' : ''}${fmt(dayTotal)} ج.م</span>
          </div>
        </td>
      </tr>
    `);
    dayTxs.forEach(t => {
      const isIncome = t.type === 'income';
      runningBalance += isIncome ? safeNumber(t.amount) : -safeNumber(t.amount);
      rows.push(`
        <tr>
          <td class="col-desc">
            <div class="desc-main">${escapeHtml(t.description || t.category || 'بدون وصف')}</div>
            <div class="desc-sub">${escapeHtml(t.category)} · ${escapeHtml(getMethodLabel(t.method))}${t.status !== 'paid' ? ' · <span style="color:#D97706;font-weight:700">معلق</span>' : ''}</div>
          </td>
          <td style="text-align:center;width:80px">
            <span style="padding:2px 8px;border-radius:999px;font-size:9px;font-weight:800;background:${isIncome ? '#DCFCE7' : '#FEE2E2'};color:${isIncome ? '#059669' : '#DC2626'}">${isIncome ? 'وارد' : 'صادر'}</span>
          </td>
          <td class="col-amount ${isIncome ? 'credit' : 'debit'}">${isIncome ? '+' : '−'}${fmt(t.amount)}</td>
          <td class="col-balance">${fmt(runningBalance)}</td>
        </tr>
      `);
    });
  });

  const content = `
    ${buildReportHeader(reportTitle, { badge: `فلتر: ${typeLabel}` })}
    <div class="report-kpi-grid">
      <div class="report-kpi success"><div class="kpi-label">إجمالي الإيرادات</div><div class="kpi-value">${fmt(totalIncome)}</div></div>
      <div class="report-kpi danger"><div class="kpi-label">إجمالي المصروفات</div><div class="kpi-value">${fmt(totalExpense)}</div></div>
      <div class="report-kpi ${netFlow >= 0 ? 'accent' : 'danger'}"><div class="kpi-label">صافي التدفق</div><div class="kpi-value">${netFlow >= 0 ? '+' : ''}${fmt(netFlow)}</div></div>
      <div class="report-kpi info"><div class="kpi-label">عدد العمليات</div><div class="kpi-value">${allTxs.length}</div></div>
    </div>
    <div class="report-section-title"><span>📋 تفاصيل المعاملات</span><span class="section-sub">${sortedDates.length} يوم · ${allTxs.length} عملية</span></div>
    <table class="report-table">
      <thead><tr><th>البيان / الفئة</th><th style="width:80px;text-align:center">النوع</th><th style="width:110px">المبلغ (ج.م)</th><th style="width:110px">الرصيد التراكمي</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>
    <div class="report-totals-box">
      <div class="report-totals-row"><span class="total-label">💰 إجمالي الإيرادات (معتمد)</span><span class="total-value credit">+${fmt(totalIncome)} ج.م</span></div>
      <div class="report-totals-row"><span class="total-label">💸 إجمالي المصروفات (معتمد)</span><span class="total-value debit">−${fmt(totalExpense)} ج.م</span></div>
      <div class="report-totals-row final"><span class="total-label">📊 صافي التدفق النقدي</span><span class="total-value">${netFlow >= 0 ? '+' : ''}${fmt(netFlow)} ج.م</span></div>
    </div>
    ${buildReportFooter(`كشف معاملات ${selectedMonth} ${selectedYear}`)}
  `;

  const watermark = includeWatermark ? '<div class="report-watermark">كشف معاملات</div>' : '';
  return wrapReportHtml(`<div style="position:relative">${watermark}${content}</div>`, reportTitle);
};

const generateCardsReport = (data, options = {}) => {
  const { includeWatermark = true } = options;
  const reportTitle = 'كشف البطاقات الائتمانية والمديونيات';
  const cards = data.cards || [];

  const cardsData = cards.map(card => ({
    card,
    debt: computeCardDebt(data, card),
    available: Math.max(0, safeNumber(card.limit) - Math.max(0, computeCardDebt(data, card))),
    limit: safeNumber(card.limit)
  }));

  const totalDebt = cardsData.reduce((s, c) => s + Math.max(0, c.debt), 0);
  const totalLimit = cardsData.reduce((s, c) => s + c.limit, 0);
  const totalAvailable = cardsData.reduce((s, c) => s + c.available, 0);
  const usagePct = totalLimit > 0 ? (totalDebt / totalLimit) * 100 : 0;

  const cardRows = cardsData.map(({ card, debt, available, limit }) => {
    const pct = limit > 0 ? (Math.max(0, debt) / limit) * 100 : 0;
    const subCards = Array.isArray(card.subCardLast4) && card.subCardLast4.length > 0
      ? ` · فرعية: ${card.subCardLast4.map(s => '••••' + s).join(', ')}`
      : '';
    return `
      <tr>
        <td class="col-desc">
          <div class="desc-main">${escapeHtml(card.bank)} - ${escapeHtml(card.name)}</div>
          <div class="desc-sub">•••• ${escapeHtml(card.last4)} · ${escapeHtml(card.holderName || '')} · ينتهي ${escapeHtml(card.expiry || '')}${subCards}</div>
        </td>
        <td class="col-balance">${fmt(limit)}</td>
        <td class="col-amount ${debt > 0 ? 'debit' : 'credit'}">${fmt(Math.max(0, debt))}</td>
        <td class="col-balance">${fmt(available)}</td>
        <td style="text-align:center;font-weight:800;color:${pct > 70 ? '#DC2626' : pct > 40 ? '#D97706' : '#059669'}">${Math.round(pct)}%</td>
      </tr>
    `;
  }).join('');

  const content = `
    ${buildReportHeader(reportTitle, { badge: `${cards.length} بطاقة` })}
    <div class="report-kpi-grid">
      <div class="report-kpi accent"><div class="kpi-label">إجمالي الحدود</div><div class="kpi-value">${fmt(totalLimit)}</div></div>
      <div class="report-kpi danger"><div class="kpi-label">إجمالي المديونية</div><div class="kpi-value">${fmt(totalDebt)}</div></div>
      <div class="report-kpi success"><div class="kpi-label">إجمالي المتاح</div><div class="kpi-value">${fmt(totalAvailable)}</div></div>
      <div class="report-kpi ${usagePct > 70 ? 'danger' : usagePct > 40 ? 'warning' : 'success'}"><div class="kpi-label">نسبة الاستخدام</div><div class="kpi-value">${Math.round(usagePct)}%</div></div>
    </div>
    <div class="report-section-title"><span>💳 تفاصيل البطاقات</span><span class="section-sub">${cards.length} بطاقة</span></div>
    <table class="report-table">
      <thead><tr><th>البطاقة</th><th style="width:100px">الحد</th><th style="width:100px">المديونية</th><th style="width:100px">المتاح</th><th style="width:60px;text-align:center">الاستخدام</th></tr></thead>
      <tbody>
        ${cardRows}
        <tr style="background:#EEEDFF">
          <td style="font-weight:900;color:#4A42E5">الإجمالي</td>
          <td class="col-balance" style="font-weight:900">${fmt(totalLimit)}</td>
          <td class="col-amount debit" style="font-weight:900">${fmt(totalDebt)}</td>
          <td class="col-balance" style="font-weight:900">${fmt(totalAvailable)}</td>
          <td style="text-align:center;font-weight:900;color:#4A42E5">${Math.round(usagePct)}%</td>
        </tr>
      </tbody>
    </table>
    <div class="report-totals-box">
      <div class="report-totals-row"><span class="total-label">💳 إجمالي المديونية المستحقة</span><span class="total-value debit">${fmt(totalDebt)} ج.م</span></div>
      <div class="report-totals-row"><span class="total-label">✅ إجمالي المتاح للسحب</span><span class="total-value credit">${fmt(totalAvailable)} ج.م</span></div>
      <div class="report-totals-row final"><span class="total-label">📊 نسبة الاستخدام الإجمالية</span><span class="total-value">${Math.round(usagePct)}%</span></div>
    </div>
    ${buildReportFooter('كشف البطاقات الائتمانية — لحظي')}
  `;

  const watermark = includeWatermark ? '<div class="report-watermark">بطاقات</div>' : '';
  return wrapReportHtml(`<div style="position:relative">${watermark}${content}</div>`, reportTitle);
};

const downloadHtmlReport = (htmlContent, fileName) => {
  const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName || `report_${Date.now()}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
};

const shareReport = async (reportTitle, htmlContent, fileName) => {
  try {
    if (navigator.canShare && navigator.share) {
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const file = new File([blob], fileName || 'report.html', { type: 'text/html' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ title: reportTitle, text: `📊 ${reportTitle}\n\nتم إنشاء التقرير من محفظتي المالية V88.1.1`, files: [file] });
        return { ok: true, method: 'file' };
      }
    }
    if (navigator.share) {
      await navigator.share({ title: reportTitle, text: `📊 ${reportTitle}\n\nتم إنشاء التقرير من محفظتي المالية V88.1.1` });
      return { ok: true, method: 'text' };
    }
    downloadHtmlReport(htmlContent, fileName);
    return { ok: true, method: 'download' };
  } catch (e) {
    if (e.name === 'AbortError') return { ok: false, method: 'cancelled' };
    console.error('Share failed:', e);
    downloadHtmlReport(htmlContent, fileName);
    return { ok: true, method: 'download-fallback' };
  }
};

/* ═══════════════ ACCOUNTING CORE ═══════════════ */
const inferKind = (tx) => {
  if (tx.kind) return tx.kind;
  if (tx.category === 'أخرى' && (tx.description || '').includes('تسوية')) return KIND.ADJUSTMENT;
  if (tx.category === 'تسوية رصيد') return KIND.ADJUSTMENT;
  if (isHanySettleCategory(tx.category)) return KIND.FINANCIAL;
  if (isFinancial(tx.category)) return KIND.FINANCIAL;
  return KIND.OPERATIONAL;
};

const isBeneficiaryCategorySafe = (cat) => typeof cat === 'string' && cat.startsWith('مصروف شهري - ');
const isMonthClosed = (data, year, month) => {
  const key = makeMonthKey(year, month);
  return Array.isArray(data?.closedMonths) && data.closedMonths.includes(key);
};

const expandTransferLinks = (ids, allTx) => {
  const set = new Set(ids);
  const list = allTx || [];
  ids.forEach(id => {
    const t = list.find(x => x.id === id);
    if (t?.linkedTransferId) {
      list.forEach(x => { if (x.linkedTransferId === t.linkedTransferId) set.add(x.id); });
    }
  });
  return Array.from(set);
};

const findOrphanTransfers = (transactions) => {
  const groups = {};
  (transactions || []).forEach(t => {
    if (!t.linkedTransferId) return;
    if (!groups[t.linkedTransferId]) groups[t.linkedTransferId] = [];
    groups[t.linkedTransferId].push(t);
  });
  return Object.entries(groups).filter(([_, arr]) => arr.length < 2).map(([id, arr]) => ({ transferId: id, items: arr }));
};

const invalidateSnapshotsFrom = (snapshots, year, month) => {
  const startIdx = getMonthIndex(month);
  if (startIdx < 0) return { snapshots: snapshots || {}, invalidated: 0 };
  const newSnaps = { ...(snapshots || {}) };
  let invalidated = 0;
  Object.keys(newSnaps).forEach(key => {
    const parsedKey = parseMonthKey(key);
    if (!parsedKey) return;
    if (parsedKey.year > year || (parsedKey.year === year && getMonthIndex(parsedKey.month) >= startIdx)) {
      delete newSnaps[key]; invalidated++;
    }
  });
  return { snapshots: newSnaps, invalidated };
};

const getAccountInitialDate = (accountsData, key) => {
  const acc = accountsData?.[key];
  if (!acc) return null;
  const iso = acc.initialDate || acc.lastUpdated;
  return parseISODate(iso) || null;
};

const getAccountInitialBalance = (accountsData, key) => {
  const acc = accountsData?.[key];
  if (!acc) return 0;
  if (acc.initialBalance !== undefined && acc.initialBalance !== null) return safeNumber(acc.initialBalance);
  return safeNumber(acc.balance);
};

const getCardMethod = (card) => {
  if (!card) return null;
  if (card.bank === 'CIB' && card.name === 'SWYPE') return 'cib_swype';
  if (card.bank === 'AAIB') return 'aaib_card';
  if (card.bank === 'ADIB Egypt' || card.name === 'Tainum') return 'adib_card';
  return 'cib_card';
};

const hasCashEffect = (t) => {
  if (!t) return false;
  if (t.status !== 'paid') return false;
  if (t.source === 'void') return false;
  if (t.affectsCash === false) return false;
  if (t.hanyEffect === 'carryover-marker') return false;
  if (t.method === HANY_TAB_METHOD) return false;
  if (t.method && PAYMENT_METHODS_WITHOUT_ACCOUNT.has(t.method)) return false;
  if (t.source === 'carryover' && t.status !== 'paid') return false;
  if (t.source === 'reconciliation') return true;
  return true;
};

const isCarryoverMarker = (t) => {
  if (!t) return false;
  if (t.hanyEffect === 'carryover-marker') return true;
  if (t.subCategory === 'رصيد مرحل') return true;
  const desc = t.description || '';
  if (desc.includes('مرحلة من') || desc.includes('مرحل من الشهر') || desc.includes('رصيد مرحل')) return true;
  return false;
};

// ✅ V88.1.1 FIX — يقبل method أو hanyEffect + يجب أن يكون category هاني
const isHanyPurchaseTx = (t) =>
  t && (t.hanyEffect === 'purchase' || t.method === HANY_TAB_METHOD)
  && isHanyShopCategory(t.category)
  && !isCarryoverMarker(t);

const isHanySettleTx = (t) => t && (t.hanyEffect === 'settle' || isHanySettleCategory(t.category));

const _balanceCache = new Map();
const _balanceCacheKey = (data, asOfDate) => {
  const txCount = data?.transactions?.length || 0;
  const lastTxId = data?.transactions?.[0]?.id || '';
  // ✅ FIX — hash لكل المعاملات بدل أول واحدة
  const txHash = (data?.transactions || [])
    .map(t => `${t.id}:${t.amount}:${t.method}:${t.type}:${t.status}:${t.affectsCash === false ? 0 : 1}`)
    .join('|');
  const accHash = Object.keys(data?.accountsData || {}).sort().map(k => {
    const a = data.accountsData[k];
    return `${k}:${a?.initialBalance}:${a?.initialDate || ''}`;
  }).join('|');
  const asOf = asOfDate ? new Date(asOfDate).getTime() : 'today';
  return `${txCount}_${lastTxId}_${txHash}_${accHash}_${asOf}`;
};

const computeBalancesAsOf = (data, asOfDate = null) => {
  const cacheKey = _balanceCacheKey(data, asOfDate);
  if (_balanceCache.has(cacheKey)) return _balanceCache.get(cacheKey);

  const accountsData = data?.accountsData || DEFAULT_ACCOUNTS;
  const result = {};
  const anchorTs = {};

  ACCOUNT_KEYS.forEach(k => {
    result[k] = toPiasters(getAccountInitialBalance(accountsData, k));
    const d = getAccountInitialDate(accountsData, k);
    anchorTs[k] = d ? dayStart(d).getTime() : 0;
  });

  const upper = asOfDate ? new Date(asOfDate).getTime() : endOfToday().getTime();

  (data?.transactions || []).forEach(t => {
    if (!hasCashEffect(t)) return;
    const method = t.method;
    if (!ACCOUNT_KEYS.includes(method)) return;
    const d = parseISODate(t.date);
    if (!d) return;
    const dTs = dayStart(d).getTime();
    const anchor = anchorTs[method];
    const signedP = t.subType === 'deposit' ? toPiasters(t.amount) : -toPiasters(t.amount);

    if (upper >= anchor) {
      if (dTs >= anchor && dTs <= upper) result[method] += signedP;
    } else {
      if (dTs > upper && dTs < anchor) result[method] -= signedP;
    }
  });

  ACCOUNT_KEYS.forEach(k => { result[k] = fromPiasters(result[k]); });

  if (_balanceCache.size > 20) {
    const firstKey = _balanceCache.keys().next().value;
    _balanceCache.delete(firstKey);
  }
  _balanceCache.set(cacheKey, result);
  return result;
};

const computeAllBalances = (data, asOfDate) => computeBalancesAsOf(data, asOfDate);
const computeBalance = (data, key, asOfDate) => {
  const all = computeBalancesAsOf(data, asOfDate);
  return safeNumber(all[key]);
};

const computeDualLiquidity = (balances) => {
  const comprehensive = ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(balances?.[k]), 0);
  const withoutWallets = CORE_LIQUIDITY_KEYS.reduce((s, k) => s + safeNumber(balances?.[k]), 0);
  const walletsOnly = WALLET_ONLY_KEYS.reduce((s, k) => s + safeNumber(balances?.[k]), 0);
  return { comprehensive, withoutWallets, walletsOnly };
};

const isCardPaymentTx = (t, cardId) => {
  if (!t || !cardId) return false;
  if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return false;
  if (t.method === HANY_TAB_METHOD) return false;
  if (t.source === 'card-payment-plan') return t.linkedCardId === cardId;
  if (t.source === 'payment-console' && t.linkedCardId === cardId) return true;
  if (t.category === 'الالتزامات البنكية والتمويلية'
      && t.type === 'expense'
      && t.linkedCardId === cardId
      && !t.linkedLoanId
      && !t.sourceRecurringId) return true;
  return false;
};

let _appReady = false;
setTimeout(() => { _appReady = true; }, 150);

const computeCardDebt = (data, card, asOfDate = null) => {
  if (!card) return 0;
  const method = getCardMethod(card);
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();

  const cutoffISO = card.openingDebtDate || card.openingDate;
  const parsedCutoff = cutoffISO ? parseISODate(cutoffISO) : null;
  const cutoffDay = parsedCutoff ? dayStart(parsedCutoff) : null;

  let debt = safeNumber(card.openingDebt);

  (data?.transactions || []).forEach(t => {
    if (!t) return;
    if (t.status !== 'paid') return;
    if (t.source === 'carryover') return;
    if (t.source === 'void') return;
    if (isCarryoverMarker(t)) return;
    if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return;
    if (t.method === HANY_TAB_METHOD) return;
    if (t.installmentPlanId) return;

    const d = parseISODate(t.date);
    if (!d) return;
    if (cutoffDay && d < cutoffDay) return;
    if (d > upper) return;

    const amt = safeNumber(t.amount);
    const hasExplicitLink = t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== '';
    let belongsToCard = false;
    if (hasExplicitLink) belongsToCard = (t.linkedCardId === card.id);
    else if (t.cardLast4 && subCards.includes(t.cardLast4)) belongsToCard = true;
    else belongsToCard = (t.method === method);

    if (!belongsToCard) return;

    if (isCardPaymentTx(t, card.id)) {
      debt -= amt;
      return;
    }
    if (t.type === 'expense') debt += amt;
    else if (t.type === 'income') debt -= amt;
  });

  if (_appReady && typeof computeCardInstallmentsInfo === 'function') {
    try {
      const instInfo = computeCardInstallmentsInfo(data, card, upper);
      debt += instInfo.totalDueSoFar;
    } catch (e) { console.warn('instInfo failed:', e); }
  }

  return debt;
};

const computeCardPaymentInfo = (data, card, asOfDate = null) => {
  if (!card) return { debt: 0, paymentsTotal: 0, purchasesTotal: 0, refundsTotal: 0, lastPayment: null, paymentCount: 0 };
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();
  let paymentsTotal = 0, purchasesTotal = 0, refundsTotal = 0, paymentCount = 0;
  let lastPayment = null;
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
  const method = getCardMethod(card);

  (data?.transactions || []).forEach(t => {
    if (!t || t.status !== 'paid' || isCarryoverMarker(t)) return;
    if (t.source === 'void') return;
    if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return;
    if (t.method === HANY_TAB_METHOD) return;

    const d = parseISODate(t.date);
    if (!d || d > upper) return;

    const hasExplicitLink = t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== '';
    let belongsToCard = false;
    if (hasExplicitLink) belongsToCard = (t.linkedCardId === card.id);
    else if (t.cardLast4 && subCards.includes(t.cardLast4)) belongsToCard = true;
    else belongsToCard = (t.method === method);
    if (!belongsToCard) return;

    if (isCardPaymentTx(t, card.id)) {
      paymentsTotal += safeNumber(t.amount);
      paymentCount++;
      if (!lastPayment || d > parseISODate(lastPayment.date)) lastPayment = t;
    } else if (t.type === 'expense') {
      purchasesTotal += safeNumber(t.amount);
    } else if (t.type === 'income') {
      refundsTotal += safeNumber(t.amount);
    }
  });

  return { debt: computeCardDebt(data, card, asOfDate), paymentsTotal, purchasesTotal, refundsTotal, lastPayment, paymentCount };
};

const computeCardAvailable = (data, card, asOfDate = null) => {
  if (!card) return 0;
  const debt = computeCardDebt(data, card, asOfDate);
  const limit = safeNumber(card.limit);
  return Math.max(0, limit - Math.max(0, debt));
};

const computeTotalCardDebtNet = (data, asOfDate = null) => {
  const sum = (data?.cards || []).reduce((s, c) => s + computeCardDebt(data, c, asOfDate), 0);
  return Math.max(0, sum);
};

// ✅ V88.1.1 FIX — يقبل method أو hanyEffect معاً
const computeHanyPayable = (data, asOfDate = null) => {
  const upper = asOfDate ? new Date(asOfDate).getTime() : endOfToday().getTime();
  let purchases = 0;
  let settlements = 0;

  (data?.transactions || []).forEach(t => {
    if (!t || t.status === 'void' || t.source === 'void') return;
    if (isCarryoverMarker(t)) return;

    const d = parseISODate(t.date);
    if (!d || d.getTime() > upper) return;

    const isPurchase =
      (t.method === HANY_TAB_METHOD || t.hanyEffect === 'purchase') &&
      isHanyShopCategory(t.category);

    if (isPurchase) {
      purchases += safeNumber(t.amount);
      return;
    }
    if ((t.hanyEffect === 'settle' || isHanySettleCategory(t.category)) && t.status === 'paid') {
      settlements += safeNumber(t.amount);
    }
  });

  return Math.max(0, purchases - settlements);
};

// ✅ V88.1.1 FIX — يقبل method أو hanyEffect معاً
const computeHanySummaryForMonth = (data, year, month) => {
  const monthKey = makeMonthKey(year, month);
  let purchases = 0, settlements = 0, purchaseCount = 0, settleCount = 0;

  (data?.transactions || []).forEach(t => {
    if (!t || t.status === 'void') return;
    if (isCarryoverMarker(t)) return;

    const isPurchase =
      (t.method === HANY_TAB_METHOD || t.hanyEffect === 'purchase') &&
      isHanyShopCategory(t.category);

    if (t.month === month && (t.year || 2026) === year && isPurchase) {
      purchases += safeNumber(t.amount);
      purchaseCount++;
    }
    if (t.month === month && (t.year || 2026) === year
        && (t.hanyEffect === 'settle' || isHanySettleCategory(t.category))
        && t.status === 'paid') {
      settlements += safeNumber(t.amount);
      settleCount++;
    }
  });

  const monthIdx = getMonthIndex(month);
  const dayBefore = new Date(year, monthIdx, 0, 23, 59, 59);
  const opening = computeHanyPayable(data, dayBefore);

  return {
    monthKey, opening, purchases, settlements,
    closing: Math.max(0, opening + purchases - settlements),
    purchaseCount, settleCount
  };
};

const createHanyCarryoverMarker = (data, year, month, remainingAmount) => {
  if (remainingAmount <= 0.01) return null;
  const monthIdx = getMonthIndex(month);
  if (monthIdx < 0) return null;
  const endDate = new Date(year, monthIdx + 1, 0);
  const isoDate = getLocalISODate(endDate);
  const id = `hany-marker-${year}-${monthIdx + 1}`;
  const exists = (data.transactions || []).some(t => t.id === id);
  if (exists) return null;
  return {
    id, type: 'expense', kind: KIND.ADJUSTMENT, category: HANY_TAB_CATEGORY,
    subCategory: 'رصيد مرحل', description: `رصيد مرحل من ${month} ${year}`,
    amount: roundMoney(remainingAmount), method: HANY_TAB_METHOD,
    date: isoDate, month, year, monthIndex: monthIdx, subType: 'withdrawal',
    status: 'paid', affectsCash: false, hanyEffect: 'carryover-marker',
    source: 'carryover', createdAt: new Date().toISOString(), _markerOnly: true
  };
};

const cleanupHanyMarkersFrom = (transactions, year, month) => {
  const fromIdx = getMonthIndex(month);
  if (fromIdx < 0) return transactions;
  return (transactions || []).filter(t => {
    if (t.hanyEffect !== 'carryover-marker') return true;
    const parsed = parseISODate(t.date);
    if (!parsed) return true;
    const tYear = parsed.getFullYear();
    const tMonthIdx = parsed.getMonth();
    if (tYear > year) return false;
    if (tYear === year && tMonthIdx >= fromIdx) return false;
    return true;
  });
};

const computeNetWorth = (data, asOfDate = null) => {
  const balances = computeBalancesAsOf(data, asOfDate);
  const liquidity = ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(balances[k]), 0);
  const cardDebt = computeTotalCardDebtNet(data, asOfDate);

  const loanDebt = (data?.loans || [])
    .filter(l => !l.isReceivable && !l.autoMonthly)
    .reduce((s, l) => s + Math.max(0, safeNumber(l.remaining ?? l.totalAmount)), 0);

  const hanyPayable = computeHanyPayable(data, asOfDate);

  const totalLiabilities = cardDebt + loanDebt + hanyPayable;
  return { liquidity, cardDebt, loanDebt, hanyPayable, totalLiabilities, netWorth: liquidity - totalLiabilities, balances };
};

const FLOW = {
  INCOME: 'income', CASH_EXPENSE: 'cashExpense', CARD_SPENDING: 'cardSpending',
  CARD_PAYMENT: 'cardPayment', LOAN_INSTALLMENT: 'loanInstallment',
  HANY_PURCHASE: 'hanyPurchase', HANY_SETTLE: 'hanySettle',
  TRANSFER_OUT: 'transferOut', TRANSFER_IN: 'transferIn',
  RECONCILIATION: 'reconciliation', CARRYOVER_MARKER: 'carryoverMarker', VOID: 'void',
};

const classifyFlow = (t) => {
  if (!t) return FLOW.VOID;
  if (t.status === 'void' || t.source === 'void') return FLOW.VOID;
  if (isCarryoverMarker(t)) return FLOW.CARRYOVER_MARKER;

  if (t.hanyEffect === 'purchase' || t.method === HANY_TAB_METHOD) return FLOW.HANY_PURCHASE;
  if (t.hanyEffect === 'settle' || isHanySettleCategory(t.category)) return FLOW.HANY_SETTLE;

  if (t.source === 'card-payment-plan') return FLOW.CARD_PAYMENT;
  if (t.source === 'payment-console' && t.linkedCardId) return FLOW.CARD_PAYMENT;
  if (t.category === 'الالتزامات البنكية والتمويلية'
      && t.type === 'expense'
      && t.linkedCardId
      && !t.linkedLoanId
      && !t.sourceRecurringId) return FLOW.CARD_PAYMENT;

  if (t.sourceRecurringId && t.sourceRecurringId.indexOf('r-mortgage') === 0) return FLOW.LOAN_INSTALLMENT;
  if (t.linkedLoanId) return FLOW.LOAN_INSTALLMENT;
  if (t.category === 'الالتزامات البنكية والتمويلية'
      && t.type === 'expense'
      && !t.linkedCardId) return FLOW.LOAN_INSTALLMENT;

  if (t.source === 'reconciliation') return FLOW.RECONCILIATION;
  if (t.linkedTransferId) {
    if (t.transferDirection === 'in') return FLOW.TRANSFER_IN;
    return FLOW.TRANSFER_OUT;
  }
  if (t.source === 'external-transfer') return FLOW.TRANSFER_OUT;
  if (t.source === 'carryover' && t.status !== 'paid') return FLOW.VOID;
  if (t.source === 'payment-console') {
    return t.linkedCardId ? FLOW.CARD_PAYMENT : FLOW.LOAN_INSTALLMENT;
  }
  const desc = t.description || '';
  if (desc.includes('قرض التمويل') || desc.includes('شقة العبور')
      || desc.includes('تمويل عقاري') || desc.includes('قرض عقاري')) {
    return FLOW.LOAN_INSTALLMENT;
  }
  if (t.type === 'income') return FLOW.INCOME;
  if (t.type === 'expense') {
    if (CREDIT_CARD_METHOD_IDS.includes(t.method)) return FLOW.CARD_SPENDING;
    if (t.method && PAYMENT_METHODS_WITHOUT_ACCOUNT.has(t.method)) return FLOW.CASH_EXPENSE;
    if (BANK_FEE_CATEGORIES.has(t.category)) return FLOW.CASH_EXPENSE;
    if (t.category === 'مصاريف وسلف شخصية') return FLOW.CASH_EXPENSE;
    return FLOW.CASH_EXPENSE;
  }
  return FLOW.VOID;
};

const computeMonthlyFlows = (transactions, year, month) => {
  const monthTxs = (transactions || []).filter(t =>
    t.month === month && (t.year || 2026) === year
  );

  const emptyBucket = () => ({
    income: 0, cashExpense: 0, cardSpending: 0, cardPayment: 0,
    loanInstallment: 0, hanyPurchase: 0, hanySettle: 0,
    transferOut: 0, transferIn: 0, reconciliation: 0
  });

  const acc = { paid: emptyBucket(), pending: emptyBucket() };

  monthTxs.forEach(t => {
    const kind = classifyFlow(t);
    if (kind === FLOW.VOID || kind === FLOW.CARRYOVER_MARKER) return;
    const bucket = t.status === 'paid' ? acc.paid : acc.pending;
    const amt = safeNumber(t.amount);
    const keyMap = {
      [FLOW.INCOME]: 'income',
      [FLOW.CASH_EXPENSE]: 'cashExpense',
      [FLOW.CARD_SPENDING]: 'cardSpending',
      [FLOW.CARD_PAYMENT]: 'cardPayment',
      [FLOW.LOAN_INSTALLMENT]: 'loanInstallment',
      [FLOW.HANY_PURCHASE]: 'hanyPurchase',
      [FLOW.HANY_SETTLE]: 'hanySettle',
      [FLOW.TRANSFER_OUT]: 'transferOut',
      [FLOW.TRANSFER_IN]: 'transferIn',
      [FLOW.RECONCILIATION]: 'reconciliation'
    };
    const key = keyMap[kind];
    if (key) bucket[key] += amt;
  });

  const p = acc.paid;
  const q = acc.pending;

  return {
    paidIncome: p.income, paidCashExpense: p.cashExpense, paidCardSpending: p.cardSpending,
    paidCardPayment: p.cardPayment, paidLoanInstallment: p.loanInstallment,
    paidHanyPurchase: p.hanyPurchase, paidHanySettle: p.hanySettle,
    paidTransferOut: p.transferOut, paidTransferIn: p.transferIn, paidReconciliation: p.reconciliation,
    pendingIncome: q.income, pendingCashExpense: q.cashExpense, pendingCardSpending: q.cardSpending,
    pendingCardPayment: q.cardPayment, pendingLoanInstallment: q.loanInstallment,
    pendingHanyPurchase: q.hanyPurchase, pendingHanySettle: q.hanySettle,
    pendingTransferOut: q.transferOut, pendingTransferIn: q.transferIn, pendingReconciliation: q.reconciliation,
    paidExpense: p.cashExpense + p.cardSpending + p.cardPayment + p.loanInstallment + p.hanySettle + p.hanyPurchase,
    pendingExpense: q.cashExpense + q.cardSpending + q.cardPayment + q.loanInstallment + q.hanySettle + q.hanyPurchase,
    paidReportableIncome: p.income,
    paidReportableExpense: p.cashExpense + p.cardSpending + p.cardPayment + p.loanInstallment + p.hanySettle + p.hanyPurchase,
    txCount: monthTxs.length,
    monthTxs, classifyFlow
  };
};

const computeMonthlyAverage = (transactions, endYear, endMonth, monthsBack, filterFn) => {
  let total = 0, count = 0;
  for (let i = 1; i <= monthsBack; i++) {
    const { year, month } = addMonthsToYM(endYear, endMonth, -i);
    if (year < PROJECT_START_YEAR || (year === PROJECT_START_YEAR && getMonthIndex(month) < getMonthIndex(PROJECT_START_MONTH))) continue;
    const monthTxs = (transactions || []).filter(t =>
      t.month === month && (t.year || 2026) === year && t.status === 'paid'
    );
    const val = monthTxs.filter(filterFn).reduce((s, t) => s + safeNumber(t.amount), 0);
    if (val > 0) { total += val; count++; }
  }
  return count > 0 ? total / count : 0;
};

const getClosingBalance = (data, key, year, month) => {
  const monthKey = makeMonthKey(year, month);
  const snap = data?.monthlySnapshots?.[monthKey]?.[key];
  if (snap !== undefined && snap !== null) return safeNumber(snap);
  const monthIdx = getMonthIndex(month);
  if (monthIdx < 0) return computeBalance(data, key);
  const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
  return computeBalance(data, key, monthEnd);
};

const getOpeningBalance = (data, key, year, month) => {
  const idx = getMonthIndex(month);
  if (idx < 0) return computeBalance(data, key);
  if (idx === 0) return getClosingBalance(data, key, year - 1, 'ديسمبر');
  return getClosingBalance(data, key, year, ALL_MONTHS[idx - 1]);
};

const buildLedgerWithBalance = (transactions, accountsData, methodId) => {
  const cutoffDay = getAccountInitialDate(accountsData, methodId);
  const cutoffTime = cutoffDay ? dayStart(cutoffDay).getTime() : 0;

  const sorted = (transactions || [])
    .filter(t =>
      t.method === methodId &&
      t.status === 'paid' &&
      t.source !== 'void' &&
      t.affectsCash !== false &&
      !isCarryoverMarker(t) &&
      (parseISODate(t.date)?.getTime() ?? 0) >= cutoffTime
    )
    .sort((a, b) => {
      const da = parseISODate(a.date)?.getTime() ?? 0;
      const db = parseISODate(b.date)?.getTime() ?? 0;
      if (da !== db) return da - db;
      const ca = getTxTimestamp(a);
      const cb = getTxTimestamp(b);
      if (ca !== cb) return ca - cb;
      return String(a.id).localeCompare(String(b.id));
    });

  let balP = toPiasters(getAccountInitialBalance(accountsData, methodId));
  return sorted.map(t => {
    const a = toPiasters(t.amount);
    const prevBalP = balP;
    balP += (t.subType === 'deposit') ? a : -a;
    return { ...t, runningBalance: fromPiasters(balP), __opening: fromPiasters(prevBalP) };
  }).reverse();
};

const computeCustodyBalance = (entries) => {
  if (!Array.isArray(entries)) return { received: 0, transferred: 0, spentCash: 0, spentCard: 0, settled: 0, balance: 0, totalSpent: 0 };
  let received = 0, transferred = 0, spentCash = 0, spentCard = 0, settled = 0;
  entries.forEach(e => {
    const amt = safeNumber(e.amount);
    switch (e.type) {
      case CUSTODY_TYPE.RECEIVE: received += amt; break;
      case CUSTODY_TYPE.TRANSFER: transferred += amt; break;
      case CUSTODY_TYPE.SPEND_CASH: spentCash += amt; break;
      case CUSTODY_TYPE.SPEND_CARD: spentCard += amt; break;
      case CUSTODY_TYPE.SETTLE: settled += amt; break;
    }
  });
  const totalSpent = spentCash + spentCard;
  const balance = received - transferred - totalSpent - settled;
  return { received, transferred, spentCash, spentCard, settled, balance, totalSpent };
};

const computeCashbackSummary = (trackers) => {
  if (!Array.isArray(trackers)) return { expected: 0, received: 0, pending: 0, list: [] };
  const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
  const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
  return { expected, received, pending: expected - received, list: trackers };
};

const migrateTransactionV87 = (t) => {
  if (!t) return t;
  const normCat = normalizeCategory(t.category);

  if (isHanyShopCategory(normCat)) {
    const isMarker = isCarryoverMarker(t);
    if (isMarker) {
      return { ...t, category: HANY_TAB_CATEGORY, hanyEffect: 'carryover-marker', affectsCash: false, method: HANY_TAB_METHOD };
    }
    // ✅ V88.1.1 FIX — دائماً hany_tab (لا يعتمد على status)
    return {
      ...t, category: HANY_TAB_CATEGORY, kind: 'operational',
      method: HANY_TAB_METHOD,
      affectsCash: false, hanyEffect: 'purchase'
    };
  }

  if (isHanySettleCategory(normCat) || t.hanyEffect === 'settle') {
    const settleMethod = LEDGER_METHOD_IDS.has(t.method) ? t.method : 'cash';
    return {
      ...t, category: HANY_SETTLE_CATEGORY, kind: 'financial',
      hanyEffect: 'settle', affectsCash: true, method: settleMethod
    };
  }

  if (t.settledHanyMonth && !t.hanyEffect) {
    return { ...t, hanyEffect: 'settle', category: HANY_SETTLE_CATEGORY };
  }

  if (t.subCategory === 'رصيد مرحل' ||
      (t.description || '').includes('مرحلة من') ||
      (t.description || '').includes('مرحل من الشهر') ||
      (t.description || '').includes('رصيد مرحل')) {
    return {
      ...t, method: HANY_TAB_METHOD, affectsCash: false,
      hanyEffect: 'carryover-marker', status: 'paid', source: 'carryover'
    };
  }

  return { ...t, category: normCat };
};

const migrateHanyTx = (t) => {
  if (!t) return t;
  if (isCarryoverMarker(t)) return t;
  if (isHanySettleCategory(t.category)) return t;
  if (!isHanyShopCategory(t.category)) return t;
  return {
    ...t,
    category: HANY_TAB_CATEGORY,
    method: HANY_TAB_METHOD,
    affectsCash: false,
    hanyEffect: 'purchase',
  };
};

const migrateCardPayments = (transactions, cards) => {
  if (!Array.isArray(transactions)) return [];
  const cardMethods = new Map();
  (cards || []).forEach(c => cardMethods.set(getCardMethod(c), c.id));

  return transactions.map(t => {
    if (!t) return t;
    if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return t;
    if (t.__cardPaymentMigrated) return t;
    if (t.source === 'card-payment-plan' || t.source === 'payment-console') {
      return { ...t, __cardPaymentMigrated: true };
    }
    if (t.category === 'الالتزامات البنكية والتمويلية' && t.linkedCardId) {
      return { ...t, __cardPaymentMigrated: true };
    }
    if (t.category === 'الالتزامات البنكية والتمويلية'
        && t.type === 'expense' && t.method && cardMethods.has(t.method)
        && !t.linkedCardId && !t.linkedLoanId) {
      return { ...t, linkedCardId: cardMethods.get(t.method), __cardPaymentMigrated: true };
    }
    return t;
  });
};

const migrateSnapshotsAndClosed = (snapshots, closedMonths) => {
  let snaps = snapshots && typeof snapshots === 'object' ? { ...snapshots } : {};
  let closed = Array.isArray(closedMonths) ? [...closedMonths] : [];
  if (Object.keys(snaps).length > 0 && !Object.keys(snaps).every(k => /^\d{4}-/.test(k))) {
    const migrated = {};
    Object.entries(snaps).forEach(([month, val]) => {
      if (/^\d{4}-/.test(month)) migrated[month] = val;
      else migrated[makeMonthKey(2026, month)] = (typeof val === 'object' && val !== null) ? val : { cash: safeNumber(val) };
    });
    snaps = migrated;
  }
  if (closed.length > 0 && !closed.every(k => /^\d{4}-/.test(k))) {
    closed = closed.map(m => /^\d{4}-/.test(m) ? m : makeMonthKey(2026, m));
  }
  return { snapshots: snaps, closedMonths: closed };
};

const migrateCards = (cards) => {
  if (!Array.isArray(cards)) return JSON.parse(JSON.stringify(DEFAULT_CARDS));
  const migrated = cards.map(c => {
    const result = { ...c };
    if (!Array.isArray(result.subCardLast4)) result.subCardLast4 = [];
    if (result.id === 2 && String(result.last4) === '0391') result.last4 = '3391';
    if (result.id === 1 && result.name === 'Titanium') {
      result.subCardLast4 = ['9360', '9352', '2014'];
      if (!result.limit || result.limit === 0) result.limit = 100500;
    }
    if (result.id === 2 && result.name === 'Signature') {
      result.subCardLast4 = ['3557'];
      if (!result.limit || result.limit === 0) result.limit = 100000;
    }
    if (result.id === 3 && result.name === 'SWYPE') {
      result.last4 = '6015';
      if (!result.limit || result.limit === 0) result.limit = 49500;
      result.subCardLast4 = [];
      if (!result.linkedAccountKey) result.linkedAccountKey = 'cib_savings';
      if (!result.linkedAccountLast4) result.linkedAccountLast4 = '1809';
    }
    if (result.id === 4 || result.name === 'Tainum' || result.bank === 'ADIB Egypt') {
      result.name = 'Tainum';
      result.bank = 'ADIB Egypt';
      result.limit = 99000;
      result.last4 = '9982';
      result.expiry = '09/28';
      result.dueDate = '25 من كل شهر';
      result.theme = 'tainum_gray';
      result.subCardLast4 = [];
      result.cashbackRate = result.cashbackRate !== undefined ? result.cashbackRate : 1;
      result.type = 'mastercard';
    }
    if (result.statementDay === undefined || result.statementDay === null || result.statementDay === '') {
      const dueMatch = String(result.dueDate || '25').match(/(\d{1,2})/);
      const dueD = dueMatch ? parseInt(dueMatch[1], 10) : 25;
      result.statementDay = dueD > 20 ? dueD - 20 : Math.min(28, dueD + 10);
    }
    result.statementDay = Math.min(28, Math.max(1, safeNumber(result.statementDay, 5)));

    if (!result.providerKey) {
      if (result.bank === 'CIB') result.providerKey = 'cib';
      else if (result.bank === 'AAIB') result.providerKey = 'aaib';
      else if (result.bank === 'ADIB Egypt') result.providerKey = 'adib';
      else result.providerKey = 'cib';
    }
    if (!result.displayName) {
      const p = PROVIDERS[result.providerKey] || PROVIDERS.cib;
      result.displayName = `${p.icon} ${result.bank} ${result.name} • ${result.last4}`;
    }

    if (!result.openingDate) result.openingDate = null;
    if (!result.openingDebtDate) result.openingDebtDate = result.openingDate || null;
    if (result.cashbackRate === undefined) result.cashbackRate = 0;
    return result;
  });
  const hasTainum = migrated.some(c => c.id === 4 || c.name === 'Tainum' || c.bank === 'ADIB Egypt');
  if (!hasTainum) {
    const tainum = DEFAULT_CARDS.find(c => c.id === 4);
    if (tainum) migrated.push({ ...tainum });
  }
  return migrated;
};

const migrateTransaction = (t) => {
  if (!t) return t;
  const kind = inferKind(t);
  const category = normalizeCategory(t.category);
  let year = t.year, month = t.month, monthIndex = t.monthIndex;
  if (t.date && (!month || !year)) {
    const d = parseISODate(t.date);
    if (d) { if (!year) year = d.getFullYear(); if (!month) month = ALL_MONTHS[d.getMonth()]; }
  }
  if (!year) year = 2026;
  if (monthIndex === undefined || monthIndex === null || monthIndex < 0) monthIndex = getMonthIndex(month);
  if (monthIndex < 0 && month) {
    const norm = ALL_MONTHS.find(m => normalizeText(m) === normalizeText(month));
    if (norm) { month = norm; monthIndex = getMonthIndex(norm); }
  }
  let subType = t.subType;
  if (!subType) subType = t.type === 'income' ? 'deposit' : 'withdrawal';
  const createdAt = t.createdAt || (t.date ? `${t.date}T12:00:00.000Z` : new Date().toISOString());
  return { ...t, category, kind, year, month, monthIndex, subType, createdAt };
};

const migrateRecurringItems = (items) => {
  if (!Array.isArray(items)) return [];
  return items.map(r => {
    const migrated = { ...r };
    if (migrated.active === undefined) migrated.active = true;
    if (migrated.startMonth && !/^\d{4}-\d{2}$/.test(migrated.startMonth)) migrated.startMonth = keyToInputMonth(migrated.startMonth) || null;
    if (migrated.endMonth && !/^\d{4}-\d{2}$/.test(migrated.endMonth)) migrated.endMonth = keyToInputMonth(migrated.endMonth) || null;
    if (migrated.startMonth === undefined) migrated.startMonth = null;
    if (migrated.endMonth === undefined) migrated.endMonth = null;
    if (r.title && r.title.includes('تكييف محمود') && !migrated.linkedLoanSystemId) migrated.linkedLoanSystemId = SYSTEM_LOAN_IDS.TAKYEEF;
    if (!migrated.transferChannel && r.category && r.category.startsWith('مصروف شهري - ')) {

      if (ben && ben.hasTelda) migrated.transferChannel = ben.method;

};

const mergeById = (existing, defaults) => {
  if (!Array.isArray(existing) || existing.length === 0) return defaults;
  const merged = [...existing];
  defaults.forEach(d => {
    if (!merged.some(e => e.id === d.id || (e.systemId && d.systemId && e.systemId === d.systemId))) merged.push(d);

const migrateData = (parsed) => {
  if (!parsed) return parsed;

  const deletedDefaultIds = Array.isArray(parsed.deletedDefaultIds) ? parsed.deletedDefaultIds : [];
  const deletedSet = new Set(deletedDefaultIds);

  const incomingCards = Array.isArray(parsed.cards) ? parsed.cards : [];
  const cardsFilteredDefaults = DEFAULT_CARDS.filter(c => !deletedSet.has(c.id) || c.id === 4);
  const mergedCards = mergeById(migrateCards(incomingCards), cardsFilteredDefaults);

  const incomingLoans = Array.isArray(parsed.loans) ? parsed.loans : [];
  const processedLoans = incomingLoans.map(l => {
    if (isTakyeefLoan(l)) return {
      ...l, systemId: SYSTEM_LOAN_IDS.TAKYEEF, isReceivable: true, type: 'receivable',

    };
    if (isHanyLoan(l) && !l.autoMonthly) return {

      mergeIntoNextCycle: l.mergeIntoNextCycle || [],
      category: HANY_TAB_CATEGORY, totalAmount: 0, prePaidAmount: 0,
      monthlyInstallment: 0, dueDay: 5, interest: 'مستحق شهري',
      description: 'مشتريات يومية', type: 'debt'
    };
    if (l && l.autoMonthly && !l.systemId) return { ...l, systemId: SYSTEM_LOAN_IDS.HANY };
    return l;
  });
  const mergedLoans = mergeById(processedLoans, []);

  let { snapshots, closedMonths } = migrateSnapshotsAndClosed(parsed.monthlySnapshots, parsed.closedMonths);
  const incomingVersion = safeNumber(parsed.engineVersion, 1);
  if (incomingVersion < 10 && Object.keys(snapshots).length > 0) snapshots = {};

  let transactions = Array.isArray(parsed.transactions) ? parsed.transactions.map(migrateTransaction) : [];
  transactions = transactions.map(migrateTransactionV87).map(migrateHanyTx);

/* ═══════════════ RECURRING ENGINE ═══════════════ */
const cleanupOldMaterialized = (materialized) => {
  if (!materialized || typeof materialized !== 'object') return {};
  const now = new Date();
  const cutoffYM = (now.getFullYear() - 1) * 12 + now.getMonth();
  const cleaned = {};
  Object.keys(materialized).forEach(k => {
    const parts = k.split('_');
    if (parts.length < 2) { cleaned[k] = materialized[k]; return; }
    const monthKey = parts[parts.length - 1];
    const dashIdx = monthKey.indexOf('-');
    if (dashIdx < 0) { cleaned[k] = materialized[k]; return; }
    const y = Number(monthKey.slice(0, dashIdx));
    const mName = monthKey.slice(dashIdx + 1);
    const mIdx = ALL_MONTHS.indexOf(mName);
    if (isNaN(y) || mIdx < 0) { cleaned[k] = materialized[k]; return; }
    const ym = y * 12 + mIdx;
    if (ym >= cutoffYM - 3 && ym <= cutoffYM + 18) cleaned[k] = materialized[k];
  });
  return cleaned;
};

const materializeRecurringItems = (data, asOfDateStr) => {
  if (!data?.recurringItems?.length) return null;

  const now = asOfDateStr ? new Date(asOfDateStr) : new Date();
  const futureCutoff = new Date(now);
  futureCutoff.setMonth(futureCutoff.getMonth() + 12);
  futureCutoff.setHours(23, 59, 59, 999);

  const pastCutoff = new Date(now);
  pastCutoff.setFullYear(pastCutoff.getFullYear() - 1);
  pastCutoff.setHours(0, 0, 0, 0);

  const permanentDeleted = new Set(data.deletedTxIds || []);
  const existing = (data.transactions || []).filter(t => !(permanentDeleted.has(t.id)));
  const materialized = cleanupOldMaterialized(data.materializedRecurring);
  const newTxs = [];

  const loanPaidMap = {};
  existing.forEach(t => {
    if (t.status === 'paid' && t.sourceReceivableId)
      loanPaidMap[t.sourceReceivableId] = (loanPaidMap[t.sourceReceivableId] || 0) + safeNumber(t.amount);
  });

  data.recurringItems.forEach(r => {
    if (r.active === false || !r.id || !r.type) return;
    const day = safeNumber(r.day, 1);
    if (day < 1 || day > 31) return;

    const startInput = r.startMonth || `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const [sy, sm] = startInput.split('-').map(Number);
    if (isNaN(sy) || isNaN(sm)) return;
    const startYM = sy * 12 + (sm - 1);

    let endYM;
    if (r.endMonth) {
      const [ey, em] = r.endMonth.split('-').map(Number);
      if (isNaN(ey) || isNaN(em)) return;
      endYM = ey * 12 + (em - 1);
    } else {
      const endDefault = new Date(now);
      endDefault.setMonth(endDefault.getMonth() + 12);
      endYM = endDefault.getFullYear() * 12 + endDefault.getMonth();
    }

    if (startYM > endYM) return;

    for (let ym = startYM; ym <= endYM; ym++) {
      const y = Math.floor(ym / 12);
      const mIdx = ym % 12;
      const monthName = ALL_MONTHS[mIdx];
      const maxDayInMonth = new Date(y, mIdx + 1, 0).getDate();
      const safeDay = Math.min(day, maxDayInMonth);
      const targetDate = new Date(y, mIdx, safeDay);

      if (targetDate > futureCutoff) continue;
      if (targetDate < pastCutoff) continue;

      const matKey = `${r.id}_${makeMonthKey(y, monthName)}`;
      if (materialized[matKey] === 'deleted') continue;
      if (materialized[matKey]) continue;

      const manualExists = existing.some(t => t.sourceRecurringId === r.id && t.month === monthName && (t.year || y) === y);
      if (manualExists) { materialized[matKey] = true; continue; }

      let receivableLinkedId = null;
      if (r.linkedLoanSystemId) {
        const linkedLoan = (data.loans || []).find(l => l.systemId === r.linkedLoanSystemId);
        if (linkedLoan) {
          const collected = safeNumber(linkedLoan.prePaidAmount) + (loanPaidMap[linkedLoan.id] || 0);
          if (collected >= safeNumber(linkedLoan.totalAmount) - 0.005) continue;
          receivableLinkedId = linkedLoan.id;
        }
      }

      let method = 'cash';
      let linkedCardId = r.linkedCardId;
      if (r.method) method = r.method;
      else if (linkedCardId) { const card = (data.cards || []).find(c => c.id === linkedCardId); if (card) method = getCardMethod(card); }

      const isFee = BANK_FEE_CATEGORIES.has(r.category);
      const kind = r.kind || (isFee ? KIND.FINANCIAL : KIND.OPERATIONAL);
      const newId = `rec-${r.id}-${makeMonthKey(y, monthName)}`;
      if (permanentDeleted.has(newId)) { materialized[matKey] = 'deleted'; continue; }

      newTxs.push({
        id: newId, type: r.type, subType: r.type === 'income' ? 'deposit' : 'withdrawal',
        kind, category: r.category, amount: safeNumber(r.amount),
        description: r.title || 'بند متكرر', method,
        date: getLocalISODate(targetDate), month: monthName, year: y, monthIndex: mIdx,
        status: 'pending', sourceRecurringId: r.id,
        linkedCardId: linkedCardId || undefined,
        sourceReceivableId: receivableLinkedId || undefined,
        transferChannel: r.transferChannel || undefined,
        createdAt: new Date().toISOString()
      });
      materialized[matKey] = true;
    }
  });

  if (newTxs.length === 0) return null;
  return { ...data, transactions: sortTransactions([...newTxs, ...existing]), materializedRecurring: materialized };
};

const getOrCreateBackupFolder = async () => {
  const token = await ensureDriveToken();
  const customFolderId = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;
  if (customFolderId) {
    try {
      const checkRes = await fetch(`https://www.googleapis.com/drive/v3/files/${customFolderId}?fields=id,name,mimeType,trashed`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (checkRes.ok) { const info = await checkRes.json(); if (!info.trashed) return customFolderId; }
    } catch (e) {}
  }
  const q = encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive&pageSize=20`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  if (!res.ok) throw new Error('فشل قراءة المجلدات');
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    const folderId = data.files[0].id;
    localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, folderId);
    return folderId;
  }
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  if (!createRes.ok) throw new Error('فشل إنشاء المجلد');
  const created = await createRes.json();
  localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, created.id);
  return created.id;
};

const uploadBackupToDrive = async (payload, fileName) => {
  const token = await ensureDriveToken();

  const name = fileName || `finance_backup_v8811_${getLocalISODate()}_${Date.now()}.json`;

  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,createdTime', {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },

const checkDataIntegrity = (data, transactions, cards, updatedLoans, liveBalances) => {
  const issues = [];
  const now = Date.now();
  const dayMs = 24 * 60 * 60 * 1000;

  const oldPending = transactions.filter(t => {
    if (t.status === 'paid') return false;
    if (isCarryoverMarker(t)) return false;
    const d = parseISODate(t.date);
    return d && (now - d.getTime()) > 30 * dayMs;
  });
  if (oldPending.length > 0) {
    issues.push({ severity: 'warning', title: `${oldPending.length} معاملة معلقة قديمة (+30 يوم)`, description: 'يفضل اعتمادها أو ترحيلها', action: 'transactions' });
  }

  const multiCarried = transactions.filter(t => (t.carryCount || 0) >= 2);
  if (multiCarried.length > 0) {
    issues.push({ severity: 'warning', title: `${multiCarried.length} قيد مرحّل أكثر من مرتين`, description: 'يجب معالجتها قبل أن تتكرر للأبد' });
  }

  const orphans = findOrphanTransfers(transactions);
  if (orphans.length > 0) {
    issues.push({ severity: 'danger', title: `${orphans.length} تحويل يتيم`, description: 'قيد واحد فقط موجود من تحويل مزدوج' });
  }

  const staleAccounts = ACCOUNT_KEYS.filter(k => {
    const lastUpd = data.accountsData?.[k]?.initialDate || data.accountsData?.[k]?.lastUpdated;
    if (!lastUpd) return true;
    const d = parseISODate(lastUpd);
    return d && (now - d.getTime()) > 30 * dayMs;
  });
  if (staleAccounts.length > 0) {
    issues.push({ severity: 'info', title: `${staleAccounts.length} حساب لم يُحدّث من 30+ يوم`, description: staleAccounts.map(k => ACCOUNT_SHORT_NAMES[k]).join('، ') });
  }

  const overusedCards = cards.filter(c => {
    const debt = computeCardDebt(data, c);
    const limit = safeNumber(c.limit);
    return limit > 0 && debt / limit > 0.8;
  });
  if (overusedCards.length > 0) {
    issues.push({ severity: 'warning', title: `${overusedCards.length} بطاقة استُخدمت أكثر من 80%`, description: overusedCards.map(c => `${c.bank} ${c.name}`).join('، ') });
  }

  const negativeAccounts = ACCOUNT_KEYS.filter(k => safeNumber(liveBalances[k]) < 0);
  if (negativeAccounts.length > 0) {
    issues.push({ severity: 'danger', title: `${negativeAccounts.length} حساب برصيد سالب`, description: negativeAccounts.map(k => ACCOUNT_SHORT_NAMES[k]).join('، ') });
  }

  const penalties = { danger: 25, warning: 10, info: 3 };
  const totalPenalty = issues.reduce((s, i) => s + (penalties[i.severity] || 0), 0);
  const score = Math.max(0, 100 - totalPenalty);

  return { issues, score };
};

const applyMaterialization = (data, asOfDateStr) => {
  const updated = materializeRecurringItems(data, asOfDateStr);
  if (!updated) return null;
  const permanentDeleted = new Set(data.deletedTxIds || []);
  const filteredTx = updated.transactions.filter(t => !permanentDeleted.has(t.id));
  if (filteredTx.length !== updated.transactions.length) return { ...updated, transactions: filteredTx };
  return updated;
};

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { hasError: false, error: null, errorInfo: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(e, i) { console.error('App Error:', e, i); this.setState({ errorInfo: i }); clearAllModals(); }
  safeReset = () => {
    const keep = {};
    try { [PIN_HASH_KEY, 'theme', 'budgets'].forEach(k => { const v = localStorage.getItem(k); if (v) keep[k] = v; }); } catch (e) {}
    try { localStorage.clear(); } catch (e) {}
    try { Object.entries(keep).forEach(([k, v]) => localStorage.setItem(k, v)); } catch (e) {}
    window.location.reload();
  };
  render() {
    if (this.state.hasError) return (
      <div className="flex flex-col h-screen items-center justify-center p-8 text-center" style={{ background: 'var(--bg-app)' }} dir="rtl">
        <div className="w-20 h-20 rounded-3xl flex items-center justify-center mb-6" style={{ background: 'var(--danger-soft)' }}>
          <AlertTriangle size={36} className="text-red-500" />
        </div>
        <h1 className="text-2xl font-black mb-3">حدث خطأ تقني</h1>
        <p className="text-sm mb-6 opacity-70 max-w-md break-all font-mono" style={{ color: 'var(--text-secondary)' }}>
          {String(this.state.error?.message || 'خطأ غير معروف')}
        </p>
        <div className="flex gap-3 flex-wrap justify-center">
          <button onClick={() => window.location.reload()} className="btn btn-primary"><RefreshCcw size={18} /> إعادة المحاولة</button>
          <button onClick={this.safeReset} className="btn btn-secondary"><RotateCcw size={18} /> إعادة تعيين آمنة</button>
        </div>
        <p className="text-[10px] mt-4" style={{ color: 'var(--text-muted)' }}>⚠️ "إعادة تعيين آمنة" تحفظ رمز الدخول والإعدادات</p>
      </div>
    );
    return this.props.children;
  }
}

const PromiseModalProvider = ({ children }) => {
  const [stack, setStack] = useState([]);
  const [inputValues, setInputValues] = useState({});

  useEffect(() => {
    const handleInput = (e) => setStack(s => [...s, { kind: 'input', ...e.detail }]);
    const handleConfirm = (e) => setStack(s => [...s, { kind: 'confirm', ...e.detail }]);
    window.addEventListener('show-input-modal', handleInput);
    window.addEventListener('show-confirm-modal', handleConfirm);
    return () => {
      window.removeEventListener('show-input-modal', handleInput);
      window.removeEventListener('show-confirm-modal', handleConfirm);
    };
  }, []);

  useEffect(() => {
    return () => { clearAllModals(); };
  }, []);

  const current = stack[stack.length - 1];
  const dismiss = useCallback((value) => {
    if (!current) return;
    const id = current._id;
    setStack(s => s.slice(0, -1));
    resolveModal(id, value);
    setInputValues(prev => { if (!(id in prev)) return prev; const next = { ...prev }; delete next[id]; return next; });
  }, [current]);

  const inputValue = current?._id !== undefined ? (inputValues[current._id] ?? current.inputValue ?? '') : '';
  const setInputValue = useCallback((v) => {
    if (current?._id === undefined) return;
    setInputValues(prev => ({ ...prev, [current._id]: v }));
  }, [current?._id]);

  return (
    <React.Fragment>
      {children}
      {current?.kind === 'input' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-md animate-scaleIn">
            <div className="generic-modal-header">
              <h3 className="text-base font-black flex items-center gap-2">
                <span>{current.icon || '💬'}</span>{current.title}
              </h3>
              <button onClick={() => dismiss(null)} className="btn btn-ghost p-1.5"><X size={16} /></button>
            </div>
            <div className="generic-modal-body">
              {current.message && <p className="text-sm mb-3 whitespace-pre-line leading-relaxed" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>}
              <input autoFocus type="text"
                inputMode={current.numeric ? 'decimal' : 'text'}
                className="input-field input-num text-2xl text-center py-4"
                style={{ color: 'var(--accent)' }}
                value={inputValue}
                onChange={e => setInputValue(current.numeric ? e.target.value.replace(/[^\d.\-]/g, '') : e.target.value)}
                onKeyDown={e => {
                  if (e.key === 'Enter') {
                    const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim();
                    dismiss(v);
                  }
                }}
                placeholder={current.placeholder || ''} />
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => dismiss(null)} className="btn btn-secondary flex-1">إلغاء</button>
              <button onClick={() => { const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim(); dismiss(v); }} className="btn btn-primary flex-1">
                {current.confirmText || 'تأكيد'}
              </button>
            </div>
          </div>
        </div>
      )}
      {current?.kind === 'confirm' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-sm animate-scaleIn">
            <div className="generic-modal-body text-center">
              <div className={`w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center text-3xl ${current.danger ? 'bg-red-50 dark:bg-red-950/40' : 'bg-blue-50 dark:bg-blue-950/40'}`}>
                {current.icon || (current.danger ? '⚠️' : '❓')}
              </div>
              <h3 className="text-base font-black mb-2">{current.title}</h3>
              <p className="text-sm leading-relaxed mb-2 whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>{current.message}</p>
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => dismiss(false)} className="btn btn-secondary flex-1">إلغاء</button>
              <button onClick={() => dismiss(true)} className="btn flex-1" style={{ background: current.danger ? 'var(--danger)' : 'var(--accent)', color: 'white' }}>
                {current.confirmText || 'تأكيد'}
              </button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
};

const SafeDateInput = memo(({ value, onChange, className, ...props }) => {
  const inputRef = useRef(null);
  const handleChange = (e) => {
    const val = e.target.value;
    if (!val && value) {
      setTimeout(() => { if (inputRef.current) inputRef.current.value = value; }, 0);
      return;
    }
    onChange(val);
  };
  return (
    <input ref={inputRef} type="date" value={value || ''} onChange={handleChange}
      onBlur={(e) => { if (!e.target.value && value) onChange(value); }}
      className={className} {...props} />
  );
});

const AnimatedNumber = memo(({ value, duration = 600, decimals = 2, prefix = '', suffix = '', className = '' }) => {
  const [display, setDisplay] = useState(0);
  const rafRef = useRef(null);
  const startRef = useRef(null);
  const startValRef = useRef(0);

  useEffect(() => {
    const target = safeNumber(value);
    const startVal = display;
    startValRef.current = startVal;
    const diff = target - startVal;
    if (Math.abs(diff) < 0.005) { setDisplay(target); return; }
    startRef.current = performance.now();
    const animate = (now) => {
      const elapsed = now - startRef.current;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setDisplay(startValRef.current + diff * eased);
      if (progress < 1) rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [value, duration]);

  return (
    <span className={`money ${className}`}>
      {prefix}{display.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}{suffix}
    </span>
  );
});
