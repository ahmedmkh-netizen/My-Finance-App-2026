      </h3>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
        <MiniStat label="مستلم" value={fmtShort(summary.received)} color="var(--positive)" />
        <MiniStat label="متوقع" value={fmtShort(summary.expected)} color="var(--brand)" />
        <MiniStat label="معلق" value={fmtShort(summary.pending)} color="var(--warning)" />
      </div>
      {trackers.length === 0 && (
        <EmptyState icon={Gift} title="لا يوجد سجل كاش باك" size="sm" />
      )}
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════════
   2) CATEGORIES PAGE
   ═══════════════════════════════════════════════════════════════════ */
const CategoriesPage = memo(function CategoriesPage({
  transactions, selectedMonth, selectedYear,
  budgets, dispatch, onSelectYear, onSelectMonth,
  onOpenCategoryDetail,
}) {
  const [catViewType, setCatViewType] = useState("expense");

  const catTotals = useMemo(
    () => transactions
      .filter(
        (t) =>
          t.type === catViewType &&
          t.month === selectedMonth &&
          (t.year || 2026) === selectedYear &&
          !isCarryoverMarker(t),
      )
      .reduce((acc, t) => {
        acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount);
        return acc;
      }, {}),
    [transactions, catViewType, selectedMonth, selectedYear],
  );

  const catCounts = useMemo(
    () => transactions
      .filter(
        (t) =>
          t.type === catViewType &&
          t.month === selectedMonth &&
          (t.year || 2026) === selectedYear &&
          !isCarryoverMarker(t),
      )
      .reduce((acc, t) => {
        acc[t.category] = (acc[t.category] || 0) + 1;
        return acc;
      }, {}),
    [transactions, catViewType, selectedMonth, selectedYear],
  );

  const hasAnyData = Object.keys(catTotals).length > 0;

  return (
    <div className="animate-fadeIn" style={{ paddingBottom: 24 }}>
      <div className="card">
        <SegmentedControl
          value={catViewType}
          onChange={setCatViewType}
          options={[
            { value: "expense", label: "مصروفات", icon: ArrowUp },
            { value: "income", label: "إيرادات", icon: ArrowDown },
          ]}
        />
      </div>

      <div style={{ marginTop: 12 }}>
        <MonthSelector
          selectedYear={selectedYear}
          selectedMonth={selectedMonth}
          onSelectYear={onSelectYear}
          onSelectMonth={onSelectMonth}
        />
      </div>

      {!hasAnyData ? (
        <div className="card" style={{ marginTop: 12 }}>
          <EmptyState
            icon={Layers}
            title={`لا توجد ${catViewType === "expense" ? "مصروفات" : "إيرادات"}`}
            message={`لم تُسجَّل معاملات في ${selectedMonth} ${selectedYear}`}
          />
        </div>
      ) : (
        <div style={{
          marginTop: 12,
          display: "grid",
          gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))",
          gap: 10,
        }}>
          {CATEGORIES[catViewType].map((cat) => {
            const spent = catTotals[cat] || 0;
            const budget = budgets[cat] || 0;
            const overBudget = budget > 0 && spent > budget;
            const count = catCounts[cat] || 0;
            if (spent === 0 && budget === 0) return null;

            const color = getCategoryColor(cat);
            const icon = getCategoryIcon(cat);

            return (
              <button
                key={cat}
                onClick={() => onOpenCategoryDetail(cat)}
                className="card card-hover"
                style={{
                  textAlign: "right", cursor: "pointer", fontFamily: "inherit",
                  border: "1px solid var(--border)", padding: 14,
                }}
              >
                <div style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                  marginBottom: 10,
                }}>
                  <div style={{
                    width: 40, height: 40, borderRadius: 12,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    background: `${color}20`, fontSize: 18,
                  }}>
                    {icon}
                  </div>
                  {count > 0 && (
                    <Badge variant="neutral" size="xs">{count}</Badge>
                  )}
                </div>
                <h4 style={{
                  fontSize: 11, fontWeight: 800, marginBottom: 6, margin: 0,
                  overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                }}>
                  {cat}
                </h4>
                <p className="money" style={{
                  fontSize: 15, fontWeight: 900, margin: 0,
                  color: overBudget ? "var(--negative)" : "var(--text-primary)",
                }}>
                  {formatAdaptive(spent)}
                  <span style={{
                    fontSize: 9, color: "var(--text-muted)",
                    fontWeight: 700, marginRight: 3,
                  }}>
                    ج.م
                  </span>
                </p>
                {catViewType === "expense" && budget > 0 && (
                  <div style={{ marginTop: 10 }}>
                    <div style={{
                      height: 4, borderRadius: 999, overflow: "hidden",
                      background: "var(--bg-muted)",
                    }}>
                      <div style={{
                        width: `${Math.min(100, (spent / budget) * 100)}%`,
                        height: "100%",
                        background: overBudget ? "var(--negative)" : "var(--positive)",
                        transition: "width 0.3s ease",
                      }} />
                    </div>
                    <p style={{
                      fontSize: 9, color: "var(--text-muted)",
                      fontWeight: 700, marginTop: 4, margin: 0,
                    }}>
                      من {formatAdaptive(budget)}
                    </p>
                  </div>
                )}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════════
   3) LOANS PAGE
   ═══════════════════════════════════════════════════════════════════ */
const LoansPage = memo(function LoansPage({
  data, updatedLoans, dispatch, addNotification,
  onOpenRecurringModal, onDeleteRecurring,
}) {
  const payables = useMemo(
    () => updatedLoans.filter((l) => !l.isReceivable && !l.autoGenerated),
    [updatedLoans],
  );
  const receivables = useMemo(
    () => updatedLoans.filter((l) => l.isReceivable),
    [updatedLoans],
  );
  const recurringItems = data.recurringItems || [];

  const totalPayables = payables.reduce((s, l) => s + l.remaining, 0);
  const totalReceivables = receivables.reduce((s, l) => s + l.remaining, 0);

  return (
    <div className="animate-fadeIn" style={{ paddingBottom: 24 }}>
      <div className="card">
        <h2 style={{ fontSize: 15, fontWeight: 900, margin: 0 }}>الالتزامات</h2>
        <p style={{
          fontSize: 11, marginTop: 2, marginBottom: 12,
          color: "var(--text-muted)",
        }}>
          القروض والمستحقات والبنود المتكررة
        </p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
          <MiniStat label="مديونية" value={fmtShort(totalPayables)} color="var(--negative)" />
          <MiniStat label="مستحقات لك" value={fmtShort(totalReceivables)} color="var(--positive)" />
          <MiniStat label="الصافي" value={fmtShort(totalPayables - totalReceivables)} color="var(--brand)" />
        </div>
      </div>

      {receivables.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <SectionTitle icon={TrendingUp}>مستحقات لك ({receivables.length})</SectionTitle>
          {receivables.map((loan) => (
            <ReceivableCard
              key={loan.id}
              loan={loan}
              data={data}
              dispatch={dispatch}
              addNotification={addNotification}
            />
          ))}
        </div>
      )}

      {payables.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <SectionTitle icon={TrendingDown}>مديونيات ({payables.length})</SectionTitle>
          {payables.map((loan) => (
            <PayableCard key={loan.id} loan={loan} dispatch={dispatch} />
          ))}
        </div>
      )}

      {recurringItems.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <SectionTitle
            icon={Repeat}
            action={
              <button
                onClick={onOpenRecurringModal}
                className="btn btn-primary"
                style={{ fontSize: 10, padding: "6px 12px" }}
              >
                <Plus size={11} /> جديد
              </button>
            }
          >
            البنود المتكررة ({recurringItems.length})
          </SectionTitle>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {recurringItems.map((r) => (
              <div key={r.id} style={{
                display: "flex", justifyContent: "space-between",
                alignItems: "center", gap: 10,
                padding: 12, borderRadius: 14,
                background: "var(--bg-card)", border: "1px solid var(--border)",
              }}>
                <div style={{ minWidth: 0, flex: 1 }}>
                  <p style={{
                    fontSize: 12, fontWeight: 800, margin: 0,
                    overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                  }}>
                    {r.title}
                  </p>
                  <p style={{
                    fontSize: 10, fontWeight: 700, marginTop: 2, marginBottom: 0,
                    color: "var(--text-muted)",
                  }}>
                    يوم {r.day} • {getPaymentMethodShort(r.method)}
                  </p>
                </div>
                <span className="money" style={{
                  fontSize: 13, fontWeight: 900, flexShrink: 0,
                  color: r.type === "income" ? "var(--positive)" : "var(--negative)",
                }}>
                  {r.type === "income" ? "+" : "−"}{fmt(r.amount)}
                </span>
                <button
                  onClick={() => onDeleteRecurring(r.id)}
                  className="btn btn-ghost btn-icon-sm"
                  style={{ color: "var(--negative)" }}
                >
                  <Trash2 size={12} />
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      {payables.length === 0 && receivables.length === 0 && recurringItems.length === 0 && (
        <div className="card" style={{ marginTop: 12 }}>
          <EmptyState
            icon={Banknote}
            title="لا توجد التزامات"
            message="أضف أول قرض أو بند متكرر لتبدأ المتابعة"
            action={
              <button
                onClick={onOpenRecurringModal}
                className="btn btn-primary"
                style={{ fontSize: 12 }}
              >
                <Plus size={14} /> إضافة التزام
              </button>
            }
          />
        </div>
      )}
    </div>
  );
});

const PayableCard = memo(({ loan, dispatch }) => {
  const pct = safeNumber(loan.totalAmount) > 0
    ? (safeNumber(loan.totalPaid) / safeNumber(loan.totalAmount)) * 100
    : 0;
  const isPaid = loan.remaining <= 0;

  return (
    <div className="card" style={{ padding: 14, marginBottom: 8 }}>
      <div style={{
        display: "flex", justifyContent: "space-between",
        alignItems: "flex-start", gap: 10, marginBottom: 10,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 }}>
          <div style={{
            width: 36, height: 36, borderRadius: 12,
            display: "flex", alignItems: "center", justifyContent: "center",

            color: isPaid ? "var(--positive)" : "var(--negative)",
          }}>
            <Banknote size={14} />
          </div>
          <div style={{ minWidth: 0 }}>
            <h4 style={{ fontSize: 12, fontWeight: 800, margin: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {loan.name}
            </h4>
            <p style={{
              fontSize: 10, fontWeight: 700, marginTop: 2, marginBottom: 0,
              color: "var(--text-muted)",
            }}>
              يوم {loan.dueDay || 1}

          </div>

          onClick={() => dispatch({ type: "SET_EDITING_LOAN", payload: loan })}
          className="btn btn-ghost btn-icon-sm"
        >
          <Edit size={12} />
        </button>
      </div>
      <div style={{
        display: "flex", justifyContent: "space-between",
        alignItems: "center", marginBottom: 8,
      }}>
        <span className="money" style={{
          fontSize: 15, fontWeight: 900,
          color: isPaid ? "var(--positive)" : "var(--negative)",
        }}>
          {fmt(loan.remaining)}
        </span>
        <span className="money" style={{
          fontSize: 11, fontWeight: 800,
          color: "var(--text-muted)",
        }}>
          قسط: {fmt(loan.monthlyInstallment)}
        </span>
      </div>
      <div style={{
        height: 4, borderRadius: 999, overflow: "hidden",
        background: "var(--bg-muted)",
      }}>
        <div style={{
          width: `${Math.min(100, pct)}%`,
          height: "100%",
          background: "var(--positive)",
          transition: "width 0.3s ease",
        }} />
      </div>
    </div>
  );
});

const ReceivableCard = memo(({ loan, data, dispatch, addNotification }) => {
  const pct = safeNumber(loan.totalAmount) > 0
    ? (safeNumber(loan.totalPaid) / safeNumber(loan.totalAmount)) * 100
    : 0;
  const isComplete = loan.remaining <= 0.005;

  const handleCollect = () => {
    const now = new Date();
    const txYear = now.getFullYear();
    const txMonth = ALL_MONTHS[now.getMonth()];
    const newTx = {
      id: getSafeId(),
      type: "income",
      kind: KIND.OPERATIONAL,
      category: "تكييف محمود",
      amount: safeNumber(loan.monthlyInstallment),
      description: `تحصيل قسط ${loan.name}`,
      method: "cash",
      date: getLocalISODate(now),
      month: txMonth,
      year: txYear,
      monthIndex: now.getMonth(),
      subType: "deposit",
      status: "paid",

/* Print Preview Modal */
const PrintPreviewModal = memo(({ content, title, onClose, addNotification }) => {
  const iframeRef = useRef(null);

  useEffect(() => {
    const orig = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = orig; };
  }, []);

  const handlePrint = () => {
    const printWindow = window.open("", "_blank", "width=900,height=1100");
    if (!printWindow) {
      addNotification({ type: "error", title: "السماح بالنوافذ المنبثقة" });
      return;
    }
    printWindow.document.write(content);
    printWindow.document.close();
    printWindow.document.title = title;
    printWindow.onload = () => {
      setTimeout(() => {
        printWindow.focus();
        printWindow.print();
      }, 500);
    };
  };

  const handleDownload = () => {
    const blob = new Blob([content], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${title.replace(/[^\w\u0600-\u06FF\s-]/g, "_")}_${getLocalISODate()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    addNotification({ type: "success", title: "تم التنزيل" });
  };

  const handleShare = async () => {
    try {
      if (navigator.share) {
        await navigator.share({
          title,
          text: `📊 ${title}\n\nمن محفظتي V89.0`,
        });
        addNotification({ type: "success", title: "تمت المشاركة" });
        return;
      }
      handleDownload();
    } catch (e) {
      if (e.name !== "AbortError") handleDownload();
    }
  };

  return (
    <div className="print-preview-overlay no-print">
      <div className="print-preview-toolbar">
        <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 }}>
          <div style={{
            width: 32, height: 32, borderRadius: 10,
            display: "flex", alignItems: "center", justifyContent: "center",
            background: "rgba(255,255,255,0.1)",
          }}>
            <FileText size={16} />
          </div>
          <div style={{ minWidth: 0 }}>
            <p style={{ fontSize: 12, fontWeight: 900, margin: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {title}
            </p>
            <p style={{ fontSize: 9, opacity: 0.7, margin: 0 }}>معاينة قبل الطباعة</p>
          </div>
        </div>
        <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
          <button onClick={handlePrint} className="btn" style={{ background: "#059669", color: "white", fontSize: 11, padding: "8px 12px" }}>
            <PrinterIcon size={14} /> <span className="hidden sm:inline">طباعة</span>
          </button>
          <button onClick={handleDownload} className="btn" style={{ background: "#635BFF", color: "white", fontSize: 11, padding: "8px 12px" }}>
            <Download size={14} /> <span className="hidden sm:inline">تنزيل</span>
          </button>
          <button onClick={handleShare} className="btn" style={{ background: "#0891B2", color: "white", fontSize: 11, padding: "8px 12px" }}>
            <Share2 size={14} /> <span className="hidden sm:inline">إرسال</span>
          </button>
          <button onClick={onClose} className="btn" style={{ background: "rgba(255,255,255,0.1)", color: "white", padding: "8px 10px" }}>
            <X size={14} />
          </button>
        </div>
      </div>
      <div className="print-preview-body">
        <iframe
          ref={iframeRef}
          srcDoc={content}
          className="print-preview-page"
          title={title}
        />
      </div>
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════════
   5) FORECAST PAGE
   ═══════════════════════════════════════════════════════════════════ */
const ForecastPage = memo(function ForecastPage({
  data, transactions, cards, updatedLoans, recurringItems,
  liveBalances, monthlyPlans, selectedYear, selectedMonth, liquidityDual,
}) {
  const [cardPaymentOverride, setCardPaymentOverride] = useState("");
  const [cardSpendingOverride, setCardSpendingOverride] = useState("");
  const [hanyPurchaseOverride, setHanyPurchaseOverride] = useState("");
  const [showSettings, setShowSettings] = useState(false);

  const todayISO = getLocalISODate();
  const currentLiquidity = liquidityDual.comprehensive;
  const currentCardDebt = useMemo(() => computeTotalCardDebtNet(data), [data]);
  const currentHanyPayable = useMemo(() => computeHanyPayable(data), [data]);
  const currentLoanDebt = useMemo(
    () => updatedLoans.filter((l) => !l.isReceivable && !l.autoGenerated)
      .reduce((s, l) => s + l.remaining, 0),
    [updatedLoans],
  );

  const autoAverages = useMemo(() => {
    const cardPay = computeMonthlyAverage(transactions, selectedYear, selectedMonth, 3,
      (t) => classifyFlow(t) === FLOW.CARD_PAYMENT || classifyFlow(t) === FLOW.LOAN_INSTALLMENT);
    const cardSpend = computeMonthlyAverage(transactions, selectedYear, selectedMonth, 3,
      (t) => classifyFlow(t) === FLOW.CARD_SPENDING);
    const hanyPurchase = computeMonthlyAverage(transactions, selectedYear, selectedMonth, 3,
      (t) => classifyFlow(t) === FLOW.HANY_PURCHASE);
    const hanySettle = computeMonthlyAverage(transactions, selectedYear, selectedMonth, 3,
      (t) => classifyFlow(t) === FLOW.HANY_SETTLE);
    return {
      payment: Math.round(cardPay), spending: Math.round(cardSpend),
      hanyPurchase: Math.round(hanyPurchase), hanySettle: Math.round(hanySettle),
    };
  }, [transactions, selectedYear, selectedMonth]);

  const baseCardPayment = cardPaymentOverride !== "" ? parseNumberInput(cardPaymentOverride) : autoAverages.payment;
  const baseCardSpending = cardSpendingOverride !== "" ? parseNumberInput(cardSpendingOverride) : autoAverages.spending;
  const baseHanyPurchase = hanyPurchaseOverride !== "" ? parseNumberInput(hanyPurchaseOverride) : autoAverages.hanyPurchase;

  const activeLoanInstallments = useMemo(
    () => updatedLoans.filter((l) => !l.isReceivable && !l.autoGenerated && safeNumber(l.monthlyInstallment) > 0 && l.remaining > 0)
      .reduce((s, l) => s + safeNumber(l.monthlyInstallment), 0),
    [updatedLoans],
  );

  const recurringAgg = useMemo(() => {
    const now = new Date();
    const currentYM = now.getFullYear() * 12 + now.getMonth();
    const active = (recurringItems || []).filter((r) => {
      if (r.active === false) return false;
      if (r.linkedLoanSystemId) return false;
      if (r.startMonth) {
        const [sy, sm] = r.startMonth.split("-").map(Number);
        if (currentYM < sy * 12 + (sm - 1)) return false;
      }
      if (r.endMonth) {
        const [ey, em] = r.endMonth.split("-").map(Number);
        if (currentYM > ey * 12 + (em - 1)) return false;
      }
      return true;
    });
    const income = active.filter((r) => r.type === "income").reduce((s, r) => s + safeNumber(r.amount), 0);
    const cashExpense = active.filter((r) => r.type === "expense" && !CREDIT_CARD_METHOD_IDS.includes(r.method) && !isHanyShopCategory(r.category))
      .reduce((s, r) => s + safeNumber(r.amount), 0);
    const cardSpend = active.filter((r) => r.type === "expense" && CREDIT_CARD_METHOD_IDS.includes(r.method))
      .reduce((s, r) => s + safeNumber(r.amount), 0);
    return { income, cashExpense, cardSpend };
  }, [recurringItems]);

  const forecast = useMemo(() => {
    const months = [];
    let liq = currentLiquidity;
    let cardDebt = currentCardDebt;
    let loanDebt = currentLoanDebt;
    let hanyPayable = currentHanyPayable;

    for (let i = 0; i < 6; i++) {
      const { year, month } = addMonthsToYM(selectedYear, selectedMonth, i);
      if (getMonthIndex(month) < 0) continue;

      const flows = computeMonthlyFlows(transactions, year, month);

      let inc, cashExp, cardSpend, cardPay, loanInst, hanyPurchase, hanySettle;

      if (i === 0) {
        const futurePaidTxs = flows.monthTxs.filter(
          (t) => t.status === "paid" && t.date > todayISO && !isCarryoverMarker(t),
        );
        const futurePaidFlows = futurePaidTxs.reduce((acc, t) => {
          const kind = classifyFlow(t);
          const amt = safeNumber(t.amount);
          if (kind === FLOW.INCOME) acc.income += amt;
          if (kind === FLOW.CASH_EXPENSE) acc.cashExpense += amt;
          if (kind === FLOW.CARD_SPENDING) acc.cardSpending += amt;
          if (kind === FLOW.CARD_PAYMENT) acc.cardPayment += amt;
          if (kind === FLOW.LOAN_INSTALLMENT) acc.loanInstallment += amt;
          if (kind === FLOW.HANY_PURCHASE) acc.hanyPurchase += amt;
          if (kind === FLOW.HANY_SETTLE) acc.hanySettle += amt;
          return acc;
        }, { income: 0, cashExpense: 0, cardSpending: 0, cardPayment: 0, loanInstallment: 0, hanyPurchase: 0, hanySettle: 0 });

        inc = futurePaidFlows.income + flows.pendingIncome;
        cashExp = futurePaidFlows.cashExpense + flows.pendingCashExpense;
        cardSpend = futurePaidFlows.cardSpending + flows.pendingCardSpending;
        cardPay = futurePaidFlows.cardPayment + flows.pendingCardPayment;
        loanInst = futurePaidFlows.loanInstallment + flows.pendingLoanInstallment;
        hanyPurchase = futurePaidFlows.hanyPurchase + flows.pendingHanyPurchase;
        hanySettle = futurePaidFlows.hanySettle + flows.pendingHanySettle;

        if (cardPay < 0.01 && cardDebt > 0 && baseCardPayment > 0)
          cardPay = Math.min(baseCardPayment, cardDebt);
        if (cardSpend < 0.01 && cardDebt > 0 && baseCardSpending > 0)
          cardSpend = baseCardSpending;
        if (loanInst < 0.01 && activeLoanInstallments > 0)
          loanInst = Math.min(activeLoanInstallments, loanDebt);
        if (hanyPurchase < 0.01 && baseHanyPurchase > 0)
          hanyPurchase = baseHanyPurchase;
        if (hanySettle < 0.01 && hanyPayable > 0 && autoAverages.hanySettle > 0)
          hanySettle = Math.min(autoAverages.hanySettle, hanyPayable);
      } else {
        inc = flows.pendingIncome > 0.01 ? flows.pendingIncome : recurringAgg.income;
        cashExp = flows.pendingCashExpense > 0.01 ? flows.pendingCashExpense : recurringAgg.cashExpense;
        cardSpend = flows.pendingCardSpending > 0.01 ? flows.pendingCardSpending : recurringAgg.cardSpend;
        cardPay = flows.pendingCardPayment || baseCardPayment;
        loanInst = flows.pendingLoanInstallment || activeLoanInstallments;
        hanyPurchase = flows.pendingHanyPurchase > 0.01 ? flows.pendingHanyPurchase : baseHanyPurchase;
        hanySettle = flows.pendingHanySettle > 0.01
          ? flows.pendingHanySettle
          : autoAverages.hanySettle > 0
            ? Math.min(autoAverages.hanySettle, hanyPayable + hanyPurchase)
            : 0;
      }

      const effCardPay = Math.min(Math.max(0, cardPay), Math.max(0, cardDebt));
      const effLoanInst = Math.min(Math.max(0, loanInst), Math.max(0, loanDebt));
      const effHanySettle = Math.min(Math.max(0, hanySettle), Math.max(0, hanyPayable + hanyPurchase));

      const newCardDebt = Math.max(0, cardDebt + cardSpend - effCardPay);
      const newLoanDebt = Math.max(0, loanDebt - effLoanInst);
      const newHanyPayable = Math.max(0, hanyPayable + hanyPurchase - effHanySettle);

      const netCashFlow = inc - cashExp - effCardPay - effLoanInst - effHanySettle;
      const newLiquidity = liq + netCashFlow;
      const totalDebt = newCardDebt + newLoanDebt + newHanyPayable;
      const netPosition = newLiquidity - totalDebt;

      months.push({
        month, year, isCurrent: i === 0,
        income: inc, cashExpense: cashExp, cardSpending: cardSpend,
        cardPayment: effCardPay, loanInstallment: effLoanInst,
        hanyPurchase, hanySettle: effHanySettle, netCashFlow,
        endLiquidity: newLiquidity, endCardDebt: newCardDebt,
        endLoanDebt: newLoanDebt, endHanyPayable: newHanyPayable,
        totalDebt, netPosition,
      });

      liq = newLiquidity;
      cardDebt = newCardDebt;
      loanDebt = newLoanDebt;
      hanyPayable = newHanyPayable;
    }
    return months;
  }, [
    transactions, selectedMonth, selectedYear, currentLiquidity,
    currentCardDebt, currentLoanDebt, currentHanyPayable,
    baseCardPayment, baseCardSpending, baseHanyPurchase,
    autoAverages.hanySettle, recurringAgg, activeLoanInstallments, todayISO,
  ]);

  const chartData = forecast.map((f) => ({
    name: f.month.slice(0, 3),
    السيولة: Math.round(f.endLiquidity),
    المديونية: Math.round(f.totalDebt),
    "صافي المركز": Math.round(f.netPosition),
  }));

  return (
    <div className="animate-fadeIn" style={{ paddingBottom: 24 }}>
      <div className="card">
        <div style={{
          display: "flex", alignItems: "flex-start", justifyContent: "space-between",
          gap: 12, flexWrap: "wrap",
        }}>
          <div>
            <h2 style={{ fontSize: 15, fontWeight: 900, marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}>
              <TrendingUp size={16} style={{ color: "var(--brand)" }} />
              التنبؤ المالي — 6 شهور
            </h2>
            <p style={{
              fontSize: 11, marginBottom: 0,
              color: "var(--text-muted)",
            }}>
              V89.0 · شامل دفتر هاني · بدون ازدواج
            </p>
          </div>
          <button
            onClick={() => setShowSettings(!showSettings)}
            className={`btn ${showSettings ? "btn-primary" : "btn-secondary"}`}
            style={{ fontSize: 11, padding: "8px 12px" }}
          >
            <Sliders size={12} /> إعدادات
          </button>
        </div>

        {showSettings && (
          <div style={{
            marginTop: 14, paddingTop: 14,
            borderTop: "1px solid var(--border)",
            display: "grid",
            gridTemplateColumns: "repeat(3, 1fr)",
            gap: 8,
          }}>
            <div>
              <label style={{ fontSize: 10, fontWeight: 800, color: "var(--text-muted)", display: "block", marginBottom: 4 }}>
                سداد البطاقة
              </label>
              <input
                type="text"
                inputMode="decimal"
                className="input-field input-num"
                style={{ fontSize: 12, padding: "8px 10px", textAlign: "center" }}
                value={cardPaymentOverride}
                onChange={(e) => setCardPaymentOverride(e.target.value)}
                placeholder={`${fmt(autoAverages.payment)}`}
              />
            </div>
            <div>
              <label style={{ fontSize: 10, fontWeight: 800, color: "var(--text-muted)", display: "block", marginBottom: 4 }}>
                مشتريات بطاقة
              </label>
              <input
                type="text"
                inputMode="decimal"
                className="input-field input-num"
                style={{ fontSize: 12, padding: "8px 10px", textAlign: "center" }}
                value={cardSpendingOverride}
                onChange={(e) => setCardSpendingOverride(e.target.value)}
                placeholder={`${fmt(autoAverages.spending)}`}
              />
            </div>
            <div>
              <label style={{ fontSize: 10, fontWeight: 800, color: "var(--text-muted)", display: "block", marginBottom: 4 }}>
                مشتريات هاني
              </label>
              <input
                type="text"
                inputMode="decimal"
                className="input-field input-num"
                style={{ fontSize: 12, padding: "8px 10px", textAlign: "center" }}
                value={hanyPurchaseOverride}
                onChange={(e) => setHanyPurchaseOverride(e.target.value)}
                placeholder={`${fmt(autoAverages.hanyPurchase)}`}
              />
            </div>
          </div>
        )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginTop: 12 }}>
        <MiniStat label="سيولة الآن" value={formatAdaptive(currentLiquidity)} color="var(--positive)" />
        <MiniStat label="مديونية" value={formatAdaptive(currentCardDebt + currentLoanDebt)} color="var(--negative)" />
        <MiniStat label="هاني" value={formatAdaptive(currentHanyPayable)} color="var(--warning)" />
        <MiniStat label="صافي" value={formatAdaptive(currentLiquidity - currentCardDebt - currentLoanDebt - currentHanyPayable)} color="var(--brand)" />
      </div>

      <div className="card" style={{ marginTop: 12 }}>
        <h3 style={{ fontSize: 12, fontWeight: 900, marginBottom: 10, color: "var(--text-secondary)" }}>
          📈 التطور المتوقع
        </h3>
        <div style={{ height: 240 }}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={chartData}>
              <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#94A3B8" opacity={0.08} />
              <XAxis dataKey="name" fontSize={10} stroke="#94A3B8" />
              <YAxis fontSize={10} stroke="#94A3B8"
                tickFormatter={(v) => v >= 1000 ? `${(v / 1000).toFixed(0)}k` : v}
              />
              <Tooltip
                formatter={(v) => `${fmt(v)} ج.م`}
                contentStyle={{
                  borderRadius: 12, border: "1px solid var(--border)",

                }}
              />
              <Legend wrapperStyle={{ fontSize: 11, fontWeight: "bold" }} />
              <Bar dataKey="السيولة" fill="#059669" radius={[4, 4, 0, 0]} barSize={16} />
              <Bar dataKey="المديونية" fill="#DC2626" radius={[4, 4, 0, 0]} barSize={16} />
              <Bar dataKey="صافي المركز" fill="#635BFF" radius={[4, 4, 0, 0]} barSize={16} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div style={{ marginTop: 16 }}>
        <SectionTitle icon={CalendarDays}>التفاصيل الشهرية</SectionTitle>

          <div key={i} className="card" style={{ marginBottom: 8, padding: 14 }}>
            <div style={{
              display: "flex", alignItems: "center", justifyContent: "space-between",
              marginBottom: 12, flexWrap: "wrap", gap: 8,
            }}>
              <h4 style={{ fontSize: 13, fontWeight: 900, margin: 0, display: "flex", alignItems: "center", gap: 6 }}>
                {f.month} {f.year}
                {f.isCurrent && <Badge variant="brand" size="xs">الحالي</Badge>}
              </h4>
              <Badge variant={f.netCashFlow >= 0 ? "positive" : "negative"} size="xs">
                {f.netCashFlow >= 0 ? "+" : ""}{fmtShort(f.netCashFlow)} صافي
              </Badge>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 6, marginBottom: 12 }}>

            <div style={{ paddingTop: 10, borderTop: "1px dashed var(--border)" }}>
              <InfoRow label="سيولة نهاية الشهر" value={fmt(f.endLiquidity)} valueColor={f.endLiquidity >= 0 ? "var(--positive)" : "var(--negative)"} size="sm" />

              <InfoRow label="مديونية قروض" value={fmt(f.endLoanDebt)} valueColor="var(--negative)" size="sm" />
              {f.endHanyPayable > 0.5 && (
                <InfoRow label="رصيد هاني" value={fmt(f.endHanyPayable)} valueColor="var(--warning)" size="sm" />
              )}
              <InfoRow label="صافي المركز" value={fmt(f.netPosition)} valueColor={f.netPosition >= 0 ? "var(--brand)" : "var(--negative)"} variant="total" />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
});

/* ═══════════════════════════════════════════════════════════════════
   6) CALENDAR PAGE

const CalendarPage = memo(function CalendarPage({
  data, getAgendaItems, updatedLoans, cards,
}) {
  const today = new Date();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [selectedDayDetails, setSelectedDayDetails] = useState(null);

  const agendaItems = useMemo(
    () => getAgendaItems(viewYear, ALL_MONTHS[viewMonth]),
    [getAgendaItems, viewYear, viewMonth],
  );

  const itemsByDay = useMemo(() => {
    const map = {};
    agendaItems.forEach((item) => {
      const d = parseISODate(item.date);
      if (!d) return;
      if (d.getFullYear() !== viewYear || d.getMonth() !== viewMonth) return;
      const day = d.getDate();
      if (!map[day]) map[day] = [];
      map[day].push(item);
    });
    return map;
  }, [agendaItems, viewYear, viewMonth]);

  const monthName = ALL_MONTHS[viewMonth];
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  const navigate = (delta) => {
    let m = viewMonth + delta;
    let y = viewYear;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    setViewMonth(m);
    setViewYear(y);
  };

  const dayNames = ["أحد", "إثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة", "سبت"];

  const isToday = (day) =>
    today.getFullYear() === viewYear &&
    today.getMonth() === viewMonth &&
    today.getDate() === day;

  return (
    <div className="animate-fadeIn" style={{ paddingBottom: 24 }}>
      <div className="card">
        <div style={{
          display: "flex", alignItems: "center", justifyContent: "space-between",
          marginBottom: 14,
        }}>
          <button onClick={() => navigate(-1)} className="btn btn-ghost btn-icon">
            <ChevronRight size={18} />
          </button>
          <h2 style={{ fontSize: 15, fontWeight: 900, margin: 0, display: "flex", alignItems: "center", gap: 8 }}>
            <CalendarDays size={16} style={{ color: "var(--brand)" }} />
            {monthName} {viewYear}
          </h2>
          <button onClick={() => navigate(1)} className="btn btn-ghost btn-icon">
            <ChevronLeft size={18} />
          </button>
        </div>

        <div style={{
          display: "grid", gridTemplateColumns: "repeat(7, 1fr)",
          gap: 4, marginBottom: 8,
        }}>
          {dayNames.map((d) => (
            <div key={d} style={{
              textAlign: "center", fontSize: 10,
              fontWeight: 900, color: "var(--text-muted)", padding: "6px 0",
            }}>
              {d}
            </div>
          ))}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
          {Array.from({ length: firstDay }, (_, i) => (
            <div key={`empty-${i}`} />
          ))}
          {Array.from({ length: daysInMonth }, (_, i) => i + 1).map((day) => {
            const items = itemsByDay[day] || [];
            const hasItems = items.length > 0;
            const totalAmount = items.reduce((s, it) => s + safeNumber(it.amount), 0);
            const isTodayCell = isToday(day);

            return (
              <button
                key={day}
                type="button"
                onClick={() => hasItems && setSelectedDayDetails({ day, items })}
                style={{
                  height: 56, borderRadius: 10, padding: 4,
                  display: "flex", flexDirection: "column",
                  alignItems: "center", justifyContent: "center",
                  transition: "all 0.2s ease",
                  background: hasItems ? "var(--brand-soft)" : "var(--bg-muted)",
                  color: hasItems ? "var(--brand)" : "var(--text-secondary)",
                  cursor: hasItems ? "pointer" : "default",
                  border: isTodayCell ? "2px solid var(--brand)" : "1px solid transparent",
                  fontFamily: "inherit",
                }}
              >
                <span style={{ fontSize: 12, fontWeight: 900 }}>{day}</span>
                {hasItems && (
                  <>
                    <span style={{ fontSize: 8, fontWeight: 900, marginTop: 2 }}>
                      {items.length} التزام
                    </span>
                    <span style={{ fontSize: 7, fontWeight: 700, opacity: 0.7, fontVariantNumeric: "tabular-nums" }}>
                      {fmtShort(totalAmount)}
                    </span>
                  </>
                )}
              </button>
            );
          })}
        </div>
      </div>

      <div className="card" style={{ marginTop: 12 }}>
        <SectionTitle icon={Bell}>الأجندة ({agendaItems.length})</SectionTitle>
        {agendaItems.length === 0 ? (
          <EmptyState
            icon={CalendarDays}
            title="لا توجد التزامات"
            message={`لا توجد مستحقات قادمة في ${monthName} ${viewYear}`}
            size="sm"
          />
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 400, overflowY: "auto" }}>
            {agendaItems.map((item) => {
              const Icon = item.icon || CalendarDays;
              const typeCls = item.type === "danger"
                ? { color: "var(--negative)", bg: "var(--negative-soft)" }
                : item.type === "warning"
                  ? { color: "var(--warning)", bg: "var(--warning-soft)" }
                  : item.type === "success"
                    ? { color: "var(--positive)", bg: "var(--positive-soft)" }
                    : { color: "var(--brand)", bg: "var(--brand-soft)" };
              const daysLeft = calculateDaysLeft(item.date);
              return (
                <div key={item.id} style={{
                  display: "flex", alignItems: "center", gap: 12,
                  padding: 12, borderRadius: 14, background: "var(--bg-muted)",
                }}>
                  <div style={{
                    width: 36, height: 36, borderRadius: 12,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    background: typeCls.bg, color: typeCls.color, flexShrink: 0,
                  }}>
                    <Icon size={14} />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p style={{
                      fontSize: 12, fontWeight: 800, margin: 0,
                      overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                    }}>
                      {item.title}
                    </p>
                    <p style={{
                      fontSize: 10, color: "var(--text-muted)",
                      marginTop: 2, marginBottom: 0, fontWeight: 700,
                    }}>
                      {item.date}
                      {daysLeft !== null && (
                        <span style={{
                          marginRight: 8, fontWeight: 900,
                          color: daysLeft < 0 ? "var(--negative)" : daysLeft <= 3 ? "var(--warning)" : "inherit",
                        }}>
                          {daysLeft < 0 ? `متأخر ${Math.abs(daysLeft)} يوم` :
                           daysLeft === 0 ? "اليوم" :
                           daysLeft === 1 ? "غداً" : `بعد ${daysLeft} يوم`}
                        </span>
                      )}
                    </p>
                  </div>
                  <span className="money" style={{
                    fontSize: 13, fontWeight: 900, flexShrink: 0,
                    color: item.type === "success" ? "var(--positive)" : "var(--negative)",
                  }}>
                    {fmt(item.amount)}
                  </span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {selectedDayDetails && (
        <Modal
          isOpen={true}
          onClose={() => setSelectedDayDetails(null)}
          title={`تفاصيل يوم ${selectedDayDetails.day} ${monthName} ${viewYear}`}
          icon="📅"
        >
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {selectedDayDetails.items.map((item) => {
              const Icon = item.icon || CalendarDays;
              return (
                <div key={item.id} style={{
                  display: "flex", alignItems: "center", gap: 12,
                  padding: 12, borderRadius: 14, background: "var(--bg-muted)",
                }}>
                  <div style={{
                    width: 36, height: 36, borderRadius: 12,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    background: "var(--brand-soft)", color: "var(--brand)", flexShrink: 0,
                  }}>
                    <Icon size={14} />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p style={{ fontSize: 12, fontWeight: 800, margin: 0 }}>{item.title}</p>
                    <p style={{
                      fontSize: 10, color: "var(--text-muted)",
                      marginTop: 2, marginBottom: 0, fontWeight: 700,
                    }}>
                      {item.desc || ""}
                    </p>
                  </div>
                  <span className="money" style={{
                    fontSize: 13, fontWeight: 900,
                    color: item.type === "success" ? "var(--positive)" : "var(--negative)",
                  }}>
                    {fmt(item.amount)}
                  </span>
                </div>
              );
            })}
          </div>
        </Modal>
      )}
    </div>
  );
});

      {/* Cards Section */}

        <div style={{ marginTop: 12 }}>
          {data.cards?.map((card) => (
            <CardSettingsCard
              key={card.id}
              card={card}
              data={data}
              dispatch={dispatch}
              saveHistory={saveHistory}
              addNotification={addNotification}
            />
          ))}
        </div>
      )}

      {/* System Section */}
      {activeSection === "system" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 12 }}>
          {/* PIN */}
          <div className="card">
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
              <div style={{
                width: 36, height: 36, borderRadius: 12,
                display: "flex", alignItems: "center", justifyContent: "center",

              }}>
                <Lock size={14} />
              </div>
              <h3 style={{ fontSize: 13, fontWeight: 900, margin: 0 }}>رمز الدخول</h3>
            </div>
            <p style={{
              fontSize: 11, marginBottom: 12,
              color: "var(--text-muted)",

              onClick={onOpenPinChange}
              className="btn btn-secondary"
              style={{ width: "100%", fontSize: 12 }}
            >
              <Lock size={12} /> تغيير الرمز
            </button>

          {/* Drive */}
          <div className="card">
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
              <div style={{
                width: 36, height: 36, borderRadius: 12,
                display: "flex", alignItems: "center", justifyContent: "center",
                background: "var(--brand-soft)", color: "var(--brand)",
              }}>
                <Cloud size={14} />

                style={{ fontSize: 11, padding: "8px 12px" }}
              >

              </button>
              <button

                  } catch (e) {
                    setDriveStatus("❌ " + e.message);
                  } finally {
                    setDriveBusy(false);
                  }
                }}
                disabled={driveBusy}
                className="btn btn-primary"
                style={{ fontSize: 11, padding: "8px 12px" }}
              >
                <Upload size={11} /> نسخة الآن
              </button>
            </div>
            {driveStatus && (
              <p style={{
                fontSize: 10, marginTop: 10, marginBottom: 0,
                color: "var(--text-muted)",
              }}>
                {driveStatus}
              </p>
            )}
          </div>

          {/* Export / Import */}
          <div className="card">
            <h3 style={{ fontSize: 13, fontWeight: 900, marginBottom: 12 }}>
              <Database size={14} style={{ verticalAlign: "middle", marginLeft: 6 }} />
              نسخة احتياطية محلية
            </h3>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              <button
                onClick={() => {
                  const blob = new Blob(
                    [JSON.stringify({ data, exportedAt: new Date().toISOString(), version: "V89.0" })],
                    { type: "application/json" },
                  );
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement("a");
                  a.href = url;
                  a.download = `finance_backup_v89_${getLocalISODate()}.json`;
                  a.click();
                  URL.revokeObjectURL(url);
                  addNotification({ type: "success", title: "تم التصدير" });
                }}
                className="btn btn-secondary"
                style={{ flex: 1, fontSize: 11 }}
              >
                <Download size={11} /> تصدير JSON
              </button>
              <label className="btn btn-secondary" style={{ flex: 1, fontSize: 11, cursor: "pointer" }}>
                <Upload size={11} /> استيراد
                <input
                  type="file"
                  accept=".json"
                  style={{ display: "none" }}
                  onChange={(e) => {
                    const file = e.target.files?.[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                      try {
                        const parsed = JSON.parse(evt.target.result);
                        if (parsed.data) {
                          saveHistory();
                          dispatch({ type: "SET_DATA", payload: migrateData(parsed.data) });
                          addNotification({ type: "success", title: "تم الاستيراد" });
                        }
                      } catch {
                        addNotification({ type: "error", title: "ملف غير صالح" });
                      }
                    };
                    reader.readAsText(file);
                  }}
                />
              </label>
            </div>
          </div>

          {/* Reset */}
          <div className="card" style={{ borderColor: "var(--brand)" }}>
            <h3 style={{ fontSize: 13, fontWeight: 900, marginBottom: 8, display: "flex", alignItems: "center", gap: 8 }}>
              <RefreshCcw size={14} style={{ color: "var(--brand)" }} />
              بداية جديدة ذكية
            </h3>
            <p style={{
              fontSize: 11, lineHeight: 1.7, marginBottom: 12,
              color: "var(--text-secondary)",
            }}>
              يمسح المعاملات الشخصية ويحفظ: الكروت + هاني + المتكررة + الإعدادات
            </p>
            <button
              onClick={() => onResetPersonalData({
                keepHanyTransactions: true,
                keepRecurringItems: true,
                keepCards: true,
              })}
              className="btn btn-primary"
              style={{ width: "100%", fontSize: 12 }}
            >
              <RefreshCcw size={12} /> ابدأ من جديد
            </button>
          </div>

          <div className="card" style={{ borderColor: "var(--negative)" }}>
            <h3 style={{ fontSize: 13, fontWeight: 900, marginBottom: 8, color: "var(--negative)" }}>
              <ShieldAlert size={14} style={{ verticalAlign: "middle", marginLeft: 6 }} />
              تصفير شامل (خطير)
            </h3>
            <p style={{
              fontSize: 11, marginBottom: 12,
              color: "var(--text-muted)",
            }}>
              ⚠️ يمسح كل شيء حتى قوالب هاني
            </p>
          </div>
        </div>
      )}
    </div>
  );
});

const AccountCard = memo(({ accountKey, accountsData, data, dispatch, saveHistory, addNotification }) => {
  const acc = accountsData?.[accountKey] || DEFAULT_ACCOUNTS[accountKey];
  const [localBalance, setLocalBalance] = useState(String(acc.initialBalance || 0));
  const [dirty, setDirty] = useState(false);

  useEffect(() => {
    if (!dirty) setLocalBalance(String(acc.initialBalance || 0));
  }, [acc.initialBalance, dirty]);

  const handleSave = () => {
    saveHistory();
    const newInit = parseNumberInput(localBalance);
    const today = getLocalISODate();
    const cleaned = { ...accountsData };
    cleaned[accountKey] = {
      ...acc,
      initialBalance: newInit,
      balance: newInit,
      initialDate: safeNumber(acc.initialBalance) !== newInit ? today : acc.initialDate,
      lastUpdated: safeNumber(acc.initialBalance) !== newInit ? today : acc.lastUpdated,
    };
    dispatch({ type: "UPDATE_ACCOUNTS", payload: cleaned });
    addNotification({ type: "success", title: "تم الحفظ" });
    setDirty(false);
  };

  return (
    <div className="card" style={{ padding: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
        <ProviderLogo providerKey={acc.providerKey || "cash"} size="md" />
        <h4 style={{ fontSize: 12, fontWeight: 900, margin: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {acc.label}
        </h4>
      </div>
      <label style={{
        fontSize: 10, fontWeight: 800, marginBottom: 4, display: "block",
        color: "var(--text-muted)",
      }}>
        الرصيد الافتتاحي
      </label>
      <input
        type="text"
        inputMode="decimal"
        className="input-field input-num"
        style={{ fontSize: 14, padding: "10px 12px", textAlign: "center", color: "var(--brand)" }}
        value={localBalance}
        onChange={(e) => {
          setLocalBalance(e.target.value);
          setDirty(true);
        }}
      />
      {dirty && (
        <button
          onClick={handleSave}
          className="btn btn-primary"
          style={{ width: "100%", marginTop: 8, fontSize: 11, padding: "8px 12px" }}
        >
          <Save size={11} /> حفظ
        </button>
      )}
    </div>
  );
});

const CardSettingsCard = memo(({ card, data, dispatch, saveHistory, addNotification }) => {
  const debt = computeCardDebt(data, card);
  const [localLimit, setLocalLimit] = useState(String(card.limit || 0));
  const [dirty, setDirty] = useState(false);

  useEffect(() => {
    if (!dirty) setLocalLimit(String(card.limit || 0));
  }, [card.limit, dirty]);

  const handleSave = () => {
    saveHistory();
    const newLimit = safeNumber(parseNumberInput(localLimit));
    dispatch({
      type: "UPDATE_CARDS",
      payload: (data.cards || []).map((c) =>
        c.id === card.id ? { ...c, limit: newLimit } : c,
      ),
    });
    addNotification({ type: "success", title: "تم الحفظ" });
    setDirty(false);
  };

  return (
    <div className="card" style={{ padding: 14, marginBottom: 8 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
        <ProviderLogo providerKey={card.providerKey || "cib"} size="md" />
        <div style={{ flex: 1, minWidth: 0 }}>
          <h4 style={{ fontSize: 12, fontWeight: 900, margin: 0 }}>{card.bank} - {card.name}</h4>
          <p style={{
            fontSize: 10, color: "var(--text-muted)",
            fontFamily: "monospace", margin: "2px 0 0",
          }}>
            •••• {card.last4}
          </p>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <div>
          <label style={{ fontSize: 10, fontWeight: 800, color: "var(--text-muted)", display: "block", marginBottom: 4 }}>
            الحد
          </label>
          <input
            type="text"
            inputMode="decimal"
            className="input-field input-num"
            style={{ fontSize: 13, padding: "8px 10px", textAlign: "center", color: "var(--brand)" }}
            value={localLimit}
            onChange={(e) => { setLocalLimit(e.target.value); setDirty(true); }}
          />
        </div>
        <div>
          <label style={{ fontSize: 10, fontWeight: 800, color: "var(--text-muted)", display: "block", marginBottom: 4 }}>
            المديونية
          </label>
          <div style={{
            padding: "8px 10px", borderRadius: 12,
            background: "var(--negative-soft)",
            textAlign: "center", fontSize: 13, fontWeight: 900,
            color: "var(--negative)", fontVariantNumeric: "tabular-nums",
          }}>
            {fmt(debt)}
          </div>
        </div>
      </div>
      {dirty && (
        <button
          onClick={handleSave}
          className="btn btn-primary"
          style={{ width: "100%", marginTop: 8, fontSize: 11, padding: "8px 12px" }}
        >
          <Save size={11} /> حفظ
        </button>
      )}
    </div>
  );
});
