<!-- Custom Styles -->
<style>
:root {
  --primary-gradient: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
  --success-gradient: linear-gradient(135deg, #10B981 0%, #059669 100%);
  --danger-gradient: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
  --warning-gradient: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
  --profit-gradient: linear-gradient(135deg, #10B981 0%, #059669 100%);
  --loss-gradient: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
  --glass-bg: rgba(255, 255, 255, 0.7);
  --glass-dark-bg: rgba(30, 41, 59, 0.7);
}

body {
  @apply text-slate-800 transition-colors duration-300 font-sans antialiased;
  padding-bottom: calc(140px + env(safe-area-inset-bottom));
  background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%);
  min-height: 100vh;
}
.dark body {
  @apply text-slate-100;
  background: linear-gradient(135deg, #020617 0%, #0F172A 100%);
}

/* Scrollbar Styling */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { @apply bg-slate-100 dark:bg-slate-900 rounded-full; }
::-webkit-scrollbar-thumb { @apply bg-slate-300 dark:bg-slate-700 rounded-full hover:bg-slate-400 dark:hover:bg-slate-600 transition-colors; }
.scroll-hide::-webkit-scrollbar { display: none; }

/* Glass Effect */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  @apply border border-white/40 dark:border-slate-700/40 shadow-glass;
}
.dark .glass {
  background: var(--glass-dark-bg);
}

/* Text Effects */
.text-gradient { 
  background: var(--primary-gradient);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.gradient-text-success {
  background: var(--success-gradient);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.gradient-text-danger {
  background: var(--danger-gradient);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Interactive Elements */
.hover-lift { 
  @apply transition-all duration-300 hover:-translate-y-1 hover:shadow-card-hover active:scale-[0.98]; 
}
.gradient-bg-primary {
  background: var(--primary-gradient);
}
.gradient-bg-success {
  background: var(--success-gradient);
}
.gradient-bg-danger {
  background: var(--danger-gradient);
}
.gradient-bg-warning {
  background: var(--warning-gradient);
}
.gradient-bg-profit {
  background: var(--profit-gradient);
}
.gradient-bg-loss {
  background: var(--loss-gradient);
}

/* Bottom Navigation */
.bottom-nav-container {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  @apply border-t border-slate-200/60 dark:border-slate-800/60 shadow-classic;
}
.dark .bottom-nav-container {
  background: rgba(15, 23, 42, 0.95);
}

.scrollable-nav { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 12px 16px; -webkit-overflow-scrolling: touch; }
.nav-btn { 
  @apply flex flex-col items-center justify-center min-w-[70px] h-[60px] rounded-2xl text-slate-500 dark:text-slate-400 transition-all duration-200 relative flex-shrink-0;
}
.nav-btn:hover { 
  @apply bg-slate-100 dark:bg-slate-800/50 text-slate-700 dark:text-slate-300; 
}
.nav-btn.active { 
  background: var(--primary-gradient);
  @apply text-white shadow-md scale-105;
}
.nav-btn span { font-size: 11px; margin-top: 4px; font-weight: 700; white-space: nowrap; }
.v-line { @apply w-px h-8 bg-slate-200 dark:bg-slate-700/50 flex-shrink-0; }

/* FAB Button */
.fab {
  position: fixed; bottom: 90px; left: 20px; z-index: 1100;
  background: var(--primary-gradient);
  @apply w-16 h-16 text-white rounded-2xl shadow-2xl shadow-blue-500/40 flex items-center justify-center border-4 border-white dark:border-slate-900 transition-all duration-300;
}
.fab:hover { 
  @apply scale-110 shadow-neon; 
  transform: rotate(90deg);
}
.fab:active { @apply scale-90; }

/* Input Fields */
.input-field {
  @apply w-full p-4 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none transition-all duration-300;
  @apply bg-white/80 dark:bg-slate-800/80 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500;
  @apply focus:border-primary focus:ring-4 focus:ring-primary/10 dark:focus:ring-primary/20 focus:shadow-sm;
}

/* Loading Spinner */
.loading-spinner { 
  @apply w-8 h-8 border-4 border-primary/30 border-t-primary rounded-full animate-spin;
}

/* Credit Card Styling */
.credit-card-chip {
  background: linear-gradient(135deg, #d4af37 0%, #f9e295 50%, #d4af37 100%);
  border-radius: 6px;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
}
.credit-card-chip::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 70%; height: 60%;
  border: 1px solid rgba(0,0,0,0.2);
  border-radius: 3px;
}

/* Table Styling */
.table-container {
  @apply rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700;
}
.table-header {
  @apply bg-slate-50/80 dark:bg-slate-800/50 backdrop-blur-sm;
}
.table-cell {
  @apply p-4 border-b border-slate-100 dark:border-slate-800/50;
}

/* Badge Styling */
.badge {
  @apply px-3 py-1 rounded-full text-xs font-bold inline-flex items-center gap-1;
}
.badge-success { @apply bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400; }
.badge-danger { @apply bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400; }
.badge-warning { @apply bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400; }
.badge-info { @apply bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400; }
.badge-profit { @apply bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400; }
.badge-loss { @apply bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400; }

/* Card Styling */
.stat-card {
  @apply glass rounded-2xl p-6 hover-lift border-l-4;
}
.stat-card-income { @apply border-l-emerald-500; }
.stat-card-expense { @apply border-l-red-500; }
.stat-card-balance { @apply border-l-blue-500; }

/* Modal Backdrop */
.modal-backdrop {
  @apply fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-[2500] p-4;
}

/* Print Optimization */
@media print {
  .no-print, .bottom-nav-container, .fab, .lock-screen, button, input[type="date"], input[type="text"], select {
    display: none !important;
  }
  body, .glass {
    background: white !important;
    color: black !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  main {
    overflow: visible !important;
  }
  table {
    page-break-inside: auto;
  }
  tr {
    page-break-inside: avoid;
    page-break-after: auto;
  }
}

/* Animation Classes */
.animate-float-slow {
  animation: float 8s ease-in-out infinite;
}
.animate-gradient {
  background-size: 200% 200%;
  animation: gradient 3s ease infinite;
}

/* Custom Shadows */
.shadow-soft {
  box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
}
.shadow-hard {
  box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.2);
}

/* Gradient Borders */
.gradient-border {
  position: relative;
  background: linear-gradient(white, white) padding-box,
              var(--primary-gradient) border-box;
  border: 2px solid transparent;
}
.dark .gradient-border {
  background: linear-gradient(#1E293B, #1E293B) padding-box,
              var(--primary-gradient) border-box;
}

/* Ticker Styling */
.ticker-wrap {
  overflow: hidden;
  height: 100%;
}
.ticker-content {
  display: inline-flex;
  animation: ticker-scroll 50s linear infinite;
}
.ticker-item {
  padding: 0 1.5rem;
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
}

/* Processing Overlay */
.processing-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(10px);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
  animation: fadeIn 0.3s ease-out;
}

.processing-spinner {
  width: 60px;
  height: 60px;
  border: 4px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: #3B82F6;
  animation: spin 1s ease-in-out infinite;
}

/* Quick Balance Panel */
.quick-balance-panel {
  @apply glass rounded-2xl p-4 mb-6 border border-blue-100 dark:border-blue-900/30;
}
.balance-account-card {
  @apply bg-white/50 dark:bg-slate-800/50 p-3 rounded-xl text-center transition-all duration-300 hover:scale-[1.02] hover:shadow-md;
}

/* حماية من التحديق */
.no-pointer-events {
  pointer-events: none;
}
.protected-blur {
  filter: blur(4px);
  transition: filter 0.3s ease;
}
.protected-blur:hover {
  filter: blur(0);
}

/* Accounting Styles */
.journal-entry {
  @apply border-r-4 rounded-lg p-4 mb-3 transition-all duration-300;
}
.journal-entry.debit {
  @apply border-r-emerald-500 bg-emerald-50/30 dark:bg-emerald-900/10;
}
.journal-entry.credit {
  @apply border-r-red-500 bg-red-50/30 dark:bg-red-900/10;
}
.journal-entry.transfer {
  @apply border-r-blue-500 bg-blue-50/30 dark:bg-blue-900/10;
}

.ledger-account {
  @apply glass p-4 rounded-2xl mb-4 hover-lift;
}
.ledger-account.active {
  @apply border-2 border-blue-500;
}

.accounting-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.accounting-grid .debit-column {
  @apply text-emerald-600;
}
.accounting-grid .credit-column {
  @apply text-red-600;
}
</style>

const getLocalISODate = () => {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
};

// ========== وظائف محاسبية ==========
const createJournalEntry = (entries, description, date, reference = '') => {
  const totalDebit = entries.filter(e => e.type === 'debit').reduce((sum, e) => sum + e.amount, 0);
  const totalCredit = entries.filter(e => e.type === 'credit').reduce((sum, e) => sum + e.amount, 0);
  
  if (Math.abs(totalDebit - totalCredit) > 0.01) {
    throw new Error(`القيد غير متوازن! المدين: ${totalDebit}, الدائن: ${totalCredit}`);
  }
  
  return {
    id: `je_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
    date: date || getLocalISODate(),
    description,
    reference,
    entries: entries.map(entry => ({
      ...entry,
      accountName: CHART_OF_ACCOUNTS[entry.accountId]?.name || 'غير معروف'
    })),
    createdAt: new Date().toISOString(),
    totalDebit,
    totalCredit
  };
};

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }

  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }

  componentDidCatch(error, errorInfo) {
    console.error('Application Error:', error, errorInfo);
  }

  render() {
    if (this.state.hasError) {
      return React.createElement('div', {
        className: "flex flex-col h-screen items-center justify-center gradient-bg-danger text-white p-8 text-center animate-fadeIn",

const Dashboard = ({ data, onNavigate }) => {
  const stats = useMemo(() => {
    const transactions = data.transactions || [];
    const currentMonth = MONTHS[new Date().getMonth()];
    const monthTransactions = transactions.filter(t => t.month === currentMonth);
    
    const income = monthTransactions.filter(t => t.type === 'income')
      .reduce((sum, t) => sum + (t.amount || 0), 0);
    const expense = monthTransactions.filter(t => t.type === 'expense')
      .reduce((sum, t) => sum + (t.amount || 0), 0);
    const balance = income - expense;
    
    return { income, expense, balance };

const TransactionsView = ({ transactions, onEdit, onDelete }) => {
  const [filterType, setFilterType] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');
  const [selectedMonth, setSelectedMonth] = useState(MONTHS[new Date().getMonth()]);

  const filteredTransactions = useMemo(() => {
    return (transactions || [])
      .filter(t => {
        if (filterType !== 'all' && t.type !== filterType) return false;
        if (searchTerm && !t.category?.toLowerCase().includes(searchTerm.toLowerCase()) &&
            !t.description?.toLowerCase().includes(searchTerm.toLowerCase())) return false;
        if (selectedMonth !== 'all' && t.month !== selectedMonth) return false;
        return true;
      })
      .sort((a, b) => new Date(b.date) - new Date(a.date));
  }, [transactions, filterType, searchTerm, selectedMonth]);

    const filtered = filteredTransactions;

// مكون التقارير
const ReportsView = ({ transactions, accounts }) => {
  const [reportType, setReportType] = useState('monthly');
  const [selectedYear, setSelectedYear] = useState(CURRENT_YEAR);

  // حساب الإحصائيات الشهرية
  const monthlyStats = useMemo(() => {
    const stats = {};
    MONTHS.forEach(month => {
      const monthTransactions = (transactions || []).filter(t => t.month === month);
      stats[month] = {
        income: monthTransactions.filter(t => t.type === 'income')
          .reduce((sum, t) => sum + (t.amount || 0), 0),
        expense: monthTransactions.filter(t => t.type === 'expense')
          .reduce((sum, t) => sum + (t.amount || 0), 0),
        count: monthTransactions.length
      };
    });
    return stats;
  }, [transactions]);

  // حساب الإحصائيات حسب الفئة
  const categoryStats = useMemo(() => {
    const stats = { income: {}, expense: {} };
    (transactions || []).forEach(transaction => {
      const type = transaction.type;
      const category = transaction.category;
      if (!stats[type][category]) {
        stats[type][category] = { total: 0, count: 0 };
      }
      stats[type][category].total += transaction.amount || 0;
      stats[type][category].count++;
    });
    return stats;
  }, [transactions]);

  return React.createElement('div', { className: "space-y-6 animate-fadeIn" },
    // فلترة التقارير
    React.createElement('div', { className: "glass p-6 rounded-2xl" },
      React.createElement('div', { className: "flex flex-col md:flex-row gap-4 items-center justify-between" },
        React.createElement('div', { className: "flex gap-2" },
          ['monthly', 'categories', 'accounts'].map(type =>
            React.createElement('button', {
              key: type,
              onClick: () => setReportType(type),
              className: `px-4 py-2 rounded-lg font-medium ${
                reportType === type 
                  ? 'gradient-bg-primary text-white' 
                  : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'
              }` 
            },
              type === 'monthly' ? 'شهري' : 
              type === 'categories' ? 'حسب الفئة' : 'حسب الحساب'
            )
          )
        ),
        React.createElement('select', {
          value: selectedYear,
          onChange: (e) => setSelectedYear(Number(e.target.value)),
          className: "bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2"
        },
          [CURRENT_YEAR - 1, CURRENT_YEAR, CURRENT_YEAR + 1].map(year =>
            React.createElement('option', { key: year, value: year }, `عام ${year}`)
          )
        )
      )
    ),

    // محتوى التقرير
    reportType === 'monthly' && 
      React.createElement('div', { className: "space-y-6" },
        React.createElement('h3', { className: "text-xl font-bold" }, "التقرير الشهري"),
        React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" },
          Object.entries(monthlyStats).map(([month, data]) =>
            React.createElement('div', {
              key: month,
              className: "glass p-4 rounded-2xl hover-lift"
            },
              React.createElement('div', { className: "flex justify-between items-center mb-3" },
                React.createElement('h4', { className: "font-bold" }, month),
                React.createElement('span', { className: "text-sm text-slate-500" }, `${data.count} معاملة`)
              ),
              React.createElement('div', { className: "space-y-2" },
                React.createElement('div', { className: "flex justify-between" },
                  React.createElement('span', { className: "text-sm text-slate-600" }, "الدخل:"),
                  React.createElement('span', { className: "font-bold text-emerald-600" },
                    `${data.income.toLocaleString()} ج.م`
                  )
                ),
                React.createElement('div', { className: "flex justify-between" },
                  React.createElement('span', { className: "text-sm text-slate-600" }, "المصروفات:"),
                  React.createElement('span', { className: "font-bold text-red-600" },
                    `${data.expense.toLocaleString()} ج.م`
                  )
                ),
                React.createElement('div', { className: "flex justify-between pt-2 border-t border-slate-200" },
                  React.createElement('span', { className: "font-medium" }, "الصافي:"),
                  React.createElement('span', {
                    className: `font-bold ${data.income - data.expense >= 0 ? 'text-emerald-600' : 'text-red-600'}`
                  },
                    `${(data.income - data.expense).toLocaleString()} ج.م`
                  )
                )
              )
            )
          )
        )
      ),

    reportType === 'categories' &&
      React.createElement('div', { className: "space-y-6" },
        React.createElement('div', { className: "grid grid-cols-1 lg:grid-cols-2 gap-6" },
          // الدخل حسب الفئة
          React.createElement('div', { className: "glass p-6 rounded-2xl" },
            React.createElement('h4', { className: "font-bold text-lg mb-4 flex items-center gap-2" },
              React.createElement(Icon, { name: 'TrendingUp', size: 20, className: "text-emerald-600" }),
              "الدخل حسب الفئة"
            ),
            Object.entries(categoryStats.income).length > 0
              ? React.createElement('div', { className: "space-y-3" },
                  Object.entries(categoryStats.income)
                    .sort((a, b) => b[1].total - a[1].total)
                    .map(([category, data]) =>
                      React.createElement('div', {
                        key: category,
                        className: "flex items-center justify-between p-3 rounded-lg bg-emerald-50 dark:bg-emerald-900/10"
                      },
                        React.createElement('div', { className: "flex items-center gap-3" },
                          React.createElement('div', {
                            className: "w-3 h-3 rounded-full",
                            style: { backgroundColor: CATEGORY_COLORS[category] || '#10b981' }
                          }),
                          React.createElement('span', { className: "font-medium" }, category)
                        ),
                        React.createElement('div', { className: "text-right" },
                          React.createElement('p', { className: "font-bold text-emerald-600" },
                            `${data.total.toLocaleString()} ج.م`
                          ),
                          React.createElement('p', { className: "text-xs text-slate-500" },
                            `${data.count} معاملة`
                          )
                        )
                      )
                    )
                )
              : React.createElement('div', { className: "text-center py-8 text-slate-500" },
                  React.createElement(Icon, { name: 'FileText', size: 32, className: "mx-auto mb-3 opacity-50" }),
                  React.createElement('p', null, "لا توجد بيانات للدخل")
                )
          ),
          
          // المصروفات حسب الفئة
          React.createElement('div', { className: "glass p-6 rounded-2xl" },
            React.createElement('h4', { className: "font-bold text-lg mb-4 flex items-center gap-2" },
              React.createElement(Icon, { name: 'TrendingDown', size: 20, className: "text-red-600" }),
              "المصروفات حسب الفئة"
            ),
            Object.entries(categoryStats.expense).length > 0
              ? React.createElement('div', { className: "space-y-3" },
                  Object.entries(categoryStats.expense)
                    .sort((a, b) => b[1].total - a[1].total)
                    .map(([category, data]) =>
                      React.createElement('div', {
                        key: category,
                        className: "flex items-center justify-between p-3 rounded-lg bg-red-50 dark:bg-red-900/10"
                      },
                        React.createElement('div', { className: "flex items-center gap-3" },
                          React.createElement('div', {
                            className: "w-3 h-3 rounded-full",
                            style: { backgroundColor: CATEGORY_COLORS[category] || '#ef4444' }
                          }),
                          React.createElement('span', { className: "font-medium" }, category)
                        ),
                        React.createElement('div', { className: "text-right" },
                          React.createElement('p', { className: "font-bold text-red-600" },
                            `${data.total.toLocaleString()} ج.م`
                          ),
                          React.createElement('p', { className: "text-xs text-slate-500" },
                            `${data.count} معاملة`
                          )
                        )
                      )
                    )
                )
              : React.createElement('div', { className: "text-center py-8 text-slate-500" },
                  React.createElement(Icon, { name: 'FileText', size: 32, className: "mx-auto mb-3 opacity-50" }),
                  React.createElement('p', null, "لا توجد بيانات للمصروفات")
                )
          )
        )
      ),

    reportType === 'accounts' &&
      React.createElement('div', { className: "space-y-6" },
        React.createElement('h3', { className: "text-xl font-bold" }, "أرصدة الحسابات"),
        React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" },
          Object.entries(accounts || {}).map(([id, account]) =>
            React.createElement('div', {
              key: id,
              className: "glass p-6 rounded-2xl hover-lift"
            },
              React.createElement('div', { className: "flex items-center gap-3 mb-4" },
                React.createElement('div', { className: "p-2 rounded-lg bg-primary/10" },
                  React.createElement(Icon, {
                    name: id.includes('cash') ? 'Wallet' : 
                           id.includes('fawry') ? 'Store' : 
                           id.includes('etisalat') ? 'Smartphone' : 
                           id.includes('cib') ? 'BuildingBank' : 'PiggyBank',
                    size: 24,
                    className: "text-primary"
                  })
                ),
                React.createElement('div', null,
                  React.createElement('h4', { className: "font-bold" }, account.name),
                  React.createElement('p', { className: "text-sm text-slate-500" }, `آخر تحديث: اليوم`)
                )
              ),
              React.createElement('p', { className: "text-3xl font-black text-center mb-4" },
                `${(account.balance || 0).toLocaleString()} ج.م`
              ),
              React.createElement('div', { className: "h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden" },
                React.createElement('div', {
                  className: "h-full gradient-bg-primary",
                  style: { 
                    width: `${Math.min((account.balance || 0) / 10000 * 100, 100)}%` 
                  }
                })
              )
            )
          )
        )
      )
  );
};

// المكون الرئيسي للتطبيق
const App = () => {
  const [state, setState] = useState({
    activeTab: 'dashboard',
    isLocked: false,
    isDarkMode: localStorage.getItem('theme') === 'dark',
    data: getInitialData(),
    showTransactionForm: false,
    transactionFormMode: 'add',
    editingTransaction: null,
    showNotification: false,
    notification: { type: 'success', message: '' }
  });

  // التبديل بين الوضع الداكن والفاتح
  const toggleDarkMode = () => {
    const newMode = !state.isDarkMode;
    setState(prev => ({ ...prev, isDarkMode: newMode }));
    localStorage.setItem('theme', newMode ? 'dark' : 'light');
    if (newMode) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  };

  // حفظ البيانات
  const saveData = useCallback((newData) => {
    setState(prev => {
      const updated = { ...prev, data: newData };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(newData));
      return updated;
    });
  }, []);

  // عرض الإشعار
  const showNotification = (type, message) => {
    setState(prev => ({
      ...prev,
      showNotification: true,
      notification: { type, message }
    }));
    setTimeout(() => {
      setState(prev => ({ ...prev, showNotification: false }));
    }, 3000);
  };

  // إضافة معاملة
  const handleAddTransaction = (transactionData) => {
    const newTransactions = [...state.data.transactions, transactionData];
    const newData = { ...state.data, transactions: newTransactions };
    saveData(newData);
    showNotification('success', 'تم إضافة المعاملة بنجاح');
    setState(prev => ({
      ...prev,
      showTransactionForm: false,
      editingTransaction: null
    }));
  };

  // تعديل معاملة
  const handleEditTransaction = (transactionData) => {
    const newTransactions = state.data.transactions.map(t =>
      t.id === transactionData.id ? transactionData : t
    );
    const newData = { ...state.data, transactions: newTransactions };
    saveData(newData);
    showNotification('success', 'تم تعديل المعاملة بنجاح');
    setState(prev => ({
      ...prev,
      showTransactionForm: false,
      editingTransaction: null
    }));
  };

  // حذف معاملة
  const handleDeleteTransaction = (transactionId) => {
    if (window.confirm('هل أنت متأكد من حذف هذه المعاملة؟')) {
      const newTransactions = state.data.transactions.filter(t => t.id !== transactionId);
      const newData = { ...state.data, transactions: newTransactions };
      saveData(newData);
      showNotification('success', 'تم حذف المعاملة بنجاح');
    }
  };

  // إضافة قرض
  const handleAddLoan = (loanData) => {
    const newLoans = [...state.data.loans, loanData];
    const newData = { ...state.data, loans: newLoans };
    saveData(newData);
    showNotification('success', 'تم إضافة القرض بنجاح');
  };

  // تعديل قرض
  const handleEditLoan = (loanData) => {
    const newLoans = state.data.loans.map(l =>
      l.id === loanData.id ? loanData : l
    );
    const newData = { ...state.data, loans: newLoans };
    saveData(newData);
    showNotification('success', 'تم تعديل القرض بنجاح');
  };

  // حذف قرض
  const handleDeleteLoan = (loanId) => {
    if (window.confirm('هل أنت متأكد من حذف هذا القرض؟')) {
      const newLoans = state.data.loans.filter(l => l.id !== loanId);
      const newData = { ...state.data, loans: newLoans };
      saveData(newData);
      showNotification('success', 'تم حذف القرض بنجاح');
    }
  };

  // تحديث رصيد الحساب
  const handleUpdateAccountBalance = (accountId, newBalance) => {
    const newAccounts = {
      ...state.data.accounts,
      [accountId]: { ...state.data.accounts[accountId], balance: newBalance }
    };
    const newData = { ...state.data, accounts: newAccounts };
    saveData(newData);
    showNotification('success', 'تم تحديث الرصيد بنجاح');
  };

  // توليد بيانات محاسبية افتراضية
  const generateAccountingData = () => {
    const journalEntries = [];
    const ledgerAccounts = {};

    // معالجة المعاملات الحالية
    state.data.transactions.forEach(transaction => {
      try {
        let entries = [];
        if (transaction.type === 'income') {
          entries = [
            { accountId: '1001', type: 'debit', amount: transaction.amount },
            { accountId: '4001', type: 'credit', amount: transaction.amount }
          ];
        } else {
          entries = [
            { accountId: '5001', type: 'debit', amount: transaction.amount },
            { accountId: '1001', type: 'credit', amount: transaction.amount }
          ];
        }

        const journalEntry = createJournalEntry(
          entries,
          transaction.description || transaction.category,
          transaction.date,
          transaction.id
        );
        journalEntries.push(journalEntry);

        // تحديث دفتر الأستاذ
        journalEntry.entries.forEach(entry => {
          const accountId = entry.accountId;
          if (!ledgerAccounts[accountId]) {
            ledgerAccounts[accountId] = {
              ...CHART_OF_ACCOUNTS[accountId],
              debitBalance: 0,
              creditBalance: 0,
              balance: 0,
              transactions: []
            };
          }

          if (entry.type === 'debit') {
            ledgerAccounts[accountId].debitBalance += entry.amount;
          } else {
            ledgerAccounts[accountId].creditBalance += entry.amount;
          }

          // حساب الرصيد
          if (ledgerAccounts[accountId].normalBalance === 'debit') {
            ledgerAccounts[accountId].balance = 
              ledgerAccounts[accountId].debitBalance - ledgerAccounts[accountId].creditBalance;
          } else {
            ledgerAccounts[accountId].balance = 
              ledgerAccounts[accountId].creditBalance - ledgerAccounts[accountId].debitBalance;
          }
        });
      } catch (error) {
        console.error('Error generating accounting data:', error);
      }
    });

    return { journalEntries, ledgerAccounts };
  };

  // التبديل بين الصفحات
  const navigate = (tab) => {
    setState(prev => ({ ...prev, activeTab: tab }));
  };

  // إعداد تأثيرات أولية
  useEffect(() => {
    if (state.isDarkMode) {
      document.documentElement.classList.add('dark');
    }

    // إخفاء شاشة التحميل
    setTimeout(() => {
      const loadingElement = document.getElementById('loading');
      if (loadingElement) {
        loadingElement.style.display = 'none';
      }
    }, 1000);
  }, [state.isDarkMode]);

  // عرض الصفحة النشطة
  const renderActiveView = () => {
    const accountingData = generateAccountingData();

    switch (state.activeTab) {
      case 'dashboard':
        return React.createElement(Dashboard, {
          data: state.data,
          onNavigate: navigate
        });

      case 'transactions':
        return React.createElement(TransactionsView, {
          transactions: state.data.transactions,
          onEdit: (transaction) => {
            setState(prev => ({
              ...prev,
              showTransactionForm: true,
              transactionFormMode: 'edit',
              editingTransaction: transaction
            }));
          },
          onDelete: handleDeleteTransaction
        });

      case 'cards':
        return React.createElement(CardsView, {
          accounts: state.data.accounts,
          onUpdateBalance: handleUpdateAccountBalance
        });

      case 'loans':
        return React.createElement(LoansView, {
          loans: state.data.loans,
          onAdd: handleAddLoan,
          onEdit: handleEditLoan,
          onDelete: handleDeleteLoan
        });

      case 'accounting':
        return React.createElement(AccountingLedgerView, {
          ledgerAccounts: accountingData.ledgerAccounts,
          journalEntries: accountingData.journalEntries,
          onExport: () => {
            const dataStr = JSON.stringify(accountingData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `accounting_data_${getLocalISODate()}.json`;
            link.click();
            URL.revokeObjectURL(url);
            showNotification('success', 'تم تصدير البيانات المحاسبية بنجاح');
          }
        });

      case 'reports':
        return React.createElement(ReportsView, {
          transactions: state.data.transactions,
          accounts: state.data.accounts
        });

      default:
        return React.createElement(Dashboard, {
          data: state.data,
          onNavigate: navigate
        });
    }
  };

  // قائمة التنقل السفلية
  const bottomNavItems = [
    { id: 'dashboard', label: 'الرئيسية', icon: 'LayoutDashboard' },
    { id: 'transactions', label: 'المعاملات', icon: 'ArrowRightLeft' },
    { id: 'cards', label: 'المحافظ', icon: 'CreditCard' },
    { id: 'loans', label: 'القروض', icon: 'Banknote' },
    { id: 'accounting', label: 'المحاسبة', icon: 'BookOpen' },
    { id: 'reports', label: 'التقارير', icon: 'FileBarChart' }
  ];

  return React.createElement('div', {
    className: `min-h-screen transition-colors duration-300 ${
      state.isDarkMode ? 'dark bg-dark-bg' : 'bg-gray-50'
    }`
  },
    // Header
    React.createElement('header', {
      className: "glass sticky top-0 z-50 border-b border-slate-200 dark:border-slate-800"
    },
      React.createElement('div', { className: "px-4 py-3 flex justify-between items-center" },
        React.createElement('div', { className: "flex items-center gap-3" },
          React.createElement('div', { className: "gradient-bg-primary p-2 rounded-lg" },
            React.createElement(Icon, { name: 'Wallet', size: 24, className: "text-white" })
          ),
          React.createElement('div', null,
            React.createElement('h1', { className: "font-black text-lg" }, "المحفظة المالية"),
            React.createElement('p', { className: "text-xs text-slate-500" }, "V52 المحاسبة المتكاملة")
          )
        ),
        React.createElement('div', { className: "flex items-center gap-3" },
          React.createElement('button', {
            onClick: toggleDarkMode,
            className: "p-2 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700"
          },
            state.isDarkMode 
              ? React.createElement(Icon, { name: 'Sun', size: 20, className: "text-yellow-500" })
              : React.createElement(Icon, { name: 'Moon', size: 20, className: "text-slate-600" })
          ),
          state.activeTab === 'dashboard' && React.createElement('button', {
            onClick: () => {
              setState(prev => ({
                ...prev,
                showTransactionForm: true,
                transactionFormMode: 'add',
                editingTransaction: null
              }));
            },
            className: "gradient-bg-primary text-white px-4 py-2 rounded-xl font-bold flex items-center gap-2"
          },
            React.createElement(Icon, { name: 'Plus', size: 16 }),
            "معاملة جديدة"
          )
        )
      )
    ),

    // Main Content
    React.createElement('main', {
      className: "p-4 max-w-7xl mx-auto pb-24"
    },
      renderActiveView()
    ),

    // Floating Action Button
    state.activeTab !== 'dashboard' && React.createElement('button', {
      onClick: () => {
        setState(prev => ({
          ...prev,
          showTransactionForm: true,
          transactionFormMode: 'add',
          editingTransaction: null
        }));
      },
      className: "fab"
    },
      React.createElement(Icon, { name: 'Plus', size: 24, className: "text-white" })
    ),

    // Bottom Navigation
    React.createElement('div', { className: "bottom-nav-container" },
      React.createElement('div', { className: "scrollable-nav" },
        bottomNavItems.map(item =>
          React.createElement('button', {
            key: item.id,
            type: "button",
            onClick: () => navigate(item.id),
            className: `nav-btn ${state.activeTab === item.id ? 'active' : ''}`
          },
            React.createElement(Icon, { name: item.icon, size: 22 }),
            React.createElement('span', null, item.label)
          )
        )
      )
    ),

    // Transaction Form Modal
    state.showTransactionForm && React.createElement(TransactionForm, {
      mode: state.transactionFormMode,
      initialData: state.editingTransaction,
      onSubmit: (data) => {
        if (state.transactionFormMode === 'add') {
          handleAddTransaction(data);
        } else {
          handleEditTransaction(data);
        }
      },
      onCancel: () => {
        setState(prev => ({
          ...prev,
          showTransactionForm: false,
          editingTransaction: null
        }));
      }
    }),

    // Notification
    state.showNotification && React.createElement('div', {
      className: `fixed top-4 left-4 right-4 md:left-auto md:right-4 md:w-96 z-50 animate-fadeInUp`
    },
      React.createElement('div', {
        className: `p-4 rounded-2xl shadow-lg flex items-center gap-3 ${
          state.notification.type === 'success' 
            ? 'bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800' 
            : 'bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800'
        }` 
      },
        React.createElement(Icon, {
          name: state.notification.type === 'success' ? 'CheckCircle2' : 'AlertTriangle',
          size: 20,
          className: state.notification.type === 'success' ? 'text-emerald-600' : 'text-red-600'
        }),
        React.createElement('p', { className: "flex-1 font-medium" }, state.notification.message),
        React.createElement('button', {
          onClick: () => setState(prev => ({ ...prev, showNotification: false })),
          className: "p-1 rounded-full hover:bg-black/5"
        },
          React.createElement(Icon, { name: 'X', size: 16 })
        )
      )
    ),

    // Lock Screen
    state.isLocked && React.createElement('div', {
      className: "lock-screen backdrop-blur-3xl fixed inset-0 z-50 flex flex-col items-center justify-center animate-fadeIn"
    },
      React.createElement(Icon, { name: 'Lock', size: 80, className: "text-primary mb-8" }),
      React.createElement('h2', { className: "text-3xl font-black mb-8 text-white" }, "التطبيق مقفل"),
      React.createElement('button', {
        onClick: () => setState(prev => ({ ...prev, isLocked: false })),
        className: "gradient-bg-primary text-white px-12 py-4 rounded-full font-bold shadow-2xl hover:shadow-neon transition-all flex items-center gap-3"
      },
        React.createElement(Icon, { name: 'Unlock', size: 24 }),
        "فتح التطبيق"
      )
    )
  );
};

// تشغيل التطبيق
const rootElement = document.getElementById('root');
if (rootElement) {
  const root = ReactDOM.createRoot(rootElement);
  root.render(
    React.createElement(ErrorBoundary, null,
      React.createElement(App)
    )
  );
}
</script>
</body>
</html>
