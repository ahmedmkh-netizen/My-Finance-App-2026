          <table className="w-full text-right text-xs">
            <thead style={{ background: 'var(--bg-muted)' }}><tr><th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الشهر</th><th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>افتتاحي</th><th className="p-2.5 text-[10px] font-bold text-emerald-600">دخل</th><th className="p-2.5 text-[10px] font-bold text-red-600">مصروف</th><th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الصافي</th><th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الختامي</th><th className="p-2.5 text-[10px] font-bold text-center" style={{ color: 'var(--text-muted)' }}>الحالة</th></tr></thead>
            <tbody>{projection.map(row => (<tr key={`${row.month}-${row.year}`} style={{ borderTop: '1px solid var(--border-subtle)' }}><td className="p-2.5 font-black text-[11px]">{row.month} {String(row.year).slice(2)}</td><td className="p-2.5 text-[10px]" style={{ color: 'var(--text-muted)' }}>{fmt(row.opening)}</td><td className="p-2.5 text-[10px] text-emerald-600">+{fmt(row.inc)}</td><td className="p-2.5 text-[10px] text-red-600">-{fmt(row.out)}</td><td className={`p-2.5 text-[10px] font-black ${row.net >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{row.net >= 0 ? '+' : ''}{fmt(row.net)}</td><td className={`p-2.5 text-[11px] font-black ${row.danger ? 'text-red-600' : 'text-emerald-600'}`}>{fmt(row.running)}</td><td className="p-2.5 text-center">{row.danger ? <span className="badge badge-danger text-[10px]">عجز</span> : row.warn ? <span className="badge badge-warning text-[10px]">انتباه</span> : <span className="badge badge-success text-[10px]">مستقر</span>}</td></tr>))}</tbody>
          </table>
        </div>
      </div>
      {dangerMonths > 0 && (<div className="card" style={{ borderColor: 'var(--danger)' }}><div className="flex items-start gap-2"><AlertTriangle size={16} className="text-red-500 flex-shrink-0 mt-0.5" /><div><h4 className="font-black text-xs text-red-600 mb-1">⚠️ تنبيه: عجز متوقع</h4><p className="text-[11px] leading-relaxed" style={{ color: 'var(--text-secondary)' }}>فيه <strong>{dangerMonths} شهر</strong> متوقع فيهم عجز. أدنى نقطة: <strong>{fmt(minPoint.running)} ج.م</strong> في شهر <strong>{minPoint.month}</strong>.</p></div></div></div>)}
    </div>
  );
});

const ForecastRow = ({ label, value, color, prefix }) => (<div className="flex justify-between items-center"><span className="text-xs font-semibold" style={{ color: 'var(--text-secondary)' }}>{label}</span><span className={`text-sm font-black ${color}`}>{prefix || ''}{fmt(value)}</span></div>);

const LiquidityForecastView = memo(({ transactions, updatedLoans, recurringItems, liveBalances, selectedYear, selectedMonth, monthlyPlans }) => {
  const historical = useMemo(() => {
    const months = [];
    let y = selectedYear;
    let mi = getMonthIndex(selectedMonth);
    for (let i = 1; i <= 3; i++) { mi--; if (mi < 0) { mi = 11; y--; } months.push({ year: y, month: ALL_MONTHS[mi] }); }
    const catData = {};
    let incomeTotal = 0, incomeMonths = 0;
    months.forEach(({ year, month }) => {
      let monthIncome = 0;
      transactions.filter(t => t.status === 'paid' && t.month === month && (t.year || 2026) === year).forEach(t => { const amt = safeNumber(t.amount); if (t.type === 'income') monthIncome += amt; else if (t.type === 'expense') { const c = t.category || 'أخرى'; if (!catData[c]) catData[c] = { total: 0, samples: 0 }; catData[c].total += amt; catData[c].samples++; } });
      if (monthIncome > 0) { incomeTotal += monthIncome; incomeMonths++; }
    });
    const avgPerCat = {};
    let grandTotal = 0;
    Object.entries(catData).forEach(([cat, d]) => { avgPerCat[cat] = d.total / months.length; grandTotal += avgPerCat[cat]; });
    const monthsWithData = months.filter(m => transactions.some(t => t.type === 'expense' && t.status === 'paid' && t.month === m.month && (t.year || 2026) === m.year)).length;
    return { months, avgPerCat, grandTotal, monthsWithData, avgIncome: incomeMonths > 0 ? incomeTotal / incomeMonths : 0 };
  }, [transactions, selectedYear, selectedMonth]);
  const currentSnapshot = useMemo(() => {
    const now = new Date();
    const y = now.getFullYear();
    const m = ALL_MONTHS[now.getMonth()];
    const monthTx = transactions.filter(t => t.month === m && (t.year || y) === y);
    const paid = monthTx.filter(t => t.status === 'paid');
    const pending = monthTx.filter(t => t.status !== 'paid');
    const paidIncome = paid.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidExpense = paid.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncome = pending.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingExpense = pending.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
    const liveTotal = ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(liveBalances[k]), 0);
    const totalTx = paid.length + pending.length;
    const completedPct = totalTx > 0 ? Math.round((paid.length / totalTx) * 100) : 0;
    return { y, m, liveTotal, paidIncome, paidExpense, pendingIncome, pendingExpense, pendingCount: pending.length, expectedEnd: liveTotal + pendingIncome - pendingExpense, completedPct };
  }, [transactions, liveBalances]);
  const projection = useMemo(() => {
    const result = [];
    let balance = currentSnapshot.expectedEnd;
    const activeLoans = updatedLoans.filter(l => !l.isReceivable && !l.autoGenerated && safeNumber(l.monthlyInstallment) > 0 && l.remaining > 0);
    const loansTotal = activeLoans.reduce((s, l) => s + safeNumber(l.monthlyInstallment), 0);
    const recurringExpenses = recurringItems.filter(r => r.type === 'expense' && r.active !== false);
    const recurringTotal = recurringExpenses.reduce((s, r) => s + safeNumber(r.amount), 0);
    const committedTotal = loansTotal + recurringTotal;
    let y = selectedYear, mi = getMonthIndex(selectedMonth);
    for (let i = 1; i <= 3; i++) {
      mi++; if (mi > 11) { mi = 0; y++; }
      const month = ALL_MONTHS[mi];
      const monthKey = makeMonthKey(y, month);
      const plan = (monthlyPlans && monthlyPlans[monthKey]) || {};
      const planIncome = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent) + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE) + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedFreelance) + safeNumber(plan.expectedCash);
      const planCashExpenses = safeNumber(plan.expectedCashExpenses);
      const planPayments = safeNumber(plan.plannedPayments);
      const hasPlan = planIncome > 0 || planCashExpenses > 0 || planPayments > 0;
      const monthTx = transactions.filter(t => t.month === month && (t.year || y) === y);
      const pendingManualIncome = monthTx.filter(t => t.type === 'income' && t.status !== 'paid' && !t.autoGenerated && !t.sourceReceivableId).reduce((s, t) => s + safeNumber(t.amount), 0);
      const pendingManualExpense = monthTx.filter(t => t.type === 'expense' && t.status !== 'paid' && !t.sourceRecurringId).reduce((s, t) => s + safeNumber(t.amount), 0);
      const income = (hasPlan ? planIncome : historical.avgIncome) + pendingManualIncome;
      const expenses = hasPlan ? (planCashExpenses + planPayments + pendingManualExpense) : (historical.grandTotal + committedTotal + pendingManualExpense);
      const closing = balance + income - expenses;
      result.push({ year: y, month, monthKey, opening: balance, income, expenses, closing, planIncome, planCashExpenses, planPayments, pendingIncome: pendingManualIncome, pendingExpense: pendingManualExpense, committed: hasPlan ? planPayments : committedTotal, source: hasPlan ? 'plan' : 'history', hasPlan, savings: income - expenses, safety: closing < 0 ? 'danger' : closing < 5000 ? 'warn' : 'safe' });
      balance = closing;
    }
    return result;
  }, [selectedYear, selectedMonth, currentSnapshot, monthlyPlans, transactions, updatedLoans, recurringItems, historical]);
  const confidence = useMemo(() => {
    const planCount = projection.filter(p => p.hasPlan).length;
    const historyCount = historical.monthsWithData;
    if (planCount >= 2 && historyCount >= 2) return { level: 'مرتفعة', pct: 90, cls: 'badge-success' };
    if (planCount >= 1 && historyCount >= 1) return { level: 'متوسطة', pct: 75, cls: 'badge-warning' };
    if (planCount >= 1 || historyCount >= 1 || currentSnapshot.pendingCount > 0) return { level: 'منخفضة', pct: 60, cls: 'badge-warning' };
    return { level: 'غير كافية', pct: 30, cls: 'badge-danger' };
  }, [projection, historical, currentSnapshot]);
  const hasDanger = projection.some(p => p.safety === 'danger');
  const dangerMonthsArr = projection.filter(p => p.safety === 'danger').map(p => p.month);
  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card flex justify-between items-center flex-wrap gap-3"><div><h2 className="text-base font-black flex items-center gap-2"><LineChart className="text-teal-500" size={18} /> توقع السيولة</h2><p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>رؤية تنبؤية — تستمد من التخطيط + المعلقات + السجل</p></div><div className={`badge ${confidence.cls} px-2.5 py-1.5 text-[10px]`}>دقة {confidence.pct}% • {confidence.level}</div></div>
      <div className="card">
        <div className="flex items-center justify-between mb-3"><h3 className="font-black text-sm flex items-center gap-2"><Clock className="text-amber-500" size={14} /> الشهر الحالي — {currentSnapshot.m} {currentSnapshot.y}</h3>{currentSnapshot.pendingCount > 0 && (<span className="badge badge-warning text-[10px]">⏳ {currentSnapshot.pendingCount} معلق</span>)}</div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
          <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30"><p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الرصيد الحالي</p><p className="text-sm font-black text-blue-600 mt-0.5">{fmt(currentSnapshot.liveTotal)}</p></div>
          <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30"><p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">دخل مُحصَّل</p><p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(currentSnapshot.paidIncome)}</p></div>
          <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30"><p className="text-[10px] font-bold text-red-700 dark:text-red-400">مصروف مدفوع</p><p className="text-sm font-black text-red-600 mt-0.5">{fmt(currentSnapshot.paidExpense)}</p></div>
          <div className="p-2.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>متوقع نهاية الشهر</p><p className={`text-sm font-black mt-0.5 ${currentSnapshot.expectedEnd >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(currentSnapshot.expectedEnd)}</p></div>
        </div>
        <div className="w-full rounded-full h-1.5 overflow-hidden mb-3" style={{ background: 'var(--bg-muted)' }}><div className="h-full bg-gradient-to-r from-blue-400 to-emerald-500 rounded-full transition-all" style={{ width: `${currentSnapshot.completedPct}%` }}></div></div>
        <p className="text-[9px] text-center mb-3" style={{ color: 'var(--text-muted)' }}>{currentSnapshot.completedPct}% من معاملات الشهر مُنجزة</p>
      </div>
      <div className="grid grid-cols-3 gap-2">
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>متوسط دخل (3 شهور)</p><p className="text-sm font-black text-emerald-600 mt-1">{fmt(historical.avgIncome)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>متوسط مصروف</p><p className="text-sm font-black text-amber-600 mt-1">{fmt(historical.grandTotal)}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>مصداقية السجل</p><p className="text-sm font-black text-blue-600 mt-1">{historical.monthsWithData}/3 شهور</p></div>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
        {projection.map((p, idx) => (
          <div key={idx} className="card">
            <div className="flex justify-between items-center mb-3"><div className="min-w-0"><h3 className="text-base font-black">{p.month} {p.year}</h3><span className={`badge ${p.source === 'plan' ? 'badge-brand' : 'badge-neutral'} mt-1 text-[9px]`}>{p.source === 'plan' ? '📋 من التخطيط' : '📊 من السجل'}</span></div><span className={`badge text-[10px] flex-shrink-0 ${p.safety === 'safe' ? 'badge-success' : p.safety === 'warn' ? 'badge-warning' : 'badge-danger'}`}>{p.safety === 'safe' ? 'آمن' : p.safety === 'warn' ? 'انتباه' : 'خطر'}</span></div>
            <div className="space-y-1.5 text-xs">
              <ForecastRow label="افتتاحي" value={p.opening} color="text-slate-600" />
              {p.planIncome > 0 && <ForecastRow label="📋 دخل مخطط" value={p.planIncome} color="text-emerald-600" prefix="+" />}
              {p.pendingIncome > 0 && <ForecastRow label="⏳ دخل معلق" value={p.pendingIncome} color="text-emerald-500" prefix="+" />}
              {p.planIncome === 0 && p.pendingIncome === 0 && historical.avgIncome > 0 && (<ForecastRow label="📊 دخل متوقع" value={historical.avgIncome} color="text-emerald-600" prefix="+" />)}
              {p.planCashExpenses > 0 && <ForecastRow label="📋 مصروف مخطط" value={p.planCashExpenses} color="text-red-500" prefix="-" />}
              {p.planPayments > 0 && <ForecastRow label="🔒 مدفوعات ثابتة" value={p.planPayments} color="text-red-500" prefix="-" />}
              {p.pendingExpense > 0 && <ForecastRow label="⏳ مصروف معلق" value={p.pendingExpense} color="text-red-400" prefix="-" />}
              <div className="pt-2 mt-2" style={{ borderTop: '1px dashed var(--border-default)' }}>
                <div className="flex justify-between items-center"><span className="font-black text-xs">المتوقع</span><span className={`text-lg font-black ${p.closing >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(p.closing)}</span></div>
                <div className="flex justify-between items-center mt-1"><span className="text-[10px]" style={{ color: 'var(--text-muted)' }}>التوفير الشهري</span><span className={`text-[11px] font-black ${p.savings >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{p.savings >= 0 ? '+' : ''}{fmt(p.savings)}</span></div>
              </div>
            </div>
          </div>
        ))}
      </div>
      {hasDanger && (<div className="card" style={{ borderColor: 'var(--danger)' }}><div className="flex items-start gap-2"><AlertTriangle size={16} className="text-red-500 flex-shrink-0 mt-0.5" /><div className="min-w-0"><h4 className="font-black text-xs text-red-600 mb-1">⚠️ تنبيه مبكر</h4><p className="text-[11px] leading-relaxed" style={{ color: 'var(--text-secondary)' }}>فيه عجز متوقع في: <strong>{dangerMonthsArr.join(' • ')}</strong>.</p></div></div></div>)}
    </div>
  );
});

const CalendarView = memo(({ data, getAgendaItems, transactions, dispatch, saveHistory, addNotification }) => {
  const [filterCat, setFilterCat] = useState('all');
  const items = getAgendaItems();
  const filtered = filterCat === 'all' ? items : items.filter(i => {
    if (filterCat === 'loans') return i.title.includes('قسط') || i.title.includes('عقاري') || i.title.includes('محل هاني');
    if (filterCat === 'cards') return i.title.includes('بطاقة') || i.title.includes('سداد');
    if (filterCat === 'personal') return i.title.includes('محمود') || i.title.includes('سلفة') || i.title.includes('جامعة') || i.title.includes('مدرسة') || i.title.includes('تقويم');
    if (filterCat === 'monthly') return i.desc === '👨‍👩‍👧 مصروف شهري';
    if (filterCat === 'recurring') return i.desc === 'التزام شهري متكرر' || i.desc === '💰 دخل شهري متكرر';
    if (filterCat === 'fees') return i.desc && i.desc.includes('رسم بنكي');
    return true;
  });
  const grouped = filtered.reduce((acc, item) => { const mn = new Date(item.date).toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' }); if (!acc[mn]) acc[mn] = []; acc[mn].push(item); return acc; }, {});
  const urgentCount = filtered.filter(i => { const d = calculateDaysLeft(i.date); return d !== null && d <= 7 && d >= 0; }).length;
  const quickPay = (item) => {
    const d = new Date(item.date); if (isNaN(d)) return;
    const y = d.getFullYear(), m = ALL_MONTHS[d.getMonth()];
    if (data && isMonthClosed(data, y, m)) { addNotification({ type: 'error', title: 'محظور' }); return; }
    saveHistory();
    const isIncome = item.desc && item.desc.includes('دخل');
    const isFee = item.desc && item.desc.includes('رسم بنكي');
    const isMonthly = item.desc === '👨‍👩‍👧 مصروف شهري';
    const tx = { id: getSafeId(), type: isIncome ? 'income' : 'expense', kind: KIND.FINANCIAL, category: isMonthly ? item.title : isIncome ? 'تكييف محمود' : isFee ? 'رسوم بنكية شهرية' : 'الالتزامات البنكية والتمويلية', amount: safeNumber(item.amount), description: item.title, method: 'instapay', date: item.date, month: m, year: y, monthIndex: d.getMonth(), subType: isIncome ? 'deposit' : 'withdrawal', status: 'paid' };
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [tx, ...transactions].sort((a, b) => new Date(b.date) - new Date(a.date)) });
    addNotification({ type: 'success', title: 'تم التسجيل' });
  };
  return (
    <div className="space-y-4 animate-fadeIn pb-20">
      <div className="grid grid-cols-3 gap-2">
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>المواعيد</p><p className="text-lg font-black text-blue-600 mt-1">{filtered.length}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>قريباً</p><p className="text-lg font-black text-red-600 mt-1">{urgentCount}</p></div>
        <div className="card py-3"><p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الإجمالي</p><p className="text-lg font-black text-emerald-600 mt-1">{fmt(filtered.reduce((s, i) => s + safeNumber(i.amount), 0))}</p></div>
      </div>
      <div className="card py-2.5"><div className="flex gap-1.5 overflow-x-auto scroll-hide">
        {[{ id: 'all', label: 'الكل' }, { id: 'monthly', label: 'شهري' }, { id: 'loans', label: 'قروض' }, { id: 'cards', label: 'بطاقات' }, { id: 'personal', label: 'شخصي' }, { id: 'recurring', label: 'متكرر' }, { id: 'fees', label: 'رسوم' }].map(f => (<button key={f.id} onClick={() => setFilterCat(f.id)} className={`badge px-2.5 py-1.5 cursor-pointer whitespace-nowrap text-[10px] ${filterCat === f.id ? 'badge-brand' : 'badge-neutral'}`}>{f.label}</button>))}
      </div></div>
      {Object.keys(grouped).length === 0 ? (
        <div className="card text-center p-12"><Calendar size={32} className="mx-auto mb-2" style={{ color: 'var(--text-muted)' }} /><p className="font-semibold text-xs" style={{ color: 'var(--text-secondary)' }}>لا توجد مواعيد</p></div>
      ) : Object.entries(grouped).map(([month, list]) => (
        <div key={month} className="space-y-2">
          <div className="flex items-center gap-2"><div className="badge badge-brand px-2.5 py-1 text-[10px]">{month}</div><div className="flex-1 h-px" style={{ background: 'var(--border-default)' }}></div><span className="badge badge-neutral text-[10px]">{list.length}</span></div>
          {list.map(item => {
            const d = calculateDaysLeft(item.date);
            const isUrg = d !== null && d <= 3 && d >= 0;
            const isOver = d !== null && d < 0;
            const Icon = item.icon;
            const isIncome = item.desc && item.desc.includes('دخل');
            return (
              <div key={item.id} className="card py-3">
                <div className="flex justify-between items-center gap-2">
                  <div className="flex items-center gap-2 flex-1 min-w-0">
                    <div className={`p-1.5 rounded-lg flex-shrink-0 ${isIncome ? 'bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600' : 'bg-red-50 dark:bg-red-950/30 text-red-500'}`}><Icon size={14} /></div>
                    <div className="min-w-0"><p className="font-bold text-xs truncate">{item.title}</p><div className="flex items-center gap-1.5 mt-0.5 flex-wrap"><span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{item.date}</span>{d !== null && <span className={`badge text-[9px] ${isOver ? 'badge-danger' : isUrg ? 'badge-warning' : 'badge-success'}`}>{isOver ? `متأخر ${Math.abs(d)}` : d === 0 ? 'اليوم!' : `${d} ي`}</span>}</div></div>
                  </div>
                  <div className="flex items-center gap-1 flex-shrink-0"><p className={`font-black text-xs ${isIncome ? 'text-emerald-600' : ''}`}>{fmt(item.amount)}</p><button onClick={() => quickPay(item)} title="تسجيل فوري" className="btn btn-ghost p-1 text-emerald-500"><CheckCircle2 size={12} /></button></div>
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
});

const PinChangeModal = ({ onClose, addNotification }) => {
  const [current, setCurrent] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (!/^\d{4}$/.test(next)) { addNotification({ type: 'error', title: 'الرمز الجديد لازم 4 أرقام' }); return; }
    if (next !== confirm) { addNotification({ type: 'error', title: 'الرمز الجديد مش متطابق' }); return; }
    setBusy(true);
    const ok = await verifyPin(current);
    if (!ok) { addNotification({ type: 'error', title: 'الرمز الحالي غير صحيح' }); setBusy(false); return; }
    await savePinHash(next);
    addNotification({ type: 'success', title: 'تم تغيير الرمز بنجاح' });
    setBusy(false);
    onClose();
  };
  return (
    <Modal isOpen={true} onClose={onClose} title="تغيير رمز الدخول" icon="🔐">
      <div className="space-y-3">
        <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الرمز الحالي</label><input type="password" inputMode="numeric" maxLength={4} className="input-field text-center text-lg font-black tracking-widest" value={current} onChange={e => setCurrent(e.target.value.replace(/\D/g, ''))} /></div>
        <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الرمز الجديد</label><input type="password" inputMode="numeric" maxLength={4} className="input-field text-center text-lg font-black tracking-widest" value={next} onChange={e => setNext(e.target.value.replace(/\D/g, ''))} /></div>
        <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>تأكيد الرمز الجديد</label><input type="password" inputMode="numeric" maxLength={4} className="input-field text-center text-lg font-black tracking-widest" value={confirm} onChange={e => setConfirm(e.target.value.replace(/\D/g, ''))} /></div>

const SmsParserModal = memo(({ isOpen, onClose, dispatch, addNotification, saveHistory, data }) => {
  const [rawText, setRawText] = useState('');
  const [parsed, setParsed] = useState(null);
  const [category, setCategory] = useState('');
  const [method, setMethod] = useState('cash');
  useEffect(() => { if (!isOpen) { setRawText(''); setParsed(null); setCategory(''); setMethod('cash'); } }, [isOpen]);
  const handlePaste = async () => { try { if (navigator.clipboard && navigator.clipboard.readText) { const txt = await navigator.clipboard.readText(); if (txt && txt.trim()) { setRawText(txt); addNotification({ type: 'success', title: 'تم اللصق', duration: 2000 }); return; } } addNotification({ type: 'info', title: 'الصق الرسالة يدوياً في الصندوق' }); } catch (e) { addNotification({ type: 'info', title: 'الصق الرسالة يدوياً في الصندوق' }); } };
  const handleAnalyze = () => { if (!rawText.trim()) { addNotification({ type: 'error', title: 'الصق رسالة البنك أولاً' }); return; } const res = parseBankSms(rawText); setParsed(res); if (res.method) setMethod(res.method); if (res.ok) { addNotification({ type: 'success', title: `تم التحليل: ${fmt(res.amount)} ج.م`, message: `${res.type === 'income' ? 'دخل' : 'مصروف'} • ${res.bank || 'بنك غير معروف'}${res.last4 ? ' • ****' + res.last4 : ''}`, duration: 4000 }); } else { addNotification({ type: 'warning', title: 'تحليل جزئي', message: res.notes.join(' • ') }); } };
  const handleSave = () => {
    if (!parsed || !parsed.ok) { addNotification({ type: 'error', title: 'لا يوجد مبلغ صالح' }); return; }
    if (!category) { addNotification({ type: 'error', title: 'اختر الفئة' }); return; }
    const d = new Date(parsed.date);
    const year = d.getFullYear();
    const month = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, year, month)) { addNotification({ type: 'error', title: `شهر ${month} ${year} مغلق`, message: 'افتح الشهر أو غيّر التاريخ' }); return; }
    saveHistory();
    const newTx = { id: getSafeId(), type: parsed.type, subType: parsed.subType, kind: KIND.OPERATIONAL, category, amount: parsed.amount, description: parsed.description || 'SMS import', method, date: parsed.date, month, year, monthIndex: d.getMonth(), status: 'pending', source: 'sms', smsRawText: parsed.rawText, smsBank: parsed.bank, linkedCardId: parsed.linkedCardId || undefined, receipts: [] };
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [newTx, ...(data.transactions || [])].sort((a, b) => new Date(b.date) - new Date(a.date)) });
    addNotification({ type: 'success', title: 'تم الحفظ كمعلق', message: 'راجعها واعتمدها من صفحة المعاملات', duration: 5000 });
    onClose();
  };
  if (!isOpen) return null;
  return (
    <Modal isOpen={true} onClose={onClose} title="تحليل رسالة بنك" icon="📱" size="lg">
      <div className="space-y-3">
        <div>
          <div className="flex justify-between items-center mb-1.5"><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الصق رسالة البنك هنا</label><button type="button" onClick={handlePaste} className="text-[11px] font-black text-blue-600 flex items-center gap-1">📋 لصق تلقائي</button></div>
          <textarea className="input-field text-xs leading-relaxed font-semibold" rows={6} placeholder="مثال: CIB: Purchase of EGP 1500.00 on card ending 1016 at CARREFOUR on 17/09/2026" value={rawText} onChange={e => setRawText(e.target.value)} dir="auto" />
        </div>
        <button type="button" onClick={handleAnalyze} disabled={!rawText.trim()} className="btn btn-primary w-full py-2.5 text-sm"><Sparkles size={14} /> حلّل الرسالة</button>
        {parsed && (
          <div className="space-y-3 pt-3 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            <div className={`p-3 rounded-lg ${parsed.ok ? 'bg-emerald-50 dark:bg-emerald-950/30' : 'bg-amber-50 dark:bg-amber-950/30'}`}>
              <div className="flex items-center gap-2 mb-2">{parsed.ok ? <CheckCircle2 size={16} className="text-emerald-600" /> : <AlertTriangle size={16} className="text-amber-600" />}<span className={`font-black text-sm ${parsed.ok ? 'text-emerald-700 dark:text-emerald-400' : 'text-amber-700 dark:text-amber-400'}`}>{parsed.ok ? 'تم استخراج البيانات' : 'استخراج جزئي'}</span></div>
              <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 text-xs">
                <div><span style={{ color: 'var(--text-muted)' }}>المبلغ:</span> <strong>{parsed.amount ? fmt(parsed.amount) + ' ج.م' : '—'}</strong></div>
                <div><span style={{ color: 'var(--text-muted)' }}>النوع:</span> <strong>{parsed.type === 'income' ? 'دخل 💰' : 'مصروف 💸'}</strong></div>
                <div><span style={{ color: 'var(--text-muted)' }}>البنك:</span> <strong>{parsed.bank || '—'}</strong></div>
                <div><span style={{ color: 'var(--text-muted)' }}>البطاقة:</span> <strong>{parsed.last4 ? '****' + parsed.last4 : '—'}</strong></div>
                <div><span style={{ color: 'var(--text-muted)' }}>التاريخ:</span> <strong>{parsed.date}</strong></div>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الفئة *</label><select className="input-field text-xs py-2" value={category} onChange={e => setCategory(e.target.value)}><option value="">اختر...</option>{Object.entries(CATEGORY_GROUPS[parsed.type]).map(([g, items]) => (<optgroup key={g} label={g}>{items.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>))}</select></div>
              <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>طريقة الدفع</label><select className="input-field text-xs py-2" value={method} onChange={e => setMethod(e.target.value)}>{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select></div>
            </div>
            <button type="button" onClick={handleSave} disabled={!parsed.ok || !category} className="btn btn-primary w-full py-2.5 text-sm"><Save size={14} /> حفظ كمعلق</button>
          </div>
        )}
      </div>
    </Modal>
  );
});

const SettingsView = memo(({ data, accountsData, cards, budgets, dispatch, saveHistory, addNotification }) => {
  const [localAccounts, setLocalAccounts] = useState(() => JSON.parse(JSON.stringify(accountsData)));
  const [localCards, setLocalCards] = useState(() => cards.map(c => ({ ...c })));
  const [activeSection, setActiveSection] = useState('accounts');
  const [hasChanges, setHasChanges] = useState(false);
  const [driveBusy, setDriveBusy] = useState(false);
  const [driveStatus, setDriveStatus] = useState('');
  const [folderIdInput, setFolderIdInput] = useState(() => localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID);
  useEffect(() => { setLocalAccounts(JSON.parse(JSON.stringify(accountsData))); setHasChanges(false); }, [accountsData]);
  useEffect(() => { setLocalCards(cards.map(c => ({ ...c }))); setHasChanges(false); }, [cards]);
  const handleAccountChange = (key, field, value) => { setLocalAccounts(prev => ({ ...prev, [key]: { ...prev[key], [field]: value } })); setHasChanges(true); };
  const handleCardChange = (id, field, value) => { setLocalCards(prev => prev.map(c => { if (c.id !== id) return c; const u = { ...c, [field]: value }; if (field === 'limit') u.availableBalance = Math.max(0, safeNumber(value) - safeNumber(u.openingDebt)); return u; })); setHasChanges(true); };
  const handleSave = () => {
    saveHistory();
    const cleaned = {};
    const today = getLocalISODate();
    ACCOUNT_KEYS.forEach(k => { const oldBal = safeNumber(accountsData[k]?.balance); const newBal = parseNumberInput(localAccounts[k]?.balance); cleaned[k] = { ...localAccounts[k], balance: newBal, lastUpdated: (oldBal !== newBal) ? today : (localAccounts[k]?.lastUpdated || today) }; });
    dispatch({ type: 'UPDATE_ACCOUNTS', payload: cleaned });
    dispatch({ type: 'UPDATE_CARDS', payload: localCards.map(c => ({ ...c, limit: safeNumber(c.limit), openingDebt: safeNumber(c.openingDebt), cashbackRate: safeNumber(c.cashbackRate, 1) })) });
    addNotification({ type: 'success', title: 'تم الحفظ' });
    setHasChanges(false);
  };
  const handleDriveConnect = async () => { setDriveBusy(true); setDriveStatus('جاري الاتصال...'); try { await ensureDriveToken(); setDriveStatus('متصل'); addNotification({ type: 'success', title: 'Drive متصل' }); } catch (e) { setDriveStatus('فشل: ' + e.message); } finally { setDriveBusy(false); } };
  const handleDriveBackupNow = async () => {
    setDriveBusy(true); setDriveStatus('جاري الرفع...');
    try { const payload = { data, budgets, exportedAt: new Date().toISOString(), version: 'V76' }; const result = await uploadBackupToDrive(payload); localStorage.setItem(AUTO_BACKUP_LS_KEY, String(Date.now())); const folderId = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID; setDriveStatus(`✅ تم الرفع: ${result.name}`); addNotification({ type: 'success', title: 'تم رفع النسخة', message: 'في مجلد Finance Backups', duration: 6000 }); if (folderId) { setTimeout(() => { if (window.confirm('تم الرفع! تفتح المجلد في Drive للتأكد؟')) window.open(`https://drive.google.com/drive/folders/${folderId}`, '_blank'); }, 600); } }
    catch (e) { setDriveStatus('❌ فشل: ' + e.message); addNotification({ type: 'error', title: 'فشل الرفع', message: e.message }); }
    finally { setDriveBusy(false); }
  };
  const handleDriveRestore = async () => {
    setDriveBusy(true); setDriveStatus('جاري الجلب...');
    try {
      const files = await listDriveBackups();
      if (files.length === 0) { setDriveStatus('لا توجد نسخ'); setDriveBusy(false); return; }
      const labels = files.slice(0, 10).map((f, i) => `${i + 1}) ${f.name}`).join('\n');
      const choice = await showInputModal({ title: 'اختر رقم النسخة', icon: '☁️', message: labels, inputValue: '1', numeric: true, confirmText: 'استعادة' });
      if (!choice) { setDriveBusy(false); setDriveStatus(''); return; }
      const idx = Math.max(1, Math.min(files.length, parseInt(choice, 10) || 1)) - 1;
      const file = files[idx];
      const payload = await downloadBackupFromDrive(file.id);
      if (!payload?.data) throw new Error('الملف لا يحتوي بيانات');
      dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'استعادة نسخة', message: 'سيتم استبدال بياناتك', onConfirm: () => { saveHistory(); dispatch({ type: 'SET_DATA', payload: migrateData(payload.data) }); if (payload.budgets) dispatch({ type: 'SET_BUDGETS', payload: payload.budgets }); addNotification({ type: 'success', title: 'تمت الاستعادة' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
    } catch (e) { setDriveStatus('فشل: ' + e.message); }
    finally { setDriveBusy(false); }
  };
  const handleDriveReset = () => {
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'إعادة تعيين Drive', message: 'سيتم مسح Folder ID المحفوظ والصلاحيات وسيُعاد الاتصال من جديد.', onConfirm: () => { localStorage.removeItem(DRIVE_FOLDER_ID_LS_KEY); localStorage.removeItem(AUTO_BACKUP_LS_KEY); try { _driveAccessToken = null; _driveTokenExpiry = 0; _driveTokenClient = null; } catch(e) {} setFolderIdInput(DRIVE_DEFAULT_FOLDER_ID); setDriveStatus('تمت إعادة التعيين — اضغط "اتصال"'); addNotification({ type: 'success', title: 'تمت إعادة تعيين Drive' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  };
  const handleFreshStart = () => {
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'بداية جديدة', message: 'سيتم مسح كل المعاملات', onConfirm: () => {
      saveHistory();
      const zeroed = {};
      ACCOUNT_KEYS.forEach(k => { zeroed[k] = { ...(accountsData[k] || {}), balance: 0, lastUpdated: getLocalISODate() }; });
      dispatch({ type: 'SET_DATA', payload: { ...data, transactions: [], closedMonths: [], monthlySnapshots: {}, accountsData: zeroed, cards: (data.cards || []).map(c => ({ ...c, openingDebt: 0, availableBalance: safeNumber(c.limit) })), materializedRecurring: {}, notifiedItems: {}, custodyEntries: [], cashbackTrackers: [] } });
      addNotification({ type: 'success', title: 'تم التصفير' });
      dispatch({ type: 'HIDE_CONFIRM' });
    }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  };
  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card flex justify-between items-center flex-wrap gap-3">
        <div className="flex items-center gap-2"><div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><Sliders size={16} /></div><h2 className="text-base font-black">الإعدادات</h2></div>
        {hasChanges && <button onClick={handleSave} className="btn btn-primary text-xs"><Save size={14} /> حفظ</button>}
      </div>
      <div className="card p-1 flex gap-1.5">
        {[{ id: 'accounts', label: 'الحسابات', icon: Wallet }, { id: 'cards', label: 'البطاقات', icon: CreditCard }].map(s => { const Icon = s.icon; return <button key={s.id} onClick={() => setActiveSection(s.id)} className={`flex-1 py-2.5 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 transition-all ${activeSection === s.id ? 'text-white shadow-sm' : ''}`} style={activeSection === s.id ? { background: 'var(--brand)' } : { color: 'var(--text-muted)' }}><Icon size={14} /> {s.label}</button>; })}
      </div>
      {activeSection === 'accounts' && (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">

                  <div><label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>مديونية أساسية</label><input type="text" inputMode="decimal" value={card.openingDebt} onChange={e => handleCardChange(card.id, 'openingDebt', e.target.value)} className="input-field font-black text-red-600 text-center text-xs py-2" /></div>

      <div className="card" style={{ borderColor: 'var(--warning)' }}>
        <div className="flex items-center gap-2 mb-3"><ShieldAlert size={16} className="text-amber-500" /><h3 className="font-black text-sm">إجراءات احتياطية</h3></div>

      </div>
    </div>
  );

    case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
    case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
    case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };

    case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
    case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
    case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
    case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
    case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
    case 'SET_AI_MODAL_OPEN': return { ...state, isAiModalOpen: action.payload };
    case 'SET_AI_RESPONSE': return { ...state, aiResponse: action.payload };
    case 'SET_AI_LOADING': return { ...state, isAiLoading: action.payload };
    case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
    case 'SET_VIEWING_RECEIPT': return { ...state, viewingReceipt: action.payload };
    case 'SET_PIN_CHANGE_OPEN': return { ...state, isPinChangeOpen: action.payload };
    case 'SET_SMS_MODAL_OPEN': return { ...state, isSmsModalOpen: action.payload };
    case 'SET_PENDING_CLOSE_MODAL': return { ...state, pendingCloseModal: action.payload };
    case 'ADD_NOTIFICATION': return { ...state, notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }] };
    case 'REMOVE_NOTIFICATION': return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
    case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
    case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
    case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
    case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
    case 'UPDATE_CASHBACK_TRACKERS': return { ...state, data: { ...state.data, cashbackTrackers: action.payload } };
    case 'UPDATE_ACCOUNTS': { const oldA = state.data.accountsData || {}; let changed = false; ACCOUNT_KEYS.forEach(k => { if (safeNumber(oldA[k]?.balance) !== safeNumber(action.payload[k]?.balance)) changed = true; }); return { ...state, data: { ...state.data, accountsData: action.payload, ...(changed ? { monthlySnapshots: {} } : {}) } }; }
    case 'UPDATE_MONTHLY_PLANS': return { ...state, data: { ...state.data, monthlyPlans: action.payload } };
    case 'ADD_TO_HISTORY': { const limited = [...state.history].slice(-19); return { ...state, history: [...limited, action.payload], future: [] }; }
    case 'UNDO': { if (state.history.length === 0) return state; const prev = state.history[state.history.length - 1]; return { ...state, data: prev.data || prev, budgets: prev.budgets !== undefined ? prev.budgets : state.budgets, history: state.history.slice(0, -1), future: [{ data: state.data, budgets: state.budgets }, ...state.future] }; }
    case 'TOGGLE_LEDGER': return { ...state, expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] } };
    case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };
    case 'SET_STATUS_FILTER': return { ...state, statusFilter: action.payload };
    case 'SHOW_CONFIRM': return { ...state, confirmDialog: { isOpen: true, title: action.title, message: action.message, onConfirm: action.onConfirm, onCancel: action.onCancel, danger: action.danger || false } };
    case 'HIDE_CONFIRM': return { ...state, confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false } };
    case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
    case 'SET_QUICK_TRANSFER_DATA': return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
    case 'SET_VIEWING_CARD_STATEMENT': return { ...state, viewingCardStatement: action.payload };
    case 'CLOSE_MONTH': { const { year, month } = action.payload; const monthKey = makeMonthKey(year, month); const monthEnd = new Date(year, getMonthIndex(month) + 1, 0, 23, 59, 59); const snap = {}; ACCOUNT_KEYS.forEach(k => { snap[k] = computeBalance(state.data, k, monthEnd); }); return { ...state, data: { ...state.data, closedMonths: [...(state.data.closedMonths || []), monthKey], monthlySnapshots: { ...(state.data.monthlySnapshots || {}), [monthKey]: snap } } }; }
    case 'CLOSE_MONTH_AFTER_RESOLVE': {
      const { year, month, resolveAction, pendingIds } = action.payload;
      const monthKey = makeMonthKey(year, month);
      let newTxs = state.data.transactions || [];
      if (resolveAction === 'approve') { const ids = new Set(pendingIds); newTxs = newTxs.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t); }
      else if (resolveAction === 'delete') { const ids = new Set(pendingIds); newTxs = newTxs.filter(t => !ids.has(t.id)); }
      else if (resolveAction === 'carry') { const idx = getMonthIndex(month); const nextMonth = idx === 11 ? ALL_MONTHS[0] : ALL_MONTHS[idx + 1]; const nextYear = idx === 11 ? year + 1 : year; const nextMonthIdx = getMonthIndex(nextMonth); const maxDay = new Date(nextYear, nextMonthIdx + 1, 0).getDate(); const ids = new Set(pendingIds); newTxs = newTxs.map(t => { if (!ids.has(t.id)) return t; const oldDay = new Date(t.date).getDate(); const newDay = Math.min(Math.max(1, oldDay), maxDay); const newDate = `${nextYear}-${String(nextMonthIdx + 1).padStart(2, '0')}-${String(newDay).padStart(2, '0')}`; return { ...t, date: newDate, month: nextMonth, year: nextYear, monthIndex: nextMonthIdx, source: t.source || 'carryover', carryoverFrom: `${month} ${year}` }; }); }
      const newData = { ...state.data, transactions: newTxs };
      const monthEnd = new Date(year, getMonthIndex(month) + 1, 0, 23, 59, 59);
      const snap = {};
      ACCOUNT_KEYS.forEach(k => { snap[k] = computeBalance(newData, k, monthEnd); });
      return { ...state, data: { ...newData, closedMonths: [...(newData.closedMonths || []), monthKey], monthlySnapshots: { ...(newData.monthlySnapshots || {}), [monthKey]: snap } }, pendingCloseModal: { isOpen: false, pending: [], total: 0, month: '', year: 0 } };
    }
    case 'OPEN_MONTH': { const monthKey = action.payload; const parsedKey = parseMonthKey(monthKey); if (!parsedKey) return { ...state, data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey) } }; const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots, parsedKey.year, parsedKey.month); return { ...state, data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey), monthlySnapshots: snapshots } }; }
    case 'TOGGLE_WALLET_VISIBILITY': return { ...state, walletVisibility: { ...state.walletVisibility, [action.payload]: !state.walletVisibility[action.payload] } };
    case 'SET_IS_PROCESSING': return { ...state, isProcessing: action.payload };
    default: return state;
  }
}

  const handleUpdateCard = useCallback((e) => { e.preventDefault(); saveHistory(); dispatch({ type: 'UPDATE_CARDS', payload: cards.map(c => c.id === editingCard.id ? { ...editingCard, limit: safeNumber(editingCard.limit), availableBalance: Math.max(0, safeNumber(editingCard.limit) - safeNumber(editingCard.openingDebt)), openingDebt: safeNumber(editingCard.openingDebt), cashbackRate: safeNumber(editingCard.cashbackRate, 1) } : c) }); dispatch({ type: 'SET_EDITING_CARD', payload: null }); addNotification({ type: 'success', title: 'تم التحديث' }); }, [cards, editingCard, saveHistory, addNotification]);
  const handleSaveBudget = useCallback(() => { saveHistory(); const nb = { ...budgets, [editingBudgetCategory]: parseNumberInput(budgetAmount) }; dispatch({ type: 'SET_BUDGETS', payload: nb }); dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null }); dispatch({ type: 'SET_BUDGET_AMOUNT', payload: '' }); addNotification({ type: 'success', title: 'تم الحفظ' }); }, [budgets, editingBudgetCategory, budgetAmount, saveHistory, addNotification]);
  const handleSaveRecurring = useCallback((e) => {

                <div className="grid grid-cols-3 gap-2">
                  <div><label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>المبلغ</label><input type="text" inputMode="decimal" required className={`input-field text-sm font-black text-blue-600 text-center py-2.5 ${formErrors.amount ? 'error' : ''}`} value={formData.amount} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, amount: e.target.value } })} /></div>
                  <div><label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>التاريخ</label><input type="date" required className={`input-field text-[11px] font-bold py-2.5 ${formErrors.date ? 'error' : ''}`} value={formData.date} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, date: e.target.value } })} /></div>
                  <div><label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الدفع</label><select className="input-field text-[11px] font-bold py-2.5" value={formData.method} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, method: e.target.value } })}>{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select></div>
                </div>
                <div><label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الوصف</label><input type="text" className={`input-field font-bold text-sm py-2.5 ${formErrors.description ? 'error' : ''}`} value={formData.description || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: e.target.value } })} placeholder="تفاصيل..." /></div>
                <button type="submit" className="btn btn-primary w-full py-2.5 text-sm" disabled={isProcessing}>{isProcessing ? 'جاري الحفظ...' : <React.Fragment><Save size={14} /> {formData.status === 'paid' ? 'حفظ واعتماد' : 'حفظ كمعلق'}</React.Fragment>}</button>
              </form>
            </div>
          </div>
        )}

        {editingCard && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="text-sm font-black">تعديل البطاقة</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_CARD', payload: null })} className="btn btn-ghost p-1.5"><X size={16} /></button></div>
              <form onSubmit={handleUpdateCard} className="p-4 space-y-2.5">
                <div className="grid grid-cols-2 gap-2.5"><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الاسم</label><input type="text" required className="input-field text-sm" value={editingCard.name} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, name: e.target.value } })} /></div><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>البنك</label><input type="text" required className="input-field text-sm" value={editingCard.bank} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, bank: e.target.value } })} /></div></div>
                <div className="grid grid-cols-3 gap-2.5"><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الحد</label><input type="text" inputMode="decimal" className="input-field text-blue-600 font-bold text-sm" value={editingCard.limit} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, limit: e.target.value } })} /></div><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>مديونية أساسية</label><input type="text" inputMode="decimal" className="input-field text-red-500 font-bold text-sm" value={editingCard.openingDebt} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, openingDebt: e.target.value } })} /></div><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>كاش باك %</label><input type="text" inputMode="decimal" className="input-field text-amber-600 font-black text-sm text-center" value={editingCard.cashbackRate || 1} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, cashbackRate: e.target.value } })} /></div></div>
                <button type="submit" className="btn btn-primary w-full py-2.5 text-sm">حفظ</button>
              </form>
            </div>
          </div>
        )}

        {editingLoan && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="text-sm font-black">تعديل الالتزام</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: null })} className="btn btn-ghost p-1.5"><X size={16} /></button></div>
              <form onSubmit={handleUpdateLoan} className="p-4 space-y-2.5">
                <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الاسم</label><input type="text" className="input-field text-sm" value={editingLoan.name} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, name: e.target.value } })} /></div>
                <div className="grid grid-cols-2 gap-2.5"><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>المبلغ</label><input type="text" inputMode="decimal" className="input-field text-sm" value={editingLoan.totalAmount} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, totalAmount: e.target.value } })} /></div><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>القسط</label><input type="text" inputMode="decimal" className="input-field text-sm" value={editingLoan.monthlyInstallment} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, monthlyInstallment: e.target.value } })} /></div></div>
                {editingLoan.isReceivable && (<div className="grid grid-cols-2 gap-2.5"><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>إجمالي الأقساط</label><input type="number" min="0" className="input-field text-sm text-center" value={editingLoan.totalInstallments ?? ''} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, totalInstallments: e.target.value } })} /></div><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>المدفوعة</label><input type="number" min="0" className="input-field text-sm text-center" value={editingLoan.paidInstallments ?? ''} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, paidInstallments: e.target.value } })} /></div></div>)}
                <button type="submit" className="btn btn-primary w-full py-2.5 text-sm">حفظ</button>
              </form>
            </div>
          </div>
        )}

        {editingBudgetCategory && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-sm rounded-2xl shadow-2xl p-5" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <h3 className="text-sm font-black mb-3">ميزانية: {editingBudgetCategory}</h3>
              <input type="text" inputMode="decimal" className="input-field text-base font-black text-blue-600 mb-3" value={budgetAmount} onChange={e => dispatch({ type: 'SET_BUDGET_AMOUNT', payload: e.target.value })} />
              <div className="flex gap-2"><button type="button" onClick={handleSaveBudget} className="btn btn-primary flex-1 text-sm">حفظ</button><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null })} className="btn btn-secondary flex-1 text-sm">إلغاء</button></div>
            </div>
          </div>
        )}

        {isQuickTransferModalOpen && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
              <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="text-sm font-black flex items-center gap-2"><ArrowRight size={16} className="text-blue-500" /> تحويل / مصروف شهري</h3><button type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false })} className="btn btn-ghost p-1.5"><X size={16} /></button></div>
              <form onSubmit={handleQuickTransfer} className="p-4 space-y-3">
                <div><label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المستفيد *</label><div className="grid grid-cols-2 gap-1.5">{BENEFICIARIES.map(ben => (<button key={ben.id} type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { beneficiaryId: ben.id, amount: String(ben.defaultAmount) } })} className={`p-2.5 rounded-lg text-[11px] font-bold transition-all border-2 ${quickTransferData.beneficiaryId === ben.id ? 'border-blue-500 bg-blue-50 dark:bg-blue-950/30 text-blue-700 dark:text-blue-400' : 'border-[color:var(--border-default)]'}`}><div className="flex flex-col items-center gap-0.5"><span>{ben.label}</span><span className="text-[9px] opacity-70">{fmt(ben.defaultAmount)} ج.م</span></div></button>))}</div></div>
                <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>من حساب</label><select className="input-field text-sm py-2.5" value={quickTransferData.from} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: e.target.value } })}>{PAYMENT_METHODS.filter(m => m.group === 'account').map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select></div>
                <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>المبلغ</label><input type="text" inputMode="decimal" className="input-field text-base font-black text-blue-600 text-center py-2.5" value={quickTransferData.amount} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: e.target.value } })} placeholder="0.00" /></div>
                <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>التاريخ</label><input type="date" className="input-field text-sm font-bold py-2.5" value={quickTransferData.date || getLocalISODate()} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { date: e.target.value } })} /></div>
                <button type="submit" className="btn btn-primary w-full py-2.5 text-sm" disabled={isProcessing}>{isProcessing ? 'جاري التنفيذ...' : 'تسجيل المصروف الشهري'}</button>
              </form>
            </div>
          </div>
        )}

        {isRecurringModalOpen && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)', maxHeight: 'calc(100dvh - 24px)', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
              <div className="p-4 flex justify-between items-center flex-shrink-0" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-sm font-black flex items-center gap-2"><Repeat size={14} className="text-blue-500" /> {recurringFormData.id ? 'تعديل الالتزام المتكرر' : 'التزام متكرر جديد'}</h3>
                <button type="button" onClick={() => { dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false }); dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { id: null, title: '', amount: '', day: 1, category: 'أخرى', type: 'expense', startMonth: null, endMonth: null, active: true, linkedLoanSystemId: null, linkedCardId: null } }); }} className="btn btn-ghost p-1.5"><X size={16} /></button>
              </div>
              <form onSubmit={handleSaveRecurring} className="p-4 space-y-3 overflow-y-auto scroll-hide">
                <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>العنوان *</label><input type="text" required className="input-field text-sm" placeholder="مثال: قسط شقة العبور" value={recurringFormData.title} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, title: e.target.value } })} /></div>
                <div className="grid grid-cols-2 gap-2.5">
                  <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>المبلغ *</label><input type="text" inputMode="decimal" required className="input-field font-bold text-blue-600 text-sm" value={recurringFormData.amount} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, amount: e.target.value } })} /></div>
                  <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>يوم الشهر *</label><input type="number" required min="1" max="31" className="input-field text-center text-sm" value={recurringFormData.day} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, day: e.target.value } })} /></div>
                </div>
                <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>النوع *</label><select className="input-field text-sm" value={recurringFormData.type} onChange={e => { const t = e.target.value; dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, type: t, category: CATEGORIES[t][0] } }); }}><option value="expense">مصروف 💸</option><option value="income">دخل 💰</option></select></div>
                <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الفئة *</label><select className="input-field text-sm" value={recurringFormData.category} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, category: e.target.value } })}>{CATEGORIES[recurringFormData.type].map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                <div className="p-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className="flex items-center gap-1.5 mb-2"><Calendar size={12} className="text-blue-500" /><p className="text-[11px] font-black">النطاق الزمني للتكرار</p></div>
                  <div className="grid grid-cols-2 gap-2.5">
                    <div><label className="text-[10px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>يبدأ من شهر</label><input type="month" className="input-field text-[11px] font-bold py-2" value={recurringFormData.startMonth || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, startMonth: e.target.value || null } })} /></div>
                    <div><label className="text-[10px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>ينتهي عند (اختياري)</label><input type="month" className="input-field text-[11px] font-bold py-2" value={recurringFormData.endMonth || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, endMonth: e.target.value || null } })} /></div>
                  </div>
                  <p className="text-[9px] leading-relaxed mt-2" style={{ color: 'var(--text-muted)' }}>💡 اتركهما فارغين لو البند مفتوح بدون نهاية. اختر شهر البداية لبدء التوليد تلقائياً، وشهر النهاية لإيقافه.</p>
                </div>
                <label className="flex items-center gap-3 p-2.5 rounded-lg cursor-pointer border" style={{ borderColor: 'var(--border-default)', background: recurringFormData.active !== false ? 'rgba(5, 150, 105, 0.06)' : 'rgba(220, 38, 38, 0.06)' }}>
                  <input type="checkbox" checked={recurringFormData.active !== false} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, active: e.target.checked } })} className="w-4 h-4 accent-emerald-600" />
                  <span className="text-xs font-bold">{recurringFormData.active !== false ? '✅ مفعّل — يتم التوليد شهرياً' : '⏸ موقوف مؤقتاً'}</span>
                </label>
                <div className="flex gap-2 pt-1">
                  {recurringFormData.id && (<button type="button" onClick={() => { deleteRecurring(recurringFormData.id); dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false }); }} className="btn btn-secondary text-xs text-red-600 px-3"><Trash2 size={12} /> حذف</button>)}
                  <button type="submit" className="btn btn-primary flex-1 py-2.5 text-sm"><Save size={14} /> {recurringFormData.id ? 'حفظ التعديلات' : 'إضافة'}</button>
                </div>
              </form>
            </div>
          </div>
        )}
      </div>
    </PromiseModalProvider>
  );
}

const rootElement = document.getElementById('root');
if (rootElement) {
  setTimeout(() => { const l = document.getElementById('loading'); if (l) l.style.display = 'none'; }, 1000);
  createRoot(rootElement).render(<ErrorBoundary><App /></ErrorBoundary>);
}
</script>
</body>
</html>
