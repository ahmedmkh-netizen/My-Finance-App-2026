const VALIDATION = {
  AMOUNT: { min: 0.01, max: 10000000, label: "المبلغ" },
  TEXT: { min: 1, max: 500, label: "النص" },
};

const validateAmount = (raw, opts = {}) => {
  const cfg = { ...VALIDATION.AMOUNT, ...opts };
  const cleaned = toEnglishDigits(String(raw ?? "")).replace(/[^\d.\-]/g, "");
  const n = parseFloat(cleaned);
  if (isNaN(n) || !isFinite(n))
    return { valid: false, error: "اكتب رقم صحيح", value: 0 };
  if (n < cfg.min)
    return { valid: false, error: `الحد الأدنى ${fmt(cfg.min)} ج.م`, value: 0 };
  if (n > cfg.max)
    return { valid: false, error: `الحد الأقصى ${fmt(cfg.max)} ج.م`, value: 0 };
  return { valid: true, value: n };
};

const validateText = (raw, opts = {}) => {
  const cfg = { ...VALIDATION.TEXT, ...opts };
  const s = String(raw || "").trim();
  if (s.length < cfg.min) return { valid: false, error: `${cfg.label} مطلوب` };
  if (s.length > cfg.max) return { valid: false, error: `${cfg.label} طويل جداً` };
  return { valid: true, value: s };
};

const validateDate = (raw) => {
  if (!raw) return { valid: false, error: "التاريخ مطلوب" };
  const d = parseISODate(raw);
  if (!d) return { valid: false, error: "تاريخ غير صالح" };
  const year = d.getFullYear();
  if (year < 2020 || year > 2100)
    return { valid: false, error: "السنة خارج النطاق" };
  return { valid: true, value: d };
};

/* ═══════════════════════════════════════════════════════════════════
   5) PIN SECURITY
   ═══════════════════════════════════════════════════════════════════ */
const hashPin = async (pin) => {
  if (!crypto?.subtle?.importKey || !crypto?.subtle?.deriveBits)
    throw new Error("هذا المتصفح لا يدعم التشفير الآمن");
  try {
    const encoder = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      encoder.encode(String(pin)),
      "PBKDF2",
      false,
      ["deriveBits"],
    );
    const salt = encoder.encode("fintracker_salt_v89_2026");
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
      keyMaterial,
      256,
    );
    return (
      "pbkdf2_" +
      Array.from(new Uint8Array(bits))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("")
    );
  } catch (e) {
    console.error("hashPin failed:", e);
    throw new Error("فشل تشفير الرمز");
  }
};

const getStoredPinHash = () => localStorage.getItem(PIN_HASH_KEY);
const savePinHash = async (pin) => {
  const hash = await hashPin(pin);
  localStorage.setItem(PIN_HASH_KEY, hash);
};

const verifyPin = async (pin) => {
  const stored = getStoredPinHash();
  if (!stored) {
    if (pin === DEFAULT_PIN) {
      try { await savePinHash(pin); } catch (e) {}
      return true;
    }
    return false;
  }
  if (!stored.startsWith("pbkdf2_")) return false;
  try {
    const current = await hashPin(pin);
    return current === stored;
  } catch {
    return false;
  }
};

const buildPinSessionToken = async (pin) => {
  try {
    const encoder = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      encoder.encode(pin + "|" + getLocalISODate()),
      "PBKDF2",
      false,
      ["deriveBits"],
    );
    const salt = encoder.encode("session_salt_v89");
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt, iterations: 10000, hash: "SHA-256" },
      keyMaterial,
      128,
    );
    return (
      "sess_" +
      Array.from(new Uint8Array(bits))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("")
    );
  } catch {
    return null;
  }
};

const savePinSession = async (pin) => {
  const token = await buildPinSessionToken(pin);
  if (token) sessionStorage.setItem(PIN_SESSION_KEY, token);
};

const verifyPinSession = async (pin) => {
  const stored = sessionStorage.getItem(PIN_SESSION_KEY);
  if (!stored) return false;
  const expected = await buildPinSessionToken(pin);
  return stored === expected;
};

/* ═══════════════════════════════════════════════════════════════════
   6) CORE CLASSIFIERS
   ═══════════════════════════════════════════════════════════════════ */
const inferKind = (tx) => {
  if (tx.kind) return tx.kind;
  if (tx.category === "أخرى" && (tx.description || "").includes("تسوية"))
    return KIND.ADJUSTMENT;
  if (tx.category === "تسوية رصيد") return KIND.ADJUSTMENT;
  if (isHanySettleCategory(tx.category)) return KIND.FINANCIAL;
  if (isFinancial(tx.category)) return KIND.FINANCIAL;
  return KIND.OPERATIONAL;
};

const isMonthClosed = (data, year, month) => {
  const key = makeMonthKey(year, month);
  return Array.isArray(data?.closedMonths) && data.closedMonths.includes(key);
};

const isCarryoverMarker = (t) => {
  if (!t) return false;
  if (t.hanyEffect === "carryover-marker") return true;
  if (t.subCategory === "رصيد مرحل") return true;
  const desc = t.description || "";
  if (
    desc.includes("مرحلة من") ||
    desc.includes("مرحل من الشهر") ||
    desc.includes("رصيد مرحل")
  )
    return true;
  return false;
};

const isHanyPurchaseTx = (t) =>
  t &&
  (t.hanyEffect === "purchase" || t.method === HANY_TAB_METHOD) &&
  isHanyShopCategory(t.category) &&
  !isCarryoverMarker(t);

const isHanySettleTx = (t) =>
  t && (t.hanyEffect === "settle" || isHanySettleCategory(t.category));

/* ═══════════════════════════════════════════════════════════════════
   7) CASH EFFECT RULES
   ═══════════════════════════════════════════════════════════════════ */
const hasCashEffect = (t) => {
  if (!t) return false;
  if (t.status !== "paid") return false;
  if (t.source === "void") return false;
  if (t.affectsCash === false) return false;
  if (t.hanyEffect === "carryover-marker") return false;
  if (t.method === HANY_TAB_METHOD) return false;
  if (t.method && PAYMENT_METHODS_WITHOUT_ACCOUNT.has(t.method)) return false;
  if (t.source === "carryover" && t.status !== "paid") return false;
  if (t.source === "reconciliation") return true;
  return true;
};

/* ═══════════════════════════════════════════════════════════════════
   8) FLOW CLASSIFIER
   ═══════════════════════════════════════════════════════════════════ */
const classifyFlow = (t) => {
  if (!t) return FLOW.VOID;
  if (t.status === "void" || t.source === "void") return FLOW.VOID;
  if (isCarryoverMarker(t)) return FLOW.CARRYOVER_MARKER;

  if (t.hanyEffect === "purchase" || t.method === HANY_TAB_METHOD)
    return FLOW.HANY_PURCHASE;
  if (t.hanyEffect === "settle" || isHanySettleCategory(t.category))
    return FLOW.HANY_SETTLE;

  if (t.source === "card-payment-plan") return FLOW.CARD_PAYMENT;
  if (t.source === "payment-console" && t.linkedCardId) return FLOW.CARD_PAYMENT;
  if (
    t.category === "الالتزامات البنكية والتمويلية" &&
    t.type === "expense" &&
    t.linkedCardId &&
    !t.linkedLoanId &&
    !t.sourceRecurringId
  )
    return FLOW.CARD_PAYMENT;

  if (
    t.sourceRecurringId &&
    t.sourceRecurringId.indexOf("r-mortgage") === 0
  )
    return FLOW.LOAN_INSTALLMENT;
  if (t.linkedLoanId) return FLOW.LOAN_INSTALLMENT;

  const _desc = (t.description || "").toLowerCase();
  const _looksLikeCardPayment =
    _desc.includes("credit") ||
    _desc.includes("titanium") ||
    _desc.includes("signature") ||
    _desc.includes("swype") ||
    _desc.includes("tainum") ||
    _desc.includes("adib") ||
    _desc.includes("سداد بطاقة");

  if (
    t.category === "الالتزامات البنكية والتمويلية" &&
    t.type === "expense" &&
    !t.linkedCardId &&
    !t.linkedLoanId &&
    _looksLikeCardPayment
  )
    return FLOW.CARD_PAYMENT;

  if (
    t.category === "الالتزامات البنكية والتمويلية" &&
    t.type === "expense" &&
    !t.linkedCardId
  )
    return FLOW.LOAN_INSTALLMENT;

  if (t.source === "reconciliation") return FLOW.RECONCILIATION;
  if (t.linkedTransferId) {
    if (t.transferDirection === "in") return FLOW.TRANSFER_IN;
    return FLOW.TRANSFER_OUT;
  }
  if (t.source === "external-transfer") return FLOW.TRANSFER_OUT;
  if (t.source === "carryover" && t.status !== "paid") return FLOW.VOID;
  if (t.source === "payment-console") {
    return t.linkedCardId ? FLOW.CARD_PAYMENT : FLOW.LOAN_INSTALLMENT;
  }
  const desc = t.description || "";
  if (
    desc.includes("قرض التمويل") ||
    desc.includes("شقة العبور") ||
    desc.includes("تمويل عقاري") ||
    desc.includes("قرض عقاري")
  ) {
    return FLOW.LOAN_INSTALLMENT;
  }
  if (t.type === "income") return FLOW.INCOME;
  if (t.type === "expense") {
    if (CREDIT_CARD_METHOD_IDS.includes(t.method)) return FLOW.CARD_SPENDING;
    if (t.method && PAYMENT_METHODS_WITHOUT_ACCOUNT.has(t.method))
      return FLOW.CASH_EXPENSE;
    if (BANK_FEE_CATEGORIES.has(t.category)) return FLOW.CASH_EXPENSE;
    if (t.category === "مصاريف وسلف شخصية") return FLOW.CASH_EXPENSE;
    return FLOW.CASH_EXPENSE;
  }
  return FLOW.VOID;
};

/* ═══════════════════════════════════════════════════════════════════
   9) BALANCE ENGINE
   ═══════════════════════════════════════════════════════════════════ */
const getAccountInitialDate = (accountsData, key) => {
  const acc = accountsData?.[key];
  if (!acc) return null;
  const iso = acc.initialDate || acc.lastUpdated;
  return parseISODate(iso) || null;
};

const getAccountInitialBalance = (accountsData, key) => {
  const acc = accountsData?.[key];
  if (!acc) return 0;
  if (acc.initialBalance !== undefined && acc.initialBalance !== null)
    return safeNumber(acc.initialBalance);
  return safeNumber(acc.balance);
};

const _balanceCache = new Map();

const _balanceCacheKey = (data, asOfDate) => {
  const txHash = (data?.transactions || [])
    .map(
      (t) =>
        `${t.id}:${t.amount}:${t.method}:${t.type}:${t.status}:${t.affectsCash === false ? 0 : 1}`,
    )
    .join("|");
  const accHash = Object.keys(data?.accountsData || {})
    .sort()
    .map((k) => {
      const a = data.accountsData[k];
      return `${k}:${a?.initialBalance}:${a?.initialDate || ""}`;
    })
    .join("|");
  const asOf = asOfDate ? new Date(asOfDate).getTime() : "today";
  return `${txHash}_${accHash}_${asOf}`;
};

const computeBalancesAsOf = (data, asOfDate = null) => {
  const cacheKey = _balanceCacheKey(data, asOfDate);
  if (_balanceCache.has(cacheKey)) return _balanceCache.get(cacheKey);

  const accountsData = data?.accountsData || DEFAULT_ACCOUNTS;
  const result = {};
  const anchorTs = {};

  ACCOUNT_KEYS.forEach((k) => {
    result[k] = toPiasters(getAccountInitialBalance(accountsData, k));
    const d = getAccountInitialDate(accountsData, k);
    anchorTs[k] = d ? dayStart(d).getTime() : 0;
  });

  const upper = asOfDate ? new Date(asOfDate).getTime() : endOfToday().getTime();

  (data?.transactions || []).forEach((t) => {
    if (!hasCashEffect(t)) return;
    const method = t.method;
    if (!ACCOUNT_KEYS.includes(method)) return;
    const d = parseISODate(t.date);
    if (!d) return;
    const dTs = dayStart(d).getTime();
    const anchor = anchorTs[method];
    const signedP =
      t.subType === "deposit" ? toPiasters(t.amount) : -toPiasters(t.amount);

    if (upper >= anchor) {
      if (dTs >= anchor && dTs <= upper) result[method] += signedP;
    } else {
      if (dTs > upper && dTs < anchor) result[method] -= signedP;
    }
  });

  ACCOUNT_KEYS.forEach((k) => { result[k] = fromPiasters(result[k]); });

  if (_balanceCache.size > 20) {
    const firstKey = _balanceCache.keys().next().value;
    _balanceCache.delete(firstKey);
  }
  _balanceCache.set(cacheKey, result);
  return result;
};

const computeAllBalances = (data, asOfDate) => computeBalancesAsOf(data, asOfDate);

const computeBalance = (data, key, asOfDate) => {
  const all = computeBalancesAsOf(data, asOfDate);
  return safeNumber(all[key]);
};

const computeDualLiquidity = (balances) => {
  const comprehensive = ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(balances?.[k]), 0);
  const withoutWallets = CORE_LIQUIDITY_KEYS.reduce((s, k) => s + safeNumber(balances?.[k]), 0);
  const walletsOnly = WALLET_ONLY_KEYS.reduce((s, k) => s + safeNumber(balances?.[k]), 0);
  return { comprehensive, withoutWallets, walletsOnly };
};

/* ═══════════════════════════════════════════════════════════════════
   10) CARD ENGINE
   ═══════════════════════════════════════════════════════════════════ */
const getCardMethod = (card) => {
  if (!card) return null;
  if (card.bank === "CIB" && card.name === "SWYPE") return "cib_swype";
  if (card.bank === "AAIB") return "aaib_card";
  if (card.bank === "ADIB Egypt" || card.name === "Tainum") return "adib_card";
  return "cib_card";
};

const isCardPaymentTx = (t, cardId) => {
  if (!t || !cardId) return false;
  if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return false;
  if (t.method === HANY_TAB_METHOD) return false;
  if (t.source === "card-payment-plan") return t.linkedCardId === cardId;
  if (t.source === "payment-console" && t.linkedCardId === cardId) return true;
  if (
    t.category === "الالتزامات البنكية والتمويلية" &&
    t.type === "expense" &&
    t.linkedCardId === cardId &&
    !t.linkedLoanId &&
    !t.sourceRecurringId
  )
    return true;
  return false;
};

const computeCardDebt = (data, card, asOfDate = null) => {
  if (!card) return 0;
  const method = getCardMethod(card);
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();

  const cutoffISO = card.openingDebtDate || card.openingDate;
  const parsedCutoff = cutoffISO ? parseISODate(cutoffISO) : null;
  const cutoffDay = parsedCutoff ? dayStart(parsedCutoff) : null;

  let debt = safeNumber(card.openingDebt);

  (data?.transactions || []).forEach((t) => {
    if (!t) return;
    if (t.status !== "paid") return;
    if (t.source === "carryover") return;
    if (t.source === "void") return;
    if (isCarryoverMarker(t)) return;
    if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return;
    if (t.method === HANY_TAB_METHOD) return;
    if (t.installmentPlanId) return;

    const d = parseISODate(t.date);
    if (!d) return;
    if (cutoffDay && d < cutoffDay) return;
    if (d > upper) return;

    const amt = safeNumber(t.amount);
    const hasExplicitLink =
      t.linkedCardId !== undefined &&
      t.linkedCardId !== null &&
      t.linkedCardId !== "";
    let belongsToCard = false;
    if (hasExplicitLink) belongsToCard = t.linkedCardId === card.id;
    else if (t.cardLast4 && subCards.includes(t.cardLast4)) belongsToCard = true;
    else belongsToCard = t.method === method;

    if (!belongsToCard) return;

    if (isCardPaymentTx(t, card.id)) { debt -= amt; return; }
    if (t.type === "expense") debt += amt;
    else if (t.type === "income") debt -= amt;
  });

  if (typeof computeCardInstallmentsInfo === "function") {
    try {
      const instInfo = computeCardInstallmentsInfo(data, card, upper);
      debt += instInfo.totalDueSoFar;
    } catch (e) {
      console.warn("instInfo failed:", e);
    }
  }

  return debt;
};

const computeCardPaymentInfo = (data, card, asOfDate = null) => {
  if (!card)
    return {
      debt: 0, paymentsTotal: 0, purchasesTotal: 0, refundsTotal: 0,
      lastPayment: null, paymentCount: 0,
    };
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();
  let paymentsTotal = 0, purchasesTotal = 0, refundsTotal = 0, paymentCount = 0;
  let lastPayment = null;
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
  const method = getCardMethod(card);

  (data?.transactions || []).forEach((t) => {
    if (!t || t.status !== "paid" || isCarryoverMarker(t)) return;
    if (t.source === "void") return;
    if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return;
    if (t.method === HANY_TAB_METHOD) return;

    const d = parseISODate(t.date);
    if (!d || d > upper) return;

    const hasExplicitLink =
      t.linkedCardId !== undefined &&
      t.linkedCardId !== null &&
      t.linkedCardId !== "";
    let belongsToCard = false;
    if (hasExplicitLink) belongsToCard = t.linkedCardId === card.id;
    else if (t.cardLast4 && subCards.includes(t.cardLast4)) belongsToCard = true;
    else belongsToCard = t.method === method;
    if (!belongsToCard) return;

    if (isCardPaymentTx(t, card.id)) {
      paymentsTotal += safeNumber(t.amount);
      paymentCount++;
      if (!lastPayment || d > parseISODate(lastPayment.date)) lastPayment = t;
    } else if (t.type === "expense") {
      purchasesTotal += safeNumber(t.amount);
    } else if (t.type === "income") {
      refundsTotal += safeNumber(t.amount);
    }
  });

  return {
    debt: computeCardDebt(data, card, asOfDate),
    paymentsTotal, purchasesTotal, refundsTotal, lastPayment, paymentCount,
  };
};

const computeCardAvailable = (data, card, asOfDate = null) => {
  if (!card) return 0;
  const debt = computeCardDebt(data, card, asOfDate);
  const limit = safeNumber(card.limit);
  const instInfo = computeCardInstallmentsInfo(
    data, card, asOfDate ? new Date(asOfDate) : new Date(),
  );
  return Math.max(0, limit - Math.max(0, debt) - instInfo.totalRemaining);
};

const computeTotalCardDebtNet = (data, asOfDate = null) => {
  const sum = (data?.cards || []).reduce(
    (s, c) => s + computeCardDebt(data, c, asOfDate), 0,
  );
  return Math.max(0, sum);
};

/* ═══════════════════════════════════════════════════════════════════
   11) CARD INSTALLMENTS ENGINE
   ═══════════════════════════════════════════════════════════════════ */
const computeInstallmentProgress = (plan, asOfDate = new Date()) => {
  if (!plan || !plan.months || plan.months <= 0) {
    return {
      monthsElapsed: 0, dueAmount: 0, remainingAmount: 0, remainingMonths: 0,
      completed: false, monthlyAmount: 0, progressPct: 0,
    };
  }
  const startMonthIdx = getMonthIndex(plan.startMonth);
  const startYM = safeNumber(plan.startYear, 2026) * 12 + (startMonthIdx >= 0 ? startMonthIdx : 0);
  const nowYM = asOfDate.getFullYear() * 12 + asOfDate.getMonth();

  let monthsElapsed = Math.max(0, nowYM - startYM + 1);
  monthsElapsed = Math.min(monthsElapsed, plan.months);

  const monthlyAmount = safeNumber(
    plan.monthlyAmount,
    safeNumber(plan.totalAmount) / plan.months,
  );
  const dueAmount = monthsElapsed * monthlyAmount;
  const remainingAmount = Math.max(0, safeNumber(plan.totalAmount) - dueAmount);
  const remainingMonths = Math.max(0, plan.months - monthsElapsed);
  const progressPct = plan.months > 0 ? (monthsElapsed / plan.months) * 100 : 0;

  return {
    monthsElapsed, dueAmount, remainingAmount, remainingMonths,
    monthlyAmount, completed: monthsElapsed >= plan.months, progressPct,
  };
};

const computeCardInstallmentsInfo = (data, card, asOfDate = new Date()) => {
  if (!card)
    return { plans: [], activeCount: 0, totalDueSoFar: 0, totalRemaining: 0, currentMonthly: 0 };
  const plans = (data?.cardInstallments || []).filter(
    (p) => p && p.cardId === card.id && p.status !== "cancelled",
  );
  let totalDueSoFar = 0, totalRemaining = 0, currentMonthly = 0;
  const enriched = plans.map((p) => {
    const prog = computeInstallmentProgress(p, asOfDate);
    totalDueSoFar += prog.dueAmount;
    totalRemaining += prog.remainingAmount;
    if (!prog.completed) currentMonthly += prog.monthlyAmount;
    return { ...p, ...prog };
  });
  return {
    plans: enriched,
    activeCount: enriched.filter((p) => !p.completed).length,
    totalDueSoFar, totalRemaining, currentMonthly,
  };
};

/* ═══════════════════════════════════════════════════════════════════
   12) CARD CYCLE (STATEMENT ENGINE)
   ═══════════════════════════════════════════════════════════════════ */
const getCardCycleParams = (card) => {
  const dueDayMatch = String(card?.dueDate || "25").match(/(\d{1,2})/);
  const dueDay = Math.min(28, Math.max(1, dueDayMatch ? parseInt(dueDayMatch[1], 10) : 25));
  let statementDay = safeNumber(card?.statementDay, 0);
  if (statementDay < 1 || statementDay > 28) {
    statementDay = dueDay > 20 ? dueDay - 20 : dueDay + 10;
    statementDay = Math.min(28, Math.max(1, statementDay));
  }
  return { dueDay, statementDay };
};

const getCycleKeyForDate = (card, dateISO) => {
  const d = parseISODate(dateISO);
  if (!d) return null;
  const { statementDay } = getCardCycleParams(card);
  let endMonth = d.getMonth();
  let endYear = d.getFullYear();
  if (d.getDate() > statementDay) {
    endMonth++;
    if (endMonth > 11) { endMonth = 0; endYear++; }
  }
  return `${endYear}-${String(endMonth + 1).padStart(2, "0")}`;
};

const getCycleRange = (card, cycleKey) => {
  const parts = String(cycleKey).split("-");
  if (parts.length !== 2) return null;
  const y = Number(parts[0]);
  const m = Number(parts[1]);
  if (isNaN(y) || isNaN(m) || m < 1 || m > 12) return null;

  const { dueDay, statementDay } = getCardCycleParams(card);

  const cycleEnd = new Date(y, m - 1, statementDay);
  let sm = m - 2, sy = y;
  if (sm < 0) { sm = 11; sy--; }
  const cycleStart = new Date(sy, sm, statementDay + 1);

  let dm = m - 1, dy = y;
  if (dueDay < statementDay) {
    dm++;
    if (dm > 11) { dm = 0; dy++; }
  }
  const dueDate = new Date(dy, dm, dueDay);

  return {
    cycleStart, cycleEnd, dueDate, statementDate: cycleEnd,
    cycleStartISO: getLocalISODate(cycleStart),
    cycleEndISO: getLocalISODate(cycleEnd),
    statementDateISO: getLocalISODate(cycleEnd),
    dueDateISO: getLocalISODate(dueDate),
  };
};

const buildCardStatementEngine = (card, data, asOfDate = new Date()) => {
  if (!card)
    return { cycles: [], currentStatement: null, openCycle: null, totalDebt: 0, installmentsInfo: null };

  const openingDebt = safeNumber(card.openingDebt);
  const openingDate = parseISODate(card.openingDebtDate || card.openingDate);
  const now = new Date(asOfDate);
  const upperTime = now.getTime();

  const method = getCardMethod(card);
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];

  const allTxs = (data?.transactions || [])
    .filter((t) => {
      if (!t || t.status !== "paid") return false;
      if (t.installmentPlanId) return false;
      if (t.source === "void" || t.source === "carryover" || isCarryoverMarker(t)) return false;
      if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return false;
      if (t.method === HANY_TAB_METHOD) return false;
      const hasExplicitLink =
        t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== "";
      if (hasExplicitLink) return t.linkedCardId === card.id;
      if (t.cardLast4 && subCards.includes(t.cardLast4)) return true;
      return t.method === method;
    })
    .sort((a, b) => {
      const da = parseISODate(a.date)?.getTime() ?? 0;
      const db = parseISODate(b.date)?.getTime() ?? 0;
      if (da !== db) return da - db;
      return (getTxTimestamp(a) || 0) - (getTxTimestamp(b) || 0);
    });

  const instInfo = computeCardInstallmentsInfo(data, card, now);

  const cycleKeysSet = new Set();
  allTxs.forEach((t) => {
    const d = parseISODate(t.date);
    if (!d) return;
    if (openingDate && d < openingDate) return;
    if (d > now) return;
    const k = getCycleKeyForDate(card, t.date);
    if (k) cycleKeysSet.add(k);
  });

  if (openingDate) {
    const k = getCycleKeyForDate(card, getLocalISODate(openingDate));
    if (k) cycleKeysSet.add(k);
  }

  instInfo.plans.forEach((plan) => {
    if (plan.status === "cancelled") return;
    const startIdx = getMonthIndex(plan.startMonth);
    if (startIdx < 0) return;
    for (let i = 0; i < plan.months; i++) {
      const totalIdx = startIdx + i;
      const m = totalIdx % 12;
      const y = safeNumber(plan.startYear, 2026) + Math.floor(totalIdx / 12);
      cycleKeysSet.add(`${y}-${String(m + 1).padStart(2, "0")}`);
    }
  });

  const sortedKeys = Array.from(cycleKeysSet).sort();
  if (sortedKeys.length === 0) {
    return {
      cycles: [], currentStatement: null, openCycle: null, totalDebt: openingDebt,
      installmentsInfo: instInfo, cycleParams: getCardCycleParams(card),
      openingDebt, openingDate,
    };
  }

  let runningBalance = openingDebt;
  const cycles = [];

  sortedKeys.forEach((cycleKey) => {
    const range = getCycleRange(card, cycleKey);
    if (!range) return;

    const { cycleStart, cycleEnd, dueDate, statementDate } = range;
    const cycleStartTs = cycleStart.getTime();
    const cycleEndTs = cycleEnd.getTime();
    const statementTs = statementDate.getTime();
    const dueTs = dueDate.getTime();

    if (cycleStartTs > upperTime) return;

    const cycleTxs = allTxs.filter((t) => {
      const d = parseISODate(t.date);
      if (!d) return false;
      const ts = d.getTime();
      if (openingDate && d < openingDate) return false;
      return ts >= cycleStartTs && ts <= cycleEndTs;
    });

    const purchases = cycleTxs
      .filter((t) => t.type === "expense" && !isCardPaymentTx(t, card.id))
      .reduce((s, t) => s + safeNumber(t.amount), 0);
    const refunds = cycleTxs
      .filter((t) => t.type === "income" && !isCardPaymentTx(t, card.id))
      .reduce((s, t) => s + safeNumber(t.amount), 0);
    const paymentsInCycle = cycleTxs
      .filter((t) => isCardPaymentTx(t, card.id))
      .reduce((s, t) => s + safeNumber(t.amount), 0);

    let installmentsDueThisCycle = 0;
    const dueMonthIdx = dueDate.getMonth();
    const dueYM = dueDate.getFullYear() * 12 + dueMonthIdx;
    instInfo.plans.forEach((plan) => {
      if (plan.status === "cancelled") return;
      const pStartIdx = getMonthIndex(plan.startMonth);
      if (pStartIdx < 0) return;
      const pStartYM = safeNumber(plan.startYear, 2026) * 12 + pStartIdx;
      const diff = dueYM - pStartYM;
      if (diff >= 0 && diff < plan.months) {
        installmentsDueThisCycle += plan.monthlyAmount;
      }
    });

    const openingBalance = runningBalance;
    const closingBalance = openingBalance + purchases - refunds - paymentsInCycle;
    runningBalance = closingBalance;

    const minBase = closingBalance > 0
      ? Math.max(100, Math.round(closingBalance * 0.05 * 100) / 100)
      : 0;
    const minDue = minBase + installmentsDueThisCycle;
    const totalDue = Math.max(0, closingBalance) + installmentsDueThisCycle;

    let status = "open";
    if (upperTime > cycleEndTs && upperTime > statementTs) status = "closed";
    if (upperTime > dueTs && closingBalance > 0.01) status = "overdue";
    if (closingBalance <= 0.01 && upperTime > cycleEndTs) status = "paid";

    const daysUntilDue = Math.ceil((dueTs - upperTime) / 86400000);

    cycles.push({
      cycleKey,
      cycleStartISO: range.cycleStartISO,
      cycleEndISO: range.cycleEndISO,
      statementDateISO: range.statementDateISO,
      dueDateISO: range.dueDateISO,
      cycleStart, cycleEnd, statementDate, dueDate,
      openingBalance, purchases, refunds, paymentsInCycle, closingBalance,
      installmentsDueThisCycle, minDue, totalDue, minBase,
      status, daysUntilDue, txCount: cycleTxs.length,
      transactions: cycleTxs,
      isPaid: closingBalance <= 0.01,
    });
  });

  const closedWithBalance = cycles.filter(
    (c) => c.status === "closed" || c.status === "overdue",
  );
  const openCycles = cycles.filter((c) => c.status === "open");

  const currentStatement =
    closedWithBalance.length > 0 ? closedWithBalance[closedWithBalance.length - 1] : null;
  const openCycle = openCycles.length > 0 ? openCycles[openCycles.length - 1] : null;

  return {
    cycles, currentStatement, openCycle,
    _cycleRunningBalance: runningBalance,
    _cycleClosingBalance: cycles.length > 0 ? cycles[cycles.length - 1].closingBalance : openingDebt,
    installmentsInfo: instInfo,
    cycleParams: getCardCycleParams(card),
    openingDebt, openingDate,
  };
};

const computeCardPaymentPrediction = (data, card, asOfDate = new Date()) => {
  if (!card) return null;
  const engine = buildCardStatementEngine(card, data, asOfDate);
  const now = new Date(asOfDate);

  const currentDebt = Math.max(0, computeCardDebt(data, card, asOfDate));
  const instInfo = engine.installmentsInfo || {
    currentMonthly: 0, totalRemaining: 0, activeCount: 0, plans: [],
  };

  const currentStatement = engine.currentStatement;
  const openCycle = engine.openCycle;

  const statementBalance = currentStatement ? Math.max(0, currentStatement.closingBalance) : 0;
  const installmentsThisMonth = currentStatement ? currentStatement.installmentsDueThisCycle : 0;
  const minBase = currentStatement ? currentStatement.minBase : 0;
  const minPayment = currentStatement ? currentStatement.minDue : 0;
  const totalMandatory = currentStatement ? currentStatement.totalDue : 0;

  const nextCycleEstimate = openCycle
    ? Math.max(0, openCycle.closingBalance) + openCycle.installmentsDueThisCycle
    : 0;
  const nextCycleDueDate = openCycle ? openCycle.dueDate : null;

  const dueDate = currentStatement
    ? currentStatement.dueDate
    : openCycle ? openCycle.dueDate : null;
  const daysUntilDue = dueDate
    ? Math.ceil((dueDate.getTime() - now.getTime()) / 86400000)
    : null;

  const limit = safeNumber(card.limit);
  const availableLimit = Math.max(0, limit - currentDebt - instInfo.totalRemaining);

  return {
    cardId: card.id,
    cardName: `${card.bank} - ${card.name}`,
    last4: card.last4,
    currentDebt, statementBalance, installmentsThisMonth, minBase, minPayment,
    totalMandatory, nextCycleEstimate, nextCycleDueDate, fullPayment: currentDebt,
    nextDueDate: dueDate,
    nextDueDateISO: dueDate ? getLocalISODate(dueDate) : null,
    daysUntilDue,
    urgency:
      daysUntilDue === null ? "normal"
      : daysUntilDue <= 0 ? "overdue"
      : daysUntilDue <= 3 ? "urgent"
      : daysUntilDue <= 7 ? "soon"
      : "normal",
    activeInstallments: instInfo.activeCount,
    installmentsRemainingTotal: instInfo.totalRemaining,
    availableLimit, limit,
    plans: instInfo.plans,
    cycles: engine.cycles,
    currentStatement, openCycle,
    cycleParams: engine.cycleParams,
  };
};

const computeAllCardsPredictions = (data, asOfDate = new Date()) =>
  (data?.cards || [])
    .map((c) => computeCardPaymentPrediction(data, c, asOfDate))
    .filter(Boolean);

const computeTotalMonthlyObligation = (data, asOfDate = new Date()) => {
  const preds = computeAllCardsPredictions(data, asOfDate);
  return {
    totalDebt: preds.reduce((s, p) => s + p.currentDebt, 0),
    totalMinPayment: preds.reduce((s, p) => s + p.minPayment, 0),
    totalInstallments: preds.reduce((s, p) => s + p.installmentsThisMonth, 0),
    totalMandatory: preds.reduce((s, p) => s + p.totalMandatory, 0),
    totalNextCycle: preds.reduce((s, p) => s + p.nextCycleEstimate, 0),
    totalFullPayment: preds.reduce((s, p) => s + p.fullPayment, 0),
    predictions: preds,
  };
};

/* ═══════════════════════════════════════════════════════════════════
   13) HANY LEDGER ENGINE
   ═══════════════════════════════════════════════════════════════════ */
const computeHanyPayable = (data, asOfDate = null) => {
  const upper = asOfDate ? new Date(asOfDate).getTime() : endOfToday().getTime();
  let purchases = 0;
  let settlements = 0;

  (data?.transactions || []).forEach((t) => {
    if (!t || t.status === "void" || t.source === "void") return;
    if (isCarryoverMarker(t)) return;

    const d = parseISODate(t.date);
    if (!d || d.getTime() > upper) return;

    const isPurchase =
      (t.method === HANY_TAB_METHOD || t.hanyEffect === "purchase") &&
      isHanyShopCategory(t.category);

    if (isPurchase) { purchases += safeNumber(t.amount); return; }

    if (
      (t.hanyEffect === "settle" || isHanySettleCategory(t.category)) &&
      t.status === "paid"
    ) {
      settlements += safeNumber(t.amount);
    }
  });

  return Math.max(0, purchases - settlements);
};

const computeHanySummaryForMonth = (data, year, month) => {
  const monthKey = makeMonthKey(year, month);
  let purchases = 0, settlements = 0, purchaseCount = 0, settleCount = 0;

  (data?.transactions || []).forEach((t) => {
    if (!t || t.status === "void") return;
    if (isCarryoverMarker(t)) return;

    const isPurchase =
      (t.method === HANY_TAB_METHOD || t.hanyEffect === "purchase") &&
      isHanyShopCategory(t.category);

    if (t.month === month && (t.year || 2026) === year && isPurchase) {
      purchases += safeNumber(t.amount);
      purchaseCount++;
    }
    if (
      t.month === month &&
      (t.year || 2026) === year &&
      (t.hanyEffect === "settle" || isHanySettleCategory(t.category)) &&
      t.status === "paid"
    ) {
      settlements += safeNumber(t.amount);
      settleCount++;
    }
  });

  const monthIdx = getMonthIndex(month);
  const dayBefore = new Date(year, monthIdx, 0, 23, 59, 59);
  const opening = computeHanyPayable(data, dayBefore);

  return {
    monthKey, opening, purchases, settlements,
    closing: Math.max(0, opening + purchases - settlements),
    purchaseCount, settleCount,
  };
};

const createHanyCarryoverMarker = (data, year, month, remainingAmount) => {
  if (remainingAmount <= 0.01) return null;
  const monthIdx = getMonthIndex(month);
  if (monthIdx < 0) return null;
  const endDate = new Date(year, monthIdx + 1, 0);
  const isoDate = getLocalISODate(endDate);
  const id = `hany-marker-${year}-${monthIdx + 1}`;
  const exists = (data.transactions || []).some((t) => t.id === id);
  if (exists) return null;
  return {
    id,
    type: "expense",
    kind: KIND.ADJUSTMENT,
    category: HANY_TAB_CATEGORY,
    subCategory: "رصيد مرحل",
    description: `رصيد مرحل من ${month} ${year}`,
    amount: roundMoney(remainingAmount),
    method: HANY_TAB_METHOD,
    date: isoDate,
    month,
    year,
    monthIndex: monthIdx,
    subType: "withdrawal",
    status: "paid",
    affectsCash: false,
    hanyEffect: "carryover-marker",
    source: "carryover",
    createdAt: new Date().toISOString(),
    _markerOnly: true,
  };
};

const cleanupHanyMarkersFrom = (transactions, year, month) => {
  const fromIdx = getMonthIndex(month);
  if (fromIdx < 0) return transactions;
  return (transactions || []).filter((t) => {
    if (t.hanyEffect !== "carryover-marker") return true;
    const parsed = parseISODate(t.date);
    if (!parsed) return true;
    const tYear = parsed.getFullYear();
    const tMonthIdx = parsed.getMonth();
    if (tYear > year) return false;
    if (tYear === year && tMonthIdx >= fromIdx) return false;
    return true;
  });
};

/* ═══════════════════════════════════════════════════════════════════
   14) NET WORTH
   ═══════════════════════════════════════════════════════════════════ */
const computeNetWorth = (data, asOfDate = null) => {
  const balances = computeBalancesAsOf(data, asOfDate);
  const liquidity = ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(balances[k]), 0);
  const cardDebt = computeTotalCardDebtNet(data, asOfDate);

  const loanDebt = (data?.loans || [])
    .filter((l) => !l.isReceivable && !l.autoMonthly)
    .reduce((s, l) => s + Math.max(0, safeNumber(l.remaining ?? l.totalAmount)), 0);

  const hanyPayable = computeHanyPayable(data, asOfDate);
  const totalLiabilities = cardDebt + loanDebt + hanyPayable;

  return {
    liquidity, cardDebt, loanDebt, hanyPayable,
    totalLiabilities,
    netWorth: liquidity - totalLiabilities,
    balances,
  };
};

/* ═══════════════════════════════════════════════════════════════════
   15) FLOWS & MONTHLY ANALYSIS
   ═══════════════════════════════════════════════════════════════════ */
const computeMonthlyFlows = (transactions, year, month) => {
  const monthTxs = (transactions || []).filter(
    (t) => t.month === month && (t.year || 2026) === year,
  );

  const emptyBucket = () => ({
    income: 0, cashExpense: 0, cardSpending: 0, cardPayment: 0,
    loanInstallment: 0, hanyPurchase: 0, hanySettle: 0,
    transferOut: 0, transferIn: 0, reconciliation: 0,
  });

  const acc = { paid: emptyBucket(), pending: emptyBucket() };

  monthTxs.forEach((t) => {
    const kind = classifyFlow(t);
    if (kind === FLOW.VOID || kind === FLOW.CARRYOVER_MARKER) return;
    const bucket = t.status === "paid" ? acc.paid : acc.pending;
    const amt = safeNumber(t.amount);
    const keyMap = {
      [FLOW.INCOME]: "income",
      [FLOW.CASH_EXPENSE]: "cashExpense",
      [FLOW.CARD_SPENDING]: "cardSpending",
      [FLOW.CARD_PAYMENT]: "cardPayment",
      [FLOW.LOAN_INSTALLMENT]: "loanInstallment",
      [FLOW.HANY_PURCHASE]: "hanyPurchase",
      [FLOW.HANY_SETTLE]: "hanySettle",
      [FLOW.TRANSFER_OUT]: "transferOut",
      [FLOW.TRANSFER_IN]: "transferIn",
      [FLOW.RECONCILIATION]: "reconciliation",
    };
    const key = keyMap[kind];
    if (key) bucket[key] += amt;
  });

  const p = acc.paid;
  const q = acc.pending;

  return {
    paidIncome: p.income,
    paidCashExpense: p.cashExpense,
    paidCardSpending: p.cardSpending,
    paidCardPayment: p.cardPayment,
    paidLoanInstallment: p.loanInstallment,
    paidHanyPurchase: p.hanyPurchase,
    paidHanySettle: p.hanySettle,
    paidTransferOut: p.transferOut,
    paidTransferIn: p.transferIn,
    paidReconciliation: p.reconciliation,
    pendingIncome: q.income,
    pendingCashExpense: q.cashExpense,
    pendingCardSpending: q.cardSpending,
    pendingCardPayment: q.cardPayment,
    pendingLoanInstallment: q.loanInstallment,
    pendingHanyPurchase: q.hanyPurchase,
    pendingHanySettle: q.hanySettle,
    pendingTransferOut: q.transferOut,
    pendingTransferIn: q.transferIn,
    pendingReconciliation: q.reconciliation,
    paidExpense:
      p.cashExpense + p.cardSpending + p.cardPayment +
      p.loanInstallment + p.hanySettle + p.hanyPurchase,
    pendingExpense:
      q.cashExpense + q.cardSpending + q.cardPayment +
      q.loanInstallment + q.hanySettle + q.hanyPurchase,
    paidReportableIncome: p.income,
    paidReportableExpense:
      p.cashExpense + p.cardSpending + p.cardPayment +
      p.loanInstallment + p.hanySettle + p.hanyPurchase,
    txCount: monthTxs.length,
    monthTxs,
    classifyFlow,
  };
};

const computeMonthlyAverage = (
  transactions, endYear, endMonth, monthsBack, filterFn,
) => {
  let total = 0, count = 0;
  for (let i = 1; i <= monthsBack; i++) {
    const { year, month } = addMonthsToYM(endYear, endMonth, -i);
    if (
      year < PROJECT_START_YEAR ||
      (year === PROJECT_START_YEAR && getMonthIndex(month) < getMonthIndex(PROJECT_START_MONTH))
    )
      continue;
    const monthTxs = (transactions || []).filter(
      (t) => t.month === month && (t.year || 2026) === year && t.status === "paid",
    );
    const val = monthTxs.filter(filterFn).reduce((s, t) => s + safeNumber(t.amount), 0);
    if (val > 0) { total += val; count++; }
  }
  return count > 0 ? total / count : 0;
};

/* ═══════════════════════════════════════════════════════════════════
   16) BALANCE HELPERS (Snapshots)
   ═══════════════════════════════════════════════════════════════════ */
const getClosingBalance = (data, key, year, month) => {
  const monthKey = makeMonthKey(year, month);
  const snap = data?.monthlySnapshots?.[monthKey]?.[key];
  if (snap !== undefined && snap !== null) return safeNumber(snap);
  const monthIdx = getMonthIndex(month);
  if (monthIdx < 0) return computeBalance(data, key);
  const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
  return computeBalance(data, key, monthEnd);
};

const getOpeningBalance = (data, key, year, month) => {
  const idx = getMonthIndex(month);
  if (idx < 0) return computeBalance(data, key);
  if (idx === 0) return getClosingBalance(data, key, year - 1, "ديسمبر");
  return getClosingBalance(data, key, year, ALL_MONTHS[idx - 1]);
};

const buildLedgerWithBalance = (transactions, accountsData, methodId) => {
  const cutoffDay = getAccountInitialDate(accountsData, methodId);
  const cutoffTime = cutoffDay ? dayStart(cutoffDay).getTime() : 0;

  const sorted = (transactions || [])
    .filter(
      (t) =>
        t.method === methodId &&
        t.status === "paid" &&
        t.source !== "void" &&
        t.affectsCash !== false &&
        !isCarryoverMarker(t) &&
        (parseISODate(t.date)?.getTime() ?? 0) >= cutoffTime,
    )
    .sort((a, b) => {
      const da = parseISODate(a.date)?.getTime() ?? 0;
      const db = parseISODate(b.date)?.getTime() ?? 0;
      if (da !== db) return da - db;
      const ca = getTxTimestamp(a);
      const cb = getTxTimestamp(b);
      if (ca !== cb) return ca - cb;
      return String(a.id).localeCompare(String(b.id));
    });

  let balP = toPiasters(getAccountInitialBalance(accountsData, methodId));
  return sorted
    .map((t) => {
      const a = toPiasters(t.amount);
      const prevBalP = balP;
      balP += t.subType === "deposit" ? a : -a;
      return {
        ...t,
        runningBalance: fromPiasters(balP),
        __opening: fromPiasters(prevBalP),
      };
    })
    .reverse();
};

/* ═══════════════════════════════════════════════════════════════════
   17) RECURRING ENGINE
   ═══════════════════════════════════════════════════════════════════ */
const cleanupOldMaterialized = (materialized) => {
  if (!materialized || typeof materialized !== "object") return {};
  const now = new Date();
  const cutoffYM = (now.getFullYear() - 1) * 12 + now.getMonth();
  const cleaned = {};
  Object.keys(materialized).forEach((k) => {
    const parts = k.split("_");
    if (parts.length < 2) { cleaned[k] = materialized[k]; return; }
    const monthKey = parts[parts.length - 1];
    const dashIdx = monthKey.indexOf("-");
    if (dashIdx < 0) { cleaned[k] = materialized[k]; return; }
    const y = Number(monthKey.slice(0, dashIdx));
    const mName = monthKey.slice(dashIdx + 1);
    const mIdx = ALL_MONTHS.indexOf(mName);
    if (isNaN(y) || mIdx < 0) { cleaned[k] = materialized[k]; return; }
    const ym = y * 12 + mIdx;
    if (ym >= cutoffYM - 3 && ym <= cutoffYM + 18) cleaned[k] = materialized[k];
  });
  return cleaned;
};

const materializeRecurringItems = (data, asOfDateStr) => {
  if (!data?.recurringItems?.length) return null;

  const now = asOfDateStr ? new Date(asOfDateStr) : new Date();
  const futureCutoff = new Date(now);
  futureCutoff.setMonth(futureCutoff.getMonth() + 12);
  futureCutoff.setHours(23, 59, 59, 999);

  const pastCutoff = new Date(now);
  pastCutoff.setFullYear(pastCutoff.getFullYear() - 1);
  pastCutoff.setHours(0, 0, 0, 0);

  const permanentDeleted = new Set(data.deletedTxIds || []);
  const existing = (data.transactions || []).filter((t) => !permanentDeleted.has(t.id));
  const materialized = cleanupOldMaterialized(data.materializedRecurring);
  const newTxs = [];

  const loanPaidMap = {};
  existing.forEach((t) => {
    if (t.status === "paid" && t.sourceReceivableId)
      loanPaidMap[t.sourceReceivableId] =
        (loanPaidMap[t.sourceReceivableId] || 0) + safeNumber(t.amount);
  });

  data.recurringItems.forEach((r) => {
    if (r.active === false || !r.id || !r.type) return;
    const day = safeNumber(r.day, 1);
    if (day < 1 || day > 31) return;

    const startInput =
      r.startMonth ||
      `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    const [sy, sm] = startInput.split("-").map(Number);
    if (isNaN(sy) || isNaN(sm)) return;
    const startYM = sy * 12 + (sm - 1);

    let endYM;
    if (r.endMonth) {
      const [ey, em] = r.endMonth.split("-").map(Number);
      if (isNaN(ey) || isNaN(em)) return;
      endYM = ey * 12 + (em - 1);
    } else {
      const endDefault = new Date(now);
      endDefault.setMonth(endDefault.getMonth() + 12);
      endYM = endDefault.getFullYear() * 12 + endDefault.getMonth();
    }

    if (startYM > endYM) return;

    for (let ym = startYM; ym <= endYM; ym++) {
      const y = Math.floor(ym / 12);
      const mIdx = ym % 12;
      const monthName = ALL_MONTHS[mIdx];
      const maxDayInMonth = new Date(y, mIdx + 1, 0).getDate();
      const safeDay = Math.min(day, maxDayInMonth);
      const targetDate = new Date(y, mIdx, safeDay);

      if (targetDate > futureCutoff) continue;
      if (targetDate < pastCutoff) continue;

      const matKey = `${r.id}_${makeMonthKey(y, monthName)}`;
      if (materialized[matKey] === "deleted") continue;
      if (materialized[matKey]) continue;

      const manualExists = existing.some(
        (t) =>
          t.sourceRecurringId === r.id &&
          t.month === monthName &&
          (t.year || y) === y,
      );
      if (manualExists) {
        materialized[matKey] = true;
        continue;
      }

      let receivableLinkedId = null;
      if (r.linkedLoanSystemId) {
        const linkedLoan = (data.loans || []).find(
          (l) => l.systemId === r.linkedLoanSystemId,
        );
        if (linkedLoan) {
          const collected =
            safeNumber(linkedLoan.prePaidAmount) + (loanPaidMap[linkedLoan.id] || 0);
          if (collected >= safeNumber(linkedLoan.totalAmount) - 0.005) continue;
          receivableLinkedId = linkedLoan.id;
        }
      }

      let method = "cash";
      let linkedCardId = r.linkedCardId;
      if (r.method) method = r.method;
      else if (linkedCardId) {
        const card = (data.cards || []).find((c) => c.id === linkedCardId);
        if (card) method = getCardMethod(card);
      }

      const isFee = BANK_FEE_CATEGORIES.has(r.category);
      const kind = r.kind || (isFee ? KIND.FINANCIAL : KIND.OPERATIONAL);
      const newId = `rec-${r.id}-${makeMonthKey(y, monthName)}`;
      if (permanentDeleted.has(newId)) {
        materialized[matKey] = "deleted";
        continue;
      }

      newTxs.push({
        id: newId,
        type: r.type,
        subType: r.type === "income" ? "deposit" : "withdrawal",
        kind,
        category: r.category,
        amount: safeNumber(r.amount),
        description: r.title || "بند متكرر",
        method,
        date: getLocalISODate(targetDate),
        month: monthName,
        year: y,
        monthIndex: mIdx,
        status: "pending",
        sourceRecurringId: r.id,
        linkedCardId: linkedCardId || undefined,
        sourceReceivableId: receivableLinkedId || undefined,
        transferChannel: r.transferChannel || undefined,
        createdAt: new Date().toISOString(),
      });
      materialized[matKey] = true;
    }
  });

  if (newTxs.length === 0) return null;
  return {
    ...data,
    transactions: sortTransactions([...newTxs, ...existing]),
    materializedRecurring: materialized,
  };
};

const applyMaterialization = (data, asOfDateStr) => {
  const updated = materializeRecurringItems(data, asOfDateStr);
  if (!updated) return null;
  const permanentDeleted = new Set(data.deletedTxIds || []);
  const filteredTx = updated.transactions.filter((t) => !permanentDeleted.has(t.id));
  if (filteredTx.length !== updated.transactions.length)
    return { ...updated, transactions: filteredTx };
  return updated;
};

/* ═══════════════════════════════════════════════════════════════════
   18) DATA INTEGRITY
   ═══════════════════════════════════════════════════════════════════ */
const expandTransferLinks = (ids, allTx) => {
  const set = new Set(ids);
  const list = allTx || [];
  ids.forEach((id) => {
    const t = list.find((x) => x.id === id);
    if (t?.linkedTransferId) {
      list.forEach((x) => {
        if (x.linkedTransferId === t.linkedTransferId) set.add(x.id);
      });
    }
  });
  return Array.from(set);
};

const findOrphanTransfers = (transactions) => {
  const groups = {};
  (transactions || []).forEach((t) => {
    if (!t.linkedTransferId) return;
    if (!groups[t.linkedTransferId]) groups[t.linkedTransferId] = [];
    groups[t.linkedTransferId].push(t);
  });
  return Object.entries(groups)
    .filter(([_, arr]) => arr.length < 2)
    .map(([id, arr]) => ({ transferId: id, items: arr }));
};

const invalidateSnapshotsFrom = (snapshots, year, month) => {
  const startIdx = getMonthIndex(month);
  if (startIdx < 0) return { snapshots: snapshots || {}, invalidated: 0 };
  const newSnaps = { ...(snapshots || {}) };
  let invalidated = 0;
  Object.keys(newSnaps).forEach((key) => {
    const parsedKey = parseMonthKey(key);
    if (!parsedKey) return;
    if (
      parsedKey.year > year ||
      (parsedKey.year === year && getMonthIndex(parsedKey.month) >= startIdx)
    ) {
      delete newSnaps[key];
      invalidated++;
    }
  });
  return { snapshots: newSnaps, invalidated };
};

/* ═══════════════════════════════════════════════════════════════════
   19) MIGRATION — كل النسخ السابقة → V89
   ═══════════════════════════════════════════════════════════════════ */
const migrateTransactionV87 = (t) => {
  if (!t) return t;
  const normCat = normalizeCategory(t.category);

  if (isHanyShopCategory(normCat)) {
    if (isCarryoverMarker(t)) {
      return {
        ...t, category: HANY_TAB_CATEGORY, hanyEffect: "carryover-marker",
        affectsCash: false, method: HANY_TAB_METHOD,
      };
    }
    return {
      ...t, category: HANY_TAB_CATEGORY, kind: "operational",
      method: HANY_TAB_METHOD, affectsCash: false, hanyEffect: "purchase",
    };
  }

  if (isHanySettleCategory(normCat) || t.hanyEffect === "settle") {
    const settleMethod = LEDGER_METHOD_IDS.has(t.method) ? t.method : "cash";
    return {
      ...t, category: HANY_SETTLE_CATEGORY, kind: "financial",
      hanyEffect: "settle", affectsCash: true, method: settleMethod,
    };
  }

  if (t.settledHanyMonth && !t.hanyEffect) {
    return { ...t, hanyEffect: "settle", category: HANY_SETTLE_CATEGORY };
  }

  if (
    t.subCategory === "رصيد مرحل" ||
    (t.description || "").includes("مرحلة من") ||
    (t.description || "").includes("مرحل من الشهر") ||
    (t.description || "").includes("رصيد مرحل")
  ) {
    return {
      ...t, method: HANY_TAB_METHOD, affectsCash: false,
      hanyEffect: "carryover-marker", status: "paid", source: "carryover",
    };
  }

  return { ...t, category: normCat };
};

const migrateHanyTx = (t) => {
  if (!t) return t;
  if (isCarryoverMarker(t)) return t;
  if (isHanySettleCategory(t.category)) return t;
  if (!isHanyShopCategory(t.category)) return t;
  return {
    ...t, category: HANY_TAB_CATEGORY, method: HANY_TAB_METHOD,
    affectsCash: false, hanyEffect: "purchase",
  };
};

const migrateCardPayments = (transactions, cards) => {
  if (!Array.isArray(transactions)) return [];
  const cardMethods = new Map();
  (cards || []).forEach((c) => cardMethods.set(getCardMethod(c), c.id));

  return transactions.map((t) => {
    if (!t) return t;
    if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return t;
    if (t.__cardPaymentMigrated) return t;
    if (t.source === "card-payment-plan" || t.source === "payment-console") {
      return { ...t, __cardPaymentMigrated: true };
    }
    if (t.category === "الالتزامات البنكية والتمويلية" && t.linkedCardId) {
      return { ...t, __cardPaymentMigrated: true };
    }
    if (
      t.category === "الالتزامات البنكية والتمويلية" &&
      t.type === "expense" &&
      t.method && cardMethods.has(t.method) &&
      !t.linkedCardId && !t.linkedLoanId
    ) {
      return {
        ...t, linkedCardId: cardMethods.get(t.method),
        __cardPaymentMigrated: true,
      };
    }
    return t;
  });
};

const migrateSnapshotsAndClosed = (snapshots, closedMonths) => {
  let snaps = snapshots && typeof snapshots === "object" ? { ...snapshots } : {};
  let closed = Array.isArray(closedMonths) ? [...closedMonths] : [];
  if (
    Object.keys(snaps).length > 0 &&
    !Object.keys(snaps).every((k) => /^\d{4}-/.test(k))
  ) {
    const migrated = {};
    Object.entries(snaps).forEach(([month, val]) => {
      if (/^\d{4}-/.test(month)) migrated[month] = val;
      else
        migrated[makeMonthKey(2026, month)] =
          typeof val === "object" && val !== null ? val : { cash: safeNumber(val) };
    });
    snaps = migrated;
  }
  if (closed.length > 0 && !closed.every((k) => /^\d{4}-/.test(k))) {
    closed = closed.map((m) => (/^\d{4}-/.test(m) ? m : makeMonthKey(2026, m)));
  }
  return { snapshots: snaps, closedMonths: closed };
};

const migrateCards = (cards) => {
  if (!Array.isArray(cards)) return safeClone(DEFAULT_CARDS);
  const migrated = cards.map((c) => {
    const result = { ...c };
    if (!Array.isArray(result.subCardLast4)) result.subCardLast4 = [];
    if (result.id === 2 && String(result.last4) === "0391") result.last4 = "3391";
    if (result.id === 1 && result.name === "Titanium") {
      result.subCardLast4 = ["9360", "9352", "2014"];
      if (!result.limit || result.limit === 0) result.limit = 100500;
      result.imageKey = result.imageKey || "cib_titanium";
    }
    if (result.id === 2 && result.name === "Signature") {
      result.subCardLast4 = ["3557"];
      if (!result.limit || result.limit === 0) result.limit = 100000;
      result.imageKey = result.imageKey || "aaib_signature";
    }
    if (result.id === 3 && result.name === "SWYPE") {
      result.last4 = "6015";
      if (!result.limit || result.limit === 0) result.limit = 49500;
      result.subCardLast4 = [];
      if (!result.linkedAccountKey) result.linkedAccountKey = "cib_savings";
      if (!result.linkedAccountLast4) result.linkedAccountLast4 = "1809";
      result.imageKey = result.imageKey || "cib_swype";
    }
    if (
      result.id === 4 ||
      result.name === "Tainum" ||
      result.bank === "ADIB Egypt"
    ) {
      result.name = "Tainum";
      result.bank = "ADIB Egypt";
      result.limit = 99000;
      result.last4 = "9982";
      result.expiry = "09/28";
      result.dueDate = "25 من كل شهر";
      result.theme = "tainum_gray";
      result.subCardLast4 = [];
      result.cashbackRate = result.cashbackRate !== undefined ? result.cashbackRate : 1;
      result.type = "mastercard";
      result.imageKey = result.imageKey || "adib_tainum";
    }
    if (!result.imageKey) {
      if (result.bank === "CIB" && result.name === "Titanium") result.imageKey = "cib_titanium";
      else if (result.bank === "CIB" && result.name === "SWYPE") result.imageKey = "cib_swype";
      else if (result.bank === "AAIB") result.imageKey = "aaib_signature";
      else if (result.bank === "ADIB Egypt") result.imageKey = "adib_tainum";
    }
    if (
      result.statementDay === undefined ||
      result.statementDay === null ||
      result.statementDay === ""
    ) {
      const dueMatch = String(result.dueDate || "25").match(/(\d{1,2})/);
      const dueD = dueMatch ? parseInt(dueMatch[1], 10) : 25;
      result.statementDay = dueD > 20 ? dueD - 20 : Math.min(28, dueD + 10);
    }
    result.statementDay = Math.min(28, Math.max(1, safeNumber(result.statementDay, 5)));

    if (!result.providerKey) {
      if (result.bank === "CIB") result.providerKey = "cib";
      else if (result.bank === "AAIB") result.providerKey = "aaib";
      else if (result.bank === "ADIB Egypt") result.providerKey = "adib";
      else result.providerKey = "cib";
    }
    if (!result.displayName) {
      const p = PROVIDERS[result.providerKey] || PROVIDERS.cib;
      result.displayName = `${p.icon} ${result.bank} ${result.name} • ${result.last4}`;
    }

    if (!result.openingDate) result.openingDate = null;
    if (!result.openingDebtDate) result.openingDebtDate = result.openingDate || null;
    if (result.cashbackRate === undefined) result.cashbackRate = 0;
    return result;
  });
  const hasTainum = migrated.some(
    (c) => c.id === 4 || c.name === "Tainum" || c.bank === "ADIB Egypt",
  );
  if (!hasTainum) {
    const tainum = DEFAULT_CARDS.find((c) => c.id === 4);
    if (tainum) migrated.push({ ...tainum });
  }
  return migrated;
};

const migrateTransaction = (t) => {
  if (!t) return t;
  const kind = inferKind(t);
  const category = normalizeCategory(t.category);
  let year = t.year, month = t.month, monthIndex = t.monthIndex;
  if (t.date && (!month || !year)) {
    const d = parseISODate(t.date);
    if (d) {
      if (!year) year = d.getFullYear();
      if (!month) month = ALL_MONTHS[d.getMonth()];
    }
  }
  if (!year) year = 2026;
  if (monthIndex === undefined || monthIndex === null || monthIndex < 0)
    monthIndex = getMonthIndex(month);
  if (monthIndex < 0 && month) {
    const norm = ALL_MONTHS.find((m) => normalizeText(m) === normalizeText(month));
    if (norm) { month = norm; monthIndex = getMonthIndex(norm); }
  }
  let subType = t.subType;
  if (!subType) subType = t.type === "income" ? "deposit" : "withdrawal";
  const createdAt =
    t.createdAt || (t.date ? `${t.date}T12:00:00.000Z` : new Date().toISOString());
  return { ...t, category, kind, year, month, monthIndex, subType, createdAt };
};

const migrateRecurringItems = (items) => {
  if (!Array.isArray(items)) return [];
  return items.map((r) => {
    const migrated = { ...r };
    if (migrated.active === undefined) migrated.active = true;
    if (migrated.startMonth && !/^\d{4}-\d{2}$/.test(migrated.startMonth))
      migrated.startMonth = keyToInputMonth(migrated.startMonth) || null;
    if (migrated.endMonth && !/^\d{4}-\d{2}$/.test(migrated.endMonth))
      migrated.endMonth = keyToInputMonth(migrated.endMonth) || null;
    if (migrated.startMonth === undefined) migrated.startMonth = null;
    if (migrated.endMonth === undefined) migrated.endMonth = null;
    if (
      r.title && r.title.includes("تكييف محمود") && !migrated.linkedLoanSystemId
    )
      migrated.linkedLoanSystemId = SYSTEM_LOAN_IDS.TAKYEEF;
    if (
      !migrated.transferChannel &&
      r.category && r.category.startsWith("مصروف شهري - ")
    ) {
      const ben = BENEFICIARIES.find((b) => `مصروف شهري - ${b.label}` === r.category);
      if (ben && ben.hasTelda) migrated.transferChannel = ben.method;
    }
    return migrated;
  });
};

const METHOD_BY_CATEGORY = {
  "إيجار المحل": "cash",
  "الزكاة والتبرعات": "cib_savings",
  "تكييف محمود": "cash",
  "راتب شهري": "aaib_savings",

  "عهدة إيماك WE": "cib_savings",

};

const mergeById = (existing, defaults) => {
  if (!Array.isArray(existing) || existing.length === 0) return defaults;
  const merged = [...existing];
  defaults.forEach((d) => {
    if (
      !merged.some(
        (e) => e.id === d.id || (e.systemId && d.systemId && e.systemId === d.systemId),
      )
    )
      merged.push(d);
  });
  return merged;
};

const migrateData = (parsed) => {
  if (!parsed) return parsed;

  const deletedDefaultIds = Array.isArray(parsed.deletedDefaultIds)
    ? parsed.deletedDefaultIds : [];
  const deletedSet = new Set(deletedDefaultIds);

  const incomingCards = Array.isArray(parsed.cards) ? parsed.cards : [];
  const cardsFilteredDefaults = DEFAULT_CARDS.filter(
    (c) => !deletedSet.has(c.id) || c.id === 4,
  );
  const mergedCards = mergeById(migrateCards(incomingCards), cardsFilteredDefaults);

  const incomingLoans = Array.isArray(parsed.loans) ? parsed.loans : [];
  const processedLoans = incomingLoans.map((l) => {
    if (isTakyeefLoan(l))
      return {
        ...l, systemId: SYSTEM_LOAN_IDS.TAKYEEF, isReceivable: true,
        type: "receivable", interest: "مستحق لنا شهرياً",
        paused: !!l.paused,
        totalInstallments: safeNumber(l.totalInstallments, 12),
        paidInstallments: safeNumber(l.paidInstallments, 0),
      };
    if (isHanyLoan(l) && !l.autoMonthly)
      return {
        ...l, systemId: SYSTEM_LOAN_IDS.HANY, autoMonthly: true,
        dueNextMonth: true, mergeIntoNextCycle: l.mergeIntoNextCycle || [],
        category: HANY_TAB_CATEGORY, totalAmount: 0, prePaidAmount: 0,
        monthlyInstallment: 0, dueDay: 5, interest: "مستحق شهري",
        description: "مشتريات يومية", type: "debt",
      };
    if (l && l.autoMonthly && !l.systemId)
      return { ...l, systemId: SYSTEM_LOAN_IDS.HANY };
    return l;
  });
  const mergedLoans = mergeById(processedLoans, []);

  let { snapshots, closedMonths } = migrateSnapshotsAndClosed(
    parsed.monthlySnapshots, parsed.closedMonths,
  );
  const incomingVersion = safeNumber(parsed.engineVersion, 1);
  if (incomingVersion < 10 && Object.keys(snapshots).length > 0) snapshots = {};

  let transactions = Array.isArray(parsed.transactions)
    ? parsed.transactions.map(migrateTransaction) : [];
  transactions = transactions.map(migrateTransactionV87).map(migrateHanyTx);
  transactions = migrateCardPayments(transactions, mergedCards);
  transactions = transactions.map((t) => {
    if (
      t.id && t.sourceRecurringId && t.year && t.month &&
      /^rec-.+-\d{4}-.+-[a-z0-9-]{6,}$/i.test(t.id)
    ) {
      return { ...t, id: `rec-${t.sourceRecurringId}-${makeMonthKey(t.year, t.month)}` };
    }
    return t;
  });
  transactions = sortTransactions(transactions);

  const accountsData =
    parsed.accountsData && typeof parsed.accountsData === "object"
      ? { ...DEFAULT_ACCOUNTS, ...parsed.accountsData }
      : safeClone(DEFAULT_ACCOUNTS);

  const renamedLabels = {
    "CIB توفير": "🏦 CIB توفير • 1809",
    "AAIB توفير": "🏦 AAIB توفير • 2106",
    نقدي: "💵 الكاش",
    Cash: "💵 الكاش",
    فوري: "📱 محفظة فوري",
    اتصالات: "📱 محفظة اتصالات",
  };
  ACCOUNT_KEYS.forEach((k) => {
    if (!accountsData[k]) accountsData[k] = { ...DEFAULT_ACCOUNTS[k] };
    if (
      accountsData[k].initialBalance === undefined ||
      accountsData[k].initialBalance === null
    ) {
      accountsData[k].initialBalance = safeNumber(accountsData[k].balance);
    }
    if (
      accountsData[k].initialDate === undefined ||
      accountsData[k].initialDate === null
    ) {
      accountsData[k].initialDate = accountsData[k].lastUpdated || null;
    }
    if (accountsData[k].lastUpdated === undefined) accountsData[k].lastUpdated = null;
    if (accountsData[k]?.label && renamedLabels[accountsData[k].label]) {
      accountsData[k] = { ...accountsData[k], label: renamedLabels[accountsData[k].label] };
    }
    if (!accountsData[k].label)
      accountsData[k] = { ...accountsData[k], label: DEFAULT_ACCOUNTS[k].label };
    if (k === "cib_savings" && !accountsData[k].last4)
      accountsData[k] = { ...accountsData[k], last4: "1809" };
    if (k === "aaib_savings" && !accountsData[k].last4)
      accountsData[k] = { ...accountsData[k], last4: "2106" };

    if (!accountsData[k].providerKey) {
      if (k === "cib_savings") accountsData[k] = { ...accountsData[k], providerKey: "cib" };
      if (k === "aaib_savings") accountsData[k] = { ...accountsData[k], providerKey: "aaib" };
      if (k === "cash") accountsData[k] = { ...accountsData[k], providerKey: "cash" };
      if (k === "fawry" || k === "etisalat")
        accountsData[k] = { ...accountsData[k], providerKey: "wallets" };
    }
    if (!accountsData[k].type) {
      if (k === "cash") accountsData[k] = { ...accountsData[k], type: "cash" };
      else if (k === "fawry" || k === "etisalat")
        accountsData[k] = { ...accountsData[k], type: "wallet" };
      else accountsData[k] = { ...accountsData[k], type: "account" };
    }
  });

  let recurringItems = Array.isArray(parsed.recurringItems) ? parsed.recurringItems : [];
  recurringItems = migrateRecurringItems(recurringItems);
  recurringItems = recurringItems.map((r) => {
    if (r.method) return r;
    if (r.linkedCardId) {
      const card = mergedCards.find((c) => c.id === r.linkedCardId);
      return { ...r, method: card ? getCardMethod(card) : "cash" };
    }
    const m = METHOD_BY_CATEGORY[r.category];
    return m ? { ...r, method: m } : { ...r, method: "cash" };
  });

  const settledHanyMonths = Array.isArray(parsed.settledHanyMonths)
    ? parsed.settledHanyMonths : [];
  const deletedTxIds = Array.isArray(parsed.deletedTxIds)
    ? parsed.deletedTxIds.slice(-500) : [];
  const existingArchive = Array.isArray(parsed.deletedTxArchive)
    ? parsed.deletedTxArchive : [];

  let migratedArchive = [...existingArchive];
  if (!parsed.legacyArchiveMigrated) {
    const archiveIds = new Set(existingArchive.map((a) => a.id).filter(Boolean));
    deletedTxIds.forEach((id) => {
      if (!archiveIds.has(id))
        migratedArchive.push({
          id, deletedAt: null, deletedBy: "unknown", _legacy: true,
        });
    });
  }

  const auditLog = Array.isArray(parsed.auditLog) ? parsed.auditLog.slice(0, 1000) : [];
  const deleteRequests = Array.isArray(parsed.deleteRequests) ? parsed.deleteRequests : [];

  const { openingBalance2026: _drop, ...rest } = parsed;

  const cardInstallments = Array.isArray(parsed.cardInstallments)
    ? parsed.cardInstallments.filter(
        (p) => p && p.cardId && p.totalAmount && p.months && p.months > 0,
      )
    : [];

  const base = {
    ...rest,
    engineVersion: CURRENT_ENGINE_VERSION,
    recurringInitialized: true,
    cards: mergedCards,
    loans: mergedLoans,
    recurringItems,
    closedMonths,
    monthlySnapshots: snapshots,
    transactions,
    accountsData,
    monthlyPlans:
      parsed.monthlyPlans && typeof parsed.monthlyPlans === "object"
        ? parsed.monthlyPlans : {},
    materializedRecurring:
      parsed.materializedRecurring && typeof parsed.materializedRecurring === "object"
        ? parsed.materializedRecurring : {},
    custodyEntries: Array.isArray(parsed.custodyEntries) ? parsed.custodyEntries : [],
    cashbackTrackers: Array.isArray(parsed.cashbackTrackers) ? parsed.cashbackTrackers : [],
    reconciliations: Array.isArray(parsed.reconciliations) ? parsed.reconciliations : [],
    cardInstallments,
    settledHanyMonths,
    deletedTxIds,
    deletedTxArchive: migratedArchive.slice(-500),
    legacyArchiveMigrated: true,
    deletedDefaultIds,
    auditLog,
    defaultsSeeded: true,
    shoppingRecurring: Array.isArray(parsed.shoppingRecurring) ? parsed.shoppingRecurring : [],
    deleteRequests,
  };

  base.transactions = base.transactions.map((t) => {
    if (!t || !isHanyShopCategory(t.category)) return t;
    if (isCarryoverMarker(t)) return t;
    if (isHanySettleCategory(t.category)) return t;
    return { ...t, method: HANY_TAB_METHOD, affectsCash: false, hanyEffect: "purchase" };
  });

  base.hanyPayableCache = computeHanyPayable(base);
  base.__v890MigratedAt = new Date().toISOString();
  return base;
};

};

/* ═══════════════════════════════════════════════════════════════════

/* ─────────── useToast — نظام إشعارات ─────────── */
const ToastContext = React.createContext(null);

const ToastProvider = ({ children }) => {
  const [notifications, setNotifications] = useState([]);

  const addNotification = useCallback((notification) => {
    const id = `n-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
    setNotifications((prev) => {
      const newList = [...prev, { id, ...notification }];
      return newList.slice(-5);
    });
    return id;
  }, []);

  const removeNotification = useCallback((id) => {
    setNotifications((prev) => prev.filter((n) => n.id !== id));
  }, []);

  const value = useMemo(
    () => ({ notifications, addNotification, removeNotification }),
    [notifications, addNotification, removeNotification],
  );

  return (
    <ToastContext.Provider value={value}>
      {children}
      <ToastContainer
        notifications={notifications}
        removeNotification={removeNotification}
      />
    </ToastContext.Provider>
  );
};

const useToast = () => {
  const ctx = React.useContext(ToastContext);
  if (!ctx) throw new Error("useToast must be used within ToastProvider");
  return ctx.addNotification;
};

/* ─────────── Toast Item ─────────── */
const Toast = ({ notification, onRemove }) => {
  const [exiting, setExiting] = useState(false);
  const [progress, setProgress] = useState(100);
  const duration = Math.max(1500, notification.duration || 5000);
  const startTimeRef = useRef(Date.now());
  const exitTimerRef = useRef(null);
  const dismissedRef = useRef(false);

  const handleClose = useCallback(() => {
    if (dismissedRef.current) return;
    dismissedRef.current = true;
    setExiting(true);
    if (exitTimerRef.current) clearTimeout(exitTimerRef.current);
    exitTimerRef.current = setTimeout(() => onRemove(notification.id), 220);
  }, [onRemove, notification.id]);

  const handleCloseRef = useRef(handleClose);
  useEffect(() => { handleCloseRef.current = handleClose; }, [handleClose]);

  useEffect(() => {
    startTimeRef.current = Date.now();
    dismissedRef.current = false;
    const interval = setInterval(() => {
      const elapsed = Date.now() - startTimeRef.current;
      const remaining = Math.max(0, 100 - (elapsed / duration) * 100);
      setProgress(remaining);
      if (remaining <= 0) {
        clearInterval(interval);
        handleCloseRef.current();
      }
    }, 50);
    return () => clearInterval(interval);
  }, [duration, notification.id]);

  useEffect(() => () => {
    if (exitTimerRef.current) clearTimeout(exitTimerRef.current);
  }, []);

  const icons = {
    success: CheckCircle2,
    error: AlertTriangle,
    warning: AlertTriangle,
    info: Bell,
  };
  const Icon = icons[notification.type] || Bell;

  return (
    <div
      className={`toast toast-${notification.type || "info"}`}
      style={{
        opacity: exiting ? 0 : 1,
        transform: exiting ? "translateY(-12px) scale(0.96)" : "none",
        transition: "opacity 0.22s ease, transform 0.22s ease",
      }}
      role="alert"
    >
      <Icon size={18} style={{ flexShrink: 0, marginTop: 2 }} />
      <div style={{ flex: 1, minWidth: 0 }}>
        {notification.title && (
          <p style={{ fontWeight: 800, fontSize: 13, marginBottom: 2 }}>
            {notification.title}
          </p>
        )}
        {notification.message && (
          <p style={{ fontSize: 12, opacity: 0.95, lineHeight: 1.5, whiteSpace: "pre-line", margin: 0 }}>
            {notification.message}
          </p>
        )}
      </div>
      <button
        onClick={handleClose}
        className="toast-close"
        aria-label="إغلاق"
      >
        <X size={15} />
      </button>
      <div className="toast-progress-track" onClick={handleClose}>
        <div className="toast-progress-fill" style={{ width: `${progress}%` }} />
      </div>
    </div>
  );
};

const ToastContainer = ({ notifications, removeNotification }) => {
  if (!notifications || notifications.length === 0) return null;
  return (
    <div className="toast-container no-print">
      {notifications.map((n) => (
        <Toast key={n.id} notification={n} onRemove={removeNotification} />
      ))}
    </div>
  );
};

/* ─────────── useConfirm — تأكيد بسيط ─────────── */
const ConfirmContext = React.createContext(null);

const ConfirmProvider = ({ children }) => {
  const [dialog, setDialog] = useState({
    isOpen: false,
    title: "",
    message: "",
    onConfirm: null,
    onCancel: null,
    danger: false,
    confirmText: "تأكيد",
    cancelText: "إلغاء",
  });

  const confirm = useCallback((options) => {
    return new Promise((resolve) => {
      setDialog({
        isOpen: true,
        title: options.title || "تأكيد",
        message: options.message || "",
        danger: options.danger || false,
        confirmText: options.confirmText || "تأكيد",
        cancelText: options.cancelText || "إلغاء",
        onConfirm: () => { setDialog((d) => ({ ...d, isOpen: false })); resolve(true); },
        onCancel: () => { setDialog((d) => ({ ...d, isOpen: false })); resolve(false); },
      });
    });
  }, []);

  const value = useMemo(() => ({ confirm }), [confirm]);

  return (
    <ConfirmContext.Provider value={value}>
      {children}
      <ConfirmDialog dialog={dialog} setDialog={setDialog} />
    </ConfirmContext.Provider>
  );
};

const useConfirm = () => {
  const ctx = React.useContext(ConfirmContext);
  if (!ctx) throw new Error("useConfirm must be used within ConfirmProvider");
  return ctx.confirm;
};

const ConfirmDialog = ({ dialog, setDialog }) => {

/* ─────────── usePrompt — مدخل نصي/رقمي ─────────── */
const PromptContext = React.createContext(null);

const PromptProvider = ({ children }) => {
  const [state, setState] = useState({
    isOpen: false,
    title: "",
    message: "",
    icon: "💬",
    inputValue: "",
    numeric: false,
    placeholder: "",
    confirmText: "تأكيد",
    cancelText: "إلغاء",
    resolve: null,
  });
  const [currentValue, setCurrentValue] = useState("");

  const prompt = useCallback((options) => {
    return new Promise((resolve) => {
      setCurrentValue(options.inputValue || "");
      setState({
        isOpen: true,
        title: options.title || "",
        message: options.message || "",
        icon: options.icon || "💬",
        numeric: options.numeric || false,
        placeholder: options.placeholder || "",
        confirmText: options.confirmText || "تأكيد",
        cancelText: options.cancelText || "إلغاء",
        resolve,
      });
    });
  }, []);

  const value = useMemo(() => ({ prompt }), [prompt]);

  const handleConfirm = () => {
    const v = state.numeric ? parseNumberInput(currentValue) : currentValue.trim();
    if (state.resolve) state.resolve(v);
    setState((s) => ({ ...s, isOpen: false, resolve: null }));
  };

  const handleCancel = () => {
    if (state.resolve) state.resolve(null);
    setState((s) => ({ ...s, isOpen: false, resolve: null }));
  };

  return (
    <PromptContext.Provider value={value}>
      {children}
      {state.isOpen && (
        <div className="modal-backdrop no-print" style={{ zIndex: 5500 }}>
          <div className="modal" style={{ maxWidth: 420 }}>
            <div className="modal-header">
              <h3 style={{ fontSize: 15, fontWeight: 900, display: "flex", alignItems: "center", gap: 8 }}>
                <span>{state.icon}</span>
                {state.title}
              </h3>
              <button onClick={handleCancel} className="btn btn-ghost btn-icon-sm">
                <X size={16} />
              </button>
            </div>
            <div className="modal-body">
              {state.message && (
                <p style={{
                  fontSize: 13, marginBottom: 14, whiteSpace: "pre-line",
                  lineHeight: 1.7, color: "var(--text-secondary)",
                }}>
                  {state.message}
                </p>
              )}
              <input
                autoFocus
                type="text"
                inputMode={state.numeric ? "decimal" : "text"}
                className="input-field input-num"
                style={{
                  color: "var(--brand)",
                  fontSize: 20, padding: "14px 16px",
                  textAlign: "center", fontWeight: 800,
                }}
                value={currentValue}
                onChange={(e) =>
                  setCurrentValue(
                    state.numeric ? e.target.value.replace(/[^\d.\-]/g, "") : e.target.value,
                  )
                }
                onKeyDown={(e) => { if (e.key === "Enter") handleConfirm(); }}
                placeholder={state.placeholder}
              />
            </div>
            <div className="modal-footer">
              <button onClick={handleCancel} className="btn btn-secondary" style={{ flex: 1, fontSize: 13 }}>
                {state.cancelText}
              </button>
              <button onClick={handleConfirm} className="btn btn-primary" style={{ flex: 1, fontSize: 13 }}>
                {state.confirmText}
              </button>
            </div>
          </div>
        </div>
      )}
    </PromptContext.Provider>
  );
};

const usePrompt = () => {
  const ctx = React.useContext(PromptContext);
  if (!ctx) throw new Error("usePrompt must be used within PromptProvider");
  return ctx.prompt;
};
