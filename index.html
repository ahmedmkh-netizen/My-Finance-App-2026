  let inThrottle;
  return function() {
    const args = arguments;
    const context = this;
    if (!inThrottle) {
      func.apply(context, args);
      inThrottle = true;
      setTimeout(() => inThrottle = false, limit);
    }
  }
};

const debounce = (func, wait) => {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
};

  if (typeof unsafe !== 'string') return unsafe;
  return unsafe

    .replace(/"/g, "&quot;")

    target.setHours(0, 0, 0, 0);

    case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
    case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
    case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
    case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
    case 'SET_EDITING_FAWRY': return { ...state, editingFawry: action.payload };
    case 'SET_EDITING_ETISALAT': return { ...state, editingEtisalat: action.payload };
    case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
    case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
    case 'SET_FILTER_TYPE': return { ...state, filterType: action.payload };
    case 'SET_HIDE_PAST': return { ...state, hidePast: action.payload };
    case 'SET_AI_MODAL_OPEN': return { ...state, isAiModalOpen: action.payload };
    case 'SET_AI_TAB': return { ...state, aiTab: action.payload };
    case 'SET_AI_QUERY': return { ...state, aiQuery: action.payload };
    case 'SET_AI_RESPONSE': return { ...state, aiResponse: action.payload };
    case 'SET_AI_LOADING': return { ...state, isAiLoading: action.payload };
    case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
    case 'ADD_NOTIFICATION': return { ...state, notifications: [...state.notifications, { id: Date.now(), ...action.payload }] };
    case 'REMOVE_NOTIFICATION': return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
    case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
    case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
    case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
    case 'UPDATE_OPENING_BALANCE': return { ...state, data: { ...state.data, openingBalance2026: action.payload } };
    case 'UPDATE_FAWRY_DATA': return { ...state, fawryData: action.payload };
    case 'UPDATE_ETISALAT_DATA': return { ...state, etisalatData: action.payload };
    case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
    case 'ADD_TO_HISTORY': {
      const limitedHistory = [...state.history].slice(-19);
      return { ...state, history: [...limitedHistory, action.payload], future: [] };
    }
    case 'UNDO': {
      if (state.history.length === 0) return state;
      const previous = state.history[state.history.length - 1];
      return { 
        ...state, 
        data: previous, 
        history: state.history.slice(0, state.history.length - 1), 
        future: [state.data, ...state.future] 
      };
    }
    case 'REDO': {
      if (state.future.length === 0) return state;
      const next = state.future[0];
      return { 
        ...state, 
        data: next, 
        history: [...state.history, state.data], 
        future: state.future.slice(1) 
      };
    }
    case 'TOGGLE_LEDGER': return { 
      ...state, 
      expandedLedgers: { 
        ...state.expandedLedgers, 
        [action.payload]: !state.expandedLedgers[action.payload] 
      } 
    };
    case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };
    case 'SET_STATUS_FILTER': return { ...state, statusFilter: action.payload };
    case 'UPDATE_LOAN_DUE_DATE': return { 
      ...state, 
      data: { 
        ...state.data, 
        loans: state.data.loans.map(loan => 
          loan.id === action.payload.loanId ? 
          { ...loan, nextPaymentDate: action.payload.newDate } : 
          loan
        ) 
      } 
    };
    case 'SHOW_CONFIRM': return { 
      ...state, 
      confirmDialog: { 
        isOpen: true, 
        title: action.title, 
        message: action.message, 
        onConfirm: action.onConfirm,
        onCancel: action.onCancel || (() => dispatch({ type: 'HIDE_CONFIRM' }))
      } 
    };
    case 'HIDE_CONFIRM': return { 
      ...state, 
      confirmDialog: { 
        isOpen: false, 
        title: '', 
        message: '', 
        onConfirm: null, 
        onCancel: null 
      } 
    };
    case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
    case 'SET_QUICK_TRANSFER_DATA': return { 
      ...state, 
      quickTransferData: { 
        ...state.quickTransferData, 
        ...action.payload 
      } 
    };
    case 'SET_BACKUP_REMINDER_OPEN': return { ...state, isBackupReminderOpen: action.payload };
    case 'SET_VIEWING_CARD_STATEMENT': return { ...state, viewingCardStatement: action.payload };
    case 'CLOSE_MONTH': return {
      ...state,
      data: {
        ...state.data,
        closedMonths: [...(state.data.closedMonths || []), action.payload.month],
        monthlySnapshots: { 
          ...(state.data.monthlySnapshots || {}), 
          [action.payload.month]: action.payload.balance 
        }
      }
    };
    case 'TOGGLE_WALLET_VISIBILITY': return {
      ...state,
      walletVisibility: {
        ...state.walletVisibility,
        [action.payload]: !state.walletVisibility[action.payload]
      }
    };
    case 'SET_IS_PROCESSING': return { ...state, isProcessing: action.payload };
    case 'ADD_TRANSACTION': {
      const newTransactions = [...state.data.transactions, action.payload];
      newTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
      return {
        ...state,
        data: { ...state.data, transactions: newTransactions }
      };
    }
    case 'UPDATE_TRANSACTION': {
      const newTransactions = state.data.transactions.map(t => 
        t.id === action.payload.id ? { ...t, ...action.payload.updates } : t
      );
      return {
        ...state,
        data: { ...state.data, transactions: newTransactions }
      };
    }
    case 'DELETE_TRANSACTION': {
      const newTransactions = state.data.transactions.filter(t => t.id !== action.payload);
      return {
        ...state,
        data: { ...state.data, transactions: newTransactions }
      };
    }
    default: return state;
  }
};

const useDebouncedSave = (data, delay = 2000) => {
  const saveTimeoutRef = useRef(null);

  useEffect(() => {
    clearTimeout(saveTimeoutRef.current);
    
    saveTimeoutRef.current = setTimeout(() => {
      try { 
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          ...data,
          lastSaved: new Date().toISOString()
        })); 
        
        if (navigator.onLine) {
          db.collection("finance_2026").doc("user_ahmed_data")
            .set(data, { merge: true })
            .catch(err => console.warn("❌ فشل الحفظ في السحابة:", err));
        }
      } catch(e) {
        console.error('فشل حفظ البيانات:', e);
      }
    }, delay);

    return () => clearTimeout(saveTimeoutRef.current);
  }, [data, delay]);
};

const useIdleCallback = (callback, deps = []) => {
  useEffect(() => {
    if ('requestIdleCallback' in window) {
      const id = requestIdleCallback(() => callback());
      return () => cancelIdleCallback(id);
    } else {
      const id = setTimeout(callback, 1000);
      return () => clearTimeout(id);
    }
  }, deps);
};

const useSmoothScroll = (ref, options = { behavior: 'smooth', block: 'start' }) => {
  const scrollTo = useCallback((elementId) => {
    const element = ref.current?.querySelector(`#${elementId}`);
    element?.scrollIntoView(options);
  }, [ref, options]);

  return scrollTo;
};

const useSecureKey = () => {

    try {
      return localStorage.getItem('secure_key') || crypto.randomUUID();

    }
  });

  useEffect(() => {
    if (!localStorage.getItem('secure_key')) {
      localStorage.setItem('secure_key', key);
    }
  }, [key]);

  return key;
};

const FinanceProvider = ({ children }) => {
  const [state, dispatch] = useReducer(financeReducer, initialState);
  const saveTimeoutRef = useRef(null);

  const saveHistory = useCallback(() => {
    dispatch({ type: 'ADD_TO_HISTORY', payload: JSON.parse(JSON.stringify(state.data)) });
  }, [state.data]);

  const addTransaction = useCallback((transaction) => {
    saveHistory();
    dispatch({ type: 'ADD_TRANSACTION', payload: transaction });
  }, [saveHistory]);

  const updateTransaction = useCallback((id, updates) => {
    saveHistory();
    dispatch({ type: 'UPDATE_TRANSACTION', payload: { id, updates } });
  }, [saveHistory]);

  const deleteTransaction = useCallback((id) => {
    saveHistory();
    dispatch({ type: 'DELETE_TRANSACTION', payload: id });
  }, [saveHistory]);

  // Debounced Save
  useEffect(() => {
    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(() => {
      try { 
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); 
      } catch(e) {
        console.error('فشل حفظ البيانات محلياً:', e);
      }
      
      db.collection("finance_2026").doc("user_ahmed_data")
        .set(state.data, { merge: true })
        .catch(err => console.warn("❌ فشل الحفظ في السحابة:", err));
    }, 1500);

    return () => clearTimeout(saveTimeoutRef.current);
  }, [state.data]);

  // Theme Effect
  useEffect(() => { 
    document.documentElement.classList.toggle('dark', state.isDarkMode); 
    localStorage.setItem('theme', state.isDarkMode ? 'dark' : 'light'); 
  }, [state.isDarkMode]);

  const contextValue = useMemo(() => ({
    state,
    dispatch,
    saveHistory,
    addTransaction,
    updateTransaction,
    deleteTransaction
  }), [state, saveHistory, addTransaction, updateTransaction, deleteTransaction]);

  return (
    <FinanceContext.Provider value={contextValue}>
      {children}
    </FinanceContext.Provider>
  );
};

        const bgColor = n.type === 'success' ? 'gradient-bg-success' : 
                       n.type === 'warning' ? 'gradient-bg-warning' :

            </button>
          </div>
        );
      })}
    </div>
  );
});

          <ShieldCheck size={48} />

// ========== Main App Component ==========
function App() {
  const { state, dispatch, addTransaction, updateTransaction, deleteTransaction } = useFinance();
  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [authLoading, setAuthLoading] = useState(true);
  const mainContentRef = useRef(null);

  const { 
    data, activeTab, selectedMonth, transViewMode, catViewType, isFormOpen, formMode, formData, 
    isLocked, isDarkMode, notifications, isProcessing 
  } = state;

  const { transactions = [], loans = [], cards = [] } = data || {};

  // Auth Observer
  useEffect(() => {
    const unsubscribe = firebase.auth().onAuthStateChanged((user) => {
      setAuthLoading(false);
      if (user && user.email === "ahmedmkh@gmail.com") {
        setIsAuthenticated(true);
      } else {
        setIsAuthenticated(false);
      }
    });
    return () => unsubscribe();
  }, []);

  // Load data from Firebase
  useEffect(() => {
    if (!isAuthenticated) return;
    
    const docRef = db.collection("finance_2026").doc("user_ahmed_data");
    const unsubscribe = docRef.onSnapshot((doc) => {
      if (doc.exists) {
        dispatch({ type: 'SET_DATA', payload: doc.data() });
      }
    });
    
    return () => unsubscribe();
  }, [isAuthenticated, dispatch]);

  // Finance calculations
  const financeSnapshot = useMemo(() => {
    const monthTrans = transactions.filter(t => t.month === selectedMonth);
    
    const actualIncome = monthTrans
      .filter(t => t.type === 'income' && t.status === 'paid')
      .reduce((sum, t) => sum + Number(t.amount || 0), 0);
    
    const cashExpenses = monthTrans
      .filter(t => t.type === 'expense' && t.status === 'paid')
      .reduce((sum, t) => sum + Number(t.amount || 0), 0);
    
    const pendingIncome = monthTrans
      .filter(t => t.type === 'income' && t.status !== 'paid')
      .reduce((sum, t) => sum + Number(t.amount || 0), 0);
    
    const pendingExpenses = monthTrans
      .filter(t => t.type === 'expense' && t.status !== 'paid')
      .reduce((sum, t) => sum + Number(t.amount || 0), 0);
    
    const actualCashInHand = (data.openingBalance2026 || 0) + actualIncome - cashExpenses;
    const projectedClosingBalance = actualCashInHand + pendingIncome - pendingExpenses;
    
    return {
      actualIncome,
      cashExpenses,
      pendingIncome,
      pendingExpenses,
      actualCashInHand,
      projectedClosingBalance
    };
  }, [transactions, selectedMonth, data.openingBalance2026]);

  // Chart data
  const chartData = useMemo(() => MONTHS.map(m => ({
    name: m,
    دخل: transactions.filter(t => t.month === m && t.type === 'income').reduce((a, c) => a + (Number(c.amount) || 0), 0),
    مصروف: transactions.filter(t => t.month === m && t.type === 'expense').reduce((a, c) => a + (Number(c.amount) || 0), 0)
  })), [transactions]);

  // Notifications
  const removeNotification = useCallback((id) => {
    dispatch({ type: 'REMOVE_NOTIFICATION', payload: id });
  }, [dispatch]);

  const addNotification = useCallback((notification) => {
    const exists = notifications.some(n => n.title === notification.title && n.message === notification.message);
    if (exists) return;
    
    const id = Date.now() + Math.random();
    dispatch({ type: 'ADD_NOTIFICATION', payload: { id, ...notification } });
    
    if (!notification.persistent) {
      setTimeout(() => removeNotification(id), 6000);
    }
  }, [notifications, removeNotification, dispatch]);

  // Save transaction handler
  const handleSaveTransaction = useCallback((e) => {
    e.preventDefault();
    
    if (isProcessing) {
      addNotification({
        type: 'warning',
        title: 'جاري المعالجة',
        message: 'يرجى الانتظار حتى تنتهي العملية الحالية'
      });
      return;
    }

    dispatch({ type: 'SET_IS_PROCESSING', payload: true });

    setTimeout(() => {
      try {
        if (!formData.amount || Number(formData.amount) <= 0) {
          addNotification({
            type: 'error',
            title: 'خطأ في المدخلات',
            message: 'يرجى إدخال مبلغ صحيح أكبر من صفر'
          });
          dispatch({ type: 'SET_IS_PROCESSING', payload: false });
          return;
        }

        const transaction = {
          ...formData,
          id: getSafeId(),
          amount: Number(formData.amount),
          month: selectedMonth,
          date: formData.date || getLocalISODate()
        };

        if (formMode === 'add') {
          addTransaction(transaction);
          addNotification({
            type: 'success',
            title: 'تمت الإضافة بنجاح',
            message: `تم ${formData.type === 'income' ? 'إضافة دخل' : 'خصم مصروف'} بقيمة ${formData.amount} ج.م`
          });
        } else {
          updateTransaction(formData.id, transaction);
          addNotification({
            type: 'success',
            title: 'تم التعديل بنجاح',
            message: 'تم تحديث العملية بنجاح'
          });
        }

        dispatch({ type: 'SET_FORM_OPEN', payload: false });
        dispatch({ type: 'SET_IS_PROCESSING', payload: false });
      } catch (error) {
        console.error('Error saving transaction:', error);
        addNotification({
          type: 'error',
          title: 'خطأ في الحفظ',
          message: 'حدث خطأ أثناء حفظ العملية'
        });
        dispatch({ type: 'SET_IS_PROCESSING', payload: false });
      }
    }, 300);
  }, [formData, formMode, selectedMonth, isProcessing, addTransaction, updateTransaction, addNotification, dispatch]);

  // Delete transaction
  const handleDelete = useCallback((id) => {
    dispatch({
      type: 'SHOW_CONFIRM',
      title: 'تأكيد الحذف',
      message: 'هل أنت متأكد من حذف هذه العملية نهائياً؟',
      onConfirm: () => {
        deleteTransaction(id);
        addNotification({ type: 'success', title: 'تم الحذف بنجاح' });
      }
    });
  }, [deleteTransaction, addNotification, dispatch]);

  // Export CSV
  const handleExportCSV = useCallback(() => {
    const bom = "\uFEFF";
    const header = "التاريخ,النوع,الفئة,الوصف,المبلغ,الحالة,الشهر\n";
    const rows = transactions.map(t => 
      `${t.date},${t.type},${t.category},"${escapeHtml(t.description || '')}",${t.amount},${t.status || 'pending'},${t.month}`
    ).join("\n");
    
    const blob = new Blob([bom + header + rows], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `transactions_${CURRENT_YEAR}_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }, [transactions]);

  // Export JSON
  const handleExport = useCallback(() => {
    const blob = new Blob([JSON.stringify({data: state.data, budgets: state.budgets})], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `finance_backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    
    addNotification({ type: 'success', title: 'تم التصدير', message: 'تم تحميل النسخة الاحتياطية بنجاح' });
  }, [state.data, state.budgets, addNotification]);

  // Import JSON
  const handleImport = useCallback((e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        if (parsed.data) {
          dispatch({ type: 'SET_DATA', payload: parsed.data });
          if (parsed.budgets) dispatch({ type: 'SET_BUDGETS', payload: parsed.budgets });
          addNotification({ type: 'success', title: 'تم الاستيراد بنجاح' });
        }
      } catch (err) {
        console.error('Import error:', err);
        addNotification({ type: 'error', title: 'ملف غير صالح', message: 'الملف ليس بصيغة JSON صحيحة' });
      }
    };
    reader.readAsText(file);
  }, [dispatch, addNotification]);

  // Reset data
  const resetData = useCallback(() => {
    dispatch({
      type: 'SHOW_CONFIRM',
      title: 'تحذير هام',
      message: 'هل أنت متأكد تماماً من مسح جميع البيانات؟ لا يمكن التراجع عن هذا الإجراء.',
      onConfirm: () => {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem('budgets');
        localStorage.removeItem('fawryData');
        localStorage.removeItem('etisalatData');
        window.location.reload();
      }
    });
  }, [dispatch]);

  // Render dashboard
  const renderDashboard = () => (
    <div className="space-y-8 animate-fadeIn">
      {/* Opening Balance */}
      <div className="glass bg-blue-50/50 dark:bg-blue-900/10 p-6 rounded-2xl border border-blue-100 dark:border-blue-900/30 shadow-sm animate-fadeIn">
        <div className="flex flex-col md:flex-row items-center justify-between gap-4">
          <div>
            <h3 className="text-lg font-bold text-blue-900 dark:text-blue-100 flex items-center gap-2">
              <Wallet size={20} className="text-blue-600 dark:text-blue-400" />
              الرصيد الافتتاحي لعام {CURRENT_YEAR}
            </h3>
            <p className="text-sm text-slate-600 dark:text-slate-400 mt-1">
              سيتم اعتماد هذا المبلغ كنقطة بداية لحسابات شهر يناير.
            </p>
          </div>
          <div className="flex items-center gap-3 bg-white dark:bg-slate-800 p-2 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
            <input 
              type="number" 
              value={data.openingBalance2026 || ''}
              onChange={(e) => {
                const value = e.target.value;
                if (value === '' || Number(value) >= 0) {
                  dispatch({ type: 'UPDATE_OPENING_BALANCE', payload: Number(value) || 0 });
                }
              }}
              className="w-32 md:w-48 p-2 bg-transparent text-center font-black text-blue-600 outline-none text-lg placeholder:text-slate-300" 
              placeholder="0.00"
            />
            <button 
              onClick={() => {
                addNotification({ 
                  type: 'success', 
                  title: 'تم الحفظ', 
                  message: 'تم تحديث الرصيد الافتتاحي وتحديث الحسابات' 
                });
              }}
              className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors flex items-center gap-2"
            >
              <Save size={16} /> حفظ
            </button>
          </div>
        </div>
      </div>

      {/* Quick Balance */}
      <QuickBalanceOverview 
        financeSnapshot={financeSnapshot}
        currentFawryBalance={0}
        currentEtisalatBalance={0}
        walletVisibility={state.walletVisibility}
        onToggleVisibility={(key) => dispatch({ type: 'TOGGLE_WALLET_VISIBILITY', payload: key })}
      />

      {/* Quick Actions */}
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 no-print">
        <button
          onClick={() => {
            dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
            dispatch({ type: 'SET_FORM_DATA', payload: { 
              type: 'income', 
              amount: '', 
              date: getLocalISODate(), 
              month: selectedMonth, 
              method: 'cash', 
              subType: 'deposit',
              category: ''
            } });
            dispatch({ type: 'SET_FORM_OPEN', payload: true });
          }}
          className="gradient-bg-success text-white p-6 rounded-2xl flex flex-col items-center justify-center gap-3 hover:shadow-xl transition-all active:scale-[0.98] group"
        >
          <TrendingUp size={28} className="group-hover:scale-110 transition-transform" />
          <span className="font-bold">تسجيل دخل</span>
        </button>

        <button
          onClick={() => {
            dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
            dispatch({ type: 'SET_FORM_DATA', payload: { 
              type: 'expense', 
              amount: '', 
              date: getLocalISODate(), 
              month: selectedMonth, 
              method: 'cash', 
              subType: 'withdrawal',
              category: ''
            } });
            dispatch({ type: 'SET_FORM_OPEN', payload: true });
          }}
          className="gradient-bg-danger text-white p-6 rounded-2xl flex flex-col items-center justify-center gap-3 hover:shadow-xl transition-all active:scale-[0.98] group"
        >
          <TrendingDown size={28} className="group-hover:scale-110 transition-transform" />
          <span className="font-bold">تسجيل مصروف</span>
        </button>

        <button
          onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: true })}
          className="gradient-bg-primary text-white p-6 rounded-2xl flex items-center justify-center gap-3 hover:shadow-xl transition-all active:scale-[0.98] group"
        >
          <div className="bg-white/20 p-3 rounded-xl group-hover:rotate-12 transition-transform duration-300">
            <ArrowRightLeft size={24} />
          </div>
          <span className="font-bold text-lg">تحويل فوري</span>
        </button>
      </div>

      <MonthSelector 
        selectedMonth={selectedMonth}
        onSelectMonth={(month) => dispatch({ type: 'SET_SELECTED_MONTH', payload: month })}
        className="no-print"
      />

      {/* Stats Cards */}
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <EnhancedStatCard
          title="السيولة الحالية"
          amount={financeSnapshot.actualCashInHand}
          icon={Wallet}
          subtitle="الرصيد النقدي المتاح"
        />

        <EnhancedStatCard
          title="الدخل المعلّق"
          amount={financeSnapshot.pendingIncome}
          icon={PendingCircle}
          subtitle="مبالغ متوقعة لم تستلم بعد"
        />

        <EnhancedStatCard
          title="المصاريف المعلقة"
          amount={-financeSnapshot.pendingExpenses}
          icon={Clock}
          subtitle="التزامات لم تسدد بعد"
        />

        <div className="stat-card stat-card-balance cursor-pointer hover-lift">
          <div className="flex justify-between items-center">
            <div>
              <p className="text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">
                الرصيد المتوقع
              </p>
              <h3 className={`text-2xl font-black ${
                financeSnapshot.projectedClosingBalance >= 0 
                ? 'text-blue-600' 
                : 'text-red-600'
              }`}>
                {Math.round(financeSnapshot.projectedClosingBalance).toLocaleString()}
                <span className="text-sm font-medium text-slate-400 mr-1">ج.م</span>
              </h3>
            </div>
            <div className="p-3 rounded-xl bg-blue-50 dark:bg-blue-900/20 text-blue-600">
              <TrendingUp size={24} />
            </div>
          </div>
          <div className="mt-4 text-xs text-slate-500">
            {financeSnapshot.projectedClosingBalance >= 0 ? '✅ وضع مالي آمن' : '⚠️ تحتاج لمراجعة المصروفات'}
          </div>
        </div>
      </div>

      {/* Charts */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div className="glass p-6 rounded-2xl">
          <div className="flex justify-between items-center mb-6">
            <h3 className="text-lg font-bold dark:text-white flex items-center gap-2">
              <BarChart3 className="text-blue-500" />
              التدفق النقدي الشهري
            </h3>
            <span className="text-sm text-slate-500">{CURRENT_YEAR}</span>
          </div>
          <div className="h-64">
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={chartData}>
                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" opacity={0.5} />
                <XAxis dataKey="name" stroke="#94a3b8" fontSize={12} axisLine={false} tickLine={false} />
                <YAxis stroke="#94a3b8" fontSize={12} axisLine={false} tickLine={false} />
                <Tooltip 
                  cursor={{ fill: 'transparent' }}
                  contentStyle={{ 
                    borderRadius: '12px', 
                    border: 'none', 
                    boxShadow: '0 10px 30px -5px rgba(0,0,0,0.1)',
                    backgroundColor: isDarkMode ? '#1E293B' : 'white'
                  }}
                  formatter={(value) => `${Number(value).toLocaleString()} ج.م`}
                />
                <Legend />
                <Bar dataKey="دخل" fill="#10B981" radius={[8, 8, 8, 8]} barSize={10} />
                <Bar dataKey="مصروف" fill="#EF4444" radius={[8, 8, 8, 8]} barSize={10} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>

        <div className="glass p-6 rounded-2xl">
          <div className="flex justify-between items-center mb-6">
            <h3 className="text-lg font-bold dark:text-white flex items-center gap-2">
              <PieChart className="text-purple-500" />
              توزيع المصروفات
              <span className="text-sm font-normal text-slate-500">({selectedMonth})</span>
            </h3>
          </div>
          <div className="h-64">
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie 
                  data={transactions
                    .filter(t => t.type === 'expense' && t.month === selectedMonth && Number(t.amount) > 0)
                    .reduce((acc, t) => {
                      const existing = acc.find(item => item.name === t.category);
                      if (existing) {
                        existing.value += Number(t.amount);
                      } else {
                        acc.push({ name: t.category, value: Number(t.amount) });
                      }
                      return acc;
                    }, [])
                    .sort((a, b) => b.value - a.value)
                    .slice(0, 5)}
                  cx="50%" 
                  cy="45%" 
                  innerRadius={70} 
                  outerRadius={110} 
                  paddingAngle={4} 
                  dataKey="value" 
                  cornerRadius={6}
                >
                  {transactions
                    .filter(t => t.type === 'expense' && t.month === selectedMonth && Number(t.amount) > 0)
                    .reduce((acc, t) => {
                      const existing = acc.find(item => item.name === t.category);
                      if (existing) {
                        existing.value += Number(t.amount);
                      } else {
                        acc.push({ name: t.category, value: Number(t.amount) });
                      }
                      return acc;
                    }, [])
                    .sort((a, b) => b.value - a.value)
                    .slice(0, 5)
                    .map((entry, index) => (
                      <Cell key={`cell-${index}`} fill={['#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6'][index]} stroke="none" />
                    ))}
                </Pie>
                <Tooltip 
                  contentStyle={{ 
                    borderRadius: '12px', 
                    border: 'none', 
                    boxShadow: '0 10px 30px -5px rgba(0,0,0,0.1)',
                    backgroundColor: isDarkMode ? '#1E293B' : 'white'
                  }}
                  formatter={(value) => `${Number(value).toLocaleString()} ج.م`}
                />
                <Legend layout="vertical" verticalAlign="middle" align="right" iconType="circle" />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>
    </div>
  );

  // Render transactions
  const renderTransactionsView = () => (
    <div className="space-y-8 animate-fadeIn">
      <div className="glass p-2 rounded-2xl w-fit mx-auto mb-8 flex no-print">
        <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'expense' })} className={`px-12 py-4 rounded-xl text-lg font-bold transition-all duration-300 flex items-center gap-3 ${transViewMode === 'expense' ? 'bg-red-50 text-red-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>
          <TrendingDown size={24} /> المصروفات
        </button>
        <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'income' })} className={`px-12 py-4 rounded-xl text-lg font-bold transition-all duration-300 flex items-center gap-3 ${transViewMode === 'income' ? 'bg-emerald-50 text-emerald-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>
          <TrendingUp size={24} /> الدخل
        </button>
      </div>

      <MonthSelector 
        selectedMonth={selectedMonth}
        onSelectMonth={(month) => dispatch({ type: 'SET_SELECTED_MONTH', payload: month })}
        className="no-print mb-6"
      />

      <div className="glass p-4 rounded-2xl no-print">
        <div className="relative">
          <Search className="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400" size={20} />
          <OptimizedInput
            placeholder="🔍 ابحث في المعاملات..."
            value={state.searchTerm}
            onChange={(value) => dispatch({ type: 'SET_SEARCH_TERM', payload: value })}
            className="w-full p-4 pr-12 bg-transparent border-0 focus:outline-none text-lg"
          />
        </div>
      </div>

      <TransactionErrorBoundary>
        <div className="glass rounded-2xl overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-right text-sm">
              <thead className="bg-slate-50/80 dark:bg-slate-800/50 backdrop-blur-sm">
                <tr>
                  <th className="p-6 font-bold text-slate-400 text-xs uppercase tracking-widest">التاريخ</th>
                  <th className="p-6 font-bold text-slate-400 text-xs uppercase tracking-widest">الوصف</th>
                  <th className="p-6 font-bold text-slate-400 text-xs uppercase tracking-widest">الفئة</th>
                  <th className="p-6 font-bold text-slate-400 text-xs uppercase tracking-widest">المبلغ</th>
                  <th className="p-6 font-bold text-slate-400 text-xs uppercase tracking-widest">الحالة</th>
                  <th className="p-6 font-bold text-slate-400 text-xs uppercase tracking-widest">إجراءات</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-bold">
                {transactions
                  .filter(t => t.type === transViewMode && t.month === selectedMonth)
                  .filter(t => {
                    const term = normalizeText(state.searchTerm);
                    if (!term) return true;
                    
                    return normalizeText(t.description).includes(term) ||
                           normalizeText(t.category).includes(term) ||
                           normalizeText(t.amount.toString()).includes(term);
                  })
                  .sort((a, b) => new Date(b.date) - new Date(a.date))
                  .map(t => (
                    <tr key={t.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                      <td className="p-6 text-slate-500">{t.date}</td>
                      <td className="p-6 text-slate-800 dark:text-white">{t.description || '-'}</td>
                      <td className="p-6">
                        <span className="bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-lg text-xs">
                          {t.category}
                        </span>
                      </td>
                      <td className={`p-6 font-black ${t.type === 'income' ? 'text-emerald-600' : 'text-red-600'}`}>
                        {Number(t.amount).toLocaleString()} ج.م
                      </td>
                      <td className="p-6">
                        <span className={`px-3 py-1 rounded-lg text-xs font-bold ${
                          t.status === 'paid' ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'
                        }`}>
                          {t.status === 'paid' ? 'مدفوع' : 'معلق'}
                        </span>
                      </td>
                      <td className="p-6">
                        <div className="flex gap-2">
                          <button
                            onClick={() => {
                              dispatch({ type: 'SET_FORM_MODE', payload: 'edit' });
                              dispatch({ type: 'SET_FORM_DATA', payload: t });
                              dispatch({ type: 'SET_FORM_OPEN', payload: true });
                            }}
                            className="p-2 text-blue-500 hover:bg-blue-50 rounded-lg transition-colors"
                            title="تعديل"
                          >
                            <Edit size={16} />
                          </button>
                          <button
                            onClick={() => handleDelete(t.id)}
                            className="p-2 text-red-500 hover:bg-red-50 rounded-lg transition-colors"
                            title="حذف"
                          >
                            <Trash2 size={16} />
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
              </tbody>
            </table>
          </div>
        </div>
      </TransactionErrorBoundary>
    </div>
  );

  // Render active view
  const renderActiveView = () => {
    switch (activeTab) {
      case 'dashboard':
        return renderDashboard();
      case 'transactions':
        return renderTransactionsView();
      default:
        return renderDashboard();
    }
  };

  // Enhanced Sidebar
  const EnhancedSidebar = () => (
    <aside className="w-80 glass border-l-0 dark:border-r border-white/20 hidden lg:flex flex-col p-6 z-40 relative no-print">
      <div className="flex items-center gap-4 mb-8 p-4 rounded-2xl gradient-border">
        <div className="gradient-bg-primary p-3 rounded-2xl text-white shadow-lg">
          <Wallet size={28} />
        </div>
        <div>
          <h2 className="font-black text-xl text-slate-900 dark:text-white">المحفظة الذكية</h2>
          <p className="text-xs text-slate-500 font-bold">V51 Professional</p>
        </div>
      </div>

      <nav className="space-y-2 flex-1 scroll-hide overflow-y-auto">
        {[
          { id: 'dashboard', label: 'لوحة التحكم', icon: LayoutDashboard },
          { id: 'transactions', label: 'سجل المعاملات', icon: ArrowUpRight },
          { id: 'categories', label: 'الفئات والميزانية', icon: Layers },
          { id: 'loans', label: 'القروض والديون', icon: Banknote },
          { id: 'cards', label: 'البطاقات والمحافظ', icon: CreditCard },
          { id: 'planner', label: 'المخطط الاستراتيجي', icon: Target },
          { id: 'calendar', label: 'الأجندة والمواعيد', icon: CalendarDays }
        ].map(item => (
          <button 
            key={item.id} 
            type="button" 
            onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })}
            className={`w-full flex items-center gap-4 px-4 py-3 rounded-xl transition-all duration-300 font-medium ${
              activeTab === item.id 
              ? 'gradient-bg-primary text-white shadow-lg' 
              : 'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 hover:text-slate-700'
            }`}
          >
            <item.icon size={20} className={activeTab === item.id ? 'text-white' : ''} />
            <span className="text-sm">{item.label}</span>
            {activeTab === item.id && (
              <div className="ml-auto w-2 h-2 bg-white rounded-full animate-pulse" />
            )}
          </button>
        ))}
      </nav>

      <div className="mt-8 p-4 rounded-2xl bg-slate-50/50 dark:bg-slate-800/30">
        <h4 className="text-sm font-bold text-slate-500 mb-3">الإجراءات السريعة</h4>
        <div className="space-y-2">
          <button 
            type="button"
            onClick={() => {
              dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
              dispatch({ type: 'SET_FORM_DATA', payload: { 
                type: 'income', 
                amount: '', 
                date: getLocalISODate(), 
                month: selectedMonth, 
                method: 'cash', 
                subType: 'deposit',
                category: '' 
              } });
              dispatch({ type: 'SET_FORM_OPEN', payload: true });
            }}
            className="w-full flex items-center gap-2 px-3 py-2 rounded-lg bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 hover:bg-emerald-100 transition-colors text-sm font-medium"
          >
            <Plus size={16} /> تسجيل دخل جديد
          </button>
          <button 
            type="button"
            onClick={() => {
              dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
              dispatch({ type: 'SET_FORM_DATA', payload: { 
                type: 'expense', 
                amount: '', 
                date: getLocalISODate(), 
                month: selectedMonth, 
                method: 'cash', 
                subType: 'withdrawal',
                category: '' 
              } });
              dispatch({ type: 'SET_FORM_OPEN', payload: true });
            }}
            className="w-full flex items-center gap-2 px-3 py-2 rounded-lg bg-red-50 dark:bg-red-900/20 text-red-600 hover:bg-red-100 transition-colors text-sm font-medium"
          >
            <Plus size={16} /> تسجيل مصروف جديد
          </button>
        </div>
      </div>
    </aside>
  );

  // Professional Header
  const ProfessionalHeader = () => (
    <header className="flex flex-col md:flex-row justify-between items-center gap-6 mb-8">
      <div className="flex-1">
        <div className="flex items-center gap-4 mb-2">
          <div className="gradient-bg-primary p-3 rounded-2xl text-white shadow-lg">
            <Wallet size={28} />
          </div>
          <div>
            <h1 className="text-3xl font-black text-slate-900 dark:text-white tracking-tight">
              محفظتي المالية
            </h1>
            <p className="text-sm text-slate-500 font-medium mt-1">
              إدارة مالية ذكية • {CURRENT_YEAR} • الإصدار الاحترافي
            </p>
          </div>
        </div>
      </div>

      <div className="flex flex-wrap gap-3">
        <button 
          type="button" 
          onClick={() => dispatch({ type: 'SET_AI_MODAL_OPEN', payload: true })}
          className="gradient-bg-primary text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all flex items-center gap-2"
        >
          <Sparkles size={20} /> المساعد الذكي
        </button>

        <div className="flex bg-white dark:bg-slate-800 p-1 rounded-xl shadow-md">
          <button 
            type="button" 
            onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: false })}
            className={`p-3 rounded-lg transition-all ${!isDarkMode ? 'bg-blue-50 text-blue-600 shadow-sm' : 'text-slate-400'}`}
          >
            <Sun size={20} />
          </button>
          <button 
            type="button" 
            onClick={() => dispatch({ type: 'TOGGLE_DARK_MODE', payload: true })}
            className={`p-3 rounded-lg transition-all ${isDarkMode ? 'bg-slate-700 text-blue-400 shadow-sm' : 'text-slate-400'}`}
          >
            <Moon size={20} />
          </button>
        </div>
      </div>
    </header>
  );

  if (authLoading) {
    return (
      <div className="flex h-screen items-center justify-center bg-slate-900">
        <div className="text-center">
          <div className="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
          <p className="text-white text-lg font-bold">جاري التحقق من المصادقة...</p>
        </div>
      </div>
    );
  }

  if (!isAuthenticated) {
    return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
  }

  return (
    <div className="flex h-screen overflow-hidden text-slate-800 dark:text-slate-100 font-sans">
      <ProfessionalTicker />
      
      <NotificationCenter 
        notifications={notifications} 
        removeNotification={removeNotification} 
      />

      {/* Processing Overlay */}
      {isProcessing && (
        <div className="processing-overlay">
          <div className="processing-spinner mb-4"></div>
          <h3 className="text-xl font-bold mb-2">جاري تطبيق العملية</h3>
          <p className="text-sm opacity-80 mb-6">قد تستغرق العملية بضع ثوانٍ</p>
          <button
            onClick={() => {
              dispatch({ type: 'SET_IS_PROCESSING', payload: false });
              addNotification({ 
                type: 'info', 
                title: 'تم الإلغاء', 
                message: 'تم إلغاء العملية' 
              });
            }}
            className="px-6 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold transition-colors"
          >
            إلغاء العملية
          </button>
        </div>
      )}

      <ConfirmDialog />

      {/* Bottom Navigation */}
      <div className="bottom-nav-container no-print">
        <div className="scrollable-nav scroll-hide">
          {[
            { id: 'dashboard', label: 'الرئيسية', icon: LayoutDashboard },
            { id: 'transactions', label: 'المعاملات', icon: ArrowUpRight },
            { id: 'cards', label: 'المحافظ', icon: CreditCard },
            { id: 'loans', label: 'القروض', icon: Banknote },
            { id: 'planner', label: 'المخطط', icon: CalendarDays },
            { id: 'calendar', label: 'الأجندة', icon: CalendarDays }
          ].map(item => (
            <button key={item.id} type="button" onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} className={`nav-btn ${activeTab === item.id ? 'active' : ''}`} aria-label={item.label}>
              <item.icon size={24} />
              <span>{item.label}</span>
              {activeTab === item.id && (<div className="absolute -top-1 w-1.5 h-1.5 bg-white rounded-full animate-pulse" />)}
            </button>
          ))}
          
          <div className="v-line"></div>
          
          <button type="button" onClick={handleExportCSV} className="nav-btn text-emerald-600 hover:bg-emerald-50" aria-label="تصدير CSV">
            <FileSpreadsheet size={24} /><span>CSV</span>
          </button>
          
          <button type="button" onClick={handleExport} className="nav-btn text-blue-600 hover:bg-blue-50" aria-label="نسخة احتياطية">
            <Download size={24} /><span>حفظ</span>
          </button>
          
          <label className="nav-btn cursor-pointer text-purple-600 hover:bg-purple-50">
            <input type="file" accept=".json" onChange={handleImport} className="hidden" />
            <Upload size={24} /><span>جلب</span>
          </label>
          
          <button type="button" onClick={resetData} className="nav-btn text-red-500 hover:bg-red-50" aria-label="إعادة تعيين">
            <RefreshCcw size={24} /><span>إعادة</span>
          </button>
          
          <div className="v-line"></div>
          
          <button type="button" onClick={() => mainContentRef.current?.scrollTo({top:0, behavior:'smooth'})} className="nav-btn" aria-label="التمرير إلى الأعلى">
            <ArrowUp size={24} /><span>أعلى</span>
          </button>
          
          <button type="button" onClick={() => dispatch({ type: 'SET_IS_LOCKED', payload: true })} className="nav-btn text-amber-500 hover:bg-amber-50" aria-label="قفل التطبيق">
            <Lock size={24} /><span>قفل</span>
          </button>
          
          <button type="button" onClick={() => {
            firebase.auth().signOut();
            setIsAuthenticated(false);
          }} className="nav-btn text-red-600 hover:bg-red-50" aria-label="تسجيل الخروج">
            <LogOut size={24} /><span>خروج</span>
          </button>
        </div>
      </div>

      {/* FAB Button */}
      {!isLocked && (
        <button 
          type="button" 
          onClick={() => {
            dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
            dispatch({ type: 'SET_FORM_DATA', payload: { 
              type: 'expense', 
              category: '', 
              amount: '', 
              quantity: 1, 
              unitPrice: '', 
              date: getLocalISODate(), 
              month: selectedMonth, 
              method: 'cash', 
              subType: 'withdrawal' 
            } });
            dispatch({ type: 'SET_FORM_OPEN', payload: true });
          }} 
          className="fab no-print" 
          title="إضافة عملية جديدة" 
          aria-label="إضافة عملية جديدة"
        >
          <Plus size={32} />
        </button>
      )}

      <EnhancedSidebar />

      {/* Main Content */}
      <main ref={mainContentRef} className="flex-1 overflow-y-auto p-4 lg:p-8 relative scroll-smooth pt-12">
        {isLocked ? (
          <div className="lock-screen backdrop-blur-3xl animate-fadeIn no-print">
            <Lock size={80} className="mb-8 text-blue-500 animate-bounce-slight" />
            <h2 className="text-4xl font-black mb-8 tracking-tight">التطبيق مقفل</h2>
            <button 
              type="button" 
              onClick={() => dispatch({ type: 'SET_IS_LOCKED', payload: false })}
              className="gradient-bg-primary text-white px-16 py-5 rounded-full font-bold shadow-2xl flex items-center gap-3 transition-all hover:scale-105 active:scale-95"
            >
              <Unlock size={24} /> فتح التطبيق
            </button>
          </div>
        ) : (
          <div className="max-w-7xl mx-auto space-y-8 animate-fadeIn pb-24">
            <ProfessionalHeader />
            {renderActiveView()}
          </div>
        )}
      </main>

      {/* Transaction Form Modal */}
      {isFormOpen && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-fadeIn border border-white/20">
            <div className="p-8 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/30">
              <h3 className="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                <div className="gradient-bg-primary p-2 rounded-xl text-white shadow-lg">
                  <Plus size={20} />
                </div>
                {formMode === 'add' ? 'إضافة عملية' : 'تعديل عملية'}
              </h3>
              <button type="button" onClick={() => dispatch({ type: 'SET_FORM_OPEN', payload: false })} className="text-slate-400 hover:text-red-500 p-2 hover:bg-red-50 rounded-xl transition-colors" aria-label="إغلاق">
                <X size={24} />
              </button>
            </div>
            
            <form onSubmit={handleSaveTransaction} className="p-8 space-y-6" id="transaction-form">
              <div className="grid grid-cols-2 gap-6">
                <div>
                  <label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2">النوع</label>
                  <select className="input-field font-bold" value={formData.type} onChange={(e) => {
                    const newType = e.target.value;
                    const newSubType = newType === 'income' ? 'deposit' : 'withdrawal';
                    dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, type: newType, subType: newSubType } });
                  }}>
                    <option value="expense">مصروف 💸</option>
                    <option value="income">دخل 💰</option>
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2">الفئة</label>
                  <select className="input-field font-bold" value={formData.category} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, category: e.target.value } })} required>
                    <option value="">اختر التصنيف...</option>
                    <option value="راتب شهري">راتب شهري</option>
                    <option value="مصروفات المعيشة اليومية">مصروفات المعيشة اليومية</option>
                    <option value="الاتصالات وشحن الهواتف المحمولة">الاتصالات وشحن الهواتف المحمولة</option>
                    <option value="مواصلات">مواصلات</option>
                    <option value="تسوق">تسوق</option>
                    <option value="ترفيه">ترفيه</option>
                    <option value="أخرى">أخرى</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2">المبلغ</label>
                <input 
                  type="number" 
                  required 
                  step="0.01" 
                  min="0.01" 
                  className="input-field text-xl font-black text-blue-600" 
                  value={formData.amount} 
                  onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, amount: e.target.value } })} 
                />
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2">التاريخ</label>
                  <input 
                    type="date" 
                    required 
                    className="input-field text-sm font-bold" 
                    value={formData.date} 
                    onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, date: e.target.value } })} 
                  />
                </div>
                <div>
                  <label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2">طريقة الدفع</label>
                  <select className="input-field text-sm font-bold" value={formData.method} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, method: e.target.value } })}>
                    <option value="cash">نقدي</option>
                    <option value="card">بطاقة</option>
                    <option value="transfer">تحويل</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-sm font-bold mb-3 text-slate-400 uppercase mb-2">الوصف</label>
                <OptimizedInput
                  type="text"
                  value={formData.description}
                  onChange={(value) => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: value } })}
                  placeholder="تفاصيل إضافية..."
                  className="input-field font-bold"
                />
              </div>

              <button type="submit" className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-black text-lg shadow-xl hover:shadow-2xl hover:scale-[1.02] active:scale-95 transition-all mt-4 relative overflow-hidden" disabled={isProcessing}>
                {isProcessing ? (
                  <>
                    <div className="absolute inset-0 bg-blue-600 flex items-center justify-center">
                      <div className="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <span className="invisible">حفظ العملية</span>
                  </>
                ) : 'حفظ العملية'}
              </button>
            </form>
          </div>
        </div>
      )}

      {/* AI Modal */}
      {state.isAiModalOpen && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden animate-fadeIn border border-purple-500/20 flex flex-col max-h-[90vh]">
            <div className="p-8 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center gradient-border">
              <h3 className="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                <div className="gradient-bg-primary p-2 rounded-xl text-white shadow-lg">
                  <Bot size={20} />
                </div>
                المساعد المالي الذكي
              </h3>
              <button type="button" onClick={() => dispatch({ type: 'SET_AI_MODAL_OPEN', payload: false })} className="text-slate-400 hover:text-red-500 p-2 hover:bg-red-50 rounded-xl transition-colors">
                <X size={24} />
              </button>
            </div>
            
            <div className="p-8 flex-1 overflow-y-auto scroll-hide">
              <div className="space-y-4">
                <p className="text-slate-600 dark:text-slate-300">
                  يمكن للمساعد الذكي تحليل بياناتك المالية وتقديم توصيات مخصصة.
                </p>
                
                <button 
                  type="button" 
                  onClick={() => {
                    const totalIncome = transactions
                      .filter(t => t.type === 'income' && t.status === 'paid')
                      .reduce((a, c) => a + (Number(c.amount) || 0), 0);
                    
                    const totalExpense = transactions
                      .filter(t => t.type === 'expense' && t.status === 'paid')
                      .reduce((a, c) => a + (Number(c.amount) || 0), 0);
                    
                    const ratio = totalIncome > 0 ? Math.round((totalExpense / totalIncome) * 100) : 0;
                    
                    dispatch({ 
                      type: 'SET_AI_RESPONSE', 
                      payload: `تحليل سريع: إجمالي دخلك المسجل ${totalIncome.toLocaleString()} ج.م ومصروفاتك ${totalExpense.toLocaleString()} ج.م (${ratio}%). وضعك المالي ${ratio > 90 ? 'حرج، تحتاج لتقليل النفقات' : ratio > 70 ? 'يحتاج لمراجعة' : 'جيد ومستقر'}.` 
                    });
                  }}
                  className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold shadow-lg hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3"
                >
                  <BarChart3 size={20} /> تحليل الوضع المالي الحالي
                </button>
                
                {state.aiResponse && (
                  <div className="bg-slate-50 dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 animate-fadeIn">
                    <p className="text-slate-700 dark:text-slate-200 leading-relaxed font-medium">
                      {state.aiResponse}
                    </p>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ========== Wrapped App ==========
const AppWrapper = () => (
  <FinanceProvider>
    <App />
  </FinanceProvider>
);

// ========== Initialize App ==========
const rootElement = document.getElementById('root');
if (rootElement) {
  setTimeout(() => {
    const loadingElement = document.getElementById('loading');
    if (loadingElement) {
      loadingElement.style.display = 'none';
    }
  }, 2000);

  createRoot(rootElement).render(
    <ErrorBoundary>
      <AppWrapper />
    </ErrorBoundary>
  );
}
</script>
</body>
</html>
