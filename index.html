      <div className="grid grid-cols-3 md:grid-cols-6 gap-2">
        {Object.entries(AUDIT).slice(0, 6).map(([key, action]) => (
          <button key={action} onClick={() => setFilterAction(filterAction === action ? 'all' : action)} className="stat-card text-center py-2"
            style={filterAction === action ? { background: `${AUDIT_COLORS[action]}15`, borderColor: AUDIT_COLORS[action] } : {}}>
            <p className="text-[9px] font-bold mb-0.5" style={{ color: AUDIT_COLORS[action] }}>{AUDIT_LABELS[action]}</p>
            <p className="text-base font-black money tabular">{stats[action] || 0}</p>

      <div className="card py-3">
        <div className="flex gap-2">
          <div className="relative flex-1">
            <Search className="absolute right-3 top-1/2 -translate-y-1/2" size={14} style={{ color: 'var(--text-muted)' }} />
            <input type="text" placeholder="ابحث في السجل..." className="input-field pr-9 text-sm py-2.5" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
          </div>
          {filterAction !== 'all' && (<button onClick={() => setFilterAction('all')} className="btn btn-secondary text-xs px-3"><X size={14} /> مسح</button>)}
        </div>
      </div>

      {filtered.length === 0 ? (
        <div className="card text-center p-12">
          <History size={40} className="text-slate-400 mx-auto mb-3" />
          <h3 className="text-base font-black mb-2">{log.length === 0 ? 'السجل فارغ' : 'لا نتائج مطابقة'}</h3>
          <p className="text-xs" style={{ color: 'var(--text-muted)' }}>{log.length === 0 ? 'سيبدأ السجل من الآن مع كل عملية جديدة' : 'جرّب تغيير الفلتر أو البحث'}</p>
        </div>
      ) : (
        <div className="space-y-2">
          {filtered.slice(0, 200).map(entry => {
            const d = new Date(entry.ts);
            const dateStr = d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short', year: 'numeric' });

            const color = AUDIT_COLORS[entry.action] || '#64748B';
            return (
              <div key={entry.id} className="audit-item" style={{ color }}>
                <div className="audit-dot" style={{ background: color, color }} />
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap mb-0.5">
                    <span className="font-black text-xs" style={{ color }}>{AUDIT_LABELS[entry.action] || entry.action}</span>
                    <span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{entry.entity}</span>

const SettingsView = memo(({
  data, accountsData, cards, budgets, dispatch, saveHistory, addNotification,
  onResetPersonalData, onForceSave, forceSaveState
}) => {
  const [localAccounts, setLocalAccounts] = useState(() => JSON.parse(JSON.stringify(accountsData)));
  const [localCards, setLocalCards] = useState(() => cards.map(c => ({ ...c })));
  const [activeSection, setActiveSection] = useState('accounts');
  const [hasChanges, setHasChanges] = useState(false);
  const [driveBusy, setDriveBusy] = useState(false);
  const [driveStatus, setDriveStatus] = useState('');
  const [folderIdInput, setFolderIdInput] = useState(() => localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID);
  const isDirtyRef = useRef(false);

  useEffect(() => {
    if (isDirtyRef.current) return;
    setLocalAccounts(JSON.parse(JSON.stringify(accountsData)));
    setHasChanges(false);
  }, [accountsData]);

  useEffect(() => {
    if (isDirtyRef.current) return;
    setLocalCards(cards.map(c => ({ ...c })));
    setHasChanges(false);
  }, [cards]);

  const handleAccountChange = (key, field, value) => {
    setLocalAccounts(prev => ({ ...prev, [key]: { ...prev[key], [field]: value } }));
    setHasChanges(true);
    isDirtyRef.current = true;
  };
  const handleCardChange = (id, field, value) => {
    setLocalCards(prev => prev.map(c => {
      if (c.id !== id) return c;
      const u = { ...c, [field]: value };
      if (field === 'limit') u.availableBalance = Math.max(0, safeNumber(value) - safeNumber(u.openingDebt));
      return u;
    }));
    setHasChanges(true);
    isDirtyRef.current = true;
  };

  const handleSave = () => {
    saveHistory();
    const cleaned = {};
    const today = getLocalISODate();
    ACCOUNT_KEYS.forEach(k => {
      const oldInit = safeNumber(accountsData[k]?.initialBalance);
      const newInit = parseNumberInput(localAccounts[k]?.initialBalance);
      cleaned[k] = {
        ...localAccounts[k], initialBalance: newInit, balance: newInit,
        initialDate: (oldInit !== newInit) ? today : (localAccounts[k]?.initialDate || null),
        lastUpdated: (oldInit !== newInit) ? today : (localAccounts[k]?.lastUpdated || null)
      };
    });
    dispatch({ type: 'UPDATE_ACCOUNTS', payload: cleaned });
    dispatch({
      type: 'UPDATE_CARDS',
      payload: localCards.map(c => ({
        ...c, limit: safeNumber(c.limit), openingDebt: safeNumber(c.openingDebt),
        openingDebtDate: c.openingDebtDate || getLocalISODate(),
        openingDate: c.openingDate || getLocalISODate(),
        cashbackRate: safeNumber(c.cashbackRate, 0),
        subCardLast4: Array.isArray(c.subCardLast4) ? c.subCardLast4 : []
      }))
    });
    addNotification({ type: 'success', title: 'تم الحفظ' });
    setHasChanges(false);
    isDirtyRef.current = false;
  };

  const handleDriveConnect = async () => {
    setDriveBusy(true); setDriveStatus('جاري الاتصال...');
    try { await ensureDriveToken(); setDriveStatus('متصل'); addNotification({ type: 'success', title: 'Drive متصل' }); }
    catch (e) { setDriveStatus('فشل: ' + e.message); }
    finally { setDriveBusy(false); }
  };

  const handleDriveBackupNow = async () => {
    setDriveBusy(true); setDriveStatus('جاري الرفع...');
    try {
      const payload = { data, budgets, exportedAt: new Date().toISOString(), version: 'V86.1' };
      const result = await uploadBackupToDrive(payload);
      localStorage.setItem(AUTO_BACKUP_LS_KEY, String(Date.now()));
      const folderId = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;
      setDriveStatus(`✅ تم الرفع: ${result.name}`);
      addNotification({ type: 'success', title: 'تم رفع النسخة', message: 'في مجلد Finance Backups', duration: 6000 });
      if (folderId) {
        setTimeout(() => {
          dispatch({
            type: 'SHOW_CONFIRM', danger: false,
            title: '✅ تم الرفع بنجاح', message: 'هل تريد فتح المجلد في Google Drive للتأكد؟',
            onConfirm: () => { window.open(`https://drive.google.com/drive/folders/${folderId}`, '_blank'); dispatch({ type: 'HIDE_CONFIRM' }); },
            onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
          });
        }, 600);
      }
    } catch (e) { setDriveStatus('❌ فشل: ' + e.message); addNotification({ type: 'error', title: 'فشل الرفع', message: e.message }); }
    finally { setDriveBusy(false); }
  };

  const handleDriveRestore = async () => {
    setDriveBusy(true); setDriveStatus('جاري الجلب...');
    try {
      const files = await listDriveBackups();
      if (files.length === 0) { setDriveStatus('لا توجد نسخ'); setDriveBusy(false); return; }
      const labels = files.slice(0, 10).map((f, i) => `${i + 1}) ${f.name}`).join('\n');
      const choice = await showInputModal({ title: 'اختر رقم النسخة', icon: '☁️', message: labels, inputValue: '1', numeric: true, confirmText: 'استعادة' });
      if (!choice) { setDriveBusy(false); setDriveStatus(''); return; }
      const idx = Math.max(1, Math.min(files.length, parseInt(choice, 10) || 1)) - 1;
      const file = files[idx];
      const payload = await downloadBackupFromDrive(file.id);
      if (!payload?.data) throw new Error('الملف لا يحتوي بيانات');
      dispatch({
        type: 'SHOW_CONFIRM', danger: true,
        title: 'استعادة نسخة', message: 'سيتم استبدال بياناتك',
        onConfirm: () => {
          saveHistory();
          dispatch({ type: 'SET_DATA', payload: migrateData(payload.data) });
          if (payload.budgets) dispatch({ type: 'SET_BUDGETS', payload: payload.budgets });
          addNotification({ type: 'success', title: 'تمت الاستعادة' });
        },
        onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
      });
    } catch (e) { setDriveStatus('فشل: ' + e.message); }
    finally { setDriveBusy(false); }
  };

  const handleResetCardsToZero = () => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'تصفير بطاقات', message: 'سيتم تصفير مديونيات البطاقات مع الاحتفاظ بالأسماء والحدود',
      onConfirm: () => {
        saveHistory();
        dispatch({
          type: 'UPDATE_CARDS',
          payload: cards.map(c => ({ ...c, openingDebt: 0, availableBalance: safeNumber(c.limit), openingDebtDate: getLocalISODate(), openingDate: getLocalISODate() }))
        });
        addNotification({ type: 'success', title: 'تم التصفير' });
        dispatch({ type: 'HIDE_CONFIRM' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const handleFreshStartWithCardsAndHany = () => {
    if (onResetPersonalData) {
      onResetPersonalData({ keepHanyTransactions: true, keepRecurringItems: true, keepCards: true, keepLoansOtherThanHany: false });
    }
  };

  const handleFreshStart = () => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: '⚠️ بداية جديدة — تصفير شامل',
      message: 'سيتم مسح:\n• كل المعاملات\n• كل القروض\n• البنود المتكررة\n• العهد\n• خطط الشهرية\n\nلن تُمس:\n• أسماء الحسابات\n• أرقام البطاقات\n• الإعدادات',
      onConfirm: () => {
        saveHistory();
        const zeroed = {};
        ACCOUNT_KEYS.forEach(k => {
          zeroed[k] = { ...(accountsData[k] || {}), initialBalance: 0, balance: 0, initialDate: null, lastUpdated: null };
        });
        const allRemovedIds = (data.transactions || []).map(t => t.id).filter(Boolean);
        const fresh = {
          ...data, transactions: [], loans: [], closedMonths: [], monthlySnapshots: {},
          accountsData: zeroed,
          cards: (data.cards || []).map(c => ({ ...c, openingDebt: 0, availableBalance: safeNumber(c.limit), openingDebtDate: null, openingDate: null })),
          recurringItems: [], materializedRecurring: {}, custodyEntries: [], cashbackTrackers: [], monthlyPlans: {},
          settledHanyMonths: [], deletedTxIds: allRemovedIds, deletedTxArchive: [], deletedDefaultIds: [], deleteRequests: [], auditLog: []
        };
        dispatch({ type: 'SET_DATA', payload: fresh });
        addNotification({ type: 'success', title: 'تم التصفير الشامل', duration: 5000 });
        dispatch({ type: 'HIDE_CONFIRM' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  useEffect(() => {
    const toggleBtn = document.getElementById('telegramToggleBtn');
    const thresholdInput = document.getElementById('telegramThresholdInput');
    const testBtn = document.getElementById('testTelegramBtn');
    if (toggleBtn) {
      toggleBtn.onclick = () => {
        const s = getTelegramSettings();
        s.enabled = !s.enabled;
        saveTelegramSettings(s);
        toggleBtn.textContent = s.enabled ? 'إيقاف' : 'تفعيل';
        const desc = document.getElementById('telegramStatusDesc');
        if (desc) desc.textContent = s.enabled ? '✅ مفعّلة' : '❌ معطلة';
        addNotification({ type: s.enabled ? 'success' : 'info', title: s.enabled ? 'تم تفعيل التنبيهات' : 'تم إيقاف التنبيهات' });
      };
    }
    if (thresholdInput) {
      thresholdInput.onchange = (e) => {
        const s = getTelegramSettings();
        s.bigAmountThreshold = Number(e.target.value) || 5000;
        saveTelegramSettings(s);
        addNotification({ type: 'success', title: 'تم الحفظ: ' + s.bigAmountThreshold + ' ج.م' });
      };
    }
    if (testBtn) {
      testBtn.onclick = () => {
        sendTelegram('✅ اختبار من محفظتي V86.1\nالتنبيهات تعمل بنجاح');
        addNotification({ type: 'success', title: 'تم إرسال اختبار على Telegram' });
      };
    }
  }, [activeSection]);

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card flex justify-between items-center flex-wrap gap-3">
        <div className="flex items-center gap-2">
          <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><Sliders size={16} /></div>
          <h2 className="text-base font-black">الإعدادات</h2>
        </div>
        {hasChanges && (<button onClick={handleSave} className="btn btn-primary text-xs"><Save size={14} /> حفظ التغييرات</button>)}
      </div>

      <div className="card">
        <div className="flex items-center gap-2 mb-3">
          <div className="p-2 rounded-lg bg-[color:var(--accent-soft)] text-[color:var(--accent)]"><Upload size={14} /></div>
          <h3 className="font-black text-sm">المزامنة الفورية</h3>
        </div>
        <p className="text-[11px] mb-3" style={{ color: 'var(--text-muted)' }}>رفع فوري لكل التغييرات على Firestore — يتجاوز الـ debounce</p>
        <ForceSaveButton onForceSave={onForceSave} state={forceSaveState} isSaving={false} />
      </div>

      <div className="card p-1 flex gap-1.5">
        {[{ id: 'accounts', label: 'الحسابات', icon: Wallet }, { id: 'cards', label: 'الكروت', icon: CreditCard }].map(s => {
          const Icon = s.icon;
          return (
            <button key={s.id} onClick={() => setActiveSection(s.id)}
              className={`flex-1 py-2.5 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 transition-all ${activeSection === s.id ? 'text-white shadow-sm' : ''}`}
              style={activeSection === s.id ? { background: 'var(--accent)' } : { color: 'var(--text-muted)' }}>
              <Icon size={14} /> {s.label}
            </button>
          );
        })}
      </div>

      {activeSection === 'accounts' && (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          {ACCOUNT_KEYS.map(key => {
            const acc = localAccounts[key] || {};
            const Icon = ACCOUNT_ICONS[key] || Wallet;
            const last4 = DEFAULT_ACCOUNTS[key]?.last4;
            const isWallet = isWalletAccount(key);
            const isCash = isCashAccount(key);
            return (
              <div key={key} className="card">
                <div className="flex justify-between items-center mb-3">
                  <div className="flex items-center gap-2">
                    <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}><Icon size={14} /></div>
                    <h4 className="font-black text-xs">{acc.label || key}</h4>
                    {isCash && <span className="badge badge-success text-[8px]">كاش</span>}
                    {isWallet && <span className="badge badge-accent text-[8px]">محفظة</span>}
                  </div>
                </div>
                <div className="space-y-2.5">
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الرصيد الافتتاحي</label>
                    <input type="text" inputMode="decimal" value={acc.initialBalance ?? ''} onChange={e => handleAccountChange(key, 'initialBalance', e.target.value)}
                      className="input-field input-num text-base text-center py-2" style={{ color: 'var(--accent)' }} />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>تاريخ الافتتاح</label>
                    <input type="date" value={acc.initialDate || ''} onChange={e => handleAccountChange(key, 'initialDate', e.target.value)}
                      className="input-field text-center font-bold text-xs py-2" />
                  </div>
                  {last4 && (
                    <div className="p-2 rounded-lg text-center" style={{ background: 'var(--bg-muted)' }}>
                      <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>رقم البطاقة</p>
                      <p className="font-mono font-bold text-xs mt-0.5">•••• {last4}</p>
                    </div>
                  )}
                  <div className="p-2 rounded-lg text-center" style={{ background: 'var(--bg-muted)' }}>
                    <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>الرصيد الحي</p>
                    <p className="font-black text-emerald-600 text-xs money tabular">{fmt(computeBalance({ ...data, accountsData: localAccounts }, key))}</p>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {activeSection === 'cards' && (
        <div className="space-y-3">
          {localCards.map(card => {
            const liveDebt = computeCardDebt(data, card);
            const debtPct = safeNumber(card.limit) > 0 ? (Math.max(0, liveDebt) / safeNumber(card.limit)) * 100 : 0;
            const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
            return (
              <div key={card.id} className="card">
                <div className="flex items-center gap-2 mb-3 flex-wrap">
                  <div className="p-1.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-purple-600 dark:text-purple-400"><CreditCard size={14} /></div>
                  <h3 className="font-black text-sm">{card.bank} - {card.name}</h3>
                  <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>•••• {card.last4}</span>
                  {subCards.map(s => (<span key={s} className="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full" style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}>•••• {s}</span>))}
                </div>
                <div className="grid grid-cols-3 gap-2 mb-3">
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الحد</label>
                    <input type="text" inputMode="decimal" value={card.limit} onChange={e => handleCardChange(card.id, 'limit', e.target.value)} className="input-field input-num font-black text-blue-600 text-center text-xs py-2" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>مديونية أساسية</label>
                    <input type="text" inputMode="decimal" value={card.openingDebt} onChange={e => handleCardChange(card.id, 'openingDebt', e.target.value)} className="input-field input-num font-black text-red-600 text-center text-xs py-2" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>كاش باك %</label>
                    <input type="text" inputMode="decimal" value={card.cashbackRate || 0} onChange={e => handleCardChange(card.id, 'cashbackRate', e.target.value)} className="input-field input-num font-black text-amber-600 text-center text-xs py-2" />
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2 mb-3">
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>تاريخ المديونية</label>
                    <input type="date" value={card.openingDebtDate || ''} onChange={e => handleCardChange(card.id, 'openingDebtDate', e.target.value)} className="input-field text-center font-bold text-xs py-2" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>تاريخ القطع العام</label>
                    <input type="date" value={card.openingDate || ''} onChange={e => handleCardChange(card.id, 'openingDate', e.target.value)} className="input-field text-center font-bold text-xs py-2" />
                  </div>
                </div>
                <div className="p-2 rounded-lg text-center mt-2" style={{ background: 'var(--bg-muted)' }}>
                  <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                    المديونية الحية {liveDebt < 0 && <span className="text-emerald-600">(دائن)</span>}
                  </p>
                  <p className={`font-black text-sm money tabular ${liveDebt < 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(Math.abs(liveDebt))} ج.م</p>
                  <p className="text-[10px] font-semibold mt-1" style={{ color: 'var(--text-muted)' }}>
                    المتاح: <span className="money tabular">{fmt(Math.max(0, safeNumber(card.limit) - Math.max(0, liveDebt)))}</span> ج.م
                  </p>
                </div>
                <div className="w-full rounded-full h-1 overflow-hidden mt-2" style={{ background: 'var(--bg-muted)' }}>
                  <div className={`h-full ${debtPct > 70 ? 'bg-red-500' : debtPct > 40 ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(100, debtPct)}%` }}></div>
                </div>
              </div>
            );
          })}
          <button onClick={handleResetCardsToZero} className="btn btn-secondary text-xs w-full text-amber-600 py-2"><RotateCcw size={12} /> تصفير مديونيات البطاقات</button>
        </div>
      )}

      <div className="card">
        <div className="flex items-center gap-2 mb-3">
          <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-blue-600 dark:text-blue-400"><Lock size={14} /></div>
          <h3 className="font-black text-sm">رمز الدخول (PIN)</h3>
        </div>
        <p className="text-[11px] mb-3" style={{ color: 'var(--text-muted)' }}>الرمز الافتراضي: <strong>1033</strong> — V86.1 يستخدم PBKDF2 + Session HMAC</p>
        <button onClick={() => dispatch({ type: 'SET_PIN_CHANGE_OPEN', payload: true })} className="btn btn-secondary text-xs w-full"><Lock size={12} /> تغيير الرمز</button>
      </div>

      <div className="card">
        <div className="flex items-center gap-2 mb-3">
          <div className="p-2 rounded-lg bg-indigo-50 dark:bg-indigo-950/30 text-indigo-600 dark:text-indigo-400"><Send size={14} /></div>
          <h3 className="font-black text-sm">تنبيهات Telegram الذكية</h3>
        </div>
        <p className="text-[11px] mb-3" style={{ color: 'var(--text-muted)' }}>إشعارات مهمة فقط — دفعات كبيرة، تجاوز الميزانية، رصيد سالب، إقفال شهر، ملخصات يومية/أسبوعية</p>
        <div className="flex items-center justify-between p-2.5 rounded-lg mb-2" style={{ background: 'var(--bg-muted)' }}>
          <div>
            <div className="text-[11px] font-bold">حالة التنبيهات</div>
            <div className="text-[10px]" id="telegramStatusDesc">{getTelegramSettings().enabled ? '✅ مفعّلة' : '❌ معطلة'}</div>
          </div>
          <button className="btn btn-primary text-[10px] py-1.5 px-3" id="telegramToggleBtn">{getTelegramSettings().enabled ? 'إيقاف' : 'تفعيل'}</button>
        </div>
        <div className="flex items-center justify-between p-2.5 rounded-lg mb-2" style={{ background: 'var(--bg-muted)' }}>
          <div>
            <div className="text-[11px] font-bold">الحد الأدنى للدفعات الكبيرة</div>
            <div className="text-[10px]" style={{ color: 'var(--text-muted)' }}>إشعار فقط لو أكبر من</div>
          </div>
          <input type="number" id="telegramThresholdInput" defaultValue={getTelegramSettings().bigAmountThreshold}
            style={{ width: '100px', padding: '8px', borderRadius: '8px', border: '1px solid var(--border-default)', background: 'var(--bg-card)', color: 'var(--text-primary)', textAlign: 'center', fontFamily: 'inherit', fontWeight: 'bold' }} />
        </div>
        <div className="flex items-center justify-between p-2.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
          <div className="text-[11px] font-bold">اختبار الإشعارات</div>
          <button className="btn btn-primary text-[10px] py-1.5 px-3" id="testTelegramBtn">إرسال اختبار</button>
        </div>
      </div>

      <details className="card p-0 overflow-hidden">
        <summary className="p-4 cursor-pointer list-none flex items-center justify-between">
          <div className="flex items-center gap-2"><Cloud size={14} className="text-blue-500" /><span className="font-bold text-xs">Google Drive</span></div>
          <ChevronDown size={14} style={{ color: 'var(--text-muted)' }} />
        </summary>
        <div className="px-4 pb-4 space-y-3" style={{ borderTop: '1px solid var(--border-subtle)', paddingTop: '12px' }}>
          <div>
            <label className="block text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>Google Drive Folder ID</label>
            <div className="flex gap-1.5">
              <input type="text" className="input-field text-[11px] py-2 flex-1" placeholder={DRIVE_DEFAULT_FOLDER_ID} value={folderIdInput} onChange={(e) => setFolderIdInput(e.target.value)}
                onBlur={(e) => {
                  const v = e.target.value.trim();
                  if (v && v !== localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY)) {
                    localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, v);
                    addNotification({ type: 'success', title: 'تم حفظ Folder ID' });
                  }
                }} />
              <button type="button" onClick={() => {
                const id = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;
                window.open(`https://drive.google.com/drive/folders/${id}`, '_blank');
              }} className="btn btn-secondary text-[11px] py-2 px-2.5"><Cloud size={12} /> فتح</button>
            </div>
          </div>
          <div className="flex flex-wrap gap-1.5">
            <button type="button" onClick={handleDriveConnect} disabled={driveBusy} className="btn btn-secondary text-[11px] py-1.5 px-2.5"><Cloud size={12} /> اتصال</button>
            <button type="button" onClick={handleDriveBackupNow} disabled={driveBusy} className="btn btn-primary text-[11px] py-1.5 px-2.5"><Upload size={12} /> نسخة الآن</button>
            <button type="button" onClick={handleDriveRestore} disabled={driveBusy} className="btn btn-secondary text-[11px] py-1.5 px-2.5"><Download size={12} /> استعادة</button>
          </div>
          {driveStatus && (<p className="text-[10px] font-semibold whitespace-pre-line" style={{ color: 'var(--text-muted)' }}>{driveStatus}</p>)}
          {(() => {
            const ts = Number(localStorage.getItem(LAST_SYNC_LS_KEY) || 0);
            if (!ts) return null;
            const d = new Date(ts);
            return (<p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>🕐 آخر مزامنة Firestore: {d.toLocaleString('ar-EG')}</p>);
          })()}
        </div>
      </details>

      <div className="card" style={{ borderColor: 'var(--accent)' }}>
        <div className="flex items-center gap-2 mb-3">
          <div className="p-2 rounded-lg bg-[color:var(--accent-soft)] text-[color:var(--accent)]"><RefreshCcw size={14} /></div>
          <h3 className="font-black text-sm">بداية جديدة — ذكية</h3>
        </div>
        <p className="text-[11px] mb-3 leading-relaxed" style={{ color: 'var(--text-secondary)' }}>
          يمسح <strong>المعاملات الشخصية والعهد والخطط</strong>،<br />ويحفظ:
        </p>
        <ul className="text-[11px] mb-3 space-y-1 pr-4" style={{ color: 'var(--text-secondary)' }}>

  );
});

/* ═══════════════════════════════════════════════════════════════
   APP COMPONENT — Full Root (V86.1)
   ═══════════════════════════════════════════════════════════════ */
function App() {
  const defMY = useMemo(() => getDefaultMonthYear(), []);

  const [state, dispatch] = useReducer(dataReducer, {
    data: getInitialData(),
    activeTab: 'dashboard',
    selectedYear: defMY.year,
    selectedMonth: defMY.month,
    transViewMode: 'all',
    catViewType: 'expense',
    isFormOpen: false,
    formMode: 'add',
    formData: { type: 'expense', subType: 'withdrawal', status: 'pending', quantity: '', unitPrice: '' },
    isLocked: false,
    isDarkMode: localStorage.getItem('theme') === 'dark',
    budgets: safeParseJson(localStorage.getItem('budgets'), {}),
    editingCard: null,
    editingLoan: null,
    searchTerm: '',
    editingBudgetCategory: null,
    budgetAmount: '',
    isRecurringModalOpen: false,
    recurringFormData: {
      title: '', amount: '', day: 1, category: 'أخرى', type: 'expense',
      startMonth: '', endMonth: '', active: true, method: 'cash',
      kind: null, linkedLoanSystemId: null, linkedCardId: null, transferChannel: null
    },
    notifications: [],
    history: [],
    future: [],
    expandedLedgers: { cash: false, fawry: false, etisalat: false, cib_savings: false, aaib_savings: false },
    expandedCardsSection: false,
    statusFilter: 'all',
    confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false },
    isQuickTransferModalOpen: false,
    quickTransferData: {
      transferMode: 'monthly', from: 'cib_savings', to: 'fawry', amount: '', transferType: 'monthly',
      date: getLocalISODate(), beneficiaryId: null, forceCash: false,
      internalFrom: 'cib_savings', internalTo: 'fawry', internalFees: '', internalDescription: ''
    },
    viewingCardStatement: null,
    isPinChangeOpen: false,
    isSmsModalOpen: false,
    pendingCloseModal: { isOpen: false, pending: [], total: 0, month: '', year: 0 },
    walletVisibility: { cash: true, fawry: true, etisalat: true, cib_savings: true, aaib_savings: true },
    isProcessing: false,
    formErrors: {},
    activeCategoryDetail: null,
    reconciliationModal: null,
    isSidebarOpen: false,
    forceSaveState: 'idle'
  });

  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [authLoading, setAuthLoading] = useState(true);
  const [pinVerified, setPinVerified] = useState(false);
  const [cloudSyncStatus, setCloudSyncStatus] = useState('pending');
  const [isSaving, setIsSaving] = useState(false);

  const saveTimeoutRef = useRef(null);
  const processingTimeoutRef = useRef(null);
  const saveLockRef = useRef(false);
  const lastRemoteRef = useRef(null);
  const lastMaterializeRef = useRef('');
  const isSavingRef = useRef(false);
  const hasReceivedInitialSnapshot = useRef(false);
  const initialSnapshotTimeoutRef = useRef(null);
  const currentTxRef = useRef([]);
  const dataRef = useRef(null);
  const budgetsRef = useRef({});
  const saveQueueRef = useRef(Promise.resolve());
  const cloudSaveRetriesRef = useRef(0);

  const {
    data, activeTab, selectedYear, selectedMonth, transViewMode, catViewType,
    isFormOpen, formMode, formData, isDarkMode, expandedGroup, budgets,
    editingCard, editingLoan, searchTerm, editingBudgetCategory, budgetAmount,
    isRecurringModalOpen, recurringFormData, notifications, history,
    expandedLedgers, expandedCardsSection, statusFilter, confirmDialog,
    isQuickTransferModalOpen, quickTransferData, viewingCardStatement,
    isPinChangeOpen, isSmsModalOpen, pendingCloseModal,
    walletVisibility, isProcessing, formErrors, activeCategoryDetail,
    reconciliationModal, isSidebarOpen, forceSaveState
  } = state;

  const {
    transactions = [], loans = [], cards = [], recurringItems = [],
    accountsData = DEFAULT_ACCOUNTS, monthlyPlans = {}
  } = data || {};

  const isOnline = useOnlineStatus();
  const prevOnlineRef = useRef(isOnline);

  /* Telegram smart notifications */
  useEffect(() => {
    if (!isAuthenticated || !data) return;
    const interval = setInterval(() => {
      try {
        const balances = computeBalancesAsOf(data);
        ACCOUNT_KEYS.forEach(k => {
          if (Number(balances[k]) < 0) notifySmart('NEGATIVE_BALANCE', { accountName: ACCOUNT_SHORT_NAMES[k] || k, balance: balances[k] });
        });
        checkPeriodicSummaries(data.transactions, data.accountsData);
      } catch (e) { console.warn('Notification check:', e); }
    }, 30 * 60 * 1000);
    return () => clearInterval(interval);
  }, [isAuthenticated, data]);

  useEffect(() => {
    if (!isAuthenticated || !data?.deleteRequests) return;
    try {
      const pendingReqs = (data.deleteRequests || []).filter(r => r.status === 'pending');
      pendingReqs.forEach(req => {
        const key = 'v86_notified_' + req.id;
        if (!localStorage.getItem(key)) {
          notifySmart('DELETE_REQUEST', {
            requestedBy: req.requestedByName || 'مستخدم',
            description: (req.txSnapshot || {}).description || '—',
            amount: (req.txSnapshot || {}).amount || 0,
            reason: req.reason || '—'
          });
          localStorage.setItem(key, '1');
        }
      });
    } catch (e) {}
  }, [isAuthenticated, data?.deleteRequests]);

  useEffect(() => {
    currentTxRef.current = data?.transactions || [];
    dataRef.current = data;
    budgetsRef.current = budgets;
  }, [data?.transactions, data, budgets]);

  const addNotification = useCallback((notification) => dispatch({ type: 'ADD_NOTIFICATION', payload: notification }), []);
  const removeNotification = useCallback((id) => dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }), []);
  const saveHistory = useCallback(() => dispatch({
    type: 'ADD_TO_HISTORY',
    payload: { data: JSON.parse(JSON.stringify(data)), budgets: JSON.parse(JSON.stringify(budgets)) }
  }), [data, budgets]);

  /* Cloud save queue */
  const queueCloudSave = useCallback((newData, options = {}) => {
    if (!isAuthenticated || !hasReceivedInitialSnapshot.current) return;
    const { silent = false, force = false } = options;
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);

    saveQueueRef.current = saveQueueRef.current.then(async () => {
      try {
        if (!silent) setIsSaving(true);
        const payloadStr = JSON.stringify(newData);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(newData)); } catch (e) {}

        if (force) {
          await docRef.set({ ...newData, budgets: newData.budgets || budgetsRef.current }, { merge: false });
          lastRemoteRef.current = payloadStr;
          try { localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now())); } catch (e) {}
          return;
        }

        const doc = await docRef.get();
        let finalData = { ...newData };

        if (doc.exists) {
          const remote = doc.data() || {};
          const remoteTx = Array.isArray(remote.transactions) ? remote.transactions : [];
          const localTx = Array.isArray(newData.transactions) ? newData.transactions : [];
          const permanentDeleted = new Set([...(newData.deletedTxIds || []), ...(remote.deletedTxIds || [])]);
          const mergedMap = new Map();
          remoteTx.forEach(t => { if (t?.id && !permanentDeleted.has(t.id)) mergedMap.set(t.id, t); });
          localTx.forEach(t => { if (t?.id && !permanentDeleted.has(t.id)) mergedMap.set(t.id, t); });

          finalData.transactions = sortTransactions(
            Array.from(mergedMap.values()).filter(t => !t?.id || !(finalData.deletedTxIds || []).includes(t.id))
          );
          finalData.deletedTxIds = Array.from(permanentDeleted).slice(-500);

          if (remote.budgets && typeof remote.budgets === 'object') {
            finalData.budgets = { ...remote.budgets, ...budgetsRef.current };
          }
        }

        await docRef.set({ ...finalData, budgets: finalData.budgets || budgetsRef.current }, { merge: true });
        lastRemoteRef.current = payloadStr;
        try { localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now())); } catch (e) {}
        cloudSaveRetriesRef.current = 0;
      } catch (err) {
        console.error('Queue save failed:', err);
        throw err;
      } finally {
        if (!silent) setTimeout(() => setIsSaving(false), 800);
      }
    }).catch(async (err) => {
      console.error('❌ Queue save failed, will retry:', err);
      const retries = cloudSaveRetriesRef.current + 1;
      if (retries <= 3) {
        cloudSaveRetriesRef.current = retries;
        await new Promise(r => setTimeout(r, 3000));
        saveQueueRef.current = Promise.resolve();
        return queueCloudSave(newData, options);
      }
      cloudSaveRetriesRef.current = 0;
      saveQueueRef.current = Promise.resolve();
      setIsSaving(false);
    });

    return saveQueueRef.current;
  }, [isAuthenticated]);

  const docRef = useMemo(() => db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc), []);
  const { forceSave: handleForceSave } = useForceSave({ isAuthenticated, data, budgets, addNotification, dbRef: docRef, migrateData });

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((user) => {
      setAuthLoading(false);
      setIsAuthenticated(!!(user && user.email === ALLOWED_EMAIL));
    });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!isAuthenticated) return;
    materializeShoppingRecurring();
    const interval = setInterval(materializeShoppingRecurring, 60 * 60 * 1000);
    return () => clearInterval(interval);
  }, [isAuthenticated]);

  /* Firestore listener */
  useEffect(() => {
    if (!isAuthenticated) return;
    const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);

    initialSnapshotTimeoutRef.current = setTimeout(() => {
      if (!hasReceivedInitialSnapshot.current) {
        console.warn('⚠️ Firestore اتأخر — استخدام localStorage');
        hasReceivedInitialSnapshot.current = true;
        setCloudSyncStatus('offline');
      }
    }, 8000);

    const unsub = docRef.onSnapshot((doc) => {
      const isFirst = !hasReceivedInitialSnapshot.current;
      if (isFirst) {
        hasReceivedInitialSnapshot.current = true;
        if (initialSnapshotTimeoutRef.current) {
          clearTimeout(initialSnapshotTimeoutRef.current);
          initialSnapshotTimeoutRef.current = null;
        }
        setCloudSyncStatus('ready');
      }

      if (doc.exists) {
        const raw = doc.data();
        let migrated = migrateData(raw);
        const { transactions: cleanTx, removed } = dedupeRecurringTransactions(migrated.transactions || []);

        if (removed.length > 0) {
          console.log(`🧹 تنظيف ${removed.length} قيد مكرر من السحابة`);
          const newArchive = [...(migrated.deletedTxArchive || [])];
          const newDeletedIds = [...(migrated.deletedTxIds || [])];
          removed.forEach(r => {
            if (r.tx) {
              newArchive.push({ ...r.tx, deletedAt: new Date().toISOString(), deletedBy: 'dedupe', originalStatus: r.tx.status || 'pending', reason: 'dedupe_' + r.reason });
              newDeletedIds.push(r.tx.id);
            }
          });
          migrated = { ...migrated, transactions: sortTransactions(cleanTx), deletedTxArchive: newArchive.slice(-500), deletedTxIds: Array.from(new Set(newDeletedIds)).slice(-500) };
          setTimeout(() => queueCloudSave(migrated, { silent: true }), 500);
        }

        const permanentDeleted = new Set([...(migrated.deletedTxIds || []), ...(currentTxRef.current.filter(t => t?._deleted).map(t => t.id))]);
        migrated.transactions = migrated.transactions.filter(t => !t?.id || !permanentDeleted.has(t.id));

        const remoteIds = new Set(migrated.transactions.map(t => t.id));
        const localOnly = currentTxRef.current.filter(t => t?.id && !remoteIds.has(t.id) && !permanentDeleted.has(t.id));

        const now = Date.now();
const localOnlyToUpload = localOnly.filter(t => {
  if (!t.createdAt) return false;
  const age = now - new Date(t.createdAt).getTime();
  return age >= 0 && age < 300000;
});

        if (localOnlyToUpload.length > 0) {
          console.log(`📤 ${localOnlyToUpload.length} قيد محلي جديد — جاري رفعه للسحابة`);
          migrated.transactions = sortTransactions([...migrated.transactions, ...localOnlyToUpload]);
          setTimeout(() => queueCloudSave(migrated, { silent: true }), 800);
        }

        const incoming = JSON.stringify(migrated);
        if (lastRemoteRef.current === incoming && !isFirst) return;
        lastRemoteRef.current = incoming;

        if (raw.budgets && typeof raw.budgets === 'object') {
          dispatch({ type: 'SET_BUDGETS', payload: raw.budgets });
        }

        dispatch({ type: 'SET_DATA', payload: migrated });
        console.log('☁️ تم استقبال البيانات من Firestore');
      } else if (isFirst) {
        console.log('📤 Firestore فاضي — أول استخدام');
      }
    }, (error) => {
      console.error('❌ Firestore error:', error);
      if (!hasReceivedInitialSnapshot.current) {
        hasReceivedInitialSnapshot.current = true;
        setCloudSyncStatus('offline');
      }
    });

    return () => {
      unsub();
      if (initialSnapshotTimeoutRef.current) clearTimeout(initialSnapshotTimeoutRef.current);
    };
  }, [isAuthenticated, queueCloudSave]);

  /* Auto-save */
  useEffect(() => {
    if (!isAuthenticated || !data?.transactions) return;
    if (!hasReceivedInitialSnapshot.current) return;

    if (cloudSyncStatus === 'offline') {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      return;
    }

    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(() => {
      if (isSavingRef.current) return;
      const payloadStr = JSON.stringify(data);
      if (lastRemoteRef.current && payloadStr === lastRemoteRef.current) return;
      isSavingRef.current = true;
      const safetyTimer = setTimeout(() => { isSavingRef.current = false; }, 8000);
queueCloudSave(data, { silent: false }).finally(() => {
  clearTimeout(safetyTimer);
  isSavingRef.current = false;
});
    }, 2000);
    return () => clearTimeout(saveTimeoutRef.current);
  }, [data, isAuthenticated, cloudSyncStatus, queueCloudSave]);

  /* Materialize recurring */
  useEffect(() => {
    if (!isAuthenticated || !data?.recurringItems?.length) return;
    const today = getLocalISODate();
    const activeCount = data.recurringItems.filter(r => r.active !== false).length;
    const loansSig = (data.loans || []).filter(l => l.systemId === SYSTEM_LOAN_IDS.TAKYEEF).map(l => `${l.id}:${l.prePaidAmount}:${l.totalAmount}`).join('|');
    const sig = `${today}_${data.recurringItems.length}_${activeCount}_${loansSig}`;
    if (lastMaterializeRef.current === sig) return;
    lastMaterializeRef.current = sig;

    const updated = applyMaterialization(data, today);
    if (updated) {
      const added = updated.transactions.length - (data.transactions?.length || 0);
      dispatch({ type: 'SET_DATA', payload: updated });
      setTimeout(() => queueCloudSave(updated, { silent: true }), 200);
      if (added > 0) {
        addNotification({ type: 'info', title: 'تم توليد التزامات شهرية', message: `${added} بند متكرر بانتظار الاعتماد`, duration: 6000 });
      }
    }
  }, [isAuthenticated, data?.recurringItems, data?.transactions?.length, data?.loans, addNotification, queueCloudSave]);

  /* Retry connection */
  useEffect(() => {
    if (!isAuthenticated || cloudSyncStatus !== 'offline') return;
    let cancelled = false;
    const retryTimer = setInterval(async () => {
      if (cancelled) return;
      try {
        await db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc).get({ source: 'server' });
        if (cancelled) return;
        hasReceivedInitialSnapshot.current = true;
        setCloudSyncStatus('ready');
        addNotification({ type: 'success', title: '✅ تم استعادة الاتصال بالسحابة', duration: 4000 });
      } catch (e) {}
    }, 30000);
    return () => { cancelled = true; clearInterval(retryTimer); };
  }, [isAuthenticated, cloudSyncStatus, addNotification]);

  useEffect(() => {
    if (prevOnlineRef.current !== isOnline) {
      if (isOnline) {
        addNotification({ type: 'success', title: 'تم استعادة الاتصال', message: 'جاري المزامنة...', duration: 4000 });
        if (cloudSyncStatus === 'offline') setCloudSyncStatus('pending');
      } else {
        addNotification({ type: 'warning', title: 'انقطع الاتصال', message: 'التغييرات محفوظة محلياً', duration: 6000 });
      }
      prevOnlineRef.current = isOnline;
    }
  }, [isOnline, addNotification, cloudSyncStatus]);

  const cancelProcessing = useCallback(() => {
    if (processingTimeoutRef.current) { clearTimeout(processingTimeoutRef.current); processingTimeoutRef.current = null; }
    saveLockRef.current = false;
    dispatch({ type: 'SET_IS_PROCESSING', payload: false });
    addNotification({ type: 'info', title: 'تم الإلغاء' });
  }, [addNotification]);

  const liveBalances = useMemo(() => computeBalancesAsOf(data), [data]);
  const liquidityDual = useMemo(() => computeDualLiquidity(liveBalances), [liveBalances]);
  const totalLiquidity = liquidityDual.comprehensive;
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);

  const financeSnapshot = useMemo(() => {
    const opening = getOpeningBalance(data, 'cash', selectedYear, selectedMonth);
    const actualCashInHand = liveBalances.cash || 0;
    const today = endOfToday();
    const curMonth = transactions.filter(t => t.month === selectedMonth && (t.year || new Date(t.date).getFullYear()) === selectedYear);
    const actualIncome = curMonth.filter(t => t.type === 'income' && t.status === 'paid' && t.method === 'cash' && (parseISODate(t.date) || new Date()) <= today).reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncome = curMonth.filter(t => t.type === 'income' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidCash = curMonth.filter(t => t.type === 'expense' && t.status === 'paid' && t.method === 'cash' && (parseISODate(t.date) || new Date()) <= today).reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingCash = curMonth.filter(t => t.type === 'expense' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncomeAll = curMonth.filter(t => t.type === 'income' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingExpensesAll = curMonth.filter(t => t.type === 'expense' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidExpensesAll = curMonth.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    return {
      opening, actualIncome, pendingIncome, paidCash, pendingCash, actualCashInHand,
      pendingIncomeAll, pendingExpensesAll, paidExpensesAll,
      projectedClosingBalance: actualCashInHand + pendingIncomeAll - pendingExpensesAll
    };
  }, [data, transactions, selectedYear, selectedMonth, liveBalances]);

  const chartData = useMemo(() => {
    const byMonth = new Map();
    transactions.forEach(t => {
      if (t.status !== 'paid') return;
      const y = t.year || 2026;
      if (y !== selectedYear) return;
      if (!byMonth.has(t.month)) byMonth.set(t.month, { income: 0, expense: 0 });
      const b = byMonth.get(t.month);
      if (t.type === 'income') b.income += safeNumber(t.amount);
      else if (t.type === 'expense') b.expense += safeNumber(t.amount);
    });
    return getMonthsForYear(selectedYear).map(m => ({
      name: m.slice(0, 3),
      'دخل': byMonth.get(m)?.income || 0,
      'مصروف': byMonth.get(m)?.expense || 0
    }));
  }, [transactions, selectedYear]);

  const loansHash = useMemo(() => {
const txSig = transactions.filter(t => 
  t.linkedLoanId || 
  t.sourceReceivableId || 
  isHanyShopCategory(t.category)
).map(t => `${t.id}:${t.status}:${t.amount}:${t.category}`).join('|');
    const loansSig = loans.map(l => `${l.id}:${l.totalAmount}:${l.prePaidAmount}:${l.autoMonthly ? 1 : 0}`).join('|');
    const deletedSig = (data?.deletedTxIds || []).slice(-100).join(',');
    return `${txSig}#${loansSig}#${deletedSig}`;
  }, [transactions, loans, data?.deletedTxIds]);

  const updatedLoans = useMemo(() => {
    const permanentlyDeleted = new Set(data?.deletedTxIds || []);
    const map = transactions.reduce((acc, t) => {
      if (t.linkedLoanId && t.status === 'paid') acc[t.linkedLoanId] = (acc[t.linkedLoanId] || 0) + safeNumber(t.amount);
      return acc;
    }, {});
    const receivablesPaidMap = transactions.reduce((acc, t) => {
      if (t.sourceReceivableId && t.status === 'paid') acc[t.sourceReceivableId] = (acc[t.sourceReceivableId] || 0) + safeNumber(t.amount);
      return acc;
    }, {});
    const paymentsByLoanId = transactions.reduce((acc, t) => {
      if (t.linkedLoanId && t.status === 'paid') {
        if (!acc[t.linkedLoanId]) acc[t.linkedLoanId] = [];
        acc[t.linkedLoanId].push(t);
      }
      return acc;
    }, {});

    const txByKey = new Map();
    transactions.forEach(t => {
      if (t.type !== 'expense' || !t.category) return;
      if (permanentlyDeleted.has(t.id)) return;
      if (t.source === 'carryover') return;
      const key = `${t.category}|${t.year || 2026}|${t.month}`;
      if (!txByKey.has(key)) txByKey.set(key, []);
      txByKey.get(key).push(t);
    });

    const regular = loans.filter(l => !l.autoMonthly && !l.isReceivable).map(l => ({
      ...l,
      isReceivable: l.type === 'receivable' || !!l.isReceivable,
      totalPaid: safeNumber(l.prePaidAmount) + (map[l.id] || 0),
      remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (map[l.id] || 0)))
    }));

    const receivables = loans.filter(l => l.isReceivable).map(l => ({
      ...l, isReceivable: true, paused: !!l.paused,
      totalPaid: safeNumber(l.prePaidAmount) + (receivablesPaidMap[l.id] || 0),

    const transferMode = quickTransferData.transferMode || 'monthly';

    if (transferMode === 'internal') {
      const amountCheck = validateAmount(quickTransferData.amount, { min: 0.01, max: 10000000, label: 'المبلغ' });
      if (!amountCheck.valid) { saveLockRef.current = false; addNotification({ type: 'error', title: 'خطأ', message: amountCheck.error }); return; }
      const amount = roundMoney(amountCheck.value);
      const fees = roundMoney(parseNumberInput(quickTransferData.internalFees || 0));
      const from = quickTransferData.internalFrom || 'cib_savings';
      const to = quickTransferData.internalTo || 'fawry';
      const dateStr = quickTransferData.date || getLocalISODate();
      const d = parseISODate(dateStr);
      if (!d) { saveLockRef.current = false; addNotification({ type: 'error', title: 'تاريخ غير صحيح' }); return; }
      const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
      if (isMonthClosed(data, txYear, txMonth)) { saveLockRef.current = false; addNotification({ type: 'error', title: 'محظور', message: `شهر ${txMonth} مغلق` }); return; }
      if (from === to) { saveLockRef.current = false; addNotification({ type: 'error', title: 'اختر حسابين مختلفين' }); return; }
      if (fees < 0) { saveLockRef.current = false; addNotification({ type: 'error', title: 'الرسوم لا تكون سالبة' }); return; }

      dispatch({ type: 'SET_IS_PROCESSING', payload: true });
      processingTimeoutRef.current = setTimeout(() => {
        try {
          saveHistory();
          const transferId = getSafeId();
          const date = getLocalISODate(d);
          const fromLabel = PAYMENT_METHODS.find(p => p.id === from)?.label || from;
          const toLabel = PAYMENT_METHODS.find(p => p.id === to)?.label || to;
          const description = (quickTransferData.internalDescription || '').trim() || `تحويل من ${fromLabel} إلى ${toLabel}`;
          const now = new Date().toISOString();
          const txs = [
            { id: getSafeId(), type: 'expense', kind: KIND.FINANCIAL, category: 'تحويلات', amount, description: `${description} (خروج)`, method: from, date, month: txMonth, year: txYear, monthIndex: d.getMonth(), subType: 'withdrawal', status: 'paid', linkedTransferId: transferId, transferDirection: 'out', createdAt: now },
            { id: getSafeId(), type: 'income', kind: KIND.FINANCIAL, category: 'تحويلات واردة', amount, description: `${description} (دخول)`, method: to, date, month: txMonth, year: txYear, monthIndex: d.getMonth(), subType: 'deposit', status: 'paid', linkedTransferId: transferId, transferDirection: 'in', createdAt: now }
          ];
          if (fees > 0) {
            txs.push({ id: getSafeId(), type: 'expense', kind: KIND.FINANCIAL, category: 'رسوم تحويلات', amount: fees, description: `رسوم تحويل — ${description}`, method: from, date, month: txMonth, year: txYear, monthIndex: d.getMonth(), subType: 'withdrawal', status: 'paid', linkedTransferId: transferId, transferDirection: 'fee', createdAt: now });
          }
          dispatch({ type: 'UPDATE_TRANSACTIONS', payload: sortTransactions([...txs, ...transactions]) });
          dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
          dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { transferMode: 'monthly', from: 'cib_savings', to: 'fawry', amount: '', transferType: 'monthly', date: getLocalISODate(), beneficiaryId: null, forceCash: false, internalFrom: 'cib_savings', internalTo: 'fawry', internalFees: '', internalDescription: '' } });
          addNotification({ type: 'success', title: 'تم التحويل بنجاح', message: `${fmt(amount)} ج.م من ${fromLabel} إلى ${toLabel}${fees > 0 ? ` + رسوم ${fmt(fees)}` : ''}`, duration: 6000 });
        } catch (err) { console.error('Internal transfer error:', err); addNotification({ type: 'error', title: 'فشل التحويل', message: err.message }); }
        saveLockRef.current = false;
        dispatch({ type: 'SET_IS_PROCESSING', payload: false });
        processingTimeoutRef.current = null;
      }, 600);
      return;
    }

    const transferType = quickTransferData.transferType || 'monthly';
    const amountCheck = validateAmount(quickTransferData.amount, { min: 0.01, max: 10000000, label: 'المبلغ' });
    if (!amountCheck.valid) { saveLockRef.current = false; addNotification({ type: 'error', title: 'خطأ', message: amountCheck.error }); return; }
    const amount = roundMoney(amountCheck.value);
    const dateStr = quickTransferData.date || getLocalISODate();
    const d = parseISODate(dateStr);
    if (!d) { saveLockRef.current = false; addNotification({ type: 'error', title: 'تحقق', message: 'تاريخ غير صحيح' }); return; }
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { saveLockRef.current = false; addNotification({ type: 'error', title: 'محظور' }); return; }
    if (transferType === 'monthly' && !quickTransferData.beneficiaryId) { saveLockRef.current = false; addNotification({ type: 'error', title: 'اختر المستفيد' }); return; }

    dispatch({ type: 'SET_IS_PROCESSING', payload: true });
    processingTimeoutRef.current = setTimeout(() => {
      saveHistory();
      const date = getLocalISODate(d);
      const txs = [];
      if (transferType === 'monthly') {
        const ben = BENEFICIARIES.find(b => b.id === quickTransferData.beneficiaryId);
        const isFromBank = quickTransferData.from === 'cib_savings' || quickTransferData.from === 'aaib_savings';
        const useTelda = isFromBank && ben.hasTelda && !quickTransferData.forceCash;
        txs.push({
          id: 'monthly-' + getSafeId(), type: 'expense', kind: KIND.OPERATIONAL,
          category: `مصروف شهري - ${ben.label}`, amount,
          description: useTelda ? `مصروف شهري - ${ben.label} (عبر Telda)` : `مصروف شهري - ${ben.label}`,
          method: quickTransferData.from,
          transferChannel: useTelda ? ben.method : undefined,
          date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
          subType: 'withdrawal', status: 'paid', beneficiaryId: ben.id,
          createdAt: new Date().toISOString()
        });
      }
      dispatch({ type: 'UPDATE_TRANSACTIONS', payload: sortTransactions([...txs, ...transactions]) });
      dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
      dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { transferMode: 'monthly', from: 'cib_savings', to: 'fawry', amount: '', transferType: 'monthly', date: getLocalISODate(), beneficiaryId: null, forceCash: false, internalFrom: 'cib_savings', internalTo: 'fawry', internalFees: '', internalDescription: '' } });
      addNotification({ type: 'success', title: 'تم التسجيل' });
      saveLockRef.current = false;
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
      processingTimeoutRef.current = null;
    }, 600);
  }, [quickTransferData, data, transactions, saveHistory, addNotification, isProcessing]);

  const handleUpdateLoan = useCallback((e) => {
    e.preventDefault();
    saveHistory();
    dispatch({
      type: 'UPDATE_LOANS',
      payload: loans.map(l => l.id === editingLoan.id ? {
        ...editingLoan,
        totalAmount: safeNumber(editingLoan.totalAmount),
        prePaidAmount: safeNumber(editingLoan.prePaidAmount),
        monthlyInstallment: safeNumber(editingLoan.monthlyInstallment),
        dueDay: safeNumber(editingLoan.dueDay, 1),
        paused: !!editingLoan.paused,
        totalInstallments: safeNumber(editingLoan.totalInstallments),
        paidInstallments: safeNumber(editingLoan.paidInstallments)
      } : l)
    });
    dispatch({ type: 'SET_EDITING_LOAN', payload: null });
    addNotification({ type: 'success', title: 'تم التحديث' });
  }, [loans, editingLoan, saveHistory, addNotification]);

  const handleUpdateCard = useCallback((e) => {
    e.preventDefault();
    saveHistory();
    dispatch({
      type: 'UPDATE_CARDS',
      payload: cards.map(c => c.id === editingCard.id ? {
        ...editingCard,
        limit: safeNumber(editingCard.limit),
        availableBalance: Math.max(0, safeNumber(editingCard.limit) - safeNumber(editingCard.openingDebt)),
        openingDebt: safeNumber(editingCard.openingDebt),
        openingDebtDate: editingCard.openingDebtDate || getLocalISODate(),
        cashbackRate: safeNumber(editingCard.cashbackRate, 0),
        openingDate: editingCard.openingDate || getLocalISODate(),
        subCardLast4: Array.isArray(editingCard.subCardLast4) ? editingCard.subCardLast4 : []
      } : c)
    });
    dispatch({ type: 'SET_EDITING_CARD', payload: null });
    addNotification({ type: 'success', title: 'تم التحديث' });
  }, [cards, editingCard, saveHistory, addNotification]);

  const handleSaveBudget = useCallback(() => {
    saveHistory();
    const nb = { ...budgets, [editingBudgetCategory]: parseNumberInput(budgetAmount) };
    dispatch({ type: 'SET_BUDGETS', payload: nb });
    dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null });
    dispatch({ type: 'SET_BUDGET_AMOUNT', payload: '' });
    addNotification({ type: 'success', title: 'تم الحفظ' });
  }, [budgets, editingBudgetCategory, budgetAmount, saveHistory, addNotification]);

  const handleSaveRecurring = useCallback((e) => {
    e.preventDefault();
    const titleCheck = validateText(recurringFormData.title, { min: 2, max: 100, label: 'العنوان' });
    if (!titleCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: titleCheck.error }); return; }
    const amountCheck = validateAmount(recurringFormData.amount, { min: 0.01, max: 10000000, label: 'المبلغ' });
    if (!amountCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: amountCheck.error }); return; }
    saveHistory();

    const payload = {
      title: titleCheck.value, amount: roundMoney(amountCheck.value),
      day: safeNumber(recurringFormData.day, 1), category: recurringFormData.category,
      type: recurringFormData.type, startMonth: recurringFormData.startMonth || null,
      endMonth: recurringFormData.endMonth || null, active: recurringFormData.active !== false,
      kind: recurringFormData.kind || null,
      linkedLoanSystemId: recurringFormData.linkedLoanSystemId || null,
      linkedCardId: recurringFormData.linkedCardId || null,
      method: recurringFormData.method || 'cash',
      transferChannel: recurringFormData.transferChannel || null
    };

    if (recurringFormData.id) {
      dispatch({ type: 'UPDATE_RECURRING_ITEMS', payload: recurringItems.map(r => r.id === recurringFormData.id ? { ...r, ...payload } : r) });
      addNotification({ type: 'success', title: 'تم تحديث البند' });
    } else {
      dispatch({ type: 'UPDATE_RECURRING_ITEMS', payload: [...recurringItems, { ...payload, id: 'r-' + getSafeId() }] });
      addNotification({ type: 'success', title: 'تمت الإضافة' });
    }

    dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false });
    dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { title: '', amount: '', day: 1, category: 'أخرى', type: 'expense', startMonth: '', endMonth: '', active: true, method: 'cash', kind: null, linkedLoanSystemId: null, linkedCardId: null, transferChannel: null } });
  }, [recurringFormData, recurringItems, saveHistory, addNotification]);

  const deleteRecurring = useCallback((id) => {
    const pendingFromThis = (data.transactions || []).filter(t => t.sourceRecurringId === id && t.status !== 'paid');
    const blocked = pendingFromThis.find(t => isMonthClosed(data, t.year || 2026, t.month));
    if (blocked) {
      addNotification({ type: 'error', title: 'الشهر مغلق', message: `لا يمكن حذف البند — له قيود في شهر ${blocked.month} ${blocked.year}` });
      return;
    }

    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'حذف الالتزام',
      message: 'سيتم حذف البند والقيود المعلقة المرتبطة',
      onConfirm: () => {
        saveHistory();
        const newRecurring = recurringItems.filter(i => i.id !== id);
        const newTx = (data.transactions || []).filter(t => !(t.sourceRecurringId === id && t.status !== 'paid'));
        const newMaterialized = { ...(data.materializedRecurring || {}) };
        Object.keys(newMaterialized).forEach(k => { if (k.startsWith(id + '_')) delete newMaterialized[k]; });
        dispatch({ type: 'SET_DATA', payload: { ...data, recurringItems: newRecurring, transactions: newTx, materializedRecurring: newMaterialized } });
        addNotification({ type: 'success', title: 'تم الحذف نهائياً' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  }, [recurringItems, data, saveHistory, addNotification]);

  const forcePullFromCloud = useCallback(async () => {
    if (!isAuthenticated) { addNotification({ type: 'error', title: 'غير مصرح' }); return; }
    if (!isOnline) { addNotification({ type: 'error', title: 'لا يوجد اتصال' }); return; }

    dispatch({ type: 'SET_IS_PROCESSING', payload: true });
    addNotification({ type: 'info', title: 'جاري المزامنة...', duration: 2000 });

    try {
      const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
      const doc = await docRef.get({ source: 'server' });

      if (!doc.exists) { addNotification({ type: 'warning', title: 'مفيش بيانات على السحابة' }); return; }

      const remote = doc.data();
      const migratedRemote = migrateData(remote);

      const localTxIds = new Set((data.transactions || []).map(t => t.id));
      const remoteTxIds = new Set((migratedRemote.transactions || []).map(t => t.id));

      const onlyLocal = (data.transactions || []).filter(t => !remoteTxIds.has(t.id));
      const onlyRemote = (migratedRemote.transactions || []).filter(t => !localTxIds.has(t.id));

      if (onlyLocal.length > 0) {
        console.log(`📤 رفع ${onlyLocal.length} معاملة محلية للسحابة أولاً`);
        const merged = { ...migratedRemote, transactions: sortTransactions([...(migratedRemote.transactions || []), ...onlyLocal]) };
        await docRef.set(merged, { merge: false });
        dispatch({ type: 'SET_DATA', payload: merged });
        addNotification({ type: 'success', title: `✅ تمت المزامنة (رفعت ${onlyLocal.length} وحمّلت ${onlyRemote.length})` });
      } else {
        dispatch({ type: 'SET_DATA', payload: migratedRemote });
        if (remote.budgets) dispatch({ type: 'SET_BUDGETS', payload: remote.budgets });
        addNotification({ type: 'success', title: `✅ تم التحديث (${onlyRemote.length} معاملة جديدة)` });
      }

      lastRemoteRef.current = JSON.stringify(migratedRemote);
      localStorage.setItem(LAST_SYNC_LS_KEY, String(Date.now()));
    } catch (err) {
      console.error('Force pull failed:', err);
      addNotification({ type: 'error', title: 'فشلت المزامنة', message: err.message });
    } finally {
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
    }
  }, [isAuthenticated, isOnline, data, addNotification]);

  const handleExport = useCallback(() => {
    const blob = new Blob([JSON.stringify({ data, budgets, exportedAt: new Date().toISOString(), version: 'V86.1' })], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `finance_backup_v86_1_${getLocalISODate()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    addNotification({ type: 'success', title: 'تم التصدير' });
  }, [data, budgets, addNotification]);

  const handleImport = useCallback((e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        if (parsed.data) {
          saveHistory();
          dispatch({ type: 'SET_DATA', payload: migrateData(parsed.data) });
          if (parsed.budgets) dispatch({ type: 'SET_BUDGETS', payload: parsed.budgets });
          addNotification({ type: 'success', title: 'تم الاستيراد' });
        }
      } catch { addNotification({ type: 'error', title: 'ملف غير صالح' }); }
    };
    reader.readAsText(file);
  }, [saveHistory, addNotification]);

  const handlePendingCloseAction = useCallback((action) => {
    const { pending, month, year } = pendingCloseModal;
    if (!pending || pending.length === 0) return;

    if (action === 'carry') {
      const idx = getMonthIndex(month);
      const nextMonth = idx === 11 ? ALL_MONTHS[0] : ALL_MONTHS[idx + 1];
      const nextYear = idx === 11 ? year + 1 : year;
      const nextKey = makeMonthKey(nextYear, nextMonth);
      if ((data.closedMonths || []).includes(nextKey)) {
        addNotification({ type: 'error', title: 'لا يمكن الترحيل', message: `شهر ${nextMonth} ${nextYear} مغلق.`, duration: 7000 });
        return;
      }
    }

    saveHistory();
    const pendingIds = pending.map(t => t.id);
    dispatch({ type: 'CLOSE_MONTH_AFTER_RESOLVE', payload: { year, month, resolveAction: action, pendingIds } });
    const actionText = action === 'approve' ? 'تم الاعتماد والإقفال' : action === 'carry' ? 'تم الترحيل والإقفال' : 'تم الحذف والإقفال';
    addNotification({ type: 'success', title: actionText, message: `شهر ${month} ${year}` });
  }, [pendingCloseModal, data, saveHistory, addNotification]);

  useEffect(() => { try { localStorage.setItem('budgets', JSON.stringify(budgets)); } catch (e) {} }, [budgets]);
  useEffect(() => {
    document.documentElement.classList.toggle('dark', isDarkMode);
    localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
  }, [isDarkMode]);
  useEffect(() => {
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDarkMode ? '#050A14' : '#F4F7FB');
  }, [isDarkMode]);
  useEffect(() => () => {
    if (processingTimeoutRef.current) clearTimeout(processingTimeoutRef.current);
    saveLockRef.current = false;
  }, []);

  useEffect(() => {
    if (!isAuthenticated || !isOnline || !hasReceivedInitialSnapshot.current) return;
    const checkInterval = setInterval(() => {
      const last = Number(localStorage.getItem(AUTO_BACKUP_LS_KEY) || 0);
      const dayMs = 24 * 60 * 60 * 1000;
      if (Date.now() - last > dayMs && _driveAccessToken) {
        uploadBackupToDrive({ data, budgets, exportedAt: new Date().toISOString(), version: 'V86.1' })
          .then(() => { localStorage.setItem(AUTO_BACKUP_LS_KEY, String(Date.now())); console.log('✅ Auto backup'); })
          .catch(() => {});
      }
    }, 60 * 60 * 1000);
    return () => clearInterval(checkInterval);
  }, [isAuthenticated, isOnline, data, budgets]);

  if (authLoading) return (
    <div className="flex h-screen items-center justify-center" style={{ background: '#050A14' }}>
      <div className="w-12 h-12 border-[3px] border-[#635BFF] border-t-transparent rounded-full animate-spin"></div>
    </div>
  );

  if (isAuthenticated && cloudSyncStatus === 'pending') {
    return (
      <div className="flex h-screen flex-col items-center justify-center" style={{ background: '#050A14' }}>
        <div className="w-12 h-12 border-[3px] border-[#635BFF] border-t-transparent rounded-full animate-spin mb-4"></div>
        <p className="text-white font-bold text-sm mb-1">جاري مزامنة البيانات...</p>
        <p className="text-xs" style={{ color: '#64748B' }}>بنستقبل آخر نسخة من السحابة</p>
      </div>
    );
  }

  if (!isAuthenticated) return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;

  if (!pinVerified) return (
    <PinLockScreen
      onSuccess={async (pin) => { try { await savePinSession(pin); } catch (e) {} setPinVerified(true); }}
      onLogout={() => {
        firebase.auth().signOut();
        setIsAuthenticated(false);
        sessionStorage.removeItem(PIN_SESSION_KEY);
        setPinVerified(false);
      }}
    />
  );

  const renderActiveView = () => {
    switch (activeTab) {
      case 'dashboard':
        return (
          <DashboardView
            data={data} financeSnapshot={financeSnapshot} liveBalances={liveBalances}

            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })}
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })}
            custodySummary={custodySummary} monthCashback={monthCashback} bankFeesMonth={bankFeesMonth}
          />

      case 'transactions':

            data={data} monthInsights={monthInsights} dispatch={dispatch}
            handleDelete={handleDelete} addNotification={addNotification}
            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })}
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })}
            saveHistory={saveHistory} onBulkDelete={handleBulkDeleteInApp}
          />
        );
      case 'categories':
        return (
          <CategoriesView
            transactions={transactions} selectedMonth={selectedMonth} selectedYear={selectedYear}
            catViewType={catViewType} budgets={budgets} dispatch={dispatch}
            handleDelete={handleDelete}
            onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })}
            onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })}
          />
        );
      case 'loans':
        return (
          <LoansView
            updatedLoans={updatedLoans} cards={cards} recurringItems={recurringItems}
            transactions={transactions} dispatch={dispatch} deleteRecurring={deleteRecurring}
            saveHistory={saveHistory} getLocalISODate={getLocalISODate}
            addNotification={addNotification} data={data}
            selectedMonth={selectedMonth} selectedYear={selectedYear}
          />
        );
      case 'cards':
        return (
          <WalletsAndCardsView
            cards={cards} buildLedger={buildLedger} expandedLedgers={expandedLedgers}
            expandedCardsSection={expandedCardsSection} selectedMonth={selectedMonth}
            selectedYear={selectedYear} dispatch={dispatch} handleDelete={handleDelete}
            handleAddWalletDeposit={handleAddWalletDeposit}
            handleAddWalletWithdrawal={handleAddWalletWithdrawal}
            walletVisibility={walletVisibility} liveBalances={liveBalances}
            saveHistory={saveHistory} addNotification={addNotification} data={data}
            onReconcile={(accountKey) => {
              dispatch({ type: 'SET_RECONCILIATION_MODAL', payload: { accountKey, computedBalance: liveBalances[accountKey] || 0 } });
            }}
          />
        );
      case 'planning':
        return (
          <MonthlyPlanningView
            data={data} monthlyPlans={monthlyPlans} dispatch={dispatch}

      case 'financial-forecast':
        return (

          <LiquidityForecastView

            recurringItems={recurringItems} liveBalances={liveBalances}
            selectedYear={selectedYear} selectedMonth={selectedMonth}
            monthlyPlans={monthlyPlans} liquidityDual={liquidityDual}
          />
