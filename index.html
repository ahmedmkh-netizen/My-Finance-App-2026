                <p className="text-base font-black tracking-tight money tabular">
                  {formatAdaptive(spent)}<span className="text-[9px] font-semibold mr-1" style={{ color: 'var(--text-muted)' }}>ج.م</span>
                </p>
                {count > 0 && <p className="text-[9px] font-bold mt-0.5" style={{ color: 'var(--text-muted)' }}>📋 {count} معاملة</p>}
                {catViewType === 'expense' && budget > 0 && (
                  <div className="mt-2 pt-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
                    <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                      <div style={{ width: `${Math.min(100, (spent / budget) * 100)}%` }} className={`h-full ${overBudget ? 'bg-red-500' : 'bg-emerald-500'}`}></div>
                    </div>
                    <p className="text-[9px] font-bold mt-1" style={{ color: 'var(--text-muted)' }}>من {formatAdaptive(budget)}</p>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
});

/* ═══════════════ RECURRING ITEMS LIST ═══════════════ */
const RecurringItemsList = memo(function RecurringItemsList(props) {
  const items = props.recurringItems || [];
  const dispatch = props.dispatch;
  const saveHistory = props.saveHistory;
  const addNotification = props.addNotification;
  const deleteRecurring = props.deleteRecurring;

  if (items.length === 0) return null;

  const toggleActive = function (id) {
    saveHistory();
    const updated = items.map(function (r) {
      if (r.id === id) return Object.assign({}, r, { active: r.active === false });
      return r;
    });
    dispatch({ type: 'UPDATE_RECURRING_ITEMS', payload: updated });
    addNotification({ type: 'success', title: 'تم التحديث' });
  };

  const openEdit = function (item) {
    dispatch({
      type: 'SET_RECURRING_FORM_DATA',
      payload: {
        id: item.id, title: item.title, amount: String(item.amount),
        day: item.day, category: item.category, type: item.type,
        startMonth: item.startMonth || '', endMonth: item.endMonth || '',
        active: item.active !== false, kind: item.kind || null,
        linkedLoanSystemId: item.linkedLoanSystemId || null,
        linkedCardId: item.linkedCardId || null,
        method: item.method || 'cash',
        transferChannel: item.transferChannel || null
      }
    });
    dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: true });
  };

  const formatRange = function (v) {
    if (!v) return '-';
    const parts = String(v).split('-');
    if (parts.length !== 2) return v;
    const idx = parseInt(parts[1], 10) - 1;
    const found = ALL_MONTHS[idx];
    return parts[0] + '-' + (found ? found : parts[1]);
  };

  return (
    <div className="card p-0 overflow-hidden">
      <div className="p-4 flex items-center justify-between">
        <h3 className="font-black text-sm flex items-center gap-2">
          <Repeat size={14} className="text-blue-500" />
          <span>البنود المتكررة ({items.length})</span>
        </h3>
      </div>
      <div className="px-4 pb-4 space-y-1.5" style={{ borderTop: '1px solid var(--border-subtle)', paddingTop: '12px' }}>
        {items.map(function (r) {
          const isFee = BANK_FEE_CATEGORIES.has(r.category);
          const isMonthlyBen = isBeneficiaryCategorySafe(r.category);
          const isInactive = r.active === false;
          const hasRange = Boolean(r.startMonth || r.endMonth);
          const foundMethod = PAYMENT_METHODS.find(function (p) { return p.id === r.method; });
          const methodLabel = foundMethod ? foundMethod.shortLabel : (r.method || 'Cash');
          let transferLabel = '';
          if (r.transferChannel) {
            const foundCh = PAYMENT_METHODS.find(function (p) { return p.id === r.transferChannel; });
            transferLabel = ' عبر ' + (foundCh ? foundCh.shortLabel : r.transferChannel);
          }
          const amountClass = r.type === 'income' ? 'text-emerald-600' : 'text-red-500';
          const toggleClass = isInactive ? 'text-emerald-500' : 'text-amber-500';
          const rangeText = hasRange ? ' - ' + formatRange(r.startMonth) + ' ← ' + formatRange(r.endMonth) : '';
          return (
            <div key={r.id} onClick={function () { openEdit(r); }}
              className="flex justify-between items-center p-2 rounded-lg cursor-pointer"
              style={{ background: 'var(--bg-muted)', opacity: isInactive ? 0.5 : 1 }}>
              <div className="min-w-0 flex-1">
                <p className="font-bold text-xs truncate">
                  {r.title}{isFee ? ' [بنك]' : ''}{isMonthlyBen ? ' [عائلة]' : ''}{isInactive ? ' [موقوف]' : ''}
                </p>
                <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                  {'يوم ' + r.day + ' - ' + methodLabel + transferLabel + rangeText}
                </p>
              </div>
              <div className="flex items-center gap-1.5 flex-shrink-0" onClick={function (e) { e.stopPropagation(); }}>
                <span className={'font-black text-xs money tabular ' + amountClass}>{fmt(r.amount)}</span>
                <button type="button" onClick={function () { toggleActive(r.id); }} className={'btn btn-ghost p-1 ' + toggleClass}>
                  {isInactive ? <CheckCircle2 size={12} /> : <Clock size={12} />}
                </button>
                <button type="button" onClick={function () { deleteRecurring(r.id); }} className="btn btn-ghost p-1 text-red-500">
                  <Trash2 size={12} />
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
});

/* ═══════════════ LOANS VIEW ═══════════════ */
const LoansView = memo(function LoansView(props) {
  const updatedLoans = props.updatedLoans || [];
  const cards = props.cards || [];
  const recurringItems = props.recurringItems || [];
  const transactions = props.transactions || [];
  const dispatch = props.dispatch;
  const deleteRecurring = props.deleteRecurring;
  const saveHistory = props.saveHistory;
  const addNotification = props.addNotification;
  const data = props.data;
  const selectedMonth = props.selectedMonth;
  const selectedYear = props.selectedYear;
  const getLocalISODateFn = props.getLocalISODate || getLocalISODate;

  const [showAdd, setShowAdd] = useState(false);
  const [activeTab, setActiveTab] = useState('loans');
  const [newLoan, setNewLoan] = useState({
    name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false
  });

  const totalLoans = useMemo(function () {
    return updatedLoans.filter(function (l) { return !l.isReceivable && !l.autoGenerated; }).reduce(function (s, l) { return s + l.remaining; }, 0);
  }, [updatedLoans]);

  const totalReceivable = useMemo(function () {
    return updatedLoans.filter(function (l) { return l.isReceivable; }).reduce(function (s, l) { return s + l.remaining; }, 0);
  }, [updatedLoans]);

  const payables = useMemo(function () {
    return updatedLoans.filter(function (l) { return !l.isReceivable && !l.autoGenerated; });
  }, [updatedLoans]);

  const receivables = useMemo(function () {
    return updatedLoans.filter(function (l) { return l.isReceivable; });
  }, [updatedLoans]);

  const totalCards = useMemo(function () {
    return cards.reduce(function (acc, c) { return acc + Math.max(0, computeCardDebt(data, c)); }, 0);
  }, [cards, data]);

  const hanyPayable = useMemo(function () { return computeHanyPayable(data); }, [data]);

  const addLoan = function () {
    const nameCheck = validateText(newLoan.name, { min: 2, max: 200, label: 'الاسم' });
    if (!nameCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: nameCheck.error }); return; }
    const amountCheck = validateAmount(newLoan.totalAmount, { min: 0.01, max: 10000000, label: 'المبلغ' });
    if (!amountCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: amountCheck.error }); return; }
    saveHistory();
    const payload = (data.loans || []).concat([{
      id: Date.now(), name: nameCheck.value, totalAmount: roundMoney(amountCheck.value),
      prePaidAmount: 0, monthlyInstallment: roundMoney(safeNumber(newLoan.monthlyInstallment)),
      dueDay: safeNumber(newLoan.dueDay, 1), interest: '', description: newLoan.description || '',
      type: newLoan.isReceivable ? 'receivable' : 'debt', isReceivable: newLoan.isReceivable, paused: false
    }]);
    dispatch({ type: 'UPDATE_LOANS', payload: payload });
    setShowAdd(false);
    setNewLoan({ name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false });
    addNotification({ type: 'success', title: 'تمت الإضافة' });
  };

  const handleCollectReceivable = function (loan, sourceTx) {
    const d = new Date();
    const y = d.getFullYear();
    const m = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, y, m)) { addNotification({ type: 'error', title: 'الشهر مغلق' }); return; }
    const alreadyCollected = transactions.some(function (t) {
      return t.sourceReceivableId === loan.id && t.month === m && (t.year || y) === y && t.status === 'paid';
    });
    if (alreadyCollected) { addNotification({ type: 'warning', title: 'تم التحصيل مسبقاً هذا الشهر', duration: 6000 }); return; }
    saveHistory();
    if (sourceTx) {
      const updated = transactions.map(function (t) {
        if (t.id === sourceTx.id) return Object.assign({}, t, { status: 'paid', date: getLocalISODateFn(d), sourceReceivableId: loan.id });
        return t;
      });
      dispatch({ type: 'UPDATE_TRANSACTIONS', payload: updated });
      addNotification({ type: 'success', title: 'تم اعتماد القسط', message: fmt(sourceTx.amount) + ' ج.م' });
      return;
    }
    const orphanPending = transactions.find(function (t) {
      return t.status !== 'paid' && t.month === m && (t.year || y) === y
        && t.category === 'تكييف محمود' && !t.sourceReceivableId
        && safeNumber(t.amount) === safeNumber(loan.monthlyInstallment);
    });
    if (orphanPending) {
      const updated = transactions.map(function (t) {
        if (t.id === orphanPending.id) return Object.assign({}, t, { status: 'paid', date: getLocalISODateFn(d), sourceReceivableId: loan.id });
        return t;
      });
      dispatch({ type: 'UPDATE_TRANSACTIONS', payload: updated });
      addNotification({ type: 'success', title: 'تم اعتماد القيد المعلق', message: fmt(orphanPending.amount) + ' ج.م' });
      return;
    }
    const newTx = {
      id: 'recv-manual-' + getSafeId(), type: 'income', kind: KIND.OPERATIONAL,
      category: 'تكييف محمود', amount: safeNumber(loan.monthlyInstallment),
      description: 'تحصيل قسط ' + loan.name + ' - ' + m + ' ' + y,
      method: 'cash', date: getLocalISODateFn(d), month: m, year: y, monthIndex: d.getMonth(),
      subType: 'deposit', status: 'paid', sourceReceivableId: loan.id,
      createdAt: new Date().toISOString()
    };
    const merged = sortTransactions([newTx].concat(transactions));
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: merged });
    addNotification({ type: 'success', title: 'تم التحصيل', message: fmt(loan.monthlyInstallment) + ' ج.م' });
  };

  const handleTogglePause = function (loan) {
    saveHistory();
    const updated = (data.loans || []).map(function (l) {
      if (l.id === loan.id) return Object.assign({}, l, { paused: !l.paused });
      return l;
    });
    dispatch({ type: 'UPDATE_LOANS', payload: updated });
    addNotification({ type: loan.paused ? 'success' : 'warning', title: loan.paused ? 'تم التفعيل' : 'تم الإيقاف المؤقت' });
  };

  const hasLoans = updatedLoans.length > 0;
  const hasRecurring = recurringItems.length > 0;
  const netDebt = totalLoans + totalCards - totalReceivable;

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="sub-tab-switcher">
        <button onClick={function () { setActiveTab('loans'); }} className={'sub-tab-btn ' + (activeTab === 'loans' ? 'active' : '')}>
          <Banknote size={14} /><span>القروض والمستحقات</span>
        </button>
        <button onClick={function () { setActiveTab('hany'); }} className={'sub-tab-btn ' + (activeTab === 'hany' ? 'active' : '')}>
          <StoreIcon size={14} /><span>دفتر هاني</span>
          {hanyPayable > 0 && (<span className="badge badge-warning text-[9px] px-1.5 py-0 money tabular">{fmtShort(hanyPayable)}</span>)}
        </button>
      </div>

      {activeTab === 'hany' ? (
        <HanyLedgerView data={data} dispatch={dispatch} saveHistory={saveHistory}
          addNotification={addNotification} selectedYear={selectedYear} selectedMonth={selectedMonth} />
      ) : (
        <div className="space-y-4">
          <div className="card">
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>إجمالي المديونية الصافية</p>
            <h2 className="text-3xl font-black tracking-tight text-gradient money tabular">
              {formatAdaptive(netDebt)}<span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <div className="grid grid-cols-3 gap-2 mt-3">
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">القروض</p>
                <p className="text-xs font-black text-red-600 money tabular">{formatAdaptive(totalLoans)}</p>
              </div>
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">البطاقات</p>
                <p className="text-xs font-black text-red-600 money tabular">{formatAdaptive(totalCards)}</p>
              </div>
              <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
                <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">مستحقات لك</p>
                <p className="text-xs font-black text-emerald-600 money tabular">{formatAdaptive(totalReceivable)}</p>
              </div>
            </div>
            <div className="flex gap-2 mt-3 flex-wrap">
              <button onClick={function () { setShowAdd(true); }} className="btn btn-primary text-xs flex-1"><Plus size={14} /><span>إضافة التزام</span></button>
              <button onClick={function () { dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: true }); }} className="btn btn-secondary text-xs flex-1"><Repeat size={14} /><span>متكرر</span></button>
            </div>
          </div>

          {!hasLoans && !hasRecurring && (
            <div className="card text-center p-12">
              <Banknote size={40} className="mx-auto mb-3 text-[color:var(--accent)]" />
              <h3 className="text-base font-black mb-2">لا توجد التزامات بعد</h3>
              <p className="text-xs mb-4" style={{ color: 'var(--text-muted)' }}>أضف أول قرض أو بند متكرر لتبدأ المتابعة</p>
              <button onClick={function () { setShowAdd(true); }} className="btn btn-primary text-xs"><Plus size={14} /><span>إضافة أول التزام</span></button>
            </div>
          )}

          {receivables.length > 0 && (
            <div className="space-y-2">
              <h3 className="font-black text-sm flex items-center gap-2 text-emerald-600">
                <TrendingUp size={14} /><span>مستحقات لك ({receivables.length})</span>
              </h3>
              {receivables.map(function (loan) {
                const monthly = safeNumber(loan.monthlyInstallment);
                const explicitTotal = safeNumber(loan.totalInstallments);
                const explicitPaid = safeNumber(loan.paidInstallments);
                const remainingMonths = monthly > 0 ? Math.ceil(safeNumber(loan.remaining) / monthly) : 0;
                const totalMonths = explicitTotal > 0 ? explicitTotal : (explicitPaid + remainingMonths);
                const paidMonths = explicitTotal > 0 ? explicitPaid : Math.max(0, totalMonths - remainingMonths);
                const pct = safeNumber(loan.totalAmount) > 0 ? (safeNumber(loan.totalPaid) / safeNumber(loan.totalAmount)) * 100 : 0;
                const isComplete = loan.remaining <= 0.005;
                const thisMonthCollected = transactions.some(function (t) {
                  return t.sourceReceivableId === loan.id && t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status === 'paid';
                });
                const thisMonthPending = transactions.find(function (t) {
                  return t.sourceReceivableId === loan.id && t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status !== 'paid';
                });
                return (
                  <div key={loan.id} className="card">
                    <div className="flex justify-between items-start gap-3 flex-wrap mb-3">
                      <div className="flex items-center gap-3 flex-1 min-w-0">
                        <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400 flex-shrink-0"><TrendingUp size={20} /></div>
                        <div className="min-w-0">
                          <h4 className="font-bold text-sm truncate flex items-center gap-2 flex-wrap">
                            <span>{loan.name}</span>
                            {loan.paused && <span className="badge badge-warning text-[10px]">موقوف</span>}
                          </h4>
                          <p className="text-[11px] text-emerald-600 font-semibold mt-0.5">
                            {'يوم ' + loan.dueDay + ' - '}<span className="money tabular">{fmt(monthly)}</span>{' ج.م شهرياً'}
                          </p>
                        </div>
                      </div>
                      <div className="flex gap-1">
                        <button type="button" onClick={function () { handleTogglePause(loan); }}
                          className={'btn btn-ghost p-2 ' + (loan.paused ? 'text-emerald-500' : 'text-amber-500')}>
                          {loan.paused ? <CheckCircle2 size={16} /> : <Clock size={16} />}
                        </button>
                        <button type="button" onClick={function () { dispatch({ type: 'SET_EDITING_LOAN', payload: loan }); }} className="btn btn-ghost p-2"><Edit size={16} /></button>
                      </div>
                    </div>
                    <div className="grid grid-cols-3 gap-2 mb-3">
                      <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
                        <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">محصّل</p>
                        <p className="text-sm font-black text-emerald-600 mt-0.5 money tabular">{fmt(loan.totalPaid)}</p>
                      </div>
                      <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
                        <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">المتبقي</p>
                        <p className="text-sm font-black text-blue-600 mt-0.5 money tabular">{fmt(loan.remaining)}</p>
                      </div>
                      <div className="p-2.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-center">
                        <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">الأقساط</p>
                        <p className="text-sm font-black text-purple-600 mt-0.5 money tabular">{paidMonths + '/' + totalMonths}</p>
                      </div>
                    </div>
                    <div className="w-full rounded-full h-1.5 overflow-hidden mb-3" style={{ background: 'var(--bg-muted)' }}>
                      <div className="bg-emerald-500 h-full rounded-full transition-all" style={{ width: Math.min(100, pct) + '%' }} />
                    </div>
                    <div className="flex justify-end gap-2 flex-wrap">
                      {thisMonthCollected ? (
                        <div className="badge badge-success px-3 py-1.5"><CheckCircle2 size={12} /><span>{'تم تحصيل ' + selectedMonth}</span></div>
                      ) : isComplete ? (
                        <div className="badge badge-success px-3 py-1.5"><CheckCircle2 size={12} /><span>اكتمل التحصيل</span></div>
                      ) : loan.paused ? (
                        <div className="badge badge-warning px-3 py-1.5">موقوف</div>
                      ) : thisMonthPending ? (
                        <button onClick={function () { handleCollectReceivable(loan, thisMonthPending); }} className="btn btn-primary text-xs">
                          <CheckCircle2 size={14} /><span>اعتماد</span><span className="money tabular">{fmt(thisMonthPending.amount)}</span>
                        </button>
                      ) : (
                        <button onClick={function () { handleCollectReceivable(loan, null); }} className="btn btn-primary text-xs">
                          <Banknote size={14} /><span>تحصيل</span><span className="money tabular">{fmt(monthly)}</span><span>الآن</span>
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {payables.length > 0 && (
            <div className="space-y-2">
              <h3 className="font-black text-sm flex items-center gap-2 text-red-600">
                <TrendingDown size={14} /><span>مديونيات ({payables.length})</span>
              </h3>
              {payables.map(function (loan) {
                const isPaid = loan.remaining <= 0;
                const pct = loan.totalAmount > 0 ? (loan.totalPaid / loan.totalAmount) * 100 : 0;
                const debtClass = isPaid ? 'text-emerald-600' : 'text-red-600';
                const iconBg = isPaid ? 'bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600' : 'bg-red-50 dark:bg-red-950/30 text-red-500';
                return (
                  <div key={loan.id} className="card py-3">
                    <div className="flex justify-between items-start gap-2 mb-2">
                      <div className="flex items-center gap-2 flex-1 min-w-0">
                        <div className={'p-1.5 rounded-lg flex-shrink-0 ' + iconBg}><Banknote size={14} /></div>
                        <div className="min-w-0">
                          <h4 className="font-bold text-xs truncate">{loan.name}</h4>
                          <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{'يوم ' + loan.dueDay}</p>
                        </div>
                      </div>
                      <button type="button" onClick={function () { dispatch({ type: 'SET_EDITING_LOAN', payload: loan }); }} className="btn btn-ghost p-1"><Edit size={12} /></button>
                    </div>
                    <div className="flex justify-between items-center mb-2">
                      <p className={'text-base font-black money tabular ' + debtClass}>{fmt(loan.remaining)}</p>
                      <p className="text-xs font-bold money tabular" style={{ color: 'var(--text-muted)' }}>{'قسط: ' + fmt(loan.monthlyInstallment)}</p>
                    </div>
                    <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                      <div className="bg-emerald-500 h-full rounded-full" style={{ width: Math.min(100, pct) + '%' }} />
                    </div>
                    {!isPaid && loan.monthlyInstallment > 0 && (
                      <div className="flex justify-end gap-1.5 mt-2">
                        <button onClick={function () {
                          dispatch({ type: 'SET_FORM_MODE', payload: 'add' });
                          dispatch({
                            type: 'SET_FORM_DATA',
                            payload: {
                              type: 'expense', category: 'الالتزامات البنكية والتمويلية',
                              amount: loan.monthlyInstallment, description: 'قسط ' + loan.name,
                              linkedLoanId: loan.id, method: 'cash',
                              date: getLocalISODateFn(), status: 'pending', subType: 'withdrawal'
                            }
                          });
                          dispatch({ type: 'SET_FORM_OPEN', payload: true });
                        }} className="btn btn-secondary text-[10px] py-1 px-2">
                          <CheckCircle2 size={10} /><span>سداد</span>
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {hasRecurring && (
            <RecurringItemsList recurringItems={recurringItems} dispatch={dispatch}
              saveHistory={saveHistory} addNotification={addNotification} deleteRecurring={deleteRecurring} />
          )}
        </div>
      )}

      {showAdd && (
        <Modal isOpen={true} onClose={function () { setShowAdd(false); }} title="التزام جديد" icon="📋">
          <div className="space-y-3">
            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الاسم *</label>
              <input className="input-field text-sm" value={newLoan.name}
                onChange={function (e) { setNewLoan(Object.assign({}, newLoan, { name: e.target.value })); }} />
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ *</label>
                <input type="text" inputMode="decimal" className="input-field input-num text-sm" value={newLoan.totalAmount}
                  onChange={function (e) { setNewLoan(Object.assign({}, newLoan, { totalAmount: e.target.value })); }} />
              </div>
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>القسط</label>
                <input type="text" inputMode="decimal" className="input-field input-num text-sm" value={newLoan.monthlyInstallment}
                  onChange={function (e) { setNewLoan(Object.assign({}, newLoan, { monthlyInstallment: e.target.value })); }} />
              </div>
            </div>
            <label className="flex items-center gap-3 p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 cursor-pointer">
              <input type="checkbox" checked={newLoan.isReceivable}
                onChange={function (e) { setNewLoan(Object.assign({}, newLoan, { isReceivable: e.target.checked })); }}
                className="w-4 h-4 accent-emerald-600" />
              <span className="text-xs font-bold text-emerald-700 dark:text-emerald-400">مستحق لي</span>
            </label>
            <button onClick={addLoan} className="btn btn-primary w-full py-2.5 text-sm"><span>إضافة</span></button>
          </div>
        </Modal>
      )}
    </div>
  );
});

/* ═══════════════ GENERIC LEDGER COMPONENT ═══════════════ */
const GenericLedgerComponent = memo(({
  walletKey, ledgerData, liveBalance, isExpanded, onToggle, theme,
  onAddDeposit, onAddWithdrawal, walletVisibility, onToggleVisibility, onReconcile
}) => {
  const [filter, setFilter] = useState('all');
  const [dateFilter, setDateFilter] = useState('');

  const validatedLedger = useMemo(() => {
    try {
      return (ledgerData || []).map(item => ({
        ...item, amount: safeNumber(item.amount), runningBalance: safeNumber(item.runningBalance),
        date: item.date || 'غير معروف', description: item.description || 'بدون وصف',
        subType: item.subType || (item.type === 'income' ? 'deposit' : 'withdrawal')
      })).filter(item => item.amount > 0);
    } catch { return []; }
  }, [ledgerData]);

  const filteredLedger = useMemo(() => validatedLedger.filter(i => {
    if (filter === 'deposit' && i.subType !== 'deposit') return false;
    if (filter === 'withdrawal' && i.subType !== 'withdrawal') return false;
    if (dateFilter && !(i.date || '').includes(dateFilter)) return false;
    return true;
  }), [validatedLedger, filter, dateFilter]);

  const stats = useMemo(() => ({
    deposits: validatedLedger.filter(t => t.subType === 'deposit').reduce((s, t) => s + t.amount, 0),
    withdrawals: validatedLedger.filter(t => t.subType === 'withdrawal').reduce((s, t) => s + t.amount, 0),
    currentBalance: safeNumber(liveBalance)
  }), [validatedLedger, liveBalance]);

  const mask = (v) => !walletVisibility?.[walletKey] ? '•••••' : formatAdaptive(v);
  const IconComponent = theme.icon;
  const stop = (e, action) => { e.stopPropagation(); e.preventDefault(); if (action) action(); };
  const isWallet = theme.group === 'wallet';
  const isBank = theme.group === 'bank';
  const isCash = theme.group === 'cash';

  return (
    <div className="card mb-3">
      <div className="flex justify-between items-center cursor-pointer -m-[18px] p-[18px]" onClick={onToggle}>
        <div className="flex items-center gap-3 min-w-0 flex-1">
          <div className="p-2.5 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>
            <IconComponent size={20} />
          </div>
          <div className="min-w-0">
            <h3 className="font-bold text-sm truncate flex items-center gap-2 flex-wrap">
              {theme.title}
              {isWallet && <span className="badge badge-accent text-[9px]">محفظة</span>}
              {isBank && <span className="badge badge-neutral text-[9px]">بنك</span>}
              {isCash && <span className="badge badge-success text-[9px]">كاش</span>}
            </h3>
            <p className="text-[11px] mt-0.5 truncate" style={{ color: 'var(--text-muted)' }}>{theme.subtitle}</p>
          </div>
        </div>
        <div className="flex items-center gap-1 flex-shrink-0">
          <button type="button" aria-label="إيداع" onClick={(e) => stop(e, () => onAddDeposit?.(walletKey))} className="p-2 bg-emerald-500 text-white rounded-lg hover:bg-emerald-600 transition-colors"><ArrowDownCircle size={14} /></button>
          <button type="button" aria-label="سحب" onClick={(e) => stop(e, () => onAddWithdrawal?.(walletKey))} className="p-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"><ArrowUpCircle size={14} /></button>
          {onReconcile && (
            <button type="button" aria-label="مطابقة" onClick={(e) => stop(e, () => onReconcile(walletKey))} className="p-2 hover:bg-[color:var(--bg-muted)] rounded-lg transition-colors" style={{ color: 'var(--text-muted)' }} title="مطابقة الرصيد"><Scale size={14} /></button>
          )}
          <button type="button" aria-label="إظهار" onClick={(e) => stop(e, () => onToggleVisibility?.(walletKey))} className="p-2 hover:bg-[color:var(--bg-muted)] rounded-lg transition-colors" style={{ color: 'var(--text-muted)' }}>
            {walletVisibility?.[walletKey] ? <EyeOff size={14} /> : <Eye size={14} />}
          </button>
          <ChevronDown size={18} className={`transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
        </div>
      </div>
      {isExpanded && (
        <div className="mt-4 pt-4 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
          {validatedLedger.length === 0 ? (
            <div className="p-6 text-center">
              <p className="font-medium mb-3 text-sm" style={{ color: 'var(--text-secondary)' }}>لا توجد عمليات بعد آخر تحديث رصيد</p>
              <button type="button" onClick={(e) => stop(e, () => onAddDeposit?.(walletKey))} className="btn btn-primary text-sm"><Plus size={16} /> إضافة أول عملية</button>
            </div>
          ) : (
            <React.Fragment>
              <div className="grid grid-cols-3 gap-2 mb-3">
                <div className="text-center p-2.5 bg-emerald-50 dark:bg-emerald-950/30 rounded-xl">
                  <div className="text-[10px] text-emerald-700 dark:text-emerald-400 font-bold mb-1">إيداع</div>
                  <div className="text-sm font-black text-emerald-600 dark:text-emerald-400 money tabular">{mask(stats.deposits)}</div>
                </div>
                <div className="text-center p-2.5 bg-red-50 dark:bg-red-950/30 rounded-xl">
                  <div className="text-[10px] text-red-700 dark:text-red-400 font-bold mb-1">سحب</div>
                  <div className="text-sm font-black text-red-600 dark:text-red-400 money tabular">{mask(stats.withdrawals)}</div>
                </div>
                <div className="text-center p-2.5 bg-blue-50 dark:bg-blue-950/30 rounded-xl">
                  <div className="text-[10px] text-blue-700 dark:text-blue-400 font-bold mb-1">الرصيد</div>
                  <div className="text-sm font-black text-blue-600 dark:text-blue-400 money tabular">{mask(stats.currentBalance)}</div>
                </div>
              </div>
              <div className="flex gap-2 mb-3 flex-wrap">
                <select className="input-field text-xs py-2 flex-1 min-w-[100px]" value={filter} onChange={(e) => setFilter(e.target.value)}>
                  <option value="all">الكل</option>
                  <option value="deposit">إيداعات</option>
                  <option value="withdrawal">سحوبات</option>
                </select>
                <input type="month" className="input-field text-xs py-2 flex-1 min-w-[120px]" value={dateFilter} onChange={(e) => setDateFilter(e.target.value)} />
              </div>
              <div className="overflow-x-auto -mx-4">
                <table className="w-full text-right text-sm">
                  <thead>
                    <tr style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                      <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>التاريخ</th>
                      <th className="p-2.5 text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الوصف</th>
                      <th className="p-2.5 text-[10px] font-bold text-left" style={{ color: 'var(--text-muted)' }}>المبلغ</th>
                      <th className="p-2.5 text-[10px] font-bold text-left" style={{ color: 'var(--text-muted)' }}>الرصيد</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredLedger.map((t) => (
                      <tr key={t.id} className="hover:bg-[color:var(--bg-muted)]">
                        <td className="p-2.5 text-[11px] whitespace-nowrap" style={{ color: 'var(--text-muted)' }}>{t.date}</td>
                        <td className="p-2.5 font-bold text-xs">{t.description} <FamilyBadge tx={t} /> <CardPaymentBadge tx={t} /> <HanySettleBadge tx={t} /></td>
                        <td className={`p-2.5 text-left font-black text-xs money tabular ${t.subType === 'deposit' ? 'text-emerald-600' : 'text-red-500'}`}>
                          {t.subType === 'deposit' ? '+' : '-'}{mask(t.amount)}
                        </td>
                        <td className="p-2.5 text-left font-bold text-[11px] money tabular" style={{ color: 'var(--text-secondary)' }}>{mask(t.runningBalance)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
});

/* ═══════════════ CASHBACK VIEW ═══════════════ */
const CashbackView = memo(({ data, dispatch, saveHistory, addNotification, cards, selectedYear, selectedMonth }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [newTracker, setNewTracker] = useState({
    cardId: cards[0]?.id || 1, month: selectedMonth, year: selectedYear,
    expectedAmount: '', receivedAmount: '', receivedDate: '', status: CASHBACK_STATUS.EXPECTED, notes: ''
  });

  const trackers = data?.cashbackTrackers || [];
  const summary = useMemo(() => computeCashbackSummary(trackers), [trackers]);
  const filteredTrackers = useMemo(() => trackers.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear), [trackers, selectedMonth, selectedYear]);

  const monthExpected = filteredTrackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
  const monthReceived = filteredTrackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
  const monthPending = monthExpected - monthReceived;

  const addTracker = () => {
    const check = validateAmount(newTracker.expectedAmount, { min: 0.01, max: 1000000, label: 'المبلغ المتوقع' });
    if (!check.valid) { addNotification({ type: 'error', title: 'خطأ', message: check.error }); return; }
    saveHistory();
    const expected = roundMoney(check.value);
    const received = roundMoney(parseNumberInput(newTracker.receivedAmount));
    const tracker = {
      ...newTracker, id: getSafeId(), expectedAmount: expected, receivedAmount: received,
      status: received >= expected ? CASHBACK_STATUS.RECEIVED : received > 0 ? CASHBACK_STATUS.PARTIAL : CASHBACK_STATUS.EXPECTED
    };
    dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: [...trackers, tracker] });
    setShowAdd(false);
    setNewTracker({ cardId: cards[0]?.id || 1, month: selectedMonth, year: selectedYear, expectedAmount: '', receivedAmount: '', receivedDate: '', status: CASHBACK_STATUS.EXPECTED, notes: '' });
    addNotification({ type: 'success', title: 'تم الحفظ' });
  };

  const markReceived = async (tracker) => {
    const now = new Date();
    const txYear = now.getFullYear(), txMonth = ALL_MONTHS[now.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { addNotification({ type: 'error', title: 'شهر مغلق', duration: 6000 }); return; }
    const card = cards.find(c => c.id === tracker.cardId);
    const cardMethod = card ? getCardMethod(card) : null;

    const choice = await showInputModal({
      title: 'أين استلمت الكاش باك؟', icon: '🎁',
      message: `البطاقة: ${card?.bank} - ${card?.name}\n\n1 = على البطاقة (خصم من المديونية)\n2 = نقدي (إضافة للكاش)\n\nاكتب الرقم:`,
      inputValue: '1', numeric: true, confirmText: 'تأكيد'
    });
    if (choice === null) return;
    const choiceNum = parseInt(choice, 10);
    if (choiceNum !== 1 && choiceNum !== 2) { addNotification({ type: 'error', title: 'اختر 1 أو 2' }); return; }
    const useCard = choiceNum === 1;
    const method = useCard && cardMethod ? cardMethod : 'cash';
    saveHistory();

    const updated = trackers.map(t => t.id === tracker.id ? { ...t, receivedAmount: t.expectedAmount, receivedDate: getLocalISODate(), status: CASHBACK_STATUS.RECEIVED } : t);
    dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: updated });

    const newTx = {
      id: getSafeId(), type: 'income', kind: KIND.OPERATIONAL, category: 'استرداد كاش باك',
      amount: safeNumber(tracker.expectedAmount),
      description: `كاش باك - ${card?.name || ''} (${useCard ? 'على البطاقة' : 'نقدي'})`,
      method, date: getLocalISODate(now), month: txMonth, year: txYear, monthIndex: now.getMonth(),
      subType: 'deposit', status: 'paid',
      linkedCardId: useCard && card ? card.id : undefined,
      createdAt: new Date().toISOString()
    };
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: sortTransactions([newTx, ...(data.transactions || [])]) });
    addNotification({ type: 'success', title: 'تم استلام الكاش باك', message: `${fmt(tracker.expectedAmount)} ج.م — ${useCard ? 'على البطاقة' : 'نقدي'}` });
  };

  const deleteTracker = (id) => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'حذف السجل', message: 'سيتم حذف سجل الكاش باك',
      onConfirm: () => { saveHistory(); dispatch({ type: 'UPDATE_CASHBACK_TRACKERS', payload: trackers.filter(t => t.id !== id) }); addNotification({ type: 'success', title: 'تم الحذف' }); },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div>
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>كاش باك {selectedMonth}</p>
            <h2 className="text-3xl font-black tracking-tight text-emerald-600 money tabular">
              {formatAdaptive(monthReceived)}<span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <p className="text-[11px] font-semibold mt-2" style={{ color: 'var(--text-muted)' }}>
              متوقع: <span className="money tabular">{formatAdaptive(monthExpected)}</span> • معلق: <span className="money tabular">{formatAdaptive(monthPending)}</span>
            </p>
          </div>

                  <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600"><Gift size={14} /></div>
                  <div>
                    <h4 className="font-bold text-xs">{card ? `${card.bank} - ${card.name} • ••••${card.last4}` : 'غير محدد'}</h4>

              <div className="flex justify-between text-xs mb-1.5">
                <span style={{ color: 'var(--text-muted)' }}>

              </div>
              <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                <div className={`h-full ${pct >= 100 ? 'bg-emerald-500' : pct > 0 ? 'bg-amber-500' : 'bg-slate-300'}`} style={{ width: `${Math.min(100, pct)}%` }}></div>

      {showAdd && (
        <Modal isOpen={true} onClose={() => setShowAdd(false)} title="متتبع كاش باك" icon="🎁">
          <div className="space-y-3">

              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>البطاقة</label>
              <select className="input-field" value={newTracker.cardId} onChange={e => setNewTracker({ ...newTracker, cardId: Number(e.target.value) })}>
                {cards.map(c => <option key={c.id} value={c.id}>{c.bank} - {c.name} • ••••{c.last4}</option>)}

            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الشهر</label>
                <select className="input-field text-sm" value={newTracker.month} onChange={e => setNewTracker({ ...newTracker, month: e.target.value })}>
                  {getMonthsForYear(newTracker.year).map(m => <option key={m} value={m}>{m}</option>)}
                </select>
              </div>
              <div>
                <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>السنة</label>
                <select className="input-field text-sm" value={newTracker.year} onChange={e => setNewTracker({ ...newTracker, year: Number(e.target.value) })}>
                  {YEARS_LIST.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>
            </div>
            <div>
              <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>المبلغ المتوقع *</label>
              <input type="text" inputMode="decimal" className="input-field input-num text-base text-center" style={{ color: 'var(--accent)' }} value={newTracker.expectedAmount} onChange={e => setNewTracker({ ...newTracker, expectedAmount: e.target.value })} placeholder="0.00" />
            </div>
            <button onClick={addTracker} className="btn btn-primary w-full py-2.5 text-sm"><Save size={14} /> إضافة</button>
          </div>
        </Modal>
      )}
    </div>
  );
});

            <Banknote size={12} /> سداد

/* ═══════════════ PROVIDER GROUP CARD ═══════════════ */
const ProviderGroupCard = memo(({ providerKey, items, liveBalances, data, dispatch, onItemClick, defaultExpanded = true }) => {
  const [isExpanded, setIsExpanded] = useState(defaultExpanded);
  const provider = PROVIDERS[providerKey];
  if (!provider || items.length === 0) return null;

  const totalBalance = items.reduce((sum, item) => {
    if (item.type === 'card') return sum + Math.max(0, computeCardDebt(data, item));
    return sum + safeNumber(liveBalances[item.key]);
  }, 0);

  return (
    <div className="provider-group">
      <div className="provider-header" onClick={() => setIsExpanded(!isExpanded)}>
        <div className="flex items-center gap-3 min-w-0 flex-1">
          <div className="w-10 h-10 rounded-xl flex items-center justify-center text-xl flex-shrink-0"
            style={{ background: `${provider.color}15`, color: provider.color }}>
            {provider.icon}
          </div>
          <div className="min-w-0">
            <h3 className="font-black text-sm truncate">{provider.name}</h3>
            <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
              {items.length} {items.length === 1 ? 'عنصر' : 'عناصر'}
            </p>
          </div>
        </div>
        <div className="flex items-center gap-3 flex-shrink-0">
          <div className="text-left">
            <p className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>الإجمالي</p>
            <p className="font-black text-sm money tabular" style={{ color: provider.color }}>
              {formatAdaptive(totalBalance)}
            </p>
          </div>
          <ChevronDown size={16} className={`transition-transform ${isExpanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
        </div>
      </div>
      {isExpanded && (
        <div className="provider-body">
          {items.map(item => (
            <ProviderItemRow key={item.key || item.id} item={item} data={data} liveBalances={liveBalances}
              dispatch={dispatch} onItemClick={onItemClick} providerColor={provider.color} />
          ))}
        </div>
      )}
    </div>
  );
});

/* ═══════════════ PROVIDER ITEM ROW ═══════════════ */
const ProviderItemRow = memo(({ item, data, liveBalances, dispatch, onItemClick, providerColor }) => {
  const isCard = item.type === 'card';
  const isAccount = item.type === 'account';

  let balance = 0;
  let label = '';
  let sublabel = '';
  let isNegative = false;
  let icon = '';

  if (isCard) {
    balance = computeCardDebt(data, item);
    const limit = safeNumber(item.limit);
    const available = Math.max(0, limit - Math.max(0, balance));
    label = item.displayName || `💳 ${item.bank} ${item.name} • ${item.last4}`;
    sublabel = `متاح: ${formatAdaptive(available)} • حد: ${formatAdaptive(limit)}`;
    isNegative = balance > 0;
    icon = '💳';
  } else if (isAccount) {
    balance = safeNumber(liveBalances[item.key]);
    label = item.label || ACCOUNT_SHORT_NAMES[item.key] || item.key;
    sublabel = item.last4 ? `•••• ${item.last4}` : '';
    isNegative = balance < 0;
    icon = DEFAULT_ACCOUNTS[item.key]?.type === 'wallet' ? '📱' :
           DEFAULT_ACCOUNTS[item.key]?.type === 'cash' ? '💵' : '💰';
  }

  const handleClick = () => {
    if (onItemClick) {
      onItemClick(item);
    } else if (isCard) {
      dispatch({ type: 'SET_VIEWING_CARD_STATEMENT', payload: item });
    } else if (isAccount) {
      const walletConfig = WALLET_CONFIGS[item.key];
      if (walletConfig) {
        dispatch({ type: 'TOGGLE_LEDGER', payload: item.key });
      }
    }
  };

  return (
    <button type="button" className="provider-item-row" onClick={handleClick}>
      <div className="flex items-center gap-3 min-w-0 flex-1">
        <span className="text-lg flex-shrink-0">{icon}</span>
        <div className="min-w-0">
          <p className="font-bold text-xs truncate">{label}</p>
          {sublabel && <p className="text-[10px] font-semibold mt-0.5 truncate" style={{ color: 'var(--text-muted)' }}>{sublabel}</p>}
        </div>
      </div>
      <div className="flex items-center gap-2 flex-shrink-0">
        <div className="text-left">
          {isCard && (
            <span className={`font-black text-sm money tabular ${isNegative ? 'text-red-600' : 'text-emerald-600'}`}>
              {formatAdaptive(Math.abs(balance))}
            </span>
          )}
          {isAccount && (
            <span className={`font-black text-sm money tabular ${isNegative ? 'text-red-600' : 'text-emerald-600'}`}>
              {formatAdaptive(balance)}
            </span>
          )}
        </div>
        <ChevronLeft size={14} style={{ color: 'var(--text-muted)' }} />
      </div>
    </button>
  );
});

/* ═══════════════ WALLETS AND CARDS VIEW ═══════════════ */
const WalletsAndCardsView = memo(({
  cards, buildLedger, expandedLedgers, expandedCardsSection, selectedMonth, selectedYear,
  dispatch, handleDelete, handleAddWalletDeposit, handleAddWalletWithdrawal,
  walletVisibility, liveBalances, saveHistory, addNotification, data, onReconcile
}) => {
  const [activeTab, setActiveTab] = useState('wallets');
  const [showAddCard, setShowAddCard] = useState(false);
  const [viewMode, setViewMode] = useState('grouped');
  const [newCard, setNewCard] = useState({
    name: '', bank: '', limit: '', last4: '', expiry: '', holderName: '',
    dueDate: '05 من كل شهر', statementDay: 15, theme: 'silver', cashbackRate: 1,
    providerKey: 'cib'
  });

  const cashbackSummary = useMemo(() => {
    const trackers = (data?.cashbackTrackers || []).filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
    const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0);
    const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0);
    return { expected, received, pending: expected - received };
  }, [data?.cashbackTrackers, selectedMonth, selectedYear]);

  const totalCardDebt = useMemo(() =>
    cards.reduce((s, c) => s + Math.max(0, computeCardDebt(data, c)), 0)
  , [cards, data]);

  const groupedData = useMemo(() => {
    const groups = {};
    Object.keys(PROVIDERS).forEach(pk => { groups[pk] = []; });

    ACCOUNT_KEYS.forEach(k => {
      const acc = data.accountsData?.[k] || DEFAULT_ACCOUNTS[k];
      const pk = acc?.providerKey || 'cash';
      if (groups[pk]) {
        groups[pk].push({
          type: 'account', key: k,
          label: acc?.label || ACCOUNT_SHORT_NAMES[k],
          balance: safeNumber(liveBalances[k])
        });
      }
    });

    (data.cards || []).forEach(card => {
      const pk = card.providerKey || 'cib';
      if (groups[pk]) {
        groups[pk].push({ ...card, type: 'card' });
      }
    });

    return Object.keys(PROVIDERS)
      .sort((a, b) => PROVIDERS[a].order - PROVIDERS[b].order)
      .map(pk => ({ providerKey: pk, items: groups[pk] }))
      .filter(g => g.items.length > 0);
  }, [data.accountsData, data.cards, liveBalances]);

  const addCard = () => {
    if (!newCard.name || !newCard.bank) { addNotification({ type: 'error', title: 'الاسم والبنك مطلوبان' }); return; }
    const limitCheck = validateAmount(newCard.limit, { min: 100, max: 10000000, label: 'الحد' });
    if (!limitCheck.valid) { addNotification({ type: 'error', title: 'خطأ', message: limitCheck.error }); return; }
    saveHistory();
    const provider = PROVIDERS[newCard.providerKey] || PROVIDERS.cib;
    dispatch({
      type: 'UPDATE_CARDS',
      payload: [...cards, {
        ...newCard,
        id: Date.now(),
        displayName: `${provider.icon} ${newCard.bank} ${newCard.name} • ${newCard.last4}`,
        limit: roundMoney(limitCheck.value),
        availableBalance: roundMoney(limitCheck.value),
        openingDebt: 0,
        openingDebtDate: getLocalISODate(), openingDate: getLocalISODate(),
        cashbackRate: safeNumber(newCard.cashbackRate, 1),
        statementDay: Math.min(28, Math.max(1, safeNumber(newCard.statementDay, 5))),
        subCardLast4: []
      }]
    });
    setShowAddCard(false);
    setNewCard({ name: '', bank: '', limit: '', last4: '', expiry: '', holderName: '', dueDate: '05 من كل شهر', statementDay: 15, theme: 'silver', cashbackRate: 1, providerKey: 'cib' });
    addNotification({ type: 'success', title: 'تمت الإضافة' });
  };

  const lp = (key) => ({
    walletKey: key,
    ledgerData: buildLedger ? buildLedger(key) : [],
    liveBalance: safeNumber(liveBalances?.[key]),
    isExpanded: expandedLedgers[key],
    onToggle: () => dispatch({ type: 'TOGGLE_LEDGER', payload: key }),
    theme: WALLET_CONFIGS[key],
    onAddDeposit: handleAddWalletDeposit,
    onAddWithdrawal: handleAddWalletWithdrawal,
    walletVisibility,
    onToggleVisibility: (k) => dispatch({ type: 'TOGGLE_WALLET_VISIBILITY', payload: k }),
    onReconcile
  });

  const handleItemClick = (item) => {
    if (item.type === 'card') {
      dispatch({ type: 'SET_VIEWING_CARD_STATEMENT', payload: item });
    } else if (item.type === 'account') {
      setViewMode('ledger');
      if (WALLET_CONFIGS[item.key] && !expandedLedgers[item.key]) {
        dispatch({ type: 'TOGGLE_LEDGER', payload: item.key });
      }
    }
  };

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card py-3">
        <div className="flex items-center justify-between flex-wrap gap-2">
          <h2 className="text-base font-black flex items-center gap-2">
            <CreditCard size={18} className="text-[color:var(--accent)]" /> البطاقات والمحافظ
          </h2>
          <div className="flex gap-1.5">
            <button onClick={() => setViewMode('grouped')} className={`btn ${viewMode === 'grouped' ? 'btn-primary' : 'btn-secondary'} text-[10px] py-1.5 px-2.5`}>
              <Layers size={11} /> مجموعات
            </button>
            <button onClick={() => setViewMode('ledger')} className={`btn ${viewMode === 'ledger' ? 'btn-primary' : 'btn-secondary'} text-[10px] py-1.5 px-2.5`}>
              <Table size={11} /> كشوف
            </button>
          </div>
        </div>
        <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>
          {cards.length} بطاقة + {Object.keys(WALLET_CONFIGS).length} حساب/محفظة
        </p>
      </div>

      <div className="sub-tab-switcher">
        <button onClick={() => setActiveTab('wallets')} className={`sub-tab-btn ${activeTab === 'wallets' ? 'active' : ''}`}>
          <CreditCard size={14} /> البطاقات والمحافظ
        </button>
        <button onClick={() => setActiveTab('cashback')} className={`sub-tab-btn ${activeTab === 'cashback' ? 'active' : ''}`}>
          <Gift size={14} /> الكاش باك
          {cashbackSummary.received > 0 && <span className="badge badge-success text-[9px] px-1.5 py-0 money tabular">{formatAdaptive(cashbackSummary.received)}</span>}
        </button>
      </div>

      {activeTab === 'cashback' ? (
        <CashbackView data={data} dispatch={dispatch} saveHistory={saveHistory}
          addNotification={addNotification} cards={cards}
          selectedYear={selectedYear} selectedMonth={selectedMonth} />
      ) : (
        <React.Fragment>
          {cards.length > 0 && (
            <button onClick={() => dispatch({ type: 'SET_CARD_PAYMENT_MODAL', payload: { cardId: null } })}
              className="card w-full text-right active:scale-[0.99] transition-transform"
              style={{ background: 'linear-gradient(135deg, rgba(124,58,237,0.1), rgba(79,70,229,0.08))', borderColor: 'rgba(124,58,237,0.3)' }}>
              <div className="flex items-center gap-3">
                <div className="p-2.5 rounded-xl text-white" style={{ background: 'linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%)' }}>
                  <Banknote size={18} />
                </div>
                <div className="flex-1">
                  <h3 className="font-black text-sm">💳 سداد بطاقة سريع</h3>
