/* ===================== التطبيق الرئيسي ===================== */
function App() {
  const [state, dispatch] = useReducer(dataReducer, initialState);
  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [authLoading, setAuthLoading] = useState(true);
  const mainContentRef = useRef(null);
  const saveTimeoutRef = useRef(null);
  const lastCloudWriteRef = useRef(0);
  const isInitialCloudLoadRef = useRef(true);

  const { data, activeTab, selectedYear, selectedMonth, transViewMode, catViewType, isFormOpen, formMode, formData, activeCategoryDetail, isLocked, isDarkMode, expandedGroup, budgets, editingCard, editingLoan, searchTerm, editingBudgetCategory, budgetAmount, isRecurringModalOpen, recurringFormData, notifications, isAiModalOpen, aiResponse, isAiLoading, history, expandedLedgers, expandedCardsSection, statusFilter, confirmDialog, isQuickTransferModalOpen, quickTransferData, viewingCardStatement, walletVisibility, isProcessing, formErrors, isAddingCard, isAddingLoan } = state;

  const { transactions = [], loans = [], cards = [], recurringItems = [], accountsData = DEFAULT_ACCOUNTS, monthlyPlans = DEFAULT_MONTHLY_PLANS } = data || {};

  /* === Auth === */
  useEffect(() => { const unsub = firebase.auth().onAuthStateChanged((user) => { setAuthLoading(false); setIsAuthenticated(!!(user && user.email === "ahmedmkh@gmail.com")); }); return () => unsub(); }, []);

  /* === Cloud sync (بدون حلقة كتابة) === */
  useEffect(() => {
    if (!isAuthenticated) return;
    const docRef = db.collection("finance_2026").doc("user_ahmed_data");
    const unsub = docRef.onSnapshot((doc) => {
      if (!doc.exists) return;
      // تجاهل التحديثات القادمة من الكتابة الخاصة بنا خلال آخر 3 ثوان
      if (Date.now() - lastCloudWriteRef.current < 3000 && !isInitialCloudLoadRef.current) return;
      const cloudData = doc.data();
      const migrated = migrateData(cloudData);
      dispatch({ type: 'SET_DATA', payload: migrated });
      isInitialCloudLoadRef.current = false;
    });
    return () => unsub();
  }, [isAuthenticated]);

  /* === حفظ تلقائي مؤجل === */
  useEffect(() => {
    if (isAuthenticated && data && data.transactions) {
      clearTimeout(saveTimeoutRef.current);
      saveTimeoutRef.current = setTimeout(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
        lastCloudWriteRef.current = Date.now();
        db.collection("finance_2026").doc("user_ahmed_data").set(data, { merge: true }).catch(err => console.error(err));
      }, 1500);
    }
    return () => clearTimeout(saveTimeoutRef.current);
  }, [data, isAuthenticated]);

  /* === اختصارات === */
  useEffect(() => {
    const handler = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); if (isFormOpen) document.getElementById('transaction-form')?.requestSubmit(); }
      if (e.key === 'Escape') {
        if (isFormOpen) dispatch({ type: 'SET_FORM_OPEN', payload: false });
        if (isAiModalOpen) dispatch({ type: 'SET_AI_MODAL_OPEN', payload: false });
        if (editingCard) dispatch({ type: 'SET_EDITING_CARD', payload: null });
        if (editingLoan) dispatch({ type: 'SET_EDITING_LOAN', payload: null });
        if (isQuickTransferModalOpen) dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
        if (activeCategoryDetail) dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: null });
        if (viewingCardStatement) dispatch({ type: 'SET_VIEWING_CARD_STATEMENT', payload: null });
        if (isRecurringModalOpen) dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false });
        if (isAddingCard) dispatch({ type: 'SET_ADDING_CARD', payload: false });
        if (isAddingLoan) dispatch({ type: 'SET_ADDING_LOAN', payload: false });
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.querySelector('input[placeholder*="ابحث"]')?.focus(); }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [isFormOpen, isAiModalOpen, editingCard, editingLoan, isQuickTransferModalOpen, activeCategoryDetail, viewingCardStatement, isRecurringModalOpen, isAddingCard, isAddingLoan]);

  const removeNotification = useCallback((id) => dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }), []);
  const addNotification = useCallback((notification) => dispatch({ type: 'ADD_NOTIFICATION', payload: notification }), []);
  const saveHistory = useCallback(() => dispatch({ type: 'ADD_TO_HISTORY', payload: JSON.parse(JSON.stringify(data)) }), [data]);

  /* === محرك الأرصدة الموحد === */
  const balances = useMemo(() => {
    const res = {};
    ACCOUNT_KEYS.forEach(k => { res[k] = computeBalance(data, k); });
    return res;
  }, [data]);

  const totalLiquidity = useMemo(() => ACCOUNT_KEYS.reduce((s, k) => s + safeNumber(balances[k]), 0), [balances]);

  /* === الأرصدة الختامية للشهر المحدد === */
  const monthClosing = useMemo(() => {
    const res = {};
    ACCOUNT_KEYS.forEach(k => { res[k] = getClosingBalance(data, k, selectedYear, selectedMonth); });
    return res;
  }, [data, selectedYear, selectedMonth]);

  const monthOpening = useMemo(() => {
    const res = {};
    ACCOUNT_KEYS.forEach(k => { res[k] = getOpeningBalance(data, k, selectedYear, selectedMonth); });
    return res;
  }, [data, selectedYear, selectedMonth]);

  const yearMonthKey = makeMonthKey(selectedYear, selectedMonth);

  /* === المديونية الحية للبطاقات === */
  const getLiveCardDebt = useCallback((card) => {
    const monthEnd = new Date(selectedYear, getMonthIndex(selectedMonth) + 1, 0, 23, 59, 59);
    const expenses = transactions.filter(t => t.status === 'paid' && t.type === 'expense' && (t.linkedCardId === card.id)).reduce((s, t) => s + safeNumber(t.amount), 0);
    const payments = transactions.filter(t => t.status === 'paid' && t.category === 'الالتزامات البنكية والتمويلية' && t.linkedCardId === card.id && t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
    return safeNumber(card.openingDebt) + expenses - payments;
  }, [transactions, selectedYear, selectedMonth]);

  /* === ملخص الشهر === */
  const financeSnapshot = useMemo(() => {
    // الترحيل الحقيقي = رصيد افتتاحي للشهر المحدد
    const actualCarryover = safeNumber(getOpeningBalance(data, 'cash', selectedYear, selectedMonth)) || safeNumber(data.openingBalance2026);
    const curMonth = transactions.filter(t => t.month === selectedMonth && t.year === selectedYear);
    const actualIncome = curMonth.filter(t => t.type === 'income' && t.status === 'paid' && t.method === 'cash' && inferKind(t) === KIND.OPERATIONAL).reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncome = curMonth.filter(t => t.type === 'income' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidCash = curMonth.filter(t => t.type === 'expense' && t.status === 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingCash = curMonth.filter(t => t.type === 'expense' && t.status !== 'paid' && t.method === 'cash').reduce((s, t) => s + safeNumber(t.amount), 0);
    const actualCashInHand = actualCarryover + actualIncome - paidCash;
    const projectedClosingBalance = actualCashInHand + pendingIncome - pendingCash;
    return { actualCarryover, actualIncome, pendingIncome, actualCashInHand, projectedClosingBalance, pendingAmount: pendingCash, cashExpenses: paidCash };
  }, [transactions, selectedMonth, selectedYear, data]);

  /* === chart data (تشغيلي فقط) === */
  const chartData = useMemo(() => getMonthsForYear(selectedYear).map(m => ({
    name: m,
    دخل: transactions.filter(t => t.month === m && t.year === selectedYear && t.type === 'income' && inferKind(t) === KIND.OPERATIONAL).reduce((a, c) => a + safeNumber(c.amount), 0),
    مصروف: transactions.filter(t => t.month === m && t.year === selectedYear && t.type === 'expense' && inferKind(t) === KIND.OPERATIONAL).reduce((a, c) => a + safeNumber(c.amount), 0)
  })), [transactions, selectedYear]);

  /* === القروض المحدثة === */
  const updatedLoans = useMemo(() => {
    const map = transactions.reduce((acc, t) => { if (t.linkedLoanId && (t.status === 'paid')) acc[t.linkedLoanId] = (acc[t.linkedLoanId] || 0) + safeNumber(t.amount); return acc; }, {});
    return loans.map(l => ({ ...l, totalPaid: safeNumber(l.prePaidAmount) + (map[l.id] || 0), remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (map[l.id] || 0))) }));
  }, [transactions, loans]);

  const totalLoanDebt = useMemo(() => updatedLoans.reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const totalCardDebt = useMemo(() => cards.reduce((s, c) => s + safeNumber(c.openingDebt), 0), [cards]);
  const grandTotalDebt = totalLoanDebt + totalCardDebt;

  /* === insights الشهر (تشغيلي فقط) === */
  const monthInsights = useMemo(() => {
    const m = transactions.filter(t => t.month === selectedMonth && t.year === selectedYear);
    const opOnly = t => inferKind(t) === KIND.OPERATIONAL;
    const inc = m.filter(t => t.type === 'income' && t.status === 'paid' && opOnly(t)).reduce((s, t) => s + safeNumber(t.amount), 0);
    const exp = m.filter(t => t.type === 'expense' && t.status === 'paid' && opOnly(t)).reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendInc = m.filter(t => t.type === 'income' && t.status !== 'paid' && opOnly(t)).reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendExp = m.filter(t => t.type === 'expense' && t.status !== 'paid' && opOnly(t)).reduce((s, t) => s + safeNumber(t.amount), 0);
    return { inc, exp, pendInc, pendExp, net: inc - exp };
  }, [transactions, selectedMonth, selectedYear]);

  /* === المعاملات المجمعة === */
  const groupedTransactions = useMemo(() => {
    const groups = {};
    const term = normalizeText(searchTerm);
    transactions.filter(t => {
      if (t.month !== selectedMonth || t.year !== selectedYear || t.type !== transViewMode) return false;
      if (searchTerm && !normalizeText(t.description).includes(term) && !normalizeText(t.category).includes(term)) return false;
      if (statusFilter === 'paid' && t.status !== 'paid') return false;
      if (statusFilter === 'pending' && t.status === 'paid') return false;
      return true;
    }).forEach(t => {
      if (!groups[t.category]) groups[t.category] = { category: t.category, total: 0, count: 0, items: [] };
      groups[t.category].total += safeNumber(t.amount);
      groups[t.category].count++;
      groups[t.category].items.push(t);
    });
    return Object.values(groups).sort((a, b) => b.total - a.total);
  }, [transactions, selectedMonth, selectedYear, transViewMode, searchTerm, statusFilter]);

  /* === Ledgers === */
  const buildLedger = useCallback((methodId) => {
    const acc = transactions.filter(t => t.method === methodId && t.status === 'paid').sort((a, b) => new Date(a.date) - new Date(b.date));
    const cutoff = getAccountCutoff(data.accountsData, methodId);
    let bal = safeNumber(data.accountsData?.[methodId]?.balance);
    return acc.filter(t => new Date(t.date) > cutoff).map(t => { const a = safeNumber(t.amount); bal += (t.subType === 'deposit') ? a : -a; return { ...t, runningBalance: bal }; }).reverse();
  }, [transactions, data.accountsData]);

  const ledgers = useMemo(() => ({
    fawry: buildLedger('fawry'),
    etisalat: buildLedger('etisalat'),
    cib_savings: buildLedger('cib_savings'),
    aaib_savings: buildLedger('aaib_savings')
  }), [buildLedger]);

  /* === تاريخ البطاقات (مع ديون حية) === */
  const calculateCardHistory = useCallback((card) => {
    let debt = safeNumber(card.openingDebt);
    const allYears = YEARS_LIST;
    const result = [];
    allYears.forEach(year => {
      getMonthsForYear(year).forEach(m => {
        const expenses = transactions.filter(t => t.month === m && t.year === year && t.type === 'expense' && t.linkedCardId === card.id && t.status === 'paid').reduce((a, b) => a + safeNumber(b.amount), 0);
        const payments = transactions.filter(t => t.month === m && t.year === year && t.category === 'الالتزامات البنكية والتمويلية' && t.linkedCardId === card.id && t.status === 'paid').reduce((a, b) => a + safeNumber(b.amount), 0);
        const openingDebt = debt;
        debt = debt + expenses - payments;
        result.push({ month: m, year, openingDebt, expenses, payments, closingDebt: debt, available: safeNumber(card.limit) - debt });
      });
    });
    return result;
  }, [transactions]);

  /* === الأجندة === */
  const getAgendaItems = useCallback(() => {
    try {
      const today = new Date(); const cd = today.getDate(); const cm = today.getMonth(); const cy = today.getFullYear();
      const items = [];
      cards.forEach(c => { const d = parseInt(c.dueDate) || 5; let tm = cm, ty = cy; if (d < cd) { tm++; if (tm > 11) { tm = 0; ty++; } } items.push({ id: `ag-card-${c.id}`, title: `سداد بطاقة ${c.bank} - ${c.name}`, date: getLocalISODate(new Date(ty, tm, d)), amount: safeNumber(c.openingDebt), type: 'card', icon: CreditCard }); });

      try {
        saveHistory();

        } else {
          finalSubType = formData.subType || (formData.type === 'income' ? 'deposit' : 'withdrawal');
        }
        const status = formData.status || 'pending';
        // التاريخ الفعلي للمستخدم كما هو (لا يُعاد كتابته)
        const actualDate = formData.date || getLocalISODate();
        const dateObj = new Date(actualDate);
        const kind = formData.kind || inferKind(formData);
        const newTx = { ...formData, id: getSafeId(), amount, month: selectedMonth, year: selectedYear, monthIndex: getMonthIndex(selectedMonth), date: actualDate, _dateObj: dateObj.toISOString(), subType: finalSubType, status, kind };
        delete newTx._dateObj;
        let newTx2 = formMode === 'add' ? [...transactions, newTx] : transactions.map(t => t.id === formData.id ? { ...newTx, id: formData.id } : t);
        newTx2.sort((a, b) => new Date(b.date) - new Date(a.date));
        dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTx2 });
        dispatch({ type: 'SET_FORM_OPEN', payload: false });

  /* === حذف === */

  }, [transactions, dispatch, addNotification, data.closedMonths, saveHistory]);

  const handleSaveRecurring = useCallback((e) => { e.preventDefault(); saveHistory(); const ni = { ...recurringFormData, id: 'r-' + Date.now(), amount: safeNumber(recurringFormData.amount), day: safeNumber(recurringFormData.day) }; dispatch({ type: 'UPDATE_RECURRING_ITEMS', payload: [...recurringItems, ni] }); dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false }); addNotification({ type: 'success', title: 'تمت الإضافة' }); }, [recurringFormData, recurringItems, saveHistory, addNotification]);

  /* === تصدير/استيراد === */
  const handleExportCSV = useCallback(() => {
    const header = "التاريخ,النوع,الفئة,الوصف,المبلغ,الطريقة,الحالة,الشهر,السنة,النوع المحاسبي\n";
    const rows = transactions.map(t => `${t.date},${t.type},"${escapeHtml(t.category)}","${escapeHtml(t.description || '')}",${t.amount},${t.method},${t.status || 'pending'},${t.month},${t.year || ''},${KIND_LABELS[inferKind(t)]}`).join("\n");

        return (
          <div className="modal-backdrop z-[3500] no-print">
            <div className="bg-white dark:bg-slate-900 w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden flex flex-col" style={{ maxHeight: 'calc(100vh - 60px)' }}>
              <div className="p-6 border-b bg-slate-50/50 dark:bg-slate-800/30">
                <div className="flex justify-between items-start flex-wrap gap-3">
                  <div className="flex items-center gap-3"><BankLogo type={`${viewingCardStatement.bank.toLowerCase()}_card`} size={40} /><div><h3 className="text-2xl font-black">{viewingCardStatement.bank} - {viewingCardStatement.name}</h3><p className="text-sm text-slate-500 font-bold mt-1">{selectedMonth} {selectedYear}</p></div></div>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => { const trans = transactions.filter(t => t.method === cardMethod && t.month === selectedMonth && t.year === selectedYear); printReport(`كشف ${viewingCardStatement.bank} - ${selectedMonth}`, trans); }} className="bg-blue-50 dark:bg-blue-900/30 text-blue-600 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2"><Printer size={18} /> طباعة</button>
                    <button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_VIEWING_CARD_STATEMENT', payload: null })} className="p-2 hover:bg-red-50 dark:hover:bg-red-900/30 hover:text-red-500 text-slate-500 rounded-xl"><X size={24} /></button>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-4 mt-4">
                  <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border-r-4 border-amber-500"><p className="text-[11px] font-bold text-slate-500 uppercase">بداية المدة</p><p className="text-lg font-black">{fmt(monthData?.openingDebt || 0)} ج.م</p></div>
                  <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border-r-4 border-blue-500"><p className="text-[11px] font-bold text-slate-500 uppercase">نهاية المدة</p><p className="text-lg font-black text-blue-600">{fmt(monthData?.closingDebt || 0)} ج.م</p></div>
                </div>
              </div>
              <div className="flex-1 overflow-y-auto p-6 scroll-hide" style={{ minHeight: 0 }}>
                <table className="w-full text-right">
                  <thead className="bg-slate-50 dark:bg-slate-800 sticky top-0">
                    <tr><th className="p-4 border-b text-xs">التاريخ</th><th className="p-4 border-b text-xs">الوصف</th><th className="p-4 border-b text-xs">الفئة</th><th className="p-4 border-b text-xs text-left">المبلغ</th></tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200 dark:divide-slate-700 text-sm font-bold">
                    {transactions.filter(t => t.method === cardMethod && t.month === selectedMonth && t.year === selectedYear).sort((a, b) => new Date(b.date) - new Date(a.date)).map(t => (
                      <tr key={t.id} className="hover:bg-blue-50/50 dark:hover:bg-blue-900/20"><td className="p-4 text-slate-500">{t.date}</td><td className="p-4">{t.description || '-'}</td><td className="p-4"><span className="bg-white dark:bg-slate-800 px-2 py-1 rounded text-xs border">{t.category}</span></td><td className="p-4 text-left font-black">{fmt(t.amount)}</td></tr>
                    ))}
                    {transactions.filter(t => t.method === cardMethod && t.month === selectedMonth && t.year === selectedYear).length === 0 && <tr><td colSpan="4" className="p-12 text-center text-slate-400">لا توجد عمليات</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      })()}

      {/* القفل الفعلي */}
      {isLocked ? (
        <div className="fixed inset-0 z-[9000] flex flex-col items-center justify-center bg-slate-900/95 backdrop-blur-3xl no-print">
          <Lock size={80} className="mb-8 text-blue-500 animate-bounce-slight" />
          <h2 className="text-4xl font-black mb-8 text-white">التطبيق مقفل</h2>
          <button type="button" onClick={() => dispatch({ type: 'SET_IS_LOCKED', payload: false })} className="gradient-bg-primary text-white px-16 py-5 rounded-full font-bold shadow-2xl flex items-center gap-3 hover:scale-105"><Unlock size={24} /> فتح التطبيق</button>
        </div>
      ) : (
        <>
          <div className="bottom-nav-container no-print">
            <div className="scrollable-nav scroll-hide">
              {[
                { id: 'dashboard', label: 'الرئيسية', icon: LayoutDashboard },
                { id: 'transactions', label: 'المعاملات', icon: ArrowUpRight },
                { id: 'cards', label: 'المحافظ', icon: CreditCard },
                { id: 'loans', label: 'القروض', icon: Banknote },
                { id: 'planning', label: 'التخطيط', icon: Table },
                { id: 'planner', label: 'المخطط', icon: Target },
                { id: 'calendar', label: 'الأجندة', icon: CalendarDays },
                { id: 'duplicates', label: 'المكررات', icon: Filter },
                { id: 'settings', label: 'الإعدادات', icon: Sliders },
                { id: 'categories', label: 'الفئات', icon: Layers }
              ].map(item => (
                <button key={item.id} type="button" onClick={() => dispatch({ type: 'SET_ACTIVE_TAB', payload: item.id })} className={`nav-btn ${activeTab === item.id ? 'active' : ''}`}>
                  <item.icon size={22} /><span>{item.label}</span>
                </button>
              ))}
              <div className="v-line"></div>
              <button type="button" aria-label="تصدير CSV" onClick={handleExportCSV} className="nav-btn text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-900/30"><FileSpreadsheet size={22} /><span>CSV</span></button>
              <button type="button" aria-label="حفظ نسخة" onClick={handleExport} className="nav-btn text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30"><Download size={22} /><span>حفظ</span></button>
              <label className="nav-btn cursor-pointer text-purple-600 hover:bg-purple-50 dark:hover:bg-purple-900/30"><input type="file" accept=".json" onChange={handleImport} className="hidden" aria-label="استيراد" /><Upload size={22} /><span>جلب</span></label>
              <button type="button" aria-label="مسح" onClick={resetData} className="nav-btn text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30"><RefreshCcw size={22} /><span>مسح</span></button>
              <div className="v-line"></div>
              <button type="button" aria-label="قفل" onClick={() => dispatch({ type: 'SET_IS_LOCKED', payload: true })} className="nav-btn text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-900/30"><Lock size={22} /><span>قفل</span></button>
              <button type="button" aria-label="خروج" onClick={() => { firebase.auth().signOut(); setIsAuthenticated(false); }} className="nav-btn text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30"><LogOut size={22} /><span>خروج</span></button>
            </div>
          </div>

          <button type="button" aria-label="إضافة" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', category: '', amount: '', date: getLocalISODate(), month: selectedMonth, year: selectedYear, method: 'cash', subType: 'withdrawal', status: 'pending', kind: KIND.OPERATIONAL } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="fab no-print"><Plus size={28} /></button>

          <EnhancedSidebar activeTab={activeTab} dispatch={dispatch} />

          <main ref={mainContentRef} className="flex-1 overflow-y-auto p-4 lg:p-8 pt-12">
            <div className="max-w-7xl mx-auto space-y-8 animate-fadeIn pb-24">
              <ProfessionalHeader selectedYear={selectedYear} isDarkMode={isDarkMode} dispatch={dispatch} />
              {renderActiveView()}
            </div>
          </main>
        </>
      )}

      {/* Modal: form */}
      {isFormOpen && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col" style={{ maxHeight: 'calc(100vh - 40px)' }}>
            <div className="p-5 border-b flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/30 flex-shrink-0">
              <h3 className="text-xl font-black flex items-center gap-3"><div className="gradient-bg-primary p-2 rounded-xl text-white shadow-lg"><Plus size={20} /></div>{formMode === 'add' ? 'إضافة عملية' : 'تعديل عملية'}</h3>
              <button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_FORM_OPEN', payload: false })} className="text-slate-500 hover:text-red-500 p-2 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-xl"><X size={24} /></button>
            </div>
            <form onSubmit={handleSaveTransaction} className="p-5 space-y-4 overflow-y-auto scroll-hide" id="transaction-form" style={{ minHeight: 0 }}>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm font-bold mb-2 text-slate-500">النوع</label>
                  <select className="input-field font-bold" value={formData.type} onChange={(e) => { const t = e.target.value; dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, type: t, subType: t === 'income' ? 'deposit' : 'withdrawal', category: '' } }); }}>
                    <option value="expense">مصروف 💸</option><option value="income">دخل 💰</option>
                  </select></div>
                <div><label className="block text-sm font-bold mb-2 text-slate-500">الفئة</label>
                  <select className={`input-field font-bold ${formErrors.category ? 'error' : ''}`} value={formData.category} onChange={e => { const cat = e.target.value; const kind = formData.kind || inferKind({ ...formData, category: cat }); dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, category: cat, kind } }); }} required>
                    <option value="">اختر التصنيف...</option>
                    {Object.entries(CATEGORY_GROUPS[formData.type] || {}).map(([g, items]) => (<optgroup key={g} label={g}>{items.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>))}
                  </select></div>
              </div>
              <div className="bg-gradient-to-r from-amber-50 to-emerald-50 dark:from-amber-900/20 dark:to-emerald-900/20 p-3 rounded-2xl border-2 border-dashed border-amber-300 dark:border-amber-700">
                <div className="flex items-center gap-2 mb-2"><Clock size={16} className="text-amber-600" /><label className="text-xs font-black uppercase text-slate-600 dark:text-slate-300">حالة العملية</label></div>
                <div className="grid grid-cols-2 gap-3">
                  <label className={`flex items-center justify-center gap-2 p-3 rounded-xl cursor-pointer border-2 transition-all font-bold text-sm ${formData.status !== 'paid' ? 'bg-white border-amber-500 shadow-md text-amber-700 dark:bg-slate-800' : 'border-transparent bg-white/50 dark:bg-slate-800/50 text-slate-400'}`}>
                    <input type="radio" name="status" value="pending" className="hidden" checked={formData.status !== 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'pending' } })} />
                    <Clock size={18} /><div className="text-right"><div>⏳ معلق</div><div className="text-[10px] opacity-70">لا يؤثر على الرصيد</div></div>
                  </label>
                  <label className={`flex items-center justify-center gap-2 p-3 rounded-xl cursor-pointer border-2 transition-all font-bold text-sm ${formData.status === 'paid' ? 'bg-white border-emerald-500 shadow-md text-emerald-700 dark:bg-slate-800' : 'border-transparent bg-white/50 dark:bg-slate-800/50 text-slate-400'}`}>
                    <input type="radio" name="status" value="paid" className="hidden" checked={formData.status === 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'paid' } })} />
                    <CheckCircle2 size={18} /><div className="text-right"><div>✅ معتمد</div><div className="text-[10px] opacity-70">يدخل الرصيد</div></div>
                  </label>
                </div>
              </div>
              {['fawry', 'etisalat', 'cib_savings', 'aaib_savings'].includes(formData.method) && (
                <div className="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-2xl border border-dashed">
                  <div className="flex gap-3">
                    <label className={`flex-1 flex items-center justify-center gap-2 p-2 rounded-xl cursor-pointer border-2 transition-all ${formData.subType === 'deposit' ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-900/20' : 'border-transparent bg-white dark:bg-slate-800'}`}>
                      <input type="radio" name="subType" value="deposit" className="hidden" checked={formData.subType === 'deposit'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, subType: 'deposit' } })} />
                      <span className="text-sm font-bold">إيداع (+)</span>
                    </label>
                    <label className={`flex-1 flex items-center justify-center gap-2 p-2 rounded-xl cursor-pointer border-2 transition-all ${formData.subType === 'withdrawal' ? 'border-red-500 bg-red-50 dark:bg-red-900/20' : 'border-transparent bg-white dark:bg-slate-800'}`}>
                      <input type="radio" name="subType" value="withdrawal" className="hidden" checked={formData.subType === 'withdrawal'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, subType: 'withdrawal' } })} />
                      <span className="text-sm font-bold">سحب (-)</span>
                    </label>
                  </div>
                </div>
              )}
              <div className="grid grid-cols-3 gap-3">
                <div><label className="block text-sm font-bold mb-2 text-slate-500">المبلغ</label>
                  <input type="text" inputMode="decimal" required className={`input-field text-lg font-black text-blue-600 ${formErrors.amount ? 'error' : ''}`} value={formData.amount} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, amount: toEnglishDigits(e.target.value) } })} /></div>
                <div><label className="block text-sm font-bold mb-2 text-slate-500">التاريخ</label>
                  <input type="date" required className={`input-field text-sm font-bold ${formErrors.date ? 'error' : ''}`} value={formData.date} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, date: e.target.value } })} /></div>
                <div><label className="block text-sm font-bold mb-2 text-slate-500">الدفع</label>
                  <select className="input-field text-sm font-bold" value={formData.method} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, method: e.target.value } })}>
                    {PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                  </select></div>
              </div>
              {formData.type === 'expense' && (
                <details className="border rounded-2xl overflow-hidden bg-white dark:bg-slate-800">
                  <summary className="p-3 cursor-pointer text-xs font-bold text-slate-500 flex items-center justify-between"><span className="flex items-center gap-2"><Hash size={16} className="text-blue-500" /> ربط بقرض</span><ChevronDown size={16} /></summary>
                  <div className="p-3 border-t"><select className="input-field text-sm font-bold w-full" value={formData.linkedLoanId || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, linkedLoanId: e.target.value ? Number(e.target.value) : '' } })}><option value="">-- اختر --</option>{updatedLoans.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}</select></div>
                </details>
              )}
              {formData.type === 'expense' && formData.category === 'الالتزامات البنكية والتمويلية' && (
                <div><label className="block text-sm font-bold mb-2 text-slate-500 flex items-center gap-2"><CreditCard size={14} /> سداد بطاقة</label>
                  <select className="input-field text-sm font-bold bg-blue-50/50 dark:bg-blue-900/20 border-blue-200 dark:border-blue-800" value={formData.linkedCardId || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, linkedCardId: e.target.value ? Number(e.target.value) : '' } })}>
                    <option value="">-- اختر البطاقة --</option>
                    {cards.map(c => <option key={c.id} value={c.id}>{c.name} - {c.bank}</option>)}
                  </select></div>
              )}
              <div><label className="block text-sm font-bold mb-2 text-slate-500">الوصف</label>
                <input type="text" className="input-field font-bold" value={formData.description || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: e.target.value } })} placeholder="تفاصيل..." /></div>
              <div className="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl text-xs">
                <p className="text-slate-500 font-bold mb-1">التصنيف المحاسبي: <span className="text-purple-600 font-black">{KIND_LABELS[formData.kind || inferKind(formData)]}</span></p>
              </div>
              <button type="submit" className={`w-full text-white py-3 rounded-2xl font-black shadow-xl active:scale-95 ${formData.status === 'paid' ? 'gradient-bg-success' : 'gradient-bg-warning'}`} disabled={isProcessing}>
                {isProcessing ? 'جاري الحفظ...' : <><Save size={20} className="inline ml-2" /> {formData.status === 'paid' ? 'حفظ واعتماد ✅' : 'حفظ كمعلق ⏳'}</>}
              </button>
            </form>
          </div>
        </div>
      )}

      {/* AI Modal */}
      {isAiModalOpen && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
            <div className="p-6 border-b flex justify-between items-center">
              <h3 className="text-2xl font-black flex items-center gap-3"><div className="gradient-bg-primary p-2 rounded-xl text-white"><Bot size={20} /></div>المساعد الذكي</h3>
              <button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_AI_MODAL_OPEN', payload: false })} className="p-2 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-xl"><X size={24} /></button>
            </div>
            <div className="p-6">
              <button type="button" onClick={handleAnalyzeFinances} disabled={isAiLoading} className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3 mb-6">
                {isAiLoading ? 'جاري التحليل...' : <><Sparkles size={20} /> تحليل الوضع المالي (تشغيلي فقط)</>}
              </button>
              {aiResponse && (<div className="bg-slate-50 dark:bg-slate-800 p-6 rounded-2xl whitespace-pre-line">{aiResponse}</div>)}
            </div>
          </div>
        </div>
      )}

      {/* Edit Card */}
      {editingCard && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden max-h-[calc(100vh-40px)] flex flex-col">
            <div className="p-6 border-b flex justify-between items-center"><h3 className="text-xl font-black">تعديل البطاقة</h3><button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_EDITING_CARD', payload: null })}><X size={24} /></button></div>
            <form onSubmit={handleUpdateCard} className="p-6 space-y-4 overflow-y-auto">
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-xs font-bold text-slate-500">الاسم</label><input type="text" required className="input-field" value={editingCard.name} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, name: e.target.value } })} /></div>
                <div><label className="text-xs font-bold text-slate-500">البنك</label><input type="text" required className="input-field" value={editingCard.bank} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, bank: e.target.value } })} /></div>
              </div>
              <div className="grid grid-cols-3 gap-4">
                <div><label className="text-xs font-bold text-slate-500">الحد</label><input type="number" className="input-field text-blue-600 font-bold" value={editingCard.limit} onChange={e => { const v = safeNumber(e.target.value); dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, limit: v, openingDebt: Math.max(0, v - safeNumber(editingCard.availableBalance)) } }); }} /></div>
                <div><label className="text-xs font-bold text-slate-500">المتاح</label><input type="number" className="input-field text-emerald-600 font-bold" value={editingCard.availableBalance} onChange={e => { const v = safeNumber(e.target.value); dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, availableBalance: v, openingDebt: Math.max(0, safeNumber(editingCard.limit) - v) } }); }} /></div>
                <div><label className="text-xs font-bold text-slate-500">المديونية</label><input type="number" className="input-field text-red-500 font-bold" value={editingCard.openingDebt} onChange={e => { const v = safeNumber(e.target.value); dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, openingDebt: v, availableBalance: Math.max(0, safeNumber(editingCard.limit) - v) } }); }} /></div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-xs font-bold text-slate-500">حامل البطاقة</label><input type="text" className="input-field uppercase text-sm" value={editingCard.holderName} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, holderName: e.target.value } })} /></div>
                <div><label className="text-xs font-bold text-slate-500">الانتهاء</label><input type="text" placeholder="MM/YY" className="input-field text-center" value={editingCard.expiry} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, expiry: e.target.value } })} /></div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-xs font-bold text-slate-500">آخر 4 أرقام</label><input type="text" maxLength="4" className="input-field text-center tracking-widest" value={editingCard.last4} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, last4: e.target.value } })} /></div>
                <div><label className="text-xs font-bold text-slate-500">يوم الاستحقاق</label><input type="text" className="input-field text-center" value={editingCard.dueDate} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, dueDate: e.target.value } })} /></div>
              </div>
              <div>
                <label className="text-xs font-bold text-slate-500">اللون</label>
                <select className="input-field" value={editingCard.theme} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, theme: e.target.value } })}>
                  <option value="silver">فضي</option><option value="gold">ذهبي</option><option value="platinum">بلاتيني</option><option value="black">أسود</option><option value="blue">أزرق</option>
                </select>
              </div>
              <button type="submit" className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold">حفظ</button>
            </form>
          </div>
        </div>
      )}

      {/* Edit Loan */}
      {editingLoan && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl">
            <div className="p-6 border-b flex justify-between items-center"><h3 className="text-xl font-black">تعديل الالتزام</h3><button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: null })}><X size={24} /></button></div>
            <form onSubmit={handleUpdateLoan} className="p-6 space-y-4">
              <div><label className="text-xs font-bold text-slate-500">الاسم</label><input type="text" className="input-field" value={editingLoan.name} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, name: e.target.value } })} /></div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-xs font-bold text-slate-500">المبلغ الكلي</label><input type="number" className="input-field" value={editingLoan.totalAmount} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, totalAmount: e.target.value } })} /></div>
                <div><label className="text-xs font-bold text-slate-500">القسط</label><input type="number" className="input-field" value={editingLoan.monthlyInstallment} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, monthlyInstallment: e.target.value } })} /></div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-xs font-bold text-slate-500">المدفوع مقدم</label><input type="number" className="input-field text-emerald-600" value={editingLoan.prePaidAmount || 0} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, prePaidAmount: e.target.value } })} /></div>
                <div><label className="text-xs font-bold text-slate-500">يوم الاستحقاق</label><input type="number" className="input-field text-center" value={editingLoan.dueDay} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, dueDay: e.target.value } })} /></div>
              </div>
              <button type="submit" className="w-full gradient-bg-primary text-white py-3 rounded-xl font-bold">حفظ</button>
            </form>
          </div>
        </div>
      )}

      {/* إضافة قرض جديد */}
      {isAddingLoan && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl">
            <div className="p-6 border-b flex justify-between items-center"><h3 className="text-xl font-black">إضافة قرض / دين جديد</h3><button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_ADDING_LOAN', payload: false })}><X size={24} /></button></div>
            <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.target); saveHistory(); const nl = { id: 'l-' + Date.now(), name: fd.get('name'), totalAmount: safeNumber(fd.get('total')), prePaidAmount: safeNumber(fd.get('prepaid')), monthlyInstallment: safeNumber(fd.get('installment')), dueDay: safeNumber(fd.get('dueDay')), interest: '', description: fd.get('desc') || '', type: 'debt' }; dispatch({ type: 'UPDATE_LOANS', payload: [...loans, nl] }); dispatch({ type: 'SET_ADDING_LOAN', payload: false }); addNotification({ type: 'success', title: 'تمت الإضافة' }); }} className="p-6 space-y-4">
              <div><label className="text-xs font-bold text-slate-500">الاسم</label><input name="name" type="text" required className="input-field" /></div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-xs font-bold text-slate-500">الإجمالي</label><input name="total" type="number" required className="input-field" /></div>
                <div><label className="text-xs font-bold text-slate-500">القسط الشهري</label><input name="installment" type="number" defaultValue="0" className="input-field" /></div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-xs font-bold text-slate-500">مدفوع مقدم</label><input name="prepaid" type="number" defaultValue="0" className="input-field" /></div>
                <div><label className="text-xs font-bold text-slate-500">يوم الاستحقاق</label><input name="dueDay" type="number" min="1" max="31" defaultValue="1" className="input-field" /></div>
              </div>
              <div><label className="text-xs font-bold text-slate-500">وصف</label><input name="desc" type="text" className="input-field" /></div>
              <button type="submit" className="w-full gradient-bg-success text-white py-3 rounded-xl font-bold">إضافة</button>
            </form>
          </div>
        </div>
      )}

      {/* إضافة بطاقة جديدة */}
      {isAddingCard && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl">
            <div className="p-6 border-b flex justify-between items-center"><h3 className="text-xl font-black">إضافة بطاقة جديدة</h3><button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_ADDING_CARD', payload: false })}><X size={24} /></button></div>
            <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.target); saveHistory(); const nc = { id: Date.now(), name: fd.get('name'), bank: fd.get('bank'), limit: safeNumber(fd.get('limit')), availableBalance: safeNumber(fd.get('avail')), openingDebt: Math.max(0, safeNumber(fd.get('limit')) - safeNumber(fd.get('avail'))), expiry: fd.get('expiry'), holderName: fd.get('holder') || 'AHMED M. KHALIL', last4: fd.get('last4'), dueDate: fd.get('due'), type: 'mastercard', theme: 'silver' }; dispatch({ type: 'UPDATE_CARDS', payload: [...cards, nc] }); dispatch({ type: 'SET_ADDING_CARD', payload: false }); addNotification({ type: 'success', title: 'تمت الإضافة' }); }} className="p-6 space-y-4">
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-xs font-bold text-slate-500">الاسم</label><input name="name" type="text" required className="input-field" /></div>
                <div><label className="text-xs font-bold text-slate-500">البنك</label><input name="bank" type="text" required className="input-field" /></div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-xs font-bold text-slate-500">الحد</label><input name="limit" type="number" required className="input-field" /></div>
                <div><label className="text-xs font-bold text-slate-500">المتاح</label><input name="avail" type="number" required className="input-field" /></div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-xs font-bold text-slate-500">آخر 4</label><input name="last4" type="text" maxLength="4" required className="input-field" /></div>
                <div><label className="text-xs font-bold text-slate-500">الانتهاء</label><input name="expiry" type="text" placeholder="MM/YY" required className="input-field" /></div>
              </div>
              <div><label className="text-xs font-bold text-slate-500">يوم الاستحقاق</label><input name="due" type="text" placeholder="05 من كل شهر" className="input-field" /></div>
              <button type="submit" className="w-full gradient-bg-success text-white py-3 rounded-xl font-bold">إضافة</button>
            </form>
          </div>
        </div>
      )}

      {editingBudgetCategory && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl shadow-2xl p-8">
            <h3 className="text-2xl font-black mb-6">ميزانية: {editingBudgetCategory}</h3>
            <input type="number" className="input-field text-xl font-black text-blue-600 mb-4" value={budgetAmount} onChange={e => dispatch({ type: 'SET_BUDGET_AMOUNT', payload: e.target.value })} />
            <div className="flex gap-4">
              <button type="button" onClick={handleSaveBudget} className="flex-1 gradient-bg-primary text-white py-3 rounded-2xl font-bold">حفظ</button>
              <button type="button" onClick={() => dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null })} className="flex-1 bg-slate-100 dark:bg-slate-800 py-3 rounded-2xl font-bold">إلغاء</button>
            </div>
          </div>
        </div>
      )}

      {isQuickTransferModalOpen && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-blue-500/50">
            <div className="p-6 border-b flex justify-between items-center"><h3 className="text-xl font-black flex items-center gap-2"><ArrowRight size={20} className="text-blue-600" /> تحويل سريع</h3><button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false })}><X size={24} /></button></div>
            <form onSubmit={handleQuickTransfer} className="p-6 space-y-6">
              <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl">
                <div className="flex justify-between text-sm font-bold text-blue-700 dark:text-blue-300 mb-2"><span>من</span><span>إلى</span></div>
                <div className="flex justify-between items-center gap-4">
                  <select className="input-field text-sm" value={quickTransferData.from} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: e.target.value } })}>{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select>
                  <ArrowRight size={20} className="text-blue-400 rotate-180 flex-shrink-0" />
                  <select className="input-field text-sm" value={quickTransferData.to} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { to: e.target.value } })}>{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select>
                </div>
                <p className="text-[11px] text-blue-700 dark:text-blue-300 mt-2 font-bold">المتاح في المصدر: {fmt(safeNumber(balances[quickTransferData.from]) || 0)} ج.م</p>
              </div>
              <input type="text" inputMode="decimal" required className="input-field text-xl font-black text-blue-600" value={quickTransferData.amount} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: toEnglishDigits(e.target.value) } })} placeholder="المبلغ" />
              <button type="submit" className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold">تنفيذ التحويل</button>
            </form>
          </div>
        </div>
      )}

      {isRecurringModalOpen && (
        <div className="modal-backdrop no-print">
          <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-blue-500/50">
            <div className="p-6 border-b flex justify-between items-center"><h3 className="text-xl font-black flex items-center gap-2"><Repeat size={20} className="text-blue-600" /> إضافة التزام متكرر</h3><button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false })}><X size={24} /></button></div>
            <form onSubmit={handleSaveRecurring} className="p-6 space-y-4">
              <div><label className="text-xs font-bold text-slate-500 block mb-2">العنوان</label><input type="text" required className="input-field" value={recurringFormData.title} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, title: e.target.value } })} /></div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-xs font-bold text-slate-500 block mb-2">المبلغ</label><input type="number" required min="0" className="input-field font-bold text-blue-600" value={recurringFormData.amount} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, amount: e.target.value } })} /></div>
                <div><label className="text-xs font-bold text-slate-500 block mb-2">اليوم</label><input type="number" required min="1" max="31" className="input-field text-center" value={recurringFormData.day} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, day: e.target.value } })} /></div>
              </div>
              <div><label className="text-xs font-bold text-slate-500 block mb-2">النوع</label>
                <select className="input-field" value={recurringFormData.type} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, type: e.target.value } })}>
                  <option value="expense">💸 مصروف</option><option value="income">💰 دخل</option>
                </select></div>
              <div><label className="text-xs font-bold text-slate-500 block mb-2">الفئة</label>
                <select className="input-field" value={recurringFormData.category} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, category: e.target.value } })}>
                  <option value="أخرى">أخرى</option>
                  {CATEGORIES.expense.map(c => <option key={c} value={c}>{c}</option>)}
                </select></div>
              <button type="submit" className="w-full gradient-bg-primary text-white py-3 rounded-xl font-bold">إضافة</button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

const rootElement = document.getElementById('root');
if (rootElement) {
  setTimeout(() => { const l = document.getElementById('loading'); if (l) l.style.display = 'none'; }, 1500);
  createRoot(rootElement).render(<ErrorBoundary><App /></ErrorBoundary>);
}
</script>
</body>
</html>
