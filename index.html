// Google Drive Helpers
// ═══════════════════════════════════════════════════════
const DRIVE_CLIENT_ID = '190006477168-odmpreq26b618rdn1dsg4k1aag3k056g.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive';
const DRIVE_FOLDER_NAME = 'Finance Backups';
const DRIVE_DEFAULT_FOLDER_ID = '1rAupM2llGpThcodBrmL4DZIhDSJ-dGXW';
const DRIVE_FOLDER_ID_LS_KEY = 'v76_drive_folder_id';
let _driveTokenClient = null;
let _driveAccessToken = null;
let _driveTokenExpiry = 0;

const waitForGIS = (timeoutMs) => new Promise((resolve, reject) => {
  timeoutMs = timeoutMs || 10000;
  if (window.google && window.google.accounts && window.google.accounts.oauth2) return resolve();
  const start = Date.now();
  const timer = setInterval(() => {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) { clearInterval(timer); resolve(); }
    else if (Date.now() - start > timeoutMs) { clearInterval(timer); reject(new Error('GIS غير محمّل')); }
  }, 150);
});

const initDriveTokenClient = async () => {
  if (_driveTokenClient) return _driveTokenClient;
  await waitForGIS();
  _driveTokenClient = window.google.accounts.oauth2.initTokenClient({ client_id: DRIVE_CLIENT_ID, scope: DRIVE_SCOPE, callback: () => {} });
  return _driveTokenClient;
};

const requestDriveToken = async () => {
  const client = await initDriveTokenClient();
  return new Promise((resolve, reject) => {
    client.callback = (resp) => {
      if (resp.error) return reject(new Error(resp.error));
      _driveAccessToken = resp.access_token;
      _driveTokenExpiry = Date.now() + (safeNumber(resp.expires_in, 3600) * 1000) - 60000;
      resolve(_driveAccessToken);
    };
    client.requestAccessToken({ prompt: _driveAccessToken ? '' : 'consent' });
  });
};

const ensureDriveToken = async () => {
  if (_driveAccessToken && Date.now() < _driveTokenExpiry) return _driveAccessToken;
  return requestDriveToken();
};

const getOrCreateBackupFolder = async () => {
  const token = await ensureDriveToken();
  const customFolderId = localStorage.getItem(DRIVE_FOLDER_ID_LS_KEY) || DRIVE_DEFAULT_FOLDER_ID;

  if (customFolderId) {
    try {
      const checkRes = await fetch(`https://www.googleapis.com/drive/v3/files/${customFolderId}?fields=id,name,mimeType,trashed`, { headers: { Authorization: `Bearer ${token}` } });
      if (checkRes.ok) {
        const info = await checkRes.json();
        if (!info.trashed) return customFolderId;
      }
    } catch (e) { /* ignore */ }
  }

  const q = encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive&pageSize=20`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('فشل قراءة المجلدات');
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, data.files[0].id);
    return data.files[0].id;
  }

  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  if (!createRes.ok) throw new Error('فشل إنشاء المجلد');
  const created = await createRes.json();
  localStorage.setItem(DRIVE_FOLDER_ID_LS_KEY, created.id);
  return created.id;
};

const uploadBackupToDrive = async (payload, fileName) => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const name = fileName || `finance_backup_${getLocalISODate()}_${Date.now()}.json`;
  const metadata = { name, parents: [folderId], mimeType: 'application/json' };
  const boundary = '----V76DriveBoundary' + Date.now();
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,createdTime', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` }, body });
  if (!res.ok) throw new Error('فشل الرفع');
  return await res.json();
};

const listDriveBackups = async () => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false and mimeType='application/json'`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,size,createdTime)&orderBy=createdTime desc&pageSize=50`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('فشل الجلب');
  const data = await res.json();
  return data.files || [];
};

const downloadBackupFromDrive = async (fileId) => {
  const token = await ensureDriveToken();
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('فشل التنزيل');
  return await res.json();
};

// ═══════════════════════════════════════════════════════
// dataReducer
// ═══════════════════════════════════════════════════════
function dataReducer(state, action) {
  switch (action.type) {
    case 'SET_DATA': return { ...state, data: action.payload };
    case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
    case 'SET_SELECTED_YEAR': return { ...state, selectedYear: action.payload, selectedMonth: getMonthsForYear(action.payload).includes(state.selectedMonth) ? state.selectedMonth : getMonthsForYear(action.payload)[0] };
    case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
    case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
    case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
    case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
    case 'SET_FORM_DATA': return { ...state, formData: action.payload };
    case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
    case 'SET_FORM_ERRORS': return { ...state, formErrors: action.payload };
    case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
    case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
    case 'SET_BUDGETS': return { ...state, budgets: action.payload };
    case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
    case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
    case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
    case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
    case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
    case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
    case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
    case 'SET_AI_MODAL_OPEN': return { ...state, isAiModalOpen: action.payload };
    case 'SET_VIEWING_RECEIPT': return { ...state, viewingReceipt: action.payload };
    case 'SET_PIN_CHANGE_OPEN': return { ...state, isPinChangeOpen: action.payload };
    case 'SET_SMS_MODAL_OPEN': return { ...state, isSmsModalOpen: action.payload };
    case 'ADD_NOTIFICATION': return { ...state, notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }] };
    case 'REMOVE_NOTIFICATION': return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
    case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
    case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
    case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
    case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
    case 'UPDATE_CASHBACK_TRACKERS': return { ...state, data: { ...state.data, cashbackTrackers: action.payload } };
    case 'UPDATE_ACCOUNTS': {
      const oldA = state.data.accountsData || {};
      let changed = false;
      ACCOUNT_KEYS.forEach(k => { if (safeNumber(oldA[k]?.balance) !== safeNumber(action.payload[k]?.balance)) changed = true; });
      return { ...state, data: { ...state.data, accountsData: action.payload, ...(changed ? { monthlySnapshots: {} } : {}) } };
    }
    case 'UPDATE_MONTHLY_PLANS': return { ...state, data: { ...state.data, monthlyPlans: action.payload } };
    case 'ADD_TO_HISTORY': { const limited = [...state.history].slice(-19); return { ...state, history: [...limited, action.payload], future: [] }; }
    case 'UNDO': {
      if (state.history.length === 0) return state;
      const prev = state.history[state.history.length - 1];
      return { ...state, data: prev.data || prev, budgets: prev.budgets !== undefined ? prev.budgets : state.budgets, history: state.history.slice(0, -1) };
    }
    case 'TOGGLE_LEDGER': return { ...state, expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] } };
    case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };
    case 'SHOW_CONFIRM': return { ...state, confirmDialog: { isOpen: true, title: action.title, message: action.message, onConfirm: action.onConfirm, onCancel: action.onCancel, danger: action.danger || false } };
    case 'HIDE_CONFIRM': return { ...state, confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false } };
    case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
    case 'SET_QUICK_TRANSFER_DATA': return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
    case 'CLOSE_MONTH': {
      const { year, month } = action.payload;
      const monthKey = makeMonthKey(year, month);
      const monthEnd = new Date(year, getMonthIndex(month) + 1, 0, 23, 59, 59);
      const snap = {};
      ACCOUNT_KEYS.forEach(k => { snap[k] = computeBalance(state.data, k, monthEnd); });
      return { ...state, data: { ...state.data, closedMonths: [...(state.data.closedMonths || []), monthKey], monthlySnapshots: { ...(state.data.monthlySnapshots || {}), [monthKey]: snap } } };
    }
    case 'OPEN_MONTH': {
      const monthKey = action.payload;
      const parsedKey = parseMonthKey(monthKey);
      if (!parsedKey) return { ...state, data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey) } };
      const { snapshots } = invalidateSnapshotsFrom(state.data.monthlySnapshots, parsedKey.year, parsedKey.month);
      return { ...state, data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== monthKey), monthlySnapshots: snapshots } };
    }
    case 'TOGGLE_WALLET_VISIBILITY': return { ...state, walletVisibility: { ...state.walletVisibility, [action.payload]: !state.walletVisibility[action.payload] } };
    case 'SET_IS_PROCESSING': return { ...state, isProcessing: action.payload };
    case 'SHOW_PENDING_CLOSE_DIALOG': return { ...state, pendingCloseDialog: { isOpen: true, year: action.payload.year, month: action.payload.month } };
    case 'HIDE_PENDING_CLOSE_DIALOG': return { ...state, pendingCloseDialog: { isOpen: false, year: null, month: null } };
    default: return state;
  }
}

// ═══════════════════════════════════════════════════════
// App
// ═══════════════════════════════════════════════════════
function App() {
  const defMY = useMemo(() => getDefaultMonthYear(), []);
  const [state, dispatch] = useReducer(dataReducer, {
    data: getInitialData(),
    activeTab: 'dashboard',
    selectedYear: defMY.year, selectedMonth: defMY.month,
    transViewMode: 'expense', catViewType: 'expense',
    isFormOpen: false, formMode: 'add',
    formData: { type: 'expense', subType: 'withdrawal', status: 'pending', receipts: [] },
    isDarkMode: localStorage.getItem('theme') === 'dark',
    budgets: JSON.parse(localStorage.getItem('budgets') || '{}'),
    editingCard: null, editingLoan: null,
    searchTerm: '', editingBudgetCategory: null, budgetAmount: '',
    isRecurringModalOpen: false,
    recurringFormData: { title: '', amount: '', day: 1, category: 'أخرى', type: 'expense', startMonth: '', endMonth: '', isPaused: false, editingId: null },
    notifications: [], isAiModalOpen: false,
    history: [],
    expandedLedgers: { fawry: false, etisalat: false, cib_savings: false, aaib_savings: false },
    expandedCardsSection: false,
    confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false },
    isQuickTransferModalOpen: false,
    quickTransferData: { from: 'cash', amount: '', date: getLocalISODate(), beneficiaryId: null },
    viewingReceipt: null,
    isPinChangeOpen: false,
    isSmsModalOpen: false,
    walletVisibility: { fawry: true, etisalat: true, cib_savings: true, aaib_savings: true, cash: true },
    isProcessing: false, formErrors: {},
    pendingCloseDialog: { isOpen: false, year: null, month: null }
  });

  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [authLoading, setAuthLoading] = useState(true);
  const [pinVerified, setPinVerified] = useState(() => sessionStorage.getItem('pin_verified') === 'yes');
  const [isDrawerOpen, setIsDrawerOpen] = useState(false);
  const saveTimeoutRef = useRef(null);
  const processingTimeoutRef = useRef(null);
  const lastRemoteRef = useRef(null);

  const { data, activeTab, selectedYear, selectedMonth, transViewMode, catViewType, isFormOpen, formMode, formData, isDarkMode, expandedGroup, budgets, editingCard, editingLoan, searchTerm, isRecurringModalOpen, recurringFormData, notifications, history, expandedLedgers, expandedCardsSection, confirmDialog, isQuickTransferModalOpen, quickTransferData, viewingReceipt, isPinChangeOpen, isSmsModalOpen, walletVisibility, isProcessing, formErrors, pendingCloseDialog } = state;
  const { transactions = [], loans = [], cards = [], recurringItems = [], accountsData = DEFAULT_ACCOUNTS, monthlyPlans = {} } = data || {};

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((user) => {
      setAuthLoading(false);
      setIsAuthenticated(!!(user && user.email === "ahmedmkh@gmail.com"));
    });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!isAuthenticated) return;
    const docRef = db.collection("finance_2026").doc("user_ahmed_data");
    const unsub = docRef.onSnapshot((doc) => {
      if (doc.exists) {
        const raw = doc.data();
        const migrated = migrateData(raw);
        lastRemoteRef.current = JSON.stringify(migrated);
        if (raw.budgets && typeof raw.budgets === 'object') dispatch({ type: 'SET_BUDGETS', payload: raw.budgets });
        dispatch({ type: 'SET_DATA', payload: migrated });
      }
    });
    return () => unsub();
  }, [isAuthenticated]);

  // Auto-materialize recurring for future months
  useEffect(() => {
    if (!isAuthenticated || !data) return;
    if (isMonthClosed(data, selectedYear, selectedMonth)) return;
    const now = new Date();
    const nowYear = now.getFullYear(), nowMonthIdx = now.getMonth();
    const targetMonthIdx = getMonthIndex(selectedMonth);
    const isPast = selectedYear < nowYear || (selectedYear === nowYear && targetMonthIdx < nowMonthIdx);
    if (isPast) return;
    const monthKey = makeMonthKey(selectedYear, selectedMonth);
    const materialized = (data.materializedRecurring && data.materializedRecurring[monthKey]) || [];

    const missingRecurring = recurringItems.filter(r => {
      if (materialized.includes(r.id)) return false;
      return isRecurringActiveInMonth(r, selectedYear, targetMonthIdx);
    });

    if (missingRecurring.length === 0) return;

    const newTx = missingRecurring.map(r => {
      const day = Math.min(Math.max(safeNumber(r.day, 1), 1), 28);
      const date = `${selectedYear}-${String(targetMonthIdx + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      return {
        id: 'rec-' + getSafeId(),
        type: r.type,
        kind: r.kind || KIND.OPERATIONAL,
        category: r.category,
        amount: safeNumber(r.amount),
        description: r.title + ' 🔁',
        method: r.type === 'income' ? 'cash' : 'instapay',
        date, month: selectedMonth, year: selectedYear, monthIndex: targetMonthIdx,
        subType: r.type === 'income' ? 'deposit' : 'withdrawal',
        status: 'pending',
        sourceRecurringId: r.id,
        autoGenerated: true,
        linkedCardId: r.linkedCardId || null,
        receipts: []
      };
    });

    const newMatIds = [...materialized, ...missingRecurring.map(r => r.id)];

    dispatch({
      type: 'SET_DATA',
      payload: {
        ...data,
        transactions: [...(data.transactions || []), ...newTx].sort((a, b) => new Date(b.date) - new Date(a.date)),
        materializedRecurring: { ...(data.materializedRecurring || {}), [monthKey]: newMatIds }
      }
    });
  }, [isAuthenticated, selectedYear, selectedMonth, recurringItems, data]);

  // Auto-save
  useEffect(() => {
    if (isAuthenticated && data && data.transactions) {
      clearTimeout(saveTimeoutRef.current);
      saveTimeoutRef.current = setTimeout(() => {
        if (lastRemoteRef.current && JSON.stringify(data) === lastRemoteRef.current) return;
        try { localStorage.setItem('finance_tracker_V76_SECURE', JSON.stringify(data)); } catch (e) {}
        db.collection("finance_2026").doc("user_ahmed_data").set({ ...data, budgets }, { merge: true }).catch(err => console.error(err));
      }, 5000);
    }
    return () => clearTimeout(saveTimeoutRef.current);
  }, [data, isAuthenticated, budgets]);

  const removeNotification = useCallback((id) => dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }), []);
  const addNotification = useCallback((notification) => dispatch({ type: 'ADD_NOTIFICATION', payload: notification }), []);
  const saveHistory = useCallback(() => dispatch({ type: 'ADD_TO_HISTORY', payload: { data: JSON.parse(JSON.stringify(data)), budgets: JSON.parse(JSON.stringify(budgets)) } }), [data, budgets]);

  const cancelProcessing = useCallback(() => {
    if (processingTimeoutRef.current) { clearTimeout(processingTimeoutRef.current); processingTimeoutRef.current = null; }
    dispatch({ type: 'SET_IS_PROCESSING', payload: false });
  }, []);

  const liveBalances = useMemo(() => { const b = {}; ACCOUNT_KEYS.forEach(k => { b[k] = computeBalance(data, k); }); return b; }, [data]);
  const totalLiquidity = useMemo(() => ACCOUNT_KEYS.reduce((s, k) => s + liveBalances[k], 0), [liveBalances]);
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);

  const financeSnapshot = useMemo(() => {
    const actualCashInHand = computeBalance(data, 'cash', endOfToday());
    const today = endOfToday();
    const curMonth = transactions.filter(t => t.month === selectedMonth && (t.year || new Date(t.date).getFullYear()) === selectedYear);
    const actualIncome = curMonth.filter(t => t.type === 'income' && t.status === 'paid' && new Date(t.date) <= today).reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingIncome = curMonth.filter(t => t.type === 'income' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const paidCash = curMonth.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const pendingCash = curMonth.filter(t => t.type === 'expense' && t.status !== 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    return { actualIncome, pendingIncome, paidCash, pendingCash, actualCashInHand, projectedClosingBalance: actualCashInHand + pendingIncome - pendingCash };
  }, [data, transactions, selectedYear, selectedMonth]);

  const chartData = useMemo(() => getMonthsForYear(selectedYear).map(m => ({
    name: m.slice(0, 3),
    دخل: transactions.filter(t => t.month === m && (t.year || 2026) === selectedYear && t.type === 'income').reduce((a, c) => a + safeNumber(c.amount), 0),
    مصروف: transactions.filter(t => t.month === m && (t.year || 2026) === selectedYear && t.type === 'expense').reduce((a, c) => a + safeNumber(c.amount), 0)
  })), [transactions, selectedYear]);

  const updatedLoans = useMemo(() => {
    const map = transactions.reduce((acc, t) => { if (t.linkedLoanId && t.status === 'paid') acc[t.linkedLoanId] = (acc[t.linkedLoanId] || 0) + safeNumber(t.amount); return acc; }, {});
    const receivablesPaidMap = transactions.reduce((acc, t) => { if (t.sourceReceivableId && t.status === 'paid') acc[t.sourceReceivableId] = (acc[t.sourceReceivableId] || 0) + safeNumber(t.amount); return acc; }, {});
    const regular = loans.filter(l => !l.autoMonthly && !l.isReceivable).map(l => ({ ...l, isReceivable: false, totalPaid: safeNumber(l.prePaidAmount) + (map[l.id] || 0), remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (map[l.id] || 0))) }));
    const receivables = loans.filter(l => l.isReceivable).map(l => ({
      ...l,
      isReceivable: true,
      paused: !!l.paused,
      totalPaid: safeNumber(l.prePaidAmount) + (receivablesPaidMap[l.id] || 0),
      remaining: Math.max(0, safeNumber(l.totalAmount) - (safeNumber(l.prePaidAmount) + (receivablesPaidMap[l.id] || 0)))
    }));
    return [...receivables, ...regular];
  }, [transactions, loans]);

  const monthInsights = useMemo(() => {
    const m = transactions.filter(t => t.month === selectedMonth && (t.year || 2026) === selectedYear);
    const inc = m.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    const exp = m.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
    return { inc, exp, net: inc - exp };
  }, [transactions, selectedYear, selectedMonth]);

  const groupedTransactions = useMemo(() => {
    const groups = {};
    const term = normalizeText(searchTerm);
    transactions.filter(t => {
      if (t.month !== selectedMonth || (t.year || 2026) !== selectedYear || t.type !== transViewMode) return false;
      if (searchTerm && !normalizeText(t.description).includes(term) && !normalizeText(t.category).includes(term)) return false;
      return true;
    }).forEach(t => {
      if (!groups[t.category]) groups[t.category] = { category: t.category, total: 0, count: 0, items: [] };
      groups[t.category].total += safeNumber(t.amount);
      groups[t.category].count++;
      groups[t.category].items.push(t);
    });
    return Object.values(groups).sort((a, b) => b.total - a.total);
  }, [transactions, selectedYear, selectedMonth, transViewMode, searchTerm]);

  const buildLedger = useCallback((methodId) => {
    const cutoffDay = dayStart(getAccountCutoff(accountsData, methodId));
    const acc = transactions.filter(t => t.method === methodId && t.status === 'paid' && new Date(t.date) >= cutoffDay).sort((a, b) => new Date(a.date) - new Date(b.date));
    let bal = safeNumber(accountsData?.[methodId]?.balance);
    return acc.map(t => { const a = safeNumber(t.amount); bal += (t.subType === 'deposit') ? a : -a; return { ...t, runningBalance: bal }; }).reverse();
  }, [transactions, accountsData]);

  // ========== Close Month handlers ==========
  const getPendingTxForMonth = useCallback((year, month) => {
    return transactions.filter(t => t.month === month && (t.year || 2026) === year && t.status !== 'paid');
  }, [transactions]);

  const handleCloseMonth = useCallback(() => {
    const pending = getPendingTxForMonth(selectedYear, selectedMonth);
    if (pending.length === 0) {
      saveHistory();
      dispatch({ type: 'CLOSE_MONTH', payload: { year: selectedYear, month: selectedMonth } });
      addNotification({ type: 'success', title: 'تم الإقفال', message: 'لا توجد معلقات' });
      return;
    }
    dispatch({ type: 'SHOW_PENDING_CLOSE_DIALOG', payload: { year: selectedYear, month: selectedMonth } });
  }, [selectedYear, selectedMonth, getPendingTxForMonth, saveHistory, addNotification]);

  const handleOpenMonth = useCallback((year, month) => {
    dispatch({ type: 'SHOW_CONFIRM', danger: false, title: 'إعادة فتح', message: 'سيتم إلغاء القفل.', onConfirm: () => {
      saveHistory();
      dispatch({ type: 'OPEN_MONTH', payload: makeMonthKey(year, month) });
      addNotification({ type: 'success', title: 'تم الفتح' });
    }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  }, [saveHistory, addNotification]);

  const handlePendingCloseApproveAll = useCallback(() => {
    const { year, month } = pendingCloseDialog;
    if (!year || !month) return;
    const pending = getPendingTxForMonth(year, month);
    const ids = new Set(pending.map(t => t.id));
    saveHistory();
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t) });
    dispatch({ type: 'HIDE_PENDING_CLOSE_DIALOG' });
    setTimeout(() => {
      dispatch({ type: 'CLOSE_MONTH', payload: { year, month } });
      addNotification({ type: 'success', title: 'تم الاعتماد والإقفال', message: `${pending.length} عملية` });
    }, 100);
  }, [pendingCloseDialog, getPendingTxForMonth, transactions, saveHistory, addNotification]);

  const handlePendingCloseDeleteAll = useCallback(() => {
    const { year, month } = pendingCloseDialog;
    if (!year || !month) return;
    const pending = getPendingTxForMonth(year, month);
    const ids = new Set(pending.map(t => t.id));
    saveHistory();
    const remainingTx = transactions.filter(t => !ids.has(t.id));
    const monthKey = makeMonthKey(year, month);
    const currentMat = (data.materializedRecurring && data.materializedRecurring[monthKey]) || [];
    const idsToRemove = new Set();
    pending.forEach(t => {
      if (t.sourceRecurringId) idsToRemove.add(t.sourceRecurringId);
    });
    const newMatList = currentMat.filter(id => !idsToRemove.has(id));
    const newMat = { ...(data.materializedRecurring || {}), [monthKey]: newMatList };
    dispatch({ type: 'SET_DATA', payload: { ...data, transactions: remainingTx, materializedRecurring: newMat } });
    dispatch({ type: 'HIDE_PENDING_CLOSE_DIALOG' });
    setTimeout(() => {
      dispatch({ type: 'CLOSE_MONTH', payload: { year, month } });
      addNotification({ type: 'success', title: 'تم الحذف والإقفال' });
    }, 100);
  }, [pendingCloseDialog, getPendingTxForMonth, transactions, data, saveHistory, addNotification]);

  const handlePendingCloseMoveToNext = useCallback(() => {
    const { year, month } = pendingCloseDialog;
    if (!year || !month) return;
    const pending = getPendingTxForMonth(year, month);
    const ids = new Set(pending.map(t => t.id));
    const currentIdx = getMonthIndex(month);
    const nextIdx = currentIdx + 1;
    const nextMonthName = nextIdx > 11 ? ALL_MONTHS[0] : ALL_MONTHS[nextIdx];
    const nextYear = nextIdx > 11 ? year + 1 : year;
    const nextMonthIdx = nextIdx > 11 ? 0 : nextIdx;
    saveHistory();
    const updated = transactions.map(t => {
      if (!ids.has(t.id)) return t;
      const oldDate = new Date(t.date);
      let day = oldDate.getDate();
      const maxDay = new Date(nextYear, nextMonthIdx + 1, 0).getDate();
      if (day > maxDay) day = maxDay;
      const newDate = `${nextYear}-${String(nextMonthIdx + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      return { ...t, month: nextMonthName, year: nextYear, monthIndex: nextMonthIdx, date: newDate, movedFrom: `${month} ${year}` };
    });
    const currentMonthKey = makeMonthKey(year, month);
    const nextMonthKey = makeMonthKey(nextYear, nextMonthName);
    const currentMat = (data.materializedRecurring && data.materializedRecurring[currentMonthKey]) || [];
    const nextMat = (data.materializedRecurring && data.materializedRecurring[nextMonthKey]) || [];
    const recurringIdsToMove = [];
    pending.forEach(t => { if (t.sourceRecurringId) recurringIdsToMove.push(t.sourceRecurringId); });
    const newCurrentMat = currentMat.filter(id => !recurringIdsToMove.includes(id));
    const newNextMat = [...new Set([...nextMat, ...recurringIdsToMove])];
    const newMaterialized = { ...(data.materializedRecurring || {}), [currentMonthKey]: newCurrentMat, [nextMonthKey]: newNextMat };
    dispatch({ type: 'SET_DATA', payload: { ...data, transactions: updated, materializedRecurring: newMaterialized } });
    dispatch({ type: 'HIDE_PENDING_CLOSE_DIALOG' });
    setTimeout(() => {
      dispatch({ type: 'CLOSE_MONTH', payload: { year, month } });
      addNotification({ type: 'success', title: `تم النقل لـ ${nextMonthName}`, message: `${pending.length} عملية` });
    }, 100);
  }, [pendingCloseDialog, getPendingTxForMonth, transactions, data, saveHistory, addNotification]);

  // ========== Recurring handlers ==========
  const handleSaveRecurring = useCallback((e) => {
    e.preventDefault();
    if (!recurringFormData.title || recurringFormData.title.trim().length < 2) { addNotification({ type: 'error', title: 'اكتب العنوان' }); return; }
    const amt = parseNumberInput(recurringFormData.amount);
    if (amt <= 0) { addNotification({ type: 'error', title: 'مبلغ غير صحيح' }); return; }
    if (recurringFormData.startMonth && recurringFormData.endMonth) {
      const sNum = monthStrToNum(recurringFormData.startMonth);
      const eNum = monthStrToNum(recurringFormData.endMonth);
      if (sNum !== null && eNum !== null && eNum < sNum) {
        addNotification({ type: 'error', title: 'النهاية قبل البداية' });
        return;
      }
    }
    saveHistory();
    const cleanItem = {
      title: recurringFormData.title.trim(),
      amount: amt,
      day: safeNumber(recurringFormData.day, 1),
      category: recurringFormData.category || 'أخرى',
      type: recurringFormData.type || 'expense',
      startMonth: recurringFormData.startMonth || null,
      endMonth: recurringFormData.endMonth || null,
      isPaused: !!recurringFormData.isPaused
    };
    if (recurringFormData.editingId) {
      const updated = recurringItems.map(r => r.id === recurringFormData.editingId ? { ...r, ...cleanItem } : r);
      dispatch({ type: 'UPDATE_RECURRING_ITEMS', payload: updated });
      addNotification({ type: 'success', title: 'تم التحديث' });
    } else {
      const ni = { ...cleanItem, id: 'r' + Date.now() };
      dispatch({ type: 'UPDATE_RECURRING_ITEMS', payload: [...recurringItems, ni] });
      addNotification({ type: 'success', title: 'تمت الإضافة' });
    }
    dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false });
    dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { title: '', amount: '', day: 1, category: 'أخرى', type: 'expense', startMonth: '', endMonth: '', isPaused: false, editingId: null } });
  }, [recurringFormData, recurringItems, saveHistory, addNotification]);

  const handleEditRecurring = useCallback((r) => {
    dispatch({
      type: 'SET_RECURRING_FORM_DATA',
      payload: {
        title: r.title || '',
        amount: String(r.amount || ''),
        day: r.day || 1,
        category: r.category || 'أخرى',
        type: r.type || 'expense',
        startMonth: r.startMonth || '',
        endMonth: r.endMonth || '',
        isPaused: !!r.isPaused,
        editingId: r.id
      }
    });
    dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: true });
  }, []);

  const handleTogglePauseRecurring = useCallback((r) => {
    saveHistory();
    dispatch({ type: 'UPDATE_RECURRING_ITEMS', payload: recurringItems.map(x => x.id === r.id ? { ...x, isPaused: !x.isPaused } : x) });
    addNotification({ type: r.isPaused ? 'success' : 'warning', title: r.isPaused ? 'تم التفعيل' : 'تم الإيقاف' });
  }, [recurringItems, saveHistory, addNotification]);

  const deleteRecurring = useCallback((id) => {
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'حذف الالتزام', message: 'سيتم الحذف', onConfirm: () => {
      saveHistory();
      const newRecurring = recurringItems.filter(i => i.id !== id);
      const newTx = (data.transactions || []).filter(t => !(t.sourceRecurringId === id && t.status !== 'paid'));
      dispatch({ type: 'SET_DATA', payload: { ...data, recurringItems: newRecurring, transactions: newTx } });
      addNotification({ type: 'success', title: 'تم الحذف' });
    }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  }, [recurringItems, data, saveHistory, addNotification]);

  // ========== Transaction handlers ==========
  const handleSaveTransaction = useCallback((e) => {
    e.preventDefault();
    if (isProcessing) return;
    const errors = {};
    const amount = parseNumberInput(formData.amount);
    if (!amount || amount <= 0) errors.amount = 'مبلغ غير صحيح';
    if (!formData.category) errors.category = 'اختر الفئة';
    if (!formData.date) errors.date = 'اختر التاريخ';
    if (Object.keys(errors).length > 0) {
      dispatch({ type: 'SET_FORM_ERRORS', payload: errors });
      addNotification({ type: 'error', title: 'خطأ', message: Object.values(errors)[0] });
      return;
    }
    const d = new Date(formData.date);
    if (isNaN(d)) { addNotification({ type: 'error', title: 'تاريخ غير صالح' }); return; }
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    if (formMode === 'edit') {
      const orig = transactions.find(t => t.id === formData.id);
      if (orig && isMonthClosed(data, orig.year || 2026, orig.month)) { addNotification({ type: 'error', title: 'محظور' }); return; }
    }
    if (isMonthClosed(data, txYear, txMonth)) { addNotification({ type: 'error', title: 'محظور', message: `شهر ${txMonth} مغلق` }); return; }
    dispatch({ type: 'SET_IS_PROCESSING', payload: true });
    processingTimeoutRef.current = setTimeout(() => {
      saveHistory();
      const finalSubType = formData.subType || (formData.type === 'income' ? 'deposit' : 'withdrawal');
      const status = formData.status || 'pending';
      const newTx = { ...formData, id: formMode === 'edit' ? formData.id : getSafeId(), amount, month: txMonth, year: txYear, monthIndex: d.getMonth(), date: formData.date, subType: finalSubType, status, receipts: formData.receipts || [] };
      const next = formMode === 'add' ? [...transactions, newTx] : transactions.map(t => t.id === newTx.id ? { ...newTx } : t);
      next.sort((a, b) => new Date(b.date) - new Date(a.date));
      dispatch({ type: 'UPDATE_TRANSACTIONS', payload: next });
      dispatch({ type: 'SET_FORM_OPEN', payload: false });
      addNotification({ type: 'success', title: status === 'paid' ? 'تم الحفظ' : 'تم الحفظ كمعلق' });
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
      processingTimeoutRef.current = null;
    }, 300);
  }, [formData, formMode, transactions, data, saveHistory, addNotification, isProcessing]);

  const handleDelete = useCallback((id) => {
    const target = transactions.find(t => t.id === id);
    if (target && isMonthClosed(data, target.year || 2026, target.month)) { addNotification({ type: 'error', title: 'محظور' }); return; }
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'تأكيد الحذف', message: 'هل أنت متأكد؟', onConfirm: () => {
      saveHistory();
      dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.filter(t => t.id !== id) });
      addNotification({ type: 'success', title: 'تم الحذف' });
    }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  }, [transactions, data, saveHistory, addNotification]);

  const handleQuickTransfer = useCallback((e) => {
    e.preventDefault();
    if (isProcessing) return;
    const amount = parseNumberInput(quickTransferData.amount);
    if (amount <= 0) { addNotification({ type: 'error', title: 'اكتب المبلغ' }); return; }
    if (!quickTransferData.beneficiaryId) { addNotification({ type: 'error', title: 'اختر المستفيد' }); return; }
    const d = new Date(quickTransferData.date || getLocalISODate());
    if (isNaN(d)) { addNotification({ type: 'error', title: 'تاريخ خطأ' }); return; }
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { addNotification({ type: 'error', title: 'محظور' }); return; }

    dispatch({ type: 'SET_IS_PROCESSING', payload: true });
    processingTimeoutRef.current = setTimeout(() => {
      saveHistory();
      const ben = BENEFICIARIES.find(b => b.id === quickTransferData.beneficiaryId);
      const isFromBank = quickTransferData.from === 'cib_savings' || quickTransferData.from === 'aaib_savings';
      const useTelda = isFromBank && ben.hasTelda;
      const finalMethod = useTelda ? ben.method : quickTransferData.from;
      const date = getLocalISODate(d);
      const tx = {
        id: 'monthly-' + getSafeId(),
        type: 'expense', kind: KIND.OPERATIONAL,
        category: `مصروف شهري - ${ben.label}`,
        amount,
        description: useTelda ? `مصروف شهري - ${ben.label} (Telda)` : `مصروف شهري - ${ben.label}`,
        method: finalMethod,
        date, month: txMonth, year: txYear, monthIndex: d.getMonth(),
        subType: 'withdrawal', status: 'paid',
        beneficiaryId: ben.id, receipts: []
      };
      dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [tx, ...transactions].sort((a, b) => new Date(b.date) - new Date(a.date)) });
      dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
      dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: 'cash', amount: '', date: getLocalISODate(), beneficiaryId: null } });
      addNotification({ type: 'success', title: 'تم التسجيل' });
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
      processingTimeoutRef.current = null;
    }, 600);
  }, [quickTransferData, data, transactions, saveHistory, addNotification, isProcessing]);

  const handleUpdateLoan = useCallback((e) => {
    e.preventDefault();
    saveHistory();
    dispatch({ type: 'UPDATE_LOANS', payload: loans.map(l => l.id === editingLoan.id ? {
      ...editingLoan,
      totalAmount: safeNumber(editingLoan.totalAmount),
      prePaidAmount: safeNumber(editingLoan.prePaidAmount),
      monthlyInstallment: safeNumber(editingLoan.monthlyInstallment),
      dueDay: safeNumber(editingLoan.dueDay, 1),
      paused: !!editingLoan.paused,
      totalInstallments: safeNumber(editingLoan.totalInstallments),
      paidInstallments: safeNumber(editingLoan.paidInstallments)
    } : l) });
    dispatch({ type: 'SET_EDITING_LOAN', payload: null });
    addNotification({ type: 'success', title: 'تم التحديث' });
  }, [loans, editingLoan, saveHistory, addNotification]);

  const handleUpdateCard = useCallback((e) => {
    e.preventDefault();
    saveHistory();
    dispatch({ type: 'UPDATE_CARDS', payload: cards.map(c => c.id === editingCard.id ? { ...editingCard, limit: safeNumber(editingCard.limit), availableBalance: Math.max(0, safeNumber(editingCard.limit) - safeNumber(editingCard.openingDebt)), openingDebt: safeNumber(editingCard.openingDebt), cashbackRate: safeNumber(editingCard.cashbackRate, 1) } : c) });
    dispatch({ type: 'SET_EDITING_CARD', payload: null });
    addNotification({ type: 'success', title: 'تم التحديث' });
  }, [cards, editingCard, saveHistory, addNotification]);

  useEffect(() => { localStorage.setItem('budgets', JSON.stringify(budgets)); }, [budgets]);
  useEffect(() => { document.documentElement.classList.toggle('dark', isDarkMode); localStorage.setItem('theme', isDarkMode ? 'dark' : 'light'); }, [isDarkMode]);
  useEffect(() => () => { if (processingTimeoutRef.current) clearTimeout(processingTimeoutRef.current); }, []);

  if (authLoading) return <div className="flex h-screen items-center justify-center" style={{ background: '#1A1508' }}><div className="w-12 h-12 border-3 border-blue-500 border-t-transparent rounded-full animate-spin"></div></div>;
  if (!isAuthenticated) return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
  if (!pinVerified) return <PinLockScreen onSuccess={() => { sessionStorage.setItem('pin_verified', 'yes'); setPinVerified(true); }} onLogout={() => { firebase.auth().signOut(); setIsAuthenticated(false); sessionStorage.removeItem('pin_verified'); setPinVerified(false); }} />;

  const renderActiveView = () => {
    switch (activeTab) {
      case 'dashboard': return <DashboardView data={data} financeSnapshot={financeSnapshot} liveBalances={liveBalances} totalLiquidity={totalLiquidity} walletVisibility={walletVisibility} onToggleVisibility={(k) => dispatch({ type: 'TOGGLE_WALLET_VISIBILITY', payload: k })} dispatch={dispatch} selectedYear={selectedYear} selectedMonth={selectedMonth} transactions={transactions} cards={cards} updatedLoans={updatedLoans} chartData={chartData} isDarkMode={isDarkMode} addNotification={addNotification} onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} />;
      case 'transactions': return <TransactionsView groupedTransactions={groupedTransactions} transactions={transactions} selectedMonth={selectedMonth} selectedYear={selectedYear} transViewMode={transViewMode} statusFilter="all" searchTerm={searchTerm} expandedGroup={expandedGroup} data={data} monthInsights={monthInsights} dispatch={dispatch} handleDelete={handleDelete} addNotification={addNotification} onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} saveHistory={saveHistory} onCloseMonth={handleCloseMonth} onOpenMonth={handleOpenMonth} />;
      case 'categories': return <CategoriesView transactions={transactions} selectedMonth={selectedMonth} selectedYear={selectedYear} catViewType={catViewType} budgets={budgets} dispatch={dispatch} onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} />;
      case 'loans': return <LoansView updatedLoans={updatedLoans} cards={cards} recurringItems={recurringItems} transactions={transactions} dispatch={dispatch} deleteRecurring={deleteRecurring} saveHistory={saveHistory} getLocalISODate={getLocalISODate} addNotification={addNotification} data={data} selectedMonth={selectedMonth} selectedYear={selectedYear} onEditRecurring={handleEditRecurring} onTogglePauseRecurring={handleTogglePauseRecurring} />;
      case 'cards': return <WalletsAndCardsView cards={cards} buildLedger={buildLedger} expandedLedgers={expandedLedgers} expandedCardsSection={expandedCardsSection} selectedMonth={selectedMonth} selectedYear={selectedYear} dispatch={dispatch} handleAddWalletDeposit={(k) => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'income', category: 'شحن محفظة', amount: '', description: `إيداع ${k}`, method: k, date: getLocalISODate(), subType: 'deposit', status: 'pending', receipts: [] } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} handleAddWalletWithdrawal={(k) => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', category: 'شحن محفظة', amount: '', description: `سحب من ${k}`, method: k, date: getLocalISODate(), subType: 'withdrawal', status: 'pending', receipts: [] } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} walletVisibility={walletVisibility} liveBalances={liveBalances} data={data} />;
      case 'planning': return <MonthlyPlanningView data={data} monthlyPlans={monthlyPlans} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />;
      case 'planner': return <PlannerView totalLiquidityNow={totalLiquidity} monthlyPlans={monthlyPlans} />;
      case 'forecast': return <LiquidityForecastView transactions={transactions} updatedLoans={updatedLoans} recurringItems={recurringItems} liveBalances={liveBalances} selectedYear={selectedYear} selectedMonth={selectedMonth} monthlyPlans={monthlyPlans} />;
      case 'comparison': return <MonthComparisonView transactions={transactions} selectedYear={selectedYear} selectedMonth={selectedMonth} />;
      case 'calendar': return <CalendarView data={data} getAgendaItems={() => []} transactions={transactions} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />;
      case 'settings': return <SettingsView data={data} accountsData={accountsData} cards={cards} budgets={budgets} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />;
      default: return null;
    }
  };

  return (
    <PromiseModalProvider>
      <div className="flex h-screen overflow-hidden font-sans">
        <ToastContainer notifications={notifications} removeNotification={removeNotification} />
        <ConfirmDialog confirmDialog={confirmDialog} dispatch={dispatch} />

        {isProcessing && (
          <div className="processing-overlay">
            <div className="processing-spinner mb-4"></div>
            <h3 className="text-base font-bold mb-2">جاري التنفيذ</h3>
            <button onClick={cancelProcessing} className="btn btn-secondary bg-red-500 text-white mt-3 text-xs">إلغاء</button>
          </div>
        )}

        {/* Pending Close Dialog */}
        {pendingCloseDialog.isOpen && (() => {
          const { year, month } = pendingCloseDialog;
          const pending = getPendingTxForMonth(year, month);
          const pendingIncome = pending.filter(t => t.type === 'income').reduce((s, t) => s + safeNumber(t.amount), 0);
          const pendingExpense = pending.filter(t => t.type === 'expense').reduce((s, t) => s + safeNumber(t.amount), 0);
          const nextIdx = getMonthIndex(month) + 1;
          const nextMonthName = nextIdx > 11 ? ALL_MONTHS[0] : ALL_MONTHS[nextIdx];
          const nextYear = nextIdx > 11 ? year + 1 : year;
          return (
            <div className="modal-backdrop z-[5500] no-print">
              <div className="generic-modal max-w-lg">
                <div className="generic-modal-header">
                  <h3 className="text-base font-black flex items-center gap-2"><span>⚠️</span> يوجد {pending.length} عملية معلقة</h3>
                  <button onClick={() => dispatch({ type: 'HIDE_PENDING_CLOSE_DIALOG' })} className="btn btn-ghost p-1.5"><X size={16} /></button>
                </div>
                <div className="generic-modal-body space-y-3">
                  <div className="p-3 rounded-lg bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900">
                    <p className="text-[11px] font-bold text-amber-700 dark:text-amber-400 mb-2">لا يمكن إقفال {month} {year} مع وجود معلقات. اختر إجراء:</p>
                    <div className="grid grid-cols-2 gap-2 text-[11px]">
                      {pendingIncome > 0 && <div className="p-2 rounded" style={{ background: 'var(--bg-card)' }}><p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>دخل معلق</p><p className="font-black text-emerald-600">+ {fmt(pendingIncome)}</p></div>}
                      {pendingExpense > 0 && <div className="p-2 rounded" style={{ background: 'var(--bg-card)' }}><p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>مصروف معلق</p><p className="font-black text-red-600">− {fmt(pendingExpense)}</p></div>}
                    </div>
                  </div>

                  <button onClick={handlePendingCloseApproveAll} className="w-full p-3 rounded-lg text-right border-2 border-emerald-500 bg-emerald-50 dark:bg-emerald-950/30">
                    <div className="flex items-start gap-2">
                      <CheckCircle2 size={18} className="text-emerald-600 flex-shrink-0 mt-0.5" />
                      <div className="flex-1 min-w-0">
                        <p className="font-black text-xs text-emerald-700 dark:text-emerald-400">✅ اعتماد الكل ثم الإقفال</p>
                        <p className="text-[10px] mt-0.5 text-emerald-600">سيتم تحويل كل المعلقات إلى "مدفوع" وتثبيتها</p>
                      </div>
                    </div>
                  </button>

                  <button onClick={handlePendingCloseMoveToNext} className="w-full p-3 rounded-lg text-right border-2 border-blue-500 bg-blue-50 dark:bg-blue-950/30">
                    <div className="flex items-start gap-2">
                      <ArrowRight size={18} className="text-blue-600 flex-shrink-0 mt-0.5" />
                      <div className="flex-1 min-w-0">
                        <p className="font-black text-xs text-blue-700 dark:text-blue-400">➡️ نقل إلى {nextMonthName} {nextYear}</p>
                        <p className="text-[10px] mt-0.5 text-blue-600">تُنقل المعلقات كما هي للشهر القادم</p>
                      </div>
                    </div>
                  </button>

                  <button onClick={handlePendingCloseDeleteAll} className="w-full p-3 rounded-lg text-right border-2 border-red-500 bg-red-50 dark:bg-red-950/30">
                    <div className="flex items-start gap-2">
                      <Trash2 size={18} className="text-red-600 flex-shrink-0 mt-0.5" />
                      <div className="flex-1 min-w-0">
                        <p className="font-black text-xs text-red-700 dark:text-red-400">🗑️ حذف الكل ثم الإقفال</p>
                        <p className="text-[10px] mt-0.5 text-red-600">سيتم حذف كل المعلقات نهائياً</p>
                      </div>
                    </div>
                  </button>

                  <button onClick={() => dispatch({ type: 'HIDE_PENDING_CLOSE_DIALOG' })} className="w-full p-2.5 rounded-lg text-center font-bold text-xs btn btn-secondary">إلغاء</button>
                </div>
              </div>
            </div>
          );
        })()}

        {isPinChangeOpen && <PinChangeModal onClose={() => dispatch({ type: 'SET_PIN_CHANGE_OPEN', payload: false })} addNotification={addNotification} />}

        {/* Bottom Nav */}
        <div className="bottom-nav-container no-print">
          <div className="scrollable-nav scroll-hide">
            {[
              { id: 'dashboard', label: 'الرئيسية', icon: LayoutDashboard },
              { id: 'transactions', label: 'المعاملات', icon: ArrowUpRight },
              { id: 'cards', label: 'المحافظ', icon: CreditCard },

                    <div><label className="text-[10px] font-bold block mb-1">من شهر</label><input type="month" className="input-field text-[11px] py-2" value={recurringFormData.startMonth || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, startMonth: e.target.value } })} /></div>
                    <div><label className="text-[10px] font-bold block mb-1">إلى شهر</label><input type="month" className="input-field text-[11px] py-2" value={recurringFormData.endMonth || ''} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, endMonth: e.target.value } })} /></div>
                  </div>
                </div>
                <label className="flex items-center gap-3 p-2.5 rounded-lg bg-amber-50 dark:bg-amber-950/30 cursor-pointer">
                  <input type="checkbox" checked={!!recurringFormData.isPaused} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, isPaused: e.target.checked } })} className="w-4 h-4 accent-amber-600" />
                  <span className="text-xs font-bold text-amber-700 dark:text-amber-400">⏸ إيقاف مؤقت</span>
                </label>
                <button type="submit" className="btn btn-primary w-full py-2.5 text-sm">{recurringFormData.editingId ? 'حفظ التعديلات' : 'إضافة'}</button>
              </form>
            </div>
          </div>
        )}

        {state.isAiModalOpen && (
          <div className="modal-backdrop no-print">
            <div className="w-full max-w-xl rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)' }}>
              <div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-sm font-black flex items-center gap-2"><Sparkles size={14} className="text-blue-500" /> المساعد</h3>
                <button type="button" onClick={() => dispatch({ type: 'SET_AI_MODAL_OPEN', payload: false })} className="btn btn-ghost p-1.5"><X size={16} /></button>
              </div>
              <div className="p-4">
                <p className="text-xs" style={{ color: 'var(--text-secondary)' }}>💡 ميزة قادمة قريباً</p>
              </div>
            </div>
          </div>
        )}

        {viewingReceipt && viewingReceipt.tx && (
          <div className="modal-backdrop z-[3600] no-print" onClick={() => dispatch({ type: 'SET_VIEWING_RECEIPT', payload: null })}>
            <div className="w-full max-w-3xl max-h-[95vh] rounded-2xl shadow-2xl overflow-hidden flex flex-col" style={{ background: 'var(--bg-card)' }} onClick={e => e.stopPropagation()}>
              <div className="p-3 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                <h3 className="text-sm font-black flex items-center gap-2"><Camera size={14} /> فواتير</h3>
                <button onClick={() => dispatch({ type: 'SET_VIEWING_RECEIPT', payload: null })} className="btn btn-ghost p-1.5"><X size={16} /></button>
              </div>
              <div className="flex-1 overflow-auto p-3 flex items-center justify-center" style={{ background: 'var(--bg-muted)', minHeight: '300px' }}>
                {(viewingReceipt.tx.receipts || []).length > 0 ? (
                  <img src={viewingReceipt.tx.receipts[viewingReceipt.index || 0].url} alt="فاتورة" className="max-w-full max-h-[70vh] object-contain rounded-lg" />
                ) : (<p style={{ color: 'var(--text-muted)' }}>لا توجد صور</p>)}
              </div>
            </div>
          </div>
        )}
      </div>
    </PromiseModalProvider>
  );
}

const rootElement = document.getElementById('root');
if (rootElement) {
  setTimeout(() => { const l = document.getElementById('loading'); if (l) l.style.display = 'none'; }, 1000);
  createRoot(rootElement).render(<ErrorBoundary><App /></ErrorBoundary>);
}
</script>
</body>
</html>
