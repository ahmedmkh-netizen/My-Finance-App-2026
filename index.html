    const html = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>كشف ${title}</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Cairo',sans-serif;padding:24px;color:#0B1220;background:white}.header{text-align:center;padding-bottom:16px;border-bottom:3px solid #0F4C81;margin-bottom:20px}.header h1{font-size:22px;font-weight:900;color:#0F4C81;margin-bottom:4px}.header p{font-size:13px;color:#64748B;font-weight:600}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.stat-box{background:#F8FAFC;padding:12px;border-radius:10px;text-align:center;border:1px solid #E2E8F0}.stat-box .label{font-size:11px;font-weight:700;color:#64748B;margin-bottom:4px}.stat-box .value{font-size:16px;font-weight:900;color:#0B1220}.stat-box.green .value{color:#047857}.stat-box.red .value{color:#B91C1C}.stat-box.amber .value{color:#B45309}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}th{background:#0F4C81;color:white;padding:10px 8px;text-align:right;font-weight:700}td{padding:8px;border-bottom:1px solid #E2E8F0}tr:nth-child(even) td{background:#F8FAFC}.footer{margin-top:30px;padding-top:12px;border-top:2px dashed #CBD5E1;text-align:center;font-size:10px;color:#94A3B8}.day-header-row td{background:#DBEAFE!important;font-weight:900;color:#0F4C81;font-size:11px;padding:6px 8px}</style></head><body><div class="header"><h1>${escapeHtml(title)}</h1><p>${escapeHtml(subtitle)} • ${new Date().toLocaleString('ar-EG')}</p></div><div class="stats"><div class="stat-box red"><div class="label">مشتريات</div><div class="value">${fmt(stats.expenses)} ج.م</div></div><div class="stat-box green"><div class="label">إيرادات</div><div class="value">${fmt(stats.incomes)} ج.م</div></div><div class="stat-box"><div class="label">عدد العمليات</div><div class="value">${stats.count}</div></div><div class="stat-box ${stats.total >= 0 ? 'red' : 'green'}"><div class="label">الصافي</div><div class="value">${fmt(Math.abs(stats.total))} ج.م</div></div></div><table><thead><tr><th>التاريخ</th><th>الوصف</th><th>الفئة</th><th>الحالة</th><th style="text-align:left">المبلغ</th></tr></thead><tbody>${dailyGroups.map(g => `<tr class="day-header-row"><td colspan="5">${escapeHtml(g.label)} — ${fmt(g.total)} ج.م (${g.items.length})</td></tr>${g.items.map(t => `<tr><td>${escapeHtml(t.date)}</td><td>${escapeHtml(t.description || '')}</td><td>${escapeHtml(t.category || '')}</td><td style="color:${t.status === 'paid' ? '#047857' : '#B45309'};font-weight:700;font-size:10px">${t.status === 'paid' ? '✅ معتمد' : '⏳ معلق'}</td><td style="text-align:left;font-weight:900;color:${t.type === 'income' ? '#047857' : '#B91C1C'}">${t.type === 'income' ? '+' : '−'}${fmt(t.amount)}</td></tr>`).join('')}`).join('')}</tbody></table><div class="footer">💼 المحفظة البنكية — ${escapeHtml(title)}</div><script>window.onload=()=>setTimeout(()=>window.print(),300);<\/script></body></html>`;
    w.document.write(html);
    w.document.close();
  };

  const handleExportPdf = async () => {
    if (!containerRef.current || exporting) return;
    if (filteredTx.length === 0) { addNotification({ type: 'warning', title: 'لا توجد معاملات' }); return; }
    if (!window.html2pdf) { addNotification({ type: 'error', title: 'تعذّر تحميل PDF' }); return; }
    setExporting(true);
    try {
      const element = containerRef.current.cloneNode(true);
      element.querySelectorAll('[data-pdf-hide="true"]').forEach(el => el.remove());
      element.querySelectorAll('.scroll-hide, .pdf-expand').forEach(el => { el.style.maxHeight = 'none'; el.style.overflow = 'visible'; });
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'background:white;padding:20px;font-family:Cairo,sans-serif;direction:rtl;';
      const title = isCard ? `${entity.bank} - ${entity.name}` : entity;
      wrapper.innerHTML = `<div style="text-align:center;padding-bottom:12px;border-bottom:3px solid #0F4C81;margin-bottom:16px;"><h1 style="font-size:20px;font-weight:900;color:#0F4C81;margin:0 0 4px;">${escapeHtml(title)}</h1><p style="font-size:12px;color:#64748B;font-weight:600;margin:0;">${isCard ? '•••• ' + entity.last4 : selectedMonth + ' ' + selectedYear}</p></div>`;
      wrapper.appendChild(element);
      const opt = { 
        margin: [10, 8, 10, 8], 
        filename: `كشف_${title.replace(/[\/\\:*?"<>|]/g, '_')}.pdf`, 
        image: { type: 'jpeg', quality: 0.95 }, 
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false }, 
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, 
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } 
      };
      await window.html2pdf().set(opt).from(wrapper).save();
      addNotification({ type: 'success', title: 'تم تصدير PDF' });
    } catch (e) { 
      addNotification({ type: 'error', title: 'فشل التصدير', message: e.message }); 
    } finally { setExporting(false); }
  };

  const title = isCard ? `${entity.bank} - ${entity.name}` : entity;
  const icon = isCard ? '💳' : '📂';

  return (
    <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="generic-modal max-w-3xl">
        <div className="generic-modal-header">
          <div className="flex items-center gap-2 min-w-0">
            <div className="p-2 rounded-lg flex-shrink-0" style={{ background: isCard ? 'rgba(15, 76, 129, 0.1)' : `${CATEGORY_COLORS[entity] || '#0F4C81'}20`, color: isCard ? '#0F4C81' : (CATEGORY_COLORS[entity] || '#0F4C81') }}>
              {isCard ? <CreditCard size={18} /> : <Layers size={18} />}
            </div>
            <div className="min-w-0">
              <h3 className="text-base font-black truncate">{title}</h3>
              <p className="text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                {isCard ? `•••• ${entity.last4} • ${stats.count} معاملة` : `${selectedMonth} ${selectedYear} • ${stats.count} معاملة`}
              </p>
            </div>
          </div>
          <button onClick={onClose} className="btn btn-ghost p-1.5"><X size={16} /></button>
        </div>
        <div className="generic-modal-body" ref={containerRef}>
          {isCard ? (
            <div className="p-3 rounded-lg mb-3" style={{ background: 'var(--bg-muted)' }}>
              <div className="grid grid-cols-3 gap-2">
                <div className="text-center">
                  <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>{isCredit ? 'رصيد دائن' : 'المديونية الحية'}</p>
                  <p className={`text-base font-black mt-0.5 ${isCredit ? 'text-emerald-600' : 'text-red-600'}`}>
                    {isCredit ? `+${fmt(Math.abs(liveDebt))}` : fmt(liveDebt)}
                  </p>
                </div>
                <div className="text-center">
                  <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>المتاح</p>
                  <p className="text-base font-black text-emerald-600 mt-0.5">{fmt(liveAvailable)}</p>
                </div>
                <div className="text-center">
                  <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الحد الكلي</p>
                  <p className="text-base font-black text-blue-600 mt-0.5">{fmt(entity.limit)}</p>
                </div>
              </div>
              <div className="w-full rounded-full h-1.5 overflow-hidden mt-2" style={{ background: 'var(--bg-card)' }}>
                <div className={`h-full ${usagePct > 70 ? 'bg-red-500' : usagePct > 40 ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(100, usagePct)}%` }}></div>
              </div>
            </div>
          ) : (
            <div className="grid grid-cols-4 gap-2 mb-4">
              <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
                <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">معتمد</p>
                <p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(stats.paid)}</p>
              </div>
              <div className="p-2.5 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-center">
                <p className="text-[10px] font-bold text-amber-700 dark:text-amber-400">معلق</p>
                <p className="text-sm font-black text-amber-600 mt-0.5">{fmt(stats.pending)}</p>
              </div>
              <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
                <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">العدد</p>
                <p className="text-sm font-black text-blue-600 mt-0.5">{stats.count}</p>
              </div>
              <div className="p-2.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-center">
                <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">المتوسط</p>
                <p className="text-sm font-black text-purple-600 mt-0.5">{fmt(stats.average)}</p>
              </div>
            </div>
          )}
          
          <div className="grid grid-cols-3 gap-2 mb-3">
            <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
              <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مشتريات</p>
              <p className="text-sm font-black text-red-600 mt-0.5">{fmt(stats.expenses)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
              <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">إيرادات</p>
              <p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(stats.incomes)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
              <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الصافي</p>
              <p className={`text-sm font-black mt-0.5 ${stats.total >= 0 ? 'text-blue-600' : 'text-emerald-600'}`}>{fmt(Math.abs(stats.total))}</p>
            </div>
          </div>
          
          <div className="flex gap-1.5 flex-wrap mb-3" data-pdf-hide="true">
            <div className="relative flex-1 min-w-[140px]">
              <Search className="absolute right-2.5 top-1/2 -translate-y-1/2" size={12} style={{ color: 'var(--text-muted)' }} />
              <input type="text" placeholder="ابحث..." className="input-field pr-8 text-[11px] py-2" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
            </div>
            <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              {isCard ? (
                <React.Fragment>
                  <button type="button" onClick={() => setFilterType('all')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'all' ? 'shadow-sm' : ''}`} style={filterType === 'all' ? { background: 'var(--bg-card)', color: 'var(--brand)' } : { color: 'var(--text-muted)' }}>الكل ({filteredTx.length})</button>
                  <button type="button" onClick={() => setFilterType('expense')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'expense' ? 'shadow-sm' : ''}`} style={filterType === 'expense' ? { background: 'var(--bg-card)', color: 'var(--danger)' } : { color: 'var(--text-muted)' }}>مشتريات</button>
                  <button type="button" onClick={() => setFilterType('income')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'income' ? 'shadow-sm' : ''}`} style={filterType === 'income' ? { background: 'var(--bg-card)', color: 'var(--success)' } : { color: 'var(--text-muted)' }}>سدادات</button>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <button type="button" onClick={() => setFilterType('all')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'all' ? 'shadow-sm' : ''}`} style={filterType === 'all' ? { background: 'var(--bg-card)', color: 'var(--brand)' } : { color: 'var(--text-muted)' }}>الكل ({filteredTx.length})</button>
                  <button type="button" onClick={() => setFilterType('paid')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'paid' ? 'shadow-sm' : ''}`} style={filterType === 'paid' ? { background: 'var(--bg-card)', color: 'var(--success)' } : { color: 'var(--text-muted)' }}>معتمد</button>
                  <button type="button" onClick={() => setFilterType('pending')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'pending' ? 'shadow-sm' : ''}`} style={filterType === 'pending' ? { background: 'var(--bg-card)', color: 'var(--warning)' } : { color: 'var(--text-muted)' }}>معلق</button>
                </React.Fragment>
              )}
            </div>
            <button type="button" onClick={handlePrint} disabled={displayTx.length === 0} className="btn btn-secondary text-[10px] py-2 px-2.5">
              <Printer size={11} /><span className="hidden sm:inline">طباعة</span>
            </button>
            <button type="button" onClick={handleExportPdf} disabled={exporting || displayTx.length === 0} className="btn btn-primary text-[10px] py-2 px-2.5">
              {exporting ? <RefreshCcw size={11} className="animate-spin" /> : <Download size={11} />}
              <span className="hidden sm:inline">PDF</span>
            </button>
          </div>
          
          {Object.keys(stats.methods).length > 0 && (
            <div className="p-2.5 rounded-lg mb-3" style={{ background: 'var(--bg-muted)' }}>
              <p className="text-[10px] font-bold mb-1.5" style={{ color: 'var(--text-secondary)' }}>💳 التوزيع:</p>
              <div className="flex flex-wrap gap-1.5">
                {Object.entries(stats.methods).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([method, total]) => (
                  <span key={method} className="badge badge-neutral text-[9px]">
                    {PAYMENT_METHODS.find(p => p.id === method)?.label || method}: <strong className="mr-1">{fmt(total)}</strong>
                  </span>
                ))}
              </div>
            </div>
          )}
          
          {displayTx.length === 0 ? (
            <div className="text-center py-8">
              <Layers size={32} className="mx-auto mb-2" style={{ color: 'var(--text-muted)' }} />
              <p className="font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد نتائج</p>
            </div>
          ) : (
            <div className="space-y-2 max-h-[50vh] overflow-y-auto scroll-hide pdf-expand">
              {dailyGroups.map(group => (
                <div key={group.date}>
                  <DayGroupHeader label={group.label} total={group.total} count={group.items.length} />
                  <div className="space-y-1.5">
                    {group.items.map(t => (
                      <div key={t.id} className="flex justify-between items-center gap-2 p-2.5 rounded-lg" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                        <div className="min-w-0 flex-1">
                          <p className="font-bold text-xs truncate">
                            {t.description || t.category} <FamilyBadge tx={t} /> <SmsBadge tx={t} /> <TeldaBadge tx={t} /> <TransferBadge tx={t} /> <RecurringBadge tx={t} /> <CarryoverBadge tx={t} />
                          </p>
                          <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
                            {PAYMENT_METHODS.find(p => p.id === t.method)?.label || t.method || '—'}
                            {t.status === 'paid' ? <span className="text-emerald-600 mr-2">✅</span> : <span className="text-amber-600 mr-2">⏳</span>}
                          </p>
                        </div>
                        <span className={`font-black text-xs flex-shrink-0 ${t.type === 'income' ? 'text-emerald-600' : 'text-red-600'}`}>
                          {t.type === 'income' ? '+' : '−'}{fmt(t.amount)}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
          
          {displayTx.length > 0 && (
            <div className="mt-3 p-3 rounded-lg text-white flex justify-between items-center" style={{ background: 'linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%)' }}>
              <span className="font-black text-sm">الإجمالي (المعروض)</span>
              <span className="text-xl font-black">
                {fmt(displayTx.reduce((s, t) => s + (t.type === 'income' ? -safeNumber(t.amount) : safeNumber(t.amount)), 0))} ج.م
              </span>
            </div>
          )}
        </div>
        <div className="generic-modal-footer" data-pdf-hide="true">
          <button onClick={onClose} className="btn btn-secondary flex-1 text-sm">إغلاق</button>
        </div>
      </div>
    </div>
  );
});

/* ─── Categories View ─── */
const CategoriesView = memo(({ transactions, selectedMonth, selectedYear, catViewType, budgets, dispatch, onSelectYear, onSelectMonth }) => {
  const catTotals = useMemo(() => transactions.filter(t => 
    t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + safeNumber(t.amount); return acc; }, {}), 
  [transactions, catViewType, selectedMonth, selectedYear]);
  
  const catCounts = useMemo(() => transactions.filter(t => 
    t.type === catViewType && t.month === selectedMonth && (t.year || 2026) === selectedYear
  ).reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + 1; return acc; }, {}), 
  [transactions, catViewType, selectedMonth, selectedYear]);

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card flex justify-between items-center gap-2 flex-wrap">
        <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
          <button type="button" onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'expense' })} 
            className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'expense' ? 'shadow-sm text-red-600 dark:text-red-400' : ''}`} 
            style={catViewType === 'expense' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}
          >مصروفات</button>
          <button type="button" onClick={() => dispatch({ type: 'SET_CAT_VIEW_TYPE', payload: 'income' })} 
            className={`px-4 py-2 rounded-md text-xs font-bold ${catViewType === 'income' ? 'shadow-sm text-emerald-600 dark:text-emerald-400' : ''}`} 
            style={catViewType === 'income' ? { background: 'var(--bg-card)' } : { color: 'var(--text-muted)' }}
          >إيرادات</button>
        </div>
        <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>💡 اضغط على الفئة للتفاصيل</p>
      </div>
      
      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />
      
      <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
        {CATEGORIES[catViewType].map(cat => {
          const spent = catTotals[cat] || 0;
          const budget = budgets[cat] || 0;
          const overBudget = budget > 0 && spent > budget;
          const count = catCounts[cat] || 0;
          if (spent === 0 && budget === 0) return null;
          return (
            <div key={cat} className="card p-3 cursor-pointer active:scale-[0.98]" 
              onClick={() => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: cat })}
            >
              <div className="flex justify-between mb-2">
                <div className="p-1.5 rounded-lg" style={{ background: 'var(--bg-muted)', color: CATEGORY_COLORS[cat] }}>
                  <Layers size={14} />
                </div>
                <button type="button" aria-label="ميزانية" 
                  onClick={(e) => { 
                    e.stopPropagation(); 
                    dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: cat }); 
                    dispatch({ type: 'SET_BUDGET_AMOUNT', payload: budgets[cat] || '' }); 
                  }} 
                  className="btn btn-ghost p-1"
                ><SettingsIcon size={12} /></button>
              </div>
              <h3 className="font-bold text-[11px] mb-1 truncate">{cat}</h3>
              <p className="text-base font-black tracking-tight">
                {fmt(spent)}
                <span className="text-[9px] font-semibold mr-1" style={{ color: 'var(--text-muted)' }}>ج.م</span>
              </p>
              {count > 0 && <p className="text-[9px] font-bold mt-0.5" style={{ color: 'var(--text-muted)' }}>📋 {count} معاملة</p>}
              {catViewType === 'expense' && budget > 0 && (
                <div className="mt-2 pt-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
                  <div className="w-full rounded-full h-1 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
                    <div style={{ width: `${Math.min(100, (spent / budget) * 100)}%` }} className={`h-full ${overBudget ? 'bg-red-500' : 'bg-emerald-500'}`}></div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
});

/* ─── Transactions View ─── */
const TransactionsView = memo(({ 
  groupedTransactions, transactions, selectedMonth, selectedYear, transViewMode, 
  statusFilter, searchTerm, expandedGroup, data, monthInsights, dispatch, 
  handleDelete, addNotification, onSelectYear, onSelectMonth, saveHistory, onBulkDelete 
}) => {
  const [showFilters, setShowFilters] = useState(false);
  const [showBankFeesOnly, setShowBankFeesOnly] = useState(false);
  const [showSmsOnly, setShowSmsOnly] = useState(false);
  const [showBeneficiariesOnly, setShowBeneficiariesOnly] = useState(false);
  const [selectMode, setSelectMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState(new Set());

  const filterByBankFees = useCallback((list) => showBankFeesOnly ? list.filter(t => isBankFee(t)) : list, [showBankFeesOnly]);
  const filterBySms = useCallback((list) => showSmsOnly ? list.filter(t => t.source === 'sms') : list, [showSmsOnly]);
  const filterByBeneficiaries = useCallback((list) => showBeneficiariesOnly ? list.filter(t => isBeneficiaryCategorySafe(t.category)) : list, [showBeneficiariesOnly]);
  const filterByType = useCallback((list) => transViewMode === 'all' ? list : list.filter(t => t.type === transViewMode), [transViewMode]);
  
  const pendingGroups = useMemo(() => groupedTransactions.map(g => ({ 
    ...g, 
    items: filterByBeneficiaries(filterBySms(filterByBankFees(g.items.filter(t => t.status !== 'paid')))) 
  })).filter(g => g.items.length > 0), [groupedTransactions, filterByBankFees, filterBySms, filterByBeneficiaries]);
  
  const paidArchive = useMemo(() => filterByBeneficiaries(filterBySms(filterByBankFees(filterByType(transactions.filter(t => 
    t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status === 'paid'
  )))))).sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)), 
  [transactions, selectedMonth, selectedYear, filterByType, filterByBankFees, filterBySms, filterByBeneficiaries]);
  
  const totalPending = pendingGroups.reduce((s, g) => s + g.items.length, 0);
  const isClosed = isMonthClosed(data, selectedYear, selectedMonth);

  const toggleSelect = useCallback((id) => {
    setSelectedIds(prev => { 
      const next = new Set(prev); 
      if (next.has(id)) next.delete(id); else next.add(id); 
      return next; 
    });
  }, []);

  const toggleSelectAll = useCallback(() => {
    const allIds = [...pendingGroups.flatMap(g => g.items.map(i => i.id)), ...paidArchive.map(t => t.id)];
    setSelectedIds(prev => prev.size === allIds.length ? new Set() : new Set(allIds));
  }, [pendingGroups, paidArchive]);

  const exitSelectMode = useCallback(() => { setSelectMode(false); setSelectedIds(new Set()); }, []);

  const handleBulkDelete = useCallback(() => {
    const ids = [...selectedIds];
    if (ids.length === 0) { addNotification({ type: 'info', title: 'لم تحدد أي معاملة' }); return; }
    const blocked = [];
    const allowed = [];
    ids.forEach(id => {
      const t = transactions.find(x => x.id === id);
      if (!t) return;
      if (isMonthClosed(data, t.year || 2026, t.month)) blocked.push(t);
      else allowed.push(t);
    });
    if (allowed.length === 0) { addNotification({ type: 'error', title: 'محظور' }); return; }
    dispatch({ 
      type: 'SHOW_CONFIRM', danger: true, title: `حذف ${allowed.length} معاملة`, 
      message: blocked.length > 0 ? `سيتم حذف ${allowed.length} معاملة، وتجاهل ${blocked.length} في شهور مغلقة.` : `سيتم نقل ${allowed.length} معاملة للأرشيف.`, 
      onConfirm: () => { if (onBulkDelete) onBulkDelete(allowed.map(t => t.id)); exitSelectMode(); }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  }, [selectedIds, transactions, data, addNotification, dispatch, exitSelectMode, onBulkDelete]);

  const approveOne = (t) => { 
    if (isMonthClosed(data, t.year || 2026, t.month)) { addNotification({ type: 'error', title: 'محظور' }); return; } 
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(tr => tr.id === t.id ? { ...tr, status: 'paid' } : tr) }); 
    addNotification({ type: 'success', title: 'تم الاعتماد' }); 
  };
  
  const approveAll = () => { 
    if (isClosed) { addNotification({ type: 'error', title: 'محظور' }); return; } 
    dispatch({ 
      type: 'SHOW_CONFIRM', title: 'اعتماد الكل', message: `سيتم اعتماد ${totalPending} عملية`, 
      onConfirm: () => { 
        saveHistory(); 
        const ids = new Set(pendingGroups.flatMap(g => g.items.map(i => i.id))); 
        dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(t => ids.has(t.id) ? { ...t, status: 'paid' } : t) }); 
        addNotification({ type: 'success', title: 'تم الاعتماد' }); 
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    }); 
  };
  
  const reopenOne = (t) => { 
    if (isMonthClosed(data, t.year || 2026, t.month)) { addNotification({ type: 'error', title: 'محظور' }); return; } 
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(tr => tr.id === t.id ? { ...tr, status: 'pending' } : tr) }); 
    addNotification({ type: 'warning', title: 'إعادة تعليق' }); 
  };
  
  const monthTx = useMemo(() => transactions.filter(t => 
    t.month === selectedMonth && (t.year || 2026) === selectedYear
  ), [transactions, selectedMonth, selectedYear]);
  
  const activeFiltersCount = (statusFilter !== 'all' ? 1 : 0) + (showBankFeesOnly ? 1 : 0) + (showSmsOnly ? 1 : 0) + (showBeneficiariesOnly ? 1 : 0);
  const dailyGroups = useMemo(() => groupTransactionsByDate(paidArchive), [paidArchive]);

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-center flex-wrap gap-2 mb-3">
          <div>
            <h2 className="text-lg font-black">
              {transViewMode === 'expense' ? 'المصروفات' : transViewMode === 'income' ? 'الإيرادات' : 'كل المعاملات'}
            </h2>
            <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{selectedMonth} {selectedYear} • {monthTx.length} معاملة</p>
          </div>
          <div className="flex gap-1.5 flex-wrap">
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'all' })} className={`btn ${transViewMode === 'all' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>الكل</button>
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'expense' })} className={`btn ${transViewMode === 'expense' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>مصروفات</button>
            <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'income' })} className={`btn ${transViewMode === 'income' ? 'btn-primary' : 'btn-secondary'} text-[11px] px-2.5 py-1.5`}>إيرادات</button>
          </div>
        </div>

        {selectMode ? (
          <div className="p-3 rounded-lg mb-3 flex flex-wrap items-center gap-2" style={{ background: 'var(--brand-soft)', border: '1px solid var(--brand)' }}>
            <div className="flex-1 min-w-[180px]">
              <p className="text-xs font-black" style={{ color: 'var(--brand)' }}>🔘 وضع التحديد — {selectedIds.size}</p>
            </div>
            <button onClick={toggleSelectAll} className="btn btn-secondary text-[11px] py-1.5 px-2.5">
              {selectedIds.size === (pendingGroups.flatMap(g => g.items).length + paidArchive.length) ? 'إلغاء الكل' : 'تحديد الكل'}
            </button>
            <button onClick={handleBulkDelete} disabled={selectedIds.size === 0} className={`btn ${selectedIds.size === 0 ? 'btn-secondary' : 'btn-primary'} text-[11px] py-1.5 px-2.5`}>
              <Trash2 size={12} /> حذف ({selectedIds.size})
            </button>
            <button onClick={exitSelectMode} className="btn btn-ghost text-[11px] py-1.5 px-2.5">خروج</button>
          </div>
        ) : (
          <div className="flex gap-1.5 mb-3">
            <button onClick={() => setSelectMode(true)} className="btn btn-secondary text-[11px] py-1.5 px-2.5">
              <CheckCircle2 size={12} /> تحديد متعدد
            </button>
          </div>
        )}

        <div className="grid grid-cols-3 gap-2">
          <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30">
            <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">محصل</p>
            <p className="text-sm font-black text-emerald-600 mt-0.5">{fmt(monthInsights.inc)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30">
            <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مدفوع</p>
            <p className="text-sm font-black text-red-600 mt-0.5">{fmt(monthInsights.exp)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الصافي</p>
            <p className={`text-sm font-black mt-0.5 ${monthInsights.net >= 0 ? 'text-blue-600' : 'text-red-600'}`}>{fmt(monthInsights.net)}</p>
          </div>
        </div>
        
        <div className="flex gap-1.5 mt-3 flex-wrap">
          <button onClick={() => setShowBankFeesOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showBankFeesOnly ? 'btn-primary' : 'btn-secondary'}`}>
            <Receipt size={12} /> رسوم
          </button>
          <button onClick={() => setShowSmsOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showSmsOnly ? 'btn-primary' : 'btn-secondary'}`}>
            <MessageSquare size={12} /> SMS
          </button>
          <button onClick={() => setShowBeneficiariesOnly(v => !v)} className={`btn text-[11px] px-2.5 py-1.5 ${showBeneficiariesOnly ? 'btn-primary' : 'btn-secondary'}`}>👨‍👩‍👧 شهري</button>
          {isClosed ? (
            <React.Fragment>
              <div className="badge badge-success px-2 py-1 text-[10px]"><ShieldCheck size={10} /> مغلق</div>
              <button onClick={() => dispatch({ 
                type: 'SHOW_CONFIRM', title: 'إعادة فتح', message: 'سيتم إلغاء القفل.', 
                onConfirm: () => { 
                  saveHistory(); 
                  dispatch({ type: 'OPEN_MONTH', payload: makeMonthKey(selectedYear, selectedMonth) }); 
                  addNotification({ type: 'success', title: 'تم إعادة الفتح' }); 
                }, 
                onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
              })} className="btn btn-secondary text-[11px] px-2.5 py-1.5">
                <Unlock size={12} /> فتح
              </button>
            </React.Fragment>
          ) : (
            <button onClick={() => {
              const pending = monthTx.filter(t => t.status !== 'paid');
              if (pending.length > 0) { 
                dispatch({ type: 'SET_PENDING_CLOSE_MODAL', payload: { isOpen: true, pending, month: selectedMonth, year: selectedYear } }); 
              } else { 
                dispatch({ 
                  type: 'SHOW_CONFIRM', title: 'إقفال الشهر', message: 'سيتم تثبيت الأرصدة.', 
                  onConfirm: () => { 
                    saveHistory(); 
                    dispatch({ type: 'CLOSE_MONTH', payload: { year: selectedYear, month: selectedMonth } }); 
                    addNotification({ type: 'success', title: 'تم الإقفال' }); 
                  }, 
                  onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
                }); 
              }
            }} className="btn btn-secondary text-[11px] px-2.5 py-1.5">
              <Lock size={12} /> إقفال
            </button>
          )}
        </div>
      </div>
      
      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} />
      
      <div className="card py-3">
        <div className="flex gap-2">
          <div className="relative flex-1">
            <Search className="absolute right-3 top-1/2 -translate-y-1/2" size={14} style={{ color: 'var(--text-muted)' }} />
            <input type="text" placeholder="ابحث..." className="input-field pr-9 text-sm py-2.5" 
              value={searchTerm} onChange={(e) => dispatch({ type: 'SET_SEARCH_TERM', payload: e.target.value })} />
          </div>
          <button onClick={() => setShowFilters(!showFilters)} className={`btn ${showFilters ? 'btn-primary' : 'btn-secondary'} px-3 py-2.5 relative`}>
            <Filter size={14} />
            {activeFiltersCount > 0 && (
              <span className="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 text-white text-[9px] rounded-full flex items-center justify-center font-black">
                {activeFiltersCount}
              </span>
            )}
          </button>
        </div>
        {showFilters && (
          <div className="mt-3 pt-3 flex gap-2 flex-wrap animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            {[['all', 'الكل'], ['pending', '⏳ معلق'], ['paid', '✅ مدفوع']].map(([id, label]) => (
              <button key={id} type="button" onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: id })} 
                className={`badge px-2.5 py-1 cursor-pointer text-[10px] ${statusFilter === id ? 'badge-brand' : 'badge-neutral'}`}
              >{label}</button>
            ))}
          </div>
        )}
      </div>
      
      <section>
        <div className="flex justify-between items-center mb-2 flex-wrap gap-2">
          <h3 className="font-black flex items-center gap-2 text-sm">
            <Clock className="text-amber-500" size={14} /> الالتزامات
            {totalPending > 0 && <span className="badge badge-warning text-[10px]">{totalPending}</span>}
          </h3>
          {totalPending > 0 && (
            <button onClick={approveAll} className="btn btn-primary text-[11px] px-2.5 py-1.5">
              <CheckCircle2 size={12} /> اعتماد الكل
            </button>
          )}
        </div>
        {pendingGroups.length === 0 ? (
          <div className="card text-center p-6">
            <CheckCircle2 size={24} className="text-emerald-500 mx-auto mb-2" />
            <p className="font-semibold text-xs" style={{ color: 'var(--text-secondary)' }}>لا توجد التزامات</p>
          </div>
        ) : (
          <div className="space-y-2">
            {pendingGroups.map(g => {
              const isExpanded = expandedGroup === g.category;
              return (
                <div key={g.category} className="card p-0 overflow-hidden">
                  <div className="flex justify-between items-center p-3 cursor-pointer" 
                    onClick={() => dispatch({ type: 'SET_EXPANDED_GROUP', payload: isExpanded ? null : g.category })}>
                    <div className="flex items-center gap-2 min-w-0 flex-1">
                      <span className="p-1.5 rounded-lg flex-shrink-0" style={{ backgroundColor: `${CATEGORY_COLORS[g.category]}20`, color: CATEGORY_COLORS[g.category] }}>
                        <Layers size={14} />
                      </span>
                      <div className="min-w-0">
                        <h4 className="font-bold text-xs truncate">{g.category}</h4>
                        <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{g.items.length} عملية</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <span className="font-black text-sm">{fmt(g.items.reduce((s, i) => s + safeNumber(i.amount), 0))}</span>
                      <ChevronDown size={14} className={`transition-transform ${isExpanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
                    </div>
                  </div>
                  {isExpanded && (
                    <div className="divide-y" style={{ borderTop: '1px solid var(--border-subtle)', borderColor: 'var(--border-subtle)' }}>
                      {g.items.map(t => (
                        <div key={t.id} className={`p-3 flex justify-between items-center gap-2 ${selectedIds.has(t.id) ? 'bg-blue-50 dark:bg-blue-950/20' : ''}`}>
                          {selectMode && (
                            <input type="checkbox" checked={selectedIds.has(t.id)} onChange={() => toggleSelect(t.id)} className="w-4 h-4 accent-blue-600 flex-shrink-0" />
                          )}
                          <button aria-label="اعتماد" onClick={() => approveOne(t)} className="flex flex-col items-center px-1.5 py-1 rounded-lg active:scale-90 flex-shrink-0">
                            <Clock className="text-amber-500" size={16} />
                          </button>
                          <div className="flex-1 min-w-0">
                            <p className="font-bold text-xs truncate">
                              {t.description || 'بدون وصف'} <FamilyBadge tx={t} /> <SmsBadge tx={t} /> <TeldaBadge tx={t} /> <TransferBadge tx={t} /> <RecurringBadge tx={t} /> <CarryoverBadge tx={t} />
                            </p>
                            <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>{t.date} • {PAYMENT_METHODS.find(p => p.id === t.method)?.label}</p>
                          </div>
                          <div className="flex items-center gap-1 flex-shrink-0">
                            <span className="font-black text-xs">{fmt(t.amount)}</span>
                            {!selectMode && (
                              <React.Fragment>
                                <button type="button" aria-label="تعديل" onClick={() => { 
                                  dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); 
                                  dispatch({ type: 'SET_FORM_DATA', payload: t }); 
                                  dispatch({ type: 'SET_FORM_OPEN', payload: true }); 
                                }} className="btn btn-ghost p-1">
                                  <Edit size={12} />
                                </button>
                                <button type="button" aria-label="حذف" onClick={() => handleDelete(t.id)} className="btn btn-ghost p-1 text-red-500">
                                  <Trash2 size={12} />
                                </button>
                              </React.Fragment>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </section>
      
      {dailyGroups.length > 0 && (
        <details className="group" open>
          <summary className="cursor-pointer list-none">
            <div className="card py-3 flex items-center justify-between">
              <h3 className="font-bold text-xs flex items-center gap-2 text-emerald-600">
                <CheckCircle2 size={14} /> سجل المدفوعات ({paidArchive.length})
              </h3>
              <ChevronDown className="transition-transform group-open:rotate-180" size={14} style={{ color: 'var(--text-muted)' }} />
            </div>
          </summary>
          <div className="mt-2">
            {dailyGroups.map(group => (
              <div key={group.date}>
                <DayGroupHeader label={group.label} total={group.total} count={group.items.length} />
                <div className="space-y-2">
                  {group.items.map(t => (
                    <div key={t.id} className={`card py-2.5 flex justify-between items-center gap-2 ${selectedIds.has(t.id) ? 'ring-2 ring-blue-500' : ''}`}>
                      {selectMode && (
                        <input type="checkbox" checked={selectedIds.has(t.id)} onChange={() => toggleSelect(t.id)} className="w-4 h-4 accent-blue-600 flex-shrink-0" />
                      )}
                      <div className="min-w-0 flex-1">
                        <p className="font-bold text-xs truncate">
                          {t.type === 'income' ? '💰' : '💸'} {t.description || t.category}{' '}
                          <FamilyBadge tx={t} /> <SmsBadge tx={t} /> <TeldaBadge tx={t} /> <TransferBadge tx={t} /> <RecurringBadge tx={t} /> <CarryoverBadge tx={t} />
                        </p>
                        <p className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                          {PAYMENT_METHODS.find(p => p.id === t.method)?.label || ''}
                        </p>
                      </div>
                      <div className="flex items-center gap-1 flex-shrink-0">
                        <span className="font-black text-xs">{fmt(t.amount)}</span>
                        {!selectMode && (
                          <button aria-label="إعادة تعليق" onClick={() => reopenOne(t)} className="btn btn-ghost p-1 text-amber-500">
                            <Undo2 size={12} />
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </details>
      )}
    </div>
  );
});

/* ─── Custody View ─── */
const CustodyView = memo(({ data, dispatch, saveHistory, addNotification }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [filterType, setFilterType] = useState('all');
  const [newEntry, setNewEntry] = useState({ 
    type: CUSTODY_TYPE.RECEIVE, amount: '', date: getLocalISODate(), description: '', 
    method: 'cib_savings', relatedCategory: 'عهدة شركة إيماك' 
  });
  
  const custodyEntries = data?.custodyEntries || [];
  const summary = useMemo(() => computeCustodyBalance(custodyEntries), [custodyEntries]);
  
  const filtered = useMemo(() => { 
    const sorted = [...custodyEntries].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)); 
    if (filterType === 'all') return sorted; 
    return sorted.filter(e => e.type === filterType); 
  }, [custodyEntries, filterType]);

  const addEntry = () => {
    const check = validateAmount(newEntry.amount);
    if (!check.valid) { addNotification({ type: 'error', title: check.error }); return; }
    const descCheck = validateText(newEntry.description, { min: 2, max: 200, label: 'الوصف' });
    if (!descCheck.valid) { addNotification({ type: 'error', title: descCheck.error }); return; }
    const dateCheck = validateDate(newEntry.date);
    if (!dateCheck.valid) { addNotification({ type: 'error', title: dateCheck.error }); return; }
    const d = dateCheck.value;
    const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { addNotification({ type: 'error', title: `شهر ${txMonth} مغلق` }); return; }

    saveHistory();
    const amount = check.value;
    const entry = { ...newEntry, description: descCheck.value, id: getSafeId(), amount };
    const newEntries = [entry, ...custodyEntries];
    const newTxs = [];
    const baseTx = { date: newEntry.date, month: txMonth, year: txYear, monthIndex: d.getMonth(), status: 'paid', createdAt: new Date().toISOString() };
    
    if (newEntry.type === CUSTODY_TYPE.RECEIVE)
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'income', kind: KIND.OPERATIONAL, category: newEntry.relatedCategory, amount, description: `استلام عهدة: ${newEntry.description}`, method: newEntry.method, subType: 'deposit', linkedCustodyId: entry.id });
    else if (newEntry.type === CUSTODY_TYPE.TRANSFER)
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'income', kind: KIND.FINANCIAL, category: 'تحويلات واردة', amount, description: `تحويل عهدة: ${newEntry.description}`, method: newEntry.method, subType: 'deposit', linkedCustodyId: entry.id });
    else if (newEntry.type === CUSTODY_TYPE.SPEND_CASH)
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'expense', kind: KIND.OPERATIONAL, category: 'مصروفات عهدة', amount, description: `صرف كاش: ${newEntry.description}`, method: newEntry.method, subType: 'withdrawal', linkedCustodyId: entry.id });
    else if (newEntry.type === CUSTODY_TYPE.SPEND_CARD)
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'expense', kind: KIND.OPERATIONAL, category: 'فواتير عهدة', amount, description: `صرف بطاقة: ${newEntry.description}`, method: newEntry.method, subType: 'withdrawal', linkedCustodyId: entry.id });
    else if (newEntry.type === CUSTODY_TYPE.SETTLE)
      newTxs.push({ ...baseTx, id: getSafeId(), type: 'expense', kind: KIND.FINANCIAL, category: 'تحويلات', amount, description: `تسوية: ${newEntry.description}`, method: newEntry.method, subType: 'withdrawal', linkedCustodyId: entry.id });
    
    const newData = { 
      ...data, custodyEntries: newEntries, 
      transactions: [...newTxs, ...(data.transactions || [])].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) 
    };
    dispatch({ type: 'SET_DATA', payload: newData });
    setShowAdd(false);
    setNewEntry({ type: CUSTODY_TYPE.RECEIVE, amount: '', date: getLocalISODate(), description: '', method: 'cib_savings', relatedCategory: 'عهدة شركة إيماك' });
    addNotification({ type: 'success', title: 'تم التسجيل', message: `${CUSTODY_TYPE_LABELS[newEntry.type]} — ${fmt(amount)} ج.م` });
  };

  const deleteEntry = (id) => {
    const linkedTxs = (data.transactions || []).filter(t => t.linkedCustodyId === id);
    const blocked = linkedTxs.find(t => isMonthClosed(data, t.year || 2026, t.month));
    if (blocked) { addNotification({ type: 'error', title: `لا يمكن الحذف — شهر ${blocked.month} مغلق` }); return; }
    dispatch({ 
      type: 'SHOW_CONFIRM', danger: true, title: 'حذف حركة العهدة', message: 'سيتم حذف الحركة والقيود المرتبطة', 
      onConfirm: () => {
        saveHistory();
        const newEntries = custodyEntries.filter(e => e.id !== id);
        const newTxs = (data.transactions || []).filter(t => t.linkedCustodyId !== id);
        dispatch({ type: 'SET_DATA', payload: { ...data, custodyEntries: newEntries, transactions: newTxs } });
        addNotification({ type: 'success', title: 'تم الحذف' });
      }, 
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) 
    });
  };

  const usagePct = summary.received > 0 ? (summary.totalSpent / summary.received) * 100 : 0;

  return (
    <div className="space-y-4 animate-fadeIn">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div className="flex-1 min-w-[180px]">
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>رصيد العهدة الحالي</p>
            <h2 className={`text-3xl font-black tracking-tight ${summary.balance >= 0 ? 'text-blue-600' : 'text-red-600'}`}>
              {fmt(summary.balance)}
              <span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <p className="text-[11px] font-semibold mt-2" style={{ color: 'var(--text-muted)' }}>
              {summary.balance > 0 ? '⚠️ متبقي معك' : summary.balance < 0 ? '⚠️ صرفت أكثر' : '✅ مسددة'}
            </p>
          </div>
          <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs">
            <Plus size={14} /> حركة جديدة
          </button>
        </div>
        <div className="grid grid-cols-4 gap-2 mt-4">
          <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
            <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">مستلم</p>
            <p className="text-sm font-black text-blue-600 mt-0.5">{fmt(summary.received)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-cyan-50 dark:bg-cyan-950/30 text-center">
            <p className="text-[10px] font-bold text-cyan-700 dark:text-cyan-400">محوّل</p>
            <p className="text-sm font-black text-cyan-600 mt-0.5">{fmt(summary.transferred)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-orange-50 dark:bg-orange-950/30 text-center">
            <p className="text-[10px] font-bold text-orange-700 dark:text-orange-400">كاش</p>
            <p className="text-sm font-black text-orange-600 mt-0.5">{fmt(summary.spentCash)}</p>
          </div>
          <div className="p-2.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-center">
            <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">بطاقة</p>
            <p className="text-sm font-black text-purple-600 mt-0.5">{fmt(summary.spentCard)}</p>
          </div>
        </div>
        <div className="mt-3">
          <div className="flex justify-between text-[11px] font-bold mb-1.5" style={{ color: 'var(--text-muted)' }}>
            <span>نسبة الاستهلاك</span><span>{Math.round(usagePct)}%</span>
          </div>
          <div className="w-full rounded-full h-1.5 overflow-hidden" style={{ background: 'var(--bg-muted)' }}>
            <div className={`h-full ${usagePct > 90 ? 'bg-red-500' : usagePct > 60 ? 'bg-amber-500' : 'bg-blue-500'}`} style={{ width: `${Math.min(100, usagePct)}%` }}></div>
          </div>
        </div>
      </div>

      <div className="card p-2">
        <div className="flex gap-2 overflow-x-auto scroll-hide">
          {[
            { id: 'all', label: 'الكل' }, { id: CUSTODY_TYPE.RECEIVE, label: 'استلام' }, 
            { id: CUSTODY_TYPE.TRANSFER, label: 'تحويل' }, { id: CUSTODY_TYPE.SPEND_CASH, label: 'صرف كاش' }, 
            { id: CUSTODY_TYPE.SPEND_CARD, label: 'صرف بطاقة' }
          ].map(f => (
            <button key={f.id} onClick={() => setFilterType(f.id)} 
              className={`badge px-3 py-1.5 cursor-pointer whitespace-nowrap ${filterType === f.id ? 'badge-brand' : 'badge-neutral'}`}
            >{f.label}</button>
          ))}
        </div>
      </div>

      {filtered.length === 0 ? (
        <div className="card text-center p-12">
          <Briefcase size={40} className="mx-auto mb-3 text-blue-500" />
          <h3 className="text-base font-black mb-2">لا توجد حركات</h3>
          <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs"><Plus size={14} /> إضافة</button>
        </div>
      ) : (
        <div className="space-y-2">
          {filtered.map(entry => {
            const Icon = CUSTODY_TYPE_ICONS[entry.type] || Briefcase;
            const color = CUSTODY_TYPE_COLORS[entry.type] || '#6B7280';
            const isIncoming = entry.type === CUSTODY_TYPE.RECEIVE || entry.type === CUSTODY_TYPE.TRANSFER;
            return (
              <div key={entry.id} className="card py-3">
                <div className="flex justify-between items-center gap-3">
                  <div className="flex items-center gap-3 flex-1 min-w-0">
                    <div className="p-2 rounded-lg flex-shrink-0" style={{ background: `${color}20`, color }}>
                      <Icon size={16} />
                    </div>
                    <div className="min-w-0">
                      <h4 className="font-bold text-xs truncate">{entry.description}</h4>
                      <span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>
                        {CUSTODY_TYPE_LABELS[entry.type]} • {entry.date}
                      </span>
                    </div>
                  </div>
                  <div className="flex items-center gap-1 flex-shrink-0">
                    <p className={`font-black text-sm ${isIncoming ? 'text-emerald-600' : 'text-red-500'}`}>
                      {isIncoming ? '+' : '-'}{fmt(entry.amount)}
                    </p>
                    <button onClick={() => deleteEntry(entry.id)} className="btn btn-ghost p-1 text-red-500"><Trash2 size={12} /></button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {showAdd && (
        <ModalShell isOpen={true} onClose={() => setShowAdd(false)} title="حركة عهدة جديدة" icon="💼">
          <div className="space-y-3">
            <div>
              <p className="form-label">نوع الحركة</p>
              <div className="grid grid-cols-2 gap-2">
                {Object.entries(CUSTODY_TYPE_LABELS).map(([type, label]) => {
                  const Icon = CUSTODY_TYPE_ICONS[type] || Briefcase;
                  const color = CUSTODY_TYPE_COLORS[type];
                  const selected = newEntry.type === type;
                  return (
                    <button key={type} type="button" onClick={() => setNewEntry({ ...newEntry, type })} 
                      className="p-2.5 rounded-lg text-[11px] font-bold transition-all border-2 flex items-center gap-2" 
                      style={selected ? { borderColor: color, background: `${color}15`, color } : { borderColor: 'var(--border-default)' }}
                    >
                      <Icon size={14} /><span>{label}</span>
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <FormField label="المبلغ" inputMode="decimal" value={newEntry.amount} onChange={e => setNewEntry({ ...newEntry, amount: e.target.value })} placeholder="0.00" required />
              <FormField label="التاريخ" type="date" value={newEntry.date} onChange={e => setNewEntry({ ...newEntry, date: e.target.value })} required />
            </div>
            <FormField label="الوصف" value={newEntry.description} onChange={e => setNewEntry({ ...newEntry, description: e.target.value })} placeholder="عهدة إيماك - WE" required />
            <FormField label="الحساب/البطاقة" as="select" value={newEntry.method} onChange={e => setNewEntry({ ...newEntry, method: e.target.value })}
              options={PAYMENT_METHODS.map(m => ({ value: m.id, label: m.label }))} />
            <button onClick={addEntry} className="btn btn-primary w-full py-2.5 text-sm"><Save size={14} /> تسجيل الحركة</button>
          </div>
        </ModalShell>
      )}
    </div>
  );
});

/* ─── Hany Shop Ledger ─── */
const HanyShopLedger = memo(({ loan, addNotification }) => {
  const [expanded, setExpanded] = useState(false);
  const [searchTerm, setSearchTerm] = useState('');

  const payments = useMemo(() => {
    const arr = Array.isArray(loan.payments) ? loan.payments : [];
    return arr.slice().sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
  }, [loan.payments]);

  const totalPayments = payments.reduce((s, p) => s + safeNumber(p.amount), 0);
  const remainingAfterPayments = Math.max(0, safeNumber(loan.totalAmount) - totalPayments);

  const items = useMemo(() => {
    const raw = Array.isArray(loan.items) ? loan.items : [];
    return raw.slice().sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0));
  }, [loan.items]);

  const paidItems = useMemo(() => items.filter(i => i.status === 'paid'), [items]);
  const totalAllAmount = items.reduce((s, i) => s + safeNumber(i.amount), 0);

  const filteredItems = useMemo(() => {
    if (!searchTerm.trim()) return paidItems;
    const term = normalizeText(searchTerm);
    return paidItems.filter(i => normalizeText(i.description).includes(term));
  }, [paidItems, searchTerm]);

  const groupedItems = useMemo(() => {
    const map = {};
    filteredItems.forEach(item => {
      const key = (item.description || 'بدون وصف').trim();
      if (!map[key]) map[key] = { name: key, count: 0, total: 0 };
      map[key].count += 1;
      map[key].total += safeNumber(item.amount);
    });
    return Object.values(map).sort((a, b) => b.total - a.total);
  }, [filteredItems]);

  const totalFiltered = filteredItems.reduce((s, i) => s + safeNumber(i.amount), 0);

  return (
    <div className="mt-3 pt-3" style={{ borderTop: '1px dashed var(--border-default)' }}>
      <button type="button" onClick={() => setExpanded(v => !v)} 
        className="w-full flex items-center justify-between p-2.5 rounded-lg text-[11px] font-bold" 
        style={{ background: 'var(--bg-muted)' }}
      >
        <div className="flex items-center gap-2 flex-wrap min-w-0">
          <Receipt size={13} className="text-blue-500 flex-shrink-0" />
          <span>سجل المسحوبات المعتمدة ({paidItems.length})</span>
          {items.length > paidItems.length && <span className="badge badge-warning text-[9px]">{items.length - paidItems.length} معلق</span>}
          {payments.length > 0 && <span className="badge badge-success text-[9px]">{payments.length} دفعة</span>}
        </div>
        <ChevronDown size={14} className={`transition-transform ${expanded ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} />
      </button>

      {expanded && (
        <div className="mt-3 space-y-3 animate-fadeIn">
          <div className="relative">
            <Search className="absolute right-2.5 top-1/2 -translate-y-1/2" size={12} style={{ color: 'var(--text-muted)' }} />
            <input type="text" placeholder="ابحث..." className="input-field pr-8 text-[11px] py-2" 
              value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
          </div>

          <div className="p-3 rounded-lg grid grid-cols-3 gap-2 text-center" style={{ background: 'var(--bg-muted)' }}>
            <div>
              <p className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>المشتريات</p>
              <p className="text-[13px] font-black text-red-600">{fmt(totalAllAmount)}</p>
            </div>
            <div>
              <p className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>المدفوع</p>
              <p className="text-[13px] font-black text-emerald-600">{fmt(totalPayments)}</p>
            </div>
            <div>
              <p className="text-[9px] font-bold" style={{ color: 'var(--text-muted)' }}>المتبقي</p>
              <p className={`text-[13px] font-black ${remainingAfterPayments > 0 ? 'text-amber-600' : 'text-emerald-600'}`}>{fmt(remainingAfterPayments)}</p>
            </div>
          </div>

          {payments.length > 0 && (
            <div className="p-2.5 rounded-lg" style={{ background: 'rgba(4, 120, 87, 0.06)' }}>
              <div className="flex items-center justify-between mb-2">
                <p className="text-[10px] font-black text-emerald-700 dark:text-emerald-400">💵 الدفعات ({payments.length})</p>
                <span className="text-[10px] font-black text-emerald-600">{fmt(totalPayments)} ج.م</span>
              </div>
              <div className="space-y-1 max-h-40 overflow-y-auto scroll-hide">
                {payments.map(p => (
                  <div key={p.id} className="flex justify-between items-center gap-2 p-2 rounded-lg text-[10px]" style={{ background: 'var(--bg-card)' }}>
                    <div className="min-w-0 flex-1">
                      <p className="font-bold truncate">{p.description || 'سداد مسحوبات هاني'}</p>
                      <p className="text-[9px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{p.date}</p>
                    </div>
                    <span className="font-black text-emerald-600 flex-shrink-0">−{fmt(p.amount)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {filteredItems.length === 0 ? (
            <div className="text-center py-6 text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>
              {searchTerm ? '🔍 لا نتائج' : 'لا توجد مسحوبات معتمدة'}
            </div>
          ) : (
            <div className="space-y-1.5 max-h-80 overflow-y-auto scroll-hide">
              {groupedItems.map(g => (
                <div key={g.name} className="flex justify-between items-center gap-2 p-2.5 rounded-lg text-[11px]" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                  <div className="min-w-0 flex-1">
                    <p className="font-bold truncate">{g.name}</p>
                    <p className="text-[9px] mt-0.5" style={{ color: 'var(--text-muted)' }}>عدد: {g.count} • متوسط: {fmt(g.total / g.count)}</p>
                  </div>
                  <span className="font-black text-red-600 flex-shrink-0">{fmt(g.total)}</span>
                </div>
              ))}
            </div>
          )}

          <div className="flex justify-between items-center p-2.5 rounded-lg" style={{ background: 'rgba(185, 28, 28, 0.06)' }}>
            <span className="text-[10px] font-bold text-red-700 dark:text-red-400">إجمالي المعتمد ({paidItems.length})</span>
            <span className="font-black text-red-600 text-[13px]">{fmt(totalFiltered)}</span>
          </div>
        </div>
      )}
    </div>
  );
});

/* ─── Loans View ─── */
const LoansView = memo(({ 
  updatedLoans, cards, recurringItems, transactions, dispatch, deleteRecurring, 
  saveHistory, addNotification, data, selectedMonth, selectedYear 
}) => {
  const [showAdd, setShowAdd] = useState(false);
  const [activeTab, setActiveTab] = useState('loans');
  const [newLoan, setNewLoan] = useState({ name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false });
  const settlingRef = useRef(false);

  const openRecurringEdit = useCallback((item) => {
    dispatch({ 
      type: 'SET_RECURRING_FORM_DATA', 
      payload: { 
        id: item.id, title: item.title, amount: String(item.amount), day: item.day, 
        category: item.category, type: item.type, startMonth: item.startMonth || '', 
        endMonth: item.endMonth || '', active: item.active !== false, 
        kind: item.kind || null, linkedLoanSystemId: item.linkedLoanSystemId || null, 
        linkedCardId: item.linkedCardId || null, method: item.method || 'cash', 
        transferChannel: item.transferChannel || null 
      } 
    });
    dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: true });
  }, [dispatch]);

  const settleHany = async (loan) => {
    if (settlingRef.current) { addNotification({ type: 'info', title: 'العملية جارية...' }); return; }
    settlingRef.current = true;
    try {
      const total = safeNumber(loan.totalAmount);
      const paidAlready = safeNumber(loan.totalPaid);
      const remaining = Math.max(0, total - paidAlready);
      if (remaining <= 0.005) { addNotification({ type: 'info', title: 'مسدد بالكامل' }); return; }
      const monthKey = makeMonthKey(loan.year, loan.month);
      
      if (isMonthClosed(data, loan.year, loan.month)) { addNotification({ type: 'error', title: `شهر ${loan.month} مغلق` }); return; }
      if (Array.isArray(data.settledHanyMonths) && data.settledHanyMonths.includes(monthKey)) { addNotification({ type: 'info', title: 'تمت التسوية مسبقاً' }); return; }
      
      const input = await showInputModal({
        title: 'تسوية مسحوبات محل هاني', icon: '💰',
        message: `الإجمالي: ${fmt(total)}\nمدفوع: ${fmt(paidAlready)}\nالمتبقي: ${fmt(remaining)}\n\nالمبلغ المدفوع الآن:`,
        inputValue: String(remaining), numeric: true, confirmText: 'تسوية'
      });
      if (input === null) return;
      
      const paidNow = parseNumberInput(input);
      if (paidNow <= 0) { addNotification({ type: 'error', title: 'مبلغ غير صحيح' }); return; }
      if (paidNow > remaining + 0.005) { addNotification({ type: 'error', title: `الحد الأقصى ${fmt(remaining)}` }); return; }
      
      const newRemaining = remaining - paidNow;
      const willCarry = newRemaining > 0.005;
      let nextMIdx = 0, nextY = loan.year, nextMonthName = '';
      
      if (willCarry) {
        const monthIdx = getMonthIndex(loan.month);
        nextMIdx = monthIdx + 1; nextY = loan.year;
        if (nextMIdx > 11) { nextMIdx = 0; nextY++; }
        nextMonthName = ALL_MONTHS[nextMIdx];
        const nextMonthKey = makeMonthKey(nextY, nextMonthName);
        if ((data.closedMonths || []).includes(nextMonthKey)) { addNotification({ type: 'error', title: `شهر ${nextMonthName} ${nextY} مغلق` }); return; }
      }
      
      saveHistory();
      const loanMonthIdx = getMonthIndex(loan.month);
      const nowDate = new Date();
      const maxDayInLoanMonth = new Date(loan.year, loanMonthIdx + 1, 0).getDate();
      const actualPayDay = Math.min(nowDate.getDate(), maxDayInLoanMonth);
      const paymentDate = `${loan.year}-${String(loanMonthIdx + 1).padStart(2, '0')}-${String(actualPayDay).padStart(2, '0')}`;
      const newTxs = [];
      
      newTxs.push({
        id: 'hany-pay-' + getSafeId(), type: 'expense', kind: 'financial',
        category: 'الالتزامات البنكية والتمويلية', amount: paidNow,
        description: `سداد مسحوبات هاني — ${loan.month} ${loan.year}`,
        method: 'cash', date: paymentDate,
        month: loan.month, year: loan.year, monthIndex: loanMonthIdx,
        subType: 'withdrawal', status: 'paid', linkedLoanId: loan.id,
        settledHanyMonth: monthKey, createdAt: new Date().toISOString()
      });
      
      if (willCarry) {
        const nextMonthMaxDay = new Date(nextY, nextMIdx + 1, 0).getDate();
        const nextActualDay = Math.min(nowDate.getDate(), nextMonthMaxDay);
        const nextMonthDate = `${nextY}-${String(nextMIdx + 1).padStart(2, '0')}-${String(nextActualDay).padStart(2, '0')}`;
        newTxs.push({
          id: 'hany-carry-' + getSafeId(), type: 'expense', kind: 'operational',
          category: 'مسحوبات محل هاني', amount: newRemaining,
          description: `رصيد مرحل من ${loan.month} ${loan.year}`,
          method: 'cash', date: nextMonthDate,
          month: nextMonthName, year: nextY, monthIndex: nextMIdx,
          subType: 'withdrawal', status: 'pending',
          source: 'carryover', carryoverFrom: `${loan.month} ${loan.year}`,
          createdAt: new Date().toISOString()
        });
      }
      
      const newSettled = Array.isArray(data.settledHanyMonths) ? [...data.settledHanyMonths, monthKey] : [monthKey];
      
      dispatch({
        type: 'SET_DATA',
        payload: {
          ...data, settledHanyMonths: newSettled,
          transactions: [...newTxs, ...transactions].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0))
        }
      });
      addNotification({ type: 'success', title: 'تمت التسوية' });
    } finally { settlingRef.current = false; }
  };

  const totalLoans = useMemo(() => updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const totalReceivable = useMemo(() => updatedLoans.filter(l => l.isReceivable).reduce((s, l) => s + l.remaining, 0), [updatedLoans]);
  const payables = useMemo(() => updatedLoans.filter(l => !l.isReceivable), [updatedLoans]);
  const receivables = useMemo(() => updatedLoans.filter(l => l.isReceivable), [updatedLoans]);
  const totalCards = useMemo(() => cards.reduce((acc, c) => acc + Math.max(0, computeCardDebt(data, c)), 0), [cards, data]);
  const custodySummary = useMemo(() => computeCustodyBalance(data?.custodyEntries), [data?.custodyEntries]);

  const addLoan = () => {
    const nameCheck = validateText(newLoan.name, { min: 2, max: 200, label: 'الاسم' });
    if (!nameCheck.valid) { addNotification({ type: 'error', title: nameCheck.error }); return; }
    const amountCheck = validateAmount(newLoan.totalAmount);
    if (!amountCheck.valid) { addNotification({ type: 'error', title: amountCheck.error }); return; }
    saveHistory();
    dispatch({ 
      type: 'UPDATE_LOANS', 
      payload: [...updatedLoans, { 
        id: Date.now(), name: nameCheck.value, totalAmount: amountCheck.value, prePaidAmount: 0, 
        monthlyInstallment: safeNumber(newLoan.monthlyInstallment), dueDay: safeNumber(newLoan.dueDay, 1), 
        interest: '', description: newLoan.description || '', type: newLoan.isReceivable ? 'receivable' : 'debt', 
        isReceivable: newLoan.isReceivable, paused: false 
      }] 
    });
    setShowAdd(false); setNewLoan({ name: '', totalAmount: '', monthlyInstallment: '', dueDay: 1, description: '', isReceivable: false });
    addNotification({ type: 'success', title: 'تمت الإضافة' });
  };

  const handleCollectReceivable = (loan, sourceTx) => {
    const d = new Date();
    const y = d.getFullYear(), m = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, y, m)) { addNotification({ type: 'error', title: 'الشهر مغلق' }); return; }
    
    const alreadyCollected = transactions.some(t => 
      t.sourceReceivableId === loan.id && t.month === m && (t.year || y) === y && t.status === 'paid'
    );
    if (alreadyCollected) { addNotification({ type: 'warning', title: 'تم التحصيل مسبقاً' }); return; }
    
    saveHistory();
    if (sourceTx) {
      dispatch({ 
        type: 'UPDATE_TRANSACTIONS', 
        payload: transactions.map(t => t.id === sourceTx.id ? { ...t, status: 'paid', date: getLocalISODate(d), sourceReceivableId: loan.id } : t) 
      });
      addNotification({ type: 'success', title: 'تم اعتماد القسط' });
      return;
    }
    const orphanPending = transactions.find(t => 
      t.status !== 'paid' && t.month === m && (t.year || y) === y 
      && t.category === 'تكييف محمود' && !t.sourceReceivableId 
      && safeNumber(t.amount) === safeNumber(loan.monthlyInstallment)
    );
    if (orphanPending) {
      dispatch({ 
        type: 'UPDATE_TRANSACTIONS', 
        payload: transactions.map(t => t.id === orphanPending.id ? { ...t, status: 'paid', date: getLocalISODate(d), sourceReceivableId: loan.id } : t) 
      });
      addNotification({ type: 'success', title: 'تم اعتماد القيد' });
      return;
    }
    const newTx = { 
      id: 'recv-manual-' + getSafeId(), type: 'income', kind: KIND.OPERATIONAL, category: 'تكييف محمود', 
      amount: safeNumber(loan.monthlyInstallment), description: `تحصيل قسط ${loan.name}`, 
      method: 'cash', date: getLocalISODate(d), month: m, year: y, monthIndex: d.getMonth(), 
      subType: 'deposit', status: 'paid', sourceReceivableId: loan.id, createdAt: new Date().toISOString()
    };
    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [newTx, ...transactions].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)) });
    addNotification({ type: 'success', title: 'تم التحصيل' });
  };

  const handleTogglePause = (loan) => {
    saveHistory();
    dispatch({ type: 'UPDATE_LOANS', payload: (data.loans || []).map(l => l.id === loan.id ? { ...l, paused: !l.paused } : l) });
    addNotification({ type: loan.paused ? 'success' : 'warning', title: loan.paused ? 'تم التفعيل' : 'تم الإيقاف' });
  };

  const toggleRecurringActive = (id) => {
    saveHistory();
    dispatch({ type: 'UPDATE_RECURRING_ITEMS', payload: recurringItems.map(r => r.id === id ? { ...r, active: r.active === false } : r) });
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="sub-tab-switcher">
        <button onClick={() => setActiveTab('loans')} className={`sub-tab-btn ${activeTab === 'loans' ? 'active' : ''}`}>
          <Banknote size={14} /> القروض والمستحقات
        </button>
        <button onClick={() => setActiveTab('custody')} className={`sub-tab-btn ${activeTab === 'custody' ? 'active' : ''}`}>
          <Briefcase size={14} /> العهدة 
          {custodySummary.balance !== 0 && <span className="badge badge-warning text-[9px] px-1.5 py-0">{fmt(custodySummary.balance)}</span>}
        </button>
      </div>

      {activeTab === 'custody' ? (
        <CustodyView data={data} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />
      ) : (
        <React.Fragment>
          <div className="card">
            <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>إجمالي المديونية الصافية</p>
            <h2 className="text-3xl font-black tracking-tight text-gradient">
              {fmt(totalLoans + totalCards - totalReceivable)}
              <span className="text-sm font-bold mr-2" style={{ color: 'var(--text-muted)' }}>ج.م</span>
            </h2>
            <div className="grid grid-cols-3 gap-2 mt-3">
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">القروض</p>
                <p className="text-xs font-black text-red-600">{fmt(totalLoans)}</p>
              </div>
              <div className="p-2 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
                <p className="text-[10px] font-bold text-red-700 dark:text-red-400">البطاقات</p>
                <p className="text-xs font-black text-red-600">{fmt(totalCards)}</p>
              </div>
              <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
                <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">مستحقات</p>
                <p className="text-xs font-black text-emerald-600">{fmt(totalReceivable)}</p>
              </div>
            </div>
            <div className="flex gap-2 mt-3 flex-wrap">
              <button onClick={() => setShowAdd(true)} className="btn btn-primary text-xs flex-1"><Plus size={14} /> إضافة التزام</button>
              <button onClick={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: true })} className="btn btn-secondary text-xs flex-1"><Repeat size={14} /> متكرر</button>
            </div>
          </div>

          {showAdd && (
            <ModalShell isOpen={true} onClose={() => setShowAdd(false)} title="التزام جديد" icon="📋">
              <div className="space-y-3">
                <FormField label="الاسم" value={newLoan.name} onChange={e => setNewLoan({ ...newLoan, name: e.target.value })} required />
                <div className="grid grid-cols-2 gap-3">
                  <FormField label="المبلغ" inputMode="decimal" value={newLoan.totalAmount} onChange={e => setNewLoan({ ...newLoan, totalAmount: e.target.value })} required />
                  <FormField label="القسط" inputMode="decimal" value={newLoan.monthlyInstallment} onChange={e => setNewLoan({ ...newLoan, monthlyInstallment: e.target.value })} />
                </div>
                <label className="flex items-center gap-3 p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 cursor-pointer">
                  <input type="checkbox" checked={newLoan.isReceivable} onChange={e => setNewLoan({ ...newLoan, isReceivable: e.target.checked })} className="w-4 h-4 accent-emerald-600" />
                  <span className="text-xs font-bold text-emerald-700 dark:text-emerald-400">مستحق لي</span>
                </label>
                <button onClick={addLoan} className="btn btn-primary w-full py-2.5 text-sm">إضافة</button>
              </div>
            </ModalShell>
          )}

          {receivables.length > 0 && (
            <div className="space-y-2">
              <h3 className="font-black text-sm flex items-center gap-2 text-emerald-600"><TrendingUp size={14} /> مستحقات لك ({receivables.length})</h3>
              {receivables.map(loan => {
                const monthly = safeNumber(loan.monthlyInstallment);
                const totalMonths = safeNumber(loan.totalInstallments) || (monthly > 0 ? Math.ceil(safeNumber(loan.remaining) / monthly) + safeNumber(loan.paidInstallments) : 0);
                const paidMonths = safeNumber(loan.paidInstallments) || Math.max(0, totalMonths - (monthly > 0 ? Math.ceil(safeNumber(loan.remaining) / monthly) : 0));
                const pct = safeNumber(loan.totalAmount) > 0 ? (safeNumber(loan.totalPaid) / safeNumber(loan.totalAmount)) * 100 : 0;
                const isComplete = loan.remaining <= 0.005;
                const thisMonthCollected = transactions.some(t => t.sourceReceivableId === loan.id && t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status === 'paid');
                const thisMonthPending = transactions.find(t => t.sourceReceivableId === loan.id && t.month === selectedMonth && (t.year || 2026) === selectedYear && t.status !== 'paid');
                
                return (
                  <div key={loan.id} className="card">
                    <div className="flex justify-between items-start gap-3 flex-wrap mb-3">
                      <div className="flex items-center gap-3 flex-1 min-w-0">
                        <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400 flex-shrink-0">
                          <TrendingUp size={20} />
                        </div>
                        <div className="min-w-0">
                          <h4 className="font-bold text-sm truncate flex items-center gap-2 flex-wrap">
                            {loan.name}
                            {loan.paused && <span className="badge badge-warning text-[10px]">⏸ موقوف</span>}
                          </h4>
                          <p className="text-[11px] text-emerald-600 font-semibold mt-0.5">يوم {loan.dueDay} • {fmt(monthly)} ج.م شهريًا</p>
                        </div>
                      </div>
                      <div className="flex gap-1">
