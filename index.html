const DRIVE_CLIENT_ID = '190006477168-odmpreq26b618rdn1dsg4k1aag3k056g.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER_NAME = 'Finance Backups';
let _driveTokenClient = null;
let _driveAccessToken = null;
let _driveTokenExpiry = 0;

const waitForGIS = (timeoutMs = 10000) => new Promise((resolve, reject) => {
  if (window.google?.accounts?.oauth2) return resolve();
  const start = Date.now();
  const timer = setInterval(() => {
    if (window.google?.accounts?.oauth2) { clearInterval(timer); resolve(); }
    else if (Date.now() - start > timeoutMs) { clearInterval(timer); reject(new Error('GIS غير محمّل')); }
  }, 150);
});

const initDriveTokenClient = async () => {
  if (_driveTokenClient) return _driveTokenClient;
  await waitForGIS();
  _driveTokenClient = window.google.accounts.oauth2.initTokenClient({ client_id: DRIVE_CLIENT_ID, scope: DRIVE_SCOPE, callback: () => {} });
  return _driveTokenClient;
};

const requestDriveToken = async () => {
  const client = await initDriveTokenClient();
  return new Promise((resolve, reject) => {
    client.callback = (resp) => {
      if (resp.error) return reject(new Error(resp.error));
      _driveAccessToken = resp.access_token;
      _driveTokenExpiry = Date.now() + (safeNumber(resp.expires_in, 3600) * 1000) - 60000;
      resolve(_driveAccessToken);
    };
    client.requestAccessToken({ prompt: _driveAccessToken ? '' : 'consent' });
  });
};

const ensureDriveToken = async () => {
  if (_driveAccessToken && Date.now() < _driveTokenExpiry) return _driveAccessToken;
  return requestDriveToken();
};

const getOrCreateBackupFolder = async () => {
  const token = await ensureDriveToken();
  const q = encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('فشل قراءة المجلدات');
  const data = await res.json();
  if (data.files && data.files.length > 0) return data.files[0].id;
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }) });
  if (!createRes.ok) throw new Error('فشل إنشاء المجلد');
  const created = await createRes.json();
  return created.id;
};

const uploadBackupToDrive = async (payload, fileName) => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const name = fileName || `finance_backup_${getLocalISODate()}_${Date.now()}.json`;
  const metadata = { name, parents: [folderId], mimeType: 'application/json' };
  const boundary = '----V73DriveBoundary' + Date.now();
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,createdTime', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` }, body });
  if (!res.ok) throw new Error('فشل الرفع');
  return await res.json();
};

const listDriveBackups = async () => {
  const token = await ensureDriveToken();
  const folderId = await getOrCreateBackupFolder();
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false and mimeType='application/json'`);

};

function playFamilyAlert(freq = 880) {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq; osc.type = 'sine';
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.35);
  } catch (e) { }
}

      const inc = op('income'), exp = op('expense'); const savings = inc - exp;
      const totalDebt = updatedLoans.filter(l => !l.isReceivable).reduce((s, l) => s + l.remaining, 0) + cards.reduce((s, c) => s + safeNumber(c.openingDebt), 0);
      const totalReceivable = updatedLoans.filter(l => l.isReceivable).reduce((s, l) => s + l.remaining, 0);
      const bankFees = m.filter(t => t.status === 'paid' && BANK_FEE_CATEGORIES.has(t.category)).reduce((s, t) => s + safeNumber(t.amount), 0);
      let text = `تحليل ${selectedMonth} ${selectedYear}\n\n`;
      text += `الدخل: ${fmt(inc)} ج.م\n`;
      text += `المصروف: ${fmt(exp)} ج.م\n`;
      if (bankFees > 0) text += `الرسوم البنكية: ${fmt(bankFees)} ج.م\n`;
      text += `\n`;
      text += savings > 0 ? `وفر: ${fmt(savings)} ج.م\n\n` : savings < 0 ? `عجز: ${fmt(Math.abs(savings))} ج.م\n\n` : `متعادل\n\n`;
      text += `المديونية: ${fmt(totalDebt)} ج.م\n`;
      if (totalReceivable > 0) text += `مستحقات: ${fmt(totalReceivable)} ج.م\n`;
      if (custodySummary.balance !== 0) text += `رصيد العهدة: ${fmt(custodySummary.balance)} ج.م\n`;
      dispatch({ type: 'SET_AI_RESPONSE', payload: text });
      dispatch({ type: 'SET_AI_LOADING', payload: false });
    }, 800);
  }, [transactions, selectedYear, selectedMonth, updatedLoans, cards, custodySummary]);

  useEffect(() => { localStorage.setItem('budgets', JSON.stringify(budgets)); }, [budgets]);

      case 'transactions': return <TransactionsView groupedTransactions={groupedTransactions} transactions={transactions} selectedMonth={selectedMonth} selectedYear={selectedYear} transViewMode={transViewMode} statusFilter={statusFilter} searchTerm={searchTerm} expandedGroup={expandedGroup} data={data} monthInsights={monthInsights} dispatch={dispatch} handleDelete={handleDelete} printReport={printReport} exportPdf={exportPdf} addNotification={addNotification} onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} saveHistory={saveHistory} onPrintMonthlyReport={printMonthlyReportPdf} />;
      case 'categories': return <CategoriesView transactions={transactions} selectedMonth={selectedMonth} selectedYear={selectedYear} catViewType={catViewType} activeCategoryDetail={activeCategoryDetail} budgets={budgets} dispatch={dispatch} handleDelete={handleDelete} printReport={printReport} exportPdf={exportPdf} onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} />;
      case 'loans': return <LoansView updatedLoans={updatedLoans} cards={cards} recurringItems={recurringItems} transactions={transactions} dispatch={dispatch} deleteRecurring={deleteRecurring} saveHistory={saveHistory} getLocalISODate={getLocalISODate} addNotification={addNotification} data={data} />;
      case 'cards': return <WalletsAndCardsView cards={cards} buildLedger={buildLedger} expandedLedgers={expandedLedgers} expandedCardsSection={expandedCardsSection} selectedMonth={selectedMonth} selectedYear={selectedYear} dispatch={dispatch} handleDelete={handleDelete} handleAddWalletDeposit={handleAddWalletDeposit} handleAddWalletWithdrawal={handleAddWalletWithdrawal} exportWalletCSV={exportWalletCSV} walletVisibility={walletVisibility} liveBalances={liveBalances} cardHistoryMap={cardHistoryMap} saveHistory={saveHistory} addNotification={addNotification} data={data} />;
      case 'planning': return <MonthlyPlanningView data={data} monthlyPlans={monthlyPlans} cards={cards} loans={updatedLoans} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />;
      case 'planner': return <PlannerView updatedLoans={updatedLoans} cards={cards} selectedMonth={selectedMonth} selectedYear={selectedYear} monthlyPlans={monthlyPlans} totalLiquidityNow={totalLiquidity} />;
      case 'forecast': return <LiquidityForecastView transactions={transactions} updatedLoans={updatedLoans} recurringItems={recurringItems} liveBalances={liveBalances} selectedYear={selectedYear} selectedMonth={selectedMonth} monthlyPlans={monthlyPlans} />;
      case 'comparison': return <MonthComparisonView transactions={transactions} selectedYear={selectedYear} selectedMonth={selectedMonth} />;
      case 'calendar': return <CalendarView data={data} getAgendaItems={getAgendaItems} transactions={transactions} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />;
      case 'duplicates': return <DuplicateDetectionSystem transactions={transactions} data={data} dispatch={dispatch} addNotification={addNotification} saveHistory={saveHistory} />;
      case 'settings': return <SettingsView data={data} accountsData={accountsData} cards={cards} budgets={budgets} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} walletVisibility={walletVisibility} onToggleVisibility={(k) => dispatch({ type: 'TOGGLE_WALLET_VISIBILITY', payload: k })} />;
      default: return null;
    }

  return (
    <div className="flex h-screen overflow-hidden font-sans">

      <ConfirmDialog confirmDialog={confirmDialog} dispatch={dispatch} />
      {isProcessing && (<div className="processing-overlay"><div className="processing-spinner mb-4"></div><h3 className="text-base font-bold mb-2">جاري تطبيق العملية</h3><button onClick={cancelProcessing} className="btn btn-secondary bg-red-500 text-white mt-3 text-xs">إلغاء</button></div>)}

                  <button onClick={() => { dispatch({ type: 'SET_ACTIVE_TAB', payload: 'settings' }); setIsDrawerOpen(false); }} className="col-span-2 flex items-center justify-center gap-2 p-2.5 rounded-lg text-xs font-bold active:scale-[0.97]" style={{ background: 'var(--bg-muted)', color: 'var(--text-secondary)' }}>

      {!isLocked && (<button type="button" aria-label="إضافة" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'add' }); dispatch({ type: 'SET_FORM_DATA', payload: { type: 'expense', category: '', amount: '', date: getLocalISODate(), method: 'cash', subType: 'withdrawal', status: 'pending' } }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="fab no-print"><Plus size={22} /></button>)}

      </main>

      {isFormOpen && (
        <div className="modal-backdrop no-print"><div className="w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)', maxHeight: 'calc(100dvh - 24px)' }}>
          <div className="p-3.5 flex justify-between items-center flex-shrink-0" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="text-sm font-black">{formMode === 'add' ? 'إضافة عملية' : 'تعديل'}</h3><button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_FORM_OPEN', payload: false })} className="btn btn-ghost p-1.5"><X size={16} /></button></div>

              <div><label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الفئة</label><select className={`input-field font-bold text-sm py-2.5 ${formErrors.category ? 'error' : ''}`} value={formData.category} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, category: e.target.value } })} required><option value="">اختر...</option>{Object.entries(CATEGORY_GROUPS[formData.type]).map(([g, items]) => (<optgroup key={g} label={g}>{items.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>))}</select></div>
            </div>
            <div className="p-2.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <div className="grid grid-cols-2 gap-1.5">
                <label className={`flex items-center justify-center gap-1.5 p-2.5 rounded-lg cursor-pointer border-2 font-bold text-[11px] transition-all ${formData.status !== 'paid' ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-500 text-amber-700 dark:text-amber-400' : 'border-transparent'}`}><input type="radio" name="status" value="pending" className="hidden" checked={formData.status !== 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'pending' } })} /><Clock size={12} /> معلق</label>
                <label className={`flex items-center justify-center gap-1.5 p-2.5 rounded-lg cursor-pointer border-2 font-bold text-[11px] transition-all ${formData.status === 'paid' ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-500 text-emerald-700 dark:text-emerald-400' : 'border-transparent'}`}><input type="radio" name="status" value="paid" className="hidden" checked={formData.status === 'paid'} onChange={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, status: 'paid' } })} /><CheckCircle2 size={12} /> معتمد</label>

            </div>)}
            <div className="grid grid-cols-3 gap-2">
              <div><label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>المبلغ</label><input type="text" inputMode="decimal" required className={`input-field text-sm font-black text-blue-600 text-center py-2.5 ${formErrors.amount ? 'error' : ''}`} value={formData.amount} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, amount: e.target.value } })} /></div>
              <div><label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>التاريخ</label><input type="date" required className={`input-field text-[11px] font-bold py-2.5 ${formErrors.date ? 'error' : ''}`} value={formData.date} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, date: e.target.value } })} /></div>

            </div>
            {formData.category === 'مسحوبات محل هاني' && (<div className="p-2.5 rounded-lg bg-orange-50 dark:bg-orange-950/30 border border-orange-200 dark:border-orange-900">

              <div className="flex flex-wrap gap-1 max-h-32 overflow-y-auto scroll-hide">
                {HANY_QUICK_ITEMS.map(item => (<button key={item} type="button" onClick={() => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: item } })} className={`px-2 py-1 rounded-md text-[10px] font-bold transition-all ${formData.description === item ? 'bg-orange-500 text-white' : 'bg-white dark:bg-slate-800 text-orange-700 dark:text-orange-300'}`}>{item}</button>))}

            </div>)}
            <div><label className="block text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الوصف</label><input type="text" className={`input-field font-bold text-sm py-2.5 ${formErrors.description ? 'error' : ''}`} value={formData.description || ''} onChange={e => dispatch({ type: 'SET_FORM_DATA', payload: { ...formData, description: e.target.value } })} placeholder="تفاصيل..." /></div>
            {formData.category === 'مسحوبات محل هاني' && formMode === 'add' ? (<div className="grid grid-cols-2 gap-2"><button type="button" onClick={handleSaveAndNext} disabled={isProcessing} className="btn btn-secondary py-2.5 text-sm"><Zap size={14} /> حفظ + التالي</button><button type="submit" disabled={isProcessing} className="btn btn-primary py-2.5 text-sm"><Save size={14} /> حفظ</button></div>) : (<button type="submit" className="btn btn-primary w-full py-2.5 text-sm" disabled={isProcessing}>{isProcessing ? 'جاري الحفظ...' : <><Save size={14} /> {formData.status === 'paid' ? 'حفظ واعتماد' : 'حفظ كمعلق'}</>}</button>)}
          </form></div></div>)}
      {isAiModalOpen && (<div className="modal-backdrop no-print"><div className="w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}><div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="text-sm font-black flex items-center gap-2"><Sparkles size={14} className="text-blue-500" /> المساعد</h3><button type="button" onClick={() => dispatch({ type: 'SET_AI_MODAL_OPEN', payload: false })} className="btn btn-ghost p-1.5"><X size={16} /></button></div><div className="p-4"><button type="button" onClick={handleAnalyzeFinances} disabled={isAiLoading} className="btn btn-primary w-full py-2.5 text-sm mb-3">{isAiLoading ? 'جاري التحليل...' : <><Sparkles size={14} /> تحليل الوضع المالي</>}</button>{aiResponse && <div className="p-3 rounded-lg whitespace-pre-line text-xs font-medium leading-relaxed" style={{ background: 'var(--bg-muted)' }}>{aiResponse}</div>}</div></div></div>)}
      {editingCard && (<div className="modal-backdrop no-print"><div className="w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-slideInBottom max-h-[90dvh] flex flex-col" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}><div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="text-sm font-black">تعديل البطاقة</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_CARD', payload: null })} className="btn btn-ghost p-1.5"><X size={16} /></button></div>
        <form onSubmit={handleUpdateCard} className="p-4 space-y-2.5 overflow-y-auto scroll-hide">
          <div className="grid grid-cols-2 gap-2.5"><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الاسم</label><input type="text" required className="input-field text-sm" value={editingCard.name} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, name: e.target.value } })} /></div><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>البنك</label><input type="text" required className="input-field text-sm" value={editingCard.bank} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, bank: e.target.value } })} /></div></div>
          <div className="grid grid-cols-3 gap-2.5"><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الحد</label><input type="text" inputMode="decimal" className="input-field text-blue-600 font-bold text-sm" value={editingCard.limit} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, limit: e.target.value, availableBalance: Math.max(0, parseNumberInput(e.target.value) - safeNumber(editingCard.openingDebt)) } })} /></div><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>المديونية</label><input type="text" inputMode="decimal" className="input-field text-red-500 font-bold text-sm" value={editingCard.openingDebt} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, openingDebt: e.target.value, availableBalance: Math.max(0, safeNumber(editingCard.limit) - parseNumberInput(e.target.value)) } })} /></div><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>كاش باك %</label><input type="text" inputMode="decimal" className="input-field text-amber-600 font-black text-sm text-center" value={editingCard.cashbackRate || 1} onChange={e => dispatch({ type: 'SET_EDITING_CARD', payload: { ...editingCard, cashbackRate: e.target.value } })} /></div></div>
          <button type="submit" className="btn btn-primary w-full py-2.5 text-sm">حفظ</button></form></div></div>)}
      {editingLoan && (<div className="modal-backdrop no-print"><div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}><div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="text-sm font-black">تعديل الالتزام</h3><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_LOAN', payload: null })} className="btn btn-ghost p-1.5"><X size={16} /></button></div>
        <form onSubmit={handleUpdateLoan} className="p-4 space-y-2.5">
          <div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>الاسم</label><input type="text" className="input-field text-sm" value={editingLoan.name} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, name: e.target.value } })} /></div>
          <div className="grid grid-cols-2 gap-2.5"><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>المبلغ</label><input type="text" inputMode="decimal" className="input-field text-sm" value={editingLoan.totalAmount} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, totalAmount: e.target.value } })} /></div><div><label className="text-[11px] font-bold" style={{ color: 'var(--text-muted)' }}>القسط</label><input type="text" inputMode="decimal" className="input-field text-sm" value={editingLoan.monthlyInstallment} onChange={e => dispatch({ type: 'SET_EDITING_LOAN', payload: { ...editingLoan, monthlyInstallment: e.target.value } })} /></div></div>
          <button type="submit" className="btn btn-primary w-full py-2.5 text-sm">حفظ</button></form></div></div>)}
      {editingBudgetCategory && (<div className="modal-backdrop no-print"><div className="w-full max-w-sm rounded-2xl shadow-2xl p-5" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}><h3 className="text-sm font-black mb-3">ميزانية: {editingBudgetCategory}</h3>
        <input type="text" inputMode="decimal" className="input-field text-base font-black text-blue-600 mb-3" value={budgetAmount} onChange={e => dispatch({ type: 'SET_BUDGET_AMOUNT', payload: e.target.value })} />
        <div className="flex gap-2"><button type="button" onClick={handleSaveBudget} className="btn btn-primary flex-1 text-sm">حفظ</button><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null })} className="btn btn-secondary flex-1 text-sm">إلغاء</button></div></div></div>)}
      {isQuickTransferModalOpen && (<div className="modal-backdrop no-print"><div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}><div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="text-sm font-black flex items-center gap-2"><ArrowRight size={16} className="text-blue-500" /> تحويل</h3><button type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false })} className="btn btn-ghost p-1.5"><X size={16} /></button></div>
        <form onSubmit={handleQuickTransfer} className="p-4 space-y-3">
          <div>
            <div className="grid grid-cols-3 gap-1.5">
              {[{ id: 'internal', label: 'حساباتي', icon: '🏠' }, { id: 'external', label: 'جهة خارجية', icon: '🌍' }, { id: 'fees', label: 'رسوم', icon: '💰' }].map(t => (
                <button key={t.id} type="button" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { transferType: t.id } })} className={`p-2.5 rounded-lg text-[11px] font-bold transition-all border-2 flex flex-col items-center gap-1 ${quickTransferData.transferType === t.id ? 'border-blue-500 bg-blue-50 dark:bg-blue-950/30 text-blue-700 dark:text-blue-400' : 'border-[color:var(--border-default)]'}`}>
                  <span className="text-sm">{t.icon}</span><span>{t.label}</span>
                </button>
              ))}
            </div>
          </div>
          <div className={`grid ${quickTransferData.transferType === 'internal' ? 'grid-cols-2' : 'grid-cols-1'} gap-2.5`}>
            <div>
              <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>من</label>
              <select className="input-field text-sm py-2.5" value={quickTransferData.from} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: e.target.value } })}>{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select>
            </div>
            {quickTransferData.transferType === 'internal' && (<div>
              <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>إلى</label>
              <select className="input-field text-sm py-2.5" value={quickTransferData.to} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { to: e.target.value } })}>{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select>
            </div>)}
            {quickTransferData.transferType === 'external' && (<div>
              <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الجهة *</label>
              <input type="text" className="input-field text-sm py-2.5" placeholder="اسم الجهة" value={quickTransferData.externalEntity || ''} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { externalEntity: e.target.value } })} />
            </div>)}
          </div>
          <div className={`grid ${quickTransferData.transferType === 'fees' ? 'grid-cols-1' : 'grid-cols-2'} gap-2.5`}>
            {quickTransferData.transferType !== 'fees' && (<div>
              <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>المبلغ</label>
              <input type="text" inputMode="decimal" required className="input-field text-base font-black text-blue-600 text-center py-2.5" value={quickTransferData.amount} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: e.target.value } })} placeholder="0.00" />
            </div>)}
            {quickTransferData.transferType !== 'internal' && (<div>
              <label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>{quickTransferData.transferType === 'fees' ? 'الرسوم *' : 'رسوم'}</label>
              <input type="text" inputMode="decimal" className="input-field text-base font-black text-amber-600 text-center py-2.5" value={quickTransferData.fees || ''} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { fees: e.target.value } })} placeholder="0.00" />
            </div>)}
          </div>
          <button type="submit" className="btn btn-primary w-full py-2.5 text-sm" disabled={isProcessing}>{isProcessing ? 'جاري التنفيذ...' : 'تنفيذ التحويل'}</button>
        </form></div></div>)}
      {isRecurringModalOpen && (<div className="modal-backdrop no-print"><div className="w-full max-w-md rounded-2xl shadow-2xl animate-slideInBottom" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}><div className="p-4 flex justify-between items-center" style={{ borderBottom: '1px solid var(--border-subtle)' }}><h3 className="text-sm font-black flex items-center gap-2"><Repeat size={14} className="text-blue-500" /> التزام متكرر</h3><button type="button" onClick={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false })} className="btn btn-ghost p-1.5"><X size={16} /></button></div>
        <form onSubmit={handleSaveRecurring} className="p-4 space-y-2.5">
          <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>العنوان</label><input type="text" required className="input-field text-sm" value={recurringFormData.title} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, title: e.target.value } })} /></div>
          <div className="grid grid-cols-2 gap-2.5"><div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>المبلغ</label><input type="text" inputMode="decimal" required className="input-field font-bold text-blue-600 text-sm" value={recurringFormData.amount} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, amount: e.target.value } })} /></div><div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>اليوم</label><input type="number" required min="1" max="31" className="input-field text-center text-sm" value={recurringFormData.day} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, day: e.target.value } })} /></div></div>
          <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>النوع</label><select className="input-field text-sm" value={recurringFormData.type} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, type: e.target.value } })}><option value="expense">مصروف</option><option value="income">دخل</option></select></div>
          <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>الفئة</label><select className="input-field text-sm" value={recurringFormData.category} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, category: e.target.value } })}><option value="أخرى">أخرى</option><optgroup label="دخل">{CATEGORIES.income.map(c => <option key={'i-'+c} value={c}>{c}</option>)}</optgroup><optgroup label="مصروف">{CATEGORIES.expense.map(c => <option key={'e-'+c} value={c}>{c}</option>)}</optgroup></select></div>
          <button type="submit" className="btn btn-primary w-full py-2.5 text-sm">إضافة</button></form></div></div>)}
    </div>
  );
}

const rootElement = document.getElementById('root');
if (rootElement) {
  setTimeout(() => { const l = document.getElementById('loading'); if (l) l.style.display = 'none'; }, 1000);
  createRoot(rootElement).render(<ErrorBoundary><App /></ErrorBoundary>);
}
</script>
</body>
</html>
