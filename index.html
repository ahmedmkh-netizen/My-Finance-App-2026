    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'تأكيد الحذف', message: 'هل أنت متأكد؟', onConfirm: () => { saveHistory(); dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.filter(t => t.id !== id) }); addNotification({ type: 'success', title: 'تم الحذف' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  }, [transactions, data, saveHistory, addNotification]);

  const handleQuickTransfer = useCallback((e) => {
    e.preventDefault(); if (isProcessing) return;
    const amount = parseNumberInput(quickTransferData.amount);
    const fees = parseNumberInput(quickTransferData.fees || 0);
    const d = new Date(); const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { addNotification({ type: 'error', title: 'محظور', message: 'شهر اليوم مغلق' }); return; }
    if (amount <= 0 || quickTransferData.from === quickTransferData.to) { addNotification({ type: 'error', title: 'خطأ', message: 'تحقق من البيانات' }); return; }
    if (ACCOUNT_METHOD_IDS.includes(quickTransferData.from)) { const fromBal = computeBalance(data, quickTransferData.from); if (amount + fees > fromBal + 0.001) { addNotification({ type: 'error', title: 'رصيد غير كافٍ', message: `المطلوب: ${fmt(amount + fees)} | المتاح: ${fmt(fromBal)} ج.م` }); return; } }
    dispatch({ type: 'SET_IS_PROCESSING', payload: true });
    processingTimeoutRef.current = setTimeout(() => {
      saveHistory();
      const fromLbl = PAYMENT_METHODS.find(p => p.id === quickTransferData.from)?.label || quickTransferData.from;
      const toLbl = PAYMENT_METHODS.find(p => p.id === quickTransferData.to)?.label || quickTransferData.to;
      const date = getLocalISODate(d);
      const fromTx = { id: 'qt-w-' + getSafeId(), type: 'expense', kind: KIND.FINANCIAL, category: 'تحويلات', amount: amount + fees, description: fees > 0 ? `تحويل إلى ${toLbl} + رسوم ${fmt(fees)}` : `تحويل إلى ${toLbl}`, method: quickTransferData.from, date, month: txMonth, year: txYear, monthIndex: d.getMonth(), subType: 'withdrawal', status: 'paid' };
      const toTx = { id: 'qt-d-' + getSafeId(), type: 'income', kind: KIND.FINANCIAL, category: 'تحويلات واردة', amount, description: `تحويل من ${fromLbl}`, method: quickTransferData.to, date, month: txMonth, year: txYear, monthIndex: d.getMonth(), subType: 'deposit', status: 'paid' };
      const txs = [fromTx, toTx];
      if (fees > 0) txs.push({ id: 'qt-f-' + getSafeId(), type: 'expense', kind: KIND.FINANCIAL, category: 'رسوم تحويلات', amount: fees, description: `رسوم تحويل ${fromLbl} → ${toLbl}`, method: quickTransferData.from, date, month: txMonth, year: txYear, monthIndex: d.getMonth(), subType: 'withdrawal', status: 'paid', isTransferFee: true });
      dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [...txs, ...transactions].sort((a, b) => new Date(b.date) - new Date(a.date)) });
      dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false });
      dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: 'cash', to: 'fawry', amount: '', fees: '' } });
      addNotification({ type: 'success', title: 'تم التحويل', message: `${fmt(amount)} ج.م${fees > 0 ? ` + رسوم ${fmt(fees)} ج.م` : ''}` });
      dispatch({ type: 'SET_IS_PROCESSING', payload: false });
      processingTimeoutRef.current = null;
    }, 600);
  }, [quickTransferData, data, transactions, saveHistory, addNotification, isProcessing]);

  const handleManualReconciliation = useCallback((walletKey, actualAmount) => {
    const calc = computeBalance(data, walletKey);
    const diff = safeNumber(actualAmount) - calc;
    if (!actualAmount || Math.abs(diff) < 0.005) { addNotification({ type: 'info', title: 'مطابقة ✅', message: 'الرصيد مطابق' }); return; }
    const d = new Date(); const txYear = d.getFullYear(), txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { addNotification({ type: 'error', title: 'محظور', message: 'شهر اليوم مغلق' }); return; }
    dispatch({ type: 'SHOW_CONFIRM', danger: false, title: 'تأكيد التسوية', message: `الحساب: ${DEFAULT_ACCOUNTS[walletKey]?.label}\nالمحسوب: ${fmt(calc)}\nالفعلي: ${fmt(safeNumber(actualAmount))}\n\nسيتم إنشاء قيد ${diff > 0 ? 'إيداع' : 'خصم'} ${fmt(Math.abs(diff))} ج.م`, onConfirm: () => { saveHistory(); const tx = { id: 'adj-' + getSafeId(), type: diff > 0 ? 'income' : 'expense', kind: KIND.ADJUSTMENT, category: 'أخرى', amount: Math.abs(diff), description: 'تسوية رصيد يدوية', method: walletKey, date: getLocalISODate(d), month: txMonth, year: txYear, monthIndex: d.getMonth(), subType: diff > 0 ? 'deposit' : 'withdrawal', status: 'paid' }; dispatch({ type: 'UPDATE_TRANSACTIONS', payload: [tx, ...transactions].sort((a, b) => new Date(b.date) - new Date(a.date)) }); addNotification({ type: 'success', title: '✅ تمت التسوية' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  }, [data, transactions, saveHistory, addNotification]);

  const handleUpdateLoan = useCallback((e) => { e.preventDefault(); saveHistory(); dispatch({ type: 'UPDATE_LOANS', payload: loans.map(l => l.id === editingLoan.id ? { ...editingLoan, totalAmount: safeNumber(editingLoan.totalAmount), prePaidAmount: safeNumber(editingLoan.prePaidAmount), monthlyInstallment: safeNumber(editingLoan.monthlyInstallment), dueDay: safeNumber(editingLoan.dueDay, 1) } : l) }); dispatch({ type: 'SET_EDITING_LOAN', payload: null }); addNotification({ type: 'success', title: 'تم التحديث' }); }, [loans, editingLoan, saveHistory, addNotification]);
  const handleUpdateCard = useCallback((e) => { e.preventDefault(); saveHistory(); dispatch({ type: 'UPDATE_CARDS', payload: cards.map(c => c.id === editingCard.id ? { ...editingCard, limit: safeNumber(editingCard.limit), availableBalance: Math.max(0, safeNumber(editingCard.limit) - safeNumber(editingCard.openingDebt)), openingDebt: safeNumber(editingCard.openingDebt) } : c) }); dispatch({ type: 'SET_EDITING_CARD', payload: null }); addNotification({ type: 'success', title: 'تم التحديث' }); }, [cards, editingCard, saveHistory, addNotification]);
  const handleSaveBudget = useCallback(() => { saveHistory(); const nb = { ...budgets, [editingBudgetCategory]: parseNumberInput(budgetAmount) }; dispatch({ type: 'SET_BUDGETS', payload: nb }); dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null }); dispatch({ type: 'SET_BUDGET_AMOUNT', payload: '' }); addNotification({ type: 'success', title: 'تم الحفظ' }); }, [budgets, editingBudgetCategory, budgetAmount, saveHistory, addNotification]);

  const handleSaveRecurring = useCallback((e) => { e.preventDefault(); saveHistory(); const ni = { ...recurringFormData, id: 'r' + Date.now(), amount: parseNumberInput(recurringFormData.amount), day: safeNumber(recurringFormData.day, 1) }; dispatch({ type: 'UPDATE_RECURRING_ITEMS', payload: [...recurringItems, ni] }); dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false }); addNotification({ type: 'success', title: '✅ تمت الإضافة', message: 'سيظهر كمعاملة معلقة في الشهر الحالي' }); }, [recurringFormData, recurringItems, saveHistory, addNotification]);

  const deleteRecurring = useCallback((id) => {
    const target = recurringItems.find(i => i.id === id);
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'حذف الالتزام المتكرر', message: `سيتم حذف "${target?.title || 'البند'}" من القوالب.`, onConfirm: () => { saveHistory(); const newRecurring = recurringItems.filter(i => i.id !== id); const newTx = (data.transactions || []).filter(t => !(t.sourceRecurringId === id && t.status !== 'paid')); const newMat = {}; Object.entries(data.materializedRecurring || {}).forEach(([k, ids]) => { newMat[k] = (ids || []).filter(x => x !== id); }); dispatch({ type: 'SET_DATA', payload: { ...data, recurringItems: newRecurring, transactions: newTx, materializedRecurring: newMat } }); addNotification({ type: 'success', title: '✅ تم الحذف' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  }, [recurringItems, data, saveHistory, addNotification]);

  const handleExportCSV = useCallback(() => {
    const header = "التاريخ,النوع,الفئة,الفئة الفرعية,الوصف,المبلغ,الطريقة,الحالة,الشهر,السنة,المُسجِّل\n";

    const a = document.createElement('a'); a.href = url; a.download = `transactions_${getLocalISODate()}.csv`; a.click();

    addNotification({ type: 'success', title: 'تم التصدير' });
  }, [transactions, addNotification]);

      const hanySum = m.filter(t => t.category === 'مسحوبات محل هاني' && t.status === 'paid').reduce((s, t) => s + safeNumber(t.amount), 0);
      const familyByPerson = {};

      text += `💳 إجمالي المديونية: ${fmt(totalDebt)} ج.م\n`;
      if (totalReceivable > 0) text += `➕ مستحقات لك: ${fmt(totalReceivable)} ج.م\n`;
      if (feesSum > 0) text += `💸 رسوم التحويلات: ${fmt(feesSum)} ج.م\n`;
      if (hanySum > 0) text += `🛒 مسحوبات محل هاني: ${fmt(hanySum)} ج.م\n`;
      const familyEntries = Object.entries(familyByPerson);
      if (familyEntries.length > 0) {
        text += `\n👨‍👩‍👧‍👦 تفاصيل العيلة:\n`;
        familyEntries.forEach(([name, amt]) => { text += `   • ${name}: ${fmt(amt)} ج.م\n`; });
      }
      dispatch({ type: 'SET_AI_RESPONSE', payload: text });
      dispatch({ type: 'SET_AI_LOADING', payload: false });
    }, 800);
  }, [transactions, selectedYear, selectedMonth, updatedLoans, cards]);

  useEffect(() => { localStorage.setItem('budgets', JSON.stringify(budgets)); }, [budgets]);

  useEffect(() => () => { if (processingTimeoutRef.current) clearTimeout(processingTimeoutRef.current); }, []);

  if (authLoading) return <div className="flex h-screen items-center justify-center bg-slate-900"><div className="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div></div>;
  if (!isAuthenticated) return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
  if (!pinVerified) return <PinLockScreen onSuccess={() => { sessionStorage.setItem('pin_verified', 'yes'); setPinVerified(true); }} onLogout={() => { firebase.auth().signOut(); setIsAuthenticated(false); sessionStorage.removeItem('pin_verified'); setPinVerified(false); }} />;

  const renderActiveView = () => {
    switch (activeTab) {
      case 'dashboard': return <DashboardView data={data} financeSnapshot={financeSnapshot} liveBalances={liveBalances} totalLiquidity={totalLiquidity} walletVisibility={walletVisibility} onToggleVisibility={(k) => dispatch({ type: 'TOGGLE_WALLET_VISIBILITY', payload: k })} dispatch={dispatch} selectedYear={selectedYear} selectedMonth={selectedMonth} transactions={transactions} cards={cards} updatedLoans={updatedLoans} chartData={chartData} isDarkMode={isDarkMode} handleManualReconciliation={handleManualReconciliation} addNotification={addNotification} onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} />;
      case 'transactions': return <TransactionsView groupedTransactions={groupedTransactions} transactions={transactions} selectedMonth={selectedMonth} selectedYear={selectedYear} transViewMode={transViewMode} statusFilter={statusFilter} searchTerm={searchTerm} expandedGroup={expandedGroup} data={data} monthInsights={monthInsights} dispatch={dispatch} handleDelete={handleDelete} printReport={printReport} exportPdf={exportPdf} addNotification={addNotification} onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} saveHistory={saveHistory} onPrintMonthlyReport={printMonthlyReportPdf} />;
      case 'categories': return <CategoriesView transactions={transactions} selectedMonth={selectedMonth} selectedYear={selectedYear} catViewType={catViewType} activeCategoryDetail={activeCategoryDetail} budgets={budgets} dispatch={dispatch} handleDelete={handleDelete} printReport={printReport} exportPdf={exportPdf} onSelectYear={(y) => dispatch({ type: 'SET_SELECTED_YEAR', payload: y })} onSelectMonth={(m) => dispatch({ type: 'SET_SELECTED_MONTH', payload: m })} />;
      case 'loans': return <LoansView updatedLoans={updatedLoans} cards={cards} recurringItems={recurringItems} transactions={transactions} dispatch={dispatch} deleteRecurring={deleteRecurring} saveHistory={saveHistory} getLocalISODate={getLocalISODate} addNotification={addNotification} />;
      case 'cards': return <WalletsAndCardsView cards={cards} buildLedger={buildLedger} expandedLedgers={expandedLedgers} expandedCardsSection={expandedCardsSection} selectedMonth={selectedMonth} selectedYear={selectedYear} dispatch={dispatch} handleDelete={handleDelete} handleAddWalletDeposit={handleAddWalletDeposit} handleAddWalletWithdrawal={handleAddWalletWithdrawal} exportWalletCSV={exportWalletCSV} walletVisibility={walletVisibility} liveBalances={liveBalances} cardHistoryMap={cardHistoryMap} saveHistory={saveHistory} addNotification={addNotification} />;
      case 'planning': return <MonthlyPlanningView data={data} monthlyPlans={monthlyPlans} cards={cards} loans={updatedLoans} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />;
      case 'planner': return <PlannerView updatedLoans={updatedLoans} cards={cards} selectedMonth={selectedMonth} selectedYear={selectedYear} monthlyPlans={monthlyPlans} totalLiquidityNow={totalLiquidity} />;

      case 'calendar': return <CalendarView data={data} getAgendaItems={getAgendaItems} transactions={transactions} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} />;

      case 'settings': return <SettingsView data={data} accountsData={accountsData} cards={cards} budgets={budgets} dispatch={dispatch} saveHistory={saveHistory} addNotification={addNotification} walletVisibility={walletVisibility} onToggleVisibility={(k) => dispatch({ type: 'TOGGLE_WALLET_VISIBILITY', payload: k })} />;

      {isProcessing && (<div className="processing-overlay"><div className="processing-spinner mb-4"></div><h3 className="text-xl font-bold mb-2">جاري تطبيق العملية</h3><button onClick={cancelProcessing} className="mt-4 px-6 py-2 bg-red-500 text-white rounded-xl font-bold active:scale-95">إلغاء</button></div>)}
      {viewingCardStatement && (() => {

        const cardMethod = card.name === 'SWYPE' ? 'cib_swype' : (card.bank === 'CIB' ? 'cib_card' : 'aaib_card');
        const cardTx = transactions.filter(t => t.method === cardMethod && t.month === selectedMonth && (t.year || 2026) === selectedYear).sort((a, b) => new Date(b.date) - new Date(a.date));
        return (<div className="modal-backdrop z-[3500] no-print"><div className="bg-white dark:bg-slate-900 w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden flex flex-col" style={{ maxHeight: 'calc(100dvh - 24px)' }}>
          <div className="p-6 border-b bg-slate-50/50 dark:bg-slate-800/30"><div className="flex justify-between items-start flex-wrap gap-3"><div className="flex items-center gap-3"><BankLogo type={`${card.bank.toLowerCase()}_card`} size={40} /><div><h3 className="text-2xl font-black">{card.bank} - {card.name}</h3><p className="text-sm text-slate-500 font-bold mt-1">{selectedMonth} {selectedYear}</p></div></div><div className="flex gap-2"><button type="button" onClick={() => exportPdf(`كشف ${card.bank} - ${selectedMonth} ${selectedYear}`, cardTx)} className="gradient-bg-danger text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2"><FileText size={18} /> PDF</button><button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_VIEWING_CARD_STATEMENT', payload: null })} className="p-2 hover:bg-red-50 hover:text-red-500 text-slate-500 rounded-xl"><X size={24} /></button></div></div><div className="grid grid-cols-2 gap-4 mt-4"><div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border-r-4 border-amber-500"><p className="text-[11px] font-bold text-slate-500 uppercase">دين بداية الشهر</p><p className="text-lg font-black">{fmt(monthData?.openingDebt || 0)} ج.م</p></div><div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border-r-4 border-blue-500"><p className="text-[11px] font-bold text-slate-500 uppercase">دين نهاية الشهر</p><p className="text-lg font-black text-blue-600">{fmt(monthData?.closingDebt || 0)} ج.م</p></div></div></div>
          <div className="flex-1 overflow-y-auto p-6 scroll-hide" style={{ minHeight: 0 }}><table className="w-full text-right"><thead className="bg-slate-50 dark:bg-slate-800 sticky top-0"><tr><th className="p-4 border-b text-xs">التاريخ</th><th className="p-4 border-b text-xs">الوصف</th><th className="p-4 border-b text-xs">الفئة</th><th className="p-4 border-b text-xs text-left">المبلغ</th></tr></thead><tbody className="divide-y text-sm font-bold">{cardTx.map(t => (<tr key={t.id} className="hover:bg-blue-50/50"><td className="p-4 text-slate-500">{t.date}</td><td className="p-4">{t.description || '-'} <FamilyBadge tx={t} /></td><td className="p-4"><span className="bg-white dark:bg-slate-800 px-2 py-1 rounded text-xs border">{t.category}</span></td><td className="p-4 text-left font-black">{fmt(t.amount)}</td></tr>))}{cardTx.length === 0 && <tr><td colSpan="4" className="p-12 text-center text-slate-500">لا توجد عمليات</td></tr>}</tbody></table></div></div></div>);

            <div className="pt-3 pb-2 flex justify-center"><div className="w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full"></div></div>
            <div className="px-6 py-3 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center">
              <h3 className="font-black text-lg">القائمة الكاملة</h3>
              <button onClick={() => setIsDrawerOpen(false)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl"><X size={20} /></button>
            </div>
            <div className="px-4 py-4 space-y-6">

        <input type="text" inputMode="decimal" className="input-field text-xl font-black text-blue-600 mb-4" value={budgetAmount} onChange={e => dispatch({ type: 'SET_BUDGET_AMOUNT', payload: e.target.value })} />
        <div className="flex gap-4"><button type="button" onClick={handleSaveBudget} className="flex-1 gradient-bg-primary text-white py-3 rounded-2xl font-bold">حفظ</button><button type="button" onClick={() => dispatch({ type: 'SET_EDITING_BUDGET_CATEGORY', payload: null })} className="flex-1 bg-slate-100 py-3 rounded-2xl font-bold">إلغاء</button></div></div></div>)}
      {isQuickTransferModalOpen && (<div className="modal-backdrop no-print"><div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-blue-500/50"><div className="p-6 border-b flex justify-between items-center"><h3 className="text-xl font-black flex items-center gap-2"><ArrowRight size={20} className="text-blue-600" /> تحويل سريع</h3><button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_QUICK_TRANSFER_MODAL_OPEN', payload: false })}><X size={24} /></button></div>
        <form onSubmit={handleQuickTransfer} className="p-6 space-y-5">
          <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl"><div className="flex justify-between text-sm font-bold text-blue-700 mb-2"><span>من</span><span>إلى</span></div>
            <div className="flex justify-between items-center gap-4"><select className="input-field text-sm" value={quickTransferData.from} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { from: e.target.value } })}>{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select><div className="text-blue-300"><ArrowRight size={20} /></div><select className="input-field text-sm" value={quickTransferData.to} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { to: e.target.value } })}>{PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}</select></div>
            {ACCOUNT_METHOD_IDS.includes(quickTransferData.from) && <p className="text-[11px] text-blue-500 font-bold mt-2">المتاح: {fmt(computeBalance(data, quickTransferData.from))} ج.م</p>}</div>
          <div className="grid grid-cols-2 gap-3"><div><label className="block text-xs font-bold text-slate-500 mb-2">💰 المبلغ المُحوَّل</label><input type="text" inputMode="decimal" required className="input-field text-lg font-black text-blue-600" value={quickTransferData.amount} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { amount: e.target.value } })} placeholder="0" /></div><div><label className="block text-xs font-bold text-slate-500 mb-2">🏷️ رسوم التحويل (اختياري)</label><input type="text" inputMode="decimal" className="input-field text-lg font-black text-amber-600" value={quickTransferData.fees || ''} onChange={e => dispatch({ type: 'SET_QUICK_TRANSFER_DATA', payload: { fees: e.target.value } })} placeholder="0" /></div></div>
          {parseNumberInput(quickTransferData.fees) > 0 && (<div className="bg-amber-50 dark:bg-amber-900/20 p-3 rounded-xl text-xs font-bold text-amber-700 dark:text-amber-300">💡 سيتم إنشاء 3 قيود: خصم {fmt(parseNumberInput(quickTransferData.amount) + parseNumberInput(quickTransferData.fees))} من المصدر + إضافة {fmt(parseNumberInput(quickTransferData.amount))} للمستقبل + قيد رسوم {fmt(parseNumberInput(quickTransferData.fees))} بفئة "رسوم تحويلات"</div>)}
          <button type="submit" className="w-full gradient-bg-primary text-white py-4 rounded-2xl font-bold">تنفيذ التحويل</button></form></div></div>)}
      {isRecurringModalOpen && (<div className="modal-backdrop no-print"><div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl border border-blue-500/50"><div className="p-6 border-b flex justify-between items-center"><h3 className="text-xl font-black flex items-center gap-2"><Repeat size={20} className="text-blue-600" /> إضافة التزام متكرر</h3><button type="button" aria-label="إغلاق" onClick={() => dispatch({ type: 'SET_RECURRING_MODAL_OPEN', payload: false })}><X size={24} /></button></div>
        <form onSubmit={handleSaveRecurring} className="p-6 space-y-4">
          <div><label className="text-xs font-bold text-slate-500 block mb-2">العنوان</label><input type="text" required className="input-field" value={recurringFormData.title} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, title: e.target.value } })} /></div>
          <div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-500 block mb-2">المبلغ</label><input type="text" inputMode="decimal" required className="input-field font-bold text-blue-600" value={recurringFormData.amount} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, amount: e.target.value } })} /></div><div><label className="text-xs font-bold text-slate-500 block mb-2">اليوم</label><input type="number" required min="1" max="31" className="input-field text-center" value={recurringFormData.day} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, day: e.target.value } })} /></div></div>
          <div><label className="text-xs font-bold text-slate-500 block mb-2">النوع</label><select className="input-field" value={recurringFormData.type} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, type: e.target.value } })}><option value="expense">💸 مصروف</option><option value="income">💰 دخل</option></select></div>
          <div><label className="text-xs font-bold text-slate-500 block mb-2">الفئة</label><select className="input-field" value={recurringFormData.category} onChange={e => dispatch({ type: 'SET_RECURRING_FORM_DATA', payload: { ...recurringFormData, category: e.target.value } })}><option value="أخرى">أخرى</option><optgroup label="💰 دخل">{CATEGORIES.income.map(c => <option key={'i-'+c} value={c}>{c}</option>)}</optgroup><optgroup label="💸 مصروف">{CATEGORIES.expense.map(c => <option key={'e-'+c} value={c}>{c}</option>)}</optgroup></select></div>
          <button type="submit" className="w-full gradient-bg-primary text-white py-3 rounded-xl font-bold">إضافة</button></form></div></div>)}
    </div>
  );
}

const rootElement = document.getElementById('root');
if (rootElement) {
  setTimeout(() => { const l = document.getElementById('loading'); if (l) l.style.display = 'none'; }, 1200);
  createRoot(rootElement).render(<ErrorBoundary><App /></ErrorBoundary>);
}
</script>
</body>
</html>
