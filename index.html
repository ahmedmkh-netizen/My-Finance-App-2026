<style>
/* ═══════════════════════════════════════════════════════════════
   BANKING-GRADE DESIGN SYSTEM v84
   ═══════════════════════════════════════════════════════════════ */
:root {
  --bg-app: #F4F7FB;
  --bg-app-end: #E4EBF5;
  --bg-card: #FFFFFF;
  --bg-card-alt: #F8FAFC;
  --bg-muted: #F1F5F9;
  --bg-elevated: #FFFFFF;
  --bg-overlay: rgba(15, 27, 51, 0.55);

  --border-subtle: rgba(15, 27, 51, 0.06);
  --border-default: rgba(15, 27, 51, 0.10);
  --border-strong: rgba(15, 27, 51, 0.18);

  --text-primary: #0A1628;
  --text-secondary: #475569;
  --text-muted: #94A3B8;
  --text-inverse: #FFFFFF;
  --text-on-navy: #F8FAFC;

  --navy: #0A1628;
  --navy-2: #1E2B4A;
  --navy-3: #2A3C66;
  --navy-soft: rgba(10, 22, 40, 0.06);
  --accent: #635BFF;
  --accent-dark: #4A42E5;
  --accent-light: #8B84FF;
  --accent-soft: rgba(99, 91, 255, 0.10);
  --accent-glow: rgba(99, 91, 255, 0.28);

  --success: #00A86B;
  --success-soft: rgba(0, 168, 107, 0.10);
  --danger: #DC2626;
  --danger-soft: rgba(220, 38, 38, 0.10);
  --warning: #F59E0B;
  --warning-soft: rgba(245, 158, 11, 0.10);
  --info: #0EA5E9;
  --info-soft: rgba(14, 165, 233, 0.10);

  --shadow-1: 0 1px 2px rgba(10, 22, 40, 0.04);
  --shadow-2: 0 2px 8px rgba(10, 22, 40, 0.06), 0 1px 2px rgba(10, 22, 40, 0.04);
  --shadow-3: 0 8px 24px rgba(10, 22, 40, 0.08), 0 2px 6px rgba(10, 22, 40, 0.04);
  --shadow-4: 0 20px 48px rgba(10, 22, 40, 0.12), 0 8px 16px rgba(10, 22, 40, 0.06);
  --shadow-hero: 0 24px 48px -16px rgba(10, 22, 40, 0.32), 0 12px 24px -8px rgba(99, 91, 255, 0.24);
  --shadow-glow: 0 12px 32px -8px var(--accent-glow);

  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-2xl: 28px;
  --r-full: 999px;

  --content-top: 12px;
  --nav-h: 68px;
}

.dark {
  --bg-app: #050A14;
  --bg-app-end: #0A1628;
  --bg-card: #0D1524;
  --bg-card-alt: #101B2E;
  --bg-muted: #16213A;
  --bg-elevated: #16213A;
  --bg-overlay: rgba(0, 0, 0, 0.75);

  --border-subtle: rgba(148, 163, 184, 0.08);
  --border-default: rgba(148, 163, 184, 0.14);
  --border-strong: rgba(148, 163, 184, 0.22);

  --text-primary: #F8FAFC;
  --text-secondary: #CBD5E1;
  --text-muted: #64748B;

  --navy: #0A1628;
  --navy-2: #16213A;
  --navy-3: #1E2B4A;
  --navy-soft: rgba(148, 163, 184, 0.06);

  --accent: #8B84FF;
  --accent-dark: #635BFF;
  --accent-light: #B0AAFF;
  --accent-soft: rgba(139, 132, 255, 0.14);

  --success: #10B981;
  --success-soft: rgba(16, 185, 129, 0.14);
  --danger: #F87171;
  --danger-soft: rgba(248, 113, 113, 0.14);
  --warning: #FBBF24;
  --warning-soft: rgba(251, 191, 36, 0.14);
  --info: #38BDF8;
  --info-soft: rgba(56, 189, 248, 0.14);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Cairo', 'Inter', system-ui, -apple-system, sans-serif;
  font-weight: 500;
  color: var(--text-primary);
  background: var(--bg-app);
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  min-height: 100dvh;
  transition: background-color 0.3s ease, color 0.3s ease;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
.scroll-hide::-webkit-scrollbar { display: none; }

h1, h2, h3, h4 { font-weight: 800; letter-spacing: -0.02em; color: var(--text-primary); }

.money, .tabular {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1, 'lnum' 1;
  letter-spacing: -0.02em;
}
.money-xl { font-size: 32px; font-weight: 900; line-height: 1.1; }
.money-lg { font-size: 22px; font-weight: 900; line-height: 1.15; }
.money-md { font-size: 16px; font-weight: 800; line-height: 1.2; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

.card {
  background: var(--bg-card);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-2);
  border: 1px solid var(--border-subtle);
  padding: 18px;
  transition: box-shadow 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
  position: relative;
}
.card-hover:hover {
  box-shadow: var(--shadow-3);
  border-color: var(--border-default);
  transform: translateY(-2px);
}
.card-flat {
  background: var(--bg-card);
  border-radius: var(--r-lg);
  border: 1px solid var(--border-subtle);
  padding: 14px;
}

.hero-navy {
  background: linear-gradient(135deg, #0A1628 0%, #1E2B4A 50%, #2A3C66 100%);
  color: var(--text-on-navy);
  border-radius: var(--r-2xl);
  padding: 24px;
  box-shadow: var(--shadow-hero);
  position: relative;
  overflow: hidden;
}
.hero-navy::before {
  content: '';
  position: absolute;
  top: -50%; right: -30%;
  width: 70%; height: 200%;
  background: radial-gradient(circle, rgba(99, 91, 255, 0.35) 0%, transparent 60%);
  pointer-events: none;
}
.hero-navy::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: 
    radial-gradient(circle at 20% 20%, rgba(139, 132, 255, 0.18) 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(0, 168, 107, 0.12) 0%, transparent 40%);
  pointer-events: none;
}
.hero-navy > * { position: relative; z-index: 1; }

.stat-card {
  background: var(--bg-card);
  border-radius: var(--r-lg);
  border: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-1);
  padding: 14px;
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}
.stat-card:hover {
  box-shadow: var(--shadow-3);
  border-color: var(--border-default);
  transform: translateY(-2px);
}

.quick-action {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 14px 8px;
  border-radius: var(--r-lg);
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}
.quick-action:active { transform: scale(0.96); }
.quick-action:hover { border-color: var(--accent); background: var(--accent-soft); }
.quick-action-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: white;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  border-radius: var(--r-md);
  font-family: inherit;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.15s ease;
  border: none;
  white-space: nowrap;
  user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.btn-primary {
  background: var(--accent);
  color: white;
  box-shadow: var(--shadow-glow);
}
.btn-primary:hover:not(:disabled) { background: var(--accent-dark); }

.btn-navy {
  background: var(--navy);
  color: white;
  box-shadow: 0 8px 20px -6px rgba(10, 22, 40, 0.4);
}
.btn-navy:hover:not(:disabled) { background: var(--navy-3); }

.btn-secondary {
  background: var(--bg-muted);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--bg-card-alt);
  border-color: var(--border-strong);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid transparent;
}
.btn-ghost:hover:not(:disabled) {
  background: var(--bg-muted);
  color: var(--text-primary);
}

.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }

.input-field {
  width: 100%;
  padding: 13px 15px;
  border-radius: var(--r-md);
  border: 1.5px solid var(--border-default);
  background: var(--bg-card);
  color: var(--text-primary);
  font-family: inherit;
  font-weight: 600;
  font-size: 15px;
  outline: none;
  transition: all 0.15s ease;
}
.input-field:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.input-field.error {
  border-color: var(--danger);
  box-shadow: 0 0 0 4px var(--danger-soft);
}
.input-field::placeholder { color: var(--text-muted); font-weight: 500; }
.input-num {
  font-variant-numeric: tabular-nums;
  font-weight: 800;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: var(--r-full);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
}
.badge-neutral { background: var(--bg-muted); color: var(--text-secondary); }
.badge-success { background: var(--success-soft); color: var(--success); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-warning { background: var(--warning-soft); color: var(--warning); }
.badge-info { background: var(--info-soft); color: var(--info); }
.badge-accent { background: var(--accent-soft); color: var(--accent); }

.status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-full);
  box-shadow: var(--shadow-1);
  font-size: 11px;
  font-weight: 700;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  position: relative;
}
.status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
.status-dot.offline { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
.status-dot.syncing { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse-slow 1.6s ease-in-out infinite; }
.status-dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

.bottom-nav-container {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 1000;
  padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--bg-card) 92%, transparent);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-top: 1px solid var(--border-subtle);
  box-shadow: 0 -8px 32px rgba(10, 22, 40, 0.08);
}
.dark .bottom-nav-container {
  box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.5);
}
.nav-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 6px 8px;
  gap: 2px;
}
.nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 54px;
  border-radius: var(--r-md);
  color: var(--text-muted);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 4px;
  position: relative;
}
.nav-btn.active {
  color: var(--accent);
  background: var(--accent-soft);
}
.nav-btn.active::before {
  content: '';
  position: absolute;
  top: 4px; left: 50%; transform: translateX(-50%);
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--accent);
}
.nav-btn span {
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
}

.fab {
  position: fixed;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  left: 16px;
  z-index: 1100;
  width: 56px;
  height: 56px;
  border-radius: var(--r-lg);
  background: var(--accent);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 12px 32px -8px var(--accent-glow), 0 4px 12px -2px rgba(10, 22, 40, 0.2);
  border: none;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.fab:hover { transform: scale(1.06); }
.fab:active { transform: scale(0.94); }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: var(--bg-overlay);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2500;
  padding: 12px;
  overflow-y: auto;
  animation: fadeIn 0.22s ease-out;
}
.generic-modal {
  background: var(--bg-card);
  border-radius: var(--r-2xl);
  box-shadow: var(--shadow-4);
  border: 1px solid var(--border-subtle);
  width: 100%;
  max-height: calc(100dvh - 24px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}
.generic-modal-header {
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.generic-modal-body { padding: 20px; overflow-y: auto; }
.generic-modal-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border-subtle);
  flex-shrink: 0;
  display: flex;
  gap: 10px;
}

.processing-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-overlay);
  backdrop-filter: blur(16px);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
}
.processing-spinner {
  width: 48px; height: 48px;
  border: 3px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  border-top-color: var(--accent-light);
  animation: spin 0.8s linear infinite;
}

.toast-container {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
  max-width: 92vw;
  width: 420px;
}

/* ═══════════════ SAFE UTILITIES ═══════════════ */
const safeParseJson = (raw, fallback) => {
  if (raw === null || raw === undefined) return fallback;
  try { const v = JSON.parse(raw); return v === null || v === undefined ? fallback : v; }
  catch (e) { console.warn('safeParseJson failed:', e); return fallback; }
};

const escapeHtml = (u) => { 
  if (typeof u !== 'string') return u; 
  return u.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); 
};

let _idSeq = 0;
const getSafeId = () => {
  try { 
    if (crypto?.randomUUID) return crypto.randomUUID();
  } catch {}
  return `${Date.now()}-${(++_idSeq).toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
};

const normalizeText = (t) => !t ? "" : t.toString()
  .replace(/[أإآ]/g,'ا')
  .replace(/ى/g,'ي')
  .replace(/ة/g,'ه')
  .replace(/[\u064B-\u065F]/g,'')
  .replace(/\s+/g,' ')
  .trim().toLowerCase();

const toEnglishDigits = (s) => { 
  if (s === null || s === undefined) return s; 
  const map = { 
    '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
    '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9' 
  }; 
  return String(s).replace(/[٠-٩۰-۹]/g, d => map[d]); 
};

const parseNumberInput = (v) => { 
  const cleaned = toEnglishDigits(v).replace(/[^\d.\-]/g, ''); 
  const n = Number(cleaned); 
  return isNaN(n) ? 0 : n; 
};

const formatCurrency = (v, { showSign = false, decimals = 2 } = {}) => {
  const n = safeNumber(v);
  const abs = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  if (!showSign) return abs;
  return n >= 0 ? `+${abs}` : `−${abs}`;
};

/* ═══════════════ DATE HELPERS ═══════════════ */
const getLocalISODate = (d = new Date()) => 
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const dayStart = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const endOfToday = () => { const x = new Date(); x.setHours(23,59,59,999); return x; };

const calculateDaysLeft = (d) => { 
  if (!d) return null; 
  try { 
    const t = new Date(); t.setHours(0,0,0,0); 
    const g = new Date(d); g.setHours(0,0,0,0); 
    return Math.ceil((g-t)/86400000); 
  } catch { return null; } 
};

const parseISODate = (iso) => {
  if (!iso) return null;
  if (iso instanceof Date) return isNaN(iso) ? null : iso;
  const s = String(iso);
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if (m) {
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d) ? null : d;
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
};

/* ═══════════════ MONTH KEY HELPERS ═══════════════ */
const makeMonthKey = (year, month) => `${year}-${month}`;
const parseMonthKey = (key) => { 
  if (!key || typeof key !== 'string' || !key.includes('-')) return null; 
  const [y, ...rest] = key.split('-'); 
  const year = Number(y); 
  if (isNaN(year)) return null; 
  return { year, month: rest.join('-') }; 
};

const inputMonthToKey = (v) => { 
  if (!v || !/^\d{4}-\d{2}$/.test(String(v))) return null; 
  const [y, m] = String(v).split('-').map(Number); 
  if (m < 1 || m > 12 || isNaN(y)) return null; 
  return `${y}-${ALL_MONTHS_EARLY[m - 1]}`; 
};

const keyToInputMonth = (k) => { 
  if (!k || typeof k !== 'string') return ''; 
  const idx = k.indexOf('-'); 
  if (idx < 0) return ''; 
  const y = k.slice(0, idx); 
  const mName = k.slice(idx + 1); 
  const mIdx = ALL_MONTHS_EARLY.indexOf(mName); 
  if (mIdx < 0 || !/^\d{4}$/.test(y)) return ''; 
  return `${y}-${String(mIdx + 1).padStart(2, '0')}`; 
};

const parseBankSms = (rawInput) => {
  const result = { 
    ok: false, bank: '', bankId: null, last4: null, amount: 0, type: 'expense', 
    subType: 'withdrawal', date: getLocalISODate(), method: null, linkedCardId: null, 
    accountKind: null, cardLabel: '', description: '', balance: null, 
    rawText: String(rawInput || ''), notes: [] 
  };
  
  if (!rawInput || typeof rawInput !== 'string' || rawInput.trim().length < 5) { 
    result.notes.push('النص قصير جداً'); return result; 
  }
  
  const text = toEnglishDigits(rawInput).replace(/\u00A0/g, ' ');

  if (/\b(OTP|one[\s-]?time|verification\s+code|رمز\s+(التحقق|التأكيد)|do\s+not\s+share)\b/i.test(text)) {
    result.notes.push('❌ هذه رسالة تحقق (OTP) — لا يمكن تسجيلها كمعاملة');
    return result;
  }

  if (/\bCIB\b|Commercial International|SWYPE|Titanium|سي آي بي/i.test(text)) { result.bank = 'CIB'; result.bankId = 'cib'; }
  else if (/\bAAIB\b|Arab African|العربي الأفريقي|العربي الافريقي|الإفريقي الدولي/i.test(text)) { result.bank = 'AAIB'; result.bankId = 'aaib'; }
  
  const last4Patterns = [
    /\b(?:ending|ends)\s*(?:with\s*)?(\d{4})\b/i,
    /\bcard\s*(?:no\.?|number|#)?\s*[:\-]?\s*(?:\*{2,}|\.{2,}|x{2,})?\s*(\d{4})\b/i,
    /(?:\*{2,}|\.{2,}|x{2,})\s*(\d{4})\b/i,
    /رقم\s*(?:\*{2,}|\.{2,})?\s*(\d{4})\b/,
    /بطاق[ةه]\s*(?:رقم\s*)?(?:\*{2,}|\.{2,})?\s*(\d{4})\b/,
    /(?:acct|account|حساب)\s*(?:no\.?|number|#)?\s*[:\-]?\s*(?:\*{2,}|\.{2,}|x{2,})?\s*(\d{4})\b/i
  ];
  for (const p of last4Patterns) { 
    const m = text.match(p); 
    if (m) { result.last4 = m[1]; break; } 
  }
  
  const incomeHints = [
    /\bcredit(?:ed)?\b/i, /\bdeposit(?:ed)?\b/i, /\breceived\b/i, /\bsalary\b/i, 
    /\brefund\b/i, /\breimbursement\b/i, /\bcashback\b/i, /\badded\b/i, 
    /إيداع/, /تم إيداع/, /أضيف/, /تم إضافة/, /راتب/, /استرداد/, /كاش باك/, /وارد/, /دائن/
  ];
  const expenseHints = [
    /\bdebit(?:ed)?\b/i, /\bpurchase\b/i, /\bwithdraw(?:al|n)?\b/i, /\bpaid\b/i, 
    /\bpayment\b/i, /\bcharge[d]?\b/i, /\bspent\b/i, /\batm\b/i, 
    /خصم/, /تم خصم/, /سحب/, /شراء/, /دفع/, /مدفوع/, /صادر/, /استخدام/, /مدين/
  ];
  
  const isIncome = incomeHints.some(r => r.test(text));
  const isExpense = expenseHints.some(r => r.test(text));
  
  if (isIncome && !isExpense) { result.type = 'income'; result.subType = 'deposit'; }
  else if (isExpense && !isIncome) { result.type = 'expense'; result.subType = 'withdrawal'; }
  else if (isIncome && isExpense) { result.notes.push('نوع العملية غير واضح — تم افتراض مصروف'); }
  else { result.notes.push('لم يتم التعرف على نوع العملية'); }

  const cur = '(?:EGP|LE|E£|ج\\.?م|جنيه|جم|ق\\.?م|ريال|SAR|USD|AED|درهم|دينار|\\$)';
  const amtPatterns = [
    new RegExp(`${cur}\\s*([0-9][0-9,]*\\.?[0-9]*)`, 'i'),
    new RegExp(`([0-9][0-9,]*\\.?[0-9]*)\\s*${cur}`, 'i'),
    /(?:amount|for|of|بقيمة|بمبلغ|مبلغ)\s*[:\s]*([0-9][0-9,]*\.?[0-9]*)/i
  ];
  
  for (const p of amtPatterns) {
    const m = text.match(p);
    if (m) {
      const n = Number(m[1].replace(/,/g, ''));
      if (n >= 1 && n < 100000000) { result.amount = n; break; }
    }
  }
  
  if (!result.amount) {
    const decimalMatches = text.match(/\b\d{1,8}\.\d{2}\b/g) || [];
    const decNums = decimalMatches.map(s => Number(s)).filter(n => n >= 1 && n < 100000000);
    if (decNums.length === 1) { result.amount = decNums[0]; result.notes.push('تم استخراج المبلغ من الصيغة العشرية — راجعه'); }
    else if (decNums.length > 1) {
      result.amount = Math.max(...decNums);
      result.notes.push(`تم اختيار أكبر مبلغ عشري (${decNums.length} مرشح) — راجعه`);
    } else {
      const all = text.match(/[0-9][0-9,]*\.?[0-9]*/g) || [];
      const nums = all.map(s => Number(s.replace(/,/g, ''))).filter(n => n >= 10 && n < 1000000 && String(n).length < 10);
      if (nums.length === 1) { result.amount = nums[0]; result.notes.push('تم استخراج المبلغ — راجعه'); }
      else if (nums.length > 1) { result.notes.push(`⚠️ ${nums.length} أرقام محتملة — اختر المبلغ يدوياً`); }
    }
  }
  
  const balMatch = text.match(/(?:balance|الرصيد|رصيد)[^\d]{0,20}([0-9][0-9,]*\.?[0-9]*)/i);
  if (balMatch) { 
    const b = Number(balMatch[1].replace(/,/g, '')); 
    if (b > 0 && b !== result.amount) result.balance = b; 
  }

  const now = new Date();
  let parsedDate = null;
  const MONTHS_EN = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
  const MONTHS_AR = { 
    'يناير':1,'فبراير':2,'مارس':3,'أبريل':4,'ابريل':4,'مايو':5,'يونيو':6,'يوليو':7,
    'أغسطس':8,'اغسطس':8,'سبتمبر':9,'أكتوبر':10,'اكتوبر':10,'نوفمبر':11,'ديسمبر':12 
  };
  
  let m = text.match(/\b(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})\b/);
  if (m) { 
    const d = +m[1], mo = +m[2]; 
    let y = +m[3]; 
    if (y < 100) y += 2000; 
    if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12 && y >= 2020 && y <= 2100) 
      parsedDate = new Date(y, mo - 1, d); 
  }
  
  if (!parsedDate) { 
    m = text.match(/\b(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})\b/); 
    if (m) { 
      const y = +m[1], mo = +m[2], d = +m[3]; 
      if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12 && y >= 2020 && y <= 2100) 
        parsedDate = new Date(y, mo - 1, d); 
    } 
  }
  
  if (!parsedDate) { 
    m = text.match(/\b(\d{1,2})[\s\-]*([A-Za-z]{3,9})[\s\-]*(\d{2,4})\b/); 
    if (m) { 
      const mo = MONTHS_EN[m[2].toLowerCase().slice(0, 3)]; 
      if (mo) { 
        let y = +m[3]; 
        if (y < 100) y += 2000; 
        parsedDate = new Date(y, mo - 1, +m[1]); 
      } 
    } 
  }
  
  if (!parsedDate) { 
    const arNames = Object.keys(MONTHS_AR).join('|'); 
    const re = new RegExp(`(\\d{1,2})\\s*(${arNames})\\s*(\\d{2,4})`); 
    m = text.match(re); 
    if (m) { 
      const mo = MONTHS_AR[m[2]]; 
      let y = +m[3]; 
      if (y < 100) y += 2000; 
      parsedDate = new Date(y, mo - 1, +m[1]); 
    } 
  }
  
  if (parsedDate && !isNaN(parsedDate) && parsedDate <= now) result.date = getLocalISODate(parsedDate);
  else { 
    result.date = getLocalISODate(now); 
    if (parsedDate && !isNaN(parsedDate) && parsedDate > now) 
      result.notes.push('التاريخ في المستقبل — تم استخدام اليوم'); 
  }

  const merchantPatterns = [
    /\bat\s+([A-Z][A-Z0-9\s&'\.\-]{2,40}?)(?:\s+on\s|\s+at\s|\s*[\.\,\n]|$)/i,
    /\b(?:merchant|from|to)\s*[:\-]?\s*([A-Z][A-Z0-9\s&'\.\-]{2,40}?)(?:\s+on\s|\s*[\.\,\n]|$)/i,
    /لدى\s+([^\.,\n]{2,40}?)(?:\s+يوم|\s+بتاريخ|\s*[\.\,\n]|$)/,
    /في\s+([^\.,\n]{2,40}?)(?:\s+يوم|\s+بتاريخ|\s*[\.\,\n]|$)/
  ];
  
  for (const p of merchantPatterns) { 
    const mm = text.match(p); 
    if (mm && mm[1]) { 
      const desc = mm[1].trim().replace(/\s+/g, ' '); 
      if (desc.length >= 2 && !/^\d+$/.test(desc)) { result.description = desc; break; } 
    } 
  }
  
  if (!result.description) { 
    const caps = text.match(/\b[A-Z][A-Z0-9&'\.\-]{2,}(?:\s+[A-Z][A-Z0-9&'\.\-]{2,}){0,4}\b/g) || []; 
    const filtered = caps.filter(w => !/^(CIB|AAIB|EGP|LE|ATM|SMS|OTP|REF|SWYPE|TITANIUM|SIGNATURE|MASTERCARD|VISA|USD|SAR|AED|THE|AND|FOR|OF|ON|AT|YOUR|CARD|WAS|USED)$/i.test(w)); 
    if (filtered.length) result.description = filtered[0].trim(); 
  }
  
  if (result.last4 && CARD_LAST4_MAP[result.last4]) {
    const mapping = CARD_LAST4_MAP[result.last4];
    result.method = mapping.method;
    result.linkedCardId = mapping.linkedCardId;
    result.bank = mapping.bank;
    result.accountKind = mapping.kind;
    result.cardLabel = mapping.label || '';
    if (mapping.kind === 'account') result.notes.push(`✅ تم التعرف: ${mapping.label} (حساب بنكي)`);
    else if (mapping.kind === 'subcard') result.notes.push(`✅ بطاقة فرعية (${result.last4}) تابعة لبطاقة Titanium`);
    else if (mapping.kind === 'card') result.notes.push(`✅ تم التعرف: ${mapping.label}`);
  }
  else if (result.bankId === 'cib') { result.method = 'cib_card'; result.linkedCardId = 1; result.notes.push('⚠️ لم يتم التعرف على البطاقة — تم افتراض Titanium'); }
  else if (result.bankId === 'aaib') { result.method = 'aaib_card'; result.linkedCardId = 2; result.notes.push('⚠️ لم يتم التعرف على البطاقة — تم افتراض Signature'); }
  
  if (/\bTelda\b|تيلدا/i.test(text)) {
    const personMatch = text.match(/(?:to|لـ|إلى)\s*(Shaimaa|Salma|Abdelrahman|شيماء|سلمى|عبد الرحمن)/i);
    if (personMatch) {
      const p = personMatch[1].toLowerCase();
      if (p === 'shaimaa' || p === 'شيماء') { result.method = 'telda_shaimaa'; result.description = result.description || 'تحويل Telda - شيماء'; }
      else if (p === 'salma' || p === 'سلمى') { result.method = 'telda_salma'; result.description = result.description || 'تحويل Telda - سلمى'; }
      else if (p === 'abdelrahman' || p === 'عبد الرحمن') { result.method = 'telda_abdelrahman'; result.description = result.description || 'تحويل Telda - عبد الرحمن'; }
    }
  }
  
  result.ok = result.amount > 0;
  if (!result.ok) result.notes.push('لم يتم العثور على مبلغ صالح — أدخله يدوياً');
  if (!result.method) result.notes.push('لم يتم التعرف على البطاقة — اختر يدوياً');
  if (!result.description) result.description = result.type === 'income' ? 'دخل من SMS' : 'مصروف من SMS';
  return result;
};

/* ═══════════════ VALIDATION ═══════════════ */
const VALIDATION = { 
  AMOUNT: { min: 0.01, max: 10000000, label: 'المبلغ' }, 
  POSITIVE_INT: { min: 1, max: 31, label: 'الرقم' }, 
  TEXT: { min: 1, max: 500, label: 'النص' }, 
  LIMIT: { min: 100, max: 10000000, label: 'الحد الائتماني' }, 
  INSTALLMENT: { min: 0, max: 10000000, label: 'القسط' } 
};

const validateAmount = (raw, opts = {}) => {
  const cfg = { ...VALIDATION.AMOUNT, ...opts };
  const cleaned = toEnglishDigits(String(raw ?? '')).replace(/[^\d.\-]/g, '');
  const n = parseFloat(cleaned);
  if (isNaN(n) || !isFinite(n)) return { valid: false, error: 'اكتب رقم صحيح', value: 0 };
  if (n < cfg.min) return { valid: false, error: `الحد الأدنى ${fmt(cfg.min)} ج.م`, value: 0 };
  if (n > cfg.max) return { valid: false, error: `الحد الأقصى ${fmt(cfg.max)} ج.م`, value: 0 };
  return { valid: true, value: n };
};

const validateText = (raw, opts = {}) => { 
  const cfg = { ...VALIDATION.TEXT, ...opts }; 
  const s = String(raw || '').trim(); 
  if (s.length < cfg.min) return { valid: false, error: `${cfg.label} مطلوب` }; 
  if (s.length > cfg.max) return { valid: false, error: `${cfg.label} طويل جداً` }; 
  return { valid: true, value: s }; 
};

const validateDate = (raw) => { 
  if (!raw) return { valid: false, error: 'التاريخ مطلوب' }; 
  const d = parseISODate(raw); 
  if (!d) return { valid: false, error: 'تاريخ غير صالح' }; 
  const year = d.getFullYear(); 
  if (year < 2020 || year > 2100) return { valid: false, error: 'السنة خارج النطاق' }; 
  return { valid: true, value: d }; 
};

/* ═══════════════ PIN (PBKDF2) ═══════════════ */
const hashPin = async (pin) => {
  if (!crypto?.subtle?.importKey || !crypto?.subtle?.deriveBits) {
    throw new Error('هذا المتصفح لا يدعم التشفير الآمن. حدّث المتصفح.');
  }
  try {
    const encoder = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', encoder.encode(String(pin)), 'PBKDF2', false, ['deriveBits']
    );
    const salt = encoder.encode('fintracker_salt_v3_2026');
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial, 256
    );
    return 'pbkdf2_' + Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    console.error('hashPin failed:', e);
    throw new Error('فشل تشفير الرمز');
  }
};

const getStoredPinHash = () => localStorage.getItem(PIN_HASH_KEY);

const savePinHash = async (pin) => { 
  const hash = await hashPin(pin); 
  localStorage.setItem(PIN_HASH_KEY, hash); 
};

const verifyPin = async (pin) => { 
  const stored = getStoredPinHash(); 
  if (!stored) {
    if (pin === DEFAULT_PIN) {
      try { await savePinHash(pin); } catch(e) { console.warn('savePinHash failed', e); }
      return true;
    }
    return false;
  }
  if (!stored.startsWith('pbkdf2_')) {
    console.error('⚠️ PIN hash corrupt — reset required');
    return false;
  }
  try {
    const current = await hashPin(pin);
    return current === stored;
  } catch { return false; }
};

/* ═══════════════ BUSINESS HELPERS ═══════════════ */
const getDefaultMonthYear = () => {
  const now = new Date();
  const y = now.getFullYear();
  const m = ALL_MONTHS[now.getMonth()];
  if (YEARS_CONFIG[y] && YEARS_CONFIG[y].includes(m)) return { year: y, month: m };
  return { year: PROJECT_START_YEAR, month: PROJECT_START_MONTH };
};

const inferKind = (tx) => { 
  if (tx.kind) return tx.kind; 
  if (tx.category === 'أخرى' && (tx.description || '').includes('تسوية')) return KIND.ADJUSTMENT; 
  if (FINANCIAL_CATEGORIES.has(tx.category)) return KIND.FINANCIAL; 
  return KIND.OPERATIONAL; 
};

const isBankFee = (tx) => BANK_FEE_CATEGORIES.has(tx?.category);
const isBeneficiaryCategorySafe = (cat) => typeof cat === 'string' && cat.startsWith('مصروف شهري - ');

const isMonthClosed = (data, year, month) => { 
  const key = makeMonthKey(year, month); 
  return Array.isArray(data?.closedMonths) && data.closedMonths.includes(key); 
};

const invalidateSnapshotsFrom = (snapshots, year, month) => {
  const startIdx = getMonthIndex(month);
  if (startIdx < 0) return { snapshots: snapshots || {}, invalidated: 0 };
  const newSnaps = { ...(snapshots || {}) };
  let invalidated = 0;
  Object.keys(newSnaps).forEach(key => {
    const parsedKey = parseMonthKey(key);
    if (!parsedKey) return;
    if (parsedKey.year > year || (parsedKey.year === year && getMonthIndex(parsedKey.month) >= startIdx)) {
      delete newSnaps[key];
      invalidated++;
    }
  });
  return { snapshots: newSnaps, invalidated };
};

const getAccountCutoff = (accountsData, key) => { 
  const iso = accountsData?.[key]?.lastUpdated; 
  const d = parseISODate(iso); 
  return d || new Date(0); 
};

/* ═══════════════════════════════════════════════════════════════
   ⭐ computeAllBalances — Pass واحد لكل الحسابات (O(n))
   ═══════════════════════════════════════════════════════════════ */
const computeAllBalances = (data, asOfDate) => {
  const accountsData = data?.accountsData || DEFAULT_ACCOUNTS;
  const result = {};
  const cutoffDays = {};
  
  ACCOUNT_KEYS.forEach(k => {
    result[k] = toPiasters(accountsData[k]?.balance);
    cutoffDays[k] = dayStart(getAccountCutoff(accountsData, k)).getTime();
  });
  
  const upper = asOfDate ? new Date(asOfDate).getTime() : endOfToday().getTime();
  
  (data?.transactions || []).forEach(t => {
    if (t.status !== 'paid') return;
    if (t.source === 'carryover') return;
    const method = t.method;
    if (!ACCOUNT_KEYS.includes(method)) return;
    if (CASH_METHOD_IDS.has(method) && isHanyShopCategory(t.category)) return;
    
    const d = parseISODate(t.date);
    if (!d) return;
    const dTime = d.getTime();
    const cutoff = cutoffDays[method];
    const backward = upper < cutoff;
    
    const amount = toPiasters(t.amount);
    const signed = (t.subType === 'deposit') ? amount : -amount;
    
    if (backward) {
      if (dTime > upper && dTime < cutoff) result[method] -= signed;
    } else {
      if (dTime >= cutoff && dTime <= upper) result[method] += signed;
    }
  });
  
  ACCOUNT_KEYS.forEach(k => { result[k] = fromPiasters(result[k]); });
  return result;
};

/* حساب رصيد حساب واحد (للتوافق مع الكود القديم) */
const computeBalance = (data, key, asOfDate) => {
  const accountsData = data?.accountsData || DEFAULT_ACCOUNTS;
  const base = safeNumber(accountsData[key]?.balance);
  
  const cutoffDay = dayStart(getAccountCutoff(accountsData, key));
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();
  const backward = upper < cutoffDay;
  let bal = base;
  
  (data?.transactions || []).forEach(t => {
    if (t.status !== 'paid' || t.method !== key) return;
    if (t.source === 'carryover') return;
    if (isCashAccount(key) && isHanyShopCategory(t.category)) return;
    const d = parseISODate(t.date);
    if (!d) return;
    const amt = safeNumber(t.amount);
    const signed = (t.subType === 'deposit') ? amt : -amt;
    if (backward) { if (d > upper && d < cutoffDay) bal -= signed; }
    else { if (d >= cutoffDay && d <= upper) bal += signed; }
  });
  return bal;
};

/* ⭐ computeCardDebt — يستخدم openingDate الخاص بالبطاقة فقط */
const computeCardDebt = (data, card, asOfDate) => {
  if (!card) return 0;
  const method = getCardMethod(card);
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];
  const upper = asOfDate ? new Date(asOfDate) : endOfToday();
  
  const cutoffISO = card.openingDate || getLocalISODate();
  const cutoffDay = dayStart(parseISODate(cutoffISO) || new Date(0));
  
  let debt = safeNumber(card.openingDebt);
  (data?.transactions || []).forEach(t => {
    if (t.status !== 'paid') return;
    if (t.source === 'carryover') return;
    const d = parseISODate(t.date);
    if (!d) return;
    if (d < cutoffDay || d > upper) return;
    
    const amt = safeNumber(t.amount);
    let belongsToCard = false;
    const hasExplicitCardLink = (t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== '');
    
    if (hasExplicitCardLink) { 
      belongsToCard = (t.linkedCardId === card.id); 
    } else if (t.cardLast4 && subCards.includes(t.cardLast4)) { 
      belongsToCard = true; 
    } else { 
      belongsToCard = (t.method === method); 
    }
    
    if (!belongsToCard) return;
    if (t.type === 'expense') { debt += amt; return; }
    if (t.type === 'income') { debt -= amt; return; }
  });
  
  return debt;
};

const getClosingBalance = (data, key, year, month) => {
  const monthKey = makeMonthKey(year, month);
  const snap = data?.monthlySnapshots?.[monthKey]?.[key];
  if (snap !== undefined && snap !== null) return safeNumber(snap);
  const monthIdx = getMonthIndex(month);
  if (monthIdx < 0) return computeBalance(data, key);
  const monthEnd = new Date(year, monthIdx + 1, 0, 23, 59, 59);
  return computeBalance(data, key, monthEnd);
};

const getOpeningBalance = (data, key, year, month) => {
  const idx = getMonthIndex(month);
  if (year < PROJECT_START_YEAR) return safeNumber(data?.accountsData?.[key]?.balance);
  if (year === PROJECT_START_YEAR && idx <= getMonthIndex(PROJECT_START_MONTH)) return safeNumber(data?.accountsData?.[key]?.balance);
  if (idx <= 0) return getClosingBalance(data, key, year - 1, 'ديسمبر');
  return getClosingBalance(data, key, year, ALL_MONTHS[idx - 1]);
};

const deriveDefaultCutoff = (txs) => { 
  const dates = (txs || []).filter(t => t.status === 'paid' && t.date).map(t => t.date).sort(); 
  if (dates.length === 0) return getLocalISODate(); 
  const d = parseISODate(dates[0]); 
  if (!d) return getLocalISODate(); 
  d.setDate(d.getDate() - 1); 
  return getLocalISODate(d); 
};

/* ═══════════════ CUSTODY + CASHBACK ═══════════════ */
const computeCustodyBalance = (entries) => {
  if (!Array.isArray(entries)) return { received: 0, transferred: 0, spentCash: 0, spentCard: 0, settled: 0, balance: 0, totalSpent: 0 };
  let received = 0, transferred = 0, spentCash = 0, spentCard = 0, settled = 0;
  entries.forEach(e => {
    const amt = safeNumber(e.amount);
    switch (e.type) {
      case CUSTODY_TYPE.RECEIVE: received += amt; break;
      case CUSTODY_TYPE.TRANSFER: transferred += amt; break;
      case CUSTODY_TYPE.SPEND_CASH: spentCash += amt; break;
      case CUSTODY_TYPE.SPEND_CARD: spentCard += amt; break;
      case CUSTODY_TYPE.SETTLE: settled += amt; break;
    }
  });
  const totalSpent = spentCash + spentCard;
  const balance = received - transferred - totalSpent - settled;
  return { received, transferred, spentCash, spentCard, settled, balance, totalSpent };
};

const computeCashbackSummary = (trackers) => { 
  if (!Array.isArray(trackers)) return { expected: 0, received: 0, pending: 0, list: [] }; 
  const expected = trackers.reduce((s, t) => s + safeNumber(t.expectedAmount), 0); 
  const received = trackers.reduce((s, t) => s + safeNumber(t.receivedAmount), 0); 
  return { expected, received, pending: expected - received, list: trackers }; 
};

/* ═══════════════ MIGRATION HELPERS ═══════════════ */
const mergeById = (existing, defaults) => {
  if (!Array.isArray(existing) || existing.length === 0) return defaults;
  const merged = [...existing];
  defaults.forEach(d => {
    if (!merged.some(e => e.id === d.id || (e.systemId && d.systemId && e.systemId === d.systemId))) merged.push(d);
  });
  return merged;
};

const migrateCards = (cards) => {
  if (!Array.isArray(cards)) return DEFAULT_CARDS;
  return cards.map(c => {
    const migrated = { ...c };
    if (!Array.isArray(migrated.subCardLast4)) migrated.subCardLast4 = [];
    if (migrated.id === 2 && String(migrated.last4) === '0391') migrated.last4 = '3391';
    if (migrated.id === 1 && migrated.name === 'Titanium' && migrated.subCardLast4.length === 0) { 
      migrated.subCardLast4 = ['9380', '9352', '2014']; 
    }
    if (!migrated.openingDate) migrated.openingDate = null;
    
    if (c.openingDebt !== undefined && c.availableBalance !== undefined) { 
      return { ...migrated, cashbackRate: c.cashbackRate !== undefined ? safeNumber(c.cashbackRate) : 0 }; 
    }
    const limit = safeNumber(c.limit); 
    const oldOpening = safeNumber(c.openingBalance);
    return { ...migrated, openingDebt: Math.max(0, limit - oldOpening), availableBalance: oldOpening, cashbackRate: safeNumber(c.cashbackRate, 0) };
  });
};

const migrateSnapshotsAndClosed = (snapshots, closedMonths) => {
  let snaps = snapshots && typeof snapshots === 'object' ? { ...snapshots } : {};
  let closed = Array.isArray(closedMonths) ? [...closedMonths] : [];
  if (Object.keys(snaps).length > 0 && !Object.keys(snaps).every(k => /^\d{4}-/.test(k))) {
    const migrated = {};
    Object.entries(snaps).forEach(([month, val]) => { 
      if (/^\d{4}-/.test(month)) migrated[month] = val; 
      else migrated[makeMonthKey(2026, month)] = (typeof val === 'object' && val !== null) ? val : { cash: safeNumber(val) }; 
    });
    snaps = migrated;
  }
  if (closed.length > 0 && !closed.every(k => /^\d{4}-/.test(k))) { 
    closed = closed.map(m => /^\d{4}-/.test(m) ? m : makeMonthKey(2026, m)); 
  }
  return { snapshots: snaps, closedMonths: closed };
};

const migrateTransaction = (t) => {
  if (!t) return t;
  const kind = inferKind(t);
  let year = t.year, month = t.month, monthIndex = t.monthIndex;
  if (t.date && (!month || !year)) { 
    const d = parseISODate(t.date); 
    if (d) { if (!year) year = d.getFullYear(); if (!month) month = ALL_MONTHS[d.getMonth()]; } 
  }
  if (!year) year = 2026;
  if (monthIndex === undefined || monthIndex === null || monthIndex < 0) monthIndex = getMonthIndex(month);
  if (monthIndex < 0 && month) { 
    const norm = ALL_MONTHS.find(m => normalizeText(m) === normalizeText(month)); 
    if (norm) { month = norm; monthIndex = getMonthIndex(norm); } 
  }
  let subType = t.subType;
  if (!subType) subType = t.type === 'income' ? 'deposit' : 'withdrawal';
  return { ...t, kind, year, month, monthIndex, subType };
};

const migrateRecurringItems = (items) => {  
  if (!Array.isArray(items)) return [];
  return items.map(r => {
    const migrated = { ...r };
    if (migrated.active === undefined) migrated.active = true;
    if (migrated.startMonth && !/^\d{4}-\d{2}$/.test(migrated.startMonth)) migrated.startMonth = keyToInputMonth(migrated.startMonth) || null;
    if (migrated.endMonth && !/^\d{4}-\d{2}$/.test(migrated.endMonth)) migrated.endMonth = keyToInputMonth(migrated.endMonth) || null;
    if (migrated.startMonth === undefined) migrated.startMonth = null;
    if (migrated.endMonth === undefined) migrated.endMonth = null;
    if (r.title && r.title.includes('تكييف محمود') && !migrated.linkedLoanSystemId) migrated.linkedLoanSystemId = SYSTEM_LOAN_IDS.TAKYEEF;
    if (!migrated.transferChannel && r.category && r.category.startsWith('مصروف شهري - ')) {
      const ben = BENEFICIARIES.find(b => `مصروف شهري - ${b.label}` === r.category);
      if (ben && ben.hasTelda) migrated.transferChannel = ben.method;
    }
    return migrated;
  });
};

const METHOD_BY_CATEGORY = {
  'إيجار المحل': 'cash', 
  'الزكاة والتبرعات': 'cib_savings', 
  'تكييف محمود': 'cash', 
  'راتب شهري': 'aaib_savings', 
  'راتب AAIB': 'aaib_savings', 
  'عهدة إيماك WE': 'cib_savings', 
  'عهدة شركة إيماك': 'cib_savings', 
  'Cash Back': 'cash', 
  'استرداد كاش باك': 'cash', 
  'الالتزامات البنكية والتمويلية': 'aaib_savings', 
  'الصحة والرعاية الطبية': 'cash', 
  'مصروف شهري - شيماء': 'cib_savings', 
  'مصروف شهري - سلمى': 'cib_savings', 
  'مصروف شهري - عبد الرحمن': 'cib_savings', 
  'مصروف شهري - أنس': 'cash'
};

/* ═══════════════════════════════════════════════════════════════
   migrateData
   ═══════════════════════════════════════════════════════════════ */
const migrateData = (parsed) => {
  if (!parsed) return parsed;

  const deletedDefaultIds = Array.isArray(parsed.deletedDefaultIds) ? parsed.deletedDefaultIds : [];
  const deletedSet = new Set(deletedDefaultIds);

  const incomingCards = Array.isArray(parsed.cards) ? parsed.cards : [];
  const cardsFilteredDefaults = DEFAULT_CARDS.filter(c => !deletedSet.has(c.id));
  const mergedCards = mergeById(migrateCards(incomingCards), cardsFilteredDefaults);

  const incomingLoans = Array.isArray(parsed.loans) ? parsed.loans : [];
  const processedLoans = incomingLoans.map(l => {
    if (isTakyeefLoan(l)) return { 
      ...l, systemId: SYSTEM_LOAN_IDS.TAKYEEF, isReceivable: true, type: 'receivable', 
      interest: 'مستحق لنا شهرياً', paused: !!l.paused, 
      totalInstallments: safeNumber(l.totalInstallments, 12), paidInstallments: safeNumber(l.paidInstallments, 0) 
    };
    if (isHanyLoan(l) && !l.autoMonthly) return { 
      ...l, systemId: SYSTEM_LOAN_IDS.HANY, autoMonthly: true, dueNextMonth: true, 
      mergeIntoNextCycle: l.mergeIntoNextCycle || [], 
      category: l.category || 'مسحوبات محل هاني', totalAmount: 0, prePaidAmount: 0, 
      monthlyInstallment: 0, dueDay: 5, interest: 'مستحق شهري', 
      description: 'مسحوبات يومية', type: 'debt' 
    };
    if (l && l.autoMonthly && !l.systemId) return { ...l, systemId: SYSTEM_LOAN_IDS.HANY };
    return l;
  });
  
  const loansFilteredDefaults = DEFAULT_LOANS.filter(l => !deletedSet.has(l.id) && !(l.systemId && deletedSet.has(l.systemId)));
  const mergedLoans = mergeById(processedLoans, loansFilteredDefaults);

  let { snapshots, closedMonths } = migrateSnapshotsAndClosed(parsed.monthlySnapshots, parsed.closedMonths);
  const incomingVersion = safeNumber(parsed.engineVersion, 1);
  if (incomingVersion < 10 && Object.keys(snapshots).length > 0) { snapshots = {}; }

  let transactions = Array.isArray(parsed.transactions) ? parsed.transactions.map(migrateTransaction) : [];
  transactions = transactions.map(t => {
    if (t.id && t.sourceRecurringId && t.year && t.month && /^rec-.+-\d{4}-.+-[a-z0-9-]{6,}$/i.test(t.id)) {
      return { ...t, id: `rec-${t.sourceRecurringId}-${makeMonthKey(t.year, t.month)}` };
    }
    return t;
  });

  const accountsData = parsed.accountsData && typeof parsed.accountsData === 'object' ? { ...DEFAULT_ACCOUNTS, ...parsed.accountsData } : { ...DEFAULT_ACCOUNTS };
  const renamedLabels = { 'CIB توفير': 'CIB Savings', 'AAIB توفير': 'AAIB Savings', 'نقدي': 'Cash', 'فوري': 'Fawry', 'اتصالات': 'Etisalat' };
  
  ACCOUNT_KEYS.forEach(k => {
    if (accountsData[k]?.lastUpdated === undefined) accountsData[k] = { ...(accountsData[k] || {}), lastUpdated: null };
    if (accountsData[k] && accountsData[k].label && renamedLabels[accountsData[k].label]) accountsData[k] = { ...accountsData[k], label: renamedLabels[accountsData[k].label] };
    if (accountsData[k] && !accountsData[k].label) accountsData[k] = { ...accountsData[k], label: DEFAULT_ACCOUNTS[k].label };
    if (k === 'cib_savings' && !accountsData[k].last4) accountsData[k] = { ...accountsData[k], last4: '1809' };
    if (k === 'aaib_savings' && !accountsData[k].last4) accountsData[k] = { ...accountsData[k], last4: '2106' };
  });

  let recurringItems = Array.isArray(parsed.recurringItems) ? parsed.recurringItems : [];
  recurringItems = migrateRecurringItems(recurringItems);
  
  const recurringIds = new Set(recurringItems.map(r => r.id));
  DEFAULT_RECURRING.forEach(dr => { if (!recurringIds.has(dr.id) && !deletedSet.has(dr.id)) recurringItems.push(dr); });
  
  recurringItems = recurringItems.map(r => {
    if (r.method) return r;
    if (r.linkedCardId) { 
      const card = DEFAULT_CARDS.find(c => c.id === r.linkedCardId); 
      return { ...r, method: card ? getCardMethod(card) : 'cash' }; 
    }
    const m = METHOD_BY_CATEGORY[r.category];
    return m ? { ...r, method: m } : { ...r, method: 'cash' };
  });

  const settledHanyMonths = Array.isArray(parsed.settledHanyMonths) ? parsed.settledHanyMonths : [];
  const deletedTxIds = Array.isArray(parsed.deletedTxIds) ? parsed.deletedTxIds.slice(-500) : [];

  const existingArchive = Array.isArray(parsed.deletedTxArchive) ? parsed.deletedTxArchive : [];
  const archiveIds = new Set(existingArchive.map(a => a.id).filter(Boolean));
  const migratedArchive = [...existingArchive];
  deletedTxIds.forEach(id => {
    if (!archiveIds.has(id)) {
      migratedArchive.push({ id, deletedAt: null, deletedBy: 'unknown', _legacy: true });
    }
  });
  const deletedTxArchive = migratedArchive.slice(-500);

  const { openingBalance2026: _drop, ...rest } = parsed;
  
  return {
    ...rest, 
    engineVersion: CURRENT_ENGINE_VERSION, 
    recurringInitialized: true,
    cards: mergedCards, 
    loans: mergedLoans,
    recurringItems, 
    closedMonths, 
    monthlySnapshots: snapshots, 
    transactions, 
    accountsData,
    monthlyPlans: parsed.monthlyPlans && typeof parsed.monthlyPlans === 'object' ? parsed.monthlyPlans : {},
    materializedRecurring: parsed.materializedRecurring && typeof parsed.materializedRecurring === 'object' ? parsed.materializedRecurring : {},
    custodyEntries: Array.isArray(parsed.custodyEntries) ? parsed.custodyEntries : [],
    cashbackTrackers: Array.isArray(parsed.cashbackTrackers) ? parsed.cashbackTrackers : [],
    reconciliations: Array.isArray(parsed.reconciliations) ? parsed.reconciliations : [],
    settledHanyMonths, 
    deletedTxIds, 
    deletedTxArchive, 
    deletedDefaultIds,
    defaultsSeeded: true
  };
};

/* ═══════════════════════════════════════════════════════════════
   materializeRecurringItems
   ═══════════════════════════════════════════════════════════════ */
const materializeRecurringItems = (data, asOfDateStr) => {
  if (!data?.recurringItems?.length) return null;
  
  const now = asOfDateStr ? new Date(asOfDateStr) : new Date();
  const permanentDeleted = new Set(data.deletedTxIds || []);
  const existing = (data.transactions || []).filter(t => !(permanentDeleted.has(t.id)));
  const materialized = { ...(data.materializedRecurring || {}) };
  const newTxs = [];
  
  const loanPaidMap = {};
  existing.forEach(t => { 
    if (t.status === 'paid' && t.sourceReceivableId) 
      loanPaidMap[t.sourceReceivableId] = (loanPaidMap[t.sourceReceivableId] || 0) + safeNumber(t.amount); 
  });
  
  data.recurringItems.forEach(r => {
    if (r.active === false || !r.id || !r.type) return;
    const day = safeNumber(r.day, 1);
    if (day < 1 || day > 31) return;
    
    const startInput = r.startMonth || `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const [sy, sm] = startInput.split('-').map(Number);
    if (isNaN(sy) || isNaN(sm)) return;
    
    const endInput = r.endMonth || `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const [ey, em] = endInput.split('-').map(Number);
    if (isNaN(ey) || isNaN(em)) return;
    
    const startYM = sy * 12 + (sm - 1);
    const endYM = ey * 12 + (em - 1);
    
    for (let ym = startYM; ym <= endYM; ym++) {
      const y = Math.floor(ym / 12);
      const mIdx = ym % 12;
      const monthName = ALL_MONTHS[mIdx];
      
      const maxDayInMonth = new Date(y, mIdx + 1, 0).getDate();
      const safeDay = Math.min(day, maxDayInMonth);
      const targetDate = new Date(y, mIdx, safeDay);
      if (targetDate > now) break;
      
      const matKey = `${r.id}_${makeMonthKey(y, monthName)}`;
      if (materialized[matKey] === 'deleted') continue;
      if (materialized[matKey]) continue;
      
      const manualExists = existing.some(t => 
        t.sourceRecurringId === r.id && t.month === monthName && (t.year || y) === y
      );
      if (manualExists) { materialized[matKey] = true; continue; }
      
      let receivableLinkedId = null;
      if (r.linkedLoanSystemId) {
        const linkedLoan = (data.loans || []).find(l => l.systemId === r.linkedLoanSystemId);
        if (linkedLoan) { 
          const collected = safeNumber(linkedLoan.prePaidAmount) + (loanPaidMap[linkedLoan.id] || 0); 
          if (collected >= safeNumber(linkedLoan.totalAmount) - 0.005) break;
          receivableLinkedId = linkedLoan.id; 
        }
      }
      
      let method = 'cash';
      let linkedCardId = r.linkedCardId;
      if (r.method) { method = r.method; }
      else if (linkedCardId) { 
        const card = (data.cards || []).find(c => c.id === linkedCardId); 
        if (card) method = getCardMethod(card); 
      }
      
      const isFee = BANK_FEE_CATEGORIES.has(r.category);
      const kind = r.kind || (isFee ? KIND.FINANCIAL : KIND.OPERATIONAL);
      const newId = `rec-${r.id}-${makeMonthKey(y, monthName)}`;
      
      if (permanentDeleted.has(newId)) { materialized[matKey] = 'deleted'; continue; }
      
      newTxs.push({
        id: newId,
        type: r.type, 
        subType: r.type === 'income' ? 'deposit' : 'withdrawal', 
        kind,
        category: r.category, 
        amount: safeNumber(r.amount), 
        description: r.title || 'بند متكرر',
        method, 
        date: getLocalISODate(targetDate), 
        month: monthName, 
        year: y, 
        monthIndex: mIdx,
        status: 'pending', 
        sourceRecurringId: r.id, 
        linkedCardId: linkedCardId || undefined,
        sourceReceivableId: receivableLinkedId || undefined,
        transferChannel: r.transferChannel || undefined,
        createdAt: new Date().toISOString()
      });
      materialized[matKey] = true;
    }
  });
  
  if (newTxs.length === 0) return null;
  
  return { 
    ...data, 
    transactions: [...newTxs, ...existing].sort((a, b) => (parseISODate(b.date) || 0) - (parseISODate(a.date) || 0)), 
    materializedRecurring: materialized 
  };
};

/* ═══════════════════════════════════════════════════════════════
   dedupeRecurringTransactions
   ═══════════════════════════════════════════════════════════════ */
const dedupeRecurringTransactions = (transactions) => {
  if (!Array.isArray(transactions) || transactions.length === 0) {
    return { transactions: transactions || [], removed: [] };
  }
  
  const removed = [];
  const seenById = new Set();
  const seenRecurringKey = new Map();
  const seenFuzzyKey = new Map();
  const keep = [];
  
  const sorted = [...transactions].sort((a, b) => {
    const aTs = a.createdAt ? new Date(a.createdAt).getTime() : 0;
    const bTs = b.createdAt ? new Date(b.createdAt).getTime() : 0;
    if (aTs !== bTs) return bTs - aTs;
    return String(b.id || '').localeCompare(String(a.id || ''));
  });
  
  sorted.forEach(t => {
    if (!t || !t.id) { keep.push(t); return; }
    
    if (seenById.has(t.id)) {
      removed.push({ reason: 'duplicate_id', id: t.id, tx: t });
      return;
    }
    
    if (t.sourceRecurringId && t.year && t.month) {
      const rKey = `${t.sourceRecurringId}|${t.year}|${t.month}`;
      if (seenRecurringKey.has(rKey)) {
        removed.push({ reason: 'duplicate_recurring', key: rKey, id: t.id, existingId: seenRecurringKey.get(rKey), tx: t });
        return;
      }
      seenRecurringKey.set(rKey, t.id);
    }
    
    if (t.createdAt && t.source !== 'sms' && !t.linkedTransferId && safeNumber(t.amount) > 0) {
      const FUZZY_WINDOW_MS = 5000;
      const tTime = new Date(t.createdAt).getTime();
      
      if (!isNaN(tTime)) {
        const descKey = normalizeText(t.description || '').slice(0, 30);
        const fKey = `${safeNumber(t.amount)}|${t.category}|${t.method}|${t.type}|${descKey}`;
        const lastSeen = seenFuzzyKey.get(fKey);
        
        if (lastSeen && (lastSeen.time - tTime) < FUZZY_WINDOW_MS) {
          removed.push({ reason: 'fuzzy_duplicate', key: fKey, id: t.id, existingId: lastSeen.id, deltaMs: lastSeen.time - tTime, tx: t });
          return;
        }
        
        seenFuzzyKey.set(fKey, { id: t.id, time: tTime });
      }
    }
    
    seenById.add(t.id);
    keep.push(t);
  });
  
  return { transactions: keep, removed };
};

/* ═══════════════════════════════════════════════════════════════
   deriveMonthlyPlanFromHistory
   ═══════════════════════════════════════════════════════════════ */
const deriveMonthlyPlanFromHistory = (data, targetYear, targetMonth, monthsBack = 3) => {
  const transactions = data?.transactions || [];
  const targetIdx = getMonthIndex(targetMonth);
  if (targetIdx < 0) return null;
  
  const refMonths = [];
  let y = targetYear, mi = targetIdx;
  for (let i = 1; i <= monthsBack; i++) {
    mi--; 
    if (mi < 0) { mi = 11; y--; }
    if (y < PROJECT_START_YEAR || (y === PROJECT_START_YEAR && mi < getMonthIndex(PROJECT_START_MONTH))) break;
    refMonths.push({ year: y, month: ALL_MONTHS[mi] });
  }
  if (refMonths.length === 0) return null;
  
  const isCounted = (t) => t.status === 'paid' || t.status === 'pending';
  const txYear = (t) => t.year != null ? t.year : (parseISODate(t.date)?.getFullYear() ?? 2026);
  
  const avgIncomeCat = (cat) => { 
    let total = 0, count = 0; 
    refMonths.forEach(({ year, month }) => { 
      const sum = transactions.filter(t => isCounted(t) && t.type === 'income' && t.month === month && txYear(t) === year && t.category === cat).reduce((s, t) => s + safeNumber(t.amount), 0); 
      if (sum > 0) { total += sum; count++; } 
    }); 
    return count > 0 ? total / count : 0; 
  };
  
  const avgCashExpenses = () => { 
    let total = 0, count = 0; 
    refMonths.forEach(({ year, month }) => { 
      const sum = transactions.filter(t => isCounted(t) && t.type === 'expense' && t.method === 'cash' && t.month === month && txYear(t) === year).reduce((s, t) => s + safeNumber(t.amount), 0); 
      if (sum > 0) { total += sum; count++; } 
    }); 
    return count > 0 ? total / count : 0; 
  };
  
  const KNOWN_INCOME = new Set(['راتب شهري', 'إيجار المحل', 'استرداد كاش باك', 'Cash Back', 'عهدة إيماك WE', 'عهدة شركة إيماك', 'الزكاة والتبرعات', 'راتب AAIB', 'تكييف محمود']);
  
  const avgFreeIncome = () => { 
    let total = 0, count = 0; 
    refMonths.forEach(({ year, month }) => { 
      const sum = transactions.filter(t => isCounted(t) && t.type === 'income' && t.month === month && txYear(t) === year && !KNOWN_INCOME.has(t.category)).reduce((s, t) => s + safeNumber(t.amount), 0); 
      if (sum > 0) { total += sum; count++; } 
    }); 
    return count > 0 ? total / count : 0; 
  };
  
  const sumActiveInstallments = () => { 
    const loans = data?.loans || []; 
    return loans.filter(l => !l.isReceivable && !l.autoMonthly && safeNumber(l.monthlyInstallment) > 0).reduce((s, l) => s + safeNumber(l.monthlyInstallment), 0); 
  };
  
  return {
    expectedSalary: Math.round(avgIncomeCat('راتب شهري')), 
    expectedRent: Math.round(avgIncomeCat('إيجار المحل')),
    expectedCashback: Math.round(avgIncomeCat('استرداد كاش باك') || avgIncomeCat('Cash Back')),
    expectedEmakWE: Math.round(avgIncomeCat('عهدة إيماك WE') || avgIncomeCat('عهدة شركة إيماك')),
    expectedZakat: Math.round(avgIncomeCat('الزكاة والتبرعات')), 
    expectedCash: Math.round(avgFreeIncome()),
    expectedCashExpenses: Math.round(avgCashExpenses()), 
    plannedPayments: Math.round(sumActiveInstallments()),
    _meta: { refMonths: refMonths.map(m => `${m.month} ${m.year}`).join(' • ') }
  };
};

/* ═══════════════ ONLINE STATUS ═══════════════ */
const useOnlineStatus = () => {
  const [online, setOnline] = useState(() => (typeof navigator !== 'undefined' ? navigator.onLine : true));
  useEffect(() => {
    const onOnline = () => setOnline(true);
    const onOffline = () => setOnline(false);
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    return () => { 
      window.removeEventListener('online', onOnline); 
      window.removeEventListener('offline', onOffline); 
    };
  }, []);
  return online;
};

/* ═══════════════ ERROR BOUNDARY — Safe Reset ═══════════════ */
class ErrorBoundary extends React.Component {
  constructor(p) { 
    super(p); 
    this.state = { hasError: false, error: null, errorInfo: null }; 
  }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(e, i) { 
    console.error('App Error:', e, i); 
    this.setState({ errorInfo: i });
    clearAllModals(); 
  }
  safeReset = () => {
    const keep = {};
    try {
      [PIN_HASH_KEY, 'theme', 'budgets'].forEach(k => {
        const v = localStorage.getItem(k);
        if (v) keep[k] = v;
      });
    } catch (e) {}
    try { localStorage.clear(); } catch (e) {}
    try {
      Object.entries(keep).forEach(([k, v]) => localStorage.setItem(k, v));
    } catch (e) {}

/* ═══════════════ PROMISE-BASED MODAL PROVIDER ═══════════════ */
const _modalResolvers = new Map();
let _modalIdCounter = 0;

const showInputModal = (opts) => new Promise((resolve) => { 
  const id = ++_modalIdCounter; 
  _modalResolvers.set(id, resolve); 
  window.dispatchEvent(new CustomEvent('show-input-modal', { detail: { ...opts, _id: id } })); 
});
const resolveModal = (id, value) => { 
  const resolve = _modalResolvers.get(id); 
  if (resolve) { _modalResolvers.delete(id); resolve(value); } 
};
const clearAllModals = () => { 
  _modalResolvers.forEach((resolve) => resolve(null)); 
  _modalResolvers.clear(); 
};

const PromiseModalProvider = ({ children }) => {
  const [stack, setStack] = useState([]);
  const [inputValues, setInputValues] = useState({});
  
  useEffect(() => {
    const handleInput = (e) => setStack(s => [...s, { kind: 'input', ...e.detail }]);
    const handleConfirm = (e) => setStack(s => [...s, { kind: 'confirm', ...e.detail }]);
    window.addEventListener('show-input-modal', handleInput);
    window.addEventListener('show-confirm-modal', handleConfirm);
    return () => { 
      window.removeEventListener('show-input-modal', handleInput); 
      window.removeEventListener('show-confirm-modal', handleConfirm); 
    };
  }, []);
  
  const current = stack[stack.length - 1];
  const dismiss = useCallback((value) => {
    if (!current) return;
    const id = current._id;
    setStack(s => s.slice(0, -1));
    resolveModal(id, value);
    setInputValues(prev => { 
      if (!(id in prev)) return prev; 
      const next = { ...prev }; 
      delete next[id]; 
      return next; 
    });
  }, [current]);
  
  const inputValue = current?._id !== undefined ? (inputValues[current._id] ?? current.inputValue ?? '') : '';
  const setInputValue = useCallback((v) => { 
    if (current?._id === undefined) return; 
    setInputValues(prev => ({ ...prev, [current._id]: v })); 
  }, [current?._id]);
  
  return (
    <React.Fragment>
      {children}
      {current?.kind === 'input' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-md animate-scaleIn">
            <div className="generic-modal-header">
              <h3 className="text-base font-black flex items-center gap-2">
                <span>{current.icon || '💬'}</span>{current.title}
              </h3>
              <button onClick={() => dismiss(null)} className="btn btn-ghost p-1.5"><X size={16} /></button>
            </div>
            <div className="generic-modal-body">
              {current.message && (
                <p className="text-sm mb-3 whitespace-pre-line leading-relaxed" style={{ color: 'var(--text-secondary)' }}>
                  {current.message}
                </p>
              )}
              <input 
                autoFocus 
                type="text" 
                inputMode={current.numeric ? 'decimal' : 'text'} 
                className="input-field input-num text-2xl text-center py-4" 
                style={{ color: 'var(--accent)' }}
                value={inputValue} 
                onChange={e => setInputValue(current.numeric ? e.target.value.replace(/[^\d.\-]/g, '') : e.target.value)} 
                onKeyDown={e => { 
                  if (e.key === 'Enter') { 
                    const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim(); 
                    dismiss(v); 
                  } 
                }} 
                placeholder={current.placeholder || ''} 
              />
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => dismiss(null)} className="btn btn-secondary flex-1">إلغاء</button>
              <button 
                onClick={() => { 
                  const v = current.numeric ? parseNumberInput(inputValue) : inputValue.trim(); 
                  dismiss(v); 
                }} 
                className="btn btn-primary flex-1"
              >{current.confirmText || 'تأكيد'}</button>
            </div>
          </div>
        </div>
      )}
      {current?.kind === 'confirm' && (
        <div className="modal-backdrop z-[6000] no-print">
          <div className="generic-modal max-w-sm animate-scaleIn">
            <div className="generic-modal-body text-center">
              <div className={`w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center text-3xl ${current.danger ? 'bg-red-50 dark:bg-red-950/40' : 'bg-blue-50 dark:bg-blue-950/40'}`}>
                {current.icon || (current.danger ? '⚠️' : '❓')}
              </div>
              <h3 className="text-base font-black mb-2">{current.title}</h3>
              <p className="text-sm leading-relaxed mb-2 whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>
                {current.message}
              </p>
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => dismiss(false)} className="btn btn-secondary flex-1">إلغاء</button>
              <button 
                onClick={() => dismiss(true)} 
                className="btn flex-1" 
                style={{ background: current.danger ? 'var(--danger)' : 'var(--accent)', color: 'white' }}
              >{current.confirmText || 'تأكيد'}</button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
};

/* ═══════════════ ANIMATED NUMBER ═══════════════ */
const AnimatedNumber = memo(({ value, duration = 600, decimals = 2, prefix = '', suffix = '', className = '' }) => {
  const [display, setDisplay] = useState(0);
  const rafRef = useRef(null);
  const startRef = useRef(null);
  const startValRef = useRef(0);
  
  useEffect(() => {
    const target = safeNumber(value);
    const startVal = display;
    startValRef.current = startVal;
    const diff = target - startVal;
    if (Math.abs(diff) < 0.005) { setDisplay(target); return; }
    
    startRef.current = performance.now();
    const animate = (now) => {
      const elapsed = now - startRef.current;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setDisplay(startValRef.current + diff * eased);
      if (progress < 1) rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [value, duration]);
  
  return (
    <span className={`money ${className}`}>
      {prefix}{display.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}{suffix}
    </span>
  );
});

  const [note, setNote] = useState('');
  const [creating, setCreating] = useState(false);
  
  const actual = parseNumberInput(actualBalance);
  const diff = actual - computedBalance;
  const hasDiff = Math.abs(diff) >= 0.01;
  
  const handleReconcile = () => {
    if (!hasDiff) {
      addNotification({ type: 'info', title: 'لا يوجد فرق' });
      onClose();
      return;
    }
    setCreating(true);
    onReconcile({
      accountKey,
      computedBalance,
      actualBalance: actual,
      diff,
      note: note.trim() || 'تسوية مطابقة رصيد'
    });
    setCreating(false);
    onClose();
  };
  
  const accountLabel = ACCOUNT_SHORT_NAMES[accountKey] || accountKey;
  
  return (
    <Modal isOpen={true} onClose={onClose} title="مطابقة الرصيد" icon="⚖️" size="md">
      <div className="space-y-4">
        <div className="p-3 rounded-xl" style={{ background: 'var(--bg-muted)' }}>
          <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الحساب</p>
          <p className="font-black text-sm">{accountLabel}</p>
        </div>
        
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الرصيد المحسوب</label>
            <div className="input-field input-num text-center py-3 font-black" style={{ background: 'var(--bg-muted)' }}>
              {fmt(computedBalance)}
            </div>
          </div>
          <div>
            <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>الرصيد الفعلي *</label>
            <input 
              type="text" 
              inputMode="decimal" 
              autoFocus
              className="input-field input-num text-center py-3 font-black"
              style={{ color: 'var(--accent)' }}
              value={actualBalance}
              onChange={e => setActualBalance(e.target.value)}
              placeholder="0.00"
            />
          </div>
        </div>
        
        {actualBalance && hasDiff && (
          <div className={`p-3 rounded-xl ${diff > 0 ? 'bg-emerald-50 dark:bg-emerald-950/30' : 'bg-red-50 dark:bg-red-950/30'}`}>
            <div className="flex justify-between items-center">
              <span className="text-xs font-bold" style={{ color: 'var(--text-secondary)' }}>الفرق</span>
              <span className={`font-black text-lg money tabular ${diff > 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                {diff > 0 ? '+' : ''}{fmt(diff)}
              </span>
            </div>
            <p className="text-[10px] mt-1" style={{ color: 'var(--text-muted)' }}>
              {diff > 0 ? 'سيتم إضافة تسوية رصيد (دخل)' : 'سيتم إضافة تسوية رصيد (مصروف)'}
            </p>
          </div>
        )}
        
        {actualBalance && !hasDiff && (
          <div className="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/30">
            <div className="flex items-center gap-2">
              <CheckCircle2 size={16} className="text-emerald-600" />
              <span className="text-xs font-bold text-emerald-700 dark:text-emerald-400">الرصيد مطابق ✓</span>
            </div>
          </div>
        )}
        
        {actualBalance && hasDiff && (
          <div>
            <label className="text-[11px] font-bold block mb-1.5" style={{ color: 'var(--text-muted)' }}>ملاحظة (اختياري)</label>
            <input 
              type="text" 
              className="input-field text-sm"
              value={note}
              onChange={e => setNote(e.target.value)}
              placeholder="سبب الفرق..."
            />
          </div>
        )}
        
        <div className="flex gap-2">
          <button onClick={onClose} className="btn btn-secondary flex-1">إلغاء</button>
          <button 
            onClick={handleReconcile} 
            disabled={!actualBalance || creating}
            className="btn btn-primary flex-1"
          >
            {creating ? 'جاري...' : hasDiff ? 'إنشاء تسوية' : 'تأكيد'}
          </button>
        </div>
      </div>
    </Modal>
  );
});

/* ═══════════════ TOAST ═══════════════ */
const Toast = ({ notification, onClose }) => {
  useEffect(() => { 
    const t = setTimeout(onClose, notification.duration || 5000); 
    return () => clearTimeout(t); 
  }, [notification, onClose]);
  
  const icons = { success: CheckCircle2, error: AlertTriangle, warning: AlertTriangle, info: Bell };
  const Icon = icons[notification.type] || Bell;
  
  return (
    <div className={`toast toast-${notification.type || 'info'}`} role="alert" aria-live="polite">
      <Icon size={18} className="flex-shrink-0 mt-0.5" />
      <div className="flex-1 min-w-0">
        {notification.title && <p className="font-bold text-sm mb-0.5">{notification.title}</p>}
        {notification.message && <p className="text-xs opacity-95 leading-relaxed">{notification.message}</p>}
      </div>
      <button onClick={onClose} aria-label="إغلاق" className="flex-shrink-0 p-1 hover:bg-white/20 rounded-full">
        <X size={14} />
      </button>
    </div>
  );
};

const ToastContainer = ({ notifications, removeNotification }) => {
  if (!notifications || notifications.length === 0) return null;

    <div className="toast-container no-print">
      {notifications.slice(-3).map(n => <Toast key={n.id} notification={n} onClose={() => removeNotification(n.id)} />)}

  );
};

/* ═══════════════ GROUP TRANSACTIONS BY DATE ═══════════════ */
const groupTransactionsByDate = (list) => {
  const groups = {};
  list.forEach(t => { 
    const d = t.date || 'unknown'; 
    if (!groups[d]) groups[d] = []; 
    groups[d].push(t); 
  });
  const today = getLocalISODate();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const yestISO = getLocalISODate(yest);
  
  return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
    let label;
    if (date === today) label = '📅 النهاردة';
    else if (date === yestISO) label = '📅 امبارح';
    else {
      const dObj = parseISODate(date);
      if (dObj) { 
        const ds = dObj.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' }); 
        const ys = dObj.getFullYear() !== new Date().getFullYear() ? ' ' + dObj.getFullYear() : ''; 
        label = '📅 ' + ds + ys; 
      }
      else label = '📅 ' + date;
    }
    const total = groups[date].reduce((s, t) => s + safeNumber(t.amount), 0);
    return { date, label, items: groups[date], total };
  });
};

const ConfirmDialog = ({ confirmDialog, dispatch }) => {
  if (!confirmDialog.isOpen) return null;
  const isDanger = confirmDialog.danger;

  const handleCancel = () => {
    const cb = confirmDialog.onCancel;
    dispatch({ type: 'HIDE_CONFIRM' });
    if (cb) setTimeout(() => { try { cb(); } catch (e) {} }, 0);
  };
  
  const handleConfirm = () => {
    const cb = confirmDialog.onConfirm;
    dispatch({ type: 'HIDE_CONFIRM' });
    if (cb) setTimeout(() => { try { cb(); } catch (e) {} }, 0);
  };

  return (
    <div className="modal-backdrop z-[5000]">
      <div className="generic-modal max-w-sm animate-scaleIn">
        <div className="generic-modal-body text-center">
          <div className={`w-14 h-14 mx-auto mb-4 rounded-2xl flex items-center justify-center ${isDanger ? 'bg-red-50 dark:bg-red-950/40 text-red-500' : 'bg-blue-50 dark:bg-blue-950/40 text-blue-500'}`}>
            {isDanger ? <AlertTriangle size={24} /> : <Bell size={24} />}
          </div>
          <h3 className="text-base font-black mb-2">{confirmDialog.title}</h3>
          <p className="text-sm font-medium mb-2 leading-relaxed whitespace-pre-line" style={{ color: 'var(--text-secondary)' }}>
            {confirmDialog.message}
          </p>
        </div>
        <div className="generic-modal-footer">
          <button type="button" autoFocus onClick={handleCancel} className="btn btn-secondary flex-1 text-sm">إلغاء</button>
          <button 
            type="button" 
            onClick={handleConfirm} 
            className="btn flex-1 text-sm" 
            style={{ background: isDanger ? 'var(--danger)' : 'var(--accent)', color: 'white' }}
          >تأكيد</button>
        </div>
      </div>
    </div>
  );
};

const LoginScreen = ({ onLogin }) => {
  const [isLoading, setIsLoading] = useState(false);
  const [error, setError] = useState('');
  
  const handleGoogleLogin = () => {
    setIsLoading(true); 
    setError('');
    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider)
      .then((result) => { 
        if (result.user.email === ALLOWED_EMAIL) onLogin(); 
        else { 
          setError('دخول غير مصرح'); 
          firebase.auth().signOut(); 
        } 
      })
      .catch((err) => setError(err.message || 'خطأ في تسجيل الدخول'))
      .finally(() => setIsLoading(false));
  };
  
  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{ background: 'linear-gradient(135deg, #050A14 0%, #0A1628 40%, #1E2B4A 100%)' }}>

  );
