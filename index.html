/* ===================== استنتاج kind للقيود ===================== */
const inferKind = (tx) => {
  if (tx.kind) return tx.kind;
  if (tx.category === 'أخرى' && (tx.description || '').includes('تسوية')) return KIND.ADJUSTMENT;
  if (FINANCIAL_CATEGORIES.has(tx.category)) return KIND.FINANCIAL;
  return KIND.OPERATIONAL;
};

/* ===================== محرك الأرصدة الموحد ===================== */
/* يبني كائن محرك لجميع الحسابات مع دوال getBalance / getClosing / getOpening */

const getAccountCutoff = (accountsData, key) => {
  const iso = accountsData?.[key]?.lastUpdated;
  if (!iso) return new Date(0);
  const d = new Date(iso);
  return isNaN(d) ? new Date(0) : d;
};

/* الرصيد الحالي لحساب معيّن (بناءً على base + حركات بعد lastUpdated فقط) */
const computeBalance = (data, key, asOfDate) => {
  const accountsData = data?.accountsData || DEFAULT_ACCOUNTS;
  const acct = accountsData[key];
  const base = safeNumber(acct?.balance);
  const cutoff = getAccountCutoff(accountsData, key);
  const upper = asOfDate ? new Date(asOfDate) : null;
  const txs = (data?.transactions || []).filter(t => {
    if (t.status !== 'paid') return false;
    if (t.method !== key) return false;
    const d = new Date(t.date);
    if (d <= cutoff) return false;
    if (upper && d > upper) return false;
    return true;
  });
  let bal = base;
  txs.forEach(t => {
    const amt = safeNumber(t.amount);
    if (t.subType === 'deposit') bal += amt;
    else bal -= amt;
  });
  return bal;
};

/* ختامي شهر لحساب معيّن: يقبل snapshot إن وُجد، وإلا يحسب */
const getClosingBalance = (data, key, year, month) => {
  const monthKey = makeMonthKey(year, month);
  const snap = data?.monthlySnapshots?.[monthKey]?.[key];
  if (snap !== undefined && snap !== null) return safeNumber(snap);
  const monthEnd = new Date(year, getMonthIndex(month) + 1, 0, 23, 59, 59);
  return computeBalance(data, key, monthEnd);
};

/* افتتاحي أي شهر = ختامي الشهر السابق (بالتسلسل عبر السنين) */
const getOpeningBalance = (data, key, year, month) => {
  const idx = getMonthIndex(month);
  if (idx <= 0) {
    // نرجع للشهر الأخير من السنة السابقة (ديسمبر)
    return getClosingBalance(data, key, year - 1, 'ديسمبر');
  }
  return getClosingBalance(data, key, year, ALL_MONTHS[idx - 1]);
};

/* ملخص مالي لشهر معيّن */
const computeMonthSnapshot = (data, year, month) => {
  const monthKey = makeMonthKey(year, month);
  const txs = (data?.transactions || []).filter(t => t.month === month && (t.monthIndex === getMonthIndex(month)) && t.status === 'paid');
  const opIncome = txs.filter(t => t.type === 'income' && inferKind(t) === KIND.OPERATIONAL).reduce((s,t)=> s + safeNumber(t.amount), 0);
  const opExpense = txs.filter(t => t.type === 'expense' && inferKind(t) === KIND.OPERATIONAL).reduce((s,t)=> s + safeNumber(t.amount), 0);
  return { monthKey, opIncome, opExpense, net: opIncome - opExpense };
};

/* ===================== Migration ===================== */
const migrateCards = (cards) => {
  if (!Array.isArray(cards)) return DEFAULT_CARDS;
  return cards.map(c => {
    if (c.openingDebt !== undefined && c.availableBalance !== undefined) return c;
    const limit = safeNumber(c.limit);
    const oldOpening = safeNumber(c.openingBalance);
    const openingDebt = Math.max(0, limit - oldOpening);
    return { ...c, openingDebt, availableBalance: oldOpening };
  });
};

/* ترحيل snapshots/closedMonths إلى مفاتيح year-month */
const migrateSnapshotsAndClosed = (snapshots, closedMonths) => {
  const snaps = snapshots && typeof snapshots === 'object' ? snapshots : {};
  const closed = Array.isArray(closedMonths) ? closedMonths : [];
  const hasYM = Object.keys(snaps).some(k => /^\d{4}-/.test(k)) || closed.some(k => /^\d{4}-/.test(k));
  if (hasYM) return { snapshots: snaps, closedMonths: closed };
  const newSnaps = {};
  Object.entries(snaps).forEach(([month, val]) => {
    newSnaps[makeMonthKey(2026, month)] = typeof val === 'object' && val !== null ? val : { cash: safeNumber(val) };
  });
  const newClosed = closed.map(m => makeMonthKey(2026, m));
  return { snapshots: newSnaps, closedMonths: newClosed };
};

/* ترحيل كل معاملة: إضافة kind */
const migrateTransaction = (t) => {
  if (!t) return t;
  const kind = inferKind(t);
  return { ...t, kind };
};

const migrateData = (parsed) => {
  if (!parsed) return parsed;
  const cards = Array.isArray(parsed.cards) ? parsed.cards : [];
  const loans = Array.isArray(parsed.loans) ? parsed.loans : [];
  const recurring = Array.isArray(parsed.recurringItems) ? parsed.recurringItems : [];
  const hasSig = cards.some(c => c.name === 'Signature' && String(c.last4) === '0391');
  const hasSWYPE = cards.some(c => c.name === 'SWYPE');
  const hasTakyeef = loans.some(l => l.name && l.name.includes('تكييف محمود'));
  const hasHany = loans.some(l => l.name && l.name.includes('محل هاني'));
  const { snapshots, closedMonths } = migrateSnapshotsAndClosed(parsed.monthlySnapshots, parsed.closedMonths);
  const transactions = Array.isArray(parsed.transactions) ? parsed.transactions.map(migrateTransaction) : [];
  return {
    ...parsed,
    cards: (!hasSig || !hasSWYPE || cards.length < 3) ? DEFAULT_CARDS : migrateCards(cards),
    loans: (!hasTakyeef || !hasHany) ? DEFAULT_LOANS : loans,
    recurringItems: recurring.length < 5 ? DEFAULT_RECURRING : recurring,
    closedMonths,
    monthlySnapshots: snapshots,
    transactions,
    accountsData: parsed.accountsData && typeof parsed.accountsData === 'object' ? { ...DEFAULT_ACCOUNTS, ...parsed.accountsData } : DEFAULT_ACCOUNTS,
    monthlyPlans: parsed.monthlyPlans && typeof parsed.monthlyPlans === 'object' ? { ...DEFAULT_MONTHLY_PLANS, ...parsed.monthlyPlans } : DEFAULT_MONTHLY_PLANS
  };
};

const getInitialData = () => {
  const legacyOpening = localStorage.getItem('opening_balance_2026');
  const finalOpening = legacyOpening ? Number(legacyOpening) : safeNumber(DEFAULT_ACCOUNTS.cash.balance);
  try {
    const cached = localStorage.getItem(STORAGE_KEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      const migrated = migrateData(parsed);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated)); } catch(e){}
      return { ...migrated, openingBalance2026: migrated.openingBalance2026 || finalOpening, accountsData: migrated.accountsData || DEFAULT_ACCOUNTS, monthlyPlans: migrated.monthlyPlans || DEFAULT_MONTHLY_PLANS, transactions: Array.isArray(migrated.transactions) ? migrated.transactions : [] };
    }
  } catch (e) { console.warn(e); }
  return { transactions: [], loans: DEFAULT_LOANS, cards: DEFAULT_CARDS, accountsData: DEFAULT_ACCOUNTS, monthlyPlans: DEFAULT_MONTHLY_PLANS, openingBalance2026: finalOpening, recurringItems: DEFAULT_RECURRING, closedMonths: [], monthlySnapshots: {} };
};

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { hasError: false }; }
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch(e, i) { console.error('App Error:', e, i); }
  render() {
    if (this.state.hasError) return (
      <div className="flex flex-col h-screen items-center justify-center gradient-bg-danger text-white p-8 text-center" dir="rtl">
        <div className="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-6"><AlertTriangle size={48} /></div>

/* ===================== كاشف التكرار (بمفتاح تاريخ) ===================== */
const DuplicateDetectionSystem = ({ transactions, dispatch, addNotification, closedMonths }) => {
  const [threshold, setThreshold] = useState(2);
  const [selectedMonth, setSelectedMonth] = useState('all');
  const [expandedGroups, setExpandedGroups] = useState({});
  const duplicates = useMemo(() => {
    const map = {};
    const filtered = selectedMonth === 'all' ? transactions : transactions.filter(t => t.month === selectedMonth);
    filtered.forEach(t => {
      // مفتاح يشمل التاريخ لمنع الإنذارات الكاذبة (إيجار شهري لا يظهر مكرراً)
      const key = `${safeNumber(t.amount)}_${t.method}_${t.category}_${(t.date||'').slice(0,10)}`;
      if (!map[key]) map[key] = [];
      map[key].push(t);
    });
    return Object.entries(map).filter(([_, items]) => items.length >= threshold).map(([key, items]) => ({ key, amount: items[0].amount, count: items.length, items, category: items[0].category, risk: items.length >= 5 ? 'high' : items.length >= 3 ? 'medium' : 'low' }));
  }, [transactions, threshold, selectedMonth]);
  const handleDeleteAll = () => {
    const closedSet = new Set(closedMonths || []);
    let idsToDelete = [], protectedCount = 0;
    duplicates.forEach(d => { d.items.slice(1).forEach(item => { const key = makeMonthKey(item.year || 2026, item.month); if (closedSet.has(key) || closedSet.has(item.month)) protectedCount++; else idsToDelete.push(item.id); }); });
    if (idsToDelete.length === 0 && protectedCount > 0) { addNotification({ type: 'error', title: 'محظور', message: 'جميع المكررات في أشهر مغلقة.' }); return; }
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'تأكيد الحذف', message: `سيتم حذف ${idsToDelete.length} عملية مكررة.${protectedCount > 0 ? ` تم تجاهل ${protectedCount}.` : ''}`, onConfirm: () => { dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.filter(t => !idsToDelete.includes(t.id)) }); addNotification({ type: 'success', title: 'تم التنظيف' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  };
  return (
    <div className="space-y-8 animate-fadeIn pb-20">
      <div className="glass p-8 rounded-2xl flex justify-between items-center mb-6 flex-wrap gap-4">
        <div><h2 className="text-2xl font-black flex items-center gap-3"><Filter className="text-blue-500" /> كاشف التكرار الذكي</h2><p className="text-slate-500 mt-1 text-sm font-bold">تحليل يعتمد على (المبلغ + الطريقة + الفئة + التاريخ)</p></div>
        <button onClick={handleDeleteAll} disabled={duplicates.length === 0} className={`px-6 py-3 rounded-xl font-bold flex items-center gap-2 ${duplicates.length === 0 ? 'bg-slate-100 text-slate-400' : 'gradient-bg-danger text-white shadow-lg'}`}><Trash2 size={18} /> تنظيف السجل</button>
      </div>
      <div className="glass p-6 rounded-2xl grid grid-cols-1 md:grid-cols-2 gap-8">
        <div><label className="block text-xs font-black mb-3 opacity-70 uppercase tracking-widest">نطاق البحث</label>
          <select className="input-field" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}>
            <option value="all">جميع الشهور</option>
            {[...getMonthsForYear(2026), ...getMonthsForYear(2027), ...getMonthsForYear(2028)].map(m => <option key={m} value={m}>{m}</option>)}
          </select></div>
        <div><label className="block text-xs font-black mb-3 opacity-70 uppercase tracking-widest">الحساسية ({threshold} أو أكثر)</label>
          <input type="range" min="2" max="10" className="w-full h-2 bg-slate-200 rounded-lg appearance-none" value={threshold} onChange={e => setThreshold(Number(e.target.value))} /></div>
      </div>
      <div className="space-y-4">
        {duplicates.length === 0 ? (
          <div className="glass p-20 text-center rounded-2xl"><CheckCircle2 size={60} className="text-emerald-500 mx-auto mb-4" /><h3 className="text-xl font-black">ممتاز! لا توجد تكرارات</h3></div>
        ) : duplicates.map(dup => (
          <div key={dup.key} className="glass rounded-2xl overflow-hidden border">
            <div className={`p-5 flex justify-between items-center cursor-pointer ${dup.risk === 'high' ? 'bg-red-50/50 dark:bg-red-900/20' : 'bg-amber-50/50 dark:bg-amber-900/20'}`} onClick={() => setExpandedGroups(p => ({ ...p, [dup.key]: !p[dup.key] }))}>
              <div className="flex items-center gap-4">
                <div className={`p-3 rounded-2xl ${dup.risk === 'high' ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-600'}`}><Repeat size={24} /></div>
                <div><h4 className="font-black text-lg">{fmt(dup.amount)} ج.م</h4><span className="text-xs font-bold opacity-60">{dup.category} — تكرر {dup.count} مرات</span></div>
              </div>
              <ChevronDown className={`transition-transform ${expandedGroups[dup.key] ? 'rotate-180' : ''}`} />
            </div>
            {expandedGroups[dup.key] && (
              <div className="p-4 bg-white/50 dark:bg-black/20 divide-y divide-slate-200 dark:divide-slate-700">
                {dup.items.map((item, idx) => (
                  <div key={item.id} className="py-4 flex justify-between items-center px-4 gap-3">
                    <div className="text-sm font-bold flex-1 min-w-0">📅 {item.date} | 📝 {item.description || 'بدون وصف'}</div>
                    {idx !== 0 && <button aria-label="حذف" onClick={() => dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.filter(t => t.id !== item.id) })} className="text-red-500 hover:bg-red-50 p-2 rounded-xl flex-shrink-0"><Trash2 size={16} /></button>}
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
};

  isRecurringModalOpen: false, recurringFormData: { title: '', amount: '', day: 1, category: 'أخرى', type: 'expense' },

function dataReducer(state, action) {
  switch (action.type) {
    case 'SET_DATA': return { ...state, data: action.payload };
    case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
    case 'SET_SELECTED_YEAR': return { ...state, selectedYear: action.payload, selectedMonth: getMonthsForYear(action.payload)[0] };
    case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
    case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
    case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
    case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload, formErrors: {} };
    case 'SET_FORM_DATA': return { ...state, formData: action.payload };
    case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
    case 'SET_FORM_ERRORS': return { ...state, formErrors: action.payload };
    case 'SET_ACTIVE_CATEGORY_DETAIL': return { ...state, activeCategoryDetail: action.payload };
    case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
    case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
    case 'SET_BUDGETS': return { ...state, budgets: action.payload };
    case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
    case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
    case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
    case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
    case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
    case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
    case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
    case 'SET_FILTER_TYPE': return { ...state, filterType: action.payload };
    case 'SET_AI_MODAL_OPEN': return { ...state, isAiModalOpen: action.payload };
    case 'SET_AI_RESPONSE': return { ...state, aiResponse: action.payload };
    case 'SET_AI_LOADING': return { ...state, isAiLoading: action.payload };
    case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
    case 'ADD_NOTIFICATION': return { ...state, notifications: [...state.notifications, { id: Date.now() + Math.random(), ...action.payload }] };
    case 'REMOVE_NOTIFICATION': return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
    case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
    case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
    case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
    case 'UPDATE_OPENING_BALANCE': return { ...state, data: { ...state.data, openingBalance2026: action.payload } };
    case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
    case 'UPDATE_ACCOUNTS': return { ...state, data: { ...state.data, accountsData: action.payload } };
    case 'UPDATE_MONTHLY_PLANS': return { ...state, data: { ...state.data, monthlyPlans: action.payload } };
    case 'ADD_TO_HISTORY': { const limited = [...state.history].slice(-19); return { ...state, history: [...limited, action.payload] }; }
    case 'UNDO': { if (state.history.length === 0) return state; const prev = state.history[state.history.length - 1]; return { ...state, data: prev, history: state.history.slice(0, -1) }; }
    case 'TOGGLE_LEDGER': return { ...state, expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] } };
    case 'TOGGLE_CARDS_SECTION': return { ...state, expandedCardsSection: !state.expandedCardsSection };
    case 'SET_STATUS_FILTER': return { ...state, statusFilter: action.payload };
    case 'SHOW_CONFIRM': return { ...state, confirmDialog: { isOpen: true, title: action.title, message: action.message, onConfirm: action.onConfirm, onCancel: action.onCancel, danger: action.danger || false } };
    case 'HIDE_CONFIRM': return { ...state, confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null, onCancel: null, danger: false } };
    case 'SET_QUICK_TRANSFER_MODAL_OPEN': return { ...state, isQuickTransferModalOpen: action.payload };
    case 'SET_QUICK_TRANSFER_DATA': return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
    case 'SET_VIEWING_CARD_STATEMENT': return { ...state, viewingCardStatement: action.payload };
    case 'CLOSE_MONTH': {
      const { monthKey, snapshot } = action.payload;
      return { ...state, data: { ...state.data, closedMonths: [...(state.data.closedMonths || []), monthKey], monthlySnapshots: { ...(state.data.monthlySnapshots || {}), [monthKey]: snapshot } } };
    }
    case 'OPEN_MONTH': return { ...state, data: { ...state.data, closedMonths: (state.data.closedMonths || []).filter(m => m !== action.payload) } };
    case 'DELETE_MONTH_TRANSACTIONS': {
      const { month, year } = action.payload;
      return { ...state, data: { ...state.data, transactions: (state.data.transactions || []).filter(t => !(t.month === month && t.year === year)), closedMonths: (state.data.closedMonths || []).filter(m => m !== makeMonthKey(year, month)) } };
    }
    case 'TOGGLE_WALLET_VISIBILITY': return { ...state, walletVisibility: { ...state.walletVisibility, [action.payload]: !state.walletVisibility[action.payload] } };
    case 'SET_IS_PROCESSING': return { ...state, isProcessing: action.payload };
    case 'SET_ADDING_CARD': return { ...state, isAddingCard: action.payload };
    case 'SET_ADDING_LOAN': return { ...state, isAddingLoan: action.payload };
    default: return state;
  }
}

const SettingsView = memo(({ accountsData, cards, dispatch, saveHistory, addNotification, walletVisibility, onToggleVisibility }) => {
  const [localAccounts, setLocalAccounts] = useState(() => ({ ...accountsData }));
  const [localCards, setLocalCards] = useState(() => cards.map(c => ({ ...c })));
  const [activeSection, setActiveSection] = useState('accounts');
  const [hasChanges, setHasChanges] = useState(false);

  useEffect(() => { setLocalAccounts({ ...accountsData }); setHasChanges(false); }, [accountsData]);
  useEffect(() => { setLocalCards(cards.map(c => ({ ...c }))); setHasChanges(false); }, [cards]);

  useEffect(() => {
    const handler = (e) => { if (hasChanges) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', handler);
    return () => window.removeEventListener('beforeunload', handler);
  }, [hasChanges]);

  const handleAccountChange = (key, field, value) => { setLocalAccounts(prev => ({ ...prev, [key]: { ...prev[key], [field]: value } })); setHasChanges(true); };
  const handleCardChange = (id, field, value) => {
    setLocalCards(prev => prev.map(c => {
      if (c.id !== id) return c;
      const updated = { ...c, [field]: value };
      if (field === 'availableBalance') updated.openingDebt = Math.max(0, safeNumber(updated.limit) - safeNumber(value));
      else if (field === 'openingDebt') updated.availableBalance = Math.max(0, safeNumber(updated.limit) - safeNumber(value));
      else if (field === 'limit') updated.openingDebt = Math.max(0, safeNumber(value) - safeNumber(updated.availableBalance));
      return updated;
    }));
    setHasChanges(true);
  };

  const handleSave = () => {
    saveHistory();
    const cleanedAccounts = {};
    ACCOUNT_KEYS.forEach(k => { cleanedAccounts[k] = { ...localAccounts[k], balance: safeNumber(localAccounts[k]?.balance), lastUpdated: getLocalISODate() }; });
    dispatch({ type: 'UPDATE_ACCOUNTS', payload: cleanedAccounts });
    dispatch({ type: 'UPDATE_CARDS', payload: localCards.map(c => ({ ...c, limit: safeNumber(c.limit), availableBalance: safeNumber(c.availableBalance), openingDebt: safeNumber(c.openingDebt) })) });
    addNotification({ type: 'success', title: '✅ تم الحفظ' });
    setHasChanges(false);
  };

  const handleReset = () => {
    dispatch({ type: 'SHOW_CONFIRM', danger: true, title: 'استرجاع القيم الافتراضية', message: 'سيتم إرجاع كل الأرصدة والبطاقات لقيمها الأصلية', onConfirm: () => { setLocalAccounts({ ...DEFAULT_ACCOUNTS }); setLocalCards(DEFAULT_CARDS.map(c => ({ ...c }))); setHasChanges(true); dispatch({ type: 'HIDE_CONFIRM' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) });
  };

  const sections = [{ id: 'accounts', label: 'الحسابات والمحافظ', icon: Wallet }, { id: 'cards', label: 'البطاقات الائتمانية', icon: CreditCard }];

        <div className="flex items-center gap-4">
          <div className="gradient-bg-primary p-4 rounded-2xl text-white shadow-lg"><Sliders size={32} /></div>
          <div><h2 className="text-3xl font-black">الإعدادات المتقدمة</h2><p className="text-slate-500 font-bold mt-1">الرصيد = رصيد فعلي حتى آخر تحديث + قيود لاحقة</p></div>
        </div>
        {hasChanges && (
          <div className="flex gap-3">
            <button onClick={handleSave} className="gradient-bg-success text-white px-8 py-4 rounded-2xl font-black shadow-lg flex items-center gap-3 active:scale-95"><Save size={20} /> حفظ</button>
            <button onClick={() => { setLocalAccounts({ ...accountsData }); setLocalCards(cards.map(c => ({ ...c }))); setHasChanges(false); }} className="bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-6 py-4 rounded-2xl font-bold active:scale-95"><Undo2 size={20} /></button>
          </div>
        )}
      </div>

      <div className="glass p-2 rounded-2xl flex gap-2 no-print">
        {sections.map(s => { const Icon = s.icon; const isActive = activeSection === s.id; return (
          <button key={s.id} onClick={() => setActiveSection(s.id)} className={`flex-1 py-4 rounded-xl font-bold flex items-center justify-center gap-3 transition-all ${isActive ? 'gradient-bg-primary text-white shadow-md' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800'}`}><Icon size={20} /> {s.label}</button>
        ); })}
      </div>

      {activeSection === 'accounts' && (
        <div className="space-y-6">
          <div className="glass p-6 rounded-2xl border-r-4 border-r-blue-500">
            <div className="flex items-center gap-3"><div className="p-3 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-xl"><Coins size={24} /></div><div><h3 className="font-black text-lg">الأرصدة الحالية لكل حساب</h3><p className="text-xs text-slate-500 font-bold mt-1">عدّل الرصيد الفعلي — يُعتبر رصيدًا حتى تاريخ الحفظ</p></div></div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {ACCOUNT_KEYS.map(key => {

              const Icon = ACCOUNT_ICONS[key] || Wallet;
              const isVisible = walletVisibility?.[key];

                      <div><label className="block text-xs font-black mb-2 text-slate-500 uppercase">الحد الائتماني</label><input type="number" value={card.limit} onChange={e => handleCardChange(card.id, 'limit', e.target.value)} className="input-field font-black text-blue-600 text-center" /></div>
                      <div><label className="block text-xs font-black mb-2 text-slate-500 uppercase">الرصيد المتاح</label><input type="number" value={card.availableBalance} onChange={e => handleCardChange(card.id, 'availableBalance', e.target.value)} className="input-field font-black text-emerald-600 text-center" /></div>
                    </div>
                    <div><label className="block text-xs font-black mb-2 text-slate-500 uppercase">المديونية (تلقائي)</label><input type="number" value={card.openingDebt} onChange={e => handleCardChange(card.id, 'openingDebt', e.target.value)} className="input-field font-black text-red-600 text-center" /></div>
                    <div className="bg-slate-50 dark:bg-slate-800 p-3 rounded-xl">
                      <div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-slate-500">نسبة الاستخدام</span><span className={`text-sm font-black ${debtPct > 70 ? 'text-red-600' : debtPct > 40 ? 'text-amber-600' : 'text-emerald-600'}`}>{Math.round(debtPct)}%</span></div>
                      <div className="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2 overflow-hidden"><div className={`h-full transition-all ${debtPct > 70 ? 'gradient-bg-danger' : debtPct > 40 ? 'gradient-bg-warning' : 'gradient-bg-success'}`} style={{ width: `${Math.min(100, debtPct)}%` }}></div></div>
                    </div>
                    <div className="grid grid-cols-2 gap-3 text-xs">
                      <div><label className="block text-[10px] font-bold text-slate-500 mb-1">الانتهاء</label><input type="text" value={card.expiry} onChange={e => handleCardChange(card.id, 'expiry', e.target.value)} className="input-field text-center text-sm py-2" /></div>
                      <div><label className="block text-[10px] font-bold text-slate-500 mb-1">يوم الاستحقاق</label><input type="text" value={card.dueDate} onChange={e => handleCardChange(card.id, 'dueDate', e.target.value)} className="input-field text-center text-sm py-2" /></div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="glass p-6 rounded-2xl flex flex-wrap justify-between items-center gap-4">
        <div className="flex items-center gap-3"><ShieldAlert size={20} className="text-amber-500" /><div><p className="font-black text-sm">إجراءات احتياطية</p><p className="text-xs text-slate-500 font-bold">استرجع القيم الافتراضية</p></div></div>
        <button onClick={handleReset} className="gradient-bg-warning text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 active:scale-95"><RotateCcw size={18} /> استرجاع الافتراضي</button>
      </div>
    </div>
  );
});

/* ===================== التخطيط الشهري ===================== */
const MonthlyPlanningView = memo(({ monthlyPlans, cards, loans, dispatch, saveHistory, addNotification }) => {
  const [localPlans, setLocalPlans] = useState(() => JSON.parse(JSON.stringify(monthlyPlans || {})));
  const [hasChanges, setHasChanges] = useState(false);

  useEffect(() => { setLocalPlans(JSON.parse(JSON.stringify(monthlyPlans || {}))); setHasChanges(false); }, [monthlyPlans]);
  useEffect(() => {
    const handler = (e) => { if (hasChanges) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', handler);
    return () => window.removeEventListener('beforeunload', handler);
  }, [hasChanges]);

  const planningMonths = useMemo(() => {
    return [...getMonthsForYear(2026).map(m => ({ month: m, year: 2026 })), ...getMonthsForYear(2027).slice(0, 4).map(m => ({ month: m, year: 2027 }))];
  }, []);

  const handlePlanChange = (month, field, value) => {
    setLocalPlans(prev => ({ ...prev, [month]: { ...(prev[month] || {}), [field]: value } }));
    setHasChanges(true);
  };

  const handleSave = () => {
    saveHistory();
    const cleaned = {};
    Object.entries(localPlans).forEach(([m, p]) => {
      cleaned[m] = { expectedSalary: safeNumber(p.expectedSalary), expectedRent: safeNumber(p.expectedRent), expectedCashback: safeNumber(p.expectedCashback), expectedEmakWE: safeNumber(p.expectedEmakWE), expectedZakat: safeNumber(p.expectedZakat), expectedCash: safeNumber(p.expectedCash), expectedCashExpenses: safeNumber(p.expectedCashExpenses), plannedPayments: safeNumber(p.plannedPayments), notes: p.notes || '' };
    });
    dispatch({ type: 'UPDATE_MONTHLY_PLANS', payload: cleaned });
    addNotification({ type: 'success', title: '✅ تم حفظ التخطيط' });
    setHasChanges(false);
  };

  const computed = useMemo(() => {
    const result = {};
    planningMonths.forEach(({ month }) => {
      const p = localPlans[month] || {};
      const totalIncome = safeNumber(p.expectedSalary) + safeNumber(p.expectedRent) + safeNumber(p.expectedCashback) + safeNumber(p.expectedEmakWE) + safeNumber(p.expectedZakat) + safeNumber(p.expectedCash);
      const totalOutflow = safeNumber(p.expectedCashExpenses) + safeNumber(p.plannedPayments);
      result[month] = { totalIncome, totalOutflow, net: totalIncome - totalOutflow };
    });
    return { result };
  }, [localPlans, planningMonths]);

  const handleExportCSV = () => {
    const headers = ['البند', ...planningMonths.map(m => `${m.month} ${m.year}`)];
    const rows = [
      ['راتب', ...planningMonths.map(m => safeNumber(localPlans[m.month]?.expectedSalary))],
      ['إيجار', ...planningMonths.map(m => safeNumber(localPlans[m.month]?.expectedRent))],
      ['Cash Back', ...planningMonths.map(m => safeNumber(localPlans[m.month]?.expectedCashback))],
      ['إيماك', ...planningMonths.map(m => safeNumber(localPlans[m.month]?.expectedEmakWE))],
      ['زكاة', ...planningMonths.map(m => safeNumber(localPlans[m.month]?.expectedZakat))],
      ['نقدي', ...planningMonths.map(m => safeNumber(localPlans[m.month]?.expectedCash))],
      ['إجمالي الدخل', ...planningMonths.map(m => computed.result[m.month]?.totalIncome || 0)],
      ['مصروفات', ...planningMonths.map(m => safeNumber(localPlans[m.month]?.expectedCashExpenses))],
      ['مدفوعات', ...planningMonths.map(m => safeNumber(localPlans[m.month]?.plannedPayments))],
      ['الصافي', ...planningMonths.map(m => computed.result[m.month]?.net || 0)]
    ];
    const csv = '\uFEFF' + [headers, ...rows].map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `monthly_plan_${Date.now()}.csv`; a.click();
    URL.revokeObjectURL(url);
    addNotification({ type: 'success', title: 'تم التصدير' });
  };

  return (
    <div className="space-y-8 animate-fadeIn pb-24">
      <div className="glass p-8 rounded-2xl flex justify-between items-center flex-wrap gap-4">
        <div className="flex items-center gap-4">
          <div className="gradient-bg-primary p-4 rounded-2xl text-white shadow-lg"><Table size={32} /></div>
          <div><h2 className="text-3xl font-black">التخطيط الشهري</h2><p className="text-slate-500 font-bold mt-1">خطة قابلة للتعديل</p></div>
        </div>
        <div className="flex gap-3 flex-wrap">
          <button onClick={handleExportCSV} className="bg-blue-50 dark:bg-blue-900/20 text-blue-600 px-6 py-4 rounded-2xl font-bold flex items-center gap-2 active:scale-95"><FileSpreadsheet size={20} /> تصدير CSV</button>
          {hasChanges && <button onClick={handleSave} className="gradient-bg-success text-white px-8 py-4 rounded-2xl font-black shadow-lg flex items-center gap-3 active:scale-95"><Save size={20} /> حفظ</button>}
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div className="glass p-6 rounded-2xl border-r-4 border-r-blue-500"><p className="text-[11px] font-bold text-slate-500 uppercase">إجمالي الدخل</p><p className="text-2xl font-black text-blue-600 mt-2">{fmt(planningMonths.reduce((s, { month }) => s + (computed.result[month]?.totalIncome || 0), 0))} ج.م</p></div>
        <div className="glass p-6 rounded-2xl border-r-4 border-r-red-500"><p className="text-[11px] font-bold text-slate-500 uppercase">إجمالي المصروفات</p><p className="text-2xl font-black text-red-600 mt-2">{fmt(planningMonths.reduce((s, { month }) => s + (computed.result[month]?.totalOutflow || 0), 0))} ج.م</p></div>
        <div className="glass p-6 rounded-2xl border-r-4 border-r-emerald-500"><p className="text-[11px] font-bold text-slate-500 uppercase">صافي التوفير</p><p className={`text-2xl font-black mt-2 ${planningMonths.reduce((s, { month }) => s + (computed.result[month]?.net || 0), 0) >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(planningMonths.reduce((s, { month }) => s + (computed.result[month]?.net || 0), 0))} ج.م</p></div>
      </div>

      <div className="glass rounded-2xl overflow-hidden">
        <div className="p-6 border-b bg-slate-50/50 dark:bg-slate-800/30"><h3 className="font-black text-lg flex items-center gap-3"><Calculator className="text-blue-500" /> جدول التخطيط اليدوي</h3></div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm border-collapse min-w-[800px]">
            <thead><tr>
              <th className="planning-cell-header sticky right-0 bg-slate-100 dark:bg-slate-800 z-10 min-w-[180px]">البند</th>
              {planningMonths.map(m => (<th key={`${m.month}-${m.year}`} className="planning-cell-header min-w-[130px]"><div className="text-sm">{m.month}</div><div className="text-[10px] text-slate-500 mt-0.5">{m.year}</div></th>))}
            </tr></thead>
            <tbody>
              {[
                { key: 'expectedSalary', label: 'راتب شهري', icon: TrendingUp, color: 'text-emerald-500' },
                { key: 'expectedRent', label: 'إيجار المحل', icon: StoreIcon, color: 'text-cyan-500' },
                { key: 'expectedCashback', label: 'Cash Back', icon: Zap, color: 'text-amber-500' },
                { key: 'expectedEmakWE', label: 'عهدة إيماك', icon: Users, color: 'text-purple-500' },
                { key: 'expectedZakat', label: 'زكاة إسماعيل', icon: Coins, color: 'text-teal-500' },
                { key: 'expectedCash', label: 'نقدي مرحل', icon: Wallet, color: 'text-green-500' }
              ].map(row => (
                <tr key={row.key} className="hover:bg-blue-50/30">
                  <td className="planning-cell sticky right-0 bg-white dark:bg-slate-900 z-10 text-right font-bold"><div className="flex items-center gap-2"><row.icon size={14} className={row.color} /> {row.label}</div></td>
                  {planningMonths.map(m => (<td key={`${row.key}-${m.month}`} className="planning-cell"><input type="number" className="planning-input" value={localPlans[m.month]?.[row.key] ?? ''} onChange={e => handlePlanChange(m.month, row.key, e.target.value)} /></td>))}
                </tr>
              ))}
              <tr className="bg-emerald-50 dark:bg-emerald-900/20 border-t-2 border-emerald-500"><td className="planning-cell sticky right-0 bg-emerald-50 dark:bg-emerald-900/20 z-10 text-right font-black text-emerald-700"><div className="flex items-center gap-2"><ArrowDownCircle size={16} /> إجمالي الدخل</div></td>{planningMonths.map(m => (<td key={`totalInc-${m.month}`} className="planning-cell font-black text-emerald-700">{fmt(computed.result[m.month]?.totalIncome || 0)}</td>))}</tr>
              <tr className="hover:bg-red-50/30"><td className="planning-cell sticky right-0 bg-white dark:bg-slate-900 z-10 text-right font-bold"><div className="flex items-center gap-2"><TrendingDown size={14} className="text-red-500" /> مصروفات نقدية</div></td>{planningMonths.map(m => (<td key={`cashExp-${m.month}`} className="planning-cell"><input type="number" className="planning-input" value={localPlans[m.month]?.expectedCashExpenses ?? ''} onChange={e => handlePlanChange(m.month, 'expectedCashExpenses', e.target.value)} /></td>))}</tr>
              <tr className="hover:bg-red-50/30"><td className="planning-cell sticky right-0 bg-white dark:bg-slate-900 z-10 text-right font-bold"><div className="flex items-center gap-2"><CreditCard size={14} className="text-red-600" /> مدفوعات مخططة</div></td>{planningMonths.map(m => (<td key={`planPay-${m.month}`} className="planning-cell"><input type="number" className="planning-input" value={localPlans[m.month]?.plannedPayments ?? ''} onChange={e => handlePlanChange(m.month, 'plannedPayments', e.target.value)} /></td>))}</tr>
              <tr className="bg-red-50 dark:bg-red-900/20 border-t-2 border-red-500"><td className="planning-cell sticky right-0 bg-red-50 dark:bg-red-900/20 z-10 text-right font-black text-red-700"><div className="flex items-center gap-2"><ArrowUpCircle size={16} /> إجمالي المصروف</div></td>{planningMonths.map(m => (<td key={`totalOut-${m.month}`} className="planning-cell font-black text-red-700">{fmt(computed.result[m.month]?.totalOutflow || 0)}</td>))}</tr>
              <tr className="bg-blue-50 dark:bg-blue-900/20 border-t-2"><td className="planning-cell sticky right-0 bg-white dark:bg-slate-900 z-10 text-right font-black text-slate-700"><div className="flex items-center gap-2"><Activity size={16} /> الصافي</div></td>{planningMonths.map(m => { const n = computed.result[m.month]?.net || 0; return (<td key={`net-${m.month}`} className={`planning-cell font-black ${n >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{n >= 0 ? '+' : ''}{fmt(n)}</td>); })}</tr>
              <tr className="border-t"><td className="planning-cell sticky right-0 bg-white dark:bg-slate-900 z-10 text-right font-bold text-slate-500"><div className="flex items-center gap-2"><FileText size={14} /> ملاحظات</div></td>{planningMonths.map(m => (<td key={`notes-${m.month}`} className="planning-cell"><input type="text" className="planning-input text-xs" value={localPlans[m.month]?.notes || ''} onChange={e => handlePlanChange(m.month, 'notes', e.target.value)} placeholder="..." /></td>))}</tr>
            </tbody>
          </table>
        </div>
      </div>

      <div className="glass p-6 rounded-2xl">
        <h3 className="font-black text-lg mb-4 flex items-center gap-2"><BarChart3 className="text-blue-500" /> توقعات الدخل والمصروف</h3>
        <div className="h-72">
          <ResponsiveContainer width="100%" height="100%">
            <AreaChart data={planningMonths.map(m => ({ name: `${m.month} ${m.year}`, دخل: Math.round(computed.result[m.month]?.totalIncome || 0), مصروف: Math.round(computed.result[m.month]?.totalOutflow || 0) }))}>
              <defs>
                <linearGradient id="colorIncome" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#10B981" stopOpacity={0.8}/><stop offset="95%" stopColor="#10B981" stopOpacity={0}/></linearGradient>
                <linearGradient id="colorExpense" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#EF4444" stopOpacity={0.8}/><stop offset="95%" stopColor="#EF4444" stopOpacity={0}/></linearGradient>
              </defs>
              <CartesianGrid strokeDasharray="3 3" vertical={false} opacity={0.5} />
              <XAxis dataKey="name" fontSize={11} /><YAxis fontSize={11} tickFormatter={(v) => `${(v/1000).toFixed(0)}k`} />
              <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '12px', border: 'none' }} />
              <Legend />
              <Area type="monotone" dataKey="دخل" stroke="#10B981" fillOpacity={1} fill="url(#colorIncome)" strokeWidth={2} />
              <Area type="monotone" dataKey="مصروف" stroke="#EF4444" fillOpacity={1} fill="url(#colorExpense)" strokeWidth={2} />
            </AreaChart>
          </ResponsiveContainer>
        </div>
      </div>
    </div>
  );
});

            <button onClick={() => addNotification({ type: 'success', title: 'تم الحفظ' })} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2"><Save size={16} /> حفظ</button>

          <div className="h-64">
            {(() => {
              const chartRows = transactions.filter(t => t.type === 'expense' && t.month === selectedMonth && safeNumber(t.amount) > 0 && inferKind(t) === KIND.OPERATIONAL).reduce((acc, t) => { const e = acc.find(i => i.name === t.category); if (e) e.value += safeNumber(t.amount); else acc.push({ name: t.category, value: safeNumber(t.amount) }); return acc; }, []).sort((a, b) => b.value - a.value);
              if (chartRows.length === 0) return <div className="h-full flex items-center justify-center text-slate-400 font-bold">لا توجد مصروفات تشغيلية لهذا الشهر</div>;
              const top = chartRows.slice(0, 5);
              const rest = chartRows.slice(5).reduce((s, r) => s + r.value, 0);
              if (rest > 0) top.push({ name: 'أخرى (مجمعة)', value: rest });
              return (
                <ResponsiveContainer width="100%" height="100%">
                  <PieChart>
                    <Pie data={top} cx="50%" cy="45%" innerRadius={70} outerRadius={110} paddingAngle={4} dataKey="value" cornerRadius={6}>

                    <Legend layout="vertical" verticalAlign="middle" align="right" iconType="circle" />
                  </PieChart>
                </ResponsiveContainer>
              );
            })()}
          </div>
        </div>
      </div>
    </div>
  );
});

                  <div className="text-center pl-4 border-l border-slate-200 dark:border-slate-700"><p className="text-[11px] text-slate-500 font-bold uppercase">القسط</p><p className="text-xl font-black">{fmt(loan.monthlyInstallment)}</p></div>

                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
});

                        <button type="button" aria-label="تعديل" onClick={() => dispatch({ type: 'SET_EDITING_CARD', payload: card })} className="bg-white/90 dark:bg-slate-800 p-2.5 rounded-xl shadow-xl hover:scale-110 no-print"><Edit size={18} /></button>
                      </div>
                      <div dir="ltr" className={`p-8 rounded-2xl relative overflow-hidden shadow-2xl min-h-[260px] flex flex-col justify-between ${themeCls} border`}>
                        <div className="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-[50px] -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
                        <div className="flex justify-between items-start relative z-10"><span className="font-black text-2xl uppercase">{card.bank}</span><div className="bg-white/20 backdrop-blur-md p-2.5 rounded-xl border border-white/20"><Wifi size={20} className="rotate-90" /></div></div>
                        <div className="absolute top-4 left-4 z-20 opacity-80"><BankLogo type={`${card.bank.toLowerCase()}_card`} size={40} /></div>
                        <div className="flex gap-4 items-center relative z-10 mt-4"><div className="w-12 h-9 credit-card-chip"></div><div className="text-xl font-mono tracking-[0.2em] font-bold">••••• •••• •••• {card.last4}</div></div>
                        <div className="flex justify-between items-end font-bold relative z-10 mt-4"><div className="flex flex-col"><span className="text-[9px] uppercase opacity-70">{card.name}</span><span className="font-bold text-sm tracking-widest">{card.holderName}</span></div><div className="flex flex-col items-end"><span className="text-[9px] uppercase opacity-70">Expires</span><span className="font-bold text-sm tracking-widest">{card.expiry}</span></div></div>
                      </div>
                    </div>
                    <div className="glass rounded-2xl p-4 grid grid-cols-3 gap-3">
                      <div className="text-center p-3 bg-emerald-50 dark:bg-emerald-900/20 rounded-xl"><p className="text-[10px] font-bold text-slate-600 dark:text-slate-300 uppercase">المتاح (حي)</p><p className="text-lg font-black text-emerald-600">{fmt(liveAvail)}</p></div>
                      <div className="text-center p-3 bg-red-50 dark:bg-red-900/20 rounded-xl"><p className="text-[10px] font-bold text-slate-600 dark:text-slate-300 uppercase">المديونية (حية)</p><p className="text-lg font-black text-red-600">{fmt(liveDebt)}</p></div>
                      <div className="text-center p-3 bg-blue-50 dark:bg-blue-900/20 rounded-xl"><p className="text-[10px] font-bold text-slate-600 dark:text-slate-300 uppercase">الحد</p><p className="text-lg font-black text-blue-600">{fmt(card.limit)}</p></div>
                    </div>
                    <div className="glass rounded-2xl overflow-hidden shadow-sm">
                      <table className="w-full text-right text-xs">
                        <thead className="bg-slate-50/80 dark:bg-slate-800/80"><tr><th className="p-4 text-slate-500 font-bold">الشهر</th><th className="p-4 text-red-500 font-bold">الدين</th><th className="p-4 text-amber-500 font-bold">مصاريف</th><th className="p-4 text-emerald-500 font-bold">سداد</th><th className="p-4 text-blue-500 font-bold">المتاح</th></tr></thead>
                        <tbody className="divide-y divide-slate-200 dark:divide-slate-800 font-bold">
                          {history.map((h, idx) => {
                            const isFut = getMonthIndex(h.month) > getMonthIndex(selectedMonth);
                            return (<tr key={idx} className={`${h.month === selectedMonth ? 'bg-blue-50/50 dark:bg-blue-900/20 border-r-2 border-r-blue-500' : ''} ${isFut ? 'opacity-40 grayscale' : ''}`}>
                              <td className="p-4 font-bold">{h.month}</td><td className="p-4 text-red-500">{fmt(h.openingDebt)}</td><td className="p-4 text-amber-500">{fmt(h.expenses)}</td><td className="p-4 text-emerald-500">{fmt(h.payments)}</td><td className="p-4 text-blue-500 font-black">{fmt(h.available)}</td>
                            </tr>);
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div className="relative group no-print">
          <div className="bg-gradient-to-br from-yellow-100 to-yellow-200 border border-yellow-300 p-8 rounded-2xl flex flex-col justify-between shadow-lg h-full text-yellow-900 hover-lift">
            <div className="flex justify-between items-start mb-6">
              <div className="flex items-center gap-4"><div className="bg-white p-3 rounded-2xl"><BankLogo type="fawry" size={32} /></div><div><h3 className="font-black text-2xl">محفظة فوري</h3><p className="text-sm font-bold opacity-80">مدفوعات</p></div></div>
              <div className="text-left flex flex-col items-end"><span className="block text-xs uppercase font-bold mb-1 opacity-80">الرصيد</span><span className="font-black text-4xl">{walletVisibility.fawry ? fmt(balances.fawry) : '•••••'}</span></div>
            </div>
          </div>
        </div>
        <div className="relative group no-print">
          <div className="bg-gradient-to-br from-emerald-100 to-emerald-200 border border-emerald-300 p-8 rounded-2xl flex flex-col justify-between shadow-lg h-full text-emerald-900 relative overflow-hidden hover-lift">
            <div className="absolute top-0 right-0 bg-etisalatRed w-24 h-24 rounded-bl-[4rem] z-0"></div>
            <div className="flex justify-between items-start mb-6 z-10 relative">
              <div className="flex items-center gap-4"><div className="bg-white p-3 rounded-2xl shadow-lg"><BankLogo type="etisalat" size={32} /></div><div><h3 className="font-black text-2xl">اتصالات كاش</h3><p className="text-sm font-bold opacity-80">e& wallet</p></div></div>
              <div className="text-left flex flex-col items-end z-10 relative"><span className="block text-xs uppercase font-bold mb-1 opacity-80">الرصيد</span><span className="font-black text-4xl">{walletVisibility.etisalat ? fmt(balances.etisalat) : '•••••'}</span></div>
            </div>
          </div>
        </div>
      </div>
      <GenericLedgerComponent {...lp('fawry')} />
      <GenericLedgerComponent {...lp('etisalat')} />
      <GenericLedgerComponent {...lp('cib_savings')} />
      <GenericLedgerComponent {...lp('aaib_savings')} />
    </div>
  );
});

/* ===================== المعاملات ===================== */
const TransactionsView = memo(({ groupedTransactions, transactions, selectedMonth, selectedYear, transViewMode, statusFilter, searchTerm, expandedGroup, data, monthInsights, financeSnapshot, dispatch, handleDelete, printReport, addNotification, onSelectYear, onSelectMonth, saveHistory, yearMonthKey }) => {
  const pendingGroups = groupedTransactions.map(g => ({ ...g, items: g.items.filter(t => t.status !== 'paid') })).filter(g => g.items.length > 0);
  const paidArchive = transactions.filter(t => t.month === selectedMonth && t.status === 'paid' && t.type === transViewMode).sort((a, b) => new Date(b.date) - new Date(a.date));
  const totalPending = pendingGroups.reduce((s, g) => s + g.items.length, 0);
  const monthTxCount = transactions.filter(t => t.month === selectedMonth && t.year === selectedYear).length;
  const isClosed = data.closedMonths?.includes(yearMonthKey);

  return (
    <div className="space-y-8 animate-fadeIn">
      <div className="glass p-2 rounded-2xl w-fit mx-auto mb-8 flex no-print">
        <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'expense' })} className={`px-8 md:px-12 py-4 rounded-xl font-bold transition-all flex items-center gap-3 ${transViewMode === 'expense' ? 'bg-red-50 text-red-600 dark:bg-red-900/30' : 'text-slate-500'}`}><TrendingDown size={24} /> المصروفات</button>
        <button type="button" onClick={() => dispatch({ type: 'SET_TRANS_VIEW_MODE', payload: 'income' })} className={`px-8 md:px-12 py-4 rounded-xl font-bold transition-all flex items-center gap-3 ${transViewMode === 'income' ? 'bg-emerald-50 text-emerald-600 dark:bg-emerald-900/30' : 'text-slate-500'}`}><TrendingUp size={24} /> الدخل</button>
      </div>

      <MonthSelector selectedYear={selectedYear} selectedMonth={selectedMonth} onSelectYear={onSelectYear} onSelectMonth={onSelectMonth} className="no-print" />

      <div className="glass p-4 rounded-2xl flex justify-between items-center flex-wrap gap-3">
        <div className="flex items-center gap-3 text-xs font-bold text-slate-500"><CalendarDays size={16} /> حالة: <span className="font-black text-slate-700 dark:text-slate-200">{selectedMonth} {selectedYear}</span><span className="text-slate-300">•</span><span>{monthTxCount} معاملة</span></div>
        <div className="flex gap-2 items-center flex-wrap">
          {isClosed ? (
            <>
              <div className="bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 border border-emerald-200 dark:border-emerald-700"><ShieldCheck size={14} /> مغلق</div>
              <button onClick={() => dispatch({ type: 'SHOW_CONFIRM', danger: false, title: `🔓 إعادة فتح ${selectedMonth}`, message: `سيتم إلغاء قفل الشهر — هتقدر تضيف/تعدل/تحذف معاملات من جديد.\n\nالـ snapshot محفوظ.`, onConfirm: () => { saveHistory(); dispatch({ type: 'OPEN_MONTH', payload: yearMonthKey }); addNotification({ type: 'success', title: '🔓 تم إعادة الفتح' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) })} className="bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 hover:bg-amber-200 px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 border border-amber-300 active:scale-95 transition-all no-print"><Unlock size={14} /> إعادة فتح</button>
            </>
          ) : (
            <button onClick={() => dispatch({ type: 'SHOW_CONFIRM', danger: false, title: `🔒 إقفال ${selectedMonth} ${selectedYear}`, message: `سيتم اعتماد الأرصدة الحالية لكل الحسابات وحفظ snapshot.\n\nبعد الإقفال، لن يمكن تعديل معاملات الشهر إلا بإعادة فتحه.`, onConfirm: () => { saveHistory(); const snap = {}; ACCOUNT_KEYS.forEach(k => { snap[k] = computeBalance(data, k); }); dispatch({ type: 'CLOSE_MONTH', payload: { monthKey: yearMonthKey, snapshot: snap } }); addNotification({ type: 'success', title: '✅ تم الإقفال' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) })} className="gradient-bg-warning text-white px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 no-print active:scale-95"><Lock size={14} /> اعتماد وإقفال</button>
          )}
          {monthTxCount > 0 && (
            <button onClick={() => dispatch({ type: 'SHOW_CONFIRM', danger: true, title: `🗑️ حذف كل معاملات ${selectedMonth}`, message: `⚠️ تحذير خطير!\n\nسيتم حذف ${monthTxCount} معاملة بشكل نهائي من شهر ${selectedMonth} ${selectedYear}.\n\nلا يمكن التراجع!\n\nهل أنت متأكد؟`, onConfirm: () => { saveHistory(); dispatch({ type: 'DELETE_MONTH_TRANSACTIONS', payload: { month: selectedMonth, year: selectedYear } }); addNotification({ type: 'success', title: '🗑️ تم الحذف' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) })} className="bg-red-50 dark:bg-red-900/20 hover:bg-red-100 text-red-600 dark:text-red-400 px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 border border-red-200 dark:border-red-800 active:scale-95 transition-all no-print"><Trash2 size={14} /> حذف كل معاملات الشهر</button>
          )}
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div className="glass p-5 rounded-2xl border-b-4 border-emerald-500"><p className="text-[11px] font-bold text-slate-500 uppercase mb-1">دخل تشغيلي محصل</p><p className="text-xl font-black text-emerald-600">{fmt(monthInsights.inc)}</p>{monthInsights.pendInc > 0 && <p className="text-[10px] text-amber-600 mt-1">+{fmt(monthInsights.pendInc)} معلق</p>}</div>
        <div className="glass p-5 rounded-2xl border-b-4 border-rose-500"><p className="text-[11px] font-bold text-slate-500 uppercase mb-1">مصاريف تشغيلية مدفوعة</p><p className="text-xl font-black text-rose-600">{fmt(monthInsights.exp)}</p>{monthInsights.pendExp > 0 && <p className="text-[10px] text-amber-600 mt-1">+{fmt(monthInsights.pendExp)} معلق</p>}</div>
        <div className="glass p-5 rounded-2xl border-b-4 border-blue-500"><p className="text-[11px] font-bold text-slate-500 uppercase mb-1">الصافي التشغيلي</p><p className={`text-xl font-black ${monthInsights.net >= 0 ? 'text-blue-600' : 'text-rose-500'}`}>{fmt(monthInsights.net)}</p></div>
        <div className="glass p-5 rounded-2xl border-b-4 border-purple-500 flex items-center justify-center cursor-pointer hover:bg-purple-50 dark:hover:bg-purple-900/20" onClick={() => printReport(`تقرير ${selectedMonth} ${selectedYear}`, transactions.filter(t => t.month === selectedMonth && t.year === selectedYear))}><div className="text-center"><Printer size={20} className="mx-auto text-purple-600 mb-1" /><p className="text-[11px] font-black text-purple-600">طباعة</p></div></div>
      </div>

      <div className="flex gap-2 justify-center flex-wrap px-2 mb-4 no-print">
        <button type="button" onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: 'all' })} className={`px-3 py-1.5 rounded-xl text-[11px] font-bold border flex items-center gap-1 ${statusFilter === 'all' ? 'bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-800' : 'bg-white dark:bg-slate-800'}`}><Filter size={12} /> الكل</button>
        <button type="button" onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: 'pending' })} className={`px-3 py-1.5 rounded-xl text-[11px] font-bold border flex items-center gap-1 ${statusFilter === 'pending' ? 'gradient-bg-warning text-white' : 'bg-white dark:bg-slate-800'}`}><Clock size={12} /> معلق</button>
        <button type="button" onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: 'paid' })} className={`px-3 py-1.5 rounded-xl text-[11px] font-bold border flex items-center gap-1 ${statusFilter === 'paid' ? 'gradient-bg-success text-white' : 'bg-white dark:bg-slate-800'}`}><CheckCircle2 size={12} /> مدفوع</button>
      </div>

      <div className="glass p-4 rounded-2xl no-print">
        <div className="relative">
          <Search className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400" size={20} />
          <input type="text" placeholder="🔍 ابحث..." className="w-full p-4 pr-12 bg-transparent border-0 focus:outline-none text-lg" value={searchTerm} onChange={(e) => dispatch({ type: 'SET_SEARCH_TERM', payload: e.target.value })} />
        </div>
      </div>

      <section>
        <div className="flex justify-between items-center mb-6 flex-wrap gap-3">
          <h3 className="text-orange-500 font-black flex items-center gap-3 border-r-4 border-orange-500 pr-2 text-xl"><Clock size={24} /> الالتزامات الحالية {totalPending > 0 && <span className="bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 px-3 py-1 rounded-full text-xs font-black">{totalPending} معلق</span>}</h3>
          {totalPending > 0 && (<button onClick={() => dispatch({ type: 'SHOW_CONFIRM', danger: false, title: 'اعتماد الكل', message: `سيتم اعتماد ${totalPending} عملية`, onConfirm: () => { saveHistory(); const ids = pendingGroups.flatMap(g => g.items.map(i => i.id)); dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(t => ids.includes(t.id) ? { ...t, status: 'paid' } : t) }); addNotification({ type: 'success', title: '✅ تم الاعتماد' }); }, onCancel: () => dispatch({ type: 'HIDE_CONFIRM' }) })} className="gradient-bg-success text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg flex items-center gap-2 no-print active:scale-95"><CheckCircle2 size={16} /> اعتماد الكل</button>)}
        </div>

        <div className="hidden md:block glass rounded-2xl overflow-hidden mb-12">
          <table className="w-full text-right text-sm">
            <thead className="bg-slate-50/80 dark:bg-slate-800/50"><tr><th className="p-6 text-slate-500 text-xs uppercase">حالة</th><th className="p-6 text-slate-500 text-xs uppercase">البند</th><th className="p-6 text-slate-500 text-xs uppercase text-center">العدد</th><th className="p-6 text-slate-500 text-xs uppercase text-left">المبلغ</th><th className="p-6 text-slate-500 text-xs uppercase text-center">تعديل</th></tr></thead>
            <tbody className="divide-y divide-slate-200 dark:divide-slate-800 font-bold">
              {pendingGroups.map(g => {
                const isExpanded = expandedGroup === g.category;
                return (
                  <React.Fragment key={g.category}>
                    <tr className="hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer" onClick={() => dispatch({ type: 'SET_EXPANDED_GROUP', payload: isExpanded ? null : g.category })}>
                      <td className="p-6 text-center"><div className={`p-2 rounded-full transition-transform inline-flex ${isExpanded ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-500 rotate-180' : 'bg-slate-50 dark:bg-slate-800'}`}><ChevronDown size={16} /></div></td>
                      <td className="p-6 font-bold flex items-center gap-4"><span className="p-3 rounded-2xl" style={{ backgroundColor: `${CATEGORY_COLORS[g.category]}20`, color: CATEGORY_COLORS[g.category] }}><Layers size={20} /></span>{g.category}</td>
                      <td className="p-6 text-center text-slate-500">{g.items.length}</td>
                      <td className="p-6 font-black text-left text-lg">{fmt(g.items.reduce((s, i) => s + safeNumber(i.amount), 0))}</td>
                      <td className="p-6 text-center"></td>
                    </tr>
                    {isExpanded && g.items.map(t => (
                      <tr key={t.id} className="bg-slate-50/50 dark:bg-slate-900/30 text-xs border-r-4 border-r-amber-500">
                        <td className="py-4 text-center"><button type="button" aria-label="اعتماد" onClick={(e) => { e.stopPropagation(); dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(tr => tr.id === t.id ? { ...tr, status: 'paid' } : tr) }); addNotification({ type: 'success', title: '✅ تم الاعتماد' }); }} className="flex flex-col items-center px-2 py-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 no-print active:scale-90 mx-auto"><Clock className="text-amber-500 w-6 h-6 animate-pulse" /><span className="text-[9px] font-black text-amber-600 mt-0.5">اعتماد</span></button></td>
                        <td className="pr-20 py-4 font-bold"><div className="text-slate-800 dark:text-slate-200 text-base mb-1">{t.description || 'بدون وصف'}</div><div className="flex gap-3 items-center flex-wrap"><span className="bg-white dark:bg-slate-800 px-3 py-1 border rounded-lg">{t.date}</span><span className="bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-300 px-3 py-1 rounded-lg">{PAYMENT_METHODS.find(p => p.id === t.method)?.label}</span><span className="bg-purple-50 dark:bg-purple-900/30 text-purple-600 dark:text-purple-300 px-3 py-1 rounded-lg">{KIND_LABELS[inferKind(t)]}</span></div></td>
                        <td className="py-4 text-center text-slate-500">-</td>
                        <td className="py-4 font-black text-left text-base">{fmt(t.amount)}</td>
                        <td className="py-4 text-center"><div className="flex gap-2 justify-center no-print"><button aria-label="تعديل" type="button" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="p-2 text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg"><Edit size={16} /></button><button aria-label="حذف" type="button" onClick={() => handleDelete(t.id)} className="p-2 text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg"><Trash2 size={16} /></button></div></td>
                      </tr>
                    ))}
                  </React.Fragment>
                );
              })}
              {pendingGroups.length === 0 && (<tr><td colSpan="5" className="p-8 text-center text-slate-500 font-bold">لا توجد التزامات ✅</td></tr>)}
            </tbody>
          </table>
        </div>

        <div className="block md:hidden space-y-4 p-2 pb-32">
          {pendingGroups.map(g => (
            <div key={g.category} className="space-y-2">
              <h4 className="text-[11px] font-black text-slate-500 uppercase pr-2 flex items-center gap-2"><Layers size={12} style={{ color: CATEGORY_COLORS[g.category] }} /> {g.category}</h4>
              {g.items.map(t => (
                <div key={t.id} className="glass p-4 rounded-2xl flex justify-between items-center border">
                  <div className="flex items-center gap-3 flex-1 min-w-0">
                    <button aria-label="اعتماد" onClick={() => { dispatch({ type: 'UPDATE_TRANSACTIONS', payload: transactions.map(tr => tr.id === t.id ? { ...tr, status: 'paid' } : tr) }); addNotification({ type: 'success', title: '✅ تم الاعتماد' }); }} className="p-2 rounded-xl bg-amber-50 dark:bg-amber-900/30 text-amber-600 flex-shrink-0"><Clock size={18} /></button>
                    <div className="flex-1 min-w-0">
                      <p className="font-bold text-sm truncate">{t.description || 'بدون وصف'}</p>
                      <p className="text-[10px] text-slate-500">{t.date}</p>
                    </div>
                  </div>
                  <div className="text-left flex items-center gap-2">
                    <div>
                      <p className="font-black text-base">{fmt(t.amount)}</p>
                      <div className="flex gap-1 mt-1 justify-end">
                        <button aria-label="تعديل" onClick={() => { dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="text-blue-500 p-1"><Edit size={14} /></button>
                        <button aria-label="حذف" onClick={() => handleDelete(t.id)} className="text-rose-400 p-1"><Trash2 size={14} /></button>
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          ))}
        </div>
      </section>

      {paidArchive.length > 0 && (
        <details className="group">
          <summary className="cursor-pointer list-none mb-6">
            <div className="glass p-4 rounded-2xl flex items-center justify-between"><h3 className="text-emerald-600 font-black flex items-center gap-3"><div className="bg-emerald-100 dark:bg-emerald-900/30 p-2 rounded-lg"><CheckCircle2 size={20} /></div>سجل المدفوعات ({paidArchive.length})</h3><ChevronDown className="text-slate-500 group-open:rotate-180 transition-transform" size={24} /></div>
          </summary>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {paidArchive.map(t => (

const PlannerView = memo(({ updatedLoans, cards, selectedMonth, selectedYear, totalLiquidity, monthlyPlans }) => {
  const curIdx = ALL_MONTHS.indexOf(selectedMonth);
  const months = ALL_MONTHS.slice(curIdx);
  const projection = useMemo(() => {
    let liq = totalLiquidity;
    let simLoans = JSON.parse(JSON.stringify(updatedLoans));
    let simCards = cards.map(c => ({ ...c, currentDebt: safeNumber(c.openingDebt) }));
    return months.map(month => {
      const plan = monthlyPlans?.[month] || {};
      const expectedIncome = safeNumber(plan.expectedSalary) + safeNumber(plan.expectedRent) + safeNumber(plan.expectedCashback) + safeNumber(plan.expectedEmakWE) + safeNumber(plan.expectedZakat) + safeNumber(plan.expectedCash);
      const expectedOutflow = safeNumber(plan.expectedCashExpenses) + safeNumber(plan.plannedPayments);
      simLoans = simLoans.map(l => { const p = Math.min(l.remaining, safeNumber(l.monthlyInstallment)); return { ...l, remaining: l.remaining - p }; });
      simCards = simCards.map(c => ({ ...c, currentDebt: Math.round(c.currentDebt * 0.85) }));
      const opening = liq;
      liq = opening + expectedIncome - expectedOutflow;
      return { month, opening, expectedIncome, expectedOutflow, running: liq, remainDebt: simLoans.reduce((s, l) => s + l.remaining, 0) + simCards.reduce((s, c) => s + c.currentDebt, 0), danger: liq < 0 };
    });
  }, [months, totalLiquidity, updatedLoans, cards, monthlyPlans]);

  return (

            <thead className="bg-slate-50 dark:bg-slate-800/50"><tr className="text-slate-500 font-bold"><th className="p-4">الشهر</th><th className="p-4">افتتاحي</th><th className="p-4 text-emerald-600">دخل متوقع</th><th className="p-4 text-rose-500">مصروف متوقع</th><th className="p-4">الصافي</th><th className="p-4">المديونية</th><th className="p-4 text-center">الأمان</th></tr></thead>
            <tbody className="divide-y divide-slate-200 dark:divide-slate-800">

                  <td className={`p-4 font-mono font-black ${row.danger ? 'text-red-600' : 'text-emerald-600'}`}>{fmt(row.running)}</td>
                  <td className="p-4 font-mono text-slate-600 dark:text-slate-300">{fmt(row.remainDebt)}</td>
                  <td className="p-4 text-center">{row.danger ? <span className="px-3 py-1 bg-red-100 dark:bg-red-900/30 text-red-600 rounded-lg text-[11px] font-black">عجز</span> : row.running < 10000 ? <span className="px-3 py-1 bg-amber-100 dark:bg-amber-900/30 text-amber-700 rounded-lg text-[11px] font-black">انتباه</span> : <span className="px-3 py-1 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 rounded-lg text-[11px] font-black">مستقر</span>}</td>
