                filtered.forEach(t => {
                    const key = `${Number(t.amount)}_${t.method}_${t.category}`;
                    if (!amountMap[key]) amountMap[key] = [];
                    amountMap[key].push(t);
                });
                return Object.entries(amountMap).filter(([_, items]) => items.length >= duplicateThreshold).map(([key, items]) => ({
                    key, amount: items[0].amount, count: items.length, items, category: items[0].category,
                    risk: items.length >= 5 ? 'high' : items.length >= 3 ? 'medium' : 'low'

        function dataReducer(state, action) {
            switch (action.type) {
                case 'SET_DATA': return { ...state, data: action.payload };
                case 'SET_ACTIVE_TAB': return { ...state, activeTab: action.payload };
                case 'SET_SELECTED_MONTH': return { ...state, selectedMonth: action.payload };
                case 'SET_TRANS_VIEW_MODE': return { ...state, transViewMode: action.payload };
                case 'SET_CAT_VIEW_TYPE': return { ...state, catViewType: action.payload };
                case 'SET_FORM_OPEN': return { ...state, isFormOpen: action.payload };
                case 'SET_FORM_DATA': return { ...state, formData: action.payload };
                case 'SET_FORM_MODE': return { ...state, formMode: action.payload };
                case 'SET_ACTIVE_CATEGORY_DETAIL': return { ...state, activeCategoryDetail: action.payload };
                case 'SET_REPEAT_MONTHS': return { ...state, repeatMonths: action.payload };
                case 'TOGGLE_DARK_MODE': return { ...state, isDarkMode: action.payload };
                case 'SET_EXPANDED_GROUP': return { ...state, expandedGroup: action.payload };
                case 'SET_BUDGETS': return { ...state, budgets: action.payload };
                case 'SET_EDITING_CARD': return { ...state, editingCard: action.payload };
                case 'SET_EDITING_LOAN': return { ...state, editingLoan: action.payload };
                case 'SET_SEARCH_TERM': return { ...state, searchTerm: action.payload };
                case 'SET_EDITING_BUDGET_CATEGORY': return { ...state, editingBudgetCategory: action.payload };
                case 'SET_BUDGET_AMOUNT': return { ...state, budgetAmount: action.payload };
                case 'SET_EDITING_FAWRY': return { ...state, editingFawry: action.payload };
                case 'SET_EDITING_ETISALAT': return { ...state, editingEtisalat: action.payload };
                case 'SET_RECURRING_MODAL_OPEN': return { ...state, isRecurringModalOpen: action.payload };
                case 'SET_RECURRING_FORM_DATA': return { ...state, recurringFormData: action.payload };
                case 'SET_FILTER_TYPE': return { ...state, filterType: action.payload };
                case 'SET_HIDE_PAST': return { ...state, hidePast: action.payload };
                case 'SET_AI_MODAL_OPEN': return { ...state, isAiModalOpen: action.payload };
                case 'SET_AI_TAB': return { ...state, aiTab: action.payload };
                case 'SET_AI_QUERY': return { ...state, aiQuery: action.payload };
                case 'SET_AI_RESPONSE': return { ...state, aiResponse: action.payload };
                case 'SET_AI_LOADING': return { ...state, isAiLoading: action.payload };
                case 'SET_IS_LOCKED': return { ...state, isLocked: action.payload };
                case 'ADD_NOTIFICATION': return { ...state, notifications: [...state.notifications, { id: Date.now(), ...action.payload }] };
                case 'REMOVE_NOTIFICATION': return { ...state, notifications: state.notifications.filter(n => n.id !== action.payload) };
                case 'UPDATE_TRANSACTIONS': return { ...state, data: { ...state.data, transactions: action.payload } };
                case 'UPDATE_LOANS': return { ...state, data: { ...state.data, loans: action.payload } };
                case 'UPDATE_CARDS': return { ...state, data: { ...state.data, cards: action.payload } };
                case 'UPDATE_FAWRY_DATA': return { ...state, fawryData: action.payload };
                case 'UPDATE_ETISALAT_DATA': return { ...state, etisalatData: action.payload };
                case 'UPDATE_RECURRING_ITEMS': return { ...state, data: { ...state.data, recurringItems: action.payload } };
                case 'ADD_TO_HISTORY':
                    const limitedHistory = [...state.history].slice(-19); 
                    return { ...state, history: [...limitedHistory, action.payload], future: [] };
                case 'UNDO': 
                    if (state.history.length === 0) return state;
                    const previous = state.history[state.history.length - 1];
                    return { ...state, data: previous, history: state.history.slice(0, state.history.length - 1), future: [state.data, ...state.future] };
                case 'REDO':
                    if (state.future.length === 0) return state;
                    const next = state.future[0];
                    return { ...state, data: next, history: [...state.history, state.data], future: state.future.slice(1) };
                case 'TOGGLE_LEDGER':
                    return { ...state, expandedLedgers: { ...state.expandedLedgers, [action.payload]: !state.expandedLedgers[action.payload] } };
                case 'TOGGLE_CARDS_SECTION':
                    return { ...state, expandedCardsSection: !state.expandedCardsSection };
                case 'SET_STATUS_FILTER':
                    return { ...state, statusFilter: action.payload };
                case 'UPDATE_LOAN_DUE_DATE':
                    return { ...state, data: { ...state.data, loans: state.data.loans.map(loan => loan.id === action.payload.loanId ? { ...loan, nextPaymentDate: action.payload.newDate } : loan) } };
                case 'SHOW_CONFIRM':
                    return { ...state, confirmDialog: { isOpen: true, title: action.title, message: action.message, onConfirm: action.onConfirm } };
                case 'HIDE_CONFIRM':
                    return { ...state, confirmDialog: { isOpen: false, title: '', message: '', onConfirm: null } };
                case 'SET_QUICK_TRANSFER_MODAL_OPEN':
                    return { ...state, isQuickTransferModalOpen: action.payload };
                case 'SET_QUICK_TRANSFER_DATA':
                    return { ...state, quickTransferData: { ...state.quickTransferData, ...action.payload } };
                case 'SET_BACKUP_REMINDER_OPEN': 
                    return { ...state, isBackupReminderOpen: action.payload };
                default: return state;
            }
        }

        // Login Screen with Google Auth
        const LoginScreen = ({ onLogin }) => {
            const handleGoogleLogin = () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                firebase.auth().signInWithPopup(provider).then((result) => {
                    if (result.user.email === "ahmedmkh@gmail.com") { 
                        onLogin(); 
                    } else { 
                        alert("دخول غير مصرح: يُسمح فقط بحساب ahmedmkh@gmail.com"); 
                        firebase.auth().signOut(); 
                    }
                }).catch((error) => {
                    console.error("Login Error:", error);
                    alert("حدث خطأ أثناء تسجيل الدخول: " + error.message);
                });
            };

            return (
                <div className="lock-screen bg-[radial-gradient(ellipse_at_top_left,_var(--tw-gradient-stops))] from-indigo-900 via-slate-950 to-black animate-fadeIn">
                    <div className="bg-slate-900/60 backdrop-blur-xl p-8 rounded-[3rem] border border-slate-700/50 shadow-2xl flex flex-col items-center max-w-sm w-full mx-4 relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-40 h-40 bg-blue-600/20 rounded-full blur-[80px] -translate-y-1/2 translate-x-1/2"></div>
                        <div className="absolute bottom-0 left-0 w-40 h-40 bg-emerald-600/20 rounded-full blur-[80px] translate-y-1/2 -translate-x-1/2"></div>
                        
                        <div className="w-24 h-24 bg-gradient-to-br from-blue-500/20 to-indigo-500/20 rounded-full flex items-center justify-center mb-8 shadow-glow text-blue-500 animate-bounce-slight relative z-10 backdrop-blur-sm border border-blue-500/10">
                            <ShieldCheck size={48} />
                        </div>
                        
                        <h2 className="text-3xl font-black mb-2 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent text-center relative z-10">
                            المحفظة المالية
                        </h2>
                        <p className="text-slate-400 text-sm mb-8 font-medium text-center relative z-10 opacity-80">
                            يرجى تسجيل الدخول للوصول لبياناتك
                        </p>
                        
                        <button 
                            onClick={handleGoogleLogin} 
                            className="w-full bg-white text-slate-900 py-4 px-8 rounded-2xl font-black flex items-center justify-center gap-4 hover:bg-slate-100 transition-all active:scale-95 shadow-xl shadow-white/10 relative z-10 mb-4"
                        >
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-6 h-6" alt="Google Logo" />
                            تسجيل الدخول بحساب جوجل
                        </button>
                        <p className="text-xs text-slate-500 relative z-10">محمي ومشفر بالكامل</p>
                    </div>
                </div>
            );
        };

        function App() {
            const [state, dispatch] = useReducer(dataReducer, initialState);
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [isProcessing, setIsProcessing] = useState(false);
            const [visibleTransactions, setVisibleTransactions] = useState(15);
            const [isPrivate, setIsPrivate] = useState(false);
            const mainContentRef = useRef(null);
            const saveTimeoutRef = useRef(null);

            const { data, activeTab, selectedMonth, transViewMode, catViewType, isFormOpen, formMode, formData, activeCategoryDetail, repeatMonths, isLocked, isDarkMode, expandedGroup, budgets, editingCard, editingLoan, editingTransaction, searchTerm, editingBudgetCategory, budgetAmount, editingFawry, editingEtisalat, isRecurringModalOpen, recurringFormData, filterType, hidePast, notifications, isAiModalOpen, aiTab, aiQuery, aiResponse, isAiLoading, fawryData, etisalatData, history, future, expandedLedgers, expandedCardsSection, statusFilter, confirmDialog, isQuickTransferModalOpen, quickTransferData, isBackupReminderOpen } = state;
            const { transactions = [], loans = [], cards = [], recurringItems = [], savingsGoals = [] } = data || {};

            // Auth Observer
            useEffect(() => {
                const unsubscribe = firebase.auth().onAuthStateChanged((user) => {
                    if (user && user.email === "ahmedmkh@gmail.com") { 
                        setIsAuthenticated(true); 
                    } else { 
                        setIsAuthenticated(false); 
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!isAuthenticated) return;
                const docRef = db.collection("finance_2026").doc("user_ahmed_data");
                const unsubscribe = docRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        dispatch({ type: 'SET_DATA', payload: doc.data() });
                        console.log("☁️ تم تحديث البيانات من السحابة");
                    }
                });
                return () => unsubscribe();
            }, [isAuthenticated]);

            // Debounced Save
            useEffect(() => {
                if (isAuthenticated && data && data.transactions) {
                    clearTimeout(saveTimeoutRef.current);
                    saveTimeoutRef.current = setTimeout(() => {
                        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
                        db.collection("finance_2026").doc("user_ahmed_data").set(data)
                            .catch(err => console.error("❌ فشل الحفظ في السحابة:", err));
                    }, 1500); 
                }
                return () => clearTimeout(saveTimeoutRef.current);
            }, [data, isAuthenticated]);

            // Enhanced Finance Snapshot Logic
            const financeSnapshot = useMemo(() => {
                let actualCarryover = Number(OPENING_SAVINGS_JAN || 0);
                const selectedMonthIdx = getMonthIndex(selectedMonth);
                const transferCats = ['شحن محفظة', 'تحويلات', 'شحن رصيد فوري', 'شحن رصيد', 'إيداع'];

                // 1. Carryover calculation
                transactions.filter(t => getMonthIndex(t.month) < selectedMonthIdx).forEach(t => {
                    const amt = Number(t.amount || 0);
                    if (t.type === 'income' && t.status === 'paid') {
                        actualCarryover += amt;
                    } else if (t.type === 'expense' && t.status === 'paid') {
                        if (!['cib_card', 'aaib_card'].includes(t.method) && !transferCats.includes(t.category)) {
                            actualCarryover -= amt;
                        }
                    }
                });

                const currentMonthTrans = transactions.filter(t => t.month === selectedMonth);

                // Income Logic
                const currentActualIncome = currentMonthTrans
                    .filter(t => t.type === 'income' && t.status === 'paid')
                    .reduce((s, t) => s + Number(t.amount || 0), 0);

                const currentPendingIncome = currentMonthTrans
                    .filter(t => t.type === 'income' && t.status !== 'paid')
                    .reduce((s, t) => s + Number(t.amount || 0), 0);

                // Expense Logic
                const currentPaidCash = currentMonthTrans
                    .filter(t => t.type === 'expense' && t.status === 'paid' && 
                            !['cib_card', 'aaib_card'].includes(t.method) && 
                            !transferCats.includes(t.category))
                    .reduce((s, t) => s + Number(t.amount || 0), 0);

                const currentPendingCash = currentMonthTrans
                    .filter(t => t.type === 'expense' && t.status !== 'paid' && 
                            !['cib_card', 'aaib_card'].includes(t.method))
                    .reduce((s, t) => s + Number(t.amount || 0), 0);

                const currentCreditExpenses = currentMonthTrans
                    .filter(t => t.type === 'expense' && ['cib_card', 'aaib_card'].includes(t.method))
                    .reduce((s, t) => s + Number(t.amount || 0), 0);

                // Calculations
                const actualCashInHand = actualCarryover + currentActualIncome - currentPaidCash;
                const projectedClosingBalance = actualCashInHand + currentPendingIncome - currentPendingCash;

                return { 
                    actualCarryover: actualCarryover, // ✅ أضفنا هذا السطر
                    income: currentActualIncome, 
                    actualIncome: currentActualIncome, 
                    cashExpenses: currentPaidCash,
                    creditExpenses: currentCreditExpenses,
                    pendingIncome: currentPendingIncome, 
                    actualCashInHand, 
                    projectedClosingBalance, 
                    pendingAmount: currentPendingCash
                };
            }, [transactions, selectedMonth]);
            
            const chartData = useMemo(() => MONTHS.map(m => ({
                name: m, 
                دخل: transactions.filter(t => t.month === m && t.type === 'income').reduce((a, c) => a + (Number(c.amount) || 0), 0),
                مصروف: transactions.filter(t => t.month === m && t.type === 'expense').reduce((a, c) => a + (Number(c.amount) || 0), 0)
            })), [transactions]);

            const updatedLoans = useMemo(() => {
                const map = transactions.reduce((acc, t) => {
                    if (t.linkedLoanId && (t.status === 'paid' || t.status === 'partial')) { acc[t.linkedLoanId] = (acc[t.linkedLoanId] || 0) + Number(t.amount); }
                    return acc;
                }, {});
                return loans.map(l => ({ ...l, totalPaid: (Number(l.prePaidAmount) || 0) + (map[l.id] || 0), remaining: Math.max(0, Number(l.totalAmount) - ((Number(l.prePaidAmount) || 0) + (map[l.id] || 0))) }));
            }, [transactions, loans]);

            // ✅ 1. استخراج إحصائيات الشهر المختار حصراً
            const monthInsights = useMemo(() => {
                const monthTrans = transactions.filter(t => t.month === selectedMonth);
                const inc = monthTrans.filter(t => t.type === 'income' && t.status === 'paid').reduce((s, t) => s + Number(t.amount), 0);
                const exp = monthTrans.filter(t => t.type === 'expense' && t.status === 'paid').reduce((s, t) => s + Number(t.amount), 0);
                const pendInc = monthTrans.filter(t => t.type === 'income' && t.status !== 'paid').reduce((s, t) => s + Number(t.amount), 0);
                const pendExp = monthTrans.filter(t => t.type === 'expense' && t.status !== 'paid').reduce((s, t) => s + Number(t.amount), 0);
                return { inc, exp, pendInc, pendExp, net: inc - exp };
            }, [transactions, selectedMonth]);

            const groupedTransactions = useMemo(() => { 
                const groups = {}; 
                const term = normalizeText(searchTerm);
                const selectedMonthIndex = getMonthIndex(selectedMonth);
                
                transactions.filter(t => {
                    const isMonth = getMonthIndex(t.month) === selectedMonthIndex;
                    const isType = t.type === transViewMode;
                    const isSearch = !searchTerm || 
                        normalizeText(t.description).includes(term) || 
                        normalizeText(t.category).includes(term) ||
                        normalizeText(Number(t.amount).toString()).includes(term);
                    
                    let isStatusMatch = true;
                    if (statusFilter === 'paid') isStatusMatch = t.status === 'paid';
                    else if (statusFilter === 'pending') isStatusMatch = t.status !== 'paid';

                    if (!isMonth || !isType || !isSearch || !isStatusMatch) return false;
                    if (filterType === 'all') return true;
                    if (filterType === 'high' && Number(t.amount) >= 1000) return true;
                    if (filterType === 'cib' && (t.method === 'cib_card' || t.method === 'cib_savings')) return true;
                    if (filterType === 'aaib' && (t.method === 'aaib_card' || t.method === 'aaib_savings')) return true;
                    if (t.method === filterType) return true;
                    return false; 
                }).forEach(t => { 
                    if (!groups[t.category]) groups[t.category] = { category: t.category, total: 0, count: 0, items: [] }; 
                    groups[t.category].total += Number(t.amount); 
                    groups[t.category].count++; 
                    groups[t.category].items.push(t); 
                }); 
                return Object.values(groups).sort((a, b) => b.total - a.total).slice(0, visibleTransactions); 
            }, [transactions, selectedMonth, transViewMode, searchTerm, filterType, visibleTransactions, statusFilter]);

            const visibleStats = useMemo(() => {
                const flatItems = groupedTransactions.flatMap(g => g.items);
                return { count: flatItems.length, sum: flatItems.reduce((sum, t) => sum + Number(t.amount), 0) };
            }, [groupedTransactions]);

            const fawryStats = useMemo(() => {
                const deposits = transactions.filter(t => t.method === 'fawry' && t.subType === 'deposit').reduce((sum, t) => sum + Number(t.amount), 0);
                const withdrawals = transactions.filter(t => t.method === 'fawry' && t.subType === 'withdrawal').reduce((sum, t) => sum + Number(t.amount), 0);
                return { deposits, withdrawals };
            }, [transactions]);
            const currentFawryBalance = (Number(fawryData.openingBalance) || 0) + fawryStats.deposits - fawryStats.withdrawals;

            const etisalatStats = useMemo(() => {
                const deposits = transactions.filter(t => t.method === 'etisalat' && t.subType === 'deposit').reduce((sum, t) => sum + Number(t.amount), 0);
                const withdrawals = transactions.filter(t => t.method === 'etisalat' && t.subType === 'withdrawal').reduce((sum, t) => sum + Number(t.amount), 0);
                return { deposits, withdrawals };
            }, [transactions]);
            const currentEtisalatBalance = (Number(etisalatData.openingBalance) || 0) + etisalatStats.deposits - etisalatStats.withdrawals;

            // ✅ 2. تعديل سجل حسابات التوفير (CIB / AAIB)
            const getSavingsLedger = useCallback((methodId) => {
                const accTransactions = transactions
                    .filter(t => t.method === methodId && t.status === 'paid') // ✅ فلترة: المحقق فقط
                    .sort((a, b) => new Date(a.date) - new Date(b.date));
                
                let runningBalance = 0;
                return accTransactions.map(t => {
                    const amount = Number(t.amount);
                    const isDeposit = t.subType === 'deposit' || (t.type === 'income' && !t.subType);
                    if (isDeposit) runningBalance += amount;
                    else runningBalance -= amount;
                    return { ...t, runningBalance };
                }).reverse(); 
            }, [transactions]);

            // ✅ 3. تعديل سجل فوري
            const fawryLedger = useMemo(() => {
                const accTransactions = transactions
                    .filter(t => t.method === 'fawry' && t.status === 'paid') // ✅ فلترة: المحقق فقط
                    .sort((a, b) => new Date(a.date) - new Date(b.date));
                
                let runningBalance = fawryData.openingBalance || 0;
                return accTransactions.map(t => {
                    const amount = Number(t.amount);
                    if (t.subType === 'deposit') runningBalance += amount;
                    else runningBalance -= amount;
                    return { ...t, runningBalance };
                }).reverse(); 
            }, [transactions, fawryData]);

            // ✅ 4. تعديل سجل اتصالات كاش
            const etisalatLedger = useMemo(() => {
                const accTransactions = transactions
                    .filter(t => t.method === 'etisalat' && t.status === 'paid') // ✅ فلترة: المحقق فقط
                    .sort((a, b) => new Date(a.date) - new Date(b.date));
                
                let runningBalance = etisalatData.openingBalance || 0;
                return accTransactions.map(t => {
                    const amount = Number(t.amount);
                    if (t.subType === 'deposit') runningBalance += amount;
                    else runningBalance -= amount;
                    return { ...t, runningBalance };
                }).reverse();
            }, [transactions, etisalatData]);

            const calculateCardHistory = useCallback((card) => {
                let runningDebt = Number(card.openingBalance) || 0; 
                return MONTHS.map(m => {
                    const expenses = transactions.filter(t => 
                        t.month === m && 
                        t.type === 'expense' && 
                        ((t.method === 'cib_card' && card.bank === 'CIB') || (t.method === 'aaib_card' && card.bank === 'AAIB'))
                    ).reduce((a, b) => a + Number(b.amount), 0);

                    const payments = transactions.filter(t => 
                        t.month === m && 
                        t.category === 'الالتزامات البنكية والتمويلية' && 
                        (t.linkedCardId === card.id || t.description?.includes(card.bank)) &&
                        !t.linkedLoanId 
                    ).reduce((a, b) => a + Number(b.amount), 0);
                    
                    const openingDebt = runningDebt;
                    runningDebt = runningDebt + expenses - payments; 
                    
                    return { 
                        month: m, 
                        openingDebt, 
                        expenses, 
                        payments, 
                        closingDebt: runningDebt, 
                        available: Number(card.limit) - runningDebt 
                    };
                });
            }, [transactions]);

            const getAgendaItems = useCallback(() => {
                try {
                    const today = new Date();
                    const currentDay = today.getDate();
                    const currentMonth = today.getMonth();
                    const currentYear = today.getFullYear();
                    const items = [];
                    if (Array.isArray(cards)) {
                        cards.forEach(card => {
                            const dueDay = parseInt(card.dueDate) || 5;
                            let targetMonth = currentMonth; 
                            let targetYear = currentYear;
                            if (dueDay < currentDay) { targetMonth++; if (targetMonth > 11) { targetMonth = 0; targetYear++; } }
                            const date = new Date(targetYear, targetMonth, dueDay);
                            items.push({ 
                                id: `agenda-card-${card.id}-${targetMonth}-${targetYear}`, 
                                title: `سداد بطاقة ${card.bank}`, 
                                date: date.toISOString().split('T')[0], 
                                amount: Math.max(0, card.limit - (card.openingBalance || 0)), 
                                type: 'warning', 
                                icon: CreditCard, 
                                desc: 'استحقاق دوري' 
                            });
                        });
                    }
                    if (Array.isArray(loans)) {
                        loans.forEach(loan => {
                            if (loan.monthlyInstallment > 0) {
                                const dueDay = parseInt(loan.dueDay) || 1;
                                let targetMonth = currentMonth; 
                                let targetYear = currentYear;
                                if (dueDay < currentDay) { targetMonth++; if (targetMonth > 11) { targetMonth = 0; targetYear++; } }
                                const date = new Date(targetYear, targetMonth, dueDay);
                                items.push({ 
                                    id: `agenda-loan-${loan.id}-${targetMonth}-${targetYear}`, 
                                    title: `قسط ${loan.name}`, 
                                    date: date.toISOString().split('T')[0], 
                                    amount: loan.monthlyInstallment, 
                                    type: 'danger', 
                                    icon: Banknote, 
                                    desc: loan.description 
                                });
                            }
                        });
                    }
                    return items.sort((a, b) => new Date(a.date) - new Date(b.date));
                } catch (err) { console.error("Agenda Error:", err); return []; }
            }, [cards, loans, recurringItems]);
            
            const removeNotification = useCallback((id) => { dispatch({ type: 'REMOVE_NOTIFICATION', payload: id }); }, []);
            const addNotification = useCallback((notification) => {
                const exists = notifications.some(n => n.title === notification.title && n.message === notification.message);
                if (exists) return;
                const id = Date.now() + Math.random();
                dispatch({ type: 'ADD_NOTIFICATION', payload: { id, ...notification } });
                if (!notification.persistent) setTimeout(() => removeNotification(id), 6000);
            }, [notifications, removeNotification]);

            const saveHistory = useCallback(() => { dispatch({ type: 'ADD_TO_HISTORY', payload: JSON.parse(JSON.stringify(data)) }); }, [data]);
            
            const handleSaveTransaction = useCallback((e) => {
                e.preventDefault(); setIsProcessing(true);
                setTimeout(() => {
                    saveHistory();
                    let finalSubType = formData.subType;
                    if (['شحن رصيد فوري', 'شحن رصيد', 'إيداع', 'شحن محفظة'].includes(formData.category) && 
                        ['fawry', 'etisalat', 'cib_savings', 'aaib_savings'].includes(formData.method)) {
                        finalSubType = 'deposit';
                    } else {
                        finalSubType = formData.subType || (formData.type === 'income' ? 'deposit' : 'withdrawal');
                    }

                    if (formData.type === 'expense' && finalSubType === 'withdrawal') {
                        let balance = Infinity;
                        if (formData.method === 'fawry') balance = currentFawryBalance;
                        else if (formData.method === 'etisalat') balance = currentEtisalatBalance;
                        
                        if (Number(formData.amount) > balance) {
                            dispatch({
                                type: 'SHOW_CONFIRM',
                                title: 'رصيد غير كافٍ',
                                message: `الرصيد الحالي (${balance.toLocaleString()}) غير كافٍ. هل تريد الاستمرار وترحيل الرصيد بالسالب؟`,
                                onConfirm: () => {
                                    finalizeTransaction(finalSubType);
                                }
                            });
                            setIsProcessing(false);
                            return; 
                        }
                    }
                    
                    finalizeTransaction(finalSubType);

                }, 500);

                const finalizeTransaction = (finalSubType) => {
                    const selectedDay = formData.date.split('-')[2] || '01'; 

                    const processTransaction = (m, idOverride) => {
                        const targetMonthIdx = String(getMonthIndex(m) + 1).padStart(2, '0');
                        const adjustedDate = `${CURRENT_YEAR}-${targetMonthIdx}-${selectedDay}`;

                        return {
                            ...formData, 
                            id: idOverride || getSafeId(), 
                            amount: Number(formData.amount), 
                            month: m, 
                            monthIndex: getMonthIndex(m),
                            date: adjustedDate, 
                            subType: finalSubType
                        };
                    };
                    
                    let newTransactions = [...transactions];
                    if (formMode === 'add') {
                        newTransactions.push(processTransaction(selectedMonth));
                        repeatMonths.forEach(m => { newTransactions.push(processTransaction(m)); });
                    } else {
                        newTransactions = newTransactions.map(t => t.id === formData.id ? processTransaction(formData.month, formData.id) : t);
                    }

                    if (formMode === 'add' && formData.linkedLoanId && formData.category === 'الالتزامات البنكية والتمويلية' && formData.status === 'paid') {
                        const targetLoan = loans.find(l => l.id === formData.linkedLoanId);
                        if (targetLoan && targetLoan.nextPaymentDate) {
                            const oldDate = new Date(targetLoan.nextPaymentDate);
                            const newDateObj = new Date(oldDate.setMonth(oldDate.getMonth() + 1));
                            const newDateStr = newDateObj.toISOString().split('T')[0];
                            dispatch({ type: 'UPDATE_LOAN_DUE_DATE', payload: { loanId: targetLoan.id, newDate: newDateStr } });
                        }
                    }
                    
                    newTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
                    dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTransactions });
                    dispatch({ type: 'SET_FORM_OPEN', payload: false });
                    dispatch({ type: 'SET_REPEAT_MONTHS', payload: [] });
                    setVisibleTransactions(15);
                    addNotification({ type: 'success', title: formMode === 'add' ? 'تمت الإضافة بنجاح' : 'تم التعديل بنجاح' });
                    setIsProcessing(false);
                }
            }, [formData, formMode, selectedMonth, repeatMonths, transactions, saveHistory, addNotification, currentFawryBalance, currentEtisalatBalance, loans, dispatch]);

            const handleDelete = useCallback((id) => {
                dispatch({ 
                    type: 'SHOW_CONFIRM', 
                    title: 'تأكيد الحذف', 
                    message: 'هل أنت متأكد من حذف هذه العملية نهائياً؟', 
                    onConfirm: () => { 
                        const newTransactions = transactions.filter(t => t.id !== id);
                        dispatch({ type: 'UPDATE_TRANSACTIONS', payload: newTransactions }); 
                        db.collection("finance_2026").doc("user_ahmed_data").update({
                            "transactions": newTransactions
                        }).then(() => {
                            addNotification({ type: 'success', title: 'تم الحذف نهائياً' });
                        });
                    } 
                });
            }, [transactions, dispatch, addNotification]);

            const handleQuickTransfer = useCallback((e) => {
                e.preventDefault();
                setIsProcessing(true);
                setTimeout(() => {
                    saveHistory();
                    const amount = Number(quickTransferData.amount); 
                    
                    if (amount <= 0 || isNaN(amount)) {
                        addNotification({ type: 'error', title: 'خطأ', message: 'يرجى إدخال مبلغ صحيح أكبر من صفر' });
                        setIsProcessing(false);
                        return;
                    }

                    if (quickTransferData.from === quickTransferData.to) {
                        addNotification({ type: 'error', title: 'خطأ', message: 'لا يمكن التحويل لنفس المحفظة' });
                        setIsProcessing(false);
                        return;
                    }

                    let sourceBalance = 0;
                    if (quickTransferData.from === 'fawry') {
                        sourceBalance = currentFawryBalance;
                    } else if (quickTransferData.from === 'etisalat') {
                        sourceBalance = currentEtisalatBalance;
                    } else if (quickTransferData.from === 'cash') {
                        sourceBalance = financeSnapshot.actualCashInHand; 
                    } else if (quickTransferData.from === 'cib_savings') {
                        const ledger = getSavingsLedger('cib_savings');
                        sourceBalance = ledger.length > 0 ? ledger[0].runningBalance : 0;
                    } else if (quickTransferData.from === 'aaib_savings') {
                        const ledger = getSavingsLedger('aaib_savings');
                        sourceBalance = ledger.length > 0 ? ledger[0].runningBalance : 0;
                    }

                    if (amount > sourceBalance) {
                        addNotification({ type: 'error', title: 'رصيد غير كافٍ', message: `رصيد الحساب المصدر (${sourceBalance.toLocaleString()}) لا يكفي للتحويل.` });

                        </div>
                        <div className="glass p-8 rounded-[2.5rem] h-[450px] relative overflow-hidden hover-lift bg-white/40 dark:bg-slate-900/40">

                            <div className="h-[300px]"><ResponsiveContainer width="100%" height="100%"><PieChart><Pie data={transactions.filter(t => t.type === 'expense' && t.month === selectedMonth).map((t, i, arr) => { const name = t.category; const value = arr.filter(x => x.category === name).reduce((a, b) => a + Number(b.amount), 0); return { name, value }; }).filter((v, i, a) => a.findIndex(x => x.name === v.name) === i).sort((a, b) => b.value - a.value).slice(0, 5)} cx="50%" cy="45%" innerRadius={80} outerRadius={120} paddingAngle={4} dataKey="value" cornerRadius={6}>{transactions.filter(t => t.type === 'expense' && t.month === selectedMonth).map((t, i, arr) => { const name = t.category; const value = arr.filter(x => x.category === name).reduce((a, b) => a + Number(b.amount), 0); return { name, value }; }).filter((v, i, a) => a.findIndex(x => x.name === v.name) === i).sort((a, b) => b.value - a.value).slice(0, 5).map((entry, index) => (<Cell key={`cell-${index}`} fill={CATEGORY_COLORS[entry.name] || '#9ca3af'} stroke="none" />))}</Pie><Tooltip contentStyle={{ borderRadius: '16px', border: 'none', boxShadow: '0 10px 30px -5px rgba(0,0,0,0.1)', backgroundColor: isDarkMode ? '#1e293b' : 'white' }} formatter={(value) => `${Number(value).toLocaleString()} ج.م`} /><Legend layout="vertical" verticalAlign="middle" align="right" iconType="circle" /></PieChart></ResponsiveContainer></div>
                        </div>
                    </div>

            );

                const catTotals = transactions.filter(t => t.type === catViewType && t.month === selectedMonth).reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + Number(t.amount); return acc; }, {});
                const detailedTransactions = activeCategoryDetail ? transactions.filter(t => t.category === activeCategoryDetail && t.month === selectedMonth).sort((a,b) => new Date(b.date) - new Date(a.date)) : [];

                const printGlobalData = CATEGORIES[catViewType].map(cat => ({ date: selectedMonth, category: cat, description: 'إجمالي الفئة', method: '-', amount: catTotals[cat] || 0 })).filter(i => i.amount > 0);

                                        </div>
                                        <h3 className="font-bold text-lg mb-1 dark:text-white">{cat}</h3>

                                    </div>
                                );
                            })}
                        </div>
                        {activeCategoryDetail && (
                            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[3000] backdrop-blur-xl p-4 animate-fadeIn no-print">
                                <div className="bg-white dark:bg-slate-900 w-full max-w-4xl rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-700 flex flex-col max-h-[90vh]">
                                    <div className="p-8 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/30">
                                        <div><h3 className="text-3xl font-black text-slate-800 dark:text-white flex items-center gap-4"><span className="p-3 rounded-2xl bg-white dark:bg-slate-800 shadow-sm" style={{ color: CATEGORY_COLORS[activeCategoryDetail] }}><Layers size={32} /></span>{activeCategoryDetail}</h3><p className="text-sm text-slate-500 font-bold mt-2 mr-16">تفاصيل شهر {selectedMonth}</p></div>
                                        <div className="flex gap-3"><button type="button" onClick={() => printReport(`تقرير تفصيلي - ${activeCategoryDetail} - ${selectedMonth}`, detailedTransactions)} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl flex items-center gap-2 font-bold shadow-lg shadow-blue-500/30 active:scale-95 transition-all"><Printer size={18} /> طباعة التقرير</button><button type="button" onClick={() => dispatch({ type: 'SET_ACTIVE_CATEGORY_DETAIL', payload: null })} className="bg-slate-100 hover:bg-red-50 hover:text-red-500 text-slate-500 p-3 rounded-2xl transition-colors"><X size={24} /></button></div>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-8 scroll-hide">
                                        {detailedTransactions.length === 0 ? (
                                            <div className="text-center py-20 text-slate-400 font-bold">لا توجد معاملات مسجلة لهذا البند في هذا الشهر.</div>
                                        ) : (
                                            <table className="w-full text-right border-separate border-spacing-0">

                                                    <tr>
                                                        <th className="px-6 py-4 border-b border-slate-100 dark:border-slate-800">التاريخ</th>
                                                        <th className="px-6 py-4 border-b border-slate-100 dark:border-slate-800">الوصف</th>
                                                        <th className="px-6 py-4 border-b border-slate-100 dark:border-slate-800">طريقة الدفع</th>
                                                        <th className="px-6 py-4 border-b border-slate-100 dark:border-slate-800 text-left">المبلغ</th>
                                                        <th className="px-6 py-4 border-b border-slate-100 dark:border-slate-800 text-center">إجراءات</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="text-sm font-bold">
                                                    {detailedTransactions.map((t, idx) => (
                                                        <tr key={t.id} className={`transition-colors hover:bg-blue-50 dark:hover:bg-blue-900/20 group ${idx % 2 === 0 ? 'bg-transparent' : 'bg-slate-50 dark:bg-slate-800/30'}`}>

                                                                <span className="bg-white dark:bg-slate-800 px-3 py-1 rounded-lg text-xs text-blue-600 border border-slate-200 dark:border-slate-700 shadow-sm">
                                                                    {PAYMENT_METHODS.find(p => p.id === t.method)?.label}
                                                                </span>
                                                            </td>

                                                                {isPrivate ? '****' : Number(t.amount).toLocaleString()}
                                                            </td>
                                                            <td className="px-6 py-4 text-center border-b border-slate-100 dark:border-slate-800/50">

                                                                    <button type="button" onClick={(e) => { e.stopPropagation(); dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); }} className="p-2 text-blue-500 hover:bg-blue-100 rounded-lg transition-colors" title="تعديل"><Edit size={16} /></button>

                                                            </td>

                                                    ))}
                                                </tbody>
                                            </table>
                                        )}

                                    <div className="p-8 border-t border-slate-100 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-800/50 flex justify-between items-center backdrop-blur-md"><span className="text-slate-500 text-sm font-bold bg-white dark:bg-slate-700 px-4 py-2 rounded-xl shadow-sm">عدد العمليات: {detailedTransactions.length}</span><div className="text-2xl font-black text-slate-800 dark:text-white">الإجمالي: <span className="mr-2" style={{ color: CATEGORY_COLORS[activeCategoryDetail] }}>{isPrivate ? '****' : detailedTotal.toLocaleString()} ج.م</span></div></div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // Unified Loans View
            const renderLoansView = () => {
                const getMonthlyProjection = () => {
                    const projection = {};
                    const today = new Date();
                    for(let i =0; i<12; i++) {
                        const d = new Date(today.getFullYear(), today.getMonth() + i, 1);
                        const monthKey = d.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });
                        projection[monthKey] = 0;
                        updatedLoans.forEach(loan => {
                            const monthsToFinish = Math.ceil(loan.remaining / (loan.monthlyInstallment ||1));
                            if(i < monthsToFinish && loan.monthlyInstallment > 0) {
                                projection[monthKey] += Number(loan.monthlyInstallment);
                            }
                        });
                    }
                    return projection;
                };

                const monthlyProjection = getMonthlyProjection();
                
                const totalCardDebt = cards.reduce((acc, card) => {
                    const history = calculateCardHistory(card);
                    const currentMonthDebt = history.find(h => h.month === selectedMonth)?.closingDebt || 0;
                    return acc + currentMonthDebt;
                }, 0);

                const totalLoansRemaining = updatedLoans.reduce((sum, l) => sum + l.remaining, 0);
                const grandTotalDebt = totalLoansRemaining + totalCardDebt;

                return (
                    <div className="space-y-8 animate-fadeIn pb-24">

                                    <span className="text-xl font-bold text-rose-400">{totalCardDebt.toLocaleString()}</span>
                                </div>
                            </div>

                        <details className="group glass rounded-[2rem] overflow-hidden border border-slate-200 dark:border-slate-700 shadow-sm">
                            <summary className="p-6 cursor-pointer list-none flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">

                                    <BarChart3 className="text-blue-600" size={20} />

                                <ChevronDown className="text-slate-400 group-open:rotate-180 transition-transform duration-300" />
                            </summary>
                            <div className="p-0 overflow-x-auto border-t border-slate-100 dark:border-slate-800 animate-fadeIn">

                                    <thead className="bg-slate-100 dark:bg-slate-900/50 text-slate-500">
                                        <tr>
                                            <th className="p-4">الشهر</th>

                                        {Object.entries(monthlyProjection).map(([month, amount]) => (
                                            <tr key={month} className="hover:bg-blue-50/50 dark:hover:bg-slate-800/30 transition-colors">

                                                <td className="p-4 text-left font-mono font-black text-slate-800 dark:text-white">
                                                    {amount > 0 ? `${amount.toLocaleString()} ج.م` : '-'}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </details>

                        {/* List of Loans */}
                        <div className="grid grid-cols-1 gap-6">
                            {updatedLoans.map(loan => {
                                const isPaid = loan.remaining <= 0;
                                const percentPaid = loan.totalAmount > 0 ? (loan.totalPaid / loan.totalAmount) * 100 : 0;
                                return (
                                    <div key={loan.id} className={`glass p-0 rounded-[2rem] border overflow-hidden shadow-md ${isPaid ? 'border-emerald-200 bg-emerald-50/30' : 'border-slate-200 dark:border-slate-700'}`}>

                                                </div>
                                            </div>
                                            <div className="flex items-center gap-6">
                                                <div className="text-center">
                                                    <p className="text-[10px] text-slate-400 font-bold uppercase">المتبقي</p>

                                                </div>
                                                <div className="text-center pl-4 border-l border-slate-200 dark:border-slate-700">
                                                    <p className="text-[10px] text-slate-400 font-bold uppercase">القسط</p>

                    onEdit: (id) => { },
                    onDelete: (id) => handleDelete(id),
                    onEditTransaction: (t) => { dispatch({ type: 'SET_FORM_MODE', payload: 'edit' }); dispatch({ type: 'SET_FORM_DATA', payload: t }); dispatch({ type: 'SET_FORM_OPEN', payload: true }); },
                    theme: WALLET_CONFIGS[key],

                    <div className="space-y-12 animate-fadeIn">
                        <div className="glass rounded-[2.5rem] overflow-hidden border border-slate-200 dark:border-slate-700">

                                                        <div dir="ltr" className={`p-8 rounded-[2rem] relative overflow-hidden shadow-2xl min-h-[260px] flex flex-col justify-between ${themeClass} border`}>

                                                                </div>
                                                            </div>
                                                            <div className="flex gap-4 items-center relative z-10">
                                                                <div className="w-12 h-9 credit-card-chip shadow-inner"></div>

ب</span><span className="font-bold text-lg">-{etisalatStats.withdrawals.toLocaleString()}</span></div></div></div></div>
                        </div>

                        <GenericLedgerComponent {...ledgerProps('fawry')} isPrivate={isPrivate}/>
                        <GenericLedgerComponent {...ledgerProps('etisalat')} isPrivate={isPrivate}/>

                        <GenericLedgerComponent {...ledgerProps('aaib_savings')} isPrivate={isPrivate}/>

                        </div>
                    </div>
                </div>
            );

                    ...g,

                    .filter(t => t.month === selectedMonth && t.status === 'paid' && t.type === transViewMode)

                return (

                        <div className="flex gap-2 justify-center flex-wrap px-2 mb-4 no-print">
                            <button type="button" onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: 'all' })} className={`px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all border border-slate-200 dark:border-slate-700 flex items-center gap-1 ${statusFilter === 'all' ? 'bg-slate-800 text-white shadow-md' : 'bg-white dark:bg-slate-800 text-slate-500'}`} title="عرض الكل"><Filter size={12}/> الكل</button>
                            <button type="button" onClick={() => dispatch({ type: 'SET_STATUS_FILTER', payload: 'pending' })} className={`px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all border border-slate-200 dark:border-slate-700 flex items-center gap-1 ${statusFilter === 'pending' ? 'bg-amber-500 text-white shadow-md' : 'bg-white dark:bg-slate-800 text-slate-500'}`} title="المعلق فقط"><Clock size={12}/> معلق</button>

                        </div>

                        <div className="flex gap-2 flex-wrap justify-center px-2 mb-6 no-print">
                            <button type="button" onClick={() => dispatch({ type: 'SET_FILTER_TYPE', payload: 'all' })} className={`px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all border ${filterType === 'all' ? 'bg-slate-800 text-white shadow-md scale-105' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-500'}`}>الكل</button>

                            <div className="hidden md:block glass rounded-[2rem] overflow-hidden mb-12">
