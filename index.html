/* ═══════════════ CARD STATEMENT MODAL ═══════════════ */
const CardStatementModal = memo(({ card, data, transactions, onClose, addNotification, dispatch }) => {
  const [filterType, setFilterType] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');
  const [sortBy, setSortBy] = useState('date');

  const cardMethod = getCardMethod(card);
  const subCards = Array.isArray(card.subCardLast4) ? card.subCardLast4 : [];

  const cardTx = useMemo(() => {
    if (!card) return [];
    const cutoffISO = card.openingDebtDate || card.openingDate;
    const parsed = cutoffISO ? parseISODate(cutoffISO) : null;
    const cutoffDay = parsed ? dayStart(parsed) : null;
    return (transactions || []).filter(t => {
      if (t.status !== 'paid') return false;
      if (t.source === 'carryover') return false;
      if (isCarryoverMarker(t)) return false;
      if (isHanyPurchaseTx(t) || isHanySettleTx(t)) return false;
      if (t.method === HANY_TAB_METHOD) return false;
      const d = parseISODate(t.date);
      if (!d) return false;
      if (cutoffDay && d < cutoffDay) return false;
      const hasExplicitCardLink = (t.linkedCardId !== undefined && t.linkedCardId !== null && t.linkedCardId !== '');
      if (hasExplicitCardLink) return t.linkedCardId === card.id;
      if (t.cardLast4 && subCards.includes(t.cardLast4)) return true;
      return t.method === cardMethod;
    }).sort(compareTransactions);
  }, [transactions, card, cardMethod, subCards]);

  const filteredTx = useMemo(() => {
    let arr = cardTx;
    if (filterType === 'expense') arr = arr.filter(t => t.type === 'expense' && !isCardPaymentTx(t, card.id));
    if (filterType === 'income') arr = arr.filter(t => t.type === 'income');
    if (filterType === 'payment') arr = arr.filter(t => isCardPaymentTx(t, card.id));
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.category).includes(term));
    }
    const sorted = [...arr];
    if (sortBy === 'amount') return sorted.sort((a, b) => safeNumber(b.amount) - safeNumber(a.amount));
    return sorted.sort(compareTransactions);
  }, [cardTx, filterType, searchTerm, sortBy, card]);

  const stats = useMemo(() => {
    let purchases = 0, refunds = 0, payments = 0;
    cardTx.forEach(t => {
      if (isCardPaymentTx(t, card.id)) payments += safeNumber(t.amount);
      else if (t.type === 'expense') purchases += safeNumber(t.amount);
      else if (t.type === 'income') refunds += safeNumber(t.amount);
    });
    return {
      purchases, refunds, payments,
      expenses: purchases, incomes: refunds + payments,
      total: purchases - refunds - payments, count: cardTx.length
    };
  }, [cardTx, card]);

  const dailyGroups = useMemo(() => groupTransactionsByDate(filteredTx), [filteredTx]);

  if (!card) return null;

  const liveDebt = computeCardDebt(data, card);
  const liveAvailable = Math.max(0, safeNumber(card.limit) - liveDebt);
  const usagePct = safeNumber(card.limit) > 0 ? (Math.max(0, liveDebt) / safeNumber(card.limit)) * 100 : 0;
  const isCredit = liveDebt < 0;

  return (
    <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="generic-modal max-w-3xl">
        <div className="generic-modal-header">
          <div className="flex items-center gap-2 min-w-0">
            <div className="p-2 rounded-lg flex-shrink-0 bg-indigo-50 dark:bg-indigo-950/30 text-indigo-600 dark:text-indigo-400"><CreditCard size={18} /></div>
            <div className="min-w-0">
              <h3 className="text-base font-black truncate">{card.bank} - {card.name}</h3>
              <p className="text-[11px] font-semibold" style={{ color: 'var(--text-muted)' }}>•••• {card.last4} • {stats.count} معاملة</p>
            </div>
          </div>
          <button onClick={onClose} className="btn btn-ghost p-1.5"><X size={16} /></button>
        </div>
        <div className="generic-modal-body">
          <div className="p-3 rounded-xl mb-3" style={{ background: 'var(--bg-muted)' }}>
            <div className="grid grid-cols-3 gap-2">
              <div className="text-center">
                <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>{isCredit ? 'رصيد دائن' : 'المديونية الحية'}</p>
                <p className={`text-base font-black mt-0.5 money tabular ${isCredit ? 'text-emerald-600' : 'text-red-600'}`}>
                  {isCredit ? `+${fmt(Math.abs(liveDebt))}` : fmt(liveDebt)}
                </p>
              </div>
              <div className="text-center">
                <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>المتاح</p>
                <p className="text-base font-black text-emerald-600 mt-0.5 money tabular">{fmt(liveAvailable)}</p>
              </div>
              <div className="text-center">
                <p className="text-[10px] font-bold" style={{ color: 'var(--text-muted)' }}>الحد الكلي</p>
                <p className="text-base font-black text-blue-600 mt-0.5 money tabular">{fmt(card.limit)}</p>
              </div>
            </div>
            <div className="w-full rounded-full h-1.5 overflow-hidden mt-2" style={{ background: 'var(--bg-card)' }}>
              <div className={`h-full ${usagePct > 70 ? 'bg-red-500' : usagePct > 40 ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(100, usagePct)}%` }}></div>
            </div>
          </div>

          <div className="grid grid-cols-4 gap-2 mb-3">
            <div className="p-2.5 rounded-lg bg-red-50 dark:bg-red-950/30 text-center">
              <p className="text-[10px] font-bold text-red-700 dark:text-red-400">مشتريات</p>
              <p className="text-sm font-black text-red-600 mt-0.5 money tabular">{formatAdaptive(stats.purchases)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-center">
              <p className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">مرتجعات</p>
              <p className="text-sm font-black text-emerald-600 mt-0.5 money tabular">{formatAdaptive(stats.refunds)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-purple-50 dark:bg-purple-950/30 text-center">
              <p className="text-[10px] font-bold text-purple-700 dark:text-purple-400">سدادات</p>
              <p className="text-sm font-black text-purple-600 mt-0.5 money tabular">{formatAdaptive(stats.payments)}</p>
            </div>
            <div className="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/30 text-center">
              <p className="text-[10px] font-bold text-blue-700 dark:text-blue-400">الصافي</p>
              <p className={`text-sm font-black mt-0.5 money tabular ${stats.total >= 0 ? 'text-blue-600' : 'text-emerald-600'}`}>{formatAdaptive(Math.abs(stats.total))}</p>
            </div>
          </div>

          <div className="flex gap-1.5 flex-wrap mb-3">
            <div className="relative flex-1 min-w-[140px]">
              <Search className="absolute right-2.5 top-1/2 -translate-y-1/2" size={12} style={{ color: 'var(--text-muted)' }} />
              <input type="text" placeholder="ابحث..." className="input-field pr-8 text-[11px] py-2" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
            </div>
            <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
              <button type="button" onClick={() => setFilterType('all')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'all' ? 'shadow-sm' : ''}`} style={filterType === 'all' ? { background: 'var(--bg-card)', color: 'var(--accent)' } : { color: 'var(--text-muted)' }}>الكل</button>
              <button type="button" onClick={() => setFilterType('expense')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'expense' ? 'shadow-sm' : ''}`} style={filterType === 'expense' ? { background: 'var(--bg-card)', color: 'var(--danger)' } : { color: 'var(--text-muted)' }}>مشتريات</button>
              <button type="button" onClick={() => setFilterType('payment')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'payment' ? 'shadow-sm' : ''}`} style={filterType === 'payment' ? { background: 'var(--bg-card)', color: 'var(--accent)' } : { color: 'var(--text-muted)' }}>سدادات</button>
              <button type="button" onClick={() => setFilterType('income')} className={`px-2.5 py-1.5 rounded-md text-[10px] font-bold ${filterType === 'income' ? 'shadow-sm' : ''}`} style={filterType === 'income' ? { background: 'var(--bg-card)', color: 'var(--success)' } : { color: 'var(--text-muted)' }}>مرتجعات</button>
            </div>
          </div>

          {filteredTx.length === 0 ? (
            <div className="text-center py-8">
              <CreditCard size={32} className="mx-auto mb-2" style={{ color: 'var(--text-muted)' }} />
              <p className="font-semibold text-xs" style={{ color: 'var(--text-muted)' }}>لا توجد معاملات</p>
            </div>
          ) : (
            <div className="space-y-2 max-h-[45vh] overflow-y-auto scroll-hide">
              {dailyGroups.map(group => (
                <div key={group.date}>
                  <DayGroupHeader label={group.label} total={group.total} count={group.items.length} />
                  <div className="space-y-1.5">
                    {group.items.map(t => (
                      <div key={t.id} className="flex justify-between items-center gap-2 p-2.5 rounded-lg" style={{ background: 'var(--bg-card)', border: '1px solid var(--border-subtle)' }}>
                        <div className="min-w-0 flex-1">
                          <p className="font-bold text-xs truncate flex items-center gap-1 flex-wrap">
                            {getTxDisplay(t)} <TxTimeChip createdAt={t.createdAt} />
                            <CardPaymentBadge tx={t} />
                            <SmsBadge tx={t} /> <TeldaBadge tx={t} /> <RecurringBadge tx={t} /> <ReconciliationBadge tx={t} />
                            <InstallmentBadge tx={t} />
                          </p>
                          <p className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--text-muted)' }}>
                            {t.category}{t.cardLast4 && <span className="font-mono"> • ••••{t.cardLast4}</span>}
                          </p>
                        </div>
                        <span className={`font-black text-xs flex-shrink-0 money tabular ${t.type === 'income' ? 'text-emerald-600' : isCardPaymentTx(t, card.id) ? 'text-purple-600' : 'text-red-600'}`}>
                          {t.type === 'income' ? '+' : '−'}{fmt(t.amount)}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="generic-modal-footer">
          <button onClick={() => dispatch({ type: 'SET_CARD_PAYMENT_MODAL', payload: { cardId: card.id } })} className="btn flex-1 text-sm" style={{ background: 'linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%)', color: 'white' }}>
            <Banknote size={14} /> سداد
          </button>
          <button onClick={onClose} className="btn btn-secondary flex-1 text-sm">إغلاق</button>
        </div>
      </div>
    </div>
  );
});

/* ═══════════════ FINANCIAL FORECAST VIEW ═══════════════ */
const FinancialForecastView = memo(({
  data, transactions, cards, updatedLoans, recurringItems,
  liveBalances, monthlyPlans, selectedYear, selectedMonth, liquidityDual
}) => {
  const [cardPaymentOverride, setCardPaymentOverride] = useState('');
  const [cardSpendingOverride, setCardSpendingOverride] = useState('');
  const [hanyPurchaseOverride, setHanyPurchaseOverride] = useState('');
  const [showSettings, setShowSettings] = useState(false);
  const [includePending, setIncludePending] = useState(true);
  const [includePlanned, setIncludePlanned] = useState(true);

  const todayISO = getLocalISODate();
  const currentLiquidity = liquidityDual.comprehensive;
  const currentCardDebt = useMemo(() => computeTotalCardDebtNet(data), [data]);
  const currentHanyPayable = useMemo(() => computeHanyPayable(data), [data]);

  const currentLoanDebt = useMemo(() =>
    updatedLoans.filter(l => !l.isReceivable && !l.autoGenerated).reduce((s, l) => s + l.remaining, 0)
  , [updatedLoans]);

  const autoAverages = useMemo(() => {
    const cardPay = computeMonthlyAverage(transactions, selectedYear, selectedMonth, 3, (t) => classifyFlow(t) === FLOW.CARD_PAYMENT || classifyFlow(t) === FLOW.LOAN_INSTALLMENT);
    const cardSpend = computeMonthlyAverage(transactions, selectedYear, selectedMonth, 3, (t) => classifyFlow(t) === FLOW.CARD_SPENDING);
    const hanyPurchase = computeMonthlyAverage(transactions, selectedYear, selectedMonth, 3, (t) => classifyFlow(t) === FLOW.HANY_PURCHASE);
    const hanySettle = computeMonthlyAverage(transactions, selectedYear, selectedMonth, 3, (t) => classifyFlow(t) === FLOW.HANY_SETTLE);
    return { payment: Math.round(cardPay), spending: Math.round(cardSpend), hanyPurchase: Math.round(hanyPurchase), hanySettle: Math.round(hanySettle) };
  }, [transactions, selectedYear, selectedMonth]);

  const baseCardPayment = cardPaymentOverride !== '' ? parseNumberInput(cardPaymentOverride) : autoAverages.payment;
  const baseCardSpending = cardSpendingOverride !== '' ? parseNumberInput(cardSpendingOverride) : autoAverages.spending;
  const baseHanyPurchase = hanyPurchaseOverride !== '' ? parseNumberInput(hanyPurchaseOverride) : autoAverages.hanyPurchase;

  const activeLoanInstallments = useMemo(() =>
    updatedLoans.filter(l => !l.isReceivable && !l.autoGenerated && safeNumber(l.monthlyInstallment) > 0 && l.remaining > 0).reduce((s, l) => s + safeNumber(l.monthlyInstallment), 0)
  , [updatedLoans]);

  const recurringAgg = useMemo(() => {
    const active = (recurringItems || []).filter(r => r.active !== false && !r.linkedLoanSystemId);
    const income = active.filter(r => r.type === 'income').reduce((s, r) => s + safeNumber(r.amount), 0);
    const cashExpense = active.filter(r => r.type === 'expense' && !CREDIT_CARD_METHOD_IDS.includes(r.method) && !isHanyShopCategory(r.category)).reduce((s, r) => s + safeNumber(r.amount), 0);
    const cardSpend = active.filter(r => r.type === 'expense' && CREDIT_CARD_METHOD_IDS.includes(r.method)).reduce((s, r) => s + safeNumber(r.amount), 0);
    return { income, cashExpense, cardSpend };
  }, [recurringItems]);

  const forecast = useMemo(() => {
    const months = [];
    let liq = currentLiquidity;
    let cardDebt = currentCardDebt;
    let loanDebt = currentLoanDebt;
    let hanyPayable = currentHanyPayable;

    for (let i = 0; i < 6; i++) {
      const { year, month } = addMonthsToYM(selectedYear, selectedMonth, i);
      if (getMonthIndex(month) < 0) continue;

      const monthKey = makeMonthKey(year, month);
      const p = monthlyPlans?.[monthKey] || {};
      const flows = computeMonthlyFlows(transactions, year, month);

      let inc, cashExp, cardSpend, cardPay, loanInst, hanyPurchase, hanySettle;

      if (i === 0) {
        const futurePaidTxs = flows.monthTxs.filter(t => t.status === 'paid' && t.date > todayISO && !isCarryoverMarker(t));
        const futurePaidFlows = futurePaidTxs.reduce((acc, t) => {
          const kind = classifyFlow(t);
          const amt = safeNumber(t.amount);
          if (kind === FLOW.INCOME) acc.income += amt;
          if (kind === FLOW.CASH_EXPENSE) acc.cashExpense += amt;
          if (kind === FLOW.CARD_SPENDING) acc.cardSpending += amt;
          if (kind === FLOW.CARD_PAYMENT) acc.cardPayment += amt;
          if (kind === FLOW.LOAN_INSTALLMENT) acc.loanInstallment += amt;
          if (kind === FLOW.HANY_PURCHASE) acc.hanyPurchase += amt;
          if (kind === FLOW.HANY_SETTLE) acc.hanySettle += amt;
          return acc;
        }, { income: 0, cashExpense: 0, cardSpending: 0, cardPayment: 0, loanInstallment: 0, hanyPurchase: 0, hanySettle: 0 });

        const usePend = includePending;
        inc = futurePaidFlows.income + (usePend ? flows.pendingIncome : 0);
        cashExp = futurePaidFlows.cashExpense + (usePend ? flows.pendingCashExpense : 0);
        cardSpend = futurePaidFlows.cardSpending + (usePend ? flows.pendingCardSpending : 0);
        cardPay = futurePaidFlows.cardPayment + (usePend ? flows.pendingCardPayment : 0);
        loanInst = futurePaidFlows.loanInstallment + (usePend ? flows.pendingLoanInstallment : 0);
        hanyPurchase = futurePaidFlows.hanyPurchase + (usePend ? flows.pendingHanyPurchase : 0);
        hanySettle = futurePaidFlows.hanySettle + (usePend ? flows.pendingHanySettle : 0);

        if (cardPay < 0.01 && cardDebt > 0 && baseCardPayment > 0) cardPay = Math.min(baseCardPayment, cardDebt);
        if (cardSpend < 0.01 && cardDebt > 0 && baseCardSpending > 0) cardSpend = baseCardSpending;
        if (loanInst < 0.01 && activeLoanInstallments > 0) loanInst = Math.min(activeLoanInstallments, loanDebt);
        if (hanyPurchase < 0.01 && baseHanyPurchase > 0) hanyPurchase = baseHanyPurchase;
        if (hanySettle < 0.01 && hanyPayable > 0 && autoAverages.hanySettle > 0) hanySettle = Math.min(autoAverages.hanySettle, hanyPayable);
      } else {
        const plannedIncome = safeNumber(p.expectedSalary) + safeNumber(p.expectedRent) + safeNumber(p.expectedCashback) + safeNumber(p.expectedEmakWE) + safeNumber(p.expectedZakat) + safeNumber(p.expectedCash);
        const plannedCashExp = safeNumber(p.expectedCashExpenses);
        inc = flows.pendingIncome > 0.01 ? flows.pendingIncome : (includePlanned ? (plannedIncome > 0 ? plannedIncome : recurringAgg.income) : recurringAgg.income);
        cashExp = flows.pendingCashExpense > 0.01 ? flows.pendingCashExpense : (includePlanned ? (plannedCashExp > 0 ? plannedCashExp : recurringAgg.cashExpense) : recurringAgg.cashExpense);
        cardSpend = flows.pendingCardSpending > 0.01 ? flows.pendingCardSpending : recurringAgg.cardSpend;
        cardPay = flows.pendingCardPayment || baseCardPayment;
        loanInst = flows.pendingLoanInstallment || activeLoanInstallments;
        const plannedHanyP = safeNumber(p.expectedHanyPurchases);
        hanyPurchase = flows.pendingHanyPurchase > 0.01 ? flows.pendingHanyPurchase : (plannedHanyP > 0 ? plannedHanyP : baseHanyPurchase);
        hanySettle = flows.pendingHanySettle > 0.01 ? flows.pendingHanySettle : (autoAverages.hanySettle > 0 ? Math.min(autoAverages.hanySettle, hanyPayable + hanyPurchase) : 0);
      }

      const effCardPay = Math.min(Math.max(0, cardPay), Math.max(0, cardDebt));
      const effLoanInst = Math.min(Math.max(0, loanInst), Math.max(0, loanDebt));
      const effHanySettle = Math.min(Math.max(0, hanySettle), Math.max(0, hanyPayable + hanyPurchase));

      const newCardDebt = Math.max(0, cardDebt + cardSpend - effCardPay);
      const newLoanDebt = Math.max(0, loanDebt - effLoanInst);
      const newHanyPayable = Math.max(0, hanyPayable + hanyPurchase - effHanySettle);

      const netCashFlow = inc - cashExp - effCardPay - effLoanInst - effHanySettle;
      const newLiquidity = liq + netCashFlow;

      const totalDebt = newCardDebt + newLoanDebt + newHanyPayable;
      const netPosition = newLiquidity - totalDebt;
      const pendingCount = flows.monthTxs.filter(t => t.status !== 'paid' && !isCarryoverMarker(t)).length;

      months.push({
        month, year, isCurrent: i === 0,
        income: inc, cashExpense: cashExp, cardSpending: cardSpend, cardPayment: effCardPay,
        loanInstallment: effLoanInst, hanyPurchase, hanySettle: effHanySettle,
        netCashFlow, pendingCount,
        endLiquidity: newLiquidity, endCardDebt: newCardDebt, endLoanDebt: newLoanDebt,
        endHanyPayable: newHanyPayable, totalDebt, netPosition
      });

      liq = newLiquidity;
      cardDebt = newCardDebt;
      loanDebt = newLoanDebt;
      hanyPayable = newHanyPayable;
    }
    return months;
  }, [transactions, selectedMonth, selectedYear, monthlyPlans, currentLiquidity, currentCardDebt, currentLoanDebt, currentHanyPayable, baseCardPayment, baseCardSpending, baseHanyPurchase, autoAverages.hanySettle, recurringAgg, activeLoanInstallments, includePending, includePlanned, todayISO]);

  const chartData = forecast.map(f => ({
    name: f.month.slice(0, 3),
    'السيولة': Math.round(f.endLiquidity),
    'المديونية': Math.round(f.totalDebt),
    'صافي المركز': Math.round(f.netPosition)
  }));

  const alerts = useMemo(() => {
    const list = [];
    let warnedNeg = false;
    forecast.forEach(f => {
      if (f.endLiquidity < 0 && !warnedNeg) {
        list.push({ type: 'danger', title: `⚠️ سيولة سلبية متوقعة في ${f.month} ${f.year}`, message: `السيولة هتبقى ${fmt(f.endLiquidity)} ج.م` });
        warnedNeg = true;
      }
    });
    const last = forecast[forecast.length - 1];
    if (last && last.netPosition < 0) {
      list.push({ type: 'warning', title: `📉 صافي المركز سالب بعد 6 شهور`, message: `في ${last.month} ${last.year}: ${fmt(last.netPosition)} ج.م` });
    }
    return list;
  }, [forecast]);

  const minLiq = forecast.length > 0 ? Math.min(...forecast.map(f => f.endLiquidity)) : 0;

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex justify-between items-start gap-3 flex-wrap">
          <div>
            <h2 className="text-base font-black flex items-center gap-2">
              <TrendingUp size={16} className="text-[color:var(--accent)]" /> التنبؤ المالي الشامل — 6 شهور
            </h2>
            <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>V88.1.1 · بدون ازدواج · شامل دفتر هاني</p>
          </div>
          <button onClick={() => setShowSettings(!showSettings)} className={`btn text-xs ${showSettings ? 'btn-primary' : 'btn-secondary'}`}><Sliders size={12} /> إعدادات</button>
        </div>

        {showSettings && (
          <div className="mt-3 pt-3 space-y-3 animate-fadeIn" style={{ borderTop: '1px solid var(--border-subtle)' }}>
            <label className="flex items-center gap-3 p-2.5 rounded-lg cursor-pointer" style={{ background: 'var(--bg-muted)' }}>
              <input type="checkbox" checked={includePending} onChange={e => setIncludePending(e.target.checked)} className="w-4 h-4 accent-[color:var(--accent)]" />
              <div className="flex-1"><p className="text-xs font-black">اعتبر المعلقات كتدفقات قادمة</p></div>
            </label>
            <label className="flex items-center gap-3 p-2.5 rounded-lg cursor-pointer" style={{ background: 'var(--bg-muted)' }}>
              <input type="checkbox" checked={includePlanned} onChange={e => setIncludePlanned(e.target.checked)} className="w-4 h-4 accent-[color:var(--accent)]" />
              <div className="flex-1"><p className="text-xs font-black">استخدم الخطة الشهرية</p></div>
            </label>
            <div className="grid grid-cols-3 gap-2">
              <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>سداد البطاقة</label><input type="text" inputMode="decimal" className="input-field input-num text-sm text-center font-bold" value={cardPaymentOverride} onChange={e => setCardPaymentOverride(e.target.value)} placeholder={`تلقائي: ${fmt(autoAverages.payment)}`} /></div>
              <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>مشتريات البطاقة</label><input type="text" inputMode="decimal" className="input-field input-num text-sm text-center font-bold" value={cardSpendingOverride} onChange={e => setCardSpendingOverride(e.target.value)} placeholder={`تلقائي: ${fmt(autoAverages.spending)}`} /></div>
              <div><label className="text-[11px] font-bold block mb-1" style={{ color: 'var(--text-muted)' }}>مشتريات هاني</label><input type="text" inputMode="decimal" className="input-field input-num text-sm text-center font-bold" value={hanyPurchaseOverride} onChange={e => setHanyPurchaseOverride(e.target.value)} placeholder={`تلقائي: ${fmt(autoAverages.hanyPurchase)}`} /></div>
            </div>
          </div>
        )}
      </div>

      {alerts.map((a, i) => (
        <div key={i} className="card" style={{ background: a.type === 'danger' ? 'var(--danger-soft)' : 'var(--warning-soft)', borderColor: a.type === 'danger' ? 'var(--danger)' : 'var(--warning)' }}>
          <p className={`text-xs font-black ${a.type === 'danger' ? 'text-red-700 dark:text-red-400' : 'text-amber-700 dark:text-amber-400'}`}>{a.title}</p>
          <p className="text-[11px] mt-1" style={{ color: 'var(--text-secondary)' }}>{a.message}</p>
        </div>
      ))}

      <div className="grid grid-cols-4 gap-2">
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>سيولة الآن</p>
          <p className="text-base font-black text-emerald-600 money tabular">{formatAdaptive(currentLiquidity)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>مديونية الآن</p>
          <p className="text-base font-black text-red-600 money tabular">{formatAdaptive(currentCardDebt + currentLoanDebt)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>دفتر هاني</p>
          <p className="text-base font-black text-orange-600 money tabular">{formatAdaptive(currentHanyPayable)}</p>
        </div>
        <div className="stat-card">
          <p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>أدنى سيولة</p>

        </div>
      </div>

      <div className="card">
        <h3 className="font-bold text-xs mb-3" style={{ color: 'var(--text-secondary)' }}>📈 التطور المتوقع — 6 شهور</h3>
        <div className="h-72">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={chartData}>
              <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="currentColor" opacity={0.06} />
              <XAxis dataKey="name" fontSize={10} stroke="#94A3B8" />
              <YAxis fontSize={10} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} stroke="#94A3B8" />
              <Tooltip formatter={(v) => `${fmt(v)} ج.م`} contentStyle={{ borderRadius: '12px', border: '1px solid var(--border-subtle)', fontFamily: 'Cairo', fontSize: '12px' }} />
              <Legend wrapperStyle={{ fontSize: '11px', fontWeight: 'bold' }} />
              <Bar dataKey="السيولة" fill="#00A86B" radius={[4, 4, 0, 0]} barSize={18} />
              <Bar dataKey="المديونية" fill="#DC2626" radius={[4, 4, 0, 0]} barSize={18} />
              <Bar dataKey="صافي المركز" fill="#635BFF" radius={[4, 4, 0, 0]} barSize={18} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="space-y-3">
        <h3 className="font-black text-sm">📋 التفاصيل الشهرية</h3>
        {forecast.map((f, i) => (
          <div key={i} className="card">
            <div className="flex justify-between items-center mb-3 flex-wrap gap-2">
              <h4 className="font-black text-sm flex items-center gap-1.5">
                {f.month} {f.year}
                {f.isCurrent && <span className="badge badge-accent text-[9px]">الحالي</span>}
              </h4>
              <div className="flex gap-1.5 flex-wrap">
                {f.pendingCount > 0 && <span className="badge badge-warning text-[9px]">⏳ {f.pendingCount} معلق</span>}
                <span className={`badge text-[9px] ${f.netCashFlow >= 0 ? 'badge-success' : 'badge-danger'}`}>{f.netCashFlow >= 0 ? '+' : ''}{fmtShort(f.netCashFlow)} صافي التدفق</span>
              </div>
            </div>
            <div className="grid grid-cols-3 gap-2 mb-3">
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}><p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>💰 دخل</p><p className="text-sm font-black text-emerald-600 money tabular">{fmt(f.income)}</p></div>
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}><p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>💸 كاش</p><p className="text-sm font-black text-red-600 money tabular">{fmt(f.cashExpense)}</p></div>
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}><p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>💳 مشتريات بطاقة</p><p className="text-sm font-black text-amber-600 money tabular">{fmt(f.cardSpending)}</p></div>
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}><p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>💵 سداد بطاقة</p><p className="text-sm font-black text-blue-600 money tabular">{fmt(f.cardPayment)}</p></div>
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}><p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>🏦 قروض</p><p className="text-sm font-black text-orange-600 money tabular">{fmt(f.loanInstallment)}</p></div>
              <div className="p-2 rounded-lg" style={{ background: 'var(--bg-muted)' }}><p className="text-[9px] font-bold mb-0.5" style={{ color: 'var(--text-muted)' }}>🛒 هاني</p><p className="text-sm font-black text-orange-600 money tabular">{fmt(f.hanyPurchase)} / {fmt(f.hanySettle)}</p></div>
            </div>
            <div className="pt-3 space-y-1.5" style={{ borderTop: '1px dashed var(--border-default)' }}>
              <div className="flex justify-between items-center"><span className="text-[11px] font-bold" style={{ color: 'var(--text-secondary)' }}>سيولة نهاية الشهر</span><span className={`font-black text-sm money tabular ${f.endLiquidity >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(f.endLiquidity)}</span></div>
              <div className="flex justify-between items-center"><span className="text-[11px] font-bold" style={{ color: 'var(--text-secondary)' }}>مديونية بطاقات</span><span className="font-black text-sm text-red-600 money tabular">{fmt(f.endCardDebt)}</span></div>
              <div className="flex justify-between items-center"><span className="text-[11px] font-bold" style={{ color: 'var(--text-secondary)' }}>مديونية قروض</span><span className="font-black text-sm text-red-600 money tabular">{fmt(f.endLoanDebt)}</span></div>
              {f.endHanyPayable > 0.5 && (<div className="flex justify-between items-center"><span className="text-[11px] font-bold" style={{ color: 'var(--text-secondary)' }}>رصيد هاني</span><span className="font-black text-sm text-orange-600 money tabular">{fmt(f.endHanyPayable)}</span></div>)}
              <div className="flex justify-between items-center pt-1.5" style={{ borderTop: '1px solid var(--border-subtle)' }}>

            </div>

        ))}

});

/* ═══════════════ CALENDAR VIEW ═══════════════ */
const CalendarView = memo(({ data, getAgendaItems, dispatch, saveHistory, addNotification }) => {
  const today = new Date();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [selectedDayDetails, setSelectedDayDetails] = useState(null);

  const agendaItems = useMemo(() => getAgendaItems(viewYear, ALL_MONTHS[viewMonth]), [getAgendaItems, viewYear, viewMonth]);

  const itemsByDay = useMemo(() => {
    const map = {};
    agendaItems.forEach(item => {
      const d = parseISODate(item.date);
      if (!d) return;
      if (d.getFullYear() !== viewYear || d.getMonth() !== viewMonth) return;
      const day = d.getDate();
      if (!map[day]) map[day] = [];
      map[day].push(item);
    });
    return map;
  }, [agendaItems, viewYear, viewMonth]);

  const monthName = ALL_MONTHS[viewMonth];
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  const navigate = (delta) => {
    let m = viewMonth + delta;
    let y = viewYear;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    setViewMonth(m); setViewYear(y);
  };

  const dayNames = ['أحد', 'إثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];
  const emptyCells = Array.from({ length: firstDay }, (_, i) => i);
  const dayCells = Array.from({ length: daysInMonth }, (_, i) => i + 1);
  const isToday = (day) => today.getFullYear() === viewYear && today.getMonth() === viewMonth && today.getDate() === day;

  return (
    <div className="space-y-4 animate-fadeIn pb-24">
      <div className="card">
        <div className="flex items-center justify-between mb-3">
          <button type="button" onClick={() => navigate(-1)} className="btn btn-ghost p-2"><ArrowRight size={16} /></button>
          <h2 className="text-base font-black flex items-center gap-2"><CalendarDays size={16} className="text-[color:var(--accent)]" /> {monthName} {viewYear}</h2>
          <button type="button" onClick={() => navigate(1)} className="btn btn-ghost p-2"><ArrowRight size={16} className="rotate-180" /></button>
        </div>
        <div className="grid grid-cols-7 gap-1 mb-2">
          {dayNames.map(d => (<div key={d} className="text-center text-[10px] font-black py-1" style={{ color: 'var(--text-muted)' }}>{d}</div>))}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {emptyCells.map(i => <div key={`e-${i}`} />)}
          {dayCells.map(day => {
            const items = itemsByDay[day] || [];
            const hasItems = items.length > 0;
            const totalAmount = items.reduce((s, it) => s + safeNumber(it.amount), 0);
            return (
              <button key={day} type="button" onClick={() => hasItems && setSelectedDayDetails({ day, items })}
                className={`h-14 rounded-lg p-1 flex flex-col items-center justify-center transition-all relative ${isToday(day) ? 'ring-2 ring-[color:var(--accent)]' : ''} ${hasItems ? 'cursor-pointer hover:ring-2 hover:ring-[color:var(--accent)]/50' : 'cursor-default'}`}
                style={{ background: hasItems ? 'var(--accent-soft)' : 'var(--bg-muted)', color: hasItems ? 'var(--accent)' : 'var(--text-secondary)' }}>
                <span className={`text-[11px] font-black ${isToday(day) ? 'text-[color:var(--accent)]' : ''}`}>{day}</span>
                {hasItems && (
                  <React.Fragment>
                    <span className="text-[8px] font-black mt-0.5">{items.length} التزام</span>
                    <span className="text-[7px] font-bold opacity-70 money tabular">{fmt(totalAmount).slice(0, 5)}</span>
                  </React.Fragment>
                )}
              </button>
            );
          })}
        </div>
      </div>
      <div className="card">
        <h3 className="font-black text-sm flex items-center gap-2 mb-3"><Bell size={14} className="text-amber-500" /> الأجندة ({agendaItems.length})</h3>
        {agendaItems.length === 0 ? (
          <p className="text-center py-6 text-xs font-semibold" style={{ color: 'var(--text-muted)' }}>لا توجد التزامات قادمة</p>
        ) : (
          <div className="space-y-2 max-h-[60vh] overflow-y-auto scroll-hide">
            {agendaItems.map(item => {
              const Icon = item.icon || Calendar;
              const typeCls = item.type === 'danger' ? 'text-red-600 bg-red-50 dark:bg-red-950/30' : item.type === 'warning' ? 'text-amber-600 bg-amber-50 dark:bg-amber-950/30' : item.type === 'success' ? 'text-emerald-600 bg-emerald-50 dark:bg-emerald-950/30' : 'text-blue-600 bg-blue-50 dark:bg-blue-950/30';
              const daysLeft = calculateDaysLeft(item.date);
              return (
                <div key={item.id} className="flex items-center gap-3 p-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className={`p-2 rounded-lg flex-shrink-0 ${typeCls}`}><Icon size={14} /></div>
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-xs truncate">{item.title}</p>
                    <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>
                      {item.date} • {item.desc || ''}
                      {daysLeft !== null && (
                        <span className={`mr-2 font-black ${daysLeft < 0 ? 'text-red-500' : daysLeft <= 3 ? 'text-amber-600' : ''}`}>
                          {daysLeft < 0 ? `متأخر ${Math.abs(daysLeft)} يوم` : daysLeft === 0 ? 'اليوم' : daysLeft === 1 ? 'غداً' : `بعد ${daysLeft} يوم`}
                        </span>
                      )}
                    </p>
                  </div>
                  <span className={`font-black text-sm flex-shrink-0 money tabular ${item.type === 'success' ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(item.amount)}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>
      {selectedDayDetails && (
        <div className="modal-backdrop no-print" onClick={(e) => { if (e.target === e.currentTarget) setSelectedDayDetails(null); }}>
          <div className="generic-modal max-w-md">
            <div className="generic-modal-header">
              <h3 className="text-base font-black flex items-center gap-2"><Calendar size={16} className="text-[color:var(--accent)]" /> تفاصيل يوم {selectedDayDetails.day} {monthName} {viewYear}</h3>
              <button onClick={() => setSelectedDayDetails(null)} className="btn btn-ghost p-1.5"><X size={16} /></button>
            </div>
            <div className="generic-modal-body space-y-2">
              {selectedDayDetails.items.map(item => {
                const Icon = item.icon || Calendar;
                const typeCls = item.type === 'danger' ? 'text-red-600 bg-red-50 dark:bg-red-950/30' : item.type === 'warning' ? 'text-amber-600 bg-amber-50 dark:bg-amber-950/30' : item.type === 'success' ? 'text-emerald-600 bg-emerald-50 dark:bg-emerald-950/30' : 'text-blue-600 bg-blue-50 dark:bg-blue-950/30';
                return (
                  <div key={item.id} className="flex items-center gap-3 p-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                    <div className={`p-2 rounded-lg flex-shrink-0 ${typeCls}`}><Icon size={14} /></div>
                    <div className="flex-1 min-w-0">
                      <p className="font-bold text-xs truncate">{item.title}</p>
                      <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{item.desc || ''}</p>
                    </div>
                    <span className={`font-black text-sm flex-shrink-0 money tabular ${item.type === 'success' ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(item.amount)}</span>
                  </div>
                );
              })}
            </div>
            <div className="generic-modal-footer">
              <button onClick={() => setSelectedDayDetails(null)} className="btn btn-secondary flex-1 text-sm">إغلاق</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
});

/* ═══════════════ EXTERNAL TRANSFER MODAL ═══════════════ */

  const [fromMethod, setFromMethod] = useState('cib_savings');
  const [amount, setAmount] = useState('');
  const [recipientName, setRecipientName] = useState('');
  const [recipientAccount, setRecipientAccount] = useState('');
  const [date, setDate] = useState(getLocalISODate());
  const [note, setNote] = useState('');
  const [withFee, setWithFee] = useState(false);
  const [feeAmount, setFeeAmount] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const liveBalances = useMemo(() => computeBalancesAsOf(data), [data]);
  const sourceBalance = safeNumber(liveBalances[fromMethod]);
  const parsedAmount = parseNumberInput(amount);
  const parsedFee = withFee ? parseNumberInput(feeAmount) : 0;
  const totalDebit = parsedAmount + parsedFee;
  const canSubmit = parsedAmount > 0 && recipientName.trim().length >= 2 && sourceBalance >= totalDebit - 0.005;

  const quickRecipients = [
    { name: 'تحويل خارجي', val: 'تحويل خارجي' },
    { name: 'Telda', val: 'Telda' },
    { name: 'فودافون كاش', val: 'Vodafone Cash' }
  ];

  const handleSubmit = () => {
    if (!canSubmit || submitting) return;
    const d = parseISODate(date);
    if (!d) { addNotification({ type: 'error', title: 'تاريخ غير صحيح' }); return; }
    const txYear = d.getFullYear();
    const txMonth = ALL_MONTHS[d.getMonth()];
    if (isMonthClosed(data, txYear, txMonth)) { addNotification({ type: 'error', title: 'شهر مغلق', duration: 6000 }); return; }

    setSubmitting(true);
    saveHistory();
    const finalNote = note.trim() || `تحويل إلى ${recipientName}${recipientAccount ? ` - ${recipientAccount}` : ''}`;
    dispatch({
      type: 'EXTERNAL_TRANSFER',
      payload: { fromMethod, amount: parsedAmount, recipientName: recipientName.trim(), date, note: finalNote, withFee, feeAmount: parsedFee }
    });

    const feeMsg = withFee && parsedFee > 0 ? ` + رسوم ${fmt(parsedFee)} ج.م` : '';
    addNotification({ type: 'success', title: '✅ تم تسجيل التحويل', message: `${fmt(parsedAmount)} ج.م إلى ${recipientName}${feeMsg}`, duration: 7000 });
    setTimeout(() => { setSubmitting(false); onClose(); }, 400);
  };

  return (
    <Modal isOpen={true} onClose={onClose} title="تحويل للغير" icon="📤" size="lg">
      <div className="space-y-4">
        <div className="p-4 rounded-xl text-center" style={{ background: 'linear-gradient(135deg, rgba(99,91,255,0.15), rgba(74,66,229,0.1))', border: '1px solid var(--accent-soft)' }}>
          <p className="text-[11px] font-bold mb-1" style={{ color: 'var(--accent)' }}>تحويل خارجي</p>
          <p className="text-xs font-semibold" style={{ color: 'var(--text-secondary)' }}>تحويل لأي شخص خارج حساباتك</p>
        </div>

        <div>
          <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>اسم المستلم *</label>
          <input type="text" autoFocus className="input-field text-base font-bold py-3" value={recipientName} onChange={e => setRecipientName(e.target.value)} placeholder="مثال: محمد أحمد" />
          <div className="flex gap-1.5 mt-2 flex-wrap">
            {quickRecipients.map(r => (<button key={r.val} type="button" onClick={() => setRecipientName(r.val)} className="quick-chip">{r.name}</button>))}
          </div>
        </div>

        <div>
          <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>رقم الحساب / المحفظة (اختياري)</label>
          <input type="text" inputMode="numeric" className="input-field text-sm mono py-3" value={recipientAccount} onChange={e => setRecipientAccount(e.target.value)} placeholder="0100..." />
        </div>

        <div>
          <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>المبلغ *</label>
          <input type="text" inputMode="decimal" className="input-field input-num text-3xl font-black text-center py-4" style={{ color: 'var(--accent)' }} value={amount} onChange={e => setAmount(e.target.value)} placeholder="0.00" />
        </div>

        <div>
          <label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>من حساب *</label>
          <div className="grid grid-cols-2 gap-2">
            {PAYMENT_METHODS.filter(m => m.group === 'account' && m.id !== HANY_TAB_METHOD).map(m => {
              const bal = safeNumber(liveBalances[m.id]);
              const isSel = fromMethod === m.id;
              const insufficient = parsedAmount > 0 && bal < totalDebit - 0.005;
              return (
                <button key={m.id} type="button" onClick={() => setFromMethod(m.id)} className={`payment-source-option ${isSel ? 'selected' : ''}`}>
                  <span style={{ fontSize: '18px' }}>{m.icon}</span>
                  <div className="flex-1 min-w-0 text-right">
                    <p className="font-black text-xs truncate">{m.label}</p>
                    <p className={`text-[10px] money tabular ${insufficient ? 'text-red-600' : ''}`} style={{ color: insufficient ? undefined : 'var(--text-muted)' }}>{fmtShort(bal)} ج.م</p>
                  </div>
                  {isSel && <CheckCircle2 size={14} className="text-emerald-500 flex-shrink-0" />}
                </button>
              );
            })}
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2">
          <div><label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>التاريخ *</label><SafeDateInput className="input-field text-xs font-bold py-3" value={date} onChange={setDate} /></div>
          <div><label className="text-[11px] font-black block mb-2" style={{ color: 'var(--text-muted)' }}>ملاحظة</label><input type="text" className="input-field text-xs py-3" value={note} onChange={e => setNote(e.target.value)} placeholder="اختياري" /></div>
        </div>

        <div>
          <div className={`fee-toggle-row ${withFee ? 'active' : ''}`} onClick={() => setWithFee(!withFee)}>
            <div className="flex items-center gap-2">
              <Receipt size={16} style={{ color: withFee ? 'var(--warning)' : 'var(--text-muted)' }} />
              <div>
                <p className="text-xs font-black">إضافة رسوم تحويل</p>
                <p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>بنك / محفظة</p>
              </div>
            </div>
            <div className={`w-10 h-6 rounded-full transition-all relative ${withFee ? 'bg-amber-500' : 'bg-slate-300 dark:bg-slate-600'}`}>
              <div className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all ${withFee ? 'right-0.5' : 'left-0.5'}`} />
            </div>
          </div>
          {withFee && (
            <div className="mt-2 animate-fadeIn">
              <input type="text" inputMode="decimal" className="input-field input-num text-sm text-center font-bold" style={{ color: 'var(--warning)' }} value={feeAmount} onChange={e => setFeeAmount(e.target.value)} placeholder="مبلغ الرسوم" />
              <div className="flex gap-1.5 mt-2">
                {[5, 10, 25, 50].map(v => (<button key={v} type="button" onClick={() => setFeeAmount(String(v))} className="quick-chip" style={{ flex: 1 }}>{v} ج.م</button>))}
              </div>
            </div>
          )}
        </div>

        {parsedAmount > 0 && recipientName.trim().length >= 2 && (
          <div className="p-3 rounded-xl" style={{ background: 'var(--bg-card-alt)', border: '1px solid var(--border-subtle)' }}>
            <div className="flex justify-between items-center mb-1.5 text-xs"><span style={{ color: 'var(--text-muted)' }}>التحويل</span><span className="font-black money tabular">{fmt(parsedAmount)}</span></div>
            {withFee && parsedFee > 0 && (<div className="flex justify-between items-center mb-1.5 text-xs"><span style={{ color: 'var(--text-muted)' }}>الرسوم</span><span className="font-black text-amber-600 money tabular">+{fmt(parsedFee)}</span></div>)}
            <div className="flex justify-between items-center pt-1.5 text-sm" style={{ borderTop: '1px dashed var(--border-default)' }}>
              <span className="font-black">إجمالي الخصم</span>
              <span className="font-black text-red-600 money tabular">{fmt(totalDebit)}</span>
            </div>
            <div className="flex justify-between items-center mt-1 text-[11px]">
              <span style={{ color: 'var(--text-muted)' }}>الرصيد الحالي</span>
              <span className={`font-bold money tabular ${sourceBalance >= totalDebit ? 'text-emerald-600' : 'text-red-600'}`}>{fmt(sourceBalance)}</span>
            </div>
          </div>
        )}

        <div className="flex gap-2 pt-1">
          <button type="button" onClick={onClose} className="btn btn-secondary flex-1 py-3 text-sm">إلغاء</button>
          <button type="button" onClick={handleSubmit} disabled={!canSubmit || submitting} className="btn flex-1 py-3 text-sm font-black"
            style={{ background: canSubmit ? 'linear-gradient(135deg, #635BFF 0%, #4A42E5 100%)' : 'var(--bg-muted)', color: canSubmit ? 'white' : 'var(--text-muted)', boxShadow: canSubmit ? '0 8px 20px -6px rgba(99,91,255,0.5)' : 'none' }}>
            {submitting ? 'جاري الحفظ...' : (<React.Fragment><Send size={16} /> تسجيل التحويل</React.Fragment>)}
          </button>
        </div>
        {!canSubmit && parsedAmount > 0 && (
          <p className="text-[10px] text-center font-bold text-red-500">
            {sourceBalance < totalDebit ? '⚠️ الرصيد غير كافٍ' : recipientName.trim().length < 2 ? '⚠️ أدخل اسم المستلم' : ''}
          </p>
        )}
      </div>
    </Modal>
  );
});

/* ═══════════════════════════════════════════════════════════════
   PART 6/6 — Duplicate + Archive + Health + CardPayment + Settings
   + Statement Engine + Installments + Predictions + App + Render

/* ═══════════════ DUPLICATE DETECTION ═══════════════ */
const DuplicateDetectionSystem = ({ transactions, data, dispatch, addNotification, saveHistory, onBulkDelete }) => {
  const [threshold, setThreshold] = useState(2);
  const [selectedMonth, setSelectedMonth] = useState('all');
  const [expandedGroups, setExpandedGroups] = useState({});

  const duplicates = useMemo(() => {
    const map = {};
    const filtered = selectedMonth === 'all' ? transactions : transactions.filter(t => {
      const parsed = parseMonthKey(selectedMonth);
      if (!parsed) return t.month === selectedMonth;
      return t.month === parsed.month && (t.year || 2026) === parsed.year;
    });
    filtered.forEach(t => {
      if (t.method === HANY_TAB_METHOD || isCarryoverMarker(t) || isHanySettleTx(t)) return;
      const key = `${safeNumber(t.amount)}_${t.method}_${t.category}_${(t.date || '').slice(0, 10)}`;
      if (!map[key]) map[key] = [];
      map[key].push(t);
    });
    return Object.entries(map)
      .filter(([_, items]) => items.length >= threshold)
      .map(([key, items]) => {
        const sortedItems = [...items].sort(compareTransactions);
        return {
          key, amount: items[0].amount, count: items.length, items: sortedItems,
          category: items[0].category,
          risk: items.length >= 5 ? 'high' : items.length >= 3 ? 'medium' : 'low'
        };
      });
  }, [transactions, threshold, selectedMonth]);

  const doDelete = (ids) => {
    if (!onBulkDelete) { addNotification({ type: 'error', title: 'خطأ: handler الحذف مفقود' }); return; }
    if (!Array.isArray(ids) || ids.length === 0) return;
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'تأكيد الحذف', message: `سيتم نقل ${ids.length} عملية للأرشيف.`,
      onConfirm: () => onBulkDelete(ids),
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const handleDeleteAll = () => {
    let idsToDelete = [];
    duplicates.forEach(d => {
      d.items.slice(1).forEach(item => {
        if (!isMonthClosed(data, item.year || 2026, item.month)) idsToDelete.push(item.id);
      });
    });
    if (idsToDelete.length === 0) { addNotification({ type: 'info', title: 'لا يوجد' }); return; }
    doDelete(idsToDelete);
  };

  const deleteSingle = (item) => {
    if (isMonthClosed(data, item.year || 2026, item.month)) { addNotification({ type: 'error', title: 'محظور', message: 'الشهر مغلق' }); return; }
    doDelete([item.id]);
  };

  return (
    <div className="space-y-4 animate-fadeIn pb-20">
      <div className="card">
        <div className="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <h2 className="text-lg font-black flex items-center gap-2"><Filter className="text-[color:var(--accent)]" size={18} /> كاشف التكرار</h2>
            <p className="text-[11px] mt-1" style={{ color: 'var(--text-muted)' }}>{threshold}+ تكرار بنفس المبلغ والطريقة والتاريخ</p>
          </div>
          <button onClick={handleDeleteAll} disabled={duplicates.length === 0} className={`btn ${duplicates.length === 0 ? 'btn-secondary' : 'btn-primary'} text-xs`}>
            <Trash2 size={14} /> تنظيف
          </button>
        </div>
      </div>

      <div className="card grid grid-cols-2 gap-4">
        <div>
          <label className="block text-[11px] font-bold mb-2" style={{ color: 'var(--text-muted)' }}>نطاق البحث</label>
          <select className="input-field text-sm" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}>
            <option value="all">جميع الشهور</option>
            {YEARS_LIST.flatMap(y => getMonthsForYear(y).map(m => (<option key={makeMonthKey(y, m)} value={makeMonthKey(y, m)}>{m} {y}</option>)))}
          </select>
        </div>
        <div>
          <label className="block text-[11px] font-bold mb-2" style={{ color: 'var(--text-muted)' }}>الحساسية ({threshold})</label>
          <input type="range" min="2" max="10" className="w-full mt-3 accent-[color:var(--accent)]" value={threshold} onChange={e => setThreshold(Number(e.target.value))} />
        </div>
      </div>

      {duplicates.length === 0 ? (
        <div className="card text-center p-12">
          <CheckCircle2 size={40} className="text-emerald-500 mx-auto mb-3" />
          <h3 className="text-base font-black">ممتاز! لا توجد تكرارات</h3>
        </div>
      ) : (
        duplicates.map(dup => (
          <div key={dup.key} className="card">
            <div className="flex justify-between items-center cursor-pointer -m-[18px] p-[18px]"
              onClick={() => setExpandedGroups(p => ({ ...p, [dup.key]: !p[dup.key] }))}>
              <div className="flex items-center gap-3">
                <div className={`p-2 rounded-lg ${dup.risk === 'high' ? 'bg-red-50 text-red-500 dark:bg-red-950/30' : 'bg-amber-50 text-amber-500 dark:bg-amber-950/30'}`}>
                  <Repeat size={16} />
                </div>
                <div>
                  <h4 className="font-black text-sm money tabular">{fmt(dup.amount)} ج.م</h4>
                  <span className="text-[10px] font-semibold" style={{ color: 'var(--text-muted)' }}>{dup.category} - {dup.count} مرات</span>
                </div>
              </div>
              <ChevronDown className={`transition-transform ${expandedGroups[dup.key] ? 'rotate-180' : ''}`} style={{ color: 'var(--text-muted)' }} size={16} />
            </div>
            {expandedGroups[dup.key] && (
              <div className="mt-3 pt-3 space-y-2" style={{ borderTop: '1px solid var(--border-subtle)' }}>
                {dup.items.map((item, idx) => (
                  <div key={item.id} className="flex justify-between items-center p-2.5 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                    <div className="text-xs font-medium flex items-center gap-2 flex-wrap">
                      {item.date}
                      {item.createdAt && <TxTimeChip createdAt={item.createdAt} />}
                      • {item.description || 'بدون وصف'}
                      {idx === 0 && <span className="badge badge-success text-[9px]">الأحدث — محفوظ</span>}
                    </div>
                    {idx !== 0 && (<button onClick={() => deleteSingle(item)} aria-label="حذف" className="text-red-500 p-1.5 rounded-lg"><Trash2 size={12} /></button>)}
                  </div>
                ))}
              </div>
            )}
          </div>
        ))
      )}
    </div>
  );
};

/* ═══════════════ DELETED ARCHIVE VIEW ═══════════════ */
const DeletedArchiveView = memo(({ data, dispatch, saveHistory, addNotification, transactions }) => {
  const archive = data?.deletedTxArchive || [];
  const pendingRequests = useMemo(() =>
    (data?.deleteRequests || []).filter(r => r && r.status === 'pending' && r.txSnapshot),
    [data?.deleteRequests]
  );
  const [tab, setTab] = useState('archive');
  const [searchTerm, setSearchTerm] = useState('');
  const [monthFilter, setMonthFilter] = useState('all');
  const [archiveSubTab, setArchiveSubTab] = useState('all');
  const [auditFilterAction, setAuditFilterAction] = useState('all');
  const [auditSearchTerm, setAuditSearchTerm] = useState('');

  const filtered = useMemo(() => {
    let arr = archive;
    if (archiveSubTab === 'mine') arr = arr.filter(t => !isFamilyTx(t) && t.deletedBy !== 'family');
    if (archiveSubTab === 'family') arr = arr.filter(t => isFamilyTx(t) || t.deletedBy === 'family');
    if (monthFilter !== 'all') {
      const parsed = parseMonthKey(monthFilter);
      if (parsed) arr = arr.filter(t => t.month === parsed.month && (t.year || 2026) === parsed.year);
    }
    if (searchTerm.trim()) {
      const term = normalizeText(searchTerm);
      arr = arr.filter(t => normalizeText(t.description).includes(term) || normalizeText(t.category).includes(term));
    }
    return arr.slice().sort((a, b) => {
      const da = parseISODate(a.deletedAt) || parseISODate(a.date) || new Date(0);
      const db = parseISODate(b.deletedAt) || parseISODate(b.date) || new Date(0);
      return db - da;
    });
  }, [archive, archiveSubTab, searchTerm, monthFilter]);

  const stats = useMemo(() => {
    const familyCount = archive.filter(t => isFamilyTx(t) || t.deletedBy === 'family').length;
    const mineCount = archive.length - familyCount;
    const total = archive.reduce((s, t) => s + safeNumber(t.amount), 0);
    const legacyCount = archive.filter(a => a._legacy).length;
    return { familyCount, mineCount, total, count: archive.length, legacyCount };
  }, [archive]);

  const auditLog = useMemo(() => data?.auditLog || [], [data?.auditLog]);
  const filteredAudit = useMemo(() => {
    let arr = auditLog;
    if (auditFilterAction !== 'all') arr = arr.filter(e => e.action === auditFilterAction);
    if (auditSearchTerm.trim()) {
      const term = normalizeText(auditSearchTerm);
      arr = arr.filter(e => normalizeText(e.entity).includes(term) || normalizeText(e.note).includes(term) || String(e.entityId).includes(auditSearchTerm));
    }
    return arr;
  }, [auditLog, auditFilterAction, auditSearchTerm]);

  const auditStats = useMemo(() => {
    const byAction = {};
    auditLog.forEach(e => { byAction[e.action] = (byAction[e.action] || 0) + 1; });
    return byAction;
  }, [auditLog]);

  const approveDeleteRequest = (req) => {
    const tx = req.txSnapshot;
    if (!tx) return;
    saveHistory();
    dispatch({ type: 'APPROVE_DELETE_REQUEST', payload: { requestId: req.id, txSnapshot: tx, requestedBy: req.requestedBy || req.requestedByName || 'family' } });
    addNotification({ type: 'success', title: 'تمت الموافقة والحذف' });
  };

  const rejectDeleteRequest = (req) => {
    dispatch({ type: 'REJECT_DELETE_REQUEST', payload: { requestId: req.id } });
    addNotification({ type: 'info', title: 'تم الرفض' });
  };

  const restoreOne = (tombstone) => {
    if (tombstone._legacy) { addNotification({ type: 'error', title: 'لا يمكن استرجاع هذه (بيانات ناقصة)' }); return; }
    const d = parseISODate(tombstone.date);
    const y = tombstone.year || (d ? d.getFullYear() : null);
    const m = tombstone.month || (d ? ALL_MONTHS[d.getMonth()] : null);
    if (!y || !m) { addNotification({ type: 'error', title: 'بيانات غير كاملة' }); return; }
    if (isMonthClosed(data, y, m)) { addNotification({ type: 'error', title: 'الشهر مغلق', duration: 6000 }); return; }
    dispatch({
      type: 'SHOW_CONFIRM', danger: false,
      title: 'استرجاع المعاملة',
      message: `استرجاع "${tombstone.description || tombstone.category}" بمبلغ ${fmt(tombstone.amount)}`,
      onConfirm: () => {
        saveHistory();
        const { deletedAt, deletedBy, originalStatus, reason, _legacy, ...original } = tombstone;
        const restoredTx = { ...original, status: originalStatus || 'pending' };
        const newTx = sortTransactions([...transactions, restoredTx]);
        const newArchive = (data.deletedTxArchive || []).filter(a => a.id !== tombstone.id);
        const newDeletedIds = (data.deletedTxIds || []).filter(id => id !== tombstone.id);
        const newMaterialized = { ...(data.materializedRecurring || {}) };
        if (restoredTx.sourceRecurringId && restoredTx.year && restoredTx.month) {
          delete newMaterialized[`${restoredTx.sourceRecurringId}_${makeMonthKey(restoredTx.year, restoredTx.month)}`];
        }
        dispatch({ type: 'SET_DATA', payload: { ...data, transactions: newTx, deletedTxArchive: newArchive, deletedTxIds: newDeletedIds, materializedRecurring: newMaterialized } });
        addNotification({ type: 'success', title: 'تم الاسترجاع بنجاح' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const permanentlyDelete = (id) => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'حذف نهائي', message: 'سيُحذف نهائياً ولن يمكن استرجاعه',
      onConfirm: () => {
        saveHistory();
        const newArchive = (data.deletedTxArchive || []).filter(a => a.id !== id);
        const newTx = (data.transactions || []).filter(t => t.id !== id);
        const newDeletedIds = Array.from(new Set([...(data.deletedTxIds || []), id])).slice(-500);
        dispatch({ type: 'SET_DATA', payload: { ...data, transactions: newTx, deletedTxArchive: newArchive, deletedTxIds: newDeletedIds } });
        addNotification({ type: 'success', title: 'تم الحذف نهائياً' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const clearArchive = () => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'تفريغ الأرشيف', message: `سيتم حذف ${archive.length} سجل نهائياً`,
      onConfirm: () => {
        saveHistory();
        dispatch({ type: 'SET_DATA', payload: { ...data, deletedTxArchive: [], deletedTxIds: [] } });
        addNotification({ type: 'success', title: 'تم التفريغ' });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const clearLegacyOnly = () => {
    const legacyCount = archive.filter(t => t._legacy).length;
    if (legacyCount === 0) { addNotification({ type: 'info', title: 'مفيش سجلات قديمة' }); return; }
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: `تنظيف ${legacyCount} سجل قديم`,
      message: '✅ السجلات الحقيقية هتفضل محفوظة.',
      onConfirm: () => {
        saveHistory();
        const cleaned = archive.filter(t => !t._legacy);
        dispatch({ type: 'SET_DATA', payload: { ...data, deletedTxArchive: cleaned } });
        addNotification({ type: 'success', title: `تم مسح ${legacyCount} سجل قديم` });
      },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  const clearAuditLog = () => {
    dispatch({
      type: 'SHOW_CONFIRM', danger: true,
      title: 'تفريغ سجل التدقيق',
      message: `سيتم مسح ${auditLog.length} سجل تدقيق`,
      onConfirm: () => { dispatch({ type: 'SET_DATA', payload: { ...data, auditLog: [] } }); },
      onCancel: () => dispatch({ type: 'HIDE_CONFIRM' })
    });
  };

  return (
    <React.Fragment>
      {pendingRequests.length > 0 && (
        <div className="card" style={{ borderColor: 'var(--warning)' }}>
          <div className="flex items-center gap-3 mb-3">
            <div className="p-2 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-amber-600 dark:text-amber-400"><Clock size={16} /></div>
            <div>
              <h3 className="font-black text-sm">📥 طلبات مسح من تطبيق العيلة</h3>
              <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>{pendingRequests.length} طلب بانتظار مراجعتك</p>
            </div>
          </div>
          <div className="space-y-2">
            {pendingRequests.map(req => {
              const tx = req.txSnapshot;
              return (
                <div key={req.id} className="p-3 rounded-lg" style={{ background: 'var(--bg-muted)' }}>
                  <div className="flex justify-between items-start gap-2 mb-2 flex-wrap">
                    <div className="min-w-0 flex-1">
                      <p className="font-bold text-xs truncate">💸 {tx.description || tx.category || 'بدون وصف'}</p>
                      <p className="text-[10px] mt-0.5" style={{ color: 'var(--text-muted)' }}><span className="money tabular">{tx.amount}</span> ج.م • {tx.date}</p>
                      <p className="text-[10px] mt-1 text-amber-700 dark:text-amber-400">👤 من: <strong>{req.requestedByName || 'فاميلي'}</strong>{req.reason && ` • 📝 ${req.reason}`}</p>
                    </div>
                    <span className="font-black text-sm text-red-600 flex-shrink-0 money tabular">{fmt(tx.amount)}</span>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => approveDeleteRequest(req)} className="btn btn-primary text-[11px] flex-1 py-1.5"><CheckCircle2 size={12} /> موافقة وحذف</button>
                    <button onClick={() => rejectDeleteRequest(req)} className="btn btn-secondary text-[11px] flex-1 py-1.5 text-red-600"><X size={12} /> رفض</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="space-y-4 animate-fadeIn pb-24">
        <div className="card">
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div className="flex items-center gap-3">
              <div className="p-2 rounded-lg bg-indigo-50 dark:bg-indigo-950/30 text-indigo-600 dark:text-indigo-400"><History size={16} /></div>
              <div>
                <h2 className="text-base font-black">السجل والتدقيق</h2>
                <p className="text-[11px] mt-0.5" style={{ color: 'var(--text-muted)' }}>أرشيف المحذوفات + سجل التعديلات الكامل</p>
              </div>
            </div>
          </div>
        </div>

        <div className="sub-tab-switcher">
          <button onClick={() => setTab('archive')} className={`sub-tab-btn ${tab === 'archive' ? 'active' : ''}`}>
            <Trash2 size={14} /> المحذوفات ({archive.length})
          </button>
          <button onClick={() => setTab('audit')} className={`sub-tab-btn ${tab === 'audit' ? 'active' : ''}`}>
            <History size={14} /> التدقيق ({auditLog.length})
          </button>
        </div>

        {tab === 'archive' && (
          <React.Fragment>
            {archive.length > 0 && (
              <div className="card flex justify-end gap-1.5 flex-wrap">
                {archive.some(t => t._legacy) && (
                  <button onClick={clearLegacyOnly} className="btn btn-secondary text-xs" style={{ color: 'var(--warning)' }}>
                    <RotateCcw size={12} /> نظّف القديمة ({archive.filter(t => t._legacy).length})
                  </button>
                )}
                <button onClick={clearArchive} className="btn btn-secondary text-xs text-red-600"><Trash2 size={12} /> تفريغ الكل</button>
              </div>
            )}

            <div className="grid grid-cols-4 gap-2">
              <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الإجمالي</p><p className="text-base font-black text-slate-600 dark:text-slate-300 money tabular">{stats.count}</p></div>
              <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>👤 محذوفاتي</p><p className="text-base font-black text-blue-600 money tabular">{stats.mineCount}</p></div>
              <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>🛒 Family</p><p className="text-base font-black text-purple-600 money tabular">{stats.familyCount}</p></div>
              <div className="stat-card"><p className="text-[10px] font-bold mb-1" style={{ color: 'var(--text-muted)' }}>الإجمالي (ج.م)</p><p className="text-base font-black text-red-600 money tabular">{formatAdaptive(stats.total)}</p></div>
            </div>

            {stats.legacyCount > 0 && (
              <div className="card p-3" style={{ background: 'var(--warning-soft)', borderColor: 'var(--warning)' }}>
                <p className="text-[11px] font-bold text-amber-700 dark:text-amber-400">⚠️ {stats.legacyCount} سجل قديم بدون بيانات كاملة — للعرض فقط</p>
              </div>
            )}

            <div className="sub-tab-switcher">
              <button onClick={() => setArchiveSubTab('all')} className={`sub-tab-btn ${archiveSubTab === 'all' ? 'active' : ''}`}>الكل ({archive.length})</button>
              <button onClick={() => setArchiveSubTab('mine')} className={`sub-tab-btn ${archiveSubTab === 'mine' ? 'active' : ''}`}>👤 محذوفاتي ({stats.mineCount})</button>
              <button onClick={() => setArchiveSubTab('family')} className={`sub-tab-btn ${archiveSubTab === 'family' ? 'active' : ''}`}>🛒 Family ({stats.familyCount})</button>
            </div>

            <div className="card py-3">
              <div className="flex gap-2 flex-wrap">
                <div className="relative flex-1 min-w-[140px]">
                  <Search className="absolute right-3 top-1/2 -translate-y-1/2" size={14} style={{ color: 'var(--text-muted)' }} />
                  <input type="text" placeholder="ابحث..." className="input-field pr-9 text-sm py-2.5" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                </div>
                <select className="input-field text-xs py-2.5 flex-1 min-w-[130px]" value={monthFilter} onChange={(e) => setMonthFilter(e.target.value)}>
                  <option value="all">جميع الشهور</option>
                  {YEARS_LIST.flatMap(y => getMonthsForYear(y).map(m => (<option key={makeMonthKey(y, m)} value={makeMonthKey(y, m)}>{m} {y}</option>)))}

              </div>
